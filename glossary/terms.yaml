# Arabic-English glossary: the single source for the glossary appendix and
# for the English text of the problems (text_en). One entry per term.
#   ar:  the Arabic term as the book writes it
#   en:  the English term used in Park, Blank & Tarquin and Sullivan
#   ch:  chapter of first use (1..11), or an appendix: acc, est, cb
#   def: one-line definition in Arabic
# tools/glossary.py builds appendices/glossary.qmd from this file.
terms:

# ---------------------------------------------------------------- chapter 1
- {ar: الاقتصاد الهندسي, en: engineering economy, ch: 1, def: تقييم البدائل الهندسية بالمال مع مراعاة قيمته الزمنية.}
- {ar: القيمة الزمنية للنقود, en: time value of money, ch: 1, def: الدينار اليوم أكثر قيمة من الدينار بعد سنة، لأنه يمكن استثماره.}
- {ar: الفائدة, en: interest, ch: 1, def: ثمن استخدام المال لفترة، يدفعه المقترض للمقرض.}
- {ar: نسبة الفائدة, en: interest rate, ch: 1, def: الفائدة في فترة واحدة مقسومة على المبلغ في بدايتها.}
- {ar: الفائدة البسيطة, en: simple interest, ch: 1, def: فائدة تحسب على المبلغ الأصلي فقط في كل سنة.}
- {ar: الفائدة المركبة, en: compound interest, ch: 1, def: فائدة تحسب على المبلغ الأصلي وعلى الفوائد المتراكمة.}
- {ar: المبلغ الأصلي, en: principal, ch: 1, def: المبلغ المقترض أو المستثمر في البداية، قبل أي فائدة.}
- {ar: القيمة الحالية, en: present worth (PW), ch: 1, def: قيمة مبلغ أو سلسلة تدفقات منقولة إلى السنة 0.}
- {ar: القيمة المستقبلية, en: future worth (FW), ch: 1, def: قيمة مبلغ أو سلسلة تدفقات منقولة إلى نهاية السنة n.}
- {ar: المعامل, en: interest factor, ch: 1, def: رقم يضرب في مبلغ لينقله عبر الزمن بنسبة فائدة معينة.}
- {ar: معامل القيمة المستقبلية لمبلغ واحد, en: single-payment compound-amount factor (F/P), ch: 1, def: ينقل مبلغا واحدا من السنة 0 إلى السنة n.}
- {ar: معامل القيمة الحالية لمبلغ واحد, en: single-payment present-worth factor (P/F), ch: 1, def: ينقل مبلغا واحدا من السنة n إلى السنة 0.}
- {ar: التدفق النقدي, en: cash flow, ch: 1, def: مال يدخل أو يخرج في نقطة زمنية محددة.}
- {ar: صافي التدفق النقدي, en: net cash flow, ch: 1, def: الداخل ناقص الخارج في نفس الفترة.}
- {ar: مخطط التدفق النقدي, en: cash flow diagram, ch: 1, def: خط زمني تظهر عليه التدفقات أسهما للأعلى للداخل وللأسفل للخارج.}
- {ar: التكافؤ, en: economic equivalence, ch: 1, def: تدفقان مختلفان في الشكل متساويان في القيمة عند نسبة فائدة معينة.}
- {ar: الخصم, en: discounting, ch: 1, def: نقل مبلغ مستقبلي إلى قيمته الحالية بنسبة الفائدة.}
- {ar: فترة الفائدة, en: interest period, ch: 1, def: الفترة التي تحسب في نهايتها الفائدة، مثل سنة أو شهر.}
- {ar: قاعدة 72, en: rule of 72, ch: 1, def: عدد السنوات اللازم لمضاعفة المال يساوي تقريبا 72 مقسومة على النسبة المئوية.}

# ---------------------------------------------------------------- chapter 2
- {ar: السلسلة المتساوية, en: uniform series (equal-payment series), ch: 2, def: دفعات متساوية في نهاية كل سنة من السنة 1 إلى السنة n.}
- {ar: معامل استرداد رأس المال, en: capital-recovery factor (A/P), ch: 2, def: يحول مبلغا حاليا إلى دفعات سنوية متساوية.}
- {ar: معامل القيمة الحالية لدفعات متساوية, en: uniform-series present-worth factor (P/A), ch: 2, def: يحول دفعات سنوية متساوية إلى قيمة حالية.}
- {ar: معامل القيمة المستقبلية لدفعات متساوية, en: uniform-series compound-amount factor (F/A), ch: 2, def: يحول دفعات سنوية متساوية إلى قيمة مستقبلية.}
- {ar: معامل صندوق الادخار, en: sinking-fund factor (A/F), ch: 2, def: يعطي الإيداع السنوي اللازم للوصول إلى مبلغ مستقبلي.}
- {ar: القسط, en: installment (loan payment), ch: 2, def: الدفعة الدورية التي تسدد القرض مع فائدته.}
- {ar: جدول إطفاء القرض, en: loan amortization schedule, ch: 2, def: جدول يقسم كل قسط إلى فائدة وأصل، ويعطي الرصيد بعده.}
- {ar: الرصيد المتبقي, en: remaining balance, ch: 2, def: ما بقي من أصل القرض بعد دفعة معينة.}
- {ar: السلسلة المؤجلة, en: deferred annuity, ch: 2, def: سلسلة متساوية تبدأ بعد السنة 1.}
- {ar: الدفعات المتدرجة خطيا, en: arithmetic gradient, ch: 2, def: دفعات تزيد أو تنقص بمقدار ثابت G كل سنة.}
- {ar: معامل القيمة الحالية للدفعات المتدرجة خطيا, en: gradient present-worth factor (P/G), ch: 2, def: يعطي القيمة الحالية لجزء التدرج في سلسلة متدرجة خطيا.}
- {ar: معامل السلسلة المتساوية للدفعات المتدرجة خطيا, en: gradient uniform-series factor (A/G), ch: 2, def: يحول جزء التدرج إلى دفعات سنوية متساوية.}
- {ar: الدفعات المتدرجة نسبيا, en: geometric gradient, ch: 2, def: دفعات تزيد أو تنقص بنسبة ثابتة g كل سنة.}
- {ar: تدفقات غير منتظمة, en: irregular (uneven) cash flows, ch: 2, def: تدفقات لا يجمعها نمط واحد، فتنقل كل دفعة وحدها.}

# ---------------------------------------------------------------- chapter 3
- {ar: الفائدة الاسمية, en: nominal interest rate, ch: 3, def: نسبة الفترة مضروبة في عدد الفترات في السنة، بدون تركيب.}
- {ar: الفائدة الفعلية, en: effective interest rate, ch: 3, def: النسبة السنوية بعد احتساب التركيب خلال السنة.}
- {ar: فترة التركيب, en: compounding period, ch: 3, def: الفترة التي تضاف في نهايتها الفائدة إلى الرصيد.}
- {ar: الفائدة المستمرة, en: continuous compounding, ch: 3, def: تركيب في فترات قصيرة جدا تقترب من الصفر.}
- {ar: الحد الأدنى للعائد, en: minimum attractive rate of return (MARR), ch: 3, def: أقل نسبة عائد تقبلها الشركة لمشروع جديد.}
- {ar: القيمة السنوية, en: annual worth (AW), ch: 3, def: القيمة الحالية لمشروع موزعة على دفعات سنوية متساوية.}
- {ar: البدائل المتنافية, en: mutually exclusive alternatives, ch: 3, def: بدائل لا يمكن اختيار أكثر من واحد منها.}
- {ar: المشاريع المستقلة, en: independent projects, ch: 3, def: مشاريع يمكن قبول أي عدد منها، وقبول أحدها لا يمنع غيره.}
- {ar: بديل عدم الاستثمار, en: do-nothing alternative, ch: 3, def: إبقاء الوضع كما هو، وقيمته الحالية صفر.}
- {ar: فترة الدراسة, en: study period (planning horizon), ch: 3, def: المدة التي تقارن عليها البدائل.}
- {ar: المضاعف المشترك, en: least common multiple of lives, ch: 3, def: تكرار كل بديل حتى تتساوى أعمار البدائل.}
- {ar: التكلفة المرسملة, en: capitalized cost, ch: 3, def: القيمة الحالية لتدفقات تستمر بلا نهاية.}
- {ar: تكلفة استرداد رأس المال, en: capital recovery cost (CR), ch: 3, def: التكلفة السنوية المكافئة للاستثمار ناقص قيمة البيع في النهاية.}
- {ar: قيمة البيع, en: salvage value (market value at end of life), ch: 3, def: المبلغ الذي يباع به الأصل في نهاية عمره.}
- {ar: فترة الاسترداد, en: payback period, ch: 3, def: عدد السنوات حتى يسترد المشروع استثماره بدون خصم.}
- {ar: فترة الاسترداد المخصومة, en: discounted payback period, ch: 3, def: عدد السنوات حتى يسترد المشروع استثماره مع خصم التدفقات.}
- {ar: الإيراد, en: revenue, ch: 3, def: المال الداخل من بيع المنتجات أو الخدمات.}

# ---------------------------------------------------------------- chapter 4
- {ar: معدل العائد الداخلي, en: internal rate of return (IRR), ch: 4, def: نسبة الخصم التي تجعل القيمة الحالية للمشروع صفرا.}
- {ar: معدل العائد, en: rate of return (ROR), ch: 4, def: العائد على الرصيد غير المسترد من الاستثمار في كل سنة.}
- {ar: التحليل التزايدي, en: incremental analysis, ch: 4, def: تقييم الفرق في التدفقات بين بديلين، بدل كل بديل وحده.}
- {ar: الاستثمار الإضافي, en: incremental investment, ch: 4, def: الفرق في الاستثمار بين البديل الأغلى والأرخص.}
- {ar: تعدد المعدلات, en: multiple rates of return, ch: 4, def: أكثر من معدل يجعل القيمة الحالية صفرا، عندما تتغير إشارة التدفقات أكثر من مرة.}
- {ar: قاعدة الإشارات, en: Descartes' rule of signs, ch: 4, def: عدد المعدلات الموجبة لا يزيد على عدد مرات تغير إشارة التدفقات.}
- {ar: المعدل المعدل, en: modified internal rate of return (MIRR), ch: 4, def: معدل واحد يفترض نسبة محددة لإعادة استثمار الداخل ولتمويل الخارج.}
- {ar: نسبة إعادة الاستثمار, en: reinvestment rate, ch: 4, def: النسبة التي يفترض أن يستثمر بها المال الداخل من المشروع.}
- {ar: نسبة التمويل, en: finance rate, ch: 4, def: النسبة التي يفترض أن يقترض بها المال الخارج على المشروع.}
- {ar: نسبة المنفعة إلى التكلفة, en: benefit-cost ratio (B/C), ch: 4, def: القيمة الحالية للمنافع مقسومة على القيمة الحالية للتكاليف.}
- {ar: التنصيف, en: bisection method, ch: 4, def: طريقة لإيجاد الجذر بتنصيف المجال الذي تتغير فيه الإشارة مرة بعد مرة.}

# ---------------------------------------------------------------- chapter 5
- {ar: الاستهلاك, en: depreciation, ch: 5, def: توزيع تكلفة الأصل على سنوات عمره كمصروف محاسبي.}
- {ar: القيمة الدفترية, en: book value, ch: 5, def: أساس الاستهلاك ناقص الاستهلاك المتراكم حتى تاريخه.}
- {ar: أساس الاستهلاك, en: cost basis, ch: 5, def: ثمن الأصل مع تكاليف تجهيزه للعمل، وهو ما يستهلك.}
- {ar: الاستهلاك المتراكم, en: accumulated depreciation, ch: 5, def: مجموع الاستهلاك من بداية عمر الأصل حتى تاريخه.}
- {ar: القسط الثابت, en: straight-line depreciation (SL), ch: 5, def: استهلاك متساو في كل سنة.}
- {ar: القسط المتناقص, en: declining-balance depreciation (DB), ch: 5, def: نسبة ثابتة من القيمة الدفترية في بداية كل سنة.}
- {ar: القسط المتناقص المضاعف, en: double-declining-balance depreciation (DDB), ch: 5, def: قسط متناقص نسبته ضعف نسبة القسط الثابت.}
- {ar: مجموع أرقام السنوات, en: sum-of-years'-digits depreciation (SOYD), ch: 5, def: استهلاك يتناقص بنسبة رقم السنة المتبقية إلى مجموع أرقام السنوات.}
- {ar: وحدات الإنتاج, en: units-of-production depreciation, ch: 5, def: استهلاك يتناسب مع ما ينتجه الأصل في السنة.}
- {ar: ضريبة الدخل, en: income tax, ch: 5, def: ضريبة على الربح السنوي للشركة.}
- {ar: الدخل الخاضع للضريبة, en: taxable income, ch: 5, def: الإيراد ناقص المصاريف المقبولة، ومنها الاستهلاك والفائدة.}
- {ar: نسبة الضريبة, en: tax rate, ch: 5, def: الضريبة مقسومة على الدخل الخاضع للضريبة.}
- {ar: الوفر الضريبي, en: tax savings (tax shield), ch: 5, def: الضريبة التي لا تدفع بسبب مصروف مقبول، مثل الاستهلاك.}
- {ar: ترحيل الخسائر, en: loss carryforward, ch: 5, def: خصم خسارة سنة من أرباح السنوات التالية.}
- {ar: الأصل, en: asset, ch: 5, def: شيء تملكه الشركة وله قيمة، مثل آلة أو مبنى.}

# ---------------------------------------------------------------- chapter 6
- {ar: التكلفة الثابتة, en: fixed cost, ch: 6, def: تكلفة لا تتغير مع حجم الإنتاج خلال مجال معين.}
- {ar: التكلفة المتغيرة, en: variable cost, ch: 6, def: تكلفة تتناسب مع حجم الإنتاج.}
- {ar: التكلفة الكلية, en: total cost, ch: 6, def: التكلفة الثابتة زائد التكلفة المتغيرة.}
- {ar: متوسط التكلفة, en: average unit cost, ch: 6, def: التكلفة الكلية مقسومة على عدد الوحدات.}
- {ar: التكاليف شبه المتغيرة, en: mixed (semivariable) costs, ch: 6, def: تكاليف فيها جزء ثابت وجزء يتغير مع الإنتاج.}
- {ar: التكلفة الحدية, en: marginal cost, ch: 6, def: الزيادة في التكلفة الكلية عند إنتاج وحدة إضافية.}
- {ar: هامش المساهمة, en: contribution margin, ch: 6, def: سعر الوحدة ناقص تكلفتها المتغيرة.}
- {ar: نقطة التعادل, en: breakeven point, ch: 6, def: الكمية أو القيمة التي يتساوى عندها البديلان أو الإيراد والتكلفة.}
- {ar: التكلفة الغارقة, en: sunk cost, ch: 6, def: تكلفة دفعت في الماضي ولا يغيرها أي قرار اليوم.}
- {ar: تكلفة الفرصة البديلة, en: opportunity cost, ch: 6, def: قيمة أفضل بديل نتركه عندما نختار بديلا آخر.}
- {ar: التكاليف التفاضلية, en: differential (incremental) costs, ch: 6, def: التكاليف التي تختلف بين بديلين، وهي وحدها التي تهم القرار.}
- {ar: تكلفة دورة الحياة, en: life-cycle cost, ch: 6, def: كل تكاليف الأصل من التصميم والشراء إلى التشغيل والتخلص منه.}
- {ar: تكلفة التشغيل والصيانة, en: operating and maintenance cost (O&M), ch: 6, def: التكلفة السنوية لتشغيل الأصل وصيانته.}
- {ar: الطاقة الإنتاجية, en: capacity, ch: 6, def: أكبر كمية يستطيع النظام إنتاجها في الفترة.}

# ---------------------------------------------------------------- chapter 7
- {ar: التدفق النقدي التشغيلي, en: operating cash flow, ch: 7, def: صافي الربح زائد الاستهلاك، أو الإيراد ناقص التكاليف والضريبة.}
- {ar: رأس المال العامل, en: working capital, ch: 7, def: المخزون والذمم والنقد اللازم للتشغيل، يخرج في البداية ويعود في النهاية.}
- {ar: صافي البيع, en: net (after-tax) salvage value, ch: 7, def: ثمن بيع الأصل ناقص الضريبة على الفرق بينه وبين القيمة الدفترية.}
- {ar: التدفق النقدي بعد الضريبة, en: after-tax cash flow (ATCF), ch: 7, def: التدفق النقدي بعد طرح ضريبة الدخل.}
- {ar: التدفق النقدي قبل الضريبة, en: before-tax cash flow (BTCF), ch: 7, def: التدفق النقدي قبل طرح ضريبة الدخل.}
- {ar: التمويل بقرض, en: debt financing, ch: 7, def: تمويل جزء من الاستثمار بمال مقترض تدفع عليه فائدة.}
- {ar: قائمة الدخل, en: income statement, ch: 7, def: الإيرادات والمصاريف والضريبة وصافي الربح لفترة.}
- {ar: صافي الربح, en: net income, ch: 7, def: الربح بعد كل المصاريف والضريبة.}
- {ar: تحليل الحساسية, en: sensitivity analysis, ch: 7, def: تغيير متغير واحد ورؤية أثره على القيمة الحالية.}
- {ar: مخطط العنكبوت, en: spider plot, ch: 7, def: رسم لأثر تغير كل متغير بنسبة مئوية على القيمة الحالية.}
- {ar: السيناريوهات, en: scenario analysis, ch: 7, def: تقييم المشروع بمجموعات متسقة من التقديرات، مثل متشائمة ومتوقعة ومتفائلة.}
- {ar: الحالة الأساسية, en: base case, ch: 7, def: القيمة الحالية محسوبة بأفضل التقديرات لكل المتغيرات.}

- {ar: الاستئجار, en: leasing, ch: 7, def: استخدام أصل يملكه غيرك مقابل أجرة دورية، بدل شرائه.}
- {ar: الأجرة, en: lease payment, ch: 7, def: الدفعة الدورية للمؤجر، وتطرح من الدخل الخاضع للضريبة.}
- {ar: المؤجر, en: lessor, ch: 7, def: مالك الأصل الذي يؤجره، ويأخذ الاستهلاك وقيمة البيع.}

# ---------------------------------------------------------------- chapter 8
- {ar: التضخم, en: inflation, ch: 8, def: ارتفاع عام في الأسعار يخفض القوة الشرائية للنقود.}
- {ar: نسبة التضخم, en: inflation rate, ch: 8, def: نسبة ارتفاع الأسعار في سنة.}
- {ar: التضخم العام, en: general inflation, ch: 8, def: متوسط ارتفاع الأسعار في الاقتصاد كله.}
- {ar: الرقم القياسي لأسعار المستهلك, en: consumer price index (CPI), ch: 8, def: مؤشر لثمن سلة ثابتة من السلع مقارنة بسنة الأساس.}
- {ar: سنة الأساس, en: base year, ch: 8, def: السنة التي تقاس بأسعارها الأرقام الثابتة.}
- {ar: الدينار الفعلي, en: actual dollars (then-current), ch: 8, def: المبلغ كما يدفع فعلا في سنته، بأسعار تلك السنة.}
- {ar: الدينار الثابت, en: constant (real) dollars, ch: 8, def: المبلغ بقوة شرائية سنة الأساس، بعد إزالة أثر التضخم.}
- {ar: النسبة الحقيقية, en: real (inflation-free) interest rate, ch: 8, def: نسبة العائد بعد إزالة أثر التضخم.}
- {ar: النسبة السوقية, en: market (inflation-adjusted) interest rate, ch: 8, def: النسبة المعلنة التي تشمل التضخم والعائد الحقيقي.}
- {ar: القوة الشرائية, en: purchasing power, ch: 8, def: ما يشتريه المبلغ من سلع وخدمات.}
- {ar: سعر الصرف, en: exchange rate, ch: 8, def: عدد وحدات عملة محلية مقابل وحدة واحدة من عملة أجنبية.}

# ---------------------------------------------------------------- chapter 9
- {ar: الاستبدال, en: replacement, ch: 9, def: قرار إبقاء أصل قديم أو بيعه وشراء أصل جديد مكانه.}
- {ar: المدافع, en: defender, ch: 9, def: الأصل الموجود حاليا.}
- {ar: المتحدي, en: challenger, ch: 9, def: الأصل الجديد المقترح ليحل محل المدافع.}
- {ar: وجهة نظر شخص من الخارج, en: outsider viewpoint, ch: 9, def: معاملة المدافع كأننا نشتريه اليوم بقيمته السوقية.}
- {ar: القيمة السوقية, en: market value, ch: 9, def: الثمن الذي يباع به الأصل اليوم.}
- {ar: العمر الاقتصادي, en: economic service life (ESL), ch: 9, def: عدد السنوات الذي يعطي أقل تكلفة سنوية مكافئة.}
- {ar: التقادم, en: obsolescence, ch: 9, def: فقدان الأصل قيمته لظهور تقنية أفضل، حتى لو بقي يعمل.}
- {ar: الإصلاح الشامل, en: overhaul, ch: 9, def: إصلاح كبير يمد عمر الأصل أو يخفض تكلفة تشغيله.}
- {ar: الإيقاف, en: retirement (abandonment), ch: 9, def: التوقف عن استخدام الأصل وبيعه بدون شراء بديل.}

# ---------------------------------------------------------------- chapter 10
- {ar: المخاطرة, en: risk, ch: 10, def: عدة نتائج ممكنة نعرف أو نقدر احتمال كل منها.}
- {ar: عدم التأكد, en: uncertainty, ch: 10, def: نتائج ممكنة لا نعرف احتمالاتها.}
- {ar: الاحتمال, en: probability, ch: 10, def: رقم بين 0 و1 يقيس إمكانية حدوث نتيجة.}
- {ar: القيمة المتوقعة, en: expected value, ch: 10, def: متوسط النتائج، كل نتيجة بوزن احتمالها.}
- {ar: التباين, en: variance, ch: 10, def: متوسط مربع البعد عن القيمة المتوقعة.}
- {ar: الانحراف المعياري, en: standard deviation, ch: 10, def: الجذر التربيعي للتباين، مقياس للتشتت بنفس وحدة المتغير.}
- {ar: معامل الاختلاف, en: coefficient of variation, ch: 10, def: الانحراف المعياري مقسوما على القيمة المتوقعة.}
- {ar: احتمال الخسارة, en: probability of loss, ch: 10, def: احتمال أن تكون القيمة الحالية أقل من صفر.}
- {ar: شجرة القرار, en: decision tree, ch: 10, def: رسم لقرار على مراحل، بعقد قرار وعقد احتمال.}
- {ar: عقدة قرار, en: decision node, ch: 10, def: نقطة في الشجرة يختار فيها صاحب القرار الفرع، وترسم مربعا.}
- {ar: عقدة احتمال, en: chance node, ch: 10, def: نقطة في الشجرة تحدد الظروف فيها الفرع، وترسم دائرة.}
- {ar: قيمة المعلومات الكاملة, en: expected value of perfect information (EVPI), ch: 10, def: أعلى مبلغ يستحق دفعه لمعرفة النتيجة قبل القرار.}
- {ar: قيمة المعلومات, en: value of information, ch: 10, def: الزيادة في القيمة المتوقعة بسبب معلومات تعرف قبل القرار.}
- {ar: نظرية بايز, en: Bayes' theorem, ch: 10, def: تحديث الاحتمالات بعد نتيجة دراسة أو فحص.}
- {ar: التوزيع الطبيعي, en: normal distribution, ch: 10, def: توزيع متماثل على شكل جرس، يحدده المتوسط والانحراف المعياري.}
- {ar: التوزيع المثلثي, en: triangular distribution, ch: 10, def: توزيع تحدده أقل قيمة والقيمة الأرجح وأعلى قيمة.}
- {ar: التوزيع المنتظم, en: uniform distribution, ch: 10, def: كل القيم بين حدين لها نفس الاحتمال.}
- {ar: محاكاة مونت كارلو, en: Monte Carlo simulation, ch: 10, def: تكرار الحساب آلاف المرات بقيم عشوائية مسحوبة من توزيعاتها.}
- {ar: الرقم المئوي, en: percentile, ch: 10, def: القيمة التي تقع تحتها نسبة معينة من النتائج.}

- {ar: الخيار الحقيقي, en: real option, ch: 10, def: حق، لا التزام، في تغيير قرار المشروع بعد أن تتضح المعلومات.}
- {ar: خيار التأجيل, en: option to defer, ch: 10, def: الانتظار حتى تتضح الظروف، ثم الاستثمار فقط إذا كانت جيدة.}
- {ar: خيار التوسعة, en: option to expand, ch: 10, def: البدء بمشروع صغير، وتوسيعه إذا نجح.}
- {ar: خيار الإيقاف, en: option to abandon, ch: 10, def: إيقاف المشروع وبيع أصوله إذا فشل، بدل الاستمرار في الخسارة.}

# ---------------------------------------------------------------- chapter 11
- {ar: تكلفة رأس المال, en: cost of capital, ch: 11, def: العائد الذي يطلبه مقدمو المال للشركة، من مقرضين ومساهمين.}
- {ar: المتوسط المرجح لتكلفة رأس المال, en: weighted average cost of capital (WACC), ch: 11, def: متوسط تكلفة الدين وتكلفة حقوق الملكية، كل منهما بوزن حصته في التمويل.}
- {ar: تكلفة الدين, en: cost of debt, ch: 11, def: نسبة الفائدة الفعلية على القروض والسندات، وتحسب عادة بعد الضريبة.}
- {ar: تكلفة حقوق الملكية, en: cost of equity, ch: 11, def: العائد الذي يطلبه المساهمون على أموالهم في الشركة.}
- {ar: حقوق الملكية, en: equity, ch: 11, def: أموال المالكين في الشركة، من أسهم وأرباح محتجزة.}
- {ar: الأسهم العادية, en: common stock, ch: 11, def: حصص ملكية لها حق في الأرباح بعد الدائنين وأصحاب الأسهم الممتازة.}
- {ar: الأسهم الممتازة, en: preferred stock, ch: 11, def: أسهم لها توزيع ثابت يدفع قبل أصحاب الأسهم العادية.}
- {ar: الأرباح المحتجزة, en: retained earnings, ch: 11, def: أرباح لم توزع على المساهمين وبقيت في الشركة للاستثمار.}
- {ar: التوزيعات, en: dividends, ch: 11, def: الجزء من الربح الذي يدفع للمساهمين.}
- {ar: السند, en: bond, ch: 11, def: قرض تقسمه الشركة على مستثمرين، بفائدة دورية ورد القيمة الاسمية في النهاية.}
- {ar: القيمة الاسمية للسند, en: face (par) value, ch: 11, def: المبلغ الذي يرد لحامل السند في تاريخ الاستحقاق.}
- {ar: نسبة الكوبون, en: coupon rate, ch: 11, def: الفائدة السنوية على السند مقسومة على قيمته الاسمية.}
- {ar: العائد حتى الاستحقاق, en: yield to maturity (YTM), ch: 11, def: النسبة التي تجعل القيمة الحالية لتدفقات السند تساوي سعره.}
- {ar: تكاليف الإصدار, en: flotation costs, ch: 11, def: تكاليف بيع الأسهم أو السندات الجديدة، مثل العمولات والرسوم.}
- {ar: نموذج نمو التوزيعات, en: dividend growth model (Gordon model), ch: 11, def: تكلفة حقوق الملكية تساوي التوزيع القادم على السعر زائد نسبة النمو.}
- {ar: نموذج تسعير الأصول الرأسمالية, en: capital asset pricing model (CAPM), ch: 11, def: تكلفة حقوق الملكية تساوي النسبة الخالية من المخاطرة زائد بيتا ضرب علاوة مخاطرة السوق.}
- {ar: معامل بيتا, en: beta, ch: 11, def: مقياس لحركة سهم الشركة مقارنة بحركة السوق كله.}
- {ar: النسبة الخالية من المخاطرة, en: risk-free rate, ch: 11, def: العائد على استثمار شبه مضمون، مثل سندات الحكومة القصيرة.}
- {ar: علاوة مخاطرة السوق, en: market risk premium, ch: 11, def: عائد السوق المتوقع ناقص النسبة الخالية من المخاطرة.}
- {ar: علاوة المخاطرة, en: risk premium, ch: 11, def: نسبة تضاف إلى تكلفة رأس المال لمشروع أخطر من المعتاد.}
- {ar: هيكل رأس المال, en: capital structure, ch: 11, def: نسب الدين وحقوق الملكية في تمويل الشركة.}
- {ar: نسبة الدين, en: debt ratio, ch: 11, def: الدين مقسوما على مجموع التمويل.}
- {ar: الرافعة المالية, en: financial leverage, ch: 11, def: استخدام الدين لرفع العائد على حقوق الملكية، مع رفع مخاطرتها.}

# ---------------------------------------------------------------- chapter 12
- {ar: المشروع العام, en: public project, ch: 12, def: مشروع تموله الحكومة لخدمة الناس، مثل طريق أو مدرسة أو شبكة مياه.}
- {ar: المنافع, en: benefits, ch: 12, def: ما يكسبه الناس من المشروع العام، مثل توفير الوقت وقلة الحوادث.}
- {ar: الأضرار, en: disbenefits, ch: 12, def: ما يخسره الناس بسبب المشروع العام، مثل الضجيج أو أرض زراعية تضيع.}
- {ar: المنفعة الصافية, en: net benefit, ch: 12, def: المنافع ناقص الأضرار ناقص التكاليف، بالقيمة الحالية أو السنوية.}
- {ar: نسبة الخصم الاجتماعية, en: social discount rate, ch: 12, def: نسبة الخصم التي تستخدمها الحكومة لتقييم المشاريع العامة.}
- {ar: النسبة التقليدية, en: conventional B/C ratio, ch: 12, def: المنافع ناقص الأضرار مقسومة على الاستثمار والتشغيل ناقص قيمة البيع.}
- {ar: النسبة المعدلة, en: modified B/C ratio, ch: 12, def: المنافع ناقص الأضرار والتشغيل مقسومة على الاستثمار ناقص قيمة البيع.}
- {ar: النسبة التزايدية, en: incremental B/C ratio, ch: 12, def: الفرق في المنافع الصافية بين بديلين مقسوما على الفرق في تكاليفهما.}
- {ar: الفعالية مقابل التكلفة, en: cost-effectiveness analysis, ch: 12, def: مقارنة البدائل بتكلفة كل وحدة منفعة مقيسة بوحدتها، بدون تحويلها إلى دنانير.}

# ---------------------------------------------------------------- chapter 13
- {ar: مصفوفة القرار, en: decision matrix, ch: 13, def: جدول صفوفه البدائل وأعمدته المعايير، وفيه أداء كل بديل في كل معيار.}
- {ar: المعيار, en: attribute (criterion), ch: 13, def: خاصية تقارن بها البدائل، مثل التكلفة أو الجودة أو السلامة.}
- {ar: البديل المسيطر عليه, en: dominated alternative, ch: 13, def: بديل لا يزيد على بديل آخر في أي معيار، ويقل عنه في واحد على الأقل.}
- {ar: الطرق غير التعويضية, en: noncompensatory models, ch: 13, def: طرق لا يعوض فيها التفوق في معيار الضعف في معيار آخر.}
- {ar: الطرق التعويضية, en: compensatory models, ch: 13, def: طرق يعوض فيها التفوق في معيار الضعف في معيار آخر.}
- {ar: الحد الأدنى لكل معيار, en: conjunctive (satisficing) method, ch: 13, def: حذف كل بديل لا يحقق الحد المقبول في أي معيار.}
- {ar: التميز في معيار واحد, en: disjunctive method, ch: 13, def: قبول البديل إذا تفوق في معيار واحد على الأقل.}
- {ar: الترتيب المعجمي, en: lexicography, ch: 13, def: اختيار الأفضل في المعيار الأهم، ثم فصل التعادل بالمعيار التالي.}
- {ar: توحيد المقاييس, en: nondimensional scaling, ch: 13, def: تحويل كل معيار إلى درجة بين 0 للأسوأ و1 للأفضل.}
- {ar: المجموع المرجح, en: additive weighting, ch: 13, def: مجموع الدرجات الموحدة لكل بديل مضروبة في أوزان المعايير.}
- {ar: أوزان الترتيب, en: rank-order weights, ch: 13, def: أوزان من ترتيب المعايير فقط، الأول يأخذ n نقاط والأخير نقطة.}
- {ar: المقارنة الزوجية, en: pairwise comparison (AHP), ch: 13, def: تحديد الأوزان بالحكم على أهمية كل معيارين معا.}

# ---------------------------------------------------------------- accounting appendix
- {ar: قائمة المركز المالي, en: balance sheet, ch: acc, def: الأصول والخصوم وحقوق الملكية في تاريخ معين.}
- {ar: قائمة التدفقات النقدية, en: cash flow statement, ch: acc, def: النقد الداخل والخارج في فترة من التشغيل والاستثمار والتمويل.}
- {ar: الأصول المتداولة, en: current assets, ch: acc, def: أصول تتحول إلى نقد خلال سنة، مثل المخزون والذمم المدينة.}
- {ar: الخصوم, en: liabilities, ch: acc, def: ما على الشركة من التزامات للغير.}
- {ar: الخصوم المتداولة, en: current liabilities, ch: acc, def: التزامات تستحق خلال سنة.}
- {ar: الذمم المدينة, en: accounts receivable, ch: acc, def: مبالغ للشركة عند الزبائن لم تحصل بعد.}
- {ar: الذمم الدائنة, en: accounts payable, ch: acc, def: مبالغ على الشركة للموردين لم تدفع بعد.}
- {ar: المخزون, en: inventory, ch: acc, def: مواد ومنتجات تحت التصنيع وجاهزة عند الشركة.}
- {ar: تكلفة البضاعة المباعة, en: cost of goods sold (COGS), ch: acc, def: التكلفة المباشرة للمنتجات التي بيعت في الفترة.}
- {ar: إجمالي الربح, en: gross margin (gross profit), ch: acc, def: الإيراد ناقص تكلفة البضاعة المباعة.}
- {ar: الربح التشغيلي, en: operating income, ch: acc, def: إجمالي الربح ناقص مصاريف التشغيل، قبل الفائدة والضريبة.}
- {ar: نسبة التداول, en: current ratio, ch: acc, def: الأصول المتداولة على الخصوم المتداولة.}
- {ar: النسبة السريعة, en: quick (acid-test) ratio, ch: acc, def: الأصول المتداولة بدون المخزون على الخصوم المتداولة.}
- {ar: دوران المخزون, en: inventory turnover, ch: acc, def: تكلفة البضاعة المباعة على متوسط المخزون.}
- {ar: العائد على حقوق الملكية, en: return on equity (ROE), ch: acc, def: صافي الربح على حقوق الملكية.}
- {ar: العائد على الأصول, en: return on assets (ROA), ch: acc, def: صافي الربح على مجموع الأصول.}

# ---------------------------------------------------------------- chapter 6: cost estimation
- {ar: تقدير التكاليف, en: cost estimation, ch: 6, def: توقع تكلفة مشروع أو منتج قبل تنفيذه.}
- {ar: الرقم القياسي, en: cost index, ch: 6, def: نسبة تكلفة شيء في سنة إلى تكلفته في سنة الأساس.}
- {ar: طريقة الوحدة, en: unit technique, ch: 6, def: التكلفة تساوي تكلفة الوحدة ضرب عدد الوحدات.}
- {ar: طريقة المعاملات, en: factor technique, ch: 6, def: تكلفة المشروع من تكلفة المعدات مضروبة في معاملات للبنود الأخرى.}
- {ar: قاعدة الحجم والقوة, en: power-sizing technique, ch: 6, def: التكلفة تتغير مع الحجم مرفوعا لأس أقل من 1.}
- {ar: منحنى التعلم, en: learning curve, ch: 6, def: ينخفض زمن الوحدة بنسبة ثابتة كلما تضاعف عدد الوحدات المنتجة.}
- {ar: علاقة تقدير التكلفة, en: cost-estimating relationship (CER), ch: 6, def: معادلة انحدار تربط التكلفة بخصائص المنتج.}

# ---------------------------------------------------------------- chapter 11: limited budget
- {ar: الميزانية المحدودة, en: capital rationing (budget limitation), ch: 11, def: ميزانية لا تكفي لكل المشاريع المقبولة.}
- {ar: مؤشر الربحية, en: profitability index (PI), ch: 11, def: القيمة الحالية للتدفقات الداخلة على الاستثمار.}
- {ar: الحصر الكامل, en: exhaustive enumeration of bundles, ch: 11, def: تجربة كل مجموعة ممكنة من المشاريع داخل الميزانية.}
- {ar: البرمجة الخطية بالأعداد الصحيحة, en: integer linear programming, ch: 11, def: نموذج رياضي يختار المشاريع بمتغيرات 0 أو 1.}
