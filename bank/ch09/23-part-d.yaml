items:

- id: c09-d-01
  kind: problem
  part: D
  vars: {C: 30000, S1: 21000, O1: 5000, i: 0.10}
  random: {C: [10000, 80000, 1000], O1: [1000, 10000, 500], i: [0.06, 0.14, 0.01], S1: [5000, 60000, 500]}
  calc:
    - S1 = floor(C*0.7/500)*500
    - A1 = C*(1 + i) - S1 + O1
  text: |
    آلة تكلف [[C|g]] دينار، وتباع بعد سنة بمبلغ [[S1|g]] دينار. تشغيلها في السنة الأولى [[O1|g]] دينار. الحد الأدنى [[i|%]]. ما القيمة السنوية إذا استخدمت سنة واحدة فقط؟
  solution: |
    لسنة واحدة، معامل استرداد رأس المال يساوي واحدا زائد النسبة:

    $$
    AW_1 = [[C|g]]\,(1 + [[i|r]]) - [[S1|g]] + [[O1|g]] = [[A1|2]]
    $$

- id: c09-d-02
  kind: problem
  part: D
  vars: {C: 30000, S3: 12000, O1: 5000, G: 1500, i: 0.10}
  random: {C: [10000, 80000, 1000], O1: [1000, 10000, 500], G: [300, 3000, 100], i: [0.06, 0.14, 0.01], S3: [2000, 40000, 500]}
  calc:
    - S3 = floor(C*0.4/500)*500
    - A3 = C*AP(i, 3) - S3*AF(i, 3) + O1 + G*AG(i, 3)
  text: |
    آلة تكلف [[C|g]] دينار، وتباع بعد 3 سنوات بمبلغ [[S3|g]] دينار. تشغيلها [[O1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار سنويا. الحد الأدنى [[i|%]]. ما القيمة السنوية لعمر 3 سنوات؟
  solution: |
    $$
    AW_3 = [[C|g]]\,(A/P,\ [[i|%]],\ 3) - [[S3|g]]\,(A/F,\ [[i|%]],\ 3) + [[O1|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ 3) = [[A3|2]]
    $$

- id: c09-d-03
  kind: problem
  part: D
  vars: {C: 50000, a: 0.70, b: 0.10, O1: 7000, G: 3000, i: 0.10}
  random: {C: [20000, 80000, 1000], a: [0.60, 0.75, 0.05], b: [0.06, 0.10, 0.01], O1: [2000, 10000, 500], i: [0.06, 0.14, 0.01], G: [600, 6400, 100]}
  calc:
    - G = min(max(G, floor(C*0.03/100)*100), floor(C*0.08/100)*100)
    - t1 = C*AP(i, 1) - C*a*AF(i, 1) + O1
    - t2 = C*AP(i, 2) - C*(a - b)*AF(i, 2) + O1 + G*AG(i, 2)
    - t3 = C*AP(i, 3) - C*(a - 2*b)*AF(i, 3) + O1 + G*AG(i, 3)
    - t4 = C*AP(i, 4) - C*(a - 3*b)*AF(i, 4) + O1 + G*AG(i, 4)
    - t5 = C*AP(i, 5) - C*(a - 4*b)*AF(i, 5) + O1 + G*AG(i, 5)
    - m = min(t1, t2, t3, t4, t5)
    - ns = pick(t1 == m, 1, pick(t2 == m, 2, pick(t3 == m, 3, pick(t4 == m, 4, 5))))
  text: |
    رافعة شوكية تكلف [[C|g]] دينار. قيمتها السوقية بعد سنة [[C*a|g]] دينار، ثم تنخفض [[C*b|g]] دينار كل سنة. تشغيلها [[O1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار سنويا. الحد الأدنى [[i|%]]. ما عمرها الاقتصادي؟
  solution: |
    لكل عمر n:

    $$
    AW_n = C\,(A/P,\ i,\ n) - S_n\,(A/F,\ i,\ n) + O_1 + G\,(A/G,\ i,\ n)
    $$

    | العمر | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | القيمة السوقية | [[C*a|0]] | [[C*(a-b)|0]] | [[C*(a-2*b)|0]] | [[C*(a-3*b)|0]] | [[C*(a-4*b)|0]] |
    | القيمة السنوية | [[t1|0]] | [[t2|0]] | [[t3|0]] | [[t4|0]] | [[t5|0]] |

    أقل قيمة سنوية [[m|2]] دينار عند [[yrs(ns)]]. [[pick(ns == 5, 'الأقل في آخر الجدول، فنمده للتأكد.', 'هذا هو العمر الاقتصادي.')]]

- id: c09-d-04
  kind: problem
  part: D
  vars: {C: 40000, a: 0.75, b: 0.10, O: 6000, i: 0.10}
  random: {C: [20000, 80000, 1000], a: [0.65, 0.80, 0.05], b: [0.05, 0.12, 0.01], O: [2000, 10000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - t1 = C*AP(i, 1) - C*a*AF(i, 1) + O
    - t2 = C*AP(i, 2) - C*(a - b)*AF(i, 2) + O
    - t3 = C*AP(i, 3) - C*(a - 2*b)*AF(i, 3) + O
    - t4 = C*AP(i, 4) - C*(a - 3*b)*AF(i, 4) + O
  text: |
    آلة تكلف [[C|g]] دينار. قيمتها السوقية بعد سنة [[C*a|g]] دينار، ثم تنخفض [[C*b|g]] دينار كل سنة. تشغيلها ثابت [[O|g]] دينار لا يزيد مع العمر. الحد الأدنى [[i|%]]. احسب القيمة السنوية لأعمار 1 إلى 4 سنوات. ماذا تلاحظ؟
  solution: |
    | العمر | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[t1|0]] | [[t2|0]] | [[t3|0]] | [[t4|0]] |

    القيمة السنوية [[pick(t4 < t1, 'تنخفض كلما طال العمر', 'لا تنخفض بانتظام')]]. عندما لا يرتفع التشغيل مع العمر، لا يوجد سبب للاستبدال المبكر، فالعمر الاقتصادي هو أطول عمر ممكن.

- id: c09-d-05
  kind: problem
  part: D
  vars: {C: 20000, O1: 3000, G: 1500, i: 0.10}
  random: {C: [8000, 40000, 1000], O1: [1000, 6000, 500], G: [500, 3000, 100], i: [0.06, 0.14, 0.01]}
  calc:
    - G = max(G, floor(C*0.05/100)*100)
    - t1 = C*AP(i, 1) + O1
    - t2 = C*AP(i, 2) + O1 + G*AG(i, 2)
    - t3 = C*AP(i, 3) + O1 + G*AG(i, 3)
    - t4 = C*AP(i, 4) + O1 + G*AG(i, 4)
    - t5 = C*AP(i, 5) + O1 + G*AG(i, 5)
    - t6 = C*AP(i, 6) + O1 + G*AG(i, 6)
    - t7 = C*AP(i, 7) + O1 + G*AG(i, 7)
    - t8 = C*AP(i, 8) + O1 + G*AG(i, 8)
    - m = min(t1, t2, t3, t4, t5, t6, t7, t8)
    - ns = pick(t1 == m, 1, pick(t2 == m, 2, pick(t3 == m, 3, pick(t4 == m, 4, pick(t5 == m, 5, pick(t6 == m, 6, pick(t7 == m, 7, 8)))))))
  text: |
    معدات خاصة تكلف [[C|g]] دينار، ولا قيمة لها في السوق بعد تركيبها. تشغيلها [[O1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار سنويا. الحد الأدنى [[i|%]]. ما عمرها الاقتصادي حتى 8 سنوات؟
  solution: |
    $$
    AW_n = [[C|g]]\,(A/P,\ [[i|%]],\ n) + [[O1|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ n)
    $$

    | العمر | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[t1|0]] | [[t2|0]] | [[t3|0]] | [[t4|0]] | [[t5|0]] | [[t6|0]] | [[t7|0]] | [[t8|0]] |

    العمر الاقتصادي [[yrs(ns)]]، بقيمة سنوية [[m|2]] دينار.

- id: c09-d-06
  kind: problem
  part: D
  text: |
    حسب مهندس القيمة السنوية لآلة لأعمار مختلفة: 18,400 ثم 16,900 ثم 16,350 ثم 16,420 ثم 16,800 دينار للأعمار 1 إلى 5. ما العمر الاقتصادي؟ ولماذا لا تختار الشركة الاحتفاظ بالآلة 5 سنوات ما دامت تعمل؟
  solution: |
    العمر الاقتصادي 3 سنوات، بأقل قيمة سنوية 16,350 دينار. الاحتفاظ بها أكثر يرفع المتوسط السنوي، لأن تكاليف التشغيل في السنوات المتأخرة أعلى من الوفر في رأس المال. الفرق صغير بين 3 و4 سنوات، فالقرار هنا ليس حساسا.

- id: c09-d-07
  kind: problem
  part: D
  vars: {C: 40000, a: 0.70, b: 0.08, O1: 6000, G: 2000, i: 0.10}
  random: {C: [20000, 80000, 1000], a: [0.60, 0.75, 0.05], b: [0.06, 0.10, 0.01], O1: [2000, 10000, 500], i: [0.06, 0.14, 0.01], G: [600, 6400, 100]}
  calc:
    - G = min(max(G, floor(C*0.03/100)*100), floor(C*0.08/100)*100)
    - mc1 = C - C*a + i*C + O1
    - mc2 = C*b + i*C*a + O1 + G
    - mc3 = C*b + i*C*(a - b) + O1 + 2*G
    - mc4 = C*b + i*C*(a - 2*b) + O1 + 3*G
    - mc5 = C*b + i*C*(a - 3*b) + O1 + 4*G
    - t1 = mc1
    - t2 = NPV(i, [0, mc1, mc2])*AP(i, 2)
    - t3 = NPV(i, [0, mc1, mc2, mc3])*AP(i, 3)
    - t4 = NPV(i, [0, mc1, mc2, mc3, mc4])*AP(i, 4)
    - t5 = NPV(i, [0, mc1, mc2, mc3, mc4, mc5])*AP(i, 5)
  text: |
    للآلة في مثال العمر الاقتصادي، بأرقام هذه المسألة: الثمن [[C|g]] دينار، والقيمة السوقية بعد سنة [[C*a|g]] دينار ثم تنخفض [[C*b|g]] دينار سنويا، والتشغيل [[O1|g]] دينار ويزيد [[G|g]] دينار سنويا، والحد الأدنى [[i|%]]. احسب التكلفة الحدية لكل سنة، ثم القيمة السنوية لكل عمر منها.
  solution: |
    التكلفة الحدية للسنة k: النقص في القيمة، وفائدة القيمة في بداية السنة، والتشغيل:

    $$
    MC_k = (M_{k-1} - M_k) + i\,M_{k-1} + O_k
    $$

    القيمة السنوية لعمر n هي القيمة السنوية المكافئة لأول n تكلفة حدية.

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | التكلفة الحدية | [[mc1|0]] | [[mc2|0]] | [[mc3|0]] | [[mc4|0]] | [[mc5|0]] |
    | القيمة السنوية | [[t1|0]] | [[t2|0]] | [[t3|0]] | [[t4|0]] | [[t5|0]] |

    القيمة السنوية تنخفض ما دامت التكلفة الحدية أقل منها، وترتفع عندما تتجاوزها. العمر الاقتصادي هو آخر سنة تكون فيها التكلفة الحدية أقل من القيمة السنوية التي قبلها.

- id: c09-d-08
  kind: problem
  part: D
  calc:
    - a1 = 30000*AP(0.05, 1) - 21000*AF(0.05, 1) + 4000
    - a2 = 30000*AP(0.05, 2) - 18000*AF(0.05, 2) + 4000 + 2000*AG(0.05, 2)
    - a3 = 30000*AP(0.05, 3) - 15000*AF(0.05, 3) + 4000 + 2000*AG(0.05, 3)
    - a4 = 30000*AP(0.05, 4) - 12000*AF(0.05, 4) + 4000 + 2000*AG(0.05, 4)
    - b1 = 30000*AP(0.15, 1) - 21000*AF(0.15, 1) + 4000
    - b2 = 30000*AP(0.15, 2) - 18000*AF(0.15, 2) + 4000 + 2000*AG(0.15, 2)
    - b3 = 30000*AP(0.15, 3) - 15000*AF(0.15, 3) + 4000 + 2000*AG(0.15, 3)
    - b4 = 30000*AP(0.15, 4) - 12000*AF(0.15, 4) + 4000 + 2000*AG(0.15, 4)
  text: |
    آلة تكلف 30,000 دينار. قيمتها السوقية 21,000 ثم 18,000 ثم 15,000 ثم 12,000 دينار بعد السنوات 1 إلى 4. تشغيلها 4,000 دينار في السنة الأولى، ويزيد 2,000 دينار سنويا. احسب العمر الاقتصادي بحد أدنى 5%، ثم 15%.
  solution: |
    | العمر | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | عند 5% | [[a1|0]] | [[a2|0]] | [[a3|0]] | [[a4|0]] |
    | عند 15% | [[b1|0]] | [[b2|0]] | [[b3|0]] | [[b4|0]] |

    العمر الاقتصادي 3 سنوات عند النسبتين، لكن كل القيم أعلى عند 15%، لأن تكلفة المال المحبوس في الآلة أعلى. النسبة الأعلى تعاقب الثمن المدفوع اليوم، فتميل إلى إطالة العمر الاقتصادي في بعض الحالات.

- id: c09-d-09
  kind: problem
  part: D
  vars: {C: 24000, M1: 17000, M2: 13000, M3: 10000, M4: 8000, O1: 3000, O2: 4000, O3: 6000, O4: 9000, i: 0.10}
  random: {C: [10000, 50000, 1000], i: [0.06, 0.14, 0.01], O1: [1000, 6000, 500]}
  calc:
    - M1 = floor(C*0.70/100)*100
    - M2 = floor(C*0.54/100)*100
    - M3 = floor(C*0.42/100)*100
    - M4 = floor(C*0.33/100)*100
    - O2 = O1 + 1000
    - O3 = O1 + 3000
    - O4 = O1 + 6000
    - t1 = C*AP(i, 1) - M1 + O1
    - t2 = (C + O1*PF(i, 1) + O2*PF(i, 2))*AP(i, 2) - M2*AF(i, 2)
    - t3 = (C + O1*PF(i, 1) + O2*PF(i, 2) + O3*PF(i, 3))*AP(i, 3) - M3*AF(i, 3)
    - t4 = (C + O1*PF(i, 1) + O2*PF(i, 2) + O3*PF(i, 3) + O4*PF(i, 4))*AP(i, 4) - M4*AF(i, 4)
    - m = min(t1, t2, t3, t4)
    - ns = pick(t1 == m, 1, pick(t2 == m, 2, pick(t3 == m, 3, 4)))
  text: |
    سيارة توزيع تكلف [[C|g]] دينار. البيانات المتوقعة:

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | القيمة السوقية في النهاية | [[M1|g]] | [[M2|g]] | [[M3|g]] | [[M4|g]] |
    | الوقود والصيانة | [[O1|g]] | [[O2|g]] | [[O3|g]] | [[O4|g]] |

    الحد الأدنى [[i|%]]. ما العمر الاقتصادي؟
  solution: |
    التشغيل غير منتظم، فنحسب قيمته الحالية لكل عمر، ثم نحولها إلى قيمة سنوية:

    $$
    AW_n = \left(C + \sum_{k=1}^{n} O_k\,(P/F,\ i,\ k)\right)(A/P,\ i,\ n) - M_n\,(A/F,\ i,\ n)
    $$

    | العمر | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[t1|0]] | [[t2|0]] | [[t3|0]] | [[t4|0]] |

    العمر الاقتصادي [[yrs(ns)]].

- id: c09-d-10
  kind: problem
  part: D
  vars: {C: 40000, a: 0.70, b: 0.08, O1: 6000, G: 2000, N: 8, i: 0.10}
  random: {C: [20000, 80000, 1000], a: [0.60, 0.75, 0.05], b: [0.06, 0.08, 0.01], O1: [2000, 10000, 500], i: [0.06, 0.14, 0.01], G: [600, 6400, 100]}
  calc:
    - G = min(max(G, floor(C*0.04/100)*100), floor(C*0.08/100)*100)
    - t3 = C*AP(i, 3) - C*(a - 2*b)*AF(i, 3) + O1 + G*AG(i, 3)
    - t8 = C*AP(i, 8) - C*(a - 7*b)*AF(i, 8) + O1 + G*AG(i, 8)
  text: |
    آلة تكلف [[C|g]] دينار. قيمتها السوقية بعد سنة [[C*a|g]] دينار، ثم تنخفض [[C*b|g]] دينار سنويا. تشغيلها [[O1|g]] دينار ويزيد [[G|g]] دينار سنويا. عمرها الفني 8 سنوات. الحد الأدنى [[i|%]]. قارن القيمة السنوية إذا استبدلت كل 3 سنوات، وإذا استخدمت حتى نهاية عمرها الفني.
  solution: |
    $$
    AW_3 = [[t3|2]], \qquad AW_8 = [[t8|2]]
    $$

    [[pick(t3 < t8, 'الاستبدال كل 3 سنوات يوفر ' , 'الاستخدام حتى العمر الفني يوفر ')]][[abs(t8-t3)|2]] دينار سنويا. العمر الفني ليس معيارا للاستبدال.

- id: c09-d-11
  kind: problem
  part: D
  vars: {Ca: 30000, Oa: 4000, Ga: 2500, Cb: 45000, Ob: 3000, Gb: 1000, i: 0.10}
  random: {Ca: [15000, 40000, 1000], Oa: [2000, 6000, 500], Ga: [1500, 3500, 100], Cb: [35000, 70000, 1000], Ob: [1500, 5000, 500], Gb: [500, 1500, 100], i: [0.06, 0.14, 0.01]}
  calc:
    - a1 = Ca*AP(i, 1) + Oa
    - a2 = Ca*AP(i, 2) + Oa + Ga*AG(i, 2)
    - a3 = Ca*AP(i, 3) + Oa + Ga*AG(i, 3)
    - a4 = Ca*AP(i, 4) + Oa + Ga*AG(i, 4)
    - a5 = Ca*AP(i, 5) + Oa + Ga*AG(i, 5)
    - a6 = Ca*AP(i, 6) + Oa + Ga*AG(i, 6)
    - b4 = Cb*AP(i, 4) + Ob + Gb*AG(i, 4)
    - b6 = Cb*AP(i, 6) + Ob + Gb*AG(i, 6)
    - b8 = Cb*AP(i, 8) + Ob + Gb*AG(i, 8)
    - b10 = Cb*AP(i, 10) + Ob + Gb*AG(i, 10)
    - b12 = Cb*AP(i, 12) + Ob + Gb*AG(i, 12)
    - ma = min(a1, a2, a3, a4, a5, a6)
    - mb = min(b4, b6, b8, b10, b12)
  text: |
    متحديان بدون قيمة بيع. أ: ثمنه [[Ca|g]] دينار، وتشغيله [[Oa|g]] دينار ويزيد [[Ga|g]] دينار سنويا. ب: ثمنه [[Cb|g]] دينار، وتشغيله [[Ob|g]] دينار ويزيد [[Gb|g]] دينار سنويا. الحد الأدنى [[i|%]]. احسب القيمة السنوية لكل منهما عند عمره الاقتصادي، وقرر أيهما أفضل. جرب لأ الأعمار 1 إلى 6، ولب الأعمار 4 و6 و8 و10 و12.
  solution: |
    | أ: العمر | 1 | 2 | 3 | 4 | 5 | 6 |
    | --- | --- | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[a1|0]] | [[a2|0]] | [[a3|0]] | [[a4|0]] | [[a5|0]] | [[a6|0]] |

    | ب: العمر | 4 | 6 | 8 | 10 | 12 |
    | --- | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[b4|0]] | [[b6|0]] | [[b8|0]] | [[b10|0]] | [[b12|0]] |

    أقل قيمة سنوية لأ [[ma|2]] دينار، ولب [[mb|2]] دينار. الأفضل: [[pick(ma <= mb, 'أ', 'ب')]]. كل متحد يقارن عند عمره الاقتصادي، حتى لو اختلفت الأعمار.

- id: c09-d-12
  kind: problem
  part: D
  vars: {C: 40000, O1: 6000, G: 2000, i: 0.10}
  calc:
    - t4 = C*AP(i, 4) - 18400*AF(i, 4) + O1 + G*AG(i, 4)
  text: |
    اكتب في Excel صيغة واحدة للقيمة السنوية لعمر n في مثال العمر الاقتصادي، بحيث تنسخ للأعمار كلها. الثمن في B1، والحد الأدنى في B2، والتشغيل الأول في B3، والزيادة في B4، والعمر في A7، والقيمة السوقية عند ذلك العمر في B7.
  solution: |
    ```excel
    =PMT($B$2, A7, -$B$1, B7) + $B$3 + $B$4*(1/$B$2 - A7/((1+$B$2)^A7 - 1))
    ```

    الجزء الأول تكلفة رأس المال، والثاني التشغيل الأول، والثالث معامل التدرج A/G مضروبا في الزيادة. لعمر 4 سنوات، حيث القيمة السوقية 18,400 دينار، النتيجة [[t4|2]] دينار.

- id: c09-d-13
  kind: problem
  part: D
  vars: {C: 26000, O: 4000, X: 9000, i: 0.10}
  random: {C: [10000, 50000, 1000], O: [1500, 8000, 500], X: [3000, 20000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - t1 = C*AP(i, 1) + O
    - t2 = C*AP(i, 2) + O
    - t3 = (C + X*PF(i, 3))*AP(i, 3) + O
    - t4 = (C + X*PF(i, 3))*AP(i, 4) + O
    - t5 = (C + X*PF(i, 3))*AP(i, 5) + O
    - m = min(t2, t3, t4, t5)
  text: |
    آلة تكلف [[C|g]] دينار بدون قيمة بيع، وتشغيلها ثابت [[O|g]] دينار. في السنة الثالثة تحتاج إصلاحا كبيرا يكلف [[X|g]] دينار. الحد الأدنى [[i|%]]. احسب القيمة السنوية للأعمار 1 إلى 5. هل يستحق إجراء الإصلاح؟
  solution: |
    من عمر 3 فما فوق تدخل تكلفة الإصلاح:

    $$
    AW_n = \left([[C|g]] + [[X|g]]\,(P/F,\ [[i|%]],\ 3)\right)(A/P,\ [[i|%]],\ n) + [[O|g]]
    $$

    | العمر | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[t1|0]] | [[t2|0]] | [[t3|0]] | [[t4|0]] | [[t5|0]] |

    [[pick(t2 == m, 'الأقل عند سنتين: استبدل الآلة قبل الإصلاح.', 'الإصلاح يستحق، لأن القيمة السنوية بعده أقل من الاستبدال بعد سنتين.')]]

- id: c09-d-14
  kind: problem
  part: D
  vars: {C: 40000, a: 0.70, b: 0.08, O1: 6000, G: 2000, i: 0.10}
  random: {C: [20000, 80000, 1000], a: [0.60, 0.75, 0.05], b: [0.06, 0.10, 0.01], O1: [2000, 10000, 500], i: [0.06, 0.14, 0.01], G: [600, 6400, 100]}
  calc:
    - G = min(max(G, floor(C*0.03/100)*100), floor(C*0.08/100)*100)
    - k1 = C*AP(i, 1) - C*a*AF(i, 1)
    - k3 = C*AP(i, 3) - C*(a - 2*b)*AF(i, 3)
    - k5 = C*AP(i, 5) - C*(a - 4*b)*AF(i, 5)
    - o1 = O1
    - o3 = O1 + G*AG(i, 3)
    - o5 = O1 + G*AG(i, 5)
  text: |
    للآلة: الثمن [[C|g]] دينار، والقيمة السوقية بعد سنة [[C*a|g]] دينار ثم تنخفض [[C*b|g]] دينار سنويا، والتشغيل [[O1|g]] دينار ويزيد [[G|g]] دينار سنويا، والحد الأدنى [[i|%]]. افصل القيمة السنوية لأعمار 1 و3 و5 إلى جزء رأس المال وجزء التشغيل. ماذا تلاحظ؟
  solution: |
    | العمر | 1 | 3 | 5 |
    | --- | --- | --- | --- |
    | رأس المال | [[k1|0]] | [[k3|0]] | [[k5|0]] |
    | التشغيل | [[o1|0]] | [[o3|0]] | [[o5|0]] |
    | المجموع | [[k1+o1|0]] | [[k3+o3|0]] | [[k5+o5|0]] |

    جزء رأس المال ينخفض مع العمر، وجزء التشغيل يرتفع. العمر الاقتصادي حيث يتوازن الاتجاهان.
