items:

- id: c09-f-01
  kind: problem
  part: F
  vars: {M: 7000, Od: 9000, Sd: 2000, C: 30000, Oc: 3500, Sc: 12000, n: 3, i: 0.10}
  random: {M: [2000, 15000, 500], Od: [5000, 14000, 500], C: [15000, 50000, 1000], Oc: [1500, 6000, 500], n: [2, 4, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd = floor(M*0.4/100)*100
    - Sc = floor(C*(0.75 - 0.1*n)/100)*100
    - Pd = M + Od*PA(i, n) - Sd*PF(i, n)
    - Pc = C + Oc*PA(i, n) - Sc*PF(i, n)
  text: |
    خط تعبئة سيستخدم [[yrs(n)]] فقط قبل تغيير المنتج. الآلة القديمة قيمتها [[M|g]] دينار، وتشغيلها [[Od|g]] دينار، وتباع في النهاية بمبلغ [[Sd|g]] دينار. الجديدة ثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وتباع في النهاية بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. هل تستبدل الشركة؟
  solution: |
    $$
    PW_d = [[M|g]] + [[Od|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sd|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Pd|2]]
    $$

    $$
    PW_c = [[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sc|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Pc|2]]
    $$

    [[pick(Pc < Pd, 'تستبدل', 'تحتفظ بالقديمة')]]. قيمة بيع الجديدة بعد مدة قصيرة مهمة جدا في هذا القرار.

- id: c09-f-02
  kind: problem
  part: F
  vars: {M: 9000, Od: 9000, G: 1500, C: 35000, Oc: 4000, i: 0.10}
  random: {M: [4000, 15000, 500], Od: [6000, 14000, 500], G: [500, 3000, 100], C: [20000, 60000, 1000], Oc: [1500, 7000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - S1 = floor(M*0.75/100)*100
    - S4 = floor(C*0.35/100)*100
    - S5 = floor(C*0.23/100)*100
    - Pa = C + Oc*PA(i, 5) - S5*PF(i, 5)
    - Pb = M + (Od - S1 + C)*PF(i, 1) + Oc*(PA(i, 5) - PA(i, 1)) - S4*PF(i, 5)
  text: |
    الخدمة مطلوبة 5 سنوات. الخيار أ: الاستبدال الآن، وبيع الجديدة بعد 5 سنوات بمبلغ [[S5|g]] دينار. الخيار ب: الاحتفاظ بالقديمة سنة، وبيعها بمبلغ [[S1|g]] دينار، ثم شراء جديدة تعمل 4 سنوات وتباع بمبلغ [[S4|g]] دينار. القديمة قيمتها اليوم [[M|g]] دينار، وتشغيلها في السنة القادمة [[Od|g]] دينار. الجديدة ثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار. الحد الأدنى [[i|%]]. قارن.
  solution: |
    $$
    PW_a = [[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ 5) - [[S5|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pa|2]]
    $$

    في الخيار ب، السنة الأولى فيها تشغيل القديمة وبيعها وشراء الجديدة:

    $$
    PW_b = [[M|g]] + ([[Od|g]] - [[S1|g]] + [[C|g]])\,(P/F,\ [[i|%]],\ 1) + [[Oc|g]]\,\left((P/A,\ 5) - (P/A,\ 1)\right) - [[S4|g]]\,(P/F,\ 5) = [[Pb|2]]
    $$

    الأرخص: [[pick(Pa <= Pb, 'الاستبدال الآن', 'التأجيل سنة')]].

- id: c09-f-03
  kind: problem
  part: F
  vars: {M: 5000, X: 12000, Od: 6500, nd: 4, C: 38000, Oc: 3000, nc: 8, i: 0.10}
  random: {M: [1000, 10000, 500], X: [4000, 20000, 500], Od: [3000, 10000, 500], nd: [3, 6, 1], C: [20000, 60000, 1000], Oc: [1500, 6000, 500], nc: [6, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = (M + X)*AP(i, nd) + Od
    - Ac = C*AP(i, nc) + Oc
  text: |
    آلة قديمة قيمتها [[M|g]] دينار. إصلاحها الشامل يكلف [[X|g]] دينار، فتخدم بعده [[yrs(nd)]] بتشغيل [[Od|g]] دينار. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وعمرها الاقتصادي [[yrs(nc)]]. لا قيمة بيع في النهاية. الحد الأدنى [[i|%]]. أصلح أم استبدل؟
  solution: |
    $$
    AW_d = ([[M|g]] + [[X|g]])\,(A/P,\ [[i|%]],\ [[nd|n]]) + [[Od|g]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[nc|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    القرار: [[pick(Ad <= Ac, 'الإصلاح', 'الاستبدال')]].

- id: c09-f-04
  kind: problem
  part: F
  vars: {M: 5000, Od: 6500, nd: 4, Ac: 10000, i: 0.10}
  random: {M: [1000, 10000, 500], Od: [3000, 9000, 500], nd: [3, 6, 1], Ac: [8000, 20000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Ac = max(Ac, Od + M*AP(i, nd) + 1000)
    - X = (Ac - Od)/AP(i, nd) - M
  text: |
    آلة قديمة قيمتها [[M|g]] دينار. بعد إصلاح شامل تخدم [[yrs(nd)]] بتشغيل [[Od|g]] دينار، بدون قيمة بيع. أفضل متحد قيمته السنوية [[Ac|g]] دينار. الحد الأدنى [[i|%]]. ما أعلى تكلفة إصلاح تجعل الإصلاح مجديا؟
  solution: |
    $$
    ([[M|g]] + X)\,(A/P,\ [[i|%]],\ [[nd|n]]) + [[Od|g]] = [[Ac|g]]
    $$

    $$
    X = \frac{[[Ac|g]] - [[Od|g]]}{[[AP(i, nd)|f4]]} - [[M|g]] = [[X|2]]
    $$

- id: c09-f-05
  kind: problem
  part: F
  vars: {M0: 15000, M1: 11000, R: 6000, O: 2500, i: 0.10}
  random: {M0: [3000, 30000, 500], R: [1500, 12000, 500], O: [500, 6000, 500], i: [0.06, 0.14, 0.01], M1: [1000, 25000, 100]}
  calc:
    - M1 = floor(M0*0.8/100)*100
    - N = R - O + M1 - M0*(1 + i)
  text: |
    معدات قيمتها السوقية [[M0|g]] دينار، وبعد سنة [[M1|g]] دينار. تعطي في السنة القادمة إيرادا [[R|g]] دينار، بتكاليف [[O|g]] دينار. الحد الأدنى [[i|%]]. هل تحتفظ الشركة بها سنة أخرى؟
  solution: |
    نقارن ما يتوفر بعد سنة في الحالتين:

    $$
    [[R|g]] - [[O|g]] + [[M1|g]] - [[M0|g]]\,(1 + [[i|r]]) = [[N|2]]
    $$

    [[pick(N >= 0, 'موجب، فتحتفظ بها سنة أخرى.', 'سالب، فتبيعها الآن.')]]

- id: c09-f-06
  kind: problem
  part: F
  vars: {M0: 20000, d: 0.15, R1: 9000, h: 0.12, O1: 3000, G: 600, i: 0.10}
  random: {M0: [5000, 40000, 1000], d: [0.10, 0.25, 0.01], R1: [3000, 15000, 500], h: [0.05, 0.20, 0.01], O1: [1000, 5000, 500], G: [200, 1500, 100], i: [0.06, 0.14, 0.01]}
  calc:
    - m1 = M0*(1 - d)
    - m2 = M0*(1 - d)**2
    - m3 = M0*(1 - d)**3
    - n1 = R1 - O1 + m1 - M0*(1 + i)
    - n2 = R1*(1 - h) - O1 - G + m2 - m1*(1 + i)
    - n3 = R1*(1 - h)**2 - O1 - 2*G + m3 - m2*(1 + i)
    - k = pick(n1 < 0, 0, pick(n2 < 0, 1, pick(n3 < 0, 2, 3)))
  text: |
    آلة تؤجر بالساعة. قيمتها السوقية [[M0|g]] دينار، وتنخفض [[d|%]] سنويا. إيرادها [[R1|g]] دينار في السنة القادمة، وينخفض [[h|%]] سنويا لأن الطلب يتحول إلى آلات أحدث. تكاليفها [[O1|g]] دينار، وتزيد [[G|g]] دينار سنويا. الحد الأدنى [[i|%]]. متى توقف الشركة الآلة وتبيعها؟
  solution: |
    كل سنة نقارن صافي ما تعطيه الآلة مع بيعها في بداية السنة:

    $$
    N_k = R_k - O_k + M_k - M_{k-1}\,(1 + i)
    $$

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الإيراد | [[R1|0]] | [[R1*(1-h)|0]] | [[R1*(1-h)**2|0]] |
    | التكاليف | [[O1|0]] | [[O1+G|0]] | [[O1+2*G|0]] |
    | القيمة في النهاية | [[m1|0]] | [[m2|0]] | [[m3|0]] |
    | الربح من الاحتفاظ | [[n1|0]] | [[n2|0]] | [[n3|0]] |

    [[pick(k == 0, 'الاحتفاظ لا يربح حتى في السنة الأولى، فتبيعها الآن.', pick(k == 3, 'الاحتفاظ رابح في السنوات الثلاث.', 'تحتفظ بها ' + yrs(k) + '، ثم تبيعها.'))]]

- id: c09-f-07
  kind: problem
  part: F
  vars: {M: 6000, Od: 8000, nd: 2, C: 30000, Oc: 3000, Sc: 15000, i: 0.10}
  random: {M: [2000, 12000, 500], Od: [5000, 12000, 500], C: [15000, 50000, 1000], Oc: [1500, 6000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Sc = floor(C*0.5/100)*100
    - Pd = M + Od*PA(i, 2)
    - Pc = C + Oc*PA(i, 2) - Sc*PF(i, 2)
    - Cmax = Pd - Oc*PA(i, 2) + Sc*PF(i, 2)
  text: |
    عقد صيانة ينتهي بعد سنتين. القديمة قيمتها [[M|g]] دينار، وتشغيلها [[Od|g]] دينار، ولا تباع بشيء بعد العقد. الجديدة ثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وتباع بعد سنتين بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. قارن، ثم احسب أعلى ثمن للجديدة يجعلها مقبولة.
  solution: |
    $$
    PW_d = [[M|g]] + [[Od|g]]\,(P/A,\ [[i|%]],\ 2) = [[Pd|2]]
    $$

    $$
    PW_c = [[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ 2) - [[Sc|g]]\,(P/F,\ [[i|%]],\ 2) = [[Pc|2]]
    $$

    الأرخص: [[pick(Pc < Pd, 'الجديدة', 'القديمة')]]. أعلى ثمن للجديدة يساوي [[Cmax|2]] دينار، بفرض أن قيمة بيعها تبقى [[Sc|g]] دينار.

- id: c09-f-08
  kind: problem
  part: F
  vars: {M: 7000, X: 8000, Od1: 5000, Od2: 9000, nd: 4, i: 0.10}
  random: {M: [2000, 15000, 500], X: [3000, 15000, 500], Od1: [2000, 7000, 500], Od2: [6000, 14000, 500], nd: [3, 6, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - A1 = (M + X)*AP(i, nd) + Od1
    - A2 = M*AP(i, nd) + Od2
  text: |
    آلة قديمة قيمتها [[M|g]] دينار، وتخدم [[yrs(nd)]] أخرى بدون قيمة بيع. خياران لها: إصلاح شامل يكلف [[X|g]] دينار، ويجعل تشغيلها [[Od1|g]] دينار سنويا. أو بدون إصلاح، وتشغيلها [[Od2|g]] دينار. الحد الأدنى [[i|%]]. هل يستحق الإصلاح؟
  solution: |
    $$
    AW_{fix} = ([[M|g]] + [[X|g]])\,(A/P,\ [[i|%]],\ [[nd|n]]) + [[Od1|g]] = [[A1|2]]
    $$

    $$
    AW_{no} = [[M|g]]\,(A/P,\ [[i|%]],\ [[nd|n]]) + [[Od2|g]] = [[A2|2]]
    $$

    [[pick(A1 < A2, 'الإصلاح يستحق.', 'الإصلاح لا يستحق.')]] القيمة السوقية [[M|g]] دينار نفسها في الخيارين، فلا تؤثر على الفرق.

- id: c09-f-09
  kind: problem
  part: F
  vars: {C: 40000, Oc: 4000, Sc3: 22000, Sc5: 12000, i: 0.10}
  random: {C: [20000, 70000, 1000], Oc: [1500, 7000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Sc3 = floor(C*0.55/100)*100
    - Sc5 = floor(C*0.30/100)*100
    - P3 = C + Oc*PA(i, 3) - Sc3*PF(i, 3)
    - P5 = C + Oc*PA(i, 5) - Sc5*PF(i, 5)
    - A5 = P5*AP(i, 5)
    - A3 = P3*AP(i, 3)
  text: |
    آلة جديدة ثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار. تباع بمبلغ [[Sc3|g]] دينار إذا بيعت بعد 3 سنوات، أو [[Sc5|g]] دينار بعد 5 سنوات. الحد الأدنى [[i|%]]. احسب القيمة الحالية للتكاليف لفترة دراسة 3 سنوات و5 سنوات. لماذا لا نقارن الرقمين مباشرة؟
  solution: |
    $$
    PW_3 = [[P3|2]], \qquad PW_5 = [[P5|2]]
    $$

    الرقمان لفترتين مختلفتين، فالثاني يشمل سنتين إضافيتين من الخدمة. نحولهما إلى قيمة سنوية:

    $$
    AW_3 = [[A3|2]], \qquad AW_5 = [[A5|2]]
    $$

    هذا ما يفعله تحليل العمر الاقتصادي.

- id: c09-f-10
  kind: problem
  part: F
  vars: {M: 25000, B: 0, R: 18000, O: 10000, n: 3, S: 15000, i: 0.12}
  random: {M: [5000, 50000, 1000], R: [5000, 30000, 1000], O: [2000, 20000, 500], n: [2, 5, 1], i: [0.06, 0.15, 0.01], S: [1000, 40000, 500]}
  calc:
    - O = min(O, R - 1000)
    - S = floor(M*0.6/500)*500
    - P = -M + (R - O)*PA(i, n) + S*PF(i, n)
  text: |
    فرع خدمات قديم يمكن بيع معداته اليوم بمبلغ [[M|g]] دينار. إذا استمر [[yrs(n)]]، يعطي إيرادا [[R|g]] دينار وتكاليف [[O|g]] دينار سنويا، ثم تباع معداته بمبلغ [[S|g]] دينار. الحد الأدنى [[i|%]]. هل تغلق الشركة الفرع الآن؟
  solution: |
    الاستمرار يعني التنازل عن [[M|g]] دينار اليوم:

    $$
    PW = -[[M|g]] + [[R-O|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    [[pick(P >= 0, 'موجب، فتستمر.', 'سالب، فتغلق الفرع الآن وتبيع المعدات.')]]
