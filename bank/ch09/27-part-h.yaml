- id: c09-h-01
  kind: problem
  part: H
  calc:
    - t1 = 40000*AP(0.1, 1) - 28000*AF(0.1, 1) + 6000
    - t2 = 40000*AP(0.1, 2) - 24800*AF(0.1, 2) + 6000 + 2000*AG(0.1, 2)
    - t3 = 40000*AP(0.1, 3) - 21600*AF(0.1, 3) + 6000 + 2000*AG(0.1, 3)
    - t4 = 40000*AP(0.1, 4) - 18400*AF(0.1, 4) + 6000 + 2000*AG(0.1, 4)
    - t5 = 40000*AP(0.1, 5) - 15200*AF(0.1, 5) + 6000 + 2000*AG(0.1, 5)
    - t6 = 40000*AP(0.1, 6) - 12000*AF(0.1, 6) + 6000 + 2000*AG(0.1, 6)
  text: |
    ابن في Excel جدول العمر الاقتصادي لمثال الفصل بأرقامه الأصلية: الثمن 40,000 دينار، والقيمة السوقية 28,000 بعد سنة ثم تنخفض 3,200 سنويا، والتشغيل 6,000 ويزيد 2,000 سنويا، والحد الأدنى 10%. استخدم صيغة تنسخ للأسفل، ودالة تجد العمر الاقتصادي.
  solution: |
    الأعمار في A2:A7، والقيمة السوقية في B2:B7، والقيمة السنوية في C2:

    ```excel
    B2 =40000*(0.70 - 0.08*(A2-1))
    C2 =PMT(10%, A2, -40000, B2) + 6000 + 2000*(1/10% - A2/((1+10%)^A2 - 1))
    ```

    العمر الاقتصادي:

    ```excel
    =INDEX(A2:A7, MATCH(MIN(C2:C7), C2:C7, 0))
    ```

