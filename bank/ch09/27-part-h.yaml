    | --- | --- | --- | --- | --- |
    | التكلفة الحدية | [[c1|2]] | [[c2|2]] | [[c3|2]] | [[c4|2]] |

- id: c09-h-03
  kind: problem
  part: H
  calc:
    - Ad = 9000*AP(0.1, 3) - 3000*AF(0.1, 3) + 9000
    - Ac = 35000*AP(0.1, 8) - 5000*AF(0.1, 8) + 4000
  text: |
    احسب في Excel القيمة السنوية للمدافع والمتحدي في مثال المقارنة بأرقامه الأصلية، بدالة PMT فقط: المدافع 9,000 دينار، وتشغيله 9,000، و3 سنوات، وقيمة بيع 3,000. المتحدي 35,000 دينار، وتشغيله 4,000، و8 سنوات، وقيمة بيع 5,000. الحد الأدنى 10%.
  solution: |
    ```excel
    =PMT(10%, 3, -9000, 3000) + 9000
    =PMT(10%, 8, -35000, 5000) + 4000
    ```

    المدافع [[Ad|2]] دينار، والمتحدي [[Ac|2]] دينار. الإشارة السالبة للثمن تجعل النتيجة موجبة.

- id: c09-h-04
  kind: problem
  part: H
  calc:
    - p1 = 30000*AP(0.1, 1) + 3000
    - p2 = 30000*AP(0.1, 2) + 3000 + 1500*AG(0.1, 2)
    - p3 = 30000*AP(0.1, 3) + 3000 + 1500*AG(0.1, 3)
    - p4 = 30000*AP(0.1, 4) + 3000 + 1500*AG(0.1, 4)
    - p5 = 30000*AP(0.1, 5) + 3000 + 1500*AG(0.1, 5)
    - p6 = 30000*AP(0.1, 6) + 3000 + 1500*AG(0.1, 6)
    - p7 = 30000*AP(0.1, 7) + 3000 + 1500*AG(0.1, 7)
    - p8 = 30000*AP(0.1, 8) + 3000 + 1500*AG(0.1, 8)
    - m = min(p1, p2, p3, p4, p5, p6, p7, p8)
  text: |
    اكتب في Python برنامجا يجد العمر الاقتصادي لمعدات بدون قيمة بيع: الثمن 30,000 دينار، والتشغيل 3,000 دينار يزيد 1,500 سنويا، والحد الأدنى 10%، لأعمار حتى 8 سنوات.
  solution: |
    ```python
    import numpy_financial as npf

    C, O1, G, i = 30000, 3000, 1500, 0.10
    aw = {}
    for n in range(1, 9):
        oper = [O1 + G * k for k in range(n)]
        pw = C + npf.npv(i, [0] + oper)
        aw[n] = -npf.pmt(i, n, pw)
    best = min(aw, key=aw.get)
    print(best, round(aw[best], 2))
    ```

