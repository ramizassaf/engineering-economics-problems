    أقل قيمة [[m|2]] دينار.

- id: c09-h-05
  kind: problem
  part: H
  calc:
    - Ad = (9000 - 0.2*(9000 - 15000))*AP(0.1, 5) + 12000*0.8 - 0.2*3000
    - Ac = 40000*AP(0.1, 5) + 5000*0.8 - 0.2*8000
  text: |
    احسب في Excel مثال الاستبدال بعد الضريبة بأرقامه الأصلية. ضع المدخلات في خلايا: القيمة الدفترية 15,000، والسعر 9,000، وتشغيل المدافع 12,000، وثمن المتحدي 40,000، وتشغيله 5,000، والمدة 5 سنوات، والضريبة 20%، والحد الأدنى 10%.
  solution: |
    المدخلات في B1:B8 بنفس الترتيب. صافي بيع المدافع، ثم القيمتان السنويتان:

    ```excel
    B10 =B2 - B7*(B2 - B1)
    B11 =PMT(B8, B6, -B10) + B3*(1-B7) - B7*B1/B6
    B12 =PMT(B8, B6, -B4) + B5*(1-B7) - B7*B4/B6
    ```

    المدافع [[Ad|2]] دينار، والمتحدي [[Ac|2]] دينار.

- id: c09-h-06
  kind: problem
  part: H
  calc:
    - n1 = 9000 - 2500 + 16000 - 20000*1.1
    - n2 = 9000*0.88 - 3100 + 12800 - 16000*1.1
    - n3 = 9000*0.88**2 - 3700 + 10240 - 12800*1.1
  text: |
    اكتب في Python حلقة تحسب الربح من الاحتفاظ بأصل سنة إضافية، وتتوقف عند أول سنة يصبح فيها سالبا. البيانات: القيمة 20,000 دينار وتنخفض 20% سنويا، والإيراد 9,000 دينار وينخفض 12% سنويا، والتكاليف 2,500 دينار وتزيد 600 سنويا، والحد الأدنى 10%.
  solution: |
    ```python
    M, R, O, i = 20000, 9000, 2500, 0.10
    year = 1
    while True:
        M_next = M * 0.80
        gain = R - O + M_next - M * (1 + i)
        print(year, round(gain, 2))
        if gain < 0:
            break
        M, R, O, year = M_next, R * 0.88, O + 600, year + 1
    ```

