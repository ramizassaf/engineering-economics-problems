    | الربح من الاحتفاظ | [[n1|2]] | [[n2|2]] | [[n3|2]] |

    [[pick(n1 < 0, 'البيع الآن.', pick(n2 < 0, 'الاحتفاظ سنة واحدة ثم البيع.', pick(n3 < 0, 'الاحتفاظ سنتين ثم البيع.', 'الاحتفاظ ثلاث سنوات على الأقل.')))]]

- id: c09-h-07
  kind: problem
  part: H
  calc:
    - Pa = 35000 + 4000*PA(0.1, 5) - 8000*PF(0.1, 5)
  text: |
    احسب في Excel الخيار أ من مثال فترة الدراسة بأرقامه الأصلية، بدالة NPV: ثمن 35,000 دينار، وتشغيل 4,000 دينار لمدة 5 سنوات، وبيع 8,000 دينار في النهاية، وحد أدنى 10%.
  solution: |
    التدفقات في B2:F2، والسنة 5 تجمع التشغيل والبيع:

    ```excel
    B2:E2  4000
    F2     =4000 - 8000
    =35000 + NPV(10%, B2:F2)
    ```

    النتيجة [[Pa|2]] دينار.
