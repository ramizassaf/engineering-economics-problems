    | --- | --- | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[t1|2]] | [[t2|2]] | [[t3|2]] | [[t4|2]] | [[t5|2]] | [[t6|2]] |

- id: c09-h-02
  kind: problem
  part: H
  calc:
    - c1 = 12000 - 9000 + 0.10*12000 + 8000
    - c2 = 9000 - 6750 + 0.10*9000 + 9500
    - c3 = 6750 - 5062.5 + 0.10*6750 + 11000
    - c4 = 5062.5 - 3796.875 + 0.10*5062.5 + 12500
  text: |
    اكتب في Python دالة تأخذ القيمة السوقية الحالية للمدافع، ونسبة انخفاضها، والتشغيل الأول وزيادته، والحد الأدنى، وتطبع التكلفة الحدية للسنوات الأربع القادمة. جربها على: 12,000 دينار، وانخفاض 25%، وتشغيل 8,000 يزيد 1,500، وحد أدنى 10%.
  solution: |
    ```python
    def marginal_costs(M0, d, O1, G, i, years=4):
        out, m = [], M0
        for k in range(years):
            m_next = m * (1 - d)
            out.append(m - m_next + i * m + O1 + G * k)
            m = m_next
        return out

    print([round(c, 2) for c in marginal_costs(12000, 0.25, 8000, 1500, 0.10)])
    ```

