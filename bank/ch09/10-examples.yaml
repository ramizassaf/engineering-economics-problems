items:

# ------------------------------------------------------------ defender value
- id: c09-ex-trade-in
  kind: example
  title: |
    قيمة الآلة القديمة وعرض المبادلة
  vars: {P0: 50000, B: 20000, M: 12000, L: 60000, T: 15000}
  random: {P0: [30000, 90000, 1000], M: [4000, 25000, 500], T: [5000, 30000, 500]}
  calc:
    - B = floor(P0*0.4/1000)*1000
    - M = min(M, B - 1000)
    - T = max(T, M + 1500)
    - L = floor(P0*1.2/1000)*1000
    - Cn = L - floor((T - M)*0.8/100)*100 - 700
    - Cn = pick(abs((L - T) - (Cn - M)) < 100, Cn - 300, Cn)
    - z = (Cn - M) - (L - T)
  text: |
    مصنع اشترى آلة قبل 5 سنوات بمبلغ [[P0|g]] دينار، وقيمتها الدفترية اليوم [[B|g]] دينار. تاجر مستعمل يشتريها اليوم بمبلغ [[M|g]] دينار. وكيل آلة جديدة يعرض سعرا معلنا [[L|g]] دينار، ويقبل القديمة بدلا من [[T|g]] دينار من السعر. نفس الوكيل يبيع الجديدة نقدا بدون مبادلة بمبلغ [[Cn|g]] دينار. ما قيمة القديمة؟ وما ثمن الجديدة في التحليل؟
  solution: |
    نسمي الأصل الموجود **المدافع**، والأصل المقترح **المتحدي**.

    ثلاثة أرقام للقديمة، والصحيح واحد:

    - الثمن الأصلي [[P0|g]] دينار: صرف في الماضي، فهو تكلفة غارقة.
    - القيمة الدفترية [[B|g]] دينار: رقم محاسبي يعتمد على طريقة الاستهلاك، وليس قيمة سوقية.
    - القيمة السوقية [[M|g]] دينار: هذا ما تتنازل عنه الشركة إذا احتفظت بالآلة. هذه قيمة المدافع.

    عرض المبادلة يضخم قيمة القديمة ويضخم سعر الجديدة معا. الثمن الحقيقي للجديدة هو سعرها النقدي [[Cn|g]] دينار، وليس السعر المعلن.

    لنتأكد: صافي ما تدفعه الشركة في المبادلة:

    $$
    [[L|g]] - [[T|g]] = [[L-T|g]]
    $$

    وهو يساوي ثمن الجديدة ناقص قيمة القديمة بأرقامنا:

    $$
    [[Cn|g]] - [[M|g]] = [[Cn-M|g]]
    $$

    [[pick(z > 0, 'المبادلة أرخص من البيع للتاجر والشراء نقدا', 'البيع للتاجر والشراء نقدا أرخص من المبادلة')]] بمقدار [[abs(z)|g]] دينار. القرار بين المبادلة والبيع منفصل عن قرار الاستبدال نفسه.

    أما القيمة الدفترية، فالفرق بينها وبين السوق ([[B-M|g]] دينار) خسارة حدثت في الماضي. لا يغيرها أي قرار اليوم.

- id: c09-ex-outsider
  kind: example
  title: |
    مقارنة المدافع بالمتحدي
  vars: {M: 9000, Od: 9000, Sd: 3000, nd: 3, C: 35000, Oc: 4000, Sc: 5000, nc: 8, i: 0.10}
  random: {M: [3000, 20000, 500], Od: [5000, 15000, 500], Sd: [0, 5000, 500], nd: [2, 5, 1], C: [20000, 60000, 1000], Oc: [1500, 7000, 500], Sc: [0, 10000, 500], nc: [6, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd = min(Sd, M*0.6)
    - Ad = M*AP(i, nd) - Sd*AF(i, nd) + Od
    - Ac = C*AP(i, nc) - Sc*AF(i, nc) + Oc
  text: |
    آلة قديمة تباع اليوم بمبلغ [[M|g]] دينار. تشغيلها [[Od|g]] دينار سنويا، وتخدم [[yrs(nd)]] أخرى، ثم تباع بمبلغ [[Sd|g]] دينار. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وعمرها الاقتصادي [[yrs(nc)]]، وتباع بعده بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. هل تستبدل الشركة القديمة الآن؟
  solution: |
    ننظر إلى القرار كأننا شخص من الخارج لا يملك أيا من الآلتين: أمامه آلة مستعملة بسعر [[M|g]] دينار، وآلة جديدة بسعر [[C|g]] دينار. أيهما يشتري؟

    الأعمار مختلفة، فنقارن بالقيمة السنوية:

    $$
    AW_d = [[M|g]]\,(A/P,\ [[i|%]],\ [[nd|n]]) - [[Sd|g]]\,(A/F,\ [[i|%]],\ [[nd|n]]) + [[Od|g]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[nc|n]]) - [[Sc|g]]\,(A/F,\ [[i|%]],\ [[nc|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    [[pick(Ac < Ad, 'الجديدة أرخص سنويا، فتستبدل الشركة الآن.', 'القديمة أرخص سنويا، فتحتفظ بها الشركة الآن. نعيد الحساب كل سنة، لأن القديمة تصبح أغلى مع العمر.')]]

    القيمة السنوية تفترض أن الشركة ستحتاج الخدمة بعد عمر القديمة، وأن الجديدة ستتكرر بنفس تكاليفها.

# ------------------------------------------------------------ economic service life
- id: c09-ex-esl
  kind: example
  title: |
    العمر الاقتصادي لآلة جديدة
  vars: {C: 40000, a: 0.70, b: 0.08, O1: 6000, G: 2000, i: 0.10}
  random: {C: [20000, 80000, 1000], a: [0.60, 0.75, 0.05], b: [0.06, 0.10, 0.01], O1: [2000, 10000, 500], i: [0.06, 0.14, 0.01], G: [600, 6400, 100]}
  calc:
    - G = min(max(G, floor(C*0.03/100)*100), floor(C*0.08/100)*100)
    - s1 = C*a
    - s2 = C*(a - b)
    - s3 = C*(a - 2*b)
    - s4 = C*(a - 3*b)
    - s5 = C*(a - 4*b)
    - s6 = C*(a - 5*b)
    - k1 = C*AP(i, 1) - s1*AF(i, 1)
    - k2 = C*AP(i, 2) - s2*AF(i, 2)
    - k3 = C*AP(i, 3) - s3*AF(i, 3)
    - k4 = C*AP(i, 4) - s4*AF(i, 4)
    - k5 = C*AP(i, 5) - s5*AF(i, 5)
    - k6 = C*AP(i, 6) - s6*AF(i, 6)
    - o1 = O1
    - o2 = O1 + G*AG(i, 2)
    - o3 = O1 + G*AG(i, 3)
    - o4 = O1 + G*AG(i, 4)
    - o5 = O1 + G*AG(i, 5)
    - o6 = O1 + G*AG(i, 6)
    - m = min(k1 + o1, k2 + o2, k3 + o3, k4 + o4, k5 + o5, k6 + o6)
    - ns = pick(k1 + o1 == m, 1, pick(k2 + o2 == m, 2, pick(k3 + o3 == m, 3, pick(k4 + o4 == m, 4, pick(k5 + o5 == m, 5, 6)))))
  text: |
    آلة تكلف [[C|g]] دينار. قيمتها السوقية بعد سنة [[s1|g]] دينار، ثم تنخفض [[b*C|g]] دينار كل سنة. تشغيلها وصيانتها [[O1|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة مع تقدمها في العمر. الحد الأدنى [[i|%]]. كم سنة يجب أن تبقى الآلة قبل استبدالها؟
  solution: |
    كل سنة إضافية لها أثران متعاكسان:

    - تكلفة رأس المال السنوية تنخفض، لأن الثمن يتوزع على سنوات أكثر.
    - تكلفة التشغيل السنوية ترتفع، لأن الآلة تكبر.

    مجموعهما ينخفض ثم يرتفع. السنة التي يكون عندها المجموع أقل ما يمكن هي **العمر الاقتصادي**.

    لكل عمر n نحسب القيمة السنوية، كأن الآلة تباع في نهاية السنة n بقيمتها السوقية:

    $$
    AW_n = C\,(A/P,\ i,\ n) - S_n\,(A/F,\ i,\ n) + O_1 + G\,(A/G,\ i,\ n)
    $$

    | العمر | القيمة السوقية | رأس المال | التشغيل | المجموع |
    | --- | --- | --- | --- | --- |
    | 1 | [[s1|0]] | [[k1|0]] | [[o1|0]] | [[k1+o1|0]] |
    | 2 | [[s2|0]] | [[k2|0]] | [[o2|0]] | [[k2+o2|0]] |
    | 3 | [[s3|0]] | [[k3|0]] | [[o3|0]] | [[k3+o3|0]] |
    | 4 | [[s4|0]] | [[k4|0]] | [[o4|0]] | [[k4+o4|0]] |
    | 5 | [[s5|0]] | [[k5|0]] | [[o5|0]] | [[k5+o5|0]] |
    | 6 | [[s6|0]] | [[k6|0]] | [[o6|0]] | [[k6+o6|0]] |

    أقل قيمة سنوية [[m|2]] دينار عند العمر [[ns|n]]. [[pick(ns == 6, 'الأقل في آخر سنة في الجدول، فقد يكون العمر الاقتصادي أطول. نمد الجدول للتأكد.', 'هذا هو العمر الاقتصادي، والقيمة السنوية عنده هي التي نقارن بها هذه الآلة في قرارات الاستبدال.')]]

# ------------------------------------------------------------ marginal cost and timing
- id: c09-ex-marginal
  kind: example
  title: |
    متى نستبدل؟ التكلفة الحدية للمدافع
  vars: {M0: 12000, d: 0.25, Od: 8000, G: 1500, Ac: 13500, i: 0.10}
  random: {M0: [4000, 25000, 500], d: [0.15, 0.35, 0.01], Od: [4000, 14000, 500], G: [800, 3000, 100], i: [0.06, 0.14, 0.01], Ac: [8000, 25000, 500]}
  calc:
    - m1 = M0*(1 - d)
    - m2 = M0*(1 - d)**2
    - m3 = M0*(1 - d)**3
    - m4 = M0*(1 - d)**4
    - c1 = M0 - m1 + i*M0 + Od
    - c2 = m1 - m2 + i*m1 + Od + G
    - c3 = m2 - m3 + i*m2 + Od + 2*G
    - c4 = m3 - m4 + i*m3 + Od + 3*G
    - Ac = floor((c2 + c3)/2/100)*100
    - k = pick(c1 > Ac, 0, pick(c2 > Ac, 1, pick(c3 > Ac, 2, pick(c4 > Ac, 3, 4))))
  text: |
    آلة قديمة تباع اليوم بمبلغ [[M0|g]] دينار، وقيمتها تنخفض [[d|%]] كل سنة. تشغيلها [[Od|g]] دينار في السنة القادمة، ويزيد [[G|g]] دينار كل سنة. أفضل آلة جديدة قيمتها السنوية عند عمرها الاقتصادي [[Ac|g]] دينار. الحد الأدنى [[i|%]]. متى تستبدل الشركة القديمة؟
  solution: |
    المدافع آلة قديمة تكاليفها ترتفع كل سنة. لذلك لا نسأل: هل نحتفظ بها كل عمرها؟ بل نسأل: هل نحتفظ بها **سنة واحدة أخرى**؟

    تكلفة الاحتفاظ سنة واحدة تسمى التكلفة الحدية، ولها ثلاثة أجزاء: النقص في القيمة السوقية خلال السنة، وفائدة المال المحبوس في الآلة، والتشغيل.

    $$
    MC_k = (M_{k-1} - M_k) + i\,M_{k-1} + O_k
    $$

    | السنة | القيمة في البداية | القيمة في النهاية | التكلفة الحدية |
    | --- | --- | --- | --- |
    | 1 | [[M0|0]] | [[m1|0]] | [[c1|0]] |
    | 2 | [[m1|0]] | [[m2|0]] | [[c2|0]] |
    | 3 | [[m2|0]] | [[m3|0]] | [[c3|0]] |
    | 4 | [[m3|0]] | [[m4|0]] | [[c4|0]] |

    القاعدة: احتفظ بالمدافع ما دامت تكلفته الحدية أقل من القيمة السنوية للمتحدي، [[Ac|g]] دينار.

    [[pick(k == 0, 'التكلفة الحدية في السنة القادمة أعلى من الجديدة، فتستبدل الشركة الآن.', pick(k == 4, 'التكلفة الحدية أقل من الجديدة في السنوات الأربع كلها، فتحتفظ الشركة بالقديمة على الأقل أربع سنوات.', 'تحتفظ الشركة بالقديمة ' + yrs(k) + '، ثم تستبدلها، لأن التكلفة الحدية بعدها تتجاوز الجديدة.'))]]

- id: c09-ex-study
  kind: example
  title: |
    فترة دراسة محددة
  vars: {M: 9000, Od: 9000, G: 1500, Sd2: 5000, C: 35000, Oc: 4000, S3: 14000, S5: 8000, i: 0.10}
  random: {M: [4000, 15000, 500], Od: [6000, 14000, 500], G: [500, 3000, 100], C: [20000, 60000, 1000], Oc: [1500, 7000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd2 = floor(M*0.55/100)*100
    - S3 = floor(C*0.4/100)*100
    - S5 = floor(C*0.23/100)*100
    - Pa = C + Oc*PA(i, 5) - S5*PF(i, 5)
    - Pb = M + Od*PF(i, 1) + (Od + G - Sd2 + C)*PF(i, 2) + Oc*(PA(i, 5) - PA(i, 2)) - S3*PF(i, 5)
  text: |
    خدمة نقل داخلي في مصنع مطلوبة 5 سنوات فقط، ثم ينتقل المصنع. أمام الشركة خياران:

    - (أ) تستبدل الرافعة القديمة الآن بجديدة، وتبيع الجديدة بعد 5 سنوات بمبلغ [[S5|g]] دينار.
    - (ب) تحتفظ بالقديمة سنتين ثم تبيعها بمبلغ [[Sd2|g]] دينار، وتشتري جديدة للسنوات الثلاث الباقية، وتبيعها بمبلغ [[S3|g]] دينار.

    القديمة تباع اليوم بمبلغ [[M|g]] دينار، وتشغيلها [[Od|g]] دينار ثم [[Od+G|g]] دينار. الجديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار سنويا. الحد الأدنى [[i|%]]. أي الخيارين أرخص؟
  solution: |
    عندما تكون الحاجة لمدة محددة، لا نفترض أن الأصول تتكرر. نقارن القيمة الحالية للتكاليف خلال الفترة نفسها، ونضع قيمة البيع في نهايتها.

    **الخيار أ:**

    $$
    PW_a = [[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ 5) - [[S5|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pa|2]]
    $$

    **الخيار ب:** قيمة القديمة اليوم استثمار، لأن الشركة تتنازل عن بيعها.

    | السنة | 0 | 1 | 2 | 3 إلى 5 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | القديمة | [[M|0]] | [[Od|0]] | [[Od+G-Sd2|0]] | | |
    | الجديدة | | | [[C|0]] | [[Oc|0]] سنويا | [[-S3|0]] |

    $$
    PW_b = [[Pb|2]]
    $$

    الأرخص: الخيار [[pick(Pa <= Pb, 'أ، الاستبدال الآن', 'ب، تأجيل الاستبدال سنتين')]].

- id: c09-ex-overhaul
  kind: example
  title: |
    إصلاح شامل أم آلة جديدة؟
  vars: {M: 6000, X: 14000, Od: 7000, Sd: 2000, nd: 4, C: 42000, Oc: 3500, Sc: 6000, nc: 8, i: 0.10}
  random: {M: [2000, 12000, 500], X: [5000, 25000, 500], Od: [3000, 12000, 500], Sd: [0, 4000, 500], nd: [3, 6, 1], C: [25000, 70000, 1000], Oc: [1500, 6000, 500], Sc: [0, 10000, 500], nc: [6, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = (M + X)*AP(i, nd) - Sd*AF(i, nd) + Od
    - Ac = C*AP(i, nc) - Sc*AF(i, nc) + Oc
  text: |
    آلة ضغط قديمة تباع اليوم بمبلغ [[M|g]] دينار. لتبقى تعمل، تحتاج إصلاحا شاملا يكلف [[X|g]] دينار، فتخدم بعده [[yrs(nd)]] بتشغيل [[Od|g]] دينار سنويا، ثم تباع بمبلغ [[Sd|g]] دينار. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وعمرها الاقتصادي [[yrs(nc)]]، وتباع بعده بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. ماذا تختار الشركة؟
  solution: |
    الإصلاح الشامل استثمار جديد في المدافع. يضاف إلى قيمته السوقية:

    $$
    AW_d = ([[M|g]] + [[X|g]])\,(A/P,\ [[i|%]],\ [[nd|n]]) - [[Sd|g]]\,(A/F,\ [[i|%]],\ [[nd|n]]) + [[Od|g]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[nc|n]]) - [[Sc|g]]\,(A/F,\ [[i|%]],\ [[nc|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    الأرخص: [[pick(Ad <= Ac, 'الإصلاح الشامل', 'الآلة الجديدة')]].

- id: c09-ex-retire
  kind: example
  title: |
    إيقاف أصل بدون استبدال
  vars: {M0: 18000, M1: 14000, R: 9000, O: 3500, i: 0.10}
  random: {M0: [5000, 40000, 500], R: [2000, 20000, 500], O: [1000, 10000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - M1 = floor(M0*0.78/100)*100
    - K = M0*(1 + i) - M1
    - N = R - O - K
  text: |
    شاحنة قديمة تؤجرها شركة لمقاول. قيمتها السوقية اليوم [[M0|g]] دينار، وبعد سنة [[M1|g]] دينار. إيجارها في السنة القادمة [[R|g]] دينار، وتكاليفها [[O|g]] دينار. الحد الأدنى [[i|%]]. هل تحتفظ الشركة بها سنة أخرى، أم تبيعها الآن؟ لا نية لشراء بديل.
  solution: |
    إذا بيعت الآن، تأخذ الشركة [[M0|g]] دينار، ويكسب المال [[i|%]]، فيصبح بعد سنة:

    $$
    [[M0|g]] \times (1 + [[i|r]]) = [[M0*(1+i)|2]]
    $$

    إذا احتفظت بها، تأخذ بعد سنة صافي الإيجار والقيمة السوقية:

    $$
    [[R|g]] - [[O|g]] + [[M1|g]] = [[R-O+M1|2]]
    $$

    الفرق [[N|2]] دينار. [[pick(N >= 0, 'الاحتفاظ سنة أخرى أفضل.', 'البيع الآن أفضل.')]] نكرر نفس السؤال في نهاية كل سنة.

# ------------------------------------------------------------ after tax
- id: c09-ex-tax
  kind: example
  title: |
    الاستبدال بعد الضريبة
  vars: {B: 15000, M: 9000, Od: 12000, C: 40000, Oc: 5000, n: 5, t: 0.20, i: 0.10}
  random: {B: [4000, 30000, 1000], M: [2000, 25000, 1000], Od: [6000, 20000, 500], C: [20000, 70000, 1000], Oc: [2000, 9000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - NS = M - t*(M - B)
    - Ad = NS*AP(i, n) + Od*(1 - t) - t*B/n
    - Ac = C*AP(i, n) + Oc*(1 - t) - t*C/n
  text: |
    آلة قديمة قيمتها الدفترية [[B|g]] دينار، وتباع اليوم بمبلغ [[M|g]] دينار. تشغيلها [[Od|g]] دينار سنويا. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار. كلتاهما تخدم [[yrs(n)]]، وتستهلك بالقسط الثابت إلى الصفر على هذه المدة، بدون قيمة بيع في النهاية. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. هل تستبدل الشركة؟
  solution: |
    **الخطوة 1: قيمة المدافع بعد الضريبة.** إذا بيعت القديمة اليوم، تدفع الشركة ضريبة على الربح، أو توفر ضريبة على الخسارة:

    $$
    [[M|g]] - [[t|r]]\,([[M|g]] - [[B|g]]) = [[NS|2]]
    $$

    الاحتفاظ بها يعني التنازل عن هذا المبلغ، فهو استثمار المدافع.

    **الخطوة 2: الاستهلاك.** القديمة تستمر في الاستهلاك على قيمتها الدفترية، [[B/n|2]] دينار سنويا. الجديدة على ثمنها، [[C/n|2]] دينار.

    **الخطوة 3: القيمة السنوية بعد الضريبة.**

    $$
    AW_d = [[NS|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[B/n|2]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oc|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[C/n|2]] = [[Ac|2]]
    $$

    [[pick(Ac < Ad, 'الجديدة أرخص بعد الضريبة، فتستبدل الشركة.', 'القديمة أرخص بعد الضريبة، فتحتفظ بها الشركة.')]]
