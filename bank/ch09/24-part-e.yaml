items:

- id: c09-e-01
  kind: problem
  part: E
  vars: {M0: 10000, M1: 7500, O1: 8000, i: 0.10}
  random: {M0: [2000, 25000, 500], O1: [3000, 15000, 500], i: [0.06, 0.14, 0.01], M1: [1000, 20000, 100]}
  calc:
    - M1 = floor(M0*0.75/100)*100
    - mc = M0 - M1 + i*M0 + O1
  text: |
    آلة قديمة قيمتها السوقية اليوم [[M0|g]] دينار، وبعد سنة [[M1|g]] دينار. تشغيلها في السنة القادمة [[O1|g]] دينار. الحد الأدنى [[i|%]]. ما التكلفة الحدية للاحتفاظ بها سنة أخرى؟
  solution: |
    $$
    MC_1 = ([[M0|g]] - [[M1|g]]) + [[i|r]] \times [[M0|g]] + [[O1|g]] = [[mc|2]]
    $$

- id: c09-e-02
  kind: problem
  part: E
  vars: {M0: 10000, d: 0.25, O1: 7000, G: 1800, Ac: 12500, i: 0.10}
  random: {M0: [3000, 25000, 500], d: [0.15, 0.35, 0.01], O1: [3000, 12000, 500], G: [800, 3000, 100], i: [0.06, 0.14, 0.01], Ac: [6000, 25000, 500]}
  calc:
    - m1 = M0*(1 - d)
    - m2 = M0*(1 - d)**2
    - m3 = M0*(1 - d)**3
    - c1 = M0 - m1 + i*M0 + O1
    - c2 = m1 - m2 + i*m1 + O1 + G
    - c3 = m2 - m3 + i*m2 + O1 + 2*G
    - Ac = floor((c1 + c2)/2/100)*100
    - k = pick(c1 > Ac, 0, pick(c2 > Ac, 1, pick(c3 > Ac, 2, 3)))
  text: |
    مدافع قيمته السوقية [[M0|g]] دينار، وتنخفض [[d|%]] سنويا. تشغيله [[O1|g]] دينار في السنة القادمة، ويزيد [[G|g]] دينار سنويا. المتحدي قيمته السنوية عند عمره الاقتصادي [[Ac|g]] دينار. الحد الأدنى [[i|%]]. احسب التكلفة الحدية للسنوات الثلاث القادمة، وحدد متى تستبدل.
  solution: |
    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | القيمة في البداية | [[M0|0]] | [[m1|0]] | [[m2|0]] |
    | النقص في القيمة | [[M0-m1|0]] | [[m1-m2|0]] | [[m2-m3|0]] |
    | الفائدة | [[i*M0|0]] | [[i*m1|0]] | [[i*m2|0]] |
    | التشغيل | [[O1|0]] | [[O1+G|0]] | [[O1+2*G|0]] |
    | التكلفة الحدية | [[c1|0]] | [[c2|0]] | [[c3|0]] |

    [[pick(k == 0, 'التكلفة الحدية للسنة القادمة أعلى من المتحدي، فتستبدل الآن.', pick(k == 3, 'التكلفة الحدية أقل من المتحدي في السنوات الثلاث، فتحتفظ بالمدافع ثلاث سنوات على الأقل.', 'تحتفظ بالمدافع ' + yrs(k) + '، ثم تستبدله.'))]]

- id: c09-e-03
  kind: problem
  part: E
  text: |
    التكاليف الحدية لمدافع في السنوات القادمة: 9,800 ثم 11,200 ثم 12,900 ثم 14,700 دينار. أفضل متحد قيمته السنوية 12,400 دينار. متى تستبدل الشركة؟
  solution: |
    التكلفة الحدية أقل من 12,400 في السنتين الأولى والثانية، وأعلى منها في الثالثة. تحتفظ الشركة بالمدافع سنتين، ثم تستبدله.

- id: c09-e-04
  kind: problem
  part: E
  vars: {M0: 12000, M1: 9000, O1: 8000, i: 0.10}
  random: {M0: [2000, 25000, 500], O1: [3000, 15000, 500], i: [0.06, 0.14, 0.01], M1: [1000, 20000, 100]}
  calc:
    - M1 = floor(M0*0.72/100)*100
    - mc = M0 - M1 + i*M0 + O1
  text: |
    مدافع قيمته السوقية [[M0|g]] دينار، وبعد سنة [[M1|g]] دينار، وتشغيله في السنة القادمة [[O1|g]] دينار. الحد الأدنى [[i|%]]. ما أعلى قيمة سنوية لمتحد تجعل الاحتفاظ بالمدافع سنة أخرى أفضل؟
  solution: |
    نحتفظ إذا كانت التكلفة الحدية أقل من القيمة السنوية للمتحدي:

    $$
    MC_1 = ([[M0|g]] - [[M1|g]]) + [[i|r]] \times [[M0|g]] + [[O1|g]] = [[mc|2]]
    $$

    إذا كانت القيمة السنوية للمتحدي أعلى من [[mc|2]] دينار، نحتفظ بالمدافع سنة أخرى.

- id: c09-e-05
  kind: problem
  part: E
  vars: {M: 3000, O1: 6000, G: 1500, Ac: 10500, i: 0.10}
  random: {M: [500, 6000, 500], O1: [3000, 9000, 500], G: [700, 2500, 100], i: [0.06, 0.14, 0.01], Ac: [6000, 20000, 500]}
  calc:
    - c1 = i*M + O1
    - Ac = floor((c1 + 2.5*G)/100)*100
    - k = floor((Ac - c1)/G) + 1
  text: |
    آلة قديمة قيمتها السوقية [[M|g]] دينار كخردة، وستبقى نفس القيمة مهما طال الزمن. تشغيلها [[O1|g]] دينار في السنة القادمة، ويزيد [[G|g]] دينار سنويا. المتحدي قيمته السنوية [[Ac|g]] دينار. الحد الأدنى [[i|%]]. كم سنة تحتفظ بها الشركة؟
  solution: |
    القيمة لا تنخفض، فالتكلفة الحدية فائدة المال المحبوس والتشغيل فقط:

    $$
    MC_k = [[i|r]] \times [[M|g]] + [[O1|g]] + [[G|g]]\,(k - 1)
    $$

    السنة الأولى [[c1|2]] دينار، وتزيد [[G|g]] دينار كل سنة. نحتفظ ما دامت أقل من [[Ac|g]] دينار:

    $$
    [[c1|2]] + [[G|g]]\,(k - 1) \le [[Ac|g]]
    $$

    تحتفظ الشركة بالآلة [[yrs(k)]]، ثم تستبدلها.

- id: c09-e-06
  kind: problem
  part: E
  calc:
    - mc1 = 10000 - 6000 + 0.10*10000 + 7000
    - mc2 = 6000 - 5500 + 0.10*6000 + 7500
    - mc3 = 5500 - 5000 + 0.10*5500 + 8000
    - aw = NPV(0.10, [0, mc1, mc2, mc3])*AP(0.10, 3)
  text: |
    مدافع قيمته السوقية 10,000 دينار، وبعد سنة 6,000، ثم 5,500، ثم 5,000 دينار. تشغيله 7,000 ثم 7,500 ثم 8,000 دينار. المتحدي قيمته السنوية 10,000 دينار. الحد الأدنى 10%. احسب التكاليف الحدية. لماذا لا يكفي مقارنة السنة الأولى وحدها هنا؟
  solution: |
    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | التكلفة الحدية | [[mc1|0]] | [[mc2|0]] | [[mc3|0]] |

    التكلفة الحدية للسنة الأولى [[mc1|0]] دينار، أعلى من المتحدي، لأن الآلة تفقد جزءا كبيرا من قيمتها فيها. لكنها تنخفض في السنوات التالية. القاعدة البسيطة تعمل فقط عندما تكون التكاليف الحدية متزايدة.

    هنا نحسب القيمة السنوية للمدافع على السنوات الثلاث:

    $$
    AW_d = [[aw|2]]
    $$

    [[pick(aw < 10000, 'أقل من المتحدي، فتحتفظ الشركة بالمدافع.', 'أعلى من المتحدي، فتستبدل الشركة الآن.')]]

- id: c09-e-07
  kind: problem
  part: E
  vars: {mc: 11000, Ac: 12000, i: 0.10}
  random: {mc: [5000, 20000, 500], Ac: [5000, 20000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Ac = pick(Ac == mc, Ac + 500, Ac)
    - Pn = Ac/i
    - Pw = (mc + Ac/i)/(1 + i)
  text: |
    التكلفة الحدية للمدافع في السنة القادمة [[mc|g]] دينار. المتحدي قيمته السنوية [[Ac|g]] دينار، ويتكرر بلا نهاية. الحد الأدنى [[i|%]]. قارن القيمة الحالية للاستبدال الآن، وللاستبدال بعد سنة.
  solution: |
    **الآن:** سلسلة دائمة من القيمة السنوية للمتحدي:

    $$
    PW = \frac{[[Ac|g]]}{[[i|r]]} = [[Pn|2]]
    $$

    **بعد سنة:** التكلفة الحدية في السنة 1، ثم السلسلة الدائمة تبدأ بعدها:

    $$
    PW = \frac{[[mc|g]] + [[Ac|g]] / [[i|r]]}{1 + [[i|r]]} = [[Pw|2]]
    $$

    الأرخص: [[pick(Pw < Pn, 'التأجيل سنة', 'الاستبدال الآن')]]. النتيجة نفسها لو قارنا التكلفة الحدية بالقيمة السنوية مباشرة، وهذا سبب القاعدة.

- id: c09-e-08
  kind: problem
  part: E
  vars: {M0: 9000, d: 0.2, O1: 7000, X: 6000, i: 0.10}
  random: {M0: [3000, 20000, 500], d: [0.15, 0.30, 0.01], O1: [3000, 12000, 500], X: [2000, 12000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - m1 = M0*(1 - d)
    - m2 = M0*(1 - d)**2
    - c1 = M0 - m1 + i*M0 + O1
    - c2 = m1 - m2 + i*m1 + O1 + X
  text: |
    مدافع قيمته السوقية [[M0|g]] دينار، وتنخفض [[d|%]] سنويا. تشغيله [[O1|g]] دينار سنويا، وفي السنة الثانية يحتاج إصلاحا يكلف [[X|g]] دينار. الحد الأدنى [[i|%]]. احسب التكلفة الحدية للسنتين القادمتين.
  solution: |
    $$
    MC_1 = ([[M0|g]] - [[m1|2]]) + [[i|r]] \times [[M0|g]] + [[O1|g]] = [[c1|2]]
    $$

    $$
    MC_2 = ([[m1|2]] - [[m2|2]]) + [[i|r]] \times [[m1|2]] + [[O1|g]] + [[X|g]] = [[c2|2]]
    $$

    الإصلاح يجعل السنة الثانية مكلفة. إذا كانت التكلفة الحدية للأولى أقل من المتحدي وللثانية أعلى، فالاستبدال بعد سنة واحدة يتجنب الإصلاح.

- id: c09-e-09
  kind: problem
  part: E
  vars: {mc: 12000, A1: 12500, A2: 11000, i: 0.10}
  random: {mc: [6000, 20000, 500], A1: [6000, 20000, 500], i: [0.06, 0.14, 0.01], A2: [5000, 20000, 500]}
  calc:
    - A2 = floor(A1*0.9/100)*100
    - Pn = A1/i
    - Pw = (mc + A2/i)/(1 + i)
  text: |
    التكلفة الحدية لمدافع في السنة القادمة [[mc|g]] دينار. متحد اليوم قيمته السنوية [[A1|g]] دينار. يتوقع أن ينزل بعد سنة طراز أحدث قيمته السنوية [[A2|g]] دينار. كل متحد يتكرر بلا نهاية. الحد الأدنى [[i|%]]. هل تستبدل الشركة الآن، أم تنتظر الطراز الأحدث؟
  solution: |
    **الآن:**

    $$
    PW = \frac{[[A1|g]]}{[[i|r]]} = [[Pn|2]]
    $$

    **الانتظار سنة ثم الطراز الأحدث:**

    $$
    PW = \frac{[[mc|g]] + [[A2|g]] / [[i|r]]}{1 + [[i|r]]} = [[Pw|2]]
    $$

    الأرخص: [[pick(Pw < Pn, 'الانتظار', 'الاستبدال الآن')]]. [[pick(mc > A1, 'المدافع أغلى من متحدي اليوم للسنة القادمة، ومع ذلك قد يستحق الانتظار، لأن الطراز الأحدث يوفر كل سنة بعدها.', 'المدافع أرخص من متحدي اليوم للسنة القادمة.')]]

- id: c09-e-10
  kind: problem
  part: E
  vars: {O1: 8000, G: 2000, Ac: 13500}
  random: {O1: [3000, 12000, 500], G: [800, 3000, 100], Ac: [8000, 25000, 500]}
  calc:
    - Ac = O1 + floor(2.6*G/100)*100
    - k = floor((Ac - O1)/G) + 1
  text: |
    آلة قديمة لا قيمة لها في السوق. تشغيلها [[O1|g]] دينار في السنة القادمة، ويزيد [[G|g]] دينار سنويا. المتحدي قيمته السنوية [[Ac|g]] دينار. كم سنة تحتفظ بها الشركة؟
  solution: |
    لا قيمة سوقية، فلا نقص في القيمة ولا فائدة محبوسة. التكلفة الحدية هي التشغيل فقط:

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | التكلفة الحدية | [[O1|0]] | [[O1+G|0]] | [[O1+2*G|0]] | [[O1+3*G|0]] |

    تحتفظ بها ما دام التشغيل أقل من [[Ac|g]] دينار، أي [[yrs(k)]].

- id: c09-e-11
  kind: problem
  part: E
  vars: {M0: 15000, d: 0.2, O1: 6000, G: 1500, i: 0.12}
  random: {M0: [3000, 30000, 500], d: [0.10, 0.30, 0.01], O1: [3000, 12000, 500], G: [500, 3000, 100], i: [0.06, 0.14, 0.01]}
  calc:
    - m1 = M0*(1 - d)
    - c1 = M0 - m1 + i*M0 + O1
  text: |
    مدافع قيمته السوقية [[M0|g]] دينار، وتنخفض [[d|%]] سنويا. تشغيله [[O1|g]] دينار في السنة القادمة. الحد الأدنى [[i|%]]. ما نسبة كل جزء من التكلفة الحدية للسنة القادمة؟
  solution: |
    | الجزء | المبلغ | النسبة |
    | --- | --- | --- |
    | النقص في القيمة | [[M0-m1|2]] | [[(M0-m1)/c1|%2]] |
    | الفائدة المحبوسة | [[i*M0|2]] | [[i*M0/c1|%2]] |
    | التشغيل | [[O1|2]] | [[O1/c1|%2]] |
    | المجموع | [[c1|2]] | 100% |

    الفائدة المحبوسة تكلفة حقيقية لا تظهر في أي فاتورة، لكنها ما تخسره الشركة لعدم بيع الآلة واستثمار ثمنها.

- id: c09-e-12
  kind: problem
  part: E
  vars: {M0: 8000, M1: 6000, O1: 9000, Ac: 12000, i: 0.10}
  random: {M0: [2000, 20000, 500], O1: [4000, 15000, 500], i: [0.06, 0.14, 0.01], Ac: [6000, 25000, 500], M1: [1000, 20000, 100]}
  calc:
    - M1 = floor(M0*0.75/100)*100
    - mc = M0 - M1 + i*M0 + O1
    - Ac = pick(abs(Ac - mc) < 200, Ac + 600, Ac)
  text: |
    مدافع قيمته اليوم [[M0|g]] دينار، وبعد سنة [[M1|g]] دينار، وتشغيله [[O1|g]] دينار. المتحدي قيمته السنوية [[Ac|g]] دينار. الحد الأدنى [[i|%]]. هل تحتفظ الشركة بالمدافع هذه السنة؟
  solution: |
    $$
    MC_1 = ([[M0|g]] - [[M1|g]]) + [[i|r]] \times [[M0|g]] + [[O1|g]] = [[mc|2]]
    $$

    [[pick(mc < Ac, 'أقل من المتحدي، فتحتفظ به سنة، وتعيد الحساب في نهايتها.', 'أعلى من المتحدي، فتستبدله الآن.')]]
