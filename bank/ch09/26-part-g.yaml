items:

- id: c09-g-01
  kind: problem
  part: G
  vars: {B: 12000, M: 8000, t: 0.20}
  random: {B: [3000, 30000, 1000], M: [1000, 35000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - NS = M - t*(M - B)
  text: |
    مدافع قيمته الدفترية [[B|g]] دينار، وسعره في السوق [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما قيمته في تحليل الاستبدال بعد الضريبة؟
  solution: |
    $$
    [[M|g]] - [[t|r]]\,([[M|g]] - [[B|g]]) = [[NS|2]]
    $$

    [[pick(M >= B, 'البيع فوق القيمة الدفترية، فقيمته بعد الضريبة أقل من سعره.', 'البيع تحت القيمة الدفترية، فقيمته بعد الضريبة أعلى من سعره.')]]

- id: c09-g-02
  kind: problem
  part: G
  vars: {Od: 10000, Oc: 4000, t: 0.20}
  random: {Od: [5000, 20000, 500], Oc: [1000, 8000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - S = (Od - Oc)*(1 - t)
  text: |
    تشغيل المدافع [[Od|g]] دينار، والمتحدي [[Oc|g]] دينار. نسبة الضريبة [[t|%]]. ما الوفر السنوي في التشغيل بعد الضريبة؟
  solution: |
    $$
    ([[Od|g]] - [[Oc|g]])(1 - [[t|r]]) = [[S|2]]
    $$

- id: c09-g-03
  kind: problem
  part: G
  vars: {Bd: 12000, C: 40000, n: 4, t: 0.20}
  random: {Bd: [2000, 25000, 1000], C: [20000, 70000, 1000], n: [3, 8, 1], t: [0.15, 0.30, 0.01]}
  calc:
    - Dd = Bd/n
    - Dc = C/n
    - x = t*(Dc - Dd)
  text: |
    المدافع قيمته الدفترية [[Bd|g]] دينار، والمتحدي ثمنه [[C|g]] دينار. كلاهما يستهلك بالقسط الثابت إلى الصفر على [[yrs(n)]]. نسبة الضريبة [[t|%]]. ما الوفر الضريبي الإضافي سنويا إذا استبدلت الشركة؟
  solution: |
    $$
    D_d = [[Dd|2]], \qquad D_c = [[Dc|2]]
    $$

    $$
    [[t|r]] \times ([[Dc|2]] - [[Dd|2]]) = [[x|2]]
    $$

- id: c09-g-04
  kind: problem
  part: G
  vars: {B: 15000, M: 9000, Od: 12000, C: 40000, Oc: 5000, n: 5, t: 0.20, i: 0.10}
  random: {B: [4000, 30000, 1000], M: [2000, 25000, 1000], Od: [6000, 20000, 500], C: [20000, 70000, 1000], Oc: [2000, 9000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - NS = M - t*(M - B)
    - Ad = NS*AP(i, n) + Od*(1 - t) - t*B/n
    - Ac = C*AP(i, n) + Oc*(1 - t) - t*C/n
  text: |
    مدافع قيمته الدفترية [[B|g]] دينار، وسعره السوقي [[M|g]] دينار، وتشغيله [[Od|g]] دينار. متحد ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار. كلاهما يخدم [[yrs(n)]] ويستهلك بالقسط الثابت إلى الصفر، بدون قيمة بيع في النهاية. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. قارن بعد الضريبة.
  solution: |
    قيمة المدافع بعد الضريبة [[NS|2]] دينار.

    $$
    AW_d = [[NS|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[B/n|2]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oc|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[C/n|2]] = [[Ac|2]]
    $$

    [[pick(Ac < Ad, 'تستبدل', 'تحتفظ بالمدافع')]].

- id: c09-g-05
  kind: problem
  part: G
  vars: {B: 15000, M: 9000, Od: 12000, C: 40000, Oc: 5000, n: 5, t: 0.20, i: 0.10}
  random: {B: [4000, 30000, 1000], M: [2000, 25000, 1000], Od: [6000, 20000, 500], C: [20000, 70000, 1000], Oc: [2000, 9000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - NS = M - t*(M - B)
    - c0 = -(C - NS)
    - cf = (Od - Oc)*(1 - t) + t*(C - B)/n
    - P = c0 + cf*PA(i, n)
  text: |
    للبيانات السابقة، حلل القرار بالتدفقات التفاضلية: ما الذي يتغير في تدفقات الشركة إذا استبدلت؟ المدافع قيمته الدفترية [[B|g]] دينار، وسعره [[M|g]] دينار، وتشغيله [[Od|g]] دينار. المتحدي ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار. المدة [[yrs(n)]]، والضريبة [[t|%]]، والحد الأدنى [[i|%]].
  solution: |
    في السنة 0 تدفع ثمن الجديدة، وتقبض صافي بيع القديمة:

    $$
    CF_0 = -[[C|g]] + [[NS|2]] = [[c0|2]]
    $$

    كل سنة: وفر التشغيل بعد الضريبة، وزيادة الوفر الضريبي من الاستهلاك:

    $$
    CF = ([[Od|g]] - [[Oc|g]])(1 - [[t|r]]) + [[t|r]] \times \frac{[[C|g]] - [[B|g]]}{[[n|n]]} = [[cf|2]]
    $$

    $$
    PW = [[P|2]]
    $$

    [[pick(P >= 0, 'موجب، فالاستبدال مجد.', 'سالب، فالاستبدال غير مجد.')]] النتيجة نفس المقارنة بالقيمة السنوية، بطريقة أخرى.

- id: c09-g-06
  kind: problem
  part: G
  vars: {B: 10000, M: 4000, t: 0.25}
  random: {B: [5000, 30000, 1000], M: [500, 20000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - M = min(M, B - 1000)
    - L = B - M
    - T = t*L
  text: |
    شركة تتردد في بيع آلة قيمتها الدفترية [[B|g]] دينار بمبلغ [[M|g]] دينار، لأنها ستسجل خسارة. نسبة الضريبة [[t|%]]. ما أثر الخسارة على الضريبة؟
  solution: |
    الخسارة الدفترية [[L|g]] دينار تخفض الدخل الخاضع، فتوفر:

    $$
    [[t|r]] \times [[L|g]] = [[T|2]]
    $$

    الخسارة لا تعني خروج مال الآن، بل العكس: البيع يحقق وفرا ضريبيا اليوم بدل أن يتوزع الاستهلاك على السنوات القادمة.

- id: c09-g-07
  kind: problem
  part: G
  vars: {B: 12000, M: 7000, n: 4, t: 0.20, i: 0.10}
  random: {B: [4000, 30000, 1000], M: [1000, 25000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - NS = M - t*(M - B)
    - Pk = t*B/n*PA(i, n)
  text: |
    مدافع قيمته الدفترية [[B|g]] دينار، ويستهلك بالقسط الثابت إلى الصفر على [[yrs(n)]] الباقية. سعره اليوم [[M|g]] دينار. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. قارن ما تحصل عليه الشركة من البيع اليوم بالقيمة الحالية للوفر الضريبي من استهلاكه إذا احتفظت به.
  solution: |
    البيع اليوم يعطي:

    $$
    [[NS|2]]
    $$

    الاحتفاظ يعطي وفرا ضريبيا من الاستهلاك:

    $$
    [[t|r]] \times [[B/n|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pk|2]]
    $$

    لكن الاحتفاظ يعني أيضا تكاليف التشغيل. هذه المقارنة تبين فقط لماذا يدخل الاستهلاك في تحليل المدافع بعد الضريبة.

- id: c09-g-08
  kind: problem
  part: G
  vars: {C: 40000, Oc: 5000, Od: 12000, B: 15000, n: 5, t: 0.20, i: 0.10}
  random: {C: [20000, 70000, 1000], Oc: [2000, 9000, 500], Od: [6000, 20000, 500], B: [4000, 30000, 1000], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Ac = C*AP(i, n) + Oc*(1 - t) - t*C/n
    - k = AP(i, n)*(1 - t)
    - Mx = (Ac - Od*(1 - t) + t*B/n - t*B*AP(i, n))/k
  text: |
    متحد ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار. مدافع قيمته الدفترية [[B|g]] دينار، وتشغيله [[Od|g]] دينار. كلاهما يخدم [[yrs(n)]] ويستهلك بالقسط الثابت إلى الصفر. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما سعر المدافع في السوق الذي يجعل الشركة لا تفرق بين الخيارين؟
  solution: |
    القيمة السنوية للمتحدي:

    $$
    AW_c = [[Ac|2]]
    $$

    للمدافع، صافي البيع يساوي السعر ناقص الضريبة على الفرق عن القيمة الدفترية:

    $$
    \left(M - [[t|r]]\,(M - [[B|g]])\right)(A/P) + [[Od|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[B/n|2]] = [[Ac|2]]
    $$

    نحل لـ M:

    $$
    M = [[Mx|2]]
    $$

    [[pick(Mx < 0, 'القيمة سالبة: المتحدي أفضل مهما كان سعر المدافع.', 'إذا كان سعر المدافع أعلى من هذا، فبيعه واستبداله أفضل.')]]

- id: c09-g-09
  kind: problem
  part: G
  vars: {M: 9000, Od: 11000, Sd: 2000, nd: 3, C: 36000, Oc: 4000, nc: 6, t: 0.20, i: 0.10}
  random: {M: [3000, 18000, 500], Od: [6000, 16000, 500], nd: [2, 4, 1], C: [20000, 60000, 1000], Oc: [1500, 7000, 500], nc: [5, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd = floor(M*0.3/100)*100
    - Ad = M*(1 - t)*AP(i, nd) - Sd*(1 - t)*AF(i, nd) + Od*(1 - t)
    - Ac = C*AP(i, nc) + Oc*(1 - t) - t*C/nc
  text: |
    مدافع استهلك بالكامل، فقيمته الدفترية صفر. سعره اليوم [[M|g]] دينار، ويخدم [[yrs(nd)]] بتشغيل [[Od|g]] دينار، ثم يباع بمبلغ [[Sd|g]] دينار. متحد ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار، ويستهلك بالقسط الثابت إلى الصفر على عمره الاقتصادي [[yrs(nc)]]، بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. قارن.
  solution: |
    القيمة الدفترية صفر، فكل سعر البيع ربح خاضع. بيعه اليوم يعطي [[M*(1-t)|2]] دينار بعد الضريبة، وهذه قيمته في التحليل. ولا استهلاك له في المستقبل.

    $$
    AW_d = [[M*(1-t)|2]]\,(A/P,\ [[i|%]],\ [[nd|n]]) - [[Sd*(1-t)|2]]\,(A/F,\ [[i|%]],\ [[nd|n]]) + [[Od|g]]\,(1 - [[t|r]]) = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[nc|n]]) + [[Oc|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[C/nc|2]] = [[Ac|2]]
    $$

    [[pick(Ac < Ad, 'تستبدل', 'تحتفظ بالمدافع')]].

- id: c09-g-10
  kind: problem
  part: G
  vars: {B: 15000, M: 9000, Od: 12000, C: 40000, Oc: 5000, n: 5, i: 0.10}
  random: {B: [4000, 30000, 1000], M: [2000, 25000, 1000], Od: [6000, 20000, 500], C: [20000, 70000, 1000], Oc: [2000, 9000, 500], n: [3, 8, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - d0 = M*AP(i, n) + Od - (C*AP(i, n) + Oc)
    - d1 = (M - 0.25*(M - B))*AP(i, n) + Od*0.75 - 0.25*B/n - (C*AP(i, n) + Oc*0.75 - 0.25*C/n)
  text: |
    مدافع قيمته الدفترية [[B|g]] دينار، وسعره [[M|g]] دينار، وتشغيله [[Od|g]] دينار. متحد ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار. كلاهما يخدم [[yrs(n)]] ويستهلك بالقسط الثابت إلى الصفر. الحد الأدنى [[i|%]]. احسب ميزة الاستبدال السنوية بدون ضريبة، ثم بضريبة 25%.
  solution: |
    الميزة هي القيمة السنوية للمدافع ناقص القيمة السنوية للمتحدي:

    | | بدون ضريبة | بضريبة 25% |
    | --- | --- | --- |
    | ميزة الاستبدال | [[d0|2]] | [[d1|2]] |

    [[pick((d0 > 0) == (d1 > 0), 'القرار نفسه في الحالتين، لكن الضريبة غيرت حجم الميزة.', 'الضريبة قلبت القرار.')]] الضريبة تأخذ ربع وفر التشغيل، وتعيد جزءا من الثمن عبر الاستهلاك، وتغير قيمة بيع المدافع.
