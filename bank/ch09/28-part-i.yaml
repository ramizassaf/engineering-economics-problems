items:

- id: c09-i-01
  kind: mcq
  part: I
  vars: {P0: 50000, B: 20000, M: 12000, T: 16000}
  random: {P0: [30000, 90000, 1000], M: [3000, 20000, 500], T: [21000, 30000, 500]}
  calc:
    - B = floor(P0*0.4/1000)*1000
    - M = min(M, B - 2000)
    - T = min(max(T, B + 1000), P0 - 2000)
  text: |
    آلة ثمنها الأصلي [[P0|g]] دينار، وقيمتها الدفترية [[B|g]] دينار، وسعرها في السوق [[M|g]] دينار. وكيل يعرض [[T|g]] دينار لها مقابل شراء آلة جديدة منه. ما قيمة المدافع في التحليل؟
  options: ["[[P0|g]]", "[[B|g]]", "[[M|g]]", "[[T|g]]"]
  correct: 2
  solution: |
    القيمة السوقية. الثمن الأصلي غارق، والقيمة الدفترية محاسبية، وعرض الوكيل مرتبط بسعر الجديدة.

- id: c09-i-02
  kind: mcq
  part: I
  text: |
    أي العبارات تصف العمر الاقتصادي؟
  options: ["أطول مدة تعمل فيها الآلة", "المدة التي تعطي أقل قيمة سنوية للتكاليف", "العمر الضريبي للاستهلاك", "المدة حتى تصبح القيمة الدفترية صفرا"]
  correct: 1
  solution: |
    العمر الاقتصادي يوازن بين انخفاض تكلفة رأس المال السنوية وارتفاع التشغيل مع العمر.

- id: c09-i-03
  kind: mcq
  part: I
  vars: {M0: 10000, M1: 7000, O: 6000, i: 0.10}
  random: {M0: [3000, 20000, 500], O: [3000, 12000, 500], i: [0.06, 0.14, 0.01], M1: [1000, 15000, 100]}
  calc:
    - M1 = floor(M0*0.7/100)*100
    - mc = M0 - M1 + i*M0 + O
    - w1 = M0 - M1 + O
    - w2 = i*M0 + O
    - w3 = M0 + O
  text: |
    مدافع قيمته اليوم [[M0|g]] دينار، وبعد سنة [[M1|g]] دينار، وتشغيله [[O|g]] دينار. الحد الأدنى [[i|%]]. ما التكلفة الحدية للسنة القادمة؟
  options: ["[[w1|g]]", "[[w2|g]]", "[[mc|g]]", "[[w3|g]]"]
  correct: 2
  solution: |
    $$
    ([[M0|g]] - [[M1|g]]) + [[i|r]] \times [[M0|g]] + [[O|g]] = [[mc|g]]
    $$

    الخيار (أ) نسي الفائدة المحبوسة. الخيار (ب) نسي النقص في القيمة. الخيار (د) حمل السنة كل قيمة الآلة.

- id: c09-i-04
  kind: mcq
  part: I
  text: |
    التكلفة الحدية للمدافع في السنة القادمة 11,000 دينار، والقيمة السنوية لأفضل متحد 12,500 دينار. التكاليف الحدية للمدافع تزيد كل سنة. ماذا تفعل الشركة؟
  options: ["تستبدل الآن", "تحتفظ به سنة وتعيد الحساب", "تحتفظ به حتى نهاية عمره الفني", "تحتاج عمر المتحدي"]
  correct: 1
  solution: |
    التكلفة الحدية أقل من المتحدي، فالاحتفاظ سنة أرخص. في نهايتها نحسب التكلفة الحدية للسنة التالية.

- id: c09-i-05
  kind: mcq
  part: I
  text: |
    مدافع وقيمته الدفترية أعلى من سعره في السوق. بعد الضريبة، قيمته في التحليل:
  options: ["أقل من سعره", "تساوي سعره", "أعلى من سعره", "تساوي قيمته الدفترية"]
  correct: 2
  solution: |
    البيع بخسارة يوفر ضريبة، فصافي البيع أعلى من السعر.

- id: c09-i-06
  kind: mcq
  part: I
  text: |
    الخدمة مطلوبة 3 سنوات فقط. المتحدي عمره الاقتصادي 8 سنوات. كيف تقارن؟
  options: ["القيمة السنوية للمتحدي على 8 سنوات", "القيمة الحالية خلال 3 سنوات، مع قيمة بيع المتحدي بعدها", "القيمة الحالية على 8 سنوات للخيارين", "فترة الاسترداد"]
  correct: 1
  solution: |
    الحاجة محددة، فلا نفترض التكرار. نقيم الخيارين خلال 3 سنوات، ونضع قيمة بيع المتحدي في النهاية.

- id: c09-i-07
  kind: mcq
  part: I
  vars: {M: 6000, X: 9000, Od: 5000, n: 4, i: 0.10}
  random: {M: [2000, 12000, 500], X: [3000, 15000, 500], Od: [2000, 9000, 500], n: [3, 6, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - X = pick(X == M, X + 500, X)
    - A = (M + X)*AP(i, n) + Od
    - w1 = X*AP(i, n) + Od
    - w2 = M*AP(i, n) + Od
    - w3 = (M + X)/n + Od
  text: |
    مدافع سعره [[M|g]] دينار. بعد إصلاح يكلف [[X|g]] دينار يخدم [[yrs(n)]] بتشغيل [[Od|g]] دينار، بدون قيمة بيع. الحد الأدنى [[i|%]]. ما قيمته السنوية؟
  options: ["[[w1|2]]", "[[w2|2]]", "[[w3|2]]", "[[A|2]]"]
  correct: 3
  solution: |
    $$
    ([[M|g]] + [[X|g]])\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]] = [[A|2]]
    $$

    الخيار (أ) نسي سعر المدافع. الخيار (ب) نسي الإصلاح. الخيار (ج) تجاهل الفائدة.

- id: c09-i-08
  kind: mcq
  part: I
  text: |
    لماذا ترتفع القيمة السنوية لآلة إذا أبقيت بعد عمرها الاقتصادي؟
  options: ["لأن الاستهلاك يزيد", "لأن التشغيل يرتفع أسرع من انخفاض تكلفة رأس المال", "لأن الفائدة ترتفع", "لأن قيمة البيع ترتفع"]
  correct: 1
  solution: |
    بعد العمر الاقتصادي، كل سنة إضافية تضيف تشغيلا أكثر مما توفره من توزيع الثمن.

- id: c09-i-09
  kind: mcq
  part: I
  text: |
    مدير قال: "دفعنا 80,000 دينار في هذه الآلة، ولا يمكن أن نبيعها بعشرين ألفا." ما الخطأ؟
  options: ["لا خطأ، فالبيع يحقق خسارة", "يتأثر بالتكلفة الغارقة", "ينسى الضريبة", "يستخدم حدا أدنى خاطئا"]
  correct: 1
  solution: |
    الثمن المدفوع لا يعود بأي قرار. السؤال الوحيد: أي خيار أرخص من اليوم فصاعدا؟

- id: c09-i-10
  kind: mcq
  part: I
  vars: {mc: 11000, Ac: 12000, i: 0.10}
  random: {mc: [6000, 18000, 500], Ac: [6000, 18000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Ac = pick(Ac == mc, Ac + 1000, Ac)
    - Pn = Ac/i
    - Pw = (mc + Ac/i)/(1 + i)
  text: |
    التكلفة الحدية للمدافع في السنة القادمة [[mc|g]] دينار، والقيمة السنوية للمتحدي [[Ac|g]] دينار، ويتكرر بلا نهاية. الحد الأدنى [[i|%]]. ما القيمة الحالية للتكاليف إذا أجلت الشركة الاستبدال سنة؟
  options: ["[[Pn|2]]", "[[Pw|2]]", "[[mc/i|2]]", "[[(mc + Ac)/(1 + i)|2]]"]
  correct: 1
  solution: |
    $$
    \frac{[[mc|g]] + [[Ac|g]] / [[i|r]]}{1 + [[i|r]]} = [[Pw|2]]
    $$

    الخيار (أ) قيمة الاستبدال الآن. الخيار (د) نسي أن المتحدي يتكرر بلا نهاية.
