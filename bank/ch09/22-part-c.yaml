items:

- id: c09-c-01
  kind: problem
  part: C
  vars: {M: 8000, Od: 10000, n: 4, C: 30000, Oc: 4000, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 15000, 500], n: [3, 8, 1], C: [15000, 60000, 1000], Oc: [1500, 7000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = M*AP(i, n) + Od
    - Ac = C*AP(i, n) + Oc
  text: |
    آلة قديمة قيمتها السوقية [[M|g]] دينار، وتشغيلها [[Od|g]] دينار سنويا. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار. كلتاهما تخدم [[yrs(n)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. هل تستبدل الشركة؟
  solution: |
    $$
    AW_d = [[M|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    [[pick(Ac < Ad, 'تستبدل', 'تحتفظ بالقديمة')]].

- id: c09-c-02
  kind: problem
  part: C
  vars: {M: 8000, Od: 10000, Sd: 1500, nd: 3, C: 32000, Oc: 4000, Sc: 6000, nc: 7, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 15000, 500], Sd: [0, 4000, 500], nd: [2, 5, 1], C: [15000, 60000, 1000], Oc: [1500, 7000, 500], Sc: [0, 10000, 500], nc: [5, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd = min(Sd, M*0.5)
    - Ad = M*AP(i, nd) - Sd*AF(i, nd) + Od
    - Ac = C*AP(i, nc) - Sc*AF(i, nc) + Oc
  text: |
    المدافع: قيمته السوقية [[M|g]] دينار، وتشغيله [[Od|g]] دينار، ويخدم [[yrs(nd)]] ثم يباع بمبلغ [[Sd|g]] دينار. المتحدي: ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار، وعمره الاقتصادي [[yrs(nc)]] ثم يباع بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. قارن.
  solution: |
    $$
    AW_d = [[Ad|2]], \qquad AW_c = [[Ac|2]]
    $$

    حيث

    $$
    AW = P\,(A/P,\ i,\ n) - S\,(A/F,\ i,\ n) + O
    $$

    الأرخص: [[pick(Ac < Ad, 'المتحدي، فتستبدل الشركة الآن', 'المدافع، فتحتفظ به الشركة هذه السنة')]].

- id: c09-c-03
  kind: problem
  part: C
  vars: {M: 6000, Od: 12000, n: 5, Oc: 5000, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [6000, 20000, 500], n: [3, 10, 1], Oc: [1000, 5000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Cmax = M + (Od - Oc)*PA(i, n)
  text: |
    آلة قديمة قيمتها السوقية [[M|g]] دينار، وتشغيلها [[Od|g]] دينار سنويا لمدة [[yrs(n)]]. آلة جديدة تشغيلها [[Oc|g]] دينار لنفس المدة. لا قيمة بيع لأي منهما. الحد الأدنى [[i|%]]. ما أعلى ثمن للجديدة يجعل الاستبدال مجديا؟
  solution: |
    نساوي القيمة الحالية للتكاليف:

    $$
    C + [[Oc|g]]\,(P/A) = [[M|g]] + [[Od|g]]\,(P/A)
    $$

    $$
    C = [[M|g]] + ([[Od|g]] - [[Oc|g]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Cmax|2]]
    $$

- id: c09-c-04
  kind: problem
  part: C
  vars: {C: 30000, Oc: 4000, Od: 11000, n: 5, i: 0.10}
  random: {C: [15000, 60000, 1000], Oc: [1500, 6000, 500], Od: [6000, 18000, 500], n: [3, 10, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Mx = C - (Od - Oc)*PA(i, n)
  text: |
    آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار. القديمة تشغيلها [[Od|g]] دينار. كلتاهما تخدم [[yrs(n)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. ما القيمة السوقية للقديمة التي تجعل الشركة لا تفرق بين الخيارين؟
  solution: |
    $$
    M = [[C|g]] - ([[Od|g]] - [[Oc|g]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Mx|2]]
    $$

    [[pick(Mx <= 0, 'القيمة سالبة: الجديدة أفضل حتى لو كانت القديمة بلا قيمة.', 'إذا كانت القيمة السوقية للقديمة أقل من هذا الرقم، فالاحتفاظ بها أرخص.')]]

- id: c09-c-05
  kind: problem
  part: C
  vars: {M: 7000, Od: 9000, G: 1200, n: 4, C: 30000, Oc: 4500, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 14000, 500], G: [500, 3000, 100], n: [3, 6, 1], C: [15000, 60000, 1000], Oc: [1500, 7000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = M*AP(i, n) + Od + G*AG(i, n)
    - Ac = C*AP(i, n) + Oc
  text: |
    آلة قديمة قيمتها السوقية [[M|g]] دينار. تشغيلها [[Od|g]] دينار في السنة القادمة، ويزيد [[G|g]] دينار كل سنة. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها ثابت [[Oc|g]] دينار. كلتاهما تخدم [[yrs(n)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. قارن.
  solution: |
    $$
    AW_d = [[M|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ [[n|n]]) = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    الأرخص: [[pick(Ac < Ad, 'الجديدة', 'القديمة')]].

- id: c09-c-06
  kind: problem
  part: C
  vars: {M: 9000, Od: 8000, Qd: 4000, C: 40000, Oc: 6000, Qc: 5500, n: 6, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 14000, 500], Qd: [2000, 6000, 100], C: [20000, 70000, 1000], Oc: [3000, 10000, 500], n: [4, 10, 1], i: [0.06, 0.14, 0.01], Qc: [3000, 9000, 100]}
  calc:
    - Qc = floor(Qd*1.35/100)*100
    - Ad = M*AP(i, n) + Od
    - Ac = C*AP(i, n) + Oc
    - ud = Ad/Qd
    - uc = Ac/Qc
  text: |
    آلة قديمة تنتج [[Qd|g]] قطعة سنويا. قيمتها السوقية [[M|g]] دينار، وتشغيلها [[Od|g]] دينار. آلة جديدة أسرع، تنتج [[Qc|g]] قطعة سنويا، وثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار. كلتاهما تخدم [[yrs(n)]] بدون قيمة بيع، والمصنع يبيع كل ما ينتجه. الحد الأدنى [[i|%]]. قارن تكلفة القطعة.
  solution: |
    الآلتان تنتجان كميات مختلفة، فنقارن التكلفة لكل قطعة:

    $$
    \frac{AW_d}{Q_d} = \frac{[[Ad|2]]}{[[Qd|g]]} = [[ud|2]]
    $$

    $$
    \frac{AW_c}{Q_c} = \frac{[[Ac|2]]}{[[Qc|g]]} = [[uc|2]]
    $$

    الأرخص للقطعة: [[pick(uc < ud, 'الجديدة', 'القديمة')]].

- id: c09-c-07
  kind: problem
  part: C
  vars: {M: 6000, Od: 7000, Ca: 12000, Oa: 2500, C: 34000, Oc: 6000, n: 6, i: 0.10}
  random: {M: [2000, 15000, 500], Od: [4000, 12000, 500], Ca: [5000, 25000, 1000], Oa: [1000, 5000, 500], C: [20000, 60000, 1000], Oc: [3000, 12000, 500], n: [4, 10, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = (M + Ca)*AP(i, n) + Od + Oa
    - Ac = C*AP(i, n) + Oc
  text: |
    الطلب زاد، والآلة القديمة لا تكفي وحدها. الخيار الأول: الاحتفاظ بها وإضافة آلة صغيرة تكلف [[Ca|g]] دينار وتشغيلها [[Oa|g]] دينار. الخيار الثاني: بيع القديمة بمبلغ [[M|g]] دينار، وشراء آلة كبيرة تكفي وحدها بمبلغ [[C|g]] دينار وتشغيلها [[Oc|g]] دينار. تشغيل القديمة [[Od|g]] دينار. كل الآلات تخدم [[yrs(n)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. أيهما أرخص؟
  solution: |
    $$
    AW_1 = ([[M|g]] + [[Ca|g]])\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]] + [[Oa|g]] = [[Ad|2]]
    $$

    $$
    AW_2 = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    الأرخص: الخيار [[pick(Ad <= Ac, 'الأول', 'الثاني')]].

- id: c09-c-08
  kind: problem
  part: C
  vars: {M: 5000, Od: 6000, Sc: 1500, C: 28000, Oc: 3500, Sv: 2500, n: 6, i: 0.10}
  random: {M: [2000, 15000, 500], Od: [3000, 12000, 500], Sc: [500, 4000, 100], C: [15000, 50000, 1000], Oc: [1500, 7000, 500], Sv: [500, 6000, 100], n: [4, 10, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = M*AP(i, n) + Od + Sv
    - Ac = C*AP(i, n) + Oc
  text: |
    آلة قديمة قيمتها السوقية [[M|g]] دينار، وتشغيلها [[Od|g]] دينار، وتنتج تالفا يكلف [[Sv|g]] دينار سنويا. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وتالفها مهمل. كلتاهما تخدم [[yrs(n)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. قارن.
  solution: |
    التالف تكلفة سنوية مثل التشغيل:

    $$
    AW_d = [[M|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]] + [[Sv|g]] = [[Ad|2]]
    $$

    $$
    AW_c = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oc|g]] = [[Ac|2]]
    $$

    الأرخص: [[pick(Ac < Ad, 'الجديدة', 'القديمة')]]. كثيرا ما تكون تكاليف الجودة والتوقف أكبر من فرق التشغيل نفسه.

- id: c09-c-09
  kind: problem
  part: C
  vars: {M: 8000, Od: 9000, nd: 3, C: 30000, Oc: 4000, nc: 6, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 14000, 500], nd: [2, 3, 1], C: [15000, 60000, 1000], Oc: [1500, 7000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Pd = M + Od*PA(i, nd) + (C + Oc*PA(i, nc - nd))*PF(i, nd)
    - Pc = C + Oc*PA(i, nc)
  text: |
    المدافع: قيمته السوقية [[M|g]] دينار، وتشغيله [[Od|g]] دينار، ويخدم [[yrs(nd)]] بدون قيمة بيع. المتحدي: ثمنه [[C|g]] دينار، وتشغيله [[Oc|g]] دينار، ويخدم 6 سنوات بدون قيمة بيع. الحاجة 6 سنوات بالضبط. إذا احتفظت الشركة بالمدافع، تشتري متحديا بنفس المواصفات بعده، ويعمل حتى نهاية السنوات الست، ويرمى بلا قيمة. الحد الأدنى [[i|%]]. قارن بالقيمة الحالية.
  solution: |
    **الاستبدال الآن:**

    $$
    PW = [[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ 6) = [[Pc|2]]
    $$

    **الاحتفاظ ثم الاستبدال:** المتحدي يشترى في السنة [[nd|n]] ويعمل [[6-nd|n]] سنوات فقط:

    $$
    PW = [[M|g]] + [[Od|g]]\,(P/A,\ [[i|%]],\ [[nd|n]]) + \left([[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ [[6-nd|n]])\right)(P/F,\ [[i|%]],\ [[nd|n]]) = [[Pd|2]]
    $$

    الأرخص: [[pick(Pc <= Pd, 'الاستبدال الآن', 'الاحتفاظ ثم الاستبدال')]]. الخيار الثاني يرمي متحديا لم يستخدم كل عمره، وهذا يرفع تكلفته.

- id: c09-c-10
  kind: problem
  part: C
  vars: {M: 10000, Od: 9500, Sd: 2000, n: 4, i: 0.10, u: 0.75}
  random: {M: [2000, 20000, 500], Od: [5000, 15000, 500], Sd: [0, 4000, 500], n: [2, 6, 1], i: [0.06, 0.14, 0.01], u: [0, 1, 0.25]}
  calc:
    - Sd = min(Sd, M*0.5)
    - Ad = M*AP(i, n) - Sd*AF(i, n) + Od
    - Ac = floor(Ad*(0.88 + 0.24*u)/100)*100 + pick(u == 0.5, 300, 0)
  text: |
    المتحدي الأفضل قيمته السنوية عند عمره الاقتصادي [[Ac|g]] دينار. المدافع قيمته السوقية [[M|g]] دينار، وتشغيله [[Od|g]] دينار، ويخدم [[yrs(n)]] ثم يباع بمبلغ [[Sd|g]] دينار. الحد الأدنى [[i|%]]. هل تستبدل الشركة؟
  solution: |
    $$
    AW_d = [[M|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[Sd|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) + [[Od|g]] = [[Ad|2]]
    $$

    مقابل [[Ac|g]] دينار للمتحدي. [[pick(Ac < Ad, 'تستبدل', 'تحتفظ بالمدافع')]].

- id: c09-c-11
  kind: problem
  part: C
  vars: {M: 7000, Od: 10000, E: 0.25, C: 36000, n: 6, i: 0.10}
  random: {M: [2000, 15000, 500], Od: [6000, 18000, 500], E: [0.15, 0.40, 0.05], C: [15000, 60000, 1000], n: [4, 10, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Oc = Od*(1 - E)
    - Ad = M*AP(i, n) + Od
    - Ac = C*AP(i, n) + Oc
  text: |
    ضاغط قديم قيمته السوقية [[M|g]] دينار، وكهرباؤه [[Od|g]] دينار سنويا. ضاغط جديد يوفر [[E|%]] من الكهرباء، وثمنه [[C|g]] دينار. كلاهما يخدم [[yrs(n)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. هل تستبدل الشركة؟
  solution: |
    كهرباء الجديد:

    $$
    [[Od|g]] \times (1 - [[E|r]]) = [[Oc|2]]
    $$

    $$
    AW_d = [[Ad|2]], \qquad AW_c = [[Ac|2]]
    $$

    [[pick(Ac < Ad, 'تستبدل', 'تحتفظ بالقديم')]].

- id: c09-c-12
  kind: problem
  part: C
  vars: {M: 9000, Od: 9000, n: 4, Oc: 4000, nc: 8, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 15000, 500], n: [3, 6, 1], Oc: [1500, 5000, 500], nc: [6, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = M*AP(i, n) + Od
    - Cmax = (Ad - Oc)/AP(i, nc)
  text: |
    المدافع قيمته السوقية [[M|g]] دينار، وتشغيله [[Od|g]] دينار، ويخدم [[yrs(n)]] بدون قيمة بيع. المتحدي تشغيله [[Oc|g]] دينار، وعمره الاقتصادي [[yrs(nc)]] بدون قيمة بيع. الحد الأدنى [[i|%]]. ما أعلى ثمن للمتحدي يجعل الاستبدال مجديا؟
  solution: |
    $$
    AW_d = [[M|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Od|g]] = [[Ad|2]]
    $$

    نساوي القيمة السنوية للمتحدي بها:

    $$
    C\,(A/P,\ [[i|%]],\ [[nc|n]]) + [[Oc|g]] = [[Ad|2]]
    $$

    $$
    C = [[Cmax|2]]
    $$

- id: c09-c-13
  kind: problem
  part: C
  vars: {M: 8000, Od: 9000, nd: 4, C: 32000, Oc: 4000, Sc: 6000, nc: 8, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 14000, 500], nd: [2, 6, 1], C: [15000, 60000, 1000], Oc: [1500, 7000, 500], Sc: [0, 10000, 500], nc: [6, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Ad = M*AP(i, nd) + Od
    - Ac = C*AP(i, nc) - Sc*AF(i, nc) + Oc
    - Pw = C - M + (Oc - Od)*PA(i, nd)
  text: |
    طالب قارن المدافع بالمتحدي بطريقة خاطئة: طرح قيمة القديمة من ثمن الجديدة، وحسب القيمة الحالية لفرق التشغيل على عمر القديمة فقط. البيانات: القديمة قيمتها [[M|g]] دينار، وتشغيلها [[Od|g]] دينار، وتخدم [[yrs(nd)]]. الجديدة ثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وعمرها [[yrs(nc)]]، وتباع بعده بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. ما الخطأ؟ وما الجواب الصحيح؟
  solution: |
    حساب الطالب:

    $$
    [[C|g]] - [[M|g]] + ([[Oc|g]] - [[Od|g]])\,(P/A,\ [[i|%]],\ [[nd|n]]) = [[Pw|2]]
    $$

    الخطأ: حمل الجديدة كل ثمنها، لكنه حسب خدمتها [[yrs(nd)]] فقط، مع أنها تخدم [[yrs(nc)]]. الأعمار مختلفة، فالصحيح القيمة السنوية:

    $$
    AW_d = [[Ad|2]], \qquad AW_c = [[Ac|2]]
    $$

    الأرخص: [[pick(Ac < Ad, 'الجديدة', 'القديمة')]].

- id: c09-c-14
  kind: problem
  part: C
  vars: {M: 9000, Od: 9000, Sd: 2000, n: 3, C: 30000, Oc: 4000, Sc: 3000, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [5000, 14000, 500], Sd: [0, 4000, 500], n: [2, 6, 1], C: [15000, 60000, 1000], Oc: [1500, 7000, 500], Sc: [0, 8000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd = min(Sd, M*0.5)
    - Pd = M + Od*PA(i, n) - Sd*PF(i, n)
    - Pc = C + Oc*PA(i, n) - Sc*PF(i, n)
    - Pdiff = Pd - Pc
  text: |
    عقد ينتهي بعد [[yrs(n)]]، والخدمة لن تلزم بعده. القديمة قيمتها السوقية [[M|g]] دينار، وتشغيلها [[Od|g]] دينار، وتباع في النهاية بمبلغ [[Sd|g]] دينار. الجديدة ثمنها [[C|g]] دينار، وتشغيلها [[Oc|g]] دينار، وتباع بعد [[yrs(n)]] بمبلغ [[Sc|g]] دينار. الحد الأدنى [[i|%]]. هل تستبدل الشركة؟
  solution: |
    الفترة محددة، فنقارن بالقيمة الحالية خلالها:

    $$
    PW_d = [[M|g]] + [[Od|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sd|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Pd|2]]
    $$

    $$
    PW_c = [[C|g]] + [[Oc|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sc|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Pc|2]]
    $$

    [[pick(Pc < Pd, 'الجديدة أرخص خلال العقد، فتستبدل.', 'القديمة أرخص خلال العقد، فتحتفظ بها.')]] المدة القصيرة تقلل فرصة الجديدة، لأن ثمنها يسترد في سنوات قليلة.
