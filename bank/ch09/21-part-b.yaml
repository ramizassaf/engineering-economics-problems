items:

- id: c09-b-01
  kind: problem
  part: B
  vars: {P0: 45000, B: 18000, M: 11000}
  random: {P0: [20000, 100000, 1000], M: [2000, 30000, 500]}
  calc:
    - B = floor(P0*0.4/1000)*1000
    - M = min(M, B + 5000)
  text: |
    آلة اشتريت بمبلغ [[P0|g]] دينار، وقيمتها الدفترية [[B|g]] دينار، وتباع اليوم في السوق بمبلغ [[M|g]] دينار. ما القيمة التي نستخدمها للمدافع؟ ولماذا لا نستخدم الرقمين الآخرين؟
  solution: |
    القيمة السوقية، [[M|g]] دينار. الثمن الأصلي [[P0|g]] دينار تكلفة غارقة. القيمة الدفترية [[B|g]] دينار رقم محاسبي يعتمد على طريقة الاستهلاك.

- id: c09-b-02
  kind: problem
  part: B
  vars: {L: 70000, T: 18000, Cn: 64000, M: 13000}
  random: {L: [30000, 120000, 1000], T: [5000, 30000, 500], M: [2000, 25000, 500]}
  calc:
    - M = min(M, T - 1000)
    - Cn = L - floor((T - M)*0.6/100)*100 - 1000
    - z = (L - T) - (Cn - M)
  text: |
    وكيل يبيع آلة جديدة بسعر معلن [[L|g]] دينار، ويقبل القديمة بدلا من [[T|g]] دينار. نفس الوكيل يبيعها نقدا بمبلغ [[Cn|g]] دينار. القديمة تباع في السوق بمبلغ [[M|g]] دينار. ما ثمن الجديدة وقيمة القديمة في التحليل؟ وهل المبادلة أفضل من البيع منفصلا؟
  solution: |
    في التحليل: ثمن الجديدة [[Cn|g]] دينار، وقيمة القديمة [[M|g]] دينار.

    صافي ما تدفعه الشركة في المبادلة:

    $$
    [[L|g]] - [[T|g]] = [[L-T|g]]
    $$

    وفي البيع والشراء منفصلين:

    $$
    [[Cn|g]] - [[M|g]] = [[Cn-M|g]]
    $$

    [[pick(z < 0, 'المبادلة أرخص', 'البيع منفصلا أرخص')]] بمقدار [[abs(z)|g]] دينار.

- id: c09-b-03
  kind: problem
  part: B
  vars: {B: 22000, M: 9000}
  random: {B: [5000, 40000, 1000], M: [1000, 30000, 500]}
  calc:
    - M = min(M, B - 1000)
  text: |
    قيمة آلة الدفترية [[B|g]] دينار، وقيمتها السوقية [[M|g]] دينار. ما التكلفة الغارقة؟ وهل تدخل في قرار الاستبدال؟
  solution: |
    $$
    [[B|g]] - [[M|g]] = [[B-M|g]]
    $$

    لا تدخل. هذه الخسارة حدثت في الماضي، ولا يغيرها قرار البيع أو الاحتفاظ. تدخل فقط في حساب الضريبة إذا بيعت الآلة.

- id: c09-b-04
  kind: problem
  part: B
  vars: {M: 15000, X: 2500}
  random: {M: [3000, 30000, 500], X: [500, 5000, 100]}
  calc:
    - X = min(X, M*0.4)
    - V = M - X
  text: |
    آلة قديمة تباع بمبلغ [[M|g]] دينار، لكن فكها ونقلها يكلف [[X|g]] دينار يدفعها البائع. ما قيمة المدافع في التحليل؟
  solution: |
    إذا احتفظت الشركة بالآلة، تتنازل عن صافي ما كانت ستأخذه:

    $$
    [[M|g]] - [[X|g]] = [[V|g]]
    $$

- id: c09-b-05
  kind: problem
  part: B
  vars: {P0: 60000, N: 10, k: 6, M: 18000}
  random: {P0: [20000, 120000, 5000], N: [8, 15, 1], k: [3, 7, 1], M: [3000, 50000, 500]}
  calc:
    - B = P0 - k*P0/N
    - M = min(M, floor(B*1.3/500)*500)
  text: |
    آلة اشتريت قبل [[yrs(k)]] بمبلغ [[P0|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(N)]] بدون قيمة بيع. قيمتها السوقية اليوم [[M|g]] دينار. ما قيمتها الدفترية؟ وما الفرق عن قيمتها السوقية؟
  solution: |
    $$
    BV = [[P0|g]] - [[k|n]] \times \frac{[[P0|g]]}{[[N|n]]} = [[B|2]]
    $$

    الفرق [[abs(B-M)|2]] دينار. [[pick(M < B, 'السوق يقدر الآلة بأقل من الدفاتر.', 'السوق يقدر الآلة بأكثر من الدفاتر.')]] في قرار الاستبدال نستخدم [[M|g]] دينار.

- id: c09-b-06
  kind: problem
  part: B
  vars: {M: 9000, Od: 8500, Sd: 2000, n: 3, i: 0.10}
  random: {M: [2000, 20000, 500], Od: [3000, 15000, 500], Sd: [0, 5000, 500], n: [2, 6, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Sd = min(Sd, M*0.5)
    - P = M + Od*PA(i, n) - Sd*PF(i, n)
  text: |
    آلة قديمة قيمتها السوقية [[M|g]] دينار، وتشغيلها [[Od|g]] دينار سنويا لمدة [[yrs(n)]]، ثم تباع بمبلغ [[Sd|g]] دينار. الحد الأدنى [[i|%]]. ما القيمة الحالية لتكاليف الاحتفاظ بها؟
  solution: |
    القيمة السوقية تكلفة في السنة 0:

    $$
    PW = [[M|g]] + [[Od|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sd|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c09-b-07
  kind: problem
  part: B
  vars: {M: 12000, i: 0.10, d: 0.2}
  random: {M: [2000, 30000, 500], i: [0.06, 0.14, 0.01], d: [0.1, 0.3, 0.01]}
  calc:
    - M1 = M*(1 - d)
    - K = M - M1 + i*M
  text: |
    آلة قيمتها السوقية اليوم [[M|g]] دينار، وستصبح بعد سنة [[M1|g]] دينار. الحد الأدنى [[i|%]]. ما تكلفة رأس المال للاحتفاظ بها سنة واحدة، بدون التشغيل؟
  solution: |
    جزءان: ما تفقده الآلة من قيمتها، وفائدة المال المحبوس فيها:

    $$
    ([[M|g]] - [[M1|g]]) + [[i|r]] \times [[M|g]] = [[K|2]]
    $$

- id: c09-b-08
  kind: problem
  part: B
  vars: {MA: 10000, i: 0.10, u: 0.02}
  random: {MA: [3000, 30000, 500], i: [0.06, 0.14, 0.01], u: [-0.04, 0.04, 0.02]}
  calc:
    - u = pick(abs(u) < 0.001, 0.02, u)
    - MB = floor(MA*(1 + i + u)/100)*100
    - P = MB*PF(i, 1)
  text: |
    مشتريان للآلة القديمة: الأول يدفع [[MA|g]] دينار اليوم، والثاني [[MB|g]] دينار بعد سنة. الحد الأدنى [[i|%]]. أي العرضين أفضل؟
  solution: |
    $$
    [[MB|g]]\,(P/F,\ [[i|%]],\ 1) = [[P|2]]
    $$

    الأفضل: [[pick(P > MA, 'الثاني', 'الأول')]].

- id: c09-b-09
  kind: problem
  part: B
  vars: {L: 85000, T: 22000, M: 15000}
  random: {L: [40000, 150000, 1000], T: [8000, 35000, 500], M: [3000, 30000, 500]}
  calc:
    - M = min(M, T - 1000)
    - E = L - (T - M)
  text: |
    وكيل يعرض آلة جديدة بسعر [[L|g]] دينار، ويقبل القديمة بمبلغ [[T|g]] دينار. القيمة السوقية للقديمة [[M|g]] دينار. ما الثمن المكافئ للجديدة الذي نستخدمه في التحليل؟
  solution: |
    الوكيل يعطي [[T-M|g]] دينار فوق قيمة القديمة السوقية. هذا خصم حقيقي على الجديدة:

    $$
    [[L|g]] - ([[T|g]] - [[M|g]]) = [[E|g]]
    $$

    في التحليل: المدافع [[M|g]] دينار، والمتحدي [[E|g]] دينار.

- id: c09-b-10
  kind: problem
  part: B
  vars: {B: 16000, M: 21000, t: 0.20}
  random: {B: [3000, 30000, 1000], M: [5000, 40000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - M = max(M, B + 1000)
    - NS = M - t*(M - B)
  text: |
    آلة قيمتها الدفترية [[B|g]] دينار، وقيمتها السوقية [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما قيمة المدافع بعد الضريبة؟
  solution: |
    البيع فوق القيمة الدفترية يخضع للضريبة:

    $$
    [[M|g]] - [[t|r]]\,([[M|g]] - [[B|g]]) = [[NS|2]]
    $$

- id: c09-b-11
  kind: problem
  part: B
  vars: {B: 25000, M: 10000, t: 0.20}
  random: {B: [8000, 40000, 1000], M: [1000, 30000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - M = min(M, B - 2000)
    - NS = M + t*(B - M)
  text: |
    آلة قيمتها الدفترية [[B|g]] دينار، وقيمتها السوقية [[M|g]] دينار. الشركة رابحة، ونسبة الضريبة [[t|%]]. ما قيمة المدافع بعد الضريبة؟
  solution: |
    البيع تحت القيمة الدفترية يولد خسارة توفر ضريبة:

    $$
    [[M|g]] + [[t|r]]\,([[B|g]] - [[M|g]]) = [[NS|2]]
    $$

    التكلفة الغارقة لا تدخل في القرار، لكنها تؤثر على الضريبة.

- id: c09-b-12
  kind: problem
  part: B
  vars: {M: 14000, U: 3000}
  random: {M: [3000, 30000, 500], U: [500, 8000, 500]}
  calc:
    - V = M + U
  text: |
    آلة قديمة تباع بمبلغ [[M|g]] دينار. إذا احتفظت بها الشركة، يجب أن تجري لها فورا تعديلات سلامة تكلف [[U|g]] دينار لتجتاز التفتيش. ما استثمار المدافع في السنة 0؟
  solution: |
    الاحتفاظ يكلف التنازل عن البيع، ودفع التعديلات:

    $$
    [[M|g]] + [[U|g]] = [[V|g]]
    $$
