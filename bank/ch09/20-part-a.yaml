items:

- id: c09-a-01
  kind: concept
  part: A
  text: |
    ما المقصود بالمدافع والمتحدي في قرار الاستبدال؟
  solution: |
    المدافع هو الأصل الموجود الذي تملكه الشركة. المتحدي هو البديل الجديد المقترح لاستبداله.

- id: c09-a-02
  kind: concept
  part: A
  text: |
    لماذا نستخدم القيمة السوقية للمدافع، وليس ثمنه الأصلي أو قيمته الدفترية؟
  solution: |
    لأن الثمن الأصلي صرف في الماضي، والقيمة الدفترية رقم محاسبي. القيمة السوقية هي ما تتنازل عنه الشركة فعلا إذا احتفظت بالأصل.

- id: c09-a-03
  kind: concept
  part: A
  text: |
    مدير يرفض بيع آلة قيمتها الدفترية 20,000 دينار بمبلغ 8,000 دينار، لأن الشركة ستخسر 12,000 دينار. ما الخطأ في تفكيره؟
  solution: |
    الخسارة حدثت فعلا، عندما انخفضت قيمة الآلة في السوق. البيع يظهرها في الدفاتر فقط. القرار يجب أن يعتمد على التكاليف القادمة، وليس على ما ضاع.

- id: c09-a-04
  kind: concept
  part: A
  text: |
    ما الفرق بين العمر الفني والعمر الاقتصادي لآلة؟
  solution: |
    العمر الفني مدة قدرة الآلة على العمل. العمر الاقتصادي المدة التي تعطي أقل قيمة سنوية للتكاليف، وهو غالبا أقصر.

- id: c09-a-05
  kind: concept
  part: A
  text: |
    لماذا تنخفض القيمة السنوية لتكلفة آلة في سنواتها الأولى، ثم ترتفع؟
  solution: |
    تكلفة رأس المال السنوية تنخفض مع توزيع الثمن على سنوات أكثر. تكلفة التشغيل ترتفع مع تقدم الآلة في العمر. المجموع ينخفض ثم يرتفع.

- id: c09-a-06
  kind: concept
  part: A
  text: |
    عرض وكيل مبلغا كبيرا للآلة القديمة مقابل شراء آلة جديدة منه. لماذا قد يكون هذا العرض مضللا؟
  solution: |
    لأن الوكيل يرفع سعر الجديدة بنفس المقدار غالبا. المهم صافي ما تدفعه الشركة. نقارنه ببيع القديمة في السوق وشراء الجديدة نقدا.

- id: c09-a-07
  kind: concept
  part: A
  text: |
    ما التكلفة الحدية للمدافع في سنة معينة؟ ومم تتكون؟
  solution: |
    هي تكلفة الاحتفاظ به سنة واحدة أخرى: النقص في قيمته السوقية خلال السنة، وفائدة المال المحبوس فيه، وتكاليف تشغيله في تلك السنة.

- id: c09-a-08
  kind: concept
  part: A
  text: |
    لماذا لا نقارن المتحدي بالقيمة السنوية للمدافع على كل عمره الباقي؟
  solution: |
    لأن تكاليف المدافع ترتفع كل سنة. متوسطها قد يخفي أن السنوات الأولى رخيصة والأخيرة غالية. التكلفة الحدية تحدد السنة المناسبة للاستبدال بدقة.

- id: c09-a-09
  kind: concept
  part: A
  text: |
    متى نقارن البدائل بالقيمة الحالية خلال فترة دراسة، بدل القيمة السنوية؟
  solution: |
    عندما تكون الحاجة للخدمة محددة بمدة، مثل عقد ينتهي أو مصنع سينقل، فلا يصح افتراض أن الأصول تتكرر بلا نهاية.

- id: c09-a-10
  kind: concept
  part: A
  text: |
    كيف نعامل تكلفة إصلاح شامل يطيل عمر الآلة القديمة؟
  solution: |
    هي استثمار جديد في المدافع. تضاف إلى قيمته السوقية في السنة 0، وتوزع على العمر الذي يضيفه الإصلاح.

- id: c09-a-11
  kind: concept
  part: A
  text: |
    بعد الضريبة، لماذا قد تكون قيمة المدافع في التحليل أعلى من سعر بيعه؟
  solution: |
    إذا بيع بأقل من قيمته الدفترية، تخسر الشركة دفتريا، فتوفر ضريبة. صافي البيع يساوي السعر زائد هذا الوفر.

- id: c09-a-12
  kind: concept
  part: A
  text: |
    التكنولوجيا تتحسن بسرعة، والمتحدي القادم بعد سنتين سيكون أفضل من المتحدي اليوم. كيف يؤثر هذا على قرار الاستبدال الآن؟
  solution: |
    قد يكون الأفضل الانتظار، حتى لو كان المتحدي الحالي أرخص قليلا من المدافع. نقارن الخيارين: استبدال الآن، أو الاحتفاظ بالمدافع ثم استبداله بالمتحدي الأفضل لاحقا.
