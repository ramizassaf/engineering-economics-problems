- id: c09-j-01
  kind: case
  part: J
  calc:
    - a1 = 120000*AP(0.1, 1) - 90000*AF(0.1, 1) + 15000
    - a2 = 120000*AP(0.1, 2) - 78000*AF(0.1, 2) + 15000 + 7000*AG(0.1, 2)
    - a3 = 120000*AP(0.1, 3) - 66000*AF(0.1, 3) + 15000 + 7000*AG(0.1, 3)
    - a4 = 120000*AP(0.1, 4) - 54000*AF(0.1, 4) + 15000 + 7000*AG(0.1, 4)
    - a5 = 120000*AP(0.1, 5) - 42000*AF(0.1, 5) + 15000 + 7000*AG(0.1, 5)
    - Ac = min(a1, a2, a3, a4, a5)
    - c1 = 30000 - 24000 + 0.1*30000 + 33000
    - c2 = 24000 - 19000 + 0.1*24000 + 38000
    - c3 = 19000 - 15000 + 0.1*19000 + 45000
  text: |
    **حالة 9.1: حافلات شركة نقل**

    شركة نقل بين المدن تملك حافلة عمرها 9 سنوات. البيانات المتوقعة لها:

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | القيمة السوقية | 30,000 | 24,000 | 19,000 | 15,000 |
    | الوقود والصيانة والأعطال | | 33,000 | 38,000 | 45,000 |

    الحافلة الجديدة تكلف 120,000 دينار. قيمتها السوقية 90,000 ثم 78,000 ثم 66,000 ثم 54,000 ثم 42,000 دينار بعد السنوات 1 إلى 5. تشغيلها 15,000 دينار في السنة الأولى، ويزيد 7,000 دينار سنويا. الحد الأدنى 10%.

    (أ) ما العمر الاقتصادي للحافلة الجديدة، وما قيمتها السنوية عنده؟ (ب) احسب التكلفة الحدية للحافلة القديمة للسنوات الثلاث. (ج) متى تستبدل الشركة الحافلة القديمة؟
  solution: |
    (أ)

    | العمر | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | القيمة السنوية | [[a1|0]] | [[a2|0]] | [[a3|0]] | [[a4|0]] | [[a5|0]] |

    أقل قيمة سنوية [[Ac|2]] دينار.

    (ب)

    $$
    MC_k = (M_{k-1} - M_k) + 0.10\,M_{k-1} + O_k
    $$

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | التكلفة الحدية | [[c1|0]] | [[c2|0]] | [[c3|0]] |

    (ج) [[pick(c1 > Ac, 'التكلفة الحدية للسنة القادمة أعلى من الجديدة، فتستبدل الآن.', pick(c2 > Ac, 'تحتفظ بالقديمة سنة واحدة، ثم تستبدلها.', pick(c3 > Ac, 'تحتفظ بالقديمة سنتين، ثم تستبدلها.', 'تحتفظ بالقديمة ثلاث سنوات على الأقل.')))]]

- id: c09-j-02
  kind: case
  part: J
  calc:
    - NS = 9000 + 0.2*(16000 - 9000)
    - Ak = NS*AP(0.1, 5) + 21000*0.8 - 0.2*16000/5
    - Ao = (NS + 18000)*AP(0.1, 5) + 13000*0.8 - 0.2*(16000 + 18000)/5
    - An = 65000*AP(0.1, 5) - 15000*0.8*AF(0.1, 5) + 9000*0.8 - 0.2*65000/5
  text: |
    **حالة 9.2: مطبعة في نابلس**

    مطبعة تملك آلة طباعة قيمتها الدفترية 16,000 دينار، وتباع اليوم بمبلغ 9,000 دينار. تكاليف تشغيلها وتالفها 21,000 دينار سنويا. أمام المطبعة ثلاثة خيارات لمدة 5 سنوات:

    | الخيار | الاستثمار اليوم | التكاليف السنوية | البيع بعد 5 سنوات |
    | --- | --- | --- | --- |
    | الاحتفاظ | | 21,000 | 0 |
    | إصلاح شامل | 18,000 | 13,000 | 0 |
    | آلة جديدة | 65,000 | 9,000 | 15,000 |

    كل الاستثمارات تستهلك بالقسط الثابت إلى الصفر على 5 سنوات، ومنها القيمة الدفترية الحالية. نسبة الضريبة 20%، والحد الأدنى 10%.

    (أ) ما قيمة الآلة القديمة في التحليل بعد الضريبة؟ (ب) احسب القيمة السنوية لكل خيار بعد الضريبة. (ج) ماذا تختار المطبعة؟
  solution: |
    (أ) البيع تحت القيمة الدفترية يوفر ضريبة:

    $$
    9{,}000 + 0.2 \times (16{,}000 - 9{,}000) = [[NS|g]]
    $$

    (ب) **الاحتفاظ:**

    $$
    AW = [[NS|g]]\,(A/P,\ 10\%,\ 5) + 21{,}000 \times 0.8 - 0.2 \times 3{,}200 = [[Ak|2]]
    $$

    **الإصلاح:** يضاف إلى قيمة القديمة، ويستهلك معها:

    $$
    AW = ([[NS|g]] + 18{,}000)\,(A/P,\ 10\%,\ 5) + 13{,}000 \times 0.8 - 0.2 \times 6{,}800 = [[Ao|2]]
    $$

    **الجديدة:** بيعها بعد 5 سنوات كله ربح خاضع، لأن قيمتها الدفترية صفر:

    $$
    AW = 65{,}000\,(A/P,\ 10\%,\ 5) - 12{,}000\,(A/F,\ 10\%,\ 5) + 7{,}200 - 2{,}600 = [[An|2]]
    $$

    (ج) الأرخص: [[pick(Ak <= Ao, pick(Ak <= An, 'الاحتفاظ', 'الآلة الجديدة'), pick(Ao <= An, 'الإصلاح الشامل', 'الآلة الجديدة'))]].

- id: c09-j-03
  kind: case
  part: J
  calc:
    - Pa = 14000 + 11000*PA(0.1, 4) - 3000*PF(0.1, 4)
    - Pb = 60000 + 2500*PA(0.1, 4) - 30000*PF(0.1, 4)
    - Pc = 14000 + 11000*PA(0.1, 2) - 9000*PF(0.1, 2) + 60000*PF(0.1, 2) + 2500*(PA(0.1, 4) - PA(0.1, 2)) - 42000*PF(0.1, 4)
  text: |
    **حالة 9.3: مولد مستشفى خاص**

    مستشفى خاص في مبنى مستأجر لمدة 4 سنوات، ثم ينتقل إلى مبناه الجديد المجهز بمولد. المولد الحالي يباع اليوم بمبلغ 14,000 دينار، وبعد سنتين بمبلغ 9,000، وبعد 4 سنوات بمبلغ 3,000 دينار. وقوده وصيانته 11,000 دينار سنويا. مولد جديد يكلف 60,000 دينار، وتشغيله 2,500 دينار، ويباع بعد سنتين من شرائه بمبلغ 42,000 دينار، أو بعد 4 سنوات بمبلغ 30,000 دينار. الحد الأدنى 10%. تجاهل الضريبة.

    الخيارات: (أ) الاحتفاظ بالحالي 4 سنوات. (ب) الاستبدال الآن. (ج) الاحتفاظ سنتين ثم الاستبدال. أيها أرخص؟
  solution: |
    الحاجة 4 سنوات بالضبط، فنقارن بالقيمة الحالية خلالها.

    (أ)

    $$
    PW_a = 14{,}000 + 11{,}000\,(P/A,\ 10\%,\ 4) - 3{,}000\,(P/F,\ 10\%,\ 4) = [[Pa|2]]
    $$

    (ب)

    $$
    PW_b = 60{,}000 + 2{,}500\,(P/A,\ 10\%,\ 4) - 30{,}000\,(P/F,\ 10\%,\ 4) = [[Pb|2]]
    $$

    (ج) في السنة 2 يباع الحالي بمبلغ 9,000، ويشترى الجديد، ويباع الجديد بعد سنتين بمبلغ 42,000:

    $$
    PW_c = [[Pc|2]]
    $$

    الأرخص: [[pick(Pa <= Pb, pick(Pa <= Pc, 'الاحتفاظ 4 سنوات', 'الاستبدال بعد سنتين'), pick(Pb <= Pc, 'الاستبدال الآن', 'الاستبدال بعد سنتين'))]]. الأرقام وحدها لا تكفي في مستشفى: احتمال تعطل المولد القديم أثناء عملية جراحية قد يجعل الاستبدال ضروريا حتى لو كان أغلى.
