# ================================================================ part B
- id: c12-b-01
  kind: problem
  part: B
  vars: {T: 600000, F: 200000, N: 90000, M: 70000}
  random: {T: [200000, 1200000, 10000], F: [50000, 400000, 10000], N: [10000, 200000, 5000], M: [20000, 150000, 5000]}
  calc:
    - B = T + F
  text: |
    جسر جديد يوفر على السائقين [[T|g]] دينار سنويا من الوقت، و[[F|g]] دينار من الوقود. سكان الحي المجاور يخسرون [[N|g]] دينار سنويا بسبب الضجيج وانخفاض قيمة بيوتهم. صيانة الجسر [[M|g]] دينار سنويا. ما المنافع والأضرار والتكاليف السنوية؟
  solution: |
    $$
    B = [[T|g]] + [[F|g]] = [[B|g]]
    $$

    الضرر على السكان [[N|g]] دينار، والتكلفة على الحكومة [[M|g]] دينار. المنافع ناقص الأضرار:

    $$
    [[B|g]] - [[N|g]] = [[B-N|g]]
    $$

- id: c12-b-02
  kind: problem
  part: B
  vars: {v: 50000, t: 12, w: 4, d: 250}
  random: {v: [10000, 120000, 1000], t: [4, 30, 1], w: [2, 8, 0.5], d: [250, 300, 50]}
  calc:
    - B = v*d*t/60*w
  text: |
    طريق التفافي يخدم [[v|g]] سيارة يوميا، ويوفر على كل منها [[t|g]] دقيقة. قيمة ساعة المسافر [[w|g]] دينار. الطريق يعمل [[d|g]] يوما في السنة. ما منفعة توفير الوقت السنوية؟
  solution: |
    ساعات التوفير في السنة:

    $$
    [[v|g]] \times [[d|g]] \times \frac{[[t|g]]}{60} = [[v*d*t/60|g]]
    $$

    $$
    [[v*d*t/60|g]] \times [[w|g]] = [[B|g]]
    $$

    قيمة ساعة المسافر افتراض يجب أن يذكر صراحة، لأن النتيجة تتناسب معه.

- id: c12-b-03
  kind: problem
  part: B
  vars: {a0: 45, a1: 28, c: 60000}
  random: {a0: [20, 80, 1], a1: [5, 60, 1], c: [20000, 150000, 5000]}
  calc:
    - a1 = min(a1, a0 - 3)
    - B = (a0 - a1)*c
  text: |
    عدد الحوادث مع إصابات على تقاطع [[a0|g]] حادثا سنويا. إشارات ضوئية جديدة تخفضها إلى [[a1|g]]. تقدر الجهة المختصة متوسط كلفة الحادث، من علاج وأيام عمل وأضرار، بمبلغ [[c|g]] دينار. ما منفعة الإشارات السنوية؟
  solution: |
    $$
    ([[a0|g]] - [[a1|g]]) \times [[c|g]] = [[B|g]]
    $$

- id: c12-b-04
  kind: problem
  part: B
  vars: {h: 3000, y: 0.8, p: 450, g: 1200}
  random: {h: [500, 8000, 100], y: [0.4, 1.5, 0.1], p: [200, 800, 10], g: [300, 3000, 100]}
  calc:
    - B = h*y*p
  text: |
    مشروع ري يوصل الماء إلى [[h|g]] دونم كانت بعلية. يزيد المحصول [[y|g]] طن للدونم، وسعر الطن [[p|g]] دينار. يدفع المزارعون للحكومة رسوم مياه [[g|g]] دينار سنويا عن المشروع كله. ما المنافع السنوية؟ وأين توضع الرسوم؟
  solution: |
    $$
    B = [[h|g]] \times [[y|g]] \times [[p|g]] = [[B|g]]
    $$

    الرسوم يدفعها المزارعون للحكومة. هي تقلل تكلفة الحكومة، ولا تطرح من المنفعة ولا تضاف إليها. المنفعة كاملة هي زيادة المحصول.

- id: c12-b-05
  kind: problem
  part: B
  vars: {B: 800000, D: 100000, C: 500000}
  random: {B: [300000, 1500000, 10000], D: [0, 300000, 10000], C: [100000, 1000000, 10000]}
  calc:
    - N = B - D - C
  text: |
    القيم السنوية لمشروع عام: منافع [[B|g]] دينار، وأضرار [[D|g]] دينار، وتكاليف [[C|g]] دينار. ما المنفعة الصافية للمجتمع؟
  solution: |
    $$
    [[B|g]] - [[D|g]] - [[C|g]] = [[N|g]]
    $$

    [[pick(N >= 0, "موجبة: المجتمع يكسب من المشروع.", "سالبة: المجتمع يخسر من المشروع.")]]

- id: c12-b-06
  kind: concept
  part: B
  text: |
    صنف كل بند في مشروع مكب نفايات صحي جديد: (أ) ثمن الأرض الذي دفعته البلدية. (ب) انخفاض أمراض الجهاز التنفسي في المدينة. (ج) الروائح على قرية قريبة. (د) رسوم تدفعها المصانع لرمي نفاياتها. (هـ) توفير تكلفة نقل النفايات إلى المكب القديم البعيد، الذي كانت تدفعه البلدية.
  solution: |
    (أ) تكلفة. (ب) منفعة. (ج) ضرر. (د) تقلل التكلفة، لأن البلدية تحصلها. (هـ) تقلل التكلفة، لأن البلدية هي التي توفر.

- id: c12-b-07
  kind: problem
  part: B
  vars: {s: 2000, v: 15000, r: 0.12}
  random: {s: [500, 6000, 100], v: [5000, 40000, 1000], r: [0.05, 0.25, 0.01]}
  calc:
    - B = s*v*r
  text: |
    خط مجاري جديد يخدم [[s|g]] بيتا. قيمة البيت المتوسط [[v|g]] دينار، ويتوقع المقيمون أن ترتفع قيمته [[r|%]] بسبب الخط. هل نضيف هذا الارتفاع إلى المنافع، إذا كنا قد حسبنا أيضا انخفاض أمراض السكان وتوفير تكلفة تفريغ الحفر الامتصاصية؟
  solution: |
    ارتفاع القيمة:

    $$
    [[s|g]] \times [[v|g]] \times [[r|%]] = [[B|g]]
    $$

    لا نضيفه. سعر البيت ارتفع لأن المشتري يتوقع نفس المنافع التي حسبناها: صحة أفضل وتوفير التفريغ. إضافته تحسب المنافع مرتين.

- id: c12-b-08
  kind: problem
  part: B
  vars: {e: 250, x: 4, w: 25}
  random: {e: [50, 600, 10], x: [1, 10, 1], w: [10, 40, 1]}
  calc:
    - B = e*(x + w)*12
  text: |
    مركز صحي في قرية يغني [[e|g]] مريضا شهريا عن السفر إلى المدينة. كل رحلة تكلف المريض [[x|g]] دينار مواصلات، وتضيع عليه يوم عمل قيمته [[w|g]] دينار. ما المنفعة السنوية من هذا التوفير وحده؟
  solution: |
    $$
    [[e|g]] \times ([[x|g]] + [[w|g]]) \times 12 = [[B|g]]
    $$

- id: c12-b-09
  kind: problem
  part: B
  vars: {L: 120, y: 900}
  random: {L: [20, 400, 10], y: [300, 2000, 50]}
  calc:
    - D = L*y
  text: |
    خزان سد يغمر [[L|g]] دونم أرض زراعية، كان صافي دخل الدونم منها [[y|g]] دينار سنويا. الحكومة دفعت تعويضا للمزارعين عن الأرض. هل يبقى دخل الأرض ضررا في تحليل المشروع؟
  solution: |
    نعم. المجتمع فقد إنتاج الأرض:

    $$
    D = [[L|g]] \times [[y|g]] = [[D|g]]
    $$

    التعويض نقل مال من الحكومة إلى المزارعين، فهو تكلفة على الحكومة. لكنه لا يعيد الإنتاج المفقود. نحسب واحدا فقط: إما ثمن الأرض تكلفة في السنة 0، إذا كان يعكس قيمة إنتاجها، وإما الدخل الضائع ضررا سنويا. لا الاثنين.

- id: c12-b-10
  kind: problem
  part: B
  vars: {n0: 900, n1: 400, f: 0.3}
  random: {n0: [300, 2000, 50], n1: [100, 1500, 50], f: [0.1, 0.6, 0.05]}
  calc:
    - n1 = min(n1, n0 - 100)
    - x = (n0 - n1)*f
  text: |
    مدرسة جديدة في حي تخفض عدد الطلاب الذين يقطعون أكثر من 5 كيلومترات يوميا من [[n0|g]] إلى [[n1|g]]. دراسة تقدر أن [[f|%]] ممن كانوا يقطعون هذه المسافة كانوا سيتركون الدراسة مبكرا. كم طالبا إضافيا يتوقع أن يكمل دراسته سنويا؟ ولماذا لا نحول هذا مباشرة إلى دنانير؟
  solution: |
    $$
    ([[n0|g]] - [[n1|g]]) \times [[f|%]] = [[x|2]]
    $$

    قيمة إكمال الدراسة تشمل دخلا أعلى لاحقا، وأشياء لا سعر لها. تقديرها بالدنانير ممكن لكنه خلافي. الأوضح أن نقارن تكلفة كل طالب إضافي يكمل الدراسة بين البدائل، بتحليل الفعالية مقابل التكلفة.

# ================================================================ part C
- id: c12-c-01
  kind: problem
  part: C
  vars: {I: 1500000, B: 210000, M: 40000, n: 20, i: 0.06}
  random: {I: [500000, 4000000, 50000], B: [50000, 600000, 5000], M: [10000, 120000, 2500], n: [15, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - R = B*f/(I + M*f)
  text: |
    حديقة عامة تكلف [[I|g]] دينار، وصيانتها [[M|g]] دينار سنويا، ومنافعها [[B|g]] دينار سنويا لمدة [[yrs(n)]]. احسب نسبة المنفعة إلى التكلفة بنسبة [[i|%]].
  solution: |
    $$
    (P/A,\ [[i|%]],\ [[n|n]]) = [[f|f4]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = [[R|f4]]
    $$

    المشروع [[pick(R >= 1, "مجد", "غير مجد")]].

- id: c12-c-02
  kind: problem
  part: C
  vars: {I: 6000000, B: 700000, D: 80000, M: 150000, S: 1000000, n: 30, i: 0.05}
  random: {I: [2000000, 12000000, 500000], B: [200000, 1500000, 10000], D: [0, 150000, 5000], M: [30000, 300000, 10000], S: [0, 2000000, 100000], n: [20, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - S = min(S, I*0.25)
    - f = PA(i, n)
    - g = PF(i, n)
    - R = (B - D)*f/(I + M*f - S*g)
  text: |
    محطة تحلية صغيرة تكلف [[I|g]] دينار، وتشغيلها [[M|g]] دينار سنويا، وتباع معداتها بمبلغ [[S|g]] دينار بعد [[yrs(n)]]. منافعها [[B|g]] دينار سنويا، وأضرارها على الشاطئ [[D|g]] دينار سنويا. احسب النسبة التقليدية بنسبة [[i|%]].
  solution: |
    $$
    (P/A,\ [[i|%]],\ [[n|n]]) = [[f|f4]] \qquad (P/F,\ [[i|%]],\ [[n|n]]) = [[g|f4]]
    $$

    $$
    \frac{B - D}{I + M - S} = \frac{([[B|g]] - [[D|g]]) \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]] - [[S|g]] \times [[g|f4]]} = [[R|f4]]
    $$

- id: c12-c-03
  kind: problem
  part: C
  vars: {I: 900000, B1: 60000, G: 5000, n: 20, M: 20000, i: 0.06}
  random: {I: [300000, 2000000, 50000], B1: [20000, 150000, 5000], G: [1000, 15000, 500], n: [15, 30, 5], M: [5000, 60000, 2500], i: [0.03, 0.08, 0.005]}
  calc:
    - PB = B1*PA(i, n) + G*PG(i, n)
    - PC = I + M*PA(i, n)
    - R = PB/PC
  text: |
    طريق إلى منطقة صناعية جديدة يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا. منافعه [[B1|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة مع نمو المنطقة، لمدة [[yrs(n)]]. احسب النسبة بنسبة [[i|%]].
  solution: |
    المنافع سلسلة متدرجة خطيا، كما في الفصل الثاني:

    $$
    PW_B = [[B1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    $$
    PW_C = [[I|g]] + [[M|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PC|2]]
    $$

    $$
    \frac{B}{C} = \frac{[[PB|2]]}{[[PC|2]]} = [[R|f4]]
    $$

- id: c12-c-04
  kind: problem
  part: C
  vars: {I: 2000000, B1: 150000, g: 0.04, n: 25, M: 30000, i: 0.06}
  random: {I: [800000, 5000000, 100000], B1: [50000, 400000, 5000], g: [0.01, 0.06, 0.005], n: [15, 40, 5], M: [10000, 100000, 2500], i: [0.03, 0.08, 0.005]}
  calc:
    - PB = B1*PGEO(g, i, n)
    - PC = I + M*PA(i, n)
    - R = PB/PC
  text: |
    خط حافلات عامة يحتاج استثمارا [[I|g]] دينار، وتكاليف إضافية [[M|g]] دينار سنويا. منافع الركاب [[B1|g]] دينار في السنة الأولى، وتنمو [[g|%]] سنويا، لمدة [[yrs(n)]]. احسب النسبة بنسبة [[i|%]].
  solution: |
    المنافع سلسلة متدرجة نسبيا:

    $$
    PW_B = [[B1|g]]\,(P/A_1,\ [[g|%]],\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    $$
    PW_C = [[I|g]] + [[M|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PC|2]]
    $$

    $$
    \frac{B}{C} = [[R|f4]]
    $$

- id: c12-c-05
  kind: problem
  part: C
  vars: {I: 3000000, M: 80000, n: 30, i: 0.05}
  random: {I: [1000000, 8000000, 100000], M: [20000, 200000, 5000], n: [20, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - Bmin = (I + M*f)/f
  text: |
    محطة ضخ تكلف [[I|g]] دينار، وتشغيلها [[M|g]] دينار سنويا لمدة [[yrs(n)]]. ما أقل منفعة سنوية تجعل المشروع مجديا بنسبة [[i|%]]؟
  solution: |
    المشروع مجد إذا كانت النسبة 1 على الأقل، أي إذا غطت المنافع التكاليف:

    $$
    B\,(P/A,\ [[i|%]],\ [[n|n]]) = [[I|g]] + [[M|g]]\,(P/A,\ [[i|%]],\ [[n|n]])
    $$

    $$
    B = [[I|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[M|g]] = [[Bmin|2]]
    $$

- id: c12-c-06
  kind: problem
  part: C
  vars: {I: 5000000, B: 600000, M: 100000, i: 0.05}
  random: {I: [1000000, 10000000, 500000], B: [150000, 1500000, 10000], M: [20000, 300000, 10000], i: [0.03, 0.08, 0.005]}
  calc:
    - B = max(B, M + I*i*1.6)
    - n = ln(1 - I*i/(B - M))/(-ln(1 + i))
  text: |
    مشروع عام يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا. نسبة الخصم [[i|%]]. كم سنة يجب أن يعمل المشروع حتى تصل النسبة إلى 1؟
  solution: |
    المنفعة الصافية السنوية:

    $$
    [[B|g]] - [[M|g]] = [[B-M|g]]
    $$

    نبحث عن n التي تجعل قيمتها الحالية تساوي الاستثمار:

    $$
    [[B-M|g]]\,(P/A,\ [[i|%]],\ n) = [[I|g]]
    $$

    ```excel
    =NPER([[i|%]], [[B-M|r]], -[[I|r]])
    ```

    n تساوي [[n|2]] سنة. إذا كان العمر المتوقع أطول، فالمشروع مجد.

- id: c12-c-07
  kind: problem
  part: C
  vars: {I: 4000000, M: 100000, B: 420000, n: 30}
  random: {I: [1000000, 8000000, 250000], M: [20000, 250000, 10000], B: [100000, 1200000, 10000], n: [20, 40, 5]}
  calc:
    - B = floor((I*AP(0.06, n) + M)/10000 + 0.5)*10000
    - r = RATE(n, B - M, I)
  text: |
    مشروع عام يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا لمدة [[yrs(n)]]. ما أعلى نسبة خصم يبقى المشروع عندها مجديا؟
  solution: |
    النسبة تساوي 1 بالضبط عندما تتساوى القيمة الحالية للمنفعة الصافية مع الاستثمار. هذه هي نسبة الخصم التي تجعل القيمة الحالية الصافية صفرا، أي معدل العائد الداخلي للمشروع:

    ```excel
    =RATE([[n|n]], [[B-M|r]], -[[I|r]])
    ```

    [[r|%2]]. بأي نسبة خصم أقل منها، النسبة أكبر من 1.

- id: c12-c-08
  kind: problem
  part: C
  vars: {I: 1200000, B: 140000, M: 25000, n: 25}
  random: {I: [400000, 3000000, 50000], B: [40000, 400000, 5000], M: [5000, 80000, 2500], n: [15, 40, 5]}
  calc:
    - R3 = B*PA(0.03, n)/(I + M*PA(0.03, n))
    - R6 = B*PA(0.06, n)/(I + M*PA(0.06, n))
    - R9 = B*PA(0.09, n)/(I + M*PA(0.09, n))
  text: |
    مشروع عام يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا لمدة [[yrs(n)]]. احسب النسبة عند 3% و6% و9%.
  solution: |
    | نسبة الخصم | المنافع الحالية على التكاليف الحالية |
    | --- | --- |
    | 3% | [[R3|f4]] |
    | 6% | [[R6|f4]] |
    | 9% | [[R9|f4]] |

    مثال عند 6%:

    $$
    \frac{[[B|g]]\,(P/A,\ 6\%,\ [[n|n]])}{[[I|g]] + [[M|g]]\,(P/A,\ 6\%,\ [[n|n]])} = [[R6|f4]]
    $$

    النسبة تنخفض كلما ارتفعت نسبة الخصم، لأن المنافع موزعة على السنين والاستثمار في البداية.

- id: c12-c-09
  kind: problem
  part: C
  vars: {I1: 800000, I2: 600000, B: 230000, M: 30000, n: 20, i: 0.06}
  random: {I1: [300000, 1500000, 50000], I2: [200000, 1200000, 50000], B: [80000, 500000, 5000], M: [10000, 80000, 2500], n: [15, 30, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - PC = I1 + I2*PF(i, 1) + M*PA(i, n)*PF(i, 1)
    - PB = B*PA(i, n)*PF(i, 1)
    - R = PB/PC
  text: |
    مبنى مدرسة يبنى على سنتين: [[I1|g]] دينار الآن، و[[I2|g]] دينار بعد سنة. تبدأ المدرسة العمل في نهاية السنة الثانية، فتعطي منافع [[B|g]] دينار سنويا وتكلف تشغيلا [[M|g]] دينار سنويا، من السنة 2 إلى السنة [[n+1|n]]. احسب النسبة بنسبة [[i|%]].
  solution: |
    المنافع والتشغيل سلسلة تبدأ في السنة 2، فننقلها إلى السنة 1 بالمعامل P/A، ثم إلى السنة 0:

    $$
    PW_B = [[B|g]]\,(P/A,\ [[i|%]],\ [[n|n]])\,(P/F,\ [[i|%]],\ 1) = [[PB|2]]
    $$

    $$
    PW_C = [[I1|g]] + [[I2|g]]\,(P/F,\ [[i|%]],\ 1) + [[M|g]]\,(P/A,\ [[i|%]],\ [[n|n]])\,(P/F,\ [[i|%]],\ 1) = [[PC|2]]
    $$

    $$
    \frac{B}{C} = [[R|f4]]
    $$

- id: c12-c-10
  kind: problem
  part: C
  vars: {I: 2500000, B: 300000, M: 60000, n: 25, i: 0.05, x: 0.20}
  random: {I: [800000, 6000000, 100000], B: [80000, 800000, 10000], M: [10000, 150000, 5000], n: [15, 40, 5], i: [0.03, 0.08, 0.005], x: [0.10, 0.40, 0.05]}
  calc:
    - f = PA(i, n)
    - R0 = B*f/(I + M*f)
    - R1 = B*f/(I*(1 + x) + M*f)
  text: |
    مشروع عام قدرت تكلفته [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا لمدة [[yrs(n)]]، بنسبة خصم [[i|%]]. المشاريع العامة المشابهة تجاوزت تقديرها بمتوسط [[x|%]]. احسب النسبة بالتقدير، ثم بعد التجاوز.
  solution: |
    $$
    (P/A,\ [[i|%]],\ [[n|n]]) = [[f|f4]]
    $$

    بالتقدير:

    $$
    \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = [[R0|f4]]
    $$

    بعد التجاوز:

    $$
    \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] \times (1 + [[x|%]]) + [[M|g]] \times [[f|f4]]} = [[R1|f4]]
    $$

    [[pick(R0 >= 1, pick(R1 >= 1, "المشروع يبقى مجديا حتى مع التجاوز.", "التجاوز المعتاد يكفي لجعل المشروع غير مجد. القرار يحتاج تقديرا أدق."), "المشروع غير مجد حتى بالتقدير الأصلي.")]]

- id: c12-c-11
  kind: problem
  part: C
  vars: {PB: 4200000, PC: 3500000}
  random: {PB: [1000000, 9000000, 100000], PC: [1000000, 9000000, 100000]}
  calc:
    - R = PB/PC
    - N = PB - PC
  text: |
    القيمة الحالية لمنافع مشروع [[PB|g]] دينار، ولتكاليفه [[PC|g]] دينار. احسب النسبة والقيمة الحالية الصافية للمجتمع. هل تتفقان على القرار؟
  solution: |
    $$
    \frac{[[PB|g]]}{[[PC|g]]} = [[R|f4]] \qquad [[PB|g]] - [[PC|g]] = [[N|g]]
    $$

    نعم، دائما: النسبة أكبر من 1 إذا وفقط إذا كانت القيمة الصافية موجبة. المشروع [[pick(N >= 0, "مجد", "غير مجد")]].

- id: c12-c-12
  kind: problem
  part: C
  vars: {I: 1800000, B: 260000, M: 50000, n: 25, i: 0.06}
  random: {I: [500000, 4000000, 100000], B: [60000, 600000, 5000], M: [10000, 120000, 2500], n: [15, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - R = B*f/(I + M*f)
    - Ra = B/(I*AP(i, n) + M)
  text: |
    مشروع يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا لمدة [[yrs(n)]]. احسب النسبة بالقيمة الحالية، ثم بالقيمة السنوية، بنسبة [[i|%]].
  solution: |
    بالقيمة الحالية:

    $$
    \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = [[R|f4]]
    $$

    بالقيمة السنوية:

    $$
    \frac{[[B|g]]}{[[I|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[M|g]]} = [[Ra|f4]]
    $$

    النتيجة واحدة: القسمة على نفس المعامل في البسط والمقام لا تغير النسبة.
