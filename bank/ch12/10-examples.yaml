# ------------------------------------------------------------ classify
- id: c12-ex-classify
  kind: example
  title: |
    منفعة أم ضرر أم تكلفة؟
  vars: {T: 900000, F: 300000, A: 150000, N: 120000, M: 80000, R: 50000, I: 12000000}
  random: {T: [400000, 1500000, 50000], F: [100000, 600000, 25000], A: [50000, 400000, 10000], N: [20000, 300000, 10000], M: [30000, 200000, 5000], R: [0, 150000, 10000], I: [5000000, 20000000, 500000]}
  calc:
    - B = T + F + A
    - D = N
    - C = M - R
  text: |
    وزارة الأشغال تدرس طريقا سريعا بين مدينتين، يكلف إنشاؤه [[I|g]] دينار. التقديرات السنوية:

    | البند | المبلغ السنوي |
    | --- | --- |
    | توفير وقت المسافرين | [[T|g]] |
    | توفير الوقود وصيانة السيارات | [[F|g]] |
    | تقليل كلفة الحوادث | [[A|g]] |
    | دخل المزارعين الذي يضيع بسبب الأرض المأخوذة والضجيج | [[N|g]] |
    | صيانة الطريق | [[M|g]] |
    | رسوم العبور التي تحصلها الوزارة | [[R|g]] |

    صنف كل بند، واحسب المنافع والأضرار والتكاليف السنوية.
  solution: |
    نسأل لكل بند: من يتأثر؟

    | البند | من يتأثر | النوع |
    | --- | --- | --- |
    | توفير الوقت | الناس | منفعة |
    | توفير الوقود | الناس | منفعة |
    | تقليل الحوادث | الناس | منفعة |
    | دخل المزارعين الضائع | الناس | ضرر |
    | الصيانة | الحكومة | تكلفة |
    | رسوم العبور | الحكومة | وفر يطرح من التكاليف |

    $$
    B = [[T|g]] + [[F|g]] + [[A|g]] = [[B|g]]
    $$

    $$
    \mathrm{Dis} = [[D|g]]
    $$

    $$
    C_{annual} = [[M|g]] - [[R|g]] = [[C|g]]
    $$

    والاستثمار [[I|g]] دينار في السنة 0. رسوم العبور يدفعها المسافرون للحكومة، فهي تنقل مالا بين طرفين من نفس المجتمع. لا نضيفها إلى المنافع أيضا، وإلا حسبناها مرتين.

# ------------------------------------------------------------ discount rate
- id: c12-ex-rate
  kind: example
  title: |
    أثر نسبة الخصم على القرار
  vars: {I: 8000000, B: 650000, M: 100000, n: 40, i1: 0.03, i2: 0.08}
  random: {I: [3000000, 15000000, 500000], B: [200000, 1500000, 10000], M: [20000, 250000, 5000], n: [30, 50, 5], i1: [0.02, 0.04, 0.005], i2: [0.07, 0.10, 0.005]}
  calc:
    - B = floor((I*AP(0.055, n) + M)/10000 + 0.5)*10000
    - f1 = PA(i1, n)
    - f2 = PA(i2, n)
    - R1 = B*f1/(I + M*f1)
    - R2 = B*f2/(I + M*f2)
  text: |
    سد صغير يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه للري ومياه الشرب [[B|g]] دينار سنويا لمدة [[yrs(n)]]. احسب نسبة المنفعة إلى التكلفة بنسبة خصم [[i1|%]]، ثم بنسبة [[i2|%]].
  solution: |
    بنسبة [[i1|%]]:

    $$
    (P/A,\ [[i1|%]],\ [[n|n]]) = [[f1|f4]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]] \times [[f1|f4]]}{[[I|g]] + [[M|g]] \times [[f1|f4]]} = [[R1|f4]]
    $$

    بنسبة [[i2|%]]:

    $$
    (P/A,\ [[i2|%]],\ [[n|n]]) = [[f2|f4]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]] \times [[f2|f4]]}{[[I|g]] + [[M|g]] \times [[f2|f4]]} = [[R2|f4]]
    $$

    الاستثمار في السنة 0 لا يتأثر بالخصم، والمنافع البعيدة تتأثر كثيرا. [[pick(R1 >= 1, pick(R2 >= 1, "المشروع مجد بالنسبتين.", "المشروع مجد بالنسبة المنخفضة وغير مجد بالمرتفعة: النسبة وحدها قررت المشروع."), "المشروع غير مجد حتى بالنسبة المنخفضة.")]]

# ------------------------------------------------------------ conventional and modified
- id: c12-ex-ratios
  kind: example
  title: |
    النسبة التقليدية والنسبة المعدلة
  vars: {I: 3000000, M: 90000, S: 400000, B: 420000, D: 30000, n: 25, i: 0.06}
  random: {I: [1000000, 6000000, 100000], M: [20000, 200000, 5000], S: [0, 800000, 50000], B: [100000, 900000, 10000], D: [0, 100000, 5000], n: [15, 40, 5], i: [0.04, 0.08, 0.005]}
  calc:
    - S = min(S, I*0.3)
    - f = PA(i, n)
    - g = PF(i, n)
    - PB = (B - D)*f
    - PM = M*f
    - PS = S*g
    - Rc = PB/(I + PM - PS)
    - Rm = (PB - PM)/(I - PS)
  text: |
    مبنى مكتبة عامة يكلف [[I|g]] دينار، وتشغيله [[M|g]] دينار سنويا، ويباع بمبلغ [[S|g]] دينار بعد [[yrs(n)]]. منافعه للسكان [[B|g]] دينار سنويا، وأضراره [[D|g]] دينار سنويا. نسبة الخصم [[i|%]]. احسب النسبة التقليدية والنسبة المعدلة.
  solution: |
    القيم الحالية:

    $$
    (P/A,\ [[i|%]],\ [[n|n]]) = [[f|f4]] \qquad (P/F,\ [[i|%]],\ [[n|n]]) = [[g|f4]]
    $$

    $$
    B - \mathrm{Dis} = ([[B|g]] - [[D|g]]) \times [[f|f4]] = [[PB|2]]
    $$

    $$
    C' = [[M|g]] \times [[f|f4]] = [[PM|2]] \qquad S = [[S|g]] \times [[g|f4]] = [[PS|2]]
    $$

    **النسبة التقليدية:**

    $$
    \frac{B - \mathrm{Dis}}{I + C' - S} = \frac{[[PB|2]]}{[[I|g]] + [[PM|2]] - [[PS|2]]} = [[Rc|f4]]
    $$

    **النسبة المعدلة:**

    $$
    \frac{B - \mathrm{Dis} - C'}{I - S} = \frac{[[PB|2]] - [[PM|2]]}{[[I|g]] - [[PS|2]]} = [[Rm|f4]]
    $$

    [[pick(Rc >= 1, "النسبتان أكبر من 1، فالمشروع مجد. المعدلة أكبر لأنها تقسم على مقام أصغر.", "النسبتان أقل من 1، فالمشروع غير مجد. المعدلة أصغر، لأن طرح التشغيل من منافع لا تغطي التكاليف يبعد النسبة عن 1 أكثر.")]]

# ------------------------------------------------------------ disbenefits
- id: c12-ex-disbenefit
  kind: example
  title: |
    أين نضع الأضرار؟
  vars: {PB: 5000000, PD: 800000, PC: 3500000}
  random: {PB: [2000000, 9000000, 100000], PD: [100000, 2000000, 50000], PC: [1500000, 8000000, 100000]}
  calc:
    - R1 = (PB - PD)/PC
    - R2 = PB/(PC + PD)
    - R3 = PB/PC
  text: |
    القيمة الحالية لمنافع مطار صغير [[PB|g]] دينار، ولأضراره على السكان القريبين، من ضجيج وتلوث، [[PD|g]] دينار، ولتكاليفه [[PC|g]] دينار. احسب النسبة بطرح الأضرار من المنافع، ثم بإضافتها إلى التكاليف، ثم بنسيانها.
  solution: |
    طرح الأضرار من المنافع:

    $$
    \frac{[[PB|g]] - [[PD|g]]}{[[PC|g]]} = [[R1|f4]]
    $$

    إضافة الأضرار إلى التكاليف:

    $$
    \frac{[[PB|g]]}{[[PC|g]] + [[PD|g]]} = [[R2|f4]]
    $$

    نسيان الأضرار:

    $$
    \frac{[[PB|g]]}{[[PC|g]]} = [[R3|f4]]
    $$

    الطريقتان الأوليان تعطيان قيمتين مختلفتين، لكن كلتيهما أكبر من 1 أو كلتيهما أقل، لأن الاثنتين تقولان إن المنافع أكبر من التكاليف والأضرار معا أو لا. [[pick(R3 >= 1, pick(R1 < 1, "نسيان الأضرار هنا يقلب القرار: المشروع يبدو مجديا وهو ليس كذلك.", "نسيان الأضرار لم يقلب القرار هنا، لكنه يضخم النسبة."), "المشروع غير مجد حتى بدون الأضرار.")]]

# ------------------------------------------------------------ perpetual project
- id: c12-ex-perpetual
  kind: example
  title: |
    مشروع دائم بالقيمة السنوية
  vars: {I: 20000000, M: 250000, B: 1900000, D: 150000, i: 0.05}
  random: {I: [8000000, 40000000, 1000000], M: [100000, 600000, 25000], B: [600000, 4000000, 50000], D: [0, 400000, 25000], i: [0.03, 0.07, 0.005]}
  calc:
    - AI = I*i
    - R = (B - D)/(AI + M)
  text: |
    قناة ري تكلف [[I|g]] دينار، وصيانتها [[M|g]] دينار سنويا، وتخدم بلا نهاية إذا صينت. منافعها للمزارعين [[B|g]] دينار سنويا، وأضرارها [[D|g]] دينار سنويا. نسبة الخصم [[i|%]]. هل المشروع مجد؟
  solution: |
    القيمة السنوية للاستثمار في مشروع دائم هي الفائدة عليه:

    $$
    A = [[I|g]] \times [[i|%]] = [[AI|g]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]] - [[D|g]]}{[[AI|g]] + [[M|g]]} = [[R|f4]]
    $$

    المشروع [[pick(R >= 1, "مجد", "غير مجد")]]. بالقيمة الحالية نحصل على نفس النسبة: كل مبلغ سنوي دائم قيمته الحالية المبلغ مقسوما على النسبة.

# ------------------------------------------------------------ incremental
- id: c12-ex-incremental
  kind: example
  title: |
    النسبة التزايدية لثلاثة بدائل
  vars: {i: 0.06}
  random: {i: [0.04, 0.08, 0.005]}
  calc:
    - f = PA(i, 30)
    - CA = 4000000 + 120000*f
    - CB = 5500000 + 150000*f
    - CC = 7500000 + 180000*f
    - BA = (520000 - 40000)*f
    - BB = (680000 - 50000)*f
    - BC = (820000 - 60000)*f
    - rA = BA/CA
    - rB = BB/CB
    - rC = BC/CC
    - dBA = (BB - BA)/(CB - CA)
    - b1 = pick(rA >= 1, 1, 0)
    - dCB = (BC - BB)/(CC - CB)
    - dCA = (BC - BA)/(CC - CA)
  text: |
    بلدية تختار تصميما واحدا لمحطة معالجة مياه عادمة، أو لا تبني شيئا. العمر 30 سنة، ونسبة الخصم [[i|%]]. المبالغ بالدينار:

    | التصميم | الاستثمار | التشغيل السنوي | المنافع السنوية | الأضرار السنوية |
    | --- | --- | --- | --- | --- |
    | أ | 4,000,000 | 120,000 | 520,000 | 40,000 |
    | ب | 5,500,000 | 150,000 | 680,000 | 50,000 |
    | ج | 7,500,000 | 180,000 | 820,000 | 60,000 |

    أي تصميم تختار؟
  solution: |
    $$
    (P/A,\ [[i|%]],\ 30) = [[f|f4]]
    $$

    القيم الحالية للتكاليف وللمنافع الصافية، مرتبة حسب التكاليف:

    | التصميم | التكاليف | المنافع ناقص الأضرار | النسبة |
    | --- | --- | --- | --- |
    | أ | [[CA|0]] | [[BA|0]] | [[rA|f4]] |
    | ب | [[CB|0]] | [[BB|0]] | [[rB|f4]] |
    | ج | [[CC|0]] | [[BC|0]] | [[rC|f4]] |

    **أ مقابل عدم البناء:** النسبة [[rA|f4]]. [[pick(rA >= 1, "أ أفضل من عدم البناء.", "أ لا يبرر تكلفته، فنقارن ب بعدم البناء.")]]

    **ب مقابل [[pick(rA >= 1, "أ", "عدم البناء")]]:**

    $$
    \frac{\Delta B}{\Delta C} = [[pick(rA >= 1, dBA, rB)|f4]]
    $$

    [[pick(pick(rA >= 1, dBA, rB) >= 1, "الدينار الإضافي في ب يعيد أكثر من دينار، فيصبح ب الأفضل.", "الإضافة لا تبرر تكلفتها، فيبقى البديل السابق.")]]

    **ج مقابل الأفضل حتى الآن:**

    $$
    \frac{\Delta B}{\Delta C} = [[pick(pick(rA >= 1, dBA, rB) >= 1, dCB, pick(rA >= 1, dCA, rC))|f4]]
    $$

    [[pick(pick(pick(rA >= 1, dBA, rB) >= 1, dCB, pick(rA >= 1, dCA, rC)) >= 1, "ج يبرر الإضافة، فهو الأفضل.", "ج لا يبرر الإضافة.")]]

    الاختيار: [[pick(pick(pick(rA >= 1, dBA, rB) >= 1, dCB, pick(rA >= 1, dCA, rC)) >= 1, "ج", pick(pick(rA >= 1, dBA, rB) >= 1, "ب", pick(rA >= 1, "أ", "عدم البناء")))]]. لاحظ أن أعلى نسبة منفردة قد تكون لبديل آخر: النسبة المنفردة لا تختار بين البدائل.

# ------------------------------------------------------------ highest ratio is not best
- id: c12-ex-net
  kind: example
  title: |
    أعلى نسبة ليست أفضل بديل
  vars: {C1: 1000000, B1: 1600000, C2: 2500000, B2: 3400000}
  random: {C1: [500000, 2000000, 100000], B1: [600000, 4000000, 100000], C2: [2100000, 5000000, 100000], B2: [2200000, 8000000, 100000]}
  calc:
    - B1 = floor(C1*1.6/100000 + 0.5)*100000
    - B2 = B1 + floor((C2 - C1)*1.2/100000 + 0.5)*100000
    - r1 = B1/C1
    - r2 = B2/C2
    - dr = (B2 - B1)/(C2 - C1)
    - N1 = B1 - C1
    - N2 = B2 - C2
  text: |
    بديلان متنافيان لتحسين شبكة طرق داخل مدينة. القيم الحالية بالدينار:

    | البديل | التكاليف | المنافع |
    | --- | --- | --- |
    | س | [[C1|g]] | [[B1|g]] |
    | ص | [[C2|g]] | [[B2|g]] |

    أيهما تختار؟
  solution: |
    النسب المنفردة:

    $$
    \frac{[[B1|g]]}{[[C1|g]]} = [[r1|f4]] \qquad \frac{[[B2|g]]}{[[C2|g]]} = [[r2|f4]]
    $$

    س أعلى نسبة. لكن السؤال: هل الإضافة إلى ص تستحق؟

    $$
    \frac{\Delta B}{\Delta C} = \frac{[[B2|g]] - [[B1|g]]}{[[C2|g]] - [[C1|g]]} = [[dr|f4]]
    $$

    النسبة التزايدية أكبر من 1، فنختار ص. التأكد بالمنفعة الصافية:

    $$
    [[B1|g]] - [[C1|g]] = [[N1|g]] \qquad [[B2|g]] - [[C2|g]] = [[N2|g]]
    $$

    ص يعطي المجتمع منفعة صافية أكبر. النسبة التزايدية والمنفعة الصافية تتفقان دائما.

# ------------------------------------------------------------ independent projects
- id: c12-ex-independent
  kind: example
  title: |
    مشاريع مستقلة بميزانية محدودة
  text: |
    وزارة الصحة تدرس أربعة مشاريع مستقلة في محافظات مختلفة. القيم الحالية بآلاف الدنانير:

    | المشروع | التكاليف | المنافع ناقص الأضرار |
    | --- | --- | --- |
    | عيادة متنقلة | 800 | 1,150 |
    | قسم طوارئ | 2,400 | 3,100 |
    | مختبر مركزي | 1,500 | 1,400 |
    | حملة تطعيم | 600 | 1,020 |

    (أ) أي المشاريع مقبولة إذا كانت الميزانية تكفي الجميع؟ (ب) وإذا كانت الميزانية 3,000 ألف دينار؟
  solution: |
    (أ) النسب:

    | المشروع | النسبة | المنفعة الصافية |
    | --- | --- | --- |
    | عيادة متنقلة | 1.438 | 350 |
    | قسم طوارئ | 1.292 | 700 |
    | مختبر مركزي | 0.933 | -100 |
    | حملة تطعيم | 1.700 | 420 |

    المشاريع مستقلة، فكل مشروع نسبته 1 أو أكثر مقبول: العيادة والطوارئ والتطعيم. المختبر مرفوض.

    (ب) العيادة والطوارئ والتطعيم تكلف 3,800، أكثر من الميزانية. المجموعات الممكنة داخل 3,000:

    | المجموعة | التكاليف | المنفعة الصافية |
    | --- | --- | --- |
    | الطوارئ والتطعيم | 3,000 | 1,120 |
    | العيادة والتطعيم | 1,400 | 770 |
    | الطوارئ وحده | 2,400 | 700 |

    نختار الطوارئ والتطعيم، بأكبر منفعة صافية. العيادة لها نسبة أعلى من الطوارئ، لكن المجموعة معها تترك 1,600 ألف بلا استخدام.

# ------------------------------------------------------------ cost-effectiveness
- id: c12-ex-cea
  kind: example
  title: |
    تكلفة كل حادث يمنع
  vars: {C1: 1200000, E1: 40, C2: 2600000, E2: 70}
  random: {C1: [500000, 2000000, 100000], E1: [20, 60, 1], C2: [2100000, 5000000, 100000], E2: [61, 120, 1]}
  calc:
    - r1 = C1/E1
    - r2 = C2/E2
    - dr = (C2 - C1)/(E2 - E1)
  text: |
    إدارة السير تختار برنامجا واحدا لتقليل الحوادث الخطيرة على طريق جبلي. البرنامج الأول، إشارات وإنارة، قيمته الحالية [[C1|g]] دينار، ويمنع [[E1|g]] حادثا خطيرا خلال عمره. الثاني، توسعة المنعطفات، يكلف [[C2|g]] دينار، ويمنع [[E2|g]] حادثا. قارن بينهما.
  solution: |
    تكلفة كل حادث يمنع:

    $$
    \frac{[[C1|g]]}{[[E1|g]]} = [[r1|2]] \qquad \frac{[[C2|g]]}{[[E2|g]]} = [[r2|2]]
    $$

    البرنامج الأول أكفأ لكل حادث. لكن الثاني يمنع حوادث أكثر. التكلفة الإضافية لكل حادث إضافي:

    $$
    \frac{[[C2|g]] - [[C1|g]]}{[[E2|g]] - [[E1|g]]} = [[dr|2]]
    $$

    التحليل لا يقرر وحده. إذا كانت الجهة مستعدة لدفع [[dr|0]] دينار أو أكثر لمنع حادث خطير، تختار الثاني. وإلا تختار الأول. هذا الرقم يجعل القرار واضحا للمسؤول، بدون أن نسعر حياة إنسان صراحة.
