items:

- id: c12-a-01
  kind: concept
  part: A
  text: |
    اذكر ثلاثة فروق بين تقييم مشروع عام وتقييم مشروع لشركة خاصة.
  solution: |
    في المشروع العام تدفع الحكومة ويستفيد الناس، فلا يوجد إيراد يقاس به الربح. المنافع كثيرا ما تكون بلا سعر في السوق، مثل الوقت والصحة. والأعمار أطول، ونسبة الخصم أقل.

- id: c12-a-02
  kind: concept
  part: A
  text: |
    ما الفرق بين المنفعة والضرر في المشروع العام؟ أعط مثالا لكل منهما من مشروع مطار.
  solution: |
    المنفعة ما يكسبه الناس من المشروع، مثل وقت السفر الذي يوفرونه. الضرر ما يخسره الناس بسببه، مثل الضجيج على سكان المنطقة القريبة. الاثنان يقعان على الناس، لا على الحكومة.

- id: c12-a-03
  kind: concept
  part: A
  text: |
    رسوم الدخول إلى حديقة عامة تحصلها البلدية. هل هي منفعة أم تقليل للتكلفة؟
  solution: |
    تقليل لتكلفة البلدية. الزائر يدفعها والبلدية تأخذها، فهي انتقال مال داخل المجتمع. المنفعة الحقيقية هي ما يكسبه الزائر من الحديقة، ونحسبها مرة واحدة فقط.

- id: c12-a-04
  kind: concept
  part: A
  text: |
    لماذا تستخدم الحكومة نسبة خصم أقل من الشركات الخاصة عادة؟
  solution: |
    الحكومة تقترض بفائدة أقل، ولا تطلب ربحا فوق تكلفة المال. والمجتمع يهتم بالأجيال القادمة أكثر من المستثمر الفرد، فلا يخصم المستقبل بشدة.

- id: c12-a-05
  kind: concept
  part: A
  text: |
    كيف تؤثر نسبة الخصم المرتفعة على مشروع عام منافعه تمتد 50 سنة؟
  solution: |
    تخفض القيمة الحالية للمنافع البعيدة كثيرا، بينما الاستثمار في البداية لا يتأثر. فتنخفض النسبة، وقد يرفض مشروع مجد.

- id: c12-a-06
  kind: concept
  part: A
  text: |
    النسبة التقليدية لمشروع 1.25، والنسبة المعدلة 1.40. هل يمكن أن تكون إحداهما أكبر من 1 والأخرى أقل؟
  solution: |
    لا. الاثنتان أكبر من 1 إذا وفقط إذا كانت المنافع الصافية أكبر من التكاليف الصافية. قيمتاهما تختلفان، لكن القرار واحد.

- id: c12-a-07
  kind: concept
  part: A
  text: |
    لماذا لا نختار البديل صاحب أعلى نسبة منفعة إلى تكلفة بين عدة بدائل متنافية؟
  solution: |
    النسبة لا تقيس حجم المنفعة الصافية. بديل أغلى بنسبة أقل قد يعطي منفعة صافية أكبر، إذا كانت كل دينار إضافي فيه يعيد أكثر من دينار. لذلك نستخدم النسبة التزايدية.

- id: c12-a-08
  kind: concept
  part: A
  text: |
    متى نستخدم تحليل الفعالية مقابل التكلفة بدل نسبة المنفعة إلى التكلفة؟
  solution: |
    عندما لا يتفق الناس على سعر للمنفعة، مثل حياة تنقذ أو طالب يتخرج. نقيس المنفعة بوحدتها، ونقارن تكلفة كل وحدة.

- id: c12-a-09
  kind: concept
  part: A
  text: |
    مشروع طريق يقلل الحوادث. لماذا يحتاج تقدير منفعته إلى قيمة تضعها الجهة لحياة الإنسان أو للإصابة، حتى لو كان ذلك صعبا؟
  solution: |
    إذا لم توضع قيمة، فكأن المنفعة صفر، ويرفض مشروع ينقذ أرواحا. وضع قيمة صريحة يجعل الافتراض واضحا ويمكن نقاشه وتغييره.

- id: c12-a-10
  kind: concept
  part: A
  text: |
    في مشروع عام، لماذا لا نضيف الوظائف التي يوفرها بناء المشروع إلى منافعه دائما؟
  solution: |
    أجور العمال جزء من تكلفة الإنشاء. إذا كان العمال سيعملون في مكان آخر بدون المشروع، فالوظائف لا تضيف للمجتمع شيئا. تعد منفعة فقط إذا كانوا عاطلين، وبقدر الفرق.

- id: c12-a-11
  kind: concept
  part: A
  text: |
    ما الخطأ في عد زيادة مبيعات محلات قريبة من طريق جديد منفعة، وتجاهل انخفاض مبيعات محلات على الطريق القديم؟
  solution: |
    جزء كبير من المبيعات انتقل من مكان إلى آخر، ولم يزد في المجتمع. عد الزيادة وحدها يضخم المنافع. الانخفاض على الطريق القديم ضرر يجب أن يطرح.

- id: c12-a-12
  kind: concept
  part: A
  text: |
    مشروعان عامان مستقلان، نسبة كل منهما أكبر من 1، والميزانية تكفي لهما. هل ننفذ الاثنين؟
  solution: |
    نعم. المشاريع المستقلة لا تتنافس، وكل مشروع نسبته 1 أو أكثر يعطي المجتمع أكثر مما يكلف. النسبة التزايدية تلزم فقط للبدائل المتنافية.
