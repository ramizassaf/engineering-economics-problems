# ================================================================ part D
- id: c12-d-01
  kind: problem
  part: D
  vars: {PB: 6000000, PD: 500000, PI: 3000000, PM: 1200000, PS: 200000}
  random: {PB: [2000000, 12000000, 100000], PD: [0, 1500000, 50000], PI: [1000000, 6000000, 100000], PM: [200000, 3000000, 100000], PS: [0, 600000, 50000]}
  calc:
    - Rc = (PB - PD)/(PI + PM - PS)
    - Rm = (PB - PD - PM)/(PI - PS)
  text: |
    القيم الحالية لمشروع: منافع [[PB|g]]، وأضرار [[PD|g]]، واستثمار [[PI|g]]، وتشغيل وصيانة [[PM|g]]، وقيمة بيع [[PS|g]] دينار. احسب النسبة التقليدية والنسبة المعدلة.
  solution: |
    $$
    \frac{B - D}{I + M - S} = \frac{[[PB|g]] - [[PD|g]]}{[[PI|g]] + [[PM|g]] - [[PS|g]]} = [[Rc|f4]]
    $$

    $$
    \frac{B - D - M}{I - S} = \frac{[[PB|g]] - [[PD|g]] - [[PM|g]]}{[[PI|g]] - [[PS|g]]} = [[Rm|f4]]
    $$

    القرار واحد: [[pick(Rc >= 1, "مجد", "غير مجد")]].

- id: c12-d-02
  kind: problem
  part: D
  vars: {I: 2500000, M: 70000, B: 330000, D: 40000, n: 30, i: 0.05}
  random: {I: [800000, 6000000, 100000], M: [10000, 200000, 5000], B: [80000, 900000, 10000], D: [0, 120000, 5000], n: [20, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - Rc = (B - D)*f/(I + M*f)
    - Rm = ((B - D - M)*f)/I
  text: |
    مركز شباب يكلف [[I|g]] دينار، وتشغيله [[M|g]] دينار سنويا لمدة [[yrs(n)]]. منافعه [[B|g]] دينار سنويا، وأضراره على الجيران [[D|g]] دينار سنويا. احسب النسبتين بنسبة [[i|%]].
  solution: |
    $$
    (P/A,\ [[i|%]],\ [[n|n]]) = [[f|f4]]
    $$

    التقليدية:

    $$
    \frac{([[B|g]] - [[D|g]]) \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = [[Rc|f4]]
    $$

    المعدلة:

    $$
    \frac{([[B|g]] - [[D|g]] - [[M|g]]) \times [[f|f4]]}{[[I|g]]} = [[Rm|f4]]
    $$

- id: c12-d-03
  kind: problem
  part: D
  vars: {PB: 3000000, PD: 400000, PC: 2400000}
  random: {PB: [1000000, 6000000, 100000], PD: [100000, 1500000, 50000], PC: [800000, 5000000, 100000]}
  calc:
    - R1 = (PB - PD)/PC
    - R2 = PB/(PC + PD)
  text: |
    القيمة الحالية لمنافع مشروع [[PB|g]] دينار، ولأضراره [[PD|g]]، ولتكاليفه [[PC|g]]. احسب النسبة مرة بطرح الأضرار من المنافع، ومرة بإضافتها إلى التكاليف.
  solution: |
    $$
    \frac{[[PB|g]] - [[PD|g]]}{[[PC|g]]} = [[R1|f4]]
    $$

    $$
    \frac{[[PB|g]]}{[[PC|g]] + [[PD|g]]} = [[R2|f4]]
    $$

    القيمتان مختلفتان، والقرار واحد: [[pick(R1 >= 1, "مجد", "غير مجد")]]. لذلك لا يقارن رقما نسبة من جهتين مختلفتين إلا إذا عرفنا كيف وضعت الأضرار.

- id: c12-d-04
  kind: problem
  part: D
  vars: {PB: 5000000, PC: 4000000}
  random: {PB: [2000000, 9000000, 100000], PC: [1000000, 8000000, 100000]}
  calc:
    - PC = min(PC, PB - 200000)
    - Dmax = PB - PC
  text: |
    القيمة الحالية لمنافع مشروع [[PB|g]] دينار، ولتكاليفه [[PC|g]] دينار. أهالي منطقة مجاورة يعترضون بسبب الضجيج. ما أكبر قيمة حالية للأضرار يبقى المشروع معها مجديا؟
  solution: |
    المشروع مجد ما دامت المنافع ناقص الأضرار لا تقل عن التكاليف:

    $$
    [[PB|g]] - D \ge [[PC|g]]
    $$

    $$
    D \le [[Dmax|g]]
    $$

    إذا قدرت الأضرار بأكثر من [[Dmax|g]] دينار، يصبح المشروع غير مجد. هذا الرقم يحدد كم يستحق أن تنفق الجهة على عزل الضجيج.

- id: c12-d-05
  kind: problem
  part: D
  vars: {I: 1000000, M: 50000, B: 160000, n: 20, i: 0.06}
  random: {I: [400000, 3000000, 50000], M: [10000, 120000, 2500], B: [40000, 400000, 5000], n: [15, 30, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - Rc = B*f/(I + M*f)
    - Rm = (B - M)*f/I
  text: |
    نسبة تقليدية ونسبة معدلة لمشروع يكلف [[I|g]] دينار، وتشغيله [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا لمدة [[yrs(n)]]، بنسبة [[i|%]]. أيهما أبعد عن 1؟ ولماذا؟
  solution: |
    $$
    \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = [[Rc|f4]] \qquad \frac{([[B|g]] - [[M|g]]) \times [[f|f4]]}{[[I|g]]} = [[Rm|f4]]
    $$

    المعدلة أبعد عن 1 دائما. نقل نفس المبلغ من المقام إلى البسط، بإشارة سالبة، يكبر النسبة إذا كانت فوق 1، ويصغرها إذا كانت تحت 1.

- id: c12-d-06
  kind: concept
  part: D
  text: |
    جهة مانحة تقبل المشاريع ذات النسبة الأعلى من 1.5 فقط. لماذا يجب أن تحدد الجهة أي نسبة تقصد، التقليدية أم المعدلة؟
  solution: |
    عتبة 1 لا تتأثر بنوع النسبة، لكن أي عتبة أخرى تتأثر. مشروع قد تكون نسبته المعدلة 1.6 والتقليدية 1.3، فيقبل بواحدة ويرفض بالأخرى.

- id: c12-d-07
  kind: problem
  part: D
  vars: {I: 3000000, M: 90000, R: 60000, B: 380000, n: 25, i: 0.05}
  random: {I: [1000000, 6000000, 100000], M: [30000, 200000, 5000], R: [10000, 150000, 5000], B: [100000, 800000, 10000], n: [15, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - R1 = B*f/(I + (M - R)*f)
    - R2 = (B + R)*f/(I + M*f)
  text: |
    مسبح بلدي يكلف [[I|g]] دينار، وتشغيله [[M|g]] دينار سنويا. البلدية تحصل رسوم دخول [[R|g]] دينار سنويا. منافع السكان من المسبح، بعد ما يدفعونه من رسوم، [[B|g]] دينار سنويا. العمر [[yrs(n)]]، والنسبة [[i|%]]. احسب النسبة الصحيحة. ثم احسبها بالخطأ الشائع: إضافة الرسوم إلى المنافع.
  solution: |
    الرسوم تقلل تكلفة البلدية:

    $$
    \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] + ([[M|g]] - [[R|g]]) \times [[f|f4]]} = [[R1|f4]]
    $$

    الخطأ الشائع:

    $$
    \frac{([[B|g]] + [[R|g]]) \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = [[R2|f4]]
    $$

    الرقمان قريبان، لكن الثاني يخلط ما يكسبه الناس بما تجمعه البلدية منهم.

- id: c12-d-08
  kind: problem
  part: D
  vars: {PB: 7000000, PD: 900000, PI: 4000000, PM: 1500000}
  random: {PB: [3000000, 12000000, 100000], PD: [100000, 2000000, 100000], PI: [1500000, 7000000, 100000], PM: [300000, 3000000, 100000]}
  calc:
    - R0 = PB/(PI + PM)
    - Rc = (PB - PD)/(PI + PM)
  text: |
    محلل حسب نسبة مشروع بدون الأضرار. القيم الحالية: منافع [[PB|g]]، وأضرار [[PD|g]]، واستثمار [[PI|g]]، وتشغيل [[PM|g]] دينار. كم كانت نسبته؟ وكم النسبة الصحيحة؟
  solution: |
    حساب المحلل:

    $$
    \frac{[[PB|g]]}{[[PI|g]] + [[PM|g]]} = [[R0|f4]]
    $$

    الصحيح:

    $$
    \frac{[[PB|g]] - [[PD|g]]}{[[PI|g]] + [[PM|g]]} = [[Rc|f4]]
    $$

    [[pick(R0 >= 1, pick(Rc < 1, "نسيان الأضرار قلب القرار.", "القرار لم يتغير، لكن المشروع أقل جدوى مما بدا."), "المشروع غير مجد في الحالتين.")]]

- id: c12-d-09
  kind: problem
  part: D
  vars: {I: 1500000, M: 40000, B: 220000, D: 30000, n: 20, i: 0.06}
  random: {I: [500000, 4000000, 100000], M: [10000, 120000, 5000], B: [60000, 600000, 5000], D: [0, 100000, 5000], n: [15, 30, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, n)
    - N = (B - D)*f - I - M*f
  text: |
    احسب القيمة الحالية الصافية للمجتمع لمشروع يكلف [[I|g]] دينار، وتشغيله [[M|g]] دينار سنويا، ومنافعه [[B|g]] وأضراره [[D|g]] دينار سنويا لمدة [[yrs(n)]]، بنسبة [[i|%]]. هل تحتاج النسبة بعدها؟
  solution: |
    $$
    PW = ([[B|g]] - [[D|g]] - [[M|g]])\,(P/A,\ [[i|%]],\ [[n|n]]) - [[I|g]] = [[N|2]]
    $$

    لمشروع واحد لا: القيمة الصافية الموجبة تعني نسبة أكبر من 1، وتعطي نفس القرار. كثير من الدول تطلب النسبة في التقارير لأنها مألوفة للمسؤولين.

- id: c12-d-10
  kind: concept
  part: D
  text: |
    لماذا تفضل بعض الجهات النسبة المعدلة لترتيب المشاريع؟
  solution: |
    المقام فيها الاستثمار فقط، وهو المورد المحدود في الميزانية الرأسمالية. فالنسبة تقيس المنفعة الصافية لكل دينار استثمار، مثل مؤشر الربحية في @sec-budget.

# ================================================================ part E
- id: c12-e-01
  kind: problem
  part: E
  vars: {I: 15000000, M: 200000, B: 1400000, i: 0.05}
  random: {I: [5000000, 30000000, 1000000], M: [50000, 500000, 25000], B: [400000, 3000000, 50000], i: [0.03, 0.07, 0.005]}
  calc:
    - R = B/(I*i + M)
  text: |
    سد يخدم بلا نهاية يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا. احسب النسبة بنسبة [[i|%]].
  solution: |
    $$
    \frac{[[B|g]]}{[[I|g]] \times [[i|%]] + [[M|g]]} = [[R|f4]]
    $$

- id: c12-e-02
  kind: problem
  part: E
  vars: {I: 8000000, M: 150000, R: 500000, k: 10, B: 900000, i: 0.04}
  random: {I: [3000000, 15000000, 500000], M: [50000, 300000, 10000], R: [100000, 1500000, 50000], k: [5, 20, 5], B: [300000, 2000000, 50000], i: [0.03, 0.07, 0.005]}
  calc:
    - AR = R*AF(i, k)
    - R1 = B/(I*i + M + AR)
  text: |
    جسر حجري يخدم بلا نهاية. يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ويحتاج تجديد سطحه كل [[yrs(k)]] بتكلفة [[R|g]] دينار. منافعه [[B|g]] دينار سنويا. احسب النسبة بنسبة [[i|%]].
  solution: |
    التجديد الدوري يتحول إلى مبلغ سنوي بمعامل صندوق الادخار:

    $$
    [[R|g]]\,(A/F,\ [[i|%]],\ [[k|n]]) = [[AR|2]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]]}{[[I|g]] \times [[i|%]] + [[M|g]] + [[AR|2]]} = [[R1|f4]]
    $$

- id: c12-e-03
  kind: problem
  part: E
  vars: {I: 2000000, M: 60000, S: 300000, B: 320000, n: 20, i: 0.06}
  random: {I: [600000, 5000000, 100000], M: [10000, 150000, 5000], S: [0, 600000, 50000], B: [80000, 800000, 10000], n: [10, 30, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - S = min(S, I*0.3)
    - CR = I*AP(i, n) - S*AF(i, n)
    - R = B/(CR + M)
  text: |
    حافلات نقل مدرسي تكلف [[I|g]] دينار، وتشغيلها [[M|g]] دينار سنويا، وتباع بمبلغ [[S|g]] دينار بعد [[yrs(n)]]. منافعها [[B|g]] دينار سنويا. احسب النسبة بالقيمة السنوية، بنسبة [[i|%]].
  solution: |
    تكلفة استرداد رأس المال، كما في الفصل الثالث:

    $$
    CR = [[I|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]]}{[[CR|2]] + [[M|g]]} = [[R|f4]]
    $$

- id: c12-e-04
  kind: problem
  part: E
  vars: {I: 20000000, M: 300000, i: 0.05}
  random: {I: [5000000, 40000000, 1000000], M: [50000, 800000, 25000], i: [0.03, 0.07, 0.005]}
  calc:
    - Bmin = I*i + M
  text: |
    ميناء صيد يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ويخدم بلا نهاية. ما أقل منفعة سنوية تجعله مجديا بنسبة [[i|%]]؟
  solution: |
    $$
    B = [[I|g]] \times [[i|%]] + [[M|g]] = [[Bmin|g]]
    $$

- id: c12-e-05
  kind: problem
  part: E
  vars: {I: 10000000, M: 200000, B: 900000}
  random: {I: [3000000, 20000000, 500000], M: [50000, 500000, 25000], B: [300000, 2500000, 50000]}
  calc:
    - B = max(B, M + I*0.02)
    - r = (B - M)/I
  text: |
    مشروع دائم يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا. ما أعلى نسبة خصم يبقى عندها مجديا؟
  solution: |
    المشروع مجد ما دام:

    $$
    [[I|g]] \times i + [[M|g]] \le [[B|g]]
    $$

    $$
    i \le \frac{[[B|g]] - [[M|g]]}{[[I|g]]} = [[r|%2]]
    $$

- id: c12-e-06
  kind: problem
  part: E
  vars: {I: 12000000, M: 250000, B: 1100000, n: 50, i: 0.05}
  random: {I: [4000000, 25000000, 1000000], M: [50000, 600000, 25000], B: [300000, 3000000, 50000], n: [30, 60, 10], i: [0.03, 0.07, 0.005]}
  calc:
    - Rn = B/(I*AP(i, n) + M)
    - Ri = B/(I*i + M)
  text: |
    مشروع يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا. احسب النسبة إذا كان عمره [[yrs(n)]]، ثم إذا كان بلا نهاية، بنسبة [[i|%]]. ماذا تلاحظ؟
  solution: |
    بعمر [[n|n]] سنة:

    $$
    \frac{[[B|g]]}{[[I|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[M|g]]} = [[Rn|f4]]
    $$

    بلا نهاية:

    $$
    \frac{[[B|g]]}{[[I|g]] \times [[i|%]] + [[M|g]]} = [[Ri|f4]]
    $$

    الفرق صغير. بعد خمسين سنة تقريبا، القيمة الحالية للسنوات الإضافية قليلة، فافتراض العمر الدائم تقريب مقبول للمنشآت الطويلة.

- id: c12-e-07
  kind: problem
  part: E
  vars: {P: 30000000, i: 0.04}
  random: {P: [5000000, 60000000, 1000000], i: [0.03, 0.07, 0.005]}
  calc:
    - A = P*i
  text: |
    القيمة الحالية للتكاليف المرسملة لنظام صرف صحي دائم [[P|g]] دينار. ما القيمة السنوية المكافئة بنسبة [[i|%]]؟
  solution: |
    $$
    A = [[P|g]] \times [[i|%]] = [[A|g]]
    $$

    إذا كانت المنافع السنوية أكبر من هذا المبلغ، فالمشروع مجد.

- id: c12-e-08
  kind: problem
  part: E
  vars: {I: 6000000, M0: 100000, G: 5000, B: 700000, n: 40, i: 0.05}
  random: {I: [2000000, 12000000, 500000], M0: [30000, 250000, 5000], G: [1000, 12000, 500], B: [200000, 1500000, 10000], n: [25, 50, 5], i: [0.03, 0.07, 0.005]}
  calc:
    - AM = M0 + G*AG(i, n)
    - R = B/(I*AP(i, n) + AM)
  text: |
    طريق يكلف [[I|g]] دينار. صيانته [[M0|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة مع تقادمه، لمدة [[yrs(n)]]. منافعه [[B|g]] دينار سنويا. احسب النسبة بالقيمة السنوية، بنسبة [[i|%]].
  solution: |
    الصيانة المتدرجة إلى مبلغ سنوي متساو:

    $$
    [[M0|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ [[n|n]]) = [[AM|2]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]]}{[[I|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[AM|2]]} = [[R|f4]]
    $$

- id: c12-e-09
  kind: problem
  part: E
  vars: {I: 5000000, B: 600000, M: 100000, n: 30, i: 0.05, t: 3}
  random: {I: [2000000, 10000000, 500000], B: [200000, 1500000, 10000], M: [30000, 300000, 10000], n: [20, 40, 5], i: [0.03, 0.07, 0.005], t: [2, 5, 1]}
  calc:
    - PB = (B - M)*PA(i, n)*PF(i, t)
    - R0 = (B - M)*PA(i, n)/I
    - R = PB/I
  text: |
    مشروع يكلف [[I|g]] دينار اليوم. منافعه [[B|g]] دينار سنويا، وتشغيله [[M|g]] دينار سنويا، لمدة [[yrs(n)]]. التحليل الأول افترض أن المنافع تبدأ في السنة الأولى. الواقع أن البناء يأخذ [[yrs(t)]]، فتبدأ المنافع في السنة [[t+1|n]]. احسب النسبة المعدلة في الحالتين، بنسبة [[i|%]].
  solution: |
    منافع تبدأ في السنة الأولى:

    $$
    \frac{([[B|g]] - [[M|g]])\,(P/A,\ [[i|%]],\ [[n|n]])}{[[I|g]]} = [[R0|f4]]
    $$

    منافع مؤجلة [[t|n]] سنوات:

    $$
    \frac{([[B|g]] - [[M|g]])\,(P/A,\ [[i|%]],\ [[n|n]])\,(P/F,\ [[i|%]],\ [[t|n]])}{[[I|g]]} = [[R|f4]]
    $$

    تأخير المنافع يخفض النسبة بنفس معامل الخصم. في المشاريع العامة، تأخير التنفيذ له ثمن.

- id: c12-e-10
  kind: concept
  part: E
  text: |
    لماذا يكفي أن نضرب الاستثمار في نسبة الخصم لنحصل على قيمته السنوية في مشروع دائم؟
  solution: |
    إذا وضع المبلغ في حساب بهذه النسبة، فإن الفائدة السنوية عليه هي ما يمكن سحبه كل سنة بلا نهاية مع بقاء المبلغ. فهي القيمة السنوية المكافئة له.

# ================================================================ part F
- id: c12-f-01
  kind: problem
  part: F
  vars: {C1: 2000000, B1: 2600000, C2: 3200000, B2: 3900000}
  random: {C1: [800000, 3000000, 100000], B1: [900000, 4500000, 100000], C2: [3100000, 6000000, 100000], B2: [3000000, 8000000, 100000]}
  calc:
    - B1 = max(B1, C1 + 100000)
    - r1 = B1/C1
    - r2 = B2/C2
    - dr = (B2 - B1)/(C2 - C1)
  text: |
    بديلان متنافيان لمحطة إطفاء. القيم الحالية: الأول تكاليفه [[C1|g]] ومنافعه [[B1|g]]، والثاني تكاليفه [[C2|g]] ومنافعه [[B2|g]] دينار. أيهما تختار؟
  solution: |
    الأول مجد منفردا:

    $$
    \frac{[[B1|g]]}{[[C1|g]]} = [[r1|f4]]
    $$

    الإضافة إلى الثاني:

    $$
    \frac{\Delta B}{\Delta C} = \frac{[[B2|g]] - [[B1|g]]}{[[C2|g]] - [[C1|g]]} = [[dr|f4]]
    $$

    [[pick(dr >= 1, "الإضافة تبرر تكلفتها: نختار الثاني.", "الإضافة لا تبرر تكلفتها: نختار الأول.")]]

- id: c12-f-02
  kind: problem
  part: F
  vars: {i: 0.06}
  random: {i: [0.03, 0.09, 0.005]}
  calc:
    - f = PA(i, 25)
    - CX = 1500000 + 40000*f
    - CY = 2300000 + 50000*f
    - BX = 170000*f
    - BY = 240000*f
    - rX = BX/CX
    - dYX = (BY - BX)/(CY - CX)
    - rY = BY/CY
  text: |
    تصميمان لمركز رعاية مسنين، والعمر 25 سنة. التصميم س يكلف 1,500,000 دينار، وتشغيله 40,000 سنويا، ومنافعه 170,000 سنويا. التصميم ص يكلف 2,300,000 دينار، وتشغيله 50,000، ومنافعه 240,000. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    $$
    (P/A,\ [[i|%]],\ 25) = [[f|f4]]
    $$

    | التصميم | التكاليف | المنافع | النسبة |
    | --- | --- | --- | --- |
    | س | [[CX|0]] | [[BX|0]] | [[rX|f4]] |
    | ص | [[CY|0]] | [[BY|0]] | [[rY|f4]] |

    [[pick(rX >= 1, "س مجد مقابل عدم البناء. نقارن ص بـ س:", "س غير مجد، فنقارن ص بعدم البناء مباشرة:")]]

    $$
    \frac{\Delta B}{\Delta C} = [[pick(rX >= 1, dYX, rY)|f4]]
    $$

    الاختيار: [[pick(pick(rX >= 1, dYX, rY) >= 1, "ص", pick(rX >= 1, "س", "عدم البناء"))]].

- id: c12-f-03
  kind: problem
  part: F
  text: |
    أربعة بدائل متنافية لشبكة مياه في بلدة، بالقيمة الحالية بآلاف الدنانير:

    | البديل | التكاليف | المنافع |
    | --- | --- | --- |
    | أ | 1,200 | 1,500 |
    | ب | 1,800 | 2,300 |
    | ج | 2,500 | 2,950 |
    | د | 3,100 | 3,800 |

    طبق النسبة التزايدية.
  solution: |
    البدائل مرتبة حسب التكاليف.

    | المقارنة | الفرق في المنافع | الفرق في التكاليف | النسبة | الأفضل |
    | --- | --- | --- | --- | --- |
    | أ مقابل لا شيء | 1,500 | 1,200 | 1.250 | أ |
    | ب مقابل أ | 800 | 600 | 1.333 | ب |
    | ج مقابل ب | 650 | 700 | 0.929 | ب |
    | د مقابل ب | 1,500 | 1,300 | 1.154 | د |

    الاختيار د. لاحظ أن ج رفض، لكن د قورن بـ ب وليس بـ ج، لأن ب كان الأفضل حتى تلك الخطوة. المنفعة الصافية لـ د 700، وهي الأكبر.

- id: c12-f-04
  kind: problem
  part: F
  text: |
    في المسألة السابقة، طالب قارن د بـ ج بدل ب، فحصل على نسبة تزايدية 1.40. ما الخطأ؟ وهل تغير القرار؟
  solution: |
    ج رفض في خطوته، فلا يصلح أساسا للمقارنة. المقارنة تكون دائما مع أفضل بديل حتى الآن، وهو ب. القرار لم يتغير هنا، لأن د أفضل من ب أيضا. لكن نفس الخطأ قد يقبل بديلا أفضل من ج المرفوض وأسوأ من ب.

- id: c12-f-05
  kind: problem
  part: F
  vars: {C1: 3000000, B1: 3600000, D1: 200000, C2: 4200000, B2: 5100000, D2: 500000}
  random: {C1: [1000000, 4000000, 100000], B1: [1200000, 6000000, 100000], D1: [0, 600000, 50000], C2: [4100000, 7000000, 100000], B2: [4200000, 9000000, 100000], D2: [100000, 1200000, 50000]}
  calc:
    - B1 = max(B1, C1 + D1 + 100000)
    - N1 = B1 - D1
    - N2 = B2 - D2
    - dr = (N2 - N1)/(C2 - C1)
  text: |
    موقعان لمكب نفايات. الأول: تكاليف [[C1|g]]، ومنافع [[B1|g]]، وأضرار [[D1|g]] دينار. الثاني، أقرب إلى المدينة: تكاليف [[C2|g]]، ومنافع [[B2|g]]، وأضرار [[D2|g]] دينار. كلها قيم حالية. أيهما تختار؟
  solution: |
    المنافع الصافية من الأضرار:

    $$
    [[B1|g]] - [[D1|g]] = [[N1|g]] \qquad [[B2|g]] - [[D2|g]] = [[N2|g]]
    $$

    الأول مجد منفردا. الإضافة:

    $$
    \frac{\Delta (B - D)}{\Delta C} = \frac{[[N2|g]] - [[N1|g]]}{[[C2|g]] - [[C1|g]]} = [[dr|f4]]
    $$

    [[pick(dr >= 1, "الثاني يبرر الإضافة.", "الثاني لا يبرر الإضافة، فنختار الأول.")]] الأضرار الأكبر قرب المدينة تؤثر في الفرق، لا في كل بديل وحده فقط.

- id: c12-f-06
  kind: problem
  part: F
  vars: {C1: 900000, B1: 1400000, C2: 1500000, B2: 1950000}
  random: {C1: [400000, 1500000, 50000], B1: [500000, 2500000, 50000], C2: [1600000, 3000000, 50000], B2: [1700000, 4000000, 50000]}
  calc:
    - B1 = max(B1, C1 + 50000)
    - N1 = B1 - C1
    - N2 = B2 - C2
    - dr = (B2 - B1)/(C2 - C1)
  text: |
    بديلان متنافيان، بالقيم الحالية: الأول تكاليفه [[C1|g]] ومنافعه [[B1|g]]، والثاني تكاليفه [[C2|g]] ومنافعه [[B2|g]] دينار. اختر بالنسبة التزايدية، ثم تأكد بالمنفعة الصافية.
  solution: |
    $$
    \frac{\Delta B}{\Delta C} = \frac{[[B2|g]] - [[B1|g]]}{[[C2|g]] - [[C1|g]]} = [[dr|f4]]
    $$

    المنفعة الصافية:

    $$
    [[B1|g]] - [[C1|g]] = [[N1|g]] \qquad [[B2|g]] - [[C2|g]] = [[N2|g]]
    $$

    الطريقتان تختاران [[pick(N2 > N1, "الثاني", "الأول")]].

- id: c12-f-07
  kind: problem
  part: F
  text: |
    ثلاثة تصاميم لجسر ضروري، يجب بناء أحدها. بالقيم الحالية بآلاف الدنانير:

    | التصميم | التكاليف | المنافع |
    | --- | --- | --- |
    | خرساني بسيط | 4,000 | 3,700 |
    | معدني | 5,200 | 5,100 |
    | معلق | 7,000 | 6,500 |

    أي تصميم تختار؟
  solution: |
    كل التصاميم نسبتها أقل من 1، لكن الجسر ضروري. نبدأ بالأرخص بدل عدم البناء:

    | المقارنة | الفرق في المنافع | الفرق في التكاليف | النسبة | الأفضل |
    | --- | --- | --- | --- | --- |
    | معدني مقابل خرساني | 1,400 | 1,200 | 1.167 | معدني |
    | معلق مقابل معدني | 1,400 | 1,800 | 0.778 | معدني |

    نختار المعدني. عندما يكون المشروع إلزاميا، السؤال هو: هل يستحق الدينار الإضافي فوق الحد الأدنى؟

- id: c12-f-08
  kind: problem
  part: F
  vars: {A1: 280000, A2: 360000, I1: 2400000, I2: 3300000, n: 30, i: 0.05}
  random: {A1: [100000, 500000, 10000], A2: [150000, 800000, 10000], I1: [1000000, 4000000, 100000], I2: [1500000, 6000000, 100000], n: [20, 40, 5], i: [0.03, 0.08, 0.005]}
  calc:
    - I2 = max(I2, I1 + 300000)
    - A2 = max(A2, A1 + 10000)
    - r1 = A1/(I1*AP(i, n))
    - dr = (A2 - A1)/((I2 - I1)*AP(i, n))
  text: |
    موقعان لمحطة حافلات مركزية. الأول يكلف [[I1|g]] دينار ومنافعه الصافية من التشغيل [[A1|g]] دينار سنويا. الثاني يكلف [[I2|g]] دينار ومنافعه الصافية [[A2|g]] دينار سنويا. العمر [[yrs(n)]]، والنسبة [[i|%]]. اختر بالقيمة السنوية.
  solution: |
    الأول منفردا:

    $$
    \frac{[[A1|g]]}{[[I1|g]]\,(A/P,\ [[i|%]],\ [[n|n]])} = [[r1|f4]]
    $$

    الإضافة:

    $$
    \frac{[[A2|g]] - [[A1|g]]}{([[I2|g]] - [[I1|g]])\,(A/P,\ [[i|%]],\ [[n|n]])} = [[dr|f4]]
    $$

    الاختيار: [[pick(r1 >= 1, pick(dr >= 1, "الثاني", "الأول"), pick(A2/(I2*AP(i, n)) >= 1, "الثاني", "لا شيء"))]].

- id: c12-f-09
  kind: concept
  part: F
  text: |
    لماذا نرتب البدائل حسب تكاليفها، وليس حسب منافعها، قبل النسبة التزايدية؟
  solution: |
    النسبة التزايدية تسأل: هل الدينار الإضافي في التكلفة يعيد دينارا أو أكثر؟ لذلك يجب أن يكون المقام، الفرق في التكاليف، موجبا. الترتيب حسب التكاليف يضمن ذلك.

- id: c12-f-10
  kind: problem
  part: F
  text: |
    بديلان لهما نفس القيمة الحالية للتكاليف، 2,000,000 دينار. منافع الأول 2,600,000، والثاني 2,900,000. كيف تختار؟
  solution: |
    الفرق في التكاليف صفر، فلا تحسب نسبة تزايدية. البديل صاحب المنافع الأكبر أفضل بوضوح: الثاني يعطي 300,000 دينار أكثر بنفس التكلفة.

- id: c12-f-11
  kind: problem
  part: F
  vars: {C1: 1000000, B1: 1300000, C2: 1600000, B2: 1900000, C3: 2500000, B3: 2700000}
  random: {C1: [600000, 1200000, 50000], B1: [700000, 1800000, 50000], C2: [1300000, 2000000, 50000], B2: [1400000, 2800000, 50000], C3: [2100000, 3200000, 50000], B3: [2200000, 4000000, 50000]}
  calc:
    - N0 = 0
    - N1 = B1 - C1
    - N2 = B2 - C2
    - N3 = B3 - C3
    - Nb = max(N0, N1, N2, N3)
  text: |
    ثلاثة بدائل متنافية، بالقيم الحالية: الأول تكاليفه [[C1|g]] ومنافعه [[B1|g]]، والثاني [[C2|g]] و[[B2|g]]، والثالث [[C3|g]] و[[B3|g]] دينار. اختر بأكبر منفعة صافية.
  solution: |
    | البديل | المنفعة الصافية |
    | --- | --- |
    | لا شيء | 0 |
    | الأول | [[N1|g]] |
    | الثاني | [[N2|g]] |
    | الثالث | [[N3|g]] |

    الاختيار: [[pick(Nb == N1, "الأول", pick(Nb == N2, "الثاني", pick(Nb == N3, "الثالث", "لا شيء")))]]. النسبة التزايدية الصحيحة تصل إلى نفس الجواب، بخطوات أكثر.

- id: c12-f-12
  kind: problem
  part: F
  vars: {i: 0.05}
  random: {i: [0.03, 0.08, 0.005]}
  calc:
    - f = PA(i, 20)
    - Ca = 600000 + 30000*f
    - Cb = 900000 + 25000*f
    - Ba = 95000*f
    - Bb = 125000*f
    - ra = Ba/Ca
    - dba = (Bb - Ba)/(Cb - Ca)
    - rb = Bb/Cb
  text: |
    إنارة شارع رئيسي: أعمدة عادية تكلف 600,000 دينار، وكهرباؤها وصيانتها 30,000 سنويا، ومنافعها في الأمان والحركة 95,000 سنويا. أعمدة بألواح شمسية تكلف 900,000، وتشغيلها 25,000، ومنافعها 125,000 سنويا لأنها لا تنطفئ مع انقطاع الكهرباء. العمر 20 سنة، والنسبة [[i|%]]. أيهما تختار؟
  solution: |
    $$
    (P/A,\ [[i|%]],\ 20) = [[f|f4]]
    $$

    | البديل | التكاليف | المنافع | النسبة |
    | --- | --- | --- | --- |
    | عادية | [[Ca|0]] | [[Ba|0]] | [[ra|f4]] |
    | شمسية | [[Cb|0]] | [[Bb|0]] | [[rb|f4]] |

    $$
    \frac{\Delta B}{\Delta C} = [[pick(ra >= 1, dba, rb)|f4]]
    $$

    الاختيار: [[pick(pick(ra >= 1, dba, rb) >= 1, "الشمسية", pick(ra >= 1, "العادية", "لا شيء"))]].

# ================================================================ part G
- id: c12-g-01
  kind: problem
  part: G
  text: |
    خمسة مشاريع مستقلة في بلدية، بالقيم الحالية بآلاف الدنانير:

    | المشروع | التكاليف | المنافع |
    | --- | --- | --- |
    | ممرات مشاة | 300 | 420 |
    | سوق خضار | 900 | 1,080 |
    | ملعب | 500 | 470 |
    | موقف سيارات | 700 | 1,050 |
    | مكتبة | 400 | 520 |

    أيها يقبل إذا كانت الميزانية تكفي؟
  solution: |
    | المشروع | النسبة | القرار |
    | --- | --- | --- |
    | ممرات مشاة | 1.40 | يقبل |
    | سوق خضار | 1.20 | يقبل |
    | ملعب | 0.94 | يرفض |
    | موقف سيارات | 1.50 | يقبل |
    | مكتبة | 1.30 | يقبل |

    أربعة مشاريع مقبولة، بتكلفة 2,300 ألف دينار، ومنفعة صافية 1,370 ألف دينار.

- id: c12-g-02
  kind: problem
  part: G
  text: |
    في المسألة السابقة، الميزانية 1,500 ألف دينار. أي مجموعة تختار؟
  solution: |
    المشاريع المقبولة الأربعة، ومنافعها الصافية: الممرات 120، والسوق 180، والموقف 350، والمكتبة 120. أفضل المجموعات داخل 1,500:

    | المجموعة | التكاليف | المنفعة الصافية |
    | --- | --- | --- |
    | الموقف والممرات والمكتبة | 1,400 | 590 |
    | الموقف والسوق | 1,600 | لا تتسع |
    | السوق والممرات | 1,200 | 300 |
    | السوق والمكتبة | 1,300 | 300 |

    نختار الموقف والممرات والمكتبة، بمنفعة صافية 590 ألف دينار.

- id: c12-g-03
  kind: problem
  part: G
  vars: {C: 3000000, L: 12}
  random: {C: [500000, 8000000, 100000], L: [2, 40, 1]}
  calc:
    - r = C/L
  text: |
    برنامج فحص مبكر لسرطان الثدي يكلف بالقيمة الحالية [[C|g]] دينار، ويتوقع أن ينقذ [[L|g]] حياة. ما تكلفة كل حياة تنقذ؟
  solution: |
    $$
    \frac{[[C|g]]}{[[L|g]]} = [[r|2]]
    $$

    هذا الرقم لا يقول إن البرنامج مجد أو غير مجد. يقارن ببرامج صحية أخرى تتنافس على نفس الميزانية.

- id: c12-g-04
  kind: problem
  part: G
  vars: {C1: 400000, E1: 1200, C2: 700000, E2: 1800}
  random: {C1: [200000, 800000, 10000], E1: [500, 2000, 50], C2: [500000, 1500000, 10000], E2: [1000, 3500, 50]}
  calc:
    - C2 = max(C2, C1 + 50000)
    - E2 = max(E2, E1 + 100)
    - r1 = C1/E1
    - r2 = C2/E2
    - dr = (C2 - C1)/(E2 - E1)
  text: |
    برنامجان لمحو أمية الكبار. الأول يكلف [[C1|g]] دينار ويخرج [[E1|g]] متعلما، والثاني يكلف [[C2|g]] دينار ويخرج [[E2|g]] متعلما. قارن بينهما.
  solution: |
    $$
    \frac{[[C1|g]]}{[[E1|g]]} = [[r1|2]] \qquad \frac{[[C2|g]]}{[[E2|g]]} = [[r2|2]]
    $$

    التكلفة الإضافية لكل متعلم إضافي في البرنامج الثاني:

    $$
    \frac{[[C2|g]] - [[C1|g]]}{[[E2|g]] - [[E1|g]]} = [[dr|2]]
    $$

    إذا رأت الجهة أن متعلما إضافيا يستحق [[dr|0]] دينار، تختار الثاني.

- id: c12-g-05
  kind: problem
  part: G
  text: |
    ثلاثة برامج للحد من التسرب المدرسي، بالقيم الحالية:

    | البرنامج | التكلفة | الطلاب الذين يكملون الدراسة |
    | --- | --- | --- |
    | وجبة مدرسية | 600,000 | 150 |
    | منح نقل | 900,000 | 200 |
    | معلمون مساندون | 1,500,000 | 300 |

    احسب تكلفة الطالب في كل برنامج، والتكلفة الإضافية لكل طالب إضافي.
  solution: |
    | البرنامج | تكلفة الطالب |
    | --- | --- |
    | وجبة مدرسية | 4,000 |
    | منح نقل | 4,500 |
    | معلمون مساندون | 5,000 |

    الإضافة من الوجبة إلى منح النقل:

    $$
    \frac{900000 - 600000}{200 - 150} = 6000
    $$

    الإضافة من منح النقل إلى المعلمين:

    $$
    \frac{1500000 - 900000}{300 - 200} = 6000
    $$

    كل طالب إضافي يكلف 6,000 دينار في الحالتين. إذا قبلت الجهة هذا الثمن، تختار المعلمين المساندين. وإلا تبقى عند الوجبة.

- id: c12-g-06
  kind: problem
  part: G
  vars: {C: 2000000, n0: 30, n1: 18, v: 120000}
  random: {C: [500000, 5000000, 100000], n0: [10, 60, 1], n1: [2, 50, 1], v: [50000, 300000, 10000]}
  calc:
    - n1 = min(n1, n0 - 2)
    - a = n0 - n1
    - r = C/a
  text: |
    حاجز وسطي على طريق سريع يكلف بالقيمة الحالية [[C|g]] دينار، ويخفض الحوادث القاتلة خلال عمره من [[n0|g]] إلى [[n1|g]]. ما تكلفة كل حادث قاتل يمنع؟ وهل البرنامج مقبول إذا كانت الجهة تستخدم قيمة [[v|g]] دينار لكل حادث قاتل يمنع؟
  solution: |
    $$
    \frac{[[C|g]]}{[[n0|g]] - [[n1|g]]} = [[r|2]]
    $$

    [[pick(r <= v, "التكلفة أقل من القيمة التي تضعها الجهة، فالبرنامج مقبول.", "التكلفة أعلى من القيمة التي تضعها الجهة، فالبرنامج غير مقبول بهذا المعيار.")]]

- id: c12-g-07
  kind: concept
  part: G
  text: |
    برنامج صحي تكلفة الحياة التي ينقذها أقل من برنامج آخر. لماذا قد تختار الوزارة الثاني رغم ذلك؟
  solution: |
    الثاني قد ينقذ أرواحا أكثر، والميزانية تكفيه. السؤال هو التكلفة الإضافية لكل حياة إضافية، لا متوسط التكلفة. وقد يخدم الثاني فئة أكثر حاجة، وهذا معيار لا تقيسه الأرقام.

- id: c12-g-08
  kind: problem
  part: G
  vars: {B: 1800000, C: 1500000, s: 0.20}
  random: {B: [500000, 4000000, 100000], C: [400000, 3500000, 100000], s: [0.10, 0.40, 0.05]}
  calc:
    - R0 = B/C
    - R1 = B*(1 - s)/C
  text: |
    القيمة الحالية لمنافع مشروع [[B|g]] دينار، ولتكاليفه [[C|g]]. تقديرات المنافع في مشاريع مشابهة كانت متفائلة بمتوسط [[s|%]]. احسب النسبة بالتقدير، ثم بعد تصحيح التفاؤل.
  solution: |
    $$
    \frac{[[B|g]]}{[[C|g]]} = [[R0|f4]]
    $$

    $$
    \frac{[[B|g]] \times (1 - [[s|%]])}{[[C|g]]} = [[R1|f4]]
    $$

    [[pick(R0 >= 1, pick(R1 >= 1, "المشروع يبقى مجديا بعد التصحيح.", "التصحيح يجعل المشروع غير مجد."), "المشروع غير مجد حتى بالتقدير المتفائل.")]]

- id: c12-g-09
  kind: problem
  part: G
  vars: {C: 5000000, P: 40000, s: 10}
  random: {C: [1000000, 10000000, 250000], P: [10000, 100000, 1000], s: [3, 20, 1]}
  calc:
    - r = C/(P*s)
  text: |
    مشروع لتحسين جودة الهواء في مدينة يكلف بالقيمة الحالية [[C|g]] دينار، ويستفيد منه [[P|g]] ساكن لمدة [[yrs(s)]]. ما تكلفة كل سنة استفادة لكل ساكن؟
  solution: |
    $$
    \frac{[[C|g]]}{[[P|g]] \times [[s|g]]} = [[r|2]]
    $$

    هذه وحدة فعالية بسيطة: سنة استفادة لشخص. الوزارات الصحية تستخدم وحدات أدق، مثل سنوات الحياة المعدلة بالجودة.

- id: c12-g-10
  kind: concept
  part: G
  text: |
    لماذا لا يكفي ترتيب المشاريع المستقلة حسب النسبة واختيارها من الأعلى، عندما تكون الميزانية محدودة؟
  solution: |
    مثل مؤشر الربحية في @sec-budget: الترتيب قد يترك جزءا من الميزانية بلا استخدام، فتختار مجموعة بمنفعة صافية أقل من الممكن. الصحيح أن نختار المجموعة بأكبر منفعة صافية داخل الميزانية.
