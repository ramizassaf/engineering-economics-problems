# ================================================================ part H
- id: c12-h-01
  kind: problem
  part: H
  text: |
    ابن في Excel جدولا يحسب النسبة التقليدية لمشروع يكلف 3,000,000 دينار، وصيانته 80,000 سنويا، ومنافعه 330,000 سنويا لمدة 30 سنة، لنسب خصم من 2% إلى 10%. عند أي نسبة تصبح النسبة 1؟
  calc:
    - r4 = 330000*PA(0.04, 30)/(3000000 + 80000*PA(0.04, 30))
    - r8 = 330000*PA(0.08, 30)/(3000000 + 80000*PA(0.08, 30))
    - x = RATE(30, 250000, 3000000)
  solution: |
    في العمود A نسب الخصم، وفي B:

    ```excel
    =330000*PV(A2,30,-1)/(3000000+80000*PV(A2,30,-1))
    ```

    عند 4% النسبة [[r4|f4]]، وعند 8% [[r8|f4]]. النسبة تساوي 1 عند معدل عائد المشروع:

    ```excel
    =RATE(30, 330000-80000, -3000000)
    ```

    [[x|%2]].

- id: c12-h-02
  kind: problem
  part: H
  text: |
    عدل برنامج Python في @sec-ch12 ليطبع، مع كل مقارنة، المنفعة الصافية لكل بديل. ثم تأكد أن البديل المختار له أكبر منفعة صافية.
  calc:
    - f = PA(0.06, 30)
    - NA = (480000)*f - 4000000 - 120000*f
    - NB = (630000)*f - 5500000 - 150000*f
    - NC = (760000)*f - 7500000 - 180000*f
  solution: |
    أضف بعد حساب rows:

    ```python
    for cost, ben, name in rows:
        print(name, "net benefit", round(ben - cost))
    ```

    المنافع الصافية بنسبة 6%: أ [[NA|0]]، وب [[NB|0]]، وج [[NC|0]]. البرنامج يختار ب، وهو صاحب أكبر منفعة صافية، مع أن أ له أعلى نسبة منفردة.

- id: c12-h-03
  kind: problem
  part: H
  text: |
    اكتب دالة Python تأخذ قائمة بدائل، لكل منها القيمة الحالية للتكاليف وللمنافع، وتعيد البديل المختار بالنسبة التزايدية. اختبرها على البدائل أ وب وج ود في الجزء و، المسألة الثالثة.
  solution: |
    ```python
    def incremental_bc(alts):
        """alts: list of (name, cost, benefit), present worth."""
        best = ("do nothing", 0.0, 0.0)
        for name, cost, ben in sorted(alts, key=lambda a: a[1]):
            ratio = (ben - best[2]) / (cost - best[1])
            if ratio >= 1:
                best = (name, cost, ben)
        return best[0]

    print(incremental_bc([("A", 1200, 1500), ("B", 1800, 2300),
                          ("C", 2500, 2950), ("D", 3100, 3800)]))
    ```

    النتيجة D، كما في الحل باليد.

- id: c12-h-04
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يحسب منفعة توفير الوقت لطريق جديد، لقيم ساعة المسافر من 2 إلى 8 دنانير، ثم النسبة لكل قيمة. الطريق يخدم 40,000 سيارة يوميا، ويوفر 10 دقائق لكل منها، 300 يوم سنويا. التكلفة 25,000,000 دينار، والصيانة 400,000 سنويا، والعمر 30 سنة، والنسبة 5%.
  calc:
    - f = PA(0.05, 30)
    - h = 40000*300*10/60
    - r2 = h*2*f/(25000000 + 400000*f)
    - r8 = h*8*f/(25000000 + 400000*f)
    - w = (25000000 + 400000*f)/(h*f)
  solution: |
    ```python
    import numpy_financial as npf

    pa = -npf.pv(0.05, 30, 1)
    hours = 40000 * 300 * 10 / 60
    cost = 25000000 + 400000 * pa
    for w in range(2, 9):
        print(w, round(hours * w * pa / cost, 3))
    ```

    ساعات التوفير السنوية [[h|g]]. النسبة من [[r2|f4]] عند 2 دينار إلى [[r8|f4]] عند 8 دنانير. المشروع مجد إذا كانت قيمة الساعة [[w|2]] دينار أو أكثر. القرار كله يتوقف على هذا الافتراض.

- id: c12-h-05
  kind: problem
  part: H
  text: |
    في Excel، احسب النسبة لمشروع منافعه تبدأ 200,000 دينار وتنمو 3% سنويا لمدة 25 سنة، وتكلفته 2,500,000 دينار، وصيانته 50,000 سنويا، بنسبة 6%.
  calc:
    - PB = 200000*PGEO(0.03, 0.06, 25)
    - PC = 2500000 + 50000*PA(0.06, 25)
    - R = PB/PC
  solution: |
    اكتب السنوات في A2:A26، والمنافع في B2:

    ```excel
    =200000*1.03^(A2-1)
    ```

    ثم:

    ```excel
    =NPV(6%, B2:B26) / (2500000 + PV(6%, 25, -50000))
    ```

    القيمة الحالية للمنافع [[PB|2]]، وللتكاليف [[PC|2]]، والنسبة [[R|f4]].

- id: c12-h-06
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يختار بين المشاريع المستقلة في الجزء ز، المسألة الأولى، بميزانية 1,500 ألف دينار، بالحصر الكامل.
  solution: |
    ```python
    from itertools import combinations

    projects = {"walkways": (300, 420), "market": (900, 1080), "field": (500, 470),
                "parking": (700, 1050), "library": (400, 520)}
    best = (0, ())
    for k in range(len(projects) + 1):
        for combo in combinations(projects, k):
            cost = sum(projects[p][0] for p in combo)
            net = sum(projects[p][1] - projects[p][0] for p in combo)
            if cost <= 1500 and net > best[0]:
                best = (net, combo)
    print(best)
    ```

    النتيجة: الموقف والممرات والمكتبة، بمنفعة صافية 590 ألف دينار. البرنامج لا يحتاج أن يستبعد الملعب يدويا: منفعته الصافية سالبة، فلا يدخل أفضل مجموعة.

- id: c12-h-07
  kind: problem
  part: H
  text: |
    ابن في Excel جدول تكلفة الفعالية لثلاثة برامج تسرب مدرسي في الجزء ز، مع عمود للتكلفة الإضافية لكل طالب إضافي.
  solution: |
    التكاليف في B2:B4، والطلاب في C2:C4، مرتبة حسب التكلفة. تكلفة الطالب في D2:

    ```excel
    =B2/C2
    ```

    التكلفة الإضافية في E3:

    ```excel
    =(B3-B2)/(C3-C2)
    ```

    انسخ الصيغتين للأسفل. النتائج: 4,000 و4,500 و5,000 لكل طالب، و6,000 لكل طالب إضافي في الخطوتين.

- id: c12-h-08
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يرسم النسبة لمشروع مقابل نسبة الخصم من 1% إلى 12%، لمشروع يكلف 8,000,000 دينار، وصيانته 100,000 سنويا، ومنافعه 650,000 سنويا لمدة 40 سنة.
  calc:
    - x = RATE(40, 550000, 8000000)
  solution: |
    ```python
    import matplotlib.pyplot as plt
    import numpy_financial as npf

    rates = [k / 1000 for k in range(10, 121)]
    ratios = [650000 * -npf.pv(r, 40, 1) / (8000000 + 100000 * -npf.pv(r, 40, 1)) for r in rates]
    plt.plot([100 * r for r in rates], ratios)
    plt.axhline(1, color="gray")
    plt.xlabel("discount rate (%)")
    plt.ylabel("B/C")
    plt.show()
    ```

    المنحنى يقطع 1 عند [[x|%2]]. فوقها المشروع غير مجد. الرسم يوضح للمسؤول كم القرار حساس لنسبة الخصم.

# ================================================================ part I
- id: c12-i-01
  kind: mcq
  part: I
  vars: {PB: 3000000, PD: 500000, PC: 2000000}
  random: {PB: [2000000, 6000000, 500000], PD: [200000, 1000000, 100000], PC: [1000000, 3000000, 500000]}
  calc:
    - r = (PB - PD)/PC
    - w1 = PB/PC
    - w2 = (PB + PD)/PC
    - w3 = (PB - PD)/(PC + PD)
  text: |
    القيم الحالية: منافع [[PB|g]]، وأضرار [[PD|g]]، وتكاليف [[PC|g]] دينار. ما النسبة التقليدية؟
  options: ["[[w1|f4]]", "[[r|f4]]", "[[w2|f4]]", "[[w3|f4]]"]
  correct: 1
  solution: |
    $$
    \frac{[[PB|g]] - [[PD|g]]}{[[PC|g]]} = [[r|f4]]
    $$

    الخيار (أ) نسي الأضرار. الخيار (ج) أضافها إلى المنافع. الخيار (د) حسب الأضرار مرتين: طرحها من المنافع وأضافها إلى التكاليف.

- id: c12-i-02
  kind: mcq
  part: I
  text: |
    رسوم عبور تحصلها الحكومة من طريق جديد توضع في التحليل:
  options: ["منفعة تضاف إلى البسط", "ضرر يطرح من البسط", "تقليل لتكلفة الحكومة", "لا تدخل التحليل أبدا"]
  correct: 2
  solution: |
    الرسوم يأخذها طرف من المجتمع من طرف آخر. للحكومة هي دخل يقلل تكلفتها. عدها منفعة أيضا يحسب نفس المال مرتين.

- id: c12-i-03
  kind: mcq
  part: I
  text: |
    النسبة التقليدية لمشروع 0.92. النسبة المعدلة لنفس المشروع:
  options: ["أكبر من 1", "تساوي 0.92", "أقل من 1", "لا يمكن معرفة شيء عنها"]
  correct: 2
  solution: |
    النسبتان تتفقان دائما على المقارنة مع 1. إذا كانت التقليدية أقل من 1، فالمعدلة أقل من 1 أيضا، وقيمتها أبعد عن 1.

- id: c12-i-04
  kind: mcq
  part: I
  text: |
    ثلاثة بدائل متنافية، نسبها المنفردة 1.6 و1.4 و1.2، مرتبة حسب التكاليف من الأقل. أيها نختار؟
  options: ["الأول، لأن نسبته الأعلى", "الثالث، لأنه الأكبر", "لا نعرف بدون النسب التزايدية", "أي واحد منها، لأنها كلها أكبر من 1"]
  correct: 2
  solution: |
    النسب المنفردة تقول إن كل بديل أفضل من عدم البناء، ولا تقول أيها أفضل من الآخر. نحتاج نسبة الفرق بين كل بديلين.

- id: c12-i-05
  kind: mcq
  part: I
  vars: {I: 10000000, M: 200000, i: 0.05}
  random: {I: [5000000, 20000000, 1000000], M: [100000, 500000, 50000], i: [0.03, 0.07, 0.01]}
  calc:
    - A = I*i + M
    - w1 = I*i
    - w2 = (I + M)*i
    - w3 = I*(1 + i) + M
  text: |
    مشروع دائم يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا. ما التكلفة السنوية المكافئة بنسبة [[i|%]]؟
  options: ["[[w1|g]]", "[[w2|g]]", "[[A|g]]", "[[w3|g]]"]
  correct: 2
  solution: |
    $$
    [[I|g]] \times [[i|%]] + [[M|g]] = [[A|g]]
    $$

    الخيار (أ) نسي الصيانة. الخيار (ب) ضرب الصيانة أيضا في النسبة، والصيانة مبلغ سنوي أصلا.

- id: c12-i-06
  kind: mcq
  part: I
  text: |
    لماذا قد يرفض مشروع عام مجد إذا استخدمت الحكومة نسبة خصم عالية؟
  options: ["لأن الاستثمار يصبح أكبر", "لأن المنافع البعيدة تخصم أكثر من التكاليف الأولى", "لأن الأضرار تزيد", "لأن النسبة لا تتأثر بالخصم"]
  correct: 1
  solution: |
    الاستثمار في السنة 0 لا يخصم. المنافع موزعة على سنين طويلة، فتنخفض قيمتها الحالية كثيرا بالنسبة العالية.

- id: c12-i-07
  kind: mcq
  part: I
  text: |
    مزارعون يخسرون دخلا سنويا لأن مشروع سد غمر أرضهم. هذا البند:
  options: ["تكلفة على الحكومة", "ضرر على الناس", "منفعة سالبة لا تدخل", "يلغيه التعويض الذي دفعته الحكومة"]
  correct: 1
  solution: |
    الخسارة تقع على الناس، فهي ضرر. التعويض نقل مال، لا يعيد الإنتاج الضائع. نحسب الخسارة مرة واحدة فقط.

- id: c12-i-08
  kind: mcq
  part: I
  vars: {C1: 1000000, B1: 1500000, C2: 1600000, B2: 2100000}
  random: {C1: [500000, 1500000, 100000], B1: [1600000, 2500000, 100000], C2: [1700000, 2500000, 100000], B2: [2600000, 4000000, 100000]}
  calc:
    - B2 = pick(B2 - B1 == C2 - C1, B2 + 100000, B2)
    - B2 = pick(B2*C1 == B1*C2, B2 + 100000, B2)
    - B2 = pick(B2 - B1 == C2 - C1, B2 + 100000, B2)
    - dr = (B2 - B1)/(C2 - C1)
    - w1 = B2/C2
    - w2 = (B2 - B1)/C2
    - w3 = (B2 + B1)/(C2 + C1)
  text: |
    بديلان: الأول تكاليفه [[C1|g]] ومنافعه [[B1|g]]، والثاني [[C2|g]] و[[B2|g]] دينار. ما النسبة التزايدية للثاني مقابل الأول؟
  options: ["[[w1|f4]]", "[[w2|f4]]", "[[dr|f4]]", "[[w3|f4]]"]
  correct: 2
  solution: |
    $$
    \frac{[[B2|g]] - [[B1|g]]}{[[C2|g]] - [[C1|g]]} = [[dr|f4]]
    $$

    الخيار (أ) النسبة المنفردة للثاني. الخيار (ب) قسم فرق المنافع على تكاليف الثاني كلها. الخيار (د) جمع البديلين بدل أن يطرحهما.

- id: c12-i-09
  kind: mcq
  part: I
  text: |
    متى نستخدم تحليل الفعالية مقابل التكلفة؟
  options: ["عندما تكون التكاليف غير معروفة", "عندما لا نستطيع أو لا نريد تسعير المنفعة بالدنانير", "عندما تكون النسبة أقل من 1", "عندما يكون المشروع دائما"]
  correct: 1
  solution: |
    مثل الأرواح التي تنقذ، أو الطلاب الذين يتخرجون. نقيس المنفعة بوحدتها ونقارن تكلفة الوحدة.

- id: c12-i-10
  kind: mcq
  part: I
  text: |
    مشاريع مستقلة، والميزانية تكفي الجميع. أيها يقبل؟
  options: ["صاحب أعلى نسبة فقط", "كل مشروع نسبته 1 أو أكثر", "المشاريع التي تتجاوز نسبتها 1.5", "نحتاج نسبا تزايدية بينها"]
  correct: 1
  solution: |
    المشاريع المستقلة لا تتنافس. كل مشروع يعطي المجتمع أكثر مما يكلف يقبل.

- id: c12-i-11
  kind: mcq
  part: I
  text: |
    طريق جديد يزيد مبيعات محلات قريبة منه، ويخفض مبيعات محلات على الطريق القديم بنفس المقدار تقريبا. في التحليل:
  options: ["نضيف الزيادة منفعة", "نطرح الانخفاض ضررا ونهمل الزيادة", "الأثران يلغي أحدهما الآخر تقريبا", "نضيف الزيادة ونطرح ضعف الانخفاض"]
  correct: 2
  solution: |
    المبيعات انتقلت ولم تزد في المجتمع. حساب الزيادة وحدها يضخم المنافع.

- id: c12-i-12
  kind: mcq
  part: I
  vars: {I: 2000000, M: 50000, n: 20, i: 0.05}
  random: {I: [1000000, 4000000, 500000], M: [20000, 100000, 10000], n: [15, 30, 5], i: [0.03, 0.07, 0.01]}
  calc:
    - B = I*AP(i, n) + M
    - w1 = I*(1 + i)**n/n + M
    - w2 = I*AP(i, n)
    - w3 = I*i + M
  text: |
    مشروع يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، وعمره [[yrs(n)]]. ما أقل منفعة سنوية تجعل النسبة 1 بنسبة [[i|%]]؟
  options: ["[[w1|0]]", "[[w2|0]]", "[[w3|0]]", "[[B|0]]"]
  correct: 3
  solution: |
    $$
    [[I|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[M|g]] = [[B|0]]
    $$

    الخيار (أ) نقل الاستثمار إلى نهاية العمر ثم قسمه على السنوات بدون خصم. الخيار (ب) نسي الصيانة. الخيار (ج) عامل المشروع كأنه دائم.

# ================================================================ part J
- id: c12-j-01
  kind: case
  part: J
  calc:
    - f = PA(0.05, 30)
    - h = 12000*300*8/60
    - BT = h*2.5
    - BA = (60 - 35)*40000
    - B = BT + BA + 400000
    - D = 300*800 + 150000
    - PB = (B - D)*f
    - PC = 30000000 + 350000*f - 120000*f
    - R = PB/PC
  text: |
    **حالة 12.1: طريق التفافي حول مدينة نابلس**

    وزارة الأشغال تدرس طريقا التفافيا بطول 12 كيلومترا. التكلفة 30,000,000 دينار، والصيانة 350,000 سنويا، والعمر 30 سنة، ونسبة الخصم 5%. الطريق يأخذ رسوم عبور من الشاحنات تحصل منها الوزارة 120,000 دينار سنويا. التقديرات:

    - 12,000 مركبة يوميا توفر كل منها 8 دقائق، 300 يوم في السنة. قيمة ساعة المسافر 2.5 دينار.
    - الحوادث مع إصابات تنخفض من 60 إلى 35 سنويا. كلفة الحادث 40,000 دينار.
    - توفير الوقود وصيانة المركبات 400,000 دينار سنويا.
    - الطريق يأخذ 300 دونم زراعية، صافي دخل الدونم 800 دينار سنويا.
    - محلات وسط المدينة تقدر خسارتها من تحول الحركة بمبلغ 150,000 دينار سنويا.

    (أ) صنف البنود. (ب) احسب النسبة التقليدية. (ج) ما الافتراض الذي يقرر النتيجة أكثر من غيره؟
  solution: |
    (أ) المنافع: الوقت، والحوادث، والوقود. الأضرار: الأرض الزراعية، وخسارة المحلات. التكاليف: الإنشاء، والصيانة، ناقص رسوم العبور.

    (ب) ساعات التوفير السنوية:

    $$
    12000 \times 300 \times \frac{8}{60} = [[h|g]]
    $$

    | البند | المبلغ السنوي |
    | --- | --- |
    | الوقت | [[BT|g]] |
    | الحوادث | [[BA|g]] |
    | الوقود | 400,000 |
    | الأرض الزراعية | -240,000 |
    | المحلات | -150,000 |
    | المنافع ناقص الأضرار | [[B-D|g]] |

    $$
    (P/A,\ 5\%,\ 30) = [[f|f4]]
    $$

    $$
    \frac{B - \mathrm{Dis}}{C} = \frac{[[B-D|g]] \times [[f|f4]]}{30000000 + (350000 - 120000) \times [[f|f4]]} = [[R|f4]]
    $$

    المشروع [[pick(R >= 1, "مجد", "غير مجد")]]، لكن النسبة قريبة جدا من 1.

    (ج) منفعة الوقت [[BT/B|%]] من كل المنافع، وهي تتناسب مع قيمة ساعة المسافر. إذا كانت الساعة تساوي 2 دينار بدل 2.5، تنخفض النسبة تحت 1. هذا الرقم يحتاج دراسة قبل القرار، أكثر من أي رقم آخر.

- id: c12-j-02
  kind: case
  part: J
  calc:
    - f = PA(0.04, 40)
    - CA = 9000000 + 260000*f
    - CB = 12500000 + 300000*f
    - CC = 16000000 + 330000*f
    - BA = (880000 - 60000)*f
    - BB = (1150000 - 70000)*f
    - BC = (1320000 - 90000)*f
    - rA = BA/CA
    - dBA = (BB - BA)/(CB - CA)
    - dCB = (BC - BB)/(CC - CB)
    - dCA = (BC - BA)/(CC - CA)
  text: |
    **حالة 12.2: محطة معالجة مياه عادمة لثلاث بلديات**

    ثلاث بلديات متجاورة تدرس محطة مشتركة. العمر 40 سنة، والنسبة 4%. التصاميم:

    | التصميم | الاستثمار | التشغيل السنوي | المنافع السنوية | الأضرار السنوية |
    | --- | --- | --- | --- | --- |
    | أ: معالجة أولية | 9,000,000 | 260,000 | 880,000 | 60,000 |
    | ب: معالجة ثانوية | 12,500,000 | 300,000 | 1,150,000 | 70,000 |
    | ج: معالجة ثلاثية لإعادة الاستخدام | 16,000,000 | 330,000 | 1,320,000 | 90,000 |

    المنافع تشمل صحة السكان، ومياه الري المعالجة، وحماية المياه الجوفية. (أ) أي تصميم تختار؟ (ب) ممول دولي يدفع 3,000,000 دينار من تكلفة التصميم ج فقط. هل يتغير القرار من وجهة نظر البلديات؟
  solution: |
    (أ)

    $$
    (P/A,\ 4\%,\ 40) = [[f|f4]]
    $$

    | التصميم | التكاليف | المنافع ناقص الأضرار |
    | --- | --- | --- |
    | أ | [[CA|0]] | [[BA|0]] |
    | ب | [[CB|0]] | [[BB|0]] |
    | ج | [[CC|0]] | [[BC|0]] |

    أ مقابل لا شيء: [[rA|f4]]. ب مقابل أ: [[dBA|f4]]. [[pick(dBA >= 1, "ب أفضل.", "أ يبقى.")]] ج مقابل [[pick(dBA >= 1, "ب", "أ")]]: [[pick(dBA >= 1, dCB, dCA)|f4]]. الاختيار: [[pick(pick(dBA >= 1, dCB, dCA) >= 1, "ج", pick(dBA >= 1, "ب", "أ"))]].

    (ب) المنحة تخفض تكاليف ج على البلديات إلى [[CC-3000000|0]]. الفرق بين ج و[[pick(dBA >= 1, "ب", "أ")]]:

    $$
    \frac{\Delta B}{\Delta C} = [[pick(dBA >= 1, (BC - BB)/(CC - 3000000 - CB), (BC - BA)/(CC - 3000000 - CA))|f4]]
    $$

    [[pick(pick(dBA >= 1, (BC - BB)/(CC - 3000000 - CB), (BC - BA)/(CC - 3000000 - CA)) >= 1, "من وجهة نظر البلديات يصبح ج الأفضل. لكن من وجهة نظر المجتمع كله، المنحة مال حقيقي له تكلفة على الممول. التحليل الوطني يحسب التكلفة كاملة.", "حتى مع المنحة، ج لا يبرر تكلفته الإضافية.")]]

- id: c12-j-03
  kind: case
  part: J
  text: |
    **حالة 12.3: ميزانية وزارة التربية**

    الوزارة لديها 6,000 ألف دينار لمشاريع مستقلة. القيم الحالية بآلاف الدنانير:

    | المشروع | التكاليف | المنافع |
    | --- | --- | --- |
    | ألواح شمسية للمدارس | 1,800 | 2,700 |
    | مختبرات علوم | 2,500 | 3,200 |
    | حافلات مدرسية | 1,200 | 1,500 |
    | صيانة مبان قديمة | 2,000 | 3,100 |
    | تدريب معلمين | 900 | 1,250 |

    (أ) أي المشاريع مقبولة منفردة؟ (ب) أي مجموعة تختار داخل الميزانية؟ (ج) ما خطأ اختيار المشاريع بترتيب النسبة؟
  solution: |
    (أ) النسب: الألواح 1.50، والمختبرات 1.28، والحافلات 1.25، والصيانة 1.55، والتدريب 1.39. كلها مقبولة. المنافع الصافية: 900، و700، و300، و1,100، و350.

    (ب) التكلفة الكلية 8,400، أكثر من الميزانية. أفضل المجموعات داخل 6,000:

    | المجموعة | التكاليف | المنفعة الصافية |
    | --- | --- | --- |
    | الصيانة والألواح والتدريب والحافلات | 5,900 | 2,650 |
    | الصيانة والألواح والمختبرات | 6,300 | لا تتسع |
    | الصيانة والمختبرات والتدريب | 5,400 | 2,150 |

    نختار الصيانة والألواح والتدريب والحافلات، بمنفعة صافية 2,650.

    (ج) هنا الترتيب بالنسبة يعطي نفس المجموعة: الصيانة، ثم الألواح، ثم التدريب، ثم المختبرات لا تتسع، ثم الحافلات. لكنه لا يضمن ذلك دائما، كما في @sec-budget.

- id: c12-j-04
  kind: case
  part: J
  calc:
    - r1 = 1800000/45
    - r2 = 3000000/70
    - r3 = 4500000/85
    - d21 = (3000000 - 1800000)/(70 - 45)
    - d32 = (4500000 - 3000000)/(85 - 70)
  text: |
    **حالة 12.4: الإسعاف في المناطق الريفية**

    وزارة الصحة تختار برنامجا واحدا لتقليل وفيات الحوادث والجلطات في القرى البعيدة. القيم الحالية خلال 10 سنوات:

    | البرنامج | التكلفة | الوفيات التي تمنع |
    | --- | --- | --- |
    | تدريب متطوعين على الإسعاف الأولي | 1,800,000 | 45 |
    | سيارات إسعاف إضافية | 3,000,000 | 70 |
    | مراكز طوارئ صغيرة | 4,500,000 | 85 |

    (أ) احسب تكلفة كل وفاة تمنع. (ب) احسب التكلفة الإضافية لكل وفاة إضافية. (ج) إذا كانت الوزارة تعتمد 60,000 دينار لكل وفاة تمنع، أي برنامج تختار؟
  solution: |
    (أ)

    | البرنامج | تكلفة الوفاة التي تمنع |
    | --- | --- |
    | المتطوعون | [[r1|0]] |
    | الإسعاف | [[r2|0]] |
    | المراكز | [[r3|0]] |

    (ب) من المتطوعين إلى الإسعاف:

    $$
    \frac{3000000 - 1800000}{70 - 45} = [[d21|0]]
    $$

    من الإسعاف إلى المراكز:

    $$
    \frac{4500000 - 3000000}{85 - 70} = [[d32|0]]
    $$

    (ج) كل البرامج تكلف أقل من 60,000 لكل وفاة تمنع. الانتقال إلى الإسعاف يكلف [[d21|0]] لكل وفاة إضافية، أقل من 60,000، فيستحق. الانتقال إلى المراكز يكلف [[d32|0]]، أكثر من 60,000، فلا يستحق. تختار الوزارة سيارات الإسعاف.
