items:

- id: c03-g-01
  kind: problem
  part: G
  vars: {A: 20000, i: 0.08}
  random: {A: [5000, 60000, 1000], i: [0.04, 0.12, 0.005]}
  calc:
    - P = A/i
  text: |
    كم يجب أن تودع جامعة اليوم لتمول منحة دراسية قيمتها [[A|g]] دينار كل سنة إلى الأبد، إذا كان العائد [[i|%]]؟ الدفعة الأولى بعد سنة.
  solution: |
    $$
    P = \frac{[[A|g]]}{[[i|r]]} = [[P|2]]
    $$

- id: c03-g-02
  kind: problem
  part: G
  vars: {A: 20000, i: 0.08}
  random: {A: [5000, 60000, 1000], i: [0.04, 0.12, 0.005]}
  calc:
    - P = A/i + A
  text: |
    في المسألة السابقة، إذا أرادت الجامعة صرف المنحة الأولى اليوم، كم تودع؟
  solution: |
    المنحة الأولى تدفع اليوم من المبلغ نفسه، والباقي سلسلة دائمة تبدأ بعد سنة:

    $$
    P = [[A|g]] + \frac{[[A|g]]}{[[i|r]]} = [[P|2]]
    $$

- id: c03-g-03
  kind: problem
  part: G
  vars: {C: 1500000, M: 40000, i: 0.06}
  random: {C: [500000, 3000000, 50000], M: [10000, 100000, 1000], i: [0.04, 0.10, 0.005]}
  calc:
    - CC = C + M/i
  text: |
    سد صغير يكلف [[C|g]] دينار، وصيانته [[M|g]] دينار سنويا إلى الأبد. ما التكلفة المرسملة بنسبة [[i|%]]؟
  solution: |
    $$
    CC = [[C|g]] + \frac{[[M|g]]}{[[i|r]]} = [[CC|2]]
    $$

- id: c03-g-04
  kind: problem
  part: G
  vars: {C: 600000, M: 15000, R: 80000, k: 8, i: 0.07}
  random: {C: [200000, 1500000, 50000], M: [5000, 50000, 1000], R: [20000, 200000, 5000], k: [4, 15, 1], i: [0.04, 0.10, 0.005]}
  calc:
    - AR = R*AF(i, k)
    - CC = C + (M + AR)/i
  text: |
    جسر مشاة يكلف [[C|g]] دينار، وصيانته [[M|g]] دينار سنويا، ويحتاج دهانا كل [[yrs(k)]] بتكلفة [[R|g]] دينار. ما التكلفة المرسملة بنسبة [[i|%]]؟
  solution: |
    $$
    A_R = [[R|g]]\,(A/F,\ [[i|%]],\ [[k|n]]) = [[AR|2]]
    $$

    $$
    CC = [[C|g]] + \frac{[[M|g]] + [[AR|2]]}{[[i|r]]} = [[CC|2]]
    $$

- id: c03-g-05
  kind: problem
  part: G
  vars: {Ca: 900000, Ma: 30000, Cb: 1200000, Mb: 12000, i: 0.06}
  random: {Ca: [400000, 1500000, 50000], Ma: [10000, 60000, 1000], Cb: [500000, 2000000, 50000], Mb: [5000, 40000, 1000], i: [0.04, 0.10, 0.005]}
  calc:
    - CCa = Ca + Ma/i
    - CCb = Cb + Mb/i
    - best = pick(CCa <= CCb, 'الأول', 'الثاني')
  text: |
    خياران لخط مياه رئيسي. الأول أنابيب حديد تكلف [[Ca|g]] دينار وصيانتها [[Ma|g]] دينار سنويا. الثاني أنابيب بلاستيك عالي الكثافة تكلف [[Cb|g]] دينار وصيانتها [[Mb|g]] دينار سنويا. بافتراض عمر بلا نهاية، أيهما أرخص بنسبة [[i|%]]؟
  solution: |
    $$
    CC_1 = [[Ca|g]] + \frac{[[Ma|g]]}{[[i|r]]} = [[CCa|2]]
    $$

    $$
    CC_2 = [[Cb|g]] + \frac{[[Mb|g]]}{[[i|r]]} = [[CCb|2]]
    $$

    الأرخص الخيار [[best]].

- id: c03-g-06
  kind: problem
  part: G
  vars: {C: 250000, n: 25, i: 0.06}
  random: {C: [100000, 500000, 10000], n: [10, 40, 1], i: [0.04, 0.10, 0.005]}
  calc:
    - A = C*AP(i, n)
    - CC = A/i
  text: |
    مبنى مدرسة يكلف [[C|g]] دينار ويحتاج إعادة بناء كاملة كل [[yrs(n)]] بنفس التكلفة، إلى الأبد. ما التكلفة المرسملة بنسبة [[i|%]]؟
  solution: |
    كل دورة تبدأ ببناء في أولها. نحول تكلفة الدورة إلى دفعة سنوية بالمعامل A/P، لأن البناء في بداية الدورة:

    $$
    A = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    $$
    CC = \frac{[[A|2]]}{[[i|r]]} = [[CC|2]]
    $$

- id: c03-g-07
  kind: problem
  part: G
  vars: {P: 500000, i: 0.07}
  random: {P: [100000, 2000000, 50000], i: [0.04, 0.10, 0.005]}
  calc:
    - A = P*i
  text: |
    وقف خيري قيمته [[P|g]] دينار يستثمر بعائد [[i|%]]. ما المبلغ الذي يصرف سنويا إلى الأبد دون أن ينقص أصل الوقف؟
  solution: |
    $$
    A = [[P|g]] \times [[i|r]] = [[A|2]]
    $$

    أي مبلغ أكبر يأكل من الأصل، فينقص العائد في السنوات التالية حتى ينتهي الوقف.

- id: c03-g-08
  kind: problem
  part: G
  vars: {C: 700000, M1: 10000, M2: 25000, i: 0.06}
  random: {C: [300000, 1500000, 50000], M1: [3000, 20000, 1000], M2: [15000, 50000, 1000], i: [0.04, 0.10, 0.005]}
  calc:
    - P1 = M1*PA(i, 10)
    - P2 = (M2/i)*PF(i, 10)
    - CC = C + P1 + P2
  text: |
    شبكة صرف صحي جديدة تكلف [[C|g]] دينار. صيانتها [[M1|g]] دينار سنويا في أول 10 سنوات، ثم [[M2|g]] دينار سنويا إلى الأبد. ما التكلفة المرسملة بنسبة [[i|%]]؟
  solution: |
    صيانة أول 10 سنوات سلسلة عادية:

    $$
    P_1 = [[M1|g]]\,(P/A,\ [[i|%]],\ 10) = [[P1|2]]
    $$

    الصيانة بعدها سلسلة دائمة تبدأ في السنة 11. قيمتها في السنة 10 تساوي الدفعة مقسومة على النسبة، ثم ننقلها إلى السنة 0:

    $$
    P_2 = \frac{[[M2|g]]}{[[i|r]]}\,(P/F,\ [[i|%]],\ 10) = [[P2|2]]
    $$

    $$
    CC = [[C|g]] + [[P1|2]] + [[P2|2]] = [[CC|2]]
    $$
