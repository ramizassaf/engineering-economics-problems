items:

- id: c03-c-01
  kind: problem
  part: C
  vars: {C: 50000, R: 14000, n: 5, i: 0.10}
  random: {C: [20000, 100000, 1000], R: [5000, 30000, 500], n: [3, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - PW = -C + R*PA(i, n)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]] بدون قيمة بيع. احسب القيمة الحالية بنسبة [[i|%]]. هل يقبل؟
  solution: |
    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c03-c-02
  kind: problem
  part: C
  vars: {C: 75000, R: 16000, S: 10000, n: 7, i: 0.12}
  random: {C: [30000, 150000, 1000], R: [6000, 40000, 500], S: [0, 20000, 500], n: [4, 12, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - PW = -C + R*PA(i, n) + S*PF(i, n)
  diagram: {n: n, i: "i = [[i|%]]", flows: [[0, "-C"], ["n", "R+S", "[[R|g]] + [[S|g]]"]], series: [[1, "n-1", "R"]]}
  text: |
    آلة تكلف [[C|g]] دينار، وتوفر [[R|g]] دينار سنويا لمدة [[yrs(n)]]، ثم تباع بقيمة [[S|g]] دينار. هل شراؤها مقبول بنسبة [[i|%]]؟
  solution: |
    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    الشراء [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c03-c-03
  kind: problem
  part: C
  vars: {C: 200000, R: 70000, O: 25000, S: 30000, n: 10, i: 0.15}
  random: {C: [80000, 300000, 5000], R: [30000, 120000, 1000], O: [8000, 40000, 500], S: [0, 50000, 1000], n: [5, 15, 1], i: [0.08, 0.18, 0.01]}
  calc:
    - PW = -C + (R - O)*PA(i, n) + S*PF(i, n)
  text: |
    مصنع صغير للتعبئة يكلف [[C|g]] دينار. إيراده السنوي [[R|g]] دينار، وتكاليف تشغيله [[O|g]] دينار سنويا. عمره [[yrs(n)]]، وقيمة بيعه [[S|g]] دينار. احسب القيمة الحالية بنسبة [[i|%]].
  solution: |
    صافي التدفق السنوي يساوي الإيراد ناقص التشغيل، أي [[R-O|g]] دينار:

    $$
    PW = -[[C|g]] + [[R-O|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

- id: c03-c-04
  kind: problem
  part: C
  vars: {C: 40000, A1: 8000, G: 1500, n: 6, i: 0.10}
  random: {C: [20000, 80000, 1000], A1: [3000, 15000, 500], G: [200, 3000, 100], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - PW = -C + A1*PA(i, n) + G*PG(i, n)
  text: |
    متجر إلكتروني جديد يكلف [[C|g]] دينار. صافي دخله [[A1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. هل المشروع مقبول بنسبة [[i|%]]؟
  solution: |
    $$
    PW = -[[C|g]] + [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c03-c-05
  kind: problem
  part: C
  vars: {C: 100000, A1: 20000, g: 0.05, n: 8, i: 0.12}
  random: {C: [50000, 200000, 5000], A1: [8000, 40000, 1000], g: [0.02, 0.08, 0.005], n: [5, 12, 1], i: [0.08, 0.15, 0.01]}
  calc:
    - PS = A1*PGEO(g, i, n)
    - PW = -C + PS
  text: |
    نظام طاقة شمسية يكلف [[C|g]] دينار، ويوفر [[A1|g]] دينار في السنة الأولى. التوفير يزيد [[g|%]] سنويا مع ارتفاع سعر الكهرباء، لمدة [[yrs(n)]]. احسب القيمة الحالية بنسبة [[i|%]].
  solution: |
    $$
    P_S = [[A1|g]] \times \frac{1 - \left(\frac{[[1+g|r]]}{[[1+i|r]]}\right)^{[[n|n]]}}{[[i|r]] - [[g|r]]} = [[PS|2]]
    $$

    $$
    PW = -[[C|g]] + [[PS|2]] = [[PW|2]]
    $$

- id: c03-c-06
  kind: problem
  part: C
  vars: {C: 60000, R: 15000, n: 6, i: 0.10}
  random: {C: [20000, 100000, 1000], R: [5000, 30000, 500], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - S = (C - R*PA(i, n))*FP(i, n)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ما أقل قيمة بيع في نهاية المدة تجعل المشروع مقبولا بنسبة [[i|%]]؟
  solution: |
    نضع القيمة الحالية صفرا ونحل لقيمة البيع:

    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + S\,(P/F,\ [[i|%]],\ [[n|n]]) = 0
    $$

    $$
    S = [[S|2]]
    $$

    [[pick(S <= 0, 'القيمة سالبة، فالمشروع مقبول حتى بدون قيمة بيع.', 'إذا بيع المشروع بأكثر من هذا المبلغ فهو مقبول.')]]

- id: c03-c-07
  kind: problem
  part: C
  vars: {R: 12000, S: 8000, n: 6, i: 0.10}
  random: {R: [3000, 30000, 500], S: [0, 15000, 500], n: [3, 12, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - Cmax = R*PA(i, n) + S*PF(i, n)
  text: |
    آلة توفر [[R|g]] دينار سنويا لمدة [[yrs(n)]]، وتباع بعدها بقيمة [[S|g]] دينار. ما أعلى سعر تدفعه شركة حدها الأدنى للعائد [[i|%]]؟
  solution: |
    أعلى سعر يجعل القيمة الحالية صفرا:

    $$
    C_{max} = [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Cmax|2]]
    $$

- id: c03-c-08
  kind: problem
  part: C
  vars: {C: 90000, R: 22000, n: 8}
  random: {C: [40000, 150000, 5000], R: [8000, 40000, 1000], n: [5, 12, 1]}
  calc:
    - p6 = -C + R*PA(0.06, n)
    - p10 = -C + R*PA(0.10, n)
    - p14 = -C + R*PA(0.14, n)
    - p18 = -C + R*PA(0.18, n)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. احسب القيمة الحالية عند النسب 6% و10% و14% و18%. ماذا يحدث للقيمة الحالية كلما زادت النسبة؟
  solution: |
    | النسبة | القيمة الحالية |
    | --- | --- |
    | 6% | [[p6|2]] |
    | 10% | [[p10|2]] |
    | 14% | [[p14|2]] |
    | 18% | [[p18|2]] |

    القيمة الحالية تقل كلما زادت النسبة، لأن الدخل يأتي في المستقبل ويخصم أكثر. النسبة التي تجعلها صفرا هي معدل العائد الداخلي، وهو موضوع الفصل التالي.

- id: c03-c-09
  kind: problem
  part: C
  vars: {C: 35000, R: 9000, O: 1500, H: 6000, n: 6, i: 0.09}
  random: {C: [15000, 60000, 1000], R: [4000, 18000, 500], O: [500, 4000, 250], H: [2000, 10000, 500], n: [6, 10, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - PW = -C + (R - O)*PA(i, n) - H*PF(i, 3)
  text: |
    معدات تكلف [[C|g]] دينار، وتعطي [[R|g]] دينار سنويا، وصيانتها [[O|g]] دينار سنويا، لمدة [[yrs(n)]]. تحتاج تجديدا في السنة 3 بتكلفة [[H|g]] دينار. احسب القيمة الحالية بنسبة [[i|%]].
  solution: |
    $$
    PW = -[[C|g]] + [[R-O|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[H|g]]\,(P/F,\ [[i|%]],\ 3) = [[PW|2]]
    $$

- id: c03-c-10
  kind: problem
  part: C
  vars: {C: 30000, R: 8000, n: 6, i: 0.12, d: 2}
  random: {C: [10000, 60000, 1000], R: [3000, 20000, 500], n: [4, 10, 1], i: [0.06, 0.15, 0.01], d: [1, 3, 1]}
  calc:
    - PW = -C + R*PA(i, n)*PF(i, d)
  text: |
    مشروع يكلف [[C|g]] دينار اليوم، لكن الدخل لا يبدأ إلا بعد فترة إنشاء مدتها [[yrs(d)]]. بعدها يعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. احسب القيمة الحالية بنسبة [[i|%]].
  solution: |
    الدفعة الأولى في السنة [[d+1|n]]. المعامل P/A يضع قيمة السلسلة في السنة [[d|n]]، ثم ننقلها إلى السنة 0:

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]])\,(P/F,\ [[i|%]],\ [[d|n]]) = [[PW|2]]
    $$

- id: c03-c-11
  kind: problem
  part: C
  vars: {C: 45000, R: 11000, n: 7, i: 0.10}
  random: {C: [20000, 80000, 1000], R: [4000, 20000, 500], n: [4, 12, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - PW = -C + R*PA(i, n)
    - FW = PW*FP(i, n)
  text: |
    احسب القيمة المستقبلية في السنة [[n|n]] لمشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]] بنسبة [[i|%]]. هل تعطي نفس قرار القيمة الحالية؟
  solution: |
    $$
    FW = -[[C|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) + [[R|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[FW|2]]
    $$

    القيمة الحالية [[PW|2]] دينار. القيمة المستقبلية تساوي القيمة الحالية مضروبة في المعامل F/P، فلهما نفس الإشارة ونفس القرار دائما.

- id: c03-c-12
  kind: problem
  part: C
  vars: {C: 25000, R: 600, ia: 0.10}
  random: {C: [10000, 60000, 1000], R: [200, 1500, 25], ia: [0.05, 0.14, 0.005]}
  calc:
    - im = (1+ia)**(1/12) - 1
    - PW = -C + R*PA(im, 60)
  text: |
    مطعم يشتري آلة قهوة بسعر [[C|g]] دينار، فيزيد ربحه [[R|g]] دينار شهريا لمدة 5 سنوات. الحد الأدنى للعائد [[ia|%]] نسبة فعلية سنوية. هل الشراء مقبول؟
  solution: |
    $$
    i_m = (1 + [[ia|r]])^{1/12} - 1 = [[im|%2]]
    $$

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[im|%2]],\ 60) = [[PW|2]]
    $$

    الشراء [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c03-c-13
  kind: problem
  part: C
  vars: {C: 150000, R: 30000, n: 10, i1: 0.08, i2: 0.14}
  random: {C: [60000, 250000, 5000], R: [12000, 50000, 1000], n: [6, 15, 1], i1: [0.05, 0.09, 0.01], i2: [0.12, 0.18, 0.01]}
  calc:
    - P1 = -C + R*PA(i1, n)
    - P2 = -C + R*PA(i2, n)
  text: |
    شركتان تدرسان نفس المشروع: يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. الحد الأدنى للعائد في الشركة الأولى [[i1|%]]، وفي الثانية [[i2|%]]. هل تتخذان نفس القرار؟ لماذا؟
  solution: |
    $$
    PW_1 = -[[C|g]] + [[R|g]]\,(P/A,\ [[i1|%]],\ [[n|n]]) = [[P1|2]]
    $$

    $$
    PW_2 = -[[C|g]] + [[R|g]]\,(P/A,\ [[i2|%]],\ [[n|n]]) = [[P2|2]]
    $$

    الشركة الأولى [[pick(P1 >= 0, 'تقبل', 'ترفض')]]، والثانية [[pick(P2 >= 0, 'تقبل', 'ترفض')]]. نفس المشروع قد يقبل في شركة ويرفض في أخرى، لأن الحد الأدنى للعائد يعكس فرص كل شركة وتكلفة تمويلها.
