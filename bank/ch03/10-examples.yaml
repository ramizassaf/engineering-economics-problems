# ------------------------------------------------------------ nominal and effective: concept
- id: c03-ex-nominal-concept
  kind: example
  title: |
    نفس النسبة الاسمية بعدد مرات مختلف
  vars: {r: 0.12, P: 10000}
  random: {r: [0.06, 0.18, 0.01], P: [1000, 50000, 1000]}
  calc:
    - e1 = r
    - e2 = (1 + r/2)**2 - 1
    - e4 = (1 + r/4)**4 - 1
    - e12 = (1 + r/12)**12 - 1
    - e365 = (1 + r/365)**365 - 1
    - F1 = P*(1 + e1)
    - F12 = P*(1 + e12)
  text: |
    أودعت [[P|g]] دينار لمدة سنة بنسبة اسمية [[r|%]]. كم يصبح الرصيد إذا حسبت الفائدة مرة في السنة، ومرتين، وأربع مرات، وكل شهر، وكل يوم؟
  solution: |
    نسبة الفترة هي النسبة الاسمية مقسومة على عدد الفترات في السنة m. والرصيد بعد سنة يضرب في عامل الفترة m مرة:

    $$
    F = P\left(1 + \frac{r}{m}\right)^m
    $$

    | مرات الحساب في السنة | نسبة الفترة | النسبة الفعلية | الرصيد بعد سنة |
    | --- | --- | --- | --- |
    | 1 | [[r|%2]] | [[e1|%2]] | [[P*(1+e1)|2]] |
    | 2 | [[r/2|%2]] | [[e2|%2]] | [[P*(1+e2)|2]] |
    | 4 | [[r/4|%2]] | [[e4|%2]] | [[P*(1+e4)|2]] |
    | 12 | [[r/12|%2]] | [[e12|%2]] | [[P*(1+e12)|2]] |
    | 365 | [[r/365|%2]] | [[e365|%2]] | [[P*(1+e365)|2]] |

    النسبة الاسمية واحدة في كل الحالات، لكن الرصيد مختلف. كلما زاد عدد مرات الحساب، كسبت فائدة كل فترة فائدة أكثر في الفترات التالية. النسبة الفعلية تعبر عن هذه الزيادة الحقيقية في سنة.

    لاحظ أن الفرق بين الحساب الشهري واليومي صغير جدا. في الواقع العملي، الحساب الشهري يكفي لأغلب القرارات.

- id: c03-ex-period-mismatch
  kind: example
  title: |
    دفعات كل ثلاثة أشهر وفائدة شهرية
  vars: {A: 900, r: 0.09, y: 5}
  random: {A: [200, 3000, 50], r: [0.04, 0.14, 0.005], y: [2, 10, 1]}
  calc:
    - im = r/12
    - iq = (1 + im)**3 - 1
    - N = 4*y
    - F = A*FA(iq, N)
    - w = A*FA(r/4, N)
  text: |
    شركة تودع [[A|g]] دينار في نهاية كل ثلاثة أشهر في حساب يعطي [[r|%]] سنويا تحسب شهريا. كم يصبح الرصيد بعد [[yrs(y)]]؟
  solution: |
    الدفعات كل ثلاثة أشهر، والفائدة كل شهر. الفترتان مختلفتان، والقاعدة تقول: النسبة يجب أن تطابق فترة الدفعات. نحتاج إذن النسبة الفعلية لثلاثة أشهر.

    نسبة الشهر:

    $$
    i_m = \frac{[[r|%]]}{12} = [[im|%2]]
    $$

    في ثلاثة أشهر يضرب الرصيد في عامل الشهر ثلاث مرات:

    $$
    i_q = (1 + [[im|f4]])^3 - 1 = [[iq|%2]]
    $$

    الآن الفترة واحدة، وعدد الدفعات [[N|n]]:

    $$
    F = [[A|g]]\,(F/A,\ [[iq|%2]],\ [[N|n]]) = [[F|2]]
    $$

    الخطأ الشائع استخدام ربع النسبة الاسمية، [[r/4|%2]]، وهذا يعطي [[w|2]] دينار، أقل من الصحيح، لأنه يتجاهل تراكم الفائدة الشهرية داخل الربع.

- id: c03-ex-annual-monthly
  kind: example
  title: |
    دفعات سنوية وفائدة شهرية
  vars: {P: 40000, r: 0.08, n: 6}
  random: {P: [10000, 100000, 1000], r: [0.04, 0.14, 0.005], n: [3, 10, 1]}
  calc:
    - ia = (1 + r/12)**12 - 1
    - A = P*AP(ia, n)
    - w = P*AP(r, n)
  text: |
    قرض [[P|g]] دينار يسدد بأقساط سنوية لمدة [[yrs(n)]]. البنك يعلن [[r|%]] سنويا تحسب شهريا. ما القسط السنوي؟
  solution: |
    الأقساط سنوية، والفائدة شهرية. نحتاج النسبة الفعلية السنوية:

    $$
    i_a = \left(1 + \frac{[[r|r]]}{12}\right)^{12} - 1 = [[ia|%2]]
    $$

    $$
    A = [[P|g]]\,(A/P,\ [[ia|%2]],\ [[n|n]]) = [[A|2]]
    $$

    لو استخدمنا [[r|%]] مباشرة، لحصلنا على [[w|2]] دينار، أقل من الصحيح.

- id: c03-ex-continuous
  kind: example
  title: |
    الحد الأعلى: الفائدة المستمرة
  vars: {r: 0.10}
  random: {r: [0.04, 0.20, 0.01]}
  calc:
    - e365 = (1 + r/365)**365 - 1
    - ec = exp(r) - 1
  text: |
    ماذا يحدث للنسبة الفعلية لنسبة اسمية [[r|%]] إذا زاد عدد مرات الحساب بلا حدود؟
  solution: |
    عندما تكبر m بلا حدود، يقترب المقدار التالي من العدد e مرفوعا إلى r:

    $$
    \left(1 + \frac{r}{m}\right)^m \;\to\; e^r
    $$

    فالنسبة الفعلية للفائدة المستمرة:

    $$
    i_a = e^{[[r|r]]} - 1 = [[ec|%2]]
    $$

    والحساب اليومي يعطي [[e365|%2]]، أي تقريبا نفس الرقم. الفائدة المستمرة حد أعلى نظري. تستخدم في التمويل والنماذج الرياضية، ونادرا ما تستخدم في قروض البنوك.

# ------------------------------------------------------------ monthly and annual rates
- id: c03-ex-monthly-payment
  kind: example
  title: |
    قسط شهري لقرض سيارة
  vars: {P: 18000, r: 0.09, y: 4}
  random: {P: [8000, 40000, 500], r: [0.06, 0.14, 0.005], y: [2, 6, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - A = P*AP(im, N)
    - ia = (1+im)**12 - 1
    - T = A*N - P
  text: |
    اشترى مهندس سيارة بقرض [[P|g]] دينار، بفائدة [[r|%]] سنويا تحسب شهريا، لمدة [[yrs(y)]]. ما القسط الشهري؟ وما النسبة الفعلية السنوية التي يدفعها؟
  solution: |
    الأقساط شهرية، فنعمل بالشهر. نسبة الشهر وعدد الأشهر:

    $$
    i_m = \frac{[[r|%]]}{12} = [[im|%2]], \qquad N = 12 \times [[y|n]] = [[N|n]]
    $$

    $$
    A = [[P|g]]\,(A/P,\ [[im|%2]],\ [[N|n]]) = [[A|2]]
    $$

    في Excel:

    ```excel
    =PMT([[r|%]]/12, [[N|n]], -[[P|r]])
    ```

    النسبة الفعلية السنوية:

    $$
    i_a = (1 + [[im|r]])^{12} - 1 = [[ia|%2]]
    $$

    النسبة الفعلية أعلى من [[r|%]] لأن فائدة كل شهر تكسب فائدة في الأشهر التالية. مجموع الفوائد على القرض [[T|2]] دينار.

- id: c03-ex-effective-compare
  kind: example
  title: |
    مقارنة عرضين من بنكين
  vars: {r1: 0.096, d: 0.002}
  random: {r1: [0.06, 0.14, 0.002], d: [0, 0.006, 0.001]}
  calc:
    - r2 = r1 + d
    - e1 = (1 + r1/12)**12 - 1
    - best = pick(e1 < r2, 'البنك الأول', 'البنك الثاني')
  text: |
    تريد شركة قرضا لمدة سنة. البنك الأول يعرض [[r1|%2]] سنويا تحسب شهريا. البنك الثاني يعرض [[r2|%2]] سنويا تحسب مرة واحدة في نهاية السنة. أي العرضين أرخص؟
  solution: |
    لا نقارن النسب المعلنة مباشرة، لأن عدد مرات حساب الفائدة مختلف. نحول كل نسبة إلى نسبة فعلية سنوية.

    البنك الأول:

    $$
    i_a = \left(1 + \frac{[[r1|r]]}{12}\right)^{12} - 1 = [[e1|%2]]
    $$

    البنك الثاني يحسب الفائدة مرة واحدة، فنسبته الفعلية هي المعلنة: [[r2|%2]].

    العرض الأرخص: [[best]]. النسبة المعلنة الأقل لا تعني دائما التكلفة الأقل.

- id: c03-ex-monthly-deposit
  kind: example
  title: |
    إيداع شهري بنسبة سنوية فعلية
  vars: {F: 20000, ia: 0.07, y: 5}
  random: {F: [5000, 60000, 1000], ia: [0.03, 0.10, 0.005], y: [2, 10, 1]}
  calc:
    - N = 12*y
    - im = (1+ia)**(1/12) - 1
    - A = F*AF(im, N)
    - w = F*AF(ia/12, N)
  text: |
    يعلن بنك أن حساب التوفير يعطي [[ia|%]] نسبة فعلية سنوية. يريد شخص أن يجمع [[F|g]] دينار بعد [[yrs(y)]] بإيداع مبلغ ثابت في نهاية كل شهر. كم يودع شهريا؟
  solution: |
    النسبة المعطاة فعلية، أي تشمل أثر الفائدة الشهرية. نبحث عن النسبة الشهرية التي تعطي نفس الزيادة في سنة:

    $$
    (1 + i_m)^{12} = 1 + [[ia|r]] \quad\Rightarrow\quad i_m = [[im|%2]]
    $$

    $$
    A = [[F|g]]\,(A/F,\ [[im|%2]],\ [[N|n]]) = [[A|2]]
    $$

    الخطأ الشائع قسمة النسبة الفعلية على 12. هذا يعطي [[w|2]] دينار، وهو أقل من اللازم لأن نسبة الشهر الناتجة أعلى من الصحيحة.

# ------------------------------------------------------------ PW of one project
- id: c03-ex-pw-project
  kind: example
  title: |
    قبول مشروع أو رفضه بالقيمة الحالية
  vars: {C: 120000, k: 0, R: 28000, s: 0, S: 15000, n: 8, i: 0.10}
  random: {C: [50000, 200000, 5000], k: [0.14, 0.26, 0.01], s: [0.05, 0.20, 0.05], n: [5, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - R = pick(k > 0, floor(C*k/500)*500, R)
    - S = pick(s > 0, floor(C*s/500)*500, S)
    - PR = R*PA(i, n)
    - PS = S*PF(i, n)
    - PW = -C + PR + PS
  diagram: {n: n, i: "i = [[i|%]]", flows: [[0, "-C"], ["n", "R+S", "[[R|g]] + [[S|g]]"]], series: [[1, "n-1", "R"]]}
  text: |
    خط إنتاج جديد يكلف [[C|g]] دينار، ويعطي صافي دخل [[R|g]] دينار سنويا لمدة [[yrs(n)]]، ثم يباع بقيمة [[S|g]] دينار. الحد الأدنى للعائد [[i|%]]. هل تنفذ الشركة المشروع؟
  solution: |
    ننقل كل التدفقات إلى السنة 0 ونجمعها. التكلفة سالبة، والدخل والبيع موجبان:

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S|g]]\,(P/F,\ [[i|%]],\ [[n|n]])
    $$

    $$
    PW = -[[C|g]] + [[PR|2]] + [[PS|2]] = [[PW|2]]
    $$

    القيمة الحالية [[pick(PW >= 0, 'موجبة، فالمشروع يعطي أكثر من الحد الأدنى للعائد ويقبل', 'سالبة، فالمشروع لا يغطي الحد الأدنى للعائد ويرفض')]].

    في Excel اكتب التدفقات من السنة 0 إلى السنة [[n|n]] في الخلايا من B1 إلى B[[n+1|n]]:

    ```excel
    =B1 + NPV([[i|%]], B2:B[[n+1|n]])
    ```

- id: c03-ex-pw-cost
  kind: example
  title: |
    القيمة الحالية للتكاليف
  vars: {C: 60000, O: 9000, H: 5000, S: 8000, i: 0.08}
  random: {C: [20000, 120000, 2000], O: [3000, 15000, 500], H: [2000, 12000, 500], S: [2000, 15000, 500], i: [0.05, 0.12, 0.01]}
  calc:
    - PO = O*PA(i, 8)
    - PH = H*PF(i, 4)
    - PS = S*PF(i, 8)
    - PW = C + PO + PH - PS
  diagram: {n: 8, i: "i = [[i|%]]", flows: [[0, "-C"], [4, "-O-H", "[[O|g]] + [[H|g]]"], [8, "-O+S", "[[S|g]] − [[O|g]]"]], series: [[1, 3, "-O"], [5, 7, "-O"]]}
  text: |
    آلة تكلف [[C|g]] دينار، وتكلفة تشغيلها [[O|g]] دينار سنويا لمدة 8 سنوات. تحتاج صيانة كبيرة في السنة 4 بتكلفة [[H|g]] دينار، وتباع في نهاية السنة 8 بقيمة [[S|g]] دينار. ما القيمة الحالية لتكلفة الآلة بنسبة [[i|%]]؟
  solution: |
    هنا كل التدفقات تكاليف إلا قيمة البيع. نكتب التكاليف موجبة ونطرح قيمة البيع:

    $$
    PW_c = [[C|g]] + [[O|g]]\,(P/A,\ [[i|%]],\ 8) + [[H|g]]\,(P/F,\ [[i|%]],\ 4) - [[S|g]]\,(P/F,\ [[i|%]],\ 8)
    $$

    $$
    PW_c = [[C|g]] + [[PO|2]] + [[PH|2]] - [[PS|2]] = [[PW|2]]
    $$

    كتابة التكاليف موجبة أسهل عندما تكون كل البدائل تكاليف. المهم أن تلتزم بنفس الإشارة في كل البدائل.

# ------------------------------------------------------------ equal lives
- id: c03-ex-pw-two-machines
  kind: example
  title: |
    اختيار آلة بأقل تكلفة
  vars: {C1: 40000, dC: 15000, O1: 11000, dO: 3000, i: 0.10}
  random: {C1: [30000, 60000, 1000], dC: [5000, 25000, 1000], O1: [8000, 15000, 500], dO: [1000, 5000, 250], i: [0.06, 0.14, 0.01]}
  calc:
    - C2 = C1 + dC
    - O2 = O1 - dO
    - S1 = floor(C1*0.12/500)*500
    - S2 = floor(C2*0.15/500)*500
    - P1 = C1 + O1*PA(i, 6) - S1*PF(i, 6)
    - P2 = C2 + O2*PA(i, 6) - S2*PF(i, 6)
    - best = pick(P1 <= P2, 'الآلة أ', 'الآلة ب')
  text: |
    مصنع يختار بين آلتين لنفس العمل، وعمر كل منهما 6 سنوات. الحد الأدنى للعائد [[i|%]].

    | | الآلة أ | الآلة ب |
    | --- | --- | --- |
    | السعر | [[C1|g]] | [[C2|g]] |
    | التشغيل السنوي | [[O1|g]] | [[O2|g]] |
    | قيمة البيع | [[S1|g]] | [[S2|g]] |

    أي آلة يختار؟
  solution: |
    الآلتان تؤديان نفس العمل، فالإيراد واحد ولا يؤثر في القرار. نقارن القيمة الحالية للتكاليف ونختار الأقل.

    $$
    PW_a = [[C1|g]] + [[O1|g]]\,(P/A,\ [[i|%]],\ 6) - [[S1|g]]\,(P/F,\ [[i|%]],\ 6) = [[P1|2]]
    $$

    $$
    PW_b = [[C2|g]] + [[O2|g]]\,(P/A,\ [[i|%]],\ 6) - [[S2|g]]\,(P/F,\ [[i|%]],\ 6) = [[P2|2]]
    $$

    يختار المصنع [[best]]، والفرق [[abs(P1-P2)|2]] دينار بالقيمة الحالية.

- id: c03-ex-pw-revenue
  kind: example
  title: |
    مشروعان بإيرادات
  vars: {C1: 80000, R1: 24000, C2: 110000, R2: 31000, i: 0.12}
  random: {C1: [40000, 100000, 5000], R1: [12000, 30000, 1000], C2: [100000, 160000, 5000], R2: [25000, 45000, 1000], i: [0.08, 0.15, 0.01]}
  calc:
    - N1 = -C1 + R1*PA(i, 5)
    - N2 = -C2 + R2*PA(i, 5)
    - best = pick(max(N1, N2) < 0, 'عدم تنفيذ أي منهما', pick(N1 >= N2, 'المشروع الأول', 'المشروع الثاني'))
  text: |
    أمام شركة مشروعان، ولا تستطيع تنفيذ إلا واحدا. المشروع الأول يكلف [[C1|g]] دينار ويعطي [[R1|g]] دينار سنويا. المشروع الثاني يكلف [[C2|g]] دينار ويعطي [[R2|g]] دينار سنويا. عمر كل منهما 5 سنوات بدون قيمة بيع، والحد الأدنى للعائد [[i|%]]. ماذا تختار؟
  solution: |
    $$
    PW_1 = -[[C1|g]] + [[R1|g]]\,(P/A,\ [[i|%]],\ 5) = [[N1|2]]
    $$

    $$
    PW_2 = -[[C2|g]] + [[R2|g]]\,(P/A,\ [[i|%]],\ 5) = [[N2|2]]
    $$

    القاعدة: اختر البديل صاحب أكبر قيمة حالية، بشرط أن تكون موجبة. إذا كانت كل القيم سالبة فالأفضل عدم التنفيذ. القرار: [[best]].

- id: c03-ex-three-projects
  kind: example
  title: |
    ثلاثة مشاريع وخيار عدم التنفيذ
  vars: {k1: 0, k2: 0, k3: 0, i: 0.15}
  random: {k1: [0.17, 0.25, 0.005], k2: [0.17, 0.25, 0.005], k3: [0.17, 0.25, 0.005], i: [0.10, 0.18, 0.01]}
  calc:
    - R1 = pick(k1 > 0, floor(100000*k1/500)*500, 22000)
    - R2 = pick(k2 > 0, floor(150000*k2/500)*500, 30000)
    - R3 = pick(k3 > 0, floor(200000*k3/500)*500, 37000)
    - f = PA(i, 10)
    - N1 = -100000 + R1*f
    - N2 = -150000 + R2*f
    - N3 = -200000 + R3*f
    - best = max(N1, N2, N3)
    - name = pick(best < 0, 'عدم التنفيذ', pick(best == N1, 'المشروع 1', pick(best == N2, 'المشروع 2', 'المشروع 3')))
  text: |
    ثلاثة مشاريع متنافية، عمر كل منها 10 سنوات، والحد الأدنى للعائد [[i|%]]. أيها تختار الشركة؟

    | المشروع | التكلفة | الدخل السنوي |
    | --- | --- | --- |
    | 1 | 100,000 | [[R1|g]] |
    | 2 | 150,000 | [[R2|g]] |
    | 3 | 200,000 | [[R3|g]] |
  solution: |
    كل المشاريع لها نفس العمر، فنستخدم نفس المعامل:

    $$
    (P/A,\ [[i|%]],\ 10) = [[f|f4]]
    $$

    | المشروع | القيمة الحالية |
    | --- | --- |
    | 1 | [[N1|2]] |
    | 2 | [[N2|2]] |
    | 3 | [[N3|2]] |
    | عدم التنفيذ | 0 |

    الخيار الأفضل: [[name]]. خيار عدم التنفيذ قيمته الحالية صفر، وهو يعني استثمار المال بالحد الأدنى للعائد في مكان آخر. لذلك لا يقبل مشروع بقيمة حالية سالبة حتى لو كان الوحيد المتاح.

# ------------------------------------------------------------ unequal lives
- id: c03-ex-lcm
  kind: example
  title: |
    أعمار مختلفة: المضاعف المشترك
  vars: {Ca: 15000, Oa: 3500, Sa: 1000, Cb: 22000, Ob: 3000, Sb: 2000, i: 0.10}
  random: {Ca: [8000, 25000, 500], Oa: [2000, 6000, 250], Sa: [0, 3000, 500], Cb: [15000, 35000, 500], Ob: [1500, 5000, 250], Sb: [0, 4000, 500], i: [0.06, 0.14, 0.01]}
  calc:
    - L = lcm(3, 4)
    - sa = PF(i, 3) + PF(i, 6) + PF(i, 9)
    - sb = PF(i, 4) + PF(i, 8)
    - Pa = Ca + (Ca - Sa)*(PF(i, 3) + PF(i, 6) + PF(i, 9)) + Oa*PA(i, 12) - Sa*PF(i, 12)
    - Pb = Cb + (Cb - Sb)*(PF(i, 4) + PF(i, 8)) + Ob*PA(i, 12) - Sb*PF(i, 12)
    - AWa = Ca*AP(i, 3) - Sa*AF(i, 3) + Oa
    - AWb = Cb*AP(i, 4) - Sb*AF(i, 4) + Ob
    - best = pick(Pa <= Pb, 'الآلة أ', 'الآلة ب')
  text: |
    الآلة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا، وعمرها 3 سنوات، وقيمة بيعها [[Sa|g]] دينار. الآلة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار سنويا، وعمرها 4 سنوات، وقيمة بيعها [[Sb|g]] دينار. قارن بينهما بالقيمة الحالية بنسبة [[i|%]].
  solution: |
    لا نقارن 3 سنوات من خدمة الآلة أ مع 4 سنوات من خدمة الآلة ب. نقارن على فترة واحدة تساوي المضاعف المشترك الأصغر للعمرين، أي [[L|n]] سنة، ونفترض أن كل آلة تستبدل بنفس التكاليف في نهاية عمرها.

    الآلة أ تشترى في السنوات 0 و3 و6 و9. عند كل استبدال تباع القديمة وتشترى الجديدة، فالصافي سعر الشراء ناقص قيمة البيع.

    مجموع معاملات النقل لسنوات الاستبدال:

    $$
    (P/F,\ [[i|%]],\ 3) + (P/F,\ [[i|%]],\ 6) + (P/F,\ [[i|%]],\ 9) = [[sa|f4]]
    $$

    $$
    PW_a = [[Ca|g]] + [[Ca-Sa|g]] \times [[sa|f4]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ 12)
    $$

    $$
    \qquad - [[Sa|g]]\,(P/F,\ [[i|%]],\ 12) = [[Pa|2]]
    $$

    الآلة ب تشترى في السنوات 0 و4 و8:

    $$
    (P/F,\ [[i|%]],\ 4) + (P/F,\ [[i|%]],\ 8) = [[sb|f4]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Cb-Sb|g]] \times [[sb|f4]] + [[Ob|g]]\,(P/A,\ [[i|%]],\ 12)
    $$

    $$
    \qquad - [[Sb|g]]\,(P/F,\ [[i|%]],\ 12) = [[Pb|2]]
    $$

    الأقل تكلفة: [[best]].

    الطريقة أطول من اللازم. القيمة السنوية لعمر واحد تعطي نفس القرار مباشرة، كما في قسم القيمة السنوية:

    $$
    AW_a = [[AWa|2]], \qquad AW_b = [[AWb|2]]
    $$

- id: c03-ex-study-period
  kind: example
  title: |
    أعمار مختلفة: فترة الدراسة
  vars: {Ca: 30000, Oa: 4000, Ma: 12000, Cb: 22000, Ob: 5500, Sb: 2000, i: 0.08}
  random: {Ca: [20000, 45000, 1000], Oa: [2000, 6000, 250], Ma: [6000, 18000, 500], Cb: [12000, 30000, 1000], Ob: [3000, 8000, 250], Sb: [0, 4000, 500], i: [0.05, 0.12, 0.01]}
  calc:
    - Pa = Ca + Oa*PA(i, 5) - Ma*PF(i, 5)
    - Pb = Cb + Ob*PA(i, 5) - Sb*PF(i, 5)
    - best = pick(Pa <= Pb, 'المضخة أ', 'المضخة ب')
  text: |
    عقد تشغيل محطة مياه مدته 5 سنوات، ولا تحتاج الشركة المضخة بعده. المضخة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا، وعمرها 9 سنوات، ويقدر أن تباع بعد 5 سنوات بقيمة [[Ma|g]] دينار. المضخة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار سنويا، وعمرها 5 سنوات، وقيمة بيعها [[Sb|g]] دينار. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    المضاعف المشترك هنا 45 سنة، وهذا غير منطقي لعقد مدته 5 سنوات. نستخدم فترة الدراسة: 5 سنوات. المضخة أ تقيم بقيمتها السوقية المتوقعة في نهاية الفترة، وليس بقيمتها في نهاية عمرها.

    $$
    PW_a = [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ 5) - [[Ma|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Ob|g]]\,(P/A,\ [[i|%]],\ 5) - [[Sb|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pb|2]]
    $$

    الأقل تكلفة: [[best]]. القرار يعتمد كثيرا على تقدير القيمة السوقية بعد 5 سنوات، فتأكد من هذا الرقم قبل القرار.

# ------------------------------------------------------------ annual worth
- id: c03-ex-aw-project
  kind: example
  title: |
    القيمة السنوية لمشروع
  vars: {C: 90000, R: 25000, S: 20000, n: 6, i: 0.12}
  random: {C: [40000, 150000, 5000], R: [10000, 45000, 1000], S: [0, 30000, 1000], n: [4, 10, 1], i: [0.08, 0.15, 0.01]}
  calc:
    - CR = C*AP(i, n) - S*AF(i, n)
    - AW = R - CR
    - PW = AW*PA(i, n)
  diagram: {n: n, i: "i = [[i|%]]", flows: [[0, "-C"], ["n", "R+S", "[[R|g]] + [[S|g]]"]], series: [[1, "n-1", "R"]]}
  text: |
    شاحنة نقل تكلف [[C|g]] دينار، وتعطي صافي دخل [[R|g]] دينار سنويا لمدة [[yrs(n)]]، ثم تباع بقيمة [[S|g]] دينار. ما القيمة السنوية للمشروع بنسبة [[i|%]]؟
  solution: |
    القيمة السنوية تحول كل التدفقات إلى مبلغ ثابت كل سنة. الدخل السنوي ثابت أصلا. نحول السعر وقيمة البيع:

    $$
    CR = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

    هذا المبلغ يسمى تكلفة استرداد رأس المال: ما يجب أن يعطيه المشروع كل سنة ليسترد ثمنه مع الحد الأدنى للعائد.

    $$
    AW = [[R|g]] - [[CR|2]] = [[AW|2]]
    $$

    المشروع [[pick(AW >= 0, 'مقبول', 'مرفوض')]]. القيمة السنوية والقيمة الحالية تعطيان نفس القرار دائما، لأن:

    $$
    PW = AW\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

- id: c03-ex-capital-recovery
  kind: example
  title: |
    صيغتان لتكلفة استرداد رأس المال
  vars: {P: 50000, S: 10000, n: 5, i: 0.10}
  random: {P: [10000, 100000, 1000], S: [0, 20000, 500], n: [3, 12, 1], i: [0.05, 0.15, 0.005]}
  calc:
    - CR1 = P*AP(i, n) - S*AF(i, n)
    - CR2 = (P - S)*AP(i, n) + S*i
  text: |
    معدات تكلف [[P|g]] دينار وتباع بعد [[yrs(n)]] بقيمة [[S|g]] دينار. احسب تكلفة استرداد رأس المال بنسبة [[i|%]] بصيغتين، وتأكد أنهما متساويتان.
  solution: |
    الصيغة الأولى:

    $$
    CR = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR1|2]]
    $$

    الصيغة الثانية تقسم القيمة إلى جزء يضيع وجزء يعود:

    $$
    CR = ([[P|g]] - [[S|g]])\,(A/P,\ [[i|%]],\ [[n|n]]) + [[S|g]] \times [[i|r]] = [[CR2|2]]
    $$

    الجزء الذي يضيع من قيمة المعدات يسترد بأقساط. الجزء الذي يعود عند البيع تدفع عليه فائدة سنوية فقط. اشتقاق التساوي في ملحق اشتقاق المعادلات.

- id: c03-ex-aw-unequal
  kind: example
  title: |
    القيمة السنوية لبدائل بأعمار مختلفة
  vars: {Ca: 18000, Oa: 4000, Sa: 2000, Cb: 30000, Ob: 3000, Sb: 4000, i: 0.12}
  random: {Ca: [10000, 25000, 500], Oa: [2000, 7000, 250], Sa: [0, 4000, 500], Cb: [20000, 45000, 500], Ob: [1500, 5000, 250], Sb: [0, 6000, 500], i: [0.06, 0.15, 0.01]}
  calc:
    - Aa = Ca*AP(i, 4) - Sa*AF(i, 4) + Oa
    - Ab = Cb*AP(i, 6) - Sb*AF(i, 6) + Ob
    - best = pick(Aa <= Ab, 'البديل أ', 'البديل ب')
  text: |
    البديل أ يكلف [[Ca|g]] دينار، وتشغيله [[Oa|g]] دينار سنويا، وعمره 4 سنوات، وقيمة بيعه [[Sa|g]] دينار. البديل ب يكلف [[Cb|g]] دينار، وتشغيله [[Ob|g]] دينار سنويا، وعمره 6 سنوات، وقيمة بيعه [[Sb|g]] دينار. قارن بالقيمة السنوية بنسبة [[i|%]].
  solution: |
    نحسب القيمة السنوية لكل بديل على عمره هو، بدون مضاعف مشترك:

    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 4) - [[Sa|g]]\,(A/F,\ [[i|%]],\ 4) + [[Oa|g]] = [[Aa|2]]
    $$

    $$
    AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 6) - [[Sb|g]]\,(A/F,\ [[i|%]],\ 6) + [[Ob|g]] = [[Ab|2]]
    $$

    الأقل تكلفة: [[best]].

    لماذا يصح هذا؟ إذا تكرر البديل بنفس التكاليف، فكل دورة لها نفس القيمة السنوية. لذلك القيمة السنوية لدورة واحدة تساوي القيمة السنوية على المضاعف المشترك، ونوفر الحساب الطويل. هذا الافتراض نفسه هو افتراض طريقة المضاعف المشترك.

- id: c03-ex-aw-irregular
  kind: example
  title: |
    القيمة السنوية لتدفقات غير منتظمة
  vars: {c0: 50000, c1: 12000, c2: 15000, c3: 18000, c4: 15000, c5: 12000, i: 0.10}
  random: {c0: [30000, 80000, 1000], c1: [5000, 20000, 500], c2: [5000, 25000, 500], c3: [8000, 30000, 500], c4: [5000, 25000, 500], c5: [3000, 20000, 500], i: [0.06, 0.15, 0.01]}
  calc:
    - PW = -c0 + c1*PF(i, 1) + c2*PF(i, 2) + c3*PF(i, 3) + c4*PF(i, 4) + c5*PF(i, 5)
    - AW = PW*AP(i, 5)
  diagram: {n: 5, i: "i = [[i|%]]", flows: [[0, "-c0"], [1, "c1"], [2, "c2"], [3, "c3"], [4, "c4"], [5, "c5"]]}
  text: |
    مشروع يكلف [[c0|g]] دينار، ويعطي في السنوات من 1 إلى 5 المبالغ [[c1|g]] و[[c2|g]] و[[c3|g]] و[[c4|g]] و[[c5|g]] دينار. ما قيمته السنوية بنسبة [[i|%]]؟
  solution: |
    التدفقات غير منتظمة، فلا يوجد معامل يحولها مباشرة. نحسب القيمة الحالية أولا، ثم نوزعها على 5 سنوات:

    $$
    PW = -[[c0|g]] + [[c1|g]]\,(P/F,\ [[i|%]],\ 1) + \cdots + [[c5|g]]\,(P/F,\ [[i|%]],\ 5) = [[PW|2]]
    $$

    $$
    AW = [[PW|2]]\,(A/P,\ [[i|%]],\ 5) = [[AW|2]]
    $$

    في Excel:

    ```excel
    =PMT([[i|%]], 5, -NPV([[i|%]], [[c1|r]], [[c2|r]], [[c3|r]], [[c4|r]], [[c5|r]]) + [[c0|r]])
    ```

# ------------------------------------------------------------ capitalized cost
- id: c03-ex-capcost
  kind: example
  title: |
    التكلفة المرسملة لطريق
  vars: {C: 800000, M: 25000, i: 0.06}
  random: {C: [200000, 2000000, 50000], M: [5000, 80000, 1000], i: [0.04, 0.10, 0.005]}
  calc:
    - PM = M/i
    - CC = C + PM
  text: |
    بلدية تبني طريقا بتكلفة [[C|g]] دينار، وصيانته [[M|g]] دينار سنويا إلى ما لا نهاية. ما التكلفة المرسملة بنسبة [[i|%]]؟
  solution: |
    التكلفة المرسملة هي القيمة الحالية لمشروع عمره بلا نهاية. القيمة الحالية لدفعة سنوية دائمة:

    $$
    P = \frac{A}{i} = \frac{[[M|g]]}{[[i|r]]} = [[PM|2]]
    $$

    $$
    CC = [[C|g]] + [[PM|2]] = [[CC|2]]
    $$

    المعنى: إذا وضعت البلدية [[CC|2]] دينار اليوم، تبني الطريق بجزء منه، والباقي يعطي فائدة سنوية تكفي الصيانة إلى الأبد.

- id: c03-ex-capcost-periodic
  kind: example
  title: |
    تكلفة مرسملة مع إعادة تأهيل دورية
  vars: {C: 800000, M: 25000, R: 120000, k: 10, i: 0.06}
  random: {C: [200000, 2000000, 50000], M: [5000, 80000, 1000], R: [40000, 300000, 5000], k: [5, 15, 1], i: [0.04, 0.10, 0.005]}
  calc:
    - AR = R*AF(i, k)
    - CC = C + (M + AR)/i
  text: |
    للطريق في المثال السابق تكلفة [[C|g]] دينار وصيانة [[M|g]] دينار سنويا. يحتاج أيضا إعادة تعبيد كل [[yrs(k)]] بتكلفة [[R|g]] دينار، أولها في نهاية السنة [[k|n]]. ما التكلفة المرسملة بنسبة [[i|%]]؟
  solution: |
    القانون P يساوي A مقسومة على i يحتاج دفعة كل سنة. إعادة التعبيد كل [[yrs(k)]]، فنحولها أولا إلى دفعة سنوية مكافئة. الدفعة في نهاية كل دورة، فنستخدم A/F:

    $$
    A_R = [[R|g]]\,(A/F,\ [[i|%]],\ [[k|n]]) = [[AR|2]]
    $$

    $$
    CC = [[C|g]] + \frac{[[M|g]] + [[AR|2]]}{[[i|r]]} = [[CC|2]]
    $$

# ------------------------------------------------------------ payback and break-even
- id: c03-ex-payback
  kind: example
  title: |
    فترة الاسترداد البسيطة والمخصومة
  vars: {C: 60000, R: 15000, i: 0.10}
  random: {C: [10000, 100000, 1000], R: [4000, 30000, 500], i: [0.05, 0.12, 0.01]}
  calc:
    - R = max(R, C/8)
    - ns = C/R
    - nd = -ln(1 - C*i/R)/ln(1+i)
  text: |
    نظام تحكم يكلف [[C|g]] دينار ويوفر [[R|g]] دينار سنويا. احسب فترة الاسترداد البسيطة، ثم المخصومة بنسبة [[i|%]].
  solution: |
    فترة الاسترداد البسيطة تتجاهل قيمة المال مع الزمن:

    $$
    n_s = \frac{[[C|g]]}{[[R|g]]} = [[ns|2]]
    $$

    فترة الاسترداد المخصومة هي عدد السنوات الذي يجعل القيمة الحالية للتوفير تساوي التكلفة:

    $$
    [[R|g]]\,(P/A,\ [[i|%]],\ n) = [[C|g]]
    $$

    $$
    n = \frac{-\ln\left(1 - \frac{[[C|g]] \times [[i|r]]}{[[R|g]]}\right)}{\ln([[1+i|r]])} = [[nd|2]]
    $$

    في Excel:

    ```excel
    =NPER([[i|%]], [[R|r]], -[[C|r]])
    ```

    الفترة المخصومة أطول دائما. فترة الاسترداد تقيس سرعة رجوع المال، وليس ربح المشروع، لأنها تتجاهل ما يحدث بعدها. استخدمها معيارا مساعدا، وليس بديلا عن القيمة الحالية.

- id: c03-ex-payback-table
  kind: example
  title: |
    فترة الاسترداد لتدفقات غير منتظمة
  calc:
    - d1 = 14000*PF(0.10, 1)
    - d2 = 16000*PF(0.10, 2)
    - d3 = 18000*PF(0.10, 3)
    - d4 = 20000*PF(0.10, 4)
    - d5 = 22000*PF(0.10, 5)
    - k1 = -60000 + d1
    - k2 = k1 + d2
    - k3 = k2 + d3
    - k4 = k3 + d4
    - k5 = k4 + d5
    - nd = 4 + (-k4)/d5
  text: |
    مشروع يكلف 60,000 دينار، ويعطي في السنوات من 1 إلى 5 المبالغ 14,000 و16,000 و18,000 و20,000 و22,000 دينار. احسب فترة الاسترداد البسيطة والمخصومة بنسبة 10%.
  solution: |
    نبني جدولا تراكميا. العمود المخصوم يضرب كل تدفق في معامل P/F لسنته:

    | السنة | التدفق | التراكمي | المخصوم | التراكمي المخصوم |
    | --- | --- | --- | --- | --- |
    | 0 | -60,000 | -60,000 | -60,000 | -60,000 |
    | 1 | 14,000 | -46,000 | [[d1|2]] | [[k1|2]] |
    | 2 | 16,000 | -30,000 | [[d2|2]] | [[k2|2]] |
    | 3 | 18,000 | -12,000 | [[d3|2]] | [[k3|2]] |
    | 4 | 20,000 | 8,000 | [[d4|2]] | [[k4|2]] |
    | 5 | 22,000 | 30,000 | [[d5|2]] | [[k5|2]] |

    التراكمي البسيط يصبح موجبا خلال السنة 4. بقي في بدايتها 12,000 دينار من 20,000، فالفترة البسيطة:

    $$
    n_s = 3 + \frac{12{,}000}{20{,}000} = 3.6
    $$

    التراكمي المخصوم يصبح موجبا خلال السنة 5:

    $$
    n_d = 4 + \frac{[[-k4|2]]}{[[d5|2]]} = [[nd|2]]
    $$

- id: c03-ex-breakeven
  kind: example
  title: |
    أقل توفير يبرر الاستثمار
  vars: {C: 45000, S: 5000, n: 7, i: 0.12}
  random: {C: [10000, 100000, 1000], S: [0, 15000, 500], n: [4, 12, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - R = C*AP(i, n) - S*AF(i, n)
  text: |
    روبوت تغليف يكلف [[C|g]] دينار، ويباع بعد [[yrs(n)]] بقيمة [[S|g]] دينار. ما أقل توفير سنوي في الأجور يجعل شراءه مقبولا بنسبة [[i|%]]؟
  solution: |
    الشراء مقبول إذا كانت القيمة السنوية موجبة أو صفرا. نقطة التعادل عندما تساوي صفرا، أي عندما يساوي التوفير تكلفة استرداد رأس المال:

    $$
    R = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[R|2]]
    $$

    إذا وفر الروبوت أكثر من [[R|2]] دينار سنويا فالشراء مقبول. هذا الرقم يسهل النقاش مع الإدارة: بدل سؤال هل المشروع مربح، نسأل هل يوفر الروبوت عمل عامل واحد على الأقل.

# ------------------------------------------------------------ monthly cash flows
- id: c03-ex-monthly-project
  kind: example
  title: |
    شقة للإيجار بتدفقات شهرية
  vars: {C: 90000, rent: 450, S: 100000, ia: 0.09}
  random: {C: [50000, 150000, 5000], rent: [250, 900, 25], S: [40000, 180000, 5000], ia: [0.05, 0.12, 0.005]}
  calc:
    - im = (1+ia)**(1/12) - 1
    - PR = rent*PA(im, 120)
    - PS = S*PF(ia, 10)
    - PW = -C + PR + PS
  text: |
    مستثمر يشتري شقة بسعر [[C|g]] دينار، ويؤجرها بمبلغ [[rent|g]] دينار في نهاية كل شهر لمدة 10 سنوات، ثم يبيعها بسعر [[S|g]] دينار. الحد الأدنى للعائد [[ia|%]] نسبة فعلية سنوية. هل الشراء مقبول؟
  solution: |
    الإيجار شهري، فنحتاج نسبة شهرية تكافئ [[ia|%]] سنويا:

    $$
    i_m = (1 + [[ia|r]])^{1/12} - 1 = [[im|%2]]
    $$

    القيمة الحالية للإيجار على 120 شهرا:

    $$
    P_R = [[rent|g]]\,(P/A,\ [[im|%2]],\ 120) = [[PR|2]]
    $$

    البيع مبلغ واحد بعد 10 سنوات، فنستخدم النسبة السنوية مباشرة:

    $$
    P_S = [[S|g]]\,(P/F,\ [[ia|%]],\ 10) = [[PS|2]]
    $$

    $$
    PW = -[[C|g]] + [[PR|2]] + [[PS|2]] = [[PW|2]]
    $$

    الشراء [[pick(PW >= 0, 'مقبول', 'مرفوض')]]. لاحظ أن كل تدفق خصم بنسبة تناسب فترته: الشهري بالنسبة الشهرية، والسنوي بالنسبة السنوية.
