- id: c03-k-01
  kind: case
  part: K
  calc:
    - im = 0.075/12
    - Ab = 900000*AP(im, 180)
    - Pbuy2 = 300000 + 900000 + 28000*PA(0.10, 15) - 600000*PF(0.10, 15)
    - Prent = 110000*PA(0.10, 15)*1.10
  text: |
    **حالة 3.1: شراء مبنى المصنع أم استئجاره**

    مصنع أثاث في نابلس يستأجر مبناه بمبلغ 110,000 دينار سنويا، يدفع في بداية كل سنة. عرض عليه المالك بيع المبنى بسعر 1,200,000 دينار. المصنع يدفع 300,000 دينار نقدا، والباقي قرض بنكي بفائدة 7.5% سنويا تحسب شهريا لمدة 15 سنة. إذا اشترى المبنى، يدفع صيانة وضرائب 28,000 دينار سنويا. يتوقع أن تبلغ قيمة المبنى بعد 15 سنة 600,000 دينار، لأن المنطقة الصناعية تتوسع. الحد الأدنى للعائد في المصنع 10%.

    (أ) ما القسط الشهري للقرض؟ (ب) ما القيمة الحالية لتكلفة الاستئجار على 15 سنة؟ (ج) ما القيمة الحالية لتكلفة الشراء؟ (د) ماذا يختار المصنع؟ (هـ) لماذا لا نحتاج حساب أقساط القرض في الجزء (ج)؟
  solution: |
    (أ) قرض 900,000 دينار على 180 شهرا بنسبة شهرية:

    $$
    i_m = \frac{7.5\%}{12} = 0.625\%
    $$

    $$
    A = 900{,}000\,(A/P,\ 0.625\%,\ 180) = [[Ab|2]]
    $$

    (ب) الإيجار في بداية كل سنة، فهو سلسلة من السنة 0 إلى السنة 14:

    $$
    PW_{rent} = 110{,}000\,(P/A,\ 10\%,\ 15)\,(1.10) = [[Prent|2]]
    $$

    (ج) نحسب الشراء بسعر المبنى كاملا في السنة 0:

    $$
    PW_{buy} = 1{,}200{,}000 + 28{,}000\,(P/A,\ 10\%,\ 15) - 600{,}000\,(P/F,\ 10\%,\ 15) = [[Pbuy2|2]]
    $$

    (د) المصنع [[pick(Pbuy2 < Prent, 'يشتري المبنى، لأن تكلفة الشراء أقل', 'يبقى مستأجرا، لأن تكلفة الاستئجار أقل')]]. الفرق [[abs(Prent - Pbuy2)|2]] دينار بالقيمة الحالية.

    (هـ) القرض بنسبة 7.5% أقل من الحد الأدنى للعائد 10%. لكن مقارنة طريقة التمويل قرار منفصل عن قرار الشراء. نقيم الشراء أولا بسعره النقدي. إذا أردنا إدخال القرض، فالقيمة الحالية لأقساطه بنسبة 10% أقل من 900,000 دينار، وهذا يجعل الشراء أفضل قليلا. القاعدة العملية: لا تخلط قرار الاستثمار بقرار التمويل، إلا إذا كان التمويل مرتبطا بالمشروع وحده.

- id: c03-k-02
  kind: case
  part: K
  calc:
    - Ad = 140000*AP(0.10, 8) - 20000*AF(0.10, 8) + 0.35*55000*1.2
    - Ae = 220000*AP(0.10, 10) - 30000*AF(0.10, 10) + 0.12*55000*1.2 + 4000
    - D = Ad - Ae
    - cost_d = 0.35*55000*1.2
    - cost_e = 0.12*55000*1.2
    - CRd = 140000*AP(0.10, 8) - 20000*AF(0.10, 8)
    - CRe = 220000*AP(0.10, 10) - 30000*AF(0.10, 10)
    - kmx = (CRe + 4000 - CRd)/(0.42 - 0.144)
  text: |
    **حالة 3.2: حافلة ديزل أم حافلة كهربائية**

    شركة نقل في رام الله تشتري حافلة لخط يقطع 55,000 كيلومتر سنويا. الخيارات:

    | | ديزل | كهربائية |
    | --- | --- | --- |
    | السعر | 140,000 | 220,000 |
    | العمر | 8 سنوات | 10 سنوات |
    | قيمة البيع | 20,000 | 30,000 |
    | الطاقة لكل كيلومتر | 0.35 لتر | 1.2 كيلوواط ساعة |
    | سعر الوحدة | 1.2 دينار للتر | 0.12 دينار للكيلوواط ساعة |
    | صيانة البطارية السنوية | لا يوجد | 4,000 |

    لاحظ أن الديزل يقاس باللتر والكهرباء بالكيلوواط ساعة. الحد الأدنى للعائد 10%. صيانة المحرك متساوية في الخيارين.

    (أ) ما تكلفة الطاقة السنوية لكل حافلة؟ (ب) ما القيمة السنوية لكل خيار؟ (ج) أيهما تختار؟ (د) ما المسافة السنوية التي يتساوى عندها الخياران؟
  solution: |
    (أ) تكلفة الطاقة للديزل:

    $$
    55{,}000 \times 0.35 \times 1.2 = [[cost_d|2]]
    $$

    وللكهربائية:

    $$
    55{,}000 \times 1.2 \times 0.12 = [[cost_e|2]]
    $$

    (ب) الأعمار مختلفة، فنقارن بالقيمة السنوية:

    $$
    AW_d = 140{,}000\,(A/P,\ 10\%,\ 8) - 20{,}000\,(A/F,\ 10\%,\ 8) + [[cost_d|2]] = [[Ad|2]]
    $$

    $$
    AW_e = 220{,}000\,(A/P,\ 10\%,\ 10) - 30{,}000\,(A/F,\ 10\%,\ 10) + [[cost_e|2]] + 4{,}000 = [[Ae|2]]
    $$

    (ج) تختار الشركة الحافلة [[pick(Ad <= Ae, 'الديزل', 'الكهربائية')]]، والفرق [[abs(D)|2]] دينار سنويا.

    (د) تكلفة الطاقة لكل كيلومتر 0.42 دينار للديزل، و0.144 دينار للكهربائية. تكلفة استرداد رأس المال:

    $$
    CR_d = [[CRd|2]], \qquad CR_e = [[CRe|2]]
    $$

    نساوي القيمتين السنويتين مع مسافة مجهولة x:

    $$
    [[CRd|2]] + 0.42\,x = [[CRe|2]] + 4{,}000 + 0.144\,x
    $$

    $$
    x = \frac{[[CRe|2]] + 4{,}000 - [[CRd|2]]}{0.42 - 0.144} = [[kmx|0]]
    $$

    إذا قطعت الحافلة أكثر من [[kmx|0]] كيلومتر سنويا فالكهربائية أرخص. الخطوط الطويلة تناسب الحافلة الكهربائية، لأن الاستثمار الإضافي يسترد من كل كيلومتر.

- id: c03-k-03
  kind: case
  part: K
  calc:
    - CC1 = 2500000 + 60000/0.06 + 300000*AF(0.06, 20)/0.06
    - CC2 = 3400000 + 25000/0.06 + 150000*AF(0.06, 25)/0.06
    - a1 = 60000 + 300000*AF(0.06, 20)
    - a2 = 25000 + 150000*AF(0.06, 25)
  text: |
    **حالة 3.3: محطة معالجة مياه للبلدية**

    بلدية تختار بين تصميمين لمحطة معالجة مياه عادمة:

    - التصميم الأول: تكلفة البناء 2,500,000 دينار، والتشغيل والصيانة 60,000 دينار سنويا، وتجديد المعدات كل 20 سنة بتكلفة 300,000 دينار.
    - التصميم الثاني: تكلفة البناء 3,400,000 دينار، والتشغيل والصيانة 25,000 دينار سنويا، وتجديد المعدات كل 25 سنة بتكلفة 150,000 دينار.

    النسبة المستخدمة في المشاريع العامة 6%.

    (أ) ما التكلفة المرسملة لكل تصميم؟ (ب) أيهما تختار البلدية؟ (ج) جهة مانحة تقترح نسبة 4% للمشاريع العامة. هل يتغير القرار؟ (د) لماذا تؤثر النسبة في هذا القرار أكثر من قرارات المصانع؟
  solution: |
    (أ) نحول التجديد إلى دفعة سنوية بالمعامل A/F، ثم نقسم كل التكاليف السنوية على النسبة:

    $$
    CC_1 = 2{,}500{,}000 + \frac{60{,}000 + 300{,}000\,(A/F,\ 6\%,\ 20)}{0.06} = [[CC1|2]]
    $$

    $$
    CC_2 = 3{,}400{,}000 + \frac{25{,}000 + 150{,}000\,(A/F,\ 6\%,\ 25)}{0.06} = [[CC2|2]]
    $$

    (ب) تختار البلدية التصميم [[pick(CC1 <= CC2, 'الأول', 'الثاني')]].

    (ج) بنسبة 4%، مع إعادة حساب المعامل A/F بالنسبة الجديدة:

    $$
    CC_1 = [[2500000 + (60000 + 300000*AF(0.04, 20))/0.04|2]], \qquad CC_2 = [[3400000 + (25000 + 150000*AF(0.04, 25))/0.04|2]]
    $$

    بنسبة 4% يختار التصميم [[pick(2500000 + (60000 + 300000*AF(0.04, 20))/0.04 <= 3400000 + (25000 + 150000*AF(0.04, 25))/0.04, 'الأول', 'الثاني')]].

    (د) التكلفة المرسملة تقسم التكاليف المتكررة على النسبة، وتمتد إلى الأبد. النسبة المنخفضة تعطي وزنا كبيرا للتكاليف البعيدة، فتفضل التصميم الأغلى بناء والأرخص تشغيلا. في المصانع المدة أقصر، فأثر النسبة أصغر.
