items:

- id: c03-d-01
  kind: problem
  part: D
  vars: {Ca: 25000, Oa: 6000, Cb: 32000, Ob: 4500, n: 5, i: 0.10}
  random: {Ca: [10000, 40000, 1000], Oa: [3000, 10000, 250], Cb: [15000, 55000, 1000], Ob: [2000, 8000, 250], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - Pa = Ca + Oa*PA(i, n)
    - Pb = Cb + Ob*PA(i, n)
    - best = pick(Pa <= Pb, 'أ', 'ب')
  text: |
    آلتان لنفس العمل، عمر كل منهما [[yrs(n)]] بدون قيمة بيع. الآلة أ تكلف [[Ca|g]] دينار وتشغيلها [[Oa|g]] دينار سنويا. الآلة ب تكلف [[Cb|g]] دينار وتشغيلها [[Ob|g]] دينار سنويا. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    $$
    PW_a = [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Ob|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pb|2]]
    $$

    الأقل تكلفة الآلة [[best]].

- id: c03-d-02
  kind: problem
  part: D
  vars: {Ca: 40000, Oa: 9000, Sa: 5000, Cb: 52000, Ob: 7000, Sb: 9000, n: 8, i: 0.08}
  random: {Ca: [20000, 60000, 1000], Oa: [4000, 14000, 250], Sa: [0, 8000, 500], Cb: [30000, 80000, 1000], Ob: [3000, 11000, 250], Sb: [0, 12000, 500], n: [5, 12, 1], i: [0.05, 0.12, 0.01]}
  calc:
    - Pa = Ca + Oa*PA(i, n) - Sa*PF(i, n)
    - Pb = Cb + Ob*PA(i, n) - Sb*PF(i, n)
    - best = pick(Pa <= Pb, 'أ', 'ب')
  text: |
    نظاما تكييف لمبنى، عمر كل منهما [[yrs(n)]]. النظام أ يكلف [[Ca|g]] دينار، وكهرباؤه [[Oa|g]] دينار سنويا، وقيمة بيعه [[Sa|g]] دينار. النظام ب يكلف [[Cb|g]] دينار، وكهرباؤه [[Ob|g]] دينار سنويا، وقيمة بيعه [[Sb|g]] دينار. أيهما أفضل بنسبة [[i|%]]؟
  solution: |
    $$
    PW_a = [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sa|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Ob|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[Sb|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[Pb|2]]
    $$

    الأفضل النظام [[best]].

- id: c03-d-03
  kind: problem
  part: D
  vars: {C1: 60000, R1: 17000, C2: 90000, R2: 24000, n: 6, i: 0.12}
  random: {C1: [30000, 80000, 1000], R1: [8000, 25000, 500], C2: [60000, 130000, 1000], R2: [14000, 40000, 500], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - N1 = -C1 + R1*PA(i, n)
    - N2 = -C2 + R2*PA(i, n)
    - best = pick(max(N1, N2) < 0, 'عدم التنفيذ', pick(N1 >= N2, 'المشروع الأول', 'المشروع الثاني'))
  text: |
    مشروعان متنافيان، عمر كل منهما [[yrs(n)]]. الأول يكلف [[C1|g]] دينار ويعطي [[R1|g]] دينار سنويا. الثاني يكلف [[C2|g]] دينار ويعطي [[R2|g]] دينار سنويا. ماذا تختار بنسبة [[i|%]]؟
  solution: |
    $$
    PW_1 = -[[C1|g]] + [[R1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[N1|2]]
    $$

    $$
    PW_2 = -[[C2|g]] + [[R2|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[N2|2]]
    $$

    القرار: [[best]].

- id: c03-d-04
  kind: problem
  part: D
  vars: {C1: 60000, R1: 17000, C2: 90000, R2: 24000, n: 6, i: 0.12}
  random: {C1: [30000, 80000, 1000], R1: [8000, 25000, 500], C2: [60000, 130000, 1000], R2: [14000, 40000, 500], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - D = -(C2 - C1) + (R2 - R1)*PA(i, n)
    - N1 = -C1 + R1*PA(i, n)
    - N2 = -C2 + R2*PA(i, n)
  text: |
    للمشروعين في المسألة السابقة، احسب القيمة الحالية للفرق بينهما: الاستثمار الإضافي في المشروع الثاني مقابل الدخل الإضافي. ما علاقة النتيجة بالفرق بين القيمتين الحاليتين؟
  solution: |
    الاستثمار الإضافي [[C2-C1|g]] دينار، والدخل الإضافي [[R2-R1|g]] دينار سنويا:

    $$
    PW_{2-1} = -[[C2-C1|g]] + [[R2-R1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[D|2]]
    $$

    هذا يساوي الفرق بين القيمتين الحاليتين:

    $$
    [[N2|2]] - [[N1|2]] = [[N2-N1|2]]
    $$

    إذا كانت موجبة فالاستثمار الإضافي يستحق. هذه فكرة التحليل التزايدي في الفصل التالي.

- id: c03-d-05
  kind: problem
  part: D
  vars: {C: 12000, O: 900, i: 0.10}
  random: {C: [6000, 25000, 500], O: [300, 2500, 100], i: [0.06, 0.14, 0.01]}
  calc:
    - Pb = C + O*PA(i, 8)
    - R = Pb*AP(i, 8)/(1+i)
  text: |
    شركة تحتاج سيارة لمدة 8 سنوات. شراؤها يكلف [[C|g]] دينار، وصيانتها [[O|g]] دينار سنويا، ولا قيمة لها في النهاية. ما أعلى إيجار سنوي يدفع في بداية كل سنة، ويشمل الصيانة، يجعل الإيجار أفضل من الشراء بنسبة [[i|%]]؟
  solution: |
    القيمة الحالية لتكلفة الشراء:

    $$
    PW_{buy} = [[C|g]] + [[O|g]]\,(P/A,\ [[i|%]],\ 8) = [[Pb|2]]
    $$

    الإيجار في بداية كل سنة، فهو سلسلة من السنة 0 إلى السنة 7. القيمة الحالية لإيجار سنوي X:

    $$
    PW_{lease} = X\,(P/A,\ [[i|%]],\ 8)\,(1 + [[i|r]])
    $$

    نساوي القيمتين ونحل:

    $$
    X = \frac{[[Pb|2]]\,(A/P,\ [[i|%]],\ 8)}{[[1+i|r]]} = [[R|2]]
    $$

- id: c03-d-06
  kind: problem
  part: D
  vars: {Ca: 8000, Ea: 0.85, Cb: 11000, Eb: 0.93, kw: 30, h: 4000, p: 0.15, i: 0.10}
  random: {Ca: [5000, 12000, 500], Ea: [0.80, 0.88, 0.01], Cb: [8000, 16000, 500], Eb: [0.90, 0.96, 0.01], kw: [10, 75, 5], h: [2000, 6000, 250], p: [0.10, 0.25, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Oa = kw*h*p/Ea
    - Ob = kw*h*p/Eb
    - Pa = Ca + Oa*PA(i, 10)
    - Pb = Cb + Ob*PA(i, 10)
    - best = pick(Pa <= Pb, 'المحرك أ', 'المحرك ب')
  text: |
    مصنع يحتاج محركا بقدرة [[kw|n]] كيلوواط يعمل [[h|g]] ساعة سنويا لمدة 10 سنوات. سعر الكيلوواط ساعة [[p|d2]] دينار. المحرك أ يكلف [[Ca|g]] دينار وكفاءته [[Ea|%]]. المحرك ب يكلف [[Cb|g]] دينار وكفاءته [[Eb|%]]. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    تكلفة الكهرباء السنوية تساوي القدرة مضروبة في الساعات والسعر، مقسومة على الكفاءة:

    $$
    O_a = \frac{[[kw|n]] \times [[h|g]] \times [[p|d2]]}{[[Ea|r]]} = [[Oa|2]], \qquad O_b = \frac{[[kw|n]] \times [[h|g]] \times [[p|d2]]}{[[Eb|r]]} = [[Ob|2]]
    $$

    $$
    PW_a = [[Ca|g]] + [[Oa|2]]\,(P/A,\ [[i|%]],\ 10) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Ob|2]]\,(P/A,\ [[i|%]],\ 10) = [[Pb|2]]
    $$

    الأقل تكلفة: [[best]]. فرق صغير في الكفاءة يصنع فرقا كبيرا في تكلفة الكهرباء على 10 سنوات.

- id: c03-d-07
  kind: problem
  part: D
  vars: {Ca: 30000, Oa: 7000, Cb: 42000, n: 6, i: 0.10}
  random: {Ca: [15000, 50000, 1000], Oa: [3000, 12000, 250], Cb: [25000, 70000, 1000], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - Cb = max(Cb, Ca + 2000)
    - Ob = Oa - (Cb - Ca)*AP(i, n)
  text: |
    الآلة أ تكلف [[Ca|g]] دينار وتشغيلها [[Oa|g]] دينار سنويا. الآلة ب تكلف [[Cb|g]] دينار. عمر كل منهما [[yrs(n)]]. ما أعلى تكلفة تشغيل سنوية للآلة ب تجعلها مساوية للآلة أ بنسبة [[i|%]]؟
  solution: |
    نساوي القيمتين الحاليتين:

    $$
    [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Cb|g]] + O_b\,(P/A,\ [[i|%]],\ [[n|n]])
    $$

    $$
    O_b = [[Oa|g]] - [[Cb-Ca|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[Ob|2]]
    $$

    [[pick(Ob > 0, 'إذا كان تشغيل الآلة ب أقل من هذا المبلغ فهي الأفضل.', 'الناتج سالب، فالآلة ب لا تكون أفضل مهما كان تشغيلها رخيصا.')]]

- id: c03-d-08
  kind: problem
  part: D
  vars: {C: 70000, R1: 30000, G: 3000, n: 5, i: 0.10, Cb: 70000, Rb: 24000}
  random: {C: [40000, 100000, 1000], R1: [10000, 40000, 1000], G: [500, 6000, 250], n: [4, 8, 1], i: [0.06, 0.15, 0.01], Cb: [40000, 100000, 1000], Rb: [10000, 40000, 1000]}
  calc:
    - Na = -C + R1*PA(i, n) - G*PG(i, n)
    - Nb = -Cb + Rb*PA(i, n)
    - best = pick(max(Na, Nb) < 0, 'عدم التنفيذ', pick(Na >= Nb, 'الخيار أ', 'الخيار ب'))
  text: |
    الخيار أ يكلف [[C|g]] دينار، ويعطي [[R1|g]] دينار في السنة الأولى، ثم يقل [[G|g]] دينار كل سنة. الخيار ب يكلف [[Cb|g]] دينار، ويعطي [[Rb|g]] دينار ثابتة كل سنة. المدة [[yrs(n)]]. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    $$
    PW_a = -[[C|g]] + [[R1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[Na|2]]
    $$

    $$
    PW_b = -[[Cb|g]] + [[Rb|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Nb|2]]
    $$

    القرار: [[best]].

- id: c03-d-09
  kind: problem
  part: D
  vars: {C: 20000, k: 4500, n: 6}
  random: {C: [10000, 40000, 1000], k: [2500, 9000, 250], n: [4, 10, 1]}
  calc:
    - p5 = -C + k*PA(0.05, n)
    - p10 = -C + k*PA(0.10, n)
    - p15 = -C + k*PA(0.15, n)
  text: |
    استثمار في عزل مبنى يكلف [[C|g]] دينار ويوفر [[k|g]] دينار سنويا لمدة [[yrs(n)]]. هل يتغير القرار إذا كان الحد الأدنى للعائد 5% أو 10% أو 15%؟
  solution: |
    | النسبة | القيمة الحالية |
    | --- | --- |
    | 5% | [[p5|2]] |
    | 10% | [[p10|2]] |
    | 15% | [[p15|2]] |

    القرار يتغير عندما تتغير إشارة القيمة الحالية. لذلك يجب تحديد الحد الأدنى للعائد بعناية قبل المقارنة.

- id: c03-d-10
  kind: problem
  part: D
  vars: {i: 0.10}
  random: {i: [0.06, 0.15, 0.01]}
  calc:
    - N1 = -50000 + 14000*PA(i, 6)
    - N2 = -80000 + 21000*PA(i, 6)
    - N3 = -30000 + 8000*PA(i, 6)
    - N4 = -100000 + 25000*PA(i, 6)
    - best = max(N1, N2, N3, N4)
    - name = pick(best < 0, 'عدم التنفيذ', pick(best == N1, 'المشروع 1', pick(best == N2, 'المشروع 2', pick(best == N3, 'المشروع 3', 'المشروع 4'))))
  text: |
    أربعة مشاريع متنافية عمر كل منها 6 سنوات. أيها تختار بنسبة [[i|%]]؟

    | المشروع | التكلفة | الدخل السنوي |
    | --- | --- | --- |
    | 1 | 50,000 | 14,000 |
    | 2 | 80,000 | 21,000 |
    | 3 | 30,000 | 8,000 |
    | 4 | 100,000 | 25,000 |
  solution: |
    $$
    (P/A,\ [[i|%]],\ 6) = [[PA(i, 6)|f4]]
    $$

    | المشروع | القيمة الحالية |
    | --- | --- |
    | 1 | [[N1|2]] |
    | 2 | [[N2|2]] |
    | 3 | [[N3|2]] |
    | 4 | [[N4|2]] |

    الخيار الأفضل: [[name]].

- id: c03-d-11
  kind: problem
  part: D
  vars: {i: 0.10}
  random: {i: [0.06, 0.15, 0.01]}
  calc:
    - N1 = -50000 + 14000*PA(i, 6)
    - N3 = -30000 + 8000*PA(i, 6)
    - Nb = N1 + N3
  text: |
    في المسألة السابقة، إذا كانت المشاريع مستقلة وليست متنافية، والميزانية 80,000 دينار، فأي مجموعة تنفذ الشركة؟ قارن مجموعة المشروعين 1 و3 مع المشروع 2 وحده.
  solution: |
    المشاريع المستقلة يمكن تنفيذ أكثر من واحد منها. المجموعتان تكلفان 80,000 دينار. القيمة الحالية لمجموعة تساوي مجموع قيم مشاريعها:

    $$
    PW_{1+3} = [[N1|2]] + [[N3|2]] = [[Nb|2]]
    $$

    القيمة الحالية للمشروع 2 وحده [[-80000 + 21000*PA(i, 6)|2]] دينار. تختار الشركة المجموعة صاحبة القيمة الأكبر، بشرط أن تكون موجبة.

- id: c03-d-12
  kind: problem
  part: D
  vars: {Cn: 45000, Onw: 3000, Cu: 20000, Ou: 7000, Su: 4000, Sn: 15000, i: 0.10}
  random: {Cn: [30000, 60000, 1000], Onw: [1500, 5000, 250], Cu: [10000, 30000, 1000], Ou: [4000, 10000, 250], Su: [1000, 8000, 500], Sn: [8000, 25000, 1000], i: [0.06, 0.14, 0.01]}
  calc:
    - Pn = Cn + Onw*PA(i, 5) - Sn*PF(i, 5)
    - Pu = Cu + Ou*PA(i, 5) - Su*PF(i, 5)
    - best = pick(Pn <= Pu, 'الجديدة', 'المستعملة')
  text: |
    مقاول يختار بين حفارة جديدة بسعر [[Cn|g]] دينار، وصيانتها [[Onw|g]] دينار سنويا، وتباع بعد 5 سنوات بقيمة [[Sn|g]] دينار، وحفارة مستعملة بسعر [[Cu|g]] دينار، وصيانتها [[Ou|g]] دينار سنويا، وتباع بعد 5 سنوات بقيمة [[Su|g]] دينار. أيهما أفضل بنسبة [[i|%]]؟
  solution: |
    $$
    PW_{new} = [[Cn|g]] + [[Onw|g]]\,(P/A,\ [[i|%]],\ 5) - [[Sn|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pn|2]]
    $$

    $$
    PW_{used} = [[Cu|g]] + [[Ou|g]]\,(P/A,\ [[i|%]],\ 5) - [[Su|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pu|2]]
    $$

    الأفضل الحفارة [[best]].

- id: c03-d-13
  kind: problem
  part: D
  vars: {C: 100000, A: 0, i: 0.09, n: 10}
  random: {C: [40000, 200000, 5000], i: [0.05, 0.14, 0.01], n: [5, 15, 1]}
  calc:
    - A = C*AP(i, n)
    - Pcash = C
    - Pinst = A*PA(i, n)
  text: |
    شركة تشتري معدات بسعر [[C|g]] دينار. البائع يعرض الدفع نقدا، أو بأقساط سنوية [[A|2]] دينار لمدة [[yrs(n)]]. الحد الأدنى للعائد في الشركة [[i|%]]. أيهما أفضل؟
  solution: |
    $$
    PW_{inst} = [[A|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pinst|2]]
    $$

    القيمة الحالية للأقساط تساوي السعر النقدي، لأن البائع يحسب الأقساط بنفس نسبة الشركة. الخياران متكافئان. لو كان الحد الأدنى للعائد أعلى من نسبة البائع، لكانت الأقساط أفضل، لأن الشركة تستثمر المال المؤجل بعائد أعلى.
