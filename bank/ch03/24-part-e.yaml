items:

- id: c03-e-01
  kind: problem
  part: E
  vars: {Ca: 10000, Oa: 2500, Cb: 16000, Ob: 2000, i: 0.10}
  random: {Ca: [5000, 20000, 500], Oa: [1000, 5000, 250], Cb: [8000, 30000, 500], Ob: [750, 4500, 250], i: [0.06, 0.14, 0.01]}
  calc:
    - Pa = Ca*(1 + PF(i, 2) + PF(i, 4)) + Oa*PA(i, 6)
    - Pb = Cb*(1 + PF(i, 3)) + Ob*PA(i, 6)
    - best = pick(Pa <= Pb, 'أ', 'ب')
  text: |
    الآلة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا، وعمرها سنتان. الآلة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار سنويا، وعمرها 3 سنوات. لا قيمة بيع لأي منهما. قارن بالقيمة الحالية على المضاعف المشترك بنسبة [[i|%]].
  solution: |
    المضاعف المشترك 6 سنوات. الآلة أ تشترى في السنوات 0 و2 و4، والآلة ب في السنتين 0 و3:

    $$
    PW_a = [[Ca|g]]\left[1 + (P/F,\ [[i|%]],\ 2) + (P/F,\ [[i|%]],\ 4)\right] + [[Oa|g]]\,(P/A,\ [[i|%]],\ 6) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]]\left[1 + (P/F,\ [[i|%]],\ 3)\right] + [[Ob|g]]\,(P/A,\ [[i|%]],\ 6) = [[Pb|2]]
    $$

    الأقل تكلفة الآلة [[best]].

- id: c03-e-02
  kind: problem
  part: E
  vars: {Ca: 10000, Oa: 2500, Cb: 16000, Ob: 2000, i: 0.10}
  random: {Ca: [5000, 20000, 500], Oa: [1000, 5000, 250], Cb: [8000, 30000, 500], Ob: [750, 4500, 250], i: [0.06, 0.14, 0.01]}
  calc:
    - Aa = Ca*AP(i, 2) + Oa
    - Ab = Cb*AP(i, 3) + Ob
    - Pa = Aa*PA(i, 6)
    - Pb = Ab*PA(i, 6)
  text: |
    حل المسألة السابقة بالقيمة السنوية، وتأكد أن القيمة السنوية مضروبة في المعامل P/A لست سنوات تعطي القيمة الحالية على المضاعف المشترك.
  solution: |
    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 2) + [[Oa|g]] = [[Aa|2]]
    $$

    $$
    AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 3) + [[Ob|g]] = [[Ab|2]]
    $$

    التحويل إلى القيمة الحالية على 6 سنوات:

    $$
    [[Aa|2]]\,(P/A,\ [[i|%]],\ 6) = [[Pa|2]], \qquad [[Ab|2]]\,(P/A,\ [[i|%]],\ 6) = [[Pb|2]]
    $$

    نفس نتائج المسألة السابقة، بحساب أقصر.

- id: c03-e-03
  kind: problem
  part: E
  vars: {Ca: 24000, Oa: 5000, Sa: 3000, Cb: 38000, Ob: 3500, Sb: 6000, i: 0.12}
  random: {Ca: [12000, 35000, 1000], Oa: [2500, 8000, 250], Sa: [0, 5000, 500], Cb: [25000, 55000, 1000], Ob: [1500, 6000, 250], Sb: [0, 9000, 500], i: [0.06, 0.15, 0.01]}
  calc:
    - L = lcm(4, 6)
    - Pa = Ca + (Ca - Sa)*(PF(i, 4) + PF(i, 8) + PF(i, 12) + PF(i, 16) + PF(i, 20)) + Oa*PA(i, 24) - Sa*PF(i, 24)
    - Pb = Cb + (Cb - Sb)*(PF(i, 6) + PF(i, 12) + PF(i, 18)) + Ob*PA(i, 24) - Sb*PF(i, 24)
    - Aa = Ca*AP(i, 4) - Sa*AF(i, 4) + Oa
    - Ab = Cb*AP(i, 6) - Sb*AF(i, 6) + Ob
  text: |
    البديل أ يكلف [[Ca|g]] دينار، وتشغيله [[Oa|g]] دينار سنويا، وعمره 4 سنوات، وقيمة بيعه [[Sa|g]] دينار. البديل ب يكلف [[Cb|g]] دينار، وتشغيله [[Ob|g]] دينار سنويا، وعمره 6 سنوات، وقيمة بيعه [[Sb|g]] دينار. ما المضاعف المشترك؟ قارن بالقيمة الحالية عليه، ثم بالقيمة السنوية، بنسبة [[i|%]].
  solution: |
    المضاعف المشترك [[L|n]] سنة. البديل أ يتكرر 6 مرات، والبديل ب 4 مرات:

    $$
    PW_a = [[Pa|2]], \qquad PW_b = [[Pb|2]]
    $$

    بالقيمة السنوية لعمر واحد:

    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 4) - [[Sa|g]]\,(A/F,\ [[i|%]],\ 4) + [[Oa|g]] = [[Aa|2]]
    $$

    $$
    AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 6) - [[Sb|g]]\,(A/F,\ [[i|%]],\ 6) + [[Ob|g]] = [[Ab|2]]
    $$

    الطريقتان تختاران البديل [[pick(Aa <= Ab, 'أ', 'ب')]].

- id: c03-e-04
  kind: problem
  part: E
  vars: {Ca: 18000, Oa: 3000, Ma: 7000, Cb: 12000, Ob: 4200, Sb: 1000, T: 4, i: 0.10}
  random: {Ca: [10000, 30000, 1000], Oa: [1500, 5000, 250], Ma: [3000, 12000, 500], Cb: [6000, 20000, 1000], Ob: [2500, 7000, 250], Sb: [0, 3000, 500], T: [3, 5, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Pa = Ca + Oa*PA(i, T) - Ma*PF(i, T)
    - Pb = Cb + Ob*PA(i, T) - Sb*PF(i, T)
    - best = pick(Pa <= Pb, 'أ', 'ب')
  text: |
    مشروع إنشائي مدته [[yrs(T)]]. الرافعة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا، وعمرها 8 سنوات، وقيمتها السوقية بعد [[yrs(T)]] [[Ma|g]] دينار. الرافعة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار سنويا، وعمرها [[yrs(T)]]، وقيمة بيعها [[Sb|g]] دينار. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    فترة الدراسة مدة المشروع، [[yrs(T)]]:

    $$
    PW_a = [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ [[T|n]]) - [[Ma|g]]\,(P/F,\ [[i|%]],\ [[T|n]]) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Ob|g]]\,(P/A,\ [[i|%]],\ [[T|n]]) - [[Sb|g]]\,(P/F,\ [[i|%]],\ [[T|n]]) = [[Pb|2]]
    $$

    الأقل تكلفة الرافعة [[best]].

- id: c03-e-05
  kind: problem
  part: E
  vars: {Ca: 18000, Oa: 3000, Cb: 12000, Ob: 4200, Sb: 1000, T: 4, i: 0.10}
  random: {Ca: [10000, 30000, 1000], Oa: [1500, 5000, 250], Cb: [6000, 20000, 1000], Ob: [2500, 7000, 250], Sb: [0, 3000, 500], T: [3, 5, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - Pb = Cb + Ob*PA(i, T) - Sb*PF(i, T)
    - M = (Ca + Oa*PA(i, T) - Pb)*FP(i, T)
  text: |
    في المسألة السابقة، ما أقل قيمة سوقية للرافعة أ بعد [[yrs(T)]] تجعلها مساوية للرافعة ب؟
  solution: |
    نساوي القيمتين الحاليتين ونحل للقيمة السوقية:

    $$
    [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[i|%]],\ [[T|n]]) - M\,(P/F,\ [[i|%]],\ [[T|n]]) = [[Pb|2]]
    $$

    $$
    M = [[M|2]]
    $$

    إذا كانت القيمة السوقية المتوقعة أعلى من هذا الرقم، فالرافعة أ أفضل.

- id: c03-e-06
  kind: problem
  part: E
  vars: {Ca: 5000, Oa: 1200, Cb: 9000, Ob: 800, i: 0.08}
  random: {Ca: [2000, 10000, 500], Oa: [500, 2500, 100], Cb: [5000, 18000, 500], Ob: [300, 2000, 100], i: [0.05, 0.12, 0.01]}
  calc:
    - Aa = Ca*AP(i, 3) + Oa
    - Ab = Cb*AP(i, 5) + Ob
    - L = lcm(3, 5)
    - best = pick(Aa <= Ab, 'أ', 'ب')
  text: |
    حاسوب من النوع أ يكلف [[Ca|g]] دينار وصيانته [[Oa|g]] دينار سنويا ويستبدل كل 3 سنوات. النوع ب يكلف [[Cb|g]] دينار وصيانته [[Ob|g]] دينار سنويا ويستبدل كل 5 سنوات. أيهما أرخص بنسبة [[i|%]]؟ لماذا الأفضل هنا القيمة السنوية؟
  solution: |
    المضاعف المشترك [[L|n]] سنة، والحساب عليه طويل. القيمة السنوية أسرع:

    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 3) + [[Oa|g]] = [[Aa|2]]
    $$

    $$
    AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 5) + [[Ob|g]] = [[Ab|2]]
    $$

    الأرخص النوع [[best]].

- id: c03-e-07
  kind: problem
  part: E
  vars: {Ca: 40000, Oa: 6000, Sa: 5000, Cb: 65000, Ob: 4000, Sb: 10000, Mb: 30000, i: 0.10}
  random: {Ca: [20000, 60000, 1000], Oa: [3000, 10000, 250], Sa: [0, 8000, 500], Cb: [40000, 90000, 1000], Ob: [2000, 7000, 250], Sb: [0, 15000, 500], Mb: [20000, 45000, 1000], i: [0.06, 0.14, 0.01]}
  calc:
    - Pa = Ca + Oa*PA(i, 5) - Sa*PF(i, 5)
    - Pb = Cb + Ob*PA(i, 5) - Mb*PF(i, 5)
    - Aa = Ca*AP(i, 5) - Sa*AF(i, 5) + Oa
    - Ab = Cb*AP(i, 10) - Sb*AF(i, 10) + Ob
  text: |
    البديل أ عمره 5 سنوات: يكلف [[Ca|g]] دينار، وتشغيله [[Oa|g]] دينار سنويا، وقيمة بيعه [[Sa|g]] دينار. البديل ب عمره 10 سنوات: يكلف [[Cb|g]] دينار، وتشغيله [[Ob|g]] دينار سنويا، وقيمة بيعه في النهاية [[Sb|g]] دينار، وقيمته السوقية بعد 5 سنوات [[Mb|g]] دينار. قارن بفترة دراسة 5 سنوات، ثم بالقيمة السنوية لكل عمر. هل يتفق القراران؟ بنسبة [[i|%]].
  solution: |
    فترة الدراسة 5 سنوات:

    $$
    PW_a = [[Pa|2]], \qquad PW_b = [[Cb|g]] + [[Ob|g]]\,(P/A,\ [[i|%]],\ 5) - [[Mb|g]]\,(P/F,\ [[i|%]],\ 5) = [[Pb|2]]
    $$

    القيمة السنوية لكل عمر:

    $$
    AW_a = [[Aa|2]], \qquad AW_b = [[Ab|2]]
    $$

    فترة الدراسة تختار [[pick(Pa <= Pb, 'أ', 'ب')]]، والقيمة السنوية تختار [[pick(Aa <= Ab, 'أ', 'ب')]]. القراران [[pick((Pa <= Pb) == (Aa <= Ab), 'متفقان', 'مختلفان')]]. الطريقتان مبنيتان على افتراضين مختلفين: الأولى تفترض أن الحاجة تنتهي بعد 5 سنوات، والثانية تفترض أن الحاجة مستمرة.

- id: c03-e-08
  kind: problem
  part: E
  vars: {C: 3000, O: 400, C2: 4500, O2: 300, i: 0.10}
  random: {C: [1000, 6000, 250], O: [100, 1000, 50], C2: [2000, 9000, 250], O2: [50, 800, 50], i: [0.05, 0.14, 0.01]}
  calc:
    - Aa = C*AP(i, 2) + O
    - Ab = C2*AP(i, 3) + O2
    - best = pick(Aa <= Ab, 'الأول', 'الثاني')
  text: |
    عيادة تختار جهاز تعقيم. الأول يكلف [[C|g]] دينار، وصيانته [[O|g]] دينار سنويا، ويستبدل كل سنتين. الثاني يكلف [[C2|g]] دينار، وصيانته [[O2|g]] دينار سنويا، ويستبدل كل 3 سنوات. أيهما أرخص بنسبة [[i|%]]؟
  solution: |
    $$
    AW_1 = [[C|g]]\,(A/P,\ [[i|%]],\ 2) + [[O|g]] = [[Aa|2]]
    $$

    $$
    AW_2 = [[C2|g]]\,(A/P,\ [[i|%]],\ 3) + [[O2|g]] = [[Ab|2]]
    $$

    الأرخص الجهاز [[best]].

- id: c03-e-09
  kind: problem
  part: E
  vars: {C1: 50000, R1: 16000, C2: 80000, R2: 18000, i: 0.12}
  random: {C1: [30000, 70000, 1000], R1: [9000, 25000, 500], C2: [50000, 120000, 1000], R2: [10000, 30000, 500], i: [0.06, 0.15, 0.01]}
  calc:
    - A1 = R1 - C1*AP(i, 5)
    - A2 = R2 - C2*AP(i, 10)
    - best = pick(max(A1, A2) < 0, 'عدم التنفيذ', pick(A1 >= A2, 'المشروع الأول', 'المشروع الثاني'))
  text: |
    مشروع أول يكلف [[C1|g]] دينار ويعطي [[R1|g]] دينار سنويا لمدة 5 سنوات. مشروع ثان يكلف [[C2|g]] دينار ويعطي [[R2|g]] دينار سنويا لمدة 10 سنوات. بافتراض إمكان تكرار المشروع الأول، ماذا تختار بنسبة [[i|%]]؟
  solution: |
    $$
    AW_1 = [[R1|g]] - [[C1|g]]\,(A/P,\ [[i|%]],\ 5) = [[A1|2]]
    $$

    $$
    AW_2 = [[R2|g]] - [[C2|g]]\,(A/P,\ [[i|%]],\ 10) = [[A2|2]]
    $$

    القرار: [[best]].

- id: c03-e-10
  kind: problem
  part: E
  vars: {C1: 50000, R1: 16000, C2: 80000, R2: 18000, i: 0.12}
  random: {C1: [30000, 70000, 1000], R1: [9000, 25000, 500], C2: [50000, 120000, 1000], R2: [10000, 30000, 500], i: [0.06, 0.15, 0.01]}
  calc:
    - P1 = -C1 + R1*PA(i, 5)
    - P2 = -C2 + R2*PA(i, 10)
    - P1x = P1*(1 + PF(i, 5))
  text: |
    طالب قارن المشروعين في المسألة السابقة بالقيمة الحالية لعمر كل منهما مباشرة. ما الخطأ في ذلك؟ صحح الحل.
  solution: |
    المقارنة المباشرة:

    $$
    PW_1 = [[P1|2]], \qquad PW_2 = [[P2|2]]
    $$

    الخطأ أن المشروع الأول يغطي 5 سنوات فقط. على 10 سنوات يتكرر مرة ثانية في السنة 5:

    $$
    PW_1 = [[P1|2]]\left[1 + (P/F,\ [[i|%]],\ 5)\right] = [[P1x|2]]
    $$

    الآن تصح المقارنة مع [[P2|2]] دينار للمشروع الثاني.

- id: c03-e-11
  kind: problem
  part: E
  vars: {C: 3500, O: 150, Cp: 900, Op: 120, i: 0.08}
  random: {C: [2000, 6000, 250], O: [50, 400, 25], Cp: [400, 1500, 50], Op: [50, 300, 25], i: [0.04, 0.12, 0.01]}
  calc:
    - Ae = C*AP(i, 12) + O
    - Ap = Cp*AP(i, 3) + Op
    - best = pick(Ae <= Ap, 'المعدني', 'البلاستيكي')
  text: |
    خزان مياه معدني يكلف [[C|g]] دينار، وصيانته [[O|g]] دينار سنويا، وعمره 12 سنة. خزان بلاستيكي يكلف [[Cp|g]] دينار، وصيانته [[Op|g]] دينار سنويا، وعمره 3 سنوات. أيهما أرخص بنسبة [[i|%]]؟
  solution: |
    $$
    AW_{metal} = [[C|g]]\,(A/P,\ [[i|%]],\ 12) + [[O|g]] = [[Ae|2]]
    $$

    $$
    AW_{plastic} = [[Cp|g]]\,(A/P,\ [[i|%]],\ 3) + [[Op|g]] = [[Ap|2]]
    $$

    الأرخص الخزان [[best]].

- id: c03-e-12
  kind: problem
  part: E
  vars: {Ca: 20000, Oa: 2000, Cb: 30000, Ob: 1500, i: 0.10}
  random: {Ca: [10000, 30000, 1000], Oa: [1000, 4000, 250], Cb: [20000, 45000, 1000], Ob: [500, 3000, 250], i: [0.06, 0.14, 0.01]}
  calc:
    - Aa = Ca*AP(i, 4) + Oa
    - Ab = Cb*AP(i, 6) + Ob
    - Ca2 = Ca*1.25
    - Aa2 = (Ca*(1 + 1.25*PF(i, 4) + 1.25**2*PF(i, 8)))*AP(i, 12) + Oa
  text: |
    البديل أ يكلف [[Ca|g]] دينار، وتشغيله [[Oa|g]] دينار سنويا، وعمره 4 سنوات. البديل ب يكلف [[Cb|g]] دينار، وتشغيله [[Ob|g]] دينار سنويا، وعمره 6 سنوات. قارن بالقيمة السنوية بنسبة [[i|%]]. ثم افترض أن سعر البديل أ يرتفع 25% عند كل استبدال، وأعد المقارنة على 12 سنة.
  solution: |
    بافتراض تكرار الأسعار:

    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 4) + [[Oa|g]] = [[Aa|2]], \qquad AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 6) + [[Ob|g]] = [[Ab|2]]
    $$

    إذا ارتفع السعر 25% عند كل استبدال، فشراء السنة 4 يكلف [[Ca2|g]] دينار، وشراء السنة 8 يكلف [[Ca*1.5625|g]] دينار. لم يعد التكرار متطابقا، فنحسب على 12 سنة:

    $$
    AW_a = [[Ca|g]]\left[1 + 1.25\,(P/F,\ [[i|%]],\ 4) + 1.5625\,(P/F,\ [[i|%]],\ 8)\right](A/P,\ [[i|%]],\ 12) + [[Oa|g]] = [[Aa2|2]]
    $$

    القيمة السنوية لعمر واحد لا تصح عندما تتغير التكاليف بين الدورات. في هذه الحالة البديل الأفضل [[pick(Aa2 <= Ab, 'أ', 'ب')]].
