items:

- id: c03-h-01
  kind: problem
  part: H
  vars: {C: 24000, R: 6000, i: 0.10}
  random: {C: [5000, 60000, 1000], R: [1500, 15000, 250], i: [0.05, 0.12, 0.01]}
  calc:
    - R = max(R, C/8)
    - ns = C/R
    - nd = -ln(1 - C*i/R)/ln(1+i)
  text: |
    استثمار يكلف [[C|g]] دينار ويوفر [[R|g]] دينار سنويا. احسب فترة الاسترداد البسيطة والمخصومة بنسبة [[i|%]].
  solution: |
    $$
    n_s = \frac{[[C|g]]}{[[R|g]]} = [[ns|2]]
    $$

    $$
    n_d = \frac{-\ln\left(1 - \frac{[[C|g]] \times [[i|r]]}{[[R|g]]}\right)}{\ln([[1+i|r]])} = [[nd|2]]
    $$

- id: c03-h-02
  kind: problem
  part: H
  calc:
    - ka = -30000 + 10000*3
    - kb = -30000 + 6000 + 8000 + 10000 + 12000
    - Pa = -30000 + 10000*PA(0.10, 3)
    - Pb = -30000 + 6000*PF(0.10, 1) + 8000*PF(0.10, 2) + 10000*PF(0.10, 3) + 12000*PF(0.10, 4) + 14000*PF(0.10, 5)
  text: |
    المشروع أ يكلف 30,000 دينار ويعطي 10,000 دينار سنويا لمدة 3 سنوات فقط. المشروع ب يكلف 30,000 دينار ويعطي 6,000 و8,000 و10,000 و12,000 و14,000 دينار في السنوات من 1 إلى 5. أي المشروعين أسرع استردادا؟ وأيهما أفضل بالقيمة الحالية بنسبة 10%؟
  solution: |
    المشروع أ يسترد تكلفته في 3 سنوات بالضبط. المشروع ب يجمع 24,000 دينار في 3 سنوات، ويكمل في السنة الرابعة، فاسترداده 3.5 سنة. فترة الاسترداد تفضل المشروع أ.

    $$
    PW_a = -30{,}000 + 10{,}000\,(P/A,\ 10\%,\ 3) = [[Pa|2]]
    $$

    $$
    PW_b = [[Pb|2]]
    $$

    القيمة الحالية تفضل المشروع ب بوضوح. فترة الاسترداد تجاهلت السنتين الأخيرتين من المشروع ب، وتجاهلت أن المشروع أ لا يعطي إلا عائدا صغيرا.

- id: c03-h-03
  kind: problem
  part: H
  vars: {C: 35000, S: 0, n: 6, i: 0.12}
  random: {C: [10000, 80000, 1000], S: [0, 10000, 500], n: [3, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - R = C*AP(i, n) - S*AF(i, n)
  text: |
    برنامج إدارة مخازن يكلف [[C|g]] دينار، وعمره [[yrs(n)]]، وقيمته في النهاية [[S|g]] دينار. ما أقل توفير سنوي يبرر شراءه بنسبة [[i|%]]؟
  solution: |
    $$
    R = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[R|2]]
    $$

- id: c03-h-04
  kind: problem
  part: H
  vars: {C: 40000, R: 9000, i: 0.10}
  random: {C: [15000, 80000, 1000], R: [3000, 20000, 500], i: [0.05, 0.14, 0.01]}
  calc:
    - R = max(R, C*i*1.3)
    - n = -ln(1 - C*i/R)/ln(1+i)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا. ما أقل عمر يجعل المشروع مقبولا بنسبة [[i|%]]؟
  solution: |
    أقل عمر هو فترة الاسترداد المخصومة: عدد السنوات الذي يجعل القيمة الحالية صفرا.

    $$
    [[R|g]]\,(P/A,\ [[i|%]],\ n) = [[C|g]]
    $$

    ```excel
    =NPER([[i|%]], [[R|r]], -[[C|r]])
    ```

    $$
    n = [[n|2]]
    $$

    إذا كان عمر المشروع أقل من [[ceil(n)|n]] سنة فهو مرفوض.

- id: c03-h-05
  kind: problem
  part: H
  vars: {Fa: 2000, va: 12, Fb: 6000, vb: 8, i: 0.10, n: 5}
  random: {Fa: [500, 5000, 250], va: [8, 20, 1], Fb: [3000, 12000, 250], vb: [4, 12, 1], i: [0.06, 0.14, 0.01], n: [3, 8, 1]}
  calc:
    - vb = min(vb, va - 1)
    - Fb = max(Fb, Fa + 1000)
    - Aa = Fa*AP(i, n)
    - Ab = Fb*AP(i, n)
    - x = (Ab - Aa)/(va - vb)
  text: |
    طريقتان لإنتاج قطعة. الطريقة أ تحتاج قالبا بتكلفة [[Fa|g]] دينار، وتكلفة القطعة [[va|n]] دينار. الطريقة ب تحتاج قالبا بتكلفة [[Fb|g]] دينار، وتكلفة القطعة [[vb|n]] دينار. عمر القالب [[yrs(n)]]. ما عدد القطع السنوي الذي تتساوى عنده الطريقتان بنسبة [[i|%]]؟
  solution: |
    التكلفة السنوية لكل طريقة تساوي تكلفة استرداد القالب، زائد تكلفة القطعة مضروبة في عدد القطع x:

    $$
    [[Fa|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[va|n]]\,x = [[Fb|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[vb|n]]\,x
    $$

    $$
    [[Aa|2]] + [[va|n]]\,x = [[Ab|2]] + [[vb|n]]\,x \quad\Rightarrow\quad x = [[x|2]]
    $$

    إذا زاد الإنتاج عن [[ceil(x)|g]] قطعة سنويا فالطريقة ب أرخص، لأن تكلفة قطعتها أقل.

- id: c03-h-06
  kind: problem
  part: H
  vars: {Cs: 8000, Os: 0.06, Cd: 0, Od: 0.12, km: 15000, i: 0.10}
  random: {Cs: [4000, 15000, 500], Os: [0.03, 0.08, 0.005], Od: [0.10, 0.20, 0.005], km: [5000, 40000, 1000], i: [0.06, 0.14, 0.01]}
  calc:
    - A = Cs*AP(i, 8)
    - x = A/(Od - Os)
  text: |
    سائق تاكسي يفكر في تحويل سيارته إلى الغاز بتكلفة [[Cs|g]] دينار، وعمر التحويل 8 سنوات. تكلفة الوقود تنخفض من [[Od|d2]] إلى [[Os|d2]] دينار لكل كيلومتر. يقطع السائق [[km|g]] كيلومتر سنويا. ما أقل مسافة سنوية تبرر التحويل بنسبة [[i|%]]؟ وهل يحول؟
  solution: |
    التحويل يستحق عندما يساوي التوفير السنوي تكلفة استرداد رأس المال:

    $$
    [[Cs|g]]\,(A/P,\ [[i|%]],\ 8) = [[A|2]]
    $$

    التوفير لكل كيلومتر [[Od-Os|d2]] دينار، فالمسافة:

    $$
    x = \frac{[[A|2]]}{[[Od-Os|d2]]} = [[x|0]]
    $$

    السائق يقطع [[km|g]] كيلومتر، فالتحويل [[pick(km >= x, 'يستحق', 'لا يستحق')]].

- id: c03-h-07
  kind: problem
  part: H
  vars: {C: 20000, A1: 3000, G: 1000, i: 0.10}
  random: {C: [10000, 40000, 1000], A1: [1000, 6000, 250], G: [500, 2500, 250], i: [0.06, 0.12, 0.01]}
  calc:
    - k1 = -C + A1*PF(i, 1)
    - k2 = k1 + (A1 + G)*PF(i, 2)
    - k3 = k2 + (A1 + 2*G)*PF(i, 3)
    - k4 = k3 + (A1 + 3*G)*PF(i, 4)
    - k5 = k4 + (A1 + 4*G)*PF(i, 5)
    - k6 = k5 + (A1 + 5*G)*PF(i, 6)
  text: |
    مشروع يكلف [[C|g]] دينار، ودخله [[A1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار كل سنة. ابن جدول القيمة الحالية التراكمية لست سنوات بنسبة [[i|%]]. في أي سنة يسترد المشروع تكلفته؟
  solution: |
    | السنة | الدخل | التراكمي المخصوم |
    | --- | --- | --- |
    | 1 | [[A1|g]] | [[k1|2]] |
    | 2 | [[A1+G|g]] | [[k2|2]] |
    | 3 | [[A1+2*G|g]] | [[k3|2]] |
    | 4 | [[A1+3*G|g]] | [[k4|2]] |
    | 5 | [[A1+4*G|g]] | [[k5|2]] |
    | 6 | [[A1+5*G|g]] | [[k6|2]] |

    [[pick(k6 < 0, 'المشروع لا يسترد تكلفته خلال 6 سنوات.', pick(k1 >= 0, 'يسترد تكلفته في السنة الأولى.', pick(k2 >= 0, 'يسترد تكلفته خلال السنة الثانية.', pick(k3 >= 0, 'يسترد تكلفته خلال السنة الثالثة.', pick(k4 >= 0, 'يسترد تكلفته خلال السنة الرابعة.', pick(k5 >= 0, 'يسترد تكلفته خلال السنة الخامسة.', 'يسترد تكلفته خلال السنة السادسة.'))))))]]
