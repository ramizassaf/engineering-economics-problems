items:

- id: c03-f-01
  kind: problem
  part: F
  vars: {P: 40000, S: 6000, n: 6, i: 0.10}
  random: {P: [10000, 90000, 1000], S: [0, 15000, 500], n: [3, 12, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - CR = P*AP(i, n) - S*AF(i, n)
  text: |
    احسب تكلفة استرداد رأس المال لأصل يكلف [[P|g]] دينار ويباع بعد [[yrs(n)]] بقيمة [[S|g]] دينار، بنسبة [[i|%]].
  solution: |
    $$
    CR = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

- id: c03-f-02
  kind: problem
  part: F
  vars: {P: 40000, S: 6000, n: 6, i: 0.10}
  random: {P: [10000, 90000, 1000], S: [0, 15000, 500], n: [3, 12, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - CR = (P - S)*AP(i, n) + S*i
  text: |
    حل المسألة السابقة بالصيغة الثانية لتكلفة استرداد رأس المال، واشرح معنى كل حد.
  solution: |
    $$
    CR = [[P-S|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[S|g]] \times [[i|r]] = [[CR|2]]
    $$

    الحد الأول يسترد الجزء الذي يضيع من قيمة الأصل. الحد الثاني فائدة سنوية على قيمة البيع، لأن هذا المبلغ محبوس في الأصل حتى يباع.

- id: c03-f-03
  kind: problem
  part: F
  vars: {C: 70000, R: 20000, O: 4000, S: 10000, n: 8, i: 0.12}
  random: {C: [30000, 120000, 1000], R: [8000, 40000, 500], O: [1000, 8000, 250], S: [0, 20000, 500], n: [4, 12, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - CR = C*AP(i, n) - S*AF(i, n)
    - AW = R - O - CR
  text: |
    مشروع يكلف [[C|g]] دينار، وإيراده [[R|g]] دينار سنويا، وتشغيله [[O|g]] دينار سنويا، وعمره [[yrs(n)]]، وقيمة بيعه [[S|g]] دينار. احسب القيمة السنوية بنسبة [[i|%]].
  solution: |
    $$
    CR = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

    $$
    AW = [[R|g]] - [[O|g]] - [[CR|2]] = [[AW|2]]
    $$

    المشروع [[pick(AW >= 0, 'مقبول', 'مرفوض')]].

- id: c03-f-04
  kind: problem
  part: F
  vars: {C: 55000, O1: 3000, G: 400, n: 7, i: 0.09}
  random: {C: [20000, 90000, 1000], O1: [1000, 6000, 250], G: [100, 1000, 50], n: [4, 12, 1], i: [0.05, 0.14, 0.01]}
  calc:
    - AW = C*AP(i, n) + O1 + G*AG(i, n)
  text: |
    آلة تكلف [[C|g]] دينار بدون قيمة بيع. تكلفة صيانتها [[O1|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة، لمدة [[yrs(n)]]. ما التكلفة السنوية المكافئة بنسبة [[i|%]]؟
  solution: |
    $$
    AW = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[O1|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ [[n|n]]) = [[AW|2]]
    $$

- id: c03-f-05
  kind: problem
  part: F
  vars: {C: 25000, S: 4000, n: 5, i: 0.10}
  random: {C: [10000, 50000, 1000], S: [0, 8000, 500], n: [3, 10, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - CR = C*AP(i, n) - S*AF(i, n)
    - m = CR/12
  text: |
    سيارة توصيل تكلف [[C|g]] دينار وتباع بعد [[yrs(n)]] بقيمة [[S|g]] دينار. صاحب المطعم يريد أن يعرف كم يجب أن يكسب منها شهريا ليسترد ثمنها مع عائد [[i|%]]. احسب الرقم السنوي، ثم قسمه على 12 تقريبيا.
  solution: |
    $$
    CR = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

    حوالي [[m|2]] دينار شهريا. هذا تقريب، لأن الدخل الشهري يأتي قبل نهاية السنة. للحساب الدقيق استخدم نسبة شهرية كما في قسم الفائدة الشهرية.

- id: c03-f-06
  kind: problem
  part: F
  vars: {C: 150000, R: 40000, n: 10, i: 0.12}
  random: {C: [60000, 250000, 5000], R: [15000, 60000, 1000], n: [5, 15, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - S = (C*AP(i, n) - R)/AF(i, n)
  text: |
    معدات تكلف [[C|g]] دينار وتعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ما أقل قيمة بيع تجعل القيمة السنوية صفرا بنسبة [[i|%]]؟
  solution: |
    $$
    [[R|g]] - [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + S\,(A/F,\ [[i|%]],\ [[n|n]]) = 0
    $$

    $$
    S = [[S|2]]
    $$

    [[pick(S <= 0, 'الناتج سالب، فالمشروع مقبول حتى بدون قيمة بيع.', 'قيمة بيع أعلى من هذا الرقم تجعل المشروع مقبولا.')]]

- id: c03-f-07
  kind: problem
  part: F
  vars: {c0: 20000, c1: 5000, c2: 8000, c3: 9000, c4: 6000, i: 0.10}
  random: {c0: [10000, 40000, 1000], c1: [2000, 12000, 500], c2: [2000, 14000, 500], c3: [2000, 15000, 500], c4: [2000, 12000, 500], i: [0.05, 0.15, 0.01]}
  calc:
    - PW = -c0 + c1*PF(i, 1) + c2*PF(i, 2) + c3*PF(i, 3) + c4*PF(i, 4)
    - AW = PW*AP(i, 4)
  text: |
    مشروع يكلف [[c0|g]] دينار، ويعطي في السنوات من 1 إلى 4 المبالغ [[c1|g]] و[[c2|g]] و[[c3|g]] و[[c4|g]] دينار. ما قيمته السنوية بنسبة [[i|%]]؟
  solution: |
    $$
    PW = [[PW|2]]
    $$

    $$
    AW = [[PW|2]]\,(A/P,\ [[i|%]],\ 4) = [[AW|2]]
    $$

- id: c03-f-08
  kind: problem
  part: F
  vars: {C: 80000, O: 12000, H: 15000, S: 10000, i: 0.10}
  random: {C: [40000, 120000, 1000], O: [5000, 20000, 500], H: [5000, 25000, 1000], S: [0, 20000, 1000], i: [0.06, 0.14, 0.01]}
  calc:
    - AW = C*AP(i, 8) + O + H*PF(i, 4)*AP(i, 8) - S*AF(i, 8)
  text: |
    حافلة تكلف [[C|g]] دينار، وتشغيلها [[O|g]] دينار سنويا لمدة 8 سنوات. تحتاج تجديد محرك في السنة 4 بتكلفة [[H|g]] دينار، وتباع بقيمة [[S|g]] دينار. ما التكلفة السنوية المكافئة بنسبة [[i|%]]؟
  solution: |
    تكلفة التجديد مبلغ واحد في السنة 4. ننقله إلى السنة 0، ثم نوزعه على 8 سنوات:

    $$
    AW = [[C|g]]\,(A/P,\ [[i|%]],\ 8) + [[O|g]] + [[H|g]]\,(P/F,\ [[i|%]],\ 4)\,(A/P,\ [[i|%]],\ 8) - [[S|g]]\,(A/F,\ [[i|%]],\ 8)
    $$

    $$
    AW = [[AW|2]]
    $$

- id: c03-f-09
  kind: problem
  part: F
  vars: {C: 30000, O: 5000, n: 6, ia: 0.10}
  random: {C: [10000, 60000, 1000], O: [2000, 10000, 250], n: [3, 10, 1], ia: [0.05, 0.14, 0.005]}
  calc:
    - im = (1+ia)**(1/12) - 1
    - Ay = C*AP(ia, n) + O
    - Am = Ay*AF(im, 12)
  text: |
    معدات تكلف [[C|g]] دينار، وصيانتها [[O|g]] دينار سنويا، وعمرها [[yrs(n)]]. الحد الأدنى للعائد [[ia|%]] نسبة فعلية سنوية. ما التكلفة السنوية المكافئة؟ وما المبلغ الشهري الذي يكافئها، لو وزعت على أشهر السنة؟
  solution: |
    $$
    AW = [[C|g]]\,(A/P,\ [[ia|%]],\ [[n|n]]) + [[O|g]] = [[Ay|2]]
    $$

    المبلغ السنوي في نهاية السنة، والمبالغ الشهرية في نهاية كل شهر، فالمبلغ السنوي قيمة مستقبلية لاثني عشر مبلغا شهريا:

    $$
    i_m = [[im|%2]], \qquad A_m = [[Ay|2]]\,(A/F,\ [[im|%2]],\ 12) = [[Am|2]]
    $$

- id: c03-f-10
  kind: problem
  part: F
  vars: {C: 12000, n: 5}
  random: {C: [5000, 30000, 500], n: [3, 10, 1]}
  calc:
    - a5 = C*AP(0.05, n)
    - a10 = C*AP(0.10, n)
    - a15 = C*AP(0.15, n)
    - d = C/n
  text: |
    أصل يكلف [[C|g]] دينار، وعمره [[yrs(n)]] بدون قيمة بيع. احسب تكلفة استرداد رأس المال عند 5% و10% و15%. قارنها بالمبلغ الذي تحصل عليه بقسمة السعر على العمر.
  solution: |
    | النسبة | تكلفة استرداد رأس المال |
    | --- | --- |
    | 5% | [[a5|2]] |
    | 10% | [[a10|2]] |
    | 15% | [[a15|2]] |

    قسمة السعر على العمر تعطي [[d|2]] دينار، وهي تكلفة استرداد بنسبة صفر. الفرق بينها وبين كل رقم في الجدول هو العائد على المال المستثمر في الأصل.

- id: c03-f-11
  kind: problem
  part: F
  vars: {C: 45000, R: 0, k: 0, S: 5000, n: 8}
  random: {C: [20000, 90000, 1000], k: [0.14, 0.30, 0.01], S: [0, 10000, 500], n: [5, 12, 1]}
  calc:
    - R = pick(k > 0, floor(C*k/100)*100, 9000)
    - a6 = R - (C*AP(0.06, n) - S*AF(0.06, n))
    - a10 = R - (C*AP(0.10, n) - S*AF(0.10, n))
    - a14 = R - (C*AP(0.14, n) - S*AF(0.14, n))
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]، وقيمة بيعه [[S|g]] دينار. احسب القيمة السنوية عند 6% و10% و14%.
  solution: |
    | النسبة | القيمة السنوية |
    | --- | --- |
    | 6% | [[a6|2]] |
    | 10% | [[a10|2]] |
    | 14% | [[a14|2]] |

    المشروع مقبول عند كل نسبة تعطي قيمة سنوية موجبة.

- id: c03-f-12
  kind: problem
  part: F
  vars: {P: 300000, i: 0.07, n: 15}
  random: {P: [100000, 600000, 10000], i: [0.04, 0.10, 0.005], n: [10, 25, 1]}
  calc:
    - A = P*AP(i, n)
    - Af = P*AF(i, n)
    - Ai = P*i
  text: |
    بلدية تقترض [[P|g]] دينار لمشروع صرف صحي بنسبة [[i|%]] لمدة [[yrs(n)]]. احسب القسط السنوي، ثم قسمه إلى فائدة سنوية على كامل القرض، وادخار سنوي يجمع أصل القرض في النهاية.
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    الفائدة على كامل القرض:

    $$
    [[P|g]] \times [[i|r]] = [[Ai|2]]
    $$

    الادخار السنوي الذي يجمع [[P|g]] دينار بعد [[yrs(n)]]:

    $$
    [[P|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[Af|2]]
    $$

    المجموع يساوي القسط، وهذا معنى العلاقة بين المعاملين A/P وA/F.

- id: c03-f-13
  kind: problem
  part: F
  vars: {Ca: 9000, Oa: 1800, Cb: 14000, Ob: 1100, n: 6, i: 0.10}
  random: {Ca: [4000, 15000, 500], Oa: [800, 3000, 100], Cb: [8000, 25000, 500], Ob: [400, 2500, 100], n: [4, 10, 1], i: [0.05, 0.14, 0.01]}
  calc:
    - Aa = Ca*AP(i, n) + Oa
    - Ab = Cb*AP(i, n) + Ob
    - D = Aa - Ab
  text: |
    خياران لإضاءة مستودع لمدة [[yrs(n)]]. الأول يكلف [[Ca|g]] دينار وكهرباؤه [[Oa|g]] دينار سنويا. الثاني يكلف [[Cb|g]] دينار وكهرباؤه [[Ob|g]] دينار سنويا. احسب الفرق في التكلفة السنوية بنسبة [[i|%]].
  solution: |
    $$
    AW_1 = [[Ca|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oa|g]] = [[Aa|2]]
    $$

    $$
    AW_2 = [[Cb|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Ob|g]] = [[Ab|2]]
    $$

    الخيار [[pick(D > 0, 'الثاني', 'الأول')]] أرخص بمقدار [[abs(D)|2]] دينار سنويا.

- id: c03-f-14
  kind: problem
  part: F
  vars: {C: 60000, A1: 15000, g: 0.04, n: 8, i: 0.10}
  random: {C: [30000, 100000, 1000], A1: [6000, 25000, 500], g: [0.02, 0.07, 0.005], n: [5, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - PW = -C + A1*PGEO(g, i, n)
    - AW = PW*AP(i, n)
  text: |
    مشروع يكلف [[C|g]] دينار، ودخله [[A1|g]] دينار في السنة الأولى، ويزيد [[g|%]] سنويا لمدة [[yrs(n)]]. ما قيمته السنوية بنسبة [[i|%]]؟
  solution: |
    لا يوجد معامل جاهز يحول السلسلة النسبية إلى سلسلة متساوية. نحسب القيمة الحالية أولا:

    $$
    PW = -[[C|g]] + [[A1|g]] \times [[PGEO(g, i, n)|f4]] = [[PW|2]]
    $$

    $$
    AW = [[PW|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[AW|2]]
    $$

- id: c03-f-15
  kind: problem
  part: F
  vars: {C: 50000, S: 8000, n: 6, i: 0.10, h: 1500}
  random: {C: [20000, 100000, 1000], S: [0, 15000, 500], n: [4, 10, 1], i: [0.06, 0.14, 0.01], h: [800, 3000, 100]}
  calc:
    - CR = C*AP(i, n) - S*AF(i, n)
    - ph = CR/h
  text: |
    ورشة تشتري آلة قص بسعر [[C|g]] دينار، وتبيعها بعد [[yrs(n)]] بقيمة [[S|g]] دينار. تعمل الآلة [[h|g]] ساعة في السنة. كم يجب أن تحمل الورشة على كل ساعة عمل لتسترد ثمن الآلة بنسبة [[i|%]]، قبل تكاليف التشغيل؟
  solution: |
    $$
    CR = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

    تكلفة الساعة:

    $$
    \frac{[[CR|2]]}{[[h|g]]} = [[ph|2]]
    $$

    هذا الرقم يدخل في تسعير الطلبيات، وهو ما يسمى معدل تحميل الآلة.
