- id: c03-i-01
  kind: problem
  part: I
  vars: {c0: 50000, c1: 12000, c2: 15000, c3: 18000, c4: 15000, c5: 10000, i: 0.10}
  random: {c0: [20000, 80000, 1000], c1: [3000, 20000, 500], c2: [3000, 25000, 500], c3: [3000, 25000, 500], c4: [3000, 25000, 500], c5: [3000, 20000, 500], i: [0.05, 0.15, 0.01]}
  calc:
    - PW = -c0 + c1*PF(i, 1) + c2*PF(i, 2) + c3*PF(i, 3) + c4*PF(i, 4) + c5*PF(i, 5)
    - wrong = PW/(1+i)
  text: |
    اكتب التدفقات [[-c0|r]] و[[c1|r]] و[[c2|r]] و[[c3|r]] و[[c4|r]] و[[c5|r]] للسنوات من 0 إلى 5 في عمود Excel، واحسب القيمة الحالية بنسبة [[i|%]] بالصيغة الصحيحة. ما الرقم الخاطئ الذي يظهر لو أدخلت السنة 0 داخل الدالة NPV؟
  solution: |
    التدفقات في الخلايا من B1 إلى B6:

    ```excel
    =B1 + NPV([[i|%]], B2:B6)
    ```

    القيمة الحالية [[PW|2]] دينار.

    الصيغة الخاطئة:

    ```excel
    =NPV([[i|%]], B1:B6)
    ```

    تعطي [[wrong|2]] دينار، لأن الدالة تخصم كل التدفقات سنة زائدة.

- id: c03-i-02
  kind: problem
  part: I
  vars: {C: 60000, R: 16000, S: 8000, n: 6}
  random: {C: [20000, 100000, 1000], R: [5000, 30000, 500], S: [0, 15000, 500], n: [4, 10, 1]}
  calc:
    - p4 = -C + R*PA(0.04, n) + S*PF(0.04, n)
    - p8 = -C + R*PA(0.08, n) + S*PF(0.08, n)
    - p12 = -C + R*PA(0.12, n) + S*PF(0.12, n)
    - p16 = -C + R*PA(0.16, n) + S*PF(0.16, n)
    - p20 = -C + R*PA(0.20, n) + S*PF(0.20, n)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]، وقيمة بيعه [[S|g]] دينار. ارسم في Python منحنى القيمة الحالية مقابل النسبة من 0% إلى 25%. ما القيم عند 4% و8% و12% و16% و20%؟
  solution: |
    ```python
    import numpy as np
    import numpy_financial as npf
    import matplotlib.pyplot as plt

    C, R, S, n = [[C|r]], [[R|r]], [[S|r]], [[n|n]]
    rates = np.linspace(0, 0.25, 51)
    pw = [-C + npf.pv(r, n, -R, -S) for r in rates]
    plt.plot(rates * 100, pw)
    plt.axhline(0, color="gray")
    plt.xlabel("rate %")
    plt.ylabel("PW")
    plt.show()
    ```

    | النسبة | القيمة الحالية |
    | --- | --- |
    | 4% | [[p4|2]] |
    | 8% | [[p8|2]] |
    | 12% | [[p12|2]] |
    | 16% | [[p16|2]] |
    | 20% | [[p20|2]] |

    النقطة التي يقطع فيها المنحنى المحور الأفقي هي معدل العائد الداخلي.

- id: c03-i-03
  kind: problem
  part: I
  vars: {P: 20000, r: 0.09, y: 3}
  random: {P: [5000, 40000, 500], r: [0.05, 0.14, 0.005], y: [1, 5, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - A = P*AP(im, N)
    - B12 = A*PA(im, N - 12)
    - I1 = A*12 - (P - B12)
  text: |
    ابن في Excel جدول إطفاء شهري لقرض [[P|g]] دينار بفائدة [[r|%]] سنويا تحسب شهريا لمدة [[yrs(y)]]. ما القسط؟ وما الرصيد بعد 12 شهرا؟ وكم دفع المقترض فوائد في السنة الأولى؟
  solution: |
    القسط في خلية ثابتة:

    ```excel
    =PMT([[r|%]]/12, [[N|n]], -[[P|r]])
    ```

    فائدة كل شهر تساوي الرصيد في بداية الشهر مضروبا في نسبة الشهر، والباقي من القسط يسدد الأصل. القسط [[A|2]] دينار.

    الرصيد بعد 12 شهرا:

    ```excel
    =PV([[r|%]]/12, [[N-12|n]], -[[A|d2]])
    ```

    الرصيد [[B12|2]] دينار. فوائد السنة الأولى [[I1|2]] دينار، ويمكن حسابها مباشرة:

    ```excel
    =-CUMIPMT([[r|%]]/12, [[N|n]], [[P|r]], 1, 12, 0)
    ```

- id: c03-i-04
  kind: problem
  part: I
  vars: {i: 0.10}
  random: {i: [0.06, 0.14, 0.01]}
  calc:
    - Aa = 18000*AP(i, 4) - 2000*AF(i, 4) + 4000
    - Ab = 30000*AP(i, 6) - 4000*AF(i, 6) + 3000
    - Ac = 45000*AP(i, 9) - 6000*AF(i, 9) + 2200
    - best = pick(Aa <= min(Ab, Ac), 'أ', pick(Ab <= Ac, 'ب', 'ج'))
  text: |
    اكتب دالة Python تأخذ السعر والتشغيل وقيمة البيع والعمر والنسبة، وتعيد القيمة السنوية للتكاليف. استخدمها لمقارنة ثلاث آلات بنسبة [[i|%]]: الآلة أ بسعر 18,000 وتشغيل 4,000 وبيع 2,000 وعمر 4 سنوات، والآلة ب بسعر 30,000 وتشغيل 3,000 وبيع 4,000 وعمر 6 سنوات، والآلة ج بسعر 45,000 وتشغيل 2,200 وبيع 6,000 وعمر 9 سنوات.
  solution: |
    ```python
    import numpy_financial as npf

    def aw_cost(cost, oper, salvage, life, i):
        return npf.pmt(i, life, -cost, salvage) + oper

    i = [[i|r]]
    for name, m in [("A", (18000, 4000, 2000, 4)),
                    ("B", (30000, 3000, 4000, 6)),
                    ("C", (45000, 2200, 6000, 9))]:
        print(name, round(aw_cost(*m, i), 2))
    ```

    | الآلة | القيمة السنوية |
    | --- | --- |
    | أ | [[Aa|2]] |
    | ب | [[Ab|2]] |
    | ج | [[Ac|2]] |

    الأرخص الآلة [[best]].

- id: c03-i-05
  kind: problem
  part: I
  vars: {r: 0.10}
  random: {r: [0.04, 0.20, 0.005]}
  calc:
    - e = (1 + r/12)**12 - 1
    - back = 12*((1+e)**(1/12) - 1)
  text: |
    حول النسبة الاسمية [[r|%]] المحسوبة شهريا إلى نسبة فعلية بالدالة EFFECT، ثم أرجعها بالدالة NOMINAL. اكتب نفس الحساب في Python.
  solution: |
    ```excel
    =EFFECT([[r|%]], 12)
    =NOMINAL(B1, 12)
    ```

    ```python
    r = [[r|r]]
    ia = (1 + r / 12) ** 12 - 1
    back = 12 * ((1 + ia) ** (1 / 12) - 1)
    print(round(ia, 6), round(back, 6))
    ```

    النسبة الفعلية [[e|%2]]، والرجوع يعطي [[back|%2]] كما بدأنا.

- id: c03-i-06
  kind: problem
  part: I
  vars: {C: 45000, S: 5000, n: 7}
  random: {C: [10000, 100000, 1000], S: [0, 15000, 500], n: [4, 12, 1]}
  calc:
    - r8 = C*AP(0.08, n) - S*AF(0.08, n)
    - r12 = C*AP(0.12, n) - S*AF(0.12, n)
  text: |
    ابن في Excel جدولا يبين أقل توفير سنوي يبرر شراء معدات بسعر [[C|g]] دينار وقيمة بيع [[S|g]] دينار، لأعمار من 3 إلى 12 سنة ونسب من 6% إلى 14%. ما القيمة عند عمر [[yrs(n)]] ونسبتي 8% و12%؟
  solution: |
    ضع النسب في الصف الأول من B1، والأعمار في العمود الأول من A2، ثم اكتب في B2 واسحب:

    ```excel
    =PMT(B$1, $A2, -[[C|r]], [[S|r]])
    ```

    عند عمر [[yrs(n)]]: [[r8|2]] دينار بنسبة 8%، و[[r12|2]] دينار بنسبة 12%.

- id: c03-i-07
  kind: problem
  part: I
  vars: {C: 30000, A1: 4000, G: 1500, i: 0.10}
  random: {C: [10000, 50000, 1000], A1: [1000, 8000, 250], G: [500, 3000, 250], i: [0.06, 0.12, 0.01]}
  calc:
    - k1 = -C + A1*PF(i, 1)
    - k2 = k1 + (A1 + G)*PF(i, 2)
    - k3 = k2 + (A1 + 2*G)*PF(i, 3)
    - k4 = k3 + (A1 + 3*G)*PF(i, 4)
    - k5 = k4 + (A1 + 4*G)*PF(i, 5)
    - k6 = k5 + (A1 + 5*G)*PF(i, 6)
    - k7 = k6 + (A1 + 6*G)*PF(i, 7)
    - k8 = k7 + (A1 + 7*G)*PF(i, 8)
  text: |
    اكتب برنامج Python يحسب فترة الاسترداد المخصومة لمشروع يكلف [[C|g]] دينار، ودخله [[A1|g]] دينار في السنة الأولى ويزيد [[G|g]] دينار كل سنة، بنسبة [[i|%]]. البرنامج يقف عند أول سنة يصبح فيها التراكمي موجبا، ويحسب الكسر داخل السنة.
  solution: |
    ```python
    C, A1, G, i = [[C|r]], [[A1|r]], [[G|r]], [[i|r]]
    cum, year = -C, 0
    while cum < 0 and year < 50:
        year += 1
        flow = (A1 + G * (year - 1)) / (1 + i) ** year
        if cum + flow >= 0:
            print(round(year - 1 + (-cum) / flow, 2))
        cum += flow
    ```

    التراكمي المخصوم في أول 8 سنوات:

    | السنة | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | التراكمي | [[k1|0]] | [[k2|0]] | [[k3|0]] | [[k4|0]] | [[k5|0]] | [[k6|0]] | [[k7|0]] | [[k8|0]] |

- id: c03-i-08
  kind: problem
  part: I
  vars: {Ca: 20000, Oa: 5000, dC: 12000, Ob: 3000, n: 8, r0: 0}
  random: {Ca: [10000, 30000, 1000], Oa: [6000, 10000, 250], dC: [3000, 15000, 500], n: [5, 12, 1], r0: [0.04, 0.25, 0.01]}
  calc:
    - Cb = Ca + dC
    - Ob = pick(r0 > 0, Oa - floor(dC*AP(r0, n)/50)*50, Ob)
    - r = RATE(n, Oa - Ob, Cb - Ca)
  text: |
    الآلة أ تكلف [[Ca|g]] دينار وتشغيلها [[Oa|g]] دينار سنويا. الآلة ب تكلف [[Cb|g]] دينار وتشغيلها [[Ob|g]] دينار سنويا. عمر كل منهما [[yrs(n)]]. استخدم Goal Seek في Excel لإيجاد النسبة التي تتساوى عندها الآلتان.
  solution: |
    ضع نسبة تجريبية في B1، واكتب في B2 الفرق بين القيمتين الحاليتين:

    ```excel
    =([[Ca|r]] + PV(B1, [[n|n]], -[[Oa|r]])) - ([[Cb|r]] + PV(B1, [[n|n]], -[[Ob|r]]))
    ```

    ثم Goal Seek: اجعل B2 صفرا بتغيير B1. النسبة [[r|%2]]. تحتها الآلة ب أرخص، وفوقها الآلة أ أرخص. الدالة RATE تعطي نفس الجواب مباشرة:

    ```excel
    =RATE([[n|n]], [[Oa-Ob|r]], -[[Cb-Ca|r]])
    ```

- id: c03-i-09
  kind: problem
  part: I
  vars: {rent: 400, C: 75000, S: 85000, ia: 0.08}
  random: {rent: [200, 800, 25], C: [40000, 120000, 5000], S: [30000, 150000, 5000], ia: [0.05, 0.12, 0.005]}
  calc:
    - im = (1+ia)**(1/12) - 1
    - PW = -C + rent*PA(im, 120) + S*PF(ia, 10)
  text: |
    اكتب برنامج Python يحسب القيمة الحالية لشقة تشترى بسعر [[C|g]] دينار، وتؤجر بمبلغ [[rent|g]] دينار شهريا لمدة 10 سنوات، ثم تباع بسعر [[S|g]] دينار. الحد الأدنى للعائد [[ia|%]] نسبة فعلية سنوية. اكتب كل التدفقات في قائمة شهرية واحدة.
  solution: |
    ```python
    import numpy_financial as npf
    C, rent, S, ia = [[C|r]], [[rent|r]], [[S|r]], [[ia|r]]
    im = (1 + ia) ** (1 / 12) - 1
    flows = [-C] + [rent] * 120
    flows[120] += S
    print(round(npf.npv(im, flows), 2))
    ```

    القيمة الحالية [[PW|2]] دينار. بيع الشقة في الشهر 120، فخصمه بالنسبة الشهرية على 120 شهرا يساوي خصمه بالنسبة السنوية على 10 سنوات.

- id: c03-i-10
  kind: problem
  part: I
  vars: {C: 100000, M: 12000, R: 50000, k: 10}
  random: {C: [50000, 300000, 10000], M: [3000, 30000, 1000], R: [20000, 100000, 5000], k: [5, 15, 1]}
  calc:
    - c4 = C + (M + R*AF(0.04, k))/0.04
    - c6 = C + (M + R*AF(0.06, k))/0.06
    - c8 = C + (M + R*AF(0.08, k))/0.08
  text: |
    مشروع بنية تحتية يكلف [[C|g]] دينار، وصيانته [[M|g]] دينار سنويا، ويحتاج تجديدا كل [[yrs(k)]] بتكلفة [[R|g]] دينار. احسب في Python التكلفة المرسملة عند 4% و6% و8%. لماذا تتغير كثيرا مع النسبة؟
  solution: |
    ```python
    def capitalized(C, M, R, k, i):
        af = i / ((1 + i) ** k - 1)
        return C + (M + R * af) / i

    for i in [0.04, 0.06, 0.08]:
        print(i, round(capitalized([[C|r]], [[M|r]], [[R|r]], [[k|n]], i), 2))
    ```

    | النسبة | التكلفة المرسملة |
    | --- | --- |
    | 4% | [[c4|2]] |
    | 6% | [[c6|2]] |
    | 8% | [[c8|2]] |

    التكاليف المتكررة مقسومة على النسبة، فالنسبة الصغيرة تكبرها كثيرا. لذلك يجب اختيار النسبة بعناية في مشاريع البنية التحتية.
