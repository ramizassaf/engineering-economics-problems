- id: c03-b-20
  kind: problem
  part: B
  vars: {r: 0.08}
  random: {r: [0.03, 0.20, 0.005]}
  calc:
    - ec = exp(r) - 1
    - e12 = (1 + r/12)**12 - 1
  text: |
    ما النسبة الفعلية لنسبة اسمية [[r|%]] تحسب بشكل مستمر؟ وكم تزيد عن الحساب الشهري؟
  solution: |
    $$
    i_a = e^{[[r|r]]} - 1 = [[ec|%2]]
    $$

    الحساب الشهري يعطي [[e12|%2]]. الفرق [[ec-e12|%2]] نقطة مئوية فقط.

- id: c03-b-21
  kind: problem
