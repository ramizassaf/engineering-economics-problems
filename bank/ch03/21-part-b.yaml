- id: c03-b-22
  kind: problem
  part: B
  vars: {r1: 0.096, r2: 0.098, r3: 0.10}
  random: {r1: [0.06, 0.12, 0.002], r2: [0.06, 0.12, 0.002], r3: [0.06, 0.12, 0.002]}
  calc:
    - e1 = (1 + r1/12)**12 - 1
    - e2 = (1 + r2/4)**4 - 1
    - e3 = r3
    - best = pick(e1 <= min(e2, e3), 'الأول', pick(e2 <= e3, 'الثاني', 'الثالث'))
  text: |
    ثلاثة بنوك تعرض قرضا: الأول [[r1|%2]] تحسب شهريا، والثاني [[r2|%2]] تحسب كل ثلاثة أشهر، والثالث [[r3|%2]] تحسب سنويا. أيها أرخص؟
  solution: |
    | البنك | النسبة الفعلية |
    | --- | --- |
    | الأول | [[e1|%2]] |
    | الثاني | [[e2|%2]] |
    | الثالث | [[e3|%2]] |

    الأرخص البنك [[best]].

- id: c03-b-23
  kind: problem
  part: B
  vars: {A: 6000, r: 0.10, n: 8}
  random: {A: [1000, 20000, 500], r: [0.04, 0.16, 0.005], n: [3, 15, 1]}
  calc:
    - ia = (1 + r/4)**4 - 1
    - P = A*PA(ia, n)
  text: |
    ما القيمة الحالية لدفعة [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]]، بنسبة [[r|%]] سنويا تحسب كل ثلاثة أشهر؟
  solution: |
    $$
    i_a = \left(1 + \frac{[[r|r]]}{4}\right)^4 - 1 = [[ia|%2]]
    $$

    $$
    P = [[A|g]]\,(P/A,\ [[ia|%2]],\ [[n|n]]) = [[P|2]]
    $$
