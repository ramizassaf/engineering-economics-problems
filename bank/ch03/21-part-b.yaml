    - F = A*FA(iq, 4*y)
  text: |
    إيداع [[A|g]] دينار في نهاية كل ثلاثة أشهر، بنسبة [[r|%]] سنويا تحسب شهريا. كم يصبح الرصيد بعد [[yrs(y)]]؟
  solution: |
