items:

- id: c03-b-01
  kind: problem
  part: B
  vars: {r: 0.12}
  random: {r: [0.04, 0.18, 0.005]}
  calc:
    - im = r/12
    - ia = (1+im)**12 - 1
  text: |
    بنك يعلن [[r|%]] سنويا تحسب شهريا. ما نسبة الشهر؟ وما النسبة الفعلية السنوية؟
  solution: |
    $$
    i_m = \frac{[[r|%]]}{12} = [[im|%2]]
    $$

    $$
    i_a = (1 + [[im|r]])^{12} - 1 = [[ia|%2]]
    $$

- id: c03-b-02
  kind: problem
  part: B
  vars: {ia: 0.10}
  random: {ia: [0.04, 0.16, 0.005]}
  calc:
    - im = (1+ia)**(1/12) - 1
    - r = 12*im
  text: |
    النسبة الفعلية السنوية [[ia|%]]. ما نسبة الشهر التي تكافئها؟ وما النسبة الاسمية السنوية التي يعلنها البنك؟
  solution: |
    $$
    i_m = (1 + [[ia|r]])^{1/12} - 1 = [[im|%2]]
    $$

    $$
    r = 12 \times [[im|%2]] = [[r|%2]]
    $$

    في Excel:

    ```excel
    =NOMINAL([[ia|%]], 12)
    ```

- id: c03-b-03
  kind: problem
  part: B
  vars: {P: 25000, r: 0.08, y: 5}
  random: {P: [5000, 60000, 500], r: [0.04, 0.14, 0.005], y: [2, 7, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - A = P*AP(im, N)
  text: |
    قرض [[P|g]] دينار بفائدة [[r|%]] سنويا تحسب شهريا، يسدد بأقساط شهرية لمدة [[yrs(y)]]. ما القسط الشهري؟
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[im|%2]],\ [[N|n]]) = [[A|2]]
    $$

    ```excel
    =PMT([[r|%]]/12, [[N|n]], -[[P|r]])
    ```

- id: c03-b-04
  kind: problem
  part: B
  vars: {A: 300, r: 0.06, y: 10}
  random: {A: [50, 1000, 25], r: [0.03, 0.10, 0.005], y: [3, 20, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - F = A*FA(im, N)
  text: |
    يودع شخص [[A|g]] دينار في نهاية كل شهر لمدة [[yrs(y)]] بفائدة [[r|%]] سنويا تحسب شهريا. كم يصبح رصيده؟
  solution: |
    $$
    F = [[A|g]]\,(F/A,\ [[im|%2]],\ [[N|n]]) = [[F|2]]
    $$

- id: c03-b-05
  kind: problem
  part: B
  vars: {A: 650, r: 0.09, y: 4}
  random: {A: [200, 1500, 25], r: [0.05, 0.14, 0.005], y: [2, 6, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - P = A*PA(im, N)
  text: |
    يستطيع موظف دفع [[A|g]] دينار شهريا قسطا لسيارة. ما أكبر قرض يأخذه بفائدة [[r|%]] سنويا تحسب شهريا لمدة [[yrs(y)]]؟
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[im|%2]],\ [[N|n]]) = [[P|2]]
    $$

- id: c03-b-06
  kind: problem
  part: B
  vars: {r1: 0.10, r2: 0.104}
  random: {r1: [0.05, 0.15, 0.002], r2: [0.05, 0.15, 0.002]}
  calc:
    - e1 = (1 + r1/12)**12 - 1
    - best = pick(e1 < r2, 'الأول', 'الثاني')
  text: |
    قرض بأحد عرضين: [[r1|%2]] سنويا تحسب شهريا، أو [[r2|%2]] سنويا تحسب مرة في السنة. أي العرضين أرخص للمقترض؟
  solution: |
    $$
    i_a = \left(1 + \frac{[[r1|r]]}{12}\right)^{12} - 1 = [[e1|%2]]
    $$

    النسبة الفعلية للعرض الثاني [[r2|%2]]. العرض الأرخص هو [[best]].

- id: c03-b-07
  kind: problem
  part: B
  vars: {F: 15000, ia: 0.08, y: 3}
  random: {F: [3000, 40000, 500], ia: [0.03, 0.12, 0.005], y: [1, 8, 1]}
  calc:
    - N = 12*y
    - im = (1+ia)**(1/12) - 1
    - A = F*AF(im, N)
  text: |
    طالبة تريد جمع [[F|g]] دينار بعد [[yrs(y)]] لدراسة الماجستير. البنك يعطي [[ia|%]] نسبة فعلية سنوية. كم تودع في نهاية كل شهر؟
  solution: |
    $$
    i_m = (1 + [[ia|r]])^{1/12} - 1 = [[im|%2]]
    $$

    $$
    A = [[F|g]]\,(A/F,\ [[im|%2]],\ [[N|n]]) = [[A|2]]
    $$

- id: c03-b-08
  kind: problem
  part: B
  vars: {P: 10000, r: 0.09, y: 3}
  random: {P: [2000, 50000, 500], r: [0.04, 0.14, 0.005], y: [1, 10, 1]}
  calc:
    - N = 12*y
    - Fm = P*FP(r/12, N)
    - Fa = P*FP(r, y)
  text: |
    أودع [[P|g]] دينار لمدة [[yrs(y)]] بنسبة [[r|%]] سنويا. كم يصبح الرصيد إذا حسبت الفائدة شهريا؟ وكم إذا حسبت سنويا؟ وما الفرق؟
  solution: |
    $$
    F_m = [[P|g]]\,(F/P,\ [[r/12|%2]],\ [[N|n]]) = [[Fm|2]]
    $$

    $$
    F_a = [[P|g]]\,(F/P,\ [[r|%]],\ [[y|n]]) = [[Fa|2]]
    $$

    الحساب الشهري يعطي [[Fm-Fa|2]] دينار زيادة.

- id: c03-b-09
  kind: problem
  part: B
  vars: {P: 120000, r: 0.07, y: 20}
  random: {P: [40000, 250000, 5000], r: [0.04, 0.10, 0.0025], y: [10, 25, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - A = P*AP(im, N)
    - I = A*N - P
  text: |
    قرض سكني [[P|g]] دينار بفائدة [[r|%2]] سنويا تحسب شهريا لمدة [[yrs(y)]]. ما القسط الشهري؟ وما مجموع الفوائد؟
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[im|%2]],\ [[N|n]]) = [[A|2]]
    $$

    مجموع الفوائد [[I|2]] دينار.

- id: c03-b-10
  kind: problem
  part: B
  vars: {P: 120000, r: 0.07, y: 20, k: 5}
  random: {P: [40000, 250000, 5000], r: [0.04, 0.10, 0.0025], y: [10, 25, 1], k: [2, 8, 1]}
  calc:
    - N = 12*y
    - im = r/12
    - A = P*AP(im, N)
    - B = A*PA(im, N - 12*k)
  text: |
    للقرض السكني [[P|g]] دينار بفائدة [[r|%2]] سنويا تحسب شهريا لمدة [[yrs(y)]]: كم يبقى على المقترض بعد [[yrs(k)]] من السداد؟
  solution: |
    القسط الشهري:

    $$
    A = [[P|g]]\,(A/P,\ [[im|%2]],\ [[N|n]]) = [[A|2]]
    $$

    الرصيد هو القيمة الحالية للأقساط الباقية، وعددها [[N-12*k|n]] قسطا:

    $$
    B = [[A|2]]\,(P/A,\ [[im|%2]],\ [[N-12*k|n]]) = [[B|2]]
    $$

- id: c03-b-11
  kind: problem
  part: B
  vars: {P: 8000, A: 0, y: 3, r0: 0}
  random: {P: [3000, 20000, 500], y: [2, 5, 1], r0: [0.06, 0.24, 0.01]}
  calc:
    - N = 12*y
    - A = pick(r0 > 0, floor(P*AP(r0/12, N)/5)*5, 260)
    - im = RATE(N, A, P)
    - r = 12*im
    - ia = (1+im)**12 - 1
  text: |
    محل أجهزة يبيع جهازا بسعر [[P|g]] دينار نقدا، أو بأقساط [[A|g]] دينار شهريا لمدة [[yrs(y)]]. ما النسبة الفعلية السنوية التي يدفعها المشتري بالتقسيط؟
  solution: |
    نبحث عن نسبة الشهر التي تجعل القيمة الحالية للأقساط تساوي السعر النقدي:

    $$
    [[A|g]]\,(P/A,\ i_m,\ [[N|n]]) = [[P|g]]
    $$

    ```excel
    =RATE([[N|n]], [[A|r]], -[[P|r]])
    ```

    نسبة الشهر [[im|%2]]، والنسبة الاسمية [[r|%2]]، والنسبة الفعلية:

    $$
    i_a = (1 + [[im|f4]])^{12} - 1 = [[ia|%2]]
    $$

- id: c03-b-12
  kind: problem
  part: B
  vars: {A: 400, ia: 0.06, y: 15}
  random: {A: [100, 1200, 25], ia: [0.03, 0.10, 0.005], y: [5, 30, 1]}
  calc:
    - N = 12*y
    - im = (1+ia)**(1/12) - 1
    - F = A*FA(im, N)
    - w = A*FA(ia/12, N)
  text: |
    صندوق ادخار يعطي [[ia|%]] نسبة فعلية سنوية. يودع موظف [[A|g]] دينار شهريا لمدة [[yrs(y)]]. كم يصبح رصيده؟ وكم يكون الخطأ لو قسم النسبة على 12؟
  solution: |
    $$
    i_m = (1 + [[ia|r]])^{1/12} - 1 = [[im|%2]]
    $$

    $$
    F = [[A|g]]\,(F/A,\ [[im|%2]],\ [[N|n]]) = [[F|2]]
    $$

    قسمة النسبة على 12 تعطي [[w|2]] دينار، أي زيادة غير حقيقية قدرها [[w-F|2]] دينار.

- id: c03-b-13
  kind: problem
  part: B
  vars: {P: 30000, r: 0.10, y: 4}
  random: {P: [5000, 80000, 1000], r: [0.05, 0.15, 0.005], y: [2, 8, 1]}
  calc:
    - Am = P*AP(r/12, 12*y)
    - Ay = P*AP(r, y)
    - Tm = 12*y*Am
    - Ty = y*Ay
  text: |
    قرض [[P|g]] دينار بنسبة [[r|%]] لمدة [[yrs(y)]]. قارن بين السداد بأقساط شهرية بفائدة تحسب شهريا، والسداد بأقساط سنوية بفائدة تحسب سنويا. ما مجموع ما يدفع في كل حالة؟ ولماذا يختلف؟
  solution: |
    $$
    A_m = [[P|g]]\,(A/P,\ [[r/12|%2]],\ [[12*y|n]]) = [[Am|2]]
    $$

    $$
    A_y = [[P|g]]\,(A/P,\ [[r|%]],\ [[y|n]]) = [[Ay|2]]
    $$

    مجموع الأقساط الشهرية [[Tm|2]] دينار، ومجموع الأقساط السنوية [[Ty|2]] دينار. الأقساط الشهرية تسدد الأصل أبكر، فيبقى الرصيد أقل خلال السنة وتقل الفوائد، مع أن النسبة الفعلية أعلى.

- id: c03-b-14
  kind: problem
  part: B
  vars: {P: 50000, A: 0, r0: 0, r: 0.08}
  random: {P: [10000, 100000, 1000], r0: [600, 2500, 50], r: [0.05, 0.12, 0.005]}
  calc:
    - im = r/12
    - A = pick(r0 > 0, r0, 800)
    - A = max(A, P*im*1.25)
    - m = -ln(1 - P*im/A)/ln(1+im)
  text: |
    قرض [[P|g]] دينار بفائدة [[r|%]] سنويا تحسب شهريا. يستطيع المقترض دفع [[A|g]] دينار شهريا. كم شهرا يحتاج للسداد؟
  solution: |
    $$
    [[A|g]]\,(P/A,\ [[im|%2]],\ m) = [[P|g]]
    $$

    ```excel
    =NPER([[r|%]]/12, [[A|r]], -[[P|r]])
    ```

    $$
    m = \frac{-\ln\left(1 - \frac{[[P|g]] \times [[im|f4]]}{[[A|g]]}\right)}{\ln(1 + [[im|f4]])} = [[m|2]]
    $$

    يحتاج [[ceil(m)|n]] شهرا، والقسط الأخير أصغر من القسط العادي.

- id: c03-b-15
  kind: problem
  part: B
  vars: {r: 0.12}
  random: {r: [0.06, 0.24, 0.01]}
  calc:
    - e2 = (1 + r/2)**2 - 1
    - e4 = (1 + r/4)**4 - 1
    - e12 = (1 + r/12)**12 - 1
    - e365 = (1 + r/365)**365 - 1
  text: |
    احسب النسبة الفعلية السنوية لنسبة اسمية [[r|%]] إذا حسبت الفائدة كل نصف سنة، وكل ربع سنة، وكل شهر، وكل يوم. ماذا تلاحظ؟
  solution: |
    | عدد مرات الحساب في السنة | النسبة الفعلية |
    | --- | --- |
    | 2 | [[e2|%2]] |
    | 4 | [[e4|%2]] |
    | 12 | [[e12|%2]] |
    | 365 | [[e365|%2]] |

    النسبة الفعلية تزيد مع عدد مرات الحساب، لكن الزيادة تصغر بسرعة. الفرق بين الحساب الشهري واليومي صغير جدا في الواقع العملي.

