items:

- id: c03-j-01
  kind: mcq
  part: J
  vars: {P: 20000, r: 0.12, y: 3}
  random: {P: [5000, 40000, 1000], r: [0.06, 0.15, 0.01], y: [2, 5, 1]}
  calc:
    - N = 12*y
    - A = P*AP(r/12, N)
    - w1 = P*AP(r, y)/12
    - w2 = P*AP(r, N)
    - w3 = P*(1 + r*y)/N
  text: |
    قرض [[P|g]] دينار بفائدة [[r|%]] سنويا تحسب شهريا، يسدد بأقساط شهرية لمدة [[yrs(y)]]. ما القسط الشهري؟
  options: ["[[w1|2]] دينار", "[[A|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار"]
  correct: 1
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[r/12|%2]],\ [[N|n]]) = [[A|2]]
    $$

    الخيار (أ) حسب قسطا سنويا وقسمه على 12. الخيار (ج) استخدم النسبة السنوية مع عدد الأشهر. الخيار (د) استخدم فائدة بسيطة.

- id: c03-j-02
  kind: mcq
  part: J
  vars: {r: 0.12}
  random: {r: [0.06, 0.18, 0.01]}
  calc:
    - e = (1 + r/12)**12 - 1
    - w1 = r
    - w2 = r/12
    - w3 = (1 + r)**12 - 1
  text: |
    ما النسبة الفعلية السنوية لنسبة اسمية [[r|%]] تحسب شهريا؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[e|%2]]", "[[w3|%2]]"]
  correct: 2
  solution: |
    $$
    i_a = \left(1 + \frac{[[r|r]]}{12}\right)^{12} - 1 = [[e|%2]]
    $$

- id: c03-j-03
  kind: mcq
  part: J
  text: |
    ثلاث آلات لنفس العمل، أعمارها 3 و4 و6 سنوات. أسرع طريقة صحيحة للمقارنة:
  options: ["القيمة الحالية لعمر كل آلة", "القيمة الحالية على 6 سنوات", "القيمة السنوية لعمر كل آلة", "فترة الاسترداد"]
  correct: 2
  solution: |
    القيمة السنوية لعمر واحد تكافئ المقارنة على المضاعف المشترك، وهو 12 سنة هنا. الخيار (أ) يقارن مددا مختلفة. الخيار (ب) ليست مضاعفا مشتركا للأعمار الثلاثة. الخيار (د) لا يقيس التكلفة.

- id: c03-j-04
  kind: mcq
  part: J
  vars: {A: 30000, i: 0.06}
  random: {A: [5000, 80000, 1000], i: [0.04, 0.10, 0.005]}
  calc:
    - P = A/i
    - w1 = A*i
    - w2 = A*PA(i, 50)
    - w3 = A/(1+i)
  text: |
    ما القيمة الحالية لدفعة سنوية [[A|g]] دينار إلى الأبد بنسبة [[i|%]]؟
  options: ["[[w1|2]] دينار", "[[w2|2]] دينار", "[[P|2]] دينار", "[[w3|2]] دينار"]
  correct: 2
  solution: |
    $$
    P = \frac{[[A|g]]}{[[i|r]]} = [[P|2]]
    $$

    الخيار (ب) قريب لأن 50 سنة مدة طويلة، لكنه ليس الجواب الدقيق.

- id: c03-j-05
  kind: mcq
  part: J
  text: |
    مشروع قيمته الحالية سالبة بنسبة 12%. ماذا تعرف عن قيمته الحالية بنسبة 8%؟
  options: ["سالبة حتما", "موجبة حتما", "أكبر من قيمتها بنسبة 12% لمشروع تكاليفه في البداية ودخله بعدها", "تساوي قيمتها بنسبة 12%"]
  correct: 2
  solution: |
    في المشروع العادي، التكلفة في البداية والدخل في المستقبل. تخفيض النسبة يقلل خصم الدخل، فتزيد القيمة الحالية. لكنها قد تبقى سالبة أو تصبح موجبة، حسب المشروع.

- id: c03-j-06
  kind: mcq
  part: J
  vars: {P: 40000, S: 5000, n: 5, i: 0.10}
  random: {P: [10000, 80000, 1000], S: [1000, 15000, 500], n: [3, 10, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - CR = P*AP(i, n) - S*AF(i, n)
    - w1 = (P - S)/n
    - w2 = P*AP(i, n) - S*AP(i, n)
    - w3 = P*AP(i, n)
  text: |
    ما تكلفة استرداد رأس المال لأصل بسعر [[P|g]] دينار وقيمة بيع [[S|g]] دينار بعد [[yrs(n)]] بنسبة [[i|%]]؟
  options: ["[[w1|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار", "[[CR|2]] دينار"]
  correct: 3
  solution: |
    $$
    CR = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[S|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[CR|2]]
    $$

    الخيار (أ) يتجاهل الفائدة. الخيار (ب) عامل قيمة البيع كأنها في السنة 0. الخيار (ج) نسي قيمة البيع.

- id: c03-j-07
  kind: mcq
  part: J
  text: |
    بدائل تكاليف لنفس الخدمة. القيم الحالية للتكاليف: 52,000 و48,000 و55,000 دينار. ماذا تختار؟
  options: ["البديل الأول", "البديل الثاني", "البديل الثالث", "عدم التنفيذ لأن كل القيم تكاليف"]
  correct: 1
  solution: |
    في بدائل التكاليف نختار الأقل تكلفة. خيار عدم التنفيذ غير متاح، لأن الخدمة مطلوبة على أي حال.

- id: c03-j-08
  kind: mcq
  part: J
  vars: {ia: 0.09}
  random: {ia: [0.04, 0.14, 0.005]}
  calc:
    - im = (1+ia)**(1/12) - 1
    - w1 = ia/12
    - w2 = (1 + ia/12)**12 - 1
    - w3 = ia
  text: |
    النسبة الفعلية السنوية [[ia|%]]. ما نسبة الشهر التي تكافئها؟
  options: ["[[w1|%2]]", "[[im|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    i_m = (1 + [[ia|r]])^{1/12} - 1 = [[im|%2]]
    $$

    الخيار (أ) قسم النسبة الفعلية على 12، فأعطى نسبة أعلى من الصحيحة.

- id: c03-j-09
  kind: mcq
  part: J
  text: |
    مشروع أ يسترد تكلفته في سنتين وقيمته الحالية 5,000 دينار. مشروع ب يسترد تكلفته في 4 سنوات وقيمته الحالية 20,000 دينار. المشروعان متنافيان، والشركة لا تعاني نقصا في السيولة. ماذا تختار؟
  options: ["المشروع أ لأنه أسرع استردادا", "المشروع ب لأن قيمته الحالية أكبر", "المشروعين معا", "لا يمكن الحكم"]
  correct: 1
  solution: |
    القيمة الحالية هي معيار القرار. فترة الاسترداد معيار مساعد يهم عندما تكون السيولة قليلة أو الخطر كبيرا.

- id: c03-j-10
  kind: mcq
  part: J
  text: |
    في المقارنة بفترة دراسة أقصر من عمر الآلة، كيف تعامل الآلة في نهاية الفترة؟
  options: ["نتجاهلها", "نطرح قيمة بيعها في نهاية عمرها", "نطرح قيمتها السوقية المتوقعة في نهاية الفترة", "نضيف تكلفة استبدالها"]
  correct: 2
  solution: |
    الآلة ما زالت صالحة في نهاية الفترة ولها قيمة سوقية. هذه القيمة تطرح من التكاليف في نهاية الفترة.
