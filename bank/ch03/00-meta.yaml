meta:
  number: 3
  title: |
    القيمة الحالية والقيمة السنوية ومقارنة البدائل
  parts:
    - key: A
      title: "الجزء أ: أسئلة مفاهيم"
      intro: أجب بجملة أو جملتين، بدون حساب.
    - key: B
      title: "الجزء ب: الفائدة الاسمية والفعلية"
      intro: حول النسبة إلى نفس فترة الدفعات قبل أي حساب.
    - key: C
      title: "الجزء ج: القيمة الحالية لمشروع واحد"
    - key: D
      title: "الجزء د: مقارنة بدائل بأعمار متساوية"
      intro: حدد أولا هل البدائل إيرادات أم تكاليف، ثم اختر الأكبر قيمة أو الأقل تكلفة.
    - key: E
      title: "الجزء هـ: بدائل بأعمار مختلفة"
      intro: لا تقارن قيما حالية لأعمار مختلفة مباشرة. استخدم المضاعف المشترك أو فترة الدراسة أو القيمة السنوية.
    - key: F
      title: "الجزء و: القيمة السنوية وتكلفة استرداد رأس المال"
    - key: G
      title: "الجزء ز: التكلفة المرسملة"
    - key: H
      title: "الجزء ح: فترة الاسترداد ونقطة التعادل"
    - key: I
      title: "الجزء ط: مسائل Excel وPython"
      intro: حل هذه المسائل بجدول في Excel أو ببرنامج Python، وليس باليد.
    - key: J
      title: "الجزء ي: اختيار من متعدد"
      intro: كل خيار خاطئ في هذا الجزء مبني على خطأ يقع فيه الطلاب فعلا.
    - key: K
      title: "الجزء ك: حالات مصغرة"
      intro: كل حالة تجمع أكثر من فكرة من الفصل، وبعضها يضيف فكرة جديدة.
