items:

- id: c03-a-01
  kind: concept
  part: A
  text: |
    ما الفرق بين النسبة الاسمية والنسبة الفعلية؟ ومتى تتساويان؟
  solution: |
    النسبة الاسمية هي النسبة المعلنة في السنة بدون أثر تراكم الفائدة داخل السنة. النسبة الفعلية هي الزيادة الحقيقية في سنة. تتساويان عندما تحسب الفائدة مرة واحدة في السنة.

- id: c03-a-02
  kind: concept
  part: A
  text: |
    قرض بأقساط شهرية ونسبة سنوية معلنة. ما النسبة وعدد الفترات اللذان تستخدمهما في المعامل A/P؟
  solution: |
    نسبة الشهر، وهي النسبة الاسمية مقسومة على 12، وعدد الأشهر. النسبة يجب أن تطابق فترة الدفعات دائما.

- id: c03-a-03
  kind: concept
  part: A
  text: |
    ماذا يعني الحد الأدنى للعائد؟ ولماذا لا تقبل شركة مشروعا عائده أقل منه؟
  solution: |
    هو أقل عائد تقبله الشركة على استثمار جديد، لأنها تستطيع تحقيقه في مكان آخر، أو لأنه تكلفة المال الذي تقترضه. المشروع الذي يعطي أقل منه يخسر مقارنة بالبديل المتاح.

- id: c03-a-04
  kind: concept
  part: A
  text: |
    مشروع قيمته الحالية صفر. هل هو مشروع خاسر؟
  solution: |
    لا. القيمة الحالية صفر تعني أن المشروع يسترد تكلفته ويعطي الحد الأدنى للعائد بالضبط. الشركة لا تربح ولا تخسر مقارنة باستثمار المال بالحد الأدنى.

- id: c03-a-05
  kind: concept
  part: A
  text: |
    ما الفرق بين بدائل التكاليف وبدائل الإيرادات؟ وكيف تختار في كل حالة؟
  solution: |
    بدائل التكاليف تؤدي نفس الخدمة، فالإيراد واحد ولا يدخل الحساب. نختار الأقل قيمة حالية للتكاليف. بدائل الإيرادات لكل منها دخل مختلف. نختار الأكبر قيمة حالية، بشرط أن تكون موجبة.

- id: c03-a-06
  kind: concept
  part: A
  text: |
    لماذا لا نقارن القيمة الحالية لآلة عمرها 3 سنوات مع آلة عمرها 5 سنوات مباشرة؟
  solution: |
    لأن الثانية تقدم خدمة أطول، فتكاليفها تغطي مدة أطول. المقارنة العادلة تحتاج مدة خدمة واحدة: مضاعف مشترك، أو فترة دراسة، أو قيمة سنوية.

- id: c03-a-07
  kind: concept
  part: A
  text: |
    ما الافتراض الذي تبنى عليه طريقة المضاعف المشترك؟ اذكر حالة لا يصح فيها.
  solution: |
    أن كل بديل يتكرر بنفس التكاليف والإيرادات حتى نهاية المدة. لا يصح عندما تتغير التقنية أو الأسعار كثيرا، أو عندما تحتاج الخدمة مدة محددة أقصر من المضاعف المشترك.

- id: c03-a-08
  kind: concept
  part: A
  text: |
    لماذا تعطي القيمة الحالية والقيمة السنوية نفس القرار دائما؟
  solution: |
    القيمة السنوية تساوي القيمة الحالية مضروبة في المعامل A/P، وهو رقم موجب. الضرب في رقم موجب لا يغير الإشارة ولا ترتيب البدائل التي لها نفس المدة.

- id: c03-a-09
  kind: concept
  part: A
  text: |
    ما عيوب فترة الاسترداد معيارا وحيدا لقبول المشاريع؟
  solution: |
    الفترة البسيطة تتجاهل قيمة المال مع الزمن. والفترتان تتجاهلان كل ما يحدث بعد الاسترداد، فمشروع يسترد بسرعة ثم يتوقف قد يفضل على مشروع أبطأ يعطي ربحا أكبر بكثير.

- id: c03-a-10
  kind: concept
  part: A
  text: |
    لماذا تستخدم التكلفة المرسملة لمشاريع مثل الطرق وشبكات المياه؟ وما معنى رقمها؟
  solution: |
    لأن هذه المشاريع تخدم مدة طويلة جدا، فنعاملها كأن عمرها بلا نهاية. رقمها هو المبلغ الذي يكفي اليوم لبناء المشروع وتمويل تكاليفه المتكررة إلى الأبد من فائدته.
