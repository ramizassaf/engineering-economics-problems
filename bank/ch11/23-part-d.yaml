items:

- id: c11-d-01
  kind: problem
  part: D
  vars: {wd: 0.40, kd: 0.08, ke: 0.15, t: 0.20}
  random: {wd: [0.1, 0.7, 0.05], kd: [0.05, 0.11, 0.005], ke: [0.10, 0.20, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ke = max(ke, kd + 0.03)
    - we = 1 - wd
    - W = wd*kd*(1 - t) + we*ke
  text: |
    شركة تمول [[wd|%]] من رأس مالها بالدين بتكلفة [[kd|%]] قبل الضريبة، والباقي بحقوق ملكية تكلفتها [[ke|%]]. الضريبة [[t|%]]. ما المتوسط المرجح لتكلفة رأس المال؟
  solution: |
    وزن حقوق الملكية [[we|%]].

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[ke|%]] = [[W|%2]]
    $$

- id: c11-d-02
  kind: problem
  part: D
  vars: {wd: 0.35, wp: 0.10, kd: 0.075, kp: 0.09, ke: 0.14, t: 0.20}
  random: {wd: [0.2, 0.5, 0.05], wp: [0.05, 0.15, 0.05], kd: [0.05, 0.10, 0.005], kp: [0.07, 0.12, 0.005], ke: [0.11, 0.18, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - kp = max(kp, kd + 0.005)
    - ke = max(ke, kp + 0.02)
    - we = 1 - wd - wp
    - W = wd*kd*(1 - t) + wp*kp + we*ke
  text: |
    هيكل تمويل شركة: دين [[wd|%]] بتكلفة [[kd|%]] قبل الضريبة، وأسهم ممتازة [[wp|%]] بتكلفة [[kp|%]]، والباقي أسهم عادية بتكلفة [[ke|%]]. الضريبة [[t|%]]. ما المتوسط المرجح؟
  solution: |
    وزن الأسهم العادية:

    $$
    1 - [[wd|f4]] - [[wp|f4]] = [[we|f4]]
    $$

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[wp|f4]] \times [[kp|%]] + [[we|f4]] \times [[ke|%]] = [[W|%2]]
    $$

    فقط الدين يضرب في واحد ناقص الضريبة.

- id: c11-d-03
  kind: problem
  part: D
  vars: {nb: 8000, pb: 1040, kd: 0.07, ns: 600000, ps: 22, ke: 0.13, t: 0.20}
  random: {nb: [2000, 20000, 500], pb: [920, 1080, 10], kd: [0.05, 0.10, 0.005], ns: [200000, 2000000, 50000], ps: [5, 50, 1], ke: [0.10, 0.18, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ke = max(ke, kd + 0.03)
    - Dm = nb*pb
    - Em = ns*ps
    - V = Dm + Em
    - wd = Dm/V
    - we = Em/V
    - W = wd*kd*(1 - t) + we*ke
  text: |
    شركة إسمنت لها [[nb|g]] سندا في السوق، سعر السند [[pb|g]] دينار، والعائد حتى الاستحقاق [[kd|%]]. ولها [[ns|g]] سهم بسعر [[ps|g]] دينار، وتكلفة حقوق الملكية [[ke|%]]. الضريبة [[t|%]]. احسب المتوسط المرجح بأوزان القيم السوقية.
  solution: |
    $$
    D = [[nb|g]] \times [[pb|g]] = [[Dm|g]] \qquad E = [[ns|g]] \times [[ps|g]] = [[Em|g]]
    $$

    $$
    w_d = \frac{[[Dm|g]]}{[[V|g]]} = [[wd|f4]] \qquad w_e = [[we|f4]]
    $$

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[ke|%]] = [[W|%2]]
    $$

    العائد حتى الاستحقاق هو تكلفة الدين الحالية، وليس نسبة الكوبون.

- id: c11-d-04
  kind: problem
  part: D
  vars: {wd: 0.45, kd: 0.09, ke: 0.15, t1: 0.20, t2: 0.15}
  random: {wd: [0.2, 0.6, 0.05], kd: [0.06, 0.11, 0.005], ke: [0.11, 0.19, 0.005], t1: [0.18, 0.35, 0.01], t2: [0.05, 0.17, 0.01]}
  calc:
    - ke = max(ke, kd + 0.03)
    - W1 = wd*kd*(1 - t1) + (1 - wd)*ke
    - W2 = wd*kd*(1 - t2) + (1 - wd)*ke
    - dW = W2 - W1
  text: |
    شركة تمول [[wd|%]] بالدين بتكلفة [[kd|%]]، والباقي بحقوق ملكية تكلفتها [[ke|%]]. الحكومة تخفض ضريبة الشركات من [[t1|%]] إلى [[t2|%]]. كيف يتغير المتوسط المرجح، إذا بقيت التكاليف الأخرى كما هي؟
  solution: |
    قبل التخفيض:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t1|%]]) + [[1-wd|f4]] \times [[ke|%]] = [[W1|%2]]
    $$

    بعده:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t2|%]]) + [[1-wd|f4]] \times [[ke|%]] = [[W2|%2]]
    $$

    يرتفع المتوسط [[dW|%2]]. الضريبة الأقل تعني وفرا أقل من الفائدة، فيصبح الدين أغلى بعد الضريبة. لكن الأرباح بعد الضريبة ترتفع، فالشركة تربح من التخفيض إجمالا.

- id: c11-d-05
  kind: problem
  part: D
  vars: {W: 0.11, wd: 0.30, kd: 0.08, t: 0.20}
  random: {W: [0.08, 0.14, 0.005], wd: [0.2, 0.6, 0.05], kd: [0.05, 0.10, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - W = max(W, kd*(1 - t) + 0.02)
    - ke = (W - wd*kd*(1 - t))/(1 - wd)
  text: |
    المتوسط المرجح لشركة [[W|%]]. تمول [[wd|%]] بالدين بتكلفة [[kd|%]] قبل الضريبة، والضريبة [[t|%]]. ما تكلفة حقوق الملكية؟
  solution: |
    من معادلة المتوسط:

    $$
    k_e = \frac{\mathrm{WACC} - w_d\,k_d\,(1 - t)}{w_e}
    $$

    $$
    k_e = \frac{[[W|%]] - [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]])}{[[1-wd|f4]]} = [[ke|%2]]
    $$

- id: c11-d-06
  kind: problem
  part: D
  vars: {de: 0.5, kd: 0.085, ke: 0.16, t: 0.20}
  random: {de: [0.2, 1.5, 0.1], kd: [0.05, 0.11, 0.005], ke: [0.11, 0.20, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ke = max(ke, kd + 0.03)
    - wd = de/(1 + de)
    - we = 1/(1 + de)
    - W = wd*kd*(1 - t) + we*ke
  text: |
    شركة تستهدف نسبة دين إلى حقوق ملكية [[de|g]]، أي [[de|g]] دينار دين لكل دينار من المالكين. تكلفة الدين [[kd|%]]، وحقوق الملكية [[ke|%]]، والضريبة [[t|%]]. ما المتوسط المرجح؟
  solution: |
    نسبة الدين إلى حقوق الملكية ليست وزن الدين. من كل [[1+de|g]] دينار تمويل، [[de|g]] دين:

    $$
    w_d = \frac{[[de|g]]}{1 + [[de|g]]} = [[wd|f4]] \qquad w_e = \frac{1}{1 + [[de|g]]} = [[we|f4]]
    $$

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[ke|%]] = [[W|%2]]
    $$

- id: c11-d-07
  kind: problem
  part: D
  vars: {Db: 4000000, Eb: 3000000, Dm: 3800000, Em: 9000000, kd: 0.08, ke: 0.14, t: 0.20}
  random: {Db: [1000000, 8000000, 250000], Eb: [1000000, 8000000, 250000], Em: [2000000, 20000000, 500000], kd: [0.05, 0.10, 0.005], ke: [0.10, 0.18, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ke = max(ke, kd + 0.03)
    - Dm = Db*0.95
    - wb = Db/(Db + Eb)
    - wm = Dm/(Dm + Em)
    - Wb = wb*kd*(1 - t) + (1 - wb)*ke
    - Wm = wm*kd*(1 - t) + (1 - wm)*ke
  text: |
    في قائمة المركز المالي لشركة: ديون [[Db|g]] دينار، وحقوق ملكية [[Eb|g]] دينار. القيمة السوقية للديون [[Dm|g]] دينار، وللأسهم [[Em|g]] دينار. تكلفة الدين [[kd|%]]، وحقوق الملكية [[ke|%]]، والضريبة [[t|%]]. احسب المتوسط المرجح بالطريقتين. أيهما تستخدم؟
  solution: |
    **القيم الدفترية:**

    $$
    w_d = \frac{[[Db|g]]}{[[Db+Eb|g]]} = [[wb|f4]]
    $$

    $$
    [[wb|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wb|f4]] \times [[ke|%]] = [[Wb|%2]]
    $$

    **القيم السوقية:**

    $$
    w_d = \frac{[[Dm|g]]}{[[Dm+Em|g]]} = [[wm|f4]]
    $$

    $$
    [[wm|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wm|f4]] \times [[ke|%]] = [[Wm|%2]]
    $$

    نستخدم القيم السوقية: [[Wm|%2]]. الأسهم في السوق تساوي [[Em/Eb|2]] ضعف قيمتها الدفترية، والمساهمون يطلبون العائد على قيمتها اليوم.

- id: c11-d-08
  kind: problem
  part: D
  vars: {RE: 1200000, we: 0.60, kd: 0.08, kr: 0.13, kn: 0.145, t: 0.20}
  random: {RE: [400000, 3000000, 100000], we: [0.4, 0.8, 0.05], kd: [0.05, 0.10, 0.005], kr: [0.10, 0.17, 0.005], kn: [0.11, 0.20, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - kr = max(kr, kd + 0.03)
    - kn = max(kn, kr + 0.01)
    - wd = 1 - we
    - W1 = wd*kd*(1 - t) + we*kr
    - W2 = wd*kd*(1 - t) + we*kn
    - BP = RE/we
  text: |
    شركة تحافظ على هيكل تمويل: [[wd|%]] دين و[[we|%]] حقوق ملكية. عندها أرباح محتجزة [[RE|g]] دينار هذه السنة، تكلفتها [[kr|%]]. إذا احتاجت أكثر، تصدر أسهما جديدة بتكلفة [[kn|%]]. تكلفة الدين [[kd|%]]، والضريبة [[t|%]]. (أ) ما المتوسط المرجح قبل نفاد الأرباح المحتجزة وبعده؟ (ب) عند أي حجم استثمار تنفد الأرباح المحتجزة؟
  solution: |
    (أ) قبل النفاد:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[kr|%]] = [[W1|%2]]
    $$

    بعده:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[kn|%]] = [[W2|%2]]
    $$

    (ب) كل دينار استثمار يحتاج [[we|f4]] دينار من حقوق الملكية. الأرباح المحتجزة تكفي حتى:

    $$
    \frac{[[RE|g]]}{[[we|f4]]} = [[BP|g]]
    $$

    أول [[BP|g]] دينار من الاستثمار بتكلفة [[W1|%2]]، وما بعدها بتكلفة [[W2|%2]].

- id: c11-d-09
  kind: problem
  part: D
  vars: {L: 500000, r: 0.08, n: 5, f: 0.02, P0: 20, D1: 1.2, g: 0.05, wd: 0.40, t: 0.20}
  random: {L: [200000, 900000, 50000], r: [0.06, 0.11, 0.005], n: [3, 8, 1], f: [0.01, 0.04, 0.005], P0: [10, 50, 1], D1: [0.4, 4, 0.1], g: [0.02, 0.07, 0.005], wd: [0.2, 0.6, 0.05], t: [0.15, 0.30, 0.01]}
  calc:
    - A = L*AP(r, n)
    - kd = RATE(n, A, L*(1 - f))
    - D1 = min(D1, floor(P0*0.08*10)/10)
    - D1 = max(D1, 0.3, ceil(P0*(kd + 0.02 - g)*10)/10)
    - ke = D1/P0 + g
    - W = wd*kd*(1 - t) + (1 - wd)*ke
  text: |
    شركة تمول [[wd|%]] بقرض و[[1-wd|%]] بأرباح محتجزة. القرض [[L|g]] دينار بفائدة [[r|%]] وأقساط سنوية متساوية على [[yrs(n)]]، ورسومه [[f|%]] عند الاستلام. سعر سهمها [[P0|g]] دينار، والتوزيع القادم [[D1|2]] دينار، والنمو [[g|%]]. الضريبة [[t|%]]. ما المتوسط المرجح؟
  solution: |
    **تكلفة الدين:**

    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    ```excel
    =RATE([[n|n]], -[[A|d2]], [[L*(1-f)|d2]])
    ```

    قبل الضريبة [[kd|%2]].

    **تكلفة حقوق الملكية:**

    $$
    k_e = \frac{[[D1|2]]}{[[P0|g]]} + [[g|%]] = [[ke|%2]]
    $$

    **المتوسط:**

    $$
    [[wd|f4]] \times [[kd|%2]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke|%2]] = [[W|%2]]
    $$

- id: c11-d-10
  kind: problem
  part: D
  vars: {wd: 0.40, kd: 0.09, ke: 0.15, t: 0.20, C: 800000, A: 210000, n: 6}
  random: {wd: [0.2, 0.6, 0.05], kd: [0.06, 0.11, 0.005], ke: [0.11, 0.19, 0.005], t: [0.15, 0.30, 0.01], C: [300000, 1500000, 50000], A: [50000, 500000, 5000], n: [4, 10, 1]}
  calc:
    - ke = max(ke, kd + 0.03)
    - W = wd*kd*(1 - t) + (1 - wd)*ke
    - A = floor(C*AP(W + 0.02, n)/5000 + 0.5)*5000
    - ip = RATE(n, A, C)
    - PW = -C + A*PA(W, n)
  text: |
    شركة تمول [[wd|%]] بالدين بتكلفة [[kd|%]]، والباقي بحقوق ملكية تكلفتها [[ke|%]]، والضريبة [[t|%]]. أمامها مشروع يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا بعد الضريبة لمدة [[yrs(n)]]. هل تقبله؟
  solution: |
    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke|%]] = [[W|%2]]
    $$

    القيمة الحالية بالمتوسط المرجح:

    $$
    PW = -[[C|g]] + [[A|g]]\,(P/A,\ [[W|%2]],\ [[n|n]]) = [[PW|2]]
    $$

    ```excel
    =RATE([[n|n]], [[A|r]], -[[C|r]])
    ```

    معدل المشروع [[ip|%2]]. القرار: [[pick(PW > 0, "يقبل، لأن معدله أعلى من تكلفة رأس المال", "يرفض، لأن معدله أقل من تكلفة رأس المال")]].

- id: c11-d-11
  kind: problem
  part: D
  vars: {kd: 0.08, ke0: 0.12, wd: 0.30, ke1: 0.135, t: 0.20}
  random: {kd: [0.05, 0.10, 0.005], ke0: [0.09, 0.15, 0.005], wd: [0.2, 0.5, 0.05], ke1: [0.10, 0.18, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ke0 = max(ke0, kd + 0.02)
    - ke1 = max(ke1, ke0 + 0.005)
    - W1 = wd*kd*(1 - t) + (1 - wd)*ke1
    - dW = W1 - ke0
  text: |
    شركة بلا ديون، تكلفة حقوق ملكيتها [[ke0|%]]. تدرس أن تمول [[wd|%]] بالدين بتكلفة [[kd|%]]. مستشارها يقدر أن تكلفة حقوق الملكية ترتفع إلى [[ke1|%]] بسبب المخاطرة. الضريبة [[t|%]]. هل ينخفض المتوسط المرجح؟
  solution: |
    بدون دين، المتوسط هو تكلفة حقوق الملكية: [[ke0|%]].

    مع الدين:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke1|%]] = [[W1|%2]]
    $$

    التغير [[dW|%2]]. [[pick(dW < 0, "المتوسط ينخفض: وفر الدين الرخيص أكبر من ارتفاع تكلفة حقوق الملكية.", "المتوسط لا ينخفض: ارتفاع تكلفة حقوق الملكية يلغي وفر الدين الرخيص.")]]

- id: c11-d-12
  kind: problem
  part: D
  vars: {wb: 0.25, kb: 0.07, wo: 0.20, ko: 0.085, ke: 0.14, t: 0.20}
  random: {wb: [0.1, 0.3, 0.05], kb: [0.05, 0.09, 0.005], wo: [0.1, 0.3, 0.05], ko: [0.06, 0.11, 0.005], ke: [0.11, 0.18, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ke = max(ke, ko + 0.03, kb + 0.03)
    - we = 1 - wb - wo
    - W = wb*kb*(1 - t) + wo*ko*(1 - t) + we*ke
  text: |
    شركة تمول [[wb|%]] بقرض بنكي بتكلفة [[kb|%]]، و[[wo|%]] بسندات عائدها حتى الاستحقاق [[ko|%]]، والباقي بحقوق ملكية تكلفتها [[ke|%]]. الضريبة [[t|%]]. ما المتوسط المرجح؟
  solution: |
    وزن حقوق الملكية:

    $$
    1 - [[wb|f4]] - [[wo|f4]] = [[we|f4]]
    $$

    كل نوع دين يضرب في واحد ناقص الضريبة:

    $$
    [[wb|f4]] \times [[kb|%]] \times (1 - [[t|%]]) + [[wo|f4]] \times [[ko|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[ke|%]] = [[W|%2]]
    $$

- id: c11-d-13
  kind: problem
  part: D
  vars: {W: 0.105, f: 0.03}
  random: {W: [0.08, 0.14, 0.005], f: [0.01, 0.06, 0.005]}
  calc:
    - Wr = (1 + W)/(1 + f) - 1
  text: |
    المتوسط المرجح لتكلفة رأس المال لشركة [[W|%]]، محسوب من نسب السوق التي تشمل التضخم. التضخم المتوقع [[f|%]]. الشركة تقدر تدفقات مشروع بالدينار الثابت. بأي نسبة تخصمها؟
  solution: |
    نسب السوق، مثل العائد حتى الاستحقاق وعائد المساهمين، تشمل التضخم. تدفقات بالدينار الثابت تخصم بنسبة حقيقية، كما في الفصل الثامن:

    $$
    i' = \frac{1 + [[W|%]]}{1 + [[f|%]]} - 1 = [[Wr|%2]]
    $$

    خصم تدفقات ثابتة بنسبة سوقية يرفض مشاريع جيدة.
