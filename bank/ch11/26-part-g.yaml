items:

- id: c11-g-01
  kind: problem
  part: G
  vars: {V: 2000000, EBIT: 300000, wd: 0.5, r: 0.08, t: 0.20}
  random: {V: [500000, 5000000, 100000], EBIT: [50000, 900000, 10000], wd: [0.2, 0.7, 0.1], r: [0.05, 0.11, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - EBIT = max(EBIT, V*0.10)
    - EBIT = min(EBIT, V*0.25)
    - D = wd*V
    - E = V - D
    - I = r*D
    - R0 = EBIT*(1 - t)/V
    - R1 = (EBIT - I)*(1 - t)/E
  text: |
    أصول شركة [[V|g]] دينار، وربحها التشغيلي قبل الفائدة والضريبة [[EBIT|g]] دينار. الضريبة [[t|%]]. احسب العائد على حقوق الملكية إذا مولت كل الأصول من مال المالكين، ثم إذا مولت [[wd|%]] منها بقرض فائدته [[r|%]].
  solution: |
    **بدون دين:**

    $$
    \frac{[[EBIT|g]] \times (1 - [[t|%]])}{[[V|g]]} = [[R0|%2]]
    $$

    **مع الدين:** الفائدة:

    $$
    [[r|%]] \times [[D|g]] = [[I|g]]
    $$

    $$
    \frac{([[EBIT|g]] - [[I|g]]) \times (1 - [[t|%]])}{[[E|g]]} = [[R1|%2]]
    $$

    [[pick(R1 > R0, "الدين رفع العائد، لأن الأصول تعطي أكثر من تكلفة الدين بعد الضريبة.", "الدين خفض العائد، لأن الأصول تعطي أقل من تكلفة الدين بعد الضريبة.")]]

- id: c11-g-02
  kind: problem
  part: G
  vars: {C: 300000, CF: 95000, wd: 0.5, r: 0.09, t: 0.20, ke: 0.16}
  random: {C: [100000, 800000, 20000], CF: [30000, 300000, 1000], wd: [0.3, 0.6, 0.1], r: [0.06, 0.11, 0.005], t: [0.15, 0.30, 0.01], ke: [0.12, 0.20, 0.005]}
  calc:
    - CF = floor(C*AP(0.13, 4)/1000 + 0.5)*1000
    - L = wd*C
    - A = L*AP(r, 4)
    - I1 = r*L
    - B1 = L - (A - I1)
    - I2 = r*B1
    - B2 = B1 - (A - I2)
    - I3 = r*B2
    - B3 = B2 - (A - I3)
    - I4 = r*B3
    - E1 = CF - A + t*I1
    - E2 = CF - A + t*I2
    - E3 = CF - A + t*I3
    - E4 = CF - A + t*I4
    - PE = -(C - L) + E1*PF(ke, 1) + E2*PF(ke, 2) + E3*PF(ke, 3) + E4*PF(ke, 4)
  text: |
    مشروع يكلف [[C|g]] دينار، وتدفقه التشغيلي بعد الضريبة [[CF|g]] دينار سنويا لمدة 4 سنوات. الشركة تقترض [[wd|%]] من الاستثمار بفائدة [[r|%]] وأربعة أقساط سنوية متساوية. الضريبة [[t|%]]، وتكلفة حقوق الملكية [[ke|%]]. ما القيمة الحالية لتدفقات المالكين؟
  solution: |
    $$
    L = [[wd|%]] \times [[C|g]] = [[L|g]] \qquad A = [[L|g]]\,(A/P,\ [[r|%]],\ 4) = [[A|2]]
    $$

    تدفق المالكين كل سنة:

    $$
    CF - A + t\,I
    $$

    | السنة | الفائدة | تدفق المالكين |
    | --- | --- | --- |
    | 0 | | [[-(C-L)|0]] |
    | 1 | [[I1|0]] | [[E1|0]] |
    | 2 | [[I2|0]] | [[E2|0]] |
    | 3 | [[I3|0]] | [[E3|0]] |
    | 4 | [[I4|0]] | [[E4|0]] |

    نخصم بتكلفة حقوق الملكية، لأن هذه تدفقات المالكين وحدهم:

    ```excel
    =NPV([[ke|%]], C2:C5) + C1
    ```

    القيمة الحالية [[PE|2]] دينار.

- id: c11-g-03
  kind: problem
  part: G
  vars: {C: 240000, CF: 100000, L: 120000, r: 0.08, t: 0.20, ke: 0.15}
  random: {C: [100000, 600000, 20000], CF: [40000, 300000, 1000], L: [40000, 400000, 10000], r: [0.06, 0.11, 0.005], t: [0.15, 0.30, 0.01], ke: [0.12, 0.20, 0.005]}
  calc:
    - CF = floor(C*AP(0.14, 3)/1000 + 0.5)*1000
    - L = min(L, C*0.7)
    - I = r*L
    - E1 = CF - I*(1 - t)
    - E3 = CF - I*(1 - t) - L
    - PE = -(C - L) + E1*PF(ke, 1) + E1*PF(ke, 2) + E3*PF(ke, 3)
  text: |
    مشروع لثلاث سنوات يكلف [[C|g]] دينار، وتدفقه التشغيلي بعد الضريبة [[CF|g]] دينار سنويا. الشركة تقترض [[L|g]] دينار تدفع فائدتها [[r|%]] سنويا، وترد أصلها في السنة 3. الضريبة [[t|%]]. اكتب تدفقات المالكين، واحسب قيمتها الحالية بتكلفة حقوق ملكية [[ke|%]].
  solution: |
    الفائدة [[I|g]] دينار، وتكلفتها بعد الضريبة:

    $$
    [[I|g]] \times (1 - [[t|%]]) = [[I*(1-t)|g]]
    $$

    | السنة | تدفق المالكين |
    | --- | --- |
    | 0 | [[-(C-L)|0]] |
    | 1 | [[E1|0]] |
    | 2 | [[E1|0]] |
    | 3 | [[E3|0]] |

    $$
    PW = [[-(C-L)|g]] + [[E1|0]]\,(P/F,\ [[ke|%]],\ 1) + [[E1|0]]\,(P/F,\ [[ke|%]],\ 2) + [[E3|0]]\,(P/F,\ [[ke|%]],\ 3) = [[PE|2]]
    $$

    [[pick(E3 < 0, "تدفق السنة الأخيرة سالب، فالإشارة تتغير أكثر من مرة، وقد يكون لتدفقات المالكين أكثر من معدل عائد. القيمة الحالية تبقى صحيحة.", "سداد الأصل في النهاية يخفض تدفق السنة الأخيرة كثيرا، لكنه بقي موجبا.")]]

- id: c11-g-04
  kind: problem
  part: G
  vars: {E0: 150000, E1: 52000, n: 4, W: 0.10, ke: 0.16}
  random: {E0: [50000, 400000, 10000], E1: [10000, 200000, 1000], n: [3, 8, 1], W: [0.08, 0.12, 0.005], ke: [0.13, 0.22, 0.005]}
  calc:
    - E1 = floor(E0*AP(ke - 0.015, n)/1000 + 0.5)*1000
    - P1 = -E0 + E1*PA(W, n)
    - P2 = -E0 + E1*PA(ke, n)
  text: |
    محلل حسب تدفقات المالكين لمشروع ممول جزئيا بقرض: يدفعون [[E0|g]] دينار اليوم، ويأخذون [[E1|g]] دينار سنويا لمدة [[yrs(n)]]. خصمها بالمتوسط المرجح للشركة [[W|%]]. تكلفة حقوق الملكية [[ke|%]]. ما الخطأ؟ وما القيمة الصحيحة؟
  solution: |
    حساب المحلل:

    $$
    -[[E0|g]] + [[E1|g]]\,(P/A,\ [[W|%]],\ [[n|n]]) = [[P1|2]]
    $$

    المتوسط المرجح يشمل الدين الرخيص، وتدفقات المالكين طرح منها القرض وفائدته. أثر الدين حسب مرتين. الصحيح أن نخصم بتكلفة حقوق الملكية:

    $$
    -[[E0|g]] + [[E1|g]]\,(P/A,\ [[ke|%]],\ [[n|n]]) = [[P2|2]]
    $$

    [[pick(P2 < 0, "المشروع الذي بدا رابحا يخسر مال المالكين.", "المشروع مقبول بالطريقتين، لكن قيمته أقل بكثير مما حسبه المحلل.")]]

- id: c11-g-05
  kind: problem
  part: G
  vars: {roa: 0.07, kd: 0.10, t: 0.25}
  random: {roa: [0.03, 0.12, 0.005], kd: [0.05, 0.12, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ka = kd*(1 - t)
  text: |
    أصول شركة تعطي عائدا بعد الضريبة [[roa|%]] قبل أي فائدة. تستطيع الاقتراض بفائدة [[kd|%]]، والضريبة [[t|%]]. هل يرفع الدين عائد المالكين؟
  solution: |
    الدين يرفع عائد المالكين إذا كانت الأصول تعطي أكثر من تكلفة الدين بعد الضريبة:

    $$
    [[kd|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    الأصول تعطي [[roa|%]]. [[pick(roa > ka, "الدين يرفع عائد المالكين: كل دينار مقترض يعطي أكثر مما يكلف.", "الدين يخفض عائد المالكين: كل دينار مقترض يكلف أكثر مما يعطي. هذه رافعة سالبة.")]]

- id: c11-g-06
  kind: problem
  part: G
  vars: {C: 450000, irr0: 0.14, wd: 0.5, r: 0.08, t: 0.20}
  random: {C: [150000, 900000, 50000], irr0: [0.10, 0.20, 0.01], wd: [0.3, 0.7, 0.1], r: [0.05, 0.11, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - CF = floor(C*AP(irr0, 3)/1000 + 0.5)*1000
    - ip = RATE(3, CF, C)
    - L = wd*C
    - A = L*AP(r, 3)
    - I1 = r*L
    - B1 = L - (A - I1)
    - I2 = r*B1
    - B2 = B1 - (A - I2)
    - I3 = r*B2
    - E1 = CF - A + t*I1
    - E2 = CF - A + t*I2
    - E3 = CF - A + t*I3
    - ie = IRR([-(C - L), E1, E2, E3])
  text: |
    مشروع يكلف [[C|g]] دينار، وتدفقه التشغيلي بعد الضريبة [[CF|g]] دينار سنويا لمدة 3 سنوات. الشركة تقترض [[wd|%]] من الاستثمار بفائدة [[r|%]]، وثلاثة أقساط سنوية متساوية. الضريبة [[t|%]]. ما معدل عائد المشروع؟ وما معدل عائد المالكين؟
  solution: |
    ```excel
    =RATE(3, [[CF|r]], -[[C|r]])
    ```

    معدل المشروع [[ip|%2]].

    $$
    L = [[L|g]] \qquad A = [[L|g]]\,(A/P,\ [[r|%]],\ 3) = [[A|2]]
    $$

    | السنة | الفائدة | تدفق المالكين |
    | --- | --- | --- |
    | 0 | | [[-(C-L)|0]] |
    | 1 | [[I1|0]] | [[E1|0]] |
    | 2 | [[I2|0]] | [[E2|0]] |
    | 3 | [[I3|0]] | [[E3|0]] |

    ```excel
    =IRR(C1:C4)
    ```

    معدل المالكين [[ie|%2]]. الفرق سببه أن المشروع يعطي أكثر من تكلفة القرض بعد الضريبة، [[r*(1-t)|%2]].

- id: c11-g-07
  kind: problem
  part: G
  vars: {EBIT: 500000, I: 200000, x: 0.20}
  random: {EBIT: [200000, 2000000, 50000], I: [20000, 800000, 10000], x: [0.05, 0.30, 0.05]}
  calc:
    - I = min(I, EBIT*0.7)
    - L = EBIT/(EBIT - I)
    - dR = L*x
  text: |
    الربح التشغيلي لشركة [[EBIT|g]] دينار، والفائدة على ديونها [[I|g]] دينار. إذا انخفض الربح التشغيلي [[x|%]]، فبكم ينخفض صافي الربح؟ وماذا لو لم يكن عليها دين؟
  solution: |
    صافي الربح يتناسب مع الربح التشغيلي ناقص الفائدة، لأن الضريبة نسبة ثابتة منه. الفائدة ثابتة، فكل التغير يقع على الباقي:

    $$
    \frac{\mathrm{EBIT}}{\mathrm{EBIT} - I} = \frac{[[EBIT|g]]}{[[EBIT|g]] - [[I|g]]} = [[L|f4]]
    $$

    $$
    [[L|f4]] \times [[x|%]] = [[dR|%2]]
    $$

    ينخفض صافي الربح [[dR|%2]]. بدون دين ينخفض [[x|%]] فقط. هذا معنى أن الدين يرفع مخاطرة المالكين.

- id: c11-g-08
  kind: problem
  part: G
  vars: {L: 600000, r: 0.09, n: 6, CF: 170000, m: 1.3}
  random: {L: [200000, 1500000, 50000], r: [0.06, 0.12, 0.005], n: [3, 10, 1], CF: [50000, 500000, 5000], m: [1.2, 1.5, 0.05]}
  calc:
    - A = L*AP(r, n)
    - CF = floor(A*1.35/5000 + 0.5)*5000
    - DS = CF/A
    - Lmax = CF/m*PA(r, n)
  text: |
    مصنع يطلب قرضا [[L|g]] دينار بفائدة [[r|%]] وأقساط سنوية متساوية على [[yrs(n)]]. تدفقه التشغيلي السنوي [[CF|g]] دينار. البنك يشترط أن يكون التدفق [[m|g]] ضعف القسط على الأقل. هل يوافق البنك؟ وما أكبر قرض يقبله؟
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    $$
    \frac{[[CF|g]]}{[[A|2]]} = [[DS|2]]
    $$

    [[pick(DS >= m, "النسبة تحقق الشرط، فيوافق البنك.", "النسبة أقل من الشرط، فلا يوافق البنك على هذا المبلغ.")]] أكبر قسط مسموح:

    $$
    \frac{[[CF|g]]}{[[m|g]]} = [[CF/m|2]]
    $$

    أكبر قرض:

    $$
    [[CF/m|2]]\,(P/A,\ [[r|%]],\ [[n|n]]) = [[Lmax|2]]
    $$

- id: c11-g-09
  kind: problem
  part: G
  vars: {C: 400000, irr0: 0.05, wd: 0.4, r: 0.10, t: 0.20}
  random: {C: [150000, 900000, 50000], irr0: [0.03, 0.06, 0.005], wd: [0.3, 0.5, 0.1], r: [0.09, 0.13, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - CF = floor(C*AP(irr0, 4)/1000 + 0.5)*1000
    - ip = RATE(4, CF, C)
    - L = wd*C
    - A = L*AP(r, 4)
    - I1 = r*L
    - B1 = L - (A - I1)
    - I2 = r*B1
    - B2 = B1 - (A - I2)
    - I3 = r*B2
    - B3 = B2 - (A - I3)
    - I4 = r*B3
    - E1 = CF - A + t*I1
    - E2 = CF - A + t*I2
    - E3 = CF - A + t*I3
    - E4 = CF - A + t*I4
    - ie = IRR([-(C - L), E1, E2, E3, E4], -0.5, 1.0)
    - ka = r*(1 - t)
  text: |
    مشروع ضعيف يكلف [[C|g]] دينار، ويعطي [[CF|g]] دينار سنويا بعد الضريبة لمدة 4 سنوات. المدير يقترح تمويل [[wd|%]] منه بقرض فائدته [[r|%]] بأقساط متساوية، ليرفع عائد المالكين. الضريبة [[t|%]]. هل ينجح اقتراحه؟
  solution: |
    ```excel
    =RATE(4, [[CF|r]], -[[C|r]])
    ```

    معدل المشروع [[ip|%2]]. تكلفة القرض بعد الضريبة:

    $$
    [[r|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    القسط:

    $$
    [[L|g]]\,(A/P,\ [[r|%]],\ 4) = [[A|2]]
    $$

    | السنة | تدفق المالكين |
    | --- | --- |
    | 0 | [[-(C-L)|0]] |
    | 1 | [[E1|0]] |
    | 2 | [[E2|0]] |
    | 3 | [[E3|0]] |
    | 4 | [[E4|0]] |

    معدل المالكين [[ie|%2]]، أقل من معدل المشروع. القرض يكلف أكثر مما يعطي المشروع، فيأخذ من حصة المالكين. الرافعة تعمل في الاتجاهين.
