# ------------------------------------------------------------ cost of a loan with a fee
- id: c11-ex-loan-fee
  kind: example
  title: |
    تكلفة قرض عليه رسوم
  vars: {L: 200000, r: 0.09, n: 5, f: 0.02, t: 0.20}
  random: {L: [100000, 500000, 10000], r: [0.06, 0.12, 0.005], n: [3, 8, 1], f: [0.01, 0.04, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - A = L*AP(r, n)
    - N = L*(1 - f)
    - kb = RATE(n, A, N)
    - ka = kb*(1 - t)
  text: |
    شركة تقترض [[L|g]] دينار بفائدة [[r|%]] سنويا، تسدد بأقساط سنوية متساوية على [[yrs(n)]]. البنك يأخذ رسوم إصدار [[f|%]] من القرض عند الاستلام. نسبة الضريبة [[t|%]]. ما تكلفة القرض قبل الضريبة وبعدها؟
  solution: |
    القسط محسوب على القرض كاملا:

    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    لكن الشركة تستلم القرض ناقص الرسوم:

    $$
    [[L|g]] \times (1 - [[f|%]]) = [[N|2]]
    $$

    تكلفة القرض هي النسبة التي تجعل القيمة الحالية للأقساط تساوي ما استلمته الشركة:

    $$
    [[A|2]]\,(P/A,\ k_d,\ [[n|n]]) = [[N|2]]
    $$

    ```excel
    =RATE([[n|n]], -[[A|d2]], [[N|d2]])
    ```

    النتيجة [[kb|%2]]، أعلى من نسبة الفائدة المعلنة [[r|%]] بسبب الرسوم. بعد الضريبة:

    $$
    k_d\,(1 - t) = [[kb|%2]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    هذه تكلفة الدين التي تدخل في المتوسط المرجح لاحقا.

# ------------------------------------------------------------ bond yield
- id: c11-ex-bond
  kind: example
  title: |
    تكلفة الدين بالسندات
  vars: {c: 0.07, n: 10, y0: 0.078, fee: 20, t: 0.20}
  random: {c: [0.05, 0.10, 0.005], n: [5, 20, 1], y0: [0.04, 0.12, 0.002], fee: [10, 30, 5], t: [0.15, 0.30, 0.01]}
  calc:
    - C = 1000*c
    - P = floor((C*PA(y0, n) + 1000*PF(y0, n))/5 + 0.5)*5
    - Pn = P - fee
    - kd = YTM(n, C, 1000, Pn)
    - ka = kd*(1 - t)
    - chk = C*PA(kd, n) + 1000*PF(kd, n)
  text: |
    شركة تصدر سندات جديدة. القيمة الاسمية للسند 1,000 دينار، تستحق بعد [[yrs(n)]]، ونسبة الكوبون [[c|%]] تدفع في نهاية كل سنة. سعر السند في السوق [[P|g]] دينار، وتكاليف الإصدار [[fee|g]] دينار لكل سند. نسبة الضريبة [[t|%]]. ما تكلفة الدين بالسندات قبل الضريبة وبعدها؟
  solution: |
    الكوبون السنوي:

    $$
    C = [[c|%]] \times 1000 = [[C|g]]
    $$

    الشركة تستلم من كل سند سعره ناقص تكاليف الإصدار:

    $$
    [[P|g]] - [[fee|g]] = [[Pn|g]]
    $$

    مقابل ذلك تدفع [[C|g]] دينار كل سنة، و1,000 دينار في السنة [[n|n]]. تكلفة الدين هي النسبة التي تجعل القيمة الحالية لهذه الدفعات تساوي [[Pn|g]]:

    $$
    [[C|g]]\,(P/A,\ k_d,\ [[n|n]]) + 1000\,(P/F,\ k_d,\ [[n|n]]) = [[Pn|g]]
    $$

    لا يوجد حل مباشر لهذه المعادلة. نحلها بالتجربة، أو بالدالة RATE:

    ```excel
    =RATE([[n|n]], [[C|r]], -[[Pn|r]], 1000)
    ```

    النتيجة [[kd|%2]]. نتحقق:

    $$
    [[C|g]]\,(P/A,\ [[kd|%2]],\ [[n|n]]) + 1000\,(P/F,\ [[kd|%2]],\ [[n|n]]) = [[chk|2]]
    $$

    بعد الضريبة:

    $$
    [[kd|%2]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    إذا كان السعر الصافي أقل من 1,000، تكون التكلفة أعلى من نسبة الكوبون، لأن الشركة تستلم أقل وترد 1,000 كاملة.

# ------------------------------------------------------------ dividend growth model
- id: c11-ex-gordon
  kind: example
  title: |
    تكلفة حقوق الملكية بنموذج نمو التوزيعات
  vars: {P0: 25, dy: 0.06, g: 0.05, f: 0.06}
  random: {P0: [10, 60, 1], dy: [0.03, 0.08, 0.005], g: [0.02, 0.08, 0.005], f: [0.03, 0.10, 0.01]}
  calc:
    - D0 = floor(P0*dy/(1 + g)*100 + 0.5)/100
    - D1 = D0*(1 + g)
    - kr = D1/P0 + g
    - kn = D1/(P0*(1 - f)) + g
  text: |
    سعر سهم شركة اليوم [[P0|g]] دينار. آخر توزيع دفعته [[D0|2]] دينار للسهم، وتتوقع أن تنمو التوزيعات [[g|%]] سنويا. ما تكلفة الأرباح المحتجزة؟ وما تكلفة أسهم جديدة إذا كانت تكاليف إصدارها [[f|%]] من سعرها؟
  solution: |
    التوزيع المتوقع بعد سنة:

    $$
    \mathrm{Div}_1 = [[D0|2]] \times (1 + [[g|%]]) = [[D1|4]]
    $$

    **الأرباح المحتجزة:** بدون تكاليف إصدار:

    $$
    k_e = \frac{[[D1|4]]}{[[P0|g]]} + [[g|%]] = [[kr|%2]]
    $$

    **أسهم جديدة:** الشركة تستلم من كل سهم سعره ناقص تكاليف الإصدار:

    $$
    k_e = \frac{[[D1|4]]}{[[P0|g]] \times (1 - [[f|%]])} + [[g|%]] = [[kn|%2]]
    $$

    الأسهم الجديدة أغلى من الأرباح المحتجزة. لذلك تمول الشركات مشاريعها من الأرباح المحتجزة أولا، ثم تصدر أسهما جديدة إذا لم تكف.

# ------------------------------------------------------------ CAPM
- id: c11-ex-capm
  kind: example
  title: |
    تكلفة حقوق الملكية بنموذج تسعير الأصول الرأسمالية
  vars: {rf: 0.04, rm: 0.11, b: 1.3}
  random: {rf: [0.02, 0.06, 0.005], rm: [0.08, 0.14, 0.005], b: [0.6, 1.8, 0.1]}
  calc:
    - ke = rf + b*(rm - rf)
    - k2 = rf + 0.8*(rm - rf)
  text: |
    العائد على سندات الحكومة القصيرة [[rf|%]]، والعائد المتوقع للسوق [[rm|%]]. معامل بيتا لسهم شركة [[b|g]]. ما تكلفة حقوق الملكية؟ وما تكلفتها لشركة أخرى بيتا سهمها 0.8؟
  solution: |
    علاوة مخاطرة السوق هي ما يزيد به عائد السوق على العائد الخالي من المخاطرة:

    $$
    r_m - r_f = [[rm|%]] - [[rf|%]] = [[rm-rf|%]]
    $$

    الشركة الأولى:

    $$
    k_e = [[rf|%]] + [[b|g]] \times [[rm-rf|%]] = [[ke|%2]]
    $$

    الشركة الثانية:

    $$
    k_e = [[rf|%]] + 0.8 \times [[rm-rf|%]] = [[k2|%2]]
    $$

    السهم الذي يتحرك أكثر من السوق أخطر على المساهم، فيطلب عليه عائدا أعلى.

# ------------------------------------------------------------ WACC
- id: c11-ex-wacc
  kind: example
  title: |
    المتوسط المرجح بالقيم السوقية والدفترية
  vars: {nb: 20000, pb: 980, kd: 0.08, ns: 1000000, ps: 15, ke: 0.14, t: 0.20, be: 6}
  random: {nb: [10000, 40000, 1000], pb: [900, 1100, 10], kd: [0.05, 0.10, 0.005], ns: [500000, 3000000, 100000], ps: [5, 40, 1], ke: [0.10, 0.20, 0.005], t: [0.15, 0.30, 0.01], be: [2, 10, 0.5]}
  calc:
    - ke = max(ke, kd + 0.03)
    - Dm = nb*pb
    - Em = ns*ps
    - V = Dm + Em
    - wd = Dm/V
    - we = Em/V
    - W = wd*kd*(1 - t) + we*ke
    - Db = nb*1000
    - Eb = ns*be
    - Vb = Db + Eb
    - wdb = Db/Vb
    - web = Eb/Vb
    - Wb = wdb*kd*(1 - t) + web*ke
  text: |
    شركة عندها [[nb|g]] سندا، قيمة كل منها الاسمية 1,000 دينار وسعرها في السوق [[pb|g]] دينار، وتكلفة دينها قبل الضريبة [[kd|%]]. وعندها [[ns|g]] سهم، سعر السهم [[ps|g]] دينار، وتكلفة حقوق الملكية [[ke|%]]. قيمة حقوق الملكية الدفترية [[be|g]] دينار للسهم. نسبة الضريبة [[t|%]]. احسب المتوسط المرجح لتكلفة رأس المال بأوزان القيم السوقية، ثم بأوزان القيم الدفترية.
  solution: |
    **القيم السوقية:**

    $$
    D = [[nb|g]] \times [[pb|g]] = [[Dm|g]]
    $$

    $$
    E = [[ns|g]] \times [[ps|g]] = [[Em|g]]
    $$

    $$
    w_d = \frac{[[Dm|g]]}{[[V|g]]} = [[wd|f4]] \qquad w_e = \frac{[[Em|g]]}{[[V|g]]} = [[we|f4]]
    $$

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[we|f4]] \times [[ke|%]] = [[W|%2]]
    $$

    **القيم الدفترية:** الدين بقيمته الاسمية، وحقوق الملكية بقيمتها في الدفاتر:

    $$
    D = [[nb|g]] \times 1000 = [[Db|g]] \qquad E = [[ns|g]] \times [[be|g]] = [[Eb|g]]
    $$

    $$
    \mathrm{WACC} = [[wdb|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[web|f4]] \times [[ke|%]] = [[Wb|%2]]
    $$

    الفرق بين النتيجتين سببه الأوزان فقط. نستخدم القيم السوقية، لأنها ما يدفعه المستثمرون اليوم مقابل حصصهم، وعليها يطلبون العائد.

# ------------------------------------------------------------ capital structure
- id: c11-ex-structure
  kind: example
  title: |
    أفضل نسبة دين
  vars: {t: 0.20}
  calc:
    - W0 = 0.12
    - W2 = 0.2*0.07*(1 - t) + 0.8*0.13
    - W4 = 0.4*0.08*(1 - t) + 0.6*0.15
    - W6 = 0.6*0.11*(1 - t) + 0.4*0.19
  text: |
    شركة تدرس أربع نسب للدين في تمويلها. قدر مستشارها المالي تكلفة الدين قبل الضريبة وتكلفة حقوق الملكية لكل نسبة:

    | نسبة الدين | تكلفة الدين | تكلفة حقوق الملكية |
    | --- | --- | --- |
    | 0% | لا يوجد | 12% |
    | 20% | 7% | 13% |
    | 40% | 8% | 15% |
    | 60% | 11% | 19% |

    نسبة الضريبة [[t|%]]. أي نسبة دين تعطي أقل متوسط مرجح لتكلفة رأس المال؟
  solution: |
    نحسب المتوسط لكل نسبة:

    $$
    \mathrm{WACC} = w_d\,k_d\,(1 - t) + w_e\,k_e
    $$

    $$
    0.2 \times 7\% \times (1 - [[t|%]]) + 0.8 \times 13\% = [[W2|%2]]
    $$

    $$
    0.4 \times 8\% \times (1 - [[t|%]]) + 0.6 \times 15\% = [[W4|%2]]
    $$

    $$
    0.6 \times 11\% \times (1 - [[t|%]]) + 0.4 \times 19\% = [[W6|%2]]
    $$

    | نسبة الدين | المتوسط المرجح |
    | --- | --- |
    | 0% | [[W0|%2]] |
    | 20% | [[W2|%2]] |
    | 40% | [[W4|%2]] |
    | 60% | [[W6|%2]] |

    الأقل [[min(W0, W2, W4, W6)|%2]]. القليل من الدين يخفض المتوسط، لأن الدين أرخص ويوفر ضريبة. بعد حد معين ترتفع تكلفة الدين وحقوق الملكية معا بسبب المخاطرة، فيرتفع المتوسط.

# ------------------------------------------------------------ MARR with a limited budget
- id: c11-ex-marr-budget
  kind: example
  title: |
    الحد الأدنى للعائد مع ميزانية محدودة
  text: |
    المتوسط المرجح لتكلفة رأس المال لشركة 10%. أمامها ستة مشاريع مستقلة، كلها بمخاطرة الشركة المعتادة:

    | المشروع | الاستثمار | معدل العائد |
    | --- | --- | --- |
    | أ | 300,000 | 22% |
    | ب | 250,000 | 18% |
    | ج | 200,000 | 15% |
    | د | 350,000 | 13% |
    | هـ | 150,000 | 11% |
    | و | 200,000 | 9% |

    (أ) أي المشاريع تقبل إذا لم تكن هناك حدود على التمويل؟ (ب) أي المشاريع تقبل إذا كانت الميزانية 750,000 دينار؟ وما الحد الأدنى للعائد في هذه الحالة؟
  solution: |
    (أ) بدون حد للتمويل، الحد الأدنى هو المتوسط المرجح 10%. نقبل كل مشروع معدله أعلى من 10%: أ وب وج ود وهـ، باستثمار 1,250,000 دينار. المشروع و يرفض، لأنه يعطي أقل مما يطلبه مقدمو المال.

    (ب) نرتب المشاريع حسب المعدل، ونقبل من الأعلى حتى تنتهي الميزانية:

    | المشروع | المعدل | الاستثمار المتراكم |
    | --- | --- | --- |
    | أ | 22% | 300,000 |
    | ب | 18% | 550,000 |
    | ج | 15% | 750,000 |
    | د | 13% | لا يتسع |

    نقبل أ وب وج. أفضل مشروع رفضناه هو د بمعدل 13%. أي مشروع جديد يجب أن يعطي أكثر من 13% حتى يستحق أن يأخذ مكان أحد المشاريع المقبولة. الحد الأدنى للعائد هنا 13%، وهو تكلفة الفرصة البديلة، وأعلى من المتوسط المرجح.

    الترتيب بالمعدل يعمل هنا لأن المشاريع ملأت الميزانية بالضبط. إذا بقي جزء منها بلا استخدام، نختار المجموعة بأعلى قيمة حالية، كما في @sec-budget.

# ------------------------------------------------------------ risk classes
- id: c11-ex-risk-class
  kind: example
  title: |
    حد أدنى لكل صنف مخاطرة
  vars: {W: 0.10}
  random: {W: [0.08, 0.13, 0.005]}
  calc:
    - m1 = W
    - m2 = W + 0.03
    - m3 = W + 0.06
    - i1 = W + 0.02
    - i2 = W + 0.025
    - i3 = W + 0.07
  text: |
    المتوسط المرجح لتكلفة رأس المال لشركة [[W|%]]. الشركة تضيف علاوة مخاطرة حسب صنف المشروع: لا شيء لمشاريع خفض التكاليف، و3% لتوسعة منتج قائم، و6% لمنتج جديد. أمامها ثلاثة مشاريع: خفض تكاليف بمعدل [[i1|%]]، وتوسعة بمعدل [[i2|%]]، ومنتج جديد بمعدل [[i3|%]]. أيها تقبل؟ وماذا يحدث لو استخدمت حدا أدنى واحدا لكل المشاريع؟
  solution: |
    الحد الأدنى لكل صنف:

    | المشروع | الصنف | الحد الأدنى | المعدل | القرار |
    | --- | --- | --- | --- | --- |
    | خفض التكاليف | منخفض المخاطرة | [[m1|%]] | [[i1|%]] | يقبل |
    | التوسعة | متوسط | [[m2|%]] | [[i2|%]] | يرفض |
    | المنتج الجديد | مرتفع | [[m3|%]] | [[i3|%]] | يقبل |

    لو استخدمت الشركة [[W|%]] لكل المشاريع، تقبل التوسعة، مع أن عائدها لا يكفي لمخاطرتها. ولو استخدمت [[m3|%]] لكل المشاريع، ترفض خفض التكاليف، مع أنه شبه مضمون ويعطي أكثر من تكلفة رأس المال. حد أدنى واحد يدفع الشركة مع الوقت نحو المشاريع الأخطر.

# ------------------------------------------------------------ leverage and equity return
- id: c11-ex-leverage
  kind: example
  title: |
    عائد المشروع وعائد المالكين
  vars: {C: 500000, irr0: 0.15, wd: 0.6, r: 0.08, t: 0.20}
  random: {C: [200000, 900000, 50000], irr0: [0.10, 0.20, 0.01], wd: [0.3, 0.7, 0.1], r: [0.06, 0.12, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - D = C/5
    - X = floor((C*AP(irr0, 5) - t*D)/(1 - t)/1000 + 0.5)*1000
    - CF = X*(1 - t) + t*D
    - ip = IRR([-C, CF, CF, CF, CF, CF])
    - L = wd*C
    - A = L*AP(r, 5)
    - I1 = r*L
    - B1 = L - (A - I1)
    - I2 = r*B1
    - B2 = B1 - (A - I2)
    - I3 = r*B2
    - B3 = B2 - (A - I3)
    - I4 = r*B3
    - B4 = B3 - (A - I4)
    - I5 = r*B4
    - E1 = CF - A + t*I1
    - E2 = CF - A + t*I2
    - E3 = CF - A + t*I3
    - E4 = CF - A + t*I4
    - E5 = CF - A + t*I5
    - E0 = C - L
    - ie = IRR([-E0, E1, E2, E3, E4, E5])
    - kda = r*(1 - t)
  text: |
    مشروع يكلف [[C|g]] دينار، وعمره 5 سنوات بلا قيمة بيع. صافي تدفقه السنوي قبل الضريبة والاستهلاك [[X|g]] دينار. الاستهلاك بالقسط الثابت، والضريبة [[t|%]]. الشركة تقترض [[wd|%]] من الاستثمار بفائدة [[r|%]]، تسدد بخمسة أقساط سنوية متساوية. (أ) ما معدل عائد المشروع بدون القرض؟ (ب) ما معدل عائد المالكين مع القرض؟
  solution: |
    (أ) الاستهلاك [[D|g]] دينار سنويا. التدفق التشغيلي بعد الضريبة:

    $$
    CF = [[X|g]] \times (1 - [[t|%]]) + [[t|%]] \times [[D|g]] = [[CF|g]]
    $$

    ```excel
    =RATE(5, [[CF|r]], -[[C|r]])
    ```

    معدل المشروع [[ip|%2]].

    (ب) القرض والقسط:

    $$
    L = [[wd|%]] \times [[C|g]] = [[L|g]]
    $$

    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ 5) = [[A|2]]
    $$

    المالكون يدفعون الباقي في السنة 0، [[E0|g]] دينار. كل سنة يأخذون التدفق التشغيلي، ويدفعون القسط، ويوفرون ضريبة على الفائدة:

    $$
    \mathrm{equity\ CF} = CF - A + t\,I
    $$

    | السنة | الفائدة | الوفر الضريبي | تدفق المالكين |
    | --- | --- | --- | --- |
    | 0 | | | [[-E0|0]] |
    | 1 | [[I1|0]] | [[t*I1|0]] | [[E1|0]] |
    | 2 | [[I2|0]] | [[t*I2|0]] | [[E2|0]] |
    | 3 | [[I3|0]] | [[t*I3|0]] | [[E3|0]] |
    | 4 | [[I4|0]] | [[t*I4|0]] | [[E4|0]] |
    | 5 | [[I5|0]] | [[t*I5|0]] | [[E5|0]] |

    ```excel
    =IRR(B2:B7)
    ```

    معدل المالكين [[ie|%2]].

    تكلفة القرض بعد الضريبة:

    $$
    [[r|%]] \times (1 - [[t|%]]) = [[kda|%2]]
    $$

    المشروع يعطي [[ip|%2]]، أكثر من تكلفة القرض. الفرق يذهب إلى المالكين، فيرتفع عائدهم إلى [[ie|%2]]. لكن تدفقهم السنوي صار [[E1|0]] دينار بدل [[CF|0]]: إذا انخفضت المبيعات، يبقى القسط كما هو، فتنخفض حصتهم أكثر.
