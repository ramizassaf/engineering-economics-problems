items:

- id: c11-f-01
  kind: problem
  part: F
  text: |
    المتوسط المرجح لتكلفة رأس المال لشركة 11%. ميزانيتها هذه السنة 1,000,000 دينار. المشاريع المستقلة المقترحة، كلها بمخاطرة عادية:

    | المشروع | الاستثمار | معدل العائد |
    | --- | --- | --- |
    | أ | 400,000 | 16% |
    | ب | 200,000 | 24% |
    | ج | 400,000 | 19% |
    | د | 300,000 | 14% |
    | هـ | 250,000 | 10% |

    أي المشاريع تقبل؟ وما الحد الأدنى للعائد الفعلي هذه السنة؟
  solution: |
    نرتب حسب المعدل:

    | المشروع | المعدل | الاستثمار المتراكم |
    | --- | --- | --- |
    | ب | 24% | 200,000 |
    | ج | 19% | 600,000 |
    | أ | 16% | 1,000,000 |
    | د | 14% | لا يتسع |

    تقبل ب وج وأ، وتملأ الميزانية بالضبط. أفضل مشروع مرفوض د بمعدل 14%، فالحد الأدنى الفعلي 14%. المشروع هـ مرفوض في كل الأحوال، لأن معدله أقل من تكلفة رأس المال 11%.

- id: c11-f-02
  kind: problem
  part: F
  vars: {W: 0.11, i1: 0.125, i2: 0.135, i3: 0.16}
  random: {W: [0.08, 0.13, 0.005], i1: [0.08, 0.18, 0.005], i2: [0.08, 0.20, 0.005], i3: [0.10, 0.24, 0.005]}
  calc:
    - m1 = W
    - m2 = W + 0.025
    - m3 = W + 0.06
    - a1 = pick(i1 > m1, "يقبل", "يرفض")
    - a2 = pick(i2 > m2, "يقبل", "يرفض")
    - a3 = pick(i3 > m3, "يقبل", "يرفض")
  text: |
    شركة متوسطها المرجح [[W|%]]. علاوات المخاطرة عندها: صفر لاستبدال معدات، و2.5% لتوسعة خط قائم، و6% لمنتج جديد. ثلاثة مشاريع: استبدال معدات بمعدل [[i1|%]]، وتوسعة بمعدل [[i2|%]]، ومنتج جديد بمعدل [[i3|%]]. ما قرارك في كل منها؟
  solution: |
    | المشروع | الحد الأدنى | المعدل | القرار |
    | --- | --- | --- | --- |
    | استبدال معدات | [[m1|%]] | [[i1|%]] | [[a1]] |
    | توسعة | [[m2|%]] | [[i2|%]] | [[a2]] |
    | منتج جديد | [[m3|%]] | [[i3|%]] | [[a3]] |

    كل مشروع يقارن بالحد الأدنى لصنفه، وليس بالمتوسط المرجح وحده.

- id: c11-f-03
  kind: problem
  part: F
  vars: {rf: 0.04, rm: 0.10, bc: 1.0, bp: 1.6, ip: 0.125}
  random: {rf: [0.02, 0.05, 0.005], rm: [0.08, 0.12, 0.005], bc: [0.7, 1.2, 0.1], bp: [1.3, 2.2, 0.1], ip: [0.09, 0.18, 0.005]}
  calc:
    - kc = rf + bc*(rm - rf)
    - kp = rf + bp*(rm - rf)
  text: |
    شركة بلا ديون، بيتا سهمها [[bc|g]]. تدرس مشروعا في مجال جديد، بيتا الشركات العاملة فيه [[bp|g]]. النسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]]. معدل عائد المشروع [[ip|%]]. هل تقبله؟
  solution: |
    تكلفة رأس المال للشركة كلها:

    $$
    [[rf|%]] + [[bc|g]] \times ([[rm|%]] - [[rf|%]]) = [[kc|%2]]
    $$

    لكن المشروع بمخاطرة المجال الجديد، فنستخدم بيتا ذلك المجال:

    $$
    [[rf|%]] + [[bp|g]] \times ([[rm|%]] - [[rf|%]]) = [[kp|%2]]
    $$

    الحد الأدنى للمشروع [[kp|%2]]. القرار: [[pick(ip > kp, "يقبل.", "يرفض.")]] [[pick(ip > kc, pick(ip > kp, "", "لو استخدمت الشركة تكلفة رأس مالها لقبلته خطأ."), "")]]

- id: c11-f-04
  kind: problem
  part: F
  vars: {W: 0.10, rp: 0.05, C: 600000, A: 160000, n: 6}
  random: {W: [0.08, 0.13, 0.005], rp: [0.03, 0.07, 0.01], C: [200000, 1000000, 50000], A: [40000, 400000, 2000], n: [4, 10, 1]}
  calc:
    - A = floor(C*AP(W + rp/2, n)/2000 + 0.5)*2000
    - m = W + rp
    - P1 = -C + A*PA(W, n)
    - P2 = -C + A*PA(m, n)
  text: |
    مشروع منتج جديد يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. المتوسط المرجح للشركة [[W|%]]، وعلاوة المخاطرة للمنتجات الجديدة [[rp|%]]. احسب القيمة الحالية بالمتوسط المرجح، ثم بالحد الأدنى بعد العلاوة. أيهما يستخدم للقرار؟
  solution: |
    $$
    PW = -[[C|g]] + [[A|g]]\,(P/A,\ [[W|%]],\ [[n|n]]) = [[P1|2]]
    $$

    الحد الأدنى بعد العلاوة [[m|%]]:

    $$
    PW = -[[C|g]] + [[A|g]]\,(P/A,\ [[m|%]],\ [[n|n]]) = [[P2|2]]
    $$

    القرار بالحد الأدنى بعد العلاوة، لأن المشروع أخطر من مشاريع الشركة المعتادة. [[pick(P2 > 0, "القيمة موجبة، فيقبل.", "القيمة سالبة، فيرفض، مع أنه يبدو مقبولا بالمتوسط المرجح وحده.")]]

- id: c11-f-05
  kind: problem
  part: F
  text: |
    شركة متوسطها المرجح 10% لأول 800,000 دينار من الاستثمار، ما دامت أرباحها المحتجزة تكفي. بعدها تصدر أسهما جديدة، فيرتفع المتوسط إلى 12%. المشاريع المستقلة:

    | المشروع | الاستثمار | معدل العائد |
    | --- | --- | --- |
    | أ | 300,000 | 17% |
    | ب | 500,000 | 13% |
    | ج | 300,000 | 11.5% |
    | د | 200,000 | 9% |

    أي المشاريع تقبل؟
  solution: |
    نرتب المشاريع من المعدل الأعلى، ونقارن كل مشروع بتكلفة المال الذي سيموله:

    | المشروع | الاستثمار المتراكم | تكلفة المال | المعدل | القرار |
    | --- | --- | --- | --- | --- |
    | أ | 300,000 | 10% | 17% | يقبل |
    | ب | 800,000 | 10% | 13% | يقبل |
    | ج | 1,100,000 | 12% | 11.5% | يرفض |
    | د | 1,300,000 | 12% | 9% | يرفض |

    المشروع ج يعطي أكثر من 10%، لكنه يأتي بعد نفاد الأرباح المحتجزة، فيموله مال تكلفته 12%. الحد الأدنى للمشروع الأخير المقبول هو تكلفة المال الإضافي، لا متوسط الشركة القديم.

- id: c11-f-06
  kind: problem
  part: F
  vars: {W: 0.10, M: 0.15, C: 500000, A: 125000, n: 6}
  random: {W: [0.08, 0.12, 0.005], M: [0.13, 0.20, 0.01], C: [200000, 1000000, 50000], A: [40000, 300000, 1000], n: [4, 10, 1]}
  calc:
    - A = floor(C*AP((W + M)/2, n)/1000 + 0.5)*1000
    - P1 = -C + A*PA(W, n)
    - P2 = -C + A*PA(M, n)
    - ip = RATE(n, A, C)
  text: |
    شركة تكلفة رأس مالها [[W|%]]، ولا تعاني من نقص التمويل. مديرها يستخدم حدا أدنى [[M|%]] لكل المشاريع، احتياطا. مشروع عادي المخاطرة يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ماذا يقرر المدير؟ وكم تخسر الشركة بقراره؟
  solution: |
    ```excel
    =RATE([[n|n]], [[A|r]], -[[C|r]])
    ```

    معدل المشروع [[ip|%2]]، أقل من [[M|%]]، فيرفضه المدير. القيمة الحالية بحده:

    $$
    -[[C|g]] + [[A|g]]\,(P/A,\ [[M|%]],\ [[n|n]]) = [[P2|2]]
    $$

    لكن مقدمي المال يطلبون [[W|%]] فقط:

    $$
    -[[C|g]] + [[A|g]]\,(P/A,\ [[W|%]],\ [[n|n]]) = [[P1|2]]
    $$

    برفض المشروع تخسر الشركة [[P1|2]] دينار من قيمتها. الحد الأدنى المرتفع بلا سبب ليس احتياطا: له تكلفة.

- id: c11-f-07
  kind: problem
  part: F
  vars: {ma: 0.10, t: 0.20}
  random: {ma: [0.07, 0.14, 0.005], t: [0.15, 0.35, 0.01]}
  calc:
    - mb = ma/(1 - t)
  text: |
    الحد الأدنى للعائد بعد الضريبة لشركة [[ma|%]]، والضريبة [[t|%]]. مهندس يقيم مشروعا صغيرا بتدفقات قبل الضريبة. ما الحد الأدنى التقريبي الذي يستخدمه؟
  solution: |
    قاعدة تقريبية: العائد بعد الضريبة يساوي تقريبا العائد قبلها ضرب واحد ناقص الضريبة. فالحد الأدنى قبل الضريبة:

    $$
    \frac{[[ma|%]]}{1 - [[t|%]]} = [[mb|%2]]
    $$

    التقريب يتجاهل توقيت الاستهلاك. للقرارات الكبيرة نبني التدفقات بعد الضريبة، كما في الفصل السابع.

- id: c11-f-08
  kind: problem
  part: F
  vars: {rs: 0.04, W: 0.11, t: 0.20, C: 400000, A: 95000, n: 6}
  random: {rs: [0.02, 0.05, 0.005], W: [0.09, 0.13, 0.005], t: [0.15, 0.30, 0.01], C: [200000, 800000, 50000], A: [30000, 250000, 1000], n: [4, 10, 1]}
  calc:
    - A = floor(C*AP(W - 0.025, n)/1000 + 0.5)*1000
    - ka = rs*(1 - t)
    - P1 = -C + A*PA(ka, n)
    - P2 = -C + A*PA(W, n)
  text: |
    الحكومة تعرض على مصنع قرضا ميسرا بفائدة [[rs|%]] لمشروع يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا بعد الضريبة لمدة [[yrs(n)]]. المتوسط المرجح للمصنع [[W|%]]، والضريبة [[t|%]]. مهندس يقيم المشروع بتكلفة القرض بعد الضريبة. ما الخطأ؟
  solution: |
    حساب المهندس:

    $$
    [[rs|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    $$
    -[[C|g]] + [[A|g]]\,(P/A,\ [[ka|%2]],\ [[n|n]]) = [[P1|2]]
    $$

    بالمتوسط المرجح:

    $$
    -[[C|g]] + [[A|g]]\,(P/A,\ [[W|%]],\ [[n|n]]) = [[P2|2]]
    $$

    مخاطرة المشروع لا تتغير بمصدر المال. الصحيح أن نقيم المشروع بالمتوسط المرجح، ثم نضيف قيمة القرض الميسر وحدها: الفرق بين قيمته الحالية بفائدة السوق وبفائدته الميسرة. [[pick(P2 < 0, "بدون القرض الميسر المشروع لا يغطي تكلفة رأس المال، وقيمة القرض قد تكفي أو لا تكفي لتغطية الفرق.", "المشروع مقبول بالمتوسط المرجح أيضا، والقرض الميسر يزيد قيمته.")]]

- id: c11-f-09
  kind: problem
  part: F
  vars: {W: 0.10, ir: 0.145, inew: 0.13}
  random: {W: [0.08, 0.12, 0.005], ir: [0.12, 0.20, 0.005], inew: [0.10, 0.22, 0.005]}
  calc:
    - ir = max(ir, W + 0.02)
  text: |
    شركة متوسطها المرجح [[W|%]]، وميزانيتها محدودة. بعد ترتيب المشاريع، أفضل مشروع لم يتسع في الميزانية معدله [[ir|%]]. يصل مشروع جديد معدله [[inew|%]]. هل يدخل الميزانية؟
  solution: |
    الحد الأدنى الفعلي هو تكلفة الفرصة البديلة، [[ir|%]]. [[pick(inew > ir, "المشروع الجديد يعطي أكثر منه، فيدخل الميزانية ويخرج آخر مشروع مقبول بأقل معدل، أو يأخذ مكانه حسب المبالغ.", "المشروع الجديد يعطي أقل منه، فلا يدخل، حتى لو كان معدله أعلى من المتوسط المرجح.")]]

- id: c11-f-10
  kind: problem
  part: F
  vars: {rf: 0.04, rm: 0.10, b1: 0.8, b2: 1.5, wd: 0.30, kd: 0.07, t: 0.20}
  random: {rf: [0.02, 0.05, 0.005], rm: [0.08, 0.12, 0.005], b1: [0.5, 1.0, 0.1], b2: [1.2, 2.0, 0.1], wd: [0.2, 0.5, 0.05], kd: [0.05, 0.08, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - k1 = rf + b1*(rm - rf)
    - k2 = rf + b2*(rm - rf)
    - W1 = wd*kd*(1 - t) + (1 - wd)*k1
    - W2 = wd*kd*(1 - t) + (1 - wd)*k2
  text: |
    شركة لها قسمان: قسم مياه معبأة بيتا [[b1|g]]، وقسم أجهزة إلكترونية بيتا [[b2|g]]. القسمان يمولان [[wd|%]] بالدين بتكلفة [[kd|%]]. النسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]]، والضريبة [[t|%]]. احسب الحد الأدنى لكل قسم.
  solution: |
    قسم المياه:

    $$
    k_e = [[rf|%]] + [[b1|g]] \times ([[rm|%]] - [[rf|%]]) = [[k1|%2]]
    $$

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[k1|%2]] = [[W1|%2]]
    $$

    قسم الأجهزة:

    $$
    k_e = [[rf|%]] + [[b2|g]] \times ([[rm|%]] - [[rf|%]]) = [[k2|%2]]
    $$

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[k2|%2]] = [[W2|%2]]
    $$

    حد واحد للشركة كلها يجعل قسم الأجهزة يقبل مشاريع لا تغطي مخاطرتها، ويجعل قسم المياه يرفض مشاريع جيدة.

- id: c11-f-11
  kind: problem
  part: F
  vars: {C: 700000, A: 180000, n: 6}
  random: {C: [200000, 1200000, 50000], A: [40000, 400000, 5000], n: [4, 10, 1]}
  calc:
    - A = floor(C*AP(0.12, n)/5000 + 0.5)*5000
    - ip = RATE(n, A, C)
    - P1 = -C + A*PA(0.09, n)
    - P2 = -C + A*PA(0.15, n)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. الإدارة غير متفقة على الحد الأدنى: بين 9% و15%. احسب القيمة الحالية عند الحدين، ثم حدد الحد الأدنى الذي يتغير عنده القرار.
  solution: |
    $$
    -[[C|g]] + [[A|g]]\,(P/A,\ 9\%,\ [[n|n]]) = [[P1|2]]
    $$

    $$
    -[[C|g]] + [[A|g]]\,(P/A,\ 15\%,\ [[n|n]]) = [[P2|2]]
    $$

    القرار يتغير عند الحد الأدنى الذي يجعل القيمة الحالية صفرا، وهو معدل عائد المشروع:

    ```excel
    =RATE([[n|n]], [[A|r]], -[[C|r]])
    ```

    [[ip|%2]]. إذا اتفقت الإدارة على أي حد أقل منه، يقبل المشروع. لا داعي للاتفاق على رقم دقيق، بل فقط على أنه أقل من [[ip|%2]] أو أعلى.
