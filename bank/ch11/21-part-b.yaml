items:

- id: c11-b-01
  kind: problem
  part: B
  vars: {r: 0.09, t: 0.20}
  random: {r: [0.05, 0.14, 0.005], t: [0.10, 0.35, 0.01]}
  calc:
    - ka = r*(1 - t)
  text: |
    شركة تقترض من البنك بفائدة [[r|%]] بدون رسوم. نسبة الضريبة [[t|%]]. ما تكلفة القرض بعد الضريبة؟
  solution: |
    $$
    k_d\,(1 - t) = [[r|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    كل دينار فائدة يوفر [[t|%]] منه ضريبة، فالشركة تتحمل [[1-t|%]] منه فقط.

- id: c11-b-02
  kind: problem
  part: B
  vars: {L: 400000, r: 0.08, n: 6, f: 0.025, t: 0.20}
  random: {L: [100000, 800000, 20000], r: [0.06, 0.12, 0.005], n: [3, 10, 1], f: [0.01, 0.04, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - A = L*AP(r, n)
    - N = L*(1 - f)
    - kb = RATE(n, A, N)
    - ka = kb*(1 - t)
  text: |
    مصنع أدوية يقترض [[L|g]] دينار لخط تعبئة، بفائدة [[r|%]] وأقساط سنوية متساوية على [[yrs(n)]]. رسوم القرض [[f|%]] تخصم عند الاستلام. الضريبة [[t|%]]. ما تكلفة القرض قبل الضريبة وبعدها؟
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    $$
    [[L|g]] \times (1 - [[f|%]]) = [[N|2]]
    $$

    التكلفة هي النسبة التي تجعل الأقساط تساوي ما استلمه المصنع:

    ```excel
    =RATE([[n|n]], -[[A|d2]], [[N|d2]])
    ```

    قبل الضريبة [[kb|%2]]. بعد الضريبة:

    $$
    [[kb|%2]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

- id: c11-b-03
  kind: problem
  part: B
  vars: {c: 0.06, n: 8, y0: 0.072, t: 0.20}
  random: {c: [0.04, 0.09, 0.005], n: [5, 15, 1], y0: [0.05, 0.11, 0.002], t: [0.15, 0.30, 0.01]}
  calc:
    - y0 = max(y0, c + 0.006)
    - C = 1000*c
    - P = floor((C*PA(y0, n) + 1000*PF(y0, n))/5 + 0.5)*5
    - kd = YTM(n, C, 1000, P)
    - ka = kd*(1 - t)
  text: |
    سند قيمته الاسمية 1,000 دينار، ونسبة كوبونه [[c|%]] تدفع سنويا، ويستحق بعد [[yrs(n)]]. سعره في السوق [[P|g]] دينار. ما العائد حتى الاستحقاق؟ وما تكلفة الدين بعد ضريبة [[t|%]]؟
  solution: |
    الكوبون [[C|g]] دينار سنويا. نبحث عن النسبة التي تحقق:

    $$
    [[C|g]]\,(P/A,\ k_d,\ [[n|n]]) + 1000\,(P/F,\ k_d,\ [[n|n]]) = [[P|g]]
    $$

    ```excel
    =RATE([[n|n]], [[C|r]], -[[P|r]], 1000)
    ```

    العائد حتى الاستحقاق [[kd|%2]]، أعلى من الكوبون لأن السعر أقل من القيمة الاسمية. بعد الضريبة:

    $$
    [[kd|%2]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

- id: c11-b-04
  kind: problem
  part: B
  vars: {c: 0.09, n: 12, y0: 0.075}
  random: {c: [0.07, 0.12, 0.005], n: [5, 20, 1], y0: [0.04, 0.10, 0.002]}
  calc:
    - y0 = min(y0, c - 0.006)
    - C = 1000*c
    - P = floor((C*PA(y0, n) + 1000*PF(y0, n))/5 + 0.5)*5
    - kd = YTM(n, C, 1000, P)
  text: |
    سند قيمته الاسمية 1,000 دينار، كوبونه [[c|%]] سنويا، ويستحق بعد [[yrs(n)]]. يباع بسعر [[P|g]] دينار، أعلى من قيمته الاسمية. هل العائد حتى الاستحقاق أعلى من الكوبون أم أقل؟ احسبه.
  solution: |
    المشتري يدفع [[P|g]] ويسترد 1,000 فقط في النهاية، فيخسر جزءا من الكوبونات في السعر. العائد أقل من الكوبون.

    $$
    [[C|g]]\,(P/A,\ k_d,\ [[n|n]]) + 1000\,(P/F,\ k_d,\ [[n|n]]) = [[P|g]]
    $$

    ```excel
    =RATE([[n|n]], [[C|r]], -[[P|r]], 1000)
    ```

    العائد [[kd|%2]]، أقل من الكوبون [[c|%]].

- id: c11-b-05
  kind: problem
  part: B
  vars: {c: 0.08, n: 10, fee: 15}
  random: {c: [0.05, 0.11, 0.005], n: [5, 20, 1], fee: [5, 40, 5]}
  calc:
    - C = 1000*c
    - Pn = 1000 - fee
    - kd = YTM(n, C, 1000, Pn)
  text: |
    شركة تصدر سندات بقيمتها الاسمية تماما، 1,000 دينار، بكوبون [[c|%]] لمدة [[yrs(n)]]. (أ) ما تكلفة الدين قبل الضريبة إذا لم تكن هناك تكاليف إصدار؟ (ب) وما تكلفته إذا كانت تكاليف الإصدار [[fee|g]] دينار لكل سند؟
  solution: |
    (أ) السند يباع بقيمته الاسمية، فالعائد يساوي الكوبون: [[c|%]].

    (ب) الشركة تستلم [[Pn|g]] دينار:

    $$
    [[C|g]]\,(P/A,\ k_d,\ [[n|n]]) + 1000\,(P/F,\ k_d,\ [[n|n]]) = [[Pn|g]]
    $$

    ```excel
    =RATE([[n|n]], [[C|r]], -[[Pn|r]], 1000)
    ```

    التكلفة [[kd|%2]]. تكاليف الإصدار رفعت التكلفة لأن الشركة تستلم أقل وتدفع نفس الدفعات.

- id: c11-b-06
  kind: problem
  part: B
  vars: {L: 300000, n: 5, r1: 0.095, r2: 0.085, f: 0.03}
  random: {L: [100000, 600000, 20000], n: [3, 8, 1], r1: [0.07, 0.12, 0.005], r2: [0.05, 0.10, 0.005], f: [0.01, 0.05, 0.005]}
  calc:
    - r2 = min(r2, r1 - 0.005)
    - A2 = L*AP(r2, n)
    - N2 = L*(1 - f)
    - k2 = RATE(n, A2, N2)
    - best = pick(k2 < r1, "الثاني", "الأول")
  text: |
    شركة تحتاج [[L|g]] دينار لمدة [[yrs(n)]]، بأقساط سنوية متساوية. البنك الأول يعرض فائدة [[r1|%]] بدون رسوم. البنك الثاني يعرض [[r2|%]] مع رسوم [[f|%]] عند الاستلام. أي العرضين أرخص؟
  solution: |
    تكلفة العرض الأول [[r1|%]]، لأنه بدون رسوم.

    العرض الثاني:

    $$
    A = [[L|g]]\,(A/P,\ [[r2|%]],\ [[n|n]]) = [[A2|2]]
    $$

    $$
    [[L|g]] \times (1 - [[f|%]]) = [[N2|2]]
    $$

    ```excel
    =RATE([[n|n]], -[[A2|d2]], [[N2|d2]])
    ```

    تكلفة العرض الثاني [[k2|%2]]. الأرخص هو العرض [[best]]. الضريبة لا تغير الترتيب، لأنها تضرب التكلفتين في نفس الرقم.

- id: c11-b-07
  kind: problem
  part: B
  vars: {r: 0.096, t: 0.20}
  random: {r: [0.06, 0.15, 0.006], t: [0.15, 0.30, 0.01]}
  calc:
    - ie = (1 + r/12)**12 - 1
    - ka = ie*(1 - t)
  text: |
    قرض بنسبة اسمية [[r|%]] سنويا، تركب شهريا. ما تكلفته الفعلية السنوية قبل الضريبة وبعدها، إذا كانت الضريبة [[t|%]]؟
  solution: |
    من الفصل الثالث، النسبة الفعلية:

    $$
    i = \left(1 + \frac{[[r|%]]}{12}\right)^{12} - 1 = [[ie|%2]]
    $$

    بعد الضريبة:

    $$
    [[ie|%2]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    تكلفة الدين في المتوسط المرجح تؤخذ دائما نسبة فعلية سنوية، لأن تكاليف المصادر الأخرى سنوية.

- id: c11-b-08
  kind: problem
  part: B
  vars: {c: 0.07, n: 10, y: 0.09}
  random: {c: [0.04, 0.10, 0.005], n: [3, 20, 1], y: [0.04, 0.12, 0.005]}
  calc:
    - C = 1000*c
    - P = C*PA(y, n) + 1000*PF(y, n)
  text: |
    سند قيمته الاسمية 1,000 دينار، كوبونه [[c|%]] سنويا، ويستحق بعد [[yrs(n)]]. إذا كان العائد الذي يطلبه المستثمرون على سندات مثله [[y|%]]، فما سعره في السوق؟
  solution: |
    السعر هو القيمة الحالية لدفعات السند بالعائد المطلوب:

    $$
    P = [[C|g]]\,(P/A,\ [[y|%]],\ [[n|n]]) + 1000\,(P/F,\ [[y|%]],\ [[n|n]]) = [[P|2]]
    $$

    ```excel
    =PV([[y|%]], [[n|n]], -[[C|r]], -1000)
    ```

    إذا كان العائد المطلوب أعلى من الكوبون، يباع السند بأقل من 1,000، والعكس صحيح.

- id: c11-b-09
  kind: problem
  part: B
  vars: {Q: 5000000, P: 985, fee: 18}
  random: {Q: [1000000, 9000000, 250000], P: [940, 1040, 5], fee: [8, 30, 2]}
  calc:
    - Pn = P - fee
    - m = ceil(Q/Pn)
  text: |
    شركة تحتاج [[Q|g]] دينار صافية من إصدار سندات. سعر السند [[P|g]] دينار، وتكاليف الإصدار [[fee|g]] دينار للسند. كم سندا يجب أن تصدر؟
  solution: |
    الشركة تستلم من كل سند:

    $$
    [[P|g]] - [[fee|g]] = [[Pn|g]]
    $$

    $$
    \frac{[[Q|g]]}{[[Pn|g]]} = [[Q/Pn|2]]
    $$

    تصدر [[m|g]] سندا. القيمة الاسمية التي ستردها في النهاية [[m*1000|g]] دينار، أكثر مما استلمته.

- id: c11-b-10
  kind: problem
  part: B
  vars: {c: 0.08, n: 6, y0: 0.088}
  random: {c: [0.05, 0.11, 0.005], n: [3, 12, 1], y0: [0.05, 0.12, 0.002]}
  calc:
    - C = 1000*c/2
    - P = floor((C*PA(y0/2, 2*n) + 1000*PF(y0/2, 2*n))/5 + 0.5)*5
    - kh = YTM(2*n, C, 1000, P)
    - kn = 2*kh
    - ke = (1 + kh)**2 - 1
  text: |
    سند قيمته الاسمية 1,000 دينار، كوبونه [[c|%]] سنويا يدفع على دفعتين كل ستة أشهر، ويستحق بعد [[yrs(n)]]. سعره [[P|g]] دينار. ما تكلفة الدين الفعلية السنوية؟
  solution: |
    كل ستة أشهر يدفع السند نصف الكوبون، وعدد الفترات ضعف عدد السنوات:

    $$
    \frac{[[c|%]] \times 1000}{2} = [[C|g]] \qquad 2 \times [[n|n]] = [[2*n|n]]
    $$

    نسبة نصف السنة:

    $$
    [[C|g]]\,(P/A,\ k,\ [[2*n|n]]) + 1000\,(P/F,\ k,\ [[2*n|n]]) = [[P|g]]
    $$

    ```excel
    =RATE([[2*n|n]], [[C|r]], -[[P|r]], 1000)
    ```

    النتيجة [[kh|%2]] لكل نصف سنة. النسبة الاسمية [[kn|%2]]، والفعلية السنوية:

    $$
    (1 + [[kh|%2]])^2 - 1 = [[ke|%2]]
    $$

- id: c11-b-11
  kind: problem
  part: B
  vars: {P: 620, n: 7}
  random: {P: [450, 850, 5], n: [3, 15, 1]}
  calc:
    - kd = (1000/P)**(1/n) - 1
  text: |
    سند بدون كوبون: لا يدفع أي فائدة، ويرد 1,000 دينار بعد [[yrs(n)]]. سعره اليوم [[P|g]] دينار. ما العائد حتى الاستحقاق؟
  solution: |
    مبلغ واحد اليوم ومبلغ واحد في النهاية، كما في الفصل الأول:

    $$
    [[P|g]]\,(1 + k_d)^{[[n|n]]} = 1000
    $$

    $$
    k_d = \left(\frac{1000}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[kd|%2]]
    $$

    ```excel
    =RATE([[n|n]], 0, -[[P|r]], 1000)
    ```

- id: c11-b-12
  kind: problem
  part: B
  vars: {r: 0.10, t: 0.25}
  random: {r: [0.06, 0.14, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ka = r*(1 - t)
  text: |
    شركتان تقترضان بنفس الفائدة [[r|%]]، والضريبة [[t|%]]. الأولى رابحة. الثانية خاسرة منذ سنوات، ولا تتوقع ربحا خاضعا للضريبة قريبا. ما تكلفة الدين بعد الضريبة لكل منهما؟
  solution: |
    الأولى تستفيد من الوفر الضريبي كاملا:

    $$
    [[r|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    الثانية لا تدفع ضريبة أصلا، فلا توفر شيئا من الفائدة. تكلفة دينها بعد الضريبة [[r|%]]، مثل ما قبل الضريبة. معادلة الفصل تفترض شركة رابحة.

- id: c11-b-13
  kind: problem
  part: B
  vars: {L: 250000, r: 0.085, n: 4, f: 0.02}
  random: {L: [100000, 500000, 10000], r: [0.06, 0.12, 0.005], n: [2, 8, 1], f: [0.01, 0.04, 0.005]}
  calc:
    - I = r*L
    - N = L*(1 - f)
    - kd = YTM(n, I, L, N)
  text: |
    قرض [[L|g]] دينار لمدة [[yrs(n)]]. الشركة تدفع الفائدة فقط كل سنة، بنسبة [[r|%]]، وترد أصل القرض كاملا في النهاية. رسوم القرض [[f|%]] عند الاستلام. ما تكلفة القرض قبل الضريبة؟
  solution: |
    الفائدة السنوية:

    $$
    [[r|%]] \times [[L|g]] = [[I|g]]
    $$

    الشركة تستلم:

    $$
    [[L|g]] \times (1 - [[f|%]]) = [[N|g]]
    $$

    هذا يشبه السند تماما: دفعات ثابتة، ثم المبلغ كاملا في النهاية:

    $$
    [[I|g]]\,(P/A,\ k_d,\ [[n|n]]) + [[L|g]]\,(P/F,\ k_d,\ [[n|n]]) = [[N|g]]
    $$

    ```excel
    =RATE([[n|n]], -[[I|r]], [[N|r]], -[[L|r]])
    ```

    التكلفة [[kd|%2]].
