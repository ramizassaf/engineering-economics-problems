items:

- id: c11-a-01
  kind: concept
  part: A
  text: |
    ما تكلفة رأس المال؟ ولماذا تعتبر تكلفة وليست عائدا؟
  solution: |
    العائد الذي يطلبه مقدمو المال للشركة، من مقرضين ومساهمين. هي تكلفة للشركة لأنها ما يجب أن تدفعه مقابل استخدام المال، تماما مثل الفائدة على قرض.

- id: c11-a-02
  kind: concept
  part: A
  text: |
    لماذا تكون تكلفة حقوق الملكية أعلى من تكلفة الدين في نفس الشركة؟
  solution: |
    المقرض يأخذ فائدته أولا، بعقد ملزم، ويأخذ ماله قبل المالكين إذا أفلست الشركة. المالك يأخذ ما يبقى، وقد لا يبقى شيء. مخاطرته أكبر، فيطلب عائدا أعلى.

- id: c11-a-03
  kind: concept
  part: A
  text: |
    لماذا نضرب تكلفة الدين في واحد ناقص نسبة الضريبة، ولا نفعل ذلك مع تكلفة حقوق الملكية؟
  solution: |
    الفائدة تطرح من الدخل الخاضع للضريبة، فكل دينار فائدة يوفر ضريبة. التوزيعات على المساهمين تدفع من الربح بعد الضريبة، فلا توفر شيئا.

- id: c11-a-04
  kind: concept
  part: A
  text: |
    الأرباح المحتجزة لا تدفع الشركة عليها فائدة ولا توزيعات. هل تكلفتها صفر؟
  solution: |
    لا. هي مال المساهمين. لو وزعتها الشركة، لاستثمرها المساهم بنفسه وحصل على عائد. تكلفتها هي العائد الذي يتركه، أي تكلفة حقوق الملكية بدون تكاليف الإصدار.

- id: c11-a-05
  kind: concept
  part: A
  text: |
    لماذا نفضل أوزان القيم السوقية على أوزان القيم الدفترية في المتوسط المرجح؟
  solution: |
    القيم الدفترية تسجل ما دفع في الماضي. القيم السوقية هي ما يدفعه المستثمرون اليوم مقابل حصصهم، وعليها يطلبون العائد الآن.

- id: c11-a-06
  kind: concept
  part: A
  text: |
    ماذا يقيس معامل بيتا؟ وماذا تعني بيتا أقل من 1؟
  solution: |
    يقيس حركة سهم الشركة مقارنة بحركة السوق كله. بيتا أقل من 1 تعني أن السهم يتحرك أقل من السوق، فمخاطرته على المساهم أقل، والعائد المطلوب عليه أقل من عائد السوق.

- id: c11-a-07
  kind: concept
  part: A
  text: |
    إذا كان الدين أرخص من حقوق الملكية، لماذا لا تمول الشركة كل مشاريعها بالدين؟
  solution: |
    كلما زاد الدين زادت مخاطرة الإفلاس، لأن الفائدة تدفع حتى في السنة السيئة. يرفع البنك نسبة الفائدة، ويطلب المساهمون عائدا أعلى. بعد حد معين يرتفع المتوسط المرجح بدل أن ينخفض.

- id: c11-a-08
  kind: concept
  part: A
  text: |
    متى يكون الحد الأدنى للعائد أعلى من المتوسط المرجح لتكلفة رأس المال؟ اذكر سببين.
  solution: |
    عندما تكون الميزانية محدودة، فيصبح الحد الأدنى عائد أفضل مشروع مرفوض. وعندما يكون المشروع أخطر من مشاريع الشركة المعتادة، فنضيف علاوة مخاطرة.

- id: c11-a-09
  kind: concept
  part: A
  text: |
    حصلت شركة على قرض ميسر بفائدة 3% لتمويل مشروع محدد. هل تقيم المشروع بحد أدنى 3%؟
  solution: |
    لا. القرض الميسر يخفض تكلفة التمويل، لكنه لا يغير مخاطرة المشروع، والشركة تستطيع استخدام نفس القرض بديلا عن مال آخر. يقيم المشروع بالمتوسط المرجح أو بالحد الأدنى المعتاد، وأثر القرض الرخيص يظهر في تدفقات المالكين أو في المتوسط.

- id: c11-a-10
  kind: concept
  part: A
  text: |
    ما الرافعة المالية؟ ومتى ترفع عائد المالكين؟
  solution: |
    استخدام الدين في التمويل. ترفع عائد المالكين عندما يكون عائد المشروع أعلى من تكلفة الدين بعد الضريبة، لأن الفرق يذهب إليهم. إذا كان أقل، تخفض عائدهم.

- id: c11-a-11
  kind: concept
  part: A
  text: |
    ما الخطأ في خصم تدفقات المالكين بعد القرض بالمتوسط المرجح لتكلفة رأس المال؟
  solution: |
    المتوسط يشمل أثر الدين الرخيص. تدفقات المالكين تشمله أيضا، لأن القرض والفائدة طرحا منها. فيحسب أثر الدين مرتين، ويبدو المشروع أفضل مما هو. تدفقات المالكين تخصم بتكلفة حقوق الملكية.

- id: c11-a-12
  kind: concept
  part: A
  text: |
    لماذا تمول الشركات مشاريعها من الأرباح المحتجزة قبل إصدار أسهم جديدة؟
  solution: |
    الأسهم الجديدة لها تكاليف إصدار، من عمولات ورسوم، فتستلم الشركة أقل من سعر السهم. لذلك تكلفتها أعلى من تكلفة الأرباح المحتجزة.
