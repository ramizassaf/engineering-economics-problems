items:

- id: c11-i-01
  kind: mcq
  part: I
  vars: {kd: 0.10, t: 0.25}
  random: {kd: [0.06, 0.14, 0.01], t: [0.15, 0.35, 0.05]}
  calc:
    - ka = kd*(1 - t)
    - w1 = kd*t
    - w2 = kd*(1 + t)
    - w3 = kd
  text: |
    تكلفة قرض [[kd|%]]، والضريبة [[t|%]]. ما تكلفته بعد الضريبة؟
  options: ["[[w1|%2]]", "[[ka|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    [[kd|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    الخيار (أ) هو الوفر الضريبي وحده. الخيار (د) يتجاهل الضريبة.

- id: c11-i-02
  kind: mcq
  part: I
  vars: {P0: 20, D0: 1.0, g: 0.05}
  random: {P0: [10, 50, 5], D0: [0.5, 3, 0.5], g: [0.02, 0.08, 0.01]}
  calc:
    - D0 = min(D0, P0*0.1)
    - k = D0*(1 + g)/P0 + g
    - w1 = D0/P0 + g
    - w2 = D0*(1 + g)/P0
    - w3 = D0/P0
  text: |
    سعر سهم [[P0|g]] دينار، وآخر توزيع دفع [[D0|2]] دينار، والنمو [[g|%]]. ما تكلفة حقوق الملكية؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[k|%2]]", "[[w3|%2]]"]
  correct: 2
  solution: |
    $$
    \frac{[[D0|2]] \times (1 + [[g|%]])}{[[P0|g]]} + [[g|%]] = [[k|%2]]
    $$

    الخيار (أ) استخدم آخر توزيع بدل التوزيع القادم. الخياران (ب) و(د) نسيا النمو.

- id: c11-i-03
  kind: mcq
  part: I
  vars: {rf: 0.04, rm: 0.10, b: 1.5}
  random: {rf: [0.02, 0.05, 0.01], rm: [0.08, 0.12, 0.01], b: [1.2, 2.0, 0.2]}
  calc:
    - k = rf + b*(rm - rf)
    - w1 = b*rm
    - w2 = rf + b*rm
    - w3 = rm
  text: |
    النسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]]، وبيتا [[b|g]]. ما تكلفة حقوق الملكية؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[w3|%2]]", "[[k|%2]]"]
  correct: 3
  solution: |
    $$
    [[rf|%]] + [[b|g]] \times ([[rm|%]] - [[rf|%]]) = [[k|%2]]
    $$

    بيتا تضرب في علاوة المخاطرة فقط، أي عائد السوق ناقص النسبة الخالية من المخاطرة. الخياران (أ) و(ب) ضربا بيتا في عائد السوق كله. الخيار (ج) تجاهل بيتا، وهو صحيح فقط لسهم بيتا يساوي 1.

- id: c11-i-04
  kind: mcq
  part: I
  vars: {wd: 0.4, kd: 0.08, ke: 0.15, t: 0.20}
  random: {wd: [0.2, 0.4, 0.1], kd: [0.06, 0.10, 0.01], ke: [0.12, 0.18, 0.01], t: [0.15, 0.30, 0.05]}
  calc:
    - W = wd*kd*(1 - t) + (1 - wd)*ke
    - w1 = wd*kd + (1 - wd)*ke
    - w2 = wd*kd*(1 - t) + ke
    - w3 = (wd*kd + (1 - wd)*ke)*(1 - t)
  text: |
    دين [[wd|%]] بتكلفة [[kd|%]]، وحقوق ملكية بتكلفة [[ke|%]]، والضريبة [[t|%]]. ما المتوسط المرجح؟
  options: ["[[w1|%2]]", "[[W|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke|%]] = [[W|%2]]
    $$

    الخيار (أ) نسي الضريبة. الخيار (ج) نسي وزن حقوق الملكية. الخيار (د) طبق الضريبة على حقوق الملكية أيضا.

- id: c11-i-05
  kind: mcq
  part: I
  text: |
    سند كوبونه 6% يباع بسعر 1,080 دينار، وقيمته الاسمية 1,000. العائد حتى الاستحقاق:
  options: ["أعلى من 6%", "يساوي 6%", "أقل من 6%", "لا يمكن معرفته بدون عدد السنوات"]
  correct: 2
  solution: |
    المشتري يدفع أكثر من 1,000 ويسترد 1,000 فقط، فعائده أقل من الكوبون. عدد السنوات يحدد كم أقل، لا اتجاه الفرق.

- id: c11-i-06
  kind: mcq
  part: I
  text: |
    لماذا نستخدم أوزان القيم السوقية في المتوسط المرجح؟
  options: ["لأنها أسهل في الحساب", "لأنها تعكس ما يطلب عليه المستثمرون العائد اليوم", "لأنها دائما أقل من القيم الدفترية", "لأن قانون الضريبة يشترطها"]
  correct: 1
  solution: |
    القيم الدفترية تسجل ما دفع في الماضي. المستثمرون يطلبون العائد على قيمة حصصهم في السوق اليوم.

- id: c11-i-07
  kind: mcq
  part: I
  text: |
    شركة ميزانيتها محدودة. متوسطها المرجح 10%، وأفضل مشروع مرفوض معدله 14%. ما الحد الأدنى للعائد لمشروع جديد بنفس المخاطرة؟
  options: ["10%", "12%", "14%", "24%"]
  correct: 2
  solution: |
    كل دينار في المشروع الجديد يأخذ مكان المشروع الذي معدله 14%. الحد الأدنى هو تكلفة الفرصة البديلة. الخيار (ب) متوسط الرقمين، ولا معنى له.

- id: c11-i-08
  kind: mcq
  part: I
  text: |
    تدفقات المالكين لمشروع ممول جزئيا بقرض، بعد طرح الأقساط وإضافة الوفر الضريبي، تخصم بـ:
  options: ["المتوسط المرجح لتكلفة رأس المال", "تكلفة الدين بعد الضريبة", "تكلفة حقوق الملكية", "نسبة الفائدة على القرض"]
  correct: 2
  solution: |
    هذه تدفقات المالكين وحدهم، فتخصم بالعائد الذي يطلبونه. خصمها بالمتوسط المرجح يحسب أثر الدين مرتين.

- id: c11-i-09
  kind: mcq
  part: I
  vars: {P0: 40, D1: 2, g: 0.04, f: 0.05}
  random: {P0: [20, 60, 5], D1: [1, 4, 0.5], g: [0.02, 0.06, 0.01], f: [0.04, 0.10, 0.02]}
  calc:
    - k = D1/(P0*(1 - f)) + g
    - w1 = D1/P0 + g
    - w2 = D1/P0*(1 - f) + g
    - w3 = (D1/P0 + g)/(1 - f)
  text: |
    سعر سهم [[P0|g]] دينار، والتوزيع القادم [[D1|2]] دينار، والنمو [[g|%]]، وتكاليف إصدار أسهم جديدة [[f|%]]. ما تكلفة الأسهم الجديدة؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[k|%2]]", "[[w3|%2]]"]
  correct: 2
  solution: |
    $$
    \frac{[[D1|2]]}{[[P0|g]] \times (1 - [[f|%]])} + [[g|%]] = [[k|%2]]
    $$

    الخيار (أ) هو تكلفة الأرباح المحتجزة. الخيار (ب) ضرب في واحد ناقص التكاليف بدل القسمة. الخيار (د) قسم النمو أيضا، وتكاليف الإصدار لا تغير النمو.

- id: c11-i-10
  kind: mcq
  part: I
  text: |
    مشروع يعطي 7% بعد الضريبة. الشركة تقترض بفائدة 10%، والضريبة 20%. ماذا يفعل القرض بعائد المالكين؟
  options: ["يرفعه", "يخفضه", "لا يغيره", "يرفعه في السنة الأولى فقط"]
  correct: 1
  solution: |
    تكلفة القرض بعد الضريبة:

    $$
    10\% \times (1 - 20\%) = 8\%
    $$

    المشروع يعطي 7%، أقل من 8%. كل دينار مقترض يكلف أكثر مما يعطي، فينخفض عائد المالكين.

- id: c11-i-11
  kind: mcq
  part: I
  text: |
    شركة لها قسم مخاطرته منخفضة وقسم مخاطرته مرتفعة، وتستخدم متوسطها المرجح حدا أدنى واحدا للقسمين. مع الوقت:
  options: ["يكبر القسم منخفض المخاطرة", "يكبر القسم مرتفع المخاطرة وتزيد مخاطرة الشركة", "لا يتغير شيء", "ينخفض المتوسط المرجح"]
  correct: 1
  solution: |
    الحد الواحد أعلى مما يستحقه القسم الآمن، فيرفض مشاريعه الجيدة. وأقل مما يستحقه القسم الخطر، فيقبل مشاريع لا تغطي مخاطرتها. ينمو القسم الخطر، وترتفع مخاطرة الشركة كلها، ثم يرتفع متوسطها.

- id: c11-i-12
  kind: mcq
  part: I
  vars: {de: 0.5}
  random: {de: [0.25, 0.75, 0.25]}
  calc:
    - w = de/(1 + de)
    - w1 = de
    - w2 = 1/(1 + de)
    - w3 = de/(2 + de)
  text: |
    نسبة الدين إلى حقوق الملكية لشركة [[de|g]]. ما وزن الدين في المتوسط المرجح؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[w|%2]]", "[[w3|%2]]"]
  correct: 2
  solution: |
    $$
    w_d = \frac{[[de|g]]}{1 + [[de|g]]} = [[w|%2]]
    $$

    الخيار (أ) خلط النسبة بالوزن. الخيار (ب) هو وزن حقوق الملكية.
