- id: c11-h-01
  kind: problem
  part: H
  text: |
    ابن جدولا في Excel يحسب العائد حتى الاستحقاق لسند قيمته الاسمية 1,000 دينار وكوبونه 7% لمدة 10 سنوات، لأسعار من 900 إلى 1,100 دينار بخطوة 50. ماذا تلاحظ؟
  calc:
    - y1 = YTM(10, 70, 1000, 900)
    - y2 = YTM(10, 70, 1000, 950)
    - y3 = YTM(10, 70, 1000, 1000)
    - y4 = YTM(10, 70, 1000, 1050)
    - y5 = YTM(10, 70, 1000, 1100)
  solution: |
    في العمود A الأسعار، وفي B:

    ```excel
    =RATE(10, 70, -A2, 1000)
    ```

    | السعر | العائد حتى الاستحقاق |
    | --- | --- |
    | 900 | [[y1|%2]] |
    | 950 | [[y2|%2]] |
    | 1,000 | [[y3|%2]] |
    | 1,050 | [[y4|%2]] |
    | 1,100 | [[y5|%2]] |

    كلما ارتفع السعر، انخفض العائد. عند السعر 1,000 يساوي العائد الكوبون. الشركة التي تبيع سنداتها بسعر منخفض تقترض بتكلفة أعلى.

- id: c11-h-02
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يحسب المتوسط المرجح لنسب دين من 0% إلى 70% بخطوة 10%، إذا كانت تكلفة الدين قبل الضريبة 6% زائد 0.1 ضرب مربع نسبة الدين، وتكلفة حقوق الملكية تتبع المعادلة التالية، بتكلفة بلا دين 12% وضريبة 20%:

    $$
    k_e = k_u + (k_u - k_d)\,\frac{V_d}{V_e}\,(1 - t)
    $$

    ما أفضل نسبة دين؟
  calc:
    - k0 = 0.12
    - d3 = 0.06 + 0.1*0.3**2
    - e3 = 0.12 + (0.12 - d3)*(0.3/0.7)*0.8
    - w3 = 0.3*d3*0.8 + 0.7*e3
    - d4 = 0.06 + 0.1*0.4**2
    - e4 = 0.12 + (0.12 - d4)*(0.4/0.6)*0.8
    - w4 = 0.4*d4*0.8 + 0.6*e4
    - d5 = 0.06 + 0.1*0.5**2
    - e5 = 0.12 + (0.12 - d5)*(0.5/0.5)*0.8
    - w5 = 0.5*d5*0.8 + 0.5*e5
  solution: |
    ```python
    ku, t = 0.12, 0.20
    best = None
    for k in range(0, 8):
        wd = k / 10
        kd = 0.06 + 0.1 * wd ** 2
        ke = ku + (ku - kd) * wd / (1 - wd) * (1 - t)
        wacc = wd * kd * (1 - t) + (1 - wd) * ke
        print(f"{wd:.0%}  kd {kd:.2%}  ke {ke:.2%}  WACC {wacc:.2%}")
        if best is None or wacc < best[1]:
            best = (wd, wacc)
    print("best", best)
    ```

    بعض النتائج:

    | نسبة الدين | تكلفة الدين | تكلفة حقوق الملكية | المتوسط |
    | --- | --- | --- | --- |
    | 30% | [[d3|%2]] | [[e3|%2]] | [[w3|%2]] |
    | 40% | [[d4|%2]] | [[e4|%2]] | [[w4|%2]] |
    | 50% | [[d5|%2]] | [[e5|%2]] | [[w5|%2]] |

    عند 0% المتوسط [[k0|%2]]. المتوسط ينخفض ثم يرتفع، لأن تكلفة الدين ترتفع مع مربع النسبة. شغل البرنامج لترى كل الأسطر وأفضل نسبة.

- id: c11-h-03
  kind: problem
  part: H
  text: |
    في Excel، ضع في الخلايا: B1 سعر السهم 28، وB2 آخر توزيع 1.40، وB3 النمو 5%، وB4 تكاليف الإصدار 6%، وB5 النسبة الخالية من المخاطرة 4%، وB6 عائد السوق 10.5%، وB7 بيتا 1.15. اكتب صيغ تكلفة الأرباح المحتجزة، والأسهم الجديدة، ونموذج تسعير الأصول الرأسمالية، ومتوسط الطريقتين للأرباح المحتجزة.
  calc:
    - D1 = 1.40*1.05
    - kr = D1/28 + 0.05
    - kn = D1/(28*0.94) + 0.05
    - kc = 0.04 + 1.15*(0.105 - 0.04)
    - ka = (kr + kc)/2
  solution: |
    ```excel
    B9:  =B2*(1+B3)/B1 + B3
    B10: =B2*(1+B3)/(B1*(1-B4)) + B3
    B11: =B5 + B7*(B6-B5)
    B12: =AVERAGE(B9, B11)
    ```

    النتائج: الأرباح المحتجزة [[kr|%2]]، والأسهم الجديدة [[kn|%2]]، ونموذج تسعير الأصول [[kc|%2]]، والمتوسط [[ka|%2]].

- id: c11-h-04
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يرسم جدول تكلفة المال الإضافي لشركة: المتوسط المرجح 10% لأول 800,000 دينار، و12% بعدها. المشاريع: أ 300,000 بمعدل 17%، وب 500,000 بمعدل 13%، وج 300,000 بمعدل 11.5%، ود 200,000 بمعدل 9%. البرنامج يقرر لكل مشروع.
  solution: |
    ```python
    projects = [("A", 300000, 0.17), ("B", 500000, 0.13), ("C", 300000, 0.115), ("D", 200000, 0.09)]
    projects.sort(key=lambda p: -p[2])

    def cost_of_money(total):
        return 0.10 if total <= 800000 else 0.12

    total = 0
    for name, cost, irr in projects:
        k = cost_of_money(total + cost)
        if irr > k:
            total += cost
            print(name, "accept", f"{irr:.1%} > {k:.0%}")
        else:
            print(name, "reject", f"{irr:.1%} < {k:.0%}")
    print("invested", total)
    ```

    النتيجة: أ وب يقبلان باستثمار 800,000 دينار، وج ود يرفضان. هذا يطابق حل المسألة في الجزء و. الدالة تأخذ المجموع بعد المشروع، لأن المشروع كله يموله مال الشريحة التي يصل إليها.

- id: c11-h-05
  kind: problem
  part: H
  text: |
    ابن في Excel جدول تدفقات المالكين لمشروع يكلف 500,000 دينار، وتدفقه التشغيلي بعد الضريبة 148,800 دينار لمدة 5 سنوات، ممول 60% بقرض بفائدة 8% وأقساط متساوية، والضريبة 20%. الأعمدة: الرصيد في البداية، والفائدة، والقسط، والأصل، والوفر الضريبي، وتدفق المالكين. ثم احسب معدل المالكين.
  calc:
    - L = 300000
    - A = L*AP(0.08, 5)
    - I1 = 0.08*L
    - E1 = 148800 - A + 0.2*I1
  solution: |
    الصف 2 للسنة 1، والرصيد الأول في B2 يساوي 300,000:

    ```excel
    C2: =0.08*B2
    D2: =PMT(0.08, 5, -300000)
    E2: =D2-C2
    F2: =0.2*C2
    G2: =148800-D2+F2
    B3: =B2-E2
    ```

    انسخ الصيغ حتى السنة 5. القسط [[A|2]]، وتدفق المالكين في السنة 1 [[E1|2]]. في G1 ضع -200000 لدفعة المالكين في السنة 0، ثم:

    ```excel
    =IRR(G1:G6)
    ```

    النتيجة تطابق المثال في الفصل، لأن الأرقام نفسها.

- id: c11-h-06
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يحسب تكلفة حقوق الملكية بنموذج تسعير الأصول الرأسمالية لقيم بيتا من 0.5 إلى 2.0 بخطوة 0.25، بنسبة خالية من المخاطرة 4% وعائد سوق 10%. ثم المتوسط المرجح لكل قيمة، بنسبة دين 30% وتكلفة دين 7% وضريبة 20%.
  calc:
    - k1 = 0.04 + 1.0*0.06
    - w1 = 0.3*0.07*0.8 + 0.7*k1
    - k2 = 0.04 + 2.0*0.06
    - w2 = 0.3*0.07*0.8 + 0.7*k2
  solution: |
    ```python
    rf, rm, wd, kd, t = 0.04, 0.10, 0.30, 0.07, 0.20
    b = 0.5
    while b <= 2.0 + 1e-9:
        ke = rf + b * (rm - rf)
        wacc = wd * kd * (1 - t) + (1 - wd) * ke
        print(f"beta {b:.2f}  ke {ke:.2%}  WACC {wacc:.2%}")
        b += 0.25
    ```

    عند بيتا 1: تكلفة حقوق الملكية [[k1|%2]]، والمتوسط [[w1|%2]]. عند بيتا 2: [[k2|%2]] و[[w2|%2]]. كل زيادة 0.25 في بيتا ترفع تكلفة حقوق الملكية 1.5%، والمتوسط 1.05%.

- id: c11-h-07
  kind: problem
  part: H
  text: |
    ابن جدولا في Excel لسعر سند قيمته الاسمية 1,000 دينار وكوبونه 8% لمدة 15 سنة، عند عوائد مطلوبة 6% و8% و10% و12%. ثم كرر لسند مدته 3 سنوات. أي السندين يتأثر سعره أكثر بتغير العائد؟
  calc:
    - a6 = 80*PA(0.06, 15) + 1000*PF(0.06, 15)
    - a12 = 80*PA(0.12, 15) + 1000*PF(0.12, 15)
    - b6 = 80*PA(0.06, 3) + 1000*PF(0.06, 3)
    - b12 = 80*PA(0.12, 3) + 1000*PF(0.12, 3)
  solution: |
    ```excel
    =PV(A2, 15, -80, -1000)
    =PV(A2, 3, -80, -1000)
    ```

    | العائد | سند 15 سنة | سند 3 سنوات |
    | --- | --- | --- |
    | 6% | [[a6|2]] | [[b6|2]] |
    | 12% | [[a12|2]] | [[b12|2]] |

    سعر السند الطويل يتغير أكثر بكثير، لأن دفعاته بعيدة، وأثر الخصم يتراكم عليها. لذلك السند الطويل أخطر على المستثمر إذا ارتفعت الفوائد.

- id: c11-h-08
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يحسب المتوسط المرجح لشركة من بيانات السوق: 15,000 سند بسعر 970 دينار وكوبون 7% لمدة 8 سنوات، و2,000,000 سهم بسعر 12 دينار وبيتا 1.2، والنسبة الخالية من المخاطرة 4%، وعائد السوق 10%، والضريبة 20%.
  calc:
    - kd = YTM(8, 70, 1000, 970)
    - ke = 0.04 + 1.2*0.06
    - D = 15000*970
    - E = 2000000*12
    - W = D/(D + E)*kd*0.8 + E/(D + E)*ke
  solution: |
    ```python
    import numpy_financial as npf

    kd = npf.rate(8, 70, -970, 1000)
    ke = 0.04 + 1.2 * (0.10 - 0.04)
    D, E, t = 15000 * 970, 2000000 * 12, 0.20
    wacc = D / (D + E) * kd * (1 - t) + E / (D + E) * ke
    print(f"kd {kd:.4f}  ke {ke:.4f}  WACC {wacc:.4f}")
    ```

    تكلفة الدين [[kd|%2]]، وتكلفة حقوق الملكية [[ke|%2]]، والمتوسط [[W|%2]].
