items:

- id: c11-e-01
  kind: problem
  part: E
  vars: {t: 0.25}
  random: {t: [0.10, 0.35, 0.01]}
  calc:
    - W1 = 0.1*0.06*(1 - t) + 0.9*0.115
    - W3 = 0.3*0.07*(1 - t) + 0.7*0.125
    - W5 = 0.5*0.09*(1 - t) + 0.5*0.145
    - Wm = min(W1, W3, W5)
  text: |
    مصنع ألبان يقارن ثلاث نسب دين. التقديرات:

    | نسبة الدين | تكلفة الدين | تكلفة حقوق الملكية |
    | --- | --- | --- |
    | 10% | 6% | 11.5% |
    | 30% | 7% | 12.5% |
    | 50% | 9% | 14.5% |

    الضريبة [[t|%]]. أي نسبة يختار؟
  solution: |
    $$
    0.1 \times 6\% \times (1 - [[t|%]]) + 0.9 \times 11.5\% = [[W1|%2]]
    $$

    $$
    0.3 \times 7\% \times (1 - [[t|%]]) + 0.7 \times 12.5\% = [[W3|%2]]
    $$

    $$
    0.5 \times 9\% \times (1 - [[t|%]]) + 0.5 \times 14.5\% = [[W5|%2]]
    $$

    أقل متوسط [[Wm|%2]]، عند نسبة دين [[pick(Wm == W1, "10%", pick(Wm == W3, "30%", "50%"))]]. كلما ارتفعت الضريبة، صار الدين أرخص بعد الضريبة، فتنتقل أفضل نسبة نحو دين أكثر.

- id: c11-e-02
  kind: problem
  part: E
  vars: {ku: 0.12, kd: 0.07, de: 0.6, t: 0.20}
  random: {ku: [0.09, 0.15, 0.005], kd: [0.04, 0.08, 0.005], de: [0.2, 1.5, 0.1], t: [0.15, 0.30, 0.01]}
  calc:
    - ke = ku + (ku - kd)*de*(1 - t)
    - wd = de/(1 + de)
    - W = wd*kd*(1 - t) + (1 - wd)*ke
  text: |
    تكلفة حقوق الملكية لشركة بلا ديون [[ku|%]]. إذا اقترضت حتى تصبح نسبة الدين إلى حقوق الملكية [[de|g]]، بتكلفة دين [[kd|%]]، فإن تكلفة حقوق الملكية ترتفع حسب المعادلة:

    $$
    k_e = k_u + (k_u - k_d)\,\frac{V_d}{V_e}\,(1 - t)
    $$

    الضريبة [[t|%]]. احسب تكلفة حقوق الملكية والمتوسط المرجح بعد القرض.
  solution: |
    $$
    k_e = [[ku|%]] + ([[ku|%]] - [[kd|%]]) \times [[de|g]] \times (1 - [[t|%]]) = [[ke|%2]]
    $$

    الأوزان:

    $$
    w_d = \frac{[[de|g]]}{1 + [[de|g]]} = [[wd|f4]]
    $$

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke|%2]] = [[W|%2]]
    $$

    المتوسط أقل من [[ku|%]] بسبب الوفر الضريبي على الفائدة فقط. بدون ضريبة كان سيبقى [[ku|%]]: ارتفاع تكلفة حقوق الملكية يلغي رخص الدين تماما.

- id: c11-e-03
  kind: problem
  part: E
  vars: {ku: 0.11, kd: 0.065, d1: 0.25, d2: 1.0, t: 0.20}
  random: {ku: [0.09, 0.15, 0.005], kd: [0.04, 0.08, 0.005], d1: [0.1, 0.5, 0.05], d2: [0.6, 2.0, 0.1], t: [0.15, 0.30, 0.01]}
  calc:
    - k1 = ku + (ku - kd)*d1*(1 - t)
    - k2 = ku + (ku - kd)*d2*(1 - t)
    - w1 = d1/(1 + d1)
    - w2 = d2/(1 + d2)
    - W1 = w1*kd*(1 - t) + (1 - w1)*k1
    - W2 = w2*kd*(1 - t) + (1 - w2)*k2
  text: |
    بنفس معادلة المسألة السابقة، شركة تكلفة حقوق ملكيتها بلا دين [[ku|%]]، وتكلفة دينها [[kd|%]]، والضريبة [[t|%]]. قارن المتوسط المرجح عند نسبة دين إلى حقوق ملكية [[d1|g]] و[[d2|g]].
  solution: |
    عند [[d1|g]]:

    $$
    k_e = [[ku|%]] + ([[ku|%]] - [[kd|%]]) \times [[d1|g]] \times (1 - [[t|%]]) = [[k1|%2]]
    $$

    $$
    [[w1|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-w1|f4]] \times [[k1|%2]] = [[W1|%2]]
    $$

    عند [[d2|g]]:

    $$
    k_e = [[ku|%]] + ([[ku|%]] - [[kd|%]]) \times [[d2|g]] \times (1 - [[t|%]]) = [[k2|%2]]
    $$

    $$
    [[w2|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-w2|f4]] \times [[k2|%2]] = [[W2|%2]]
    $$

    في هذه المعادلة يستمر المتوسط في الانخفاض مع الدين، لأنها تفترض أن تكلفة الدين ثابتة. في الواقع يرفع البنك الفائدة عندما يكثر الدين، فيتوقف الانخفاض.

- id: c11-e-04
  kind: problem
  part: E
  calc:
    - t = 0.20
    - W0 = 0.130
    - W1 = 0.15*0.065*(1 - t) + 0.85*0.134
    - W2 = 0.30*0.070*(1 - t) + 0.70*0.142
    - W3 = 0.45*0.085*(1 - t) + 0.55*0.158
    - W4 = 0.60*0.110*(1 - t) + 0.40*0.190
  text: |
    تقديرات شركة نقل لتكلفة التمويل، والضريبة 20%:

    | نسبة الدين | تكلفة الدين | تكلفة حقوق الملكية |
    | --- | --- | --- |
    | 0% | لا يوجد | 13.0% |
    | 15% | 6.5% | 13.4% |
    | 30% | 7.0% | 14.2% |
    | 45% | 8.5% | 15.8% |
    | 60% | 11.0% | 19.0% |

    احسب المتوسط المرجح لكل نسبة، وحدد أفضل نسبة.
  solution: |
    | نسبة الدين | المتوسط المرجح |
    | --- | --- |
    | 0% | [[W0|%2]] |
    | 15% | [[W1|%2]] |
    | 30% | [[W2|%2]] |
    | 45% | [[W3|%2]] |
    | 60% | [[W4|%2]] |

    مثال على السطر الثالث:

    $$
    0.30 \times 7.0\% \times 0.8 + 0.70 \times 14.2\% = [[W2|%2]]
    $$

    أقل متوسط [[min(W0, W1, W2, W3, W4)|%2]]. المنحنى مسطح قرب القاع: الفرق بين النسب المجاورة صغير. لذلك تختار الشركات مجالا للدين، وليس رقما واحدا.

- id: c11-e-05
  kind: problem
  part: E
  vars: {D: 2000000, r: 0.08, t: 0.20}
  random: {D: [500000, 5000000, 100000], r: [0.05, 0.12, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - I = r*D
    - S = t*I
    - PS = S/r
  text: |
    شركة عليها دين دائم [[D|g]] دينار بفائدة [[r|%]]، تجدده كلما استحق. الضريبة [[t|%]]. ما الوفر الضريبي السنوي؟ وما قيمته الحالية إذا خصم بنسبة الفائدة؟
  solution: |
    $$
    I = [[r|%]] \times [[D|g]] = [[I|g]]
    $$

    $$
    t\,I = [[t|%]] \times [[I|g]] = [[S|g]]
    $$

    الوفر يستمر بلا نهاية، فقيمته الحالية كالتكلفة المرسملة في الفصل الثالث:

    $$
    \frac{[[S|g]]}{[[r|%]]} = [[PS|g]]
    $$

    وهي تساوي نسبة الضريبة ضرب الدين. هذا ما تكسبه الشركة من الدين، وما يقابله من مخاطرة الإفلاس يحدد إلى أين تقترض.

- id: c11-e-06
  kind: problem
  part: E
  vars: {de: 0.75, wd: 0.25}
  random: {de: [0.1, 2.0, 0.05], wd: [0.1, 0.7, 0.05]}
  calc:
    - w1 = de/(1 + de)
    - d2 = wd/(1 - wd)
  text: |
    (أ) نسبة الدين إلى حقوق الملكية لشركة [[de|g]]. ما وزن الدين في تمويلها؟ (ب) وزن الدين في شركة أخرى [[wd|%]]. ما نسبة الدين إلى حقوق الملكية فيها؟
  solution: |
    (أ)

    $$
    w_d = \frac{V_d/V_e}{1 + V_d/V_e} = \frac{[[de|g]]}{1 + [[de|g]]} = [[w1|%2]]
    $$

    (ب)

    $$
    \frac{V_d}{V_e} = \frac{w_d}{1 - w_d} = \frac{[[wd|f4]]}{[[1-wd|f4]]} = [[d2|2]]
    $$

- id: c11-e-07
  kind: problem
  part: E
  vars: {EBIT: 900000, r: 0.09, m: 3}
  random: {EBIT: [200000, 3000000, 50000], r: [0.06, 0.12, 0.005], m: [2, 5, 0.5]}
  calc:
    - Imax = EBIT/m
    - Dmax = Imax/r
  text: |
    الربح التشغيلي لشركة قبل الفائدة والضريبة [[EBIT|g]] دينار سنويا. البنك يشترط ألا تقل نسبة الربح التشغيلي إلى الفائدة عن [[m|g]]. فائدة القروض [[r|%]]. ما أكبر دين تستطيع الشركة أخذه؟
  solution: |
    أكبر فائدة سنوية مسموحة:

    $$
    \frac{[[EBIT|g]]}{[[m|g]]} = [[Imax|2]]
    $$

    أكبر دين:

    $$
    \frac{[[Imax|2]]}{[[r|%]]} = [[Dmax|2]]
    $$

    البنك يضع هذا الشرط ليبقى للشركة هامش إذا انخفض ربحها: الربح يمكن أن ينخفض إلى [[1/m|%]] من قيمته قبل أن تعجز عن دفع الفائدة.

- id: c11-e-08
  kind: problem
  part: E
  vars: {ke0: 0.12, kd: 0.10, wd: 0.6, ke: 0.20, t: 0.20}
  random: {ke0: [0.10, 0.14, 0.005], kd: [0.08, 0.12, 0.005], wd: [0.5, 0.7, 0.05], ke: [0.17, 0.24, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - Wf = wd*kd*(1 - t) + (1 - wd)*ke0
    - Wt = wd*kd*(1 - t) + (1 - wd)*ke
  text: |
    شركة بلا ديون، تكلفة حقوق ملكيتها [[ke0|%]]. مدير مالي يقترح تمويل [[wd|%]] بالدين بتكلفة [[kd|%]]، ويحسب المتوسط المرجح بافتراض أن تكلفة حقوق الملكية تبقى [[ke0|%]]. المساهمون في الواقع سيطلبون [[ke|%]] بعد هذا الدين. الضريبة [[t|%]]. ما المتوسط الذي حسبه المدير؟ وما المتوسط الصحيح؟
  solution: |
    حساب المدير:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke0|%]] = [[Wf|%2]]
    $$

    الحساب الصحيح:

    $$
    [[wd|f4]] \times [[kd|%]] \times (1 - [[t|%]]) + [[1-wd|f4]] \times [[ke|%]] = [[Wt|%2]]
    $$

    الدين يرفع مخاطرة المساهمين، فيرفع العائد الذي يطلبونه. تجاهل ذلك يجعل الدين يبدو أرخص مما هو، ويدفع الشركة إلى قبول مشاريع لا تغطي تكلفة رأس المال الفعلية.

- id: c11-e-09
  kind: problem
  part: E
  vars: {V: 1000000, wd: 0.5, r: 0.08, Eh: 200000, El: 60000, t: 0.20}
  random: {V: [500000, 3000000, 100000], wd: [0.3, 0.7, 0.1], r: [0.06, 0.11, 0.005], Eh: [100000, 600000, 10000], El: [10000, 200000, 10000], t: [0.15, 0.30, 0.01]}
  calc:
    - Eh = max(Eh, V*0.16)
    - El = min(El, V*0.07)
    - D = wd*V
    - E = V - D
    - I = r*D
    - Rh0 = Eh*(1 - t)/V
    - Rl0 = El*(1 - t)/V
    - Rh1 = (Eh - I)*(1 - t)/E
    - Rl1 = (El - I)*(1 - t)/E
  text: |
    شركة استثمارها [[V|g]] دينار. ربحها التشغيلي [[Eh|g]] دينار في سنة جيدة، و[[El|g]] دينار في سنة سيئة. الضريبة [[t|%]]. قارن العائد على حقوق الملكية في السنتين بين تمويل كامل من المالكين، وتمويل [[wd|%]] بقرض فائدته [[r|%]]. افترض أن الشركة تحصل على الوفر الضريبي حتى لو كان ربحها سالبا، من أعمالها الأخرى.
  solution: |
    **بدون دين:** حقوق الملكية [[V|g]] دينار.

    $$
    \frac{[[Eh|g]] \times (1 - [[t|%]])}{[[V|g]]} = [[Rh0|%2]] \qquad \frac{[[El|g]] \times (1 - [[t|%]])}{[[V|g]]} = [[Rl0|%2]]
    $$

    **مع الدين:** القرض [[D|g]]، وحقوق الملكية [[E|g]]، والفائدة [[I|g]] دينار.

    $$
    \frac{([[Eh|g]] - [[I|g]]) \times (1 - [[t|%]])}{[[E|g]]} = [[Rh1|%2]]
    $$

    $$
    \frac{([[El|g]] - [[I|g]]) \times (1 - [[t|%]])}{[[E|g]]} = [[Rl1|%2]]
    $$

    الدين يوسع المسافة بين السنتين: العائد الجيد يصبح أعلى، والسيئ يصبح أسوأ. لهذا يطلب المساهمون عائدا أعلى من شركة عليها ديون أكثر.
