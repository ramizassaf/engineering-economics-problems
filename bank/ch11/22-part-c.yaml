items:

- id: c11-c-01
  kind: problem
  part: C
  vars: {P0: 40, D1: 2.2, g: 0.04}
  random: {P0: [10, 80, 1], D1: [0.5, 5, 0.1], g: [0.02, 0.07, 0.005]}
  calc:
    - D1 = min(D1, floor(P0*0.08*10)/10)
    - D1 = max(D1, 0.3)
    - ke = D1/P0 + g
  text: |
    سعر سهم [[P0|g]] دينار. التوزيع المتوقع في نهاية السنة [[D1|2]] دينار، ونمو التوزيعات [[g|%]] سنويا. ما تكلفة حقوق الملكية؟
  solution: |
    $$
    k_e = \frac{[[D1|2]]}{[[P0|g]]} + [[g|%]] = [[ke|%2]]
    $$

    الجزء الأول عائد التوزيع، والثاني نمو السعر مع التوزيعات.

- id: c11-c-02
  kind: problem
  part: C
  vars: {P0: 18, D0: 0.9, g: 0.06, f: 0.08}
  random: {P0: [8, 50, 1], D0: [0.3, 3, 0.1], g: [0.02, 0.08, 0.005], f: [0.04, 0.12, 0.01]}
  calc:
    - D0 = min(D0, floor(P0*0.07*10)/10)
    - D0 = max(D0, 0.2)
    - D1 = D0*(1 + g)
    - kr = D1/P0 + g
    - kn = D1/(P0*(1 - f)) + g
  text: |
    شركة كهرباء دفعت توزيعا [[D0|2]] دينار للسهم هذه السنة، وسعر سهمها [[P0|g]] دينار. نمو التوزيعات المتوقع [[g|%]]. ما تكلفة الأرباح المحتجزة؟ وما تكلفة أسهم جديدة بتكاليف إصدار [[f|%]]؟
  solution: |
    $$
    D_1 = [[D0|2]] \times (1 + [[g|%]]) = [[D1|4]]
    $$

    $$
    k_e = \frac{[[D1|4]]}{[[P0|g]]} + [[g|%]] = [[kr|%2]]
    $$

    $$
    k_e = \frac{[[D1|4]]}{[[P0|g]] \times (1 - [[f|%]])} + [[g|%]] = [[kn|%2]]
    $$

    الخطأ الشائع أن نستخدم D0 بدل D1: النموذج يحتاج التوزيع القادم، لا الماضي.

- id: c11-c-03
  kind: problem
  part: C
  vars: {rf: 0.035, rm: 0.10, b: 0.9}
  random: {rf: [0.02, 0.06, 0.005], rm: [0.08, 0.14, 0.005], b: [0.5, 2.0, 0.1]}
  calc:
    - ke = rf + b*(rm - rf)
  text: |
    النسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق المتوقع [[rm|%]]، وبيتا سهم شركة [[b|g]]. ما تكلفة حقوق الملكية بنموذج تسعير الأصول الرأسمالية؟
  solution: |
    $$
    k_e = [[rf|%]] + [[b|g]] \times ([[rm|%]] - [[rf|%]]) = [[ke|%2]]
    $$

- id: c11-c-04
  kind: problem
  part: C
  vars: {rf: 0.04, rm: 0.11, ke: 0.145}
  random: {rf: [0.02, 0.06, 0.005], rm: [0.08, 0.13, 0.005], ke: [0.08, 0.20, 0.005]}
  calc:
    - ke = max(ke, rf + 0.02)
    - b = (ke - rf)/(rm - rf)
  text: |
    محلل قدر أن المساهمين يطلبون [[ke|%]] على سهم شركة. النسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]]. ما قيمة بيتا التي يفترضها هذا التقدير؟
  solution: |
    من نموذج تسعير الأصول الرأسمالية:

    $$
    \beta = \frac{k_e - r_f}{r_m - r_f}
    $$

    $$
    \beta = \frac{[[ke|%]] - [[rf|%]]}{[[rm|%]] - [[rf|%]]} = [[b|2]]
    $$

- id: c11-c-05
  kind: problem
  part: C
  vars: {rf: 0.04, rm: 0.10, b: 1.2, P0: 30, D1: 1.5}
  random: {rf: [0.02, 0.05, 0.005], rm: [0.09, 0.13, 0.005], b: [0.8, 1.6, 0.1], P0: [10, 60, 1], D1: [0.3, 3, 0.1]}
  calc:
    - ke = rf + b*(rm - rf)
    - D1 = min(D1, floor(P0*(ke - 0.01)*10)/10)
    - D1 = max(D1, 0.1)
    - g = ke - D1/P0
  text: |
    بيتا سهم [[b|g]]، والنسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]]. سعر السهم [[P0|g]] دينار، والتوزيع المتوقع بعد سنة [[D1|2]] دينار. ما نسبة نمو التوزيعات التي يتوقعها السوق؟
  solution: |
    تكلفة حقوق الملكية من النموذج الأول:

    $$
    k_e = [[rf|%]] + [[b|g]] \times ([[rm|%]] - [[rf|%]]) = [[ke|%2]]
    $$

    نفس التكلفة في نموذج نمو التوزيعات، فالنمو هو الباقي:

    $$
    g = k_e - \frac{D_1}{P_0} = [[ke|%2]] - \frac{[[D1|2]]}{[[P0|g]]} = [[g|%2]]
    $$

- id: c11-c-06
  kind: problem
  part: C
  vars: {Dp: 9, Pp: 95, f: 0.03}
  random: {Dp: [4, 12, 0.5], Pp: [70, 120, 1], f: [0.01, 0.06, 0.005]}
  calc:
    - kp = Dp/(Pp*(1 - f))
  text: |
    سهم ممتاز يدفع توزيعا ثابتا [[Dp|g]] دينار سنويا. سعره [[Pp|g]] دينار، وتكاليف إصدار أسهم جديدة منه [[f|%]]. ما تكلفة الأسهم الممتازة؟
  solution: |
    $$
    k_p = \frac{[[Dp|g]]}{[[Pp|g]] \times (1 - [[f|%]])} = [[kp|%2]]
    $$

    لا نضرب في واحد ناقص الضريبة: التوزيعات لا تخفض الضريبة.

- id: c11-c-07
  kind: problem
  part: C
  vars: {pr: 0.08, Pp: 92, f: 0.02, t: 0.20, kd: 0.075}
  random: {pr: [0.05, 0.10, 0.005], Pp: [80, 110, 1], f: [0.01, 0.05, 0.005], t: [0.15, 0.30, 0.01], kd: [0.05, 0.10, 0.005]}
  calc:
    - Dp = 100*pr
    - kp = Dp/(Pp*(1 - f))
    - ka = kd*(1 - t)
  text: |
    سهم ممتاز قيمته الاسمية 100 دينار، وتوزيعه [[pr|%]] من قيمته الاسمية سنويا. سعره في السوق [[Pp|g]] دينار، وتكاليف الإصدار [[f|%]]. نفس الشركة تقترض بتكلفة [[kd|%]] قبل الضريبة، والضريبة [[t|%]]. أيهما أرخص للشركة بعد الضريبة؟
  solution: |
    التوزيع السنوي:

    $$
    [[pr|%]] \times 100 = [[Dp|g]]
    $$

    $$
    k_p = \frac{[[Dp|g]]}{[[Pp|g]] \times (1 - [[f|%]])} = [[kp|%2]]
    $$

    الدين بعد الضريبة:

    $$
    [[kd|%]] \times (1 - [[t|%]]) = [[ka|%2]]
    $$

    الأرخص [[pick(ka < kp, "الدين", "الأسهم الممتازة")]]. الدين يستفيد من الوفر الضريبي، والأسهم الممتازة لا تستفيد.

- id: c11-c-08
  kind: problem
  part: C
  vars: {P0: 22, D1: 1.1, g: 0.06, rf: 0.04, rm: 0.105, b: 1.1}
  random: {P0: [10, 50, 1], D1: [0.3, 3, 0.1], g: [0.02, 0.07, 0.005], rf: [0.02, 0.05, 0.005], rm: [0.09, 0.13, 0.005], b: [0.7, 1.6, 0.1]}
  calc:
    - D1 = min(D1, floor(P0*0.08*10)/10)
    - D1 = max(D1, 0.2)
    - k1 = D1/P0 + g
    - k2 = rf + b*(rm - rf)
    - ka = (k1 + k2)/2
  text: |
    قدر تكلفة حقوق الملكية لشركة بالطريقتين، ثم خذ متوسطهما. سعر السهم [[P0|g]] دينار، والتوزيع القادم [[D1|2]] دينار، والنمو [[g|%]]. بيتا [[b|g]]، والنسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]].
  solution: |
    نموذج نمو التوزيعات:

    $$
    k_e = \frac{[[D1|2]]}{[[P0|g]]} + [[g|%]] = [[k1|%2]]
    $$

    نموذج تسعير الأصول الرأسمالية:

    $$
    k_e = [[rf|%]] + [[b|g]] \times ([[rm|%]] - [[rf|%]]) = [[k2|%2]]
    $$

    المتوسط:

    $$
    \frac{[[k1|%2]] + [[k2|%2]]}{2} = [[ka|%2]]
    $$

    إذا كان الفرق بين الطريقتين كبيرا، فراجع الافتراضات: نسبة النمو، أو قيمة بيتا.

- id: c11-c-09
  kind: problem
  part: C
  vars: {D1: 1.8, ke: 0.12, g: 0.05}
  random: {D1: [0.5, 4, 0.1], ke: [0.09, 0.16, 0.005], g: [0.01, 0.07, 0.005]}
  calc:
    - g = min(g, ke - 0.02)
    - P0 = D1/(ke - g)
  text: |
    مستثمر يطلب [[ke|%]] على سهم توزيعه القادم [[D1|2]] دينار، وينمو [[g|%]] سنويا بلا نهاية. ما أعلى سعر يدفعه للسهم اليوم؟
  solution: |
    السعر هو القيمة الحالية لسلسلة متدرجة نسبيا بلا نهاية:

    $$
    P_0 = \frac{D_1}{k_e - g} = \frac{[[D1|2]]}{[[ke|%]] - [[g|%]]} = [[P0|2]]
    $$

    نفس المعادلة التي أعطت تكلفة حقوق الملكية، محلولة للسعر.

- id: c11-c-10
  kind: problem
  part: C
  vars: {P0: 35, D1: 2.1, g: 0.05, f: 0.07}
  random: {P0: [10, 70, 1], D1: [0.4, 5, 0.1], g: [0.02, 0.07, 0.005], f: [0.03, 0.12, 0.01]}
  calc:
    - D1 = min(D1, floor(P0*0.08*10)/10)
    - D1 = max(D1, 0.2)
    - kr = D1/P0 + g
    - kn = D1/(P0*(1 - f)) + g
    - dk = kn - kr
  text: |
    سعر سهم [[P0|g]] دينار، والتوزيع القادم [[D1|2]] دينار، والنمو [[g|%]]. كم تزيد تكلفة الأسهم الجديدة على تكلفة الأرباح المحتجزة، إذا كانت تكاليف الإصدار [[f|%]]؟
  solution: |
    $$
    k_e = \frac{[[D1|2]]}{[[P0|g]]} + [[g|%]] = [[kr|%2]]
    $$

    $$
    k_e = \frac{[[D1|2]]}{[[P0|g]] \times (1 - [[f|%]])} + [[g|%]] = [[kn|%2]]
    $$

    الفرق [[dk|%2]]. تكاليف الإصدار ترفع عائد التوزيع فقط، ولا تغير النمو.

- id: c11-c-11
  kind: problem
  part: C
  vars: {roe: 0.15, b: 0.40, E: 3, P0: 30}
  random: {roe: [0.08, 0.20, 0.01], b: [0.2, 0.7, 0.05], E: [1, 6, 0.5], P0: [10, 60, 1]}
  calc:
    - g = b*roe
    - D1 = E*(1 - b)*(1 + g)
    - P0 = max(P0, ceil(D1/0.08))
    - ke = D1/P0 + g
  text: |
    شركة تحقق عائدا على حقوق الملكية [[roe|%]]، وتحتجز [[b|%]] من أرباحها وتوزع الباقي. ربح السهم هذه السنة [[E|g]] دينار، وسعر السهم [[P0|g]] دينار. إذا استمرت النسب كما هي، فما نسبة نمو التوزيعات؟ وما تكلفة حقوق الملكية؟
  solution: |
    الأرباح المحتجزة تستثمر بعائد [[roe|%]]، فتنمو الأرباح والتوزيعات بنسبة:

    $$
    g = b \times \mathrm{ROE} = [[b|%]] \times [[roe|%]] = [[g|%2]]
    $$

    التوزيع القادم: الجزء الموزع من ربح السنة القادمة:

    $$
    D_1 = [[E|g]] \times (1 - [[b|%]]) \times (1 + [[g|%2]]) = [[D1|4]]
    $$

    $$
    k_e = \frac{[[D1|4]]}{[[P0|g]]} + [[g|%2]] = [[ke|%2]]
    $$

- id: c11-c-12
  kind: problem
  part: C
  vars: {rf: 0.04, rm: 0.10, b1: 0.8, b2: 1.5}
  random: {rf: [0.02, 0.06, 0.005], rm: [0.08, 0.13, 0.005], b1: [0.5, 1.0, 0.1], b2: [1.1, 2.0, 0.1]}
  calc:
    - k1 = rf + b1*(rm - rf)
    - k2 = rf + b2*(rm - rf)
  text: |
    شركتان: الأولى تبيع مواد غذائية أساسية، وبيتا سهمها [[b1|g]]. الثانية تصنع سلعا كمالية، وبيتا سهمها [[b2|g]]. النسبة الخالية من المخاطرة [[rf|%]]، وعائد السوق [[rm|%]]. احسب تكلفة حقوق الملكية لكل منهما، وفسر الفرق.
  solution: |
    $$
    k_e = [[rf|%]] + [[b1|g]] \times [[rm-rf|%]] = [[k1|%2]]
    $$

    $$
    k_e = [[rf|%]] + [[b2|g]] \times [[rm-rf|%]] = [[k2|%2]]
    $$

    الناس يشترون الطعام الأساسي في الأزمات أيضا، فأرباح الأولى لا تتأثر كثيرا بحالة الاقتصاد. أرباح الثانية تنخفض بقوة في الركود، فمساهموها يطلبون عائدا أعلى.

- id: c11-c-13
  kind: problem
  part: C
  vars: {rf: 0.04, mrp: 0.06, b: 1.3, d: 0.015}
  random: {rf: [0.02, 0.06, 0.005], mrp: [0.04, 0.08, 0.005], b: [0.6, 1.8, 0.1], d: [0.005, 0.03, 0.005]}
  calc:
    - k1 = rf + b*mrp
    - k2 = rf + b*(mrp + d)
    - dk = k2 - k1
  text: |
    النسبة الخالية من المخاطرة [[rf|%]]، وعلاوة مخاطرة السوق [[mrp|%]]، وبيتا سهم [[b|g]]. بعد أزمة اقتصادية، ارتفعت علاوة مخاطرة السوق [[d|%]]. كم ارتفعت تكلفة حقوق الملكية؟
  solution: |
    قبل الأزمة:

    $$
    k_e = [[rf|%]] + [[b|g]] \times [[mrp|%]] = [[k1|%2]]
    $$

    بعدها:

    $$
    k_e = [[rf|%]] + [[b|g]] \times [[mrp+d|%]] = [[k2|%2]]
    $$

    الزيادة [[dk|%2]]، أي بيتا ضرب الزيادة في العلاوة. السهم الأخطر يتأثر أكثر.
