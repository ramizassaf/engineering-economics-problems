- id: c11-k-01
  kind: problem
  part: K
  vars: {I: 80000, PW: 22000}
  random: {I: [20000, 200000, 5000], PW: [-10000, 60000, 500]}
  calc:
    - PI = 1 + PW/I
  text: |
    مشروع استثماره في السنة 0 [[I|g]] دينار، وقيمته الحالية الصافية بالحد الأدنى للعائد [[PW|g]] دينار. ما مؤشر الربحية؟ وهل المشروع مقبول؟
  solution: |
    $$
    PI = 1 + \frac{PW}{I} = 1 + \frac{[[PW|g]]}{[[I|g]]} = [[PI|f4]]
    $$

    [[pick(PI > 1, "المؤشر أكبر من 1، فالمشروع مقبول: كل دينار مستثمر يعيد أكثر من دينار بالقيمة الحالية.", "المؤشر لا يزيد على 1، فالمشروع مرفوض: القيمة الحالية لما يعيده لا تغطي استثماره.")]]

- id: c11-k-02
  kind: problem
  part: K
  vars: {I: 120000, A: 32000, n: 6, i: 0.10}
  random: {I: [40000, 300000, 10000], A: [8000, 90000, 1000], n: [4, 10, 1], i: [0.08, 0.15, 0.01]}
  calc:
    - A = floor(I*AP(i - 0.02, n)/1000 + 0.5)*1000
    - P = A*PA(i, n)
    - PW = P - I
    - PI = P/I
  text: |
    مشروع يكلف [[I|g]] دينار، ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. الحد الأدنى [[i|%]]. احسب قيمته الحالية الصافية ومؤشر ربحيته.
  solution: |
    القيمة الحالية للتدفقات الداخلة:

    $$
    [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    $$
    PW = [[P|2]] - [[I|g]] = [[PW|2]]
    $$

    $$
    PI = \frac{[[P|2]]}{[[I|g]]} = [[PI|f4]]
    $$

    المؤشر يساوي واحدا زائد القيمة الصافية على الاستثمار.

- id: c11-k-03
  kind: problem
  part: K
  vars: {n: 7}
  random: {n: [4, 12, 1]}
  calc:
    - N = 2**n
    - M = 3*2**(n - 2)
  text: |
    أمام شركة [[n|n]] مشاريع مستقلة. (أ) كم مجموعة ممكنة يجب أن يفحصها الحصر الكامل؟ (ب) كم يصبح العدد إذا كان مشروعان منها متنافيين؟
  solution: |
    (أ) لكل مشروع خياران: ينفذ أو لا ينفذ:

    $$
    2^{[[n|n]]} = [[N|g]]
    $$

    (ب) المشروعان المتنافيان لهما ثلاث حالات فقط: الأول، أو الثاني، أو لا شيء. الباقي [[n-2|n]] مشاريع لكل منها خياران:

    $$
    3 \times 2^{[[n-2|n]]} = [[M|g]]
    $$

