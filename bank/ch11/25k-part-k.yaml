- id: c11-k-07
  kind: problem
  part: K
  text: |
    ميزانية شركة 100,000 دينار، وأمامها خمسة مشاريع مستقلة:

    | المشروع | التكلفة | القيمة الحالية |
    | --- | --- | --- |
    | P | 60,000 | 21,000 |
    | Q | 50,000 | 17,000 |
    | R | 40,000 | 13,000 |
    | S | 25,000 | 7,500 |
    | T | 10,000 | 3,600 |

    (أ) رتب المشاريع بمؤشر الربحية واختر من الأعلى. (ب) هل هذا هو الحل الأمثل؟
  solution: |
    (أ) المؤشرات:

    | المشروع | المؤشر |
    | --- | --- |
    | T | 1.360 |
    | P | 1.350 |
    | Q | 1.340 |
    | R | 1.325 |
    | S | 1.300 |

    نأخذ T ثم P، فالتكلفة 70,000. Q يرفعها إلى 120,000، وR إلى 110,000، فنتخطاهما. S يرفعها إلى 95,000، فنقبله. النتيجة T وP وS بقيمة حالية:

    $$
    3600 + 21000 + 7500 = 32100
    $$

    (ب) لا. المجموعة P وR تكلف 100,000 بالضبط، وقيمتها:

    $$
    21000 + 13000 = 34000
    $$

    المؤشر بدأ بالمشروع الصغير T، فأخذ مكانا جعل R لا يتسع. ترتيب المؤشر لا يضمن أفضل استخدام للميزانية عندما تكون المشاريع كبيرة مقارنة بها.

- id: c11-k-08
  kind: problem
  part: K
  text: |
    اكتب نموذج البرمجة بالأعداد الصحيحة لخمسة مشاريع A وB وC وD وE، تكاليفها 30، و40، و25، و50، و20 ألف دينار، وقيمها الحالية 9، و14، و6.5، و15.5، و7 آلاف دينار. الميزانية 100 ألف دينار. A وD لا ينفذان معا. C لا ينفذ إلا مع B. يجب تنفيذ E، لأنه متطلب قانوني.
  solution: |
    المتغيرات:

    $$
    x_j \in \{0, 1\}
    $$

    الهدف، بآلاف الدنانير:

    $$
    \max \; Z = 9\,x_A + 14\,x_B + 6.5\,x_C + 15.5\,x_D + 7\,x_E
    $$

    القيود:

    $$
    30\,x_A + 40\,x_B + 25\,x_C + 50\,x_D + 20\,x_E \le 100
    $$

    $$
    x_A + x_D \le 1
    $$

    $$
    x_C \le x_B
    $$

    $$
    x_E = 1
    $$

    كل علاقة بين المشاريع قيد واحد. الحل الأمثل A وB وE، بقيمة 30 ألف دينار. المجموعة A وD وE، الأفضل بدون قيود، ممنوعة بقيد التنافي.

- id: c11-k-09
  kind: problem
  part: K
  text: |
    ميزانية شركة اليوم 80,000 دينار، وفي السنة الأولى 15,000 دينار. المشاريع:

    | المشروع | التكلفة اليوم | التكلفة في السنة الأولى | القيمة الحالية |
    | --- | --- | --- | --- |
    | A | 40,000 | 10,000 | 12,000 |
    | B | 30,000 | 0 | 9,000 |
    | C | 25,000 | 15,000 | 8,500 |
    | D | 35,000 | 5,000 | 10,500 |

    ما الحل الأمثل؟ وما الحل لو لم يكن هناك قيد على السنة الأولى؟
  solution: |
    نفحص المجموعات التي تتسع في الميزانيتين معا. أفضلها:

    | المجموعة | اليوم | السنة الأولى | القيمة الحالية |
    | --- | --- | --- | --- |
    | A و D | 75,000 | 15,000 | 22,500 |
    | A و B | 70,000 | 10,000 | 21,000 |
    | B و D | 65,000 | 5,000 | 19,500 |

    الحل الأمثل A وD بقيمة 22,500 دينار، ويستخدم ميزانية السنة الأولى كلها. بدون قيد السنة الأولى يبقى الحل نفسه، لأن A وD تتسعان في الحالتين. المجموعة A وC تحتاج 25,000 في السنة الأولى، فهي ممنوعة مع القيد، وأقل قيمة بدونه.

- id: c11-k-10
  kind: problem
  part: K
  text: |
    ميزانية صندوق استثمار 100,000 دينار. المشاريع قابلة للتجزئة: يمكن أن يستثمر الصندوق في جزء من مشروع، فيأخذ نفس الجزء من قيمته الحالية. المشاريع هي المشاريع الخمسة في @sec-budget-data. ما أفضل توزيع؟
  solution: |
    عندما تقبل المشاريع التجزئة، يصبح ترتيب المؤشر هو الحل الأمثل: كل دينار يذهب إلى أعلى عائد متاح. المؤشرات: B وE بـ 1.35، ثم D بـ 1.31، ثم A بـ 1.30، ثم C بـ 1.26.

    | المشروع | الجزء | التكلفة | القيمة الحالية |
    | --- | --- | --- | --- |
    | B | كامل | 40,000 | 14,000 |
    | E | كامل | 20,000 | 7,000 |
    | D | 0.8 | 40,000 | 12,400 |

    المجموع 33,400 دينار، أكثر من أفضل مجموعة كاملة، 31,500. الفرق هو قيمة القدرة على التجزئة. مع المشاريع الحقيقية، التي تنفذ كاملة أو لا تنفذ، نعود إلى الحصر أو البرمجة بالأعداد الصحيحة.

- id: c11-k-11
  kind: problem
  part: K
  text: |
    بيانات المشاريع الخمسة في @sec-budget-data. الحل الأمثل بميزانية 90,000 دينار قيمته 30,000، وبميزانية 100,000 قيمته 31,500، وبميزانية 110,000 قيمته 36,500. الإدارة تستطيع اقتراض 10,000 دينار إضافية. ما أعلى تكلفة تقبلها لهذا المبلغ؟
  solution: |
    زيادة الميزانية من 100,000 إلى 110,000 تضيف إلى القيمة الحالية:

    $$
    36500 - 31500 = 5000
    $$

    القيمة الحالية للمشاريع محسوبة بالحد الأدنى للعائد، فهي ما يزيد على تكلفة المال العادية. أعلى ما تقبله الشركة: أن تكون القيمة الحالية للتكلفة الإضافية لهذا القرض، فوق الحد الأدنى، أقل من 5,000 دينار.

    الزيادة الأولى، من 90,000 إلى 100,000، أضافت 1,500 فقط. قيمة الدينار الإضافي ليست ثابتة، لأن المشاريع تؤخذ كاملة: تقفز عندما يسمح المبلغ الجديد بمجموعة مختلفة.

- id: c11-k-12
  kind: problem
  part: K
  text: |
    استخدم بيانات @sec-budget-data. ما الحل الأمثل إذا زادت الميزانية إلى 120,000 دينار؟ وما حل مؤشر الربحية؟
  solution: |
    بالحصر، أفضل المجموعات:

    | المجموعة | التكلفة | القيمة الحالية |
    | --- | --- | --- |
    | A و B و D | 120,000 | 38,500 |
    | A و B و C و E | 115,000 | 36,500 |
    | B و D و E | 110,000 | 36,500 |

    الحل الأمثل A وB وD بقيمة 38,500 دينار. مؤشر الربحية يختار B ثم E ثم D، بتكلفة 110,000 وقيمة 36,500 دينار. A وC لا يتسعان بعدها.

- id: c11-k-13
  kind: problem
  part: K
  text: |
    في @sec-budget-data، المشروعان A وD يستخدمان نفس الأرض، فلا ينفذان معا. ما الحل الأمثل بميزانية 100,000 دينار؟
  solution: |
    الحل السابق، A وD وE، لم يعد مسموحا. القيد:

    $$
    x_A + x_D \le 1
    $$

    أفضل مجموعة مسموحة: A وB وE، بتكلفة 90,000 وقيمة حالية 30,000 دينار. القيد كلف الشركة 1,500 دينار من القيمة الحالية.

- id: c11-k-14
  kind: problem
  part: K
  text: |
    في @sec-budget-data، المشروع C توسعة للمشروع B، فلا ينفذ إلا معه. هل يتغير الحل الأمثل بميزانية 100,000 دينار؟
  solution: |
    لا. القيد:

    $$
    x_C \le x_B
    $$

    الحل الأمثل A وD وE لا يحتوي C أصلا، فالقيد لا يؤثر فيه. قيد العلاقة يغير الحل فقط إذا كان الحل يخالفه.

- id: c11-k-15
  kind: problem
  part: K
  text: |
    في @sec-budget-data، بعض المشاريع تحتاج دفعة ثانية في السنة الأولى: A يحتاج 10,000، وC يحتاج 15,000، وD يحتاج 20,000، وE يحتاج 5,000 دينار، وB لا يحتاج شيئا. ميزانية السنة الأولى 30,000 دينار، وميزانية اليوم 100,000. ما الحل الأمثل؟
  solution: |
    المجموعة A وD وE تحتاج في السنة الأولى:

    $$
    10000 + 20000 + 5000 = 35000
    $$

    أكثر من 30,000، فهي ممنوعة. أفضل مجموعة مسموحة: A وB وE، بتكلفة 90,000 اليوم و15,000 في السنة الأولى، وقيمة حالية 30,000 دينار.

- id: c11-k-16
  kind: problem
  part: K
  text: |
    اكتب برنامج PuLP للمسألة السابقة، بقيد ميزانية لكل سنة، وتأكد من الجواب.
  solution: |
    ```python
    import pulp

    projects = {"A": (30000, 9000), "B": (40000, 14000), "C": (25000, 6500),
                "D": (50000, 15500), "E": (20000, 7000)}
    year1 = {"A": 10000, "B": 0, "C": 15000, "D": 20000, "E": 5000}

    model = pulp.LpProblem("two_budgets", pulp.LpMaximize)
    x = {p: pulp.LpVariable(p, cat="Binary") for p in projects}
    model += pulp.lpSum(projects[p][1] * x[p] for p in projects)
    model += pulp.lpSum(projects[p][0] * x[p] for p in projects) <= 100000
    model += pulp.lpSum(year1[p] * x[p] for p in projects) <= 30000
    model.solve(pulp.PULP_CBC_CMD(msg=0))
    print([p for p in projects if x[p].value() > 0.5], pulp.value(model.objective))
    ```

    النتيجة A وB وE، بقيمة 30,000 دينار، كما في الحل باليد.

- id: c11-k-17
  kind: concept
  part: K
  text: |
    لماذا يعطي ترتيب مؤشر الربحية الحل الأمثل تقريبا إذا كانت المشاريع صغيرة جدا مقارنة بالميزانية؟
  solution: |
    عندما تكون المشاريع صغيرة، يبقى من الميزانية في النهاية مبلغ صغير بدون استثمار. خسارة هذا المبلغ مهملة، فيقترب حل المؤشر من الأمثل. المشكلة تظهر عندما يكون المشروع المتخطى كبيرا ويترك فجوة كبيرة في الميزانية.

- id: c11-k-18
  kind: concept
  part: K
  text: |
    لماذا نعتبر القيمة الحالية للمال الذي يبقى من الميزانية بدون استثمار صفرا؟
  solution: |
    المال الباقي يستثمر في البدائل العادية للشركة بعائد يساوي الحد الأدنى. القيمة الحالية لاستثمار يعطي بالضبط الحد الأدنى صفر، فلا يضيف شيئا ولا ينقص.

- id: c11-k-19
  kind: concept
  part: K
  text: |
    لماذا لا نرتب المشاريع بمعدل العائد الداخلي ونختار من الأعلى، عندما تكون الميزانية محدودة؟
  solution: |
    المعدل نسبة، ولا يقول كم دينارا يضيف المشروع. مشروع صغير بمعدل 40% قد يضيف أقل من مشروع كبير بمعدل 20%. الهدف أكبر مجموع للقيم الحالية داخل الميزانية، والمعدل لا يقيس ذلك. هو مفيد فقط لترتيب أولي، مثل مؤشر الربحية.

- id: c11-k-20
  kind: problem
  part: K
  text: |
    اكتب برنامج Python يختار من ثمانية مشاريع، بآلاف الدنانير: التكلفة اليوم، والتكلفة في السنة الأولى، والقيمة الحالية.

    | المشروع | اليوم | السنة الأولى | القيمة الحالية |
    | --- | --- | --- | --- |
    | P1 | 120 | 40 | 38 |
    | P2 | 90 | 25 | 27 |
    | P3 | 150 | 60 | 50 |
    | P4 | 70 | 10 | 19 |
    | P5 | 110 | 45 | 36 |
    | P6 | 60 | 30 | 17 |
    | P7 | 80 | 20 | 25 |
    | P8 | 100 | 35 | 31 |

    الميزانية 400 اليوم و120 في السنة الأولى. P3 وP5 لا ينفذان معا، وP8 لا ينفذ إلا مع P7.
  solution: |
    ```python
    import pulp

    data = {"P1": (120, 40, 38), "P2": (90, 25, 27), "P3": (150, 60, 50), "P4": (70, 10, 19),
            "P5": (110, 45, 36), "P6": (60, 30, 17), "P7": (80, 20, 25), "P8": (100, 35, 31)}
    m = pulp.LpProblem("budget", pulp.LpMaximize)
    x = {p: pulp.LpVariable(p, cat="Binary") for p in data}
    m += pulp.lpSum(data[p][2] * x[p] for p in data)
    m += pulp.lpSum(data[p][0] * x[p] for p in data) <= 400
    m += pulp.lpSum(data[p][1] * x[p] for p in data) <= 120
    m += x["P3"] + x["P5"] <= 1
    m += x["P8"] <= x["P7"]
    m.solve(pulp.PULP_CBC_CMD(msg=0))
    print([p for p in data if x[p].value() > 0.5], pulp.value(m.objective))
    ```

    أعلى قيمة 121 ألف دينار. يوجد حلان بنفس القيمة: P1 وP2 وP7 وP8، أو P2 وP3 وP4 وP7. البرنامج يطبع أحدهما. عندما يتساوى حلان، تختار الإدارة بمعيار آخر، مثل المخاطرة.
