- id: c11-j-01
  kind: case
  part: J
  calc:
    - kd = YTM(10, 80, 1000, 1020)
    - D1 = 1.20*1.05
    - kg = D1/25 + 0.05
    - kc = 0.04 + 1.1*0.06
    - ke = (kg + kc)/2
    - D = 5000*1020
    - E = 400000*25
    - wd = D/(D + E)
    - W = wd*kd*0.8 + (1 - wd)*ke
    - PW = -1200000 + 300000*PA(W, 6)
    - ip = RATE(6, 300000, 1200000)
  text: |
    **حالة 11.1: توسعة مصنع بلاستيك في الخليل**

    مصنع عبوات بلاستيكية يدرس خطا جديدا يكلف 1,200,000 دينار، ويعطي 300,000 دينار سنويا بعد الضريبة لمدة 6 سنوات. مخاطرة الخط مثل مخاطرة المصنع المعتادة. بيانات التمويل اليوم:

    | البند | القيمة |
    | --- | --- |
    | السندات | 5,000 سند، سعر السند 1,020 دينار، كوبون 8%، تستحق بعد 10 سنوات |
    | الأسهم | 400,000 سهم، سعر السهم 25 دينار |
    | آخر توزيع | 1.20 دينار للسهم، ونمو 5% سنويا |
    | بيتا | 1.1 |
    | النسبة الخالية من المخاطرة | 4% |
    | عائد السوق | 10% |
    | الضريبة | 20% |

    (أ) احسب تكلفة الدين. (ب) احسب تكلفة حقوق الملكية بالطريقتين، وخذ متوسطهما. (ج) احسب المتوسط المرجح بأوزان السوق. (د) هل يقبل الخط؟
  solution: |
    (أ) العائد حتى الاستحقاق للسندات:

    ```excel
    =RATE(10, 80, -1020, 1000)
    ```

    تكلفة الدين [[kd|%2]] قبل الضريبة، و[[kd*0.8|%2]] بعدها.

    (ب) نموذج نمو التوزيعات:

    $$
    \frac{1.20 \times 1.05}{25} + 5\% = [[kg|%2]]
    $$

    نموذج تسعير الأصول الرأسمالية:

    $$
    4\% + 1.1 \times (10\% - 4\%) = [[kc|%2]]
    $$

    المتوسط [[ke|%2]].

    (ج) القيم السوقية:

    $$
    D = 5000 \times 1020 = [[D|g]] \qquad E = 400000 \times 25 = [[E|g]]
    $$

    $$
    w_d = \frac{[[D|g]]}{[[D+E|g]]} = [[wd|f4]]
    $$

    $$
    \mathrm{WACC} = [[wd|f4]] \times [[kd|%2]] \times 0.8 + [[1-wd|f4]] \times [[ke|%2]] = [[W|%2]]
    $$

    (د)

    $$
    PW = -1200000 + 300000\,(P/A,\ [[W|%2]],\ 6) = [[PW|2]]
    $$

    معدل الخط [[ip|%2]]، أعلى من تكلفة رأس المال. يقبل الخط، ويزيد قيمة المصنع [[PW|0]] دينار.

- id: c11-j-02
  kind: case
  part: J
  calc:
    - C = 800000
    - CF = 230000
    - CFb = 0.7*CF
    - ip = RATE(5, CF, C)
    - ipb = RATE(5, CFb, C)
    - L = 400000
    - A = L*AP(0.09, 5)
    - I1 = 0.09*L
    - B1 = L - (A - I1)
    - I2 = 0.09*B1
    - B2 = B1 - (A - I2)
    - I3 = 0.09*B2
    - B3 = B2 - (A - I3)
    - I4 = 0.09*B3
    - B4 = B3 - (A - I4)
    - I5 = 0.09*B4
    - ie = IRR([-400000, CF - A + 0.2*I1, CF - A + 0.2*I2, CF - A + 0.2*I3, CF - A + 0.2*I4, CF - A + 0.2*I5])
    - ieb = IRR([-400000, CFb - A + 0.2*I1, CFb - A + 0.2*I2, CFb - A + 0.2*I3, CFb - A + 0.2*I4, CFb - A + 0.2*I5], -0.9, 1.0)
  text: |
    **حالة 11.2: شريكان وقرض لمعصرة زيتون حديثة**

    شريكان يخططان لمعصرة حديثة تكلف 800,000 دينار، وتعطي في السنة العادية 230,000 دينار بعد الضريبة لمدة 5 سنوات. في موسم ضعيف، كل السنوات، يكون التدفق 70% من ذلك. الأول يريد أن يدفعا كل المبلغ من مالهما. الثاني يريد قرضا بنصف المبلغ، بفائدة 9% وخمسة أقساط سنوية متساوية. الضريبة 20%.

    (أ) احسب معدل عائد الشريكين في الحالتين، في السنوات العادية. (ب) أعد الحساب لمواسم ضعيفة. (ج) بماذا تنصحهما؟
  solution: |
    (أ) **بدون قرض:** تدفقات الشريكين هي تدفقات المشروع:

    ```excel
    =RATE(5, 230000, -800000)
    ```

    المعدل [[ip|%2]].

    **مع القرض:** القسط:

    $$
    400000\,(A/P,\ 9\%,\ 5) = [[A|2]]
    $$

    الشريكان يدفعان 400,000 دينار، ويأخذان كل سنة التدفق ناقص القسط زائد الوفر الضريبي على الفائدة. الفائدة في السنة الأولى [[I1|0]]، وفي الأخيرة [[I5|0]]. معدلهما [[ie|%2]].

    (ب) التدفق في الموسم الضعيف:

    $$
    0.7 \times 230000 = [[CFb|g]]
    $$

    بدون قرض: المعدل [[ipb|%2]]. مع القرض: القسط نفسه، فالمعدل [[ieb|%2]].

    (ج) القرض يرفع العائد في السنوات العادية من [[ip|%2]] إلى [[ie|%2]]، لأن المشروع يعطي أكثر من تكلفة القرض بعد الضريبة، 7.2%. في المواسم الضعيفة ينخفض عائدهما من [[ipb|%2]] إلى [[ieb|%2]]: القرض يكبر الربح والخسارة معا. إذا كان للشريكين دخل آخر يغطي القسط في سنة ضعيفة، فالقرض مفيد. إذا كانت المعصرة مصدر دخلهما الوحيد، فالمخاطرة كبيرة عليهما.

- id: c11-j-03
  kind: case
  part: J
  text: |
    **حالة 11.3: ميزانية شركة اتصالات**

    شركة اتصالات متوسطها المرجح 10%. تضيف علاوة 2% لمشاريع التوسعة، و5% للخدمات الجديدة، ولا شيء لمشاريع خفض التكاليف. ميزانيتها 2,000,000 دينار. المشاريع المستقلة:

    | المشروع | الصنف | الاستثمار | معدل العائد |
    | --- | --- | --- | --- |
    | أ: تحديث أنظمة الفوترة | خفض تكاليف | 400,000 | 13% |
    | ب: أبراج في منطقة جديدة | توسعة | 900,000 | 15% |
    | ج: خدمة بث تلفزيوني | خدمة جديدة | 700,000 | 16% |
    | د: ألياف ضوئية للمنازل | خدمة جديدة | 600,000 | 14% |
    | هـ: تقوية الشبكة الحالية | توسعة | 500,000 | 11.5% |

    (أ) أي المشاريع تتجاوز حد صنفها؟ (ب) أي المشاريع تختار داخل الميزانية؟ (ج) ماذا كانت ستختار لو رتبت المشاريع بالمعدل فقط وقارنتها بـ 10%؟
  solution: |
    (أ) الحد لكل صنف، والفرق بين المعدل والحد:

    | المشروع | الحد | المعدل | الفرق |
    | --- | --- | --- | --- |
    | أ | 10% | 13% | 3% |
    | ب | 12% | 15% | 3% |
    | ج | 15% | 16% | 1% |
    | د | 15% | 14% | سالب |
    | هـ | 12% | 11.5% | سالب |

    د وهـ لا يغطيان مخاطرتهما. يبقى أ وب وج باستثمار 2,000,000 دينار.

    (ب) أ وب وج تملأ الميزانية بالضبط، فتختارها كلها.

    (ج) بالمعدل فقط: ج 16%، ثم ب 15%، ثم د 14%، ثم أ 13%. ج وب يأخذان 1,600,000، ثم د لا يتسع، فتأخذ أ بـ 400,000. نفس المجموعة هنا بالصدفة. لكن لو كانت تكلفة د 400,000، لاختارتها بدل أ: مشروع خدمة جديدة لا يغطي مخاطرته، بدل مشروع خفض تكاليف شبه مضمون. الحد حسب الصنف يحمي الشركة من هذا الخطأ.

- id: c11-j-04
  kind: case
  part: J
  calc:
    - ku = 0.12
    - t = 0.20
    - k2 = ku + (ku - 0.06)*0.25*(1 - t)
    - W2 = 0.2*0.06*(1 - t) + 0.8*k2
    - k5 = ku + (ku - 0.085)*1.0*(1 - t)
    - W5 = 0.5*0.085*(1 - t) + 0.5*k5
    - V2 = 1500000/W2
    - V5 = 1500000/W5
  text: |
    **حالة 11.4: هل ترفع شركة الأدوية ديونها؟**

    شركة أدوية تمول 20% من رأس مالها بالدين، بتكلفة 6%. مديرها المالي يقترح رفع الدين إلى 50%، لكن البنوك ستطلب عندها 8.5%. تكلفة حقوق الملكية بلا دين 12%، وتتغير مع الدين حسب:

    $$
    k_e = k_u + (k_u - k_d)\,\frac{D}{E}\,(1 - t)
    $$

    الضريبة 20%. تدفق الشركة الحر بعد الضريبة 1,500,000 دينار سنويا، ويتوقع أن يستمر بلا نمو.

    (أ) احسب تكلفة حقوق الملكية والمتوسط المرجح في الحالتين. (ب) قيمة الشركة هي القيمة الحالية لتدفقها الحر بالمتوسط المرجح. احسبها في الحالتين. (ج) هل تنصح بالاقتراح؟
  solution: |
    (أ) عند 20% دين، نسبة الدين إلى حقوق الملكية 0.25:

    $$
    k_e = 12\% + (12\% - 6\%) \times 0.25 \times 0.8 = [[k2|%2]]
    $$

    $$
    \mathrm{WACC} = 0.2 \times 6\% \times 0.8 + 0.8 \times [[k2|%2]] = [[W2|%2]]
    $$

    عند 50% دين، النسبة 1:

    $$
    k_e = 12\% + (12\% - 8.5\%) \times 1 \times 0.8 = [[k5|%2]]
    $$

    $$
    \mathrm{WACC} = 0.5 \times 8.5\% \times 0.8 + 0.5 \times [[k5|%2]] = [[W5|%2]]
    $$

    (ب) تدفق دائم بلا نمو، كالتكلفة المرسملة:

    $$
    V = \frac{1500000}{[[W2|%2]]} = [[V2|0]]
    $$

    $$
    V = \frac{1500000}{[[W5|%2]]} = [[V5|0]]
    $$

    (ج) المتوسط [[pick(W5 < W2, "ينخفض", "يرتفع")]] من [[W2|%2]] إلى [[W5|%2]]، وقيمة الشركة [[pick(V5 > V2, "ترتفع", "تنخفض")]] [[abs(V5 - V2)|0]] دينار، أي [[abs(V5 - V2)/V2|%]] من قيمتها. هذا مكسب على الورق. لكن الحساب لا يشمل كل تكاليف الدين: شركة أدوية تحتاج استثمارا مستمرا في البحث، والدين العالي يقيد قدرتها على الاستمرار فيه في سنة صعبة. والمعادلة نفسها تقدير. الأفضل رفع الدين تدريجيا، ومراقبة شروط البنوك وسعر السهم بعد كل خطوة.
