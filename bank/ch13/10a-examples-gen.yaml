items:
- id: c13-ex-scale
  kind: example
  title: |
    توحيد المقاييس
  vars:
    x11: 41000
    x21: 38000
    x31: 47000
    x12: 8
    x22: 6
    x32: 9
    x13: 12
    x23: 15
    x33: 10
  random:
    x11:
    - 30000
    - 60000
    - 1000
    x21:
    - 30000
    - 60000
    - 1000
    x31:
    - 30000
    - 60000
    - 1000
    x12:
    - 3
    - 10
    - 1
    x22:
    - 3
    - 10
    - 1
    x32:
    - 3
    - 10
    - 1
    x13:
    - 5
    - 30
    - 1
    x23:
    - 5
    - 30
    - 1
    x33:
    - 5
    - 30
    - 1
  calc:
  - x21 = pick(x21 == x11, pick(x11 + 1000 > 60000, x11 - 1000, x11 + 1000), x21)
  - lo1 = min(x11, x21, x31)
  - hi1 = max(x11, x21, x31)
  - s11 = (hi1 - x11)/(hi1 - lo1)
  - s21 = (hi1 - x21)/(hi1 - lo1)
  - s31 = (hi1 - x31)/(hi1 - lo1)
  - x22 = pick(x22 == x12, pick(x12 + 1 > 10, x12 - 1, x12 + 1), x22)
  - lo2 = min(x12, x22, x32)
  - hi2 = max(x12, x22, x32)
  - s12 = (x12 - lo2)/(hi2 - lo2)
  - s22 = (x22 - lo2)/(hi2 - lo2)
  - s32 = (x32 - lo2)/(hi2 - lo2)
  - x23 = pick(x23 == x13, pick(x13 + 1 > 30, x13 - 1, x13 + 1), x23)
  - lo3 = min(x13, x23, x33)
  - hi3 = max(x13, x23, x33)
  - s13 = (hi3 - x13)/(hi3 - lo3)
  - s23 = (hi3 - x23)/(hi3 - lo3)
  - s33 = (hi3 - x33)/(hi3 - lo3)
  text: |
    مصنع يختار موردا لقطع الغيار. التقديرات للموردين الثلاثة:

    | البديل | التكلفة، دينار | الجودة، من 10 | مدة التسليم، يوم |
    | --- | --- | --- | --- |
    | A | [[x11|g]] | [[x12|g]] | [[x13|g]] |
    | B | [[x21|g]] | [[x22|g]] | [[x23|g]] |
    | C | [[x31|g]] | [[x32|g]] | [[x33|g]] |

    حول كل معيار إلى درجة بين 0 و1.
  solution: |
    اتجاه المعايير: التكلفة كلما قل كان أفضل، والجودة كلما زاد كان أفضل، ومدة التسليم كلما قل كان أفضل. الأسوأ بين البدائل يأخذ 0، والأفضل يأخذ 1. مثال: درجة A في التكلفة:

    $$
    s = \frac{[[hi1|g]] - [[x11|g]]}{[[hi1|g]] - [[lo1|g]]} = [[s11|f4]]
    $$

    | البديل | التكلفة | الجودة | مدة التسليم |
    | --- | --- | --- | --- |
    | A | [[s11|f4]] | [[s12|f4]] | [[s13|f4]] |
    | B | [[s21|f4]] | [[s22|f4]] | [[s23|f4]] |
    | C | [[s31|f4]] | [[s32|f4]] | [[s33|f4]] |
- id: c13-ex-additive
  kind: example
  title: |
    المجموع المرجح
  vars:
    x11: 41000
    x21: 38000
    x31: 47000
    x12: 8
    x22: 6
    x32: 9
    x13: 12
    x23: 15
    x33: 10
    w1: 0.5
    w2: 0.3
  random:
    x11:
    - 30000
    - 60000
    - 1000
    x21:
    - 30000
    - 60000
    - 1000
    x31:
    - 30000
    - 60000
    - 1000
    x12:
    - 3
    - 10
    - 1
    x22:
    - 3
    - 10
    - 1
    x32:
    - 3
    - 10
    - 1
    x13:
    - 5
    - 30
    - 1
    x23:
    - 5
    - 30
    - 1
    x33:
    - 5
    - 30
    - 1
    w1:
    - 0.2
    - 0.6
    - 0.05
    w2:
    - 0.1
    - 0.5
    - 0.05
  calc:
  - x21 = pick(x21 == x11, pick(x11 + 1000 > 60000, x11 - 1000, x11 + 1000), x21)
  - lo1 = min(x11, x21, x31)
  - hi1 = max(x11, x21, x31)
  - s11 = (hi1 - x11)/(hi1 - lo1)
  - s21 = (hi1 - x21)/(hi1 - lo1)
  - s31 = (hi1 - x31)/(hi1 - lo1)
  - x22 = pick(x22 == x12, pick(x12 + 1 > 10, x12 - 1, x12 + 1), x22)
  - lo2 = min(x12, x22, x32)
  - hi2 = max(x12, x22, x32)
  - s12 = (x12 - lo2)/(hi2 - lo2)
  - s22 = (x22 - lo2)/(hi2 - lo2)
  - s32 = (x32 - lo2)/(hi2 - lo2)
  - x23 = pick(x23 == x13, pick(x13 + 1 > 30, x13 - 1, x13 + 1), x23)
  - lo3 = min(x13, x23, x33)
  - hi3 = max(x13, x23, x33)
  - s13 = (hi3 - x13)/(hi3 - lo3)
  - s23 = (hi3 - x23)/(hi3 - lo3)
  - s33 = (hi3 - x33)/(hi3 - lo3)
  - w2 = min(w2, 0.9 - w1)
  - w3 = 1 - w1 - w2
  - S1 = w1*s11 + w2*s12 + w3*s13
  - S2 = w1*s21 + w2*s22 + w3*s23
  - S3 = w1*s31 + w2*s32 + w3*s33
  - Sb = max(S1, S2, S3)
  - who = pick(S1 == Sb, "A", pick(S2 == Sb, "B", "C"))
  text: |
    نفس الموردين الثلاثة في المثال السابق:

    | البديل | التكلفة، دينار | الجودة، من 10 | مدة التسليم، يوم |
    | --- | --- | --- | --- |
    | A | [[x11|g]] | [[x12|g]] | [[x13|g]] |
    | B | [[x21|g]] | [[x22|g]] | [[x23|g]] |
    | C | [[x31|g]] | [[x32|g]] | [[x33|g]] |

    أوزان المعايير بالترتيب: [[w1|g]] و[[w2|g]] و[[w3|g]]. أي بديل تختار بالمجموع المرجح؟
  solution: |
    اتجاه المعايير: التكلفة كلما قل كان أفضل، والجودة كلما زاد كان أفضل، ومدة التسليم كلما قل كان أفضل. الأسوأ بين البدائل يأخذ 0، والأفضل يأخذ 1. مثال: درجة A في التكلفة:

    $$
    s = \frac{[[hi1|g]] - [[x11|g]]}{[[hi1|g]] - [[lo1|g]]} = [[s11|f4]]
    $$

    | البديل | التكلفة | الجودة | مدة التسليم |
    | --- | --- | --- | --- |
    | A | [[s11|f4]] | [[s12|f4]] | [[s13|f4]] |
    | B | [[s21|f4]] | [[s22|f4]] | [[s23|f4]] |
    | C | [[s31|f4]] | [[s32|f4]] | [[s33|f4]] |

    الدرجة المرجحة لكل بديل:

    $$
    S_A = [[w1|g]] \times [[s11|f4]] + [[w2|g]] \times [[s12|f4]] + [[w3|g]] \times [[s13|f4]] = [[S1|f4]]
    $$

    $$
    S_B = [[w1|g]] \times [[s21|f4]] + [[w2|g]] \times [[s22|f4]] + [[w3|g]] \times [[s23|f4]] = [[S2|f4]]
    $$

    $$
    S_C = [[w1|g]] \times [[s31|f4]] + [[w2|g]] \times [[s32|f4]] + [[w3|g]] \times [[s33|f4]] = [[S3|f4]]
    $$

    الأفضل: [[who]]، بدرجة [[Sb|f4]].
