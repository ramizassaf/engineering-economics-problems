# ================================================================ part A
- id: c13-a-01
  kind: concept
  part: A
  text: |
    لماذا لا تكفي القيمة الحالية وحدها لاختيار مورد لمواد طبية؟
  solution: |
    القيمة الحالية تقيس المال فقط. المورد يختلف أيضا في الجودة، وسرعة التسليم، والالتزام، وسلامة المريض. هذه معايير مهمة لا تتحول إلى دنانير بسهولة.

- id: c13-a-02
  kind: concept
  part: A
  text: |
    ما مصفوفة القرار؟
  solution: |
    جدول صفوفه البدائل وأعمدته المعايير، وفي كل خانة أداء البديل في المعيار. هي الخطوة الأولى في أي طريقة متعددة المعايير.

- id: c13-a-03
  kind: concept
  part: A
  text: |
    متى نقول إن بديلا مسيطر عليه؟ ولماذا نحذفه؟
  solution: |
    عندما يكون بديل آخر أفضل منه أو مساويا له في كل المعايير، وأفضل في واحد على الأقل. نحذفه لأنه لا يمكن أن يكون الأفضل بأي أوزان.

- id: c13-a-04
  kind: concept
  part: A
  text: |
    ما الفرق بين الطرق التعويضية وغير التعويضية؟
  solution: |
    في التعويضية، التفوق في معيار يعوض الضعف في آخر، مثل المجموع المرجح. في غير التعويضية لا يعوض، مثل الحد الأدنى لكل معيار: بديل يفشل في معيار واحد يحذف مهما كان ممتازا في غيره.

- id: c13-a-05
  kind: concept
  part: A
  text: |
    لماذا نوحد المقاييس قبل الجمع؟
  solution: |
    المعايير بوحدات مختلفة: دنانير وأيام ودرجات. جمعها كما هي يعطي المعيار ذا الأرقام الكبيرة وزنا لا يستحقه. التوحيد يضع كل معيار بين 0 و1.

- id: c13-a-06
  kind: concept
  part: A
  text: |
    في التوحيد، الأسوأ يأخذ 0 والأفضل يأخذ 1. ما مشكلة هذه الطريقة إذا كانت البدائل متقاربة جدا في معيار؟
  solution: |
    فرق صغير جدا يصبح فرقا كاملا بين 0 و1، فيأخذ المعيار أثرا أكبر من حقيقته. الحل أن نوحد بالنسبة إلى مدى معقول للمعيار، لا إلى أسوأ البدائل وأفضلها فقط.

- id: c13-a-07
  kind: concept
  part: A
  text: |
    متى يصلح الترتيب المعجمي؟
  solution: |
    عندما يكون معيار أهم بكثير من كل الباقي، مثل السلامة في معدات الأطفال. عندها لا نقبل أن يعوض أي معيار آخر أي ضعف فيه.

- id: c13-a-08
  kind: concept
  part: A
  text: |
    لماذا نختبر حساسية القرار للأوزان؟
  solution: |
    الأوزان تقدير شخصي، وقد يختلف عليه أعضاء اللجنة. إذا كان القرار يتغير بتغير صغير في الوزن، فهو يحتاج نقاشا قبل التنفيذ. وإذا بقي ثابتا، فالخلاف على الأوزان لا يهم.

- id: c13-a-09
  kind: concept
  part: A
  text: |
    كيف ندخل التكلفة في تحليل متعدد المعايير بدون أن نفقد ما تعلمناه في الفصول السابقة؟
  solution: |
    نحسب التكلفة بطرق الفصول السابقة، مثل القيمة السنوية أو القيمة الحالية للتكاليف، ثم نضعها معيارا في المصفوفة. بهذا تبقى القيمة الزمنية للنقود محسوبة.

- id: c13-a-10
  kind: concept
  part: A
  text: |
    ما الخطر في أن يضع شخص واحد الأوزان بعد أن يرى نتائج البدائل؟
  solution: |
    قد يختار، بقصد أو بدون قصد، الأوزان التي تجعل بديله المفضل يفوز. لذلك تحدد الأوزان قبل تقييم البدائل، ويفضل أن تحددها لجنة.

- id: c13-a-11
  kind: concept
  part: A
  text: |
    ما فكرة المقارنة الزوجية في تحديد الأوزان؟
  solution: |
    الناس يحكمون على معيارين أسهل من الحكم على عشرة معا. فنسأل: كم مرة هذا المعيار أهم من ذاك؟ لكل زوج. ثم نحسب الأوزان من جدول الأحكام.

- id: c13-a-12
  kind: concept
  part: A
  text: |
    لماذا يجب أن يكون مجموع الأوزان 1 في المجموع المرجح؟
  solution: |
    حتى تكون الدرجة النهائية بين 0 و1، ويمكن مقارنتها عبر تحليلات مختلفة. المهم في القرار هو نسب الأوزان إلى بعضها، والمجموع 1 يثبت هذه النسب على مقياس واحد.

# ================================================================ part B
- id: c13-b-01
  kind: problem
  part: B
  text: |
    خمسة عروض لمولد كهرباء احتياطي:

    | العرض | الثمن، ألف دينار | القدرة، كيلوواط | الضجيج، ديسيبل |
    | --- | --- | --- | --- |
    | P | 18 | 100 | 70 |
    | Q | 22 | 120 | 65 |
    | R | 20 | 100 | 72 |
    | S | 25 | 150 | 68 |
    | T | 21 | 110 | 65 |

    الثمن والضجيج كلما قلا كان أفضل، والقدرة كلما زادت كان أفضل. أي العروض مسيطر عليها؟
  solution: |
    R مقابل P: الثمن 20 أسوأ من 18، والقدرة متساوية، والضجيج 72 أسوأ من 70. R مسيطر عليه.

    باقي الأزواج: كل عرض متفوق في معيار على الآخر. مثلا T أرخص من Q وبنفس الضجيج، لكن Q أقوى. وS أقوى من الكل لكنه الأغلى.

    نحذف R، ويبقى P وQ وS وT.

- id: c13-b-02
  kind: problem
  part: B
  text: |
    أربعة مواقع لمحطة وقود: الأول إيجاره 4,000 دينار شهريا وحركة السيارات 9,000 يوميا. الثاني 3,500 و7,000. الثالث 4,500 و8,500. الرابع 3,000 و7,000. أي المواقع مسيطر عليها؟
  solution: |
    الثاني مقابل الرابع: نفس الحركة، والرابع أرخص. الثاني مسيطر عليه.

    الثالث مقابل الأول: الأول أرخص وحركته أكبر. الثالث مسيطر عليه.

    يبقى الأول والرابع: الأول حركته أكبر، والرابع أرخص. الاختيار بينهما يحتاج أوزانا.

- id: c13-b-03
  kind: problem
  part: B
  text: |
    حول التقديرات التالية إلى أرقام على سلم من 1 إلى 5: ضعيف، ومقبول، وجيد، وجيد جدا، وممتاز. ثم ابن مصفوفة القرار لثلاثة مكيفات: الأول سعره 900 دينار، وكفاءته جيد جدا، وضجيجه مقبول. الثاني 750، وجيد، وجيد جدا. الثالث 1,100، وممتاز، وممتاز.
  solution: |
    السلم: ضعيف 1، ومقبول 2، وجيد 3، وجيد جدا 4، وممتاز 5. الضجيج هنا تقدير لهدوء الجهاز، فكلما ارتفع كان أفضل.

    | المكيف | السعر، دينار | الكفاءة | الهدوء |
    | --- | --- | --- | --- |
    | الأول | 900 | 4 | 2 |
    | الثاني | 750 | 3 | 4 |
    | الثالث | 1,100 | 5 | 5 |

    لا يوجد بديل مسيطر عليه: الثاني الأرخص، والثالث الأفضل في الباقي، والأول بينهما في كل شيء تقريبا.

- id: c13-b-04
  kind: concept
  part: B
  text: |
    لماذا يجب أن يكون لكل معيار في المصفوفة اتجاه واضح؟
  solution: |
    حتى نعرف أي قيمة أفضل. التكلفة كلما قلت كان أفضل، والإنتاج كلما زاد كان أفضل. وبعض المعايير لها قيمة مثلى في الوسط، مثل درجة الحرارة، فنحولها إلى البعد عن القيمة المثلى قبل التحليل.

- id: c13-b-05
  kind: problem
  part: B
  text: |
    شركة تقارن أربع رافعات شوكية: A بثمن 30 ألفا وحمولة 3 أطنان واستهلاك 4 لترات في الساعة. B بثمن 28 ألفا و2.5 طن و4 لترات. C بثمن 32 ألفا و3 أطنان و5 لترات. D بثمن 35 ألفا و4 أطنان و4.5 لتر. أيها مسيطر عليه؟
  solution: |
    C مقابل A: الثمن أعلى، والحمولة نفسها، والاستهلاك أعلى. C مسيطر عليه.

    باقي الأزواج فيها تفوق متبادل: B أرخص من A وأضعف، وD أقوى من A وأغلى. يبقى A وB وD.

- id: c13-b-06
  kind: problem
  part: B
  text: |
    ما عدد المقارنات الزوجية التي تحتاجها لفحص السيطرة بين 6 بدائل؟
  solution: |
    كل بديلين مرة واحدة:

    $$
    \frac{6 \times 5}{2} = 15
    $$

- id: c13-b-07
  kind: concept
  part: B
  text: |
    بعد حذف البدائل المسيطر عليها بقي بديل واحد. هل نحتاج أوزانا؟
  solution: |
    لا. البديل الباقي أفضل من كل الآخرين أو مساو لهم في كل المعايير. هو الاختيار بأي أوزان.

- id: c13-b-08
  kind: problem
  part: B
  text: |
    ثلاثة عروض لبرنامج تخطيط موارد: الأول تكلفته السنوية بالقيمة السنوية المكافئة 42,000 دينار، ومدة تطبيقه 8 أشهر. الثاني 38,000 و10 أشهر. الثالث 45,000 و10 أشهر. هل يوجد مسيطر عليه؟
  solution: |
    الثالث مقابل الثاني: الثالث أغلى وبنفس المدة. الثالث مسيطر عليه. يبقى الأول والثاني: الأول أسرع، والثاني أرخص.

- id: c13-b-09
  kind: problem
  part: B
  text: |
    قيمت لجنة أربعة متقدمين لوظيفة مهندس صيانة في ثلاثة معايير، من 10: أحمد 8 و6 و7، وسلمى 7 و8 و7، وخالد 6 و6 و7، ونور 9 و5 و8. المعايير كلها كلما زادت كان أفضل. أي المتقدمين مسيطر عليه؟
  solution: |
    خالد مقابل أحمد: أقل في الأول، ومساو في الثاني والثالث. خالد مسيطر عليه. ومقابل سلمى أيضا.

    الباقون: أحمد وسلمى ونور، ولكل منهم تفوق في معيار.

- id: c13-b-10
  kind: concept
  part: B
  text: |
    لماذا لا نضع في المصفوفة معيارين يقيسان نفس الشيء تقريبا، مثل استهلاك الوقود وتكلفة الوقود؟
  solution: |
    المعياران يحسبان نفس الأثر مرتين، فيأخذ أثره وزنا مضاعفا بدون قصد. نختار واحدا منهما.

# ================================================================ part C
- id: c13-c-01
  kind: problem
  part: C
  text: |
    للمولدات في الجزء ب، المسألة الأولى، وضعت المستشفى حدودا: الثمن لا يزيد على 22 ألفا، والقدرة 110 كيلوواط أو أكثر، والضجيج 68 ديسيبل أو أقل. أي العروض تبقى؟
  solution: |
    | العرض | الثمن | القدرة | الضجيج | النتيجة |
    | --- | --- | --- | --- | --- |
    | P | نعم | لا | لا | يحذف |
    | Q | نعم | نعم | نعم | يبقى |
    | R | نعم | لا | لا | يحذف |
    | S | لا | نعم | نعم | يحذف |
    | T | نعم | نعم | نعم | يبقى |

    يبقى Q وT.

- id: c13-c-02
  kind: problem
  part: C
  text: |
    لنفس المولدات، اختر بالترتيب المعجمي: الضجيج أولا، ثم الثمن، ثم القدرة.
  solution: |
    أقل ضجيج 65، عند Q وT. تساويا، فننتقل إلى الثمن: T بـ 21 ألفا أرخص من Q بـ 22. نختار T.

- id: c13-c-03
  kind: problem
  part: C
  text: |
    لنفس المولدات، اقبل كل عرض يتميز في معيار واحد على الأقل: ثمن 18 ألفا أو أقل، أو قدرة 150 أو أكثر، أو ضجيج 65 أو أقل.
  solution: |
    P يتميز بالثمن، وS بالقدرة، وQ وT بالضجيج. R لا يتميز في شيء، فيحذف. أربعة عروض تبقى، والطريقة لا تختار واحدا. هي تصفية فقط.

- id: c13-c-04
  kind: problem
  part: C
  text: |
    للمتقدمين في الجزء ب، المسألة التاسعة، شرط الوظيفة 7 على الأقل في كل معيار. من يبقى؟
  solution: |
    أحمد 6 في الثاني، وخالد 6 في الأول والثاني، ونور 5 في الثاني. كلهم يحذفون. تبقى سلمى وحدها، بدرجات 7 و8 و7.

- id: c13-c-05
  kind: problem
  part: C
  text: |
    للمتقدمين أنفسهم، رتب المعايير: الأول أهم، ثم الثالث، ثم الثاني. من تختار بالترتيب المعجمي؟
  solution: |
    في المعيار الأول، نور تأخذ 9، وهي الأعلى. نختار نور مباشرة. مع أنها الأضعف في المعيار الثاني، بدرجة 5.

- id: c13-c-06
  kind: concept
  part: C
  text: |
    لجنة وضعت حدودا دنيا عالية، فلم يبق أي بديل. ماذا تفعل؟
  solution: |
    تخفف الحد الأقل أهمية، ثم تعيد الفحص. أو تنتقل إلى طريقة تعويضية. الحدود الدنيا يجب أن تعكس الحد المقبول فعلا، لا الطموح.

- id: c13-c-07
  kind: problem
  part: C
  text: |
    أربعة مواقع لروضة أطفال: الموقع 1 إيجاره 900 دينار شهريا، والمسافة إلى أقرب شارع رئيسي 50 مترا، والمساحة الخارجية 200 متر مربع. الموقع 2: 700، و400، و150. الموقع 3: 800، و150، و300. الموقع 4: 1,000، و300، و250. الشروط: الإيجار 850 أو أقل، والبعد عن الشارع الرئيسي 100 متر أو أكثر للسلامة، والمساحة 180 أو أكثر. أي المواقع تبقى؟
  solution: |
    | الموقع | الإيجار | البعد | المساحة | النتيجة |
    | --- | --- | --- | --- | --- |
    | 1 | لا | لا | نعم | يحذف |
    | 2 | نعم | نعم | لا | يحذف |
    | 3 | نعم | نعم | نعم | يبقى |
    | 4 | لا | نعم | نعم | يحذف |

    يبقى الموقع 3.

- id: c13-c-08
  kind: problem
  part: C
  text: |
    لنفس المواقع، اختر بالترتيب المعجمي: البعد عن الشارع أولا، ثم المساحة، ثم الإيجار.
  solution: |
    أبعد موقع عن الشارع هو 2، على 400 متر. نختاره مباشرة، مع أن مساحته الخارجية الأصغر. هذا يظهر خطر الترتيب المعجمي: معيار السلامة تحقق في أكثر من موقع، والطريقة اختارت الأبعد بدون نظر إلى الباقي. الأفضل هنا أن نجعل السلامة حدا أدنى، ثم نقارن الباقي.

- id: c13-c-09
  kind: concept
  part: C
  text: |
    لماذا نستخدم الحدود الدنيا غالبا قبل المجموع المرجح، وليس بدلا منه؟
  solution: |
    الحدود الدنيا تحذف البدائل غير المقبولة، مثل جهاز لا يحقق شرط السلامة. ثم يختار المجموع المرجح بين البدائل المقبولة، بالموازنة بين المعايير.

- id: c13-c-10
  kind: problem
  part: C
  text: |
    عروض لشراء 20 حاسوبا: العرض 1 بثمن 650 دينار للجهاز وضمان سنتين. العرض 2 بثمن 600 وضمان سنة. العرض 3 بثمن 700 وضمان 3 سنوات. الشرط: ضمان سنتين على الأقل. ثم يختار الأرخص. أي عرض يفوز؟ وما تكلفة الشرط؟
  solution: |
    العرض 2 لا يحقق الضمان، فيحذف. بين 1 و3 الأرخص هو 1.

    تكلفة الشرط هي الفرق بين الأرخص قبل الشرط وبعده:

    $$
    (650 - 600) \times 20 = 1000
    $$

    الشركة تدفع 1,000 دينار مقابل سنة ضمان إضافية لعشرين جهازا. الحدود الدنيا لها ثمن، ويجب أن يعرف.
