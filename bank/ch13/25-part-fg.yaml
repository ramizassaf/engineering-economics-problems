# ================================================================ part F
- id: c13-f-01
  kind: problem
  part: F
  vars: {n: 5}
  random: {n: [3, 8, 1]}
  calc:
    - T = n*(n + 1)/2
    - w1 = n/T
    - wn = 1/T
  text: |
    لجنة رتبت [[n|n]] معايير. ما وزن المعيار الأول، ووزن الأخير، بطريقة أوزان الترتيب؟
  solution: |
    مجموع النقاط:

    $$
    [[n|n]] + \dots + 1 = \frac{[[n|n]] \times [[n+1|n]]}{2} = [[T|g]]
    $$

    $$
    w_1 = \frac{[[n|n]]}{[[T|g]]} = [[w1|f4]] \qquad w_{[[n|n]]} = \frac{1}{[[T|g]]} = [[wn|f4]]
    $$

- id: c13-f-02
  kind: problem
  part: F
  vars: {p1: 40, p2: 30, p3: 20}
  random: {p1: [25, 60, 5], p2: [10, 40, 5], p3: [5, 30, 5]}
  calc:
    - p3 = min(p3, 95 - p1 - p2)
    - p3 = max(p3, 5)
    - p2 = min(p2, 95 - p1 - p3)
    - p4 = 100 - p1 - p2 - p3
  text: |
    مدير وزع 100 نقطة على أربعة معايير: التكلفة [[p1|g]]، والجودة [[p2|g]]، والتسليم [[p3|g]]، والخدمة ما بقي. ما الأوزان؟
  solution: |
    نقاط الخدمة:

    $$
    100 - [[p1|g]] - [[p2|g]] - [[p3|g]] = [[p4|g]]
    $$

    الأوزان: [[p1/100|g]] و[[p2/100|g]] و[[p3/100|g]] و[[p4/100|g]].

- id: c13-f-03
  kind: problem
  part: F
  vars: {a: 3, b: 6, c: 2}
  random: {a: [2, 5, 1], b: [3, 9, 1], c: [1, 4, 1]}
  calc:
    - g1 = exp(ln(a*b)/3)
    - g2 = exp(ln(c/a)/3)
    - g3 = exp(-ln(b*c)/3)
    - G = g1 + g2 + g3
    - w1 = g1/G
    - w2 = g2/G
    - w3 = g3/G
  text: |
    مقارنة زوجية لثلاثة معايير لاختيار موقع مصنع: السلامة أهم من التكلفة [[a|g]] مرات، والسلامة أهم من القرب من السوق [[b|g]] مرات، والتكلفة أهم من القرب [[c|g]] مرة. احسب الأوزان بالوسط الهندسي.
  solution: |
    | | السلامة | التكلفة | القرب |
    | --- | --- | --- | --- |
    | السلامة | 1 | [[a|g]] | [[b|g]] |
    | التكلفة | [[1/a|f4]] | 1 | [[c|g]] |
    | القرب | [[1/b|f4]] | [[1/c|f4]] | 1 |

    $$
    g_1 = (1 \times [[a|g]] \times [[b|g]])^{1/3} = [[g1|f4]]
    $$

    $$
    g_2 = ([[1/a|f4]] \times 1 \times [[c|g]])^{1/3} = [[g2|f4]]
    $$

    $$
    g_3 = ([[1/b|f4]] \times [[1/c|f4]] \times 1)^{1/3} = [[g3|f4]]
    $$

    | المعيار | الوزن |
    | --- | --- |
    | السلامة | [[w1|f4]] |
    | التكلفة | [[w2|f4]] |
    | القرب | [[w3|f4]] |

- id: c13-f-04
  kind: problem
  part: F
  vars: {a: 3, c: 2}
  random: {a: [2, 5, 1], c: [2, 4, 1]}
  calc:
    - b = a*c
  text: |
    في مقارنة زوجية، المعيار الأول أهم من الثاني [[a|g]] مرات، والثاني أهم من الثالث [[c|g]] مرة. كم مرة يجب أن يكون الأول أهم من الثالث حتى تكون الأحكام متسقة؟
  solution: |
    الأحكام المتسقة تتضاعف عبر السلسلة:

    $$
    a_{13} = a_{12} \times a_{23} = [[a|g]] \times [[c|g]] = [[b|g]]
    $$

    إذا قال صاحب القرار رقما بعيدا عن [[b|g]]، فأحكامه غير متسقة، ويجب أن يراجعها.

- id: c13-f-05
  kind: problem
  part: F
  text: |
    رتبت لجنة خمسة معايير. ثلاثة أعضاء أعطوا الترتيبات التالية، من 1 الأهم:

    | المعيار | العضو الأول | العضو الثاني | العضو الثالث |
    | --- | --- | --- | --- |
    | التكلفة | 1 | 2 | 1 |
    | الجودة | 2 | 1 | 3 |
    | التسليم | 3 | 4 | 2 |
    | الخدمة | 4 | 3 | 5 |
    | البيئة | 5 | 5 | 4 |

    احسب أوزان الترتيب لكل عضو، ثم متوسطها.
  solution: |
    خمسة معايير: الأول يأخذ 5 نقاط، والخامس نقطة. المجموع 15.

    | المعيار | العضو الأول | العضو الثاني | العضو الثالث | المتوسط |
    | --- | --- | --- | --- | --- |
    | التكلفة | 5/15 | 4/15 | 5/15 | 0.311 |
    | الجودة | 4/15 | 5/15 | 3/15 | 0.267 |
    | التسليم | 3/15 | 2/15 | 4/15 | 0.200 |
    | الخدمة | 2/15 | 3/15 | 1/15 | 0.133 |
    | البيئة | 1/15 | 1/15 | 2/15 | 0.089 |

    مثال التكلفة:

    $$
    \frac{5 + 4 + 5}{3 \times 15} = 0.311
    $$

- id: c13-f-06
  kind: concept
  part: F
  text: |
    ما عيب أوزان الترتيب مقارنة بتوزيع النقاط؟
  solution: |
    تفترض أن الفرق بين كل معيارين متتاليين متساو. إذا كانت التكلفة أهم بكثير من كل الباقي، فأوزان الترتيب تقلل وزنها عن الحقيقة.

- id: c13-f-07
  kind: problem
  part: F
  vars: {a: 2, b: 3, c: 2}
  random: {a: [2, 5, 1], b: [2, 9, 1], c: [2, 5, 1]}
  calc:
    - r = b/(a*c)
  text: |
    مقارنة زوجية: الأول أهم من الثاني [[a|g]] مرة، والأول أهم من الثالث [[b|g]] مرات، والثاني أهم من الثالث [[c|g]] مرة. هل الأحكام متسقة؟
  solution: |
    الاتساق يتطلب:

    $$
    a_{13} = a_{12} \times a_{23} = [[a|g]] \times [[c|g]] = [[a*c|g]]
    $$

    الحكم الفعلي [[b|g]]. النسبة بينهما [[r|f4]]. [[pick(abs(r - 1) < 0.0001, "الأحكام متسقة تماما.", pick(abs(r - 1) <= 0.5, "عدم الاتساق قليل، والأوزان مقبولة.", "عدم الاتساق كبير، فيجب أن يراجع صاحب القرار أحكامه."))]]

- id: c13-f-08
  kind: problem
  part: F
  text: |
    حول أوزان النقاط التالية إلى أوزان مجموعها 1: الأمان 30، والتكلفة 50، والراحة 20، والمظهر 10.
  solution: |
    مجموع النقاط 110، لا 100. نقسم على المجموع:

    | المعيار | الوزن |
    | --- | --- |
    | الأمان | 0.273 |
    | التكلفة | 0.455 |
    | الراحة | 0.182 |
    | المظهر | 0.091 |

    مثال التكلفة:

    $$
    \frac{50}{110} = 0.4545
    $$

- id: c13-f-09
  kind: concept
  part: F
  text: |
    لماذا يفضل أن تحدد الأوزان قبل جمع بيانات البدائل؟
  solution: |
    حتى لا تتأثر بالبديل الذي يميل إليه أصحاب القرار. الأوزان تعبر عما يهم الشركة، لا عن أداء بديل معين.

- id: c13-f-10
  kind: problem
  part: F
  vars: {n: 6}
  random: {n: [3, 10, 1]}
  calc:
    - m = n*(n - 1)/2
  text: |
    كم حكما يحتاجه صاحب القرار لمقارنة زوجية بين [[n|n]] معايير؟
  solution: |
    كل معيارين مرة واحدة، لأن الحكم المقابل مقلوب الأول:

    $$
    \frac{[[n|n]] \times [[n-1|n]]}{2} = [[m|g]]
    $$

    العدد يزيد بسرعة مع المعايير، لذلك تقسم المعايير الكثيرة إلى مجموعات.

# ================================================================ part G
- id: c13-g-01
  kind: problem
  part: G
  vars: {a1: 0.9, a2: 0.2, b1: 0.3, b2: 0.8, w: 0.5}
  random: {a1: [0.6, 1.0, 0.05], a2: [0.0, 0.4, 0.05], b1: [0.0, 0.4, 0.05], b2: [0.6, 1.0, 0.05], w: [0.3, 0.8, 0.05]}
  calc:
    - SA = w*a1 + (1 - w)*a2
    - SB = w*b1 + (1 - w)*b2
    - ws = (b2 - a2)/((a1 - b1) + (b2 - a2))
  text: |
    بديلان ومعياران بالدرجات الموحدة: A يأخذ [[a1|g]] و[[a2|g]]، وB يأخذ [[b1|g]] و[[b2|g]]. وزن المعيار الأول [[w|g]]. أي بديل تختار؟ وعند أي وزن يتغير القرار؟
  solution: |
    $$
    U_A = [[w|g]] \times [[a1|g]] + [[1-w|g]] \times [[a2|g]] = [[SA|f4]]
    $$

    $$
    U_B = [[w|g]] \times [[b1|g]] + [[1-w|g]] \times [[b2|g]] = [[SB|f4]]
    $$

    الأفضل [[pick(SA >= SB, "A", "B")]]. نقطة التحول:

    $$
    w^* = \frac{[[b2|g]] - [[a2|g]]}{([[a1|g]] - [[b1|g]]) + ([[b2|g]] - [[a2|g]])} = [[ws|f4]]
    $$

- id: c13-g-02
  kind: problem
  part: G
  vars: {C1: 52000, C2: 46000, Q1: 9, Q2: 6}
  random: {C1: [40000, 70000, 1000], C2: [30000, 60000, 1000], Q1: [6, 10, 1], Q2: [2, 8, 1]}
  calc:
    - C2 = min(C2, C1 - 2000)
    - Q2 = min(Q2, Q1 - 1)
    - ws = 1/2
  text: |
    آلتان: الأولى تكلفتها السنوية [[C1|g]] دينار وجودتها [[Q1|g]] من 10. الثانية [[C2|g]] دينار وجودتها [[Q2|g]]. بالتوحيد على الآلتين فقط، عند أي وزن للتكلفة يتغير القرار؟
  solution: |
    مع بديلين فقط، التوحيد يعطي الأفضل 1 والأسوأ 0 في كل معيار. الأولى: 0 في التكلفة و1 في الجودة. الثانية: 1 في التكلفة و0 في الجودة.

    $$
    U_1 = w \times 0 + (1 - w) \times 1 \qquad U_2 = w \times 1 + (1 - w) \times 0
    $$

    يتساويان عند w تساوي [[ws|g]]. إذا كان وزن التكلفة أكثر من نصف، تفوز الثانية. هذه نتيجة غريبة: الأرقام نفسها لا تؤثر. السبب أن التوحيد على بديلين فقط يمحو حجم الفرق. لذلك يفضل التوحيد على مدى معقول للمعيار، لا على البدائل وحدها.

- id: c13-g-03
  kind: problem
  part: G
  vars: {C: 300000, A1: 72000, A2: 65000, n: 8, i: 0.10}
  random: {C: [100000, 600000, 10000], A1: [20000, 150000, 1000], A2: [15000, 140000, 1000], n: [5, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - A2 = min(A2, A1 - 2000)
    - AW1 = C*AP(i, n) + A1
    - AW2 = C*1.2*AP(i, n) + A2
  text: |
    خطان للتعبئة. الأول يكلف [[C|g]] دينار، وتشغيله [[A1|g]] دينار سنويا. الثاني يكلف 20% أكثر، وتشغيله [[A2|g]] دينار سنويا، وأهدأ صوتا. العمر [[yrs(n)]]، والحد الأدنى [[i|%]]. احسب التكلفة السنوية المكافئة لكل خط، لتدخل معيارا في المصفوفة.
  solution: |
    $$
    AW_1 = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[A1|g]] = [[AW1|2]]
    $$

    $$
    AW_2 = [[C*1.2|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[A2|g]] = [[AW2|2]]
    $$

    هذا الرقم هو معيار التكلفة في المصفوفة. الهدوء معيار آخر يقيم على سلم. لا نضع الثمن والتشغيل معيارين منفصلين، لأن القيمة السنوية تجمعهما بالقيمة الزمنية للنقود.

- id: c13-g-04
  kind: problem
  part: G
  text: |
    لموردي المثال الأساسي في هذا الفصل، بالأوزان 0.5 و0.3 و0.2، كان A الأفضل. استخدم برنامج Python في آخر الشرح لتجد مدى وزن التكلفة الذي يبقى فيه A الأفضل، مع بقاء نسبة الجودة إلى التسليم 3 إلى 2.
  solution: |
    الدرجات الموحدة: A يأخذ 0.6667 في التكلفة، و0.6667 في الجودة، و0.6 في التسليم. B يأخذ 1 و0 و0. C يأخذ 0 و1 و1.

    بوزن تكلفة w، ووزن الجودة 0.6 من الباقي، ووزن التسليم 0.4 من الباقي:

    $$
    U_A = 0.6667\,w + (1 - w)(0.6 \times 0.6667 + 0.4 \times 0.6) = 0.6667\,w + 0.64\,(1 - w)
    $$

    $$
    U_B = w
    $$

    $$
    U_C = (1 - w)(0.6 + 0.4) = 1 - w
    $$

    A أفضل من C عندما يكون w أكبر من 0.35 تقريبا، وأفضل من B عندما يكون w أقل من 0.66 تقريبا. A يبقى الأفضل بين 0.35 و0.66، والوزن الحالي 0.5 في وسط هذا المدى، فالقرار ثابت أمام خلاف معقول على الأوزان.

- id: c13-g-05
  kind: problem
  part: G
  vars: {a1: 0.7, a2: 0.5, a3: 0.6, b1: 0.4, b2: 0.9, b3: 0.5, w1: 0.4, w2: 0.3}
  random: {a1: [0.5, 1.0, 0.05], a2: [0.0, 1.0, 0.05], a3: [0.0, 1.0, 0.05], b1: [0.0, 0.5, 0.05], b2: [0.0, 1.0, 0.05], b3: [0.0, 1.0, 0.05], w1: [0.2, 0.6, 0.05], w2: [0.1, 0.4, 0.05]}
  calc:
    - w3 = 1 - w1 - w2
    - SA = w1*a1 + w2*a2 + w3*a3
    - SB = w1*b1 + w2*b2 + w3*b3
    - d = SA - SB
  text: |
    بديلان وثلاثة معايير بالدرجات الموحدة: A يأخذ [[a1|g]] و[[a2|g]] و[[a3|g]]، وB يأخذ [[b1|g]] و[[b2|g]] و[[b3|g]]. الأوزان [[w1|g]] و[[w2|g]] و[[w3|g]]. أي بديل تختار؟ وما الفرق بين الدرجتين؟
  solution: |
    $$
    U_A = [[w1|g]] \times [[a1|g]] + [[w2|g]] \times [[a2|g]] + [[w3|g]] \times [[a3|g]] = [[SA|f4]]
    $$

    $$
    U_B = [[w1|g]] \times [[b1|g]] + [[w2|g]] \times [[b2|g]] + [[w3|g]] \times [[b3|g]] = [[SB|f4]]
    $$

    الأفضل [[pick(d >= 0, "A", "B")]]، بفرق [[abs(d)|f4]]. [[pick(abs(d) < 0.05, "الفرق صغير جدا: تغيير بسيط في الأوزان أو في تقدير درجة قد يقلب القرار.", "الفرق واضح.")]]

- id: c13-g-06
  kind: concept
  part: G
  text: |
    درجة البديل الفائز 0.61، والثاني 0.60. ماذا تنصح اللجنة؟
  solution: |
    الفرق أصغر من دقة التقديرات نفسها. البديلان متعادلان عمليا. تنصح بتحليل حساسية للأوزان، أو بإضافة معيار مهمل، أو بالتفاوض مع الموردين على شروط أفضل قبل الاختيار.

- id: c13-g-07
  kind: problem
  part: G
  vars: {P1: 410000, P2: 380000, P3: 455000}
  random: {P1: [300000, 500000, 5000], P2: [280000, 480000, 5000], P3: [320000, 560000, 5000]}
  calc:
    - P2 = pick(P2 == P1, P1 - 5000, P2)
    - lo = min(P1, P2, P3)
    - hi = max(P1, P2, P3)
    - s1 = (hi - P1)/(hi - lo)
    - s2 = (hi - P2)/(hi - lo)
    - s3 = (hi - P3)/(hi - lo)
  text: |
    القيمة الحالية لتكاليف ثلاثة أنظمة تكييف لمبنى، خلال 15 سنة: [[P1|g]] و[[P2|g]] و[[P3|g]] دينار. حولها إلى درجات معيار التكلفة.
  solution: |
    التكلفة كلما قلت كان أفضل:

    $$
    u = \frac{[[hi|g]] - x}{[[hi|g]] - [[lo|g]]}
    $$

    | النظام | التكلفة | الدرجة |
    | --- | --- | --- |
    | 1 | [[P1|g]] | [[s1|f4]] |
    | 2 | [[P2|g]] | [[s2|f4]] |
    | 3 | [[P3|g]] | [[s3|f4]] |

    التكاليف محسوبة بالقيمة الحالية، فالدرجات تشمل الثمن والتشغيل والقيمة الزمنية للنقود معا.

- id: c13-g-08
  kind: problem
  part: G
  vars: {s: 0.6, w: 0.3}
  random: {s: [0.1, 0.9, 0.05], w: [0.1, 0.6, 0.05]}
  calc:
    - d = w*s
  text: |
    بديل حصل على [[s|g]] في معيار وزنه [[w|g]]. أعاد الخبير تقييمه في هذا المعيار فأعطاه 0. كم تنخفض درجته الكلية؟
  solution: |
    $$
    [[w|g]] \times ([[s|g]] - 0) = [[d|f4]]
    $$

    التغير في الدرجة الكلية هو التغير في درجة المعيار مضروبا في وزنه. لذلك أخطاء التقدير في المعايير الثقيلة أخطر.

- id: c13-g-09
  kind: problem
  part: G
  text: |
    ثلاثة بدائل ومعياران، بالدرجات الموحدة: A يأخذ 1 و0، وB يأخذ 0 و1، وC يأخذ 0.6 و0.6. اكتب درجة كل بديل بدلالة وزن المعيار الأول w. متى يفوز C؟
  solution: |
    $$
    U_A = w \qquad U_B = 1 - w \qquad U_C = 0.6
    $$

    C يفوز إذا كانت درجته أكبر من الاثنين معا:

    $$
    0.6 > w
    $$

    $$
    0.6 > 1 - w
    $$

    أي عندما يكون w بين 0.4 و0.6. البديل المتوازن يفوز عندما تكون الأوزان متقاربة، والبديل المتطرف يفوز عندما يطغى معيار.

- id: c13-g-10
  kind: concept
  part: G
  text: |
    لماذا يعتبر عرض نتيجة تحليل الحساسية للمسؤولين أهم من عرض الدرجة النهائية وحدها؟
  solution: |
    الدرجة النهائية رقم واحد يخفي افتراضات كثيرة. الحساسية تقول للمسؤول متى يتغير القرار، فيعرف أي افتراض يستحق النقاش، وكم هو واثق من الاختيار.
