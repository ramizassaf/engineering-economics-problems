# ================================================================ part H
- id: c13-h-01
  kind: problem
  part: H
  text: |
    ابن في Excel مصفوفة المثال الأساسي في هذا الفصل، مع جدول الدرجات الموحدة والدرجة المرجحة، بحيث تتغير النتيجة تلقائيا إذا غيرت أي رقم أو وزن.
  solution: |
    البيانات في B2:D4، والأوزان في B6:D6. للمعيار الذي كلما قل كان أفضل، الدرجة الموحدة في F2:

    ```excel
    =(MAX(B$2:B$4)-B2)/(MAX(B$2:B$4)-MIN(B$2:B$4))
    ```

    وللذي كلما زاد كان أفضل، في G2:

    ```excel
    =(C2-MIN(C$2:C$4))/(MAX(C$2:C$4)-MIN(C$2:C$4))
    ```

    الدرجة المرجحة في I2:

    ```excel
    =SUMPRODUCT($B$6:$D$6, F2:H2)
    ```

    والأفضل:

    ```excel
    =INDEX(A2:A4, MATCH(MAX(I2:I4), I2:I4, 0))
    ```

- id: c13-h-02
  kind: problem
  part: H
  text: |
    اكتب دالة Python تأخذ جدول بدائل، واتجاه كل معيار، والأوزان، وتعيد الدرجات المرجحة مرتبة. اختبرها على آلات التغليف في الجزء د.
  solution: |
    ```python
    def weighted_scores(alts, better, w):
        cols = list(zip(*alts.values()))
        lo, hi = [min(c) for c in cols], [max(c) for c in cols]
        out = {}
        for name, row in alts.items():
            s = [(x - lo[j]) / (hi[j] - lo[j]) if better[j] == "high" else (hi[j] - x) / (hi[j] - lo[j])
                 for j, x in enumerate(row)]
            out[name] = sum(wj * sj for wj, sj in zip(w, s))
        return sorted(out.items(), key=lambda kv: -kv[1])

    machines = {"A": [52000, 120, 6], "B": [47000, 100, 9], "C": [60000, 150, 4]}
    print(weighted_scores(machines, ["low", "high", "low"], [0.4, 0.4, 0.2]))
    ```

    النتيجة: C بدرجة 0.6، ثم A وB. الدالة تفترض أن البدائل ليست متساوية في أي معيار، وإلا قسمت على صفر.

- id: c13-h-03
  kind: problem
  part: H
  text: |
    عدل الدالة السابقة لتتجنب القسمة على صفر عندما تتساوى كل البدائل في معيار.
  solution: |
    إذا تساوت البدائل في معيار، فهو لا يفرق بينها. نعطيها كلها نفس الدرجة، مثلا 1:

    ```python
    def scale(x, lo, hi, better):
        if hi == lo:
            return 1.0
        return (x - lo) / (hi - lo) if better == "high" else (hi - x) / (hi - lo)
    ```

    أي قيمة ثابتة تعطي نفس الترتيب، لأنها تضيف نفس المقدار لكل البدائل.

- id: c13-h-04
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يحسب أوزان المقارنة الزوجية بالوسط الهندسي لأي عدد من المعايير، واختبره على مثال المقارنة الزوجية في هذا الفصل.
  solution: |
    ```python
    import math

    def ahp_weights(M):
        g = [math.prod(row) ** (1 / len(row)) for row in M]
        return [x / sum(g) for x in g]

    M = [ [1, 2, 4],
         [1 / 2, 1, 2],
         [1 / 4, 1 / 2, 1]]
    print([round(w, 4) for w in ahp_weights(M)])
    ```

    النتيجة 0.5714 و0.2857 و0.1429، كما في المثال.

- id: c13-h-05
  kind: problem
  part: H
  text: |
    في Excel، ابن جدول حساسية لوزن التكلفة من 0 إلى 1 بخطوة 0.05 لموردي المثال الأساسي، وأضف عمودا يكتب اسم الأفضل في كل صف.
  solution: |
    الوزن في A2:A22. درجة A في B2، مع بقاء نسبة الجودة إلى التسليم 3 إلى 2:

    ```excel
    =A2*0.6667+(1-A2)*(0.6*0.6667+0.4*0.6)
    ```

    درجة B في C2 ودرجة C في D2 بنفس الطريقة. الأفضل في E2:

    ```excel
    =INDEX($B$1:$D$1, MATCH(MAX(B2:D2), B2:D2, 0))
    ```

    ارسم الأعمدة الثلاثة مقابل الوزن. نقطتا التقاطع، عند 0.35 و0.66 تقريبا، تحدان المدى الذي يفوز فيه A.

- id: c13-h-06
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يحذف البدائل المسيطر عليها من أي مصفوفة. اختبره على المولدات في الجزء ب.
  solution: |
    ```python
    def dominated(alts, better):
        def at_least_as_good(a, b):
            return all((x >= y) if d == "high" else (x <= y) for x, y, d in zip(a, b, better))
        out = set()
        for p, a in alts.items():
            for q, b in alts.items():
                if p != q and at_least_as_good(b, a) and a != b:
                    out.add(p)
        return out

    gens = {"P": [18, 100, 70], "Q": [22, 120, 65], "R": [20, 100, 72], "S": [25, 150, 68], "T": [21, 110, 65]}
    print(dominated(gens, ["low", "high", "low"]))
    ```

    النتيجة R وحده، كما في الحل باليد.

- id: c13-h-07
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يطبق الترتيب المعجمي على أي مصفوفة، مع ترتيب للمعايير. اختبره على المولدات بترتيب الضجيج ثم الثمن ثم القدرة.
  solution: |
    ```python
    def lexicographic(alts, order, better):
        def key(name):
            row = alts[name]
            return tuple(row[j] if better[j] == "low" else -row[j] for j in order)
        return min(alts, key=key)

    gens = {"P": [18, 100, 70], "Q": [22, 120, 65], "R": [20, 100, 72], "S": [25, 150, 68], "T": [21, 110, 65]}
    print(lexicographic(gens, [2, 0, 1], ["low", "high", "low"]))
    ```

    النتيجة T. مقارنة الأزواج في Python تعمل بالترتيب المعجمي أصلا، فيكفي بناء المفتاح الصحيح.

- id: c13-h-08
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يسحب أوزانا عشوائية 10,000 مرة لموردي المثال الأساسي، ويحسب نسبة المرات التي يفوز فيها كل مورد.
  solution: |
    ```python
    import numpy as np

    s = {"A": [0.6667, 0.6667, 0.6], "B": [1.0, 0.0, 0.0], "C": [0.0, 1.0, 1.0]}
    rng = np.random.default_rng(1)
    W = rng.dirichlet([1, 1, 1], 10000)
    wins = {k: 0 for k in s}
    for w in W:
        scores = {k: float(np.dot(w, v)) for k, v in s.items()}
        wins[max(scores, key=scores.get)] += 1
    print({k: v / 10000 for k, v in wins.items()})
    ```

    الأوزان العشوائية موزعة بالتساوي على كل الأوزان الممكنة. إذا فاز بديل في نسبة كبيرة منها، فهو اختيار قوي حتى بدون اتفاق على الأوزان.

- id: c13-h-09
  kind: problem
  part: H
  text: |
    في Excel، احسب أوزان الترتيب لثمانية معايير بصيغة واحدة تنسخ للأسفل.
  solution: |
    ترتيب المعيار في A2:A9، من 1 إلى 8. الوزن في B2:

    ```excel
    =(8-A2+1)/(8*9/2)
    ```

    المعيار الأول يأخذ 8 على 36، والأخير 1 على 36.

- id: c13-h-10
  kind: problem
  part: H
  text: |
    اكتب برنامج Python يجمع خطوتين: يحذف البدائل التي لا تحقق الحدود الدنيا، ثم يختار من الباقي بالمجموع المرجح. اختبره على مواقع روضة الأطفال في الجزء ج، بأوزان 0.5 للإيجار و0.2 للبعد و0.3 للمساحة.
  solution: |
    ```python
    sites = {"1": [900, 50, 200], "2": [700, 400, 150], "3": [800, 150, 300], "4": [1000, 300, 250]}
    ok = {k: v for k, v in sites.items() if v[0] <= 850 and v[1] >= 100 and v[2] >= 180}
    print("pass:", list(ok))
    ```

    يبقى الموقع 3 وحده، فلا حاجة إلى المجموع المرجح. لو بقي أكثر من موقع، نطبق دالة المسألة الثانية على الباقي فقط. التوحيد يحسب على البدائل الباقية، لا على كل البدائل الأصلية.

