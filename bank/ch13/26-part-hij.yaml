- id: c13-i-02
  kind: mcq
  part: I
  vars: {x: 45000, lo: 38000, hi: 50000}
  calc:
    - x = pick(2*x == lo + hi, x + 1000, x)
    - s = (hi - x)/(hi - lo)
    - w1 = (x - lo)/(hi - lo)
    - w2 = x/hi
    - w3 = (hi - x)/hi
  text: |
    تكلفة بديل [[x|g]] دينار، وأقل تكلفة بين البدائل [[lo|g]]، وأعلاها [[hi|g]]. ما درجته الموحدة في التكلفة؟
  options: ["[[w1|f4]]", "[[s|f4]]", "[[w2|f4]]", "[[w3|f4]]"]
  correct: 1
  solution: |
    التكلفة كلما قلت كان أفضل:

    $$
    \frac{[[hi|g]] - [[x|g]]}{[[hi|g]] - [[lo|g]]} = [[s|f4]]
    $$

    الخيار (أ) عامل التكلفة كأنها كلما زادت كان أفضل. الخياران (ج) و(د) لم يطرحا أقل قيمة.

