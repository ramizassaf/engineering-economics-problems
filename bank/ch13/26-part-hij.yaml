# ================================================================ part J
- id: c13-j-01
  kind: case
  part: J
  calc:
    - a = PA(0.10, 10)
    - P1 = 350000 + 42000*a
    - P2 = 300000 + 55000*a
    - P3 = 420000 + 30000*a
    - hi = max(P1, P2, P3)
    - lo = min(P1, P2, P3)
    - c1 = (hi - P1)/(hi - lo)
    - c2 = (hi - P2)/(hi - lo)
    - c3 = (hi - P3)/(hi - lo)
    - S1 = 0.5*c1 + 0.3*0.5 + 0.2*0.5
    - S2 = 0.5*c2 + 0.3*0 + 0.2*0
    - S3 = 0.5*c3 + 0.3*1 + 0.2*1
  text: |
    **حالة 13.1: خط تعبئة لمصنع ألبان**

    مصنع ألبان في جنين يختار خط تعبئة من ثلاثة عروض. العمر 10 سنوات، والحد الأدنى 10%:

    | العرض | الثمن، دينار | التشغيل السنوي، دينار | الهدر، % | سهولة التنظيف، من 10 |
    | --- | --- | --- | --- | --- |
    | أوروبي | 350,000 | 42,000 | 1.5 | 7 |
    | آسيوي | 300,000 | 55,000 | 2.5 | 5 |
    | محلي مطور | 420,000 | 30,000 | 0.5 | 9 |

    الأوزان: التكلفة 0.5، والهدر 0.3، والتنظيف 0.2. (أ) احسب القيمة الحالية للتكاليف. (ب) وحد المقاييس واحسب الدرجات. (ج) أي عرض تختار؟
  solution: |
    (أ)

    $$
    (P/A,\ 10\%,\ 10) = [[a|f4]]
    $$

    | العرض | القيمة الحالية للتكاليف |
    | --- | --- |
    | أوروبي | [[P1|0]] |
    | آسيوي | [[P2|0]] |
    | محلي مطور | [[P3|0]] |

    (ب) التكلفة والهدر كلما قلا كان أفضل، والتنظيف كلما زاد كان أفضل:

    | العرض | التكلفة | الهدر | التنظيف |
    | --- | --- | --- | --- |
    | أوروبي | [[c1|f4]] | 0.5 | 0.5 |
    | آسيوي | [[c2|f4]] | 0 | 0 |
    | محلي مطور | [[c3|f4]] | 1 | 1 |

    (ج) الدرجات المرجحة:

    | العرض | الدرجة |
    | --- | --- |
    | أوروبي | [[S1|f4]] |
    | آسيوي | [[S2|f4]] |
    | محلي مطور | [[S3|f4]] |

    الاختيار: [[pick(S3 >= max(S1, S2), "المحلي المطور", pick(S1 >= S2, "الأوروبي", "الآسيوي"))]]. الآسيوي الأرخص ثمنا، لكن تشغيله يرفع قيمته الحالية، وهو الأسوأ في الباقي.

- id: c13-j-02
  kind: case
  part: J
  text: |
    **حالة 13.2: موقع مركز صحي في محافظة طوباس**

    وزارة الصحة تختار موقعا من أربعة. اللجنة وضعت حدودا دنيا: يخدم 8,000 نسمة على الأقل ضمن 5 كيلومترات، والأرض متاحة خلال سنة. ثم تختار بالمجموع المرجح: التكلفة 0.4، والسكان المخدومون 0.4، والوصول بالمواصلات العامة 0.2.

    | الموقع | التكلفة، ألف دينار | السكان | الأرض متاحة خلال سنة | المواصلات، من 10 |
    | --- | --- | --- | --- | --- |
    | 1 | 900 | 12,000 | نعم | 6 |
    | 2 | 750 | 7,500 | نعم | 8 |
    | 3 | 1,100 | 15,000 | نعم | 9 |
    | 4 | 800 | 10,000 | لا | 7 |

    (أ) أي المواقع تبقى بعد الحدود الدنيا؟ (ب) أي موقع تختار؟
  solution: |
    (أ) الموقع 2 يخدم أقل من 8,000، والموقع 4 أرضه غير متاحة. يبقى 1 و3.

    (ب) نوحد على الموقعين الباقيين فقط:

    | الموقع | التكلفة | السكان | المواصلات |
    | --- | --- | --- | --- |
    | 1 | 1 | 0 | 0 |
    | 3 | 0 | 1 | 1 |

    $$
    S_1 = 0.4 \times 1 + 0.4 \times 0 + 0.2 \times 0 = 0.4
    $$

    $$
    S_3 = 0.4 \times 0 + 0.4 \times 1 + 0.2 \times 1 = 0.6
    $$

    نختار الموقع 3. لكن مع موقعين فقط، التوحيد يجعل كل فرق كاملا: فرق 200 ألف دينار يساوي فرق 3,000 نسمة. يحسن أن تنظر اللجنة إلى الأرقام نفسها: 200 ألف دينار إضافية لخدمة 3,000 نسمة أكثر، أي حوالي 67 دينارا لكل نسمة إضافية.

- id: c13-j-03
  kind: case
  part: J
  calc:
    - g1 = exp(ln(15)/3)
    - g2 = exp(ln(2/3)/3)
    - g3 = exp(-ln(10)/3)
    - G = g1 + g2 + g3
    - w1 = g1/G
    - w2 = g2/G
    - w3 = g3/G
    - SX = w1*1 + w2*0.2 + w3*0
    - SY = w1*0.6 + w2*1 + w3*0.5
    - SZ = w1*0 + w2*0.7 + w3*1
  text: |
    **حالة 13.3: مورد أدوية لمستشفى حكومي**

    المستشفى يقيم ثلاثة موردين بثلاثة معايير. المقارنة الزوجية: السعر أهم من الالتزام بالمواعيد 3 مرات، والسعر أهم من خدمة ما بعد البيع 5 مرات، والالتزام أهم من الخدمة مرتين. الدرجات الموحدة:

    | المورد | السعر | الالتزام | الخدمة |
    | --- | --- | --- | --- |
    | X | 1 | 0.2 | 0 |
    | Y | 0.6 | 1 | 0.5 |
    | Z | 0 | 0.7 | 1 |

    (أ) احسب الأوزان. (ب) أي مورد تختار؟ (ج) هل الأحكام متسقة؟
  solution: |
    (أ) الأوساط الهندسية للصفوف:

    $$
    g_1 = (1 \times 3 \times 5)^{1/3} = [[g1|f4]]
    $$

    $$
    g_2 = (0.3333 \times 1 \times 2)^{1/3} = [[g2|f4]]
    $$

    $$
    g_3 = (0.2 \times 0.5 \times 1)^{1/3} = [[g3|f4]]
    $$

    الأوزان: السعر [[w1|f4]]، والالتزام [[w2|f4]]، والخدمة [[w3|f4]].

    (ب)

    | المورد | الدرجة |
    | --- | --- |
    | X | [[SX|f4]] |
    | Y | [[SY|f4]] |
    | Z | [[SZ|f4]] |

    نختار [[pick(SY >= max(SX, SZ), "Y", pick(SX >= SZ, "X", "Z"))]]. X الأرخص، لكن ضعفه في الالتزام خطير لمستشفى: نقص دواء يكلف أكثر من فرق السعر.

    (ج) الاتساق يتطلب أن يكون السعر أهم من الخدمة 3 ضرب 2، أي 6 مرات. الحكم الفعلي 5، قريب من 6. عدم الاتساق قليل، والأوزان مقبولة.

- id: c13-j-04
  kind: case
  part: J
  text: |
    **حالة 13.4: نظام طاقة لمدرسة**

    مديرية تربية تختار بين ثلاثة أنظمة طاقة لمدرسة نائية. القيمة الحالية لتكاليف 20 سنة: شبكة كهرباء مع مولد احتياطي 180 ألف دينار، وألواح شمسية مع بطاريات 210 ألفا، ونظام هجين 195 ألفا. ساعات الانقطاع المتوقعة في السنة: 120، و40، و15. أثر البيئة من 10، الأعلى أنظف: 3، و9، و7.

    (أ) هل يوجد نظام مسيطر عليه؟ (ب) بأوزان 0.4 للتكلفة و0.4 للانقطاع و0.2 للبيئة، أي نظام تختار؟ (ج) ما أقل وزن للتكلفة يجعل الشبكة الأفضل، إذا بقي الانقطاع والبيئة بنسبة 2 إلى 1؟
  solution: |
    (أ) لا. الشبكة الأرخص، والهجين الأقل انقطاعا، والشمسي الأنظف.

    (ب) الدرجات الموحدة:

    | النظام | التكلفة | الانقطاع | البيئة |
    | --- | --- | --- | --- |
    | شبكة | 1 | 0 | 0 |
    | شمسي | 0 | 0.7619 | 1 |
    | هجين | 0.5 | 1 | 0.6667 |

    مثال الانقطاع للشمسي:

    $$
    \frac{120 - 40}{120 - 15} = 0.7619
    $$

    الدرجات المرجحة:

    $$
    S_{grid} = 0.4 \times 1 = 0.4
    $$

    $$
    S_{solar} = 0.4 \times 0.7619 + 0.2 \times 1 = 0.5048
    $$

    $$
    S_{hybrid} = 0.4 \times 0.5 + 0.4 \times 1 + 0.2 \times 0.6667 = 0.7333
    $$

    نختار الهجين.

    (ج) بوزن تكلفة w، والانقطاع ثلثا الباقي، والبيئة ثلثه:

    $$
    S_{grid} = w
    $$

    $$
    S_{hybrid} = 0.5\,w + (1 - w)\left(\frac{2}{3} \times 1 + \frac{1}{3} \times 0.6667\right) = 0.5\,w + 0.8889\,(1 - w)
    $$

    تتساويان عند:

    $$
    w = \frac{0.8889}{0.5 + 0.8889} = 0.64
    $$

    الشبكة تفوز فقط إذا كان وزن التكلفة أكثر من 0.64 تقريبا. القرار للهجين قوي.
