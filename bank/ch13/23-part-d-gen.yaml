  text: |
    شركة تختار آلة تغليف. البيانات:

    | البديل | الثمن، دينار | السرعة، عبوة في الدقيقة | الأعطال، في السنة |
    | --- | --- | --- | --- |
    | A | [[x11|g]] | [[x12|g]] | [[x13|g]] |
    | B | [[x21|g]] | [[x22|g]] | [[x23|g]] |
    | C | [[x31|g]] | [[x32|g]] | [[x33|g]] |

    حول كل معيار إلى درجة بين 0 و1.
  solution: |
    اتجاه المعايير: الثمن كلما قل كان أفضل، والسرعة كلما زاد كان أفضل، والأعطال كلما قل كان أفضل. الأسوأ بين البدائل يأخذ 0، والأفضل يأخذ 1. مثال: درجة A في الثمن:

    $$
    u = \frac{[[hi1|g]] - [[x11|g]]}{[[hi1|g]] - [[lo1|g]]} = [[s11|f4]]
    $$

    | البديل | الثمن | السرعة | الأعطال |
    | --- | --- | --- | --- |
    | A | [[s11|f4]] | [[s12|f4]] | [[s13|f4]] |
    | B | [[s21|f4]] | [[s22|f4]] | [[s23|f4]] |
    | C | [[s31|f4]] | [[s32|f4]] | [[s33|f4]] |
