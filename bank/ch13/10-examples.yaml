# ------------------------------------------------------------ decision matrix and dominance
- id: c13-ex-matrix
  kind: example
  title: |
    مصفوفة القرار والبديل المسيطر عليه
  text: |
    شركة توزيع تختار نظام تتبع لشاحناتها. أربعة عروض:

    | العرض | التكلفة السنوية، دينار | دقة الموقع، متر | الدعم الفني، من 10 |
    | --- | --- | --- | --- |
    | W | 14,000 | 5 | 8 |
    | X | 11,000 | 8 | 7 |
    | Y | 9,500 | 15 | 6 |
    | Z | 12,500 | 10 | 6 |

    التكلفة والدقة كلما قلتا كان أفضل، والدعم كلما زاد كان أفضل. هل يوجد عرض يمكن حذفه قبل أي حساب؟
  solution: |
    نقارن كل عرضين في المعايير الثلاثة. Z مقابل X:

    | المعيار | X | Z | الأفضل |
    | --- | --- | --- | --- |
    | التكلفة | 11,000 | 12,500 | X |
    | الدقة | 8 | 10 | X |
    | الدعم | 7 | 6 | X |

    X أفضل من Z في كل المعايير، فـ Z مسيطر عليه. نحذفه: لا توجد أوزان تجعله الأفضل.

    باقي العروض لا يسيطر أحدها على الآخر: W الأدق والأفضل دعما لكنه الأغلى، وY الأرخص لكنه الأقل دقة. الاختيار بينها يحتاج أوزانا أو حدودا دنيا.

# ------------------------------------------------------------ minimum standards and one strength
- id: c13-ex-satisfice
  kind: example
  title: |
    الحد الأدنى لكل معيار والتميز في معيار
  text: |
    في المثال السابق، بعد حذف Z، وضعت الشركة حدودا مقبولة: التكلفة لا تزيد على 12,000 دينار، والدقة 10 أمتار أو أقل، والدعم 6 أو أكثر. (أ) أي العروض يبقى؟ (ب) لو قبلت الشركة أي عرض يتميز في معيار واحد على الأقل، بتكلفة أقل من 10,000، أو دقة 5 أمتار أو أقل، أو دعم 8 أو أكثر، فأيها يقبل؟
  solution: |
    (أ) الحد الأدنى لكل معيار:

    | العرض | التكلفة | الدقة | الدعم | النتيجة |
    | --- | --- | --- | --- | --- |
    | W | لا | نعم | نعم | يحذف |
    | X | نعم | نعم | نعم | يبقى |
    | Y | نعم | لا | نعم | يحذف |

    يبقى X وحده. الطريقة صارمة: W حذف بسبب معيار واحد، مع أنه الأفضل في معيارين.

    (ب) التميز في معيار واحد: W يتميز في الدقة والدعم، وY في التكلفة. X لا يتميز في أي معيار، فيحذف. الطريقتان أعطتا نتيجتين متعاكستين، لأن كلا منهما تسأل سؤالا مختلفا.

# ------------------------------------------------------------ lexicography
- id: c13-ex-lexico
  kind: example
  title: |
    الترتيب المعجمي
  text: |
    لنفس العروض W وX وY، رتبت الإدارة المعايير: الدعم الفني أولا، ثم الدقة، ثم التكلفة. أي عرض تختار بالترتيب المعجمي؟ وماذا لو كانت التكلفة أولا؟
  solution: |
    **الدعم أولا:** W يأخذ 8، أعلى من الباقين. نختار W مباشرة، ولا ننظر إلى المعايير الأخرى.

    **التكلفة أولا:** Y أرخص الثلاثة، فنختاره.

    الطريقة سهلة وواضحة، لكنها تتجاهل كل شيء بعد المعيار الأول إذا لم يتساو بديلان فيه. فرق دينار واحد في التكلفة يكفي لتجاهل فرق كبير في الدقة. تصلح عندما يكون معيار أهم بكثير من الباقي، مثل السلامة.

# ------------------------------------------------------------ rank weights and points
- id: c13-ex-rankweights
  kind: example
  title: |
    أوزان الترتيب وتوزيع النقاط
  calc:
    - w1 = 4/10
    - w2 = 3/10
    - w3 = 2/10
    - w4 = 1/10
  text: |
    لجنة تختار موقعا لمستودع. رتبت المعايير الأربعة: التكلفة أولا، ثم القرب من الطريق السريع، ثم المساحة، ثم توفر العمالة. احسب الأوزان بطريقة الترتيب. ثم قارنها بأوزان من توزيع 100 نقطة: 45 و25 و20 و10.
  solution: |
    أربعة معايير: الأول يأخذ 4 نقاط، والأخير نقطة واحدة. المجموع:

    $$
    4 + 3 + 2 + 1 = 10
    $$

    | المعيار | النقاط | الوزن بالترتيب | الوزن بالنقاط |
    | --- | --- | --- | --- |
    | التكلفة | 4 | [[w1|g]] | 0.45 |
    | القرب من الطريق | 3 | [[w2|g]] | 0.25 |
    | المساحة | 2 | [[w3|g]] | 0.20 |
    | العمالة | 1 | [[w4|g]] | 0.10 |

    أوزان الترتيب سهلة، لأنها تحتاج ترتيبا فقط، لكنها تفترض أن الفرق بين كل معيارين متساو. توزيع النقاط يسمح للجنة بأن تقول إن التكلفة أهم بكثير من الباقي.

# ------------------------------------------------------------ pairwise comparison
- id: c13-ex-pairwise
  kind: example
  title: |
    الأوزان بالمقارنة الزوجية
  vars: {a: 2, b: 4, c: 2}
  random: {a: [1, 5, 1], b: [2, 8, 1], c: [1, 5, 1]}
  calc:
    - g1 = exp(ln(a*b)/3)
    - g2 = exp(ln(c/a)/3)
    - g3 = exp(-ln(b*c)/3)
    - G = g1 + g2 + g3
    - w1 = g1/G
    - w2 = g2/G
    - w3 = g3/G
  text: |
    مدير مشتريات قارن ثلاثة معايير لاختيار مورد، كل معيارين معا: التكلفة أهم من الجودة [[a|g]] مرة، والتكلفة أهم من مدة التسليم [[b|g]] مرة، والجودة أهم من مدة التسليم [[c|g]] مرة. احسب الأوزان.
  solution: |
    نكتب جدول المقارنة: الخانة في صف معيار وعمود آخر تقول كم مرة الأول أهم. القطر 1، والخانة المقابلة مقلوبها:

    | | التكلفة | الجودة | التسليم |
    | --- | --- | --- | --- |
    | التكلفة | 1 | [[a|g]] | [[b|g]] |
    | الجودة | [[1/a|f4]] | 1 | [[c|g]] |
    | التسليم | [[1/b|f4]] | [[1/c|f4]] | 1 |

    لكل صف نحسب الوسط الهندسي: الجذر الثالث لحاصل ضرب الخانات:

    $$
    g_1 = (1 \times [[a|g]] \times [[b|g]])^{1/3} = [[g1|f4]]
    $$

    $$
    g_2 = ([[1/a|f4]] \times 1 \times [[c|g]])^{1/3} = [[g2|f4]]
    $$

    $$
    g_3 = ([[1/b|f4]] \times [[1/c|f4]] \times 1)^{1/3} = [[g3|f4]]
    $$

    الوزن هو الوسط مقسوما على مجموع الأوساط [[G|f4]]:

    | المعيار | الوزن |
    | --- | --- |
    | التكلفة | [[w1|f4]] |
    | الجودة | [[w2|f4]] |
    | التسليم | [[w3|f4]] |

    إذا كانت الأحكام متسقة، أي أن التكلفة على التسليم تساوي التكلفة على الجودة ضرب الجودة على التسليم، فالأوزان تعيد إنتاج الجدول بالضبط. هنا [[pick(b == a*c, "الأحكام متسقة تماما.", "الأحكام غير متسقة تماما، والوسط الهندسي يعطي أقرب أوزان لها.")]]

# ------------------------------------------------------------ weight sensitivity
- id: c13-ex-flip
  kind: example
  title: |
    الوزن الذي يقلب القرار
  vars: {a1: 0.80, a2: 0.30, b1: 0.20, b2: 0.90, w: 0.6}
  random: {a1: [0.6, 1.0, 0.05], a2: [0.0, 0.4, 0.05], b1: [0.0, 0.4, 0.05], b2: [0.6, 1.0, 0.05], w: [0.3, 0.8, 0.05]}
  calc:
    - SA = w*a1 + (1 - w)*a2
    - SB = w*b1 + (1 - w)*b2
    - ws = (b2 - a2)/((a1 - b1) + (b2 - a2))
  text: |
    بديلان ومعياران، التكلفة والجودة، بالدرجات الموحدة: A يأخذ [[a1|g]] في التكلفة و[[a2|g]] في الجودة. B يأخذ [[b1|g]] و[[b2|g]]. وزن التكلفة [[w|g]]. أي بديل تختار؟ وعند أي وزن للتكلفة يتغير القرار؟
  solution: |
    $$
    U_A = [[w|g]] \times [[a1|g]] + [[1-w|g]] \times [[a2|g]] = [[SA|f4]]
    $$

    $$
    U_B = [[w|g]] \times [[b1|g]] + [[1-w|g]] \times [[b2|g]] = [[SB|f4]]
    $$

    الأفضل [[pick(SA >= SB, "A", "B")]]. نبحث عن وزن التكلفة w الذي تتساوى عنده الدرجتان:

    $$
    w\,[[a1|g]] + (1 - w)\,[[a2|g]] = w\,[[b1|g]] + (1 - w)\,[[b2|g]]
    $$

    $$
    w^* = \frac{[[b2|g]] - [[a2|g]]}{([[a1|g]] - [[b1|g]]) + ([[b2|g]] - [[a2|g]])} = [[ws|f4]]
    $$

    إذا زاد وزن التكلفة على [[ws|f4]] يفضل A، وإذا قل يفضل B. الوزن الحالي [[w|g]] يبعد [[abs(w - ws)|f4]] عن نقطة التحول. [[pick(abs(w - ws) < 0.1, "القرار هش: خلاف صغير على الأوزان يقلبه.", "القرار ثابت في مدى معقول من الأوزان.")]]
