items:

- id: c07-a-01
  kind: concept
  part: A
  text: |
    لماذا نضيف الاستهلاك إلى صافي الربح لنحصل على التدفق النقدي؟
  solution: |
    لأن الاستهلاك طرح من الإيراد ليحسب الضريبة فقط، ولم يخرج نقدا من الشركة. المال خرج مرة واحدة يوم شراء الأصل.

- id: c07-a-02
  kind: concept
  part: A
  text: |
    ما الفرق بين صافي الربح والتدفق النقدي في سنة معينة؟
  solution: |
    صافي الربح رقم محاسبي يطرح منه الاستهلاك. التدفق النقدي هو المال الذي دخل فعلا ناقص المال الذي خرج فعلا. في التقييم نستخدم التدفق النقدي، لأن الفائدة تكسب على المال الحقيقي.

- id: c07-a-03
  kind: concept
  part: A
  text: |
    لماذا لا يخضع رأس المال العامل للضريبة، ولا يستهلك؟
  solution: |
    لأنه ليس مصروفا، بل مال محبوس في المخزون والذمم. يبقى ملكا للشركة، ويعود في نهاية المشروع بنفس قيمته تقريبا.

- id: c07-a-04
  kind: concept
  part: A
  text: |
    إذا كان رأس المال العامل يعود كاملا في النهاية، فلماذا يخفض القيمة الحالية للمشروع؟
  solution: |
    لأنه يخرج اليوم ويعود بعد سنوات. القيمة الحالية لما يعود أقل مما خرج. الفرق هو الفائدة التي كان المال سيكسبها في مكان آخر.

- id: c07-a-05
  kind: concept
  part: A
  text: |
    لماذا نقيم المشروع أولا بدون القرض، حتى لو كانت الشركة ستقترض فعلا؟
  solution: |
    لنحكم على المشروع نفسه: هل يعطي عائدا كافيا على المال المستثمر فيه؟ قرار التمويل منفصل، ويمكن دراسته بعد ذلك. خلط الاثنين قد يجعل مشروعا ضعيفا يبدو جيدا بسبب قرض رخيص.

- id: c07-a-06
  kind: concept
  part: A
  text: |
    هل يطرح أصل قسط القرض من الدخل الخاضع للضريبة؟ وماذا عن الفائدة؟
  solution: |
    الأصل لا يطرح، لأنه إرجاع لمال مقترض وليس مصروفا. الفائدة تطرح، لأنها تكلفة استخدام المال.

- id: c07-a-07
  kind: concept
  part: A
  text: |
    دفعت الشركة 8,000 دينار لدراسة سوق قبل أن تقرر تنفيذ المشروع. هل تضاف إلى تدفقات المشروع في السنة 0؟
  solution: |
    لا. هي تكلفة غارقة، دفعت سواء نفذ المشروع أم لا، فلا تدخل في القرار.

- id: c07-a-08
  kind: concept
  part: A
  text: |
    المشروع الجديد يستخدم أرضا تملكها الشركة، ويمكن بيعها اليوم بمبلغ 50,000 دينار. هل نضع قيمة الأرض في تدفقات المشروع؟
  solution: |
    نعم. تنفيذ المشروع يعني التنازل عن بيع الأرض، فقيمتها السوقية تكلفة فرصة بديلة في السنة 0. وإذا بقيت الأرض بعد المشروع، نضع قيمتها المتوقعة في النهاية.

- id: c07-a-09
  kind: concept
  part: A
  text: |
    مجموع الاستهلاك نفسه بالقسط الثابت والمتناقص المضاعف. لماذا تعطي الطريقة الأسرع قيمة حالية أعلى؟
  solution: |
    لأن الوفر الضريبي يأتي مبكرا. نفس المبلغ في السنة الأولى قيمته الحالية أعلى منه في السنة الخامسة.

- id: c07-a-10
  kind: concept
  part: A
  text: |
    بيعت آلة بأقل من قيمتها الدفترية. هل تدفع الشركة ضريبة على البيع؟
  solution: |
    لا. الفرق خسارة تطرح من الدخل الخاضع للضريبة، فتوفر الشركة ضريبة بمقدار النسبة مضروبة في الخسارة. صافي البيع أعلى من سعر البيع نفسه.

- id: c07-a-11
  kind: concept
  part: A
  text: |
    آلة توفر تكاليف العمالة ولا تزيد الإيراد. لماذا يكون التوفير بعد الضريبة أقل من التوفير قبلها؟
  solution: |
    لأن التكاليف الأقل ترفع الربح الخاضع للضريبة، فتدفع الشركة ضريبة أكثر. كل دينار يوفر يصبح دينارا ناقص الضريبة.

- id: c07-a-12
  kind: concept
  part: A
  text: |
    منتج جديد سيأخذ جزءا من مبيعات منتج قديم للشركة نفسها. كيف نعامل هذا في تدفقات المشروع؟
  solution: |
    نطرح الربح الضائع من المنتج القديم من تدفقات المشروع الجديد. السؤال دائما: ما الذي يتغير في تدفقات الشركة كلها إذا نفذنا المشروع؟
