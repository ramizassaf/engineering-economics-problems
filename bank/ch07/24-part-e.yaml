- id: c07-e-01
  kind: problem
  part: E
  vars: {r: 0.09, t: 0.20}
  random: {r: [0.05, 0.14, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - ra = r*(1 - t)
  text: |
    شركة رابحة تقترض بفائدة [[r|%]]. نسبة الضريبة [[t|%]]. ما التكلفة الفعلية للقرض بعد الضريبة؟
  solution: |
    كل دينار فائدة يخفض الضريبة بمقدار [[t|r]] دينار:

    $$
    r\,(1 - t) = [[r|r]] \times (1 - [[t|r]]) = [[ra|%2]]
    $$

- id: c07-e-02
  kind: problem
  part: E
  vars: {L: 50000, r: 0.08, t: 0.20}
  random: {L: [10000, 150000, 5000], r: [0.05, 0.14, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - A = L*AP(r, 3)
    - I1 = L*r
    - B1 = L + I1 - A
    - I2 = B1*r
    - B2 = B1 + I2 - A
    - I3 = B2*r
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]]، يسدد بثلاثة أقساط سنوية متساوية. نسبة الضريبة [[t|%]]. ابن جدول القرض، واحسب الوفر الضريبي من الفائدة كل سنة.
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ 3) = [[A|2]]
    $$

    | السنة | الرصيد في البداية | الفائدة | الأصل المسدد | الوفر الضريبي |
    | --- | --- | --- | --- | --- |
    | 1 | [[L|0]] | [[I1|0]] | [[A-I1|0]] | [[t*I1|0]] |
    | 2 | [[B1|0]] | [[I2|0]] | [[A-I2|0]] | [[t*I2|0]] |
    | 3 | [[B2|0]] | [[I3|0]] | [[A-I3|0]] | [[t*I3|0]] |

    الفائدة تنخفض مع الرصيد، فينخفض الوفر الضريبي كل سنة.

- id: c07-e-03
  kind: problem
  part: E
  vars: {L: 60000, r: 0.08, t: 0.20, i: 0.12}
  random: {L: [15000, 150000, 3000], r: [0.05, 0.14, 0.005], t: [0.15, 0.30, 0.01], i: [0.08, 0.16, 0.01]}
  calc:
    - p = L/3
    - I1 = L*r
    - I2 = (L - p)*r
    - I3 = (L - 2*p)*r
    - P = t*NPV(i, [0, I1, I2, I3])
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]]، يسدد أصله بثلاث دفعات متساوية، مع فائدة الرصيد كل سنة. نسبة الضريبة [[t|%]]. ما القيمة الحالية للوفر الضريبي من الفائدة بحد أدنى [[i|%]]؟
  solution: |
    الأصل المسدد [[p|g]] دينار كل سنة.

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الرصيد في البداية | [[L|0]] | [[L-p|0]] | [[L-2*p|0]] |
    | الفائدة | [[I1|0]] | [[I2|0]] | [[I3|0]] |
    | الوفر الضريبي | [[t*I1|0]] | [[t*I2|0]] | [[t*I3|0]] |

    $$
    PW = [[P|2]]
    $$

- id: c07-e-04
  kind: problem
  part: E
  vars: {R: 60000, O: 25000, D: 10000, I: 4000, A: 15000, t: 0.20}
  random: {R: [30000, 120000, 5000], O: [5000, 50000, 5000], D: [3000, 25000, 1000], I: [1000, 10000, 500], A: [5000, 30000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - A = max(A, I + 1000)
    - T = t*(R - O - D - I)
    - E = R - O - T - A
  text: |
    في السنة الأولى لمشروع ممول بقرض: الإيراد [[R|g]] دينار، والتشغيل [[O|g]] دينار، والاستهلاك [[D|g]] دينار. قسط القرض [[A|g]] دينار، منه [[I|g]] دينار فائدة. نسبة الضريبة [[t|%]]. ما تدفق مال الشركة في هذه السنة؟
  solution: |
    الضريبة تحسب بعد طرح الاستهلاك والفائدة:

    $$
    T = [[t|r]]\,([[R|g]] - [[O|g]] - [[D|g]] - [[I|g]]) = [[T|2]]
    $$

    تدفق مال الشركة يطرح القسط كاملا، الفائدة والأصل:

    $$
    E = [[R|g]] - [[O|g]] - [[T|2]] - [[A|g]] = [[E|2]]
    $$

    الاستهلاك لا يطرح هنا، لأنه ليس نقدا.

- id: c07-e-05
  kind: problem
  part: E
  vars: {L: 50000, r: 0.08, t: 0.20, i: 0.12}
  random: {L: [10000, 150000, 5000], r: [0.05, 0.12, 0.005], t: [0.15, 0.30, 0.01], i: [0.10, 0.18, 0.01]}
  calc:
    - A = L*AP(r, 3)
    - I1 = L*r
    - B1 = L + I1 - A
    - I2 = B1*r
    - B2 = B1 + I2 - A
    - I3 = B2*r
    - P = L - NPV(i, [0, A - t*I1, A - t*I2, A - t*I3])
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]]، يسدد بثلاثة أقساط سنوية متساوية. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد على مال الشركة [[i|%]]. ما القيمة الحالية لتدفقات القرض بعد الضريبة؟ هل القرض يضيف قيمة للشركة؟
  solution: |
    القسط [[A|2]] دينار. تدفق القرض بعد الضريبة كل سنة هو القسط ناقص الوفر الضريبي من الفائدة:

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | تدفق القرض | [[L|0]] | [[-(A-t*I1)|0]] | [[-(A-t*I2)|0]] | [[-(A-t*I3)|0]] |

    $$
    PW = [[P|2]]
    $$

    [[pick(P > 0, 'القيمة موجبة، فالقرض يضيف قيمة، لأن تكلفته بعد الضريبة أقل من الحد الأدنى للعائد.', 'القيمة سالبة، فالقرض يكلف الشركة أكثر من عائد مالها.')]]

- id: c07-e-06
  kind: problem
  part: E
  vars: {C: 80000, f: 0.5, r: 0.08, R: 55000, O: 20000, t: 0.20, i: 0.14}
  random: {C: [30000, 150000, 5000], f: [0.3, 0.7, 0.1], r: [0.05, 0.12, 0.005], R: [25000, 100000, 5000], O: [5000, 40000, 5000], t: [0.15, 0.30, 0.01], i: [0.10, 0.18, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - L = floor(C*f/1000)*1000
    - D = C/3
    - I = L*r
    - E = (R - O - D - I)*(1 - t) + D
    - PWe = -(C - L) + E*PA(i, 3) - L*PF(i, 3)
    - PWa = -C + ((R - O)*(1 - t) + t*D)*PA(i, 3)
  text: |
    آلة تكلف [[C|g]] دينار، وتعطي إيرادا [[R|g]] بتكاليف [[O|g]] دينار سنويا لمدة 3 سنوات، وتستهلك بالقسط الثابت. الشركة تقترض [[L|g]] دينار بفائدة [[r|%]]، تدفع الفائدة فقط كل سنة، وترد الأصل في النهاية. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد على مال الشركة [[i|%]]. قارن القيمة الحالية لمال الشركة مع القرض وبدونه.
  solution: |
    الفائدة ثابتة [[I|2]] دينار كل سنة. تدفق مال الشركة في السنوات 1 إلى 3:

    $$
    E = (R - O - D - I)(1 - t) + D = [[E|2]]
    $$

    وفي السنة 3 يرد الأصل [[L|g]] دينار أيضا.

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | مال الشركة | [[-(C-L)|0]] | [[E|0]] | [[E|0]] | [[E-L|0]] |

    $$
    PW_{equity} = [[PWe|2]]
    $$

    بدون قرض [[PWa|2]] دينار. القرض [[pick(PWe > PWa, 'رفع', 'خفض')]] القيمة بمقدار [[abs(PWe-PWa)|2]] دينار.

- id: c07-e-07
  kind: problem
  part: E
  vars: {L: 100000, r: 0.09, fee: 0.02, t: 0.20}
  random: {L: [20000, 200000, 10000], r: [0.05, 0.13, 0.005], fee: [0.01, 0.04, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - c = L*r*(1 - t)
    - net = L*(1 - fee)
    - k = IRR([-net, c, c, c, c, c + L], -0.5, 1.0)
  text: |
    بنك يقرض شركة [[L|g]] دينار لمدة 5 سنوات بفائدة [[r|%]]، تدفع الفائدة كل سنة ويرد الأصل في النهاية. يأخذ البنك رسوما [[fee|%2]] من القرض عند التوقيع. نسبة الضريبة [[t|%]]. ما التكلفة الفعلية للقرض بعد الضريبة؟ تجاهل الأثر الضريبي للرسوم.
  solution: |
    الشركة تستلم [[net|2]] دينار فقط. الفائدة بعد الضريبة [[c|2]] دينار كل سنة. التكلفة الفعلية هي المعدل الذي يساوي بين ما تستلمه وما تدفعه:

    | السنة | 0 | 1 إلى 4 | 5 |
    | --- | --- | --- | --- |
    | تدفق القرض | [[net|0]] | [[-c|0]] | [[-c-L|0]] |

    ```excel
    =IRR(B1:G1)
    ```

    التكلفة [[k|%2]]، أعلى من [[r*(1-t)|%2]] بسبب الرسوم.

- id: c07-e-08
  kind: problem
  part: E
  vars: {L: 80000, r: 0.10, n: 4, t: 0.20}
  random: {L: [20000, 200000, 4000], r: [0.05, 0.14, 0.005], n: [3, 10, 1], t: [0.15, 0.30, 0.01]}
  calc:
    - I = L*r*(n + 1)/2
    - S = t*I
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]] لمدة [[yrs(n)]]، يسدد أصله بدفعات متساوية مع فائدة الرصيد. نسبة الضريبة [[t|%]]. ما مجموع الفائدة؟ وما مجموع الوفر الضريبي منها؟
  solution: |
    الرصيد ينخفض بخطوات متساوية، فمتوسطه نصف القرض تقريبا. بالضبط:

    $$
    \sum I = L\,r\,\frac{n + 1}{2} = [[L|g]] \times [[r|r]] \times \frac{[[n+1|n]]}{2} = [[I|2]]
    $$

    $$
    t \sum I = [[S|2]]
    $$

- id: c07-e-09
  kind: problem
  part: E
  vars: {C: 100000, L: 50000, CF: 30000, r: 0.08, t: 0.20}
  random: {C: [40000, 200000, 10000], CF: [10000, 60000, 1000], r: [0.05, 0.12, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - L = C*0.5
    - CF = floor(min(max(CF, C*0.26), C*0.30)/100)*100
    - E = CF - L*r*(1 - t)
    - ra = IRR([-C, CF, CF, CF, CF, CF], -0.5, 1.0)
    - re = IRR([-(C - L), E, E, E, E, E - L], -0.5, 1.0)
  text: |
    مشروع يكلف [[C|g]] دينار، وتدفقه بعد الضريبة بدون قرض [[CF|g]] دينار سنويا لمدة 5 سنوات. الشركة تقترض نصف التكلفة بفائدة [[r|%]]، تدفع الفائدة فقط وترد الأصل في النهاية. نسبة الضريبة [[t|%]]. قارن معدل المشروع بمعدل مال الشركة.
  solution: |
    القرض [[L|g]] دينار. الفائدة بعد الضريبة:

    $$
    [[L|g]] \times [[r|r]] \times (1 - [[t|r]]) = [[L*r*(1-t)|2]]
    $$

    | السنة | 0 | 1 إلى 4 | 5 |
    | --- | --- | --- | --- |
    | المشروع | [[-C|0]] | [[CF|0]] | [[CF|0]] |
    | مال الشركة | [[-(C-L)|0]] | [[E|0]] | [[E-L|0]] |

    معدل المشروع [[ra|%2]]، ومعدل مال الشركة [[re|%2]]. [[pick(re > ra, 'القرض رفع المعدل، لأن تكلفته بعد الضريبة أقل من معدل المشروع. هذا هو أثر الرافعة المالية، والمخاطرة ترتفع معه.', 'القرض خفض المعدل، لأن تكلفته بعد الضريبة أعلى من معدل المشروع.')]]

- id: c07-e-10
  kind: problem
  part: E
  vars: {L: 40000, r: 0.09, t: 0.20}
  random: {L: [10000, 120000, 5000], r: [0.05, 0.14, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - A = L*AP(r, 4)
    - I1 = L*r
    - P1 = A - I1
    - T1 = t*I1
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]] على 4 أقساط سنوية متساوية. نسبة الضريبة [[t|%]]. في السنة الأولى، كم من القسط يطرح من الدخل الخاضع للضريبة؟ وكم يوفر من الضريبة؟
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ 4) = [[A|2]]
    $$

    الفائدة في السنة الأولى [[I1|2]] دينار، والأصل [[P1|2]] دينار. الفائدة فقط تطرح:

    $$
    [[t|r]] \times [[I1|2]] = [[T1|2]]
    $$

    ```excel
    =IPMT([[r|%]], 1, 4, -[[L|r]])
    =PPMT([[r|%]], 1, 4, -[[L|r]])
    ```
