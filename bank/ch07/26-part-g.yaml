- id: c07-g-01
  kind: problem
  part: G
  vars: {C: 120000, W: 10000, R: 90000, O: 40000, M: 15000, t: 0.20, i: 0.12}
  calc:
    - D = C/5
    - CF = (R - O)*(1 - t) + t*D
    - NS = M*(1 - t)
    - PW = -C - W + CF*PA(i, 5) + (NS + W)*PF(i, 5)
    - r = IRR([-C - W, CF, CF, CF, CF, CF + NS + W])
  text: |
    ابن في Excel جدول التدفقات لمشروع يكلف 120,000 دينار، برأس مال عامل 10,000 دينار، وإيراد 90,000 وتشغيل 40,000 دينار سنويا لمدة 5 سنوات. الاستهلاك بالقسط الثابت بدون قيمة بيع، ويباع الأصل في النهاية بمبلغ 15,000 دينار. نسبة الضريبة 20%، والحد الأدنى 12%. ضع المدخلات في خلايا مستقلة، واجعل كل سطر في الجدول صيغة.
  solution: |
    المدخلات في B1 إلى B7: الثمن، ورأس المال العامل، والإيراد، والتشغيل، والبيع، والضريبة، والحد الأدنى. السنوات في الصف 10 من C10 إلى H10، أي من 0 إلى 5. صيغ عمود السنة 1، وتنسخ إلى اليمين:

    ```excel
    D11 =$B$3
    D12 =-$B$4
    D13 =-$B$1/5
    D14 =SUM(D11:D13)
    D15 =-$B$6*D14
    D16 =D14 + D15 - D13
    ```

    السنة 0 والنهاية:

    ```excel
    C17 =-$B$1 - $B$2
    H17 =$B$5*(1 - $B$6) + $B$2
    ```

    صافي التدفق والتقييم:

    ```excel
    C18 =C16 + C17
    =C18 + NPV($B$7, D18:H18)
    =IRR(C18:H18)
    ```

    النتيجة: القيمة الحالية [[PW|2]] دينار، والمعدل [[r|%2]]. التدفق التشغيلي [[CF|g]] دينار كل سنة.

- id: c07-g-02
  kind: problem
  part: G
  vars: {C: 100000, t: 0.20}
  calc:
    - d1 = 0.4*C
    - d2 = 0.24*C
    - d3 = 0.144*C
    - d4 = 0.108*C
  text: |
    في جدول المسألة السابقة، غير الاستهلاك إلى المتناقص المضاعف مع التحول، لأصل يكلف 100,000 دينار على 5 سنوات. ما الصيغة؟ وما استهلاك كل سنة؟
  solution: |
    الدالة VDB تتحول إلى القسط الثابت وحدها عندما يصبح أكبر. للسنة في الخلية D10:

    ```excel
    =VDB(100000, 0, 5, D10 - 1, D10)
    ```

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | الاستهلاك | [[d1|g]] | [[d2|g]] | [[d3|g]] | [[d4|g]] | [[d4|g]] |

    الدالة DDB وحدها لا تتحول، فتترك قيمة دفترية في النهاية.

- id: c07-g-03
  kind: problem
  part: G
  vars: {C: 120000, W: 10000, R: 90000, O: 40000, M: 15000, t: 0.20, i: 0.12}
  calc:
    - D = C/5
    - NS = M*(1 - t)
    - P80 = -C - W + ((0.8*R - O)*(1 - t) + t*D)*PA(i, 5) + (NS + W)*PF(i, 5)
    - P90 = -C - W + ((0.9*R - O)*(1 - t) + t*D)*PA(i, 5) + (NS + W)*PF(i, 5)
    - P100 = -C - W + ((R - O)*(1 - t) + t*D)*PA(i, 5) + (NS + W)*PF(i, 5)
    - P110 = -C - W + ((1.1*R - O)*(1 - t) + t*D)*PA(i, 5) + (NS + W)*PF(i, 5)
  text: |
    اكتب في Python دالة تحسب القيمة الحالية بعد الضريبة لمشروع المسألة الأولى في هذا الجزء. ثم اطبع القيمة الحالية إذا جاء الإيراد 80% و90% و100% و110% من المتوقع.
  solution: |
    ```python
    import numpy_financial as npf

    def project_pw(C, W, R, O, M, t, i, n=5):
        D = C / n
        cf = (R - O) * (1 - t) + t * D
        flows = [-C - W] + [cf] * n
        flows[-1] += M * (1 - t) + W
        return npf.npv(i, flows)

    for k in [0.8, 0.9, 1.0, 1.1]:
        pw = project_pw(120000, 10000, 90000 * k, 40000, 15000, 0.20, 0.12)
        print(f"{k:.0%}  {pw:12,.2f}")
    ```

    | الإيراد | 80% | 90% | 100% | 110% |
    | --- | --- | --- | --- | --- |
    | القيمة الحالية | [[P80|2]] | [[P90|2]] | [[P100|2]] | [[P110|2]] |

    كل نقص 10% في الإيراد يخفض القيمة الحالية بمقدار [[P100-P90|2]] دينار.

- id: c07-g-04
  kind: problem
  part: G
  vars: {C: 120000, W: 10000, O: 40000, M: 15000, t: 0.20, i: 0.12}
  calc:
    - D = C/5
    - NS = M*(1 - t)
    - R = O + ((C + W - (NS + W)*PF(i, 5))*AP(i, 5) - t*D)/(1 - t)
  text: |
    في جدول Excel للمسألة الأولى، استخدم Goal Seek لإيجاد الإيراد السنوي الذي يجعل القيمة الحالية صفرا.
  solution: |
    ضع صيغة القيمة الحالية في خلية، مثلا B9. من Data ثم What-If Analysis ثم Goal Seek:

    - Set cell: B9
    - To value: 0
    - By changing cell: B3

    الإيراد [[R|2]] دينار. للتحقق باليد:

    $$
    R = O + \frac{(C + W - (NS + W)(P/F))\,(A/P) - t\,D}{1 - t} = [[R|2]]
    $$

    في Google Sheets لا يوجد Goal Seek مدمج، لكن الصيغة أعلاه تعطي نفس الرقم.

- id: c07-g-05
  kind: problem
  part: G
  vars: {C: 100000, t: 0.20, i: 0.10}
  calc:
    - Psl = t*C/5*PA(i, 5)
    - Pdd = t*C*NPV(i, [0, 0.4, 0.24, 0.144, 0.108, 0.108])
    - Psy = t*C*NPV(i, [0, 5/15, 4/15, 3/15, 2/15, 1/15])
  text: |
    اكتب في Python برنامجا يحسب القيمة الحالية للوفر الضريبي لأصل يكلف 100,000 دينار على 5 سنوات، بالقسط الثابت والمتناقص المضاعف مع التحول ومجموع أرقام السنوات. نسبة الضريبة 20%، والحد الأدنى 10%.
  solution: |
    ```python
    import numpy_financial as npf

    C, t, i, n = 100000, 0.20, 0.10, 5
    methods = {
        "SL":  [C / n] * n,
        "DDB": [0.4 * C, 0.24 * C, 0.144 * C, 0.108 * C, 0.108 * C],
        "SYD": [C * k / 15 for k in [5, 4, 3, 2, 1]],
    }
    for name, dep in methods.items():
        pw = npf.npv(i, [0] + [t * d for d in dep])
        print(f"{name:4} {pw:10,.2f}")
    ```

    | الطريقة | القيمة الحالية للوفر |
    | --- | --- |
    | القسط الثابت | [[Psl|2]] |
    | المتناقص المضاعف | [[Pdd|2]] |
    | مجموع أرقام السنوات | [[Psy|2]] |

- id: c07-g-06
  kind: problem
  part: G
  vars: {L: 60000, r: 0.08, t: 0.20}
  calc:
    - A = L*AP(r, 4)
    - I1 = L*r
    - B1 = L + I1 - A
    - I2 = B1*r
    - B2 = B1 + I2 - A
    - I3 = B2*r
    - B3 = B2 + I3 - A
    - I4 = B3*r
  text: |
    ابن في Excel جدول قرض 60,000 دينار بفائدة 8% على 4 أقساط سنوية متساوية، مع عمود للوفر الضريبي من الفائدة بنسبة 20%. استخدم IPMT وPPMT.
  solution: |
    السنة في A2 إلى A5. الصيغ للصف 2، وتنسخ للأسفل:

    ```excel
    B2 =PMT(8%, 4, -60000)
    C2 =IPMT(8%, A2, 4, -60000)
    D2 =PPMT(8%, A2, 4, -60000)
    E2 =20%*C2
    F2 =B2 - E2
    ```

    | السنة | القسط | الفائدة | الأصل | الوفر | القسط بعد الضريبة |
    | --- | --- | --- | --- | --- | --- |
    | 1 | [[A|2]] | [[I1|2]] | [[A-I1|2]] | [[t*I1|2]] | [[A-t*I1|2]] |
    | 2 | [[A|2]] | [[I2|2]] | [[A-I2|2]] | [[t*I2|2]] | [[A-t*I2|2]] |
    | 3 | [[A|2]] | [[I3|2]] | [[A-I3|2]] | [[t*I3|2]] | [[A-t*I3|2]] |
    | 4 | [[A|2]] | [[I4|2]] | [[A-I4|2]] | [[t*I4|2]] | [[A-t*I4|2]] |

    الدالتان تعملان بنفس الاسم في Google Sheets.

- id: c07-g-07
  kind: problem
  part: G
  vars: {w: 0.15}
  calc:
    - W1 = 0.15*50000
    - W2 = 0.15*65000
    - W3 = 0.15*80000
    - W4 = 0.15*70000
  text: |
    اكتب في Python دالة تأخذ قائمة المبيعات السنوية ونسبة رأس المال العامل، وتعيد تدفقات رأس المال العامل من السنة 0 إلى النهاية. جربها على مبيعات 50,000 و65,000 و80,000 و70,000 دينار، ونسبة 15%.
  solution: |
    ```python
    def wc_flows(sales, w):
        need = [w * s for s in sales] + [0]
        flows, prev = [], 0
        for k in need:
            flows.append(-(k - prev))
            prev = k
        return flows

    print(wc_flows([50000, 65000, 80000, 70000], 0.15))
    ```

    | السنة | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | التدفق | [[-W1|g]] | [[-(W2-W1)|g]] | [[-(W3-W2)|g]] | [[W3-W4|g]] | [[W4|g]] |

    الرصيد المطلوب للسنة يدفع في بدايتها. في السنة الأخيرة يعود كل الرصيد، فنضيف صفرا في آخر القائمة.

- id: c07-g-08
  kind: problem
  part: G
  vars: {C: 80000, R: 30000, t: 0.20}
  calc:
    - rb = RATE(5, R, C)
    - CF = R*(1 - t) + t*C/5
    - ra = RATE(5, CF, C)
  text: |
    اكتب في Python برنامجا يحسب المعدل قبل الضريبة وبعدها لاستثمار يكلف 80,000 دينار ويعطي 30,000 دينار سنويا قبل الضريبة لمدة 5 سنوات، بالقسط الثابت ونسبة ضريبة 20%. قارن المعدل بعد الضريبة بالتقريب الذي يضرب المعدل قبلها في واحد ناقص النسبة.
  solution: |
    ```python
    import numpy_financial as npf

    C, R, t, n = 80000, 30000, 0.20, 5
    before = npf.irr([-C] + [R] * n)
    cf = R * (1 - t) + t * C / n
    after = npf.irr([-C] + [cf] * n)
    print(f"{before:.2%}  {after:.2%}  {before * (1 - t):.2%}")
    ```

    المعدل قبل الضريبة [[rb|%2]]، وبعدها [[ra|%2]]، والتقريب [[rb*(1-t)|%2]].
