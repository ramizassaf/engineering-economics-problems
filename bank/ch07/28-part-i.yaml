items:

- id: c07-i-01
  kind: case
  part: I
  calc:
    - B = 90000 + 6000
    - D = B/5
    - CF = (75000 - 32000)*(1 - 0.15) + 0.15*D
    - NS = 10000*(1 - 0.15)
    - L = CF + NS + 8000
    - PW = -B - 8000 + CF*PA(0.11, 5) + (NS + 8000)*PF(0.11, 5)
    - r = IRR([-B - 8000, CF, CF, CF, CF, L])
    - CF2 = (75000*0.85 - 32000)*(1 - 0.15) + 0.15*D
    - PW2 = -B - 8000 + CF2*PA(0.11, 5) + (NS + 8000)*PF(0.11, 5)
    - Rb = 32000 + ((B + 8000 - (NS + 8000)*PF(0.11, 5))*AP(0.11, 5) - 0.15*D)/(1 - 0.15)
  text: |
    **حالة 7.1: خط خبز آلي في نابلس**

    مخبز يدرس إضافة خط آلي للخبز المغلف. البيانات:

    | البند | القيمة |
    | --- | --- |
    | ثمن الفرن والخط | 90,000 |
    | التركيب والتشغيل التجريبي | 6,000 |
    | مخزون الطحين والأكياس | 8,000 |
    | المبيعات السنوية | 75,000 |
    | الطحين والأجور والطاقة | 32,000 |
    | العمر | 5 سنوات |
    | البيع المتوقع في النهاية | 10,000 |
    | نسبة الضريبة | 15% |
    | الحد الأدنى للعائد بعد الضريبة | 11% |

    الاستهلاك بالقسط الثابت على 5 سنوات بدون قيمة بيع ضريبية.

    (أ) احسب أساس الاستهلاك والتدفق التشغيلي السنوي. (ب) ابن جدول صافي التدفقات. (ج) احسب القيمة الحالية والمعدل، وقرر. (د) ماذا لو جاءت المبيعات أقل بنسبة 15%؟ (هـ) ما أقل مبيعات سنوية تجعل الخط مقبولا؟
  solution: |
    (أ) التركيب جزء من الأصل:

    $$
    I = 90{,}000 + 6{,}000 = [[B|g]], \qquad D = [[D|g]]
    $$

    $$
    CF = (75{,}000 - 32{,}000)(1 - 0.15) + 0.15 \times [[D|g]] = [[CF|g]]
    $$

    (ب) صافي البيع في النهاية [[NS|g]] دينار، ويعود المخزون 8,000 دينار.

    | السنة | 0 | 1 إلى 4 | 5 |
    | --- | --- | --- | --- |
    | صافي التدفق | [[-B-8000|g]] | [[CF|g]] | [[L|g]] |

    (ج)

    $$
    PW = [[PW|2]]
    $$

    المعدل [[r|%2]]، أعلى من 11%. الخط مقبول.

    (د) المبيعات [[75000*0.85|g]] دينار، والتدفق التشغيلي [[CF2|2]] دينار:

    $$
    PW = [[PW2|2]]
    $$

    [[pick(PW2 >= 0, 'الخط يبقى مقبولا.', 'الخط يصبح مرفوضا. القرار حساس للمبيعات، فيستحق دراسة السوق قبل الشراء.')]]

    (هـ) القيمة الحالية صفر عند مبيعات [[Rb|2]] دينار، أي أقل من المتوقع بنسبة [[1-Rb/75000|%]].

- id: c07-i-02
  kind: case
  part: I
  calc:
    - NS = 9000 - 0.2*(9000 - 12000)
    - Ao = NS*AP(0.10, 5) + 28000*(1 - 0.2) - 0.2*12000/5
    - An = 60000*AP(0.10, 5) + 14000*(1 - 0.2) - 0.2*60000/5
    - Cmax = (Ao - 14000*(1 - 0.2))/(AP(0.10, 5) - 0.2/5)
    - Ao0 = 9000*AP(0.10, 5) + 28000
    - An0 = 60000*AP(0.10, 5) + 14000
  text: |
    **حالة 7.2: استبدال آلة حقن في مصنع بلاستيك**

    آلة حقن قديمة قيمتها الدفترية 12,000 دينار، وتباع اليوم بمبلغ 9,000 دينار فقط. تكاليف تشغيلها وصيانتها والتالف منها 28,000 دينار سنويا. آلة جديدة تكلف 60,000 دينار، وتكاليفها 14,000 دينار سنويا. كلتاهما تخدم 5 سنوات أخرى، وتستهلك بالقسط الثابت إلى الصفر على هذه المدة، بدون قيمة بيع في النهاية. نسبة الضريبة 20%، والحد الأدنى 10%.

    (أ) ما صافي بيع القديمة اليوم؟ لماذا هو أكبر من 9,000؟ (ب) قارن التكلفة السنوية بعد الضريبة. (ج) قارن بدون ضريبة. (د) ما أعلى ثمن للجديدة يجعل الاستبدال مجديا؟
  solution: |
    (أ) البيع تحت القيمة الدفترية، فالخسارة توفر ضريبة:

    $$
    9{,}000 + 0.2 \times (12{,}000 - 9{,}000) = [[NS|g]]
    $$

    (ب)

    $$
    AW_{old} = [[NS|g]]\,(A/P,\ 10\%,\ 5) + 28{,}000 \times 0.8 - 0.2 \times 2{,}400 = [[Ao|2]]
    $$

    $$
    AW_{new} = 60{,}000\,(A/P,\ 10\%,\ 5) + 14{,}000 \times 0.8 - 0.2 \times 12{,}000 = [[An|2]]
    $$

    [[pick(An < Ao, 'الجديدة أرخص بمقدار', 'القديمة أرخص بمقدار')]] [[abs(Ao-An)|2]] دينار سنويا.

    (ج) بدون ضريبة نستخدم سعر البيع 9,000 دينار نفسه: القديمة [[Ao0|2]] والجديدة [[An0|2]] دينار. الأرخص قبل الضريبة [[pick(An0 < Ao0, 'الجديدة', 'القديمة')]]، وبعدها [[pick(An < Ao, 'الجديدة', 'القديمة')]]. [[pick((An0 < Ao0) == (An < Ao), 'القرار نفسه، لكن الفرق تغير.', 'الضريبة قلبت القرار. توفير التشغيل 14,000 دينار يصبح 11,200 دينار بعد الضريبة، والوفر الأكبر من استهلاك الجديدة لا يعوض هذا النقص كله.')]]

    (د) نساوي التكلفتين ونحل لثمن الجديدة C:

    $$
    C\left((A/P) - \frac{0.2}{5}\right) + 11{,}200 = [[Ao|2]]
    $$

    $$
    C = [[Cmax|2]]
    $$

- id: c07-i-03
  kind: case
  part: I
  calc:
    - D = 45000/8
    - c1 = 11000*(1 - 0.2) + 0.2*D
    - c2 = 11000*1.04*(1 - 0.2) + 0.2*D
    - c3 = 11000*1.04**2*(1 - 0.2) + 0.2*D
    - c4 = 11000*1.04**3*(1 - 0.2) + 0.2*D
    - c5 = 11000*1.04**4*(1 - 0.2) + 0.2*D
    - c6 = 11000*1.04**5*(1 - 0.2) + 0.2*D
    - c7 = 11000*1.04**6*(1 - 0.2) + 0.2*D
    - c8 = 11000*1.04**7*(1 - 0.2) + 0.2*D
    - PW = NPV(0.10, [-45000, c1, c2, c3, c4, c5, c6, c7, c8])
    - r = IRR([-45000, c1, c2, c3, c4, c5, c6, c7, c8])
    - A = 30000*AP(0.06, 4)
    - I1 = 30000*0.06
    - B1 = 30000 + I1 - A
    - I2 = B1*0.06
    - B2 = B1 + I2 - A
    - I3 = B2*0.06
    - B3 = B2 + I3 - A
    - I4 = B3*0.06
    - e1 = c1 - A + 0.2*I1
    - e2 = c2 - A + 0.2*I2
    - e3 = c3 - A + 0.2*I3
    - e4 = c4 - A + 0.2*I4
    - PWe = NPV(0.10, [-15000, e1, e2, e3, e4, c5, c6, c7, c8])
  text: |
    **حالة 7.3: طاقة شمسية لمستودع تبريد**

    شركة توزيع خضار تدرس تركيب نظام طاقة شمسية على سطح مستودع التبريد. النظام يكلف 45,000 دينار، ويوفر 11,000 دينار من الكهرباء في السنة الأولى. تعرفة الكهرباء ترتفع 4% سنويا، فيرتفع التوفير معها. عمر النظام 8 سنوات، ويستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة 20%، والحد الأدنى للعائد بعد الضريبة 10%.

    بنك يعرض تمويل 30,000 دينار من الثمن بفائدة 6%، على 4 أقساط سنوية متساوية.

    (أ) احسب تدفقات المشروع بدون قرض، والقيمة الحالية والمعدل. (ب) ابن جدول القرض. (ج) احسب تدفقات مال الشركة مع القرض، وقيمتها الحالية بحد أدنى 10%. (د) هل تأخذ الشركة القرض؟
  solution: |
    (أ) الاستهلاك [[D|g]] دينار، والوفر الضريبي منه [[0.2*D|g]] دينار كل سنة.

    | السنة | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
    | --- | --- | --- | --- | --- | --- | --- | --- | --- |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] | [[c4|0]] | [[c5|0]] | [[c6|0]] | [[c7|0]] | [[c8|0]] |

    ```excel
    =-45000 + NPV(10%, B2:I2)
    =IRR(A2:I2)
    ```

    $$
    PW = [[PW|2]]
    $$

    المعدل [[r|%2]]. المشروع مقبول بدون قرض.

    (ب) القسط [[A|2]] دينار.

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الفائدة | [[I1|2]] | [[I2|2]] | [[I3|2]] | [[I4|2]] |
    | الوفر الضريبي | [[0.2*I1|2]] | [[0.2*I2|2]] | [[0.2*I3|2]] | [[0.2*I4|2]] |

    (ج) في السنة 0 تدفع الشركة 15,000 دينار فقط. في السنوات 1 إلى 4 نطرح القسط ونضيف الوفر من الفائدة. بعدها التدفق كما هو.

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 إلى 8 |
    | --- | --- | --- | --- | --- | --- | --- |
    | مال الشركة | -15,000 | [[e1|0]] | [[e2|0]] | [[e3|0]] | [[e4|0]] | كما في (أ) |

    $$
    PW_{equity} = [[PWe|2]]
    $$

    (د) القرض يرفع القيمة الحالية بمقدار [[PWe-PW|2]] دينار، لأن تكلفته بعد الضريبة [[0.06*0.8|%2]]، أقل من 10%. تأخذه الشركة، بشرط أن تتحمل الأقساط في السنوات الأولى، حين يكون التدفق بعد القسط صغيرا.
