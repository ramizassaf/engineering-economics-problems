items:

- id: c07-h-01
  kind: mcq
  part: H
  vars: {R: 80000, O: 30000, D: 10000, t: 0.20}
  random: {R: [40000, 150000, 5000], O: [10000, 50000, 5000], D: [3000, 25000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - CF = (R - O)*(1 - t) + t*D
    - w1 = (R - O - D)*(1 - t)
    - w2 = (R - O)*(1 - t)
    - w3 = (R - O - D)*(1 - t) - D
  text: |
    إيراد [[R|g]] دينار، وتشغيل [[O|g]] دينار، واستهلاك [[D|g]] دينار، ونسبة ضريبة [[t|%]]. ما التدفق النقدي التشغيلي؟
  options: ["[[w1|2]]", "[[w2|2]]", "[[CF|2]]", "[[w3|2]]"]
  correct: 2
  solution: |
    $$
    CF = ([[R|g]] - [[O|g]])(1 - [[t|r]]) + [[t|r]] \times [[D|g]] = [[CF|2]]
    $$

    الخيار (أ) صافي الربح، نسي إضافة الاستهلاك. الخيار (ب) نسي الوفر الضريبي. الخيار (د) طرح الاستهلاك مرتين.

- id: c07-h-02
  kind: mcq
  part: H
  vars: {M: 20000, B: 8000, t: 0.20}
  random: {M: [8000, 40000, 1000], B: [1000, 15000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - B = min(B, M - 2000)
    - NS = M - t*(M - B)
    - w1 = M*(1 - t)
    - w2 = M
    - w3 = M + t*(M - B)
  text: |
    آلة قيمتها الدفترية [[B|g]] دينار بيعت بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي البيع؟
  options: ["[[w1|2]]", "[[NS|2]]", "[[w2|2]]", "[[w3|2]]"]
  correct: 1
  solution: |
    الضريبة على الربح فقط، أي الفرق عن القيمة الدفترية:

    $$
    [[M|g]] - [[t|r]]\,([[M|g]] - [[B|g]]) = [[NS|2]]
    $$

    الخيار (أ) وضع الضريبة على كل السعر. الخيار (د) أضاف الضريبة بدل أن يطرحها.

- id: c07-h-03
  kind: mcq
  part: H
  text: |
    مشروع يحتاج رأس مال عامل 20,000 دينار يسترد كاملا في النهاية. أين يظهر في الجدول؟
  options: ["مصروف في السنة 0 يطرح من الدخل", "تدفق خارج في السنة 0 وداخل في النهاية، بدون ضريبة", "يستهلك على عمر المشروع", "لا يظهر لأنه يسترد"]
  correct: 1
  solution: |
    رأس المال العامل ليس مصروفا ولا يستهلك. يحبس في السنة 0 ويعود في النهاية. تجاهله خطأ، لأن توقيته يكلف المشروع.

- id: c07-h-04
  kind: mcq
  part: H
  text: |
    عند تقييم مشروع ممول جزئيا بقرض، ما الطريقة الصحيحة لتقييم المشروع نفسه؟
  options: ["نطرح الفائدة من التدفقات ونخصمها بالحد الأدنى", "نطرح القسط كاملا من التدفقات", "نتجاهل القرض، ونخصم تدفقات المشروع الكاملة", "نضيف القرض إلى تدفق السنة 0"]
  correct: 2
  solution: |
    المشروع يقيم أولا كأن الشركة تدفع كل شيء من مالها. أثر التمويل يدرس بعد ذلك وحده.

- id: c07-h-05
  kind: mcq
  part: H
  vars: {r: 0.10, t: 0.25}
  random: {r: [0.05, 0.14, 0.01], t: [0.15, 0.30, 0.01]}
  calc:
    - k = r*(1 - t)
    - w1 = r
    - w2 = r*(1 + t)
    - w3 = r - t
  text: |
    قرض بفائدة [[r|%]]، ونسبة الضريبة [[t|%]]. ما تكلفة القرض بعد الضريبة؟
  options: ["[[w1|%2]]", "[[k|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    [[r|r]] \times (1 - [[t|r]]) = [[k|%2]]
    $$

    الخيار (د) طرح النسبتين من بعض، وهذا خطأ في الوحدات.

- id: c07-h-06
  kind: mcq
  part: H
  text: |
    شركة تقيم مشروعا بتدفقات بعد الضريبة. حدها الأدنى قبل الضريبة 15%، وبعدها 12%. أي نسبة تستخدم؟
  options: ["15% لأنها الأعلى والأحوط", "12%", "متوسط النسبتين", "لا فرق في القرار"]
  correct: 1
  solution: |
    التدفقات بعد الضريبة تخصم بحد أدنى بعد الضريبة. استخدام 15% يرفض مشاريع جيدة.

- id: c07-h-07
  kind: mcq
  part: H
  text: |
    غيرت شركة طريقة الاستهلاك من القسط الثابت إلى المتناقص المضاعف. ماذا يحدث للقيمة الحالية بعد الضريبة؟
  options: ["تنخفض لأن الاستهلاك يرتفع في البداية", "لا تتغير لأن مجموع الاستهلاك واحد", "ترتفع لأن الوفر الضريبي يأتي مبكرا", "تعتمد على الإيراد فقط"]
  correct: 2
  solution: |
    الاستهلاك نفسه ليس نقدا. ما يتغير هو توقيت الوفر الضريبي، والوفر المبكر قيمته الحالية أعلى.

- id: c07-h-08
  kind: mcq
  part: H
  vars: {Sv: 10000, t: 0.20}
  random: {Sv: [2000, 30000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - a = Sv*(1 - t)
    - w1 = Sv
    - w2 = Sv*t
    - w3 = Sv*(1 + t)
  text: |
    آلة توفر [[Sv|g]] دينار سنويا من تكاليف التشغيل، ونسبة الضريبة [[t|%]]. ما التوفير بعد الضريبة، بدون حساب الاستهلاك؟
  options: ["[[w1|g]]", "[[w2|g]]", "[[a|g]]", "[[w3|g]]"]
  correct: 2
  solution: |
    التوفير يرفع الربح، فترتفع الضريبة. يبقى [[a|g]] دينار.

    الخيار (ب) هو الضريبة الإضافية نفسها، وليس التوفير.

- id: c07-h-09
  kind: mcq
  part: H
  text: |
    أي البنود التالية لا يدخل في تدفقات مشروع جديد؟
  options: ["الإيجار الضائع لمستودع تملكه الشركة", "دراسة سوق دفعت قبل القرار", "الربح الضائع من منتج قديم يتأثر بالمشروع", "رأس المال العامل الإضافي"]
  correct: 1
  solution: |
    الدراسة غارقة. البنود الأخرى تتغير بقرار تنفيذ المشروع، فتدخل.

- id: c07-h-10
  kind: mcq
  part: H
  vars: {C: 50000, n: 5, k: 3, M: 25000, t: 0.20, u: 0}
  random: {C: [20000, 100000, 5000], n: [5, 10, 1], k: [2, 4, 1], u: [0.5, 1.1, 0.1], t: [0.15, 0.30, 0.01]}
  calc:
    - B = C - k*C/n
    - M = pick(u > 0, floor(B*u/100)*100 + 700, M)
    - NS = M - t*(M - B)
    - w1 = M - t*M
    - w2 = M + t*(M - B)
    - w3 = B
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بدون قيمة بيع. بيعت بعد [[yrs(k)]] بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي البيع؟
  options: ["[[w1|2]]", "[[w2|2]]", "[[w3|2]]", "[[NS|2]]"]
  correct: 3
  solution: |
    القيمة الدفترية بعد [[yrs(k)]]:

    $$
    BV = [[C|g]] - [[k|n]] \times [[C/n|2]] = [[B|2]]
    $$

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[t|r]]\,([[M|g]] - [[B|2]]) = [[NS|2]]
    $$

    الخيار (أ) افترض أن القيمة الدفترية صفر. الخيار (ب) عكس إشارة الضريبة. الخيار (ج) هو القيمة الدفترية نفسها.
