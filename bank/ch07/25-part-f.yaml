items:

- id: c07-f-01
  kind: problem
  part: F
  vars: {C: 30000, Sv: 9000, n: 5, t: 0.20, i: 0.10}
  random: {C: [10000, 100000, 1000], Sv: [2000, 30000, 500], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - D = C/n
    - CF = Sv*(1 - t) + t*D
    - PW = -C + CF*PA(i, n)
  text: |
    نظام آلي لتعبئة الأكياس يكلف [[C|g]] دينار، ويوفر [[Sv|g]] دينار سنويا من الأجور، لمدة [[yrs(n)]]. يستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. هل يستحق الشراء؟
  solution: |
    $$
    CF = [[Sv|g]]\,(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    الشراء [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c07-f-02
  kind: problem
  part: F
  vars: {C: 30000, Sv: 8000, M: 5000, n: 5, t: 0.20, i: 0.10}
  random: {C: [10000, 100000, 1000], Sv: [2000, 30000, 500], M: [1000, 15000, 500], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - D = C/n
    - CF = Sv*(1 - t) + t*D
    - NS = M*(1 - t)
    - PW = -C + CF*PA(i, n) + NS*PF(i, n)
  text: |
    آلة تكلف [[C|g]] دينار، وتوفر [[Sv|g]] دينار سنويا لمدة [[yrs(n)]]. تستهلك بالقسط الثابت بدون قيمة بيع، لكنها تباع في النهاية بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية.
  solution: |
    $$
    CF = [[CF|2]], \qquad \mathrm{net\ salvage} = [[M|g]]\,(1 - [[t|r]]) = [[NS|2]]
    $$

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[NS|2]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

- id: c07-f-03
  kind: problem
  part: F
  vars: {C: 40000, n: 6, t: 0.20, i: 0.12}
  random: {C: [10000, 120000, 1000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - D = C/n
    - Sv = (C*AP(i, n) - t*D)/(1 - t)
  text: |
    معدات تكلف [[C|g]] دينار، وعمرها [[yrs(n)]]، وتستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما أقل توفير سنوي يبرر شراءها؟
  solution: |
    القيمة الحالية صفر عندما:

    $$
    Sv\,(1 - t) + t\,D = C\,(A/P,\ i,\ n)
    $$

    $$
    Sv = \frac{[[C*AP(i, n)|2]] - [[t*D|2]]}{1 - [[t|r]]} = [[Sv|2]]
    $$

- id: c07-f-04
  kind: problem
  part: F
  vars: {C: 25000, O: 6000, n: 5, t: 0.20, i: 0.10}
  random: {C: [10000, 80000, 1000], O: [2000, 20000, 500], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - D = C/n
    - AW = C*AP(i, n) + O*(1 - t) - t*D
    - AW0 = C*AP(i, n) + O
  text: |
    مضخة تكلف [[C|g]] دينار، وتشغيلها [[O|g]] دينار سنويا، وعمرها [[yrs(n)]]. تستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما التكلفة السنوية بعد الضريبة؟ وما هي قبل الضريبة؟
  solution: |
    $$
    AW_{after} = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[O|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[D|2]] = [[AW|2]]
    $$

    $$
    AW_{before} = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[O|g]] = [[AW0|2]]
    $$

    الضريبة تخفض التكلفة الحقيقية بمقدار [[AW0-AW|2]] دينار سنويا، لأن الشركة الرابحة تطرح التشغيل والاستهلاك من دخلها.

- id: c07-f-05
  kind: problem
  part: F
  vars: {Ca: 20000, Oa: 9000, Ma: 2000, Cb: 32000, Ob: 5500, Mb: 5000, t: 0.20, i: 0.10}
  random: {Ca: [10000, 40000, 1000], Oa: [5000, 15000, 500], Ma: [0, 5000, 500], Cb: [20000, 60000, 1000], Ob: [2000, 9000, 500], Mb: [0, 8000, 500], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Aa = Ca*AP(i, 5) + Oa*(1 - t) - t*Ca/5 - Ma*(1 - t)*AF(i, 5)
    - Ab = Cb*AP(i, 5) + Ob*(1 - t) - t*Cb/5 - Mb*(1 - t)*AF(i, 5)
  text: |
    بديلان لنفس العمل، عمر كل منهما 5 سنوات، ويستهلك بالقسط الثابت بدون قيمة بيع ضريبية.

    | | أ | ب |
    | --- | --- | --- |
    | الثمن | [[Ca|g]] | [[Cb|g]] |
    | التشغيل السنوي | [[Oa|g]] | [[Ob|g]] |
    | البيع في النهاية | [[Ma|g]] | [[Mb|g]] |

    نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. أيهما أرخص بعد الضريبة؟
  solution: |
    لكل بديل: استرداد الثمن، والتشغيل بعد الضريبة، ناقص الوفر من الاستهلاك، ناقص صافي البيع موزعا على السنوات.

    $$
    AW = C\,(A/P) + O\,(1 - t) - t\,\frac{C}{5} - M\,(1 - t)\,(A/F)
    $$

    $$
    AW_a = [[Aa|2]], \qquad AW_b = [[Ab|2]]
    $$

    الأرخص: [[pick(Aa <= Ab, 'أ', 'ب')]].

- id: c07-f-06
  kind: problem
  part: F
  vars: {Ca: 18000, Oa: 7000, na: 3, Cb: 40000, Ob: 4000, nb: 6, t: 0.20, i: 0.10}
  random: {Ca: [10000, 30000, 1000], Oa: [4000, 12000, 500], Cb: [25000, 60000, 1000], Ob: [1500, 8000, 500], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Aa = Ca*AP(i, 3) + Oa*(1 - t) - t*Ca/3
    - Ab = Cb*AP(i, 6) + Ob*(1 - t) - t*Cb/6
  text: |
    آلة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار، وعمرها 3 سنوات. آلة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار، وعمرها 6 سنوات. كلتاهما تستهلك بالقسط الثابت على عمرها بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. أيهما أرخص؟
  solution: |
    القيمة السنوية تقارن الأعمار المختلفة مباشرة:

    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 3) + [[Oa|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[Ca/3|2]] = [[Aa|2]]
    $$

    $$
    AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 6) + [[Ob|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[Cb/6|2]] = [[Ab|2]]
    $$

    الأرخص: الآلة [[pick(Aa <= Ab, 'أ', 'ب')]].

- id: c07-f-07
  kind: problem
  part: F
  vars: {C: 50000, n: 5, Ls: 13000, t: 0.20, i: 0.10}
  random: {C: [20000, 120000, 5000], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01], Ls: [3000, 40000, 500]}
  calc:
    - Ls = floor(C*AP(i, n)*1.02/100)*100
    - Ab = C*AP(i, n) - t*C/n
    - Al = Ls*(1 - t)
  text: |
    شركة تحتاج رافعة شوكية لمدة [[yrs(n)]]. يمكنها شراؤها بمبلغ [[C|g]] دينار، تستهلك بالقسط الثابت بدون قيمة بيع. أو استئجارها بمبلغ [[Ls|g]] دينار سنويا، يدفع في نهاية كل سنة ويطرح من الدخل. الصيانة على الشركة في الحالتين. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. أيهما أرخص؟
  solution: |
    الشراء:

    $$
    AW_{buy} = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) - [[t|r]] \times [[C/n|2]] = [[Ab|2]]
    $$

    الاستئجار:

    $$
    AW_{lease} = [[Ls|g]]\,(1 - [[t|r]]) = [[Al|2]]
    $$

    الأرخص: [[pick(Ab <= Al, 'الشراء', 'الاستئجار')]].

- id: c07-f-08
  kind: problem
  part: F
  vars: {M: 12000, B: 8000, Oo: 15000, C: 40000, Onw: 6000, n: 4, t: 0.20, i: 0.10}
  random: {M: [3000, 20000, 1000], B: [2000, 20000, 1000], Oo: [8000, 25000, 500], C: [20000, 70000, 1000], Onw: [2000, 10000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - NS = M - t*(M - B)
    - Ao = NS*AP(i, n) + Oo*(1 - t) - t*B/n
    - An = C*AP(i, n) + Onw*(1 - t) - t*C/n
  text: |
    آلة قديمة قيمتها الدفترية [[B|g]] دينار، ويمكن بيعها اليوم بمبلغ [[M|g]] دينار. تشغيلها [[Oo|g]] دينار سنويا. آلة جديدة تكلف [[C|g]] دينار، وتشغيلها [[Onw|g]] دينار. كلتاهما تخدم [[yrs(n)]] أخرى، وتستهلك بالقسط الثابت إلى الصفر على هذه المدة، بدون قيمة بيع في النهاية. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. هل تستبدل الشركة القديمة؟
  solution: |
    الاحتفاظ بالقديمة يعني التنازل عن صافي بيعها اليوم، وهو استثمارها الحقيقي:

    $$
    [[M|g]] - [[t|r]]\,([[M|g]] - [[B|g]]) = [[NS|2]]
    $$

    $$
    AW_{old} = [[NS|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Oo|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[B/n|2]] = [[Ao|2]]
    $$

    $$
    AW_{new} = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[Onw|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[C/n|2]] = [[An|2]]
    $$

    [[pick(An < Ao, 'الجديدة أرخص، فتستبدل.', 'القديمة أرخص، فتحتفظ بها.')]]

- id: c07-f-09
  kind: problem
  part: F
  vars: {Ca: 20000, Oa: 8000, Cb: 36000, Ob: 4000, t: 0.25, i: 0.10}
  random: {Ca: [10000, 30000, 1000], Oa: [5000, 12000, 500], Cb: [25000, 50000, 1000], Ob: [1500, 7000, 500], t: [0.15, 0.35, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - a0 = Ca*AP(i, 5) + Oa
    - b0 = Cb*AP(i, 5) + Ob
    - a1 = Ca*AP(i, 5) + Oa*(1 - t) - t*Ca/5
    - b1 = Cb*AP(i, 5) + Ob*(1 - t) - t*Cb/5
  text: |
    آلة أ تكلف [[Ca|g]] دينار وتشغيلها [[Oa|g]] دينار سنويا. آلة ب تكلف [[Cb|g]] دينار وتشغيلها [[Ob|g]] دينار. عمر كل منهما 5 سنوات بالقسط الثابت بدون قيمة بيع. الحد الأدنى [[i|%]]. قارن التكلفة السنوية بدون ضريبة، ثم بنسبة ضريبة [[t|%]]. هل تغير الضريبة الاختيار؟
  solution: |
    | | بدون ضريبة | بعد الضريبة |
    | --- | --- | --- |
    | أ | [[a0|2]] | [[a1|2]] |
    | ب | [[b0|2]] | [[b1|2]] |

    بدون ضريبة الأرخص [[pick(a0 <= b0, 'أ', 'ب')]]، وبعدها [[pick(a1 <= b1, 'أ', 'ب')]]. الضريبة تخفض وزن التشغيل بنسبة [[t|%]]، وتعيد جزءا من الثمن على شكل وفر. لذلك [[pick((a0 <= b0) == (a1 <= b1), 'بقي الاختيار نفسه هنا، لكن الفرق بين البديلين تغير.', 'تغير الاختيار هنا. الضريبة ليست مجرد نسبة تطرح من الجميع.')]]

- id: c07-f-10
  kind: problem
  part: F
  vars: {C: 24000, Sv: 6000, n: 8, t: 0.20, r0: 0}
  random: {C: [5000, 80000, 1000], n: [5, 12, 1], t: [0.15, 0.30, 0.01], r0: [0.05, 0.25, 0.01]}
  calc:
    - D = C/n
    - q = max(r0, 0.01)
    - Sv = pick(r0 > 0, ceil((C*AP(q, n) - t*D)/(1 - t)/100)*100, Sv)
    - CF = Sv*(1 - t) + t*D
    - r = RATE(n, CF, C)
  text: |
    مصنع يستبدل الإنارة القديمة بإنارة موفرة تكلف [[C|g]] دينار. الإنارة الجديدة توفر [[Sv|g]] دينار سنويا من الكهرباء والصيانة لمدة [[yrs(n)]]. تستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]. ما المعدل بعد الضريبة؟
  solution: |
    $$
    CF = [[Sv|g]]\,(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

    ```excel
    =RATE([[n|n]], [[CF|2]], -[[C|r]])
    ```

    المعدل بعد الضريبة [[r|%2]].

- id: c07-f-11
  kind: problem
  part: F
  vars: {C: 24000, Sv: 6000, n: 8, t: 0.20}
  random: {C: [5000, 80000, 1000], Sv: [1500, 25000, 500], n: [3, 12, 1], t: [0.15, 0.30, 0.01]}
  calc:
    - CF = Sv*(1 - t) + t*C/n
    - p0 = C/Sv
    - p1 = C/CF
  text: |
    معدات تكلف [[C|g]] دينار، وتوفر [[Sv|g]] دينار سنويا، وعمرها [[yrs(n)]] بالقسط الثابت. نسبة الضريبة [[t|%]]. ما فترة الاسترداد البسيطة قبل الضريبة وبعدها؟
  solution: |
    قبل الضريبة:

    $$
    \frac{[[C|g]]}{[[Sv|g]]} = [[p0|2]]
    $$

    بعد الضريبة، التدفق [[CF|2]] دينار:

    $$
    \frac{[[C|g]]}{[[CF|2]]} = [[p1|2]]
    $$

- id: c07-f-12
  kind: problem
  part: F
  vars: {Sv: 10000, n: 6, t: 0.20, i: 0.10}
  random: {Sv: [2000, 40000, 500], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - a = Sv*(1 - t)*PA(i, n)
    - k = 1 - t*PA(i, n)/n
    - C = a/k
  text: |
    مورد يعرض نظاما يوفر [[Sv|g]] دينار سنويا لمدة [[yrs(n)]]، ويستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما أعلى ثمن تدفعه الشركة؟
  solution: |
    $$
    -C + Sv\,(1 - t)(P/A) + t\,\frac{C}{n}\,(P/A) = 0
    $$

    $$
    C = \frac{[[a|2]]}{[[k|f4]]} = [[C|2]]
    $$

    الوفر الضريبي من الاستهلاك يرفع الثمن المقبول فوق القيمة الحالية للتوفير بعد الضريبة، [[a|2]] دينار.
