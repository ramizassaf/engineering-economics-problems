# ------------------------------------------------------------ the three parts
- id: c07-ex-three-parts
  kind: example
  title: |
    ثلاثة أنواع من التدفقات
  text: |
    صنف التدفقات التالية لمشروع خط تعبئة جديد: ثمن الآلة، وإيراد المبيعات، وأجور العمال، وقرض من البنك، وقسط القرض، وفائدة القرض، وضريبة الدخل، ومخزون المواد الأولية في بداية المشروع، وبيع الآلة في النهاية.
  solution: |
    كل تدفق في مشروع ينتمي إلى واحد من ثلاثة أنواع:

    | التدفق | النوع |
    | --- | --- |
    | ثمن الآلة | استثمار |
    | مخزون المواد الأولية | استثمار في رأس المال العامل |
    | بيع الآلة في النهاية | استثمار، لكنه يعود |
    | إيراد المبيعات | تشغيل |
    | أجور العمال | تشغيل |
    | ضريبة الدخل | تشغيل |
    | القرض | تمويل |
    | أصل القسط | تمويل |
    | فائدة القرض | تمويل، لكنها تخفض الضريبة |

    هذا التقسيم يرتب العمل: نحسب التدفقات التشغيلية من قائمة الدخل، ونضيف تدفقات الاستثمار في السنة 0 وفي النهاية، ثم ندرس التمويل وحده في آخر الفصل.

# ------------------------------------------------------------ operating cash flow
- id: c07-ex-operating
  kind: example
  title: |
    التدفق النقدي التشغيلي لسنة واحدة
  vars: {R: 90000, O: 40000, C: 75000, t: 0.20}
  random: {R: [50000, 200000, 5000], O: [10000, 90000, 5000], C: [30000, 150000, 5000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, R*0.6)
    - D = C/5
    - TI = R - O - D
    - T = t*TI
    - NI = TI - T
    - CF = NI + D
  text: |
    مشروع إيراده السنوي [[R|g]] دينار، وتكاليف تشغيله [[O|g]] دينار. معداته تكلف [[C|g]] دينار وتستهلك بالقسط الثابت على 5 سنوات. نسبة الضريبة [[t|%]]. ما التدفق النقدي التشغيلي في سنة واحدة؟
  solution: |
    نبني قائمة الدخل كما في الفصل الخامس:

    | البند | المبلغ |
    | --- | --- |
    | الإيراد | [[R|2]] |
    | تكاليف التشغيل | [[-O|2]] |
    | الاستهلاك | [[-D|2]] |
    | الدخل الخاضع للضريبة | [[TI|2]] |
    | الضريبة | [[-T|2]] |
    | صافي الربح | [[NI|2]] |
    | نضيف الاستهلاك | [[D|2]] |
    | التدفق التشغيلي | [[CF|2]] |

    نضيف الاستهلاك لأنه طرح ليحسب الضريبة فقط، ولم يخرج نقدا. نفس النتيجة بصيغة واحدة:

    $$
    CF = (R - O)(1 - t) + t\,D = [[CF|2]]
    $$

# ------------------------------------------------------------ building the table
- id: c07-ex-simple
  kind: example
  title: |
    أول جدول كامل: مشروع لثلاث سنوات
  vars: {C: 60000, R: 55000, O: 25000, t: 0.20, i: 0.12}
  random: {C: [30000, 120000, 5000], R: [40000, 120000, 5000], O: [10000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - D = C/3
    - TI = R - O - D
    - T = t*TI
    - NI = TI - T
    - CF = NI + D
    - PW = -C + CF*PA(i, 3)
  text: |
    آلة تكلف [[C|g]] دينار، وتعطي إيرادا [[R|g]] دينار سنويا، بتكاليف تشغيل [[O|g]] دينار، لمدة 3 سنوات. تستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد بعد الضريبة [[i|%]]. ابن جدول التدفقات، واحسب القيمة الحالية.
  solution: |
    الاستهلاك [[D|2]] دينار كل سنة.

    | البند | السنة 0 | السنة 1 | السنة 2 | السنة 3 |
    | --- | --- | --- | --- | --- |
    | الإيراد | | [[R|0]] | [[R|0]] | [[R|0]] |
    | التشغيل | | [[-O|0]] | [[-O|0]] | [[-O|0]] |
    | الاستهلاك | | [[-D|0]] | [[-D|0]] | [[-D|0]] |
    | الدخل الخاضع | | [[TI|0]] | [[TI|0]] | [[TI|0]] |
    | الضريبة | | [[-T|0]] | [[-T|0]] | [[-T|0]] |
    | صافي الربح | | [[NI|0]] | [[NI|0]] | [[NI|0]] |
    | الاستهلاك يضاف | | [[D|0]] | [[D|0]] | [[D|0]] |
    | الاستثمار | [[-C|0]] | | | |
    | صافي التدفق | [[-C|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] |

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ 3) = [[PW|2]]
    $$

    المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]] بعد الضريبة. الجدول طويل، لكن كل سطر فيه بسيط. هذا هو الشكل الذي ستبني عليه كل مشاريع الفصل.

- id: c07-ex-salvage
  kind: example
  title: |
    إضافة قيمة البيع في النهاية
  vars: {C: 60000, R: 55000, O: 25000, t: 0.20, i: 0.12, M: 15000}
  random: {C: [30000, 120000, 5000], R: [40000, 120000, 5000], O: [10000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01], M: [3000, 30000, 1000]}
  calc:
    - D = C/3
    - CF = (R - O)*(1 - t) + t*D
    - TS = t*M
    - NS = M - TS
    - PW = -C + CF*PA(i, 3) + NS*PF(i, 3)
  text: |
    للمشروع السابق، تبين أن الآلة تباع في نهاية السنة 3 بمبلغ [[M|g]] دينار. استهلاكها الضريبي بقي على 3 سنوات بدون قيمة بيع. كيف يتغير الجدول والقيمة الحالية؟
  solution: |
    القيمة الدفترية في نهاية السنة 3 صفر، لأن الآلة استهلكت كاملة. فكل ثمن البيع ربح يخضع للضريبة:

    $$
    \mathrm{tax} = [[t|r]] \times ([[M|g]] - 0) = [[TS|2]]
    $$

    صافي البيع:

    $$
    [[M|g]] - [[TS|2]] = [[NS|2]]
    $$

    نضيف سطرا في جدول السنة 3 بصافي البيع. التدفق التشغيلي لم يتغير، [[CF|2]] دينار سنويا.

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ 3) + [[NS|2]]\,(P/F,\ [[i|%]],\ 3) = [[PW|2]]
    $$

- id: c07-ex-working-capital
  kind: example
  title: |
    إضافة رأس المال العامل
  vars: {C: 60000, R: 55000, O: 25000, t: 0.20, i: 0.12, M: 15000, W: 10000}
  random: {C: [30000, 120000, 5000], R: [40000, 120000, 5000], O: [10000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01], M: [3000, 30000, 1000], W: [3000, 25000, 1000]}
  calc:
    - D = C/3
    - CF = (R - O)*(1 - t) + t*D
    - NS = M*(1 - t)
    - PW = -C - W + CF*PA(i, 3) + (NS + W)*PF(i, 3)
    - PW0 = -C + CF*PA(i, 3) + NS*PF(i, 3)
  text: |
    للمشروع السابق، يحتاج خط الإنتاج مخزونا من المواد الأولية والعبوات بقيمة [[W|g]] دينار في البداية، ويسترد هذا المخزون كاملا في النهاية. ما أثره على القيمة الحالية؟
  solution: |
    المخزون ليس مصروفا، فلا يطرح من الدخل ولا يخفض الضريبة. لكنه مال محبوس في المشروع طوال عمره. يسمى رأس المال العامل. يدخل في السنة 0 كاستثمار، ويعود في السنة الأخيرة.

    | | السنة 0 | السنة 1 | السنة 2 | السنة 3 |
    | --- | --- | --- | --- | --- |
    | الآلة | [[-C|0]] | | | |
    | رأس المال العامل | [[-W|0]] | | | [[W|0]] |
    | التدفق التشغيلي | | [[CF|0]] | [[CF|0]] | [[CF|0]] |
    | صافي البيع | | | | [[NS|0]] |
    | صافي التدفق | [[-C-W|0]] | [[CF|0]] | [[CF|0]] | [[CF+NS+W|0]] |

    $$
    PW = [[PW|2]]
    $$

    بدون رأس المال العامل كانت [[PW0|2]] دينار. الفرق [[PW0-PW|2]] دينار، وهو تكلفة حبس المال ثلاث سنوات: يخرج اليوم ويعود بنفس القيمة الاسمية، لكن قيمته الحالية أقل.

- id: c07-ex-full
  kind: example
  title: |
    مشروع كامل لخمس سنوات
  vars: {C: 150000, R: 120000, O: 60000, t: 0.20, i: 0.12, M: 20000, W: 15000, r0: 0}
  random: {C: [80000, 250000, 5000], O: [30000, 100000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01], M: [5000, 40000, 1000], W: [5000, 30000, 1000], r0: [0.06, 0.28, 0.01]}
  calc:
    - D = C/5
    - NS = M*(1 - t)
    - q = max(r0, 0.01)
    - CFt = (C + W - (NS + W)*PF(q, 5))*AP(q, 5)
    - R = pick(r0 > 0, ceil((O + (CFt - t*D)/(1 - t))/1000)*1000, R)
    - CF = (R - O)*(1 - t) + t*D
    - L = CF + NS + W
    - PW = -C - W + CF*PA(i, 5) + (NS + W)*PF(i, 5)
    - r = IRR([-C - W, CF, CF, CF, CF, L], -0.5, 1.0)
  text: |
    مصنع يدرس خطا جديدا يكلف [[C|g]] دينار، ويحتاج رأس مال عامل [[W|g]] دينار. الإيراد [[R|g]] دينار سنويا، والتكاليف [[O|g]] دينار، لمدة 5 سنوات. الاستهلاك بالقسط الثابت على 5 سنوات بدون قيمة بيع، لكن الخط يباع فعلا بمبلغ [[M|g]] دينار في النهاية. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد بعد الضريبة [[i|%]]. احسب القيمة الحالية والمعدل.
  solution: |
    نطبق نفس الخطوات:

    **الخطوة 1: الاستهلاك.**

    $$
    D = \frac{[[C|g]]}{5} = [[D|2]]
    $$

    **الخطوة 2: التدفق التشغيلي، نفسه كل سنة.**

    $$
    CF = ([[R|g]] - [[O|g]])(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

    **الخطوة 3: صافي البيع في النهاية.** القيمة الدفترية صفر:

    $$
    [[M|g]]\,(1 - [[t|r]]) = [[NS|2]]
    $$

    **الخطوة 4: الجدول.**

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- | --- |
    | صافي التدفق | [[-C-W|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[L|0]] |

    السنة 5 تجمع التدفق التشغيلي وصافي البيع واسترداد رأس المال العامل.

    **الخطوة 5: التقييم.**

    $$
    PW = [[PW|2]]
    $$

    ```excel
    =B1 + NPV([[i|%]], C1:G1)
    =IRR(B1:G1)
    ```

    المعدل بعد الضريبة [[r|%2]]. المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c07-ex-ddb
  kind: example
  title: |
    أثر طريقة الاستهلاك على المشروع
  vars: {C: 150000, R: 120000, O: 60000, t: 0.20, i: 0.12}
  random: {C: [80000, 250000, 5000], R: [80000, 200000, 5000], O: [30000, 100000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - base = (R - O)*(1 - t)
    - d1 = 0.4*C
    - d2 = 0.24*C
    - d3 = 0.144*C
    - d4 = 0.108*C
    - P_sl = -C + base*PA(i, 5) + t*C/5*PA(i, 5)
    - P_dd = -C + base*PA(i, 5) + t*(d1*PF(i, 1) + d2*PF(i, 2) + d3*PF(i, 3) + d4*PF(i, 4) + d4*PF(i, 5))
  text: |
    للخط السابق بدون قيمة بيع وبدون رأس مال عامل، احسب القيمة الحالية بعد الضريبة مرة بالقسط الثابت، ومرة بالمتناقص المضاعف مع التحول.
  solution: |
    الجزء الذي لا يتأثر بالاستهلاك نفسه في الطريقتين:

    $$
    (R - O)(1 - t) = [[base|2]]
    $$

    الفرق كله في الوفر الضريبي. المتناقص المضاعف لخمس سنوات: 40% ثم 24% ثم 14.4% ثم 10.8% و10.8% من الأساس.

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | القسط الثابت | [[C/5|0]] | [[C/5|0]] | [[C/5|0]] | [[C/5|0]] | [[C/5|0]] |
    | المتناقص المضاعف | [[d1|0]] | [[d2|0]] | [[d3|0]] | [[d4|0]] | [[d4|0]] |

    القيمة الحالية بالقسط الثابت [[P_sl|2]] دينار، وبالمتناقص المضاعف [[P_dd|2]] دينار. نفس المشروع يصبح أفضل بمقدار [[P_dd-P_sl|2]] دينار، فقط بتغيير طريقة الاستهلاك.

- id: c07-ex-wc-sales
  kind: example
  title: |
    رأس مال عامل يتغير مع المبيعات
  vars: {S: 100000, g: 0.10, w: 0.15}
  random: {S: [40000, 200000, 5000], g: [0.05, 0.20, 0.01], w: [0.10, 0.25, 0.01]}
  calc:
    - S1 = S
    - S2 = S*(1 + g)
    - S3 = S*(1 + g)**2
    - S4 = S*(1 + g)**3
    - W1 = w*S1
    - W2 = w*S2
    - W3 = w*S3
    - W4 = w*S4
  text: |
    مشروع مبيعاته [[S|g]] دينار في السنة الأولى، وتنمو [[g|%]] سنويا لمدة 4 سنوات. يحتاج رأس مال عامل يساوي [[w|%]] من مبيعات كل سنة، ويجب أن يكون جاهزا في بداية السنة. ما تدفقات رأس المال العامل؟
  solution: |
    رصيد رأس المال العامل المطلوب لكل سنة:

    | السنة | المبيعات | الرصيد المطلوب |
    | --- | --- | --- |
    | 1 | [[S1|0]] | [[W1|0]] |
    | 2 | [[S2|0]] | [[W2|0]] |
    | 3 | [[S3|0]] | [[W3|0]] |
    | 4 | [[S4|0]] | [[W4|0]] |

    التدفق هو الزيادة في الرصيد فقط، في بداية كل سنة، أي في نهاية السنة التي قبلها:

    | السنة | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | تدفق رأس المال العامل | [[-W1|0]] | [[-(W2-W1)|0]] | [[-(W3-W2)|0]] | [[-(W4-W3)|0]] | [[W4|0]] |

    في النهاية يسترد الرصيد كله، [[W4|0]] دينار. مجموع التدفقات صفر، لكن توقيتها يكلف المشروع.

# ------------------------------------------------------------ financing
- id: c07-ex-loan
  kind: example
  title: |
    تمويل المشروع بقرض
  vars: {C: 90000, L: 60000, r: 0.08, R: 70000, O: 30000, t: 0.20, i: 0.12}
  random: {C: [50000, 150000, 5000], R: [40000, 120000, 5000], O: [10000, 50000, 5000], t: [0.15, 0.30, 0.01], r: [0.05, 0.12, 0.005], i: [0.10, 0.18, 0.01]}
  calc:
    - L = floor(C*2/3/1000)*1000
    - A = L*AP(r, 3)
    - I1 = L*r
    - B1 = L + I1 - A
    - I2 = B1*r
    - B2 = B1 + I2 - A
    - I3 = B2*r
    - D = C/3
    - E1 = (R - O) - t*(R - O - D - I1) - A
    - E2 = (R - O) - t*(R - O - D - I2) - A
    - E3 = (R - O) - t*(R - O - D - I3) - A
    - PWe = -(C - L) + E1*PF(i, 1) + E2*PF(i, 2) + E3*PF(i, 3)
    - PWa = -C + ((R - O)*(1 - t) + t*D)*PA(i, 3)
  text: |
    آلة تكلف [[C|g]] دينار، وتعطي إيرادا [[R|g]] بتكاليف [[O|g]] دينار سنويا، لمدة 3 سنوات، وتستهلك بالقسط الثابت. الشركة تقترض [[L|g]] دينار بفائدة [[r|%]] تسدد بأقساط سنوية متساوية، وتدفع الباقي من مالها. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد على مال الشركة [[i|%]]. ما القيمة الحالية لتدفقات مال الشركة؟
  solution: |
    **الخطوة 1: جدول القرض.** القسط:

    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ 3) = [[A|2]]
    $$

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الفائدة | [[I1|0]] | [[I2|0]] | [[I3|0]] |

    **الخطوة 2: الفائدة تطرح من الدخل الخاضع للضريبة،** مثل الاستهلاك. أما أصل القسط فلا يطرح.

    $$
    T_t = t\,(R - O - D - I_t)
    $$

    **الخطوة 3: تدفق مال الشركة** يساوي الإيراد ناقص التكاليف والضريبة والقسط كاملا:

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | تدفق مال الشركة | [[-(C-L)|0]] | [[E1|0]] | [[E2|0]] | [[E3|0]] |

    في السنة 0 تدفع الشركة الفرق بين الثمن والقرض فقط.

    $$
    PW_{equity} = [[PWe|2]]
    $$

    بدون قرض كانت القيمة الحالية [[PWa|2]] دينار. القرض [[pick(PWe > PWa, 'رفعها', 'خفضها')]]، لأن الفائدة [[r|%]]، والفائدة بعد الضريبة أقل منها، مقارنة بالحد الأدنى للعائد [[i|%]].

# ------------------------------------------------------------ cost alternatives after tax
- id: c07-ex-cost-saving
  kind: example
  title: |
    آلة توفر تكاليف بعد الضريبة
  vars: {C: 40000, Sv: 14000, n: 5, t: 0.20, i: 0.10}
  random: {C: [10000, 100000, 1000], Sv: [3000, 30000, 500], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - D = C/n
    - CF = Sv*(1 - t) + t*D
    - PW = -C + CF*PA(i, n)
  text: |
    آلة تكلف [[C|g]] دينار، ولا تزيد الإيراد، لكنها توفر [[Sv|g]] دينار سنويا من الأجور لمدة [[yrs(n)]]. تستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد [[i|%]]. هل تشتريها الشركة؟
  solution: |
    التوفير يرفع الربح، فيرفع الضريبة. الاستهلاك يخفضها. التدفق السنوي:

    $$
    CF = [[Sv|g]]\,(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    الشراء [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c07-ex-two-machines
  kind: example
  title: |
    مقارنة آلتين بالقيمة السنوية بعد الضريبة
  vars: {Ca: 30000, Oa: 12000, na: 4, Cb: 50000, Ob: 8000, nb: 6, t: 0.20, i: 0.10}
  random: {Ca: [15000, 40000, 1000], Oa: [6000, 18000, 500], Cb: [35000, 70000, 1000], Ob: [3000, 12000, 500], t: [0.15, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Aa = Ca*AP(i, na) + Oa*(1 - t) - t*Ca/na
    - Ab = Cb*AP(i, nb) + Ob*(1 - t) - t*Cb/nb
  text: |
    الآلة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا، وعمرها 4 سنوات. الآلة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار سنويا، وعمرها 6 سنوات. كلتاهما تستهلك بالقسط الثابت على عمرها بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد [[i|%]]. أيهما أرخص؟
  solution: |
    نحسب التكلفة السنوية بعد الضريبة لكل آلة. ثلاثة أجزاء: استرداد الثمن، والتشغيل بعد الضريبة، ناقص الوفر الضريبي من الاستهلاك.

    $$
    AW_a = [[Ca|g]]\,(A/P,\ [[i|%]],\ 4) + [[Oa|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[Ca/4|2]] = [[Aa|2]]
    $$

    $$
    AW_b = [[Cb|g]]\,(A/P,\ [[i|%]],\ 6) + [[Ob|g]]\,(1 - [[t|r]]) - [[t|r]] \times [[Cb/6|2]] = [[Ab|2]]
    $$

    الأرخص: الآلة [[pick(Aa <= Ab, 'أ', 'ب')]].

# ------------------------------------------------------------ after-tax MARR and break-even
- id: c07-ex-irr-tax
  kind: example
  title: |
    المعدل قبل الضريبة وبعدها
  vars: {C: 80000, R: 30000, n: 5, t: 0.20, r0: 0}
  random: {C: [30000, 150000, 5000], n: [4, 10, 1], t: [0.15, 0.30, 0.01], r0: [0.06, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, ceil(C*AP(max(r0, 0.01), n)/100)*100, R)
    - rb = RATE(n, R, C)
    - CF = R*(1 - t) + t*C/n
    - ra = RATE(n, CF, C)
    - ap = rb*(1 - t)
  text: |
    استثمار يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا قبل الضريبة لمدة [[yrs(n)]]، ويستهلك بالقسط الثابت. نسبة الضريبة [[t|%]]. قارن المعدل قبل الضريبة وبعدها.
  solution: |
    قبل الضريبة:

    ```excel
    =RATE([[n|n]], [[R|r]], -[[C|r]])
    ```

    المعدل [[rb|%2]].

    بعد الضريبة، التدفق السنوي:

    $$
    CF = [[R|g]]\,(1 - [[t|r]]) + [[t|r]] \times [[C/n|2]] = [[CF|2]]
    $$

    والمعدل [[ra|%2]].

    قاعدة تقريبية شائعة: المعدل بعد الضريبة يساوي تقريبا المعدل قبلها مضروبا في واحد ناقص نسبة الضريبة، أي [[ap|%2]] هنا. التقريب قريب، لكنه ليس دقيقا، لأن الاستهلاك يعطي وفرا ضريبيا. لذلك إذا قيمت المشروع بعد الضريبة، فقارن بحد أدنى بعد الضريبة.

- id: c07-ex-breakeven
  kind: example
  title: |
    أقل إيراد يجعل المشروع مقبولا بعد الضريبة
  vars: {C: 100000, O: 30000, n: 5, t: 0.20, i: 0.12}
  random: {C: [30000, 200000, 5000], O: [5000, 60000, 1000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - D = C/n
    - R = O + (C*AP(i, n) - t*D)/(1 - t)
  text: |
    مشروع يكلف [[C|g]] دينار، وتكاليف تشغيله [[O|g]] دينار سنويا، وعمره [[yrs(n)]]، ويستهلك بالقسط الثابت. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد بعد الضريبة [[i|%]]. ما أقل إيراد سنوي يجعل القيمة الحالية صفرا؟
  solution: |
    القيمة الحالية صفر عندما يساوي التدفق السنوي تكلفة استرداد رأس المال:

    $$
    (R - [[O|g]])(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]])
    $$

    نحل لـ R:

    $$
    R = [[O|g]] + \frac{[[C*AP(i, n)|2]] - [[t*D|2]]}{1 - [[t|r]]} = [[R|2]]
    $$

    إذا كانت المبيعات المتوقعة أعلى من هذا الرقم، فالمشروع مقبول.
