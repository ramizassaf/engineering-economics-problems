items:

- id: c07-b-01
  kind: problem
  part: B
  vars: {R: 80000, O: 35000, D: 12000, t: 0.20}
  random: {R: [40000, 200000, 5000], O: [10000, 100000, 5000], D: [4000, 30000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - TI = R - O - D
    - T = t*TI
    - NI = TI - T
    - CF = NI + D
  text: |
    مشروع إيراده [[R|g]] دينار في السنة، وتكاليف تشغيله [[O|g]] دينار، واستهلاكه [[D|g]] دينار. نسبة الضريبة [[t|%]]. ابن قائمة الدخل، واحسب التدفق النقدي التشغيلي.
  solution: |
    | البند | المبلغ |
    | --- | --- |
    | الإيراد | [[R|2]] |
    | التشغيل | [[-O|2]] |
    | الاستهلاك | [[-D|2]] |
    | الدخل الخاضع | [[TI|2]] |
    | الضريبة | [[-T|2]] |
    | صافي الربح | [[NI|2]] |

    $$
    CF = NI + D = [[NI|2]] + [[D|g]] = [[CF|2]]
    $$

- id: c07-b-02
  kind: problem
  part: B
  vars: {R: 80000, O: 35000, D: 12000, t: 0.20}
  random: {R: [40000, 200000, 5000], O: [10000, 100000, 5000], D: [4000, 30000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - A1 = (R - O)*(1 - t)
    - A2 = t*D
    - CF = A1 + A2
  text: |
    للأرقام السابقة، احسب التدفق التشغيلي بالصيغة الواحدة، وبين ما يمثله كل جزء منها.
  solution: |
    $$
    CF = (R - O)(1 - t) + t\,D
    $$

    الجزء الأول ربح التشغيل بعد الضريبة، كأن لا استهلاك:

    $$
    ([[R|g]] - [[O|g]])(1 - [[t|r]]) = [[A1|2]]
    $$

    الجزء الثاني الوفر الضريبي من الاستهلاك:

    $$
    [[t|r]] \times [[D|g]] = [[A2|2]]
    $$

    المجموع [[CF|2]] دينار، نفس نتيجة قائمة الدخل.

- id: c07-b-03
  kind: problem
  part: B
  vars: {C: 60000, n: 5, t: 0.20, i: 0.10}
  random: {C: [20000, 150000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - D = C/n
    - S = t*D
    - P = S*PA(i, n)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بدون قيمة بيع. نسبة الضريبة [[t|%]]. ما الوفر الضريبي السنوي من الاستهلاك؟ وما قيمته الحالية بحد أدنى [[i|%]]؟
  solution: |
    $$
    D = \frac{[[C|g]]}{[[n|n]]} = [[D|2]]
    $$

    $$
    tD = [[t|r]] \times [[D|2]] = [[S|2]]
    $$

    $$
    PW = [[S|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    الدولة تسترد للشركة هذا المبلغ من ثمن الآلة، على شكل ضريبة أقل.

- id: c07-b-04
  kind: problem
  part: B
  vars: {NI: 26000, D: 15000}
  random: {NI: [5000, 90000, 1000], D: [3000, 40000, 1000]}
  calc:
    - CF = NI + D
  text: |
    صافي ربح مشروع في سنة [[NI|g]] دينار، والاستهلاك المطروح في قائمة الدخل [[D|g]] دينار. ما التدفق النقدي التشغيلي، إذا كانت كل الإيرادات والتكاليف الأخرى نقدية؟
  solution: |
    $$
    CF = [[NI|g]] + [[D|g]] = [[CF|g]]
    $$

- id: c07-b-05
  kind: problem
  part: B
  vars: {R: 90000, O: 40000, D: 10000, t: 0.20}
  random: {R: [40000, 200000, 5000], O: [10000, 100000, 5000], D: [3000, 30000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - CF = (R - O)*(1 - t) + t*D
    - Dx = (CF - (R - O)*(1 - t))/t
  text: |
    تدفق مشروع التشغيلي [[CF|2]] دينار في السنة. إيراده [[R|g]] دينار، وتكاليفه [[O|g]] دينار، ونسبة الضريبة [[t|%]]. ما الاستهلاك السنوي؟
  solution: |
    من الصيغة:

    $$
    [[CF|2]] = ([[R|g]] - [[O|g]])(1 - [[t|r]]) + [[t|r]]\,D
    $$

    $$
    D = \frac{[[CF|2]] - [[(R-O)*(1-t)|2]]}{[[t|r]]} = [[Dx|2]]
    $$

- id: c07-b-06
  kind: problem
  part: B
  vars: {x: 5000, t: 0.20}
  random: {x: [1000, 20000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - d = x*(1 - t)
  text: |
    ارتفعت تكاليف التشغيل في مشروع بمقدار [[x|g]] دينار في السنة. نسبة الضريبة [[t|%]]. بكم ينخفض التدفق النقدي؟
  solution: |
    الربح الخاضع ينخفض [[x|g]] دينار، فتنخفض الضريبة [[t*x|2]] دينار. صافي الانخفاض:

    $$
    [[x|g]]\,(1 - [[t|r]]) = [[d|2]]
    $$

    الدولة تتحمل جزءا من كل زيادة في التكاليف.

- id: c07-b-07
  kind: problem
  part: B
  vars: {x: 4000, t: 0.20}
  random: {x: [1000, 20000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - d = t*x
  text: |
    سمحت دائرة الضريبة لشركة بزيادة استهلاك أصل بمقدار [[x|g]] دينار هذه السنة. نسبة الضريبة [[t|%]]. بكم يتغير التدفق النقدي هذه السنة؟
  solution: |
    الاستهلاك ليس نقدا، فلا يؤثر إلا على الضريبة:

    $$
    \Delta CF = [[t|r]] \times [[x|g]] = [[d|2]]
    $$

    يرتفع التدفق بهذا المبلغ، مع أن صافي الربح المحاسبي ينخفض.

- id: c07-b-08
  kind: problem
  part: B
  vars: {C: 50000, S: 5000, n: 5, R: 40000, O: 18000, t: 0.20}
  random: {C: [20000, 100000, 1000], S: [1000, 10000, 500], n: [3, 10, 1], R: [20000, 90000, 1000], O: [5000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = (C - S)/n
    - CF = (R - O)*(1 - t) + t*D
  text: |
    آلة تكلف [[C|g]] دينار، وقيمة بيعها المقدرة [[S|g]] دينار بعد [[yrs(n)]]، وتستهلك بالقسط الثابت. إيرادها [[R|g]] دينار، وتشغيلها [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]. ما التدفق التشغيلي السنوي؟
  solution: |
    $$
    D = \frac{[[C|g]] - [[S|g]]}{[[n|n]]} = [[D|2]]
    $$

    $$
    CF = ([[R|g]] - [[O|g]])(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

- id: c07-b-09
  kind: problem
  part: B
  vars: {C: 100000, R: 70000, O: 30000, t: 0.20}
  random: {C: [30000, 200000, 5000], R: [30000, 150000, 5000], O: [5000, 60000, 5000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - d1 = 0.4*C
    - d2 = 0.24*C
    - d3 = 0.144*C
    - a = (R - O)*(1 - t)
    - c1 = a + t*d1
    - c2 = a + t*d2
    - c3 = a + t*d3
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط المتناقص المضاعف على 5 سنوات. إيرادها [[R|g]] دينار وتشغيلها [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]. احسب التدفق التشغيلي في السنوات الثلاث الأولى.
  solution: |
    نسبة القسط المتناقص المضاعف 2 على 5، أي 40% من القيمة الدفترية كل سنة.

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الاستهلاك | [[d1|0]] | [[d2|0]] | [[d3|0]] |
    | الوفر الضريبي | [[t*d1|0]] | [[t*d2|0]] | [[t*d3|0]] |
    | التدفق التشغيلي | [[c1|0]] | [[c2|0]] | [[c3|0]] |

    الجزء الأول من التدفق ثابت، [[a|2]] دينار. الوفر الضريبي ينخفض كل سنة، فينخفض التدفق معه.

- id: c07-b-10
  kind: problem
  part: B
  vars: {C: 40000, R: 30000, O: 12000, t: 0.20}
  random: {C: [10000, 100000, 1000], R: [15000, 80000, 1000], O: [3000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - a = (R - O)*(1 - t)
    - d1 = C*4/10
    - d2 = C*3/10
    - d3 = C*2/10
    - d4 = C*1/10
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بمجموع أرقام السنوات على 4 سنوات بدون قيمة بيع. إيرادها [[R|g]] وتشغيلها [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]. احسب التدفق التشغيلي لكل سنة.
  solution: |
    مجموع أرقام السنوات:

    $$
    1 + 2 + 3 + 4 = 10
    $$

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الكسر | 4/10 | 3/10 | 2/10 | 1/10 |
    | الاستهلاك | [[d1|0]] | [[d2|0]] | [[d3|0]] | [[d4|0]] |
    | التدفق التشغيلي | [[a+t*d1|0]] | [[a+t*d2|0]] | [[a+t*d3|0]] | [[a+t*d4|0]] |

- id: c07-b-11
  kind: problem
  part: B
  vars: {Q: 20000, p: 6, v: 2.5, F: 25000, D: 8000, t: 0.20}
  random: {Q: [5000, 50000, 1000], p: [3, 20, 0.5], F: [5000, 50000, 1000], D: [2000, 20000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - v = floor(p*0.4*2)/2
    - R = Q*p
    - O = Q*v + F
    - CF = (R - O)*(1 - t) + t*D
  text: |
    خط إنتاج يبيع [[Q|g]] وحدة في السنة بسعر [[p|d2]] دينار. التكلفة المتغيرة [[v|d2]] دينار للوحدة، والتكاليف الثابتة النقدية [[F|g]] دينار، والاستهلاك [[D|g]] دينار. نسبة الضريبة [[t|%]]. ما التدفق التشغيلي؟
  solution: |
    $$
    R = [[Q|g]] \times [[p|d2]] = [[R|2]]
    $$

    $$
    O = [[Q|g]] \times [[v|d2]] + [[F|g]] = [[O|2]]
    $$

    $$
    CF = ([[R|2]] - [[O|2]])(1 - [[t|r]]) + [[t|r]] \times [[D|g]] = [[CF|2]]
    $$

    [[pick(R - O < D, 'الدخل الخاضع سالب هنا. إذا كان للشركة أرباح أخرى، فالخسارة تخفض ضريبتها، والصيغة تبقى صحيحة.', 'الاستهلاك لا يدخل في التكاليف النقدية، بل يظهر في الوفر الضريبي فقط.')]]

- id: c07-b-12
  kind: problem
  part: B
  vars: {R: 30000, O: 18000, D: 20000, t: 0.20}
  random: {R: [20000, 80000, 1000], D: [10000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = floor(R*0.6/1000)*1000
    - D = max(D, R - O + 2000)
    - TI = R - O - D
    - T = t*TI
    - CF = (R - O) - T
  text: |
    مشروع جديد في شركة رابحة. إيراده [[R|g]] دينار، وتشغيله [[O|g]] دينار، واستهلاكه [[D|g]] دينار في السنة الأولى. نسبة الضريبة [[t|%]]. ما التدفق التشغيلي للمشروع في هذه السنة؟
  solution: |
    الدخل الخاضع للمشروع سالب:

    $$
    TI = [[R|g]] - [[O|g]] - [[D|g]] = [[TI|2]]
    $$

    الشركة رابحة من أعمالها الأخرى، فهذه الخسارة تخفض ضريبتها الكلية بمقدار [[-T|2]] دينار. هذا الوفر يحسب للمشروع:

    $$
    CF = ([[R|g]] - [[O|g]]) - ([[T|2]]) = [[CF|2]]
    $$

    التدفق أكبر من ربح التشغيل نفسه. لو كان المشروع شركة مستقلة بلا أرباح أخرى، لما وفر شيئا هذه السنة، ولنقلت الخسارة إلى سنوات تالية.

- id: c07-b-13
  kind: problem
  part: B
  vars: {R: 100000, O: 45000, D: 15000, t1: 0.15, t2: 0.25}
  random: {R: [40000, 200000, 5000], O: [10000, 100000, 5000], D: [3000, 30000, 1000], t1: [0.10, 0.20, 0.01], t2: [0.21, 0.35, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - c1 = (R - O)*(1 - t1) + t1*D
    - c2 = (R - O)*(1 - t2) + t2*D
  text: |
    نفس المشروع ينفذ في بلدين. إيراده [[R|g]] دينار، وتشغيله [[O|g]] دينار، واستهلاكه [[D|g]] دينار. نسبة الضريبة [[t1|%]] في البلد الأول و[[t2|%]] في الثاني. قارن التدفق التشغيلي.
  solution: |
    $$
    CF_1 = ([[R|g]] - [[O|g]])(1 - [[t1|r]]) + [[t1|r]] \times [[D|g]] = [[c1|2]]
    $$

    $$
    CF_2 = ([[R|g]] - [[O|g]])(1 - [[t2|r]]) + [[t2|r]] \times [[D|g]] = [[c2|2]]
    $$

    الفرق [[c1-c2|2]] دينار في السنة. نسبة الضريبة الأعلى تأخذ أكثر من ربح التشغيل، وتعيد أكثر من الاستهلاك. الفرق يساوي فرق النسبتين مضروبا في الدخل الخاضع:

    $$
    ([[t2|r]] - [[t1|r]])([[R|g]] - [[O|g]] - [[D|g]]) = [[c1-c2|2]]
    $$

- id: c07-b-14
  kind: problem
  part: B
  vars: {R: 60000, g: 0.08, O: 25000, C: 45000, t: 0.20}
  random: {R: [30000, 120000, 5000], g: [0.03, 0.15, 0.01], O: [5000, 50000, 5000], C: [15000, 100000, 5000], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = C/3
    - R2 = R*(1 + g)
    - R3 = R*(1 + g)**2
    - c1 = (R - O)*(1 - t) + t*D
    - c2 = (R2 - O)*(1 - t) + t*D
    - c3 = (R3 - O)*(1 - t) + t*D
  text: |
    مشروع إيراده [[R|g]] دينار في السنة الأولى، ويزيد [[g|%]] كل سنة. تكاليف التشغيل ثابتة [[O|g]] دينار. المعدات تكلف [[C|g]] دينار وتستهلك بالقسط الثابت على 3 سنوات. نسبة الضريبة [[t|%]]. احسب التدفق التشغيلي لكل سنة.
  solution: |
    الاستهلاك [[D|2]] دينار كل سنة.

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الإيراد | [[R|0]] | [[R2|0]] | [[R3|0]] |
    | التشغيل | [[-O|0]] | [[-O|0]] | [[-O|0]] |
    | التدفق التشغيلي | [[c1|0]] | [[c2|0]] | [[c3|0]] |

    كل سنة نطبق نفس الصيغة على أرقامها.

- id: c07-b-15
  kind: problem
  part: B
  vars: {R: 50000, O: 20000, C: 60000, n: 5, t: 0.20, i: 0.12}
  random: {R: [20000, 120000, 5000], O: [5000, 50000, 5000], C: [20000, 150000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - P1 = (R - O)*(1 - t)*PA(i, n)
    - P2 = t*C/n*PA(i, n)
  text: |
    مشروع إيراده [[R|g]] دينار وتشغيله [[O|g]] دينار سنويا لمدة [[yrs(n)]]. معداته تكلف [[C|g]] دينار وتستهلك بالقسط الثابت. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد [[i|%]]. احسب القيمة الحالية لجزأي التدفق التشغيلي كل على حدة.
  solution: |
    ربح التشغيل بعد الضريبة:

    $$
    [[(R-O)*(1-t)|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P1|2]]
    $$

    الوفر الضريبي من الاستهلاك:

    $$
    [[t*C/n|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P2|2]]
    $$

    المجموع [[P1+P2|2]] دينار. إذا طرحنا ثمن المعدات نحصل على القيمة الحالية للمشروع: [[P1+P2-C|2]] دينار.
