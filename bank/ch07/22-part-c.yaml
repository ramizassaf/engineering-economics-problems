items:

- id: c07-c-01
  kind: problem
  part: C
  vars: {M: 18000, B: 10000, t: 0.20}
  random: {M: [5000, 40000, 1000], B: [1000, 20000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - B = min(B, M - 1000)
    - T = t*(M - B)
    - NS = M - T
  text: |
    آلة قيمتها الدفترية [[B|g]] دينار، بيعت بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي البيع؟
  solution: |
    الربح من البيع [[M-B|g]] دينار، وعليه ضريبة:

    $$
    [[t|r]] \times [[M-B|g]] = [[T|2]]
    $$

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[T|2]] = [[NS|2]]
    $$

- id: c07-c-02
  kind: problem
  part: C
  vars: {M: 6000, B: 14000, t: 0.20}
  random: {M: [1000, 20000, 1000], B: [5000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - B = max(B, M + 2000)
    - T = t*(B - M)
    - NS = M + T
  text: |
    آلة قيمتها الدفترية [[B|g]] دينار، بيعت بمبلغ [[M|g]] دينار فقط. الشركة رابحة، ونسبة الضريبة [[t|%]]. ما صافي البيع؟
  solution: |
    الخسارة [[B-M|g]] دينار تطرح من الدخل الخاضع، فتوفر ضريبة:

    $$
    [[t|r]] \times [[B-M|g]] = [[T|2]]
    $$

    $$
    \mathrm{net\ salvage} = [[M|g]] + [[T|2]] = [[NS|2]]
    $$

    صافي البيع أعلى من سعر البيع.

- id: c07-c-03
  kind: problem
  part: C
  vars: {C: 80000, N: 8, k: 5, M: 30000, t: 0.20}
  random: {C: [20000, 150000, 5000], N: [6, 10, 1], k: [2, 5, 1], M: [5000, 60000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - D = C/N
    - B = C - k*D
    - M = min(M, floor(C*0.7/1000)*1000)
    - NS = M - t*(M - B)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(N)]] بدون قيمة بيع. بيعت بعد [[yrs(k)]] بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي البيع؟
  solution: |
    القيمة الدفترية عند البيع:

    $$
    BV = [[C|g]] - [[k|n]] \times [[D|2]] = [[B|2]]
    $$

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[t|r]]\,([[M|g]] - [[B|2]]) = [[NS|2]]
    $$

    [[pick(M >= B, 'البيع فوق القيمة الدفترية، فعليه ضريبة.', 'البيع تحت القيمة الدفترية، فالخسارة توفر ضريبة.')]]

- id: c07-c-04
  kind: problem
  part: C
  vars: {C: 60000, n: 5, k: 3, M: 15000, t: 0.20}
  random: {C: [20000, 150000, 5000], n: [5, 8, 1], k: [2, 4, 1], M: [3000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - d = 2/n
    - B = C*(1 - d)**k
    - NS = M - t*(M - B)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط المتناقص المضاعف لعمر [[yrs(n)]]. بيعت بعد [[yrs(k)]] بمبلغ [[M|g]] دينار، قبل أي تحول إلى القسط الثابت. نسبة الضريبة [[t|%]]. ما صافي البيع؟
  solution: |
    $$
    BV_{[[k|n]]} = [[C|g]]\,(1 - [[d|r]])^{[[k|n]]} = [[B|2]]
    $$

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[t|r]]\,([[M|g]] - [[B|2]]) = [[NS|2]]
    $$

- id: c07-c-05
  kind: problem
  part: C
  vars: {P: 70000, sh: 3000, ins: 5000, n: 5, t: 0.20}
  random: {P: [20000, 150000, 5000], sh: [500, 6000, 500], ins: [1000, 10000, 500], n: [3, 10, 1], t: [0.15, 0.30, 0.01]}
  calc:
    - B = P + sh + ins
    - D = B/n
  text: |
    سعر آلة [[P|g]] دينار، والشحن [[sh|g]] دينار، والتركيب [[ins|g]] دينار. تستهلك بالقسط الثابت على [[yrs(n)]]. ما التدفق في السنة 0؟ وما الاستهلاك السنوي؟ وما الوفر الضريبي السنوي بنسبة [[t|%]]؟
  solution: |
    الشحن والتركيب جزء من تكلفة الأصل، وليس مصروفا في السنة 0:

    $$
    B = [[P|g]] + [[sh|g]] + [[ins|g]] = [[B|g]]
    $$

    التدفق في السنة 0 يساوي [[-B|g]] دينار.

    $$
    D = \frac{[[B|g]]}{[[n|n]]} = [[D|2]], \qquad tD = [[t*D|2]]
    $$

- id: c07-c-06
  kind: problem
  part: C
  vars: {inv: 12000, rec: 9000, pay: 5000, n: 4, i: 0.12}
  random: {inv: [3000, 30000, 1000], rec: [2000, 25000, 1000], pay: [1000, 15000, 1000], n: [3, 10, 1], i: [0.08, 0.15, 0.01]}
  calc:
    - pay = min(pay, inv)
    - W = inv + rec - pay
    - P = W - W*PF(i, n)
  text: |
    مشروع يحتاج مخزونا بقيمة [[inv|g]] دينار، وذمما على الزبائن [[rec|g]] دينار. الموردون يمهلون الشركة بمبلغ [[pay|g]] دينار. كل هذا يسترد في نهاية المشروع بعد [[yrs(n)]]. ما رأس المال العامل؟ وما تكلفته بالقيمة الحالية بحد أدنى [[i|%]]؟
  solution: |
    مهلة الموردين تخفض المال المحبوس:

    $$
    W = [[inv|g]] + [[rec|g]] - [[pay|g]] = [[W|g]]
    $$

    يخرج في السنة 0، ويعود في السنة [[n|n]]:

    $$
    [[W|g]] - [[W|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c07-c-07
  kind: problem
  part: C
  vars: {S: 150000, w: 0.12, n: 5, i: 0.10}
  random: {S: [40000, 300000, 5000], w: [0.08, 0.25, 0.01], n: [3, 10, 1], i: [0.08, 0.15, 0.01]}
  calc:
    - W = w*S
    - P = W*(1 - PF(i, n))
  text: |
    شركة تحتاج رأس مال عامل يساوي [[w|%]] من المبيعات السنوية. المبيعات المتوقعة [[S|g]] دينار، ثابتة لمدة [[yrs(n)]]. ما رأس المال العامل؟ وما تكلفته بالقيمة الحالية بحد أدنى [[i|%]]؟
  solution: |
    $$
    W = [[w|r]] \times [[S|g]] = [[W|2]]
    $$

    $$
    [[W|2]]\,\left(1 - (P/F,\ [[i|%]],\ [[n|n]])\right) = [[P|2]]
    $$

- id: c07-c-08
  kind: problem
  part: C
  vars: {S1: 80000, S2: 100000, S3: 90000, w: 0.15}
  random: {S1: [30000, 150000, 5000], S2: [30000, 150000, 5000], S3: [30000, 150000, 5000], w: [0.08, 0.25, 0.01]}
  calc:
    - W1 = w*S1
    - W2 = w*S2
    - W3 = w*S3
  text: |
    مبيعات مشروع [[S1|g]] ثم [[S2|g]] ثم [[S3|g]] دينار في سنواته الثلاث. رأس المال العامل [[w|%]] من مبيعات كل سنة، ويجب أن يكون جاهزا في بدايتها. ما تدفقات رأس المال العامل؟
  solution: |
    الأرصدة المطلوبة [[W1|0]] ثم [[W2|0]] ثم [[W3|0]] دينار. التدفق هو التغير في الرصيد:

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | التدفق | [[-W1|0]] | [[-(W2-W1)|0]] | [[-(W3-W2)|0]] | [[W3|0]] |

    التدفق الموجب في وسط المشروع، إن ظهر، يعني أن المبيعات انخفضت فتحرر جزء من المال.

- id: c07-c-09
  kind: problem
  part: C
  vars: {C: 50000, W: 8000, T: 4000, t: 0.20}
  random: {C: [20000, 150000, 5000], W: [2000, 20000, 1000], T: [1000, 10000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - Ta = T*(1 - t)
    - X = C + W + Ta
  text: |
    في السنة 0 يدفع مشروع ثمن آلة [[C|g]] دينار، ورأس مال عامل [[W|g]] دينار، وتدريب للعمال [[T|g]] دينار. التدريب مصروف يطرح من الدخل في نفس السنة، والشركة رابحة. نسبة الضريبة [[t|%]]. ما صافي التدفق في السنة 0؟
  solution: |
    الآلة تستهلك على عمرها، ورأس المال العامل لا يطرح. أما التدريب فيطرح فورا، فتكلفته بعد الضريبة:

    $$
    [[T|g]]\,(1 - [[t|r]]) = [[Ta|2]]
    $$

    $$
    CF_0 = -([[C|g]] + [[W|g]] + [[Ta|2]]) = [[-X|2]]
    $$

- id: c07-c-10
  kind: problem
  part: C
  vars: {L: 40000, Le: 48000, n: 6, i: 0.10}
  random: {L: [10000, 100000, 5000], n: [4, 10, 1], i: [0.06, 0.14, 0.01], Le: [10000, 150000, 1000]}
  calc:
    - Le = floor(L*(1 + 0.03)**n/1000)*1000
    - P = -L + Le*PF(i, n)
  text: |
    مشروع يستخدم أرضا تملكها الشركة. قيمتها السوقية اليوم [[L|g]] دينار، وتقدر بمبلغ [[Le|g]] دينار بعد [[yrs(n)]] عند نهاية المشروع. ما أثر الأرض على القيمة الحالية للمشروع بحد أدنى [[i|%]]؟ تجاهل الضريبة على الأرض.
  solution: |
    الأرض لا تستهلك. قيمتها اليوم تكلفة فرصة بديلة، وقيمتها في النهاية تعود للشركة:

    $$
    -[[L|g]] + [[Le|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    الأرض المملوكة ليست مجانية.

- id: c07-c-11
  kind: problem
  part: C
  vars: {C: 90000, M: 20000, B: 12000, t: 0.20}
  random: {C: [30000, 200000, 5000], M: [2000, 40000, 1000], B: [1000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - NS = M - t*(M - B)
    - X = C - NS
  text: |
    شركة تشتري آلة جديدة بمبلغ [[C|g]] دينار، وتبيع الآلة القديمة اليوم بمبلغ [[M|g]] دينار. القيمة الدفترية للقديمة [[B|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي الاستثمار في السنة 0؟
  solution: |
    صافي بيع القديمة:

    $$
    [[M|g]] - [[t|r]]\,([[M|g]] - [[B|g]]) = [[NS|2]]
    $$

    $$
    CF_0 = -[[C|g]] + [[NS|2]] = [[-X|2]]
    $$

- id: c07-c-12
  kind: problem
  part: C
  vars: {C: 70000, S: 10000, n: 5, M: 16000, t: 0.20}
  random: {C: [20000, 150000, 5000], S: [2000, 20000, 1000], n: [3, 10, 1], M: [1000, 30000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - NS = M - t*(M - S)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بقيمة بيع مقدرة [[S|g]] دينار. في النهاية بيعت فعلا بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي البيع؟
  solution: |
    القيمة الدفترية في النهاية تساوي القيمة المقدرة، [[S|g]] دينار.

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[t|r]]\,([[M|g]] - [[S|g]]) = [[NS|2]]
    $$

    [[pick(M >= S, 'السعر الفعلي أعلى من المقدر، فالفرق ربح عليه ضريبة.', 'السعر الفعلي أقل من المقدر، فالفرق خسارة توفر ضريبة.')]]

- id: c07-c-13
  kind: problem
  part: C
  vars: {B: 12000, X: 20000, t: 0.20}
  random: {B: [1000, 30000, 1000], X: [5000, 40000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - M = (X - t*B)/(1 - t)
  text: |
    قيمة آلة الدفترية [[B|g]] دينار. نسبة الضريبة [[t|%]]. بكم يجب أن تباع ليكون صافي البيع [[X|g]] دينار؟
  solution: |
    $$
    M - [[t|r]]\,(M - [[B|g]]) = [[X|g]]
    $$

    $$
    M = \frac{[[X|g]] - [[t|r]] \times [[B|g]]}{1 - [[t|r]]} = [[M|2]]
    $$

- id: c07-c-14
  kind: problem
  part: C
  vars: {C: 80000, st: 5000, ins: 4000, W: 6000, rent: 3000}
  random: {C: [20000, 150000, 5000], st: [1000, 10000, 500], ins: [1000, 10000, 500], W: [2000, 20000, 1000], rent: [1000, 8000, 500]}
  calc:
    - X = C + ins + W
  text: |
    شركة تدرس مشروعا. البنود التالية تتعلق بالسنة 0: ثمن الآلة [[C|g]] دينار، ودراسة جدوى دفعت الشهر الماضي [[st|g]] دينار، وتركيب الآلة [[ins|g]] دينار، ورأس مال عامل [[W|g]] دينار. المشروع سيستخدم مستودعا فارغا يمكن تأجيره بمبلغ [[rent|g]] دينار سنويا. ما الاستثمار المناسب للتحليل في السنة 0؟ وأين يذهب المستودع؟
  solution: |
    الدراسة غارقة، فلا تدخل. الآلة والتركيب ورأس المال العامل تدخل:

    $$
    CF_0 = -([[C|g]] + [[ins|g]] + [[W|g]]) = [[-X|g]]
    $$

    الإيجار الضائع للمستودع تكلفة فرصة بديلة. يدخل كل سنة مع تكاليف التشغيل، [[rent|g]] دينار، وليس في السنة 0.
