  text: |
    مشروع يكلف [[C|g]] دينار، وإيراده [[R|g]] وتشغيله [[O|g]] دينار سنويا لمدة [[yrs(n)]]، بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]. الشركة غير متأكدة من حدها الأدنى، وتقدره [[i|%]]. احسب القيمة الحالية عند [[i-0.02|%]] و[[i|%]] و[[i+0.02|%]]. ما أعلى حد أدنى يقبل عنده المشروع؟
  solution: |
    التدفق السنوي بعد الضريبة [[CF|2]] دينار.

    | الحد الأدنى | [[i-0.02|%]] | [[i|%]] | [[i+0.02|%]] |
    | --- | --- | --- | --- |
    | القيمة الحالية | [[p1|2]] | [[p2|2]] | [[p3|2]] |

    أعلى حد أدنى يقبل عنده المشروع هو المعدل الداخلي:

    ```excel
    =RATE([[n|n]], [[CF|2]], -[[C|r]])
    ```

    المعدل [[r|%2]]. هذه نقطة التعادل للحد الأدنى.

- id: c07-d-20
  kind: problem
  part: D
  vars: {C: 60000, R: 45000, O: 20000, n: 5, t: 0.20, i: 0.12}
  random: {C: [20000, 120000, 5000], R: [25000, 100000, 5000], O: [5000, 40000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - a = PA(i, n)
    - P0 = -C + ((R - O)*(1 - t) + t*C/n)*a
    - k = 0.1*R*(1 - t)*a
    - j = 0.1*O*(1 - t)*a
  text: |
    مشروع يكلف [[C|g]] دينار، وإيراده [[R|g]] وتشغيله [[O|g]] دينار سنويا لمدة [[yrs(n)]]، بالقسط الثابت. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ارتفع الإيراد 10% وارتفع التشغيل 10% معا، لأن السعر والمواد ارتفعا. ما القيمة الحالية الجديدة؟
  solution: |
    أثر الإيراد وحده [[k|2]] دينار، وأثر التشغيل وحده [[-j|2]] دينار. الأثر معا مجموعهما، لأن القيمة الحالية خطية في الاثنين:

    $$
    PW = [[P0|2]] + [[k|2]] - [[j|2]] = [[P0+k-j|2]]
    $$

    ارتفاع الاثنين بنفس النسبة يرفع القيمة، لأن الإيراد أكبر من التشغيل.
