  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - a = PA(i, n)
    - P0 = -C + ((R - O)*(1 - t) + t*C/n)*a
    - d = 0.1*R*(1 - t)*a
  text: |
    مشروع يكلف [[C|g]] دينار، وإيراده [[R|g]] وتشغيله [[O|g]] دينار سنويا لمدة [[yrs(n)]]، ويستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية إذا جاء الإيراد أقل 10%، أو كما قدر، أو أعلى 10%.
  solution: |
    القيمة الحالية بالتقدير:

    $$
    PW = -[[C|g]] + ([[(R-O)*(1-t)|2]] + [[t*C/n|2]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P0|2]]
    $$

    تغير 10% في الإيراد يغير التدفق بعد الضريبة بمقدار [[0.1*R*(1-t)|2]] دينار سنويا، فيغير القيمة الحالية:

    $$
    [[0.1*R*(1-t)|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[d|2]]
    $$

    | الإيراد | -10% | المقدر | +10% |
    | --- | --- | --- | --- |
    | القيمة الحالية | [[P0-d|2]] | [[P0|2]] | [[P0+d|2]] |

- id: c07-d-16
  kind: problem
  part: D
  vars: {C: 60000, R: 45000, O: 20000, n: 5, t: 0.20, i: 0.12}
  random: {C: [20000, 120000, 5000], R: [25000, 100000, 5000], O: [5000, 40000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - a = PA(i, n)
    - P0 = -C + ((R - O)*(1 - t) + t*C/n)*a
    - x = -P0/(R*(1 - t)*a)
  text: |
    للمشروع السابق بأرقام هذه المسألة: الثمن [[C|g]] دينار، والإيراد [[R|g]]، والتشغيل [[O|g]] دينار، والمدة [[yrs(n)]]، والضريبة [[t|%]]، والحد الأدنى [[i|%]]. بأي نسبة يمكن أن يتغير الإيراد قبل أن تصبح القيمة الحالية صفرا؟
  solution: |
    القيمة الحالية [[P0|2]] دينار. كل تغير x في الإيراد يغيرها بمقدار:

    $$
    x \times [[R|g]] \times (1 - [[t|r]])\,(P/A,\ [[i|%]],\ [[n|n]])
    $$

    نجعل المجموع صفرا:

    $$
    x = \frac{-[[P0|2]]}{[[R*(1-t)*a|2]]} = [[x|%2]]
    $$

    [[pick(x < 0, 'الإيراد يمكن أن ينخفض بهذه النسبة والمشروع ما زال مقبولا.', 'المشروع مرفوض بالتقدير الحالي، ويحتاج إيرادا أعلى بهذه النسبة ليصبح مقبولا.')]]

- id: c07-d-17
  kind: problem
  part: D
  vars: {C: 60000, R: 45000, O: 20000, n: 5, t: 0.20, i: 0.12}
  random: {C: [20000, 120000, 5000], R: [25000, 100000, 5000], O: [5000, 40000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - a = PA(i, n)
    - P0 = -C + ((R - O)*(1 - t) + t*C/n)*a
    - xR = -P0/(R*(1 - t)*a)
    - xO = P0/(O*(1 - t)*a)
    - xC = P0/(C*(1 - t*a/n))
  text: |
    مشروع يكلف [[C|g]] دينار، وإيراده [[R|g]] وتشغيله [[O|g]] دينار سنويا لمدة [[yrs(n)]]، بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب نسبة التغير التي تلغي المشروع لكل من الإيراد والتشغيل والثمن. أي متغير أخطر؟
  solution: |
    القيمة الحالية [[P0|2]] دينار.

    الثمن يدخل مرتين: يدفع في السنة 0، ويعطي وفرا ضريبيا كل سنة. فأثر تغيره:

    $$
    x_C\,C\left(1 - \frac{t\,(P/A)}{n}\right) = PW
    $$

    | المتغير | التغير الذي يلغي المشروع |
    | --- | --- |
    | الإيراد | [[xR|%2]] |
    | التشغيل | [[xO|%2]] |
    | الثمن | [[xC|%2]] |

    الأخطر: [[pick(abs(xR) <= abs(xO), pick(abs(xR) <= abs(xC), 'الإيراد', 'الثمن'), pick(abs(xO) <= abs(xC), 'التشغيل', 'الثمن'))]]، لأنه يحتاج أصغر تغير.

- id: c07-d-18
  kind: problem
  part: D
  vars: {C: 90000, R: 60000, O: 25000, M: 10000, n: 5, t: 0.20, i: 0.12}
  random: {C: [40000, 150000, 5000], R: [40000, 120000, 5000], O: [10000, 50000, 5000], M: [2000, 25000, 1000], n: [4, 8, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - a = PA(i, n)
    - D = C/n
    - Pm = -C + ((R - O)*(1 - t) + t*D)*a + M*(1 - t)*PF(i, n)
    - Pp = -C + ((0.8*R - 1.1*O)*(1 - t) + t*D)*a
    - Po = -C + ((1.1*R - 0.9*O)*(1 - t) + t*D)*a + 1.5*M*(1 - t)*PF(i, n)
  text: |
    مشروع يكلف [[C|g]] دينار لمدة [[yrs(n)]]، بالقسط الثابت بدون قيمة بيع ضريبية. التقدير المتوقع: إيراد [[R|g]]، وتشغيل [[O|g]]، وبيع في النهاية [[M|g]] دينار. المتشائم: إيراد أقل 20%، وتشغيل أعلى 10%، ولا بيع. المتفائل: إيراد أعلى 10%، وتشغيل أقل 10%، وبيع أعلى 50%. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية في كل سيناريو.
  solution: |
    | | متشائم | متوقع | متفائل |
    | --- | --- | --- | --- |
    | الإيراد | [[0.8*R|0]] | [[R|0]] | [[1.1*R|0]] |
    | التشغيل | [[1.1*O|0]] | [[O|0]] | [[0.9*O|0]] |
    | البيع | 0 | [[M|0]] | [[1.5*M|0]] |
    | القيمة الحالية | [[Pp|2]] | [[Pm|2]] | [[Po|2]] |

    كل سيناريو يستخدم نفس الصيغة:

    $$
    PW = -C + \left((R - O)(1 - t) + t\,D\right)(P/A) + M\,(1 - t)(P/F)
    $$

- id: c07-d-19
