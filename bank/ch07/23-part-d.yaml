items:

- id: c07-d-01
  kind: problem
  part: D
  vars: {C: 45000, R: 40000, O: 18000, t: 0.20, i: 0.12}
  random: {C: [20000, 100000, 5000], R: [20000, 90000, 5000], O: [5000, 40000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = C/3
    - TI = R - O - D
    - CF = TI*(1 - t) + D
    - PW = -C + CF*PA(i, 3)
  text: |
    آلة تكلف [[C|g]] دينار، وتعطي إيرادا [[R|g]] دينار بتكاليف [[O|g]] دينار سنويا لمدة 3 سنوات. تستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد بعد الضريبة [[i|%]]. ابن الجدول واحسب القيمة الحالية.
  solution: |
    | البند | السنة 0 | السنوات 1 إلى 3 |
    | --- | --- | --- |
    | الإيراد | | [[R|0]] |
    | التشغيل | | [[-O|0]] |
    | الاستهلاك | | [[-D|0]] |
    | الدخل الخاضع | | [[TI|0]] |
    | الضريبة | | [[-t*TI|0]] |
    | الاستهلاك يضاف | | [[D|0]] |
    | الاستثمار | [[-C|0]] | |
    | صافي التدفق | [[-C|0]] | [[CF|0]] |

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ 3) = [[PW|2]]
    $$

    المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]].

- id: c07-d-02
  kind: problem
  part: D
  vars: {C: 60000, R: 45000, O: 20000, M: 10000, t: 0.20, i: 0.10}
  random: {C: [20000, 120000, 5000], R: [20000, 100000, 5000], O: [5000, 50000, 5000], M: [2000, 25000, 1000], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = C/4
    - CF = (R - O)*(1 - t) + t*D
    - NS = M*(1 - t)
    - PW = -C + CF*PA(i, 4) + NS*PF(i, 4)
  text: |
    مشروع لمدة 4 سنوات. الآلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت بدون قيمة بيع، لكنها تباع فعلا في النهاية بمبلغ [[M|g]] دينار. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد [[i|%]]. احسب القيمة الحالية.
  solution: |
    $$
    CF = ([[R|g]] - [[O|g]])(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

    القيمة الدفترية في النهاية صفر:

    $$
    \mathrm{net\ salvage} = [[M|g]]\,(1 - [[t|r]]) = [[NS|2]]
    $$

    | السنة | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | صافي التدفق | [[-C|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[CF+NS|0]] |

    $$
    PW = [[PW|2]]
    $$

- id: c07-d-03
  kind: problem
  part: D
  vars: {C: 60000, W: 9000, R: 45000, O: 20000, t: 0.20, i: 0.10}
  random: {C: [20000, 120000, 5000], W: [2000, 20000, 1000], R: [20000, 100000, 5000], O: [5000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = C/4
    - CF = (R - O)*(1 - t) + t*D
    - PW = -C - W + CF*PA(i, 4) + W*PF(i, 4)
  text: |
    مشروع لمدة 4 سنوات بدون قيمة بيع. الآلة تكلف [[C|g]] دينار وتستهلك بالقسط الثابت. يحتاج رأس مال عامل [[W|g]] دينار يسترد في النهاية. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد [[i|%]]. احسب القيمة الحالية.
  solution: |
    $$
    CF = [[CF|2]]
    $$

    | السنة | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | الآلة | [[-C|0]] | | | | |
    | رأس المال العامل | [[-W|0]] | | | | [[W|0]] |
    | التشغيل | | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] |
    | صافي التدفق | [[-C-W|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[CF+W|0]] |

    $$
    PW = [[PW|2]]
    $$

- id: c07-d-04
  kind: problem
  part: D
  vars: {C: 150000, W: 15000, R: 120000, O: 60000, M: 20000, t: 0.20, i: 0.12, r0: 0}
  random: {C: [60000, 250000, 5000], W: [5000, 30000, 1000], O: [20000, 100000, 5000], M: [5000, 40000, 1000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01], r0: [0.06, 0.28, 0.01]}
  calc:
    - D = C/5
    - NS = M*(1 - t)
    - q = max(r0, 0.01)
    - CFt = (C + W - (NS + W)*PF(q, 5))*AP(q, 5)
    - R = pick(r0 > 0, ceil((O + (CFt - t*D)/(1 - t))/1000)*1000, R)
    - CF = (R - O)*(1 - t) + t*D
    - L = CF + NS + W
    - PW = -C - W + CF*PA(i, 5) + (NS + W)*PF(i, 5)
    - r = IRR([-C - W, CF, CF, CF, CF, L])
  text: |
    خط إنتاج يكلف [[C|g]] دينار، ويحتاج رأس مال عامل [[W|g]] دينار. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا لمدة 5 سنوات. الاستهلاك بالقسط الثابت بدون قيمة بيع، ويباع الخط في النهاية بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد [[i|%]]. احسب القيمة الحالية والمعدل، وقرر.
  solution: |
    $$
    D = [[D|2]], \qquad CF = [[CF|2]], \qquad \mathrm{net\ salvage} = [[NS|2]]
    $$

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- | --- |
    | صافي التدفق | [[-C-W|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[CF|0]] | [[L|0]] |

    $$
    PW = [[PW|2]]
    $$

    ```excel
    =IRR(B1:G1)
    ```

    المعدل [[r|%2]]، مقابل حد أدنى [[i|%]]. المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]]، والطريقتان متفقتان.

- id: c07-d-05
  kind: problem
  part: D
  vars: {C: 150000, W: 15000, R: 120000, O: 60000, M: 20000, t: 0.20, i: 0.12}
  random: {C: [60000, 250000, 5000], W: [5000, 30000, 1000], R: [60000, 200000, 5000], O: [20000, 100000, 5000], M: [5000, 40000, 1000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = C/5
    - CF = (R - O)*(1 - t) + t*D
    - NS = M*(1 - t)
    - PW = -C - W + CF*PA(i, 5) + (NS + W)*PF(i, 5)
    - AW = PW*AP(i, 5)
  text: |
    خط إنتاج يكلف [[C|g]] دينار، ويحتاج رأس مال عامل [[W|g]] دينار. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا لمدة 5 سنوات. الاستهلاك بالقسط الثابت بدون قيمة بيع، ويباع الخط في النهاية بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة السنوية بعد الضريبة.
  solution: |
    القيمة الحالية:

    $$
    PW = -[[C+W|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ 5) + [[NS+W|2]]\,(P/F,\ [[i|%]],\ 5) = [[PW|2]]
    $$

    $$
    AW = [[PW|2]]\,(A/P,\ [[i|%]],\ 5) = [[AW|2]]
    $$

    المشروع يضيف [[AW|2]] دينار كل سنة فوق الحد الأدنى للعائد.

- id: c07-d-06
  kind: problem
  part: D
  vars: {C: 80000, R: 50000, g: 0.10, O: 20000, h: 0.05, t: 0.20, i: 0.12}
  random: {C: [30000, 150000, 5000], R: [30000, 100000, 5000], g: [0.03, 0.15, 0.01], O: [5000, 40000, 5000], h: [0.02, 0.08, 0.01], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.5/1000)*1000)
    - D = C/4
    - c1 = (R - O)*(1 - t) + t*D
    - c2 = (R*(1 + g) - O*(1 + h))*(1 - t) + t*D
    - c3 = (R*(1 + g)**2 - O*(1 + h)**2)*(1 - t) + t*D
    - c4 = (R*(1 + g)**3 - O*(1 + h)**3)*(1 - t) + t*D
    - PW = NPV(i, [-C, c1, c2, c3, c4])
  text: |
    مشروع لمدة 4 سنوات. الآلة تكلف [[C|g]] دينار وتستهلك بالقسط الثابت بدون قيمة بيع. الإيراد [[R|g]] دينار في السنة الأولى ويزيد [[g|%]] سنويا. التشغيل [[O|g]] دينار في السنة الأولى ويزيد [[h|%]] سنويا. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية.
  solution: |
    الاستهلاك [[D|2]] دينار كل سنة.

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الإيراد | [[R|0]] | [[R*(1+g)|0]] | [[R*(1+g)**2|0]] | [[R*(1+g)**3|0]] |
    | التشغيل | [[-O|0]] | [[-O*(1+h)|0]] | [[-O*(1+h)**2|0]] | [[-O*(1+h)**3|0]] |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] | [[c4|0]] |

    التدفقات غير منتظمة، فنخصم كل سنة وحدها:

    ```excel
    =-[[C|r]] + NPV([[i|%]], [[c1|2]], [[c2|2]], [[c3|2]], [[c4|2]])
    ```

    $$
    PW = [[PW|2]]
    $$

- id: c07-d-07
  kind: problem
  part: D
  vars: {C: 80000, R: 50000, O: 20000, t: 0.20, i: 0.12}
  random: {C: [30000, 150000, 5000], R: [30000, 100000, 5000], O: [5000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - a = (R - O)*(1 - t)
    - d1 = 0.5*C
    - d2 = 0.25*C
    - d3 = 0.125*C
    - PW = NPV(i, [-C, a + t*d1, a + t*d2, a + t*d3, a + t*d3])
  text: |
    مشروع لمدة 4 سنوات. الآلة تكلف [[C|g]] دينار، وتستهلك بالقسط المتناقص المضاعف مع التحول إلى الثابت، بدون قيمة بيع. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية.
  solution: |
    نسبة المتناقص المضاعف 2 على 4، أي 50%. بعد سنتين تبقى ربع القيمة، والقسط الثابت عليها لسنتين يساوي قسط المتناقص المضاعف، فنتحول:

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الاستهلاك | [[d1|0]] | [[d2|0]] | [[d3|0]] | [[d3|0]] |
    | التدفق | [[a+t*d1|0]] | [[a+t*d2|0]] | [[a+t*d3|0]] | [[a+t*d3|0]] |

    $$
    PW = [[PW|2]]
    $$

- id: c07-d-08
  kind: problem
  part: D
  vars: {C: 80000, t: 0.20, i: 0.12}
  random: {C: [30000, 200000, 5000], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - Psl = t*C/4*PA(i, 4)
    - Pdd = t*C*(0.5*PF(i, 1) + 0.25*PF(i, 2) + 0.125*PF(i, 3) + 0.125*PF(i, 4))
  text: |
    آلة تكلف [[C|g]] دينار وعمرها الضريبي 4 سنوات بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. بكم ترتفع القيمة الحالية لأي مشروع يستخدمها إذا استهلكت بالمتناقص المضاعف مع التحول، بدلا من القسط الثابت؟
  solution: |
    الإيراد والتكاليف لا تتغير، فالفرق كله في الوفر الضريبي.

    $$
    PW_{SL} = [[t|r]] \times [[C/4|2]]\,(P/A,\ [[i|%]],\ 4) = [[Psl|2]]
    $$

    بالمتناقص المضاعف: 50% ثم 25% ثم 12.5% و12.5% من الثمن.

    $$
    PW_{DDB} = [[t|r]] \times [[C|g]]\,(0.5\,v + 0.25\,v^2 + 0.125\,v^3 + 0.125\,v^4) = [[Pdd|2]]
    $$

    حيث v يساوي معامل P/F لسنة واحدة. الفرق [[Pdd-Psl|2]] دينار لصالح الطريقة الأسرع.

- id: c07-d-09
  kind: problem
  part: D
  vars: {C: 90000, t: 0.20, i: 0.10}
  random: {C: [30000, 200000, 5000], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - d1 = C*5/15
    - d2 = C*4/15
    - d3 = C*3/15
    - d4 = C*2/15
    - d5 = C*1/15
    - P = t*NPV(i, [0, d1, d2, d3, d4, d5])
    - Psl = t*C/5*PA(i, 5)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بمجموع أرقام السنوات على 5 سنوات بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما القيمة الحالية للوفر الضريبي؟ قارنها بالقسط الثابت.
  solution: |
    مجموع الأرقام 15.

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | الاستهلاك | [[d1|0]] | [[d2|0]] | [[d3|0]] | [[d4|0]] | [[d5|0]] |
    | الوفر الضريبي | [[t*d1|0]] | [[t*d2|0]] | [[t*d3|0]] | [[t*d4|0]] | [[t*d5|0]] |

    القيمة الحالية للوفر [[P|2]] دينار. بالقسط الثابت [[Psl|2]] دينار. الفرق [[P-Psl|2]] دينار.

- id: c07-d-10
  kind: problem
  part: D
  vars: {C: 70000, S: 10000, M: 14000, R: 50000, O: 22000, t: 0.20, i: 0.10}
  random: {C: [30000, 150000, 5000], S: [2000, 20000, 1000], M: [1000, 30000, 1000], R: [20000, 100000, 5000], O: [5000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = (C - S)/5
    - CF = (R - O)*(1 - t) + t*D
    - NS = M - t*(M - S)
    - PW = -C + CF*PA(i, 5) + NS*PF(i, 5)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على 5 سنوات بقيمة بيع مقدرة [[S|g]] دينار. في النهاية تباع فعلا بمبلغ [[M|g]] دينار. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية.
  solution: |
    $$
    D = \frac{[[C|g]] - [[S|g]]}{5} = [[D|2]]
    $$

    $$
    CF = [[CF|2]]
    $$

    القيمة الدفترية في النهاية [[S|g]] دينار:

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[t|r]]\,([[M|g]] - [[S|g]]) = [[NS|2]]
    $$

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ 5) + [[NS|2]]\,(P/F,\ [[i|%]],\ 5) = [[PW|2]]
    $$

- id: c07-d-11
  kind: problem
  part: D
  vars: {C: 90000, N: 6, M: 40000, R: 55000, O: 20000, t: 0.20, i: 0.12}
  random: {C: [30000, 150000, 5000], N: [6, 10, 1], R: [20000, 100000, 5000], O: [5000, 50000, 5000], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01], M: [5000, 80000, 1000]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - D = C/N
    - B = C - 4*D
    - M = min(M, floor(C*0.6/1000)*1000)
    - CF = (R - O)*(1 - t) + t*D
    - NS = M - t*(M - B)
    - PW = -C + CF*PA(i, 4) + NS*PF(i, 4)
  text: |
    آلة تكلف [[C|g]] دينار، وعمرها الضريبي [[yrs(N)]] بالقسط الثابت بدون قيمة بيع. المشروع ينتهي بعد 4 سنوات، وتباع الآلة عندها بمبلغ [[M|g]] دينار. الإيراد [[R|g]] والتشغيل [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. احسب القيمة الحالية.
  solution: |
    الاستهلاك يحسب على العمر الضريبي، وليس على عمر المشروع:

    $$
    D = \frac{[[C|g]]}{[[N|n]]} = [[D|2]]
    $$

    القيمة الدفترية بعد 4 سنوات:

    $$
    BV = [[C|g]] - 4 \times [[D|2]] = [[B|2]]
    $$

    $$
    \mathrm{net\ salvage} = [[M|g]] - [[t|r]]\,([[M|g]] - [[B|2]]) = [[NS|2]]
    $$

    $$
    PW = -[[C|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ 4) + [[NS|2]]\,(P/F,\ [[i|%]],\ 4) = [[PW|2]]
    $$

- id: c07-d-12
  kind: problem
  part: D
  vars: {C: 60000, R: 40000, O: 15000, n: 6, t: 0.20}
  random: {C: [20000, 120000, 5000], R: [20000, 90000, 5000], O: [5000, 40000, 5000], n: [4, 10, 1], t: [0.15, 0.30, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - CF = (R - O)*(1 - t) + t*C/n
    - p = C/CF
    - pb = C/(R - O)
  text: |
    آلة تكلف [[C|g]] دينار، وتعطي إيرادا [[R|g]] بتكاليف [[O|g]] دينار سنويا، لمدة [[yrs(n)]]، وتستهلك بالقسط الثابت. نسبة الضريبة [[t|%]]. ما فترة الاسترداد البسيطة قبل الضريبة وبعدها؟
  solution: |
    قبل الضريبة:

    $$
    \frac{[[C|g]]}{[[R-O|g]]} = [[pb|2]]
    $$

    بعد الضريبة:

    $$
    CF = [[CF|2]], \qquad \frac{[[C|g]]}{[[CF|2]]} = [[p|2]]
    $$

    الضريبة تطيل فترة الاسترداد. [[pick(p <= n, 'المشروع يسترد ثمنه خلال عمره.', 'المشروع لا يسترد ثمنه خلال عمره، فهو مرفوض بأي حد أدنى للعائد.')]]

- id: c07-d-13
  kind: problem
  part: D
  vars: {Q: 10000, v: 4, F: 15000, C: 80000, n: 5, t: 0.20, i: 0.12}
  random: {Q: [3000, 50000, 1000], v: [1, 10, 0.5], F: [5000, 40000, 1000], C: [20000, 150000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - D = C/n
    - p = v + (F + (C*AP(i, n) - t*D)/(1 - t))/Q
  text: |
    خط ينتج [[Q|g]] وحدة سنويا. التكلفة المتغيرة [[v|d2]] دينار للوحدة، والثابتة النقدية [[F|g]] دينار سنويا. الآلة تكلف [[C|g]] دينار، وعمرها [[yrs(n)]]، وتستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما أقل سعر للوحدة يجعل المشروع مقبولا؟
  solution: |
    القيمة الحالية صفر عندما:

    $$
    \left(Q\,(p - v) - F\right)(1 - t) + t\,D = C\,(A/P,\ i,\ n)
    $$

    نحل لـ p:

    $$
    p = [[v|d2]] + \frac{[[F|g]] + \dfrac{[[C*AP(i, n)|2]] - [[t*D|2]]}{1 - [[t|r]]}}{[[Q|g]]} = [[p|2]]
    $$

- id: c07-d-14
  kind: problem
  part: D
  vars: {R: 40000, O: 15000, n: 5, t: 0.20, i: 0.12}
  random: {R: [20000, 100000, 5000], O: [5000, 40000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - O = min(O, floor(R*0.6/1000)*1000)
    - a = (R - O)*(1 - t)*PA(i, n)
    - k = 1 - t*PA(i, n)/n
    - C = a/k
  text: |
    مشروع يعطي إيرادا [[R|g]] بتكاليف [[O|g]] دينار سنويا، لمدة [[yrs(n)]]. معداته تستهلك بالقسط الثابت بدون قيمة بيع. نسبة الضريبة [[t|%]]، والحد الأدنى [[i|%]]. ما أعلى ثمن للمعدات يجعل المشروع مقبولا؟
  solution: |
    القيمة الحالية صفر:

    $$
    -C + (R - O)(1 - t)(P/A) + t\,\frac{C}{n}\,(P/A) = 0
    $$

    الثمن يظهر مرتين، لأنه يحدد الاستهلاك أيضا. نجمع حدوده:

    $$
    C\left(1 - \frac{t\,(P/A)}{n}\right) = (R - O)(1 - t)(P/A)
    $$

    $$
    C = \frac{[[a|2]]}{[[k|f4]]} = [[C|2]]
    $$
