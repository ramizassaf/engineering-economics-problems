items:

- id: c07-l-01
  kind: problem
  part: L
  vars: {L: 12000, t: 0.20}
  random: {L: [2000, 40000, 500], t: [0.10, 0.35, 0.01]}
  calc:
    - La = L*(1 - t)
  text: |
    أجرة سيارة توصيل [[L|g]] دينار سنويا، ونسبة الضريبة [[t|%]]. ما تكلفة الأجرة على الشركة بعد الضريبة؟
  solution: |
    الأجرة مصروف يطرح من الدخل الخاضع للضريبة:

    $$
    [[L|g]] \times (1 - [[t|%]]) = [[La|g]]
    $$

- id: c07-l-02
  kind: problem
  part: L
  vars: {C: 40000, n: 4, t: 0.20, i: 0.08}
  random: {C: [10000, 120000, 1000], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - D = C/n
    - PB = -C + t*D*PA(i, n)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]، بدون قيمة بيع. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. ما القيمة الحالية لتكلفة شرائها، بعد الوفر الضريبي؟
  solution: |
    $$
    t\,D = [[t|%]] \times [[D|g]] = [[t*D|g]]
    $$

    $$
    PW = -[[C|g]] + [[t*D|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

- id: c07-l-03
  kind: problem
  part: L
  vars: {L: 9000, n: 5, t: 0.25, i: 0.07}
  random: {L: [2000, 30000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - PL = -L*(1 - t)*PA(i, n)
  text: |
    استئجار معدات بأجرة [[L|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]]. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. ما القيمة الحالية لتكلفة الاستئجار؟
  solution: |
    $$
    PW = -[[L|g]] \times (1 - [[t|%]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

- id: c07-l-04
  kind: problem
  part: L
  vars: {C: 85000, n: 6, S: 15000, L: 19000, t: 0.20, i: 0.09}
  random: {C: [30000, 200000, 5000], n: [3, 8, 1], S: [0, 40000, 1000], L: [5000, 60000, 500], t: [0.15, 0.30, 0.01], i: [0.06, 0.12, 0.01]}
  calc:
    - S = min(S, C*0.3)
    - L = floor(C*AP(i + 0.015, n)/500 + 0.5)*500
    - D = C/n
    - PB = -C + t*D*PA(i, n) + S*(1 - t)*PF(i, n)
    - PL = -L*(1 - t)*PA(i, n)
  text: |
    مستشفى يحتاج جهاز أشعة لمدة [[yrs(n)]]. ثمنه [[C|g]] دينار، يستهلك بالقسط الثابت إلى الصفر، ويباع في النهاية بمبلغ [[S|g]] دينار. أو يستأجره بأجرة [[L|g]] دينار في نهاية كل سنة. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. أيهما أقل تكلفة؟
  solution: |
    **الشراء:**

    $$
    PW = -[[C|g]] + [[t|%]] \times [[D|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S|g]] \times (1 - [[t|%]])\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    **الاستئجار:**

    $$
    PW = -[[L|g]] \times (1 - [[t|%]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    الأقل تكلفة: [[pick(PB >= PL, "الشراء", "الاستئجار")]].

- id: c07-l-05
  kind: problem
  part: L
  vars: {C: 70000, n: 5, S: 10000, t: 0.20, i: 0.08}
  random: {C: [20000, 150000, 5000], n: [3, 8, 1], S: [0, 30000, 1000], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - S = min(S, C*0.3)
    - D = C/n
    - PB = -C + t*D*PA(i, n) + S*(1 - t)*PF(i, n)
    - Lmax = -PB/((1 - t)*PA(i, n))
  text: |
    آلة تكلف [[C|g]] دينار، تستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]، وتباع في النهاية بمبلغ [[S|g]] دينار. ما أعلى أجرة سنوية، في نهاية كل سنة، تجعل الاستئجار مساويا للشراء؟ الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]].
  solution: |
    القيمة الحالية لتكلفة الشراء:

    $$
    PW_{buy} = -[[C|g]] + [[t*D|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S*(1-t)|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    نبحث عن الأجرة التي تعطي نفس القيمة:

    $$
    L\,(1 - [[t|%]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[-PB|2]]
    $$

    $$
    L = [[Lmax|2]]
    $$

    أي عرض أجرة أقل من [[Lmax|2]] دينار يجعل الاستئجار أفضل.

- id: c07-l-06
  kind: problem
  part: L
  vars: {L: 15000, n: 4, t: 0.20, i: 0.08}
  random: {L: [3000, 40000, 500], n: [3, 8, 1], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - P1 = -L*(1 - t)*PA(i, n)
    - P0 = -L*(1 - t)*PA(i, n)*(1 + i)
  text: |
    عقد استئجار بأجرة [[L|g]] دينار سنويا لمدة [[yrs(n)]]، تدفع في بداية كل سنة. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. افترض أن الوفر الضريبي يحصل في نفس وقت الدفع. احسب القيمة الحالية، وقارنها بالدفع في نهاية كل سنة.
  solution: |
    الدفع في البداية يقدم كل دفعة سنة كاملة، فنضرب في واحد زائد النسبة:

    $$
    PW = -[[L|g]] \times (1 - [[t|%]])\,(P/A,\ [[i|%]],\ [[n|n]])\,(1 + [[i|%]]) = [[P0|2]]
    $$

    بالدفع في النهاية:

    $$
    PW = -[[L|g]] \times (1 - [[t|%]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P1|2]]
    $$

    الدفع في البداية أغلى بـ [[P1-P0|2]] دينار بالقيمة الحالية. عند مقارنة عروض الاستئجار، تأكد من توقيت الدفع.

- id: c07-l-07
  kind: problem
  part: L
  vars: {C: 45000, n: 4, M: 3000, L: 15000, t: 0.20, i: 0.08}
  random: {C: [15000, 100000, 1000], n: [3, 6, 1], M: [1000, 8000, 500], L: [4000, 40000, 500], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - L = floor((C*AP(i, n) + M)/500 + 0.5)*500
    - D = C/n
    - PB = -C + (t*D - M*(1 - t))*PA(i, n)
    - PL = -L*(1 - t)*PA(i, n)
  text: |
    سيارة شركة ثمنها [[C|g]] دينار، تستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]، بدون قيمة بيع، وصيانتها [[M|g]] دينار سنويا إذا اشترتها الشركة. عرض الاستئجار [[L|g]] دينار سنويا في نهاية كل سنة، ويشمل الصيانة. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. أيهما تختار؟
  solution: |
    الصيانة الآن تختلف بين الطريقتين، فتدخل الحساب. **الشراء:** كل سنة وفر الاستهلاك، ناقص الصيانة بعد الضريبة:

    $$
    [[t|%]] \times [[D|g]] - [[M|g]] \times (1 - [[t|%]]) = [[t*D - M*(1-t)|g]]
    $$

    $$
    PW_{buy} = -[[C|g]] + [[t*D - M*(1-t)|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    **الاستئجار:**

    $$
    PW_{lease} = -[[L|g]] \times (1 - [[t|%]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    الأقل تكلفة: [[pick(PB >= PL, "الشراء", "الاستئجار")]].

- id: c07-l-08
  kind: problem
  part: L
  vars: {C: 60000, n: 5, L: 14500, t: 0.20}
  random: {C: [20000, 150000, 5000], n: [3, 8, 1], L: [4000, 40000, 500], t: [0.15, 0.30, 0.01]}
  calc:
    - L = floor(C*AP(0.08, n)/500 + 0.5)*500
    - D = C/n
    - B5 = -C + t*D*PA(0.05, n)
    - L5 = -L*(1 - t)*PA(0.05, n)
    - B12 = -C + t*D*PA(0.12, n)
    - L12 = -L*(1 - t)*PA(0.12, n)
  text: |
    آلة ثمنها [[C|g]] دينار، تستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]، بدون قيمة بيع. أجرتها [[L|g]] دينار في نهاية كل سنة. الضريبة [[t|%]]. قارن الطريقتين بنسبة خصم 5%، ثم 12%. ماذا تلاحظ؟
  solution: |
    | النسبة | الشراء | الاستئجار | الأقل تكلفة |
    | --- | --- | --- | --- |
    | 5% | [[B5|0]] | [[L5|0]] | [[pick(B5 >= L5, "الشراء", "الاستئجار")]] |
    | 12% | [[B12|0]] | [[L12|0]] | [[pick(B12 >= L12, "الشراء", "الاستئجار")]] |

    مثال الاستئجار بنسبة 5%:

    $$
    -[[L|g]] \times (1 - [[t|%]])\,(P/A,\ 5\%,\ [[n|n]]) = [[L5|2]]
    $$

    كلما ارتفعت نسبة الخصم، صار الاستئجار أجذب، لأن الشراء يدفع مبلغا كبيرا اليوم، والاستئجار يؤجل الدفعات. لذلك تهم النسبة المستخدمة، والأصح أن تكون تكلفة الدين بعد الضريبة.

- id: c07-l-09
  kind: problem
  part: L
  vars: {C: 60000, n: 5, L: 15000, t: 0.20, i: 0.08}
  random: {C: [20000, 150000, 5000], n: [3, 8, 1], L: [4000, 40000, 500], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - L = floor(C*AP(i + 0.01, n)/500 + 0.5)*500
    - D = C/n
    - PB = -C + t*D*PA(i, n)
    - PL = -L*(1 - t)*PA(i, n)
    - Smin = (PL - PB)/((1 - t)*PF(i, n))
  text: |
    آلة ثمنها [[C|g]] دينار، تستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]. أجرتها [[L|g]] دينار في نهاية كل سنة. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. ما أقل قيمة بيع في النهاية تجعل الشراء مساويا للاستئجار؟
  solution: |
    بدون قيمة بيع:

    $$
    PW_{buy} = -[[C|g]] + [[t*D|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    $$
    PW_{lease} = -[[L*(1-t)|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    قيمة البيع بعد الضريبة يجب أن تغطي الفرق:

    $$
    S\,(1 - [[t|%]])\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PL|2]] - ([[PB|2]])
    $$

    $$
    S = [[Smin|2]]
    $$

    [[pick(Smin <= 0, "الشراء أفضل حتى بدون قيمة بيع.", "إذا توقعت الشركة بيع الآلة بأكثر من هذا المبلغ، فالشراء أفضل.")]]

- id: c07-l-10
  kind: problem
  part: L
  vars: {C: 40000, r: 0.08, t: 0.20}
  random: {C: [10000, 100000, 1000], r: [0.05, 0.12, 0.005], t: [0.15, 0.30, 0.01]}
  calc:
    - kd = r*(1 - t)
    - A = C*AP(r, 2)
    - I1 = r*C
    - I2 = r*(C - (A - I1))
    - PV = -(A - t*I1)*PF(kd, 1) - (A - t*I2)*PF(kd, 2)
  text: |
    شركة تقترض [[C|g]] دينار بفائدة [[r|%]] لسنتين، بقسطين متساويين. الضريبة [[t|%]]. احسب القيمة الحالية للأقساط بعد الوفر الضريبي على الفائدة، مخصومة بتكلفة الدين بعد الضريبة. ماذا تلاحظ؟
  solution: |
    $$
    k_d\,(1 - t) = [[kd|%2]] \qquad A = [[C|g]]\,(A/P,\ [[r|%]],\ 2) = [[A|2]]
    $$

    الفائدة في السنة الأولى [[I1|2]]، وفي الثانية [[I2|2]].

    $$
    PW = -([[A|2]] - [[t|%]] \times [[I1|2]])\,(P/F,\ [[kd|%2]],\ 1) - ([[A|2]] - [[t|%]] \times [[I2|2]])\,(P/F,\ [[kd|%2]],\ 2) = [[PV|2]]
    $$

    القيمة تساوي القرض بالضبط، بإشارة سالبة. لذلك، بتكلفة الدين بعد الضريبة، الشراء بقرض يساوي الشراء النقدي، والسؤال الحقيقي هو الاستئجار مقابل الشراء فقط.

- id: c07-l-11
  kind: problem
  part: L
  vars: {C: 50000, n: 5, L: 12500, i: 0.08}
  random: {C: [20000, 150000, 5000], n: [3, 8, 1], L: [4000, 40000, 500], i: [0.05, 0.12, 0.01]}
  calc:
    - L = floor(C*AP(i + 0.005, n)/500 + 0.5)*500
    - B20 = -C + 0.2*(C/n)*PA(i, n)
    - L20 = -L*0.8*PA(i, n)
    - B0 = -C
    - L0 = -L*PA(i, n)
  text: |
    آلة ثمنها [[C|g]] دينار، تستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]، بدون قيمة بيع، أو تستأجر بـ [[L|g]] دينار في نهاية كل سنة. قارن لشركة رابحة تدفع ضريبة 20%، ثم لشركة خاسرة لا تدفع ضريبة في هذه السنوات، بنسبة [[i|%]].
  solution: |
    | الشركة | الشراء | الاستئجار | الأقل تكلفة |
    | --- | --- | --- | --- |
    | رابحة | [[B20|0]] | [[L20|0]] | [[pick(B20 >= L20, "الشراء", "الاستئجار")]] |
    | خاسرة | [[B0|0]] | [[L0|0]] | [[pick(B0 >= L0, "الشراء", "الاستئجار")]] |

    الشركة الخاسرة لا تستفيد من وفر الاستهلاك ولا من خصم الأجرة. المؤجر الرابح يستفيد من الاستهلاك، وقد يمرر جزءا منه في أجرة أقل. لذلك يناسب الاستئجار كثيرا الشركات التي لا تدفع ضريبة.

- id: c07-l-12
  kind: problem
  part: L
  vars: {C: 90000, n: 6, S: 12000, t: 0.20, i: 0.08}
  random: {C: [30000, 200000, 5000], n: [3, 8, 1], S: [0, 40000, 1000], t: [0.15, 0.30, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - S = min(S, C*0.3)
    - PB = -C + t*(C/n)*PA(i, n) + S*(1 - t)*PF(i, n)
    - AB = PB*AP(i, n)
  text: |
    آلة ثمنها [[C|g]] دينار، تستهلك بالقسط الثابت إلى الصفر خلال [[yrs(n)]]، وتباع بمبلغ [[S|g]] دينار. الضريبة [[t|%]]، والحد الأدنى بعد الضريبة [[i|%]]. احسب التكلفة السنوية المكافئة للشراء بعد الضريبة، لمقارنتها مباشرة بأجرة سنوية بعد الضريبة.
  solution: |
    $$
    PW_{buy} = -[[C|g]] + [[t*C/n|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[S*(1-t)|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    $$
    AW = [[PB|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[AB|2]]
    $$

    أي أجرة بعد الضريبة أقل من [[-AB|2]] دينار سنويا تجعل الاستئجار أفضل.

- id: c07-l-13
  kind: concept
  part: L
  text: |
    لماذا يشبه الاستئجار الاقتراض؟ وما النتيجة على نسبة الخصم؟
  solution: |
    في الحالتين تحصل الشركة على استخدام الأصل اليوم، وتلتزم بدفعات ثابتة بعقد. مخاطرة الأجرة مثل مخاطرة القسط، فالنسبة المناسبة لخصم الفرق بين الطريقتين هي تكلفة الدين بعد الضريبة، لا الحد الأدنى للمشاريع.

- id: c07-l-14
  kind: concept
  part: L
  text: |
    اذكر سببين غير ماليين قد يجعلان شركة تختار الاستئجار رغم أن الشراء أرخص قليلا.
  solution: |
    حماية من تقادم التقنية: في نهاية العقد تستأجر جهازا أحدث بدل أن تملك جهازا قديما. وحفظ القدرة على الاقتراض: الشراء بقرض يستهلك حدود الائتمان التي قد تحتاجها لمشروع آخر.

- id: c07-l-15
  kind: problem
  part: L
  text: |
    ابن في Excel جدولا يقارن الشراء والاستئجار سنة بسنة لمثال الحفارة في هذا القسم، بأعمدة لتدفق الشراء وتدفق الاستئجار والفرق، ثم القيمة الحالية لكل عمود.
  solution: |
    السنوات في A2:A7، من 0 إلى 5. تدفق الشراء في B2 للسنة 0، ثم B3:

    ```excel
    B2: =-60000
    B3: =0.2*60000/5
    B7: =0.2*60000/5 + 10000*(1-0.2)
    ```

    انسخ B3 إلى B6. تدفق الاستئجار في C3:C7:

    ```excel
    =-16000*(1-0.2)
    ```

    الفرق في D2:D7 هو الشراء ناقص الاستئجار. القيمة الحالية لكل عمود:

    ```excel
    =B2 + NPV(8%, B3:B7)
    ```

    النتيجة تطابق المثال. عمود الفرق يوضح طبيعة القرار: دفعة كبيرة اليوم مقابل توفير الأجرة كل سنة.
