  text: تتوقع شركة أن تحصل على [[F|g]] دينار من بيع آلة بعد [[yrs(n)]]. ما القيمة الحالية لهذا المبلغ بحد أدنى للعائد [[i|%]]؟
  solution: |
    $$
    P = [[F|g]] \times (1 + [[i|r]])^{-[[n|n]]} = [[F|g]] \times [[f|f4]] = [[P|2]]
    $$

