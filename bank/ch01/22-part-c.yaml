- id: c01-c-25
  kind: problem
  part: C
  vars: {P: 500, i: 0.12, n: 18}
  random: {P: [100, 2000, 50], i: [0.06, 0.15, 0.01], n: [10, 25, 1]}
  calc:
    - F = P*FP(i, n)
  text: اشترى جد لحفيده عند ولادته سندا بمبلغ [[P|g]] دينار بعائد [[i|%]]. كم تصبح قيمته عندما يبلغ الحفيد [[n|n]] سنة؟
  solution: |
    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
