  calc:
    - F = P*FP(i, n)
    - F2 = 2*P*FP(i, n)
    - F3 = P*FP(i, 2*n)
  text: مبلغ [[P|g]] دينار مستثمر [[yrs(n)]] بعائد [[i|%]]. ماذا يحدث للقيمة المستقبلية إذا تضاعف المبلغ؟ وإذا تضاعفت المدة؟
  solution: |
    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    مضاعفة المبلغ تضاعف القيمة المستقبلية بالضبط: [[F2|2]] دينار. مضاعفة المدة تعطي:

    $$
    F' = [[P|g]] \times (1 + [[i|r]])^{[[2*n|n]]} = [[F3|2]]
    $$

    وهي أكثر من الضعف، لأن المدة في الأس.

