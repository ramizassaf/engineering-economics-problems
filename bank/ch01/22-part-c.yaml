- id: c01-c-04
  kind: problem
  part: C
  vars: {P: 600000, i: 0.16, n: 4, S: 1350000}
  random: {P: [200000, 900000, 50000], i: [0.10, 0.20, 0.01], n: [3, 6, 1], S: [400000, 2500000, 50000]}
  calc:
    - F = P*FP(i, n)
    - r = (S/P)**(1/n) - 1
    - dec = pick(S > F, 'تقبل العرض، لأن سعر البيع أعلى من قيمة المشروع لو استمر', 'ترفض العرض، لأن قيمة المشروع لو استمر أعلى من سعر البيع')
  text: مشروع كلف [[P|g]] دينار، ويتوقع أن يحقق عائدا [[i|%]] سنويا. بعد [[yrs(n)]] عرضت شركة شراء المشروع بمبلغ [[S|g]] دينار. هل تقبل صاحبة المشروع العرض؟ وما العائد السنوي الذي يحققه البيع؟
  solution: |
    قيمة الاستثمار لو استمر بالعائد المتوقع:

    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    [[dec]]. العائد السنوي الذي يحققه البيع:

    $$
    i = \left(\frac{[[S|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[r|%2]]
    $$

- id: c01-c-05
  kind: problem
