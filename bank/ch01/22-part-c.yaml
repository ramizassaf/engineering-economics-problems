- id: c01-c-17
  kind: problem
  part: C
  vars: {P: 15000, i: 0.04, n: 2, m: 5}
  random: {P: [5000, 30000, 1000], i: [0.03, 0.09, 0.005], n: [1, 4, 1], m: [3, 8, 1]}
  calc:
    - F1 = P*FP(i, n)
    - F2 = F1*FP(i, m)
  text: وضعت شركة [[P|g]] دينار في وديعة بنسبة [[i|%]] لمدة [[yrs(n)]]، ثم جددت الوديعة بكامل رصيدها [[yrs(m)]] أخرى بنفس النسبة. كم الرصيد في النهاية؟
