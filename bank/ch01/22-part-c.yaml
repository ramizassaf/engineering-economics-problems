- id: c01-c-22
  kind: problem
  part: C
  vars: {F: 6000, i: 0.06, n: 4}
  random: {F: [2000, 15000, 500], i: [0.03, 0.12, 0.005], n: [2, 8, 1]}
  calc:
    - P = F*PF(i, n)
  text: كتب طالب أن القيمة الحالية لمبلغ [[F|g]] دينار بعد [[yrs(n)]] بنسبة [[i|%]] تساوي حاصل ضرب المبلغ في المعامل F/P. صحح الخطأ واحسب الجواب الصحيح.
  solution: |
    المعامل F/P ينقل المبلغ للأمام، والمطلوب نقله للخلف بالمعامل P/F:

    $$
    P = [[F|g]] \times (1 + [[i|r]])^{-[[n|n]]} = [[P|2]]
    $$

    جواب الطالب [[F*FP(i, n)|2]] دينار، وهو أكبر من المبلغ نفسه، وهذا مستحيل لقيمة حالية.

- id: c01-c-23
  kind: problem
