- id: c01-c-01
  kind: problem
  part: C
  vars: {P: 1200, i: 0.06, n: 8}
  random: {P: [500, 8000, 100], i: [0.03, 0.12, 0.005], n: [3, 15, 1]}
  calc:
    - f = FP(i, n)
    - F = P*f
  text: استثمر شخص [[P|g]] دينار في شركة تعطي عائدا [[i|%]] سنويا. كم يصبح لديه بعد [[yrs(n)]]؟
  solution: |
    $$
    F = [[P|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[P|g]] \times [[f|f4]] = [[F|2]]
    $$

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
    ```

    يصبح لديه [[F|2]] دينار.

- id: c01-c-02
  kind: problem
  part: C
  vars: {P: 80000, i: 0.055, n: 3}
  random: {P: [20000, 150000, 5000], i: [0.04, 0.10, 0.005], n: [2, 6, 1]}
  calc:
    - f = FP(i, n)
    - F = P*f
  text: اقترضت شركة [[P|g]] دينار بفائدة [[i|%]] سنويا، على أن تسدد القرض بدفعة واحدة بعد [[yrs(n)]]. ما مبلغ الدفعة؟
  solution: |
    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[P|g]] \times [[f|f4]] = [[F|2]]
    $$

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
    ```

    مبلغ الدفعة [[F|2]] دينار.

