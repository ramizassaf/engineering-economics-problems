    - Pt = F*r4(f)
  text: احسب القيمة الحالية لمبلغ [[F|g]] دينار بعد [[yrs(n)]] بنسبة [[i|%]]، بالقانون ثم بالمعامل المقرب لأربع خانات. ما الفرق؟
