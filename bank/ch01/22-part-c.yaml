    $$
    F_1 = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F1|2]]
    $$

    $$
    F_2 = [[F1|2]] \times (1 + [[i|r]])^{[[m|n]]} = [[F2|2]]
    $$

    النتيجة نفسها لو حسبت مباشرة على [[yrs(n+m)]].

- id: c01-c-18
