- id: c01-c-06
  kind: problem
  part: C
  vars: {i: 0.07, n: 9}
  random: {i: [0.03, 0.15, 0.01], n: [3, 20, 1]}
  calc:
    - a = FP(i, n)
    - b = PF(i, n)
    - c = a*b
  text: احسب معامل القيمة المستقبلية F/P ومعامل القيمة الحالية P/F عند نسبة [[i|%]] و[[yrs(n)]]، ثم اضربهما. ماذا تلاحظ؟
  solution: |
    $$
    (F/P,\ [[i|%]],\ [[n|n]]) = (1 + [[i|r]])^{[[n|n]]} = [[a|f4]]
    $$

    $$
    (P/F,\ [[i|%]],\ [[n|n]]) = (1 + [[i|r]])^{-[[n|n]]} = [[b|f4]]
    $$

    حاصل الضرب [[c|f4]]. المعاملان مقلوبان لبعضهما، لأن نقل المبلغ للأمام ثم للخلف نفس المدة يعيده كما كان.

- id: c01-c-07
  kind: problem
  part: C
  vars: {P: 5000, i: 0.09, n1: 3, n2: 7}
  random: {P: [1000, 15000, 500], i: [0.04, 0.14, 0.01], n1: [2, 5, 1], n2: [6, 12, 1]}
  calc:
    - F1 = P*FP(i, n1)
    - F2 = P*FP(i, n2)
  text: مبلغ [[P|g]] دينار مستثمر بعائد [[i|%]]. ما قيمته في نهاية السنة [[n1|n]]؟ وفي نهاية السنة [[n2|n]]؟ تحقق أن الانتقال من السنة [[n1|n]] إلى السنة [[n2|n]] يعطي نفس الجواب.
  solution: |
    $$
    F_{[[n1|n]]} = [[P|g]] \times (1 + [[i|r]])^{[[n1|n]]} = [[F1|2]]
    $$

    $$
    F_{[[n2|n]]} = [[P|g]] \times (1 + [[i|r]])^{[[n2|n]]} = [[F2|2]]
    $$

    التحقق:

    $$
    [[F1|2]] \times (1 + [[i|r]])^{[[n2-n1|n]]} = [[F2|2]]
    $$

