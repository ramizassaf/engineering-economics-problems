- id: c01-e-01
  kind: problem
  part: E
  vars: {P: 50000, F: 90000, n: 6, r0: 0}
  random: {P: [10000, 80000, 1000], r0: [0.03, 0.15, 0.005], n: [3, 12, 1]}
  calc:
    - F = pick(r0 > 0, floor(P*FP(r0, n)/1000)*1000, F)
    - i = (F/P)**(1/n) - 1
  text: |
    اشترى مزارع قطعة أرض بمبلغ [[P|g]] دينار وباعها بعد [[yrs(n)]] بمبلغ [[F|g]] دينار. ما نسبة العائد السنوية؟ حل بالمعادلة وبالدالة RATE.
  solution: |
    $$
    i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

    ```excel
    =RATE([[n|n]], 0, -[[P|r]], [[F|r]])
    ```

- id: c01-e-02
  kind: problem
  part: E
  vars: {i: 0.09}
  random: {i: [0.03, 0.15, 0.005]}
  calc:
    - n = ln(3)/ln(1+i)
  text: |
    كم سنة يحتاج المبلغ ليصبح ثلاثة أضعاف بفائدة [[i|%]] سنويا؟ حل بالمعادلة وبالدالة NPER.
  solution: |
    $$
    n = \frac{\ln 3}{\ln(1 + [[i|r]])} = [[n|2]]
    $$

    ```excel
    =NPER([[i|%]], 0, -1, 3)
    ```

- id: c01-e-03
  kind: problem
  part: E
  vars: {P: 2000, F: 3500, i: 0.07, m: 0}
  random: {P: [1000, 10000, 250], m: [1.2, 3.0, 0.1], i: [0.03, 0.12, 0.005]}
  calc:
    - F = pick(m > 0, floor(P*m/50)*50, F)
    - n = ln(F/P)/ln(1+i)
    - k = ceil(n)
  text: |
    كم سنة يحتاج مبلغ [[P|g]] دينار ليصبح [[F|g]] دينار بعائد [[i|%]]؟ في نهاية أي سنة يتجاوز الرصيد الهدف؟
  solution: |
    $$
    n = \frac{\ln([[F|g]] / [[P|g]])}{\ln(1 + [[i|r]])} = [[n|2]]
    $$

    الفوائد تضاف في نهاية كل سنة، فيتجاوز الرصيد الهدف في نهاية السنة [[k|n]].

- id: c01-e-04
  kind: problem
  part: E
  vars: {i: 0.06}
  random: {i: [0.02, 0.18, 0.01]}
  calc:
    - n = ln(2)/ln(1+i)
    - r = 72/(i*100)
    - e = (r - n)/n
  text: |
    قارن عدد سنوات التضاعف الدقيق بقاعدة 72 عند نسبة [[i|%]]. ما الخطأ النسبي للقاعدة؟
  solution: |
    $$
    n = \frac{\ln 2}{\ln(1 + [[i|r]])} = [[n|2]], \qquad n_{72} = \frac{72}{[[i*100|g]]} = [[r|2]]
    $$

    الخطأ النسبي [[e|%2]].

- id: c01-e-05
  kind: problem
  part: E
  vars: {P: 9200, F: 12000, n: 5, r0: 0}
  random: {P: [5000, 15000, 100], r0: [0.03, 0.15, 0.005], n: [2, 8, 1]}
  calc:
    - F = pick(r0 > 0, floor(P*FP(r0, n)/100)*100, F)
    - i = (F/P)**(1/n) - 1
  text: |
    اشترى مستثمر سندا بمبلغ [[P|g]] دينار، يسترد منه [[F|g]] دينار بعد [[yrs(n)]] ولا يدفع شيئا قبل ذلك. ما العائد السنوي؟
  solution: |
    $$
    i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

- id: c01-e-06
  kind: problem
  part: E
  vars: {C0: 100.50, C1: 206.93, n: 25}
  calc:
    - f = (C1/C0)**(1/n) - 1
  text: |
    كان مؤشر أسعار المستهلك في فلسطين 100.50 في سنة 1996، و206.93 في سنة 2021. ما متوسط الارتفاع السنوي في الأسعار؟
  solution: |
    نفس قانون إيجاد نسبة الفائدة، لأن الأسعار ترتفع بنسبة مركبة:

    $$
    f = \left(\frac{206.93}{100.50}\right)^{1/25} - 1 = [[f|%2]]
    $$

    المصدر: الجهاز المركزي للإحصاء الفلسطيني. التضخم موضوع فصل لاحق.

- id: c01-e-07
  kind: problem
  part: E
  vars: {P: 120000, F: 150000, i: 0.04, m: 0}
  random: {P: [50000, 200000, 5000], m: [1.2, 3.0, 0.1], i: [0.03, 0.08, 0.005]}
  calc:
    - F = pick(m > 0, floor(P*m/5000)*5000, F)
    - n = ln(F/P)/ln(1+i)
  text: |
    لدى صندوق ادخار [[P|g]] دينار. متى يصل إلى [[F|g]] دينار إذا نما بنسبة [[i|%]] سنويا؟
  solution: |
    $$
    n = \frac{\ln([[F|g]] / [[P|g]])}{\ln(1 + [[i|r]])} = [[n|2]]
    $$

    ```excel
    =NPER([[i|%]], 0, -[[P|r]], [[F|r]])
    ```

- id: c01-e-08
  kind: problem
  part: E
  vars: {P: 800, F: 1000, n: 2, r0: 0}
  random: {P: [500, 2000, 50], r0: [0.05, 0.25, 0.01], n: [1, 4, 1]}
  calc:
    - F = pick(r0 > 0, floor(P*FP(r0, n)/10)*10, F)
    - i = (F/P)**(1/n) - 1
  text: |
    محل يعرض جهازا بسعر [[P|g]] دينار نقدا، أو [[F|g]] دينار تدفع دفعة واحدة بعد [[yrs(n)]]. ما نسبة الفائدة التي يأخذها المحل ضمنيا؟
  solution: |
    $$
    i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

    إذا كان المشتري يستطيع الاقتراض من البنك بأقل من [[i|%2]]، فالأفضل أن يقترض ويدفع نقدا.

- id: c01-e-09
  kind: problem
  part: E
  vars: {P: 60000, g: 0.25, n: 4}
  random: {P: [20000, 100000, 5000], g: [0.10, 0.60, 0.05], n: [2, 8, 1]}
  calc:
    - F = P*(1+g)
    - i = (1+g)**(1/n) - 1
  text: |
    ارتفعت قيمة شقة من [[P|g]] دينار إلى [[F|g]] دينار خلال [[yrs(n)]]. صديقك يقول إن العائد السنوي [[g/n|%2]] لأنه قسم الزيادة الكلية على عدد السنوات. هل هو محق؟ ما العائد الصحيح؟
  solution: |
    القسمة تتجاهل التراكم. العائد السنوي المركب:

    $$
    i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

    وهو أقل من [[g/n|%2]]، لأن كل سنة تبني على زيادة السنة التي قبلها.

- id: c01-e-10
  kind: problem
  part: E
  vars: {F: 2, i: 0.12}
  random: {i: [0.04, 0.20, 0.01]}
  calc:
    - n2 = ln(2)/ln(1+i)
    - n4 = ln(4)/ln(1+i)
    - n8 = ln(8)/ln(1+i)
  text: |
    بنسبة [[i|%]]، كم سنة يحتاج المبلغ ليتضاعف؟ ليصبح أربعة أضعاف؟ ثمانية أضعاف؟ ماذا تلاحظ؟
  solution: |
    | الهدف | عدد السنوات |
    | --- | --- |
    | الضعف | [[n2|2]] |
    | أربعة أضعاف | [[n4|2]] |
    | ثمانية أضعاف | [[n8|2]] |

    كل مضاعفة تحتاج نفس المدة: أربعة أضعاف تحتاج ضعف مدة التضاعف، وثمانية أضعاف تحتاج ثلاثة أضعافها.

- id: c01-e-11
  kind: problem
  part: E
  vars: {P: 10000, F: 16105.1, n: 5}
  calc:
    - i = (F/P)**(1/n) - 1
  text: |
    أصبحت وديعة 10,000 دينار تساوي 16,105.10 دينار بعد 5 سنوات. ما نسبة الفائدة؟ تحقق من جوابك في جدول المعاملات.
  solution: |
    $$
    i = \left(\frac{16{,}105.10}{10{,}000}\right)^{1/5} - 1 = [[i|%2]]
    $$

    في جدول الملحق، معامل P/F عند 10% و5 سنوات يساوي 0.6209، ومقلوبه 1.6105، وهو نسبة المبلغين.

- id: c01-e-12
  kind: problem
  part: E
  vars: {P: 5000, i1: 0.06, i2: 0.08}
  random: {P: [2000, 10000, 500], i1: [0.03, 0.07, 0.005], i2: [0.075, 0.14, 0.005]}
  calc:
    - n1 = ln(2)/ln(1+i1)
    - n2 = ln(2)/ln(1+i2)
    - d = n1 - n2
  text: |
    يريد شخص أن يضاعف مبلغ [[P|g]] دينار. كم سنة يوفر إذا استثمر بعائد [[i2|%]] بدل [[i1|%]]؟
  solution: |
    $$
    n_1 = \frac{\ln 2}{\ln(1 + [[i1|r]])} = [[n1|2]], \qquad n_2 = \frac{\ln 2}{\ln(1 + [[i2|r]])} = [[n2|2]]
    $$

    يوفر [[d|2]] سنة.

- id: c01-e-13
  kind: problem
  part: E
  vars: {P: 1000, F: 1260, n: 3, r0: 0}
  random: {P: [500, 5000, 100], r0: [0.03, 0.15, 0.005], n: [2, 6, 1]}
  calc:
    - F = pick(r0 > 0, floor(P*FP(r0, n)/10)*10, F)
    - i = (F/P)**(1/n) - 1
    - s = (F - P)/(P*n)
  text: |
    مبلغ [[P|g]] دينار أصبح [[F|g]] دينار بعد [[yrs(n)]]. ما النسبة السنوية إذا كانت الفائدة مركبة؟ وإذا كانت بسيطة؟
  solution: |
    $$
    i_{compound} = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

    $$
    i_{simple} = \frac{[[F|g]] - [[P|g]]}{[[P|g]] \times [[n|n]]} = [[s|%2]]
    $$

    النسبة المركبة أقل، لأنها تحتاج أقل لتصل إلى نفس المبلغ.

- id: c01-e-14
  kind: problem
  part: E
  vars: {P: 3000, i: 0.05, F: 4500, m: 0}
  random: {P: [1000, 8000, 250], i: [0.03, 0.10, 0.005], m: [1.2, 3.0, 0.1]}
  calc:
    - F = pick(m > 0, floor(P*m/50)*50, F)
    - n = ln(F/P)/ln(1+i)
    - m = ln(F/P)/ln(1 + 2*i)
  text: |
    كم سنة يحتاج [[P|g]] دينار ليصبح [[F|g]] دينار بنسبة [[i|%]]؟ وكم إذا تضاعفت النسبة؟ هل تنقص المدة إلى النصف بالضبط؟
  solution: |
    $$
    n = \frac{\ln([[F|g]] / [[P|g]])}{\ln(1 + [[i|r]])} = [[n|2]]
    $$

    $$
    n' = \frac{\ln([[F|g]] / [[P|g]])}{\ln(1 + [[2*i|r]])} = [[m|2]]
    $$

    المدة الجديدة [[m/n|%2]] من الأصلية، أكثر قليلا من النصف، لأن اللوغاريتم ليس خطيا.

- id: c01-e-15
  kind: problem
  part: E
  vars: {P: 250000, F: 400000, n: 7, i: 0.08, r0: 0}
  random: {P: [100000, 400000, 10000], r0: [0.03, 0.15, 0.005], n: [4, 10, 1], i: [0.05, 0.12, 0.01]}
  calc:
    - F = pick(r0 > 0, floor(P*FP(r0, n)/10000)*10000, F)
    - r = (F/P)**(1/n) - 1
    - dec = pick(r >= i, 'مقبول، لأن عائده أعلى من الحد الأدنى', 'مرفوض، لأن عائده أقل من الحد الأدنى')
  text: |
    استثمار في مستودع يكلف [[P|g]] دينار، ويتوقع بيعه بعد [[yrs(n)]] بمبلغ [[F|g]] دينار. الحد الأدنى للعائد في الشركة [[i|%]]. ما عائد الاستثمار؟ هل هو مقبول؟
  solution: |
    $$
    i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[r|%2]]
    $$

    الاستثمار [[dec]].
