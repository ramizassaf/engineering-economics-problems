items:

- id: c01-b-01
  kind: problem
  part: B
  vars: {P: 4000, i: 0.07, n: 5}
  random: {P: [1000, 12000, 250], i: [0.03, 0.12, 0.005], n: [2, 8, 1]}
  calc:
    - I = P*i*n
    - F = P + I
  text: اقترض شخص [[P|g]] دينار بفائدة بسيطة [[i|%]] سنويا لمدة [[yrs(n)]]. ما مجموع الفائدة؟ وما المبلغ الذي يسدده في النهاية؟
  solution: |
    $$
    I = P\,i\,n = [[P|g]] \times [[i|r]] \times [[n|n]] = [[I|2]]
    $$

    $$
    F = [[P|g]] + [[I|2]] = [[F|2]]
    $$

    الفائدة [[I|2]] دينار، والمبلغ المسدد [[F|2]] دينار.

- id: c01-b-02
  kind: problem
  part: B
  vars: {P: 4000, i: 0.07, n: 5}
  random: {P: [1000, 12000, 250], i: [0.03, 0.12, 0.005], n: [2, 8, 1]}
  calc:
    - f = FP(i, n)
    - F = P*f
    - I = F - P
  text: أعد المسألة السابقة بفائدة مركبة [[i|%]] سنويا على مبلغ [[P|g]] دينار لمدة [[yrs(n)]]. ما مجموع الفائدة؟
  solution: |
    $$
    F = [[P|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[P|g]] \times [[f|f4]] = [[F|2]]
    $$

    $$
    I = F - P = [[F|2]] - [[P|g]] = [[I|2]]
    $$

    مجموع الفائدة المركبة [[I|2]] دينار.

- id: c01-b-03
  kind: problem
  part: B
  vars: {P: 10000, i: 0.09}
  random: {P: [2000, 30000, 1000], i: [0.04, 0.14, 0.01]}
  calc:
    - B1 = P*(1+i)
    - B2 = B1*(1+i)
    - B3 = B2*(1+i)
    - B4 = B3*(1+i)
    - J1 = P*i
    - J2 = B1*i
    - J3 = B2*i
    - J4 = B3*i
  text: استثمر شخص [[P|g]] دينار بفائدة مركبة [[i|%]] سنويا. اكتب جدولا يبين الرصيد في بداية كل سنة، والفائدة، والرصيد في نهايتها، لمدة 4 سنوات.
  solution: |
    | السنة | الرصيد في بداية السنة | الفائدة | الرصيد في نهاية السنة |
    | --- | --- | --- | --- |
    | 1 | [[P|2]] | [[J1|2]] | [[B1|2]] |
    | 2 | [[B1|2]] | [[J2|2]] | [[B2|2]] |
    | 3 | [[B2|2]] | [[J3|2]] | [[B3|2]] |
    | 4 | [[B3|2]] | [[J4|2]] | [[B4|2]] |

    الرصيد بعد 4 سنوات [[B4|2]] دينار. تحقق بالقانون:

    $$
    [[P|g]] \times (1 + [[i|r]])^4 = [[B4|2]]
    $$

- id: c01-b-04
  kind: problem
  part: B
  vars: {P: 6000, i: 0.10, n: 8}
  random: {P: [1000, 15000, 500], i: [0.05, 0.15, 0.01], n: [4, 15, 1]}
  calc:
    - S = P*(1 + i*n)
    - F = P*FP(i, n)
    - D = F - S
  text: كم يزيد المبلغ بالفائدة المركبة عن المبلغ بالفائدة البسيطة، لمبلغ [[P|g]] دينار بنسبة [[i|%]] سنويا لمدة [[yrs(n)]]؟
  solution: |
    $$
    F_{simple} = [[P|g]] \times (1 + [[i|r]] \times [[n|n]]) = [[S|2]]
    $$

    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    الفرق [[D|2]] دينار.

- id: c01-b-05
  kind: problem
  part: B
  vars: {P: 2500, F: 3100, n: 4}
  random: {P: [1000, 8000, 100], F: [1100, 12000, 100], n: [2, 8, 1]}
  calc:
    - F = max(F, P + 100*n)
    - i = (F - P)/(P*n)
  text: اقترض شخص [[P|g]] دينار ورد [[F|g]] دينار بعد [[yrs(n)]]. إذا كانت الفائدة بسيطة، ما نسبتها السنوية؟
  solution: |
    في الفائدة البسيطة مجموع الفائدة يساوي المبلغ ضرب النسبة ضرب عدد السنوات:

    $$
    i = \frac{F - P}{P\,n} = \frac{[[F|g]] - [[P|g]]}{[[P|g]] \times [[n|n]]} = [[i|%2]]
    $$

    نسبة الفائدة البسيطة [[i|%2]] سنويا.

- id: c01-b-06
  kind: problem
  part: B
  vars: {I: 900, i: 0.06, n: 3}
  random: {I: [200, 3000, 50], i: [0.03, 0.12, 0.005], n: [2, 6, 1]}
  calc:
    - P = I/(i*n)
  text: دفع مقترض فائدة بسيطة مجموعها [[I|g]] دينار على قرض مدته [[yrs(n)]] بنسبة [[i|%]] سنويا. ما مبلغ القرض؟
  solution: |
    $$
    P = \frac{I}{i\,n} = \frac{[[I|g]]}{[[i|r]] \times [[n|n]]} = [[P|2]]
    $$

    مبلغ القرض [[P|2]] دينار.

- id: c01-b-07
  kind: problem
  part: B
  vars: {P: 8000, i: 0.05}
  random: {P: [2000, 20000, 500], i: [0.03, 0.12, 0.005]}
  calc:
    - n = 1/i
  text: بعد كم سنة يتضاعف مبلغ [[P|g]] دينار بفائدة بسيطة [[i|%]] سنويا؟
  solution: |
    المبلغ يتضاعف عندما يصبح مجموع الفائدة مساويا للمبلغ الأصلي:

    $$
    P\,i\,n = P \quad\Rightarrow\quad n = \frac{1}{i} = \frac{1}{[[i|r]]} = [[n|2]]
    $$

    يتضاعف المبلغ بعد [[n|2]] سنة. لاحظ أن الجواب لا يعتمد على المبلغ.

- id: c01-b-08
  kind: problem
  part: B
  vars: {P: 15000, a: 0.08, b: 0.075, n: 6}
  random: {P: [5000, 40000, 1000], a: [0.05, 0.12, 0.005], n: [3, 10, 1]}
  calc:
    - b = a - 0.005
    - Fa = P*(1 + a*n)
    - Fb = P*FP(b, n)
    - best = pick(Fa > Fb, 'العرض الأول', 'العرض الثاني')
    - D = abs(Fa - Fb)
  text: يعرض بنك على مودع فائدة بسيطة [[a|%]] سنويا، ويعرض بنك آخر فائدة مركبة [[b|%]] سنويا. المبلغ [[P|g]] دينار والمدة [[yrs(n)]]. أي العرضين أفضل للمودع؟
  solution: |
    $$
    F_1 = [[P|g]] \times (1 + [[a|r]] \times [[n|n]]) = [[Fa|2]]
    $$

    $$
    F_2 = [[P|g]] \times (1 + [[b|r]])^{[[n|n]]} = [[Fb|2]]
    $$

    [[best]] أفضل بفرق [[D|2]] دينار. النسبة الأعلى لا تكفي للحكم، لأن الفائدة المركبة تتراكم.

- id: c01-b-09
  kind: problem
  part: B
  vars: {P: 20000, i: 0.12}
  random: {P: [5000, 50000, 1000], i: [0.06, 0.18, 0.01]}
  calc:
    - I1 = P*i
    - I2 = P*(1+i)*i
    - I3 = P*(1+i)**2*i
  text: قرض [[P|g]] دينار بفائدة مركبة [[i|%]] سنويا، لا يسدد منه شيء. احسب الفائدة المضافة في كل سنة من السنوات الثلاث الأولى. لماذا تكبر كل سنة؟
  solution: |
    $$
    I_1 = [[P|g]] \times [[i|r]] = [[I1|2]]
    $$

    $$
    I_2 = [[P|g]] \times (1 + [[i|r]]) \times [[i|r]] = [[I2|2]]
    $$

    $$
    I_3 = [[P|g]] \times (1 + [[i|r]])^2 \times [[i|r]] = [[I3|2]]
    $$

    الفائدة تكبر كل سنة لأنها تحسب على رصيد يكبر: المبلغ الأصلي مع فوائد السنوات السابقة.

- id: c01-b-10
  kind: problem
  part: B
  vars: {F: 7500, i: 0.08, n: 5}
  random: {F: [2000, 20000, 500], i: [0.03, 0.12, 0.005], n: [2, 8, 1]}
  calc:
    - P = F/(1 + i*n)
  text: يريد شخص أن يحصل على [[F|g]] دينار بعد [[yrs(n)]] من حساب يعطي فائدة بسيطة [[i|%]] سنويا. كم يودع اليوم؟
  solution: |
    $$
    F = P\,(1 + i\,n) \quad\Rightarrow\quad P = \frac{[[F|g]]}{1 + [[i|r]] \times [[n|n]]} = [[P|2]]
    $$

    يودع [[P|2]] دينار.

- id: c01-b-11
  kind: problem
  part: B
  vars: {P: 3000, i: 0.10, n: 2}
  random: {P: [1000, 10000, 500], i: [0.05, 0.15, 0.01]}
  calc:
    - S = P*(1+i*n)
    - F = P*(1+i)**2
    - D = F - S
    - E = P*i*i
  text: اقترض شخص [[P|g]] دينار لمدة سنتين بنسبة [[i|%]]. احسب الفرق بين الفائدة المركبة والبسيطة، ثم بين أن الفرق يساوي فائدة السنة الثانية على فائدة السنة الأولى.
  solution: |
    $$
    F_{simple} = [[S|2]], \qquad F = [[P|g]] \times (1 + [[i|r]])^2 = [[F|2]]
    $$

    الفرق [[D|2]] دينار. فائدة السنة الأولى [[P*i|2]] دينار، وفائدتها في السنة الثانية:

    $$
    [[P*i|2]] \times [[i|r]] = [[E|2]]
    $$

    الرقمان متساويان: الفرق هو بالضبط الفائدة على الفائدة.

- id: c01-b-12
  kind: problem
  part: B
  vars: {P: 50000, i: 0.06, n: 25}
  random: {P: [10000, 90000, 5000], i: [0.04, 0.10, 0.005], n: [15, 30, 5]}
  calc:
    - S = P*(1+i*n)
    - F = P*FP(i, n)
    - R = F/S
  text: صندوق استثمار بدأ بمبلغ [[P|g]] دينار. ما قيمته بعد [[yrs(n)]] بعائد [[i|%]] سنويا، بالفائدة البسيطة ثم المركبة؟ كم ضعفا يساوي الثاني الأول؟
  solution: |
    $$
    F_{simple} = [[P|g]] \times (1 + [[i|r]] \times [[n|n]]) = [[S|2]]
    $$

    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    الفائدة المركبة تعطي [[R|2]] ضعف الفائدة البسيطة.

- id: c01-b-13
  kind: problem
  part: B
  vars: {P: 12000, i1: 0.05, i2: 0.08}
  random: {P: [3000, 30000, 1000], i1: [0.03, 0.07, 0.005], i2: [0.07, 0.12, 0.005]}
  calc:
    - B1 = P*(1+i1)
    - B2 = B1*(1+i1)
    - B3 = B2*(1+i2)
    - I = B3 - P
  text: وديعة [[P|g]] دينار في بنك أعطى [[i1|%]] في السنتين الأوليين، ثم رفع النسبة إلى [[i2|%]] في السنة الثالثة. ما الرصيد في نهاية السنة الثالثة؟ وما مجموع الفوائد؟
  solution: |
    عندما تتغير النسبة، تضرب في معامل كل سنة بنسبتها:

    $$
    F = [[P|g]] \times (1 + [[i1|r]])^2 \times (1 + [[i2|r]]) = [[B3|2]]
    $$

    مجموع الفوائد [[I|2]] دينار.

- id: c01-b-14
  kind: problem
  part: B
  vars: {P: 9000, i: 0.11}
  random: {P: [2000, 20000, 500], i: [0.05, 0.15, 0.01]}
  calc:
    - S2 = P*(1 + 2*i)
    - C2 = P*(1+i)**2
    - S5 = P*(1 + 5*i)
    - C5 = P*FP(i, 5)
    - S10 = P*(1 + 10*i)
    - C10 = P*FP(i, 10)
  text: اكتب جدولا يقارن قيمة [[P|g]] دينار بفائدة [[i|%]] البسيطة والمركبة بعد 2 و5 و10 سنوات. ماذا تلاحظ؟
  solution: |
    | السنوات | الفائدة البسيطة (دينار) | الفائدة المركبة (دينار) |
    | --- | --- | --- |
    | 2 | [[S2|2]] | [[C2|2]] |
    | 5 | [[S5|2]] | [[C5|2]] |
    | 10 | [[S10|2]] | [[C10|2]] |

    الفرق صغير في المدة القصيرة، ويكبر بسرعة مع طول المدة، لأن المبلغ بالفائدة البسيطة يزيد بمقدار ثابت كل سنة، والمبلغ بالفائدة المركبة يزيد بنسبة ثابتة.

- id: c01-b-15
  kind: problem
  part: B
  vars: {P: 1000, i: 0.10}
  random: {P: [500, 5000, 100], i: [0.04, 0.15, 0.01]}
  calc:
    - ns = 1/i
    - nc = ln(2)/ln(1+i)
  text: بعد كم سنة يتضاعف مبلغ [[P|g]] دينار بنسبة [[i|%]]، بالفائدة البسيطة ثم بالمركبة؟
  solution: |
    بالفائدة البسيطة:

    $$
    n = \frac{1}{i} = \frac{1}{[[i|r]]} = [[ns|2]]
    $$

    بالفائدة المركبة:

    $$
    n = \frac{\ln 2}{\ln(1 + i)} = \frac{\ln 2}{\ln([[1+i|r]])} = [[nc|2]]
    $$

    بالفائدة المركبة يتضاعف المبلغ أسرع بمقدار [[ns-nc|2]] سنة.
