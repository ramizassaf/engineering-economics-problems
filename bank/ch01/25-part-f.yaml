- id: c01-f-01
  kind: problem
  part: F
  vars: {P: 10000, i: 0.07}
  random: {P: [2000, 30000, 1000], i: [0.03, 0.12, 0.005]}
  calc:
    - F10 = P*FP(i, 10)
    - F20 = P*FP(i, 20)
    - F30 = P*FP(i, 30)
  text: ابن جدولا في Excel للرصيد سنة بسنة لمبلغ [[P|g]] دولار بفائدة [[i|%]] لمدة 30 سنة. ما الرصيد بعد 10 و20 و30 سنة؟
  solution: |
    ضع السنة في العمود A من الصف 2، والرصيد في العمود B. في الخلية B2 اكتب المبلغ، وفي الخلية B3 الصيغة التالية، ثم اسحبها للأسفل:

    ```excel
    =B2*(1+[[i|%]])
    ```

    | السنة | الرصيد (دولار) |
    | --- | --- |
    | 10 | [[F10|2]] |
    | 20 | [[F20|2]] |
    | 30 | [[F30|2]] |

- id: c01-f-02
  kind: problem
  part: F
  vars: {P: 5000}
  random: {P: [1000, 20000, 500]}
  calc:
    - a = P*FP(0.04, 10)
    - b = P*FP(0.08, 10)
    - c = P*FP(0.12, 10)
  text: ابن جدولا في Excel يبين قيمة [[P|g]] دولار بعد 10 سنوات عند النسب 4% و8% و12%. اكتب الصيغة مرة واحدة واسحبها.
  solution: |
    ضع النسب في العمود A من الصف 2 إلى الصف 4، ثم اكتب في الخلية B2 الصيغة التالية واسحبها للأسفل:

    ```excel
    =FV(A2, 10, 0, -[[P|r]])
    ```

    | النسبة | القيمة بعد 10 سنوات (دولار) |
    | --- | --- |
    | 4% | [[a|2]] |
    | 8% | [[b|2]] |
    | 12% | [[c|2]] |

- id: c01-f-03
  kind: problem
  part: F
  vars: {P: 10000, i: 0.07}
  random: {P: [2000, 30000, 1000], i: [0.03, 0.12, 0.005]}
  calc:
    - F = P*FP(i, 10)
  text: اكتب برنامج Python يطبع الرصيد سنة بسنة لمبلغ [[P|g]] دولار بفائدة [[i|%]] لمدة 10 سنوات. ما الرصيد في السنة العاشرة؟
  solution: |
    ```python
    P, i = [[P|r]], [[i|r]]
    balance = P
    for year in range(1, 11):
        balance = balance * (1 + i)
        print(year, round(balance, 2))
    ```

    الرصيد في السنة العاشرة [[F|2]] دولار.

- id: c01-f-04
  kind: problem
  part: F
  vars: {P: 2000, F: 4000}
  random: {P: [1000, 5000, 250]}
  calc:
    - F = 2*P
    - n5 = ln(2)/ln(1.05)
    - n10 = ln(2)/ln(1.10)
    - n15 = ln(2)/ln(1.15)
  text: اكتب دالة Python اسمها years_to_double تأخذ نسبة الفائدة وتعيد عدد سنوات التضاعف. استخدمها للنسب 5% و10% و15%.
  solution: |
    ```python
    import math

    def years_to_double(i):
        return math.log(2) / math.log(1 + i)

    for i in (0.05, 0.10, 0.15):
        print(i, round(years_to_double(i), 2))
    ```

    | النسبة | سنوات التضاعف |
    | --- | --- |
    | 5% | [[n5|2]] |
    | 10% | [[n10|2]] |
    | 15% | [[n15|2]] |

- id: c01-f-05
  kind: problem
  part: F
  vars: {i: 0.08, c0: -20000, c1: 5000, c2: 6000, c3: 0, c4: 7000, c5: 9000}
  random: {i: [0.04, 0.14, 0.01], c0: [-40000, -10000, 1000], c1: [1000, 9000, 500], c2: [1000, 9000, 500], c4: [1000, 9000, 500], c5: [2000, 15000, 500]}
  calc:
    - P = c0 + c1*PF(i, 1) + c2*PF(i, 2) + c3*PF(i, 3) + c4*PF(i, 4) + c5*PF(i, 5)
  text: |
    احسب القيمة الحالية للتدفقات التالية بنسبة [[i|%]] بالدالة NPV في Excel، ثم بمكتبة numpy_financial.

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- | --- |
    | التدفق | [[c0|g]] | [[c1|g]] | [[c2|g]] | 0 | [[c4|g]] | [[c5|g]] |
  solution: |
    الدالة NPV في Excel تبدأ من السنة 1، فنضيف تدفق السنة 0 خارجها:

    ```excel
    =B2 + NPV([[i|%]], C2:G2)
    ```

    الدالة npv في numpy_financial تبدأ من السنة 0:

    ```python
    import numpy_financial as npf
    flows = [ [[c0|r]], [[c1|r]], [[c2|r]], 0, [[c4|r]], [[c5|r]]]
    print(round(npf.npv([[i|r]], flows), 2))
    ```

    القيمة الحالية [[P|2]] دولار.

- id: c01-f-06
  kind: problem
  part: F
  vars: {P: 15000, F: 24000}
  random: {P: [5000, 30000, 1000], F: [6000, 60000, 1000]}
  calc:
    - F = max(F, P*1.2)
    - i5 = (F/P)**(1/5) - 1
    - i8 = (F/P)**(1/8) - 1
    - i12 = (F/P)**(1/12) - 1
  text: استثمار [[P|g]] دولار يصبح [[F|g]] دولار. احسب بالدالة RATE نسبة العائد إذا تحقق ذلك خلال 5 أو 8 أو 12 سنة.
  solution: |
    ضع عدد السنوات في العمود A، واكتب في العمود B:

    ```excel
    =RATE(A2, 0, -[[P|r]], [[F|r]])
    ```

    | السنوات | العائد |
    | --- | --- |
    | 5 | [[i5|%2]] |
    | 8 | [[i8|%2]] |
    | 12 | [[i12|%2]] |

- id: c01-f-07
  kind: problem
  part: F
  vars: {F: 20000}
  random: {F: [5000, 50000, 1000]}
  calc:
    - a = F*PF(0.05, 5)
    - b = F*PF(0.10, 5)
    - c = F*PF(0.05, 10)
    - d = F*PF(0.10, 10)
  text: ابن جدول بيانات بصفين وعمودين يبين القيمة الحالية لمبلغ [[F|g]] دولار عند النسبتين 5% و10%، وبعد 5 و10 سنوات. اكتب صيغة واحدة تسحب في الاتجاهين.
  solution: |
    ضع النسبتين في الخليتين A2 وA3، والسنوات في الخليتين B1 وC1. علامة الدولار في الصيغة تثبت العمود أو الصف عند السحب:

    ```excel
    =PV($A2, B$1, 0, -[[F|r]])
    ```

    | النسبة | 5 سنوات | 10 سنوات |
    | --- | --- | --- |
    | 5% | [[a|2]] | [[c|2]] |
    | 10% | [[b|2]] | [[d|2]] |

- id: c01-f-08
  kind: problem
  part: F
  vars: {L: 60000, i: 0.07, a: 2, b: 5}
  random: {L: [20000, 120000, 5000], i: [0.04, 0.12, 0.005], a: [1, 3, 1], b: [4, 8, 1]}
  calc:
    - X = L/(0.5*PF(i, a) + PF(i, b))
  text: حل المسألة التالية بـ Goal Seek في Excel، ثم تحقق بـ Python. قرض [[L|g]] دولار بفائدة [[i|%]] يسدد بدفعتين في نهاية السنتين [[a|n]] و[[b|n]]، الأولى نصف الثانية.
  solution: |
    في Excel: ضع قيمة تجريبية للدفعة الثانية في الخلية B1، واكتب في الخلية B2 القيمة الحالية للدفعتين:

    ```excel
    =PV([[i|%]], [[a|n]], 0, -B1/2) + PV([[i|%]], [[b|n]], 0, -B1)
    ```

    من قائمة Data اختر What-If Analysis ثم Goal Seek: اجعل الخلية B2 تساوي [[L|r]] بتغيير الخلية B1.

    في Python:

    ```python
    L, i = [[L|r]], [[i|r]]
    X = L / (0.5 / (1 + i) ** [[a|n]] + 1 / (1 + i) ** [[b|n]])
    print(round(X, 2), round(X / 2, 2))
    ```

    الدفعة الثانية [[X|2]] دولار، والأولى [[X/2|2]] دولار.

- id: c01-f-09
  kind: problem
  part: F
  vars: {P: 1000}
  random: {P: [500, 5000, 100]}
  calc:
    - s10 = P*(1 + 0.08*10)
    - c10 = P*FP(0.08, 10)
    - s30 = P*(1 + 0.08*30)
    - c30 = P*FP(0.08, 30)
  text: ارسم في Excel أو Python منحنى قيمة [[P|g]] دولار لمدة 30 سنة بنسبة 8%، بالفائدة البسيطة والمركبة على نفس الرسم. صف شكل كل منحنى.
  solution: |
    في Python:

    ```python
    import matplotlib.pyplot as plt
    P, i = [[P|r]], 0.08
    years = range(31)
    simple = [P * (1 + i * n) for n in years]
    compound = [P * (1 + i) ** n for n in years]
    plt.plot(years, simple, label="simple")
    plt.plot(years, compound, label="compound")
    plt.legend()
    plt.show()
    ```

    منحنى الفائدة البسيطة خط مستقيم، ومنحنى الفائدة المركبة يرتفع بتسارع. بعد 10 سنوات القيمتان [[s10|2]] و[[c10|2]] دولار، وبعد 30 سنة [[s30|2]] و[[c30|2]] دولار.

- id: c01-f-10
  kind: problem
  part: F
  vars: {P: 25000, i: 0.09, n: 7}
  random: {P: [5000, 60000, 1000], i: [0.04, 0.14, 0.01], n: [3, 12, 1]}
  calc:
    - F = P*FP(i, n)
  text: احسب القيمة المستقبلية لمبلغ [[P|g]] دولار بعد [[yrs(n)]] بنسبة [[i|%]] بأربع طرق، وتأكد أنها تعطي نفس الجواب. الطرق هي القانون، والدالة FV في Excel، وقانون مكتوب في Python، والدالة fv في numpy_financial.
  solution: |
    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
    ```

    ```python
    import numpy_financial as npf
    print(round([[P|r]] * (1 + [[i|r]]) ** [[n|n]], 2))
    print(round(npf.fv([[i|r]], [[n|n]], 0, -[[P|r]]), 2))
    ```

    الطرق الأربع تعطي [[F|2]] دولار.
