meta:
  number: 1
  title: |
    نقل المال عبر الزمن
  parts:
    - key: A
      title: "الجزء أ: أسئلة مفاهيم"
      intro: أجب بجملة أو جملتين، بدون حساب.
    - key: B
      title: "الجزء ب: الفائدة البسيطة والمركبة"
    - key: C
      title: "الجزء ج: القيمة المستقبلية والحالية لمبلغ واحد"
      intro: حل كل مسألة بالمعادلة، ثم تحقق بالجداول أو Excel.
    - key: D
      title: "الجزء د: مخطط التدفق النقدي والتكافؤ"
      intro: ارسم مخطط التدفق النقدي قبل أن تبدأ الحل.
    - key: E
      title: "الجزء هـ: إيجاد نسبة الفائدة وعدد السنوات"
    - key: F
      title: "الجزء و: مسائل Excel وPython"
      intro: حل هذه المسائل بجدول في Excel أو ببرنامج Python، وليس باليد.
    - key: G
      title: "الجزء ز: اختيار من متعدد"
      intro: كل خيار خاطئ في هذا الجزء مبني على خطأ يقع فيه الطلاب فعلا. إذا اخترت خيارا خاطئا، ابحث عن الخطأ في طريقتك.
    - key: H
      title: "الجزء ح: حالات مصغرة"
      intro: كل حالة تجمع أكثر من فكرة من الفصل، وبعضها يضيف فكرة جديدة. اقرأ الحالة كاملة قبل الحل.
