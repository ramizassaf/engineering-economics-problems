# ------------------------------------------------------------ 1.1 simple and compound
- id: c01-ex-simple-compound
  kind: example
  title: الفائدة البسيطة والمركبة على قرض
  vars: {P: 5000, i: 0.10}
  random: {P: [2000, 20000, 500], i: [0.04, 0.15, 0.01]}
  calc:
    - I1 = P*i
    - S = P + 3*P*i
    - B1 = P*(1+i)
    - B2 = P*(1+i)**2
    - B3 = P*(1+i)**3
    - J1 = P*i
    - J2 = B1*i
    - J3 = B2*i
    - D = B3 - S
  text: |
    اقترض شخص [[P|g]] دولار من البنك لمدة 3 سنوات بفائدة [[i|%]] سنويا. كم يدفع للبنك في نهاية السنة الثالثة إذا كانت الفائدة بسيطة؟ وكم يدفع إذا كانت مركبة؟
  solution: |
    في الفائدة البسيطة تحسب الفائدة كل سنة على المبلغ الأصلي فقط. الفائدة السنوية:

    $$
    I = [[P|g]] \times [[i|r]] = [[I1|2]]
    $$

    والمبلغ في نهاية السنة الثالثة:

    $$
    F_{simple} = [[P|g]] + 3 \times [[I1|2]] = [[S|2]]
    $$

    في الفائدة المركبة تحسب الفائدة كل سنة على الرصيد في بداية السنة، أي على المبلغ الأصلي مع الفوائد المتراكمة:

    | السنة | الرصيد في بداية السنة (دولار) | الفائدة (دولار) | الرصيد في نهاية السنة (دولار) |
    | --- | --- | --- | --- |
    | 1 | [[P|2]] | [[J1|2]] | [[B1|2]] |
    | 2 | [[B1|2]] | [[J2|2]] | [[B2|2]] |
    | 3 | [[B2|2]] | [[J3|2]] | [[B3|2]] |

    يدفع الشخص [[S|2]] دولار بالفائدة البسيطة، و[[B3|2]] دولار بالفائدة المركبة. الفرق [[D|2]] دولار، وهو فائدة على الفائدة. البنوك تعمل بالفائدة المركبة، وهي المعتمدة في باقي الكتاب.

- id: c01-ex-simple-friend
  kind: example
  title: قرض بفائدة بسيطة
  vars: {P: 3000, i: 0.06, n: 4}
  random: {P: [1000, 9000, 250], i: [0.03, 0.09, 0.005], n: [2, 6, 1]}
  calc:
    - I = P*i*n
    - F = P + I
  text: |
    اقترض صاحب ورشة [[P|g]] دولار من تاجر، على أن يرده بعد [[yrs(n)]] مع فائدة بسيطة [[i|%]] سنويا. ما مجموع الفائدة؟ وكم يدفع في النهاية؟
  solution: |
    الفائدة البسيطة لا تتراكم، فمجموعها يساوي الفائدة السنوية مضروبة في عدد السنوات:

    $$
    I = P \times i \times n = [[P|g]] \times [[i|r]] \times [[n|n]] = [[I|2]]
    $$

    $$
    F = P + I = [[P|g]] + [[I|2]] = [[F|2]]
    $$

    يدفع صاحب الورشة [[F|2]] دولار في نهاية السنة [[n|n]].

- id: c01-ex-long-run
  kind: example
  title: أثر الفائدة المركبة على المدى الطويل
  vars: {P: 1000, i: 0.08, n: 20}
  random: {P: [500, 5000, 100], i: [0.05, 0.12, 0.01], n: [15, 30, 5]}
  calc:
    - S = P*(1 + i*n)
    - F = P*FP(i, n)
    - D = F - S
    - R = F/S
  text: |
    استثمر شخص [[P|g]] دولار لمدة [[yrs(n)]] بعائد [[i|%]] سنويا. قارن المبلغ في النهاية بالفائدة البسيطة وبالفائدة المركبة.
  solution: |
    بالفائدة البسيطة:

    $$
    F_{simple} = P\,(1 + i\,n) = [[P|g]] \times (1 + [[i|r]] \times [[n|n]]) = [[S|2]]
    $$

    بالفائدة المركبة:

    $$
    F = P\,(1+i)^n = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    الفرق [[D|2]] دولار، والمبلغ بالفائدة المركبة يساوي [[R|2]] ضعف المبلغ بالفائدة البسيطة. كلما طالت المدة كبر الفرق، لأن الفائدة على الفائدة تتراكم كل سنة.

# ------------------------------------------------------------ 1.2 F/P
- id: c01-ex-fp-saving
  kind: example
  title: حساب توفير
  vars: {P: 1400, i: 0.04, n: 6}
  random: {P: [500, 9000, 100], i: [0.02, 0.09, 0.005], n: [3, 15, 1]}
  calc:
    - f = FP(i, n)
    - F = P*f
    - Ft = P*r4(f)
  text: |
    وضع شخص [[P|g]] دولار في حساب توفير بفائدة [[i|%]] سنويا. كم يصبح في الحساب بعد [[yrs(n)]]؟
  solution: |
    المعطيات:

    $$
    P = [[P|g]], \quad i = [[i|%]], \quad n = [[n|n]]
    $$

    بالمعادلة:

    $$
    F = P\,(1+i)^n = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[P|g]] \times [[f|f4]] = [[F|2]]
    $$

    بالجداول، نقرأ المعامل من صف [[i|%]] وعمود [[n|n]]:

    $$
    F = [[P|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[P|g]] \times [[f|f4]] = [[Ft|2]]
    $$

    في Excel:

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
    ```

    في Python:

    ```python
    P, i, n = [[P|r]], [[i|r]], [[n|n]]
    F = P * (1 + i) ** n
    print(round(F, 2))   # [[F|d2]]
    ```

    يصبح في الحساب [[F|2]] دولار.

- id: c01-ex-fp-equipment
  kind: example
  title: مبلغ محجوز لشراء معدات
  vars: {P: 25000, i: 0.07, n: 10}
  random: {P: [10000, 60000, 1000], i: [0.04, 0.12, 0.01], n: [5, 12, 1]}
  calc:
    - f = FP(i, n)
    - F = P*f
    - G = F - P
  text: |
    خصصت شركة مقاولات [[P|g]] دولار اليوم لشراء معدات بعد [[yrs(n)]]، واستثمرت المبلغ بعائد [[i|%]] سنويا. كم يصبح المبلغ عند الشراء؟ وكم منه أرباح استثمار؟
  solution: |
    $$
    F = [[P|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[P|g]] \times [[f|f4]] = [[F|2]]
    $$

    أرباح الاستثمار هي الفرق بين المبلغ النهائي والمبلغ الأصلي:

    $$
    [[F|2]] - [[P|g]] = [[G|2]]
    $$

    في Excel:

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
    ```

    يصبح المبلغ [[F|2]] دولار، منها [[G|2]] دولار أرباح.

- id: c01-ex-fp-price
  kind: example
  title: سعر قطعة غيار بعد سنوات
  vars: {P: 840, g: 0.05, n: 6}
  random: {P: [200, 2000, 20], g: [0.02, 0.09, 0.005], n: [3, 10, 1]}
  calc:
    - f = FP(g, n)
    - F = P*f
  text: |
    سعر قطعة غيار لآلة تعبئة اليوم [[P|g]] دولار، ويرتفع سعرها [[g|%]] كل سنة. كم يتوقع أن يكون سعرها بعد [[yrs(n)]]؟
  solution: |
    زيادة السعر بنسبة ثابتة كل سنة تتراكم مثل الفائدة المركبة، فنستخدم نفس القانون، ونضع نسبة الزيادة مكان نسبة الفائدة:

    $$
    F = [[P|g]] \times (1 + [[g|r]])^{[[n|n]]} = [[P|g]] \times [[f|f4]] = [[F|2]]
    $$

    في Excel:

    ```excel
    =FV([[g|%]], [[n|n]], 0, -[[P|r]])
    ```

    السعر المتوقع [[F|2]] دولار.

# ------------------------------------------------------------ 1.3 P/F
- id: c01-ex-pf-target
  kind: example
  title: كم تستثمر اليوم لهدف مستقبلي؟
  vars: {F: 10000, i: 0.07, n: 4}
  random: {F: [3000, 30000, 500], i: [0.03, 0.12, 0.005], n: [2, 10, 1]}
  calc:
    - f = PF(i, n)
    - P = F*f
    - Pt = F*r4(f)
  text: |
    يحتاج شخص [[F|g]] دولار بعد [[yrs(n)]]. كم يجب أن يستثمر اليوم إذا كان العائد [[i|%]] سنويا؟
  solution: |
    المجهول هنا القيمة الحالية:

    $$
    P = \frac{F}{(1+i)^n} = \frac{[[F|g]]}{(1 + [[i|r]])^{[[n|n]]}} = [[F|g]] \times [[f|f4]] = [[P|2]]
    $$

    بالجداول:

    $$
    P = [[F|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[F|g]] \times [[f|f4]] = [[Pt|2]]
    $$

    في Excel:

    ```excel
    =PV([[i|%]], [[n|n]], 0, -[[F|r]])
    ```

    في Python:

    ```python
    F, i, n = [[F|r]], [[i|r]], [[n|n]]
    P = F / (1 + i) ** n
    print(round(P, 2))   # [[P|d2]]
    ```

    يستثمر اليوم [[P|2]] دولار.

- id: c01-ex-pf-line
  kind: example
  title: تمويل خط إنتاج مستقبلي
  vars: {F: 370000, i: 0.18, n: 4}
  random: {F: [100000, 600000, 10000], i: [0.08, 0.20, 0.01], n: [2, 7, 1]}
  calc:
    - f = PF(i, n)
    - P = F*f
  text: |
    تتوقع شركة أن تحتاج [[F|g]] دولار بعد [[yrs(n)]] لشراء خط إنتاج. كم يجب أن تستثمر اليوم إذا حصلت على عائد [[i|%]] سنويا؟
  solution: |
    $$
    P = [[F|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[F|g]] \times [[f|f4]] = [[P|2]]
    $$

    في Excel:

    ```excel
    =PV([[i|%]], [[n|n]], 0, -[[F|r]])
    ```

    إذا استثمرت الشركة [[P|2]] دولار اليوم بعائد [[i|%]]، يصبح المبلغ [[F|g]] دولار في نهاية السنة [[n|n]].

- id: c01-ex-pf-offers
  kind: example
  title: مبلغ اليوم أم مبلغ أكبر لاحقا؟
  vars: {A: 12000, B: 15000, n: 3, i: 0.08}
  random: {A: [5000, 20000, 500], B: [6000, 30000, 500], n: [2, 6, 1], i: [0.04, 0.14, 0.01]}
  calc:
    - f = PF(i, n)
    - PB = B*f
    - choice = pick(PB > A, 'العرض الثاني', 'العرض الأول')
    - D = abs(PB - A)
  text: |
    عرض على مالك أرض عرضان لشرائها: [[A|g]] دولار اليوم، أو [[B|g]] دولار بعد [[yrs(n)]]. إذا كان المالك يستطيع استثمار المال بعائد [[i|%]] سنويا، أي العرضين أفضل؟
  solution: |
    لا نقارن مبلغين في سنتين مختلفتين. ننقل العرض الثاني إلى اليوم:

    $$
    P_B = [[B|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[B|g]] \times [[f|f4]] = [[PB|2]]
    $$

    العرض الأول قيمته اليوم [[A|g]] دولار، والعرض الثاني قيمته اليوم [[PB|2]] دولار. [[choice]] أفضل بفرق [[D|2]] دولار بقيمة اليوم.

    في Excel:

    ```excel
    =PV([[i|%]], [[n|n]], 0, -[[B|r]])
    ```

# ------------------------------------------------------------ 1.4 Excel signs
- id: c01-ex-excel-sign
  kind: example
  title: إشارة المبلغ في Excel
  vars: {P: 2500, i: 0.06, n: 5}
  random: {P: [1000, 9000, 100], i: [0.03, 0.10, 0.01], n: [3, 9, 1]}
  calc:
    - F = P*FP(i, n)
  text: |
    كتب طالب الصيغة التالية لحساب القيمة المستقبلية لمبلغ [[P|g]] دولار بعد [[yrs(n)]] بفائدة [[i|%]]:

    ```excel
    =FV([[i|%]], [[n|n]], 0, [[P|r]])
    ```

    فظهر له الجواب سالبا وبلون أحمر. هل الجواب خطأ؟
  solution: |
    الرقم صحيح، والإشارة فقط معكوسة. Excel يتعامل مع المسألة كحركة نقدية بين طرفين: إذا أدخلت المبلغ موجبا، فهو يعتبره مالا دخل إليك اليوم، فيكون الجواب مالا يخرج منك في المستقبل، أي سالبا.

    لكي يظهر الجواب موجبا، اكتب المبلغ بإشارة سالبة، لأنه مال خرج منك إلى الاستثمار:

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[P|r]])
    ```

    والجواب في الحالتين قيمته [[F|2]] دولار.

# ------------------------------------------------------------ 1.6 cash flow diagram
- id: c01-ex-cfd-two-deposits
  kind: example
  title: مبلغان في سنتين مختلفتين
  vars: {A: 1000, B: 1200, t: 4, n: 7, i: 0.05}
  random: {A: [500, 5000, 100], B: [500, 5000, 100], t: [2, 5, 1], n: [6, 10, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - f1 = FP(i, n)
    - f2 = FP(i, n - t)
    - F1 = A*f1
    - F2 = B*f2
    - F = F1 + F2
    - Ft = A*r4(f1) + B*r4(f2)
  diagram:
    n: n
    i: "i = [[i|%]]"
    flows: [[0, -A], [t, -B], [n, "A+B", "F = ?"]]
  diagram_caption: "مخطط التدفق النقدي: استثماران وقيمة مستقبلية في السنة [[n|n]]"
  text: |
    استثمر شخص [[A|g]] دولار اليوم، ثم استثمر [[B|g]] دولار في نهاية السنة [[t|n]]. كم يصبح لديه في نهاية السنة [[n|n]] إذا كان العائد [[i|%]] سنويا؟
  solution: |
    القاعدة: لا تجمع مبلغين في سنتين مختلفتين. انقل كل مبلغ إلى السنة [[n|n]] أولا، ثم اجمع.

    المبلغ الأول يبقى [[yrs(n)]] في الاستثمار:

    $$
    F_1 = [[A|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[A|g]] \times [[f1|f4]] = [[F1|2]]
    $$

    والمبلغ الثاني يبقى [[yrs(n-t)]]:

    $$
    F_2 = [[B|g]]\,(F/P,\ [[i|%]],\ [[n-t|n]]) = [[B|g]] \times [[f2|f4]] = [[F2|2]]
    $$

    $$
    F = F_1 + F_2 = [[F|2]]
    $$

    في Excel نطبق الدالة مرتين في نفس الخلية:

    ```excel
    =FV([[i|%]], [[n|n]], 0, -[[A|r]]) + FV([[i|%]], [[n-t|n]], 0, -[[B|r]])
    ```

    يصبح لديه [[F|2]] دولار. إذا استخدمت معاملات الجداول المقربة لأربع خانات، تحصل على [[Ft|2]] دولار، والفرق سببه التقريب.

- id: c01-ex-pv-several
  kind: example
  title: القيمة الحالية لعدة مبالغ
  vars: {A: 4000, B: 6000, C: 9000, i: 0.09}
  random: {A: [1000, 8000, 500], B: [1000, 9000, 500], C: [2000, 12000, 500], i: [0.05, 0.14, 0.01]}
  calc:
    - f1 = PF(i, 1)
    - f3 = PF(i, 3)
    - f5 = PF(i, 5)
    - P1 = A*f1
    - P3 = B*f3
    - P5 = C*f5
    - P = P1 + P3 + P5
  diagram:
    n: 5
    i: "i = [[i|%]]"
    flows: [[0, "-(A+B+C)/2", "P = ?"], [1, A], [3, B], [5, C]]
  text: |
    يتوقع مصنع أن يحصل على [[A|g]] دولار في نهاية السنة 1، و[[B|g]] دولار في نهاية السنة 3، و[[C|g]] دولار في نهاية السنة 5. ما القيمة الحالية لهذه المبالغ إذا كانت الفائدة [[i|%]] سنويا؟
  solution: |
    ننقل كل مبلغ إلى السنة 0 وحده، ثم نجمع:

    $$
    P = [[A|g]]\,(P/F,\ [[i|%]],\ 1) + [[B|g]]\,(P/F,\ [[i|%]],\ 3) + [[C|g]]\,(P/F,\ [[i|%]],\ 5)
    $$

    $$
    P = [[A|g]]([[f1|f4]]) + [[B|g]]([[f3|f4]]) + [[C|g]]([[f5|f4]])
    $$

    $$
    P = [[P1|2]] + [[P3|2]] + [[P5|2]] = [[P|2]]
    $$

    في Excel:

    ```excel
    =PV([[i|%]], 1, 0, -[[A|r]]) + PV([[i|%]], 3, 0, -[[B|r]]) + PV([[i|%]], 5, 0, -[[C|r]])
    ```

    القيمة الحالية [[P|2]] دولار.

# ------------------------------------------------------------ 1.7 equivalence
- id: c01-ex-loan-second
  kind: example
  title: أكبر قرض إضافي
  vars: {L: 5000, t: 2, n: 5, R: 10000, i: 0.03}
  random: {L: [2000, 8000, 500], t: [1, 3, 1], n: [4, 7, 1], R: [10000, 16000, 500], i: [0.02, 0.08, 0.005]}
  calc:
    - f1 = FP(i, t)
    - f2 = PF(i, n - t)
    - a = L*f1
    - b = R*f2
    - x = b - a
  diagram:
    n: n
    i: "i = [[i|%]]"
    flows: [[0, L], [t, "L*0.6", "x = ?"], [n, -R]]
  text: |
    اقترض شخص [[L|g]] دولار بفائدة [[i|%]] سنويا. في نهاية السنة [[t|n]] احتاج مبلغا إضافيا، فوافق البنك على قرض ثان، بشرط أن يسدد كل الدين بدفعة واحدة قدرها [[R|g]] دولار في نهاية السنة [[n|n]]. ما أكبر مبلغ يستطيع اقتراضه في السنة [[t|n]]؟
  solution: |
    نختار السنة [[t|n]] للمقارنة، لأن المجهول يقع فيها. ما استلمه الشخص يجب أن يكافئ ما سيدفعه. القرض الأول ينتقل للأمام [[yrs(t)]]، والدفعة النهائية تنتقل للخلف [[yrs(n-t)]]:

    $$
    [[L|g]]\,(F/P,\ [[i|%]],\ [[t|n]]) + x = [[R|g]]\,(P/F,\ [[i|%]],\ [[n-t|n]])
    $$

    $$
    [[L|g]] \times [[f1|f4]] + x = [[R|g]] \times [[f2|f4]]
    $$

    $$
    x = [[b|2]] - [[a|2]] = [[x|2]]
    $$

    في Excel:

    ```excel
    =PV([[i|%]], [[n-t|n]], 0, -[[R|r]]) - FV([[i|%]], [[t|n]], 0, -[[L|r]])
    ```

    يستطيع الشخص اقتراض [[x|2]] دولار إضافية في نهاية السنة [[t|n]].

- id: c01-ex-equiv-table
  kind: example
  title: تكافؤ تدفقات مشروع في سنة واحدة
  vars: {a0: -500, a1: -250, a2: -125, a5: -125, a6: -175, i: 0.10}
  random: {a0: [-900, -300, 50], a1: [-500, -100, 25], a2: [-300, -50, 25], a5: [-300, -50, 25], a6: [-400, -100, 25], i: [0.05, 0.14, 0.01]}
  calc:
    - v0 = a0*FP(i, 2)
    - v1 = a1*FP(i, 1)
    - v5 = a5*PF(i, 3)
    - v6 = a6*PF(i, 4)
    - P2 = v0 + v1 + a2 + v5 + v6
    - P5 = P2*FP(i, 3)
    - w0 = a0*FP(i, 5)
    - w1 = a1*FP(i, 4)
    - w2 = a2*FP(i, 3)
    - w6 = a6*PF(i, 1)
  text: |
    الجدول التالي يعرض تكاليف مشروع بالدولار، ونسبة الفائدة [[i|%]]. (أ) احسب القيمة المكافئة لكل التكاليف في السنة 2. (ب) احسب القيمة المكافئة في السنة 5 باستخدام Excel.

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
    | --- | --- | --- | --- | --- | --- | --- | --- |
    | التدفق (دولار) | [[a0|g]] | [[a1|g]] | [[a2|g]] | 0 | 0 | [[a5|g]] | [[a6|g]] |
  solution: |
    (أ) السنتان 0 و1 تنتقلان للأمام، والسنتان 5 و6 تنتقلان للخلف، وتدفق السنة 2 يبقى كما هو:

    $$
    P_2 = [[a0|g]](F/P,[[i|%]],2) + [[a1|g]](F/P,[[i|%]],1) + [[a2|g]] + [[a5|g]](P/F,[[i|%]],3) + [[a6|g]](P/F,[[i|%]],4)
    $$

    $$
    P_2 = [[v0|2]] + [[v1|2]] + [[a2|2]] + [[v5|2]] + [[v6|2]] = [[P2|2]]
    $$

    (ب) في Excel، اكتب السنوات في الصف 1 من العمود B إلى العمود H، والتدفقات في الصف 2. في الخلية B3 اكتب الصيغة التالية، ثم اسحبها لليمين حتى الخلية H3:

    ```excel
    =FV([[i|%]], 5-B1, 0, -B2)
    ```

    الجزء الثاني من الصيغة يحسب عدد السنوات بين سنة التدفق والسنة 5. للسنة 6 يصبح سالبا، وExcel يفهم العدد السالب نقلا للخلف. ثم اجمع الصف 3:

    ```excel
    =SUM(B3:H3)
    ```

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
    | --- | --- | --- | --- | --- | --- | --- | --- |
    | القيمة في السنة 5 | [[w0|2]] | [[w1|2]] | [[w2|2]] | 0 | 0 | [[a5|2]] | [[w6|2]] |

    المجموع [[P5|2]] دولار.

    تحقق من الجوابين: نقل جواب (أ) من السنة 2 إلى السنة 5 يجب أن يعطي جواب (ب):

    $$
    [[P2|2]] \times (F/P,\ [[i|%]],\ 3) = [[P5|2]]
    $$

    هذا الاختبار مفيد لكل مسائل التكافؤ.

- id: c01-ex-two-payments
  kind: example
  title: سداد قرض بدفعتين
  vars: {L: 60000, t1: 2, t2: 5, i: 0.07}
  random: {L: [20000, 120000, 5000], t1: [1, 3, 1], t2: [4, 8, 1], i: [0.04, 0.12, 0.005]}
  calc:
    - f1 = PF(i, t1)
    - f2 = PF(i, t2)
    - X = L/(0.5*f1 + f2)
    - H = X/2
  diagram:
    n: t2
    i: "i = [[i|%]]"
    flows: [[0, L], [t1, "-L*0.35", "X/2"], [t2, "-L*0.7", "X"]]
  text: |
    اقترض مهندس [[L|g]] دولار بفائدة [[i|%]] سنويا، ويريد سداده بدفعتين: الأولى في نهاية السنة [[t1|n]]، والثانية في نهاية السنة [[t2|n]]. الدفعة الأولى تساوي نصف الثانية. أوجد الدفعتين.
  solution: |
    نسمي الدفعة الثانية X، فتكون الأولى X/2. نختار السنة 0 للمقارنة: القيمة الحالية للدفعتين تساوي مبلغ القرض.

    $$
    [[L|g]] = \frac{X}{2}\,(P/F,\ [[i|%]],\ [[t1|n]]) + X\,(P/F,\ [[i|%]],\ [[t2|n]])
    $$

    $$
    [[L|g]] = X\,(0.5 \times [[f1|f4]] + [[f2|f4]])
    $$

    $$
    X = [[X|2]], \qquad \frac{X}{2} = [[H|2]]
    $$

    في Python نكتب المعادلة كما هي:

    ```python
    L, i = [[L|r]], [[i|r]]
    X = L / (0.5 / (1 + i) ** [[t1|n]] + 1 / (1 + i) ** [[t2|n]])
    print(round(X / 2, 2), round(X, 2))
    ```

    الدفعة الأولى [[H|2]] دولار، والثانية [[X|2]] دولار.

- id: c01-ex-any-year
  kind: example
  title: سنة المقارنة لا تغير القرار
  vars: {A: 20000, B: 27000, n: 4, i: 0.06}
  random: {A: [10000, 30000, 1000], B: [11000, 42000, 1000], n: [3, 6, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - PB = B*PF(i, n)
    - FA_ = A*FP(i, n)
    - best = pick(PB > A, 'الدفعة المؤجلة', 'الدفعة الفورية')
  text: |
    تعويض تأمين يمكن استلامه بطريقتين: [[A|g]] دولار اليوم، أو [[B|g]] دولار بعد [[yrs(n)]]. الفائدة [[i|%]]. قارن الطريقتين في السنة 0، ثم في السنة [[n|n]].
  solution: |
    المقارنة في السنة 0:

    $$
    [[A|g]] \quad \text{vs} \quad [[B|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[PB|2]]
    $$

    المقارنة في السنة [[n|n]]:

    $$
    [[A|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[FA_|2]] \quad \text{vs} \quad [[B|g]]
    $$

    في الحالتين [[best]] أفضل. اختيار سنة المقارنة يغير الأرقام، لكنه لا يغير القرار، لأن كل الأرقام تضرب في نفس المعامل.

# ------------------------------------------------------------ 1.8 find i and n
- id: c01-ex-find-i
  kind: example
  title: إيجاد نسبة العائد
  vars: {P: 1000, F: 1500, n: 5}
  random: {P: [1000, 20000, 500], F: [1500, 45000, 500], n: [3, 12, 1]}
  calc:
    - F = max(F, P*1.15)
    - i = (F/P)**(1/n) - 1
  text: |
    استثمر شخص [[P|g]] دولار فأصبحت [[F|g]] دولار بعد [[yrs(n)]]. ما نسبة العائد السنوية؟
  solution: |
    نحل قانون القيمة المستقبلية لإيجاد نسبة الفائدة:

    $$
    i = \left(\frac{F}{P}\right)^{1/n} - 1 = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

    في Excel:

    ```excel
    =RATE([[n|n]], 0, -[[P|r]], [[F|r]])
    ```

    نسبة العائد [[i|%2]] سنويا.

- id: c01-ex-double
  kind: example
  title: متى يتضاعف المبلغ؟
  vars: {i: 0.08}
  random: {i: [0.03, 0.15, 0.005]}
  calc:
    - n = ln(2)/ln(1+i)
    - r72 = 72/(i*100)
    - e = r72 - n
  text: |
    كم سنة يحتاج المبلغ ليتضاعف إذا كانت الفائدة [[i|%]] سنويا؟ قارن الجواب بقاعدة 72.
  solution: |
    المبلغ يتضاعف عندما تصبح القيمة المستقبلية ضعف القيمة الحالية، فنحل:

    $$
    2 = (1 + i)^n \quad\Rightarrow\quad n = \frac{\ln 2}{\ln(1+i)} = \frac{0.6931}{\ln([[1+i|r]])} = [[n|2]]
    $$

    في Excel:

    ```excel
    =NPER([[i|%]], 0, -1, 2)
    ```

    قاعدة 72 تقول إن عدد سنوات التضاعف يساوي تقريبا 72 مقسومة على نسبة الفائدة بالمئة:

    $$
    n \approx \frac{72}{[[i*100|g]]} = [[r72|2]]
    $$

    القاعدة أعطت [[r72|2]] سنة، والجواب الدقيق [[n|2]] سنة. القاعدة تقريبية، ودقتها جيدة بين 4% و15%.

- id: c01-ex-find-n
  kind: example
  title: كم سنة حتى نصل إلى الهدف؟
  vars: {P: 5000, F: 8000, i: 0.06}
  random: {P: [2000, 10000, 500], F: [3000, 25000, 500], i: [0.03, 0.12, 0.005]}
  calc:
    - F = max(F, P*1.2)
    - n = ln(F/P)/ln(1+i)
    - k = ceil(n)
    - Fk = P*FP(i, k)
  text: |
    لدى طالب [[P|g]] دولار، ويريد أن يصبح المبلغ [[F|g]] دولار. كم سنة يحتاج إذا استثمره بعائد [[i|%]] سنويا؟
  solution: |
    $$
    n = \frac{\ln(F/P)}{\ln(1+i)} = \frac{\ln([[F|g]] / [[P|g]])}{\ln([[1+i|r]])} = [[n|2]]
    $$

    في Excel:

    ```excel
    =NPER([[i|%]], 0, -[[P|r]], [[F|r]])
    ```

    الفوائد تضاف في نهاية كل سنة، فيصل الطالب إلى هدفه في نهاية السنة [[k|n]]، ويكون في الحساب عندها [[Fk|2]] دولار.
