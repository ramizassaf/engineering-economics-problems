items:

- id: c01-g-01
  kind: mcq
  part: G
  vars: {P: 5000, i: 0.08, n: 5}
  random: {P: [1000, 10000, 500], i: [0.04, 0.12, 0.01], n: [3, 8, 1]}
  calc:
    - F = P*FP(i, n)
    - S = P*(1 + i*n)
    - W = P*PF(i, n)
    - L = P*(1 + i)*n
  text: ما قيمة [[P|g]] دولار بعد [[yrs(n)]] بفائدة مركبة [[i|%]]؟
  options: ["[[S|2]] دولار", "[[F|2]] دولار", "[[W|2]] دولار", "[[L|2]] دولار"]
  correct: 1
  solution: |
    $$
    F = [[P|g]] \times (1 + [[i|r]])^{[[n|n]]} = [[F|2]]
    $$

    الخيار (أ) فائدة بسيطة، والخيار (ج) نقل المبلغ للخلف بدل الأمام، والخيار (د) ضرب في عدد السنوات بدل الأس.

- id: c01-g-02
  kind: mcq
  part: G
  vars: {F: 10000, i: 0.07, n: 4}
  random: {F: [2000, 20000, 500], i: [0.04, 0.12, 0.01], n: [3, 8, 1]}
  calc:
    - P = F*PF(i, n)
    - W = F*FP(i, n)
    - S = F/(1 + i*n)
    - L = F*(1 - i*n)
  text: ما القيمة الحالية لمبلغ [[F|g]] دولار بعد [[yrs(n)]] بنسبة [[i|%]]؟
  options: ["[[W|2]] دولار", "[[L|2]] دولار", "[[P|2]] دولار", "[[S|2]] دولار"]
  correct: 2
  solution: |
    $$
    P = [[F|g]] \times (1 + [[i|r]])^{-[[n|n]]} = [[P|2]]
    $$

    الخيار (أ) أكبر من المبلغ نفسه، وهذا مستحيل لقيمة حالية. الخياران (ب) و(د) يستخدمان الفائدة البسيطة.

- id: c01-g-03
  kind: mcq
  part: G
  text: |
    أي الصيغ التالية تعطي القيمة المستقبلية لمبلغ 2000 دولار بعد 5 سنوات بنسبة 6% بإشارة موجبة؟

    ```excel
    1:  =FV(6%, 5, 0, 2000)
    2:  =FV(6%, 5, 0, -2000)
    3:  =FV(5, 6%, 0, -2000)
    4:  =FV(6%, 5, -2000)
    ```
  options: ["الصيغة 1", "الصيغة 2", "الصيغة 3", "الصيغة 4"]
  correct: 1
  solution: الصيغة 1 تعطي الجواب سالبا. الصيغة 3 تبدل ترتيب النسبة والسنوات. الصيغة 4 تضع المبلغ في مدخل الدفعة السنوية، فتحسب شيئا آخر.

- id: c01-g-04
  kind: mcq
  part: G
  vars: {i: 0.09}
  random: {i: [0.04, 0.15, 0.01]}
  calc:
    - n = ln(2)/ln(1+i)
    - w1 = 1/i
    - w2 = 72*i
    - w3 = 2/i
  text: كم سنة تقريبا يحتاج المبلغ ليتضاعف بنسبة [[i|%]]؟
  options: ["[[w1|2]] سنة", "[[w3|2]] سنة", "[[n|2]] سنة", "[[w2|2]] سنة"]
  correct: 2
  solution: |
    $$
    n = \frac{\ln 2}{\ln(1 + [[i|r]])} = [[n|2]]
    $$

    الخيار (أ) جواب الفائدة البسيطة. الخيار (د) ضرب في 72 بدل القسمة.

- id: c01-g-05
  kind: mcq
  part: G
  text: |
    نقل طالب مبلغا 3000 دولار من السنة 6 إلى السنة 2 بنسبة 8%. أي معامل يستخدم؟

    $$
    \text{(1)}\ (F/P,\ 8\%,\ 4) \qquad \text{(2)}\ (P/F,\ 8\%,\ 6) \qquad \text{(3)}\ (P/F,\ 8\%,\ 4) \qquad \text{(4)}\ (P/F,\ 8\%,\ 2)
    $$
  options: ["المعامل 1", "المعامل 2", "المعامل 3", "المعامل 4"]
  correct: 2
  solution: النقل من السنة 6 إلى السنة 2 نقل للخلف 4 سنوات، فنستخدم المعامل P/F بأربع سنوات. المعامل 2 ينقل إلى السنة 0، والمعامل 1 ينقل للأمام.

- id: c01-g-06
  kind: mcq
  part: G
  vars: {A: 1000, B: 1000, i: 0.10}
  random: {A: [500, 5000, 100], B: [500, 5000, 100], i: [0.05, 0.15, 0.01]}
  calc:
    - F = A*FP(i, 5) + B*FP(i, 2)
    - W = A + B
    - X = (A + B)*FP(i, 5)
    - Y = (A + B)*FP(i, 2)
  text: أودع شخص [[A|g]] دولار اليوم و[[B|g]] دولار في نهاية السنة 3. ما الرصيد في نهاية السنة 5 بنسبة [[i|%]]؟
  options: ["[[X|2]] دولار", "[[F|2]] دولار", "[[Y|2]] دولار", "[[W|2]] دولار"]
  correct: 1
  solution: |
    $$
    F = [[A|g]](F/P,[[i|%]],5) + [[B|g]](F/P,[[i|%]],2) = [[F|2]]
    $$

    الخياران (أ) و(ج) جمعا المبلغين قبل نقلهما. الخيار (د) تجاهل الفائدة.

- id: c01-g-07
  kind: mcq
  part: G
  text: أي العبارات التالية صحيحة دائما ما دامت نسبة الفائدة موجبة؟
  options: ["معامل القيمة الحالية P/F أكبر من 1", "معامل القيمة المستقبلية F/P يقل كلما زاد عدد السنوات", "معامل القيمة الحالية P/F يقل كلما زادت نسبة الفائدة", "معامل القيمة المستقبلية ضعف معامل القيمة الحالية"]
  correct: 2
  solution: كلما زادت نسبة الفائدة قلت القيمة الحالية لأي مبلغ مستقبلي. المعامل P/F دائما أقل من 1، والمعامل F/P يزيد مع زيادة عدد السنوات.

- id: c01-g-08
  kind: mcq
  part: G
  vars: {P: 4000, F: 6000, n: 5}
  random: {P: [1000, 10000, 500], F: [1500, 25000, 500], n: [3, 10, 1]}
  calc:
    - F = max(F, P*1.2)
    - i = (F/P)**(1/n) - 1
    - s = (F - P)/(P*n)
    - w = (F/P - 1)
  text: مبلغ [[P|g]] دولار أصبح [[F|g]] دولار بعد [[yrs(n)]]. ما نسبة العائد السنوية المركبة؟
  options: ["[[s|%2]]", "[[w|%2]]", "[[i|%2]]", "[[s*2|%2]]"]
  correct: 2
  solution: |
    $$
    i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[i|%2]]
    $$

    الخيار (أ) نسبة بسيطة، والخيار (ب) الزيادة الكلية وليست سنوية.

- id: c01-g-09
  kind: mcq
  part: G
  text: في مخطط التدفق النقدي لقرض من وجهة نظر المقترض، أين يقع السهم الذي يمثل مبلغ القرض؟
  options: ["للأسفل في السنة 0", "للأعلى في السنة 0", "للأعلى في السنة الأخيرة", "للأسفل في السنة الأخيرة"]
  correct: 1
  solution: المقترض يستلم مبلغ القرض في السنة 0، فهو مال داخل إليه، ويرسم بسهم للأعلى. الأقساط اللاحقة تخرج منه وترسم للأسفل.

- id: c01-g-10
  kind: mcq
  part: G
  vars: {A: 12000, B: 15000, n: 3, i: 0.08}
  calc:
    - PB = B*PF(i, n)
  text: عرض أول [[A|g]] دولار اليوم، وعرض ثان [[B|g]] دولار بعد [[yrs(n)]]. بنسبة [[i|%]]، أي العرضين أفضل؟
  options: ["العرض الأول، لأن قيمة العرض الثاني اليوم [[PB|2]] دولار", "العرض الثاني، لأن قيمته اليوم [[PB|2]] دولار"]
  correct: 0
  solution: |
    $$
    [[B|g]] \times (1 + [[i|r]])^{-[[n|n]]} = [[PB|2]]
    $$

    قارن [[PB|2]] دولار بمبلغ [[A|g]] دولار: العرض صاحب القيمة الأكبر اليوم هو الأفضل.
