items:

- id: c01-a-01
  kind: concept
  part: A
  text: |
    لماذا تساوي 1000 دينار اليوم أكثر من 1000 دينار بعد سنة، حتى لو لم يكن هناك تضخم؟
  solution: |
    لأنك تستطيع استثمار المبلغ اليوم والحصول على فائدة، فيصبح بعد سنة أكثر من 1000 دينار. الفرق هو قيمة المال الزمنية، ويوجد حتى لو بقيت الأسعار ثابتة.

- id: c01-a-02
  kind: concept
  part: A
  text: |
    ما الفرق بين الفائدة البسيطة والفائدة المركبة؟ أيهما تستخدمه البنوك؟
  solution: |
    الفائدة البسيطة تحسب كل سنة على المبلغ الأصلي فقط، والفائدة المركبة تحسب على المبلغ الأصلي مع الفوائد المتراكمة. البنوك والمشاريع تستخدم الفائدة المركبة.

- id: c01-a-03
  kind: concept
  part: A
  text: |
    مبلغ استثمر لمدة سنة واحدة. هل يختلف الجواب بين الفائدة البسيطة والمركبة؟ لماذا؟
  solution: |
    لا يختلف. في السنة الأولى تحسب الفائدة في الطريقتين على المبلغ الأصلي فقط، لأنه لا توجد فوائد متراكمة بعد. الفرق يبدأ من السنة الثانية.

- id: c01-a-04
  kind: concept
  part: A
  text: |
    ماذا يعني الرمز التالي بالكلمات؟ هل قيمته أكبر من 1 أم أصغر؟

    $$
    (P/F,\ 8\%,\ 5)
    $$
  solution: |
    هو المعامل الذي يحول مبلغا في نهاية السنة 5 إلى قيمته في السنة 0 بفائدة 8%. قيمته أصغر من 1، لأن نقل المال للخلف في الزمن يصغره. قيمته 0.6806.

- id: c01-a-05
  kind: concept
  part: A
  text: |
    طالب نقل مبلغ 5000 دينار من السنة 6 إلى السنة 0 فحصل على 6200 دينار. كيف تعرف أن جوابه خطأ بدون أن تحسب؟
  solution: |
    نقل المال للخلف في الزمن يصغره دائما ما دامت الفائدة موجبة. القيمة الحالية يجب أن تكون أقل من 5000 دينار، فجوابه خطأ. الأرجح أنه ضرب في المعامل F/P بدل P/F.

- id: c01-a-06
  kind: concept
  part: A
  text: |
    في مخطط التدفق النقدي، ماذا يعني سهم للأسفل في السنة 3؟ وماذا يعني سهم للأعلى؟
  solution: |
    السهم للأسفل مبلغ يخرج منك في نهاية السنة 3، مثل قسط أو تكلفة. السهم للأعلى مبلغ يدخل إليك، مثل إيراد أو قرض تستلمه.

- id: c01-a-07
  kind: concept
  part: A
  text: |
    لماذا لا يجوز جمع 1000 دينار في السنة 2 و1000 دينار في السنة 5 مباشرة؟
  solution: |
    لأن الدينار في السنة 2 لا يساوي الدينار في السنة 5. يجب نقل المبلغين إلى نفس السنة بنسبة الفائدة أولا، ثم الجمع.

- id: c01-a-08
  kind: concept
  part: A
  text: |
    في مسألة تكافؤ، هل يتغير القرار إذا قارنت البدائل في السنة 0 بدل السنة 10؟
  solution: |
    لا يتغير. كل القيم تنتقل بنفس المعامل من سنة إلى أخرى، فتتغير الأرقام لكن ترتيب البدائل يبقى نفسه.

- id: c01-a-09
  kind: concept
  part: A
  text: |
    كتب طالب في Excel الصيغة التالية فظهر الجواب سالبا. ما السبب، وكيف يصلحه؟

    ```excel
    =FV(6%, 10, 0, 2000)
    ```
  solution: |
    الجواب صحيح لكن إشارته معكوسة. Excel يعتبر المبلغ الموجب مالا يدخل إلى الطالب، فيكون الجواب مالا يخرج منه. يكتب المبلغ سالبا:

    ```excel
    =FV(6%, 10, 0, -2000)
    ```

- id: c01-a-10
  kind: concept
  part: A
  text: |
    ما قاعدة 72؟ ومتى تكون غير دقيقة؟
  solution: |
    عدد السنوات التي يحتاجها المبلغ ليتضاعف يساوي تقريبا 72 مقسومة على نسبة الفائدة بالمئة. هي تقريبية، ودقتها جيدة بين 4% و15%، وتقل دقتها عند النسب الصغيرة جدا أو الكبيرة جدا.
