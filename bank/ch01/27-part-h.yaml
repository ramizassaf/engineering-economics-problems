- id: c01-h-01
  kind: case
  part: H
  vars: {L: 4000, i1: 0.05, i2: 0.08}
  calc:
    - B4 = L*(FP(i1, 4) + FP(i1, 3) + FP(i1, 2) + FP(i1, 1))
    - X6 = B4*FP(i2, 2)
    - p5 = B4*FP(i2, 1)
    - Y = B4/(0.5*PF(i2, 1) + PF(i2, 3))
    - H = Y/2
    - V6 = X6*PF(i2, 6)
    - Vb = (H*PF(i2, 5) + Y*PF(i2, 7))
    - M = (FP(i1, 4)*FP(i2, 2))**(1/6) - 1
  text: |
    **حالة 1.1: قرض دراسة بفترة سماح**

    اقترضت سارة من صندوق إقراض الطلبة [[L|g]] دينار في بداية كل سنة دراسية من سنوات دراستها الأربع، أي في السنوات 0 و1 و2 و3. الصندوق يحسب فائدة [[i1|%]] سنويا أثناء الدراسة. عند التخرج في نهاية السنة 4 ترتفع الفائدة إلى [[i2|%]] سنويا. عرض عليها الصندوق طريقتين للسداد:

    - الطريقة الأولى: دفعة واحدة في نهاية السنة 6.
    - الطريقة الثانية: دفعتان، الأولى في نهاية السنة 5 والثانية في نهاية السنة 7، والأولى نصف الثانية.

    (أ) ارسم مخطط التدفق النقدي. (ب) ما رصيد الدين عند التخرج؟ (ج) ما الدفعة في الطريقة الأولى؟ (د) ما الدفعتان في الطريقة الثانية؟ (هـ) سارة تستطيع استثمار مالها بعائد [[i2|%]] أيضا. هل تختلف الطريقتان بالنسبة لها؟ (و) ما متوسط النسبة السنوية التي دفعتها على القرض في الطريقة الأولى؟
  solution: |
    (أ) أربعة أسهم للأعلى بقيمة [[L|g]] دينار في السنوات 0 إلى 3، وفي الطريقة الأولى سهم للأسفل في السنة 6، وفي الطريقة الثانية سهمان للأسفل في السنتين 5 و7.

    (ب) كل قرض يتراكم بنسبة [[i1|%]] حتى السنة 4. القرض الأول يبقى 4 سنوات، والأخير سنة واحدة:

    $$
    B_4 = [[L|g]]\,[(1.05)^4 + (1.05)^3 + (1.05)^2 + (1.05)^1] = [[B4|2]]
    $$

    (ج) بعد التخرج ترتفع النسبة، فينتقل الرصيد سنتين بنسبة [[i2|%]]:

    $$
    X = [[B4|2]] \times (1 + [[i2|r]])^2 = [[X6|2]]
    $$

    (د) نختار السنة 4 للمقارنة، لأن النسبة تتغير فيها:

    $$
    [[B4|2]] = \frac{Y}{2}\,(P/F,\ [[i2|%]],\ 1) + Y\,(P/F,\ [[i2|%]],\ 3)
    $$

    $$
    Y = [[Y|2]], \qquad \frac{Y}{2} = [[H|2]]
    $$

    (هـ) الطريقتان متكافئتان بنسبة [[i2|%]]، لأن كلا منهما يكافئ رصيد الدين عند التخرج بهذه النسبة. القيمة الحالية لكل منهما في السنة 4 تساوي [[B4|2]] دينار. إذا كان عائد سارة أعلى من [[i2|%]]، فالطريقة الثانية أفضل لها لأنها تؤخر جزءا أكبر من المال. وإذا كان أقل، فالأولى أفضل.

    (و) ضرب معاملات السنوات المختلفة يعطي المعامل الكلي. المتوسط السنوي الذي يعطي نفس المعامل على 6 سنوات هو المتوسط الهندسي:

    $$
    \bar{i} = \left[(1.05)^4 \times (1.08)^2\right]^{1/6} - 1 = [[M|%2]]
    $$

    هذا المتوسط ليس المتوسط الحسابي للنسبتين. هذه الفكرة تعود في فصل التضخم.

- id: c01-h-02
  kind: case
  part: H
  vars: {A: 100000, B0: 40000, B3: 75000}
  calc:
    - v6 = B0 + B3*PF(0.06, 3)
    - v10 = B0 + B3*PF(0.10, 3)
    - r = (B3/(A - B0))**(1/3) - 1
    - v6c = A + 0
    - g6 = v6 - A
    - g10 = v10 - A
  text: |
    **حالة 1.2: عرضان لشراء أرض في نابلس**

    يملك خالد قطعة أرض، وتلقى عرضين لشرائها:

    - العرض أ: 100,000 دينار نقدا اليوم.
    - العرض ب: 40,000 دينار اليوم، و75,000 دينار بعد 3 سنوات.

    (أ) خالد يستطيع استثمار المال بعائد 6% سنويا. أي العرضين أفضل له؟ (ب) أعد الحل بعائد 10%. (ج) عند أي عائد يتساوى العرضان؟ (د) خالد يقول إن العرض ب أفضل لأن مجموعه 115,000 دينار. ما الخطأ في كلامه؟ (هـ) ما المخاطرة التي يتحملها خالد في العرض ب ولا تظهر في الحساب؟
  solution: |
    (أ) بعائد 6%:

    $$
    P_B = 40{,}000 + 75{,}000\,(P/F,\ 6\%,\ 3) = [[v6|2]]
    $$

    العرض ب أفضل بفرق [[g6|2]] دينار.

    (ب) بعائد 10%:

    $$
    P_B = 40{,}000 + 75{,}000\,(P/F,\ 10\%,\ 3) = [[v10|2]]
    $$

    العرض أ أفضل الآن، والعرض ب أقل منه بـ [[abs(g10)|2]] دينار.

    (ج) يتساوى العرضان عندما تساوي القيمة الحالية للعرض ب 100,000 دينار، أي عندما تكافئ 75,000 دينار بعد 3 سنوات مبلغ 60,000 دينار اليوم:

    $$
    60{,}000\,(1 + i)^3 = 75{,}000 \quad\Rightarrow\quad i = \left(\frac{75{,}000}{60{,}000}\right)^{1/3} - 1 = [[r|%2]]
    $$

    في Excel:

    ```excel
    =RATE(3, 0, -60000, 75000)
    ```

    هذه النسبة تسمى نسبة التعادل، وتعود في فصل معدل العائد الداخلي. إذا كان عائد خالد أقل من [[r|%2]] فالعرض ب أفضل، وإذا كان أعلى فالعرض أ أفضل.

    (د) جمع مبالغ في سنوات مختلفة بدون نقلها إلى نفس السنة. 75,000 دينار بعد 3 سنوات لا تساوي 75,000 دينار اليوم.

    (هـ) أن المشتري لا يدفع الدفعة الثانية في موعدها أو لا يدفعها أبدا. الحساب يفترض أن المبلغ مضمون. إذا كانت هناك مخاطرة، يستخدم خالد نسبة أعلى لخصم الدفعة المؤجلة، فيزيد ميله إلى العرض أ.

- id: c01-h-03
  kind: case
  part: H
  vars: {P: 20000, F: 50000}
  calc:
    - F10 = P*FP(0.05, 4)*FP(0.07, 6)
    - g = (FP(0.05, 4)*FP(0.07, 6))**(1/10) - 1
    - a = (4*0.05 + 6*0.07)/10
    - Fa = P*FP(a, 10)
    - PV = F*PF(0.07, 6)*PF(0.05, 4)
    - PVa = F*PF(a, 10)
    - Fs = P*FP(0.07, 6)*FP(0.05, 4)
  text: |
    **حالة 1.3: صندوق ادخار بنسبة تتغير**

    أودعت نقابة المهندسين 20,000 دينار في صندوق ادخار لأحد أعضائها. الصندوق أعطى 5% سنويا في السنوات الأربع الأولى، ثم 7% سنويا في السنوات الست التالية.

    (أ) ما رصيد الصندوق بعد 10 سنوات؟ (ب) ما النسبة السنوية الثابتة التي تعطي نفس الرصيد؟ (ج) زميل حسب متوسط النسبة بأخذ متوسط النسبتين مرجحا بعدد السنوات. ما المتوسط الذي حسبه؟ وما الرصيد الذي يعطيه؟ لماذا يختلف؟ (د) على الصندوق التزام بدفع 50,000 دينار بعد 10 سنوات. ما القيمة الحالية لهذا الالتزام بنفس جدول النسب؟ (هـ) هل يتغير رصيد السنة 10 لو جاءت النسبة 7% أولا ثم 5%؟
  solution: |
    (أ) نضرب في معامل كل فترة بنسبتها:

    $$
    F_{10} = 20{,}000 \times (1.05)^4 \times (1.07)^6 = [[F10|2]]
    $$

    (ب) النسبة الثابتة هي المتوسط الهندسي:

    $$
    \bar{i} = \left[(1.05)^4 \times (1.07)^6\right]^{1/10} - 1 = [[g|%2]]
    $$

    (ج) المتوسط المرجح:

    $$
    \frac{4 \times 5\% + 6 \times 7\%}{10} = [[a|%2]]
    $$

    ويعطي رصيدا [[Fa|2]] دينار، أكثر من الرصيد الصحيح بـ [[Fa-F10|2]] دينار. المتوسط الحسابي يبالغ قليلا، لأن النسب تتراكم بالضرب وليس بالجمع.

    (د) ننقل الالتزام للخلف فترة بعد فترة، كل فترة بنسبتها:

    $$
    P = 50{,}000 \times (1.07)^{-6} \times (1.05)^{-4} = [[PV|2]]
    $$

    لو استخدمنا المتوسط المرجح لحصلنا على [[PVa|2]] دينار.

    (هـ) لا يتغير، لأن الضرب تبديلي:

    $$
    20{,}000 \times (1.07)^6 \times (1.05)^4 = [[Fs|2]]
    $$

    لكن الرصيد في السنوات الوسطى يختلف. مثلا رصيد السنة 4 أعلى إذا جاءت النسبة 7% أولا.
