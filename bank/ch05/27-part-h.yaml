- id: c05-h-01
  kind: problem
  part: H
  vars: {B: 50000, S: 5000, n: 5}
  random: {B: [10000, 100000, 1000], S: [0, 10000, 500], n: [3, 10, 1]}
  calc:
    - D = (B - S)/n
    - T = n*(n + 1)/2
    - y1 = n/T*(B - S)
  text: |
    ابن في Excel جدولا يقارن الاستهلاك السنوي بالطرق SLN وSYD وDDB وVDB لأصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]. ما استهلاك السنة الأولى بالقسط الثابت ومجموع أرقام السنوات؟
  solution: |
    السنوات في العمود A من A2، ثم في B2 وC2 وD2 وE2:

    ```excel
    =SLN([[B|r]], [[S|r]], [[n|n]])
    =SYD([[B|r]], [[S|r]], [[n|n]], A2)
    =DDB([[B|r]], [[S|r]], [[n|n]], A2)
    =VDB([[B|r]], [[S|r]], [[n|n]], A2-1, A2)
    ```

    القسط الثابت [[D|2]] دينار، ومجموع أرقام السنوات في السنة الأولى [[y1|2]] دينار.

- id: c05-h-02
  kind: problem
  part: H
  vars: {B: 50000, S: 5000}
  random: {B: [20000, 100000, 1000], S: [0, 8000, 500]}
  calc:
    - D1 = 0.4*B
    - b1 = B - D1
    - D2 = 0.4*b1
    - b2 = b1 - D2
    - D3 = max(0.4*b2, (b2 - S)/3)
  text: |
    اكتب في Python دالة تبني جدول القسط المتناقص المضاعف مع التحول إلى القسط الثابت، وجربها على أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره 5 سنوات.
  solution: |
    ```python
    def ddb_switch(B, S, n):
        d, bv, rows = 2 / n, B, []
        for t in range(1, n + 1):
            dep = max(d * bv, (bv - S) / (n - t + 1))
            dep = min(dep, bv - S)
            bv -= dep
            rows.append((t, round(dep, 2), round(bv, 2)))
        return rows

    for row in ddb_switch([[B|r]], [[S|r]], 5):
        print(row)
    ```

    أول ثلاث سنوات: [[D1|2]] ثم [[D2|2]] ثم [[D3|2]] دينار.

- id: c05-h-03
  kind: problem
  part: H
  vars: {B: 100000, t: 0.20}
  random: {B: [20000, 200000, 5000], t: [0.10, 0.30, 0.01]}
  calc:
    - s5 = t*(B/5)*PA(0.05, 5)
    - s10 = t*(B/5)*PA(0.10, 5)
    - s15 = t*(B/5)*PA(0.15, 5)
  text: |
    ابن في Excel جدولا يبين القيمة الحالية للوفر الضريبي من استهلاك أصل أساسه [[B|g]] دينار بالقسط الثابت على 5 سنوات، بضريبة [[t|%]]، عند النسب 5% و10% و15%.
  solution: |
    ```excel
    =PV(A2, 5, -[[t|%]]*SLN([[B|r]], 0, 5))
    ```

    | النسبة | القيمة الحالية للوفر |
    | --- | --- |
    | 5% | [[s5|2]] |
    | 10% | [[s10|2]] |
    | 15% | [[s15|2]] |

- id: c05-h-04
  kind: problem
  part: H
  vars: {R: 150000, O: 70000, B: 120000, t: 0.20}
  random: {R: [80000, 250000, 5000], O: [20000, 100000, 5000], B: [40000, 200000, 5000], t: [0.10, 0.30, 0.01]}
  calc:
    - D = B/5
    - T = t*(R - O - D)
    - CF = R - O - T
  text: |
    ابن في Excel قائمة دخل لخمس سنوات لمشروع إيراده [[R|g]] دينار، وتكاليفه [[O|g]] دينار، ومعداته [[B|g]] دينار تستهلك بالقسط الثابت على 5 سنوات. نسبة الضريبة [[t|%]]. ما التدفق النقدي السنوي بعد الضريبة؟
  solution: |
    الصفوف: الإيراد، التكاليف، الاستهلاك، الدخل الخاضع، الضريبة، صافي الربح، ثم التدفق النقدي يساوي صافي الربح زائد الاستهلاك.

    ```excel
    =(B2 - B3 - B4) * [[t|%]]
    ```

    التدفق النقدي [[CF|2]] دينار كل سنة.

- id: c05-h-05
  kind: problem
  part: H
  vars: {O: 300000, A1: 50000, A2: 80000, A3: 30000}
  random: {O: [100000, 500000, 10000], A1: [0, 100000, 5000], A2: [0, 100000, 5000], A3: [0, 100000, 5000]}
  calc:
    - b1 = O + A1
    - D1 = 0.25*b1
    - b2 = b1 - D1 + A2
    - D2 = 0.25*b2
    - b3 = b2 - D2 + A3
    - D3 = 0.25*b3
  text: |
    اكتب في Python برنامجا يتابع رصيد مجموعة آلات بنسبة 25% لثلاث سنوات. الرصيد الأول [[O|g]] دينار، والمشتريات [[A1|g]] ثم [[A2|g]] ثم [[A3|g]] دينار، بدون مبيعات.
  solution: |
    ```python
    balance, rate = [[O|r]], 0.25
    for year, add in enumerate([ [[A1|r]], [[A2|r]], [[A3|r]] ], start=1):
        balance += add
        dep = rate * balance
        balance -= dep
        print(year, round(dep, 2), round(balance, 2))
    ```

    الاستهلاك [[D1|2]] ثم [[D2|2]] ثم [[D3|2]] دينار.

- id: c05-h-06
