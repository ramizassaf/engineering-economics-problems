  text: |
    استخدم الدالة DB لحساب استهلاك أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره 4 سنوات. ما النسبة؟ وما استهلاك السنة الأولى؟
  solution: |
    ```excel
    =DB([[B|r]], [[S|r]], 4, 1)
    ```

    النسبة المقربة [[r|f4]]، واستهلاك السنة الأولى [[D1|2]] دينار.

- id: c05-h-07
  kind: problem
  part: H
  vars: {B: 60000, n: 6, M: 20000, t: 0.20}
  random: {B: [20000, 120000, 1000], n: [4, 10, 1], M: [5000, 50000, 1000], t: [0.10, 0.30, 0.01]}
  calc:
    - BV3 = B - 3*B/n
    - net = M - t*(M - BV3)
  text: |
    اكتب في Excel صيغة واحدة تحسب صافي البيع بعد الضريبة لآلة أساسها [[B|g]] دينار، تستهلك بالقسط الثابت على [[yrs(n)]]، وبيعت بعد 3 سنوات بمبلغ [[M|g]] دينار، بضريبة [[t|%]].
  solution: |
    ```excel
    =[[M|r]] - [[t|%]]*([[M|r]] - ([[B|r]] - 3*SLN([[B|r]], 0, [[n|n]])))
    ```

    النتيجة [[net|2]] دينار.

- id: c05-h-08
  kind: problem
  part: H
  calc:
    - T4 = 0.15*25000
  text: |
    اكتب في Python دالة تحسب الضريبة كل سنة مع ترحيل الخسائر لخمس سنوات. جربها على النتائج -40,000 ثم 15,000 و20,000 و30,000 و35,000، بنسبة 15%.
  solution: |
    ```python
    def taxes(profits, rate, years=5):
        losses, out = [], []
        for year, p in enumerate(profits):
            losses = [(y, l) for y, l in losses if year - y <= years]
            if p < 0:
                losses.append((year, -p))
                out.append(0)
                continue
            taxable = p
            kept = []
            for y, l in losses:
                use = min(l, taxable)
                taxable -= use
                if l - use > 0:
                    kept.append((y, l - use))
            losses = kept
            out.append(round(rate * taxable, 2))
        return out

    print(taxes([-40000, 15000, 20000, 30000, 35000], 0.15))
    ```

    الضريبة 0 و0 و0 و[[T4|2]] و5,250 دينار، كما في مثال ترحيل الخسائر.

- id: c05-h-09
  kind: problem
  part: H
  vars: {B: 80000, t: 0.20, i: 0.10}
  random: {B: [20000, 150000, 5000], t: [0.10, 0.30, 0.01], i: [0.05, 0.14, 0.01]}
  calc:
    - a = t*B*(0.25*PF(i, 1) + 0.1875*PF(i, 2) + 0.140625*PF(i, 3) + 0.10546875*PF(i, 4) + 0.0791015625*PF(i, 5) + 0.059326171875*PF(i, 6) + 0.04449462890625*PF(i, 7) + 0.0333709716796875*PF(i, 8) + 0.025028228759765625*PF(i, 9) + 0.018771171569824219*PF(i, 10))
    - b = t*B/10*PA(i, 10)
  text: |
    قارن في Python القيمة الحالية للوفر الضريبي لأول 10 سنوات لأصل أساسه [[B|g]] دينار: بطريقة المجموعة بنسبة 25%، وبالقسط الثابت على 10 سنوات. الضريبة [[t|%]] والنسبة [[i|%]].
  solution: |
    ```python
    B, t, i = [[B|r]], [[t|r]], [[i|r]]
    pool = sum(t * B * 0.25 * 0.75 ** (k - 1) / (1 + i) ** k for k in range(1, 11))
    sl = sum(t * B / 10 / (1 + i) ** k for k in range(1, 11))
    print(round(pool, 2), round(sl, 2))
    ```

    المجموعة [[a|2]] دينار، والقسط الثابت [[b|2]] دينار.

