items:

- id: c05-e-01
  kind: problem
  part: E
  vars: {B: 48000, n: 6}
  random: {B: [10000, 100000, 1000], n: [3, 10, 1]}
  calc:
    - D = B/n
  text: |
    معدات أساسها [[B|g]] دينار، وعمرها [[yrs(n)]] بدون قيمة مقدرة. وزع الاستهلاك بالقسط الثابت مع قاعدة نصف السنة.
  solution: |
    القسط الكامل [[D|2]] دينار. في السنة الأولى نصفه [[D/2|2]] دينار، ثم [[D|2]] دينار في السنوات من 2 إلى [[n|n]]، ثم [[D/2|2]] دينار في السنة [[n+1|n]].

- id: c05-e-02
  kind: problem
  part: E
  vars: {B: 48000, n: 6, i: 0.10}
  random: {B: [10000, 100000, 1000], n: [3, 10, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - D = B/n
    - full = D*PA(i, n)
    - half = D/2*PF(i, 1) + D*PA(i, n - 1)*PF(i, 1) + D/2*PF(i, n + 1)
  text: |
    للمعدات السابقة: كم تخسر الشركة من القيمة الحالية للاستهلاك بنسبة [[i|%]] بسبب قاعدة نصف السنة؟
  solution: |
    بدون القاعدة:

    $$
    [[D|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[full|2]]
    $$

    مع القاعدة:

    $$
    [[D/2|2]]\,(P/F,\ [[i|%]],\ 1) + [[D|2]]\,(P/A,\ [[i|%]],\ [[n-1|n]])\,(P/F,\ [[i|%]],\ 1) + [[D/2|2]]\,(P/F,\ [[i|%]],\ [[n+1|n]]) = [[half|2]]
    $$

    الفرق [[full-half|2]] دينار.

- id: c05-e-03
  kind: problem
  part: E
  vars: {B: 36000, n: 4, m: 9}
  random: {B: [10000, 80000, 1000], n: [3, 8, 1], m: [1, 12, 1]}
  calc:
    - D = B/n
    - D1 = pick(m <= 6, D, D/2)
  text: |
    قانون ضريبة ينص على أن الأصل الذي يدخل الخدمة في النصف الأول من السنة يستهلك عن سنة كاملة، والذي يدخل في النصف الثاني يستهلك عن نصف سنة. شركة اشترت معدات بمبلغ [[B|g]] دينار في الشهر [[m|n]]، وعمرها [[yrs(n)]]. ما استهلاك السنة الأولى بالقسط الثابت؟
  solution: |
    الشهر [[m|n]] في النصف [[pick(m <= 6, 'الأول', 'الثاني')]] من السنة، فالاستهلاك عن [[pick(m <= 6, 'سنة كاملة', 'نصف سنة')]]:

    $$
    D_1 = [[D1|2]]
    $$

- id: c05-e-04
  kind: problem
  part: E
  vars: {O: 150000, A: 40000, X: 10000}
  random: {O: [50000, 300000, 5000], A: [0, 80000, 5000], X: [0, 30000, 1000]}
  calc:
    - base = O + A - X
    - D = 0.25*base
    - C = base - D
  text: |
    مجموعة آلات رصيدها في بداية السنة [[O|g]] دينار. أضيفت آلات بمبلغ [[A|g]] دينار، وبيعت آلات بمبلغ [[X|g]] دينار. النسبة 25% على الرصيد. ما الاستهلاك ورصيد نهاية السنة؟
  solution: |
    $$
    [[O|g]] + [[A|g]] - [[X|g]] = [[base|g]]
    $$

    $$
    D = 0.25 \times [[base|g]] = [[D|2]], \qquad C = [[C|2]]
    $$

- id: c05-e-05
  kind: problem
  part: E
  vars: {O: 150000, A: 40000, X: 10000}
  random: {O: [50000, 300000, 5000], A: [0, 80000, 5000], X: [0, 30000, 1000]}
  calc:
    - base = O + 0.5*(A - X)
    - D = 0.25*base
    - C = O + A - X - D
  text: |
    أعد المسألة السابقة إذا كان القانون يضيف نصف المشتريات ويطرح نصف المبيعات فقط في سنتها، والنصف الآخر في السنة التالية.
  solution: |
    الرصيد الذي تطبق عليه النسبة:

    $$
    [[O|g]] + 0.5 \times ([[A|g]] - [[X|g]]) = [[base|2]]
    $$

    $$
    D = 0.25 \times [[base|2]] = [[D|2]]
    $$

    رصيد نهاية السنة يشمل كامل المشتريات والمبيعات، لأن النصف الثاني يدخل حساب السنة التالية:

    $$
    [[O|g]] + [[A|g]] - [[X|g]] - [[D|2]] = [[C|2]]
    $$

- id: c05-e-06
  kind: problem
  part: E
  vars: {B: 100000, d: 0.25}
  random: {B: [20000, 200000, 5000], d: [0.10, 0.25, 0.05]}
  calc:
    - D1 = d*B
    - D2 = d*(B - D1)
    - D3 = d*(B - D1 - D2)
  text: |
    شركة جديدة اشترت معدات بمبلغ [[B|g]] دينار، ولا تملك أصولا أخرى في المجموعة. النسبة [[d|%]] على الرصيد. ما استهلاك أول ثلاث سنوات إذا لم تشتر أو تبع شيئا؟
  solution: |
    $$
    D_1 = [[D1|2]], \qquad D_2 = [[D2|2]], \qquad D_3 = [[D3|2]]
    $$

    مجموعة فيها أصل واحد تتصرف تماما مثل القسط المتناقص.

- id: c05-e-07
  kind: problem
  part: E
  vars: {O: 20000, X: 35000}
  random: {O: [5000, 50000, 1000], X: [10000, 80000, 1000]}
  calc:
    - X = max(X, O + 5000)
    - E = X - O
  text: |
    مجموعة آلات رصيدها [[O|g]] دينار. باعت الشركة آلات قديمة بمبلغ [[X|g]] دينار، أكثر من الرصيد كله. ماذا يحدث؟
  solution: |
    الرصيد لا يكون سالبا. الزيادة [[E|g]] دينار تعني أن الاستهلاك الذي نزل سابقا كان أكثر من النقص الحقيقي في قيمة الآلات. أغلب القوانين تعامل هذه الزيادة كدخل خاضع للضريبة في سنة البيع، ويصبح رصيد المجموعة صفرا.

- id: c05-e-08
  kind: problem
  part: E
  vars: {B: 60000, n: 5}
  random: {B: [20000, 120000, 1000], n: [3, 8, 1]}
  calc:
    - D = B/n
    - D1 = D/2
    - BVn = B - D/2 - (n - 1)*D
  text: |
    معدات أساسها [[B|g]] دينار، وعمرها [[yrs(n)]]، تستهلك بالقسط الثابت مع قاعدة نصف السنة. ما القيمة الدفترية في نهاية السنة [[n|n]]؟
  solution: |
    حتى نهاية السنة [[n|n]] نزل نصف قسط ثم [[n-1|n]] قسطا كاملا:

    $$
    BV = [[B|g]] - [[D1|2]] - [[n-1|n]] \times [[D|2]] = [[BVn|2]]
    $$

    الباقي ينزل في السنة [[n+1|n]].

- id: c05-e-09
  kind: problem
  part: E
  vars: {B: 25000, f: 3}
  random: {B: [5000, 60000, 1000], f: [2, 3, 1]}
  calc:
    - r = 0.20
    - D = r*f*B
  text: |
    قانون ضريبة يحدد للآلات نسبة 20% بالقسط الثابت، ويسمح للمكلف بزيادتها حتى ثلاثة أمثالها بشرط الثبات على النسبة. شركة اختارت [[f|n]] أمثال النسبة لآلات أساسها [[B|g]] دينار. ما الاستهلاك السنوي؟ وكم سنة تستغرق؟
  solution: |
    النسبة [[f*0.2|%]]، فالاستهلاك [[D|2]] دينار سنويا، وتستهلك الآلات في [[pick(f == 3, 'أقل من سنتين: سنة كاملة بنسبة 60% ثم 40% في السنة الثانية', 'سنتين ونصف: 40% في كل من أول سنتين ثم 20% في الثالثة')]].

- id: c05-e-10
  kind: problem
  part: E
  vars: {B: 50000, i: 0.10, t: 0.20}
  random: {B: [10000, 100000, 1000], i: [0.05, 0.15, 0.01], t: [0.15, 0.30, 0.01]}
  calc:
    - sl = t*(B/5)*PA(i, 5)
    - pl = t*(0.25*B*PF(i, 1) + 0.1875*B*PF(i, 2) + 0.140625*B*PF(i, 3) + 0.10546875*B*PF(i, 4) + 0.0791015625*B*PF(i, 5))
  text: |
    قارن القيمة الحالية للوفر الضريبي لمدة 5 سنوات بنسبة [[i|%]] وضريبة [[t|%]] لآلة أساسها [[B|g]] دينار: بالقسط الثابت 20%، وبطريقة المجموعة بنسبة 25%.
  solution: |
    بالقسط الثابت، الوفر [[t*B/5|2]] دينار كل سنة:

    $$
    P = [[sl|2]]
    $$

    بالمجموعة 25%: الاستهلاك 25% ثم 18.75% ثم 14.06% ثم 10.55% ثم 7.91% من الأساس:

    $$
    P = [[pl|2]]
    $$

    طريقة المجموعة لا تنتهي في 5 سنوات: يبقى [[B*0.75**5|2]] دينار في الرصيد يستهلك بعدها. الجواب لأول 5 سنوات فقط.
