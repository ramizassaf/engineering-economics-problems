- id: c05-j-01
  kind: case
  part: J
  calc:
    - B = 150000 + 6000 + 9000
    - Dsl = B/6
    - D1 = max(B/3, B/6)
    - b1 = B - D1
    - D2 = max(b1/3, b1/5)
    - b2 = b1 - D2
    - D3 = max(b2/3, b2/4)
    - b3 = b2 - D3
    - D4 = max(b3/3, b3/3)
    - b4 = b3 - D4
    - D5 = max(b4/3, b4/2)
    - b5 = b4 - D5
    - D6 = b5
    - Psl = 0.15*Dsl*PA(0.10, 6)
    - Pdd = 0.15*(D1*PF(0.10, 1) + D2*PF(0.10, 2) + D3*PF(0.10, 3) + D4*PF(0.10, 4) + D5*PF(0.10, 5) + D6*PF(0.10, 6))
  text: |
    **حالة 5.1: خط إنتاج جديد في مصنع أدوية**

    مصنع أدوية اشترى خط تعبئة بسعر 150,000 دينار، ونقله 6,000 وتركيبه 9,000 دينار. عمره 6 سنوات بدون قيمة مقدرة. نسبة الضريبة 15%، والحد الأدنى للعائد 10%.

    (أ) ما أساس الاستهلاك؟ (ب) ابن جدول الاستهلاك بالقسط الثابت، ثم بالمتناقص المضاعف مع التحول. (ج) ما القيمة الحالية للوفر الضريبي بكل طريقة؟ (د) المحاسب يقول إن الطريقتين تعطيان نفس الوفر لأن المجموع واحد. هل هذا صحيح؟
  solution: |
    (أ)

    $$
    B = 150{,}000 + 6{,}000 + 9{,}000 = [[B|g]]
    $$

    (ب) القسط الثابت [[Dsl|2]] دينار كل سنة. المتناقص المضاعف بنسبة الثلث مع التحول:

    | السنة | 1 | 2 | 3 | 4 | 5 | 6 |
    | --- | --- | --- | --- | --- | --- | --- |
    | الاستهلاك | [[D1|0]] | [[D2|0]] | [[D3|0]] | [[D4|0]] | [[D5|0]] | [[D6|0]] |

    (ج) القسط الثابت [[Psl|2]] دينار، والمتناقص المضاعف [[Pdd|2]] دينار.

    (د) المجموع واحد، [[0.15*B|2]] دينار، لكن القيمة الحالية تختلف بمقدار [[Pdd-Psl|2]] دينار. التوقيت له قيمة.

- id: c05-j-02
  kind: case
  part: J
  calc:
    - B = 90000
    - BV = 90000 - 4*90000/8
    - G = 52000 - BV
    - T = 0.20*G
    - net = 52000 - T
    - Bn = 130000
    - s1 = 0.20*Bn/8
  text: |
    **حالة 5.2: استبدال رافعة شوكية**

    شركة لوجستية اشترت رافعة شوكية قبل 4 سنوات بمبلغ 90,000 دينار، وتستهلكها بالقسط الثابت على 8 سنوات بدون قيمة مقدرة. عرض عليها وكيل رافعة كهربائية جديدة بسعر 130,000 دينار، ويشتري القديمة بمبلغ 52,000 دينار. نسبة الضريبة 20%.

    (أ) ما القيمة الدفترية للرافعة القديمة؟ (ب) ما الربح الضريبي من بيعها؟ (ج) كم يبقى للشركة من ثمن البيع بعد الضريبة؟ (د) إذا استهلكت الجديدة بالقسط الثابت على 8 سنوات، ما الوفر الضريبي السنوي منها؟ (هـ) لماذا يجب أن يدخل صافي البيع، وليس ثمنه، في قرار الاستبدال؟
  solution: |
    (أ)

    $$
    BV = 90{,}000 - 4 \times 11{,}250 = [[BV|g]]
    $$

    (ب)

    $$
    G = 52{,}000 - [[BV|g]] = [[G|g]]
    $$

    (ج)

    $$
    52{,}000 - 0.20 \times [[G|g]] = [[net|g]]
    $$

    (د)

    $$
    0.20 \times \frac{130{,}000}{8} = [[s1|2]]
    $$

    (هـ) لأن الشركة لا تحتفظ بكامل ثمن البيع: جزء منه يذهب ضريبة على الربح. المال المتاح فعلا لتمويل الجديدة هو صافي البيع. الفصل التالي يبني على هذا لتحليل قرار الاستبدال كاملا بعد الضريبة.

- id: c05-j-03
  kind: case
  part: J
  calc:
    - T4 = 0.15*(70000 - 50000)
    - T5 = 0.15*90000
    - T6 = 0.15*90000
    - T4b = 0.15*(70000 - 17500)
    - T5b = 0.15*(90000 - 22500)
    - T6b = 0.15*(90000 - 22500)
  text: |
    **حالة 5.3: مشروع جديد وقواعد ترحيل مختلفة**

    مصنع جديد يتوقع النتائج التالية قبل الضريبة، بالدينار، لست سنوات: -60,000 ثم -20,000 ثم 30,000 ثم 70,000 ثم 90,000 ثم 90,000. نسبة الضريبة 15%. قارن الضريبة في كل سنة بين قانونين:

    - القانون الأول يرحل الخسارة خمس سنوات بدون حد سنوي.
    - القانون الثاني يرحل بدون حد زمني، لكن لا يطرح في أي سنة أكثر من 25% من ربحها.

    (أ) ابن جدول الضريبة لكل قانون. (ب) أي القانونين أفضل لهذا المصنع؟ (ج) متى يكون القانون الثاني أفضل؟
  solution: |
    (أ) مجموع الخسارة 80,000 دينار.

    القانون الأول: في السنة 3 تستخدم 30,000، ويبقى 50,000. في السنة 4 تستخدم 50,000، فالدخل الخاضع 20,000 والضريبة [[T4|2]]. في السنتين 5 و6 الضريبة [[T5|2]] دينار في كل منهما.

    القانون الثاني: في السنة 3 تستخدم 25% من 30,000، أي 7,500، ويبقى 72,500، والضريبة على 22,500 هي 3,375 دينار. في السنة 4 تستخدم 17,500، والضريبة [[T4b|2]]. في السنتين 5 و6 تستخدم 22,500 في كل منهما، والضريبة [[T5b|2]] دينار في كل منهما، ويبقى 10,000 دينار بعد السنة 6.

    | السنة | 3 | 4 | 5 | 6 |
    | --- | --- | --- | --- | --- |
    | القانون الأول | 0 | [[T4|0]] | [[T5|0]] | [[T6|0]] |
    | القانون الثاني | 3,375 | [[T4b|0]] | [[T5b|0]] | [[T6b|0]] |

    (ب) القانون الأول أفضل لهذا المصنع، لأنه يستخدم الخسارة أسرع، والأرباح تأتي قبل انتهاء السنوات الخمس.

    (ج) القانون الثاني أفضل لمشروع تطول خسائره، أو تأتي أرباحه بعد أكثر من خمس سنوات، لأن الخسارة لا تضيع.
