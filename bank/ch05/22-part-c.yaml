items:

- id: c05-c-01
  kind: problem
  part: C
  vars: {B: 40000, n: 5}
  random: {B: [10000, 90000, 1000], n: [4, 10, 1]}
  calc:
    - d = 2/n
    - D1 = d*B
    - D2 = d*(B - D1)
  text: |
    أصل أساسه [[B|g]] دينار، وعمره [[yrs(n)]]. ما نسبة القسط المتناقص المضاعف؟ وما استهلاك أول سنتين؟
  solution: |
    $$
    d = \frac{2}{[[n|n]]} = [[d|%2]]
    $$

    $$
    D_1 = [[d|r]] \times [[B|g]] = [[D1|2]], \qquad D_2 = [[d|r]] \times [[B-D1|2]] = [[D2|2]]
    $$

- id: c05-c-02
  kind: problem
  part: C
  vars: {B: 40000, n: 5, k: 3}
  random: {B: [10000, 90000, 1000], n: [4, 10, 1], k: [2, 4, 1]}
  calc:
    - d = 2/n
    - BV = B*(1 - d)**k
  text: |
    للأصل السابق، ما القيمة الدفترية بعد [[yrs(k)]] بالقسط المتناقص المضاعف، بدون تحول؟
  solution: |
    كل سنة تبقى نسبة ثابتة من القيمة:

    $$
    BV_{[[k|n]]} = I(1 - d)^{[[k|n]]} = [[B|g]] \times [[1-d|r]]^{[[k|n]]} = [[BV|2]]
    $$

- id: c05-c-03
  kind: problem
  part: C
  vars: {B: 40000, n: 5, k: 3}
  random: {B: [10000, 90000, 1000], n: [4, 10, 1], k: [2, 4, 1]}
  calc:
    - d = 2/n
    - Dk = B*d*(1 - d)**(k - 1)
  text: |
    للأصل السابق، ما استهلاك السنة [[k|n]] وحدها، بالقسط المتناقص المضاعف؟
  solution: |
    $$
    D_{[[k|n]]} = d\,I\,(1 - d)^{[[k-1|n]]} = [[Dk|2]]
    $$

    ```excel
    =DDB([[B|r]], 0, [[n|n]], [[k|n]])
    ```

- id: c05-c-04
  kind: problem
  part: C
  vars: {B: 30000, d: 0.25}
  random: {B: [10000, 80000, 1000], d: [0.15, 0.35, 0.05]}
  calc:
    - D1 = d*B
    - b1 = B - D1
    - D2 = d*b1
    - b2 = b1 - D2
    - D3 = d*b2
    - b3 = b2 - D3
  text: |
    قانون ضريبة يسمح بالقسط المتناقص بنسبة [[d|%]] لمعدات أساسها [[B|g]] دينار. ابن جدول أول ثلاث سنوات.
  solution: |
    | السنة | البداية | الاستهلاك | النهاية |
    | --- | --- | --- | --- |
    | 1 | [[B|2]] | [[D1|2]] | [[b1|2]] |
    | 2 | [[b1|2]] | [[D2|2]] | [[b2|2]] |
    | 3 | [[b2|2]] | [[D3|2]] | [[b3|2]] |

- id: c05-c-05
  kind: problem
  part: C
  vars: {B: 30000, d: 0.25}
  random: {B: [10000, 80000, 1000], d: [0.15, 0.35, 0.05]}
  calc:
    - n = ln(0.1)/ln(1 - d)
  text: |
    بالقسط المتناقص بنسبة [[d|%]]، بعد كم سنة تنزل القيمة الدفترية لأصل أساسه [[B|g]] دينار إلى 10% من أساسه؟
  solution: |
    $$
    (1 - [[d|r]])^n = 0.10 \quad\Rightarrow\quad n = \frac{\ln 0.10}{\ln [[1-d|r]]} = [[n|2]]
    $$

    القسط المتناقص يطول كثيرا قبل أن يقترب من الصفر، ولا يصل إليه أبدا.

- id: c05-c-06
  kind: problem
  part: C
  vars: {B: 60000, S: 6000}
  random: {B: [20000, 120000, 1000], S: [0, 12000, 500]}
  calc:
    - S = min(S, floor(0.3*B/500)*500)
    - D1 = 0.4*B
    - b1 = B - D1
    - D2 = 0.4*b1
    - b2 = b1 - D2
    - D3 = min(0.4*b2, b2 - S)
    - b3 = b2 - D3
    - D4 = max(min(0.4*b3, b3 - S), 0)
    - b4 = b3 - D4
    - D5 = max(min(0.4*b4, b4 - S), 0)
    - b5 = b4 - D5
  text: |
    سيارة توصيل أساسها [[B|g]] دينار، وعمرها 5 سنوات، وقيمتها المقدرة [[S|g]] دينار. ابن جدول القسط المتناقص المضاعف، بحيث لا تنزل القيمة الدفترية تحت القيمة المقدرة.
  solution: |
    | السنة | الاستهلاك | القيمة الدفترية |
    | --- | --- | --- |
    | 1 | [[D1|2]] | [[b1|2]] |
    | 2 | [[D2|2]] | [[b2|2]] |
    | 3 | [[D3|2]] | [[b3|2]] |
    | 4 | [[D4|2]] | [[b4|2]] |
    | 5 | [[D5|2]] | [[b5|2]] |

    عندما يكون الاستهلاك المحسوب أكبر مما يبقى فوق القيمة المقدرة، نأخذ الباقي فقط.

- id: c05-c-07
  kind: problem
  part: C
  vars: {B: 60000, S: 0}
  random: {B: [20000, 120000, 1000]}
  calc:
    - D1 = max(0.4*B, B/5)
    - b1 = B - D1
    - D2 = max(0.4*b1, b1/4)
    - b2 = b1 - D2
    - D3 = max(0.4*b2, b2/3)
    - b3 = b2 - D3
    - D4 = max(0.4*b3, b3/2)
    - b4 = b3 - D4
    - D5 = b4
  text: |
    أصل أساسه [[B|g]] دينار، وعمره 5 سنوات بدون قيمة مقدرة. ابن جدول القسط المتناقص المضاعف مع التحول إلى القسط الثابت. في أي سنة يحدث التحول؟
  solution: |
    | السنة | المتناقص | الثابت للباقي | الاستهلاك |
    | --- | --- | --- | --- |
    | 1 | [[0.4*B|2]] | [[B/5|2]] | [[D1|2]] |
    | 2 | [[0.4*b1|2]] | [[b1/4|2]] | [[D2|2]] |
    | 3 | [[0.4*b2|2]] | [[b2/3|2]] | [[D3|2]] |
    | 4 | [[0.4*b3|2]] | [[b3/2|2]] | [[D4|2]] |
    | 5 | | [[b4|2]] | [[D5|2]] |

    التحول في السنة 4: الثابت للباقي يصبح أكبر من المتناقص لأول مرة.

- id: c05-c-08
  kind: problem
  part: C
  vars: {B: 80000, S: 8000, n: 8}
  random: {B: [20000, 150000, 1000], S: [0, 15000, 500], n: [4, 10, 1]}
  calc:
    - d = 1.5/n
    - D1 = d*B
    - D2 = d*(B - D1)
  text: |
    بعض القوانين تستخدم القسط المتناقص بنسبة 150% من نسبة القسط الثابت. ما النسبة لأصل عمره [[yrs(n)]]؟ وما استهلاك أول سنتين لأصل أساسه [[B|g]] دينار؟
  solution: |
    $$
    d = \frac{1.5}{[[n|n]]} = [[d|%2]]
    $$

    $$
    D_1 = [[D1|2]], \qquad D_2 = [[D2|2]]
    $$

    ```excel
    =DDB([[B|r]], [[S|r]], [[n|n]], 1, 1.5)
    ```

    المدخل الأخير في الدالة DDB يحدد مضاعف النسبة، والقيمة الافتراضية 2.

- id: c05-c-09
  kind: problem
  part: C
  vars: {B: 50000, i: 0.10}
  random: {B: [20000, 120000, 1000], i: [0.05, 0.15, 0.01]}
  calc:
    - sl = (B/5)*PA(i, 5)
    - dd = 0.4*B*PF(i, 1) + 0.24*B*PF(i, 2) + 0.144*B*PF(i, 3) + 0.108*B*PF(i, 4) + 0.108*B*PF(i, 5)
  text: |
    قارن القيمة الحالية للاستهلاك بنسبة [[i|%]] لأصل أساسه [[B|g]] دينار وعمره 5 سنوات بدون قيمة مقدرة: بالقسط الثابت، وبالمتناقص المضاعف مع التحول.
  solution: |
    القسط الثابت [[B/5|2]] دينار كل سنة:

    $$
    P_{SL} = [[sl|2]]
    $$

    المتناقص المضاعف مع التحول: 40% ثم 24% ثم 14.4% ثم 10.8% و10.8% من الأساس:

    $$
    P_{DDB} = [[dd|2]]
    $$

    الفرق [[dd-sl|2]] دينار لصالح الطريقة السريعة.

- id: c05-c-10
  kind: problem
  part: C
  vars: {B: 20000, n: 4, S: 2000}
  random: {B: [5000, 30000, 500], n: [3, 8, 1], S: [2000, 4000, 250]}
  calc:
    - d = 1 - (S/B)**(1/n)
  text: |
    ما النسبة الثابتة للقسط المتناقص التي تجعل القيمة الدفترية لأصل أساسه [[B|g]] دينار تساوي قيمته المقدرة [[S|g]] دينار بالضبط بعد [[yrs(n)]]؟ لماذا لا تصلح إذا كانت القيمة المقدرة صفرا؟
  solution: |
    $$
    I(1 - d)^n = S \quad\Rightarrow\quad d = 1 - \left(\frac{S}{I}\right)^{1/n}
    $$

    النسبة [[d|%2]]. إذا كانت القيمة المقدرة صفرا فالنسبة 100%، أي يستهلك الأصل كاملا في السنة الأولى، لأن القسط المتناقص لا يصل إلى الصفر بأي نسبة أقل. هذه فكرة الدالة DB في Excel.

- id: c05-c-11
  kind: problem
  part: C
  vars: {B: 30000, d: 0.25, k: 4}
  random: {B: [10000, 80000, 1000], d: [0.15, 0.35, 0.05], k: [2, 5, 1]}
  calc:
    - S = B*(1 - (1 - d)**k)
  text: |
    بالقسط المتناقص بنسبة [[d|%]]، ما مجموع الاستهلاك خلال أول [[yrs(k)]] لأصل أساسه [[B|g]] دينار؟
  solution: |
    مجموع الاستهلاك يساوي الأساس ناقص القيمة الدفترية:

    $$
    [[B|g]]\left[1 - (1 - [[d|r]])^{[[k|n]]}\right] = [[S|2]]
    $$

- id: c05-c-12
  kind: problem
  part: C
  vars: {B: 45000, n: 6, t: 0.20}
  random: {B: [15000, 100000, 1000], n: [4, 10, 1], t: [0.15, 0.30, 0.01]}
  calc:
    - d = 2/n
    - s1 = t*d*B
    - s0 = t*B/n
  text: |
    ما الوفر الضريبي في السنة الأولى لأصل أساسه [[B|g]] دينار وعمره [[yrs(n)]]، بنسبة ضريبة [[t|%]]: بالقسط الثابت، وبالمتناقص المضاعف؟
  solution: |
    القسط الثابت: استهلاك [[B/n|2]] دينار، ووفر [[s0|2]] دينار.

    المتناقص المضاعف: استهلاك [[d*B|2]] دينار، ووفر [[s1|2]] دينار، أي ضعف الوفر بالقسط الثابت في السنة الأولى.

- id: c05-c-13
  kind: problem
  part: C
  vars: {B: 50000, S: 5000}
  random: {B: [20000, 100000, 1000], S: [2500, 10000, 500]}
  calc:
    - r = floor((1 - (S/B)**(1/5))*1000 + 0.5)/1000
    - D1 = B*r
    - D2 = (B - D1)*r
  text: |
    احسب الاستهلاك بالدالة DB في Excel لأصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره 5 سنوات. ما النسبة التي تستخدمها الدالة؟ وما استهلاك أول سنتين؟
  solution: |
    الدالة DB تحسب نسبة تجعل القيمة الدفترية تصل إلى القيمة المقدرة، وتقربها إلى 3 منازل عشرية:

    $$
    r = 1 - \left(\frac{[[S|g]]}{[[B|g]]}\right)^{1/5} \approx [[r|f4]]
    $$

    ```excel
    =DB([[B|r]], [[S|r]], 5, 1)
    =DB([[B|r]], [[S|r]], 5, 2)
    ```

    الاستهلاك [[D1|2]] ثم [[D2|2]] دينار.

- id: c05-c-14
  kind: problem
  part: C
  vars: {B: 25000}
  random: {B: [8000, 60000, 1000]}
  calc:
    - a = 0.5*B
    - b = 0.25*(B - a)
    - c = 0.25*(B - a - b)
  text: |
    قانون ضريبة يسمح باستهلاك الحواسيب بنسبة 50% في السنة الأولى، ثم 25% من الرصيد الباقي في كل سنة بعدها. ما استهلاك أول ثلاث سنوات لحواسيب أساسها [[B|g]] دينار؟
  solution: |
    $$
    D_1 = 0.50 \times [[B|g]] = [[a|2]]
    $$

    $$
    D_2 = 0.25 \times [[B-a|2]] = [[b|2]], \qquad D_3 = 0.25 \times [[B-a-b|2]] = [[c|2]]
    $$

    هذه قواعد مختلطة تضعها بعض القوانين للأصول التي تتقادم بسرعة.
