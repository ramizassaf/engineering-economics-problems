items:

- id: c05-f-01
  kind: problem
  part: F
  vars: {R: 200000, O: 90000, D: 25000, t: 0.15}
  random: {R: [80000, 400000, 5000], O: [30000, 200000, 5000], D: [5000, 50000, 1000], t: [0.10, 0.30, 0.01]}
  calc:
    - O = min(O, R - D - 10000)
    - TI = R - O - D
    - T = t*TI
  text: |
    إيراد شركة [[R|g]] دينار، وتكاليفها النقدية [[O|g]] دينار، واستهلاكها [[D|g]] دينار. نسبة الضريبة [[t|%]]. ما الدخل الخاضع للضريبة؟ وما الضريبة؟
  solution: |
    $$
    TI = [[R|g]] - [[O|g]] - [[D|g]] = [[TI|2]]
    $$

    $$
    T = [[t|r]] \times [[TI|2]] = [[T|2]]
    $$

- id: c05-f-02
  kind: problem
  part: F
  vars: {R: 200000, O: 90000, D: 25000, t: 0.15}
  random: {R: [150000, 400000, 5000], O: [30000, 120000, 5000], D: [5000, 50000, 1000], t: [0.10, 0.30, 0.01]}
  calc:
    - O = min(O, R - D - 10000)
    - T = t*(R - O - D)
    - NI = R - O - D - T
    - CF = R - O - T
  text: |
    للشركة السابقة: احسب صافي الربح والتدفق النقدي بعد الضريبة. لماذا يختلفان؟
  solution: |
    $$
    NI = [[R|g]] - [[O|g]] - [[D|g]] - [[T|2]] = [[NI|2]]
    $$

    $$
    CF = [[R|g]] - [[O|g]] - [[T|2]] = [[CF|2]]
    $$

    الفرق يساوي الاستهلاك [[D|g]] دينار، لأنه مصروف في الحسابات وليس نقدا يخرج.

- id: c05-f-03
  kind: problem
  part: F
  vars: {R: 50000, O: 20000, D: 8000, t: 0.20}
  random: {R: [20000, 100000, 1000], O: [5000, 50000, 1000], D: [2000, 15000, 500], t: [0.10, 0.30, 0.01]}
  calc:
    - R = max(R, O + D + 2000)
    - CF1 = (R - O)*(1 - t) + t*D
    - CF2 = R - O - t*(R - O - D)
  text: |
    مشروع إيراده [[R|g]] دينار، وتكاليفه [[O|g]] دينار، واستهلاكه [[D|g]] دينار. نسبة الضريبة [[t|%]]. احسب التدفق النقدي بعد الضريبة بصيغة الوفر الضريبي، وتأكد بالحساب المباشر.
  solution: |
    $$
    CF = ([[R|g]] - [[O|g]])(1 - [[t|r]]) + [[t|r]] \times [[D|g]] = [[CF1|2]]
    $$

    الحساب المباشر:

    $$
    [[R|g]] - [[O|g]] - [[t|r]]\,([[R|g]] - [[O|g]] - [[D|g]]) = [[CF2|2]]
    $$

- id: c05-f-04
  kind: problem
  part: F
  vars: {D: 12000, t: 0.20}
  random: {D: [2000, 50000, 500], t: [0.10, 0.35, 0.01]}
  calc:
    - s = t*D
  text: |
    استهلاك سنوي [[D|g]] دينار، ونسبة الضريبة [[t|%]]. ما الوفر الضريبي؟
  solution: |
    $$
    [[t|r]] \times [[D|g]] = [[s|2]]
    $$

- id: c05-f-05
  kind: problem
  part: F
  vars: {B: 90000, n: 6, t: 0.20, i: 0.12}
  random: {B: [20000, 200000, 5000], n: [3, 10, 1], t: [0.10, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - P = t*B/n*PA(i, n)
    - f = P/B
  text: |
    آلة تكلف [[B|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]]. ما القيمة الحالية للوفر الضريبي بنسبة [[i|%]] وضريبة [[t|%]]؟ وما نسبتها من ثمن الآلة؟
  solution: |
    $$
    P = [[t|r]] \times \frac{[[B|g]]}{[[n|n]]}\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    هذا [[f|%2]] من ثمن الآلة.

- id: c05-f-06
  kind: problem
  part: F
  vars: {O: 30000, t: 0.20}
  random: {O: [5000, 80000, 1000], t: [0.10, 0.35, 0.01]}
  calc:
    - net = O*(1 - t)
  text: |
    شركة رابحة تدفع راتبا إضافيا لمهندس جودة [[O|g]] دينار سنويا. نسبة الضريبة [[t|%]]. ما التكلفة الحقيقية للراتب على الشركة بعد الضريبة؟
  solution: |
    الراتب مصروف يخفض الدخل الخاضع للضريبة، فالضريبة تقل بمقدار [[t*O|2]] دينار:

    $$
    [[O|g]]\,(1 - [[t|r]]) = [[net|2]]
    $$

- id: c05-f-07
  kind: problem
  part: F
  vars: {S: 25000, t: 0.20}
  random: {S: [5000, 80000, 1000], t: [0.10, 0.35, 0.01]}
  calc:
    - net = S*(1 - t)
  text: |
    مشروع يوفر [[S|g]] دينار سنويا من تكاليف الطاقة. نسبة الضريبة [[t|%]]. كم يبقى من التوفير بعد الضريبة؟
  solution: |
    التوفير يزيد الربح، فتزيد الضريبة:

    $$
    [[S|g]]\,(1 - [[t|r]]) = [[net|2]]
    $$

- id: c05-f-08
  kind: problem
  part: F
  vars: {B: 60000, R: 22000, n: 5, t: 0.20}
  random: {B: [20000, 120000, 1000], R: [6000, 40000, 500], n: [3, 8, 1], t: [0.10, 0.30, 0.01]}
  calc:
    - D = B/n
    - CF = R*(1 - t) + t*D
  text: |
    آلة تكلف [[B|g]] دينار، وتوفر [[R|g]] دينار سنويا قبل الضريبة لمدة [[yrs(n)]]، وتستهلك بالقسط الثابت. نسبة الضريبة [[t|%]]. ما التدفق النقدي السنوي بعد الضريبة؟
  solution: |
    $$
    CF = [[R|g]]\,(1 - [[t|r]]) + [[t|r]] \times [[D|2]] = [[CF|2]]
    $$

- id: c05-f-09
  kind: problem
  part: F
  vars: {B: 60000, R: 22000, n: 5, t: 0.20, i: 0.10}
  random: {B: [20000, 120000, 1000], R: [6000, 40000, 500], n: [3, 8, 1], t: [0.10, 0.30, 0.01], i: [0.05, 0.14, 0.01]}
  calc:
    - D = B/n
    - CF = R*(1 - t) + t*D
    - PW = -B + CF*PA(i, n)
    - PWb = -B + R*PA(i, n)
  text: |
    للآلة السابقة: احسب القيمة الحالية بعد الضريبة بنسبة [[i|%]]. قارنها بالقيمة الحالية قبل الضريبة.
  solution: |
    $$
    PW_{after} = -[[B|g]] + [[CF|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    $$
    PW_{before} = -[[B|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PWb|2]]
    $$

    الضريبة تخفض القيمة الحالية. لكن الحد الأدنى للعائد بعد الضريبة أقل عادة منه قبلها، وهذا موضوع الفصل التالي.

- id: c05-f-10
  kind: problem
  part: F
  vars: {TI: 300000, t1: 0.20, t2: 0.01}
  random: {TI: [50000, 1000000, 10000], t1: [0.10, 0.35, 0.01], t2: [0.01, 0.07, 0.01]}
  calc:
    - T = (t1 + t2)*TI
  text: |
    شركة دخلها الخاضع [[TI|g]] دينار، وتدفع ضريبة دخل [[t1|%]] ومساهمة [[t2|%]] على نفس الدخل. ما مجموع الضريبتين؟ وما النسبة الفعلية؟
  solution: |
    النسبة الفعلية [[t1+t2|%]]، والمجموع:

    $$
    [[t1+t2|r]] \times [[TI|g]] = [[T|2]]
    $$

- id: c05-f-11
  kind: problem
  part: F
  vars: {t1: 0.20, t2: 0.05}
  random: {t1: [0.10, 0.35, 0.01], t2: [0.01, 0.10, 0.01]}
  calc:
    - t = t1 + t2*(1 - t1)
  text: |
    ضريبة محلية [[t2|%]] تطرح كمصروف قبل حساب ضريبة الدخل [[t1|%]]. ما النسبة الفعلية الكلية؟
  solution: |
    $$
    t = [[t1|r]] + [[t2|r]]\,(1 - [[t1|r]]) = [[t|%2]]
    $$

- id: c05-f-12
  kind: problem
  part: F
  vars: {R: 100000, O: 40000, B: 120000, t: 0.20}
  random: {R: [50000, 200000, 5000], O: [10000, 80000, 5000], B: [40000, 200000, 5000], t: [0.10, 0.30, 0.01]}
  calc:
    - Dsl = B/5
    - Ddd = 0.4*B
    - Tsl = t*(R - O - Dsl)
    - Tdd = t*(R - O - Ddd)
  text: |
    شركة إيرادها [[R|g]] دينار وتكاليفها [[O|g]] دينار، واشترت معدات بمبلغ [[B|g]] دينار عمرها 5 سنوات. نسبة الضريبة [[t|%]]. قارن ضريبة السنة الأولى بالقسط الثابت وبالمتناقص المضاعف.
  solution: |
    | الطريقة | الاستهلاك | الضريبة |
    | --- | --- | --- |
    | القسط الثابت | [[Dsl|2]] | [[Tsl|2]] |
    | المتناقص المضاعف | [[Ddd|2]] | [[Tdd|2]] |

    الفرق [[Tsl-Tdd|2]] دينار ضريبة أقل في السنة الأولى. الضريبة لا تلغى، بل تؤجل إلى السنوات الأخيرة. [[pick(Tdd < 0, 'الضريبة السالبة تعني خسارة ضريبية ترحل إلى السنوات التالية.', '')]]

- id: c05-f-13
  kind: problem
  part: F
  vars: {O: 15000, t: 0.20, i: 0.10, n: 6}
  random: {O: [3000, 40000, 1000], t: [0.10, 0.30, 0.01], i: [0.05, 0.14, 0.01], n: [3, 10, 1]}
  calc:
    - P = O*(1 - t)*PA(i, n)
  text: |
    عقد صيانة يكلف [[O|g]] دينار سنويا لمدة [[yrs(n)]]. ما القيمة الحالية لتكلفته بعد الضريبة بنسبة [[i|%]] وضريبة [[t|%]]؟
  solution: |
    $$
    P = [[O|g]]\,(1 - [[t|r]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c05-f-14
  kind: problem
  part: F
  vars: {B: 40000, t: 0.20, i: 0.10}
  random: {B: [10000, 100000, 1000], t: [0.10, 0.30, 0.01], i: [0.05, 0.14, 0.01]}
  calc:
    - e = B*(1 - t)
    - c = B - t*(B/4)*PA(i, 4)
  text: |
    شركة تحتاج أداة بمبلغ [[B|g]] دينار. القانون يسمح بطرحها مصروفا في سنة الشراء، أو باستهلاكها على 4 سنوات بالقسط الثابت. نسبة الضريبة [[t|%]]. ما التكلفة بعد الضريبة بالقيمة الحالية في كل حالة بنسبة [[i|%]]؟ افترض أن الوفر يأتي في نهاية كل سنة.
  solution: |
    كمصروف، الوفر كله في السنة الأولى:

    $$
    [[B|g]] - [[t|r]] \times [[B|g]]\,(P/F,\ [[i|%]],\ 1) = [[B - t*B*PF(i, 1)|2]]
    $$

    كاستهلاك على 4 سنوات:

    $$
    [[B|g]] - [[t|r]] \times [[B/4|2]]\,(P/A,\ [[i|%]],\ 4) = [[c|2]]
    $$

    الطرح الفوري أرخص، لأن الوفر يأتي أبكر.
