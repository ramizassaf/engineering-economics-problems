- id: c05-d-01
  kind: problem
  part: D
  vars: {B: 30000, S: 3000, n: 4}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500], n: [3, 8, 1]}
  calc:
    - T = n*(n + 1)/2
    - D1 = n/T*(B - S)
    - Dn = 1/T*(B - S)
  text: |
    أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]. احسب بطريقة مجموع أرقام السنوات استهلاك السنة الأولى والأخيرة.
  solution: |
    $$
    1 + 2 + \cdots + [[n|n]] = [[T|n]]
    $$

    $$
    D_1 = \frac{[[n|n]]}{[[T|n]]}\,([[B|g]] - [[S|g]]) = [[D1|2]], \qquad D_{[[n|n]]} = \frac{1}{[[T|n]]}\,([[B|g]] - [[S|g]]) = [[Dn|2]]
    $$

- id: c05-d-02
  kind: problem
  part: D
  vars: {B: 30000, S: 3000, n: 6, k: 3}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500], n: [4, 10, 1], k: [2, 4, 1]}
  calc:
    - T = n*(n + 1)/2
    - Dk = (n - k + 1)/T*(B - S)
  text: |
    بطريقة مجموع أرقام السنوات، ما استهلاك السنة [[k|n]] لأصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]؟
  solution: |
    $$
    D_{[[k|n]]} = \frac{[[n|n]] - [[k|n]] + 1}{[[T|n]]}\,([[B|g]] - [[S|g]]) = [[Dk|2]]
    $$

    ```excel
    =SYD([[B|r]], [[S|r]], [[n|n]], [[k|n]])
    ```

- id: c05-d-03
  kind: problem
  part: D
  vars: {B: 30000, S: 3000, n: 6, k: 3}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500], n: [4, 10, 1], k: [2, 4, 1]}
  calc:
    - T = n*(n + 1)/2
    - cum = (k*n - k*(k - 1)/2)/T*(B - S)
    - BV = B - cum
  text: |
    للأصل السابق، ما القيمة الدفترية بعد [[yrs(k)]]؟
  solution: |
    مجموع الكسور لأول [[k|n]] سنة:

    $$
    \frac{[[n|n]] + ([[n|n]] - 1) + \cdots + ([[n|n]] - [[k|n]] + 1)}{[[T|n]]}
    $$

    الاستهلاك المتراكم [[cum|2]] دينار، فالقيمة الدفترية [[BV|2]] دينار.

- id: c05-d-04
  kind: problem
  part: D
  vars: {B: 40000, S: 4000, i: 0.10}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500], i: [0.05, 0.15, 0.01]}
  calc:
    - sy = (B - S)*(4*PF(i, 1) + 3*PF(i, 2) + 2*PF(i, 3) + 1*PF(i, 4))/10
    - sl = (B - S)/4*PA(i, 4)
  text: |
    قارن القيمة الحالية للاستهلاك بنسبة [[i|%]] بطريقتي مجموع أرقام السنوات والقسط الثابت، لأصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره 4 سنوات.
  solution: |
    مجموع أرقام السنوات يساوي 10:

    $$
    P_{SYD} = [[B-S|g]] \times \frac{4\,(P/F,\ [[i|%]],\ 1) + 3\,(P/F,\ [[i|%]],\ 2) + 2\,(P/F,\ [[i|%]],\ 3) + (P/F,\ [[i|%]],\ 4)}{10} = [[sy|2]]
    $$

    $$
    P_{SL} = [[(B-S)/4|2]]\,(P/A,\ [[i|%]],\ 4) = [[sl|2]]
    $$

- id: c05-d-05
  kind: problem
  part: D
  vars: {B: 120000, S: 10000, U: 500000, u: 85000}
  random: {B: [40000, 250000, 5000], S: [0, 30000, 1000], U: [100000, 800000, 10000], u: [20000, 150000, 5000]}
  calc:
    - r = (B - S)/U
    - D = r*u
  text: |
    شاحنة أساسها [[B|g]] دينار، وقيمتها المقدرة [[S|g]] دينار، وتقطع خلال عمرها [[U|g]] كيلومتر. قطعت هذه السنة [[u|g]] كيلومتر. ما الاستهلاك بطريقة وحدات الإنتاج؟
  solution: |
    $$
    r = \frac{[[B|g]] - [[S|g]]}{[[U|g]]} = [[r|f4]]
    $$

    $$
    D = [[r|f4]] \times [[u|g]] = [[D|2]]
    $$

- id: c05-d-06
  kind: problem
  part: D
  vars: {B: 90000, S: 6000, H: 20000, h1: 3500, h2: 5200, h3: 4800}
  random: {B: [30000, 150000, 1000], S: [0, 15000, 500], H: [10000, 40000, 1000], h1: [1000, 6000, 100], h2: [1000, 6000, 100], h3: [1000, 6000, 100]}
  calc:
    - r = (B - S)/H
    - D1 = r*h1
    - D2 = r*h2
    - D3 = r*h3
    - BV = B - D1 - D2 - D3
  text: |
    حفارة أساسها [[B|g]] دينار، وقيمتها المقدرة [[S|g]] دينار، وعمرها [[H|g]] ساعة عمل. عملت [[h1|g]] و[[h2|g]] و[[h3|g]] ساعة في أول ثلاث سنوات. احسب الاستهلاك والقيمة الدفترية بعد ثلاث سنوات.
  solution: |
    استهلاك الساعة:

    $$
    r = \frac{[[B|g]] - [[S|g]]}{[[H|g]]} = [[r|f4]]
    $$

    | السنة | الساعات | الاستهلاك |
    | --- | --- | --- |
    | 1 | [[h1|g]] | [[D1|2]] |
    | 2 | [[h2|g]] | [[D2|2]] |
    | 3 | [[h3|g]] | [[D3|2]] |

    القيمة الدفترية بعد ثلاث سنوات [[BV|2]] دينار.

- id: c05-d-07
  kind: problem
  part: D
  vars: {B: 50000, S: 5000}
  random: {B: [10000, 100000, 1000], S: [0, 10000, 500]}
  calc:
    - sl1 = (B - S)/5
    - sy1 = 5/15*(B - S)
    - dd1 = 0.4*B
  text: |
    لأصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره 5 سنوات: قارن استهلاك السنة الأولى بالقسط الثابت، ومجموع أرقام السنوات، والمتناقص المضاعف.
  solution: |
    | الطريقة | استهلاك السنة الأولى |
    | --- | --- |
    | القسط الثابت | [[sl1|2]] |
    | مجموع أرقام السنوات | [[sy1|2]] |
    | المتناقص المضاعف | [[dd1|2]] |

    المتناقص المضاعف لا يطرح القيمة المقدرة من الأساس في البداية، فاستهلاكه الأول أكبر.

- id: c05-d-08
  kind: problem
  part: D
  vars: {B: 30000, S: 0, n: 3}
  random: {B: [6000, 60000, 1000]}
  calc:
    - D1 = 3/6*B
    - D2 = 2/6*B
    - D3 = 1/6*B
  text: |
    برنامج حاسوب أساسه [[B|g]] دينار، وعمره 3 سنوات بدون قيمة مقدرة. احسب الاستهلاك بطريقة مجموع أرقام السنوات.
  solution: |
    مجموع الأرقام 6. الاستهلاك [[D1|2]] ثم [[D2|2]] ثم [[D3|2]] دينار.

- id: c05-d-09
  kind: problem
  part: D
  vars: {B: 70000, S: 5000, U: 1000000, u1: 300000}
  random: {B: [20000, 150000, 1000], S: [0, 15000, 500], U: [200000, 2000000, 50000], u1: [50000, 400000, 10000]}
  calc:
    - u1 = min(u1, U*0.6)
    - D1u = (B - S)*u1/U
    - D1s = (B - S)/5
  text: |
    قالب حقن بلاستيك أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وينتج خلال عمره [[U|g]] قطعة، أو يعيش 5 سنوات. أنتج في السنة الأولى [[u1|g]] قطعة. قارن الاستهلاك بوحدات الإنتاج وبالقسط الثابت. أي الطريقتين أنسب؟
  solution: |
    بوحدات الإنتاج [[D1u|2]] دينار، وبالقسط الثابت [[D1s|2]] دينار.

    القالب يتلف بعدد القطع وليس بالزمن، فطريقة وحدات الإنتاج تعكس تلفه الحقيقي. لكن القانون الضريبي قد لا يسمح بها، فتستخدم في الدفاتر فقط.

- id: c05-d-10
  kind: problem
  part: D
  vars: {n: 8}
  random: {n: [3, 15, 1]}
  calc:
    - T = n*(n + 1)/2
    - f1 = n/T
  text: |
    ما الكسر الذي يستهلك في السنة الأولى بطريقة مجموع أرقام السنوات لأصل عمره [[yrs(n)]]؟ قارنه بنسبة القسط المتناقص المضاعف.
  solution: |
    $$
    \frac{[[n|n]]}{[[T|n]]} = [[f1|%2]]
    $$

    نسبة المتناقص المضاعف [[2/n|%2]]. الكسر الأول في مجموع أرقام السنوات يساوي:

    $$
    \frac{n}{n(n+1)/2} = \frac{2}{n+1}
    $$

    فهو أقل قليلا من نسبة المتناقص المضاعف، لكنه يطبق على الأساس ناقص القيمة المقدرة.
