items:

- id: c05-g-01
  kind: problem
  part: G
  vars: {B: 50000, n: 5, k: 3, M: 25000, t: 0.20}
  random: {B: [20000, 100000, 1000], n: [4, 10, 1], k: [1, 3, 1], M: [5000, 70000, 1000], t: [0.10, 0.30, 0.01]}
  calc:
    - BV = B - k*B/n
    - G = M - BV
    - T = t*G
    - net = M - T
  text: |
    آلة أساسها [[B|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بدون قيمة مقدرة. بيعت بعد [[yrs(k)]] بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي ما يبقى من البيع بعد الضريبة؟
  solution: |
    $$
    BV = [[B|g]] - [[k|n]] \times [[B/n|2]] = [[BV|2]]
    $$

    $$
    G = [[M|g]] - [[BV|2]] = [[G|2]], \qquad T = [[t|r]] \times [[G|2]] = [[T|2]]
    $$

    $$
    [[M|g]] - [[T|2]] = [[net|2]]
    $$

- id: c05-g-02
  kind: problem
  part: G
  vars: {B: 50000, M: 8000, t: 0.20}
  random: {B: [20000, 100000, 1000], M: [1000, 15000, 500], t: [0.10, 0.30, 0.01]}
  calc:
    - BV = 0.36*B
    - G = M - BV
    - net = M - t*G
  text: |
    آلة أساسها [[B|g]] دينار، وعمرها 5 سنوات، تستهلك بالمتناقص المضاعف. بيعت بعد سنتين بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما الربح أو الخسارة؟ وما صافي ما يبقى؟
  solution: |
    بعد سنتين تبقى 60% ثم 60% منها:

    $$
    BV = [[B|g]] \times 0.6^2 = [[BV|2]]
    $$

    $$
    G = [[M|g]] - [[BV|2]] = [[G|2]]
    $$

    [[pick(G < 0, 'خسارة تخفض الضريبة', 'ربح يخضع للضريبة')]]. صافي ما يبقى:

    $$
    [[M|g]] - [[t|r]] \times ([[G|2]]) = [[net|2]]
    $$

- id: c05-g-03
  kind: problem
  part: G
  vars: {BV: 12000, M: 20000, t: 0.20}
  random: {BV: [2000, 40000, 500], M: [1000, 50000, 500], t: [0.10, 0.30, 0.01]}
  calc:
    - net = M - t*(M - BV)
  text: |
    أصل قيمته الدفترية [[BV|g]] دينار بيع بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي ما يبقى؟
  solution: |
    $$
    M - t\,(M - BV) = [[M|g]] - [[t|r]] \times ([[M-BV|g]]) = [[net|2]]
    $$

- id: c05-g-04
  kind: problem
  part: G
  vars: {B: 80000, n: 8, k: 5, t: 0.20}
  random: {B: [20000, 150000, 1000], n: [5, 12, 1], k: [2, 4, 1], t: [0.10, 0.30, 0.01]}
  calc:
    - BV = B - k*B/n
  text: |
    آلة أساسها [[B|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]]. بعد [[yrs(k)]] تريد الشركة بيعها. بأي ثمن لا يكون للبيع أثر ضريبي؟
  solution: |
    عندما يساوي الثمن القيمة الدفترية:

    $$
    BV = [[B|g]] - [[k|n]] \times [[B/n|2]] = [[BV|2]]
    $$

- id: c05-g-05
  kind: problem
  part: G
  vars: {B: 30000, n: 5, M: 0, k: 3, t: 0.20}
  random: {B: [10000, 80000, 1000], n: [4, 10, 1], k: [1, 3, 1], t: [0.10, 0.30, 0.01]}
  calc:
    - BV = B - k*B/n
    - s = t*BV
  text: |
    آلة أساسها [[B|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]]. تعطلت بعد [[yrs(k)]] ولا قيمة لها. نسبة الضريبة [[t|%]]. هل تستفيد الشركة ضريبيا من التخلص منها؟
  solution: |
    القيمة الدفترية [[BV|2]] دينار تصبح خسارة تطرح من الدخل، فتوفر:

    $$
    [[t|r]] \times [[BV|2]] = [[s|2]]
    $$

- id: c05-g-06
  kind: problem
  part: G
  calc:
    - T3 = 0
    - T4 = 0.20*(60000 - 10000)
    - T5 = 0.20*70000
  text: |
    شركة ترحل الخسائر لخمس سنوات، ونسبة الضريبة 20%. نتائجها قبل الضريبة: -50,000 ثم -30,000 ثم 70,000 ثم 60,000 ثم 70,000. احسب الضريبة كل سنة.
  solution: |
    | السنة | الربح | خسارة مستخدمة | الباقي | الضريبة |
    | --- | --- | --- | --- | --- |
    | 1 | -50,000 | 0 | 50,000 | 0 |
    | 2 | -30,000 | 0 | 80,000 | 0 |
    | 3 | 70,000 | 70,000 | 10,000 | 0 |
    | 4 | 60,000 | 10,000 | 0 | [[T4|2]] |
    | 5 | 70,000 | 0 | 0 | [[T5|2]] |

- id: c05-g-07
  kind: problem
  part: G
  calc:
    - T1 = 0.20*(100000 - 25000)
    - T2 = 0.20*(100000 - 25000)
    - T3 = 0.20*(100000 - 25000)
    - T4 = 0.20*(100000 - 25000)
  text: |
    قانون يسمح بترحيل الخسائر بدون حد زمني، لكن لا يجوز أن تطرح في أي سنة أكثر من 25% من ربح تلك السنة. شركة لديها خسارة مرحلة 120,000 دينار، وتربح 100,000 دينار سنويا. نسبة الضريبة 20%. احسب الضريبة في أول أربع سنوات، وما يبقى من الخسارة.
  solution: |
    كل سنة تطرح 25,000 دينار فقط، فالدخل الخاضع 75,000 دينار والضريبة [[T1|2]] دينار في كل سنة من الأربع.

    الخسارة المستخدمة 100,000 دينار، ويبقى 20,000 دينار للسنة الخامسة. هذا الحد يبطئ الاستفادة من الخسارة حتى لو لم تنته مدتها.

- id: c05-g-08
  kind: problem
  part: G
  calc:
    - lost = 90000 - 10000 - 15000 - 20000 - 25000 - 0
  text: |
    مشروع خسر 90,000 دينار في سنته الأولى، ثم ربح 10,000 و15,000 و20,000 و25,000 ثم 0 في السنوات من 2 إلى 6. القانون يسمح بالترحيل خمس سنوات. كم يضيع من الخسارة؟
  solution: |
    الأرباح خلال خمس سنوات بعد الخسارة مجموعها 70,000 دينار. يضيع [[lost|g]] دينار من الخسارة، ولا يمكن طرحها بعد ذلك.

- id: c05-g-09
  kind: problem
  part: G
  vars: {B: 70000, M: 30000, k: 3, t: 0.20}
  random: {B: [20000, 120000, 1000], M: [5000, 60000, 1000], k: [1, 4, 1], t: [0.10, 0.30, 0.01]}
  calc:
    - D1 = 5/15*B
    - D2 = 4/15*B
    - D3 = 3/15*B
    - D4 = 2/15*B
    - cum = pick(k == 1, D1, pick(k == 2, D1 + D2, pick(k == 3, D1 + D2 + D3, D1 + D2 + D3 + D4)))
    - BV = B - cum
    - net = M - t*(M - BV)
  text: |
    معدات أساسها [[B|g]] دينار، وعمرها 5 سنوات بدون قيمة مقدرة، تستهلك بمجموع أرقام السنوات. بيعت بعد [[yrs(k)]] بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما صافي ما يبقى؟
  solution: |
    الاستهلاك المتراكم [[cum|2]] دينار، فالقيمة الدفترية [[BV|2]] دينار.

    $$
    [[M|g]] - [[t|r]] \times ([[M|g]] - [[BV|2]]) = [[net|2]]
    $$

- id: c05-g-10
  kind: problem
  part: G
  vars: {B: 50000, M: 20000, t: 0.20}
  random: {B: [20000, 100000, 1000], M: [5000, 50000, 1000], t: [0.10, 0.30, 0.01]}
  calc:
    - BVs = B - 2*B/5
    - BVd = B*0.36
    - ns = M - t*(M - BVs)
    - nd = M - t*(M - BVd)
  text: |
    آلة أساسها [[B|g]] دينار، وعمرها 5 سنوات، بيعت بعد سنتين بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. قارن صافي البيع إذا كانت تستهلك بالقسط الثابت، أو بالمتناقص المضاعف. لماذا يختلف؟
  solution: |
    | الطريقة | القيمة الدفترية | صافي البيع |
    | --- | --- | --- |
    | القسط الثابت | [[BVs|2]] | [[ns|2]] |
    | المتناقص المضاعف | [[BVd|2]] | [[nd|2]] |

    المتناقص المضاعف أعطى استهلاكا أكبر في أول سنتين، فوفر ضريبة أكثر. عند البيع يسترد جزء من هذا الوفر عبر ضريبة أكبر على الربح. السرعة تكسب قيمة المال مع الزمن، لكنها لا تلغي الضريبة.
