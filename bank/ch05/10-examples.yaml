# ------------------------------------------------------------ basis and straight line
- id: c05-ex-basis
  kind: example
  title: |
    أساس الاستهلاك
  vars: {P: 85000, T: 3000, I: 4500, K: 1500, W: 2000}
  random: {P: [30000, 150000, 1000], T: [500, 6000, 250], I: [1000, 9000, 250], K: [500, 3000, 250], W: [1000, 5000, 250]}
  calc:
    - B = P + T + I + K
  text: |
    اشترى مصنع آلة سعرها [[P|g]] دينار. دفع [[T|g]] دينار للنقل، و[[I|g]] دينار للتركيب، و[[K|g]] دينار لتجربة التشغيل. ودفع أيضا [[W|g]] دينار لتدريب العمال على الآلة. ما أساس الاستهلاك؟
  solution: |
    أساس الاستهلاك هو كل ما ينفق لجعل الأصل جاهزا للعمل في مكانه: السعر والنقل والتركيب والتجربة.

    $$
    B = [[P|g]] + [[T|g]] + [[I|g]] + [[K|g]] = [[B|g]]
    $$

    التدريب لا يدخل في الأساس، لأنه يزيد مهارة العمال وليس قيمة الآلة. يسجل مصروفا في سنته.

- id: c05-ex-sl
  kind: example
  title: |
    القسط الثابت
  vars: {B: 60000, S: 8000, n: 5}
  random: {B: [20000, 120000, 1000], S: [0, 15000, 500], n: [4, 10, 1]}
  calc:
    - D = (B - S)/n
    - BV2 = B - 2*D
  text: |
    آلة أساسها [[B|g]] دينار، وقيمتها المقدرة في نهاية عمرها [[S|g]] دينار، وعمرها [[yrs(n)]]. احسب الاستهلاك السنوي بالقسط الثابت، والقيمة الدفترية بعد سنتين.
  solution: |
    القسط الثابت يوزع القيمة التي تضيع بالتساوي على سنوات العمر:

    $$
    D = \frac{B - S}{n} = \frac{[[B|g]] - [[S|g]]}{[[n|n]]} = [[D|2]]
    $$

    القيمة الدفترية هي الأساس ناقص الاستهلاك المتراكم:

    $$
    BV_2 = [[B|g]] - 2 \times [[D|2]] = [[BV2|2]]
    $$

    ```excel
    =SLN([[B|r]], [[S|r]], [[n|n]])
    ```

# ------------------------------------------------------------ declining balance
- id: c05-ex-ddb
  kind: example
  title: |
    القسط المتناقص المضاعف
  vars: {B: 50000, S: 5000}
  random: {B: [20000, 100000, 1000], S: [0, 10000, 500]}
  calc:
    - S = min(S, floor(0.2*B/500)*500)
    - d = 2/5
    - D1 = d*B
    - b1 = B - D1
    - D2 = d*b1
    - b2 = b1 - D2
    - D3 = d*b2
    - b3 = b2 - D3
    - D4 = min(d*b3, b3 - S)
    - b4 = b3 - D4
    - D5 = min(d*b4, b4 - S)
    - D5 = max(D5, 0)
    - b5 = b4 - D5
  text: |
    آلة أساسها [[B|g]] دينار، وعمرها 5 سنوات، وقيمتها المقدرة [[S|g]] دينار. ابن جدول الاستهلاك بالقسط المتناقص المضاعف.
  solution: |
    نسبة القسط المتناقص المضاعف ضعف نسبة القسط الثابت:

    $$
    d = \frac{2}{n} = \frac{2}{5} = 40\%
    $$

    كل سنة نستهلك 40% من القيمة الدفترية في بدايتها، وليس من الأساس. القيمة المقدرة لا تطرح في البداية، لكن القيمة الدفترية لا تنزل تحتها.

    | السنة | القيمة في البداية | الاستهلاك | القيمة في النهاية |
    | --- | --- | --- | --- |
    | 1 | [[B|2]] | [[D1|2]] | [[b1|2]] |
    | 2 | [[b1|2]] | [[D2|2]] | [[b2|2]] |
    | 3 | [[b2|2]] | [[D3|2]] | [[b3|2]] |
    | 4 | [[b3|2]] | [[D4|2]] | [[b4|2]] |
    | 5 | [[b4|2]] | [[D5|2]] | [[b5|2]] |

    ```excel
    =DDB([[B|r]], [[S|r]], 5, 1)
    ```

    غير الرقم الأخير من 1 إلى 5 لكل سنة. لاحظ أن الاستهلاك كبير في البداية ويصغر مع الزمن، وهذا يناسب أصولا تفقد قيمتها بسرعة، مثل السيارات والحواسيب.

- id: c05-ex-ddb-switch
  kind: example
  title: |
    التحول من المتناقص إلى الثابت
  vars: {B: 50000, S: 5000, n: 6}
  random: {B: [20000, 100000, 1000], S: [0, 6000, 500]}
  calc:
    - d = 2/n
    - E1 = d*B
    - L1 = (B - S)/6
    - D1 = min(max(E1, L1), B - S)
    - b1 = B - D1
    - E2 = d*b1
    - L2 = (b1 - S)/5
    - D2 = min(max(E2, L2), b1 - S)
    - b2 = b1 - D2
    - E3 = d*b2
    - L3 = (b2 - S)/4
    - D3 = min(max(E3, L3), b2 - S)
    - b3 = b2 - D3
    - E4 = d*b3
    - L4 = (b3 - S)/3
    - D4 = min(max(E4, L4), b3 - S)
    - b4 = b3 - D4
    - E5 = d*b4
    - L5 = (b4 - S)/2
    - D5 = min(max(E5, L5), b4 - S)
    - b5 = b4 - D5
    - E6 = d*b5
    - L6 = b5 - S
    - D6 = min(max(E6, L6), b5 - S)
    - b6 = b5 - D6
  text: |
    آلة أساسها [[B|g]] دينار، وعمرها 6 سنوات، وقيمتها المقدرة [[S|g]] دينار. استخدم القسط المتناقص المضاعف، مع التحول إلى القسط الثابت في السنة التي يصبح فيها أكبر.
  solution: |
    المشكلة في القسط المتناقص أن القيمة الدفترية لا تصل إلى القيمة المقدرة في نهاية العمر. الحل: نقارن كل سنة بين قسطين، ونأخذ الأكبر:

    - قسط المتناقص: النسبة مضروبة في القيمة في بداية السنة.
    - قسط الثابت للباقي: القيمة في بداية السنة ناقص القيمة المقدرة، مقسومة على السنوات الباقية.

    | السنة | البداية | المتناقص | الثابت للباقي | الاستهلاك |
    | --- | --- | --- | --- | --- |
    | 1 | [[B|2]] | [[E1|2]] | [[L1|2]] | [[D1|2]] |
    | 2 | [[b1|2]] | [[E2|2]] | [[L2|2]] | [[D2|2]] |
    | 3 | [[b2|2]] | [[E3|2]] | [[L3|2]] | [[D3|2]] |
    | 4 | [[b3|2]] | [[E4|2]] | [[L4|2]] | [[D4|2]] |
    | 5 | [[b4|2]] | [[E5|2]] | [[L5|2]] | [[D5|2]] |
    | 6 | [[b5|2]] | [[E6|2]] | [[L6|2]] | [[D6|2]] |

    القيمة الدفترية في النهاية [[b6|2]] دينار، أي القيمة المقدرة بالضبط. الدالة VDB في Excel تعمل هذا التحول تلقائيا:

    ```excel
    =VDB([[B|r]], [[S|r]], 6, 0, 1)
    ```

    للسنة الثالثة مثلا، المدخلان الأخيران 2 و3.

# ------------------------------------------------------------ SYD and units
- id: c05-ex-syd
  kind: example
  title: |
    مجموع أرقام السنوات
  vars: {B: 40000, S: 4000}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500]}
  calc:
    - D1 = 5/15*(B - S)
    - D2 = 4/15*(B - S)
    - D3 = 3/15*(B - S)
    - D4 = 2/15*(B - S)
    - D5 = 1/15*(B - S)
  text: |
    معدات أساسها [[B|g]] دينار، وعمرها 5 سنوات، وقيمتها المقدرة [[S|g]] دينار. احسب الاستهلاك بطريقة مجموع أرقام السنوات.
  solution: |
    مجموع أرقام السنوات:

    $$
    1 + 2 + 3 + 4 + 5 = \frac{5 \times 6}{2} = 15
    $$

    استهلاك السنة الأولى 5 من 15 من القيمة التي تضيع، والثانية 4 من 15، وهكذا:

    | السنة | الكسر | الاستهلاك |
    | --- | --- | --- |
    | 1 | 5/15 | [[D1|2]] |
    | 2 | 4/15 | [[D2|2]] |
    | 3 | 3/15 | [[D3|2]] |
    | 4 | 2/15 | [[D4|2]] |
    | 5 | 1/15 | [[D5|2]] |

    المجموع [[B-S|2]] دينار، أي الأساس ناقص القيمة المقدرة.

    ```excel
    =SYD([[B|r]], [[S|r]], 5, 1)
    ```

- id: c05-ex-units
  kind: example
  title: |
    وحدات الإنتاج
  vars: {B: 180000, S: 20000, U: 400000, u1: 70000, u2: 95000}
  random: {B: [80000, 300000, 5000], S: [5000, 40000, 1000], U: [200000, 600000, 10000], u1: [30000, 120000, 5000], u2: [30000, 140000, 5000]}
  calc:
    - r = (B - S)/U
    - D1 = r*u1
    - D2 = r*u2
  text: |
    آلة تعبئة أساسها [[B|g]] دينار، وقيمتها المقدرة [[S|g]] دينار، وتنتج خلال عمرها [[U|g]] عبوة. أنتجت [[u1|g]] عبوة في السنة الأولى و[[u2|g]] في الثانية. احسب الاستهلاك.
  solution: |
    استهلاك العبوة الواحدة:

    $$
    r = \frac{[[B|g]] - [[S|g]]}{[[U|g]]} = [[r|f4]]
    $$

    $$
    D_1 = [[r|f4]] \times [[u1|g]] = [[D1|2]], \qquad D_2 = [[r|f4]] \times [[u2|g]] = [[D2|2]]
    $$

    هذه الطريقة تناسب أصلا يتلف بالاستخدام وليس بالزمن، مثل الشاحنات والقوالب.

# ------------------------------------------------------------ conventions and pools
- id: c05-ex-half-year
  kind: example
  title: |
    قاعدة نصف السنة
  vars: {B: 36000, S: 0, n: 4}
  random: {B: [10000, 80000, 1000], n: [3, 8, 1]}
  calc:
    - D = (B - S)/n
    - H = D/2
  text: |
    اشترت شركة معدات بمبلغ [[B|g]] دينار في منتصف السنة، وعمرها [[yrs(n)]] بدون قيمة مقدرة. قانون الضريبة يطبق قاعدة نصف السنة. وزع الاستهلاك بالقسط الثابت.
  solution: |
    قاعدة نصف السنة تفترض أن كل أصل يشترى في منتصف السنة، مهما كان تاريخ شرائه الفعلي. لذلك ينزل نصف قسط في السنة الأولى، والنصف الباقي في سنة إضافية بعد نهاية العمر.

    $$
    D = \frac{[[B|g]]}{[[n|n]]} = [[D|2]]
    $$

    | السنة | الاستهلاك |
    | --- | --- |
    | 1 | [[H|2]] |
    | من 2 إلى [[n|n]] | [[D|2]] كل سنة |
    | [[n+1|n]] | [[H|2]] |

    الاستهلاك يمتد على [[n+1|n]] سنة ضريبية. القوانين تختلف في التفاصيل، وملحق الضرائب في الدول الأربع يبين قاعدة كل دولة.

- id: c05-ex-pool
  kind: example
  title: |
    الاستهلاك على مستوى المجموعة
  vars: {O: 200000, A: 60000, X: 15000, d: 0.25}
  random: {O: [50000, 400000, 5000], A: [10000, 120000, 5000], X: [0, 40000, 1000]}
  calc:
    - base = O + A - X
    - D = d*base
    - C = base - D
  text: |
    شركة تجمع آلاتها في مجموعة واحدة، وتستهلكها بالقسط المتناقص بنسبة 25% على رصيد المجموعة. الرصيد في بداية السنة [[O|g]] دينار. اشترت خلال السنة آلات بمبلغ [[A|g]] دينار، وباعت آلات بمبلغ [[X|g]] دينار. احسب الاستهلاك ورصيد نهاية السنة.
  solution: |
    في طريقة المجموعات لا نتابع كل آلة وحدها. نضيف المشتريات إلى الرصيد، ونطرح ثمن البيع، ثم نطبق النسبة:

    $$
    \mathrm{base} = [[O|g]] + [[A|g]] - [[X|g]] = [[base|g]]
    $$

    $$
    D = 0.25 \times [[base|g]] = [[D|2]]
    $$

    رصيد السنة التالية:

    $$
    [[base|g]] - [[D|2]] = [[C|2]]
    $$

    الطريقة بسيطة جدا للشركات التي تملك مئات الأصول. لاحظ أن البيع لا يولد ربحا أو خسارة منفصلة، لأن ثمنه يطرح من رصيد المجموعة. بعض القوانين تضيف نصف المشتريات فقط في سنة الشراء.

- id: c05-ex-compare-pv
  kind: example
  title: |
    أي طريقة أفضل للشركة؟
  vars: {B: 100000, i: 0.10, t: 0.20}
  random: {B: [20000, 200000, 5000], i: [0.06, 0.15, 0.01], t: [0.15, 0.30, 0.01]}
  calc:
    - sl = (B/5)*PA(i, 5)
    - sy = B*(5*PF(i, 1) + 4*PF(i, 2) + 3*PF(i, 3) + 2*PF(i, 4) + 1*PF(i, 5))/15
    - g1 = 0.4*B
    - g2 = 0.24*B
    - g3 = 0.144*B
    - g4 = (B - g1 - g2 - g3)/2
    - dd = g1*PF(i, 1) + g2*PF(i, 2) + g3*PF(i, 3) + g4*PF(i, 4) + g4*PF(i, 5)
    - TS = t*sl
    - TY = t*sy
    - TD = t*dd
  text: |
    معدات أساسها [[B|g]] دينار، وعمرها 5 سنوات بدون قيمة مقدرة. نسبة الضريبة [[t|%]] والحد الأدنى للعائد [[i|%]]. قارن القيمة الحالية للوفر الضريبي من الاستهلاك بثلاث طرق: القسط الثابت، ومجموع أرقام السنوات، والمتناقص المضاعف مع التحول.
  solution: |
    مجموع الاستهلاك في كل الطرق [[B|g]] دينار. الفرق في التوقيت فقط. كل دينار استهلاك يخفض الضريبة بمقدار [[t|%]] منه، فالوفر الضريبي في كل سنة يساوي النسبة مضروبة في الاستهلاك.

    | الطريقة | القيمة الحالية للاستهلاك | القيمة الحالية للوفر |
    | --- | --- | --- |
    | القسط الثابت | [[sl|2]] | [[TS|2]] |
    | مجموع أرقام السنوات | [[sy|2]] | [[TY|2]] |
    | المتناقص المضاعف مع التحول | [[dd|2]] | [[TD|2]] |

    الطريقة الأسرع تعطي وفرا أكبر بالقيمة الحالية، لأن الضريبة المؤجلة أفضل من الضريبة المدفوعة اليوم. لذلك تختار الشركات أسرع طريقة يسمح بها القانون.

# ------------------------------------------------------------ income tax
- id: c05-ex-tax-basic
  kind: example
  title: |
    من الإيراد إلى التدفق النقدي بعد الضريبة
  vars: {R: 120000, O: 55000, B: 100000, t: 0.20}
  random: {R: [60000, 250000, 5000], O: [20000, 120000, 5000], B: [40000, 200000, 5000], t: [0.15, 0.30, 0.01]}
  calc:
    - D = B/5
    - TI = R - O - D
    - T = t*TI
    - NI = TI - T
    - CF = R - O - T
  text: |
    شركة إيرادها السنوي [[R|g]] دينار، وتكاليف تشغيلها [[O|g]] دينار. تملك معدات أساسها [[B|g]] دينار تستهلك بالقسط الثابت على 5 سنوات. نسبة الضريبة [[t|%]]. احسب الدخل الخاضع للضريبة، والضريبة، وصافي الربح، والتدفق النقدي بعد الضريبة.
  solution: |
    الاستهلاك:

    $$
    D = \frac{[[B|g]]}{5} = [[D|2]]
    $$

    | البند | المبلغ |
    | --- | --- |
    | الإيراد | [[R|2]] |
    | تكاليف التشغيل | [[-O|2]] |
    | الاستهلاك | [[-D|2]] |
    | الدخل الخاضع للضريبة | [[TI|2]] |
    | الضريبة | [[-T|2]] |
    | صافي الربح | [[NI|2]] |

    الاستهلاك ليس نقدا يخرج من الشركة. المال خرج مرة واحدة عند الشراء. لذلك التدفق النقدي بعد الضريبة:

    $$
    CF = [[R|g]] - [[O|g]] - [[T|2]] = [[CF|2]]
    $$

    ويساوي صافي الربح زائد الاستهلاك:

    $$
    [[NI|2]] + [[D|2]] = [[CF|2]]
    $$

    [[pick(TI < 0, 'الدخل الخاضع للضريبة سالب هنا، فالضريبة السالبة تعني أن الخسارة تخفض ضريبة الشركة على أرباح أخرى، أو ترحل إلى سنوات قادمة.', '')]]

- id: c05-ex-tax-shield
  kind: example
  title: |
    قيمة الوفر الضريبي
  vars: {B: 80000, n: 8, t: 0.20, i: 0.10}
  random: {B: [20000, 200000, 5000], n: [4, 12, 1], t: [0.15, 0.30, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - D = B/n
    - s = t*D
    - P = s*PA(i, n)
    - net = B - P
  text: |
    آلة تكلف [[B|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بدون قيمة مقدرة. نسبة الضريبة [[t|%]]. ما الوفر الضريبي السنوي؟ وما قيمته الحالية بنسبة [[i|%]]؟ وما التكلفة الحقيقية للآلة بعد الضريبة؟
  solution: |
    الاستهلاك السنوي [[D|2]] دينار، وهو مصروف يخفض الدخل الخاضع للضريبة. فالضريبة تقل كل سنة بمقدار:

    $$
    t \times D = [[t|r]] \times [[D|2]] = [[s|2]]
    $$

    $$
    P = [[s|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    التكلفة الحقيقية للآلة بعد الضريبة:

    $$
    [[B|g]] - [[P|2]] = [[net|2]]
    $$

    الحكومة تسترد للشركة جزءا من ثمن الآلة على شكل ضريبة أقل، لكن على سنوات. كلما كان الاستهلاك أسرع كبرت قيمة هذا الجزء.

# ------------------------------------------------------------ disposal
- id: c05-ex-disposal-gain
  kind: example
  title: |
    بيع أصل بأكثر من قيمته الدفترية
  vars: {B: 60000, n: 6, k: 4, M: 25000, t: 0.20}
  random: {B: [20000, 120000, 1000], n: [5, 10, 1], k: [2, 4, 1], M: [5000, 60000, 1000], t: [0.15, 0.30, 0.01]}
  calc:
    - D = B/n
    - BV = B - k*D
    - G = M - BV
    - T = t*G
    - net = M - T
  text: |
    آلة أساسها [[B|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بدون قيمة مقدرة. بيعت بعد [[yrs(k)]] بمبلغ [[M|g]] دينار. نسبة الضريبة [[t|%]]. ما الربح أو الخسارة الضريبية؟ وما صافي ما يبقى من ثمن البيع؟
  solution: |
    القيمة الدفترية عند البيع:

    $$
    BV = [[B|g]] - [[k|n]] \times [[D|2]] = [[BV|2]]
    $$

    الفرق بين ثمن البيع والقيمة الدفترية:

    $$
    G = [[M|g]] - [[BV|2]] = [[G|2]]
    $$

    [[pick(G >= 0, 'الفرق موجب، أي ربح. معناه أن الاستهلاك الذي نزل في السنوات السابقة كان أكثر من النقص الحقيقي في قيمة الآلة، فالضريبة تسترد الفرق.', 'الفرق سالب، أي خسارة. معناه أن الاستهلاك كان أقل من النقص الحقيقي في قيمة الآلة، فالخسارة تخفض الضريبة.')]]

    $$
    T = [[t|r]] \times [[G|2]] = [[T|2]]
    $$

    صافي ما يبقى من البيع:

    $$
    [[M|g]] - [[T|2]] = [[net|2]]
    $$

- id: c05-ex-loss-carry
  kind: example
  title: |
    ترحيل الخسائر
  calc:
    - c2 = 15000
    - c3 = 20000
    - c4 = 5000
    - T4 = 0.15*(30000 - 5000)
    - T5 = 0.15*35000
  text: |
    مصنع جديد حقق النتائج التالية قبل الضريبة. نسبة الضريبة 15%، والقانون يسمح بترحيل الخسارة إلى خمس سنوات تالية. احسب الضريبة في كل سنة.

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | الربح أو الخسارة | -40,000 | 15,000 | 20,000 | 30,000 | 35,000 |
  solution: |
    خسارة السنة الأولى 40,000 دينار لا تسترد نقدا، لكنها تطرح من أرباح السنوات التالية حتى تنتهي:

    | السنة | الربح | خسارة مستخدمة | الخسارة الباقية | الدخل الخاضع | الضريبة |
    | --- | --- | --- | --- | --- | --- |
    | 1 | -40,000 | 0 | 40,000 | 0 | 0 |
    | 2 | 15,000 | 15,000 | 25,000 | 0 | 0 |
    | 3 | 20,000 | 20,000 | 5,000 | 0 | 0 |
    | 4 | 30,000 | 5,000 | 0 | 25,000 | [[T4|2]] |
    | 5 | 35,000 | 0 | 0 | 35,000 | [[T5|2]] |

    الترحيل لا يلغي الضريبة، لكنه يؤجلها. لو انتهت مدة الترحيل قبل أن تستخدم الخسارة كاملة، لضاع الجزء الباقي. لذلك تهتم المشاريع الجديدة بمدة الترحيل المسموحة، وبأي حد سنوي يضعه القانون.

- id: c05-ex-combined-rate
  kind: example
  title: |
    ضريبتان على نفس الدخل
  vars: {t1: 0.20, t2: 0.01, TI: 500000}
  random: {t1: [0.10, 0.30, 0.01], t2: [0.01, 0.07, 0.01], TI: [100000, 2000000, 50000]}
  calc:
    - ta = t1 + t2
    - tb = t1 + t2*(1 - t1)
    - Ta = ta*TI
    - Tb = tb*TI
  text: |
    شركة دخلها الخاضع للضريبة [[TI|g]] دينار. تدفع ضريبة دخل [[t1|%]]، وضريبة ثانية [[t2|%]] على نفس الدخل. ما النسبة الكلية إذا حسبت الضريبتان على نفس الأساس؟ وما النسبة إذا كانت الضريبة الثانية مصروفا يطرح قبل حساب الأولى؟
  solution: |
    إذا حسبت الضريبتان على نفس الأساس، تجمع النسبتان:

    $$
    t = [[t1|r]] + [[t2|r]] = [[ta|%]]
    $$

    الضريبة الكلية [[Ta|2]] دينار.

    إذا كانت الضريبة الثانية تطرح قبل الأولى، فالدخل الذي تحسب عليه الأولى أقل:

    $$
    t = t_2 + t_1(1 - t_2) = t_1 + t_2(1 - t_1) = [[tb|%2]]
    $$

    الضريبة الكلية [[Tb|2]] دينار. في التحليل الاقتصادي نستخدم نسبة واحدة تجمع كل الضرائب على الدخل، ونسميها النسبة الفعلية للضريبة. ملحق الضرائب يبين كيف تجمع النسب في الدول الأربع.
