items:

- id: c05-i-01
  kind: mcq
  part: I
  vars: {P: 40000, T: 2000, I: 3000, W: 1500}
  random: {P: [10000, 80000, 1000], T: [500, 4000, 250], I: [500, 5000, 250], W: [500, 3000, 250]}
  calc:
    - B = P + T + I
    - w1 = P
    - w2 = P + T + I + W
    - w3 = P + I
  text: |
    آلة سعرها [[P|g]] دينار، ونقلها [[T|g]]، وتركيبها [[I|g]]، وتدريب العمال عليها [[W|g]] دينار. ما أساس الاستهلاك؟
  options: ["[[w1|g]] دينار", "[[w2|g]] دينار", "[[B|g]] دينار", "[[w3|g]] دينار"]
  correct: 2
  solution: |
    الأساس يشمل كل ما يجعل الآلة جاهزة للعمل: السعر والنقل والتركيب. التدريب مصروف مستقل.

- id: c05-i-02
  kind: mcq
  part: I
  vars: {B: 50000, n: 5}
  random: {B: [10000, 100000, 1000], n: [4, 10, 1]}
  calc:
    - D1 = 2/n*B
    - w1 = B/n
    - w2 = 2/n*B*(1 - 2/n)
    - w3 = 1/n*B*2*(1 - 1/n)
  text: |
    ما استهلاك السنة الأولى بالمتناقص المضاعف لأصل أساسه [[B|g]] دينار وعمره [[yrs(n)]]؟
  options: ["[[w1|2]] دينار", "[[D1|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار"]
  correct: 1
  solution: |
    $$
    D_1 = \frac{2}{[[n|n]]} \times [[B|g]] = [[D1|2]]
    $$

    الخيار (ج) استهلاك السنة الثانية.

- id: c05-i-03
  kind: mcq
  part: I
  text: |
    أي الطرق التالية تصل إلى القيمة المقدرة بالضبط في نهاية العمر بدون تعديل؟
  options: ["القسط المتناقص المضاعف", "مجموع أرقام السنوات", "القسط المتناقص بنسبة 25%", "طريقة المجموعة"]
  correct: 1
  solution: |
    مجموع الكسور في طريقة مجموع أرقام السنوات يساوي 1، فيستهلك الأساس ناقص القيمة المقدرة بالضبط. الطرق المتناقصة لا تصل وحدها.

- id: c05-i-04
  kind: mcq
  part: I
  vars: {R: 80000, O: 30000, D: 10000, t: 0.20}
  random: {R: [50000, 150000, 5000], O: [10000, 40000, 1000], D: [2000, 20000, 1000], t: [0.10, 0.30, 0.01]}
  calc:
    - CF = R - O - t*(R - O - D)
    - w1 = (R - O)*(1 - t)
    - w2 = (R - O - D)*(1 - t)
    - w3 = R - O - D
  text: |
    إيراد [[R|g]] وتكاليف [[O|g]] واستهلاك [[D|g]] دينار، والضريبة [[t|%]]. ما التدفق النقدي بعد الضريبة؟
  options: ["[[w1|2]] دينار", "[[w2|2]] دينار", "[[CF|2]] دينار", "[[w3|2]] دينار"]
  correct: 2
  solution: |
    $$
    CF = [[R|g]] - [[O|g]] - [[t|r]]\,([[R|g]] - [[O|g]] - [[D|g]]) = [[CF|2]]
    $$

    الخيار (أ) تجاهل الوفر الضريبي. الخيار (ب) صافي الربح، ونسي إضافة الاستهلاك.

- id: c05-i-05
  kind: mcq
  part: I
  vars: {M: 20000, BV: 12000, t: 0.20}
  random: {M: [10000, 40000, 1000], BV: [2000, 9000, 500], t: [0.10, 0.30, 0.01]}
  calc:
    - net = M - t*(M - BV)
    - w1 = M*(1 - t)
    - w2 = M
    - w3 = M - t*BV
  text: |
    أصل قيمته الدفترية [[BV|g]] دينار بيع بمبلغ [[M|g]] دينار، والضريبة [[t|%]]. ما صافي البيع؟
  options: ["[[w1|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار", "[[net|2]] دينار"]
  correct: 3
  solution: |
    الضريبة على الربح فقط، أي الفرق بين الثمن والقيمة الدفترية:

    $$
    [[M|g]] - [[t|r]] \times [[M-BV|g]] = [[net|2]]
    $$

- id: c05-i-06
  kind: mcq
  part: I
  text: |
    شركتان متطابقتان، الأولى تستهلك بالقسط الثابت والثانية بالمتناقص المضاعف. أي العبارات صحيحة على كامل عمر الأصل؟
  options: ["الثانية تدفع ضريبة أقل في المجموع", "الأولى تدفع ضريبة أقل في المجموع", "المجموع واحد، لكن الثانية تدفع لاحقا", "المجموع واحد والتوقيت واحد"]
  correct: 2
  solution: |
    مجموع الاستهلاك واحد، فمجموع الضريبة واحد بنفس النسبة. الطريقة السريعة تؤجل الضريبة، فقيمتها الحالية أقل.

- id: c05-i-07
  kind: mcq
  part: I
  vars: {t1: 0.20, t2: 0.05}
  random: {t1: [0.10, 0.30, 0.01], t2: [0.02, 0.08, 0.01]}
  calc:
    - t = t1 + t2*(1 - t1)
    - w1 = t1 + t2
    - w2 = t1*t2
    - w3 = t1*(1 - t2)
  text: |
    ضريبة محلية [[t2|%]] تطرح قبل حساب ضريبة الدخل [[t1|%]]. ما النسبة الفعلية؟
  options: ["[[w1|%2]]", "[[t|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    t = [[t1|r]] + [[t2|r]]\,(1 - [[t1|r]]) = [[t|%2]]
    $$

    الخيار (أ) يصح فقط إذا حسبت الضريبتان على نفس الأساس.

- id: c05-i-08
  kind: mcq
  part: I
  text: |
    لماذا نستخدم استهلاك القانون الضريبي، وليس الاستهلاك المحاسبي، في التحليل الاقتصادي؟
  options: ["لأنه أدق في تمثيل قيمة الأصل", "لأنه الذي يحدد الضريبة المدفوعة فعلا", "لأنه أسرع دائما", "لأن المحاسبة لا تستخدم الاستهلاك"]
  correct: 1
  solution: |
    التحليل الاقتصادي يتابع النقد. الضريبة المدفوعة تحسب بقواعد القانون الضريبي، فهو الذي يؤثر في التدفقات.

- id: c05-i-09
  kind: mcq
  part: I
  vars: {B: 60000, n: 6}
  random: {B: [12000, 120000, 1000], n: [3, 10, 1]}
  calc:
    - H = B/n/2
    - w1 = B/n
    - w2 = B/(n + 1)
    - w3 = B/n/12*6*2
  text: |
    بالقسط الثابت مع قاعدة نصف السنة، ما استهلاك السنة الأولى لأصل أساسه [[B|g]] دينار وعمره [[yrs(n)]] بدون قيمة مقدرة؟
  options: ["[[w1|2]] دينار", "[[w2|2]] دينار", "[[H|2]] دينار", "[[w3|2]] دينار"]
  correct: 2
  solution: |
    نصف القسط الكامل:

    $$
    \frac{[[B|g]]}{2 \times [[n|n]]} = [[H|2]]
    $$

- id: c05-i-10
  kind: mcq
  part: I
  text: |
    شركة خسرت هذه السنة، والقانون يسمح بترحيل الخسارة خمس سنوات. ما أثر زيادة الاستهلاك هذه السنة؟
  options: ["لا أثر لأن الشركة لا تدفع ضريبة", "يزيد الخسارة المرحلة فيخفض ضريبة السنوات القادمة", "يرد الضريبة نقدا هذه السنة", "يزيد الضريبة"]
  correct: 1
  solution: |
    الاستهلاك يزيد الخسارة، والخسارة ترحل. الوفر يأتي لاحقا عندما تربح الشركة، بشرط أن تربح قبل انتهاء مدة الترحيل.
