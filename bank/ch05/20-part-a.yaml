items:

- id: c05-a-01
  kind: concept
  part: A
  text: |
    لماذا لا يحمل ثمن الآلة كاملا على سنة شرائها؟
  solution: |
    لأن الآلة تخدم سنوات وتساهم في دخل كل منها. توزيع تكلفتها على عمرها يعطي صورة صحيحة عن ربح كل سنة.

- id: c05-a-02
  kind: concept
  part: A
  text: |
    هل الاستهلاك تدفق نقدي؟ لماذا يدخل إذن في التحليل الاقتصادي بعد الضريبة؟
  solution: |
    لا. النقد خرج مرة واحدة عند الشراء. لكن الاستهلاك مصروف يطرح من الدخل الخاضع للضريبة، فيخفض الضريبة، والضريبة تدفق نقدي حقيقي.

- id: c05-a-03
  kind: concept
  part: A
  text: |
    ما الفرق بين القيمة الدفترية والقيمة السوقية لأصل؟
  solution: |
    القيمة الدفترية رقم محاسبي: الأساس ناقص الاستهلاك المتراكم. القيمة السوقية هي ما يدفعه مشتر حقيقي اليوم. قد تكون أعلى أو أقل من الدفترية.

- id: c05-a-04
  kind: concept
  part: A
  text: |
    لماذا لا تستهلك الأرض؟
  solution: |
    لأنها لا تفقد قيمتها بالاستخدام أو بمرور الزمن، وقد ترتفع قيمتها.

- id: c05-a-05
  kind: concept
  part: A
  text: |
    مجموع الاستهلاك واحد في كل الطرق. لماذا تفضل الشركة الطرق السريعة؟
  solution: |
    لأن الاستهلاك السريع يخفض الضريبة في السنوات الأولى ويرفعها في الأخيرة. الضريبة المؤجلة أقل قيمة حالية، فالشركة تكسب قيمة المال مع الزمن.

- id: c05-a-06
  kind: concept
  part: A
  text: |
    ما المشكلة في القسط المتناقص وحده؟ وكيف تحل؟
  solution: |
    لا يصل إلى القيمة المقدرة في نهاية العمر، فيبقى جزء من الأساس بدون استهلاك. الحل التحول إلى القسط الثابت في السنة التي يصبح فيها أكبر.

- id: c05-a-07
  kind: concept
  part: A
  text: |
    ما الوفر الضريبي من الاستهلاك؟
  solution: |
    هو النقص في الضريبة بسبب طرح الاستهلاك من الدخل، ويساوي نسبة الضريبة مضروبة في الاستهلاك.

- id: c05-a-08
  kind: concept
  part: A
  text: |
    بيع أصل بأكثر من قيمته الدفترية. لماذا يخضع الفرق للضريبة؟
  solution: |
    لأن الشركة طرحت في السنوات السابقة استهلاكا أكبر من النقص الحقيقي في قيمة الأصل، فدفعت ضريبة أقل. الضريبة على الفرق تسترد هذا الزائد.

- id: c05-a-09
  kind: concept
  part: A
  text: |
    لماذا قد تختلف طريقة الاستهلاك في الدفاتر المحاسبية عنها في الإقرار الضريبي؟
  solution: |
    المحاسبة تختار الطريقة التي تعكس الاستهلاك الحقيقي للأصل. القانون الضريبي يحدد ما يسمح بطرحه من الدخل. في التحليل الاقتصادي نستخدم الاستهلاك الضريبي.

- id: c05-a-10
  kind: concept
  part: A
  text: |
    شركة خاسرة لا تدفع ضريبة هذه السنة. هل يفيدها الاستهلاك؟
  solution: |
    نعم، إذا سمح القانون بترحيل الخسارة. الاستهلاك يزيد الخسارة المرحلة، فيخفض الضريبة في سنوات الربح القادمة. لكن قيمته أقل لأن الوفر يتأخر.
