items:

- id: c05-b-01
  kind: problem
  part: B
  vars: {B: 45000, S: 5000, n: 8}
  random: {B: [10000, 100000, 1000], S: [0, 10000, 500], n: [3, 12, 1]}
  calc:
    - D = (B - S)/n
  text: |
    أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]. ما الاستهلاك السنوي بالقسط الثابت؟
  solution: |
    $$
    D = \frac{[[B|g]] - [[S|g]]}{[[n|n]]} = [[D|2]]
    $$

- id: c05-b-02
  kind: problem
  part: B
  vars: {B: 45000, S: 5000, n: 8, k: 3}
  random: {B: [10000, 100000, 1000], S: [0, 10000, 500], n: [4, 12, 1], k: [1, 3, 1]}
  calc:
    - D = (B - S)/n
    - BV = B - k*D
  text: |
    للأصل السابق، ما القيمة الدفترية بعد [[yrs(k)]]؟
  solution: |
    $$
    BV_{[[k|n]]} = [[B|g]] - [[k|n]] \times [[D|2]] = [[BV|2]]
    $$

- id: c05-b-03
  kind: problem
  part: B
  vars: {P: 70000, T: 2500, I: 6000, n: 10, S: 7000}
  random: {P: [20000, 150000, 1000], T: [500, 5000, 250], I: [1000, 10000, 500], n: [5, 15, 1], S: [0, 15000, 500]}
  calc:
    - B = P + T + I
    - D = (B - S)/n
  text: |
    آلة سعرها [[P|g]] دينار، ونقلها [[T|g]] وتركيبها [[I|g]] دينار. عمرها [[yrs(n)]] وقيمتها المقدرة [[S|g]] دينار. ما الاستهلاك السنوي بالقسط الثابت؟
  solution: |
    $$
    I = [[P|g]] + [[T|g]] + [[I|g]] = [[B|g]]
    $$

    $$
    D = \frac{[[B|g]] - [[S|g]]}{[[n|n]]} = [[D|2]]
    $$

- id: c05-b-04
  kind: problem
  part: B
  vars: {B: 30000, BV: 18000, k: 4}
  random: {B: [10000, 80000, 1000], k: [2, 6, 1]}
  calc:
    - BV = floor(B*0.55/500)*500
    - D = (B - BV)/k
  text: |
    القيمة الدفترية لأصل بعد [[yrs(k)]] [[BV|g]] دينار، وأساسه [[B|g]] دينار. ما الاستهلاك السنوي بالقسط الثابت؟
  solution: |
    $$
    D = \frac{[[B|g]] - [[BV|g]]}{[[k|n]]} = [[D|2]]
    $$

- id: c05-b-05
  kind: problem
  part: B
  vars: {B: 30000, S: 3000, n: 10}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500], n: [4, 12, 1]}
  calc:
    - D = (B - S)/n
  text: |
    أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، واستهلاكه السنوي بالقسط الثابت [[D|2]] دينار. ما عمره؟
  solution: |
    $$
    n = \frac{[[B|g]] - [[S|g]]}{[[D|2]]} = [[n|n]]
    $$

- id: c05-b-06
  kind: problem
  part: B
  vars: {B: 24000, n: 6}
  random: {B: [6000, 60000, 1000], n: [3, 10, 1]}
  calc:
    - r = 1/n
    - D = B/n
  text: |
    حاسوب خادم أساسه [[B|g]] دينار، وعمره [[yrs(n)]] بدون قيمة مقدرة. ما نسبة الاستهلاك السنوية؟ وما الاستهلاك؟
  solution: |
    $$
    r = \frac{1}{[[n|n]]} = [[r|%2]], \qquad D = [[r|%2]] \times [[B|g]] = [[D|2]]
    $$

- id: c05-b-07
  kind: problem
  part: B
  vars: {B: 50000, S: 5000, n: 5}
  random: {B: [10000, 100000, 1000], S: [0, 10000, 500], n: [3, 8, 1]}
  calc:
    - D = (B - S)/n
    - b1 = B - D
    - b2 = B - 2*D
    - b3 = B - 3*D
  text: |
    ابن جدول القيمة الدفترية لأول ثلاث سنوات لأصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]، بالقسط الثابت.
  solution: |
    الاستهلاك السنوي [[D|2]] دينار.

    | السنة | الاستهلاك | القيمة الدفترية |
    | --- | --- | --- |
    | 1 | [[D|2]] | [[b1|2]] |
    | 2 | [[D|2]] | [[b2|2]] |
    | 3 | [[D|2]] | [[b3|2]] |

- id: c05-b-08
  kind: problem
  part: B
  vars: {B: 400000, L: 100000, n: 25}
  random: {B: [150000, 800000, 10000], L: [30000, 200000, 5000], n: [20, 40, 5]}
  calc:
    - D = (B - L)/n
  text: |
    شركة اشترت مبنى مع أرضه بمبلغ [[B|g]] دينار، منها [[L|g]] دينار قيمة الأرض. عمر المبنى [[yrs(n)]] بدون قيمة مقدرة. ما الاستهلاك السنوي؟
  solution: |
    الأرض لا تستهلك، فنطرحها من الأساس:

    $$
    D = \frac{[[B|g]] - [[L|g]]}{[[n|n]]} = [[D|2]]
    $$

- id: c05-b-09
  kind: problem
  part: B
  vars: {B: 90000, S: 10000, n: 8, h: 3000}
  random: {B: [30000, 150000, 1000], S: [0, 20000, 1000], n: [5, 12, 1], h: [1000, 5000, 250]}
  calc:
    - D = (B - S)/n
    - ph = D/h
  text: |
    آلة CNC أساسها [[B|g]] دينار، وقيمتها المقدرة [[S|g]] دينار، وعمرها [[yrs(n)]]. تعمل [[h|g]] ساعة في السنة. ما تكلفة الاستهلاك لكل ساعة تشغيل؟
  solution: |
    $$
    D = [[D|2]], \qquad \frac{[[D|2]]}{[[h|g]]} = [[ph|2]]
    $$

    هذا الرقم يدخل في تسعير ساعة الآلة عند تقدير تكلفة الطلبيات.

- id: c05-b-10
  kind: problem
  part: B
  vars: {B: 60000, n: 6, k: 2, n2: 6}
  random: {B: [20000, 120000, 1000], n: [5, 10, 1], k: [1, 3, 1], n2: [3, 8, 1]}
  calc:
    - D = B/n
    - BV = B - k*D
    - D2 = BV/n2
  text: |
    آلة أساسها [[B|g]] دينار، وعمرها المقدر [[yrs(n)]] بدون قيمة مقدرة. بعد [[yrs(k)]] تبين أنها ستعمل [[yrs(n2)]] أخرى. ما الاستهلاك السنوي الجديد بالقسط الثابت؟
  solution: |
    نوزع القيمة الدفترية الحالية على العمر الباقي الجديد، ولا نعدل السنوات الماضية:

    $$
    BV_{[[k|n]]} = [[B|g]] - [[k|n]] \times [[D|2]] = [[BV|2]]
    $$

    $$
    D' = \frac{[[BV|2]]}{[[n2|n]]} = [[D2|2]]
    $$

- id: c05-b-11
  kind: problem
  part: B
  vars: {B: 25000, S: 2500, n: 5, i: 0.10}
  random: {B: [10000, 80000, 1000], S: [0, 8000, 500], n: [3, 10, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - D = (B - S)/n
    - PD = D*PA(i, n)
  text: |
    ما القيمة الحالية لاستهلاك أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]، بالقسط الثابت بنسبة [[i|%]]؟
  solution: |
    $$
    P = [[D|2]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PD|2]]
    $$

- id: c05-b-12
  kind: problem
  part: B
  vars: {B: 40000, S: 4000, n: 6, M: 15000, k: 4}
  random: {B: [15000, 90000, 1000], S: [0, 8000, 500], n: [5, 10, 1], M: [3000, 40000, 500], k: [2, 4, 1]}
  calc:
    - D = (B - S)/n
    - BV = B - k*D
    - G = M - BV
  text: |
    أصل أساسه [[B|g]] دينار، وقيمته المقدرة [[S|g]] دينار، وعمره [[yrs(n)]]. قيمته السوقية بعد [[yrs(k)]] [[M|g]] دينار. قارن القيمة السوقية بالقيمة الدفترية.
  solution: |
    $$
    BV = [[B|g]] - [[k|n]] \times [[D|2]] = [[BV|2]]
    $$

    الفرق [[G|2]] دينار. [[pick(G >= 0, 'القيمة السوقية أعلى، فالاستهلاك أسرع من النقص الحقيقي في القيمة.', 'القيمة السوقية أقل، فالأصل يفقد قيمته أسرع من الاستهلاك المحاسبي.')]]
