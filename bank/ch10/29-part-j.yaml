- id: c10-j-01
  kind: case
  part: J
  calc:
    - EA = 0.5*700000 + 0.5*(-200000)
    - EB = 0.5*350000 + 0.5*80000
    - Eb = max(EA, EB, 0)
    - Ep = 0.5*700000 + 0.5*max(-200000, 80000, 0)
    - qh = 0.5*0.85 + 0.5*0.15
    - ph = 0.5*0.85/qh
    - pl = 0.5*0.15/(1 - qh)
    - Vh = max(ph*700000 + (1 - ph)*(-200000), ph*350000 + (1 - ph)*80000, 0)
    - Vl = max(pl*700000 + (1 - pl)*(-200000), pl*350000 + (1 - pl)*80000, 0)
    - Es = qh*Vh + (1 - qh)*Vl
  text: |
    **حالة 10.1: توسعة مصنع أعلاف في طولكرم**

    مصنع أعلاف يدرس زيادة طاقته، لأن مزارع الدواجن في المنطقة تتوسع. الطلب الإضافي قد يكون مرتفعا أو منخفضا، باحتمالين متساويين. القيمة الحالية بالدينار:

    | الخيار | طلب مرتفع | طلب منخفض |
    | --- | --- | --- |
    | أ: خط جديد كامل | 700,000 | -200,000 |
    | ب: تحسين الخط الحالي | 350,000 | 80,000 |
    | ج: لا شيء | 0 | 0 |

    شركة استشارات زراعية تعرض دراسة للطلب بمبلغ 40,000 دينار. دقتها 85%: إذا كان الطلب مرتفعا تقول ذلك باحتمال 0.85، وإذا كان منخفضا تقول ذلك باحتمال 0.85.

    (أ) ما أفضل قرار بدون دراسة؟ (ب) ما قيمة المعلومات الكاملة؟ (ج) ما قيمة الدراسة؟ (د) هل يشتريها المصنع؟
  solution: |
    (أ)

    $$
    \mathrm{E}_a = [[EA|g]], \qquad \mathrm{E}_b = [[EB|g]], \qquad \mathrm{E}_c = 0
    $$

    الأفضل [[pick(EA >= EB, 'الخط الجديد', 'تحسين الخط الحالي')]]، بقيمة [[Eb|g]] دينار.

    (ب) مع معلومات كاملة: عند الطلب المرتفع الخط الجديد، 700,000. عند المنخفض التحسين، 80,000.

    $$
    \mathrm{EVPI} = [[Ep|g]] - [[Eb|g]] = [[Ep-Eb|g]]
    $$

    (ج) احتمال أن تقول الدراسة "مرتفع" [[qh|d2]]. بعدها احتمال الطلب المرتفع [[ph|f4]]، وبعد "منخفض" [[pl|f4]].

    | نتيجة الدراسة | أ | ب | الأفضل |
    | --- | --- | --- | --- |
    | مرتفع | [[ph*700000+(1-ph)*(-200000)|0]] | [[ph*350000+(1-ph)*80000|0]] | [[Vh|0]] |
    | منخفض | [[pl*700000+(1-pl)*(-200000)|0]] | [[pl*350000+(1-pl)*80000|0]] | [[Vl|0]] |

    $$
    \mathrm{E}(\mathrm{study}) = [[qh|d2]] \times [[Vh|0]] + [[1-qh|d2]] \times [[Vl|0]] = [[Es|2]]
    $$

    قيمة الدراسة [[Es-Eb|2]] دينار.

    (د) [[pick(Es - Eb > 40000, 'قيمتها أعلى من سعرها 40,000، فيشتريها المصنع، ثم يقرر حسب نتيجتها.', 'قيمتها أقل من سعرها 40,000، فلا يشتريها المصنع.')]]

- id: c10-j-02
  kind: case
  part: J
  calc:
    - a = PA(0.10, 15)
    - P11 = -140000 + 0.08*180000*a - 4000*a
    - P12 = -140000 + 0.08*220000*a - 4000*a
    - P21 = -140000 + 0.11*180000*a - 4000*a
    - P22 = -140000 + 0.11*220000*a - 4000*a
    - P31 = -140000 + 0.14*180000*a - 4000*a
    - P32 = -140000 + 0.14*220000*a - 4000*a
    - m = 0.30*0.4*P11 + 0.30*0.6*P12 + 0.50*0.4*P21 + 0.50*0.6*P22 + 0.20*0.4*P31 + 0.20*0.6*P32
    - v = 0.30*0.4*(P11 - m)**2 + 0.30*0.6*(P12 - m)**2 + 0.50*0.4*(P21 - m)**2 + 0.50*0.6*(P22 - m)**2 + 0.20*0.4*(P31 - m)**2 + 0.20*0.6*(P32 - m)**2
    - pl = pick(P11 < 0, 0.12, 0) + pick(P12 < 0, 0.18, 0) + pick(P21 < 0, 0.20, 0) + pick(P22 < 0, 0.30, 0) + pick(P31 < 0, 0.08, 0) + pick(P32 < 0, 0.12, 0)
  text: |
    **حالة 10.2: محطة طاقة شمسية على سطح مصنع**

    مصنع يدرس محطة شمسية تكلف 140,000 دينار، وتعمل 15 سنة. صيانتها 4,000 دينار سنويا. يبيع الكهرباء للشبكة بعقد طويل، لكن متغيرين غير مؤكدين:

    - سعر الكيلوواط ساعة في العقد: 0.08 دينار باحتمال 0.30، أو 0.11 باحتمال 0.50، أو 0.14 باحتمال 0.20.
    - الإنتاج السنوي بالكيلوواط ساعة: 180,000 باحتمال 0.4، أو 220,000 باحتمال 0.6، حسب الغبار والطقس.

    المتغيران مستقلان. الحد الأدنى 10%.

    (أ) ابن جدول الحالات الست. (ب) احسب القيمة الحالية المتوقعة والانحراف المعياري. (ج) ما احتمال الخسارة؟ (د) ما الذي يستحق دراسة أدق قبل القرار؟
  solution: |
    (أ) القيمة الحالية في كل حالة:

    $$
    PW = -140{,}000 + (\mathrm{price} \times \mathrm{output} - 4{,}000)\,(P/A,\ 10\%,\ 15)
    $$

    | السعر | الإنتاج | الاحتمال | القيمة الحالية |
    | --- | --- | --- | --- |
    | 0.08 | 180,000 | 0.12 | [[P11|0]] |
    | 0.08 | 220,000 | 0.18 | [[P12|0]] |
    | 0.11 | 180,000 | 0.20 | [[P21|0]] |
    | 0.11 | 220,000 | 0.30 | [[P22|0]] |
    | 0.14 | 180,000 | 0.08 | [[P31|0]] |
    | 0.14 | 220,000 | 0.12 | [[P32|0]] |

    (ب)

    $$
    \mathrm{E}(PW) = [[m|2]], \qquad \sigma = [[sqrt(v)|2]]
    $$

    (ج) احتمال الخسارة [[pl|d2]]. [[pick(m < 0, 'القيمة المتوقعة سالبة، والمشروع يخسر في حالات كثيرة. بهذه الأرقام لا يستحق التنفيذ.', 'القيمة المتوقعة موجبة، لكن الخسارة ممكنة.')]]

    (د) أثر السعر أكبر من أثر الإنتاج: الفرق بين أعلى سعر وأدناه يغير القيمة الحالية أكثر من الفرق بين الإنتاجين. الأولوية للتفاوض على سعر العقد، أو البحث عن عقد بسعر مضمون.

- id: c10-j-03
  kind: case
  part: J
  calc:
    - c0 = 5000*(0.35*1 + 0.25*2 + 0.15*3 + 0.05*4)
    - c1 = 600*0.2 + 5000*(0.25*1 + 0.15*2 + 0.05*3)
    - c2 = 600*(0.2*2 + 0.35*1) + 5000*(0.15*1 + 0.05*2)
    - c3 = 600*(0.2*3 + 0.35*2 + 0.25*1) + 5000*(0.05*1)
    - c4 = 600*(0.2*4 + 0.35*3 + 0.25*2 + 0.15*1)
    - m = min(c0, c1, c2, c3, c4)
  text: |
    **حالة 10.3: قطع غيار لخط تعبئة**

    خط تعبئة يحتاج محركا خاصا يتعطل أحيانا. عدد المحركات التي يحتاجها في سنة:

    | العدد | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | الاحتمال | 0.20 | 0.35 | 0.25 | 0.15 | 0.05 |

    كل محرك احتياطي في المخزن يكلف 600 دينار سنويا: فائدة ثمنه، والتخزين، واحتمال التقادم. كل محرك ناقص عند الحاجة يكلف 5,000 دينار: توقف الإنتاج حتى يصل محرك بالطائرة. كم محركا يحتفظ المصنع في المخزن في بداية السنة؟
  solution: |
    لكل مستوى مخزون k، نحسب التكلفة المتوقعة: المحركات الزائدة ضرب 600، والمحركات الناقصة ضرب 5,000.

    $$
    \mathrm{E}(\mathrm{cost}_k) = 600\,\mathrm{E}(\max(k - D, 0)) + 5{,}000\,\mathrm{E}(\max(D - k, 0))
    $$

    | المخزون | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | التكلفة المتوقعة | [[c0|0]] | [[c1|0]] | [[c2|0]] | [[c3|0]] | [[c4|0]] |

    أقل تكلفة متوقعة [[m|g]] دينار، عند [[pick(c0 == m, 'صفر', pick(c1 == m, 'محرك واحد', pick(c2 == m, 'محركين', pick(c3 == m, 'ثلاثة محركات', 'أربعة محركات'))))]].

    تكلفة النقص أعلى بكثير من تكلفة التخزين، فيحتفظ المصنع بمخزون أعلى من المتوسط المتوقع للطلب، [[0.35*1+0.25*2+0.15*3+0.05*4|2]] محرك.
