- id: c10-f-01
  kind: problem
  part: F
  vars: {G: 120000, L: -70000, p: 0.55}
  random: {G: [50000, 200000, 5000], L: [-120000, -20000, 5000], p: [0.3, 0.7, 0.05]}
  calc:
    - Eb = max(p*G + (1 - p)*L, 0)
    - Ep = p*G
    - V = Ep - Eb
  text: |
    منتج جديد يربح [[G|g]] دينار إذا نجح، باحتمال [[p|d2]]، ويخسر [[abs(L)|g]] دينار إذا فشل. البديل عدم الإطلاق، بقيمة صفر. ما قيمة المعلومات الكاملة عن نجاح المنتج؟
  solution: |
    بدون معلومات، أفضل قيمة متوقعة [[Eb|2]] دينار.

    مع معلومات كاملة: إذا عرفت الشركة أنه سينجح تطلقه وتربح [[G|g]]. إذا عرفت أنه سيفشل لا تطلقه، فلا تخسر شيئا:

    $$
    [[p|d2]] \times [[G|g]] + [[1-p|d2]] \times 0 = [[Ep|2]]
    $$

    $$
    \mathrm{EVPI} = [[Ep|2]] - [[Eb|2]] = [[V|2]]
    $$

- id: c10-f-02
  kind: problem
  part: F
  vars: {aH: 300000, aL: -80000, bH: 180000, bL: 20000, p: 0.5}
  random: {aH: [200000, 400000, 10000], aL: [-150000, -20000, 10000], bH: [120000, 250000, 10000], bL: [-20000, 60000, 10000], p: [0.3, 0.7, 0.05]}
  calc:
    - Eb = max(p*aH + (1 - p)*aL, p*bH + (1 - p)*bL)
    - Ep = p*max(aH, bH) + (1 - p)*max(aL, bL)
    - V = Ep - Eb
  text: |
    بديل أ يعطي [[aH|g]] أو [[aL|g]] دينار، وبديل ب يعطي [[bH|g]] أو [[bL|g]] دينار، والحالة الأولى باحتمال [[p|d2]]. احسب قيمة المعلومات الكاملة.
  solution: |
    بدون معلومات:

    $$
    \max([[p*aH+(1-p)*aL|0]],\ [[p*bH+(1-p)*bL|0]]) = [[Eb|2]]
    $$

    مع معلومات، أفضل بديل في كل حالة:

    $$
    [[p|d2]] \times [[max(aH, bH)|g]] + [[1-p|d2]] \times [[max(aL, bL)|g]] = [[Ep|2]]
    $$

    $$
    \mathrm{EVPI} = [[V|2]]
    $$

- id: c10-f-03
  kind: problem
  part: F
  vars: {V: 40000, S: 25000}
  random: {V: [10000, 80000, 1000], S: [5000, 100000, 1000]}
  calc:
    - z = V - S
  text: |
    قيمة المعلومات الكاملة لقرار [[V|g]] دينار. شركة استشارات تعرض دراسة بمبلغ [[S|g]] دينار. ماذا تستنتج قبل أي حساب آخر؟
  solution: |
    [[pick(S >= V, 'الدراسة أغلى من قيمة المعلومات الكاملة، فلا تستحق مهما كانت دقيقة. ترفض بدون حساب.', 'الدراسة أرخص من قيمة المعلومات الكاملة، فقد تستحق. لكن الدراسة غير كاملة، فيجب حساب قيمتها الفعلية بدقتها قبل الشراء.')]]

- id: c10-f-04
  kind: problem
  part: F
  vars: {p: 0.5, a: 0.8}
  random: {p: [0.3, 0.7, 0.05], a: [0.65, 0.95, 0.05]}
  calc:
    - qh = p*a + (1 - p)*(1 - a)
    - ph = p*a/qh
    - pl = p*(1 - a)/(1 - qh)
  text: |
    احتمال نجاح منتج [[p|d2]] قبل أي دراسة. دراسة سوق تصيب باحتمال [[a|d2]]، سواء كان المنتج سينجح أو يفشل. إذا قالت الدراسة "ناجح"، ما احتمال النجاح؟ وإذا قالت "فاشل"؟
  solution: |
    احتمال أن تقول "ناجح":

    $$
    [[p|d2]] \times [[a|d2]] + [[1-p|d2]] \times [[1-a|d2]] = [[qh|f4]]
    $$

    بقاعدة بايز:

    $$
    P(\mathrm{success} \mid \mathrm{yes}) = \frac{[[p|d2]] \times [[a|d2]]}{[[qh|f4]]} = [[ph|f4]]
    $$

    $$
    P(\mathrm{success} \mid \mathrm{no}) = \frac{[[p|d2]] \times [[1-a|d2]]}{[[1-qh|f4]]} = [[pl|f4]]
    $$

    الدراسة لا تكشف الحقيقة، لكنها تحرك الاحتمال في الاتجاه الصحيح.

- id: c10-f-05
  kind: problem
  part: F
  vars: {G: 120000, L: -70000, p: 0.5, a: 0.8}
  random: {G: [50000, 200000, 5000], L: [-120000, -20000, 5000], p: [0.3, 0.7, 0.05], a: [0.65, 0.95, 0.05]}
  calc:
    - qh = p*a + (1 - p)*(1 - a)
    - ph = p*a/qh
    - pl = p*(1 - a)/(1 - qh)
    - Vh = max(ph*G + (1 - ph)*L, 0)
    - Vl = max(pl*G + (1 - pl)*L, 0)
    - Es = qh*Vh + (1 - qh)*Vl
    - Eb = max(p*G + (1 - p)*L, 0)
    - V = Es - Eb
  text: |
    منتج يربح [[G|g]] دينار إذا نجح، ويخسر [[abs(L)|g]] إذا فشل. احتمال النجاح [[p|d2]]. البديل عدم الإطلاق. دراسة سوق تصيب باحتمال [[a|d2]] في الحالتين. كم تستحق الدراسة؟
  solution: |
    احتمال "ناجح" [[qh|f4]]. بعد "ناجح" احتمال النجاح [[ph|f4]]، وبعد "فاشل" [[pl|f4]].

    | نتيجة الدراسة | القيمة المتوقعة للإطلاق | أفضل قرار | قيمته |
    | --- | --- | --- | --- |
    | ناجح | [[ph*G+(1-ph)*L|0]] | [[pick(ph*G+(1-ph)*L > 0, 'إطلاق', 'لا إطلاق')]] | [[Vh|0]] |
    | فاشل | [[pl*G+(1-pl)*L|0]] | [[pick(pl*G+(1-pl)*L > 0, 'إطلاق', 'لا إطلاق')]] | [[Vl|0]] |

    $$
    \mathrm{E}(\mathrm{with\ study}) = [[qh|f4]] \times [[Vh|0]] + [[1-qh|f4]] \times [[Vl|0]] = [[Es|2]]
    $$

    بدون دراسة [[Eb|2]] دينار. قيمة الدراسة [[V|2]] دينار.

- id: c10-f-06
  kind: problem
  part: F
  vars: {G: 100000, L: -60000, p: 0.6}
  random: {G: [50000, 200000, 5000], L: [-120000, -20000, 5000], p: [0.3, 0.7, 0.05]}
  calc:
    - qh = p*0.5 + (1 - p)*0.5
    - V = 0
  text: |
    للقرار: ربح [[G|g]] دينار أو خسارة [[abs(L)|g]] دينار، واحتمال النجاح [[p|d2]]. دراسة تصيب باحتمال 0.5 فقط. كم تستحق؟
  solution: |
    دراسة تصيب نصف المرات مثل رمي قطعة نقد. احتمال النجاح بعد أي نتيجة يبقى [[p|d2]]، فلا يتغير القرار. قيمتها صفر.

- id: c10-f-07
  kind: problem
  part: F
  vars: {G: 150000, L: -100000, p: 0.5}
  random: {G: [80000, 200000, 5000], L: [-150000, -50000, 5000], p: [0.4, 0.6, 0.05]}
  calc:
    - Eb = max(p*G + (1 - p)*L, 0)
    - V1 = p*G - Eb
  text: |
    قرار إطلاق منتج: ربح [[G|g]] دينار أو خسارة [[abs(L)|g]] دينار، واحتمال النجاح [[p|d2]]. لماذا تكون قيمة المعلومات أكبر عندما يكون القرار صعبا، أي الاحتمال قريبا من نقطة التعادل؟ احسب قيمة المعلومات الكاملة هنا.
  solution: |
    $$
    \mathrm{EVPI} = [[p|d2]] \times [[G|g]] - [[Eb|2]] = [[V1|2]]
    $$

    عندما يكون القرار واضحا، المعلومات نادرا ما تغيره. عندما يكون الاحتمال قريبا من نقطة التعادل، أي معلومة قد تقلب القرار، فترتفع قيمتها.

- id: c10-f-08
  kind: problem
  part: F
  text: |
    مهندس يقترح إجراء تجربة إنتاج تكلف 15,000 دينار قبل شراء خط جديد. قيمة المعلومات الكاملة للقرار 40,000 دينار، وقيمة التجربة المحسوبة بدقتها 12,000 دينار. هل تجري الشركة التجربة؟
  solution: |
    لا. قيمة التجربة 12,000 دينار أقل من تكلفتها 15,000. كونها أرخص من قيمة المعلومات الكاملة لا يكفي، لأن التجربة غير كاملة.
