items:

- id: c10-e-01
  kind: problem
  part: E
  vars: {G: 120000, L: -70000, p: 0.55}
  random: {G: [50000, 200000, 5000], L: [-120000, -20000, 5000], p: [0.3, 0.7, 0.05]}
  calc:
    - E = p*G + (1 - p)*L
  text: |
    شركة تدرس إطلاق منتج جديد. إذا نجح، باحتمال [[p|d2]]، تربح [[G|g]] دينار بالقيمة الحالية. إذا فشل، تخسر [[abs(L)|g]] دينار. البديل عدم الإطلاق، بقيمة صفر. ارسم الشجرة وقرر.
  solution: |
    - قرار: إطلاق
        - نجاح، باحتمال [[p|d2]]: [[G|g]]
        - فشل، باحتمال [[1-p|d2]]: [[L|g]]
    - قرار: عدم الإطلاق: 0

    $$
    \mathrm{E}(\mathrm{launch}) = [[p|d2]] \times [[G|g]] + [[1-p|d2]] \times ([[L|g]]) = [[E|2]]
    $$

    القرار: [[pick(E > 0, 'الإطلاق', 'عدم الإطلاق')]].

- id: c10-e-02
  kind: problem
  part: E
  vars: {aH: 300000, aL: -80000, bH: 180000, bL: 20000, cH: 90000, cL: 60000, p: 0.5}
  random: {aH: [200000, 400000, 10000], aL: [-150000, -20000, 10000], bH: [120000, 250000, 10000], bL: [-20000, 60000, 10000], cH: [60000, 120000, 5000], cL: [40000, 80000, 5000], p: [0.3, 0.7, 0.05]}
  calc:
    - Ea = p*aH + (1 - p)*aL
    - Eb = p*bH + (1 - p)*bL
    - Ec = p*cH + (1 - p)*cL
    - B = max(Ea, Eb, Ec)
  text: |
    مصنع يختار بين ثلاث تقنيات. القيمة الحالية لكل منها حسب الطلب، والطلب مرتفع باحتمال [[p|d2]]:

    | التقنية | طلب مرتفع | طلب منخفض |
    | --- | --- | --- |
    | أ: آلية بالكامل | [[aH|g]] | [[aL|g]] |
    | ب: نصف آلية | [[bH|g]] | [[bL|g]] |
    | ج: يدوية | [[cH|g]] | [[cL|g]] |

    أي تقنية يختار بالقيمة المتوقعة؟
  solution: |
    $$
    \mathrm{E}_a = [[Ea|2]], \qquad \mathrm{E}_b = [[Eb|2]], \qquad \mathrm{E}_c = [[Ec|2]]
    $$

    الأعلى: [[pick(Ea == B, 'أ', pick(Eb == B, 'ب', 'ج'))]].

- id: c10-e-03
  kind: problem
  part: E
  vars: {a1: -40000, a2: 30000, a3: 110000, b1: 10000, b2: 35000, b3: 60000, p1: 0.3, p2: 0.4}
  random: {a1: [-80000, -10000, 5000], a2: [10000, 50000, 5000], a3: [80000, 160000, 5000], b1: [0, 25000, 5000], b2: [25000, 45000, 5000], b3: [45000, 80000, 5000], p1: [0.2, 0.35, 0.05], p2: [0.3, 0.45, 0.05]}
  calc:
    - p3 = 1 - p1 - p2
    - Ea = p1*a1 + p2*a2 + p3*a3
    - Eb = p1*b1 + p2*b2 + p3*b3
  text: |
    بديلان، وثلاث حالات للسوق باحتمالات [[p1|d2]] و[[p2|d2]] و[[p3|d2]]. أ يعطي [[a1|g]] أو [[a2|g]] أو [[a3|g]] دينار. ب يعطي [[b1|g]] أو [[b2|g]] أو [[b3|g]] دينار. أيهما أفضل بالقيمة المتوقعة؟
  solution: |
    $$
    \mathrm{E}_a = [[Ea|2]], \qquad \mathrm{E}_b = [[Eb|2]]
    $$

    الأفضل: [[pick(Ea >= Eb, 'أ', 'ب')]].

- id: c10-e-04
  kind: problem
  part: E
  vars: {Ph: 90000, Pl: 50000, wh: 0.3, wl: 0.7, B: 4000}
  random: {Ph: [60000, 150000, 5000], Pl: [20000, 59000, 1000], wh: [0.15, 0.45, 0.05], wl: [0.5, 0.85, 0.05], B: [1000, 8000, 500]}
  calc:
    - Eh = wh*Ph - B
    - El = wl*Pl - B
  text: |
    مقاول يتقدم لعطاء بسعر مرتفع أو منخفض. بالسعر المرتفع يربح [[Ph|g]] دينار إذا فاز، واحتمال الفوز [[wh|d2]]. بالسعر المنخفض يربح [[Pl|g]] دينار، واحتمال الفوز [[wl|d2]]. إعداد العرض يكلف [[B|g]] دينار في الحالتين. أي سعر يقدم؟
  solution: |
    - قرار: سعر مرتفع
        - فوز، باحتمال [[wh|d2]]: [[Ph-B|g]]
        - خسارة، باحتمال [[1-wh|d2]]: [[-B|g]]
    - قرار: سعر منخفض
        - فوز، باحتمال [[wl|d2]]: [[Pl-B|g]]
        - خسارة، باحتمال [[1-wl|d2]]: [[-B|g]]

    $$
    \mathrm{E}_{high} = [[wh|d2]] \times [[Ph|g]] - [[B|g]] = [[Eh|2]]
    $$

    $$
    \mathrm{E}_{low} = [[wl|d2]] \times [[Pl|g]] - [[B|g]] = [[El|2]]
    $$

    يقدم السعر [[pick(Eh >= El, 'المرتفع', 'المنخفض')]].

- id: c10-e-05
  kind: problem
  part: E
  vars: {Q1: 5000, Q2: 12000, p: 0.6, F: 30000, vm: 8, vb: 12}
  random: {Q1: [2000, 6000, 500], Q2: [8000, 20000, 500], p: [0.3, 0.7, 0.05], F: [10000, 60000, 1000], vm: [4, 10, 0.5], vb: [10, 18, 0.5]}
  calc:
    - vb = max(vb, vm + 2)
    - M1 = F + vm*Q1
    - M2 = F + vm*Q2
    - B1 = vb*Q1
    - B2 = vb*Q2
    - Em = p*M1 + (1 - p)*M2
    - Eb = p*B1 + (1 - p)*B2
  text: |
    مصنع يصنع قطعة بتكلفة ثابتة سنوية [[F|g]] دينار ومتغيرة [[vm|d2]] دينار للقطعة، أو يشتريها بسعر [[vb|d2]] دينار. الطلب السنوي [[Q1|g]] قطعة باحتمال [[p|d2]]، أو [[Q2|g]] قطعة. أيهما أرخص بالقيمة المتوقعة؟
  solution: |
    | | طلب [[Q1|g]] | طلب [[Q2|g]] | المتوقع |
    | --- | --- | --- | --- |
    | التصنيع | [[M1|0]] | [[M2|0]] | [[Em|0]] |
    | الشراء | [[B1|0]] | [[B2|0]] | [[Eb|0]] |

    الأرخص: [[pick(Em <= Eb, 'التصنيع', 'الشراء')]]. التصنيع يحمل تكلفة ثابتة تدفع حتى لو جاء الطلب ضعيفا، فهو أخطر عندما يكون الطلب غير مؤكد.

- id: c10-e-06
  kind: problem
  part: E
  vars: {c1: 50000, ps: 0.4, H: 600000, L: -100000, ph: 0.5}
  random: {c1: [20000, 100000, 5000], ps: [0.2, 0.6, 0.05], H: [300000, 900000, 50000], L: [-200000, -20000, 10000], ph: [0.3, 0.7, 0.05]}
  calc:
    - Ec = ph*H + (1 - ph)*L
    - Vc = max(Ec, 0)
    - E = -c1 + ps*Vc
  text: |
    شركة أدوية بيطرية تدرس تطوير منتج. البحث يكلف [[c1|g]] دينار، وينجح باحتمال [[ps|d2]]. إذا نجح، تقرر هل تطرحه: الطرح يعطي [[H|g]] دينار إذا كان السوق جيدا، باحتمال [[ph|d2]]، أو [[L|g]] دينار إذا كان ضعيفا. إذا فشل البحث، لا شيء. هل تبدأ البحث؟
  solution: |
    - قرار: ابدأ البحث، بتكلفة [[c1|g]]
        - نجاح، باحتمال [[ps|d2]]: قرار ثان
            - اطرح المنتج
                - سوق جيد، باحتمال [[ph|d2]]: [[H|g]]
                - سوق ضعيف، باحتمال [[1-ph|d2]]: [[L|g]]
            - لا تطرح: 0
        - فشل، باحتمال [[1-ps|d2]]: 0
    - قرار: لا تبدأ: 0

    من اليمين: قيمة الطرح المتوقعة:

    $$
    [[ph|d2]] \times [[H|g]] + [[1-ph|d2]] \times ([[L|g]]) = [[Ec|2]]
    $$

    عند قرار الطرح نختار الأعلى من هذا ومن الصفر: [[Vc|2]].

    قيمة البحث:

    $$
    -[[c1|g]] + [[ps|d2]] \times [[Vc|2]] = [[E|2]]
    $$

    القرار: [[pick(E > 0, 'ابدأ البحث', 'لا تبدأ')]].

- id: c10-e-07
  kind: problem
  part: E
  vars: {BH: 500000, BL: -120000, SH: 260000, SL: 40000, X: 180000, p: 0.5}
  random: {BH: [300000, 700000, 20000], BL: [-200000, -40000, 10000], SH: [150000, 350000, 10000], SL: [0, 80000, 10000], p: [0.3, 0.7, 0.05], X: [50000, 300000, 10000]}
  calc:
    - EB = p*BH + (1 - p)*BL
    - ES = p*(SH + X) + (1 - p)*SL
    - E0 = p*SH + (1 - p)*SL
  text: |
    محطة تحلية تختار بين وحدة كبيرة الآن، أو وحدة صغيرة مع إمكانية إضافة وحدة ثانية بعد 3 سنوات إذا ارتفع الطلب. الطلب مرتفع باحتمال [[p|d2]]. الكبيرة تعطي [[BH|g]] أو [[BL|g]] دينار. الصغيرة وحدها تعطي [[SH|g]] أو [[SL|g]] دينار. الإضافة في حالة الطلب المرتفع تزيد القيمة الحالية [[X|g]] دينار بعد طرح تكلفتها. ماذا تختار؟ وكم تساوي إمكانية الإضافة؟
  solution: |
    $$
    \mathrm{E}_{large} = [[EB|2]]
    $$

    $$
    \mathrm{E}_{small+} = [[p|d2]] \times [[SH+X|g]] + [[1-p|d2]] \times [[SL|g]] = [[ES|2]]
    $$

    الاختيار: [[pick(ES >= EB, 'الصغيرة مع الإضافة', 'الكبيرة')]].

    بدون إمكانية الإضافة، قيمة الصغيرة [[E0|2]] دينار. قيمة الإمكانية نفسها هي الفرق: [[ES-E0|2]] دينار.

- id: c10-e-08
  kind: problem
  part: E
  vars: {C: 200000, H: 450000, Lc: 120000, A: 150000, p: 0.6}
  random: {C: [100000, 300000, 10000], H: [300000, 600000, 10000], Lc: [50000, 150000, 10000], A: [100000, 200000, 10000], p: [0.4, 0.7, 0.05]}
  calc:
    - A = max(A, Lc + 10000)
    - E1 = -C + p*H + (1 - p)*Lc
    - E2 = -C + p*H + (1 - p)*A
  text: |
    مشروع يكلف [[C|g]] دينار. بعد السنة الأولى يتضح الطلب. إذا كان مرتفعا، باحتمال [[p|d2]]، القيمة الحالية للتدفقات الباقية [[H|g]] دينار. إذا كان منخفضا، [[Lc|g]] دينار إذا استمر المشروع، أو [[A|g]] دينار إذا أوقفته الشركة وباعت المعدات. ما القيمة المتوقعة مع إمكانية الإيقاف وبدونها؟
  solution: |
    بدون إمكانية الإيقاف:

    $$
    -[[C|g]] + [[p|d2]] \times [[H|g]] + [[1-p|d2]] \times [[Lc|g]] = [[E1|2]]
    $$

    مع الإيقاف، الشركة تختار الأعلى عند الطلب المنخفض: [[A|g]] دينار:

    $$
    -[[C|g]] + [[p|d2]] \times [[H|g]] + [[1-p|d2]] \times [[A|g]] = [[E2|2]]
    $$

    إمكانية الإيقاف تساوي [[E2-E1|2]] دينار. لذلك تفضل الشركات المعدات القابلة للبيع أو لاستخدام آخر.

- id: c10-e-09
  kind: problem
  part: E
  vars: {R: 9000, N: 30000, pf: 0.35}
  random: {R: [3000, 15000, 500], N: [15000, 50000, 1000], pf: [0.1, 0.6, 0.05]}
  calc:
    - Er = R + pf*N
  text: |
    آلة معطلة. إصلاحها يكلف [[R|g]] دينار، لكن الإصلاح يفشل باحتمال [[pf|d2]]، فتحتاج الشركة عندها آلة جديدة تكلف [[N|g]] دينار. البديل شراء الجديدة الآن. أيهما أرخص بالقيمة المتوقعة؟ تجاهل الفرق في الزمن.
  solution: |
    $$
    \mathrm{E}(\mathrm{repair}) = [[R|g]] + [[pf|d2]] \times [[N|g]] = [[Er|2]]
    $$

    مقابل [[N|g]] دينار للشراء الآن. الأرخص: [[pick(Er < N, 'الإصلاح', 'الشراء الآن')]].

    الإصلاح أرخص ما دام احتمال الفشل أقل من:

    $$
    \frac{[[N|g]] - [[R|g]]}{[[N|g]]} = [[(N-R)/N|f4]]
    $$

- id: c10-e-10
  kind: problem
  part: E
  vars: {aH: 300000, aL: -100000, bH: 150000, bL: 40000}
  random: {aH: [200000, 400000, 10000], aL: [-150000, -20000, 10000], bH: [100000, 190000, 10000], bL: [0, 80000, 10000]}
  calc:
    - p = (bL - aL)/((aH - aL) - (bH - bL))
  text: |
    بديل أ يعطي [[aH|g]] دينار إذا ارتفع الطلب، و[[aL|g]] إذا انخفض. بديل ب يعطي [[bH|g]] و[[bL|g]] دينار. عند أي احتمال لارتفاع الطلب يتساوى البديلان؟
  solution: |
    $$
    p\,[[aH|g]] + (1 - p)([[aL|g]]) = p\,[[bH|g]] + (1 - p)\,[[bL|g]]
    $$

    $$
    p = \frac{[[bL|g]] - ([[aL|g]])}{([[aH|g]] - ([[aL|g]])) - ([[bH|g]] - [[bL|g]])} = [[p|f4]]
    $$

    إذا كان احتمال الطلب المرتفع أكبر من هذا، يفضل أ. وإلا يفضل ب.

- id: c10-e-11
  kind: problem
  part: E
  vars: {C: 100000, H: 200000, L: 60000, p: 0.5, k: 3, i: 0.10}
  random: {C: [50000, 150000, 5000], H: [120000, 300000, 10000], L: [20000, 100000, 10000], p: [0.3, 0.7, 0.05], k: [2, 5, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - E = -C + (p*H + (1 - p)*L)*PF(i, k)
  text: |
    استثمار [[C|g]] دينار اليوم. بعد [[yrs(k)]] يباع المشروع بمبلغ [[H|g]] دينار إذا نجح، باحتمال [[p|d2]]، أو [[L|g]] دينار. الحد الأدنى [[i|%]]. ما القيمة الحالية المتوقعة؟
  solution: |
    في شجرة القرار، كل نهاية تكتب بقيمتها الحالية:

    $$
    \mathrm{E}(PW) = -[[C|g]] + \left([[p|d2]] \times [[H|g]] + [[1-p|d2]] \times [[L|g]]\right)(P/F,\ [[i|%]],\ [[k|n]]) = [[E|2]]
    $$

- id: c10-e-12
  kind: problem
  part: E
  vars: {aH: 250000, aL: -90000, bH: 120000, bL: 30000, p: 0.6}
  random: {aH: [150000, 350000, 10000], aL: [-150000, -20000, 10000], bH: [80000, 160000, 10000], bL: [0, 60000, 10000], p: [0.4, 0.75, 0.05]}
  calc:
    - Ea = p*aH + (1 - p)*aL
    - Eb = p*bH + (1 - p)*bL
  text: |
    للقرار بين أ وب: أ يعطي [[aH|g]] أو [[aL|g]] دينار، وب يعطي [[bH|g]] أو [[bL|g]] دينار، والحالة الأولى باحتمال [[p|d2]]. احسب القيمة المتوقعة واحتمال الخسارة لكل منهما.
  solution: |
    | | القيمة المتوقعة | احتمال الخسارة |
    | --- | --- | --- |
    | أ | [[Ea|0]] | [[1-p|d2]] |
    | ب | [[Eb|0]] | 0.00 |

    [[pick(Ea > Eb, 'أ أعلى قيمة متوقعة، لكنه يخسر في الحالة الثانية. ب لا يخسر أبدا. شجرة القرار تعطي القيمة المتوقعة، لكن القرار النهائي يحتاج أيضا النظر في الخسارة الممكنة.', 'ب أعلى قيمة متوقعة ولا يخسر، فهو أفضل في الاثنين.')]]

- id: c10-e-13
  kind: problem
  part: E
  text: |
    حل الشجرة التالية. القيم بالقيمة الحالية، بآلاف الدنانير.

    - قرار: مشروع كبير، بتكلفة 300
        - طلب مرتفع، باحتمال 0.6: 800
        - طلب منخفض، باحتمال 0.4: قرار ثان
            - استمر: 150
            - بع المعدات: 220
    - قرار: مشروع صغير، بتكلفة 120
        - طلب مرتفع، باحتمال 0.6: قرار ثان
            - وسع بتكلفة 150: 600
            - لا توسع: 380
        - طلب منخفض، باحتمال 0.4: 200
  solution: |
    **المشروع الكبير:** عند الطلب المنخفض نختار البيع، 220.

    $$
    0.6 \times 800 + 0.4 \times 220 - 300 = 268
    $$

    **المشروع الصغير:** عند الطلب المرتفع، التوسع يعطي 600 ناقص 150، أي 450، وهو أكبر من 380، فنوسع.

    $$
    0.6 \times 450 + 0.4 \times 200 - 120 = 230
    $$

    الأفضل المشروع الكبير، بقيمة متوقعة 268 ألف دينار.

- id: c10-e-14
  kind: problem
  part: E
  vars: {V: 150000, p: 0.03, P: 5500, d: 0.2}
  random: {V: [50000, 300000, 10000], p: [0.01, 0.06, 0.005], P: [1000, 12000, 250], d: [0.1, 0.3, 0.05]}
  calc:
    - Ei = P + p*d*V
    - En = p*V
  text: |
    معدات قيمتها [[V|g]] دينار، واحتمال تلفها الكامل في سنة [[p|r]]. تأمين شامل بقسط [[P|g]] دينار، لكن الشركة تتحمل أول [[d|%]] من الخسارة. ما التكلفة المتوقعة مع التأمين وبدونه؟
  solution: |
    - قرار: تأمين
        - تلف، باحتمال [[p|r]]: [[P|g]] + [[d*V|g]]
        - سلامة: [[P|g]]
    - قرار: بدون تأمين
        - تلف: [[V|g]]
        - سلامة: 0

    $$
    \mathrm{E}_{ins} = [[P|g]] + [[p|r]] \times [[d*V|g]] = [[Ei|2]]
    $$

    $$
    \mathrm{E}_{none} = [[p|r]] \times [[V|g]] = [[En|2]]
    $$

    بالقيمة المتوقعة الأرخص [[pick(Ei < En, 'التأمين', 'عدم التأمين')]]. لكن بدون تأمين، الشركة معرضة لخسارة [[V|g]] دينار دفعة واحدة.
