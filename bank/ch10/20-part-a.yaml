items:

- id: c10-a-01
  kind: concept
  part: A
  text: |
    ما الفرق بين تحليل الحساسية وتحليل المخاطرة؟
  solution: |
    تحليل الحساسية يغير المتغير ويرى أثره، بدون أن يقول أي قيمة أرجح. تحليل المخاطرة يعطي كل قيمة احتمالا، فيحسب ما نتوقعه في المتوسط، واحتمال الخسارة.

- id: c10-a-02
  kind: concept
  part: A
  text: |
    القيمة المتوقعة لمشروع 50,000 دينار. هل يعني هذا أن الشركة ستربح 50,000 دينار؟
  solution: |
    لا. القيمة المتوقعة متوسط النتائج لو تكرر القرار مرات كثيرة. في مرة واحدة قد تربح أكثر بكثير، أو تخسر.

- id: c10-a-03
  kind: concept
  part: A
  text: |
    ماذا يقيس الانحراف المعياري للقيمة الحالية؟
  solution: |
    يقيس تشتت النتائج حول القيمة المتوقعة: كم تبتعد القيمة الحالية الفعلية عادة عن متوسطها. كلما كبر، زادت المخاطرة.

- id: c10-a-04
  kind: concept
  part: A
  text: |
    متى تساوي القيمة الحالية المتوقعة القيمة الحالية المحسوبة بالقيم المتوقعة للمتغيرات؟
  solution: |
    عندما تكون القيمة الحالية خطية في المتغيرات غير المؤكدة، مثل التدفق السنوي أو الإيراد. أما العمر ونسبة الفائدة فلا يدخلان خطيا، فيجب الحساب لكل حالة.

- id: c10-a-05
  kind: concept
  part: A
  text: |
    مشروعان لهما نفس القيمة المتوقعة، والثاني أعلى انحرافا معياريا. أيهما تختار شركة تكره المخاطرة؟
  solution: |
    الأول، لأنه يعطي نفس المتوسط بمخاطرة أقل.

- id: c10-a-06
  kind: concept
  part: A
  text: |
    ما معامل الاختلاف؟ ولماذا نستخدمه بدل الانحراف المعياري أحيانا؟
  solution: |
    الانحراف المعياري مقسوما على القيمة المتوقعة. يقارن مخاطرة مشاريع بأحجام مختلفة، لأنه يقيس المخاطرة لكل دينار متوقع.

- id: c10-a-07
  kind: concept
  part: A
  text: |
    في شجرة القرار، ما الفرق بين المربع والدائرة؟
  solution: |
    المربع عقدة قرار: صاحب القرار يختار الفرع. الدائرة عقدة احتمال: النتيجة تحددها الظروف، ولكل فرع احتمال.

- id: c10-a-08
  kind: concept
  part: A
  text: |
    لماذا نحل شجرة القرار من النهاية إلى البداية؟
  solution: |
    لأن قيمة كل قرار مبكر تعتمد على ما سيحدث بعده، وعلى القرارات اللاحقة. نحسب القيم في الأطراف أولا، ثم نرجع خطوة خطوة.

- id: c10-a-09
  kind: concept
  part: A
  text: |
    لماذا يكون لخيار التوسع لاحقا قيمة، حتى لو كان المصنع الكبير أرخص لكل وحدة؟
  solution: |
    لأنه يؤجل جزءا من الاستثمار حتى تتضح المعلومات. إذا جاء الطلب منخفضا، تتجنب الشركة خسارة الطاقة الزائدة.

- id: c10-a-10
  kind: concept
  part: A
  text: |
    دراسة سوق لن تغير قرار الشركة مهما كانت نتيجتها. كم تستحق؟
  solution: |
    لا شيء. المعلومات لها قيمة فقط إذا كانت قد تغير القرار.

- id: c10-a-11
  kind: concept
  part: A
  text: |
    لماذا قيمة المعلومات الكاملة حد أعلى لقيمة أي دراسة حقيقية؟
  solution: |
    لأن الدراسة الحقيقية قد تخطئ، فلا تعطي أكثر من المعرفة الكاملة. لا تدفع الشركة لأي دراسة أكثر من هذا الحد.

- id: c10-a-12
  kind: concept
  part: A
  text: |
    لماذا تعطي المحاكاة نتائج مختلفة قليلا كل مرة؟ وكيف نقلل الاختلاف؟
  solution: |
    لأنها تعتمد على أرقام عشوائية. نقلل الاختلاف بزيادة عدد المحاولات، ونثبت البذرة العشوائية لنكرر نفس النتيجة.
