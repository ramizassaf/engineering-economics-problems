items:

- id: c10-g-01
  kind: problem
  part: G
  vars: {m: 500, s: 80, a: 400}
  random: {m: [300, 800, 10], s: [30, 150, 5], a: [200, 900, 10]}
  calc:
    - z = (a - m)/s
    - P = NORMS(z)
  text: |
    الطلب الأسبوعي توزيعه طبيعي، بمتوسط [[m|g]] وحدة وانحراف [[s|g]] وحدة. ما احتمال أن يقل عن [[a|g]] وحدة؟
  solution: |
    $$
    z = \frac{[[a|g]] - [[m|g]]}{[[s|g]]} = [[z|2]]
    $$

    $$
    P = \Phi([[z|2]]) = [[P|%2]]
    $$

    ```excel
    =NORM.DIST([[a|r]], [[m|r]], [[s|r]], TRUE)
    ```

- id: c10-g-02
  kind: problem
  part: G
  vars: {m: 60000, s: 12000, a: 50000, b: 75000}
  random: {m: [30000, 100000, 1000], s: [5000, 25000, 1000], a: [10000, 60000, 1000], b: [61000, 130000, 1000]}
  calc:
    - a = min(a, m - 1000)
    - b = max(b, m + 1000)
    - P = NORMS((b - m)/s) - NORMS((a - m)/s)
  text: |
    الإيراد السنوي توزيعه طبيعي بمتوسط [[m|g]] وانحراف [[s|g]] دينار. ما احتمال أن يقع بين [[a|g]] و[[b|g]] دينار؟
  solution: |
    $$
    P = \Phi\left(\frac{[[b|g]] - [[m|g]]}{[[s|g]]}\right) - \Phi\left(\frac{[[a|g]] - [[m|g]]}{[[s|g]]}\right) = [[P|%2]]
    $$

- id: c10-g-03
  kind: problem
  part: G
  vars: {m: 1200, s: 200, K: 1450}
  random: {m: [500, 3000, 50], s: [50, 600, 25], K: [600, 4000, 50]}
  calc:
    - K = max(K, m)
    - P = 1 - NORMS((K - m)/s)
  text: |
    مستودع يحتفظ بمخزون [[K|g]] وحدة لموسم. الطلب في الموسم طبيعي بمتوسط [[m|g]] وانحراف [[s|g]] وحدة. ما احتمال نفاد المخزون؟
  solution: |
    ينفد المخزون إذا تجاوز الطلب [[K|g]]:

    $$
    P = 1 - \Phi\left(\frac{[[K|g]] - [[m|g]]}{[[s|g]]}\right) = [[P|%2]]
    $$

- id: c10-g-04
  kind: problem
  part: G
  vars: {m: 40, s: 5, T: 45}
  random: {m: [20, 80, 1], s: [2, 12, 1], T: [20, 100, 1]}
  calc:
    - P = NORMS((T - m)/s)
  text: |
    مدة مشروع إنشاء طبيعية بمتوسط [[m|g]] أسبوعا وانحراف [[s|g]] أسابيع. العقد يفرض غرامة إذا تجاوز [[T|g]] أسبوعا. ما احتمال الانتهاء في الموعد؟
  solution: |
    $$
    P = \Phi\left(\frac{[[T|g]] - [[m|g]]}{[[s|g]]}\right) = [[P|%2]]
    $$

    احتمال الغرامة [[1-P|%2]].

- id: c10-g-05
  kind: problem
  part: G
  vars: {F: 90000, p: 30, v: 18, m: 9000, s: 1500}
  random: {F: [30000, 150000, 5000], p: [15, 50, 1], m: [3000, 20000, 500], s: [500, 4000, 250], v: [5, 40, 1]}
  calc:
    - v = floor(p*0.6)
    - Q = F/(p - v)
    - P = 1 - NORMS((Q - m)/s)
  text: |
    منتج تكاليفه الثابتة [[F|g]] دينار، وسعره [[p|g]] دينار، وتكلفته المتغيرة [[v|g]] دينار. المبيعات طبيعية بمتوسط [[m|g]] وانحراف [[s|g]] وحدة. ما احتمال الربح؟
  solution: |
    $$
    Q^* = \frac{[[F|g]]}{[[p-v|g]]} = [[Q|2]]
    $$

    $$
    P(Q > Q^*) = 1 - \Phi\left(\frac{[[Q|2]] - [[m|g]]}{[[s|g]]}\right) = [[P|%2]]
    $$

- id: c10-g-06
  kind: problem
  part: G
  vars: {m: 80000, s: 30000}
  random: {m: [20000, 150000, 1000], s: [5000, 60000, 1000]}
  calc:
    - q = m - 1.6448536269514722*s
  text: |
    قيمة حالية طبيعية بمتوسط [[m|g]] وانحراف [[s|g]] دينار. ما القيمة التي تقع تحتها 5% فقط من النتائج؟
  solution: |
    الرقم المئوي الخامس يبعد 1.644854 انحرافا تحت المتوسط:

    $$
    [[m|g]] - 1.644854 \times [[s|g]] = [[q|2]]
    $$

    ```excel
    =NORM.INV(0.05, [[m|r]], [[s|r]])
    ```

    [[pick(q < 0, 'هذا الرقم سالب: في أسوأ 5% من الحالات تخسر الشركة أكثر من ' , 'حتى في أسوأ 5% من الحالات تبقى القيمة الحالية فوق ')]][[abs(q)|2]] دينار.

- id: c10-g-07
  kind: problem
  part: G
  vars: {s: 25000}
  random: {s: [5000, 60000, 1000]}
  calc:
    - m = 1.2815515655446004*s
  text: |
    انحراف القيمة الحالية لمشروع [[s|g]] دينار، وتوزيعها طبيعي. الشركة تريد احتمال خسارة 10% أو أقل. ما أقل قيمة متوقعة مقبولة؟
  solution: |
    احتمال 10% في الطرف الأيسر يقابل:

    $$
    z = -1.281552
    $$

    $$
    \frac{0 - \mu}{[[s|g]]} = -1.281552
    $$

    $$
    \mu = 1.281552 \times [[s|g]] = [[m|2]]
    $$

- id: c10-g-08
  kind: problem
  part: G
  vars: {C: 60000, mA: 16000, sA: 4000, n: 5, i: 0.10}
  random: {C: [20000, 100000, 5000], mA: [5000, 30000, 500], sA: [1000, 8000, 250], n: [3, 10, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - mA = max(mA, C*AP(i, n)*0.9)
    - m = -C + mA*PA(i, n)
    - s = sA*PA(i, n)
    - P = NORMS(-m/s)
  text: |
    مشروع يكلف [[C|g]] دينار لمدة [[yrs(n)]]. التدفق السنوي غير مؤكد، لكنه نفسه كل سنة: متوسطه [[mA|g]] وانحرافه [[sA|g]] دينار، وتوزيعه طبيعي. الحد الأدنى [[i|%]]. ما احتمال الخسارة؟
  solution: |
    التدفق نفسه كل سنة، فالقيمة الحالية دالة خطية فيه:

    $$
    \mu = -[[C|g]] + [[mA|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[m|2]]
    $$

    $$
    \sigma = [[sA|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[s|2]]
    $$

    $$
    P(PW < 0) = \Phi\left(\frac{-[[m|2]]}{[[s|2]]}\right) = [[P|%2]]
    $$

- id: c10-g-09
  kind: problem
  part: G
  vars: {m: 2500, s: 400, K: 10500}
  random: {m: [1000, 5000, 100], s: [100, 1000, 50], K: [3000, 22000, 100]}
  calc:
    - M = 4*m
    - S = 2*s
    - K = max(K, M)
    - P = 1 - NORMS((K - M)/S)
  text: |
    الطلب في كل ربع سنة مستقل، وطبيعي بمتوسط [[m|g]] وانحراف [[s|g]] وحدة. طاقة المصنع السنوية [[K|g]] وحدة. ما احتمال أن يتجاوز الطلب السنوي الطاقة؟
  solution: |
    مجموع أربعة أرباع مستقلة:

    $$
    \mu = 4 \times [[m|g]] = [[M|g]], \qquad \sigma = \sqrt{4} \times [[s|g]] = [[S|g]]
    $$

    $$
    P = 1 - \Phi\left(\frac{[[K|g]] - [[M|g]]}{[[S|g]]}\right) = [[P|%2]]
    $$

- id: c10-g-10
  kind: problem
  part: G
  vars: {m: 35000, s: 20000}
  random: {m: [5000, 80000, 1000], s: [5000, 40000, 1000]}
  calc:
    - P = 1 - NORMS(-m/s)
  text: |
    القيمة الحالية لمشروع بالحد الأدنى للشركة طبيعية بمتوسط [[m|g]] وانحراف [[s|g]] دينار. ما احتمال أن يكون المعدل الداخلي للمشروع أعلى من الحد الأدنى؟
  solution: |
    للمشروع التقليدي، المعدل أعلى من الحد الأدنى عندما تكون القيمة الحالية بالحد الأدنى موجبة:

    $$
    P(PW > 0) = 1 - \Phi\left(\frac{-[[m|g]]}{[[s|g]]}\right) = [[P|%2]]
    $$
