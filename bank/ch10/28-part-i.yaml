items:

- id: c10-i-01
  kind: mcq
  part: I
  vars: {x1: 20000, x2: 50000, p: 0.3}
  random: {x1: [5000, 30000, 1000], x2: [40000, 90000, 1000], p: [0.2, 0.4, 0.05]}
  calc:
    - m = p*x1 + (1 - p)*x2
    - w1 = (x1 + x2)/2
    - w2 = (1 - p)*x1 + p*x2
    - w3 = p*x1
  text: |
    ربح [[x1|g]] دينار باحتمال [[p|d2]]، أو [[x2|g]] دينار. ما الربح المتوقع؟
  options: ["[[w1|g]]", "[[w2|g]]", "[[m|g]]", "[[w3|g]]"]
  correct: 2
  solution: |
    $$
    [[p|d2]] \times [[x1|g]] + [[1-p|d2]] \times [[x2|g]] = [[m|g]]
    $$

    الخيار (أ) تجاهل الاحتمالات. الخيار (ب) عكسها.

- id: c10-i-02
  kind: mcq
  part: I
  text: |
    عمر آلة 4 سنوات أو 8 سنوات باحتمالين متساويين. ما الصحيح عن القيمة الحالية المتوقعة لوفرها السنوي الثابت؟
  options: ["تساوي القيمة الحالية لعمر 6 سنوات", "أقل من القيمة الحالية لعمر 6 سنوات", "أكبر من القيمة الحالية لعمر 6 سنوات", "لا يمكن حسابها"]
  correct: 1
  solution: |
    القيمة الحالية تزيد مع العمر بمعدل متناقص، لأن السنوات البعيدة تخصم أكثر. متوسط القيمتين أقل من القيمة عند متوسط العمر.

- id: c10-i-03
  kind: mcq
  part: I
  vars: {s1: 3000, s2: 4000}
  random: {s1: [1000, 6000, 500], s2: [1000, 8000, 500]}
  calc:
    - s = sqrt(s1**2 + s2**2)
    - w1 = s1 + s2
    - w2 = abs(s1 - s2)
    - w3 = s1**2 + s2**2
  text: |
    تكلفتان مستقلتان انحرافهما [[s1|g]] و[[s2|g]] دينار. ما انحراف مجموعهما؟
  options: ["[[w1|g]]", "[[s|2]]", "[[w2|g]]", "[[w3|g]]"]
  correct: 1
  solution: |
    $$
    \sqrt{[[s1|g]]^2 + [[s2|g]]^2} = [[s|2]]
    $$

    الخيار (أ) جمع الانحرافات، وهذا صحيح فقط إذا كانا مرتبطين تماما. الخيار (د) هو التباين، وليس الانحراف.

- id: c10-i-04
  kind: mcq
  part: I
  text: |
    في شجرة القرار، ماذا نضع عند عقدة الاحتمال عند الحل؟
  options: ["أكبر القيم", "أصغر القيم", "القيمة المتوقعة", "متوسط القيم بدون احتمالات"]
  correct: 2
  solution: |
    عند عقدة الاحتمال نحسب القيمة المتوقعة. أكبر القيم نأخذها عند عقدة القرار فقط.

- id: c10-i-05
  kind: mcq
  part: I
  vars: {m: 30000, s: 20000}
  random: {m: [10000, 60000, 1000], s: [10000, 40000, 1000]}
  calc:
    - s = pick(s == m, s + 2000, s)
    - P = NORMS(-m/s)
    - w1 = NORMS(m/s)
    - w2 = NORMS(-s/m)
    - w3 = s/m
  text: |
    قيمة حالية طبيعية بمتوسط [[m|g]] وانحراف [[s|g]] دينار. ما احتمال الخسارة؟
  options: ["[[w1|%2]]", "[[P|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    \Phi\left(\frac{0 - [[m|g]]}{[[s|g]]}\right) = [[P|%2]]
    $$

    الخيار (أ) احتمال الربح. الخيار (ج) قلب الكسر. الخيار (د) معامل الاختلاف، وليس احتمالا.

- id: c10-i-06
  kind: mcq
  part: I
  text: |
    قيمة المعلومات الكاملة لقرار 30,000 دينار. دراسة سوق تكلف 35,000 دينار. ماذا تفعل الشركة؟
  options: ["تشتريها إذا كانت دقيقة", "ترفضها مهما كانت دقتها", "تحسب قيمتها الفعلية أولا", "تشتريها لأن المعلومات مهمة"]
  correct: 1
  solution: |
    لا توجد دراسة تساوي أكثر من المعلومات الكاملة. ترفضها بدون حساب.

- id: c10-i-07
  kind: mcq
  part: I
  text: |
    مشروع أ متوسطه 50,000 وانحرافه 10,000 دينار. مشروع ب متوسطه 45,000 وانحرافه 15,000 دينار. ماذا نقول؟
  options: ["ب يسيطر على أ", "أ يسيطر على ب", "لا يسيطر أحدهما", "نحتاج الاحتمالات"]
  correct: 1
  solution: |
    أ أعلى قيمة متوقعة وأقل مخاطرة، فهو أفضل في الاثنين.

- id: c10-i-08
  kind: mcq
  part: I
  text: |
    لماذا يخفض التنويع على مشاريع مستقلة المخاطرة؟
  options: ["لأنه يرفع القيمة المتوقعة", "لأن الخسارة في مشروع يعوضها غالبا ربح في آخر", "لأنه يخفض الحد الأدنى للعائد", "لأنه يلغي المخاطرة تماما"]
  correct: 1
  solution: |
    المشاريع المستقلة نادرا ما تسوء كلها معا. الانحراف الكلي ينمو مع الجذر التربيعي لعددها، لا مع العدد نفسه.

- id: c10-i-09
  kind: mcq
  part: I
  vars: {G: 100000, L: -50000, p: 0.6}
  random: {G: [50000, 150000, 5000], L: [-80000, -20000, 5000], p: [0.4, 0.7, 0.05]}
  calc:
    - L = max(L, -floor(p*G/(1 - p)*0.4/1000)*1000)
    - Eb = max(p*G + (1 - p)*L, 0)
    - V = p*G - Eb
    - w1 = p*G
  text: |
    إطلاق منتج يربح [[G|g]] دينار باحتمال [[p|d2]]، أو يخسر [[abs(L)|g]] دينار. البديل عدم الإطلاق. ما قيمة المعلومات الكاملة؟
  options: ["[[w1|g]]", "[[V|g]]", "[[Eb|g]]", "[[G|g]]"]
  correct: 1
  solution: |
    مع المعلومات، تطلق الشركة فقط عند النجاح، فتتوقع [[w1|g]] دينار. بدونها أفضل قيمة [[Eb|g]] دينار. الفرق [[V|g]] دينار.

    الخيار (أ) هو القيمة مع المعلومات، وليس قيمة المعلومات. الخيار (ج) هو القيمة بدون معلومات. الخيار (د) أفضل ربح ممكن.

- id: c10-i-10
  kind: mcq
  part: I
  text: |
    محاكاة مونت كارلو لمشروع أعطت احتمال خسارة 12.3% بألف محاولة، و11.8% بمئة ألف. أي الرقمين أدق؟ ولماذا؟
  options: ["الأول، لأنه أول تشغيل", "الثاني، لأن الخطأ العشوائي يصغر مع عدد المحاولات", "متساويان", "لا يمكن معرفة ذلك"]
  correct: 1
  solution: |
    الخطأ العشوائي في المحاكاة يصغر مع الجذر التربيعي لعدد المحاولات. مئة ألف محاولة تعطي دقة أعلى بعشر مرات تقريبا من ألف.
