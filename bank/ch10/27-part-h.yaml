- id: c10-h-01
  kind: problem
  part: H
  calc:
    - m = 0.25*40000 + 0.5*60000 + 0.25*75000
    - v = 0.25*(40000 - m)**2 + 0.5*(60000 - m)**2 + 0.25*(75000 - m)**2
  text: |
    القيم 40,000 و60,000 و75,000 دينار في A2:A4، واحتمالاتها 0.25 و0.50 و0.25 في B2:B4. احسب القيمة المتوقعة والانحراف المعياري في Excel بصيغتين فقط.
  solution: |
    ```excel
    =SUMPRODUCT(A2:A4, B2:B4)
    =SQRT(SUMPRODUCT(B2:B4, (A2:A4 - D1)^2))
    ```

    حيث D1 الخلية التي فيها القيمة المتوقعة. النتيجة: القيمة المتوقعة [[m|2]] دينار، والانحراف [[sqrt(v)|2]] دينار.

- id: c10-h-02
  kind: problem
  part: H
  calc:
    - P = NORMS(-25000/15000)
    - q = 25000 - 1.6448536269514722*15000
  text: |
    قيمة حالية طبيعية بمتوسط 25,000 وانحراف 15,000 دينار. احسب في Excel احتمال الخسارة، والرقم المئوي الخامس.
  solution: |
    ```excel
    =NORM.DIST(0, 25000, 15000, TRUE)
    =NORM.INV(0.05, 25000, 15000)
    ```

    احتمال الخسارة [[P|%2]]، والرقم المئوي الخامس [[q|2]] دينار.

- id: c10-h-03
  kind: problem
  part: H
  calc:
    - a = PA(0.12, 5)
    - m = 0.3*(-100000 + 15000*a) + 0.5*(-100000 + 28000*a) + 0.2*(-100000 + 40000*a)
  text: |
    اكتب في Python برنامجا بمكتبة numpy يحسب القيمة الحالية المتوقعة لمشروع يكلف 100,000 دينار لمدة 5 سنوات، وتدفقه السنوي 15,000 أو 28,000 أو 40,000 دينار باحتمالات 0.3 و0.5 و0.2، بحد أدنى 12%.
  solution: |
    ```python
    import numpy as np

    C, n, i = 100000, 5, 0.12
    A = np.array([15000, 28000, 40000])
    p = np.array([0.3, 0.5, 0.2])
    pa = (1 - (1 + i) ** -n) / i
    pw = -C + A * pa
    mean = p @ pw
    std = np.sqrt(p @ (pw - mean) ** 2)
    print(pw.round(2), round(mean, 2), round(std, 2), p[pw < 0].sum())
    ```

    القيمة الحالية المتوقعة [[m|2]] دينار.

- id: c10-h-04
  kind: problem
  part: H
  calc:
    - a = PA(0.10, 6)
    - m = -50000 + 12000*a
    - P = (50000/a - 8000)/(16000 - 8000)
  text: |
    مشروع يكلف 50,000 دينار لمدة 6 سنوات. تدفقه السنوي ثابت عبر السنوات، لكن قيمته غير معروفة، وتوزيعها منتظم بين 8,000 و16,000 دينار. الحد الأدنى 10%. اكتب برنامج محاكاة بمئة ألف محاولة يقدر القيمة الحالية المتوقعة واحتمال الخسارة. قارن بالحل الدقيق.
  solution: |
    ```python
    import numpy as np

    rng = np.random.default_rng(1)
    A = rng.uniform(8000, 16000, 100_000)
    pa = (1 - 1.10 ** -6) / 0.10
    pw = -50000 + A * pa
    print(round(pw.mean(), 0), round((pw < 0).mean(), 4))
    ```

    **الحل الدقيق:** القيمة الحالية خطية في التدفق، فمتوسطها عند متوسط التدفق 12,000:

    $$
    \mathrm{E}(PW) = -50{,}000 + 12{,}000\,(P/A,\ 10\%,\ 6) = [[m|2]]
    $$

    المشروع يخسر إذا كان التدفق أقل من:

    $$
    \frac{50{,}000}{(P/A,\ 10\%,\ 6)} = [[50000/a|2]]
    $$

    والتوزيع منتظم، فالاحتمال:

    $$
    \frac{[[50000/a|2]] - 8{,}000}{16{,}000 - 8{,}000} = [[P|%2]]
    $$

    المحاكاة تعطي أرقاما قريبة جدا من هذه، وتختلف قليلا في كل تشغيل ببذرة مختلفة.

- id: c10-h-05
  kind: problem
  part: H
  calc:
    - m = -50000 + 22000/1.1 + 24000/1.1**2 + 26000/1.1**3
    - s = sqrt(3000**2/1.1**2 + 5000**2/1.1**4 + 7000**2/1.1**6)
    - P = NORMS(-m/s)
  text: |
    للمثال في هذا الفصل عن التدفقات المستقلة بأرقامه الأصلية: الثمن 50,000 دينار، والتدفقات بمتوسط 22,000 و24,000 و26,000 وانحراف 3,000 و5,000 و7,000 دينار، والحد الأدنى 10%. اكتب برنامج محاكاة يسحب كل تدفق من توزيع طبيعي، وقارن بالحساب المباشر.
  solution: |
    ```python
    import numpy as np

    rng = np.random.default_rng(7)
    N = 200_000
    mu = np.array([22000, 24000, 26000])
    sd = np.array([3000, 5000, 7000])
    flows = rng.normal(mu, sd, size=(N, 3))
    disc = 1.10 ** -np.arange(1, 4)
    pw = -50000 + flows @ disc
    print(round(pw.mean()), round(pw.std()), round((pw < 0).mean(), 4))
    ```

    مجموع متغيرات طبيعية مستقلة طبيعي أيضا، فالحساب المباشر دقيق هنا:

    $$
    \mu = [[m|2]], \qquad \sigma = [[s|2]], \qquad P(PW < 0) = [[P|%2]]
    $$

    المحاكاة تعطي نفس الأرقام تقريبا. فائدتها تظهر عندما لا يوجد حساب مباشر، مثل توزيعات غير طبيعية أو عمر غير مؤكد.

- id: c10-h-06
  kind: problem
  part: H
  calc:
    - EL = 0.6*900000 + 0.4*(-250000)
    - ES = 0.6*450000 + 0.4*50000
  text: |
    ابن في Excel مثال المصنع الكبير والصغير بأرقامه الأصلية: الطلب مرتفع باحتمال 0.6، والكبير 900,000 أو -250,000 دينار، والصغير 450,000 أو 50,000 دينار. اجعل القرار يتغير وحده إذا غيرت الاحتمال.
  solution: |
    الاحتمال في B1، والقيم في B3:C4 (صف لكل مصنع، وعمود لكل حالة):

    ```excel
    D3 =$B$1*B3 + (1-$B$1)*C3
    D4 =$B$1*B4 + (1-$B$1)*C4
    D6 =IF(D3 >= D4, "large", "small")
    ```

    القيمة المتوقعة للكبير [[EL|2]] دينار، وللصغير [[ES|2]] دينار. جرب احتمالات مختلفة في B1 لترى أين يتغير القرار.

- id: c10-h-07
  kind: problem
  part: H
  calc:
    - m = -60000 + 16000*PA(0.10, 5)
    - s = 4000*PA(0.10, 5)
    - P = NORMS(-m/s)
  text: |
    ابن في Excel محاكاة لمشروع يكلف 60,000 دينار لمدة 5 سنوات، تدفقه السنوي نفسه كل سنة، وتوزيعه طبيعي بمتوسط 16,000 وانحراف 4,000 دينار. الحد الأدنى 10%. استخدم ألف صف.
  solution: |
    في A2، ثم انسخ إلى A1001:

    ```excel
    =NORM.INV(RAND(), 16000, 4000)
    ```

    وفي B2:

    ```excel
    =-60000 + A2*(1 - 1.1^-5)/0.1
    ```

    النتائج:

    ```excel
    =AVERAGE(B2:B1001)
    =STDEV.S(B2:B1001)
    =COUNTIF(B2:B1001, "<0")/1000
    ```

    الحساب المباشر للمقارنة: المتوسط [[m|2]] دينار، والانحراف [[s|2]] دينار، واحتمال الخسارة [[P|%2]]. كل ضغطة على F9 تعيد السحب، فتتغير النتائج قليلا.

- id: c10-h-08
  kind: problem
  part: H
  calc:
    - Eb = max(0.6*900000 + 0.4*(-250000), 0.6*450000 + 0.4*50000)
    - Ep = 0.6*900000 + 0.4*50000
  text: |
    اكتب في Python دالة تأخذ جدول نتائج (صف لكل بديل، وعمود لكل حالة) واحتمالات الحالات، وتعيد أفضل بديل وقيمة المعلومات الكاملة. جربها على مثال المصنع بأرقامه الأصلية.
  solution: |
    ```python
    import numpy as np

    def decide(payoff, p):
        payoff, p = np.array(payoff, float), np.array(p, float)
        ev = payoff @ p
        best = ev.argmax()
        evpi = payoff.max(axis=0) @ p - ev[best]
        return best, ev, evpi

    table = [ [900000, -250000], [450000, 50000] ]
    best, ev, evpi = decide(table, [0.6, 0.4])
    print(best, ev, evpi)
    ```

    أفضل قيمة متوقعة [[Eb|2]] دينار، وقيمة المعلومات الكاملة [[Ep-Eb|2]] دينار.
