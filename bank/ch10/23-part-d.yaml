items:

- id: c10-d-01
  kind: problem
  part: D
  vars: {a1: 5000, a2: 15000, a3: 25000, b1: -10000, b2: 20000, b3: 45000, p1: 0.3, p2: 0.5}
  random: {a1: [0, 10000, 1000], a2: [11000, 20000, 1000], a3: [21000, 35000, 1000], b1: [-25000, -2000, 1000], b2: [12000, 30000, 1000], b3: [36000, 70000, 1000], p1: [0.2, 0.35, 0.05], p2: [0.35, 0.5, 0.05]}
  calc:
    - p3 = 1 - p1 - p2
    - ma = p1*a1 + p2*a2 + p3*a3
    - mb = p1*b1 + p2*b2 + p3*b3
    - sa = sqrt(p1*(a1 - ma)**2 + p2*(a2 - ma)**2 + p3*(a3 - ma)**2)
    - sb = sqrt(p1*(b1 - mb)**2 + p2*(b2 - mb)**2 + p3*(b3 - mb)**2)
  text: |
    مشروعان متنافيان، قيمتهما الحالية في ثلاث حالات باحتمالات [[p1|d2]] و[[p2|d2]] و[[p3|d2]]:

    | | ضعيف | متوسط | قوي |
    | --- | --- | --- | --- |
    | أ | [[a1|g]] | [[a2|g]] | [[a3|g]] |
    | ب | [[b1|g]] | [[b2|g]] | [[b3|g]] |

    احسب القيمة المتوقعة والانحراف لكل منهما. هل يسيطر أحدهما على الآخر؟
  solution: |
    | | أ | ب |
    | --- | --- | --- |
    | القيمة المتوقعة | [[ma|2]] | [[mb|2]] |
    | الانحراف المعياري | [[sa|2]] | [[sb|2]] |

    [[pick(mb >= ma, pick(sb >= sa, 'ب أعلى قيمة متوقعة وأعلى مخاطرة، فلا يسيطر أحدهما على الآخر.', 'ب أعلى قيمة متوقعة وأقل مخاطرة، فهو يسيطر على أ.'), pick(sa <= sb, 'أ أعلى قيمة متوقعة وأقل مخاطرة، فهو يسيطر على ب.', 'أ أعلى قيمة متوقعة وأعلى مخاطرة، فلا يسيطر أحدهما على الآخر.'))]]

- id: c10-d-02
  kind: problem
  part: D
  vars: {ma: 30000, sa: 8000, mb: 42000, sb: 30000, k: 0.5}
  random: {ma: [15000, 50000, 1000], sa: [3000, 15000, 500], mb: [30000, 80000, 1000], sb: [15000, 50000, 1000], k: [0.3, 1.0, 0.1]}
  calc:
    - ca = ma - k*sa
    - cb = mb - k*sb
  text: |
    شركة تقيم المشاريع بالقيمة المتوقعة ناقص [[k|d2]] ضرب الانحراف المعياري، لتعاقب المخاطرة. المشروع أ متوسطه [[ma|g]] وانحرافه [[sa|g]] دينار. المشروع ب متوسطه [[mb|g]] وانحرافه [[sb|g]] دينار. أيهما تختار؟
  solution: |
    $$
    V_a = [[ma|g]] - [[k|d2]] \times [[sa|g]] = [[ca|2]]
    $$

    $$
    V_b = [[mb|g]] - [[k|d2]] \times [[sb|g]] = [[cb|2]]
    $$

    تختار [[pick(ca >= cb, 'أ', 'ب')]]. كلما ارتفع المعامل، زاد كره الشركة للمخاطرة، ومال القرار إلى المشروع الأكثر استقرارا.

- id: c10-d-03
  kind: problem
  part: D
  vars: {ma: 20000, sa: 6000, mb: 80000, sb: 20000}
  random: {ma: [10000, 40000, 1000], sa: [2000, 15000, 500], mb: [50000, 150000, 5000], sb: [10000, 50000, 1000]}
  calc:
    - ca = sa/ma
    - cb = sb/mb
  text: |
    مشروع أ متوسطه [[ma|g]] وانحرافه [[sa|g]] دينار. مشروع ب متوسطه [[mb|g]] وانحرافه [[sb|g]] دينار. أيهما أقل مخاطرة لكل دينار متوقع؟
  solution: |
    $$
    CV_a = [[ca|f4]], \qquad CV_b = [[cb|f4]]
    $$

    الأقل مخاطرة نسبيا: [[pick(ca <= cb, 'أ', 'ب')]].

- id: c10-d-04
  kind: problem
  part: D
  vars: {a1: 8000, a2: 12000, a3: 15000, b1: -6000, b2: 15000, b3: 35000, p1: 0.3, p2: 0.4}
  random: {a1: [3000, 10000, 1000], a2: [11000, 15000, 1000], a3: [16000, 22000, 1000], b1: [-15000, -1000, 1000], b2: [12000, 25000, 1000], b3: [30000, 50000, 1000], p1: [0.2, 0.35, 0.05], p2: [0.3, 0.45, 0.05]}
  calc:
    - p3 = 1 - p1 - p2
    - ma = p1*a1 + p2*a2 + p3*a3
    - mb = p1*b1 + p2*b2 + p3*b3
  text: |
    مشروعان، قيمتهما الحالية في ثلاث حالات باحتمالات [[p1|d2]] و[[p2|d2]] و[[p3|d2]]: أ يعطي [[a1|g]] أو [[a2|g]] أو [[a3|g]]، وب يعطي [[b1|g]] أو [[b2|g]] أو [[b3|g]] دينار. ماذا يختار مدير يحكم بأسوأ حالة؟ وماذا يختار مدير يحكم بالقيمة المتوقعة؟
  solution: |
    **بأسوأ حالة:** أسوأ نتيجة لأ [[a1|g]] دينار، ولب [[b1|g]] دينار. يختار أ، لأن أسوأ ما يحدث له أفضل.

    **بالقيمة المتوقعة:**

    $$
    \mathrm{E}_a = [[ma|2]], \qquad \mathrm{E}_b = [[mb|2]]
    $$

    يختار [[pick(mb > ma, 'ب', 'أ')]].

    معيار أسوأ حالة حذر جدا، ويناسب قرارا قد يهدد بقاء الشركة. القيمة المتوقعة تناسب قرارات متكررة صغيرة.

- id: c10-d-05
  kind: problem
  part: D
  vars: {ma: 30000, sa: 15000, mb: 45000, sb: 35000}
  random: {ma: [10000, 50000, 1000], sa: [5000, 25000, 1000], mb: [30000, 80000, 1000], sb: [20000, 60000, 1000]}
  calc:
    - pa = NORMS(-ma/sa)
    - pb = NORMS(-mb/sb)
  text: |
    مشروع أ متوسطه [[ma|g]] وانحرافه [[sa|g]] دينار. مشروع ب متوسطه [[mb|g]] وانحرافه [[sb|g]] دينار. التوزيعان طبيعيان. قارن احتمال الخسارة.
  solution: |
    $$
    P_a = \Phi\left(\frac{-[[ma|g]]}{[[sa|g]]}\right) = [[pa|%2]]
    $$

    $$
    P_b = \Phi\left(\frac{-[[mb|g]]}{[[sb|g]]}\right) = [[pb|%2]]
    $$

    [[pick(pb > pa, 'ب أعلى قيمة متوقعة، لكن احتمال خسارته أعلى.', 'ب أعلى قيمة متوقعة، واحتمال خسارته أقل أيضا.')]]

- id: c10-d-06
  kind: problem
  part: D
  vars: {C: 80000, A: 22000, n: 6, i: 0.10, rp: 0.05}
  random: {C: [30000, 150000, 5000], A: [8000, 40000, 500], n: [4, 10, 1], i: [0.06, 0.12, 0.01], rp: [0.02, 0.08, 0.01]}
  calc:
    - P0 = -C + A*PA(i, n)
    - P1 = -C + A*PA(i + rp, n)
  text: |
    شركة حدها الأدنى [[i|%]] للمشاريع العادية. تضيف [[rp|%]] للمشاريع عالية المخاطرة. مشروع جديد يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]، وتصنفه الشركة عالي المخاطرة. احسب القيمة الحالية بالحدين. ما عيب هذه الطريقة؟
  solution: |
    $$
    PW_{[[i|%]]} = [[P0|2]]
    $$

    $$
    PW_{[[i+rp|%]]} = [[P1|2]]
    $$

    الشركة تحكم بالرقم الثاني: [[pick(P1 >= 0, 'مقبول', 'مرفوض')]].

    العيب: النسبة الأعلى تخصم التدفقات البعيدة أكثر من القريبة، فتفترض أن المخاطرة تكبر مع الزمن بشكل معين. ولا تقول شيئا عن احتمال الخسارة. هي طريقة عملية وسريعة، لكنها لا تحل محل تحليل المخاطرة.

- id: c10-d-07
  kind: problem
  part: D
  vars: {m: 20000, s: 12000}
  random: {m: [5000, 50000, 1000], s: [3000, 30000, 1000]}
  calc:
    - s1 = 2*s
    - s2 = s*sqrt(2)
    - p1 = NORMS(-2*m/s1)
    - p2 = NORMS(-2*m/s2)
  text: |
    شركة تختار بين مشروع واحد كبير، أو مشروعين صغيرين مستقلين. كل مشروع صغير متوسطه [[m|g]] وانحرافه [[s|g]] دينار. المشروع الكبير يساوي ضعف مشروع صغير في كل حالة. قارن المتوسط والانحراف واحتمال الخسارة.
  solution: |
    المتوسط نفسه في الخيارين: [[2*m|g]] دينار.

    **المشروع الكبير:** كل شيء يتضاعف، والانحراف أيضا:

    $$
    \sigma = 2 \times [[s|g]] = [[s1|g]]
    $$

    **مشروعان مستقلان:** تجمع التباينات:

    $$
    \sigma = \sqrt{2} \times [[s|g]] = [[s2|2]]
    $$

    | | كبير | صغيران |
    | --- | --- | --- |
    | الانحراف | [[s1|0]] | [[s2|0]] |
    | احتمال الخسارة | [[p1|%2]] | [[p2|%2]] |

    توزيع الاستثمار على مشاريع مستقلة يخفض المخاطرة بدون أن يخفض العائد المتوقع. هذا هو التنويع.

- id: c10-d-08
  kind: problem
  part: D
  text: |
    ثلاثة مشاريع: أ متوسطه 40,000 وانحرافه 10,000 دينار. ب متوسطه 35,000 وانحرافه 12,000 دينار. ج متوسطه 50,000 وانحرافه 25,000 دينار. أي مشروع لا يمكن أن تختاره شركة عاقلة؟
  solution: |
    ب، لأن أ أعلى منه قيمة متوقعة وأقل مخاطرة. أ يسيطر على ب. أما أ وج فلا يسيطر أحدهما على الآخر: ج أعلى عائدا وأعلى مخاطرة، والاختيار بينهما يعتمد على موقف الشركة من المخاطرة.

- id: c10-d-09
  kind: problem
  part: D
  vars: {a1: 10000, a2: 20000, a3: 30000, b1: -5000, b2: 25000, b3: 50000}
  random: {a1: [5000, 15000, 1000], a2: [16000, 25000, 1000], a3: [26000, 35000, 1000], b1: [-20000, 0, 1000], b2: [20000, 35000, 1000], b3: [40000, 70000, 1000]}
  calc:
    - r1a = max(a1, b1) - a1
    - r2a = max(a2, b2) - a2
    - r3a = max(a3, b3) - a3
    - r1b = max(a1, b1) - b1
    - r2b = max(a2, b2) - b2
    - r3b = max(a3, b3) - b3
    - ma = max(r1a, r2a, r3a)
    - mb = max(r1b, r2b, r3b)
  text: |
    لا يعرف المدير احتمالات السوق. القيمة الحالية لمشروعين في ثلاث حالات:

    | | ضعيف | متوسط | قوي |
    | --- | --- | --- | --- |
    | أ | [[a1|g]] | [[a2|g]] | [[a3|g]] |
    | ب | [[b1|g]] | [[b2|g]] | [[b3|g]] |

    طبق معيار أقل ندم: الندم في كل حالة هو الفرق عن أفضل مشروع في تلك الحالة.
  solution: |
    | الندم | ضعيف | متوسط | قوي | أكبر ندم |
    | --- | --- | --- | --- | --- |
    | أ | [[r1a|g]] | [[r2a|g]] | [[r3a|g]] | [[ma|g]] |
    | ب | [[r1b|g]] | [[r2b|g]] | [[r3b|g]] | [[mb|g]] |

    نختار المشروع الذي أكبر ندم له أصغر: [[pick(ma <= mb, 'أ', 'ب')]].

- id: c10-d-10
  kind: problem
  part: D
  vars: {ma: 40000, sa: 10000, mb: 50000, sb: 30000, T: 30000}
  random: {ma: [25000, 50000, 1000], sa: [5000, 15000, 1000], mb: [40000, 70000, 1000], sb: [20000, 40000, 1000], T: [20000, 45000, 1000]}
  calc:
    - pa = 1 - NORMS((T - ma)/sa)
    - pb = 1 - NORMS((T - mb)/sb)
  text: |
    مدير مكافأته مرتبطة بأن تتجاوز القيمة الحالية [[T|g]] دينار. المشروع أ متوسطه [[ma|g]] وانحرافه [[sa|g]]، والمشروع ب متوسطه [[mb|g]] وانحرافه [[sb|g]] دينار، بتوزيع طبيعي. أي مشروع يعطيه احتمالا أعلى للمكافأة؟
  solution: |
    $$
    P_a = 1 - \Phi\left(\frac{[[T|g]] - [[ma|g]]}{[[sa|g]]}\right) = [[pa|%2]]
    $$

    $$
    P_b = 1 - \Phi\left(\frac{[[T|g]] - [[mb|g]]}{[[sb|g]]}\right) = [[pb|%2]]
    $$

    يفضل [[pick(pa >= pb, 'أ', 'ب')]]. لاحظ أن هذا قد يختلف عما تفضله الشركة بالقيمة المتوقعة. ربط المكافأة بهدف واحد قد يدفع المدير إلى قرارات لا تخدم الشركة.
