items:

- id: c10-c-01
  kind: problem
  part: C
  vars: {C: 40000, A1: 7000, A2: 15000, p: 0.4, n: 5, i: 0.10}
  random: {C: [20000, 80000, 1000], p: [0.2, 0.6, 0.05], n: [4, 8, 1], i: [0.06, 0.14, 0.01], A1: [1000, 30000, 500], A2: [1000, 50000, 500]}
  calc:
    - A1 = floor(C*AP(i, n)*0.7/500)*500
    - A2 = floor(C*AP(i, n)*1.4/500)*500
    - P1 = -C + A1*PA(i, n)
    - P2 = -C + A2*PA(i, n)
    - m = p*P1 + (1 - p)*P2
    - sd = sqrt(p*(P1 - m)**2 + (1 - p)*(P2 - m)**2)
  text: |
    مشروع يكلف [[C|g]] دينار لمدة [[yrs(n)]]. تدفقه السنوي [[A1|g]] دينار باحتمال [[p|d2]]، أو [[A2|g]] دينار. الحد الأدنى [[i|%]]. احسب القيمة الحالية المتوقعة، وانحرافها المعياري، واحتمال الخسارة.
  solution: |
    $$
    PW_1 = [[P1|2]], \qquad PW_2 = [[P2|2]]
    $$

    $$
    \mathrm{E}(PW) = [[m|2]], \qquad \sigma = [[sd|2]]
    $$

    احتمال الخسارة [[pick(P1 < 0, p, 0) + pick(P2 < 0, 1 - p, 0)|d2]].

- id: c10-c-02
  kind: problem
  part: C
  vars: {C: 250000, A1: 30000, A2: 55000, A3: 80000, p1: 0.25, p2: 0.5, n: 8, i: 0.12}
  random: {C: [100000, 400000, 10000], p1: [0.15, 0.35, 0.05], p2: [0.35, 0.55, 0.05], n: [5, 10, 1], i: [0.08, 0.15, 0.01], A1: [5000, 100000, 1000], A2: [5000, 150000, 1000], A3: [5000, 200000, 1000]}
  calc:
    - p3 = 1 - p1 - p2
    - A1 = floor(C*AP(i, n)*0.65/1000)*1000
    - A2 = floor(C*AP(i, n)*1.05/1000)*1000
    - A3 = floor(C*AP(i, n)*1.45/1000)*1000
    - P1 = -C + A1*PA(i, n)
    - P2 = -C + A2*PA(i, n)
    - P3 = -C + A3*PA(i, n)
    - m = p1*P1 + p2*P2 + p3*P3
    - sd = sqrt(p1*(P1 - m)**2 + p2*(P2 - m)**2 + p3*(P3 - m)**2)
  text: |
    فندق صغير يدرس إضافة جناح يكلف [[C|g]] دينار، لمدة [[yrs(n)]]. صافي دخله السنوي يعتمد على السياحة: [[A1|g]] دينار باحتمال [[p1|d2]]، و[[A2|g]] باحتمال [[p2|d2]]، و[[A3|g]] باحتمال [[p3|d2]]. الحد الأدنى [[i|%]]. ما القيمة الحالية المتوقعة وانحرافها؟
  solution: |
    | السياحة | الاحتمال | القيمة الحالية |
    | --- | --- | --- |
    | ضعيفة | [[p1|d2]] | [[P1|0]] |
    | متوسطة | [[p2|d2]] | [[P2|0]] |
    | قوية | [[p3|d2]] | [[P3|0]] |

    $$
    \mathrm{E}(PW) = [[m|2]], \qquad \sigma = [[sd|2]]
    $$

- id: c10-c-03
  kind: problem
  part: C
  vars: {C1: 50000, C2: 65000, p: 0.6, A: 15000, n: 6, i: 0.10}
  random: {C1: [30000, 70000, 1000], p: [0.4, 0.8, 0.05], A: [5000, 30000, 500], n: [4, 10, 1], i: [0.06, 0.14, 0.01], C2: [31000, 100000, 1000]}
  calc:
    - C2 = floor(C1*1.3/1000)*1000
    - mC = p*C1 + (1 - p)*C2
    - m = -mC + A*PA(i, n)
  text: |
    مشروع يعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. تكلفة البناء [[C1|g]] دينار إذا سارت الأمور كما خطط، باحتمال [[p|d2]]، أو [[C2|g]] دينار إذا ظهرت مشاكل في التربة. الحد الأدنى [[i|%]]. ما القيمة الحالية المتوقعة؟
  solution: |
    التكلفة تدخل خطيا، فتكفي التكلفة المتوقعة:

    $$
    \mathrm{E}(C) = [[p|d2]] \times [[C1|g]] + [[1-p|d2]] \times [[C2|g]] = [[mC|2]]
    $$

    $$
    \mathrm{E}(PW) = -[[mC|2]] + [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[m|2]]
    $$

- id: c10-c-04
  kind: problem
  part: C
  vars: {C: 60000, A: 14000, n: 7, i1: 0.08, i2: 0.14, p: 0.5}
  random: {C: [20000, 100000, 5000], A: [5000, 30000, 500], n: [5, 12, 1], i1: [0.05, 0.09, 0.01], i2: [0.12, 0.18, 0.01], p: [0.3, 0.7, 0.1]}
  calc:
    - P1 = -C + A*PA(i1, n)
    - P2 = -C + A*PA(i2, n)
    - m = p*P1 + (1 - p)*P2
    - ie = p*i1 + (1 - p)*i2
    - Pe = -C + A*PA(ie, n)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. الشركة غير متأكدة من تكلفة تمويلها: [[i1|%]] باحتمال [[p|d2]]، أو [[i2|%]]. احسب القيمة الحالية المتوقعة، وقارنها بالقيمة الحالية عند النسبة المتوقعة.
  solution: |
    $$
    PW_{[[i1|%]]} = [[P1|2]], \qquad PW_{[[i2|%]]} = [[P2|2]]
    $$

    $$
    \mathrm{E}(PW) = [[m|2]]
    $$

    النسبة المتوقعة [[ie|%2]]، والقيمة الحالية عندها [[Pe|2]] دينار. الرقمان مختلفان، لأن القيمة الحالية ليست خطية في النسبة.

- id: c10-c-05
  kind: problem
  part: C
  vars: {C: 30000, S: 7000, na: 4, nb: 8, p: 0.4, i: 0.10}
  random: {C: [10000, 60000, 1000], na: [3, 5, 1], nb: [7, 10, 1], p: [0.2, 0.6, 0.1], i: [0.06, 0.14, 0.01], S: [2000, 20000, 500]}
  calc:
    - S = floor(C*AP(i, (na + nb)/2)*1.0/500)*500
    - Pa = -C + S*PA(i, na)
    - Pb = -C + S*PA(i, nb)
    - m = p*Pa + (1 - p)*Pb
  text: |
    نظام أتمتة يكلف [[C|g]] دينار، ويوفر [[S|g]] دينار سنويا. قد يصبح قديما بعد [[yrs(na)]] باحتمال [[p|d2]] إذا ظهرت تكنولوجيا جديدة، وإلا يخدم [[yrs(nb)]]. الحد الأدنى [[i|%]]. ما القيمة الحالية المتوقعة؟ وما احتمال الخسارة؟
  solution: |
    $$
    PW_{[[na|n]]} = [[Pa|2]], \qquad PW_{[[nb|n]]} = [[Pb|2]]
    $$

    $$
    \mathrm{E}(PW) = [[m|2]]
    $$

    احتمال الخسارة [[pick(Pa < 0, p, 0) + pick(Pb < 0, 1 - p, 0)|d2]].

- id: c10-c-06
  kind: problem
  part: C
  vars: {C: 50000, A1: 10000, A2: 16000, pa: 0.5, n1: 5, n2: 8, pn: 0.6, i: 0.10}
  random: {C: [30000, 80000, 1000], A1: [5000, 15000, 500], A2: [15500, 25000, 500], pa: [0.3, 0.7, 0.1], pn: [0.3, 0.7, 0.1], i: [0.06, 0.14, 0.01], n1: [4, 6, 1], n2: [7, 10, 1]}
  calc:
    - P11 = -C + A1*PA(i, n1)
    - P12 = -C + A1*PA(i, n2)
    - P21 = -C + A2*PA(i, n1)
    - P22 = -C + A2*PA(i, n2)
    - m = pa*pn*P11 + pa*(1 - pn)*P12 + (1 - pa)*pn*P21 + (1 - pa)*(1 - pn)*P22
  text: |
    مشروع يكلف [[C|g]] دينار. متغيران مستقلان: التدفق السنوي [[A1|g]] دينار باحتمال [[pa|d2]] أو [[A2|g]] دينار، والعمر [[yrs(n1)]] باحتمال [[pn|d2]] أو [[yrs(n2)]]. الحد الأدنى [[i|%]]. ابن جدول الحالات الأربع، واحسب القيمة الحالية المتوقعة.
  solution: |
    المتغيران مستقلان، فاحتمال كل حالة حاصل ضرب احتماليها:

    | التدفق | العمر | الاحتمال | القيمة الحالية |
    | --- | --- | --- | --- |
    | [[A1|g]] | [[n1|n]] | [[pa*pn|d2]] | [[P11|0]] |
    | [[A1|g]] | [[n2|n]] | [[pa*(1-pn)|d2]] | [[P12|0]] |
    | [[A2|g]] | [[n1|n]] | [[(1-pa)*pn|d2]] | [[P21|0]] |
    | [[A2|g]] | [[n2|n]] | [[(1-pa)*(1-pn)|d2]] | [[P22|0]] |

    $$
    \mathrm{E}(PW) = [[m|2]]
    $$

- id: c10-c-07
  kind: problem
  part: C
  vars: {C: 40000, A1: 8000, A2: 13000, p: 0.5, n: 6, i: 0.10}
  random: {C: [20000, 80000, 1000], p: [0.2, 0.8, 0.1], n: [4, 10, 1], i: [0.06, 0.14, 0.01], A1: [1000, 30000, 500], A2: [1000, 50000, 500]}
  calc:
    - A1 = floor(C*AP(i, n)*0.8/500)*500
    - A2 = floor(C*AP(i, n)*1.3/500)*500
    - mA = p*A1 + (1 - p)*A2
    - m = -C*AP(i, n) + mA
  text: |
    آلة تكلف [[C|g]] دينار لمدة [[yrs(n)]]. وفرها السنوي [[A1|g]] دينار باحتمال [[p|d2]]، أو [[A2|g]] دينار. الحد الأدنى [[i|%]]. ما القيمة السنوية المتوقعة؟
  solution: |
    $$
    \mathrm{E}(AW) = -[[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[mA|2]] = [[m|2]]
    $$

- id: c10-c-08
  kind: problem
  part: C
  vars: {C: 30000, m1: 18000, m2: 20000, s1: 2000, s2: 4000, i: 0.10}
  random: {C: [15000, 50000, 1000], m1: [8000, 30000, 500], m2: [8000, 30000, 500], s1: [500, 5000, 250], s2: [1000, 7000, 250], i: [0.06, 0.14, 0.01]}
  calc:
    - m1 = max(m1, C*0.45)
    - m = -C + m1*PF(i, 1) + m2*PF(i, 2)
    - sd = sqrt(s1**2*PF(i, 2) + s2**2*PF(i, 4))
    - pl = NORMS(-m/sd)
  text: |
    مشروع لسنتين يكلف [[C|g]] دينار. تدفق السنة الأولى متوسطه [[m1|g]] وانحرافه [[s1|g]] دينار، والثانية متوسطه [[m2|g]] وانحرافه [[s2|g]] دينار، والسنتان مستقلتان. الحد الأدنى [[i|%]]. ما احتمال الخسارة بتقريب التوزيع الطبيعي؟
  solution: |
    $$
    \mathrm{E}(PW) = -[[C|g]] + \frac{[[m1|g]]}{[[1+i|d2]]} + \frac{[[m2|g]]}{[[1+i|d2]]^2} = [[m|2]]
    $$

    $$
    \sigma = \sqrt{\frac{[[s1|g]]^2}{[[1+i|d2]]^2} + \frac{[[s2|g]]^2}{[[1+i|d2]]^4}} = [[sd|2]]
    $$

    $$
    P(PW < 0) = \Phi\left(\frac{-[[m|2]]}{[[sd|2]]}\right) = [[pl|%2]]
    $$

- id: c10-c-09
  kind: problem
  part: C
  vars: {m: 25000, s: 15000}
  random: {m: [5000, 60000, 1000], s: [5000, 40000, 1000]}
  calc:
    - z = -m/s
    - pl = NORMS(z)
  text: |
    قيمة حالية متوسطها [[m|g]] دينار وانحرافها [[s|g]] دينار، وتوزيعها طبيعي تقريبا. ما احتمال الخسارة؟
  solution: |
    $$
    z = \frac{0 - [[m|g]]}{[[s|g]]} = [[z|2]]
    $$

    ```excel
    =NORM.DIST(0, [[m|r]], [[s|r]], TRUE)
    ```

    $$
    P(PW < 0) = [[pl|%2]]
    $$

- id: c10-c-10
  kind: problem
  part: C
  vars: {m: 40000}
  random: {m: [10000, 100000, 1000]}
  calc:
    - s = m/1.6448536269514722
  text: |
    شركة تقبل مشروعا فقط إذا كان احتمال خسارته 5% أو أقل. القيمة الحالية المتوقعة [[m|g]] دينار، وتوزيعها طبيعي. ما أكبر انحراف معياري مقبول؟
  solution: |
    احتمال 5% في الطرف الأيسر يقابل:

    $$
    z = -1.644854
    $$

    ```excel
    =NORM.S.INV(0.05)
    ```

    نريد الصفر عند هذه النقطة:

    $$
    \frac{0 - [[m|g]]}{\sigma} = -1.644854
    $$

    $$
    \sigma = \frac{[[m|g]]}{1.644854} = [[s|2]]
    $$

- id: c10-c-11
  kind: problem
  part: C
  vars: {m: 50000, s: 20000, T: 30000}
  random: {m: [20000, 100000, 1000], s: [5000, 40000, 1000], T: [5000, 120000, 1000]}
  calc:
    - p = 1 - NORMS((T - m)/s)
  text: |
    قيمة حالية متوسطها [[m|g]] دينار وانحرافها [[s|g]] دينار، وتوزيعها طبيعي. ما احتمال أن تتجاوز [[T|g]] دينار؟
  solution: |
    $$
    z = \frac{[[T|g]] - [[m|g]]}{[[s|g]]} = [[(T-m)/s|2]]
    $$

    $$
    P(PW > [[T|g]]) = 1 - \Phi([[(T-m)/s|2]]) = [[p|%2]]
    $$

- id: c10-c-12
  kind: problem
  part: C
  vars: {P1: -15000, P2: 10000, P3: 35000, P4: 60000, p1: 0.15, p2: 0.35, p3: 0.30}
  random: {P1: [-40000, -5000, 1000], P2: [0, 20000, 1000], P3: [21000, 45000, 1000], P4: [46000, 90000, 1000], p1: [0.1, 0.2, 0.05], p2: [0.25, 0.4, 0.05], p3: [0.2, 0.35, 0.05]}
  calc:
    - p4 = 1 - p1 - p2 - p3
    - m = p1*P1 + p2*P2 + p3*P3 + p4*P4
  text: |
    القيمة الحالية لمشروع في أربع حالات: [[P1|g]] و[[P2|g]] و[[P3|g]] و[[P4|g]] دينار، باحتمالات [[p1|d2]] و[[p2|d2]] و[[p3|d2]] و[[p4|d2]]. ابن جدول الاحتمال التراكمي، وأجب: ما احتمال أن تقل القيمة الحالية عن [[P3|g]] دينار؟
  solution: |
    جدول الاحتمال التراكمي يرتب النتائج تصاعديا، ويجمع الاحتمالات:

    | القيمة الحالية أقل من أو تساوي | [[P1|g]] | [[P2|g]] | [[P3|g]] | [[P4|g]] |
    | --- | --- | --- | --- | --- |
    | الاحتمال التراكمي | [[p1|d2]] | [[p1+p2|d2]] | [[p1+p2+p3|d2]] | 1.00 |

    القيمة الحالية أقل من [[P3|g]] في الحالتين الأوليين، فالاحتمال [[p1+p2|d2]]. القيمة المتوقعة [[m|2]] دينار.

- id: c10-c-13
  kind: problem
  part: C
  vars: {C: 70000, A: 18000, n: 5, S1: 0, S2: 15000, p: 0.5, i: 0.10}
  random: {C: [30000, 100000, 5000], A: [8000, 30000, 500], n: [4, 8, 1], S2: [5000, 30000, 1000], p: [0.3, 0.7, 0.1], i: [0.06, 0.14, 0.01]}
  calc:
    - mS = (1 - p)*S2
    - m = -C + A*PA(i, n) + mS*PF(i, n)
  text: |
    آلة تكلف [[C|g]] دينار، وتعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. قيمة بيعها في النهاية صفر باحتمال [[p|d2]] إذا تغيرت المواصفات، أو [[S2|g]] دينار. الحد الأدنى [[i|%]]. ما القيمة الحالية المتوقعة؟
  solution: |
    قيمة البيع المتوقعة:

    $$
    [[p|d2]] \times 0 + [[1-p|d2]] \times [[S2|g]] = [[mS|2]]
    $$

    $$
    \mathrm{E}(PW) = -[[C|g]] + [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[mS|2]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[m|2]]
    $$

- id: c10-c-14
  kind: problem
  part: C
  vars: {s: 5000, n: 4, i: 0.10}
  random: {s: [1000, 10000, 250], n: [3, 8, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - vi = s**2*(PA((1 + i)**2 - 1, n))
    - si = sqrt(vi)
    - sc = s*PA(i, n)
  text: |
    تدفق سنوي لمدة [[yrs(n)]]، انحرافه المعياري [[s|g]] دينار كل سنة. الحد الأدنى [[i|%]]. احسب انحراف القيمة الحالية إذا كانت السنوات مستقلة، ثم إذا كانت مرتبطة تماما: السنة الجيدة تتبعها سنوات جيدة.
  solution: |
    **مستقلة:** تجمع التباينات المخصومة بمربع المعامل:

    $$
    \sigma^2 = [[s|g]]^2 \sum_{t=1}^{[[n|n]]} \frac{1}{(1 + [[i|r]])^{2t}} = [[vi|0]]
    $$

    $$
    \sigma = [[si|2]]
    $$

    **مرتبطة تماما:** كل السنوات تبتعد معا في نفس الاتجاه، فتجمع الانحرافات نفسها:

    $$
    \sigma = [[s|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[sc|2]]
    $$

    الارتباط يضاعف المخاطرة تقريبا. في الواقع، الطلب في سنة يرتبط غالبا بالسنة التي قبلها، فافتراض الاستقلال يقلل المخاطرة.
