items:

- id: c10-k-01
  kind: problem
  part: K
  vars: {P0: -20000, P1: 35000}
  random: {P0: [-80000, 60000, 5000], P1: [10000, 120000, 5000]}
  calc:
    - P1 = max(P1, P0 + 5000)
    - V = P1 - max(P0, 0)
  text: |
    القيمة الحالية المتوقعة لمشروع بدون مرونة [[P0|g]] دينار. إذا أضيف إليه خيار التوسعة، تصبح [[P1|g]] دينار. ما قيمة الخيار؟ وهل يغير القرار؟
  solution: |
    نقارن بأفضل قرار بدون الخيار: المشروع إذا كانت قيمته موجبة، أو الرفض بقيمة صفر:

    $$
    [[P1|g]] - [[max(P0, 0)|g]] = [[V|g]]
    $$

    [[pick(P0 < 0, pick(P1 > 0, "الخيار يغير القرار: المشروع مرفوض بدونه، ومقبول معه.", "حتى مع الخيار تبقى القيمة سالبة، فالمشروع مرفوض."), "المشروع مقبول بدون الخيار، والخيار يزيد قيمته.")]]

- id: c10-k-02
  kind: problem
  part: K
  vars: {C: 400000, AH: 110000, AL: 40000, p: 0.55, n: 6, i: 0.10}
  random: {C: [150000, 800000, 50000], AH: [40000, 250000, 5000], AL: [5000, 100000, 5000], p: [0.3, 0.7, 0.05], n: [5, 10, 1], i: [0.08, 0.14, 0.01]}
  calc:
    - AH = max(AH, floor(C*AP(i, n)*1.3/5000 + 1)*5000)
    - AL = min(AL, floor(C*AP(i, n)*0.8/5000)*5000)
    - f = PA(i, n)
    - PH = -C + AH*f
    - PL = -C + AL*f
    - P0 = p*PH + (1 - p)*PL
    - Pw = p*PH*PF(i, 1)
    - V = Pw - max(P0, 0)
  text: |
    فندق صغير في منطقة سياحية جديدة يكلف [[C|g]] دينار. إذا نجحت المنطقة، باحتمال [[p|d2]]، يعطي [[AH|g]] دينار سنويا لمدة [[yrs(n)]]، وإلا [[AL|g]] دينار. المستثمر يستطيع الانتظار سنة ليرى. الحد الأدنى [[i|%]]. ما قيمة الانتظار؟
  solution: |
    $$
    PW_H = -[[C|g]] + [[AH|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH|2]]
    $$

    $$
    PW_L = -[[C|g]] + [[AL|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    البدء الآن:

    $$
    [[p|d2]] \times [[PH|2]] + [[1-p|d2]] \times [[PL|2]] = [[P0|2]]
    $$

    الانتظار، ثم البناء في الحالة الجيدة فقط:

    $$
    [[p|d2]] \times [[PH|2]] \times (P/F,\ [[i|%]],\ 1) = [[Pw|2]]
    $$

    قيمة الخيار مقارنة بأفضل قرار الآن:

    $$
    [[Pw|2]] - [[max(P0, 0)|2]] = [[V|2]]
    $$

- id: c10-k-03
  kind: problem
  part: K
  vars: {C: 250000, AH: 75000, AL: 10000, p: 0.6, n: 5, S: 160000, i: 0.10}
  random: {C: [100000, 500000, 25000], AH: [30000, 180000, 5000], AL: [0, 50000, 5000], p: [0.4, 0.8, 0.05], n: [4, 8, 1], S: [50000, 350000, 10000], i: [0.08, 0.14, 0.01]}
  calc:
    - AH = max(AH, floor(C*AP(i, n)*1.25/5000 + 1)*5000)
    - S = min(S, floor(C*0.8/10000)*10000)
    - f = PA(i, n)
    - PH = -C + AH*f
    - PL = -C + AL*f
    - P0 = p*PH + (1 - p)*PL
    - KL = AL*PA(i, n - 1)
    - XL = -C + (AL + max(KL, S))*PF(i, 1)
    - P1 = p*PH + (1 - p)*XL
  text: |
    شاحنات تبريد لخدمة توصيل جديدة تكلف [[C|g]] دينار. إذا نجحت الخدمة، باحتمال [[p|d2]]، تعطي [[AH|g]] دينار سنويا لمدة [[yrs(n)]]، وإلا [[AL|g]] دينار. بعد السنة الأولى تعرف الشركة النتيجة، وتستطيع بيع الشاحنات بمبلغ [[S|g]] دينار. الحد الأدنى [[i|%]]. احسب القيمة المتوقعة بالخيار وبدونه.
  solution: |
    بدون الخيار:

    $$
    [[p|d2]] \times [[PH|2]] + [[1-p|d2]] \times [[PL|2]] = [[P0|2]]
    $$

    حيث:

    $$
    PW_H = -[[C|g]] + [[AH|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH|2]]
    $$

    $$
    PW_L = -[[C|g]] + [[AL|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    مع الخيار، في حالة الفشل: قيمة الاستمرار في نهاية السنة الأولى:

    $$
    [[AL|g]]\,(P/A,\ [[i|%]],\ [[n-1|n]]) = [[KL|2]]
    $$

    مقابل البيع [[S|g]]. الأفضل [[max(KL, S)|2]]:

    $$
    -[[C|g]] + ([[AL|g]] + [[max(KL, S)|2]])\,(P/F,\ [[i|%]],\ 1) = [[XL|2]]
    $$

    $$
    [[p|d2]] \times [[PH|2]] + [[1-p|d2]] \times [[XL|2]] = [[P1|2]]
    $$

    قيمة خيار الإيقاف [[P1-P0|2]] دينار.

- id: c10-k-04
  kind: problem
  part: K
  vars: {CS: 200000, SH: 380000, SL: 160000, X: 150000, XH: 320000, p: 0.5, i: 0.10}
  random: {CS: [100000, 400000, 25000], SH: [250000, 600000, 10000], SL: [80000, 300000, 10000], X: [80000, 300000, 10000], XH: [150000, 600000, 10000], p: [0.3, 0.7, 0.05], i: [0.08, 0.14, 0.01]}
  calc:
    - XH = max(XH, floor(X*1.4*(1 + i)**2/10000 + 1)*10000)
    - Pn = p*SH + (1 - p)*SL - CS
    - Ex = (-X + XH)*PF(i, 2)
    - Pe = Pn + p*max(Ex, 0)
  text: |
    مطعم يفتح فرعا صغيرا بتكلفة [[CS|g]] دينار. القيمة الحالية للأرباح [[SH|g]] دينار إذا نجح الفرع، باحتمال [[p|d2]]، أو [[SL|g]] إذا لم ينجح. بعد سنتين، إذا نجح، يستطيع توسعة الفرع بتكلفة [[X|g]] دينار تضيف أرباحا قيمتها [[XH|g]] دينار في تلك السنة. الحد الأدنى [[i|%]]. ما قيمة خيار التوسعة اليوم؟
  solution: |
    بدون التوسعة:

    $$
    [[p|d2]] \times [[SH|g]] + [[1-p|d2]] \times [[SL|g]] - [[CS|g]] = [[Pn|2]]
    $$

    التوسعة في السنة 2، إذا نجح الفرع، قيمتها اليوم:

    $$
    (-[[X|g]] + [[XH|g]])\,(P/F,\ [[i|%]],\ 2) = [[Ex|2]]
    $$

    نوسع فقط في حالة النجاح، باحتمال [[p|d2]]:

    $$
    [[Pn|2]] + [[p|d2]] \times [[max(Ex, 0)|2]] = [[Pe|2]]
    $$

    قيمة الخيار [[Pe-Pn|2]] دينار.

- id: c10-k-05
  kind: problem
  part: K
  vars: {V: 45000, F: 30000}
  random: {V: [10000, 100000, 5000], F: [5000, 90000, 5000]}
  calc:
    - D = V - F
  text: |
    شركة تحسب أن خيار شراء قطعة أرض مجاورة لمصنعها خلال سنتين، بسعر متفق عليه، يرفع القيمة المتوقعة لخطتها [[V|g]] دينار. صاحب الأرض يطلب [[F|g]] دينار ثمنا لهذا الخيار، يدفع الآن ولا يسترد. هل تشتري الخيار؟
  solution: |
    الخيار يستحق ما يضيفه إلى القيمة، لا أكثر:

    $$
    [[V|g]] - [[F|g]] = [[D|g]]
    $$

    [[pick(D > 0, "تشتريه: الخيار يضيف أكثر مما يكلف.", "لا تشتريه: ثمنه أعلى من قيمته.")]]

- id: c10-k-06
  kind: problem
  part: K
  vars: {C: 300000, AH: 120000, AL: 80000, p: 0.5, n: 6, i: 0.10}
  random: {C: [150000, 500000, 25000], AH: [60000, 250000, 5000], AL: [40000, 200000, 5000], p: [0.3, 0.7, 0.05], n: [5, 10, 1], i: [0.08, 0.14, 0.01]}
  calc:
    - AL = max(AL, floor(C*AP(i, n)*1.05/5000 + 1)*5000)
    - AH = max(AH, AL + 10000)
    - f = PA(i, n)
    - PH = -C + AH*f
    - PL = -C + AL*f
    - P0 = p*PH + (1 - p)*PL
    - Pw = (p*PH + (1 - p)*PL)*PF(i, 1)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[AH|g]] أو [[AL|g]] دينار سنويا لمدة [[yrs(n)]]، باحتمالين [[p|d2]] و[[1-p|d2]]. الحد الأدنى [[i|%]]. مدير يقترح انتظار سنة حتى يتضح الطلب. ما رأيك؟
  solution: |
    $$
    PW_H = -[[C|g]] + [[AH|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH|2]]
    $$

    $$
    PW_L = -[[C|g]] + [[AL|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    المشروع رابح في الحالتين. بعد الانتظار ستستثمر الشركة في الحالتين أيضا، فالمعلومة لن تغير القرار. الانتظار يؤخر كل شيء سنة فقط:

    $$
    [[P0|2]] \times (P/F,\ [[i|%]],\ 1) = [[Pw|2]]
    $$

    أقل من [[P0|2]] إذا بدأت الآن. الخيار الذي لا يغير القرار لا قيمة له، والانتظار هنا له تكلفة فقط.

- id: c10-k-07
  kind: problem
  part: K
  vars: {C: 600000, AH: 160000, AL: 60000, p: 0.5, q: 0.3, n: 8, i: 0.10, r: 0.25}
  random: {C: [300000, 900000, 50000], AH: [80000, 250000, 5000], AL: [10000, 120000, 5000], p: [0.4, 0.7, 0.05], q: [0.1, 0.5, 0.05], n: [6, 10, 1], i: [0.08, 0.14, 0.01], r: [0.1, 0.4, 0.05]}
  calc:
    - AH = max(AH, floor(C*AP(i, n)*1.5/5000 + 1)*5000)
    - AL = min(AL, floor(C*AP(i, n)*0.7/5000)*5000)
    - f = PA(i, n)
    - PH = -C + AH*f
    - PL = -C + AL*f
    - P0 = max(p*PH + (1 - p)*PL, 0)
    - PH2 = -C + AH*(1 - r)*f
    - Pw = p*((1 - q)*max(PH, 0) + q*max(PH2, 0))*PF(i, 1)
  text: |
    شركة تستطيع إطلاق منتج الآن بتكلفة [[C|g]] دينار. الطلب مرتفع باحتمال [[p|d2]]، فيعطي [[AH|g]] دينار سنويا لمدة [[yrs(n)]]، أو منخفض فيعطي [[AL|g]] دينار. إذا انتظرت سنة، يدخل منافس السوق باحتمال [[q|d2]]، فتنخفض أرباح الطلب المرتفع [[r|%]]. الحد الأدنى [[i|%]]. هل تنتظر؟
  solution: |
    $$
    PW_H = -[[C|g]] + [[AH|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH|2]]
    $$

    $$
    PW_L = -[[C|g]] + [[AL|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    أفضل قرار الآن: الإطلاق إذا كانت قيمته المتوقعة موجبة، وإلا الرفض. قيمته [[P0|2]].

    بعد الانتظار، في الطلب المرتفع مع منافس:

    $$
    -[[C|g]] + [[AH|g]] \times (1 - [[r|%]])\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH2|2]]
    $$

    الشركة تستثمر فقط إذا كانت القيمة موجبة، ولا تستثمر في الطلب المنخفض:

    $$
    [[p|d2]] \times ([[1-q|d2]] \times [[max(PH, 0)|2]] + [[q|d2]] \times [[max(PH2, 0)|2]])\,(P/F,\ [[i|%]],\ 1) = [[Pw|2]]
    $$

    [[pick(Pw > P0, "الانتظار أفضل رغم خطر المنافس.", "الإطلاق الآن أفضل: خطر المنافس وتأخير الأرباح أكبر من فائدة الانتظار.")]] الخيار يفقد قيمته عندما يكون للانتظار ثمن.

- id: c10-k-08
  kind: problem
  part: K
  vars: {AL: 30000, n: 6, i: 0.10}
  random: {AL: [5000, 100000, 5000], n: [4, 10, 1], i: [0.08, 0.14, 0.01]}
  calc:
    - Smin = AL*PA(i, n - 1)
  text: |
    مشروع فشل، ويعطي [[AL|g]] دينار سنويا للسنوات [[n-1|n]] الباقية. الحد الأدنى [[i|%]]. ما أقل سعر لبيع أصوله يجعل الإيقاف أفضل من الاستمرار؟
  solution: |
    الاستمرار قيمته اليوم:

    $$
    [[AL|g]]\,(P/A,\ [[i|%]],\ [[n-1|n]]) = [[Smin|2]]
    $$

    إذا عرض مشتر أكثر من [[Smin|2]] دينار، فالإيقاف والبيع أفضل.

- id: c10-k-09
  kind: problem
  part: K
  vars: {T: 40000, p: 0.5, C: 500000, AH: 140000, AL: 40000, n: 6, i: 0.10}
  random: {T: [10000, 100000, 5000], p: [0.3, 0.7, 0.05], C: [200000, 800000, 50000], AH: [60000, 250000, 5000], AL: [5000, 100000, 5000], n: [5, 10, 1], i: [0.08, 0.14, 0.01]}
  calc:
    - AH = max(AH, floor(C*AP(i, n)*1.3/5000 + 1)*5000)
    - AL = min(AL, floor(C*AP(i, n)*0.8/5000)*5000)
    - f = PA(i, n)
    - PH = -C + AH*f
    - PL = -C + AL*f
    - P0 = max(p*PH + (1 - p)*PL, 0)
    - Pp = -T + p*PH*PF(i, 1)
  text: |
    قبل بناء مصنع بتكلفة [[C|g]] دينار، تستطيع الشركة بناء خط تجريبي بتكلفة [[T|g]] دينار، يكشف خلال سنة إن كان الطلب مرتفعا، باحتمال [[p|d2]]، فيعطي المصنع [[AH|g]] دينار سنويا لمدة [[yrs(n)]]، أو منخفضا فيعطي [[AL|g]]. الحد الأدنى [[i|%]]. هل يستحق الخط التجريبي؟
  solution: |
    $$
    PW_H = -[[C|g]] + [[AH|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH|2]]
    $$

    $$
    PW_L = -[[C|g]] + [[AL|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PL|2]]
    $$

    أفضل قرار بدون التجربة قيمته [[P0|2]].

    مع التجربة: تدفع [[T|g]] الآن، وتبني بعد سنة فقط في الطلب المرتفع:

    $$
    -[[T|g]] + [[p|d2]] \times [[PH|2]] \times (P/F,\ [[i|%]],\ 1) = [[Pp|2]]
    $$

    [[pick(Pp > P0, "الخط التجريبي يستحق تكلفته.", "الخط التجريبي لا يستحق: تكلفته مع التأخير أكبر من فائدته.")]] الخط التجريبي هو خيار تأجيل يشترى بثمن.

- id: c10-k-10
  kind: concept
  part: K
  text: |
    لماذا تزيد قيمة الخيار الحقيقي كلما زادت المخاطرة؟
  solution: |
    الخيار يسمح بتجنب النتائج السيئة، والاستفادة من الجيدة. كلما ابتعدت النتائج عن المتوسط، زادت الخسارة التي يتجنبها الخيار والأرباح التي يحفظها. بدون مخاطرة، لا توجد معلومات جديدة، فلا قيمة للانتظار.

- id: c10-k-11
  kind: concept
  part: K
  text: |
    ما الفرق بين قيمة المعلومات الكاملة وقيمة خيار التأجيل؟
  solution: |
    قيمة المعلومات الكاملة تفترض أننا نعرف النتيجة الآن، بدون تكلفة وبدون تأخير. خيار التأجيل يعطي المعلومة بعد سنة، فيؤخر الأرباح. لذلك قيمة التأجيل أقل من قيمة المعلومات الكاملة دائما.

- id: c10-k-12
  kind: concept
  part: K
  text: |
    لماذا قد ترفض الطريقة العادية للقيمة الحالية مشروعا استراتيجيا جيدا؟
  solution: |
    القيمة الحالية العادية تفترض خطة ثابتة مهما حدث. المشروع الاستراتيجي قيمته في الأبواب التي يفتحها: توسعة، أو دخول سوق جديد، أو منتج لاحق. هذه خيارات لا تظهر إلا إذا حسبناها بشجرة قرار.

- id: c10-k-13
  kind: problem
  part: K
  text: |
    اكتب دالة Python تحسب القيمة المتوقعة لمشروع بخيار الإيقاف بعد السنة الأولى، ثم استخدمها لمثال الإيقاف في هذا الفصل.
  solution: |
    ```python
    import numpy_financial as npf

    def with_abandon(C, AH, AL, p, n, S, i):
        pa = lambda k: -npf.pv(i, k, 1)
        ph = -C + AH * pa(n)
        keep = AL * pa(n - 1)
        pl = -C + (AL + max(keep, S)) / (1 + i)
        return p * ph + (1 - p) * pl

    def without(C, AH, AL, p, n, i):
        pa = -npf.pv(i, n, 1)
        return p * (-C + AH * pa) + (1 - p) * (-C + AL * pa)

    args = dict(C=300000, AH=100000, AL=20000, p=0.6, n=5, i=0.10)
    print(round(with_abandon(S=180000, **args)), round(without(**args)))
    ```

    النتيجة 175 تقريبا مع الخيار، و-42,227 بدونه، كما في المثال بأرقامه الأصلية. الدالة تسمح بتجربة أسعار بيع مختلفة لترى متى يصبح الخيار مفيدا.

- id: c10-k-14
  kind: problem
  part: K
  vars: {C: 300000, AH: 90000, AL: 20000, p: 0.6, n: 5, i: 0.10}
  random: {C: [150000, 500000, 25000], AH: [40000, 200000, 5000], AL: [0, 60000, 5000], p: [0.4, 0.8, 0.05], n: [4, 8, 1], i: [0.08, 0.14, 0.01]}
  calc:
    - AH = max(AH, floor(C*AP(i, n)*1.25/5000 + 1)*5000)
    - f = PA(i, n)
    - PH = -C + AH*f
    - PL = -C + AL*f
    - P0 = p*PH + (1 - p)*PL
    - KL = AL*PA(i, n - 1)
    - Sb = (C - p*PH/(1 - p))*(1 + i) - AL
    - Sb = max(Sb, KL)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[AH|g]] دينار سنويا لمدة [[yrs(n)]] باحتمال [[p|d2]]، أو [[AL|g]] دينار. الحد الأدنى [[i|%]]. ما أقل سعر بيع للأصول بعد السنة الأولى، في حالة الفشل، يجعل القيمة المتوقعة للمشروع صفرا على الأقل؟
  solution: |
    $$
    PW_H = -[[C|g]] + [[AH|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PH|2]]
    $$

    بدون الإيقاف القيمة المتوقعة [[P0|2]]. مع الإيقاف بسعر S، حالة الفشل قيمتها:

    $$
    -[[C|g]] + ([[AL|g]] + S)\,(P/F,\ [[i|%]],\ 1)
    $$

    نريد:

    $$
    [[p|d2]] \times [[PH|2]] + [[1-p|d2]] \times \left(-[[C|g]] + \frac{[[AL|g]] + S}{1 + [[i|%]]}\right) = 0
    $$

    [[pick(P0 >= 0, "المشروع مقبول أصلا بدون الخيار. ", "")]]أقل سعر يحقق ذلك، ولا يقل عن قيمة الاستمرار [[KL|2]]: [[Sb|2]] دينار.

- id: c10-k-15
  kind: concept
  part: K
  text: |
    شركة تختار بين آلة متخصصة رخيصة لا تباع إلا خردة، وآلة عامة أغلى قليلا لها سوق مستعمل نشط. كيف يغير خيار الإيقاف المقارنة؟
  solution: |
    الآلة العامة تحمل خيار إيقاف أقوى: إذا فشل المنتج، تباع بسعر جيد. المقارنة بالقيمة الحالية العادية تتجاهل ذلك، فتفضل الآلة الرخيصة. بإضافة قيمة الخيار قد تصبح الآلة العامة أفضل، خاصة لمنتج جديد غير مؤكد.
