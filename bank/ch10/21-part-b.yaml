items:

- id: c10-b-01
  kind: problem
  part: B
  vars: {c1: 2000, c2: 9000, p: 0.7}
  random: {c1: [500, 5000, 100], c2: [6000, 20000, 500], p: [0.5, 0.9, 0.05]}
  calc:
    - m = p*c1 + (1 - p)*c2
  text: |
    إصلاح ضاغط يكلف [[c1|g]] دينار إذا كان العطل بسيطا، واحتمال ذلك [[p|d2]]. وإلا يكلف [[c2|g]] دينار. ما التكلفة المتوقعة للإصلاح؟
  solution: |
    $$
    \mathrm{E} = [[p|d2]] \times [[c1|g]] + [[1-p|d2]] \times [[c2|g]] = [[m|2]]
    $$

- id: c10-b-02
  kind: problem
  part: B
  vars: {x1: 4, x2: 6, x3: 8, p1: 0.2, p2: 0.5}
  random: {x1: [2, 4, 1], x2: [5, 7, 1], x3: [8, 12, 1], p1: [0.1, 0.3, 0.05], p2: [0.4, 0.6, 0.05]}
  calc:
    - p3 = 1 - p1 - p2
    - m = p1*x1 + p2*x2 + p3*x3
    - sd = sqrt(p1*(x1 - m)**2 + p2*(x2 - m)**2 + p3*(x3 - m)**2)
  text: |
    عمر آلة غير مؤكد: [[yrs(x1)]] باحتمال [[p1|d2]]، أو [[yrs(x2)]] باحتمال [[p2|d2]]، أو [[yrs(x3)]] باحتمال [[p3|d2]]. ما العمر المتوقع وانحرافه المعياري؟
  solution: |
    $$
    \mathrm{E}(n) = [[p1|d2]] \times [[x1|n]] + [[p2|d2]] \times [[x2|n]] + [[p3|d2]] \times [[x3|n]] = [[m|2]]
    $$

    $$
    \sigma = \sqrt{\sum p_k\,(n_k - \mathrm{E}(n))^2} = [[sd|2]]
    $$

- id: c10-b-03
  kind: problem
  part: B
  vars: {x1: 30000, x2: 50000, x3: 80000, p1: 0.25, p3: 0.15}
  random: {x1: [10000, 40000, 1000], x2: [41000, 70000, 1000], x3: [71000, 120000, 1000], p1: [0.1, 0.35, 0.05], p3: [0.1, 0.3, 0.05]}
  calc:
    - p2 = 1 - p1 - p3
    - m = p1*x1 + p2*x2 + p3*x3
  text: |
    ربح منتج [[x1|g]] أو [[x2|g]] أو [[x3|g]] دينار. احتمال الأول [[p1|d2]]، واحتمال الثالث [[p3|d2]]. ما احتمال الثاني؟ وما الربح المتوقع؟
  solution: |
    $$
    p_2 = 1 - [[p1|d2]] - [[p3|d2]] = [[p2|d2]]
    $$

    $$
    \mathrm{E} = [[p1|d2]] \times [[x1|g]] + [[p2|d2]] \times [[x2|g]] + [[p3|d2]] \times [[x3|g]] = [[m|2]]
    $$

- id: c10-b-04
  kind: problem
  part: B
  vars: {q0: 0.5, q1: 0.3, q2: 0.15, c: 3500}
  random: {q0: [0.3, 0.5, 0.05], q1: [0.2, 0.3, 0.05], q2: [0.05, 0.15, 0.05], c: [1000, 8000, 250]}
  calc:
    - q3 = 1 - q0 - q1 - q2
    - k = q1 + 2*q2 + 3*q3
    - m = k*c
  text: |
    عدد الأعطال الكبيرة في خط إنتاج خلال سنة: صفر باحتمال [[q0|d2]]، وعطل واحد باحتمال [[q1|d2]]، وعطلان باحتمال [[q2|d2]]، وثلاثة باحتمال [[q3|d2]]. كل عطل يكلف [[c|g]] دينار. ما التكلفة السنوية المتوقعة للأعطال؟
  solution: |
    العدد المتوقع للأعطال:

    $$
    0 \times [[q0|d2]] + 1 \times [[q1|d2]] + 2 \times [[q2|d2]] + 3 \times [[q3|d2]] = [[k|2]]
    $$

    $$
    [[k|2]] \times [[c|g]] = [[m|2]]
    $$

- id: c10-b-05
  kind: problem
  part: B
  vars: {W: 80000, p: 0.3, B: 6000}
  random: {W: [20000, 200000, 5000], p: [0.1, 0.5, 0.05], B: [1000, 15000, 500]}
  calc:
    - m = p*W - B
    - pm = B/W
  text: |
    شركة مقاولات تدرس التقدم لعطاء. إعداد العرض يكلف [[B|g]] دينار. إذا فازت، تربح [[W|g]] دينار. احتمال الفوز [[p|d2]]. ما الربح المتوقع من التقدم؟ وما أقل احتمال فوز يجعل التقدم مجديا؟
  solution: |
    تكلفة الإعداد تدفع في الحالتين:

    $$
    \mathrm{E} = [[p|d2]] \times [[W|g]] - [[B|g]] = [[m|2]]
    $$

    التقدم مجد إذا كان الربح المتوقع موجبا:

    $$
    p > \frac{[[B|g]]}{[[W|g]]} = [[pm|f4]]
    $$

- id: c10-b-06
  kind: problem
  part: B
  vars: {V: 200000, p: 0.01, P: 3000}
  random: {V: [50000, 500000, 10000], p: [0.002, 0.02, 0.001], P: [500, 8000, 100]}
  calc:
    - L = p*V
  text: |
    مستودع قيمته [[V|g]] دينار. احتمال حريق يدمره في سنة [[p|r]]. قسط التأمين السنوي [[P|g]] دينار. قارن القسط بالخسارة المتوقعة. لماذا تؤمن الشركات حتى لو كان القسط أعلى منها؟
  solution: |
    $$
    \mathrm{E}(\mathrm{loss}) = [[p|r]] \times [[V|g]] = [[L|2]]
    $$

    القسط [[pick(P > L, 'أعلى من', 'أقل من')]] الخسارة المتوقعة. شركة التأمين تحتاج ربحا، فالقسط غالبا أعلى. لكن الشركة تؤمن لأن خسارة [[V|g]] دينار دفعة واحدة قد تفلسها. التأمين يحول خسارة كبيرة غير مؤكدة إلى تكلفة صغيرة مؤكدة.

- id: c10-b-07
  kind: problem
  part: B
  vars: {d1: 800, d2: 1000, d3: 1200, d4: 1500, p1: 0.1, p2: 0.4, p3: 0.3}
  random: {d1: [500, 900, 50], d2: [950, 1150, 50], d3: [1200, 1400, 50], d4: [1450, 1800, 50], p1: [0.1, 0.2, 0.05], p2: [0.3, 0.4, 0.05], p3: [0.2, 0.35, 0.05]}
  calc:
    - p4 = 1 - p1 - p2 - p3
    - m = p1*d1 + p2*d2 + p3*d3 + p4*d4
    - v = p1*(d1 - m)**2 + p2*(d2 - m)**2 + p3*(d3 - m)**2 + p4*(d4 - m)**2
  text: |
    الطلب الشهري على قطعة غيار:

    | الطلب | [[d1|g]] | [[d2|g]] | [[d3|g]] | [[d4|g]] |
    | --- | --- | --- | --- | --- |
    | الاحتمال | [[p1|d2]] | [[p2|d2]] | [[p3|d2]] | [[p4|d2]] |

    احسب الطلب المتوقع وانحرافه المعياري.
  solution: |
    $$
    \mathrm{E}(D) = [[m|2]]
    $$

    $$
    \sigma = \sqrt{[[v|2]]} = [[sqrt(v)|2]]
    $$

- id: c10-b-08
  kind: problem
  part: B
  vars: {mq: 12000, sq: 2500, p: 8}
  random: {mq: [5000, 30000, 500], sq: [500, 6000, 250], p: [3, 20, 0.5]}
  calc:
    - mR = p*mq
    - sR = p*sq
  text: |
    المبيعات السنوية لها متوسط [[mq|g]] وحدة، وانحراف معياري [[sq|g]] وحدة. سعر الوحدة ثابت [[p|d2]] دينار. ما متوسط الإيراد وانحرافه المعياري؟
  solution: |
    الإيراد يساوي السعر ضرب الكمية. ضرب متغير في رقم ثابت يضرب متوسطه وانحرافه بنفس الرقم:

    $$
    \mathrm{E}(R) = [[p|d2]] \times [[mq|g]] = [[mR|2]]
    $$

    $$
    \sigma_R = [[p|d2]] \times [[sq|g]] = [[sR|2]]
    $$

    التباين يضرب في مربع الرقم.

- id: c10-b-09
  kind: problem
  part: B
  vars: {m1: 20000, s1: 3000, m2: 15000, s2: 4000}
  random: {m1: [5000, 40000, 500], s1: [500, 6000, 250], m2: [5000, 40000, 500], s2: [500, 6000, 250]}
  calc:
    - m = m1 + m2
    - s = sqrt(s1**2 + s2**2)
  text: |
    تكلفة مشروع من بندين مستقلين: المواد بمتوسط [[m1|g]] وانحراف [[s1|g]] دينار، والعمالة بمتوسط [[m2|g]] وانحراف [[s2|g]] دينار. ما متوسط التكلفة الكلية وانحرافها؟
  solution: |
    المتوسطات تجمع دائما:

    $$
    \mathrm{E} = [[m1|g]] + [[m2|g]] = [[m|g]]
    $$

    البندان مستقلان، فتجمع التباينات، وليس الانحرافات:

    $$
    \sigma = \sqrt{[[s1|g]]^2 + [[s2|g]]^2} = [[s|2]]
    $$

    الانحراف الكلي أقل من مجموع الانحرافين، [[s1+s2|g]] دينار، لأن البندين نادرا ما يبتعدان في نفس الاتجاه معا.

- id: c10-b-10
  kind: problem
  part: B
  vars: {h1: 1500, h2: 2000, ph: 0.4, r1: 6, r2: 9, pr: 0.5}
  random: {h1: [800, 1800, 100], h2: [1900, 3000, 100], ph: [0.3, 0.7, 0.1], r1: [3, 7, 1], r2: [8, 12, 1], pr: [0.3, 0.7, 0.1]}
  calc:
    - mh = ph*h1 + (1 - ph)*h2
    - mr = pr*r1 + (1 - pr)*r2
    - m = mh*mr
  text: |
    آلة توفر عدد ساعات عمل في السنة: [[h1|g]] ساعة باحتمال [[ph|d2]]، أو [[h2|g]] ساعة. قيمة الساعة [[r1|g]] دينار باحتمال [[pr|d2]]، أو [[r2|g]] دينار. المتغيران مستقلان. ما الوفر السنوي المتوقع؟
  solution: |
    عندما يكون المتغيران مستقلين، متوسط حاصل ضربهما يساوي حاصل ضرب متوسطيهما:

    $$
    \mathrm{E}(h) = [[mh|2]], \qquad \mathrm{E}(r) = [[mr|2]]
    $$

    $$
    \mathrm{E}(h\,r) = [[mh|2]] \times [[mr|2]] = [[m|2]]
    $$

- id: c10-b-11
  kind: problem
  part: B
  vars: {G: 60000, L: -40000}
  random: {G: [20000, 150000, 5000], L: [-80000, -10000, 5000]}
  calc:
    - p = -L/(G - L)
  text: |
    مشروع يربح [[G|g]] دينار إذا نجح، ويخسر [[abs(L)|g]] دينار إذا فشل. ما أقل احتمال نجاح يجعل القيمة المتوقعة غير سالبة؟
  solution: |
    $$
    p \times [[G|g]] + (1 - p) \times ([[L|g]]) = 0
    $$

    $$
    p = \frac{[[abs(L)|g]]}{[[G|g]] + [[abs(L)|g]]} = [[p|f4]]
    $$

- id: c10-b-12
  kind: problem
  part: B
  vars: {x1: 10, x2: 20, x3: 40, p1: 0.3, p2: 0.5}
  random: {x1: [5, 15, 1], x2: [16, 30, 1], x3: [31, 60, 1], p1: [0.2, 0.4, 0.05], p2: [0.3, 0.5, 0.05]}
  calc:
    - p3 = 1 - p1 - p2
    - m = p1*x1 + p2*x2 + p3*x3
    - m2 = p1*x1**2 + p2*x2**2 + p3*x3**2
    - v = m2 - m**2
  text: |
    زمن توقف خط بالساعات بعد عطل: [[x1|g]] أو [[x2|g]] أو [[x3|g]]، باحتمالات [[p1|d2]] و[[p2|d2]] و[[p3|d2]]. احسب التباين بالطريقة المختصرة: متوسط المربعات ناقص مربع المتوسط.
  solution: |
    $$
    \mathrm{E}(X) = [[m|2]]
    $$

    $$
    \mathrm{E}(X^2) = [[p1|d2]] \times [[x1**2|g]] + [[p2|d2]] \times [[x2**2|g]] + [[p3|d2]] \times [[x3**2|g]] = [[m2|2]]
    $$

    $$
    \sigma^2 = [[m2|2]] - [[m|2]]^2 = [[v|2]]
    $$

    الانحراف المعياري [[sqrt(v)|2]] ساعة.

- id: c10-b-13
  kind: problem
  part: B
  vars: {ma: 40000, sa: 12000, mb: 150000, sb: 30000}
  random: {ma: [20000, 80000, 1000], sa: [3000, 20000, 500], mb: [100000, 300000, 5000], sb: [10000, 60000, 1000]}
  calc:
    - ca = sa/ma
    - cb = sb/mb
  text: |
    مشروع صغير قيمته الحالية المتوقعة [[ma|g]] دينار وانحرافها [[sa|g]] دينار. مشروع كبير قيمته المتوقعة [[mb|g]] دينار وانحرافها [[sb|g]] دينار. أيهما أخطر لكل دينار متوقع؟
  solution: |
    $$
    CV_a = \frac{[[sa|g]]}{[[ma|g]]} = [[ca|f4]], \qquad CV_b = \frac{[[sb|g]]}{[[mb|g]]} = [[cb|f4]]
    $$

    الأخطر لكل دينار: [[pick(ca > cb, 'الصغير', 'الكبير')]]، مع أن الانحراف المعياري للكبير [[pick(sb > sa, 'أكبر', 'أصغر')]].

- id: c10-b-14
  kind: problem
  part: B
  vars: {S: 4000, p: 0.25, D: 22000}
  random: {S: [1000, 10000, 250], p: [0.05, 0.4, 0.05], D: [5000, 50000, 1000]}
  calc:
    - E = p*D
  text: |
    محرك رئيسي قد يتعطل هذه السنة باحتمال [[p|d2]]. إذا تعطل ولم يكن عند المصنع محرك احتياطي، يتوقف الإنتاج ويخسر [[D|g]] دينار. المحرك الاحتياطي يكلف [[S|g]] دينار، ولا قيمة له إذا لم يستخدم. هل يشتري المصنع محركا احتياطيا؟
  solution: |
    بدون احتياطي، الخسارة المتوقعة:

    $$
    [[p|d2]] \times [[D|g]] = [[E|2]]
    $$

    مع الاحتياطي، التكلفة [[S|g]] دينار مؤكدة. [[pick(S < E, 'الاحتياطي أرخص بالقيمة المتوقعة، فيشتريه المصنع.', 'الاحتياطي أغلى بالقيمة المتوقعة. لكن المصنع قد يشتريه إذا كان التوقف يضر علاقته بزبائن مهمين، وهذا لا تظهره الأرقام.')]]
