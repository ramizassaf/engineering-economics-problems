- id: c06-i-01
  kind: problem
  part: I
  vars: {F: 20000, p: 15, v: 9}
  random: {F: [5000, 60000, 1000], p: [10, 30, 1], v: [3, 9, 1]}
  calc:
    - Q = F/(p - v)
  text: |
    ابن في Excel جدولا للإيراد والتكلفة الكلية والربح لكميات من 0 إلى 10,000 بخطوة 500، لتكاليف ثابتة [[F|g]] دينار، وسعر [[p|g]]، وتكلفة متغيرة [[v|g]] دينار. ارسم الخطين، واحسب نقطة التعادل بصيغة.
  solution: |
    الكميات في العمود A من A2، ثم:

    ```excel
    =[[p|r]]*A2
    =[[F|r]] + [[v|r]]*A2
    =B2 - C2
    ```

    ونقطة التعادل في خلية مستقلة:

    ```excel
    =[[F|r]] / ([[p|r]] - [[v|r]])
    ```

    النتيجة [[Q|2]] وحدة.

- id: c06-i-02
  kind: problem
  part: I
  text: |
    استخدم Goal Seek في Excel لإيجاد السعر الذي يجعل الربح 15,000 دينار، لمصنع تكاليفه الثابتة 40,000 دينار، والمتغيرة 12 دينار للوحدة، ويبيع 5,000 وحدة.
  solution: |
    ضع السعر في B1، واكتب الربح في B2:

    ```excel
    =(B1 - 12)*5000 - 40000
    ```

    Goal Seek: اجعل B2 تساوي 15000 بتغيير B1. السعر 23 دينارا.

- id: c06-i-03
  kind: problem
  part: I
  text: |
    اكتب في Python دالة تحسب نقطة التعادل والربح، واطبع جدول حساسية لنقطة التعادل عند أسعار 12 و14 و16 و18 دينار، وتكاليف ثابتة 20,000 و30,000 دينار، وتكلفة متغيرة 8 دنانير.
  solution: |
    ```python
    def breakeven(F, p, v):
        return F / (p - v)

    for F in [20000, 30000]:
        row = [round(breakeven(F, p, 8)) for p in [12, 14, 16, 18]]
        print(F, row)
    ```

    | الثابتة | 12 | 14 | 16 | 18 |
    | --- | --- | --- | --- | --- |
    | 20,000 | 5,000 | 3,333 | 2,500 | 2,000 |
    | 30,000 | 7,500 | 5,000 | 3,750 | 3,000 |

- id: c06-i-04
  kind: problem
  part: I
  text: |
    استخدم Python لتقدير الجزء الثابت والمتغير في فاتورة الماء من بيانات الأشهر الستة في الجزء د، بالانحدار الخطي.
  solution: |
    ```python
    import numpy as np
    tons = [40, 55, 35, 60, 50, 45]
    bill = [1380, 1650, 1300, 1740, 1580, 1470]
    v, F = np.polyfit(tons, bill, 1)
    print(round(v, 2), round(F, 2))
    ```

    النتيجة 17.83 دينار للطن، و673.14 دينار ثابتة.

- id: c06-i-05
  kind: problem
  part: I
  text: |
    اكتب في Python برنامجا يقارن التصنيع والشراء لكميات من 1,000 إلى 10,000 قطعة، لتكلفة تصنيع متغيرة 6 دنانير وثابتة تختفي 8,000 دينار، وسعر شراء 7.50 دينار. اطبع القرار لكل كمية.
  solution: |
    ```python
    for Q in range(1000, 10001, 1000):
        make = 6 * Q + 8000
        buy = 7.5 * Q
        print(Q, make, buy, "make" if make <= buy else "buy")
    ```

    نقطة التساوي 5,333 قطعة تقريبا. من 6,000 قطعة فصاعدا يصبح التصنيع أرخص.

- id: c06-i-06
  kind: problem
  part: I
  vars: {Ca: 4000, Ea: 1800, Cb: 6500, Eb: 1100, M: 150}
  random: {Ca: [2000, 6000, 250], Ea: [1200, 2500, 50], Cb: [5000, 9000, 250], Eb: [600, 1400, 50], M: [100, 300, 25]}
  calc:
    - p6 = (Ca + (Ea + M)*PA(0.06, 10)) - (Cb + (Eb + M)*PA(0.06, 10))
    - p12 = (Ca + (Ea + M)*PA(0.12, 10)) - (Cb + (Eb + M)*PA(0.12, 10))
  text: |
    للمكيفين في مثال تكلفة دورة الحياة، بأسعار [[Ca|g]] و[[Cb|g]] دينار وكهرباء [[Ea|g]] و[[Eb|g]] دينار سنويا وصيانة [[M|g]] دينار: احسب في Excel الفرق بين تكلفتي دورة الحياة بنسبتي 6% و12%.
  solution: |
    ```excel
    =([[Ca|r]] + PV(6%, 10, -([[Ea|r]] + [[M|r]]))) - ([[Cb|r]] + PV(6%, 10, -([[Eb|r]] + [[M|r]])))
    ```

    الفرق، أي المكيف أ ناقص المكيف ب: [[p6|2]] دينار بنسبة 6%، و[[p12|2]] دينار بنسبة 12%. النسبة العالية تقلل قيمة التوفير المستقبلي، فتضعف حجة المكيف الأغلى.

- id: c06-i-07
  kind: problem
  part: I
  text: |
    اكتب برنامج Python يرسم متوسط التكلفة والتكلفة الحدية لمصنع تكلفته:

    $$
    C = 2000 + 3\,Q + 0.002\,Q^2
    $$

    للكميات من 100 إلى 3,000. عند أي كمية يكون متوسط التكلفة أقل ما يمكن؟
  solution: |
    ```python
    import numpy as np
    import matplotlib.pyplot as plt
    Q = np.arange(100, 3001, 50)
    C = 2000 + 3 * Q + 0.002 * Q ** 2
    AC = C / Q
    MC = 3 + 0.004 * Q
    plt.plot(Q, AC, label="AC")
    plt.plot(Q, MC, label="MC")
    plt.legend()
    plt.show()
    print(Q[np.argmin(AC)])
    ```

    أقل متوسط عند 1,000 وحدة تقريبا، حيث يتقاطع المنحنيان: التكلفة الحدية تساوي متوسط التكلفة عند أقل قيمة له.

- id: c06-i-08
  kind: problem
  part: I
  text: |
    ابن في Excel جدولا يحسب الهامش لكل ساعة آلة لخمسة منتجات، ويرتبها تنازليا بالدالة SORTBY.
  solution: |
    في الأعمدة: اسم المنتج، والسعر، والتكلفة المتغيرة، وساعات الآلة للوحدة. في العمود E:

    ```excel
    =(B2 - C2) / D2
    ```

    ثم الترتيب:

    ```excel
    =SORTBY(A2:E6, E2:E6, -1)
    ```

    المنتج في الأعلى يأخذ ساعات الآلة أولا، حتى يغطي طلبه، ثم الذي يليه.
