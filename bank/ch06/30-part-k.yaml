- id: c06-k-01
  kind: case
  part: K
  calc:
    - F = 3500 + 1800 + 2400 + 500
    - v = 0.45 + 0.08 + 0.12
    - cm = 1.2 - v
    - Q = F/cm
    - Qd = Q/26
    - P5 = cm*15000 - F
    - g = (0.95 - v)*3000
  text: |
    **حالة 6.1: مصنع عصائر صغير في طولكرم**

    مصنع عصائر طبيعية لديه التكاليف الشهرية التالية:

    | البند | المبلغ |
    | --- | --- |
    | إيجار | 3,500 |
    | رواتب ثابتة | 1,800 |
    | قسط قرض الآلات | 2,400 |
    | تأمين وإنترنت | 500 |
    | فواكه لكل عبوة | 0.45 |
    | عبوة وغطاء | 0.08 |
    | كهرباء وماء لكل عبوة | 0.12 |

    يبيع العبوة للمحلات بسعر 1.20 دينار، ويعمل 26 يوما في الشهر.

    (أ) صنف التكاليف واكتب معادلة التكلفة الكلية. (ب) ما نقطة التعادل الشهرية؟ وكم عبوة يوميا؟ (ج) ما الربح إذا باع 15,000 عبوة في الشهر؟ (د) سلسلة مطاعم تطلب 3,000 عبوة إضافية شهريا بسعر 0.95 دينار، والمصنع فيه طاقة فائضة. هل يقبل؟
  solution: |
    (أ) الثابتة: الإيجار والرواتب وقسط القرض والتأمين.

    $$
    FC = 3{,}500 + 1{,}800 + 2{,}400 + 500 = [[F|g]]
    $$

    المتغيرة للعبوة:

    $$
    v = 0.45 + 0.08 + 0.12 = [[v|d2]]
    $$

    $$
    C = [[F|g]] + [[v|d2]]\,Q
    $$

    (ب) الهامش [[cm|d2]] دينار للعبوة:

    $$
    Q^* = \frac{[[F|g]]}{[[cm|d2]]} = [[Q|0]]
    $$

    أي حوالي [[ceil(Qd)|g]] عبوة يوميا.

    (ج)

    $$
    [[cm|d2]] \times 15{,}000 - [[F|g]] = [[P5|2]]
    $$

    (د) الطلبية تضيف التكلفة المتغيرة فقط:

    $$
    (0.95 - [[v|d2]]) \times 3{,}000 = [[g|2]]
    $$

    يقبل، بشرط أن لا تعلم المحلات بالسعر فتطالب به.

- id: c06-k-02
  kind: case
  part: K
  calc:
    - make = (4.2 + 2.8 + 1.0)*6000 + 9000
    - buy = 9.2*6000
    - full = 4.2 + 2.8 + 1.0 + 24000/6000
    - make2 = make + 12*800
    - x = 9000/(9.2 - 8.0)
  text: |
    **حالة 6.2: قطعة بلاستيكية لمصنع أدوات منزلية**

    مصنع يحتاج 6,000 قطعة سنويا. المحاسب يحسب تكلفة القطعة هكذا: مواد 4.20، وعمالة 2.80، وتكاليف متغيرة أخرى 1.00، ونصيب من التكاليف الثابتة 4.00 دينار، أي 12.00 دينارا للقطعة. مورد يعرض القطعة بسعر 9.20 دينار. التكاليف الثابتة المحملة على القطعة 24,000 دينار سنويا، منها 9,000 دينار تختفي إذا توقف التصنيع، والباقي إيجار وإدارة.

    (أ) المحاسب يقول: نوفر 2.80 دينار في كل قطعة إذا اشترينا. ما الخطأ؟ (ب) قارن التصنيع والشراء بشكل صحيح. (ج) إذا اشترى المصنع القطعة، يمكنه تأجير المساحة بمبلغ 800 دينار شهريا. هل يتغير القرار؟ (د) عند أي كمية سنوية يتساوى التصنيع والشراء، بدون التأجير؟
  solution: |
    (أ) المحاسب اعتبر أن كل التكاليف الثابتة تختفي. لكن 15,000 دينار منها تستمر في الحالتين، فلا تدخل في القرار.

    (ب)

    $$
    \mathrm{make} = (4.20 + 2.80 + 1.00) \times 6{,}000 + 9{,}000 = [[make|g]]
    $$

    $$
    \mathrm{buy} = 9.20 \times 6{,}000 = [[buy|g]]
    $$

    التصنيع [[pick(make <= buy, 'أرخص', 'أغلى')]] بمقدار [[abs(buy - make)|g]] دينار سنويا.

    (ج) الإيجار الضائع يضاف إلى التصنيع:

    $$
    [[make|g]] + 12 \times 800 = [[make2|g]]
    $$

    مقابل [[buy|g]] للشراء. القرار: [[pick(make2 <= buy, 'التصنيع', 'الشراء')]].

    (د)

    $$
    8.00\,Q + 9{,}000 = 9.20\,Q \quad\Rightarrow\quad Q = [[x|g]]
    $$

- id: c06-k-03
  kind: case
  part: K
  calc:
    - Pa = 18000 + (2.5*2000*0.15 + 1200)*PA(0.10, 8)
    - Pb = 32000 + (1.5*2000*0.15 + 600)*PA(0.10, 8) - 4000*PF(0.10, 8)
    - Aa = Pa*AP(0.10, 8)
    - Ab = Pb*AP(0.10, 8)
    - ua = Aa/40000
    - ub = Ab/40000
  text: |
    **حالة 6.3: ضاغط هواء لورشة دهان**

    ورشة دهان سيارات تختار ضاغط هواء لعمر 8 سنوات. الضاغط يعمل 2,000 ساعة سنويا، وسعر الكيلوواط ساعة 0.15 دينار. الورشة تدهن 40,000 قطعة سنويا. الحد الأدنى للعائد 10%.

    | | الضاغط أ | الضاغط ب |
    | --- | --- | --- |
    | السعر | 18,000 | 32,000 |
    | القدرة بالكيلوواط | 2.5 | 1.5 |
    | الصيانة السنوية | 1,200 | 600 |
    | قيمة البيع بعد 8 سنوات | 0 | 4,000 |

    (أ) ما تكلفة الكهرباء السنوية لكل ضاغط؟ (ب) ما تكلفة دورة الحياة لكل منهما؟ (ج) ما التكلفة السنوية المكافئة؟ (د) ما تكلفة الضاغط لكل قطعة مدهونة؟ (هـ) قسم المشتريات يفضل أ لأن سعره أقل بكثير. ما ردك؟
  solution: |
    (أ) الكهرباء تساوي القدرة مضروبة في الساعات والسعر: 750 دينار للضاغط أ، و450 دينار للضاغط ب.

    (ب)

    $$
    LCC_a = 18{,}000 + (750 + 1{,}200)\,(P/A,\ 10\%,\ 8) = [[Pa|2]]
    $$

    $$
    LCC_b = 32{,}000 + (450 + 600)\,(P/A,\ 10\%,\ 8) - 4{,}000\,(P/F,\ 10\%,\ 8) = [[Pb|2]]
    $$

    (ج) التكلفة السنوية: [[Aa|2]] للضاغط أ، و[[Ab|2]] للضاغط ب.

    (د) لكل قطعة: [[ua|f4]] للضاغط أ، و[[ub|f4]] للضاغط ب.

    (هـ) الأرخص على مدى العمر: الضاغط [[pick(Pa <= Pb, 'أ', 'ب')]]. سعر الشراء جزء فقط من تكلفة الضاغط. القرار الصحيح بتكلفة دورة الحياة، وليس بالسعر وحده.
