items:

- id: c06-b-01
  kind: problem
  part: B
  text: |
    صنف تكاليف مصنع خياطة إلى ثابتة ومتغيرة: القماش، وإيجار القاعة، وأجر الخياط بالقطعة، وراتب المشرف، والخيوط والأزرار، واستهلاك ماكينات الخياطة بالقسط الثابت، وكهرباء الإنارة، وكهرباء الماكينات.
  solution: |
    | البند | النوع |
    | --- | --- |
    | القماش | متغيرة |
    | إيجار القاعة | ثابتة |
    | أجر الخياط بالقطعة | متغيرة |
    | راتب المشرف | ثابتة |
    | الخيوط والأزرار | متغيرة |
    | الاستهلاك بالقسط الثابت | ثابتة |
    | كهرباء الإنارة | ثابتة تقريبا |
    | كهرباء الماكينات | متغيرة |

    لو كان الخياط براتب شهري، لصار أجره ثابتا. نوع التكلفة يعتمد على طريقة دفعها، وليس على اسمها.

- id: c06-b-02
  kind: problem
  part: B
  vars: {F: 3000, v: 4, Q: 1200}
  random: {F: [1000, 10000, 100], v: [2, 15, 0.5], Q: [200, 5000, 100]}
  calc:
    - C = F + v*Q
  text: |
    تكاليف ثابتة [[F|g]] دينار شهريا، وتكلفة متغيرة [[v|d2]] دينار للوحدة. ما التكلفة الكلية لإنتاج [[Q|g]] وحدة؟
  solution: |
    $$
    C = [[F|g]] + [[v|d2]] \times [[Q|g]] = [[C|2]]
    $$

- id: c06-b-03
  kind: problem
  part: B
  vars: {F: 3000, v: 4, Q: 1200}
  random: {F: [1000, 10000, 100], v: [2, 15, 0.5], Q: [200, 5000, 100]}
  calc:
    - AC = F/Q + v
  text: |
    للمسألة السابقة، ما متوسط تكلفة الوحدة؟
  solution: |
    $$
    AC = \frac{[[F|g]]}{[[Q|g]]} + [[v|d2]] = [[AC|2]]
    $$

- id: c06-b-04
  kind: problem
  part: B
  vars: {F: 6000, v: 5, C: 21000}
  random: {F: [2000, 15000, 500], v: [2, 12, 0.5], C: [10000, 60000, 500]}
  calc:
    - C = max(C, F + v*100)
    - Q = (C - F)/v
  text: |
    مصنع تكاليفه الثابتة [[F|g]] دينار، والمتغيرة [[v|d2]] دينار للوحدة. كانت تكلفته الكلية هذا الشهر [[C|g]] دينار. كم وحدة أنتج؟
  solution: |
    $$
    Q = \frac{C - F}{v} = \frac{[[C|g]] - [[F|g]]}{[[v|d2]]} = [[Q|2]]
    $$

- id: c06-b-05
  kind: problem
  part: B
  vars: {Q1: 1000, C1: 9000, Q2: 1500, C2: 11500}
  random: {Q1: [500, 2000, 100], Q2: [2100, 4000, 100], C1: [5000, 15000, 100]}
  calc:
    - C2 = pick(Q1 != 1000, C1 + (Q2 - Q1)*5, C2)
    - v = (C2 - C1)/(Q2 - Q1)
    - F = C1 - v*Q1
  text: |
    تكلفة إنتاج [[Q1|g]] وحدة [[C1|g]] دينار، وتكلفة إنتاج [[Q2|g]] وحدة [[C2|g]] دينار. ما التكلفة المتغيرة للوحدة؟ وما التكاليف الثابتة؟
  solution: |
    $$
    v = \frac{[[C2|g]] - [[C1|g]]}{[[Q2|g]] - [[Q1|g]]} = [[v|d2]]
    $$

    $$
    F = [[C1|g]] - [[v|d2]] \times [[Q1|g]] = [[F|2]]
    $$

- id: c06-b-06
  kind: problem
  part: B
  vars: {F: 12000, v: 3}
  random: {F: [3000, 30000, 1000], v: [1, 10, 0.5]}
  calc:
    - a1 = F/1000 + v
    - a5 = F/5000 + v
    - a10 = F/10000 + v
  text: |
    تكاليف ثابتة [[F|g]] دينار، ومتغيرة [[v|d2]] دينار للوحدة. احسب متوسط التكلفة عند 1,000 و5,000 و10,000 وحدة.
  solution: |
    | الكمية | متوسط التكلفة |
    | --- | --- |
    | 1,000 | [[a1|2]] |
    | 5,000 | [[a5|2]] |
    | 10,000 | [[a10|2]] |

    المتوسط يقترب من التكلفة المتغيرة [[v|d2]] كلما زادت الكمية.

- id: c06-b-07
  kind: problem
  part: B
  vars: {r: 700, w: 450, s: 1200, m: 2.5, k: 0.4}
  random: {r: [300, 1500, 50], w: [300, 800, 50], s: [800, 2000, 50], m: [1, 5, 0.25], k: [0.1, 1, 0.05]}
  calc:
    - F = r + w + s
    - v = m + k
  text: |
    مطبعة صغيرة: إيجار [[r|g]] دينار، وراتب عامل [[w|g]] دينار، وراتب مصمم [[s|g]] دينار شهريا. ورق وحبر [[m|d2]] دينار لكل كتيب، وتغليف [[k|d2]] دينار لكل كتيب. اكتب معادلة التكلفة الكلية الشهرية.
  solution: |
    $$
    F = [[r|g]] + [[w|g]] + [[s|g]] = [[F|g]], \qquad v = [[m|d2]] + [[k|d2]] = [[v|d2]]
    $$

    $$
    C = [[F|g]] + [[v|d2]]\,Q
    $$

- id: c06-b-08
  kind: problem
  part: B
  vars: {F: 8000, v: 6, Q: 2000, g: 0.25}
  random: {F: [2000, 20000, 500], v: [2, 15, 0.5], Q: [500, 5000, 100], g: [0.10, 0.50, 0.05]}
  calc:
    - C1 = F + v*Q
    - C2 = F + v*Q*(1 + g)
    - inc = C2/C1 - 1
  text: |
    مصنع تكاليفه الثابتة [[F|g]] دينار، والمتغيرة [[v|d2]] دينار، وينتج [[Q|g]] وحدة. إذا زاد الإنتاج [[g|%]]، بأي نسبة تزيد التكلفة الكلية؟ ولماذا أقل من [[g|%]]؟
  solution: |
    $$
    C_1 = [[C1|2]], \qquad C_2 = [[C2|2]]
    $$

    الزيادة [[inc|%2]]. أقل من [[g|%]] لأن الجزء الثابت لا يزيد.

- id: c06-b-09
  kind: problem
  part: B
  vars: {F: 8000, v: 6, Q: 2000}
  random: {F: [2000, 20000, 500], v: [2, 15, 0.5], Q: [500, 5000, 100]}
  calc:
    - sF = F/(F + v*Q)
  text: |
    مصنع تكاليفه الثابتة [[F|g]] دينار، والمتغيرة [[v|d2]] دينار، وينتج [[Q|g]] وحدة. ما نسبة التكاليف الثابتة من التكلفة الكلية؟ ماذا تعني النسبة العالية؟
  solution: |
    $$
    \frac{[[F|g]]}{[[F + v*Q|2]]} = [[sF|%2]]
    $$

    النسبة العالية تعني أن المصنع حساس لحجم الإنتاج: أي انخفاض في المبيعات يرفع تكلفة الوحدة كثيرا، وأي زيادة تخفضها كثيرا.

- id: c06-b-10
  kind: problem
  part: B
  vars: {B: 60000, n: 5, h: 2000}
  random: {B: [20000, 120000, 1000], n: [3, 10, 1], h: [1000, 4000, 100]}
  calc:
    - D = B/n
    - Dh = B/(n*h)
  text: |
    آلة تكلف [[B|g]] دينار وعمرها [[yrs(n)]]. هل استهلاكها تكلفة ثابتة أم متغيرة؟ أجب في حالتين: الاستهلاك بالقسط الثابت، وبوحدات الإنتاج على أساس [[h|g]] ساعة سنويا.
  solution: |
    بالقسط الثابت، [[D|2]] دينار سنويا مهما عملت الآلة، فهو ثابت.

    بوحدات الإنتاج، [[Dh|2]] دينار لكل ساعة، فهو متغير مع الاستخدام.

- id: c06-b-11
  kind: problem
  part: B
  vars: {F: 15000, v: 8, Q: 3000, p: 15}
  random: {F: [5000, 40000, 1000], v: [3, 15, 0.5], Q: [1000, 8000, 100], p: [10, 30, 0.5]}
  calc:
    - p = max(p, v + 2)
    - P = p*Q - F - v*Q
  text: |
    مصنع تكاليفه الثابتة [[F|g]] دينار، والمتغيرة [[v|d2]] دينار، ويبيع [[Q|g]] وحدة بسعر [[p|d2]] دينار. ما ربحه؟
  solution: |
    $$
    P = [[p|d2]] \times [[Q|g]] - [[F|g]] - [[v|d2]] \times [[Q|g]] = [[P|2]]
    $$

- id: c06-b-12
  kind: problem
  part: B
  vars: {F: 15000, v: 8, Q: 3000, p: 15}
  random: {F: [5000, 40000, 1000], v: [3, 15, 0.5], Q: [1000, 8000, 100], p: [10, 30, 0.5]}
  calc:
    - p = max(p, v + 2)
    - P1 = (p - v)*Q - F
    - P2 = (p - v)*Q*1.1 - F
    - g = pick(P1 > 0, (P2 - P1)/max(abs(P1), 0.01), 0)
  text: |
    للمصنع السابق، إذا زادت المبيعات 10%، بكم يزيد الربح؟
  solution: |
    الربح قبل الزيادة [[P1|2]] دينار، وبعدها [[P2|2]] دينار.

    [[pick(P1 > 0, 'الربح يزيد بنسبة أكبر من 10%، لأن التكاليف الثابتة لا تزيد. هذا ما يسمى الرافعة التشغيلية.', 'المصنع خاسر قبل الزيادة، فالنسبة لا معنى لها. لكن الخسارة تقل بمقدار هامش الوحدات الإضافية.')]]
