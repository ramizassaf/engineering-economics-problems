items:

- id: c06-c-01
  kind: problem
  part: C
  vars: {p: 12, v: 7}
  random: {p: [5, 40, 0.5], v: [2, 25, 0.5]}
  calc:
    - p = max(p, v + 1)
    - cm = p - v
    - r = cm/p
  text: |
    سعر الوحدة [[p|d2]] دينار، وتكلفتها المتغيرة [[v|d2]] دينار. ما هامش المساهمة؟ وما نسبته؟
  solution: |
    $$
    CM = [[p|d2]] - [[v|d2]] = [[cm|d2]], \qquad \frac{CM}{p} = [[r|%2]]
    $$

- id: c06-c-02
  kind: problem
  part: C
  vars: {F: 20000, p: 12, v: 7}
  random: {F: [5000, 80000, 1000], p: [5, 40, 0.5], v: [2, 25, 0.5]}
  calc:
    - p = max(p, v + 1)
    - Q = F/(p - v)
  text: |
    تكاليف ثابتة [[F|g]] دينار، وسعر الوحدة [[p|d2]] دينار، وتكلفتها المتغيرة [[v|d2]] دينار. ما نقطة التعادل بالوحدات؟
  solution: |
    $$
    Q^* = \frac{[[F|g]]}{[[p|d2]] - [[v|d2]]} = [[Q|2]]
    $$

    أي [[ceil(Q)|g]] وحدة على الأقل.

- id: c06-c-03
  kind: problem
  part: C
  vars: {F: 20000, p: 12, v: 7}
  random: {F: [5000, 80000, 1000], p: [5, 40, 0.5], v: [2, 25, 0.5]}
  calc:
    - p = max(p, v + 1)
    - S = F/((p - v)/p)
  text: |
    للمسألة السابقة، ما نقطة التعادل بالمبيعات؟
  solution: |
    $$
    S^* = \frac{F}{CM/p} = \frac{[[F|g]]}{[[(p-v)/p|f4]]} = [[S|2]]
    $$

    وهي تساوي نقطة التعادل بالوحدات مضروبة في السعر.

- id: c06-c-04
  kind: problem
  part: C
  vars: {F: 36000, p: 25, v: 13, T: 18000}
  random: {F: [10000, 80000, 1000], p: [15, 50, 1], v: [5, 14, 1], T: [5000, 40000, 1000]}
  calc:
    - Q = (F + T)/(p - v)
  text: |
    ورشة ألمنيوم تكاليفها الثابتة [[F|g]] دينار سنويا، وتبيع الشباك بسعر [[p|g]] دينار، وتكلفته المتغيرة [[v|g]] دينار. كم شباكا تبيع لتربح [[T|g]] دينار؟
  solution: |
    $$
    Q = \frac{[[F|g]] + [[T|g]]}{[[p|g]] - [[v|g]]} = [[Q|2]]
    $$

- id: c06-c-05
  kind: problem
  part: C
  vars: {Q: 1500, p: 20, v: 12}
  random: {Q: [500, 5000, 100], p: [10, 40, 1], v: [4, 9, 1]}
  calc:
    - F = Q*(p - v)
  text: |
    مشروع نقطة تعادله [[Q|g]] وحدة، وسعر الوحدة [[p|g]] دينار، وتكلفتها المتغيرة [[v|g]] دينار. ما تكاليفه الثابتة؟
  solution: |
    $$
    F = Q^*\,(p - v) = [[Q|g]] \times [[p-v|g]] = [[F|g]]
    $$

- id: c06-c-06
  kind: problem
  part: C
  vars: {F: 24000, v: 9, Q: 3000}
  random: {F: [5000, 60000, 1000], v: [3, 20, 0.5], Q: [500, 8000, 100]}
  calc:
    - p = v + F/Q
  text: |
    شركة تكاليفها الثابتة [[F|g]] دينار، والمتغيرة [[v|d2]] دينار للوحدة، وتتوقع بيع [[Q|g]] وحدة. ما أقل سعر يمنع الخسارة؟
  solution: |
    $$
    p = v + \frac{F}{Q} = [[v|d2]] + \frac{[[F|g]]}{[[Q|g]]} = [[p|2]]
    $$

    هذا السعر يساوي متوسط التكلفة عند هذه الكمية.

- id: c06-c-07
  kind: problem
  part: C
  vars: {F: 30000, p: 18, v: 10, Q: 6000}
  random: {F: [10000, 60000, 1000], p: [12, 40, 1], v: [4, 11, 1], Q: [2000, 12000, 250]}
  calc:
    - Qb = F/(p - v)
    - Q = max(Q, ceil(Qb*1.05))
    - m = (Q - Qb)/Q
  text: |
    مصنع يبيع [[Q|g]] وحدة سنويا. تكاليفه الثابتة [[F|g]] دينار، والسعر [[p|g]] والتكلفة المتغيرة [[v|g]] دينار. ما هامش الأمان بالوحدات وبالنسبة؟
  solution: |
    $$
    Q^* = [[Qb|2]], \qquad Q - Q^* = [[Q-Qb|2]]
    $$

    هامش الأمان [[m|%2]] من المبيعات.

- id: c06-c-08
  kind: problem
  part: C
  vars: {F: 30000, p: 18, v: 10, dF: 6000}
  random: {F: [10000, 60000, 1000], p: [12, 40, 1], v: [4, 11, 1], dF: [2000, 20000, 1000]}
  calc:
    - Q1 = F/(p - v)
    - Q2 = (F + dF)/(p - v)
  text: |
    مصنع تكاليفه الثابتة [[F|g]] دينار، والسعر [[p|g]] والتكلفة المتغيرة [[v|g]] دينار. استأجر مستودعا إضافيا بمبلغ [[dF|g]] دينار سنويا. كم وحدة إضافية يجب أن يبيع لتغطية الإيجار؟
  solution: |
    $$
    \frac{[[dF|g]]}{[[p - v|g]]} = [[Q2-Q1|2]]
    $$

    نقطة التعادل ترتفع من [[Q1|2]] إلى [[Q2|2]] وحدة.

- id: c06-c-09
  kind: problem
  part: C
  vars: {F: 30000, p: 18, v: 10, d: 1}
  random: {F: [10000, 60000, 1000], p: [12, 40, 1], v: [4, 10, 1], d: [0.5, 1.5, 0.5]}
  calc:
    - Q1 = F/(p - v)
    - Q2 = F/(p - v - d)
  text: |
    للمصنع السابق، ارتفعت تكلفة المواد [[d|d2]] دينار للوحدة. ماذا يحدث لنقطة التعادل؟
  solution: |
    الهامش يصبح [[p-v-d|d2]] دينار:

    $$
    Q^* = \frac{[[F|g]]}{[[p-v-d|d2]]} = [[Q2|2]]
    $$

    ارتفعت من [[Q1|2]] وحدة.

- id: c06-c-10
  kind: problem
  part: C
  vars: {F: 30000, p: 18, v: 10, Q: 5000}
  random: {F: [10000, 60000, 1000], p: [12, 40, 1], v: [4, 11, 1], Q: [2000, 12000, 250]}
  calc:
    - P = (p - v)*Q - F
  text: |
    المصنع السابق يبيع [[Q|g]] وحدة. ما ربحه أو خسارته؟
  solution: |
    $$
    ([[p|g]] - [[v|g]]) \times [[Q|g]] - [[F|g]] = [[P|2]]
    $$

- id: c06-c-11
  kind: problem
  part: C
  vars: {F: 30000, v: 10, Q: 4000, T: 10000}
  random: {F: [10000, 60000, 1000], v: [4, 15, 0.5], Q: [1000, 10000, 250], T: [2000, 30000, 1000]}
  calc:
    - p = v + (F + T)/Q
  text: |
    شركة تكاليفها الثابتة [[F|g]] دينار، والمتغيرة [[v|d2]] دينار، وتتوقع بيع [[Q|g]] وحدة. ما السعر اللازم لتحقيق ربح [[T|g]] دينار؟
  solution: |
    $$
    p = v + \frac{F + T}{Q} = [[v|d2]] + \frac{[[F|g]] + [[T|g]]}{[[Q|g]]} = [[p|2]]
    $$

- id: c06-c-12
  kind: problem
  part: C
  vars: {pa: 30, va: 18, pb: 50, vb: 35, s: 0.6, F: 36000}
  random: {pa: [20, 40, 1], va: [8, 18, 1], pb: [40, 70, 1], vb: [20, 38, 1], s: [0.3, 0.8, 0.05], F: [10000, 80000, 1000]}
  calc:
    - cm = s*(pa - va) + (1 - s)*(pb - vb)
    - Q = F/cm
    - Qa = s*Q
    - Qb = (1 - s)*Q
  text: |
    محل يبيع منتجين. المنتج أ بسعر [[pa|g]] وتكلفة متغيرة [[va|g]] دينار، والمنتج ب بسعر [[pb|g]] وتكلفة متغيرة [[vb|g]] دينار. [[s|%]] من الوحدات المبيعة من المنتج أ. التكاليف الثابتة [[F|g]] دينار. ما نقطة التعادل؟
  solution: |
    نحسب هامشا متوسطا مرجحا بنسبة المبيعات:

    $$
    \overline{CM} = [[s|r]] \times [[pa-va|g]] + [[1-s|r]] \times [[pb-vb|g]] = [[cm|2]]
    $$

    $$
    Q^* = \frac{[[F|g]]}{[[cm|2]]} = [[Q|2]]
    $$

    منها [[Qa|2]] من المنتج أ، و[[Qb|2]] من المنتج ب. إذا تغيرت نسبة المبيعات تتغير نقطة التعادل.

- id: c06-c-13
  kind: problem
  part: C
  vars: {F: 40000, p: 20, v: 12, d: 0.10, g: 0.25}
  random: {F: [10000, 80000, 1000], p: [12, 40, 1], v: [4, 10, 1], d: [0.05, 0.20, 0.05], g: [0.10, 0.50, 0.05]}
  calc:
    - Q0 = 2*F/(p - v)
    - P0 = (p - v)*Q0 - F
    - p2 = p*(1 - d)
    - P1 = (p2 - v)*Q0*(1 + g) - F
  text: |
    شركة تبيع [[Q0|g]] وحدة بسعر [[p|g]] دينار، وتكلفتها المتغيرة [[v|g]] دينار، والثابتة [[F|g]] دينار. قسم التسويق يتوقع أن خفض السعر [[d|%]] يزيد المبيعات [[g|%]]. هل يستحق التخفيض؟
  solution: |
    الربح الحالي:

    $$
    ([[p|g]] - [[v|g]]) \times [[Q0|g]] - [[F|g]] = [[P0|2]]
    $$

    بعد التخفيض، السعر [[p2|d2]] والكمية [[Q0*(1+g)|g]]:

    $$
    ([[p2|d2]] - [[v|g]]) \times [[Q0*(1+g)|g]] - [[F|g]] = [[P1|2]]
    $$

    التخفيض [[pick(P1 > P0, 'يستحق', 'لا يستحق')]].

- id: c06-c-14
  kind: problem
  part: C
  vars: {F: 18000, p: 3, v: 1.2}
  random: {F: [5000, 40000, 500], p: [1.5, 5, 0.25], v: [0.5, 1.2, 0.1]}
  calc:
    - Qm = F/(p - v)/12
  text: |
    مقهى تكاليفه الثابتة [[F|g]] دينار سنويا. يبيع فنجان القهوة بسعر [[p|d2]] دينار، وتكلفته المتغيرة [[v|d2]] دينار. كم فنجانا يجب أن يبيع في الشهر للتعادل؟ وفي اليوم، إذا عمل 26 يوما في الشهر؟
  solution: |
    في الشهر:

    $$
    \frac{[[F|g]]}{12 \times ([[p|d2]] - [[v|d2]])} = [[Qm|2]]
    $$

    في اليوم حوالي [[ceil(Qm/26)|g]] فنجانا. تحويل نقطة التعادل إلى رقم يومي يجعلها هدفا واضحا للعاملين.

- id: c06-c-15
  kind: problem
  part: C
  vars: {F: 30000, p: 18, v: 10}
  random: {F: [10000, 60000, 1000], p: [12, 40, 1], v: [4, 11, 1]}
  calc:
    - Q = F/(p - v)
    - Qt = F*1.25/(p - v)
  text: |
    مصنع تكاليفه الثابتة [[F|g]] دينار، والسعر [[p|g]] والتكلفة المتغيرة [[v|g]] دينار، ونسبة الضريبة 20%. كم وحدة يجب أن يبيع ليربح بعد الضريبة مبلغا يساوي ربع تكاليفه الثابتة؟
  solution: |
    الربح بعد الضريبة المطلوب [[F/4|g]] دينار. قبل الضريبة يجب أن يكون:

    $$
    \frac{[[F/4|g]]}{1 - 0.20} = [[F/4/0.8|2]]
    $$

    $$
    Q = \frac{[[F|g]] + [[F/4/0.8|2]]}{[[p-v|g]]} = [[(F + F/4/0.8)/(p-v)|2]]
    $$
