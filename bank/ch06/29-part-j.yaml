items:

- id: c06-j-01
  kind: mcq
  part: J
  text: |
    أي التكاليف التالية متغيرة في مصنع عصائر؟
  options: ["إيجار المصنع", "راتب مدير الجودة", "الفواكه المستخدمة", "تأمين المبنى"]
  correct: 2
  solution: |
    الفواكه تزيد مع كل لتر عصير. الباقي لا يتغير مع حجم الإنتاج.

- id: c06-j-02
  kind: mcq
  part: J
  vars: {F: 24000, p: 15, v: 9}
  random: {F: [6000, 60000, 1000], p: [10, 30, 1], v: [3, 9, 1]}
  calc:
    - Q = F/(p - v)
    - w1 = F/p
    - w2 = F/v
    - w3 = (F + v)/p
  text: |
    تكاليف ثابتة [[F|g]] دينار، وسعر [[p|g]] دينار، وتكلفة متغيرة [[v|g]] دينار. ما نقطة التعادل؟
  options: ["[[w1|2]] وحدة", "[[w2|2]] وحدة", "[[Q|2]] وحدة", "[[w3|2]] وحدة"]
  correct: 2
  solution: |
    $$
    Q^* = \frac{[[F|g]]}{[[p|g]] - [[v|g]]} = [[Q|2]]
    $$

    الخيار (أ) نسي التكلفة المتغيرة.

- id: c06-j-03
  kind: mcq
  part: J
  text: |
    مصنع فيه طاقة فائضة. طلبية خاصة سعرها أقل من متوسط التكلفة وأعلى من التكلفة المتغيرة. ماذا يفعل؟
  options: ["يرفض لأنه يخسر", "يقبل لأنها تضيف ربحا", "يرفع السعر إلى متوسط التكلفة", "لا يمكن الحكم"]
  correct: 1
  solution: |
    التكاليف الثابتة تدفع في كل الأحوال. ما دام السعر أعلى من التكلفة المتغيرة، فكل وحدة تضيف ربحا، بشرط ألا تؤثر الطلبية على الأسعار العادية.

- id: c06-j-04
  kind: mcq
  part: J
  text: |
    شركة دفعت 20,000 دينار لدراسة جدوى مشروع. أي العبارات صحيحة عند قرار تنفيذ المشروع؟
  options: ["تضاف إلى تكلفة المشروع", "تطرح من أرباحه", "لا تدخل في القرار", "توزع على سنوات المشروع"]
  correct: 2
  solution: |
    تكلفة الدراسة غارقة، دفعت سواء نفذ المشروع أم لا.

- id: c06-j-05
  kind: mcq
  part: J
  text: |
    مستودع تملكه الشركة ويمكن تأجيره بمبلغ 10,000 دينار سنويا. الشركة تستخدمه لمشروع جديد. ما تكلفة المستودع على المشروع؟
  options: ["صفر لأنه ملك الشركة", "10,000 دينار سنويا", "قيمته الدفترية", "استهلاكه السنوي"]
  correct: 1
  solution: |
    الإيجار الضائع تكلفة فرصة بديلة حقيقية، مع أنها لا تظهر في الدفاتر.

- id: c06-j-06
  kind: mcq
  part: J
  vars: {F1: 10000, v1: 8, F2: 30000, v2: 4}
  random: {F1: [5000, 20000, 1000], v1: [6, 12, 0.5], F2: [25000, 60000, 1000], v2: [2, 5, 0.5]}
  calc:
    - x = (F2 - F1)/(v1 - v2)
    - w1 = (F2 + F1)/(v1 + v2)
    - w2 = F2/v2
    - w3 = (F2 - F1)/v1
  text: |
    طريقة أولى: [[F1|g]] دينار ثابتة و[[v1|d2]] دينار للوحدة. طريقة ثانية: [[F2|g]] دينار و[[v2|d2]] دينار. عند أي كمية تتساويان؟
  options: ["[[w1|2]]", "[[w2|2]]", "[[w3|2]]", "[[x|2]]"]
  correct: 3
  solution: |
    $$
    x = \frac{[[F2|g]] - [[F1|g]]}{[[v1|d2]] - [[v2|d2]]} = [[x|2]]
    $$

- id: c06-j-07
  kind: mcq
  part: J
  text: |
    منتج تقريره يظهر خسارة بعد تحميله نصيبا من التكاليف العامة، لكن مبيعاته تغطي تكاليفه المتغيرة والثابتة الخاصة به. ماذا يحدث لربح الشركة إذا أغلقته؟
  options: ["يزيد", "ينقص", "لا يتغير", "يزيد بمقدار الخسارة في التقرير"]
  correct: 1
  solution: |
    التكاليف العامة تبقى بعد الإغلاق. الشركة تخسر مساهمة المنتج في تغطيتها، فينقص الربح.

- id: c06-j-08
  kind: mcq
  part: J
  text: |
    مورد محدود هو ساعات آلة. كيف ترتب المنتجات؟
  options: ["حسب السعر", "حسب هامش المساهمة للوحدة", "حسب هامش المساهمة لكل ساعة آلة", "حسب الطلب"]
  correct: 2
  solution: |
    عندما يكون المورد محدودا، نقيس ما يعطيه كل منتج لكل وحدة من المورد المحدود.

- id: c06-j-09
  kind: mcq
  part: J
  vars: {F: 12000, p: 20, v: 12, Q: 2000}
  random: {F: [5000, 25000, 1000], p: [15, 30, 1], v: [5, 14, 1], Q: [1000, 5000, 100]}
  calc:
    - Qb = F/(p - v)
    - Q = max(Q, ceil(Qb*1.1))
    - m = (Q - Qb)/Q
    - w1 = (Q - Qb)/Qb
    - w2 = Qb/Q
    - w3 = 1 - (p - v)/p
  text: |
    مصنع يبيع [[Q|g]] وحدة، ونقطة تعادله [[Qb|2]] وحدة. ما هامش الأمان كنسبة من المبيعات؟
  options: ["[[w1|%2]]", "[[m|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    \frac{[[Q|g]] - [[Qb|2]]}{[[Q|g]]} = [[m|%2]]
    $$

    الخيار (أ) قسم على نقطة التعادل بدل المبيعات.

- id: c06-j-10
  kind: mcq
  part: J
  text: |
    مكيف أ أرخص سعرا، ومكيف ب أقل استهلاكا للكهرباء. ارتفعت نسبة الخصم من 6% إلى 12%. ماذا يحدث للمقارنة؟
  options: ["تميل لصالح ب", "تميل لصالح أ", "لا تتغير", "تتساوى التكلفتان"]
  correct: 1
  solution: |
    النسبة الأعلى تقلل القيمة الحالية لتوفير الكهرباء في المستقبل، فتضعف ميزة المكيف ب.
