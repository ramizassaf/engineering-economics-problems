- id: c06-d-01
  kind: problem
  part: D
  vars: {h1: 400, c1: 1300, h2: 900, c2: 2300, vr: 0}
  random: {h1: [200, 600, 25], h2: [700, 1500, 25], c1: [1600, 3000, 50], vr: [0.8, 2.5, 0.1]}
  calc:
    - c2 = pick(vr > 0, c1 + (h2 - h1)*vr, c2)
    - v = (c2 - c1)/(h2 - h1)
    - F = c1 - v*h1
  text: |
    تكلفة صيانة آلات مصنع [[c1|g]] دينار في شهر عملت فيه [[h1|g]] ساعة، و[[c2|g]] دينار في شهر عملت فيه [[h2|g]] ساعة. افصل الجزء الثابت عن المتغير.
  solution: |
    $$
    v = \frac{[[c2|g]] - [[c1|g]]}{[[h2|g]] - [[h1|g]]} = [[v|d2]]
    $$

    $$
    FC = [[c1|g]] - [[v|d2]] \times [[h1|g]] = [[F|2]]
    $$

- id: c06-d-02
  kind: problem
  part: D
  vars: {h1: 400, c1: 1300, h2: 900, c2: 2300, h: 700, vr: 0}
  random: {h1: [200, 600, 25], h2: [700, 1500, 25], c1: [1600, 3000, 50], vr: [0.8, 2.5, 0.1], h: [300, 1400, 25]}
  calc:
    - c2 = pick(vr > 0, c1 + (h2 - h1)*vr, c2)
    - v = (c2 - c1)/(h2 - h1)
    - F = c1 - v*h1
    - C = F + v*h
  text: |
    للمسألة السابقة، ما تكلفة الصيانة المتوقعة في شهر تعمل فيه الآلات [[h|g]] ساعة؟
  solution: |
    $$
    C = [[F|2]] + [[v|d2]] \times [[h|g]] = [[C|2]]
    $$

- id: c06-d-03
  kind: problem
  part: D
  text: |
    بيانات فاتورة الماء لمصنع أغذية في ستة أشهر:

    | الشهر | 1 | 2 | 3 | 4 | 5 | 6 |
    | --- | --- | --- | --- | --- | --- | --- |
    | الإنتاج بالطن | 40 | 55 | 35 | 60 | 50 | 45 |
    | الفاتورة | 1,380 | 1,650 | 1,300 | 1,740 | 1,580 | 1,470 |

    استخدم طريقة الحد الأعلى والأدنى لفصل الجزء الثابت عن المتغير.
  solution: |
    نختار أعلى وأدنى إنتاج، وليس أعلى وأدنى فاتورة: الشهر 4 بستين طنا، والشهر 3 بخمسة وثلاثين طنا.

    $$
    v = \frac{1{,}740 - 1{,}300}{60 - 35} = 17.60
    $$

    $$
    FC = 1{,}300 - 17.60 \times 35 = 684
    $$

    الفاتورة تقريبا 684 دينار ثابتة، و17.60 دينار لكل طن.

- id: c06-d-04
  kind: problem
  part: D
  text: |
    حل المسألة السابقة بالانحدار الخطي في Excel، وقارن بطريقة الحد الأعلى والأدنى.
  solution: |
    ضع الإنتاج في A2 إلى A7 والفاتورة في B2 إلى B7:

    ```excel
    =SLOPE(B2:B7, A2:A7)
    =INTERCEPT(B2:B7, A2:A7)
    ```

    الميل 17.83 دينار للطن، والثابت 673.14 دينار. النتيجة قريبة من طريقة الحد الأعلى والأدنى، أي 17.60 و684، لأن البيانات منتظمة. الانحدار أدق لأنه يستخدم الأشهر الستة كلها.

- id: c06-d-05
  kind: problem
  part: D
  vars: {F: 250, v: 0.12, k: 3000}
  random: {F: [100, 600, 10], v: [0.05, 0.25, 0.01], k: [1000, 8000, 250]}
  calc:
    - C = F + v*k
    - avg = C/k
  text: |
    عقد هاتف لشركة: رسم ثابت [[F|g]] دينار شهريا، و[[v|d2]] دينار لكل دقيقة. ما الفاتورة إذا كانت المكالمات [[k|g]] دقيقة؟ وما متوسط تكلفة الدقيقة؟
  solution: |
    $$
    C = [[F|g]] + [[v|d2]] \times [[k|g]] = [[C|2]]
    $$

    متوسط تكلفة الدقيقة [[avg|f4]] دينار، وهو أعلى من [[v|d2]] بسبب الرسم الثابت.

- id: c06-d-06
  kind: problem
  part: D
  vars: {Fa: 50, va: 0.15, Fb: 200, vb: 0.05}
  random: {Fa: [20, 100, 5], va: [0.10, 0.25, 0.01], Fb: [120, 400, 10], vb: [0.02, 0.08, 0.01]}
  calc:
    - x = (Fb - Fa)/(va - vb)
  text: |
    شركة اتصالات تعرض باقتين: الأولى [[Fa|g]] دينار شهريا و[[va|d2]] دينار للدقيقة، والثانية [[Fb|g]] دينار شهريا و[[vb|d2]] دينار للدقيقة. عند كم دقيقة تتساوى الباقتان؟
  solution: |
    $$
    x = \frac{[[Fb|g]] - [[Fa|g]]}{[[va|d2]] - [[vb|d2]]} = [[x|2]]
    $$

    من يتكلم أكثر من ذلك يختار الباقة الثانية.

- id: c06-d-07
  kind: problem
  part: D
  vars: {S: 1200, k: 0.03}
  random: {S: [600, 2500, 50], k: [0.01, 0.08, 0.005]}
  calc:
    - c1 = S + k*20000
    - c2 = S + k*50000
  text: |
    مندوب مبيعات يأخذ راتبا ثابتا [[S|g]] دينار شهريا، وعمولة [[k|%]] من المبيعات. ما تكلفته إذا باع بمبلغ 20,000 دينار؟ وإذا باع 50,000 دينار؟
  solution: |
    $$
    [[S|g]] + [[k|r]] \times 20{,}000 = [[c1|2]]
    $$

    $$
    [[S|g]] + [[k|r]] \times 50{,}000 = [[c2|2]]
    $$

    هذه تكلفة شبه متغيرة: جزء ثابت وجزء يتغير مع المبيعات.

- id: c06-d-08
  kind: problem
  part: D
  text: |
    لماذا قد تعطي طريقة الحد الأعلى والأدنى نتيجة مضللة؟ أعط مثالا.
  solution: |
    لأنها تعتمد على نقطتين فقط. إذا كان أحد الشهرين غير عادي، مثل شهر فيه عطل كبير أو صيانة استثنائية، فالميل والثابت يتأثران كثيرا. الحل استبعاد الأشهر الشاذة، أو استخدام الانحدار على كل البيانات.
