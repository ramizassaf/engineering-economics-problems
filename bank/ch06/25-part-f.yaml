items:

- id: c06-f-01
  kind: problem
  part: F
  vars: {P: 30000, S: 8000, R: 12000, O: 7000}
  random: {P: [10000, 60000, 1000], S: [2000, 20000, 500], R: [5000, 25000, 500], O: [2000, 15000, 500]}
  calc:
    - S = min(S, P - 2000)
    - keep = R - O
  text: |
    شركة اشترت شاحنة قبل 3 سنوات بمبلغ [[P|g]] دينار. يمكن بيعها اليوم بمبلغ [[S|g]] دينار، أو تشغيلها سنة أخيرة بإيراد [[R|g]] دينار وتكلفة [[O|g]] دينار، ثم لا تساوي شيئا. تجاهل الفائدة. أيهما أفضل؟ وما دور الـ [[P|g]] دينار في القرار؟
  solution: |
    البيع يعطي [[S|g]] دينار، والتشغيل يعطي [[keep|g]] دينار. الأفضل [[pick(S >= keep, 'البيع', 'التشغيل')]].

    الـ [[P|g]] دينار تكلفة غارقة، ولا دور لها في القرار.

- id: c06-f-02
  kind: problem
  part: F
  text: |
    طالب دفع 400 دينار رسوم دورة تدريبية لا يمكن استردادها. في يوم الدورة الأخير عرض عليه عمل ليوم واحد بأجر 60 دينارا. يقول: لا أستطيع أن أفوت الدورة، دفعت فيها 400 دينار. ما الخطأ في تفكيره؟
  solution: |
    الـ 400 دينار غارقة، ستضيع سواء حضر أم لا. القرار يجب أن يقارن قيمة ما سيتعلمه في اليوم الأخير بالأجر 60 دينارا، وليس بالرسوم المدفوعة.

- id: c06-f-03
  kind: problem
  part: F
  vars: {rent: 900, R: 18000, O: 9000}
  random: {rent: [300, 2000, 50], R: [8000, 40000, 1000], O: [3000, 20000, 1000]}
  calc:
    - net = R - O - 12*rent
  text: |
    مهندس يملك محلا يمكن تأجيره بمبلغ [[rent|g]] دينار شهريا. يفكر في فتح ورشة صيانة فيه، بإيراد [[R|g]] دينار سنويا وتكاليف [[O|g]] دينار. هل الورشة أفضل من التأجير؟
  solution: |
    الإيجار الضائع تكلفة فرصة بديلة:

    $$
    [[R|g]] - [[O|g]] - 12 \times [[rent|g]] = [[net|g]]
    $$

    [[pick(net > 0, 'الورشة أفضل.', 'التأجير أفضل.')]]

- id: c06-f-04
  kind: problem
  part: F
  vars: {sal: 1200, inc: 18000, cost: 6000}
  random: {sal: [600, 2500, 50], inc: [8000, 40000, 1000], cost: [2000, 15000, 500]}
  calc:
    - net = inc - cost - 12*sal
  text: |
    مهندسة تعمل براتب [[sal|g]] دينار شهريا. تفكر في الاستقالة لفتح مكتب استشارات يتوقع أن يعطي [[inc|g]] دينار سنويا، بتكاليف [[cost|g]] دينار. ما الربح الاقتصادي للمكتب؟
  solution: |
    الراتب الذي تتركه تكلفة فرصة بديلة:

    $$
    [[inc|g]] - [[cost|g]] - 12 \times [[sal|g]] = [[net|g]]
    $$

    [[pick(net > 0, 'المكتب يعطي أكثر من الوظيفة.', 'المكتب يعطي أقل من الوظيفة، مع أن ربحه المحاسبي موجب.')]]

- id: c06-f-05
  kind: problem
  part: F
  vars: {K: 50000, i: 0.06, R: 6000}
  random: {K: [10000, 100000, 1000], i: [0.03, 0.10, 0.005], R: [1000, 12000, 250]}
  calc:
    - opp = K*i
    - net = R - opp
  text: |
    شركة تستخدم [[K|g]] دينار من مدخراتها لشراء مخزون إضافي، يزيد ربحها [[R|g]] دينار سنويا. البنك يعطي [[i|%]] على الودائع. هل القرار مربح؟
  solution: |
    المال المستخدم كان سيعطي فائدة:

    $$
    [[K|g]] \times [[i|r]] = [[opp|2]]
    $$

    الربح الاقتصادي:

    $$
    [[R|g]] - [[opp|2]] = [[net|2]]
    $$

    هذه فكرة الحد الأدنى للعائد في الفصول السابقة: المال له تكلفة فرصة بديلة.

- id: c06-f-06
  kind: problem
  part: F
  text: |
    صنف كلا مما يلي في قرار استبدال آلة قديمة: (أ) ثمن الآلة القديمة عند شرائها، (ب) ثمن بيعها اليوم، (ج) قيمتها الدفترية، (د) تكلفة تشغيلها في المستقبل، (هـ) ثمن الآلة الجديدة.
  solution: |
    | البند | هل يدخل القرار؟ |
    | --- | --- |
    | ثمن الشراء القديم | لا، تكلفة غارقة |
    | ثمن البيع اليوم | نعم، هو تكلفة فرصة الاحتفاظ بالآلة |
    | القيمة الدفترية | لا، إلا عبر أثرها على الضريبة |
    | تكلفة التشغيل المستقبلية | نعم |
    | ثمن الآلة الجديدة | نعم |

- id: c06-f-07
  kind: problem
  part: F
  vars: {m: 2000, used: 400, pb: 3, ps: 1.2}
  random: {m: [500, 5000, 100], used: [100, 1000, 50], pb: [2, 6, 0.25], ps: [0.5, 2, 0.1]}
  calc:
    - used = min(used, m)
    - c = used*ps
  text: |
    مصنع يملك [[m|g]] كيلوغرام من مادة اشتراها قبل سنة بسعر [[pb|d2]] دينار للكيلو، ولم يعد يستخدمها. يمكن بيعها اليوم بسعر [[ps|d2]] دينار للكيلو. طلبية خاصة تحتاج [[used|g]] كيلو منها. ما تكلفة المادة في حساب الطلبية؟
  solution: |
    سعر الشراء القديم غارق. التكلفة الحقيقية هي ما نتنازل عنه، أي ثمن البيع:

    $$
    [[used|g]] \times [[ps|d2]] = [[c|2]]
    $$

- id: c06-f-08
  kind: problem
  part: F
  vars: {h: 200, w: 15, alt: 25}
  random: {h: [50, 500, 10], w: [8, 25, 1], alt: [15, 40, 1]}
  calc:
    - c1 = h*w
    - c2 = h*alt
  text: |
    مشروع داخلي يحتاج [[h|g]] ساعة من وقت فني أجره [[w|g]] دينار للساعة. الفني مشغول بالكامل، وكل ساعة يأخذها المشروع منه تعني ساعة لا يعمل فيها على طلبيات تحقق ربحا [[alt|g]] دينار للساعة. ما تكلفة وقته على المشروع؟
  solution: |
    الأجر وحده [[c1|g]] دينار، لكنه يدفع في كل الأحوال. التكلفة الحقيقية هي الربح الضائع:

    $$
    [[h|g]] \times [[alt|g]] = [[c2|g]]
    $$

    لو كان الفني غير مشغول، لكانت تكلفة وقته على المشروع صفرا تقريبا.

- id: c06-f-09
  kind: problem
  part: F
  vars: {spent: 80000, more: 40000, V: 100000, V2: 0}
  random: {spent: [30000, 150000, 5000], more: [10000, 80000, 5000], V: [30000, 150000, 5000]}
  calc:
    - g = V - more
  text: |
    شركة صرفت [[spent|g]] دينار على تطوير منتج. إكماله يحتاج [[more|g]] دينار أخرى، والقيمة الحالية لأرباحه المتوقعة [[V|g]] دينار. هل تكمل؟
  solution: |
    المبلغ المصروف غارق. القرار يقارن ما بقي:

    $$
    [[V|g]] - [[more|g]] = [[g|g]]
    $$

    [[pick(g > 0, 'تكمل، لأن الإكمال يضيف قيمة.', 'تتوقف، لأن الإكمال لا يغطي تكلفته، مهما كان المصروف سابقا.')]]

- id: c06-f-10
  kind: problem
  part: F
  text: |
    مدير يرفض بيع آلة قديمة بمبلغ 5,000 دينار لأن قيمتها الدفترية 12,000 دينار، ويقول إن البيع يسجل خسارة. ما رأيك؟
  solution: |
    القيمة الدفترية رقم محاسبي، والخسارة المسجلة لا تغير النقد. ما يهم هو مقارنة 5,000 دينار اليوم بما تعطيه الآلة إذا بقيت. الأثر النقدي الوحيد للقيمة الدفترية هو الضريبة: الخسارة الدفترية تخفض الضريبة، فتجعل البيع أفضل قليلا، كما في الفصل الخامس.

- id: c06-f-11
  kind: problem
  part: F
  vars: {A: 30000, v: 12, p: 20, q: 2500}
  random: {A: [10000, 60000, 1000], v: [5, 15, 1], p: [16, 30, 1], q: [1000, 5000, 100]}
  calc:
    - lost = (p - v)*q
  text: |
    خط إنتاج يعمل بطاقته الكاملة. مدير قسم آخر يريد استخدام الخط شهرا لاختبار منتج جديد. في هذا الشهر كان الخط سينتج [[q|g]] وحدة تباع بسعر [[p|g]] دينار، وتكلفتها المتغيرة [[v|g]] دينار. ما تكلفة الفرصة البديلة للاختبار؟
  solution: |
    هامش الوحدات الضائعة:

    $$
    ([[p|g]] - [[v|g]]) \times [[q|g]] = [[lost|g]]
    $$

- id: c06-f-12
  kind: problem
  part: F
  text: |
    اذكر مثالين من حياتك اليومية على التكلفة الغارقة، ومثالين على تكلفة الفرصة البديلة.
  solution: |
    أمثلة على الغارقة: تذكرة سينما مدفوعة لفيلم تبين أنه سيء، وكتاب اشتريته ولم تعد تحتاجه. أمثلة على الفرصة البديلة: وقت المذاكرة الذي كان يمكن أن تعمل فيه بأجر، وغرفة فارغة في البيت كان يمكن تأجيرها.
