items:

- id: c06-h-01
  kind: problem
  part: H
  vars: {Ca: 300, Ea: 45, Cb: 900, Eb: 12, n: 10, i: 0.08}
  random: {Ca: [150, 500, 10], Ea: [25, 80, 1], Cb: [500, 1500, 25], Eb: [5, 25, 1], n: [5, 15, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - Pa = Ca + Ea*PA(i, n)
    - Pb = Cb + Eb*PA(i, n)
  text: |
    مضخة مياه منزلية عادية تكلف [[Ca|g]] دينار وكهرباؤها [[Ea|g]] دينار سنويا. مضخة بمحرك عالي الكفاءة تكلف [[Cb|g]] دينار وكهرباؤها [[Eb|g]] دينار سنويا. العمر [[yrs(n)]]. أيهما أرخص بنسبة [[i|%]]؟
  solution: |
    $$
    LCC_a = [[Ca|g]] + [[Ea|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pa|2]]
    $$

    $$
    LCC_b = [[Cb|g]] + [[Eb|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pb|2]]
    $$

    الأرخص: [[pick(Pa <= Pb, 'العادية', 'عالية الكفاءة')]].

- id: c06-h-02
  kind: problem
  part: H
  vars: {Ci: 2, Ei: 9, Li: 1, Cl: 8, El: 1.5, Ll: 15, i: 0.08}
  random: {Ci: [1, 3, 0.25], Ei: [6, 12, 0.5], Cl: [5, 15, 0.5], El: [1, 3, 0.25], i: [0.04, 0.12, 0.01]}
  calc:
    - Pi = (Ci + Ei)*(1 + PF(i, 1) + PF(i, 2) + PF(i, 3) + PF(i, 4) + PF(i, 5) + PF(i, 6) + PF(i, 7) + PF(i, 8) + PF(i, 9) + PF(i, 10) + PF(i, 11) + PF(i, 12) + PF(i, 13) + PF(i, 14))
    - Pl = Cl + El*PA(i, 15)
  text: |
    مصباح عادي سعره [[Ci|d2]] دينار ويعيش سنة واحدة، وكهرباؤه [[Ei|d2]] دينار سنويا. مصباح LED سعره [[Cl|d2]] دينار ويعيش 15 سنة، وكهرباؤه [[El|d2]] دينار سنويا. قارن تكلفة 15 سنة بنسبة [[i|%]]. افترض أن المصباح العادي يشترى في بداية كل سنة، وأن الكهرباء تدفع في بداية السنة أيضا للتبسيط، وكهرباء LED في نهايتها.
  solution: |
    المصباح العادي: سعر وكهرباء في بداية كل سنة من السنة 0 إلى السنة 14:

    $$
    LCC_{inc} = [[Ci+Ei|d2]] \times \sum_{t=0}^{14}(P/F,\ [[i|%]],\ t) = [[Pi|2]]
    $$

    $$
    LCC_{LED} = [[Cl|d2]] + [[El|d2]]\,(P/A,\ [[i|%]],\ 15) = [[Pl|2]]
    $$

    الفرق كبير لصالح [[pick(Pl <= Pi, 'LED', 'المصباح العادي')]]، مع أن سعره أعلى بكثير.

- id: c06-h-03
  kind: problem
  part: H
  vars: {C: 80000, O: 12000, n: 10, i: 0.10, U: 40000}
  random: {C: [30000, 150000, 5000], O: [4000, 25000, 1000], n: [5, 15, 1], i: [0.06, 0.14, 0.01], U: [10000, 80000, 5000]}
  calc:
    - AW = C*AP(i, n) + O
    - u = AW/U
  text: |
    آلة تكلف [[C|g]] دينار، وتشغيلها [[O|g]] دينار سنويا، وعمرها [[yrs(n)]]، وتنتج [[U|g]] وحدة سنويا. ما تكلفة الوحدة على مدى العمر بنسبة [[i|%]]؟
  solution: |
    $$
    AW = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[O|g]] = [[AW|2]]
    $$

    $$
    \frac{[[AW|2]]}{[[U|g]]} = [[u|f4]]
    $$

- id: c06-h-04
  kind: problem
  part: H
  vars: {C: 80000, O: 12000, n: 10, i: 0.10, pb: 2.5}
  random: {C: [30000, 150000, 5000], O: [4000, 25000, 1000], n: [5, 15, 1], i: [0.06, 0.14, 0.01], pb: [1, 6, 0.1]}
  calc:
    - AW = C*AP(i, n) + O
    - x = AW/pb
  text: |
    للآلة السابقة: شركة خارجية تعرض إنتاج الوحدة بسعر [[pb|d2]] دينار. عند أي كمية سنوية يتساوى شراء الآلة مع التعاقد الخارجي؟
  solution: |
    $$
    Q = \frac{AW}{p} = \frac{[[AW|2]]}{[[pb|d2]]} = [[x|2]]
    $$

    هذا تحليل تعادل يدمج قيمة المال مع الزمن. فوق هذه الكمية شراء الآلة أرخص.

- id: c06-h-05
  kind: problem
  part: H
  vars: {Cd: 140000, Fd: 0.35, Ce: 220000, Fe: 0.14, M: 4000, km: 55000, i: 0.08}
  random: {Cd: [100000, 180000, 5000], Fd: [0.25, 0.45, 0.01], Ce: [180000, 300000, 5000], Fe: [0.08, 0.20, 0.01], km: [30000, 90000, 5000], i: [0.05, 0.12, 0.01]}
  calc:
    - Pd = Cd + Fd*km*PA(i, 10)
    - Pe = Ce + (Fe*km + M)*PA(i, 10)
  text: |
    حافلة ديزل تكلف [[Cd|g]] دينار وتكلفة طاقتها [[Fd|d2]] دينار للكيلومتر. حافلة كهربائية تكلف [[Ce|g]] دينار وتكلفة طاقتها [[Fe|d2]] دينار للكيلومتر، وتحتاج صيانة بطارية [[M|g]] دينار سنويا. الحافلة تقطع [[km|g]] كيلومتر سنويا لمدة 10 سنوات. قارن تكلفة دورة الحياة بنسبة [[i|%]].
  solution: |
    $$
    LCC_d = [[Cd|g]] + [[Fd|d2]] \times [[km|g]]\,(P/A,\ [[i|%]],\ 10) = [[Pd|2]]
    $$

    $$
    LCC_e = [[Ce|g]] + ([[Fe|d2]] \times [[km|g]] + [[M|g]])\,(P/A,\ [[i|%]],\ 10) = [[Pe|2]]
    $$

    الأرخص: [[pick(Pd <= Pe, 'الديزل', 'الكهربائية')]].

- id: c06-h-06
  kind: problem
  part: H
  vars: {Cd: 140000, Fd: 0.35, Ce: 220000, Fe: 0.14, M: 4000, i: 0.08}
  random: {Cd: [100000, 180000, 5000], Fd: [0.25, 0.45, 0.01], Ce: [180000, 300000, 5000], Fe: [0.08, 0.20, 0.01], i: [0.05, 0.12, 0.01]}
  calc:
    - x = ((Ce - Cd)*AP(i, 10) + M)/(Fd - Fe)
  text: |
    للحافلتين السابقتين: عند أي مسافة سنوية تتساوى التكلفتان؟
  solution: |
    نحول فرق السعر إلى مبلغ سنوي، ونقسم على فرق تكلفة الكيلومتر:

    $$
    x = \frac{[[Ce-Cd|g]]\,(A/P,\ [[i|%]],\ 10) + [[M|g]]}{[[Fd|d2]] - [[Fe|d2]]} = [[x|0]]
    $$

- id: c06-h-07
  kind: problem
  part: H
  vars: {C: 25000, O1: 1500, G: 400, n: 8, i: 0.10}
  random: {C: [10000, 50000, 1000], O1: [500, 4000, 100], G: [100, 1000, 50], n: [5, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - P = C + O1*PA(i, n) + G*PG(i, n)
  text: |
    رافعة شوكية تكلف [[C|g]] دينار، وصيانتها [[O1|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة، لمدة [[yrs(n)]]. ما تكلفة دورة الحياة بنسبة [[i|%]]؟
  solution: |
    $$
    LCC = [[C|g]] + [[O1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c06-h-08
  kind: problem
  part: H
  text: |
    اذكر خمسة بنود تدخل في تكلفة دورة الحياة لنظام تكييف مبنى، غير سعر الشراء.
  solution: |
    التركيب، والكهرباء طوال العمر، والصيانة الدورية وقطع الغيار، وتدريب الفنيين، والتخلص من النظام في نهاية عمره. ويضاف أحيانا أثر الأعطال على العمل.
