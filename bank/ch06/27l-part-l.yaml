items:

- id: c06-l-01
  kind: problem
  part: L
  vars: {C: 9500, Ik: 210, In: 252}
  random: {C: [2000, 40000, 500], Ik: [150, 260, 1], In: [180, 320, 1]}
  calc:
    - In = max(In, Ik + 5)
    - Cn = C*In/Ik
  text: |
    غلاية كلفت [[C|g]] دينار عندما كان مؤشر المعدات [[Ik|g]]. المؤشر اليوم [[In|g]]. ما تكلفتها اليوم؟
  solution: |
    $$
    [[C|g]] \times \frac{[[In|g]]}{[[Ik|g]]} = [[Cn|2]]
    $$

- id: c06-l-02
  kind: problem
  part: L
  vars: {Cn: 46000, Ik: 135, In: 180}
  random: {Cn: [10000, 90000, 1000], Ik: [100, 160, 1], In: [170, 240, 1]}
  calc:
    - Ck = Cn*Ik/In
  text: |
    ضاغط يكلف اليوم [[Cn|g]] دينار، ومؤشر المعدات [[In|g]]. كم كان يكلف عندما كان المؤشر [[Ik|g]]؟
  solution: |
    نفس المعادلة، محلولة للتكلفة القديمة:

    $$
    C_k = C_n \times \frac{I_k}{I_n} = [[Cn|g]] \times \frac{[[Ik|g]]}{[[In|g]]} = [[Ck|2]]
    $$

- id: c06-l-03
  kind: problem
  part: L
  vars: {C: 250000, wm: 0.6, m0: 120, m1: 150, l0: 110, l1: 125}
  random: {C: [50000, 600000, 10000], wm: [0.3, 0.8, 0.05], m0: [100, 140, 1], m1: [110, 200, 1], l0: [100, 140, 1], l1: [105, 180, 1]}
  calc:
    - m1 = max(m1, m0 + 2)
    - l1 = max(l1, l0 + 2)
    - f = wm*m1/m0 + (1 - wm)*l1/l0
    - Cn = C*f
  text: |
    مبنى ورشة كلف [[C|g]] دينار قبل 4 سنوات. المواد كانت [[wm|%]] من التكلفة، والعمالة الباقي. مؤشر المواد ارتفع من [[m0|g]] إلى [[m1|g]]، ومؤشر أجور البناء من [[l0|g]] إلى [[l1|g]]. قدر تكلفة نفس المبنى اليوم.
  solution: |
    كل جزء يرتفع بمؤشره:

    $$
    [[wm|f4]] \times \frac{[[m1|g]]}{[[m0|g]]} + [[1-wm|f4]] \times \frac{[[l1|g]]}{[[l0|g]]} = [[f|f4]]
    $$

    $$
    [[C|g]] \times [[f|f4]] = [[Cn|2]]
    $$

    مؤشر واحد للمبنى كله يخطئ إذا ارتفعت المواد والأجور بنسب مختلفة.

- id: c06-l-04
  kind: problem
  part: L
  vars: {A: 160, u: 280, f: 0.15}
  random: {A: [80, 400, 10], u: [180, 450, 10], f: [0.05, 0.30, 0.01]}
  calc:
    - C = A*u*(1 + f)
  text: |
    بيت مساحته [[A|g]] مترا مربعا. تكلفة الهيكل [[u|g]] دينار للمتر المربع، والتشطيب يضيف [[f|%]]. ما التكلفة المقدرة؟
  solution: |
    $$
    [[A|g]] \times [[u|g]] \times (1 + [[f|%]]) = [[C|2]]
    $$

- id: c06-l-05
  kind: problem
  part: L
  vars: {L: 12, k: 85000, b: 3, kb: 140000}
  random: {L: [3, 40, 1], k: [50000, 150000, 5000], b: [1, 8, 1], kb: [80000, 250000, 10000]}
  calc:
    - C = L*k + b*kb
  text: |
    طريق زراعي طوله [[L|g]] كيلومتر، تكلفة الكيلومتر في طرق مشابهة [[k|g]] دينار. على الطريق [[b|g]] عبارات مياه، تكلفة العبارة [[kb|g]] دينار. ما التكلفة المقدرة؟
  solution: |
    $$
    [[L|g]] \times [[k|g]] + [[b|g]] \times [[kb|g]] = [[C|g]]
    $$

- id: c06-l-06
  kind: problem
  part: L
  vars: {E: 250000, f1: 0.35, f2: 0.30, f3: 0.15}
  random: {E: [50000, 800000, 10000], f1: [0.20, 0.50, 0.05], f2: [0.10, 0.40, 0.05], f3: [0.05, 0.25, 0.05]}
  calc:
    - C = E*(1 + f1 + f2 + f3)
  text: |
    معدات وحدة معالجة مياه تكلف [[E|g]] دينار. التركيب [[f1|%]] من ثمنها، والأنابيب والصمامات [[f2|%]]، والكهرباء والتحكم [[f3|%]]. ما التكلفة المقدرة؟
  solution: |
    $$
    [[E|g]] \times (1 + [[f1|g]] + [[f2|g]] + [[f3|g]]) = [[C|g]]
    $$

- id: c06-l-07
  kind: problem
  part: L
  vars: {E: 600000, F: 2.8, h: 0.12, k: 0.10}
  random: {E: [100000, 1500000, 50000], F: [2.0, 4.5, 0.1], h: [0.08, 0.20, 0.01], k: [0.05, 0.15, 0.01]}
  calc:
    - C1 = E*F
    - C2 = C1*(1 + h)
    - C = C2*(1 + k)
  text: |
    مصنع كيماويات صغير. ثمن معداته الرئيسية [[E|g]] دينار، ومعامل لانغ لهذا النوع [[F|g]]، أي أن المصنع المركب يكلف [[F|g]] ضعف ثمن معداته. أضف [[h|%]] للهندسة والإشراف، ثم [[k|%]] احتياطا للطوارئ. ما التقدير؟
  solution: |
    $$
    [[E|g]] \times [[F|g]] = [[C1|g]]
    $$

    $$
    [[C1|g]] \times (1 + [[h|%]]) = [[C2|2]]
    $$

    $$
    [[C2|2]] \times (1 + [[k|%]]) = [[C|2]]
    $$

    الاحتياط للطوارئ ليس هامش ربح. هو اعتراف بأن التقدير المبكر ناقص، وأن بنودا ستظهر لاحقا.

- id: c06-l-08
  kind: problem
  part: L
  vars: {C: 30000, S1: 200, S2: 350, X: 0.7}
  random: {C: [10000, 80000, 1000], S1: [50, 300, 10], S2: [100, 600, 10], X: [0.5, 0.8, 0.05]}
  calc:
    - S2 = pick(S2 == S1, S1 + 100, S2)
    - C2 = C*(S2/S1)**X
  text: |
    ضاغط هواء قدرته [[S1|g]] كيلوواط يكلف [[C|g]] دينار. قدر تكلفة ضاغط قدرته [[S2|g]] كيلوواط، بأس [[X|g]].
  solution: |
    $$
    [[C|g]] \times \left(\frac{[[S2|g]]}{[[S1|g]]}\right)^{[[X|g]]} = [[C2|2]]
    $$

- id: c06-l-09
  kind: problem
  part: L
  vars: {C: 12000, S1: 50, S2: 80, Ik: 118, In: 136}
  random: {C: [5000, 40000, 1000], S1: [20, 100, 5], S2: [30, 200, 5], Ik: [100, 150, 1], In: [110, 200, 1]}
  calc:
    - S2 = pick(S2 == S1, S1 + 30, S2)
    - In = max(In, Ik + 3)
    - r = (S2/S1)**0.6
    - C2 = C*r*In/Ik
  text: |
    خزان سعته [[S1|g]] مترا مكعبا كلف [[C|g]] دينار قبل 3 سنوات، عندما كان المؤشر [[Ik|g]]. المؤشر اليوم [[In|g]]. قدر تكلفة خزان سعته [[S2|g]] مترا مكعبا اليوم، بقاعدة الستة أعشار.
  solution: |
    $$
    \left(\frac{[[S2|g]]}{[[S1|g]]}\right)^{0.6} = [[r|f4]]
    $$

    $$
    [[C|g]] \times [[r|f4]] \times \frac{[[In|g]]}{[[Ik|g]]} = [[C2|2]]
    $$

- id: c06-l-10
  kind: problem
  part: L
  vars: {S1: 40000, C1: 2500000, S2: 100000, C2: 4400000}
  random: {S1: [20000, 60000, 5000], C1: [1000000, 4000000, 100000], S2: [70000, 200000, 10000], C2: [1000000, 9000000, 100000]}
  calc:
    - X0 = 0.55 + 0.25*(C1/4000000)
    - C2 = floor(C1*(S2/S1)**X0/100000 + 0.5)*100000
    - X = ln(C2/C1)/ln(S2/S1)
  text: |
    مصنعان من نفس النوع بنيا في نفس السنة: الأول طاقته [[S1|g]] طن وكلف [[C1|g]] دينار، والثاني طاقته [[S2|g]] طن وكلف [[C2|g]] دينار. ما أس الحجم لهذا النوع؟
  solution: |
    من قاعدة الحجم والقوة:

    $$
    \frac{C_2}{C_1} = \left(\frac{Q_2}{Q_1}\right)^X
    $$

    نأخذ اللوغاريتم للطرفين:

    $$
    X = \frac{\ln (C_2 / C_1)}{\ln (Q_2 / Q_1)} = \frac{\ln [[C2/C1|f4]]}{\ln [[S2/S1|f4]]} = [[X|f4]]
    $$

    تأكد أن المصنعين بنيا في نفس السنة، أو عدل التكلفة بالرقم القياسي أولا. وإلا خلطت أثر الحجم بأثر الأسعار.

- id: c06-l-11
  kind: problem
  part: L
  vars: {K: 50, s: 0.90}
  random: {K: [20, 200, 5], s: [0.75, 0.95, 0.01]}
  calc:
    - Z4 = K*s**2
    - Z16 = K*s**4
  text: |
    أول وحدة تأخذ [[K|g]] ساعة، ومنحنى التعلم [[s|%]]. ما زمن الوحدة الرابعة؟ وما زمن الوحدة السادسة عشرة؟
  solution: |
    الرابعة بعد مضاعفتين، والسادسة عشرة بعد أربع:

    $$
    Z_4 = [[K|g]] \times [[s|g]]^2 = [[Z4|2]]
    $$

    $$
    Z_{16} = [[K|g]] \times [[s|g]]^4 = [[Z16|2]]
    $$

- id: c06-l-12
  kind: problem
  part: L
  vars: {K: 50, s: 0.90}
  random: {K: [20, 200, 5], s: [0.75, 0.95, 0.01]}
  calc:
    - b = ln(s)/ln(2)
    - Z1 = K
    - Z2 = K*s
    - Z3 = K*3**b
    - Z4 = K*s**2
    - T = Z1 + Z2 + Z3 + Z4
  text: |
    أول وحدة تأخذ [[K|g]] ساعة، ومنحنى التعلم [[s|%]]. ما مجموع ساعات أول أربع وحدات؟
  solution: |
    الوحدة الثانية والرابعة مضاعفات، والثالثة تحتاج المعادلة:

    $$
    b = \frac{\log [[s|g]]}{\log 2} = [[b|f4]]
    $$

    $$
    Z_3 = [[K|g]] \times 3^{[[b|f4]]} = [[Z3|2]]
    $$

    | الوحدة | الزمن |
    | --- | --- |
    | 1 | [[Z1|2]] |
    | 2 | [[Z2|2]] |
    | 3 | [[Z3|2]] |
    | 4 | [[Z4|2]] |

    $$
    [[Z1|2]] + [[Z2|2]] + [[Z3|2]] + [[Z4|2]] = [[T|2]]
    $$

- id: c06-l-13
  kind: problem
  part: L
  vars: {K: 100, Z8: 64}
  random: {K: [40, 200, 5], Z8: [20, 190, 1]}
  calc:
    - Z8 = min(max(Z8, floor(K*0.42)), floor(K*0.86))
    - s = exp(ln(Z8/K)/3)
  text: |
    الوحدة الأولى أخذت [[K|g]] ساعة، والوحدة الثامنة [[Z8|g]] ساعة. ما نسبة منحنى التعلم؟
  solution: |
    الثامنة بعد ثلاث مضاعفات:

    $$
    [[K|g]]\,s^3 = [[Z8|g]]
    $$

    $$
    s = \left(\frac{[[Z8|g]]}{[[K|g]]}\right)^{1/3} = [[s|f4]]
    $$

    أي منحنى تعلم [[s|%]] تقريبا.

- id: c06-l-14
  kind: problem
  part: L
  vars: {K: 300, s: 0.80, w: 12, n: 8}
  random: {K: [100, 600, 10], s: [0.75, 0.92, 0.01], w: [6, 25, 1], n: [4, 8, 4]}
  calc:
    - b = ln(s)/ln(2)
    - T = K*(1 + 2**b + 3**b + 4**b) + pick(n == 8, K*(5**b + 6**b + 7**b + 8**b), 0)
    - Zn = K*n**b
    - P1 = T*w
    - P2 = n*Zn*w
  text: |
    ورشة تقدم عرضا لتصنيع [[n|n]] هياكل معدنية. الهيكل الأول يحتاج [[K|g]] ساعة عمل، ومنحنى التعلم [[s|%]]، وأجر الساعة [[w|g]] دينار. موظف يقترح تسعير العمالة بزمن الوحدة الأخيرة ضرب عدد الوحدات. ما تكلفة العمالة الصحيحة؟ وكم يخطئ اقتراحه؟
  solution: |
    زمن الوحدة الأخيرة:

    $$
    Z_{[[n|n]]} = [[K|g]] \times [[n|n]]^{\log [[s|g]] / \log 2} = [[Zn|2]]
    $$

    مجموع الساعات بجمع الوحدات واحدة واحدة:

    ```excel
    =SUMPRODUCT([[K|r]]*ROW(1:[[n|n]])^(LOG([[s|r]])/LOG(2)))
    ```

    المجموع [[T|2]] ساعة. تكلفة العمالة:

    $$
    [[T|2]] \times [[w|g]] = [[P1|2]]
    $$

    اقتراح الموظف:

    $$
    [[n|n]] \times [[Zn|2]] \times [[w|g]] = [[P2|2]]
    $$

    الاقتراح أقل من الصحيح بـ [[P1-P2|2]] دينار، لأن الوحدات الأولى أبطأ بكثير من الأخيرة.

- id: c06-l-15
  kind: problem
  part: L
  vars: {a: 5200, b: 47.1, x: 720}
  random: {a: [2000, 10000, 100], b: [20, 80, 0.1], x: [200, 1000, 10]}
  calc:
    - C = a + b*x
  text: |
    شركة حللت تكاليف آلاتها السابقة، فوجدت أن التكلفة تساوي [[a|g]] دينار زائد [[b|g]] دينار لكل كيلوغرام من الوزن. بياناتها لآلات من 200 إلى 1,000 كغ. قدر تكلفة آلة وزنها [[x|g]] كغ.
  solution: |
    $$
    C = [[a|g]] + [[b|g]] \times [[x|g]] = [[C|2]]
    $$

    الوزن داخل مدى البيانات، فالتقدير مقبول. آلة وزنها 3,000 كغ خارج المدى، والعلاقة قد لا تبقى خطية هناك.

- id: c06-l-16
  kind: problem
  part: L
  vars: {x1: 100, x2: 200, x3: 300, x4: 400, y1: 9000, y2: 14500, y3: 19000, y4: 25500}
  random: {x1: [80, 120, 10], x2: [180, 220, 10], x3: [280, 320, 10], x4: [380, 420, 10], y1: [6000, 10000, 100], y2: [11000, 16000, 100], y3: [16500, 21000, 100], y4: [22000, 28000, 100]}
  calc:
    - mx = (x1 + x2 + x3 + x4)/4
    - my = (y1 + y2 + y3 + y4)/4
    - Sxy = (x1 - mx)*(y1 - my) + (x2 - mx)*(y2 - my) + (x3 - mx)*(y3 - my) + (x4 - mx)*(y4 - my)
    - Sxx = (x1 - mx)**2 + (x2 - mx)**2 + (x3 - mx)**2 + (x4 - mx)**2
    - b = Sxy/Sxx
    - a = my - b*mx
    - C = a + b*250
  text: |
    تكلفة أربع لوحات كهربائية مع قدرتها:

    | القدرة، كيلوواط | [[x1|g]] | [[x2|g]] | [[x3|g]] | [[x4|g]] |
    | --- | --- | --- | --- | --- |
    | التكلفة، دينار | [[y1|g]] | [[y2|g]] | [[y3|g]] | [[y4|g]] |

    أوجد خط المربعات الصغرى، وقدر تكلفة لوحة قدرتها 250 كيلوواط.
  solution: |
    المتوسطان:

    $$
    \bar{x} = [[mx|2]] \qquad \bar{y} = [[my|2]]
    $$

    الميل:

    $$
    b_1 = \frac{\sum (x - \bar{x})(y - \bar{y})}{\sum (x - \bar{x})^2} = \frac{[[Sxy|2]]}{[[Sxx|2]]} = [[b|f4]]
    $$

    المقطع:

    $$
    b_0 = \bar{y} - b_1\,\bar{x} = [[my|2]] - [[b|f4]] \times [[mx|2]] = [[a|2]]
    $$

    التقدير:

    $$
    C = [[a|2]] + [[b|f4]] \times 250 = [[C|2]]
    $$

    ```excel
    =FORECAST(250, B2:E2, B1:E1)
    ```

- id: c06-l-17
  kind: problem
  part: L
  vars: {C: 2400000}
  random: {C: [500000, 9000000, 100000]}
  calc:
    - L1 = C*0.70
    - H1 = C*1.50
    - L2 = C*0.85
    - H2 = C*1.30
  text: |
    تقدير أولي لمشروع [[C|g]] دينار. ما المدى المتوقع للتكلفة الفعلية؟ وما المدى بعد التصميم المبدئي، إذا بقي التقدير كما هو؟ استخدم جدول دقة التقدير في هذا القسم.
  solution: |
    التقدير الأولي، من -30% إلى +50%:

    $$
    [[C|g]] \times 0.70 = [[L1|g]] \qquad [[C|g]] \times 1.50 = [[H1|g]]
    $$

    تقدير الموازنة، من -15% إلى +30%:

    $$
    [[C|g]] \times 0.85 = [[L2|g]] \qquad [[C|g]] \times 1.30 = [[H2|g]]
    $$

    لا تطلب تمويلا بالتقدير الأولي وحده: الفرق بين الحدين أكبر من نصف قيمة المشروع.

- id: c06-l-18
  kind: concept
  part: L
  text: |
    لماذا يكون أس الحجم في قاعدة الحجم والقوة أقل من واحد عادة؟
  solution: |
    بعض التكاليف لا تتضاعف مع الحجم: التصميم، والتحكم، والطرق، وجزء من العمالة. ومساحة سطح الخزان تزيد أبطأ من حجمه. فالتكلفة تزيد بنسبة أقل من زيادة الطاقة.

- id: c06-l-19
  kind: concept
  part: L
  text: |
    لماذا لا نستخدم علاقة تقدير التكلفة خارج مدى البيانات التي بنيت منها؟
  solution: |
    العلاقة الخطية وصفت البيانات في مداها فقط. خارج المدى قد تتغير طريقة التصنيع أو المواد، فلا يبقى الخط صحيحا، ولا يوجد ما يدل على حجم الخطأ.

- id: c06-l-20
  kind: concept
  part: L
  text: |
    عقد لتصنيع 50 وحدة. لماذا يخسر المقاول إذا سعر كل الوحدات بزمن الوحدة الخمسين؟
  solution: |
    منحنى التعلم يجعل الوحدات الأولى أبطأ بكثير من الأخيرة. متوسط الزمن لكل الوحدات أعلى من زمن الوحدة الخمسين، فالتسعير بها يغطي أقل من ساعات العمل الفعلية.
