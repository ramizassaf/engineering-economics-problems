items:

- id: c06-g-01
  kind: problem
  part: G
  vars: {Q: 5000, v: 6, af: 8000, pb: 7.5}
  random: {Q: [1000, 12000, 500], v: [3, 10, 0.5], af: [0, 20000, 1000], pb: [4, 12, 0.5]}
  calc:
    - make = v*Q + af
    - buy = pb*Q
  text: |
    مصنع يحتاج [[Q|g]] قطعة سنويا. تصنيعها يكلف [[v|d2]] دينار متغيرة للقطعة، و[[af|g]] دينار تكاليف ثابتة تختفي إذا اشترى. سعر المورد [[pb|d2]] دينار. يصنع أم يشتري؟
  solution: |
    $$
    \mathrm{make} = [[v|d2]] \times [[Q|g]] + [[af|g]] = [[make|2]]
    $$

    $$
    \mathrm{buy} = [[pb|d2]] \times [[Q|g]] = [[buy|2]]
    $$

    القرار: [[pick(make <= buy, 'يصنع', 'يشتري')]].

- id: c06-g-02
  kind: problem
  part: G
  vars: {v: 6, af: 8000, pb: 7.5}
  random: {v: [3, 10, 0.5], af: [1000, 20000, 1000], pb: [4, 12, 0.5]}
  calc:
    - pb = max(pb, v + 0.5)
    - x = af/(pb - v)
  text: |
    للمسألة السابقة، عند أي كمية سنوية يتساوى التصنيع والشراء؟
  solution: |
    $$
    [[v|d2]]\,Q + [[af|g]] = [[pb|d2]]\,Q \quad\Rightarrow\quad Q = \frac{[[af|g]]}{[[pb|d2]] - [[v|d2]]} = [[x|2]]
    $$

    فوق هذه الكمية التصنيع أرخص.

- id: c06-g-03
  kind: problem
  part: G
  vars: {Q: 5000, v: 6, af: 8000, pb: 7.5, rent: 600}
  random: {Q: [1000, 12000, 500], v: [3, 10, 0.5], af: [0, 20000, 1000], pb: [4, 12, 0.5], rent: [200, 1500, 50]}
  calc:
    - make = v*Q + af + 12*rent
    - buy = pb*Q
  text: |
    للمسألة الأولى، إذا اشترى المصنع القطعة، يمكن تأجير المساحة المستخدمة لتصنيعها بمبلغ [[rent|g]] دينار شهريا. هل يتغير القرار؟
  solution: |
    الإيجار الضائع يضاف إلى تكلفة التصنيع:

    $$
    [[v|d2]] \times [[Q|g]] + [[af|g]] + 12 \times [[rent|g]] = [[make|2]]
    $$

    مقابل الشراء [[buy|2]] دينار. القرار: [[pick(make <= buy, 'يصنع', 'يشتري')]].

- id: c06-g-04
  kind: problem
  part: G
  vars: {S: 90000, V: 60000, Fd: 18000, Fa: 20000}
  random: {S: [40000, 150000, 5000], V: [20000, 120000, 5000], Fd: [5000, 40000, 1000], Fa: [5000, 40000, 1000]}
  calc:
    - V = min(V, S - 2000)
    - ch = S - V - Fd
  text: |
    منتج مبيعاته [[S|g]] دينار، وتكاليفه المتغيرة [[V|g]] دينار، وتكاليفه الثابتة الخاصة [[Fd|g]] دينار، ونصيبه من التكاليف العامة [[Fa|g]] دينار. هل يغلق؟
  solution: |
    المنتج يساهم في ربح الشركة بمقدار:

    $$
    [[S|g]] - [[V|g]] - [[Fd|g]] = [[ch|g]]
    $$

    [[pick(ch > 0, 'المساهمة موجبة، فلا يغلق، مع أن التقرير قد يظهر خسارة بعد التكاليف العامة.', 'المساهمة سالبة، فالإغلاق يرفع ربح الشركة.')]]

- id: c06-g-05
  kind: problem
  part: G
  vars: {F1: 15000, v1: 10, F2: 40000, v2: 5}
  random: {F1: [5000, 30000, 1000], v1: [8, 16, 0.5], F2: [32000, 80000, 1000], v2: [2, 7, 0.5]}
  calc:
    - x = (F2 - F1)/(v1 - v2)
  text: |
    طريقة إنتاج أولى: [[F1|g]] دينار ثابتة سنويا و[[v1|d2]] دينار للوحدة. طريقة ثانية: [[F2|g]] دينار ثابتة و[[v2|d2]] دينار للوحدة. عند أي كمية تتساويان؟
  solution: |
    $$
    x = \frac{[[F2|g]] - [[F1|g]]}{[[v1|d2]] - [[v2|d2]]} = [[x|2]]
    $$

- id: c06-g-06
  kind: problem
  part: G
  vars: {F1: 1000, v1: 0.40, F2: 3000, v2: 0.25, F3: 7000, v3: 0.10}
  random: {F1: [500, 1500, 100], v1: [0.35, 0.50, 0.01], F2: [2000, 4000, 100], v2: [0.20, 0.30, 0.01], F3: [5000, 9000, 100], v3: [0.05, 0.15, 0.01]}
  calc:
    - x12 = (F2 - F1)/(v1 - v2)
    - x23 = (F3 - F2)/(v2 - v3)
  text: |
    ثلاث طرق لطباعة كتيبات. الأولى: [[F1|g]] دينار ثابتة و[[v1|d2]] دينار للكتيب. الثانية: [[F2|g]] و[[v2|d2]]. الثالثة: [[F3|g]] و[[v3|d2]]. حدد مدى الكمية الذي تكون فيه كل طريقة الأرخص.
  solution: |
    التقاطع بين الأولى والثانية:

    $$
    \frac{[[F2|g]] - [[F1|g]]}{[[v1|d2]] - [[v2|d2]]} = [[x12|2]]
    $$

    التقاطع بين الثانية والثالثة:

    $$
    \frac{[[F3|g]] - [[F2|g]]}{[[v2|d2]] - [[v3|d2]]} = [[x23|2]]
    $$

    [[pick(x12 < x23, 'الأولى أرخص تحت التقاطع الأول، والثانية بين التقاطعين، والثالثة فوق التقاطع الثاني.', 'التقاطع الأول بعد الثاني، فالطريقة الثانية لا تكون الأرخص أبدا. قارن الأولى بالثالثة مباشرة.')]]

- id: c06-g-07
  kind: problem
  part: G
  vars: {h: 500, pa: 30, va: 18, ha: 2, pb: 45, vb: 30, hb: 3}
  random: {h: [200, 1000, 50], pa: [20, 40, 1], va: [8, 18, 1], ha: [1, 3, 0.5], pb: [35, 60, 1], vb: [15, 32, 1], hb: [1.5, 5, 0.5]}
  calc:
    - ca = (pa - va)/ha
    - cb = (pb - vb)/hb
  text: |
    آلة متاحة [[h|g]] ساعة فقط في الشهر. المنتج أ يعطي هامشا [[pa-va|g]] دينار ويحتاج [[ha|d2]] ساعة. المنتج ب يعطي هامشا [[pb-vb|g]] دينار ويحتاج [[hb|d2]] ساعة. الطلب على كل منهما كبير. أيهما ينتج المصنع؟
  solution: |
    المورد المحدود هو ساعات الآلة، فنقارن الهامش لكل ساعة، وليس لكل وحدة:

    $$
    \frac{[[pa-va|g]]}{[[ha|d2]]} = [[ca|2]], \qquad \frac{[[pb-vb|g]]}{[[hb|d2]]} = [[cb|2]]
    $$

    ينتج المنتج [[pick(ca >= cb, 'أ', 'ب')]]. الربح الشهري [[max(ca, cb)*h|2]] دينار.

- id: c06-g-08
  kind: problem
  part: G
  vars: {s: 12000, p1: 8, p2: 14, c: 4}
  random: {s: [5000, 30000, 1000], p1: [5, 12, 0.5], p2: [10, 25, 0.5], c: [1, 8, 0.5]}
  calc:
    - p2 = max(p2, p1 + 1)
    - g = (p2 - p1 - c)*s/1000
  text: |
    مصنع ينتج [[s|g]] كيلو جبنة بيضاء، يبيعها بسعر [[p1|d2]] دينار للكيلو. يمكنه تحويلها إلى جبنة مدخنة تباع بسعر [[p2|d2]] دينار، بتكلفة إضافية [[c|d2]] دينار للكيلو. هل يحولها؟ احسب الربح الإضافي بالألف دينار.
  solution: |
    تكلفة الجبنة البيضاء نفسها لا تهم هنا، لأنها مصروفة في الحالتين. نقارن الإيراد الإضافي بالتكلفة الإضافية:

    $$
    ([[p2|d2]] - [[p1|d2]] - [[c|d2]]) \times [[s|g]] / 1000 = [[g|2]]
    $$

    [[pick(g > 0, 'يحولها.', 'يبيعها بيضاء.')]]

- id: c06-g-09
  kind: problem
  part: G
  vars: {Q: 3000, cm: 4, ex: 5000, k: 2}
  random: {Q: [1000, 8000, 250], cm: [2, 10, 0.5], ex: [2000, 15000, 500], k: [0.5, 4, 0.5]}
  calc:
    - g = Q*k - ex
  text: |
    حملة إعلانية تكلف [[ex|g]] دينار، ويتوقع أن تزيد المبيعات [[Q|g]] وحدة، لكن سعر الوحدة سينخفض بسبب العروض فيصبح هامشها الإضافي [[k|d2]] دينار فقط. هل الحملة مربحة؟
  solution: |
    $$
    [[Q|g]] \times [[k|d2]] - [[ex|g]] = [[g|2]]
    $$

    [[pick(g > 0, 'الحملة مربحة.', 'الحملة غير مربحة.')]]

- id: c06-g-10
  kind: problem
  part: G
  vars: {Q: 10000, pi: 2.3, m: 1.2, l: 0.6, o: 0.3, fi: 6000}
  random: {Q: [4000, 20000, 500], pi: [1.5, 3.5, 0.1], m: [0.8, 1.6, 0.1], l: [0.3, 1, 0.1], o: [0.1, 0.5, 0.05], fi: [2000, 12000, 500]}
  calc:
    - make = (m + l + o)*Q + fi
    - buy = pi*Q
  text: |
    مطعم يصنع خبزه بنفسه، ويحتاج [[Q|g]] رغيفا شهريا. تكلفة الرغيف: طحين [[m|d2]]، وأجر خباز [[l|d2]]، وغاز [[o|d2]] دينار. الفرن يكلف [[fi|g]] دينار شهريا بين إيجار مساحة واستهلاك، وتختفي إذا توقف عن الخبز. مخبز يعرض الرغيف بسعر [[pi|d2]] دينار. ماذا يختار؟
  solution: |
    $$
    \mathrm{make} = ([[m|d2]] + [[l|d2]] + [[o|d2]]) \times [[Q|g]] + [[fi|g]] = [[make|2]]
    $$

    $$
    \mathrm{buy} = [[pi|d2]] \times [[Q|g]] = [[buy|2]]
    $$

    القرار: [[pick(make <= buy, 'يخبز بنفسه', 'يشتري')]]. اعتبارات أخرى: الجودة، والاعتماد على مورد واحد، والطزاجة.

- id: c06-g-11
  kind: problem
  part: G
  text: |
    اذكر ثلاثة عوامل غير مالية تدخل في قرار التصنيع أو الشراء.
  solution: |
    الجودة والتحكم بها، والاعتماد على المورد ومخاطر انقطاعه، والحفاظ على المعرفة الفنية داخل الشركة. ويضاف أيضا أثر القرار على العمال.

- id: c06-g-12
  kind: problem
  part: G
  vars: {Q: 2000, v: 25, af: 12000, pb: 30, c: 1500}
  random: {Q: [500, 5000, 100], v: [15, 35, 1], af: [5000, 30000, 1000], pb: [20, 45, 1], c: [500, 5000, 250]}
  calc:
    - make = v*Q + af
    - buy = pb*Q + c
  text: |
    قطعة يحتاج منها [[Q|g]] وحدة سنويا. التصنيع: [[v|g]] دينار للقطعة، و[[af|g]] دينار ثابتة تختفي إذا اشترى. الشراء: [[pb|g]] دينار للقطعة، و[[c|g]] دينار سنويا لفحص الجودة والنقل. أيهما أرخص؟
  solution: |
    $$
    \mathrm{make} = [[make|2]], \qquad \mathrm{buy} = [[pb|g]] \times [[Q|g]] + [[c|g]] = [[buy|2]]
    $$

    الأرخص: [[pick(make <= buy, 'التصنيع', 'الشراء')]]. تكاليف الشراء لا تقتصر على السعر.
