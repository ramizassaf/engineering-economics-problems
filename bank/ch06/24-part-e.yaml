items:

- id: c06-e-01
  kind: problem
  part: E
  vars: {C1: 5000, C2: 5600, Q1: 1000, Q2: 1200}
  random: {C1: [3000, 10000, 100], Q1: [500, 2000, 50], Q2: [2050, 3000, 50], C2: [4000, 15000, 100]}
  calc:
    - C2 = max(C2, C1 + 100)
    - mc = (C2 - C1)/(Q2 - Q1)
  text: |
    تكلفة إنتاج [[Q1|g]] وحدة [[C1|g]] دينار، وتكلفة [[Q2|g]] وحدة [[C2|g]] دينار. ما التكلفة الحدية للوحدة في هذا المدى؟
  solution: |
    $$
    MC = \frac{[[C2|g]] - [[C1|g]]}{[[Q2|g]] - [[Q1|g]]} = [[mc|2]]
    $$

- id: c06-e-02
  kind: problem
  part: E
  text: |
    مطعم يقدر تكلفته اليومية حسب عدد الوجبات:

    | الوجبات | 100 | 150 | 200 | 250 |
    | --- | --- | --- | --- | --- |
    | التكلفة الكلية | 900 | 1,150 | 1,450 | 1,850 |

    احسب التكلفة الحدية للوجبة في كل مرحلة، ومتوسط التكلفة. إذا كان سعر الوجبة 7 دنانير، كم وجبة يقدم المطعم؟
  solution: |
    | الانتقال | الحدية للوجبة |
    | --- | --- |
    | من 100 إلى 150 | 5.00 |
    | من 150 إلى 200 | 6.00 |
    | من 200 إلى 250 | 8.00 |

    متوسط التكلفة عند 100 و150 و200 و250 وجبة: 9.00 و7.67 و7.25 و7.40 دنانير.

    المطعم يزيد الوجبات ما دامت التكلفة الحدية أقل من السعر. حتى 200 وجبة كل خمسين وجبة تضيف ربحا. من 200 إلى 250 التكلفة الحدية 8 دنانير، أعلى من السعر، فيتوقف عند 200 وجبة.

- id: c06-e-03
  kind: problem
  part: E
  vars: {v: 9, ps: 11, q: 500, F: 20000, Q: 4000}
  random: {v: [5, 15, 0.5], ps: [6, 18, 0.5], q: [200, 2000, 100], F: [10000, 50000, 1000], Q: [2000, 8000, 250]}
  calc:
    - g = (ps - v)*q
  text: |
    مصنع لديه طاقة فائضة. تكلفته المتغيرة [[v|d2]] دينار للوحدة، وثابتته [[F|g]] دينار، ويبيع حاليا [[Q|g]] وحدة. جاءت طلبية خاصة لـ [[q|g]] وحدة بسعر [[ps|d2]] دينار. هل يقبل؟
  solution: |
    التكاليف الثابتة لا تتغير بالطلبية. الربح الإضافي:

    $$
    ([[ps|d2]] - [[v|d2]]) \times [[q|g]] = [[g|2]]
    $$

    [[pick(g > 0, 'يقبل.', 'يرفض، لأن السعر لا يغطي التكلفة المتغيرة.')]]

- id: c06-e-04
  kind: problem
  part: E
  vars: {cap: 10000, Q: 9000, p: 20, v: 12, q: 2000, ps: 16}
  random: {Q: [8500, 9800, 100], p: [16, 28, 1], v: [8, 14, 1], q: [1500, 3000, 100], ps: [13, 19, 0.5]}
  calc:
    - lost = q - (cap - Q)
    - g = (ps - v)*q - (p - v)*lost
  text: |
    مصنع طاقته [[cap|g]] وحدة، ويبيع [[Q|g]] وحدة بسعر [[p|g]] دينار. تكلفته المتغيرة [[v|g]] دينار. طلبية خاصة لـ [[q|g]] وحدة بسعر [[ps|d2]] دينار. لقبولها يجب أن يتخلى عن جزء من مبيعاته العادية. هل يقبل؟
  solution: |
    الطاقة الفائضة [[cap-Q|g]] وحدة فقط، فيتخلى عن [[lost|g]] وحدة من المبيعات العادية. كل وحدة متروكة تكلفه هامشها [[p-v|g]] دينار، وهذه تكلفة فرصة بديلة.

    $$
    ([[ps|d2]] - [[v|g]]) \times [[q|g]] - [[p-v|g]] \times [[lost|g]] = [[g|2]]
    $$

    [[pick(g > 0, 'الربح الإضافي موجب، فيقبل.', 'الربح الإضافي سالب، فيرفض.')]]

- id: c06-e-05
  kind: problem
  part: E
  vars: {v: 9, x: 1500, q: 1000}
  random: {v: [5, 15, 0.5], x: [500, 4000, 100], q: [300, 2000, 100]}
  calc:
    - p = v + x/q
  text: |
    طلبية خاصة لـ [[q|g]] وحدة تحتاج قالبا خاصا بتكلفة [[x|g]] دينار، إضافة إلى التكلفة المتغيرة [[v|d2]] دينار للوحدة. المصنع فيه طاقة فائضة. ما أقل سعر للوحدة يقبله؟
  solution: |
    $$
    p = [[v|d2]] + \frac{[[x|g]]}{[[q|g]]} = [[p|2]]
    $$

    تكلفة القالب تكلفة ثابتة، لكنها خاصة بالطلبية، فتدخل في القرار.

- id: c06-e-06
  kind: problem
  part: E
  vars: {r: 1800, d: 6, h: 80, k: 0.2}
  random: {r: [800, 3000, 50], d: [4, 10, 1], h: [40, 150, 5], k: [0.1, 0.5, 0.05]}
  calc:
    - w = h*d*k
    - c = r*d/26 + w
  text: |
    شركة تفكر في العمل يوم الجمعة لمدة [[d|n]] أيام في الشهر. الأجور الإضافية [[h|g]] دينار لليوم، والكهرباء والمواد الإضافية [[k|%]] من الأجور. الإيجار الشهري [[r|g]] دينار. ما التكلفة الإضافية الشهرية؟
  solution: |
    الإيجار يدفع في كل الأحوال، فلا يدخل. التكلفة الإضافية:

    $$
    [[d|n]] \times [[h|g]] \times (1 + [[k|r]]) = [[d*h*(1+k)|2]]
    $$

    الخطأ الشائع إضافة نصيب أيام الجمعة من الإيجار، أي [[c|2]] دينار.

- id: c06-e-07
  kind: problem
  part: E
  text: |
    شركة طيران تبيع مقعدا في آخر لحظة بسعر 40 دينارا، مع أن متوسط تكلفة المقعد 120 دينارا. هل هذا قرار خاطئ؟
  solution: |
    لا، إذا كانت الطائرة ستطير في كل الأحوال والمقعد فارغ. أغلب تكلفة الرحلة ثابتة: الوقود والطاقم والطائرة. التكلفة الحدية للراكب الإضافي صغيرة: وجبة وقليل من الوقود. أي سعر أعلى منها يضيف ربحا.

- id: c06-e-08
  kind: problem
  part: E
  vars: {Q: 5000, F: 30000, v: 10, p: 18, q: 1000, ps: 12}
  random: {Q: [2000, 8000, 250], F: [10000, 60000, 1000], v: [5, 14, 1], p: [15, 25, 1], q: [500, 2000, 100], ps: [8, 16, 0.5]}
  calc:
    - P0 = (p - v)*Q - F
    - P1 = P0 + (ps - v)*q
  text: |
    مصنع فيه طاقة فائضة يبيع [[Q|g]] وحدة بسعر [[p|g]] دينار. تكلفته المتغيرة [[v|g]] دينار، والثابتة [[F|g]] دينار. احسب ربحه قبل طلبية خاصة لـ [[q|g]] وحدة بسعر [[ps|d2]] دينار وبعدها.
  solution: |
    قبل الطلبية:

    $$
    ([[p|g]] - [[v|g]]) \times [[Q|g]] - [[F|g]] = [[P0|2]]
    $$

    بعد الطلبية:

    $$
    [[P0|2]] + ([[ps|d2]] - [[v|g]]) \times [[q|g]] = [[P1|2]]
    $$

- id: c06-e-09
  kind: problem
  part: E
  text: |
    لماذا يجب الحذر من قبول طلبيات خاصة رخيصة كثيرة، مع أن كل واحدة منها رابحة بالتكلفة الحدية؟
  solution: |
    لأسباب منها: الزبائن العاديون قد يطالبون بنفس السعر، والطاقة الفائضة قد تنتهي فتحل الطلبيات محل مبيعات بسعر كامل، والتكاليف الثابتة يجب أن تغطى من مكان ما. على المدى الطويل يجب أن يغطي متوسط السعر كل التكاليف.

- id: c06-e-10
  kind: problem
  part: E
  vars: {a: 2000, b: 0.5}
  random: {a: [1000, 5000, 100], b: [0.1, 1, 0.05]}
  calc:
    - m1 = (a + b*1001**2) - (a + b*1000**2)
    - m2 = (a + b*2001**2) - (a + b*2000**2)
  text: |
    تكلفة مصنع تعطيها المعادلة التالية، حيث Q عدد الوحدات:

    $$
    C = [[a|g]] + [[b|d2]]\,Q^2
    $$

    ما تكلفة الوحدة رقم 1001؟ والوحدة رقم 2001؟
  solution: |
    التكلفة الحدية هي الفرق بين تكلفتين متتاليتين:

    $$
    C(1001) - C(1000) = [[m1|2]]
    $$

    $$
    C(2001) - C(2000) = [[m2|2]]
    $$

    التكلفة الحدية تزيد مع الإنتاج، كما يحدث عندما يقترب المصنع من طاقته القصوى.

- id: c06-e-11
  kind: problem
  part: E
  vars: {p: 12, v: 8, k: 1.5, q: 400}
  random: {p: [10, 20, 0.5], v: [5, 9, 0.5], k: [0.5, 3, 0.25], q: [200, 1000, 50]}
  calc:
    - g = (p - v - k)*q
  text: |
    زبون يطلب [[q|g]] وحدة إضافية بالسعر العادي [[p|d2]] دينار، لكن الإنتاج يحتاج ساعات عمل إضافية تزيد التكلفة المتغيرة [[k|d2]] دينار للوحدة فوق [[v|d2]] دينار. هل يقبل المصنع؟
  solution: |
    $$
    ([[p|d2]] - [[v|d2]] - [[k|d2]]) \times [[q|g]] = [[g|2]]
    $$

    [[pick(g > 0, 'يقبل.', 'يرفض.')]]

- id: c06-e-12
  kind: problem
  part: E
  text: |
    ما الفرق بين التكلفة الحدية والتكلفة المتغيرة للوحدة؟ متى تتساويان؟
  solution: |
    التكلفة المتغيرة للوحدة متوسط ثابت في نموذج التكلفة الخطية. التكلفة الحدية هي تكلفة الوحدة الإضافية فعلا. تتساويان عندما تكون التكلفة الكلية خطا مستقيما. تختلفان عندما تزيد التكلفة الإضافية مع الإنتاج، مثل الأجور الإضافية أو الوردية الليلية.
