items:

# ------------------------------------------------------------ fixed and variable
- id: c06-ex-classify
  kind: example
  title: |
    تصنيف تكاليف مخبز
  text: |
    مخبز صغير في نابلس لديه التكاليف الشهرية التالية. صنف كل تكلفة: ثابتة أم متغيرة؟

    | البند | المبلغ الشهري |
    | --- | --- |
    | إيجار المحل | 800 |
    | راتب مدير المخبز | 900 |
    | طحين وخميرة | 0.20 دينار لكل ربطة خبز |
    | غاز الأفران | 0.05 دينار لكل ربطة |
    | أكياس التغليف | 0.02 دينار لكل ربطة |
    | تأمين المحل | 60 |
    | قسط استهلاك العجانة | 150 |
  solution: |
    السؤال الذي نسأله لكل بند: هل يتغير المبلغ إذا خبز المخبز ربطات أكثر هذا الشهر؟

    | البند | النوع | السبب |
    | --- | --- | --- |
    | إيجار المحل | ثابتة | يدفع نفس المبلغ مهما كان الإنتاج |
    | راتب المدير | ثابتة | الراتب لا يرتبط بعدد الربطات |
    | طحين وخميرة | متغيرة | كل ربطة تحتاج كمية |
    | غاز الأفران | متغيرة | يزيد مع ساعات الخبز |
    | أكياس التغليف | متغيرة | كيس لكل ربطة |
    | التأمين | ثابتة | مبلغ شهري ثابت |
    | الاستهلاك | ثابتة | قسط ثابت بالقسط الثابت |

    التكاليف الثابتة في الشهر:

    $$
    F = 800 + 900 + 60 + 150 = 1{,}910
    $$

    التكلفة المتغيرة لكل ربطة:

    $$
    v = 0.20 + 0.05 + 0.02 = 0.27
    $$

    كلمة ثابتة لا تعني أن المبلغ لا يتغير أبدا. معناها أنه لا يتغير مع حجم الإنتاج، ضمن مدى معين. لو ضاعف المخبز إنتاجه كثيرا لاحتاج محلا أكبر، فيتغير الإيجار.

- id: c06-ex-total-cost
  kind: example
  title: |
    التكلفة الكلية عند حجمين
  vars: {F: 1910, v: 0.27, Q1: 6000, Q2: 9000}
  random: {F: [1000, 4000, 50], v: [0.15, 0.45, 0.01], Q1: [3000, 8000, 500], Q2: [8500, 15000, 500]}
  calc:
    - C1 = F + v*Q1
    - C2 = F + v*Q2
    - dC = C2 - C1
  text: |
    للمخبز تكاليف ثابتة [[F|g]] دينار شهريا، وتكلفة متغيرة [[v|d2]] دينار لكل ربطة. ما التكلفة الكلية إذا خبز [[Q1|g]] ربطة؟ وإذا خبز [[Q2|g]] ربطة؟ بكم زادت التكلفة؟
  solution: |
    التكلفة الكلية تساوي الثابتة زائد المتغيرة لكل وحدة مضروبة في عدد الوحدات:

    $$
    C = F + v\,Q
    $$

    $$
    C_1 = [[F|g]] + [[v|d2]] \times [[Q1|g]] = [[C1|2]]
    $$

    $$
    C_2 = [[F|g]] + [[v|d2]] \times [[Q2|g]] = [[C2|2]]
    $$

    زادت التكلفة [[dC|2]] دينار. هذه الزيادة كلها من الجزء المتغير، لأن الثابتة لم تتغير:

    $$
    [[v|d2]] \times ([[Q2|g]] - [[Q1|g]]) = [[dC|2]]
    $$

- id: c06-ex-average-cost
  kind: example
  title: |
    لماذا تنخفض تكلفة الوحدة مع زيادة الإنتاج
  vars: {F: 1910, v: 0.27}
  random: {F: [1000, 4000, 50], v: [0.15, 0.45, 0.01]}
  calc:
    - a2 = F/2000 + v
    - a5 = F/5000 + v
    - a10 = F/10000 + v
    - a20 = F/20000 + v
  text: |
    للمخبز السابق، بتكاليف ثابتة [[F|g]] دينار وتكلفة متغيرة [[v|d2]] دينار للربطة: احسب متوسط تكلفة الربطة إذا خبز 2,000 و5,000 و10,000 و20,000 ربطة في الشهر.
  solution: |
    متوسط التكلفة يساوي التكلفة الكلية مقسومة على عدد الوحدات:

    $$
    AC = \frac{F + v\,Q}{Q} = \frac{F}{Q} + v
    $$

    | الربطات | الثابتة لكل ربطة | المتغيرة لكل ربطة | متوسط التكلفة |
    | --- | --- | --- | --- |
    | 2,000 | [[F/2000|f4]] | [[v|d2]] | [[a2|f4]] |
    | 5,000 | [[F/5000|f4]] | [[v|d2]] | [[a5|f4]] |
    | 10,000 | [[F/10000|f4]] | [[v|d2]] | [[a10|f4]] |
    | 20,000 | [[F/20000|f4]] | [[v|d2]] | [[a20|f4]] |

    التكلفة الثابتة تتوزع على ربطات أكثر، فينخفض نصيب كل ربطة منها. أما المتغيرة فثابتة لكل ربطة. لذلك المصانع الكبيرة تبيع أرخص: هذا ما يسمى وفورات الحجم.

# ------------------------------------------------------------ break-even
- id: c06-ex-contribution
  kind: example
  title: |
    هامش المساهمة
  vars: {p: 0.50, v: 0.27}
  random: {p: [0.40, 0.90, 0.05], v: [0.15, 0.35, 0.01]}
  calc:
    - cm = p - v
    - r = cm/p
  text: |
    المخبز يبيع الربطة بسعر [[p|d2]] دينار، وتكلفتها المتغيرة [[v|d2]] دينار. ما هامش المساهمة لكل ربطة؟ وما نسبته من السعر؟
  solution: |
    هامش المساهمة هو ما يبقى من سعر الوحدة بعد تغطية تكلفتها المتغيرة:

    $$
    CM = p - v = [[p|d2]] - [[v|d2]] = [[cm|d2]]
    $$

    كل ربطة تساهم بمبلغ [[cm|d2]] دينار في تغطية التكاليف الثابتة، ثم في الربح بعد تغطيتها. نسبة الهامش:

    $$
    \frac{CM}{p} = \frac{[[cm|d2]]}{[[p|d2]]} = [[r|%2]]
    $$

    أي أن [[r|%2]] من كل دينار مبيعات يذهب لتغطية الثابتة والربح.

- id: c06-ex-breakeven
  kind: example
  title: |
    نقطة التعادل بالوحدات
  vars: {F: 1910, p: 0.50, v: 0.27}
  random: {F: [1000, 4000, 50], p: [0.40, 0.90, 0.05], v: [0.15, 0.35, 0.01]}
  calc:
    - cm = p - v
    - Q = F/cm
    - Qc = ceil(Q)
  text: |
    مخبز تكاليفه الثابتة [[F|g]] دينار شهريا. يبيع الربطة بسعر [[p|d2]] دينار، وتكلفتها المتغيرة [[v|d2]] دينار. كم ربطة يجب أن يبيع في الشهر حتى لا يخسر؟
  solution: |
    عند نقطة التعادل يساوي الإيراد التكلفة الكلية، فالربح صفر:

    $$
    p\,Q = F + v\,Q
    $$

    ننقل الحدود ونحل:

    $$
    Q^* = \frac{F}{p - v} = \frac{[[F|g]]}{[[cm|d2]]} = [[Q|2]]
    $$

    يجب أن يبيع [[Qc|g]] ربطة على الأقل. المعنى بسيط: كل ربطة تغطي [[cm|d2]] دينار من التكاليف الثابتة، فنقسم الثابتة على هذا المبلغ.

    للتأكد، عند [[Qc|g]] ربطة:

    $$
    [[p|d2]] \times [[Qc|g]] - ([[F|g]] + [[v|d2]] \times [[Qc|g]]) = [[p*Qc - F - v*Qc|2]]
    $$

- id: c06-ex-breakeven-revenue
  kind: example
  title: |
    نقطة التعادل بالمبيعات
  vars: {F: 45000, r: 0.30}
  random: {F: [10000, 120000, 1000], r: [0.15, 0.50, 0.01]}
  calc:
    - S = F/r
  text: |
    محل أدوات منزلية يبيع مئات الأصناف، فلا معنى لحساب التعادل بالوحدات. تكاليفه الثابتة السنوية [[F|g]] دينار، ونسبة هامش المساهمة في المتوسط [[r|%]]. ما المبيعات السنوية اللازمة للتعادل؟
  solution: |
    كل دينار مبيعات يساهم بمبلغ [[r|d2]] دينار. نحتاج مبيعات تكفي لتغطية الثابتة:

    $$
    S^* = \frac{F}{CM/p} = \frac{[[F|g]]}{[[r|d2]]} = [[S|2]]
    $$

- id: c06-ex-target-profit
  kind: example
  title: |
    الكمية اللازمة لربح مستهدف
  vars: {F: 24000, p: 15, v: 9, T: 12000}
  random: {F: [8000, 60000, 1000], p: [10, 30, 1], v: [4, 9, 1], T: [3000, 30000, 1000]}
  calc:
    - cm = p - v
    - Q0 = F/cm
    - Q = (F + T)/cm
  text: |
    ورشة تصنع كراسي خشبية. التكاليف الثابتة السنوية [[F|g]] دينار، وسعر الكرسي [[p|g]] دينار، وتكلفته المتغيرة [[v|g]] دينار. صاحب الورشة يريد ربحا سنويا [[T|g]] دينار. كم كرسيا يجب أن يبيع؟
  solution: |
    نعامل الربح المطلوب كأنه تكلفة ثابتة إضافية يجب تغطيتها:

    $$
    Q = \frac{F + \mathrm{profit}}{p - v} = \frac{[[F|g]] + [[T|g]]}{[[cm|g]]} = [[Q|2]]
    $$

    نقطة التعادل وحدها [[Q0|2]] كرسيا. كل كرسي بعد التعادل يضيف [[cm|g]] دينار ربحا.

- id: c06-ex-safety
  kind: example
  title: |
    هامش الأمان
  vars: {F: 24000, p: 15, v: 9, Q: 6000}
  random: {F: [8000, 60000, 1000], p: [10, 30, 1], v: [4, 9, 1], Q: [2000, 12000, 250]}
  calc:
    - Qb = F/(p - v)
    - Q = max(Q, ceil(Qb*1.1))
    - M = Q - Qb
    - m = M/Q
  text: |
    الورشة السابقة تبيع [[Q|g]] كرسيا سنويا. بكم يمكن أن تنخفض مبيعاتها قبل أن تبدأ بالخسارة؟
  solution: |
    نقطة التعادل:

    $$
    Q^* = \frac{[[F|g]]}{[[p|g]] - [[v|g]]} = [[Qb|2]]
    $$

    هامش الأمان هو المسافة بين المبيعات الحالية ونقطة التعادل:

    $$
    [[Q|g]] - [[Qb|2]] = [[M|2]]
    $$

    كنسبة من المبيعات:

    $$
    \frac{[[M|2]]}{[[Q|g]]} = [[m|%2]]
    $$

    المبيعات يمكن أن تنخفض [[m|%2]] قبل الخسارة. كلما كبر هذا الهامش كان المشروع أكثر أمانا.

- id: c06-ex-whatif
  kind: example
  title: |
    أثر تغيير السعر على نقطة التعادل
  vars: {F: 24000, p: 15, v: 9, d: 0.10}
  random: {F: [8000, 60000, 1000], p: [12, 30, 1], v: [4, 9, 1], d: [0.05, 0.20, 0.05]}
  calc:
    - Q1 = F/(p - v)
    - p2 = p*(1 - d)
    - Q2 = F/(p2 - v)
    - g = Q2/Q1 - 1
  text: |
    الورشة تفكر في خفض سعر الكرسي [[d|%]] لزيادة المبيعات. السعر الحالي [[p|g]] دينار، والتكلفة المتغيرة [[v|g]] دينار، والثابتة [[F|g]] دينار. ماذا يحدث لنقطة التعادل؟
  solution: |
    قبل التخفيض:

    $$
    Q_1^* = \frac{[[F|g]]}{[[p|g]] - [[v|g]]} = [[Q1|2]]
    $$

    السعر الجديد [[p2|d2]] دينار، والهامش يصغر إلى [[p2-v|d2]] دينار:

    $$
    Q_2^* = \frac{[[F|g]]}{[[p2|d2]] - [[v|g]]} = [[Q2|2]]
    $$

    نقطة التعادل ارتفعت [[g|%2]]، مع أن السعر انخفض [[d|%]] فقط. السبب أن التخفيض يأتي كله من الهامش. لذلك قرار التخفيض يحتاج زيادة كبيرة في المبيعات حتى يستحق.

# ------------------------------------------------------------ mixed costs
- id: c06-ex-high-low
  kind: example
  title: |
    فصل التكلفة شبه المتغيرة
  vars: {h1: 1200, c1: 3900, h2: 2000, c2: 5500, vr: 0}
  random: {h1: [800, 1500, 50], h2: [1800, 3000, 50], c1: [4000, 6000, 50], vr: [1.2, 2.5, 0.1]}
  calc:
    - c2 = pick(vr > 0, c1 + (h2 - h1)*vr, c2)
    - v = (c2 - c1)/(h2 - h1)
    - F = c1 - v*h1
  text: |
    فاتورة الكهرباء في مصنع صغير فيها رسم ثابت وجزء يتغير مع ساعات تشغيل الآلات. في أقل شهر تشغيلا عملت الآلات [[h1|g]] ساعة وكانت الفاتورة [[c1|g]] دينار. في أعلى شهر عملت [[h2|g]] ساعة وكانت الفاتورة [[c2|g]] دينار. افصل الجزء الثابت عن المتغير.
  solution: |
    طريقة الحد الأعلى والأدنى: الفرق في الفاتورة بين الشهرين سببه الفرق في الساعات فقط، لأن الجزء الثابت نفسه في الشهرين.

    $$
    v = \frac{[[c2|g]] - [[c1|g]]}{[[h2|g]] - [[h1|g]]} = [[v|d2]]
    $$

    أي [[v|d2]] دينار لكل ساعة تشغيل. نعوض في أي شهر لنجد الثابت:

    $$
    F = [[c1|g]] - [[v|d2]] \times [[h1|g]] = [[F|2]]
    $$

    معادلة الفاتورة:

    $$
    C = [[F|2]] + [[v|d2]]\,h
    $$

    الطريقة سهلة، لكنها تعتمد على شهرين فقط. إذا كان أحدهما غير عادي فالنتيجة مضللة. الانحدار الخطي في Excel أو Python يستخدم كل الأشهر، وهو أدق.

# ------------------------------------------------------------ marginal cost
- id: c06-ex-marginal
  kind: example
  title: |
    التكلفة الحدية من جدول
  text: |
    مصنع ألبان يقدر تكلفته اليومية الكلية حسب عدد الورديات. ما تكلفة كل وردية إضافية؟

    | الورديات | الإنتاج باللتر | التكلفة الكلية |
    | --- | --- | --- |
    | 1 | 4,000 | 3,000 |
    | 2 | 8,000 | 4,600 |
    | 3 | 11,000 | 6,800 |
  solution: |
    التكلفة الحدية هي الزيادة في التكلفة الكلية مقابل الزيادة في الإنتاج.

    | الانتقال | زيادة الإنتاج | زيادة التكلفة | التكلفة الحدية للتر |
    | --- | --- | --- | --- |
    | من وردية إلى اثنتين | 4,000 | 1,600 | 0.40 |
    | من اثنتين إلى ثلاث | 3,000 | 2,200 | 0.73 |

    متوسط التكلفة عند ثلاث ورديات:

    $$
    \frac{6{,}800}{11{,}000} = 0.62
    $$

    لاحظ أن الوردية الثالثة أغلى لكل لتر من المتوسط: أجور ليلية أعلى، وآلات تعمل بكفاءة أقل. قرار إضافة وردية يعتمد على التكلفة الحدية، وليس على المتوسط. إذا كان سعر اللتر 0.65 دينار، فالوردية الثالثة تخسر مع أن المتوسط يبدو رابحا.

- id: c06-ex-special-order
  kind: example
  title: |
    قبول طلبية خاصة بسعر منخفض
  vars: {cap: 10000, Q: 7000, p: 20, v: 11, F: 35000, q: 2000, ps: 14}
  random: {Q: [5000, 8000, 500], p: [16, 30, 1], v: [8, 13, 1], F: [20000, 60000, 1000], q: [500, 2500, 250], ps: [10, 18, 1]}
  calc:
    - q = min(q, cap - Q)
    - af = F/Q + v
    - gain = (ps - v)*q
  text: |
    مصنع أحذية طاقته [[cap|g]] زوج سنويا، ويبيع حاليا [[Q|g]] زوج بسعر [[p|g]] دينار. التكلفة المتغيرة [[v|g]] دينار للزوج، والثابتة [[F|g]] دينار سنويا. تاجر من الخارج يطلب [[q|g]] زوج بسعر [[ps|g]] دينار فقط، ولن يؤثر ذلك على المبيعات الحالية. هل يقبل المصنع؟
  solution: |
    متوسط تكلفة الزوج حاليا:

    $$
    \frac{[[F|g]]}{[[Q|g]]} + [[v|g]] = [[af|2]]
    $$

    سعر الطلبية [[pick(ps < af, 'أقل من المتوسط، فيبدو أن المصنع يخسر', 'أعلى من المتوسط')]]. لكن هذا خطأ في التفكير: التكاليف الثابتة تدفع سواء قبل الطلبية أم لا. المصنع فيه طاقة فائضة، فالطلبية تضيف التكلفة المتغيرة فقط.

    الربح الإضافي من الطلبية:

    $$
    ([[ps|g]] - [[v|g]]) \times [[q|g]] = [[gain|2]]
    $$

    [[pick(gain > 0, 'الربح موجب، فيقبل المصنع.', 'السعر لا يغطي التكلفة المتغيرة، فيرفض.')]] القاعدة: مع وجود طاقة فائضة، اقبل أي طلبية سعرها أعلى من التكلفة المتغيرة، بشرط ألا تؤثر على السعر للزبائن الحاليين.

# ------------------------------------------------------------ sunk and opportunity
- id: c06-ex-sunk
  kind: example
  title: |
    التكلفة الغارقة
  vars: {P: 50000, S: 12000, A: 15000, R: 20000}
  random: {P: [20000, 90000, 1000], S: [3000, 25000, 1000], A: [5000, 30000, 1000], R: [5000, 35000, 1000]}
  calc:
    - S = min(S, P - 5000)
    - keep = R - A
  text: |
    شركة اشترت قبل سنتين آلة طباعة بمبلغ [[P|g]] دينار. الآلة الآن تعمل لكن الطلب تراجع. يمكن بيعها اليوم بمبلغ [[S|g]] دينار فقط. إذا احتفظت بها لسنة أخرى، فستكلف تشغيلا [[A|g]] دينار، وتعطي إيرادا [[R|g]] دينار، ثم لا تساوي شيئا. المدير يقول: لا نبيعها بأقل من ثمنها، دفعنا فيها [[P|g]] دينار. ما رأيك؟ تجاهل الفائدة.
  solution: |
    الـ [[P|g]] دينار دفعت في الماضي، ولا يغيرها أي قرار اليوم. هذه تكلفة غارقة، ولا تدخل في القرار.

    نقارن ما يتغير بين الخيارين من اليوم فصاعدا:

    | | البيع اليوم | الاحتفاظ سنة |
    | --- | --- | --- |
    | نقد اليوم | [[S|g]] | 0 |
    | صافي السنة القادمة | 0 | [[keep|g]] |

    الاحتفاظ يعطي [[keep|g]] دينار، والبيع يعطي [[S|g]] دينار. القرار: [[pick(S >= keep, 'البيع اليوم أفضل', 'الاحتفاظ أفضل')]]. خسارة [[P-S|g]] دينار من قيمة الآلة وقعت فعلا، ولن تسترد بالانتظار.

- id: c06-ex-opportunity
  kind: example
  title: |
    تكلفة الفرصة البديلة
  vars: {rent: 1500, R: 30000, O: 14000}
  random: {rent: [500, 3000, 100], R: [15000, 50000, 1000], O: [5000, 25000, 1000]}
  calc:
    - profit = R - O
    - econ = profit - 12*rent
  text: |
    شركة تملك مستودعا فارغا. تفكر في استخدامه لخط تغليف جديد يعطي إيرادا [[R|g]] دينار سنويا، بتكاليف تشغيل [[O|g]] دينار. المستودع ملك الشركة، فلا إيجار عليه. لكن جارا عرض استئجاره بمبلغ [[rent|g]] دينار شهريا. هل خط التغليف مربح؟
  solution: |
    في الحسابات يبدو الخط رابحا:

    $$
    [[R|g]] - [[O|g]] = [[profit|g]]
    $$

    لكن استخدام المستودع للخط يعني التنازل عن الإيجار. هذا الدخل الضائع تكلفة حقيقية للقرار، اسمها تكلفة الفرصة البديلة:

    $$
    12 \times [[rent|g]] = [[12*rent|g]]
    $$

    الربح الحقيقي للخط:

    $$
    [[profit|g]] - [[12*rent|g]] = [[econ|g]]
    $$

    [[pick(econ > 0, 'الخط أفضل من التأجير.', 'التأجير أفضل من الخط.')]] تكلفة الفرصة البديلة لا تظهر في الدفاتر، لأنها مال لم يدخل وليس مالا خرج. لكنها يجب أن تدخل في كل قرار.

# ------------------------------------------------------------ differential
- id: c06-ex-make-buy
  kind: example
  title: |
    التصنيع أو الشراء
  vars: {Q: 8000, dm: 3.0, dl: 2.5, vo: 1.0, fo: 30000, af: 12000, pb: 8.5}
  random: {Q: [4000, 15000, 500], dm: [2, 4, 0.5], dl: [1.5, 3.5, 0.5], vo: [0.5, 1.5, 0.25], fo: [15000, 45000, 1000], af: [3000, 20000, 1000], pb: [6, 12, 0.5]}
  calc:
    - af = min(af, fo)
    - full = dm + dl + vo + fo/Q
    - make = (dm + dl + vo)*Q + af
    - buy = pb*Q
  text: |
    مصنع أجهزة يصنع قطعة بلاستيكية داخليا، ويحتاج [[Q|g]] قطعة سنويا. تكلفة القطعة: مواد [[dm|d2]] دينار، وعمالة [[dl|d2]] دينار، وتكاليف متغيرة أخرى [[vo|d2]] دينار. ويحمل المحاسب على القطعة نصيبا من التكاليف الثابتة للمصنع مجموعه [[fo|g]] دينار سنويا. مورد يعرض القطعة بسعر [[pb|d2]] دينار. إذا اشترى المصنع القطعة، يوفر [[af|g]] دينار فقط من التكاليف الثابتة، لأن الباقي إيجار وإدارة يستمران. هل يشتري؟
  solution: |
    حسب المحاسب، تكلفة القطعة الكاملة:

    $$
    [[dm|d2]] + [[dl|d2]] + [[vo|d2]] + \frac{[[fo|g]]}{[[Q|g]]} = [[full|2]]
    $$

    [[pick(pb < full, 'سعر المورد أقل منها، فيبدو الشراء أفضل.', 'سعر المورد أعلى منها.')]] لكن المقارنة الصحيحة تشمل فقط التكاليف التي تتغير بين القرارين.

    تكلفة التصنيع التي تختفي إذا اشترينا:

    $$
    ([[dm|d2]] + [[dl|d2]] + [[vo|d2]]) \times [[Q|g]] + [[af|g]] = [[make|2]]
    $$

    تكلفة الشراء:

    $$
    [[pb|d2]] \times [[Q|g]] = [[buy|2]]
    $$

    القرار: [[pick(make <= buy, 'التصنيع أرخص', 'الشراء أرخص')]] بمقدار [[abs(buy - make)|2]] دينار سنويا. التكاليف الثابتة التي تستمر في الحالتين لا تؤثر في القرار، مع أنها موجودة في حساب تكلفة القطعة.

- id: c06-ex-drop-line
  kind: example
  title: |
    إغلاق منتج خاسر
  vars: {S: 120000, V: 80000, Fd: 25000, Fa: 30000}
  random: {S: [60000, 200000, 5000], V: [30000, 150000, 5000], Fd: [5000, 50000, 1000], Fa: [10000, 50000, 1000]}
  calc:
    - V = min(V, S - 5000)
    - loss = S - V - Fd - Fa
    - cm = S - V
    - change = -(cm - Fd)
  text: |
    مصنع مواد تنظيف ينتج عدة منتجات. تقرير منتج سائل الجلي:

    | البند | المبلغ السنوي |
    | --- | --- |
    | المبيعات | [[S|g]] |
    | التكاليف المتغيرة | [[V|g]] |
    | تكاليف ثابتة خاصة بالمنتج، مثل عامل وآلة تعبئة | [[Fd|g]] |
    | نصيبه من تكاليف المصنع العامة | [[Fa|g]] |

    التقرير يظهر نتيجة [[loss|g]] دينار. إذا أغلق المنتج تختفي تكاليفه الخاصة، أما التكاليف العامة فتبقى وتوزع على المنتجات الأخرى. هل يغلقه المصنع؟
  solution: |
    ننظر إلى ما يتغير إذا أغلقنا المنتج:

    - تختفي المبيعات: [[S|g]] دينار.
    - تختفي التكاليف المتغيرة: [[V|g]] دينار.
    - تختفي التكاليف الخاصة: [[Fd|g]] دينار.
    - التكاليف العامة [[Fa|g]] دينار لا تختفي.

    التغير في ربح المصنع:

    $$
    -([[S|g]] - [[V|g]] - [[Fd|g]]) = [[change|g]]
    $$

    [[pick(change < 0, 'الإغلاق يخفض ربح المصنع، فالمنتج يغطي تكاليفه الخاصة ويساهم في التكاليف العامة. لا يغلق.', 'الإغلاق يرفع ربح المصنع، لأن المنتج لا يغطي حتى تكاليفه الخاصة. يغلق.')]]

- id: c06-ex-two-processes
  kind: example
  title: |
    الاختيار بين طريقتين إنتاج
  vars: {F1: 20000, v1: 12, F2: 50000, v2: 7, Q: 8000}
  random: {F1: [10000, 30000, 1000], v1: [10, 16, 1], F2: [35000, 80000, 1000], v2: [4, 9, 1], Q: [2000, 15000, 500]}
  calc:
    - x = (F2 - F1)/(v1 - v2)
    - C1 = F1 + v1*Q
    - C2 = F2 + v2*Q
  text: |
    مصنع يختار بين طريقتين لإنتاج قطعة معدنية. الطريقة اليدوية تكاليفها الثابتة [[F1|g]] دينار سنويا، والمتغيرة [[v1|g]] دينار للقطعة. الطريقة الآلية ثابتها [[F2|g]] دينار، ومتغيرها [[v2|g]] دينار. عند أي كمية تتساوى الطريقتان؟ وأيهما أفضل لإنتاج [[Q|g]] قطعة؟
  solution: |
    نساوي التكلفتين الكليتين:

    $$
    [[F1|g]] + [[v1|g]]\,x = [[F2|g]] + [[v2|g]]\,x
    $$

    $$
    x = \frac{[[F2|g]] - [[F1|g]]}{[[v1|g]] - [[v2|g]]} = [[x|2]]
    $$

    تحت هذه الكمية الطريقة اليدوية أرخص، لأن ثابتها أقل. فوقها الآلية أرخص، لأن متغيرها أقل.

    عند [[Q|g]] قطعة:

    $$
    C_1 = [[C1|g]], \qquad C_2 = [[C2|g]]
    $$

    الأفضل: الطريقة [[pick(C1 <= C2, 'اليدوية', 'الآلية')]].

# ------------------------------------------------------------ life cycle cost
- id: c06-ex-lcc
  kind: example
  title: |
    تكلفة دورة الحياة
  vars: {Ca: 4000, Ea: 1800, Cb: 6500, Eb: 1100, M: 150, i: 0.08}
  random: {Ca: [2000, 6000, 250], Ea: [1200, 2500, 50], Cb: [5000, 9000, 250], Eb: [600, 1400, 50], M: [100, 300, 25], i: [0.05, 0.12, 0.01]}
  calc:
    - Pa = Ca + (Ea + M)*PA(i, 10)
    - Pb = Cb + (Eb + M)*PA(i, 10)
  text: |
    مستشفى يختار بين مكيفين لعمر 10 سنوات. المكيف أ سعره [[Ca|g]] دينار، وكهرباؤه [[Ea|g]] دينار سنويا. المكيف ب سعره [[Cb|g]] دينار، وكهرباؤه [[Eb|g]] دينار سنويا. صيانة كل منهما [[M|g]] دينار سنويا. أيهما أرخص بنسبة [[i|%]]؟
  solution: |
    تكلفة دورة الحياة تجمع كل تكاليف الأصل من الشراء حتى نهاية العمر، بالقيمة الحالية. هذه نفس فكرة القيمة الحالية للتكاليف في الفصل الثالث.

    $$
    LCC_a = [[Ca|g]] + [[Ea+M|g]]\,(P/A,\ [[i|%]],\ 10) = [[Pa|2]]
    $$

    $$
    LCC_b = [[Cb|g]] + [[Eb+M|g]]\,(P/A,\ [[i|%]],\ 10) = [[Pb|2]]
    $$

    الأرخص: المكيف [[pick(Pa <= Pb, 'أ', 'ب')]]. سعر الشراء جزء صغير من تكلفة الحياة. قسم المشتريات الذي يختار الأرخص سعرا قد يختار الأغلى فعلا.

- id: c06-ex-unit-lcc
  kind: example
  title: |
    تكلفة الوحدة على مدى العمر
  vars: {C: 120000, O: 18000, n: 8, i: 0.10, U: 50000}
  random: {C: [50000, 250000, 5000], O: [8000, 40000, 1000], n: [5, 12, 1], i: [0.06, 0.14, 0.01], U: [20000, 100000, 5000]}
  calc:
    - AW = C*AP(i, n) + O
    - u = AW/U
  text: |
    آلة تعبئة تكلف [[C|g]] دينار، وتشغيلها [[O|g]] دينار سنويا، وعمرها [[yrs(n)]]، وتعبئ [[U|g]] عبوة سنويا. ما تكلفة تعبئة العبوة الواحدة بنسبة [[i|%]]؟
  solution: |
    نحول كل التكاليف إلى مبلغ سنوي، ثم نقسم على الإنتاج السنوي:

    $$
    AW = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) + [[O|g]] = [[AW|2]]
    $$

    $$
    \frac{[[AW|2]]}{[[U|g]]} = [[u|f4]]
    $$

    هذا الرقم يشمل استرداد ثمن الآلة مع العائد. إذا عرضت شركة تعبئة خارجية سعرا أقل منه لكل عبوة، فالتعاقد معها أرخص من شراء الآلة.
