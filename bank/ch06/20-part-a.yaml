items:

- id: c06-a-01
  kind: concept
  part: A
  text: |
    ما الفرق بين التكلفة الثابتة والتكلفة المتغيرة؟ أعط مثالا لكل منهما من مصنع ألبان.
  solution: |
    الثابتة لا تتغير مع حجم الإنتاج، مثل إيجار المبنى. المتغيرة تتغير مع كل وحدة، مثل الحليب الخام والعبوات.

- id: c06-a-02
  kind: concept
  part: A
  text: |
    هل الإيجار تكلفة ثابتة دائما؟
  solution: |
    هو ثابت ضمن مدى معين من الإنتاج. إذا زاد الإنتاج كثيرا واحتاجت الشركة مبنى إضافيا، يتغير الإيجار. لذلك نقول ثابتة ضمن مدى ملائم.

- id: c06-a-03
  kind: concept
  part: A
  text: |
    لماذا ينخفض متوسط تكلفة الوحدة كلما زاد الإنتاج؟
  solution: |
    لأن التكاليف الثابتة تتوزع على عدد أكبر من الوحدات، فيقل نصيب كل وحدة منها. التكلفة المتغيرة لكل وحدة لا تتغير.

- id: c06-a-04
  kind: concept
  part: A
  text: |
    ما معنى هامش المساهمة؟ ولماذا سمي بهذا الاسم؟
  solution: |
    هو سعر الوحدة ناقص تكلفتها المتغيرة. سمي كذلك لأن كل وحدة تساهم بهذا المبلغ في تغطية التكاليف الثابتة، ثم في الربح.

- id: c06-a-05
  kind: concept
  part: A
  text: |
    ماذا يحدث لنقطة التعادل إذا ارتفعت التكاليف الثابتة؟ وإذا ارتفع السعر؟
  solution: |
    ارتفاع الثابتة يرفع نقطة التعادل، لأن الهامش يحتاج وحدات أكثر لتغطيتها. ارتفاع السعر يخفضها، لأن هامش كل وحدة يكبر.

- id: c06-a-06
  kind: concept
  part: A
  text: |
    ما التكلفة الغارقة؟ لماذا لا تدخل في القرار؟
  solution: |
    هي مال صرف في الماضي ولا يمكن استرداده. لا تدخل لأن أي قرار اليوم لا يغيرها، فهي نفسها في كل البدائل.

- id: c06-a-07
  kind: concept
  part: A
  text: |
    ما تكلفة الفرصة البديلة؟ لماذا لا تظهر في الدفاتر المحاسبية؟
  solution: |
    هي الدخل الذي نتنازل عنه عندما نستخدم موردا في بديل آخر. لا تظهر في الدفاتر لأنها مال لم يدخل، وليس مالا خرج.

- id: c06-a-08
  kind: concept
  part: A
  text: |
    لماذا نستخدم التكلفة الحدية، وليس متوسط التكلفة، في قرار زيادة الإنتاج؟
  solution: |
    لأن القرار يتعلق بالوحدات الإضافية فقط. متوسط التكلفة يخلط تكاليف الوحدات الحالية، ومنها التكاليف الثابتة التي لا تتغير بالقرار.

- id: c06-a-09
  kind: concept
  part: A
  text: |
    في قرار التصنيع أو الشراء، لماذا لا نطرح كل التكاليف الثابتة المحملة على القطعة؟
  solution: |
    لأن جزءا منها يستمر إذا اشترينا القطعة، مثل إيجار المصنع ورواتب الإدارة. نطرح فقط التكاليف الثابتة التي تختفي فعلا مع القرار.

- id: c06-a-10
  kind: concept
  part: A
  text: |
    ما تكلفة دورة الحياة؟ ولماذا قد يخطئ من يختار الأصل الأرخص سعرا؟
  solution: |
    هي مجموع كل تكاليف الأصل من الشراء حتى نهاية العمر، بالقيمة الحالية. الأصل الأرخص سعرا قد يكون الأغلى تشغيلا وصيانة، فتكلفة حياته أكبر.
