items:

- id: c08-a-01
  kind: concept
  part: A
  text: |
    لماذا يقاس التضخم بسلة من السلع، وليس بسعر سلعة واحدة مثل الخبز؟
  solution: |
    لأن أسعار السلع تتغير بنسب مختلفة، وبعضها ينخفض. السلة تمثل ما تشتريه الأسرة العادية، فتقيس التغير العام في تكلفة المعيشة.

- id: c08-a-02
  kind: concept
  part: A
  text: |
    ما الفرق بين الدينار الفعلي والدينار الثابت؟
  solution: |
    الفعلي هو المبلغ الذي يدفع فعلا في سنته. الثابت هو نفس المبلغ مقاسا بقوة شراء سنة الأساس، أي بعد إزالة أثر التضخم.

- id: c08-a-03
  kind: concept
  part: A
  text: |
    بنك يعلن فائدة 9% على الودائع. هل هذه نسبة حقيقية أم سوقية؟ ولماذا؟
  solution: |
    سوقية. البنك يدفع دنانير فعلية، والنسبة تتضمن تعويضا عن التضخم المتوقع.

- id: c08-a-04
  kind: concept
  part: A
  text: |
    محلل قدر وفر مشروع بأسعار اليوم، ثم خصمه بالنسبة السوقية. هل تكون القيمة الحالية أعلى أم أقل من الصحيح؟
  solution: |
    أقل. الوفر بأسعار اليوم لا يتضمن التضخم، والنسبة السوقية تخصم التضخم. فيطرح التضخم مرة دون أن يضاف، ويرفض مشاريع جيدة.

- id: c08-a-05
  kind: concept
  part: A
  text: |
    عقد إيجار بمبلغ سنوي ثابت لمدة 10 سنوات. بأي نسبة نخصمه؟
  solution: |
    بالنسبة السوقية، لأن المبلغ ثابت بالدينار الفعلي. أو نحوله إلى دينار ثابت سنة بسنة ثم نخصمه بالنسبة الحقيقية.

- id: c08-a-06
  kind: concept
  part: A
  text: |
    مشروع يرتفع إيراده وتكاليفه مع التضخم بالضبط. لماذا تنخفض قيمته الحالية بعد الضريبة مع التضخم؟
  solution: |
    لأن الاستهلاك محسوب على الثمن الأصلي ولا يرتفع مع الأسعار. وفره الضريبي يفقد قوة شرائه، فترتفع الضريبة الحقيقية.

- id: c08-a-07
  kind: concept
  part: A
  text: |
    من يستفيد من تضخم غير متوقع: المقترض بفائدة ثابتة أم المقرض؟
  solution: |
    المقترض. يرد دنانير قيمتها الحقيقية أقل من التي اقترضها. أما المقرض فيخسر جزءا من قوة شراء ماله.

- id: c08-a-08
  kind: concept
  part: A
  text: |
    معدل العائد الداخلي لمشروع بالدينار الفعلي 18%. هل معدله الحقيقي أعلى أم أقل؟ وكيف تحسبه؟
  solution: |
    أقل. نزيل التضخم من المعدل بنفس علاقة النسب:

    $$
    1 + IRR_r = \frac{1 + IRR_m}{1 + f}
    $$

- id: c08-a-09
  kind: concept
  part: A
  text: |
    كان التضخم 2% ثم 10% ثم 6%. لماذا لا يكون متوسطه 6% بالضبط؟
  solution: |
    لأن الأسعار تتضاعف ولا تجمع. المتوسط الصحيح هو النسبة الثابتة التي تعطي نفس الزيادة الكلية، وهي أقل قليلا من المتوسط الحسابي.

- id: c08-a-10
  kind: concept
  part: A
  text: |
    قدر مهندس أن الآلة تباع بعد 5 سنوات بمبلغ 8,000 دينار، بالاعتماد على أسعار الآلات المستعملة اليوم. هل هذا مبلغ فعلي أم ثابت؟
  solution: |
    ثابت، لأنه مبني على أسعار اليوم. إذا أردت الدينار الفعلي، ارفعه بالتضخم خمس سنوات.

- id: c08-a-11
  kind: concept
  part: A
  text: |
    ماذا يحدث للنسبة الحقيقية إذا انخفضت الأسعار، أي كان التضخم سالبا؟
  solution: |
    تصبح أعلى من النسبة السوقية. الدينار المدخر ينمو بالفائدة، ويشتري أكثر أيضا لأن الأسعار انخفضت.

- id: c08-a-12
  kind: concept
  part: A
  text: |
    مشروع إيراده بالدولار. لماذا نحول إيراد كل سنة بسعر الصرف المتوقع في تلك السنة، وليس بسعر اليوم؟
  solution: |
    لأن الشركة تقبض الدولارات في تلك السنة وتحولها بسعرها. استخدام سعر اليوم يتجاهل خطر تغير الصرف، أو يتطلب نسبة خصم بالدولار وليس بالدينار.
