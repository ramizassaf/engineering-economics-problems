- id: c08-f-01
  kind: problem
  part: F
  vars: {C: 80000, n: 5, t: 0.20, ir: 0.06, f: 0.07}
  random: {C: [20000, 200000, 5000], n: [3, 10, 1], t: [0.15, 0.30, 0.01], ir: [0.03, 0.10, 0.005], f: [0.01, 0.15, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - S = t*C/n
    - P0 = S*PA(ir, n)
    - P1 = S*PA(im, n)
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]]. نسبة الضريبة [[t|%]]، والحد الأدنى الحقيقي [[ir|%]]. ما القيمة الحالية للوفر الضريبي بدون تضخم؟ وبتضخم [[f|%]]؟
  solution: |
    الوفر السنوي [[S|2]] دينار فعلي، لا يتغير مع الأسعار.

    بدون تضخم النسبة السوقية تساوي الحقيقية:

    $$
    [[S|2]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[P0|2]]
    $$

    مع التضخم نخصم بالنسبة السوقية [[im|%2]]:

    $$
    [[S|2]]\,(P/A,\ [[im|%2]],\ [[n|n]]) = [[P1|2]]
    $$

    التضخم أخذ [[P0-P1|2]] دينار من قيمة الوفر، أي [[1-P1/P0|%2]].

- id: c08-f-02
  kind: problem
  part: F
  vars: {C: 60000, X: 28000, t: 0.20, f: 0.08, im: 0.14}
  random: {C: [20000, 120000, 5000], X: [10000, 60000, 1000], t: [0.15, 0.30, 0.01], f: [0.02, 0.12, 0.005], im: [0.08, 0.18, 0.005]}
  calc:
    - D = C/3
    - x1 = X*(1 + f)
    - x2 = X*(1 + f)**2
    - x3 = X*(1 + f)**3
    - c1 = (x1 - D)*(1 - t) + D
    - c2 = (x2 - D)*(1 - t) + D
    - c3 = (x3 - D)*(1 - t) + D
    - PW = NPV(im, [-C, c1, c2, c3])
  text: |
    مشروع لمدة 3 سنوات. الآلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت بدون قيمة بيع. ربح التشغيل قبل الاستهلاك والضريبة [[X|g]] دينار بأسعار اليوم، ويرتفع مع التضخم [[f|%]]. نسبة الضريبة [[t|%]]، والحد الأدنى السوقي [[im|%]]. ابن الجدول بالدينار الفعلي، واحسب القيمة الحالية.
  solution: |
    الاستهلاك [[D|2]] دينار فعلي كل سنة.

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | ربح التشغيل | [[x1|0]] | [[x2|0]] | [[x3|0]] |
    | الاستهلاك | [[-D|0]] | [[-D|0]] | [[-D|0]] |
    | الدخل الخاضع | [[x1-D|0]] | [[x2-D|0]] | [[x3-D|0]] |
    | الضريبة | [[-t*(x1-D)|0]] | [[-t*(x2-D)|0]] | [[-t*(x3-D)|0]] |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] |

    $$
    PW = [[PW|2]]
    $$

    الدخل الخاضع يرتفع أسرع من التضخم، لأن الاستهلاك ثابت. لذلك ترتفع الضريبة الحقيقية مع الزمن.

- id: c08-f-03
  kind: problem
  part: F
  vars: {C: 60000, X: 28000, t: 0.20, f: 0.08}
  random: {C: [20000, 120000, 5000], t: [0.15, 0.30, 0.01], f: [0.02, 0.12, 0.005], X: [10000, 60000, 1000]}
  calc:
    - X = ceil(C*0.45/1000)*1000
    - D = C/3
    - c1 = (X*(1 + f) - D)*(1 - t) + D
    - c2 = (X*(1 + f)**2 - D)*(1 - t) + D
    - c3 = (X*(1 + f)**3 - D)*(1 - t) + D
    - rm = IRR([-C, c1, c2, c3])
    - rr = (1 + rm)/(1 + f) - 1
    - r0 = IRR([-C, X*(1 - t) + t*D, X*(1 - t) + t*D, X*(1 - t) + t*D])
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على 3 سنوات. ربح التشغيل قبل الاستهلاك والضريبة [[X|g]] دينار بأسعار اليوم. نسبة الضريبة [[t|%]]. ما المعدل الحقيقي بعد الضريبة بدون تضخم؟ وبتضخم [[f|%]]؟
  solution: |
    بدون تضخم، التدفق ثابت [[X*(1-t)+t*D|2]] دينار، والمعدل [[r0|%2]].

    مع التضخم، التدفقات الفعلية [[c1|0]] ثم [[c2|0]] ثم [[c3|0]] دينار. معدلها:

    ```excel
    =IRR(A1:D1)
    ```

    المعدل السوقي [[rm|%2]]. الحقيقي:

    $$
    \frac{1 + [[rm|f4]]}{1 + [[f|r]]} - 1 = [[rr|%2]]
    $$

    المعدل الحقيقي انخفض [[r0-rr|%2]] نقطة مئوية بسبب التضخم وحده.

- id: c08-f-04
  kind: problem
  part: F
  vars: {r: 0.09, t: 0.20, f: 0.06}
  random: {r: [0.04, 0.15, 0.005], t: [0.15, 0.30, 0.01], f: [0.01, 0.12, 0.005]}
  calc:
    - ra = r*(1 - t)
    - rr = (1 + ra)/(1 + f) - 1
  text: |
    شركة رابحة تقترض بفائدة ثابتة [[r|%]]. نسبة الضريبة [[t|%]]، والتضخم [[f|%]]. ما التكلفة الحقيقية للقرض بعد الضريبة؟
  solution: |
    بعد الضريبة:

    $$
    [[r|r]] \times (1 - [[t|r]]) = [[ra|%2]]
    $$

    حقيقيا:

    $$
    \frac{1 + [[ra|f4]]}{1 + [[f|r]]} - 1 = [[rr|%2]]
    $$

    [[pick(rr < 0, 'التكلفة سالبة: الضريبة والتضخم معا يجعلان القرض مربحا للشركة.', 'الضريبة والتضخم معا يخفضان تكلفة القرض كثيرا.')]]

- id: c08-f-05
  kind: problem
  part: F
  vars: {L: 40000, r: 0.08, f: 0.07}
  random: {L: [5000, 100000, 1000], r: [0.04, 0.14, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - A = L*AP(r, 4)
    - q1 = A/(1 + f)
    - q2 = A/(1 + f)**2
    - q3 = A/(1 + f)**3
    - q4 = A/(1 + f)**4
    - Q = q1 + q2 + q3 + q4
  text: |
    قرض [[L|g]] دينار بفائدة ثابتة [[r|%]] على 4 أقساط سنوية متساوية. التضخم [[f|%]]. ما قيمة كل قسط بأسعار يوم القرض؟ وما مجموعها؟
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ 4) = [[A|2]]
    $$

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | بأسعار يوم القرض | [[q1|0]] | [[q2|0]] | [[q3|0]] | [[q4|0]] |

    المجموع [[Q|2]] دينار بأسعار يوم القرض، مقابل [[4*A|2]] دينار فعلي.

- id: c08-f-06
  kind: problem
  part: F
  vars: {L: 50000, r: 0.06, n: 5, im: 0.12}
  random: {L: [10000, 150000, 5000], r: [0.02, 0.08, 0.005], n: [3, 10, 1], im: [0.09, 0.16, 0.005]}
  calc:
    - A = L*AP(r, n)
    - G = L - A*PA(im, n)
  text: |
    حكومة تعطي قرضا مدعوما لمشاريع الطاقة: [[L|g]] دينار بفائدة [[r|%]] على [[yrs(n)]]، بأقساط ثابتة. الحد الأدنى السوقي للشركة [[im|%]]. كم يساوي الدعم بالقيمة الحالية؟
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    الأقساط ثابتة بالدينار الفعلي، فنخصمها بالنسبة السوقية:

    $$
    [[L|g]] - [[A|2]]\,(P/A,\ [[im|%]],\ [[n|n]]) = [[G|2]]
    $$

    الشركة تكسب [[G|2]] دينار اليوم من القرض المدعوم.

- id: c08-f-07
  kind: problem
  part: F
  vars: {r: 0.07, t: 0.10, f: 0.05}
  random: {r: [0.03, 0.14, 0.005], t: [0.05, 0.20, 0.01], f: [0.01, 0.12, 0.005]}
  calc:
    - ra = r*(1 - t)
    - rr = (1 + ra)/(1 + f) - 1
  text: |
    وديعة بفائدة [[r|%]]، وتخضع الفائدة لضريبة [[t|%]]. التضخم [[f|%]]. ما العائد الحقيقي بعد الضريبة؟
  solution: |
    $$
    [[r|r]] \times (1 - [[t|r]]) = [[ra|%2]]
    $$

    $$
    \frac{1 + [[ra|f4]]}{1 + [[f|r]]} - 1 = [[rr|%2]]
    $$

    الضريبة تؤخذ على كل الفائدة، ومنها الجزء الذي يعوض التضخم فقط. لذلك يدفع المدخر ضريبة على ربح ليس حقيقيا.

- id: c08-f-08
  kind: problem
  part: F
  vars: {C: 100000, f: 0.06, n: 8, t: 0.15}
  random: {C: [20000, 300000, 5000], f: [0.02, 0.12, 0.005], n: [3, 15, 1], t: [0.10, 0.25, 0.01]}
  calc:
    - M = C*FP(f, n)
    - T = t*(M - C)
    - N = M - T
    - R = N*PF(f, n)
  text: |
    شركة اشترت أرضا بمبلغ [[C|g]] دينار، وباعتها بعد [[yrs(n)]]. سعرها ارتفع مع التضخم [[f|%]] فقط. الضريبة على ربح البيع [[t|%]]. ما صافي البيع بأسعار يوم الشراء؟
  solution: |
    سعر البيع:

    $$
    [[C|g]]\,(F/P,\ [[f|%]],\ [[n|n]]) = [[M|2]]
    $$

    الضريبة على الربح الاسمي:

    $$
    [[t|r]] \times ([[M|2]] - [[C|g]]) = [[T|2]]
    $$

    صافي البيع [[N|2]] دينار فعلي، وبأسعار يوم الشراء:

    $$
    [[N|2]]\,(P/F,\ [[f|%]],\ [[n|n]]) = [[R|2]]
    $$

    الشركة خسرت [[C-R|2]] دينار من قوة شرائها، مع أنها دفعت ضريبة على ربح.

- id: c08-f-09
  kind: problem
  part: F
  vars: {W: 20000, f: 0.08}
  random: {W: [5000, 60000, 1000], f: [0.02, 0.15, 0.005]}
  calc:
    - W1 = W*(1 + f)
    - W2 = W*(1 + f)**2
    - W3 = W*(1 + f)**3
  text: |
    مشروع لمدة 3 سنوات يحتاج مخزونا قيمته [[W|g]] دينار بأسعار اليوم. قيمة المخزون ترتفع مع التضخم [[f|%]]، ويجب أن يكون الرصيد جاهزا في بداية كل سنة. ما تدفقات رأس المال العامل بالدينار الفعلي؟
  solution: |
    الرصيد المطلوب في بداية السنوات 1 و2 و3: [[W|0]] ثم [[W1|0]] ثم [[W2|0]] دينار. في النهاية يسترد المخزون بأسعار السنة 3، [[W3|0]] دينار.

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | التدفق | [[-W|0]] | [[-(W1-W)|0]] | [[-(W2-W1)|0]] | [[W2|0]] |

    في السنة 3 يعود الرصيد كما هو، [[W2|0]] دينار. التضخم يجبر المشروع على استثمار إضافي كل سنة لمجرد الحفاظ على نفس كمية المخزون.

- id: c08-f-10
  kind: problem
  part: F
  vars: {A: 900, n: 20, f: 0.05}
  random: {A: [300, 3000, 50], n: [10, 25, 1], f: [0.02, 0.10, 0.005]}
  calc:
    - R = A/(1 + f)**n
    - x = 1 - PF(f, n)
  text: |
    موظف متقاعد يحصل على راتب تقاعدي ثابت [[A|g]] دينار شهريا، لا يرتفع مع الأسعار. التضخم [[f|%]] سنويا. كم يساوي راتبه بعد [[yrs(n)]] بأسعار اليوم؟
  solution: |
    $$
    \frac{[[A|g]]}{(1 + [[f|r]])^{[[n|n]]}} = [[R|2]]
    $$

    يفقد [[x|%2]] من قوة شرائه. لذلك تربط أنظمة التقاعد الجيدة الرواتب بمؤشر الأسعار.

- id: c08-f-11
  kind: problem
  part: F
  vars: {L: 30000, r: 0.10, f: 0.06, ir: 0.04}
  random: {L: [5000, 100000, 1000], r: [0.04, 0.14, 0.005], f: [0.02, 0.12, 0.005], ir: [0.02, 0.08, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - A = L*AP(r, 3)
    - G = L - A*PA(im, 3)
  text: |
    بنك أقرض [[L|g]] دينار بفائدة ثابتة [[r|%]] على 3 أقساط متساوية. البنك يريد عائدا حقيقيا [[ir|%]]. التضخم جاء [[f|%]]. هل حقق البنك هدفه؟
  solution: |
    النسبة السوقية التي يحتاجها البنك:

    $$
    i = (1 + [[ir|r]])(1 + [[f|r]]) - 1 = [[im|%2]]
    $$

    القسط [[A|2]] دينار. قيمة القرض للبنك:

    $$
    -[[L|g]] + [[A|2]]\,(P/A,\ [[im|%2]],\ 3) = [[-G|2]]
    $$

    [[pick(G <= 0, 'القيمة موجبة: البنك حقق أكثر من هدفه.', 'القيمة سالبة: البنك لم يحقق هدفه، لأن التضخم أعلى مما بنى عليه الفائدة.')]]

- id: c08-f-12
  kind: problem
  part: F
  vars: {C: 100000, t: 0.20, ir: 0.06, f: 0.08}
  random: {C: [20000, 200000, 5000], t: [0.15, 0.30, 0.01], ir: [0.03, 0.10, 0.005], f: [0.02, 0.15, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - s0 = t*C/4*PA(ir, 4)
    - s1 = t*C/4*PA(im, 4)
    - d0 = t*C*(0.5*PF(ir, 1) + 0.25*PF(ir, 2) + 0.125*PF(ir, 3) + 0.125*PF(ir, 4))
    - d1 = t*C*(0.5*PF(im, 1) + 0.25*PF(im, 2) + 0.125*PF(im, 3) + 0.125*PF(im, 4))
  text: |
    آلة تكلف [[C|g]] دينار، وعمرها الضريبي 4 سنوات. نسبة الضريبة [[t|%]]، والحد الأدنى الحقيقي [[ir|%]]، والتضخم [[f|%]]. قارن خسارة الوفر الضريبي بسبب التضخم بالقسط الثابت والمتناقص المضاعف مع التحول.
  solution: |
    نخصم الوفر بالنسبة الحقيقية لو لم يكن تضخم، وبالنسبة السوقية [[im|%2]] مع التضخم:

    | الطريقة | بدون تضخم | مع التضخم | الخسارة |
    | --- | --- | --- | --- |
    | القسط الثابت | [[s0|2]] | [[s1|2]] | [[s0-s1|2]] |
    | المتناقص المضاعف | [[d0|2]] | [[d1|2]] | [[d0-d1|2]] |

    الطريقة الأسرع تخسر أقل، لأن وفرها يأتي قبل أن يأكل التضخم قيمته.
