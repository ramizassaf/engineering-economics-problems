- id: c08-j-01
  kind: case
  part: J
  calc:
    - im = 1.07*1.06 - 1
    - D = 120000/5
    - x1 = 70000*1.06 - 15000*1.10 - 18000*1.05
    - x2 = 70000*1.06**2 - 15000*1.10**2 - 18000*1.05**2
    - x3 = 70000*1.06**3 - 15000*1.10**3 - 18000*1.05**3
    - x4 = 70000*1.06**4 - 15000*1.10**4 - 18000*1.05**4
    - x5 = 70000*1.06**5 - 15000*1.10**5 - 18000*1.05**5
    - M = 20000*1.06**5
    - c1 = (x1 - D)*0.85 + D
    - c2 = (x2 - D)*0.85 + D
    - c3 = (x3 - D)*0.85 + D
    - c4 = (x4 - D)*0.85 + D
    - c5 = (x5 - D)*0.85 + D + M*0.85
    - PW = NPV(im, [-120000, c1, c2, c3, c4, c5])
    - c0 = (70000 - 15000 - 18000 - D)*0.85 + D
    - PW0 = -120000 + c0*PA(0.07, 5) + 20000*0.85*PF(0.07, 5)
  text: |
    **حالة 8.1: مخزن تبريد لمصنع ألبان**

    مصنع ألبان يدرس بناء مخزن تبريد يكلف 120,000 دينار، لمدة 5 سنوات. البيانات بأسعار اليوم:

    | البند | المبلغ | الارتفاع السنوي |
    | --- | --- | --- |
    | الإيراد الإضافي | 70,000 | 6% مع التضخم |
    | الكهرباء | 15,000 | 10% |
    | الأجور | 18,000 | 5% |
    | البيع في النهاية | 20,000 | 6% مع التضخم |

    الاستهلاك بالقسط الثابت على 5 سنوات بدون قيمة بيع ضريبية. نسبة الضريبة 15%، والحد الأدنى الحقيقي 7%.

    (أ) ما الحد الأدنى السوقي؟ (ب) ابن جدول التدفقات بالدينار الفعلي. (ج) احسب القيمة الحالية. (د) احسبها بدون تضخم، وفسر الفرق.
  solution: |
    (أ)

    $$
    i = 1.07 \times 1.06 - 1 = [[im|%2]]
    $$

    (ب) الاستهلاك [[D|g]] دينار فعلي كل سنة. ربح التشغيل قبل الاستهلاك والضريبة هو الإيراد ناقص الكهرباء والأجور، كل منها بنسبته:

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | ربح التشغيل | [[x1|0]] | [[x2|0]] | [[x3|0]] | [[x4|0]] | [[x5|0]] |
    | الدخل الخاضع | [[x1-D|0]] | [[x2-D|0]] | [[x3-D|0]] | [[x4-D|0]] | [[x5-D|0]] |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] | [[c4|0]] | [[c5|0]] |

    في السنة 5 يباع المخزن بمبلغ [[M|0]] دينار فعلي، وكله ربح خاضع، فصافيه [[M*0.85|0]] دينار، وهو داخل في تدفق السنة 5.

    (ج)

    $$
    PW = [[PW|2]]
    $$

    (د) بدون تضخم كل البنود ثابتة:

    $$
    PW_0 = [[PW0|2]]
    $$

    الفرق [[PW0-PW|2]] دينار. سببه أمران: الكهرباء ترتفع أسرع من الإيراد، والاستهلاك لا يرتفع مع الأسعار.

- id: c08-j-02
  kind: case
  part: J
  calc:
    - F = 30000*1.05**6
    - A = F*AF(0.08, 6)
    - ir = 1.08/1.05 - 1
    - Ar = 30000*AF(ir, 6)
    - A1 = Ar*1.05
    - A6 = Ar*1.05**6
  text: |
    **حالة 8.2: مهندس يدخر لدفعة أولى لشقة**

    مهندس حديث التخرج يريد شراء شقة بعد 6 سنوات. الدفعة الأولى اليوم 30,000 دينار، وأسعار الشقق ترتفع مع التضخم 5% سنويا. البنك يعطي 8% على الادخار. راتبه يرتفع مع التضخم تقريبا.

    (أ) كم تكون الدفعة الأولى بعد 6 سنوات؟ (ب) كم يودع سنويا بمبلغ ثابت؟ (ج) إذا رفع إيداعه مع التضخم كل سنة، كم يودع في السنة الأولى والأخيرة؟ (د) أي الخطتين أنسب له؟
  solution: |
    (أ)

    $$
    30{,}000\,(F/P,\ 5\%,\ 6) = [[F|2]]
    $$

    (ب)

    $$
    [[F|2]]\,(A/F,\ 8\%,\ 6) = [[A|2]]
    $$

    (ج) النسبة الحقيقية:

    $$
    i' = \frac{1.08}{1.05} - 1 = [[ir|%2]]
    $$

    بالدينار الثابت:

    $$
    30{,}000\,(A/F,\ [[ir|%2]],\ 6) = [[Ar|2]]
    $$

    فعليا يودع [[A1|2]] دينار في السنة الأولى، و[[A6|2]] دينار في السنة السادسة.

    (د) الخطة الثانية تبدأ أقل وتنتهي أعلى. راتبه يرتفع مع التضخم، فالإيداع المتزايد يأخذ نفس النسبة من راتبه كل سنة تقريبا. الخطة الأولى أثقل في البداية، حين يكون راتبه أقل.

- id: c08-j-03
  kind: case
  part: J
  calc:
    - im = 0.12
    - e1 = 0.71*1.02
    - Pl = 68000 + 9000*1.08*PGEO(0.08, 0.12, 6)
    - Pm = NPV(0.12, [0, 2000*0.71*1.02, 2000*0.71*1.02**2, 2000*0.71*1.02**3, 2000*0.71*1.02**4, 2000*0.71*1.02**5, 2000*0.71*1.02**6])
    - Pi = 90000*0.71 + 6000*1.08*PGEO(0.08, 0.12, 6) + Pm
  text: |
    **حالة 8.3: آلة تغليف محلية أم مستوردة**

    مصنع حلويات يختار بين آلتي تغليف لمدة 6 سنوات، بدون قيمة بيع:

    | البند | المحلية | المستوردة |
    | --- | --- | --- |
    | الثمن | 68,000 دينار | 90,000 دولار |
    | الطاقة بأسعار اليوم | 9,000 دينار | 6,000 دينار |
    | عقد الصيانة السنوي | ضمن الثمن | 2,000 دولار ثابتة |

    أسعار الطاقة ترتفع 8% سنويا. سعر الصرف 0.71 دينار للدولار، ويتوقع أن يرتفع الدولار 2% سنويا. الحد الأدنى السوقي 12% بالدينار. تجاهل الضريبة.

    (أ) احسب القيمة الحالية لتكاليف المحلية. (ب) احسبها للمستوردة. (ج) أيهما أرخص؟ وما الخطر الذي لا تظهره الأرقام؟
  solution: |
    (أ) الطاقة في السنة الأولى 9,000 ضرب 1.08، أي [[9000*1.08|g]] دينار، وترتفع 8%:

    $$
    PW_{local} = 68{,}000 + [[9000*1.08|g]]\,(P/A_1,\ 8\%,\ 12\%,\ 6) = [[Pl|2]]
    $$

    (ب) الثمن بسعر اليوم [[90000*0.71|g]] دينار. الطاقة [[6000*1.08|g]] دينار في السنة الأولى وترتفع 8%. الصيانة 2,000 دولار، تتحول بسعر صرف كل سنة، فقيمتها الحالية [[Pm|2]] دينار.

    $$
    PW_{import} = [[90000*0.71|g]] + [[6000*1.08|g]]\,(P/A_1,\ 8\%,\ 12\%,\ 6) + [[Pm|2]] = [[Pi|2]]
    $$

    (ج) الأرخص: [[pick(Pl <= Pi, 'المحلية', 'المستوردة')]]، بفرق [[abs(Pl-Pi)|2]] دينار. الأرقام لا تظهر خطر الصرف في عقد الصيانة، ولا صعوبة قطع الغيار المستوردة وزمن انتظارها. يستحق القرار تحليل حساسية على سعر الصرف ونسبة ارتفاع الطاقة.
