- id: c08-h-01
  kind: problem
  part: H
  vars: {C: 50000, f: 0.05, ir: 0.06}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - r1 = 12000/(1 + f)
    - r2 = 13000/(1 + f)**2
    - r3 = 14500/(1 + f)**3
    - r4 = 15000/(1 + f)**4
    - r5 = 16500/(1 + f)**5
    - Pr = NPV(ir, [-C, r1, r2, r3, r4, r5])
    - Pm = NPV(im, [-C, 12000, 13000, 14500, 15000, 16500])
  text: |
    مشروع يكلف 50,000 دينار، وتدفقاته الفعلية في السنوات 1 إلى 5: 12,000 و13,000 و14,500 و15,000 و16,500 دينار. التضخم 5%، والحد الأدنى الحقيقي 6%. ابن في Excel صفا بالتدفقات بالدينار الثابت، واحسب القيمة الحالية بالطريقتين.
  solution: |
    التضخم في B1، والحد الأدنى الحقيقي في B2. السنوات في الصف 3 من C3 إلى G3، والتدفقات الفعلية في الصف 4. في الصف 5 بالدينار الثابت:

    ```excel
    C5 =C4/(1+$B$1)^C3
    ```

    القيمة الحالية بالطريقتين:

    ```excel
    =-50000 + NPV($B$2, C5:G5)
    =-50000 + NPV((1+$B$2)*(1+$B$1)-1, C4:G4)
    ```

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | بالدينار الثابت | [[r1|2]] | [[r2|2]] | [[r3|2]] | [[r4|2]] | [[r5|2]] |

    القيمة الحالية [[Pr|2]] دينار بالطريقتين.

- id: c08-h-02
  kind: problem
  part: H
  vars: {C: 100000, X: 35000, n: 5, t: 0.20, ir: 0.08}
  calc:
    - D = C/n
    - p0 = -C + X*(1 - t)*PA(ir, n) + t*D*PA(ir, n)
    - p3 = -C + X*(1 - t)*PA(ir, n) + t*D*PA((1 + ir)*1.03 - 1, n)
    - p6 = -C + X*(1 - t)*PA(ir, n) + t*D*PA((1 + ir)*1.06 - 1, n)
    - p9 = -C + X*(1 - t)*PA(ir, n) + t*D*PA((1 + ir)*1.09 - 1, n)
    - p12 = -C + X*(1 - t)*PA(ir, n) + t*D*PA((1 + ir)*1.12 - 1, n)
  text: |
    اكتب في Python برنامجا يحسب القيمة الحالية لمشروع مثال التضخم والضريبة في هذا الفصل، بأرقامه الأصلية، عند تضخم 0% و3% و6% و9% و12%.
  solution: |
    ```python
    import numpy_financial as npf

    C, X, n, t, ir = 100000, 35000, 5, 0.20, 0.08
    D = C / n
    for f in [0, 0.03, 0.06, 0.09, 0.12]:
        im = (1 + ir) * (1 + f) - 1
        flows = [-C] + [(X * (1 + f) ** k - D) * (1 - t) + D for k in range(1, n + 1)]
        print(f"{f:4.0%}  {npf.npv(im, flows):10,.2f}")
    ```

    | التضخم | 0% | 3% | 6% | 9% | 12% |
    | --- | --- | --- | --- | --- | --- |
    | القيمة الحالية | [[p0|2]] | [[p3|2]] | [[p6|2]] | [[p9|2]] | [[p12|2]] |

    البرنامج يبني التدفقات بالدينار الفعلي ويخصمها بالنسبة السوقية. النتيجة تساوي حساب المثال بالطريقة المختصرة.

- id: c08-h-03
  kind: problem
  part: H
  calc:
    - g1 = 103.2/100 - 1
    - g2 = 108.9/103.2 - 1
    - g3 = 112.0/108.9 - 1
    - g4 = 118.5/112.0 - 1
    - g5 = 121.3/118.5 - 1
    - fa = (121.3/100)**(1/5) - 1
  text: |
    مؤشر الأسعار في 6 سنوات متتالية: 100 و103.2 و108.9 و112.0 و118.5 و121.3. اكتب في Python برنامجا يحسب التضخم في كل سنة، ومتوسطه الهندسي.
  solution: |
    ```python
    index = [100, 103.2, 108.9, 112.0, 118.5, 121.3]
    rates = [b / a - 1 for a, b in zip(index, index[1:])]
    avg = (index[-1] / index[0]) ** (1 / (len(index) - 1)) - 1
    print([f"{r:.2%}" for r in rates], f"{avg:.2%}")
    ```

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | التضخم | [[g1|%2]] | [[g2|%2]] | [[g3|%2]] | [[g4|%2]] | [[g5|%2]] |

    المتوسط [[fa|%2]].

