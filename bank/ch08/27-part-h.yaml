- id: c08-h-05
  kind: problem
  part: H
  calc:
    - a1 = 10000*1.06
    - a2 = 10000*1.06**2
    - a3 = 10000*1.06**3
  text: |
    اكتب في Python دالتين: الأولى تحول قائمة تدفقات من دينار ثابت إلى فعلي، والثانية تعكسها. جربهما على تدفقات ثابتة 10,000 دينار لثلاث سنوات بتضخم 6%.
  solution: |
    ```python
    def to_actual(real, f):
        return [r * (1 + f) ** k for k, r in enumerate(real, start=1)]

    def to_real(actual, f):
        return [a / (1 + f) ** k for k, a in enumerate(actual, start=1)]

    act = to_actual([10000, 10000, 10000], 0.06)
    print([round(a, 2) for a in act])
    print([round(r, 2) for r in to_real(act, 0.06)])
    ```

    الفعلي: [[a1|2]] و[[a2|2]] و[[a3|2]] دينار. والدالة الثانية تعيد 10,000 دينار لكل سنة.

- id: c08-h-06
  kind: problem
  part: H
  calc:
    - c1 = 60000*1.05 - 18000*1.10 - 12000*1.04
    - c2 = 60000*1.05**2 - 18000*1.10**2 - 12000*1.04**2
    - c3 = 60000*1.05**3 - 18000*1.10**3 - 12000*1.04**3
    - c4 = 60000*1.05**4 - 18000*1.10**4 - 12000*1.04**4
    - P = NPV(0.13, [-70000, c1, c2, c3, c4])
  text: |
    ابن في Excel جدولا لمشروع لمدة 4 سنوات يكلف 70,000 دينار. بأسعار اليوم: الإيراد 60,000 دينار ويرتفع 5% سنويا، والطاقة 18,000 دينار وترتفع 10%، والأجور 12,000 دينار وترتفع 4%. الحد الأدنى السوقي 13%. ضع كل نسبة في خلية مستقلة.
  solution: |
    المبالغ بأسعار اليوم في B2:B4، ونسب الارتفاع في C2:C4، والسنوات في الصف 1 من D1 إلى G1. صيغة الإيراد في السنة الأولى، وتنسخ يمينا ولأسفل:

    ```excel
    D2 =$B2*(1+$C2)^D$1
    D5 =D2 - D3 - D4
    =-70000 + NPV(13%, D5:G5)
    ```

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | صافي التدفق | [[c1|2]] | [[c2|2]] | [[c3|2]] | [[c4|2]] |

    القيمة الحالية [[P|2]] دينار.

- id: c08-h-07
  kind: problem
  part: H
  calc:
    - q1 = NPV(0.12, [-70000*0.71, 40000*0.71*0.96 - 9000, 40000*0.71*0.96**2 - 9000, 40000*0.71*0.96**3 - 9000])
    - q2 = NPV(0.12, [-70000*0.71, 40000*0.71*0.98 - 9000, 40000*0.71*0.98**2 - 9000, 40000*0.71*0.98**3 - 9000])
    - q3 = NPV(0.12, [-70000*0.71, 40000*0.71 - 9000, 40000*0.71 - 9000, 40000*0.71 - 9000])
    - q4 = NPV(0.12, [-70000*0.71, 40000*0.71*1.02 - 9000, 40000*0.71*1.02**2 - 9000, 40000*0.71*1.02**3 - 9000])
    - q5 = NPV(0.12, [-70000*0.71, 40000*0.71*1.04 - 9000, 40000*0.71*1.04**2 - 9000, 40000*0.71*1.04**3 - 9000])
  text: |
    مشروع يكلف 70,000 دولار، ويعطي 40,000 دولار سنويا لمدة 3 سنوات، وتكاليفه 9,000 دينار سنويا. سعر الصرف اليوم 0.71 دينار للدولار. الحد الأدنى 12% بالدينار. اكتب في Python برنامجا يحسب القيمة الحالية بالدينار لتغير سنوي في الدولار من -4% إلى +4% بخطوة 2%.
  solution: |
    ```python
    import numpy_financial as npf

    e0, i = 0.71, 0.12
    for d in [-0.04, -0.02, 0, 0.02, 0.04]:
        flows = [-70000 * e0] + [40000 * e0 * (1 + d) ** k - 9000 for k in (1, 2, 3)]
        print(f"{d:+.0%}  {npf.npv(i, flows):10,.2f}")
    ```

    | تغير الدولار | -4% | -2% | 0% | +2% | +4% |
    | --- | --- | --- | --- | --- | --- |
    | القيمة الحالية | [[q1|2]] | [[q2|2]] | [[q3|2]] | [[q4|2]] | [[q5|2]] |

    الثمن بالدولار يدفع اليوم، فيتحول بسعر اليوم.
