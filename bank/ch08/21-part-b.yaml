- id: c08-b-01
  kind: problem
  part: B
  vars: {I0: 118.4, f: 0.045}
  random: {I0: [100, 180, 0.1], f: [0.01, 0.12, 0.005]}
  calc:
    - I1 = floor(I0*(1 + f)*10 + 0.5)/10
    - g = I1/I0 - 1
  text: |
    كان مؤشر أسعار المستهلك [[I0|1]] في بداية السنة، وأصبح [[I1|1]] في نهايتها. ما نسبة التضخم؟
  solution: |
    $$
    f = \frac{[[I1|1]]}{[[I0|1]]} - 1 = [[g|%2]]
    $$

- id: c08-b-02
  kind: problem
  part: B
  vars: {I0: 100, n: 6, f: 0.05}
  random: {n: [3, 12, 1], f: [0.01, 0.12, 0.005]}
  calc:
    - In = floor(100*(1 + f)**n*10 + 0.5)/10
    - fa = (In/100)**(1/n) - 1
  text: |
    ارتفع مؤشر الأسعار من 100 إلى [[In|1]] خلال [[yrs(n)]]. ما متوسط التضخم السنوي؟
  solution: |
    $$
    \bar{f} = \left(\frac{[[In|1]]}{100}\right)^{1/[[n|n]]} - 1 = [[fa|%2]]
    $$

    ```excel
    =RRI([[n|n]], 100, [[In|r]])
    ```

- id: c08-b-03
  kind: problem
  part: B
  vars: {I0: 125, f: 0.06, n: 5}
  random: {I0: [100, 200, 1], f: [0.01, 0.12, 0.005], n: [2, 15, 1]}
  calc:
    - In = I0*FP(f, n)
  text: |
    مؤشر الأسعار اليوم [[I0|g]]. إذا استمر التضخم [[f|%]] سنويا، كم يصبح المؤشر بعد [[yrs(n)]]؟
  solution: |
    $$
    I_{[[n|n]]} = [[I0|g]]\,(1 + [[f|r]])^{[[n|n]]} = [[In|2]]
    $$

- id: c08-b-04
  kind: problem
  part: B
  vars: {A: 25000, f: 0.05, k: 7}
  random: {A: [2000, 80000, 1000], f: [0.01, 0.12, 0.005], k: [2, 20, 1]}
  calc:
    - R = A*PF(f, k)
  text: |
    عقد يدفع [[A|g]] دينار في السنة [[k|n]]. التضخم المتوقع [[f|%]]. كم يساوي المبلغ بدينار السنة 0؟
  solution: |
    $$
    R = [[A|g]]\,(P/F,\ [[f|%]],\ [[k|n]]) = [[R|2]]
    $$

- id: c08-b-05
  kind: problem
  part: B
  vars: {R: 4000, f: 0.06, k: 4}
  random: {R: [500, 20000, 100], f: [0.01, 0.12, 0.005], k: [2, 15, 1]}
  calc:
    - A = R*FP(f, k)
  text: |
    صيانة سنوية تكلف [[R|g]] دينار بأسعار اليوم، وترتفع مع التضخم [[f|%]]. كم ستدفع الشركة فعلا للصيانة في السنة [[k|n]]؟
  solution: |
    $$
    A_{[[k|n]]} = [[R|g]]\,(F/P,\ [[f|%]],\ [[k|n]]) = [[A|2]]
    $$

- id: c08-b-06
  kind: problem
  part: B
  vars: {A: 30000, k: 8, b: 3, f: 0.04}
  random: {A: [5000, 80000, 1000], k: [5, 15, 1], b: [1, 4, 1], f: [0.01, 0.12, 0.005]}
  calc:
    - R = A/(1 + f)**(k - b)
  text: |
    مبلغ [[A|g]] دينار فعلي في السنة [[k|n]]. التضخم [[f|%]]. كم يساوي بدينار السنة [[b|n]]؟
  solution: |
    نخصم بالتضخم عدد السنوات بين سنة المبلغ وسنة الأساس:

    $$
    R = \frac{[[A|g]]}{(1 + [[f|r]])^{[[k-b|n]]}} = [[R|2]]
    $$

- id: c08-b-07
  kind: problem
  part: B
  vars: {P0: 42000, I0: 112.5, I1: 141.8}
  random: {P0: [5000, 150000, 1000], I0: [100, 130, 0.1], I1: [131, 180, 0.1]}
  calc:
    - P1 = P0*I1/I0
  text: |
    اشترى مصنع ضاغط هواء قبل سنوات بمبلغ [[P0|g]] دينار، عندما كان مؤشر أسعار المعدات [[I0|1]]. المؤشر اليوم [[I1|1]]. ما التكلفة المتوقعة لنفس الضاغط اليوم؟
  solution: |
    $$
    P_{now} = [[P0|g]] \times \frac{[[I1|1]]}{[[I0|1]]} = [[P1|2]]
    $$

    يستخدم المهندسون مؤشرات خاصة بكل نوع من المعدات، لأن أسعارها لا ترتفع بنفس نسبة التضخم العام.

- id: c08-b-08
  kind: problem
  part: B
  vars: {s: 0.05, f: 0.07}
  random: {s: [0.01, 0.12, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - x = (1 + s)/(1 + f) - 1
  text: |
    زاد راتب عامل [[s|%]]، والتضخم [[f|%]]. ما التغير الحقيقي في راتبه؟
  solution: |
    $$
    \frac{1 + [[s|r]]}{1 + [[f|r]]} - 1 = [[x|%2]]
    $$

    قوة شرائه [[pick(x >= 0, 'ارتفعت', 'انخفضت')]].

- id: c08-b-09
  kind: problem
  part: B
  vars: {f: 0.06, n: 4}
  random: {f: [0.01, 0.12, 0.005], n: [2, 10, 1]}
  calc:
    - x = (1 + f)**n - 1
  text: |
    لم يرتفع راتب موظف منذ [[yrs(n)]]، والتضخم كان [[f|%]] سنويا. كم يجب أن يرتفع راتبه ليعود إلى قوة شرائه الأصلية؟
  solution: |
    $$
    (1 + [[f|r]])^{[[n|n]]} - 1 = [[x|%2]]
    $$

    الزيادة المطلوبة أكبر من [[n|n]] ضرب [[f|%]]، لأن التضخم يتراكم.

- id: c08-b-10
  kind: problem
  part: B
  vars: {f: 0.07}
  random: {f: [0.02, 0.20, 0.005]}
  calc:
    - k = ln(2)/ln(1 + f)
    - q = 72/(f*100)
  text: |
    إذا كان التضخم [[f|%]] سنويا، بعد كم سنة تتضاعف الأسعار؟
  solution: |
    $$
    (1 + [[f|r]])^k = 2
    $$

    $$
    k = \frac{\ln 2}{\ln(1 + [[f|r]])} = [[k|2]]
    $$

    قاعدة 72 تعطي تقريبا سريعا: 72 مقسومة على نسبة التضخم بالمئة تساوي [[q|2]] سنة.

- id: c08-b-11
  kind: problem
  part: B
  vars: {A: 50000, f1: 0.03, f2: 0.08, f3: 0.05}
  random: {A: [5000, 100000, 1000], f1: [0.01, 0.12, 0.005], f2: [0.01, 0.12, 0.005], f3: [0.01, 0.12, 0.005]}
  calc:
    - R = A/((1 + f1)*(1 + f2)*(1 + f3))
  text: |
    مبلغ [[A|g]] دينار فعلي في السنة 3. التضخم المتوقع [[f1|%]] في السنة الأولى، و[[f2|%]] في الثانية، و[[f3|%]] في الثالثة. كم يساوي بأسعار السنة 0؟
  solution: |
    نخصم كل سنة بنسبتها:

    $$
    R = \frac{[[A|g]]}{(1 + [[f1|r]])(1 + [[f2|r]])(1 + [[f3|r]])} = [[R|2]]
    $$

- id: c08-b-12
  kind: problem
  part: B
  vars: {S: 1000, s1: 0.05, s2: 0.03, s3: 0.06, f: 0.05}
  random: {S: [500, 3000, 50], s1: [0.0, 0.10, 0.01], s2: [0.0, 0.10, 0.01], s3: [0.0, 0.10, 0.01], f: [0.02, 0.10, 0.005]}
  calc:
    - S1 = S*(1 + s1)
    - S2 = S1*(1 + s2)
    - S3 = S2*(1 + s3)
    - R1 = S1/(1 + f)
    - R2 = S2/(1 + f)**2
    - R3 = S3/(1 + f)**3
  text: |
    راتب موظف [[S|g]] دينار في السنة 0. حصل على زيادات [[s1|%]] ثم [[s2|%]] ثم [[s3|%]] في السنوات الثلاث التالية. التضخم [[f|%]] كل سنة. ابن جدولا للراتب الفعلي والراتب بأسعار السنة 0.
  solution: |
    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الراتب الفعلي | [[S1|2]] | [[S2|2]] | [[S3|2]] |
    | بأسعار السنة 0 | [[R1|2]] | [[R2|2]] | [[R3|2]] |

    بعد ثلاث سنوات، قوة شرائه [[pick(R3 >= S, 'أعلى', 'أقل')]] مما كانت بمقدار [[abs(R3/S-1)|%2]].

- id: c08-b-13
  kind: problem
  part: B
  vars: {P: 5000, f: 0.08, n: 5}
  random: {P: [500, 20000, 100], f: [0.02, 0.15, 0.005], n: [2, 15, 1]}
  calc:
    - R = P*PF(f, n)
    - x = 1 - PF(f, n)
  text: |
    شخص يحتفظ في البيت بمبلغ [[P|g]] دينار نقدا لمدة [[yrs(n)]]. التضخم [[f|%]]. كم تخسر هذه الدنانير من قوة شرائها؟
  solution: |
    $$
    R = [[P|g]]\,(P/F,\ [[f|%]],\ [[n|n]]) = [[R|2]]
    $$

    الخسارة [[P-R|2]] دينار بأسعار اليوم، أي [[x|%2]] من قوة الشراء. النقد في البيت ليس آمنا من التضخم.
