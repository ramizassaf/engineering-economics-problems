items:

- id: c08-e-01
  kind: problem
  part: E
  vars: {E1: 8000, g: 0.09, n: 6, im: 0.12}
  random: {E1: [1000, 30000, 500], g: [0.03, 0.15, 0.005], n: [3, 15, 1], im: [0.07, 0.18, 0.005]}
  calc:
    - P = E1*PGEO(g, im, n)
  text: |
    فاتورة الكهرباء لمصنع [[E1|g]] دينار في السنة الأولى، وترتفع [[g|%]] سنويا. الحد الأدنى السوقي [[im|%]]. ما القيمة الحالية للكهرباء على [[yrs(n)]]؟
  solution: |
    سلسلة متدرجة نسبيا بالدينار الفعلي:

    $$
    PW = [[E1|g]]\,(P/A_1,\ [[g|%]],\ [[im|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c08-e-02
  kind: problem
  part: E
  vars: {E1: 8000, g: 0.09, f: 0.05, ir: 0.06, n: 6}
  random: {E1: [1000, 30000, 500], g: [0.06, 0.15, 0.005], f: [0.01, 0.05, 0.005], ir: [0.03, 0.10, 0.005], n: [3, 15, 1]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - gr = (1 + g)/(1 + f) - 1
    - P1 = E1/(1 + f)*PGEO(gr, ir, n)
    - P2 = E1*PGEO(g, im, n)
  text: |
    فاتورة كهرباء [[E1|g]] دينار فعلي في السنة الأولى، وترتفع [[g|%]] سنويا. التضخم العام [[f|%]]، والحد الأدنى الحقيقي [[ir|%]]. ما النمو الحقيقي للفاتورة؟ واحسب قيمتها الحالية على [[yrs(n)]] بالدينار الثابت.
  solution: |
    النمو الحقيقي هو ما يزيد عن التضخم العام:

    $$
    g_r = \frac{1 + [[g|r]]}{1 + [[f|r]]} - 1 = [[gr|%2]]
    $$

    الدفعة الأولى بالدينار الثابت [[E1/(1+f)|2]] دينار، وتنمو [[gr|%2]] بالحقيقي:

    $$
    PW = [[E1/(1+f)|2]]\,(P/A_1,\ [[gr|%2]],\ [[ir|%]],\ [[n|n]]) = [[P1|2]]
    $$

    بالدينار الفعلي والنسبة السوقية [[im|%2]] نحصل على نفس الرقم، [[P2|2]] دينار.

- id: c08-e-03
  kind: problem
  part: E
  vars: {E: 12000, g: 0.10}
  random: {E: [2000, 40000, 500], g: [0.03, 0.15, 0.005]}
  calc:
    - e1 = E*(1 + g)
    - e2 = E*(1 + g)**2
    - e3 = E*(1 + g)**3
    - e4 = E*(1 + g)**4
  text: |
    تكلفة الوقود لأسطول شاحنات [[E|g]] دينار سنويا بأسعار اليوم، وتتوقع الشركة أن يرتفع سعر الوقود [[g|%]] سنويا. ما التكلفة الفعلية في السنوات الأربع القادمة؟
  solution: |
    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الوقود | [[e1|2]] | [[e2|2]] | [[e3|2]] | [[e4|2]] |

    في السنة الرابعة تكلفة الوقود أعلى من اليوم بنسبة [[e4/E-1|%2]].

- id: c08-e-04
  kind: problem
  part: E
  vars: {C: 40000, R: 15000, p: 0.02, f: 0.06, ir: 0.06, n: 5}
  random: {C: [10000, 100000, 5000], R: [4000, 35000, 500], p: [0.0, 0.04, 0.005], f: [0.03, 0.10, 0.005], ir: [0.03, 0.10, 0.005], n: [3, 10, 1]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - P = -C + R*(1 + p)*PGEO(p, im, n)
    - P0 = -C + R*PA(ir, n)
  text: |
    منتج إلكتروني يدر [[R|g]] دينار سنويا بأسعار اليوم. بسبب المنافسة، يرتفع سعره [[p|%]] فقط سنويا، والتضخم العام [[f|%]]. الاستثمار [[C|g]] دينار، والمدة [[yrs(n)]]، والحد الأدنى الحقيقي [[ir|%]]. احسب القيمة الحالية، وقارن بفرض أن السعر يرتفع مع التضخم.
  solution: |
    الإيراد الفعلي يبدأ [[R*(1+p)|2]] دينار في السنة الأولى، ويرتفع [[p|%]]. النسبة السوقية [[im|%2]]:

    $$
    PW = -[[C|g]] + [[R*(1+p)|2]]\,(P/A_1,\ [[p|%]],\ [[im|%2]],\ [[n|n]]) = [[P|2]]
    $$

    لو ارتفع السعر مع التضخم، لكان الإيراد ثابتا بالدينار الثابت:

    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[P0|2]]
    $$

    الإيراد ينخفض حقيقيا كل سنة، فالقيمة أقل بمقدار [[P0-P|2]] دينار.

- id: c08-e-05
  kind: problem
  part: E
  vars: {R: 40000, E: 15000, f: 0.04, g: 0.12}
  random: {R: [20000, 80000, 1000], E: [5000, 30000, 1000], f: [0.02, 0.06, 0.005], g: [0.08, 0.18, 0.005]}
  calc:
    - E = min(E, floor(R*0.6/1000)*1000)
    - k = ln(R/E)/ln((1 + g)/(1 + f))
  text: |
    إيراد خط [[R|g]] دينار بأسعار اليوم، ويرتفع مع التضخم [[f|%]]. تكلفة الطاقة [[E|g]] دينار، وترتفع [[g|%]] سنويا. بعد كم سنة تصبح الطاقة أكبر من الإيراد؟
  solution: |
    نبحث عن السنة التي يتساوى فيها البندان:

    $$
    [[R|g]]\,(1 + [[f|r]])^k = [[E|g]]\,(1 + [[g|r]])^k
    $$

    $$
    k = \frac{\ln([[R|g]] / [[E|g]])}{\ln([[1+g|f4]] / [[1+f|f4]])} = [[k|2]]
    $$

    هذا يشرح لماذا تبحث المصانع عن بدائل للطاقة، حتى لو كان المشروع رابحا اليوم.

- id: c08-e-06
  kind: problem
  part: E
  vars: {W: 30000, w: 0.08, f: 0.05, ir: 0.06, n: 5}
  random: {W: [5000, 80000, 1000], w: [0.03, 0.12, 0.005], f: [0.02, 0.08, 0.005], ir: [0.03, 0.10, 0.005], n: [3, 10, 1]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - P = W*(1 + w)*PGEO(w, im, n)
    - P0 = W*PA(ir, n)
  text: |
    أجور فريق صيانة [[W|g]] دينار سنويا بأسعار اليوم. عقد العمل يرفعها [[w|%]] سنويا، والتضخم [[f|%]]. الحد الأدنى الحقيقي [[ir|%]]. ما القيمة الحالية للأجور على [[yrs(n)]]؟ وكم كانت لو ارتفعت مع التضخم فقط؟
  solution: |
    الأجر الفعلي في السنة الأولى [[W*(1+w)|2]] دينار:

    $$
    PW = [[W*(1+w)|2]]\,(P/A_1,\ [[w|%]],\ [[im|%2]],\ [[n|n]]) = [[P|2]]
    $$

    لو ارتفعت مع التضخم فقط:

    $$
    [[W|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[P0|2]]
    $$

    الفرق [[P-P0|2]] دينار.

- id: c08-e-07
  kind: problem
  part: E
  vars: {M: 200000, s1: 0.3, s2: 0.5, s3: 0.2, g: 0.07}
  random: {M: [50000, 500000, 10000], g: [0.02, 0.12, 0.005]}
  calc:
    - a1 = M*0.3*(1 + g)
    - a2 = M*0.5*(1 + g)**2
    - a3 = M*0.2*(1 + g)**3
    - T = a1 + a2 + a3
  text: |
    مقاول قدر تكلفة مواد مبنى بمبلغ [[M|g]] دينار بأسعار اليوم. سيشتري 30% منها في السنة الأولى، و50% في الثانية، و20% في الثالثة. مؤشر أسعار مواد البناء يرتفع [[g|%]] سنويا. ما التكلفة الفعلية المتوقعة؟
  solution: |
    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | بأسعار اليوم | [[M*0.3|0]] | [[M*0.5|0]] | [[M*0.2|0]] |
    | فعلي | [[a1|0]] | [[a2|0]] | [[a3|0]] |

    المجموع [[T|2]] دينار، أعلى من التقدير بمقدار [[T-M|2]] دينار. لذلك تضع العقود الطويلة بندا لتعديل الأسعار.

- id: c08-e-08
  kind: problem
  part: E
  vars: {Ca: 30000, Ea: 9000, Cb: 38000, Lb: 7000, ge: 0.10, gl: 0.04, im: 0.12, n: 8}
  random: {Ca: [15000, 40000, 1000], Ea: [4000, 15000, 500], Cb: [25000, 55000, 1000], Lb: [3000, 12000, 500], ge: [0.06, 0.15, 0.005], gl: [0.02, 0.06, 0.005], im: [0.08, 0.16, 0.005], n: [5, 12, 1]}
  calc:
    - Pa = Ca + Ea*PGEO(ge, im, n)
    - Pb = Cb + Lb*PGEO(gl, im, n)
  text: |
    خياران لنفس العمل لمدة [[yrs(n)]]. أ: آلة كهربائية تكلف [[Ca|g]] دينار، وكهرباؤها [[Ea|g]] دينار في السنة الأولى، وترتفع [[ge|%]] سنويا. ب: آلة يدوية تكلف [[Cb|g]] دينار، وأجور تشغيلها [[Lb|g]] دينار في السنة الأولى، وترتفع [[gl|%]] سنويا. الحد الأدنى السوقي [[im|%]]. أيهما أرخص؟
  solution: |
    $$
    PW_a = [[Ca|g]] + [[Ea|g]]\,(P/A_1,\ [[ge|%]],\ [[im|%]],\ [[n|n]]) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Lb|g]]\,(P/A_1,\ [[gl|%]],\ [[im|%]],\ [[n|n]]) = [[Pb|2]]
    $$

    الأرخص: [[pick(Pa <= Pb, 'أ', 'ب')]].

- id: c08-e-09
  kind: problem
  part: E
  vars: {E1: 10000, g: 0.10, f: 0.04, im: 0.12, n: 8}
  random: {E1: [2000, 30000, 500], g: [0.06, 0.15, 0.005], f: [0.02, 0.06, 0.005], im: [0.08, 0.16, 0.005], n: [4, 12, 1]}
  calc:
    - Pg = E1*PGEO(g, im, n)
    - Pf = E1*PGEO(f, im, n)
  text: |
    تكلفة الطاقة [[E1|g]] دينار في السنة الأولى. محلل افترض أنها ترتفع مع التضخم العام [[f|%]]، والصحيح أنها ترتفع [[g|%]]. الحد الأدنى السوقي [[im|%]]، والمدة [[yrs(n)]]. كم أخطأ في القيمة الحالية؟
  solution: |
    $$
    PW_{f} = [[E1|g]]\,(P/A_1,\ [[f|%]],\ [[im|%]],\ [[n|n]]) = [[Pf|2]]
    $$

    $$
    PW_{g} = [[E1|g]]\,(P/A_1,\ [[g|%]],\ [[im|%]],\ [[n|n]]) = [[Pg|2]]
    $$

    قلل التكلفة بمقدار [[Pg-Pf|2]] دينار، أي [[Pg/Pf-1|%2]].

- id: c08-e-10
  kind: problem
  part: E
  vars: {A: 10000, s: 0.03, f: 0.07, n: 6}
  random: {A: [2000, 30000, 500], s: [0.0, 0.05, 0.005], f: [0.03, 0.12, 0.005], n: [3, 10, 1]}
  calc:
    - An = A*(1 + s)**(n - 1)
    - Rn = An/(1 + f)**n
    - R1 = A/(1 + f)
  text: |
    عقد إيجار يبدأ بمبلغ [[A|g]] دينار في السنة الأولى، ويرتفع [[s|%]] سنويا حسب العقد. التضخم [[f|%]]. ما قيمة الإيجار في السنة [[n|n]] بأسعار السنة 0؟ هل يرتفع الإيجار حقيقيا أم ينخفض؟
  solution: |
    الإيجار الفعلي في السنة [[n|n]]:

    $$
    [[A|g]]\,(1 + [[s|r]])^{[[n-1|n]]} = [[An|2]]
    $$

    بأسعار السنة 0:

    $$
    \frac{[[An|2]]}{(1 + [[f|r]])^{[[n|n]]}} = [[Rn|2]]
    $$

    في السنة الأولى كان [[R1|2]] دينار بأسعار السنة 0. الإيجار [[pick(Rn < R1, 'ينخفض حقيقيا، لأن زيادته أقل من التضخم. هذا لصالح المستأجر.', 'يرتفع حقيقيا، لأن زيادته أكبر من التضخم.')]]

- id: c08-e-11
  kind: problem
  part: E
  vars: {C: 50000, n: 8, im: 0.12, x: 0.1}
  random: {C: [10000, 120000, 5000], n: [5, 12, 1], im: [0.08, 0.16, 0.005], x: [0.05, 0.25, 0.01]}
  calc:
    - S1 = floor(C*AP(im, n)*(1 - x)/100)*100
    - g = GROWTH(S1, C, im, n)
  text: |
    نظام عزل حراري يكلف [[C|g]] دينار، ويوفر من التدفئة [[S1|g]] دينار في السنة الأولى، لمدة [[yrs(n)]]. الحد الأدنى السوقي [[im|%]]. ما أقل نسبة ارتفاع سنوي في أسعار الوقود تجعل النظام مجديا؟
  solution: |
    نبحث عن نسبة النمو التي تجعل القيمة الحالية للوفر تساوي الثمن:

    $$
    [[S1|g]]\,(P/A_1,\ g,\ [[im|%]],\ [[n|n]]) = [[C|g]]
    $$

    بالتجربة أو Goal Seek:

    $$
    g = [[g|%2]]
    $$

    إذا ارتفعت أسعار الوقود أكثر من هذه النسبة، فالنظام مجد.

- id: c08-e-12
  kind: problem
  part: E
  vars: {B: 120000, g: 0.06, k: 2}
  random: {B: [20000, 400000, 5000], g: [0.02, 0.12, 0.005], k: [1, 4, 1]}
  calc:
    - A = B*FP(g, k)
  text: |
    تقدير تكلفة خط إنتاج اليوم [[B|g]] دينار. سيشترى الخط بعد [[yrs(k)]]. مؤشر أسعار المعدات يرتفع [[g|%]] سنويا. ما الميزانية التي يجب رصدها؟
  solution: |
    $$
    [[B|g]]\,(F/P,\ [[g|%]],\ [[k|n]]) = [[A|2]]
    $$
