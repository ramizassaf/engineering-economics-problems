items:

- id: c08-g-01
  kind: problem
  part: G
  vars: {U: 45000, e: 0.71}
  random: {U: [5000, 200000, 1000], e: [0.65, 0.75, 0.01]}
  calc:
    - D = U*e
  text: |
    آلة سعرها [[U|g]] دولار. سعر الصرف [[e|d2]] دينار للدولار. كم تكلف بالدينار؟
  solution: |
    $$
    [[U|g]] \times [[e|d2]] = [[D|2]]
    $$

- id: c08-g-02
  kind: problem
  part: G
  vars: {e0: 0.71, d: 0.03, n: 4}
  random: {e0: [0.65, 0.75, 0.01], d: [0.005, 0.06, 0.005], n: [2, 10, 1]}
  calc:
    - en = e0*FP(d, n)
  text: |
    سعر الصرف اليوم [[e0|d2]] دينار للدولار. يتوقع أن يرتفع الدولار مقابل الدينار [[d|%]] سنويا. ما سعر الصرف المتوقع بعد [[yrs(n)]]؟
  solution: |
    $$
    e_{[[n|n]]} = [[e0|d2]]\,(1 + [[d|r]])^{[[n|n]]} = [[en|f4]]
    $$

- id: c08-g-03
  kind: problem
  part: G
  vars: {U: 60000, s: 0.3, e0: 0.71, d: 0.04}
  random: {U: [10000, 200000, 1000], s: [0.2, 0.5, 0.1], e0: [0.65, 0.75, 0.01], d: [-0.03, 0.06, 0.005]}
  calc:
    - d = pick(abs(d) < 0.001, 0.01, d)
    - x0 = U*s*e0
    - x1 = U*(1 - s)*e0*(1 + d)
    - T = x0 + x1
  text: |
    مورد يبيع آلة بمبلغ [[U|g]] دولار: [[s|%]] عند التوقيع، والباقي بعد سنة. سعر الصرف اليوم [[e0|d2]] دينار للدولار، ويتوقع أن [[pick(d > 0, 'يرتفع', 'ينخفض')]] الدولار [[abs(d)|%]] خلال السنة. ما التكلفة المتوقعة بالدينار في كل دفعة؟
  solution: |
    الدفعة الأولى بسعر اليوم:

    $$
    [[U*s|g]] \times [[e0|d2]] = [[x0|2]]
    $$

    الدفعة الثانية بسعر بعد سنة، [[e0*(1+d)|f4]]:

    $$
    [[U*(1-s)|g]] \times [[e0*(1+d)|f4]] = [[x1|2]]
    $$

    المجموع [[T|2]] دينار، مقابل [[U*e0|2]] دينار لو دفع كل شيء اليوم. [[pick(d > 0, 'تأجيل الدفع بالدولار يكلف أكثر عندما يرتفع الدولار.', 'تأجيل الدفع بالدولار يوفر عندما ينخفض الدولار.')]]

- id: c08-g-04
  kind: problem
  part: G
  vars: {idn: 0.14, d: 0.03}
  random: {idn: [0.08, 0.18, 0.005], d: [-0.03, 0.06, 0.005]}
  calc:
    - d = pick(abs(d) < 0.001, 0.01, d)
    - iu = (1 + idn)/(1 + d) - 1
  text: |
    حد أدنى للعائد [[idn|%]] بالدينار. يتوقع أن [[pick(d > 0, 'يرتفع', 'ينخفض')]] الدولار مقابل الدينار [[abs(d)|%]] سنويا. ما الحد الأدنى المكافئ بالدولار؟
  solution: |
    $$
    i_{\mathrm{dollar}} = \frac{[[1+idn|f4]]}{[[1+d|f4]]} - 1 = [[iu|%2]]
    $$

- id: c08-g-05
  kind: problem
  part: G
  vars: {C: 80000, U: 32000, e0: 0.71, d: 0.03, idn: 0.12}
  random: {C: [20000, 150000, 5000], U: [8000, 60000, 1000], e0: [0.65, 0.75, 0.01], d: [0.005, 0.06, 0.005], idn: [0.08, 0.16, 0.005]}
  calc:
    - iu = (1 + idn)/(1 + d) - 1
    - Pu = -C + U*PA(iu, 3)
    - P1 = Pu*e0
    - P2 = NPV(idn, [-C*e0, U*e0*(1 + d), U*e0*(1 + d)**2, U*e0*(1 + d)**3])
  text: |
    مشروع كل تدفقاته بالدولار: يكلف [[C|g]] دولار، ويعطي [[U|g]] دولار سنويا لمدة 3 سنوات. سعر الصرف اليوم [[e0|d2]] دينار للدولار، ويرتفع الدولار [[d|%]] سنويا. الحد الأدنى بالدينار [[idn|%]]. احسب القيمة الحالية بالدينار بطريقتين.
  solution: |
    **الطريقة الأولى:** نخصم بالدولار، ثم نحول بسعر اليوم. الحد الأدنى بالدولار:

    $$
    i_{\mathrm{dollar}} = \frac{[[1+idn|f4]]}{[[1+d|f4]]} - 1 = [[iu|%2]]
    $$

    $$
    PW_{\mathrm{dollar}} = -[[C|g]] + [[U|g]]\,(P/A,\ [[iu|%2]],\ 3) = [[Pu|2]]
    $$

    بالدينار: [[Pu|2]] ضرب [[e0|d2]] يساوي [[P1|2]] دينار.

    **الطريقة الثانية:** نحول كل تدفق بسعر سنته، ثم نخصم بالدينار:

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | بالدينار | [[-C*e0|0]] | [[U*e0*(1+d)|0]] | [[U*e0*(1+d)**2|0]] | [[U*e0*(1+d)**3|0]] |

    $$
    PW = [[P2|2]]
    $$

    الطريقتان متطابقتان.

- id: c08-g-06
  kind: problem
  part: G
  vars: {D: 40000, U: 52000, e0: 0.71, d: 0.04, idn: 0.12}
  random: {D: [10000, 100000, 1000], e0: [0.65, 0.75, 0.01], d: [-0.03, 0.06, 0.005], idn: [0.08, 0.16, 0.005], U: [10000, 150000, 1000]}
  calc:
    - d = pick(abs(d) < 0.001, 0.01, d)
    - U = floor(D/e0*1.02/100)*100
    - Pd = D*(0.5 + 0.5*PF(idn, 1))
    - Pu = U/2*e0 + U/2*e0*(1 + d)*PF(idn, 1)
  text: |
    عرضان لنفس الآلة، كلاهما نصف الثمن اليوم ونصفه بعد سنة. مورد محلي يبيعها بمبلغ [[D|g]] دينار. مورد أجنبي يبيعها بمبلغ [[U|g]] دولار. سعر الصرف [[e0|d2]] دينار للدولار، ويتوقع أن [[pick(d > 0, 'يرتفع', 'ينخفض')]] الدولار [[abs(d)|%]] خلال السنة. الحد الأدنى [[idn|%]]. أيهما أرخص؟
  solution: |
    المحلي:

    $$
    [[D/2|g]] + [[D/2|g]]\,(P/F,\ [[idn|%]],\ 1) = [[Pd|2]]
    $$

    الأجنبي بالدينار:

    $$
    [[U/2*e0|2]] + [[U/2*e0*(1+d)|2]]\,(P/F,\ [[idn|%]],\ 1) = [[Pu|2]]
    $$

    الأرخص: [[pick(Pd <= Pu, 'المحلي', 'الأجنبي')]]. الفرق صغير، وخطر الصرف قد يرجح المحلي حتى لو كان أغلى قليلا.

- id: c08-g-07
  kind: problem
  part: G
  vars: {fd: 0.06, fu: 0.03, e0: 0.71}
  random: {fd: [0.01, 0.15, 0.005], fu: [0.01, 0.06, 0.005], e0: [0.65, 0.75, 0.01]}
  calc:
    - d = (1 + fd)/(1 + fu) - 1
    - e1 = e0*(1 + d)
  text: |
    التضخم المتوقع [[fd|%]] في بلد الدينار، و[[fu|%]] في بلد الدولار. سعر الصرف [[e0|d2]] دينار للدولار. حسب مبدأ تعادل القوة الشرائية، ما سعر الصرف المتوقع بعد سنة؟
  solution: |
    نفس السلعة يجب أن تكلف نفس الشيء في البلدين بعد التحويل. فيتغير سعر الصرف بفرق التضخم:

    $$
    1 + d = \frac{1 + [[fd|r]]}{1 + [[fu|r]]}
    $$

    $$
    d = [[d|%2]], \qquad e_1 = [[e0|d2]] \times [[1+d|f4]] = [[e1|f4]]
    $$

    هذا مبدأ للمدى الطويل. الأسعار الفعلية تتأثر بالسياسة النقدية وحركة الأموال أيضا.

- id: c08-g-08
  kind: problem
  part: G
  vars: {U: 50000, O: 20000, X: 15000}
  random: {U: [10000, 100000, 1000], O: [3000, 40000, 1000], X: [2000, 30000, 1000]}
  calc:
    - O = min(O, floor(U*0.5/1000)*1000)
    - e = (X + O)/U
  text: |
    مصدر يبيع بمبلغ [[U|g]] دولار سنويا، وتكاليفه [[O|g]] دينار. يحتاج تدفقا لا يقل عن [[X|g]] دينار سنويا ليسدد قرضه. ما أقل سعر صرف يحقق ذلك؟
  solution: |
    $$
    [[U|g]]\,e - [[O|g]] = [[X|g]]
    $$

    $$
    e = \frac{[[X|g]] + [[O|g]]}{[[U|g]]} = [[e|f4]]
    $$

    إذا انخفض الدولار تحت [[e|f4]] دينار، لا يكفي التدفق للقسط.

- id: c08-g-09
  kind: problem
  part: G
  vars: {ru: 0.06, rd: 0.09, d: 0.02}
  random: {ru: [0.03, 0.09, 0.005], rd: [0.05, 0.14, 0.005], d: [-0.03, 0.06, 0.005]}
  calc:
    - d = pick(abs(d) < 0.001, 0.01, d)
    - k = (1 + ru)*(1 + d) - 1
  text: |
    شركة دخلها بالدينار تقترض. بنك يقرضها بالدولار بفائدة [[ru|%]]، وآخر بالدينار بفائدة [[rd|%]]. يتوقع أن [[pick(d > 0, 'يرتفع', 'ينخفض')]] الدولار [[abs(d)|%]] سنويا. أي القرضين أرخص؟
  solution: |
    الشركة تسدد الدولارات بدنانير أكثر أو أقل كل سنة. التكلفة الفعلية للقرض بالدولار مقاسة بالدينار:

    $$
    (1 + [[ru|r]]) \times [[1+d|f4]] - 1 = [[k|%2]]
    $$

    الأرخص: القرض [[pick(k < rd, 'بالدولار', 'بالدينار')]]. القرض بعملة غير عملة الدخل فيه خطر: إذا ارتفع الدولار أكثر من المتوقع، ترتفع التكلفة.

- id: c08-g-10
  kind: problem
  part: G
  vars: {C: 70000, U: 40000, O: 9000, e0: 0.71, idn: 0.12}
  random: {C: [20000, 120000, 5000], U: [10000, 80000, 1000], O: [2000, 25000, 500], e0: [0.65, 0.75, 0.01], idn: [0.08, 0.16, 0.005]}
  calc:
    - O = min(O, floor(U*e0*0.5/500)*500)
    - Pm = NPV(idn, [-C, U*e0*0.98 - O, U*e0*0.98**2 - O, U*e0*0.98**3 - O])
    - P0 = -C + (U*e0 - O)*PA(idn, 3)
    - Pp = NPV(idn, [-C, U*e0*1.02 - O, U*e0*1.02**2 - O, U*e0*1.02**3 - O])
  text: |
    مشروع تصدير يكلف [[C|g]] دينار، وإيراده [[U|g]] دولار سنويا، وتكاليفه [[O|g]] دينار، لمدة 3 سنوات. سعر الصرف اليوم [[e0|d2]] دينار للدولار. الحد الأدنى [[idn|%]]. احسب القيمة الحالية إذا تغير الدولار سنويا بنسبة 2% نزولا، أو بقي ثابتا، أو ارتفع 2%.
  solution: |
    | تغير الدولار | -2% | 0% | +2% |
    | --- | --- | --- | --- |
    | القيمة الحالية | [[Pm|2]] | [[P0|2]] | [[Pp|2]] |

    تغير 2% فقط في سعر الصرف يحرك القيمة الحالية بحوالي [[(Pp-Pm)/2|2]] دينار في كل اتجاه. [[pick(Pp < 0, 'المشروع مرفوض في الحالات الثلاث.', pick(Pm < 0, 'وفي الحالة السيئة يصبح المشروع مرفوضا.', 'المشروع مقبول في الحالات الثلاث.'))]]
