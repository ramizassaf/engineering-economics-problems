items:

- id: c08-i-01
  kind: mcq
  part: I
  vars: {ir: 0.06, f: 0.05}
  random: {ir: [0.02, 0.10, 0.005], f: [0.02, 0.12, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - w1 = ir + f
    - w2 = ir - f
    - w3 = ir*f
  text: |
    النسبة الحقيقية [[ir|%]] والتضخم [[f|%]]. ما النسبة السوقية؟
  options: ["[[w1|%2]]", "[[im|%2]]", "[[w2|%2]]", "[[w3|%2]]"]
  correct: 1
  solution: |
    $$
    (1 + [[ir|r]])(1 + [[f|r]]) - 1 = [[im|%2]]
    $$

    الخيار (أ) نسي حاصل الضرب. الخيار (ج) طرح التضخم بدل أن يضيفه.

- id: c08-i-02
  kind: mcq
  part: I
  text: |
    وفر مشروع مقدر بأسعار اليوم، ويرتفع مع التضخم. بأي نسبة نخصمه؟
  options: ["النسبة السوقية", "النسبة الحقيقية", "نسبة التضخم", "مجموع النسبتين"]
  correct: 1
  solution: |
    الوفر بأسعار اليوم دينار ثابت، فيخصم بالنسبة الحقيقية.

- id: c08-i-03
  kind: mcq
  part: I
  text: |
    قسط قرض ثابت 500 دينار شهريا. ماذا يحدث لعبئه الحقيقي مع التضخم؟
  options: ["يرتفع", "ينخفض", "لا يتغير", "يرتفع ثم ينخفض"]
  correct: 1
  solution: |
    القسط ثابت بالدينار الفعلي، والأسعار ترتفع، فقوة شرائه تنخفض كل شهر.

- id: c08-i-04
  kind: mcq
  part: I
  vars: {A: 20000, f: 0.06, k: 5}
  random: {A: [5000, 60000, 1000], f: [0.02, 0.12, 0.005], k: [3, 12, 1]}
  calc:
    - R = A/(1 + f)**k
    - w1 = A*(1 + f)**k
    - w2 = A*(1 - f*k)
    - w3 = A/(1 + f*k)
  text: |
    مبلغ [[A|g]] دينار فعلي في السنة [[k|n]]. التضخم [[f|%]]. كم يساوي بأسعار السنة 0؟
  options: ["[[w1|2]]", "[[w2|2]]", "[[w3|2]]", "[[R|2]]"]
  correct: 3
  solution: |
    $$
    \frac{[[A|g]]}{(1 + [[f|r]])^{[[k|n]]}} = [[R|2]]
    $$

    الخيار (أ) رفع المبلغ بدل أن يخفضه. الخياران (ب) و(ج) عاملا التضخم كأنه بسيط لا يتراكم.

- id: c08-i-05
  kind: mcq
  part: I
  text: |
    مشروع يرتفع إيراده وتكاليفه مع التضخم بالضبط. ماذا يحدث لقيمته الحالية بعد الضريبة إذا ارتفع التضخم؟
  options: ["ترتفع", "لا تتغير", "تنخفض", "تعتمد على الحد الأدنى فقط"]
  correct: 2
  solution: |
    الاستهلاك لا يرتفع مع الأسعار، فيفقد وفره الضريبي قيمته الحقيقية.

- id: c08-i-06
  kind: mcq
  part: I
  vars: {im: 0.12, f: 0.07}
  random: {im: [0.06, 0.18, 0.005], f: [0.02, 0.10, 0.005]}
  calc:
    - im = max(im, f + 0.04)
    - ir = (1 + im)/(1 + f) - 1
    - w1 = im - f
    - w2 = (1 + im)*(1 + f) - 1
    - w3 = im/(1 + f)
  text: |
    وديعة بفائدة [[im|%]] والتضخم [[f|%]]. ما العائد الحقيقي بالضبط؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[w3|%2]]", "[[ir|%2]]"]
  correct: 3
  solution: |
    $$
    \frac{1 + [[im|r]]}{1 + [[f|r]]} - 1 = [[ir|%2]]
    $$

    الخيار (أ) تقريب. الخيار (ب) ضرب بدل أن يقسم. الخيار (ج) نسي الواحد في البسط.

- id: c08-i-07
  kind: mcq
  part: I
  vars: {I0: 120, I1: 129}
  random: {I0: [101, 150, 1], I1: [151, 190, 1]}
  calc:
    - f = I1/I0 - 1
    - w1 = (I1 - I0)/100
    - w2 = (I1 - I0)/I1
    - w3 = I1/I0
  text: |
    مؤشر الأسعار ارتفع من [[I0|g]] إلى [[I1|g]] خلال سنة. ما التضخم؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[f|%2]]", "[[w3|%2]]"]
  correct: 2
  solution: |
    $$
    \frac{[[I1|g]]}{[[I0|g]]} - 1 = [[f|%2]]
    $$

    الخيار (أ) قسم على 100 كأن المؤشر بدأ من الأساس. الخيار (ب) قسم على القيمة الجديدة.

- id: c08-i-08
  kind: mcq
  part: I
  text: |
    شركة دخلها بالدينار، وتقترض بالدولار لأن فائدته أقل. ما الخطر الأساسي؟
  options: ["ارتفاع الدولار مقابل الدينار", "انخفاض الدولار مقابل الدينار", "انخفاض التضخم", "ارتفاع الضريبة"]
  correct: 0
  solution: |
    إذا ارتفع الدولار، تحتاج الشركة دنانير أكثر لتسدد نفس الأقساط، فتختفي ميزة الفائدة الأقل.

- id: c08-i-09
  kind: mcq
  part: I
  text: |
    عقد صيانة بمبلغ ثابت 6,000 دينار سنويا لمدة 5 سنوات. محلل خصمه بالنسبة الحقيقية. ما أثر خطئه؟
  options: ["قلل تكلفة العقد", "بالغ في تكلفة العقد", "لا أثر", "الخطأ في التدفقات وليس في النسبة"]
  correct: 1
  solution: |
    المبلغ الثابت دينار فعلي، ونسبته الصحيحة السوقية، وهي أعلى. الخصم بنسبة أقل يعطي قيمة حالية أكبر من الحقيقة.

- id: c08-i-10
  kind: mcq
  part: I
  vars: {s: 0.04, f: 0.07}
  random: {s: [0.01, 0.06, 0.005], f: [0.065, 0.12, 0.005]}
  calc:
    - x = (1 + s)/(1 + f) - 1
    - w1 = s + f
    - w2 = s
    - w3 = s - f
  text: |
    زاد راتب [[s|%]]، والتضخم [[f|%]]. ما التغير الحقيقي في الراتب؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[w3|%2]]", "[[x|%2]]"]
  correct: 3
  solution: |
    $$
    \frac{1 + [[s|r]]}{1 + [[f|r]]} - 1 = [[x|%2]]
    $$

    الراتب انخفض حقيقيا. الخيار (ج) تقريب يطرح النسبتين، قريب لكنه ليس دقيقا.
