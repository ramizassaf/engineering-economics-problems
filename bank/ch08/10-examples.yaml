# ------------------------------------------------------------ measuring inflation
- id: c08-ex-index
  kind: example
  title: |
    قياس التضخم من مؤشر الأسعار
  vars: {f1: 0.04, f2: 0.06, f3: 0.03}
  random: {f1: [0.01, 0.12, 0.005], f2: [0.01, 0.12, 0.005], f3: [0.01, 0.12, 0.005]}
  calc:
    - I1 = floor(100*(1 + f1)*10 + 0.5)/10
    - I2 = floor(I1*(1 + f2)*10 + 0.5)/10
    - I3 = floor(I2*(1 + f3)*10 + 0.5)/10
    - g1 = I1/100 - 1
    - g2 = I2/I1 - 1
    - g3 = I3/I2 - 1
    - fa = (I3/100)**(1/3) - 1
    - fs = (g1 + g2 + g3)/3
  text: |
    مؤشر أسعار المستهلك في بلد كان كما يلي:

    | السنة | 0 | 1 | 2 | 3 |
    | --- | --- | --- | --- | --- |
    | المؤشر | 100.0 | [[I1|1]] | [[I2|1]] | [[I3|1]] |

    ما نسبة التضخم في كل سنة؟ وما متوسط نسبة التضخم السنوية خلال السنوات الثلاث؟
  solution: |
    المؤشر يقيس سعر سلة ثابتة من السلع. التضخم في سنة هو الزيادة النسبية في المؤشر خلالها:

    $$
    f_k = \frac{I_k}{I_{k-1}} - 1
    $$

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | التضخم | [[g1|%2]] | [[g2|%2]] | [[g3|%2]] |

    المتوسط ليس المتوسط الحسابي، لأن الأسعار تتضاعف ولا تجمع. نبحث عن نسبة ثابتة تعطي نفس الزيادة الكلية، كما في إيجاد نسبة الفائدة في الفصل الأول:

    $$
    \bar{f} = \left(\frac{[[I3|1]]}{100}\right)^{1/3} - 1 = [[fa|%2]]
    $$

    المتوسط الحسابي [[fs|%2]] قريب منه، لكنه أكبر قليلا دائما.

- id: c08-ex-purchasing
  kind: example
  title: |
    الدينار الفعلي والدينار الثابت
  vars: {F: 10000, f: 0.05, n: 10}
  random: {F: [2000, 50000, 1000], f: [0.02, 0.12, 0.005], n: [3, 20, 1]}
  calc:
    - R = F*PF(f, n)
    - X = F*FP(f, n)
  text: |
    موظف سيحصل على مكافأة [[F|g]] دينار بعد [[yrs(n)]]. نسبة التضخم المتوقعة [[f|%]] سنويا. (أ) كم تساوي المكافأة بأسعار اليوم؟ (ب) سلة سلع تكلف اليوم [[F|g]] دينار. كم ستكلف بعد [[yrs(n)]]؟
  solution: |
    نميز بين نوعين من الدينار:

    - **الدينار الفعلي:** المبلغ الذي يدفع أو يقبض فعلا في سنته، مكتوبا على الشيك.
    - **الدينار الثابت:** نفس المبلغ مقاسا بقوة شراء سنة الأساس، وهي هنا السنة 0.

    التحويل يشبه نقل المال عبر الزمن، لكن بنسبة التضخم بدل نسبة الفائدة:

    $$
    R_k = \frac{A_k}{(1 + f)^k}
    $$

    (أ)

    $$
    R = [[F|g]]\,(P/F,\ [[f|%]],\ [[n|n]]) = [[R|2]]
    $$

    المكافأة تشتري بعد [[yrs(n)]] ما يشتريه اليوم [[R|2]] دينار فقط.

    (ب) نفس السلة بأسعار تلك السنة:

    $$
    [[F|g]]\,(F/P,\ [[f|%]],\ [[n|n]]) = [[X|2]]
    $$

- id: c08-ex-real-raise
  kind: example
  title: |
    الزيادة الحقيقية في الراتب
  vars: {S: 1200, s: 0.06, f: 0.04}
  random: {S: [600, 3000, 50], s: [0.02, 0.12, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - S1 = S*(1 + s)
    - R1 = S1/(1 + f)
    - x = (1 + s)/(1 + f) - 1
  text: |
    راتب مهندسة [[S|g]] دينار شهريا. حصلت على زيادة [[s|%]]، وكانت نسبة التضخم في نفس السنة [[f|%]]. ما الزيادة الحقيقية في قوة شرائها؟
  solution: |
    الراتب الجديد [[S1|2]] دينار. بأسعار السنة الماضية يساوي:

    $$
    \frac{[[S1|2]]}{1 + [[f|r]]} = [[R1|2]]
    $$

    $$
    \frac{1 + [[s|r]]}{1 + [[f|r]]} - 1 = [[x|%2]]
    $$

    [[pick(x >= 0, 'قوة الشراء ارتفعت، لكن أقل من نسبة الزيادة نفسها.', 'قوة الشراء انخفضت رغم الزيادة، لأن الأسعار ارتفعت أكثر من الراتب.')]] طرح النسبتين يعطي تقريبا [[s-f|%2]]، وهو قريب عندما تكون النسب صغيرة.

# ------------------------------------------------------------ real and market rates
- id: c08-ex-market-rate
  kind: example
  title: |
    النسبة الحقيقية والنسبة السوقية
  vars: {ir: 0.06, f: 0.04, im2: 0.12}
  random: {ir: [0.02, 0.10, 0.005], f: [0.01, 0.12, 0.005], im2: [0.08, 0.20, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - ir2 = (1 + im2)/(1 + f) - 1
  text: |
    (أ) مستثمر يريد عائدا حقيقيا [[ir|%]] فوق التضخم. التضخم المتوقع [[f|%]]. ما النسبة التي يطلبها من البنك؟ (ب) بنك يعطي [[im2|%]] على الودائع، والتضخم [[f|%]]. ما العائد الحقيقي؟
  solution: |
    توجد ثلاث نسب:

    - **النسبة الحقيقية:** نمو قوة الشراء، بدون تضخم.
    - **نسبة التضخم:** نمو الأسعار.
    - **النسبة السوقية:** ما يعلنه البنك فعلا. تجمع الاثنتين.

    كل دينار يجب أن ينمو بالنسبة الحقيقية، ثم ينمو مرة أخرى ليعوض التضخم:

    $$
    1 + i = (1 + i')(1 + f)
    $$

    $$
    i = i' + f + i'\,f
    $$

    (أ)

    $$
    i = (1 + [[ir|r]])(1 + [[f|r]]) - 1 = [[im|%2]]
    $$

    (ب)

    $$
    i' = \frac{1 + [[im2|r]]}{1 + [[f|r]]} - 1 = [[ir2|%2]]
    $$

    التقريب الشائع يطرح التضخم من النسبة السوقية، فيعطي [[im2-f|%2]].

# ------------------------------------------------------------ two equivalent methods
- id: c08-ex-two-ways
  kind: example
  title: |
    طريقتان تعطيان نفس القيمة الحالية
  vars: {C: 50000, R: 16000, ir: 0.08, f: 0.05}
  random: {C: [20000, 100000, 5000], R: [6000, 35000, 1000], ir: [0.03, 0.12, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - P1 = -C + R*PA(ir, 4)
    - a1 = R*(1 + f)
    - a2 = R*(1 + f)**2
    - a3 = R*(1 + f)**3
    - a4 = R*(1 + f)**4
    - P2 = NPV(im, [-C, a1, a2, a3, a4])
  text: |
    مشروع يكلف [[C|g]] دينار، ويوفر [[R|g]] دينار سنويا بأسعار اليوم لمدة 4 سنوات. الوفر يرتفع مع التضخم [[f|%]]. الحد الأدنى للعائد الحقيقي [[ir|%]]. احسب القيمة الحالية بطريقتين.
  solution: |
    **الطريقة الأولى: دينار ثابت ونسبة حقيقية.** الوفر بأسعار اليوم ثابت كل سنة:

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[ir|%]],\ 4) = [[P1|2]]
    $$

    **الطريقة الثانية: دينار فعلي ونسبة سوقية.** النسبة السوقية:

    $$
    i = (1 + [[ir|r]])(1 + [[f|r]]) - 1 = [[im|%2]]
    $$

    الوفر الفعلي يرتفع كل سنة:

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الوفر الفعلي | [[a1|2]] | [[a2|2]] | [[a3|2]] | [[a4|2]] |

    $$
    PW = [[P2|2]]
    $$

    النتيجة نفسها. القاعدة الذهبية في هذا الفصل:

    - دينار ثابت مع نسبة حقيقية.
    - دينار فعلي مع نسبة سوقية.

    الخطأ الشائع خلط الاثنين: وفر بأسعار اليوم مع نسبة سوقية يقلل قيمة المشروع ظلما.

- id: c08-ex-fixed-contract
  kind: example
  title: |
    عقد بمبلغ ثابت لا يتغير مع التضخم
  vars: {A: 12000, n: 5, ir: 0.06, f: 0.07}
  random: {A: [3000, 40000, 1000], n: [3, 10, 1], ir: [0.03, 0.10, 0.005], f: [0.02, 0.12, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - P = A*PA(im, n)
    - W = A*PA(ir, n)
    - Rn = A/(1 + f)**n
  text: |
    شركة توقع عقد إيجار لمستودع بمبلغ [[A|g]] دينار سنويا لمدة [[yrs(n)]]، يدفع في نهاية كل سنة، ولا يتغير مع الأسعار. التضخم المتوقع [[f|%]]، والحد الأدنى للعائد الحقيقي [[ir|%]]. ما القيمة الحالية لدفعات العقد؟
  solution: |
    المبلغ ثابت بالدينار الفعلي، فنخصمه بالنسبة السوقية:

    $$
    i = [[im|%2]]
    $$

    $$
    PW = [[A|g]]\,(P/A,\ [[im|%2]],\ [[n|n]]) = [[P|2]]
    $$

    بالدينار الثابت، الدفعة الأخيرة تساوي [[Rn|2]] دينار فقط بأسعار اليوم. التضخم يخفض العبء الحقيقي للعقد كل سنة.

    لو خصمنا بالنسبة الحقيقية لحصلنا على [[W|2]] دينار، أي أعلى من الصحيح بمقدار [[W-P|2]] دينار. هذا يبالغ في تكلفة العقد.

- id: c08-ex-growing-cost
  kind: example
  title: |
    تكلفة ترتفع مع التضخم
  vars: {A1: 5000, n: 8, ir: 0.06, f: 0.05}
  random: {A1: [1000, 20000, 500], n: [4, 15, 1], ir: [0.03, 0.10, 0.005], f: [0.01, 0.10, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - P1 = A1*PGEO(f, im, n)
    - P2 = A1/(1 + f)*PA(ir, n)
  text: |
    صيانة خط إنتاج تكلف [[A1|g]] دينار في نهاية السنة الأولى، وترتفع مع التضخم [[f|%]] كل سنة، لمدة [[yrs(n)]]. الحد الأدنى للعائد الحقيقي [[ir|%]]. ما القيمة الحالية للصيانة؟
  solution: |
    **بالدينار الفعلي:** سلسلة متدرجة نسبيا، كما في الفصل الثاني، بالنسبة السوقية [[im|%2]]:

    $$
    PW = [[A1|g]]\,(P/A_1,\ [[f|%]],\ [[im|%2]],\ [[n|n]]) = [[P1|2]]
    $$

    **بالدينار الثابت:** كل دفعة تساوي بأسعار اليوم نفس المبلغ:

    $$
    \frac{[[A1|g]]}{1 + [[f|r]]} = [[A1/(1+f)|2]]
    $$

    فهي سلسلة متساوية بالنسبة الحقيقية:

    $$
    PW = [[A1/(1+f)|2]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[P2|2]]
    $$

    الطريقة الثانية أسهل: كل ما يرتفع مع التضخم يصبح ثابتا بالدينار الثابت.

# ------------------------------------------------------------ differential inflation
- id: c08-ex-differential
  kind: example
  title: |
    بنود ترتفع بنسب مختلفة
  vars: {C: 80000, R: 45000, E: 20000, f: 0.04, g: 0.09, im: 0.12}
  random: {C: [30000, 150000, 5000], R: [25000, 90000, 5000], E: [5000, 40000, 1000], f: [0.02, 0.07, 0.005], g: [0.07, 0.15, 0.005], im: [0.08, 0.16, 0.005]}
  calc:
    - E = min(E, floor(R*0.5/1000)*1000)
    - c1 = R*(1 + f) - E*(1 + g)
    - c2 = R*(1 + f)**2 - E*(1 + g)**2
    - c3 = R*(1 + f)**3 - E*(1 + g)**3
    - c4 = R*(1 + f)**4 - E*(1 + g)**4
    - c5 = R*(1 + f)**5 - E*(1 + g)**5
    - P = NPV(im, [-C, c1, c2, c3, c4, c5])
    - Pf = -C + (R - E)*(1 + f)*PGEO(f, im, 5)
  text: |
    مصنع يدرس خطا يكلف [[C|g]] دينار. الإيراد [[R|g]] دينار سنويا بأسعار اليوم، ويرتفع مع التضخم العام [[f|%]]. تكلفة الطاقة [[E|g]] دينار بأسعار اليوم، وترتفع [[g|%]] سنويا. المدة 5 سنوات، والحد الأدنى للعائد السوقي [[im|%]]. احسب القيمة الحالية، وقارن بفرض أن الطاقة ترتفع مع التضخم العام.
  solution: |
    كل بند ينمو بنسبته، فنحسب التدفق الفعلي لكل سنة:

    $$
    A_k = [[R|g]]\,(1 + [[f|r]])^k - [[E|g]]\,(1 + [[g|r]])^k
    $$

    | السنة | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- |
    | الإيراد | [[R*(1+f)|0]] | [[R*(1+f)**2|0]] | [[R*(1+f)**3|0]] | [[R*(1+f)**4|0]] | [[R*(1+f)**5|0]] |
    | الطاقة | [[-E*(1+g)|0]] | [[-E*(1+g)**2|0]] | [[-E*(1+g)**3|0]] | [[-E*(1+g)**4|0]] | [[-E*(1+g)**5|0]] |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] | [[c4|0]] | [[c5|0]] |

    $$
    PW = [[P|2]]
    $$

    لو افترضنا أن الطاقة ترتفع مع التضخم العام، لكانت القيمة الحالية [[Pf|2]] دينار. الفرق [[Pf-P|2]] دينار. تقدير نسبة كل بند وحده يغير القرار أحيانا.

# ------------------------------------------------------------ inflation and taxes
- id: c08-ex-tax
  kind: example
  title: |
    التضخم يخفض قيمة الوفر الضريبي من الاستهلاك
  vars: {C: 100000, X: 35000, n: 5, t: 0.20, ir: 0.08, f: 0.06}
  random: {C: [40000, 200000, 5000], X: [12000, 70000, 1000], n: [4, 8, 1], t: [0.15, 0.30, 0.01], ir: [0.04, 0.10, 0.005], f: [0.02, 0.12, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - D = C/n
    - P0 = -C + (X*(1 - t) + t*D)*PA(ir, n)
    - P1 = -C + X*(1 - t)*PA(ir, n) + t*D*PA(im, n)
    - L = P0 - P1
  text: |
    آلة تكلف [[C|g]] دينار، وتستهلك بالقسط الثابت على [[yrs(n)]] بدون قيمة بيع. ربح التشغيل قبل الضريبة والاستهلاك [[X|g]] دينار سنويا بأسعار اليوم، ويرتفع مع التضخم. نسبة الضريبة [[t|%]]، والحد الأدنى للعائد الحقيقي [[ir|%]]. احسب القيمة الحالية بدون تضخم، ثم بتضخم [[f|%]].
  solution: |
    **بدون تضخم:**

    $$
    PW_0 = -[[C|g]] + ([[X|g]]\,(1 - [[t|r]]) + [[t|r]] \times [[D|2]])\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[P0|2]]
    $$

    **مع التضخم:** ربح التشغيل يرتفع مع الأسعار، فيبقى ثابتا بالدينار الثابت. نخصم الجزء الأول بالنسبة الحقيقية.

    أما الاستهلاك فمحسوب على الثمن الأصلي، [[D|2]] دينار بالدينار الفعلي كل سنة، ولا يرتفع مع الأسعار. لذلك نخصم وفره الضريبي بالنسبة السوقية [[im|%2]]:

    $$
    PW_1 = -[[C|g]] + [[X*(1-t)|2]]\,(P/A,\ [[ir|%]],\ [[n|n]]) + [[t*D|2]]\,(P/A,\ [[im|%2]],\ [[n|n]]) = [[P1|2]]
    $$

    التضخم خفض القيمة الحالية [[L|2]] دينار، مع أن الإيراد والتكاليف ارتفعت معه بالضبط. الوفر الضريبي من الاستهلاك يفقد قوة شرائه، فتدفع الشركة ضريبة حقيقية أكبر.

# ------------------------------------------------------------ inflation and loans
- id: c08-ex-loan
  kind: example
  title: |
    القرض بفائدة ثابتة في زمن التضخم
  vars: {L: 30000, r: 0.08, f: 0.06}
  random: {L: [5000, 100000, 1000], r: [0.04, 0.14, 0.005], f: [0.02, 0.12, 0.005]}
  calc:
    - A = L*AP(r, 3)
    - q1 = A/(1 + f)
    - q2 = A/(1 + f)**2
    - q3 = A/(1 + f)**3
    - rr = (1 + r)/(1 + f) - 1
  text: |
    شخص يقترض [[L|g]] دينار بفائدة ثابتة [[r|%]]، يسددها بثلاثة أقساط سنوية متساوية. التضخم المتوقع [[f|%]]. ما قيمة الأقساط بأسعار اليوم؟ وما التكلفة الحقيقية للقرض؟
  solution: |
    القسط الفعلي:

    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ 3) = [[A|2]]
    $$

    بالدينار الثابت:

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | القسط الفعلي | [[A|0]] | [[A|0]] | [[A|0]] |
    | بأسعار اليوم | [[q1|0]] | [[q2|0]] | [[q3|0]] |

    $$
    r_{real} = \frac{1 + [[r|r]]}{1 + [[f|r]]} - 1 = [[rr|%2]]
    $$

    [[pick(rr >= 0, 'المقترض يدفع فعلا أقل مما تظهره الفائدة المعلنة. التضخم ينقل قيمة من المقرض إلى المقترض.', 'التكلفة الحقيقية سالبة: المقترض يرد قوة شراء أقل مما أخذ. لذلك ترفع البنوك الفائدة عندما تتوقع التضخم.')]]

- id: c08-ex-savings
  kind: example
  title: |
    الادخار في زمن التضخم
  vars: {P: 10000, r: 0.05, f: 0.07, n: 5}
  random: {P: [1000, 50000, 1000], r: [0.02, 0.10, 0.005], f: [0.02, 0.12, 0.005], n: [3, 15, 1]}
  calc:
    - F = P*FP(r, n)
    - R = F/(1 + f)**n
    - rr = (1 + r)/(1 + f) - 1
  text: |
    عائلة تودع [[P|g]] دينار في حساب يعطي [[r|%]] سنويا لمدة [[yrs(n)]]. التضخم [[f|%]]. كم يصبح الرصيد؟ وكم يساوي بأسعار اليوم؟
  solution: |
    $$
    F = [[P|g]]\,(F/P,\ [[r|%]],\ [[n|n]]) = [[F|2]]
    $$

    $$
    R = \frac{[[F|2]]}{(1 + [[f|r]])^{[[n|n]]}} = [[R|2]]
    $$

    العائد الحقيقي [[rr|%2]] سنويا. [[pick(R >= P, 'الرصيد يشتري أكثر مما كان المبلغ يشتريه يوم الإيداع.', 'الرصيد أكبر بالأرقام، لكنه يشتري أقل مما كان المبلغ يشتريه يوم الإيداع.')]]

# ------------------------------------------------------------ exchange rates
- id: c08-ex-exchange
  kind: example
  title: |
    مشروع بإيراد بالدولار وتكاليف بالدينار
  vars: {C: 60000, U: 30000, O: 6000, e0: 0.71, d: 0.03, im: 0.12}
  random: {C: [20000, 150000, 5000], U: [10000, 60000, 1000], O: [2000, 20000, 500], e0: [0.65, 0.75, 0.01], d: [-0.03, 0.06, 0.005], im: [0.08, 0.16, 0.005]}
  calc:
    - d = pick(abs(d) < 0.001, 0.01, d)
    - e1 = e0*(1 + d)
    - e2 = e0*(1 + d)**2
    - e3 = e0*(1 + d)**3
    - c1 = U*e1 - O
    - c2 = U*e2 - O
    - c3 = U*e3 - O
    - P = NPV(im, [-C, c1, c2, c3])
  text: |
    شركة تشتري آلة بمبلغ [[C|g]] دينار لتصنيع قطع تصدرها. الإيراد [[U|g]] دولار سنويا لمدة 3 سنوات، وتكاليف التشغيل [[O|g]] دينار. سعر الصرف اليوم [[e0|d2]] دينار للدولار، ويتوقع أن [[pick(d > 0, 'يرتفع', 'ينخفض')]] سعر الدولار مقابل الدينار [[abs(d)|%]] سنويا. الحد الأدنى للعائد [[im|%]] بالدينار. احسب القيمة الحالية.
  solution: |
    كل التدفقات يجب أن تكون بعملة واحدة قبل الخصم. نحول الإيراد إلى دينار بسعر الصرف المتوقع في سنته:

    $$
    e_k = e_0\,(1 + d)^k
    $$

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | سعر الصرف | [[e1|f4]] | [[e2|f4]] | [[e3|f4]] |
    | الإيراد بالدينار | [[U*e1|0]] | [[U*e2|0]] | [[U*e3|0]] |
    | التشغيل | [[-O|0]] | [[-O|0]] | [[-O|0]] |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] |

    $$
    PW = [[P|2]]
    $$

    [[pick(d > 0, 'ارتفاع الدولار يفيد المصدر: نفس الدولارات تصبح دنانير أكثر.', 'انخفاض الدولار يضر المصدر: نفس الدولارات تصبح دنانير أقل.')]] سعر الصرف خطر حقيقي على المشروع، ويستحق تحليل حساسية.

- id: c08-ex-currency-rate
  kind: example
  title: |
    الحد الأدنى للعائد بعملتين
  vars: {idn: 0.12, d: 0.04, P: 50000}
  random: {idn: [0.08, 0.18, 0.005], d: [-0.03, 0.06, 0.005], P: [10000, 100000, 5000]}
  calc:
    - d = pick(abs(d) < 0.001, 0.01, d)
    - iu = (1 + idn)/(1 + d) - 1
  text: |
    شركة حدها الأدنى للعائد [[idn|%]] على أموالها بالدينار. يتوقع أن [[pick(d > 0, 'يرتفع', 'ينخفض')]] سعر الدولار مقابل الدينار [[abs(d)|%]] سنويا. ما الحد الأدنى للعائد الذي تطلبه من مشروع كل تدفقاته بالدولار؟
  solution: |
    الدولار يكسب للشركة مرتين: عائد المشروع بالدولار، ثم تغير سعر الدولار نفسه. بنفس فكرة النسبة السوقية:

    $$
    1 + i_{\mathrm{dinar}} = (1 + i_{\mathrm{dollar}})(1 + d)
    $$

    $$
    i_{\mathrm{dollar}} = \frac{[[1+idn|f4]]}{[[1+d|f4]]} - 1 = [[iu|%2]]
    $$

    [[pick(d > 0, 'إذا كان الدولار سيرتفع، تقبل الشركة عائدا أقل بالدولار، لأن ارتفاعه يكمل الباقي.', 'إذا كان الدولار سينخفض، تطلب الشركة عائدا أعلى بالدولار، لتعوض انخفاضه.')]]

    الطريقتان متكافئتان: خصم التدفقات بالدولار بنسبة [[iu|%2]] ثم التحويل بسعر اليوم، يساوي تحويل كل تدفق بسعر سنته ثم الخصم بنسبة [[idn|%]].
