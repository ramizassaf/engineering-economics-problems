items:

- id: c08-c-01
  kind: problem
  part: C
  vars: {ir: 0.05, f: 0.06}
  random: {ir: [0.01, 0.12, 0.005], f: [0.01, 0.15, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
  text: |
    العائد الحقيقي المطلوب [[ir|%]]، والتضخم المتوقع [[f|%]]. ما النسبة السوقية؟
  solution: |
    $$
    i_m = [[ir|r]] + [[f|r]] + [[ir|r]] \times [[f|r]] = [[im|%2]]
    $$

- id: c08-c-02
  kind: problem
  part: C
  vars: {im: 0.14, f: 0.06}
  random: {im: [0.06, 0.20, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - ir = (1 + im)/(1 + f) - 1
  text: |
    الحد الأدنى للعائد في شركة [[im|%]]، وهو نسبة سوقية. التضخم المتوقع [[f|%]]. ما الحد الأدنى الحقيقي؟
  solution: |
    $$
    i_r = \frac{1 + [[im|r]]}{1 + [[f|r]]} - 1 = [[ir|%2]]
    $$

- id: c08-c-03
  kind: problem
  part: C
  vars: {im: 0.10, ir: 0.04}
  random: {im: [0.06, 0.20, 0.005], ir: [0.01, 0.05, 0.005]}
  calc:
    - f = (1 + im)/(1 + ir) - 1
  text: |
    سندات حكومية تعطي [[im|%]]، وسندات أخرى مربوطة بالتضخم تعطي [[ir|%]] فوق التضخم. ما التضخم الذي يتوقعه السوق ضمنيا؟
  solution: |
    المستثمر يقبل السندين معا عندما يتساوى عائدهما:

    $$
    f = \frac{1 + [[im|r]]}{1 + [[ir|r]]} - 1 = [[f|%2]]
    $$

- id: c08-c-04
  kind: problem
  part: C
  vars: {im: 0.25, f: 0.18}
  random: {im: [0.10, 0.45, 0.01], f: [0.05, 0.35, 0.01]}
  calc:
    - ir = (1 + im)/(1 + f) - 1
    - ap = im - f
  text: |
    في بلد تضخمه مرتفع، تعطي البنوك [[im|%]] والتضخم [[f|%]]. قارن العائد الحقيقي الدقيق بالتقريب الذي يطرح النسبتين.
  solution: |
    $$
    i_r = \frac{1 + [[im|r]]}{1 + [[f|r]]} - 1 = [[ir|%2]]
    $$

    التقريب [[ap|%2]]. الخطأ [[abs(ap-ir)|%2]] نقطة مئوية. عندما تكون النسب كبيرة، استخدم العلاقة الدقيقة.

- id: c08-c-05
  kind: problem
  part: C
  vars: {P: 20000, im: 0.08, f: 0.05, n: 6}
  random: {P: [2000, 80000, 1000], im: [0.03, 0.15, 0.005], f: [0.01, 0.12, 0.005], n: [2, 15, 1]}
  calc:
    - F = P*FP(im, n)
    - R = F*PF(f, n)
    - ir = (1 + im)/(1 + f) - 1
    - R2 = P*FP(ir, n)
  text: |
    وديعة [[P|g]] دينار بفائدة [[im|%]] لمدة [[yrs(n)]]. التضخم [[f|%]]. احسب قيمتها في النهاية بالدينار الثابت بطريقتين.
  solution: |
    **الطريقة الأولى:** الرصيد الفعلي، ثم نزيل التضخم:

    $$
    F = [[P|g]]\,(F/P,\ [[im|%]],\ [[n|n]]) = [[F|2]]
    $$

    $$
    R = [[F|2]]\,(P/F,\ [[f|%]],\ [[n|n]]) = [[R|2]]
    $$

    **الطريقة الثانية:** نمو مباشر بالنسبة الحقيقية [[ir|%2]]:

    $$
    R = [[P|g]]\,(F/P,\ [[ir|%2]],\ [[n|n]]) = [[R2|2]]
    $$

- id: c08-c-06
  kind: problem
  part: C
  vars: {P: 20000, X: 30000, f: 0.05, n: 8}
  random: {P: [5000, 50000, 1000], f: [0.01, 0.10, 0.005], n: [4, 15, 1], X: [5000, 80000, 1000]}
  calc:
    - X = floor(P*1.3/1000)*1000
    - im = (X*(1 + f)**n/P)**(1/n) - 1
  text: |
    أسرة تودع [[P|g]] دينار اليوم لتشتري بعد [[yrs(n)]] سيارة سعرها اليوم [[X|g]] دينار. سعر السيارة يرتفع مع التضخم [[f|%]]. ما الفائدة التي تحتاجها؟
  solution: |
    سعر السيارة الفعلي بعد [[yrs(n)]]:

    $$
    [[X|g]]\,(F/P,\ [[f|%]],\ [[n|n]]) = [[X*FP(f, n)|2]]
    $$

    $$
    i = \left(\frac{[[X*FP(f, n)|2]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[im|%2]]
    $$

- id: c08-c-07
  kind: problem
  part: C
  vars: {im: 0.04, f: -0.02}
  random: {im: [0.01, 0.08, 0.005], f: [-0.04, -0.005, 0.005]}
  calc:
    - ir = (1 + im)/(1 + f) - 1
  text: |
    في فترة ركود انخفضت الأسعار [[abs(f)|%]] سنويا، والبنوك تعطي [[im|%]]. ما العائد الحقيقي؟
  solution: |
    التضخم سالب:

    $$
    i_r = \frac{1 + [[im|r]]}{1 - [[abs(f)|r]]} - 1 = [[ir|%2]]
    $$

    العائد الحقيقي أعلى من المعلن، لأن الدينار يشتري أكثر مع الزمن.

- id: c08-c-08
  kind: problem
  part: C
  vars: {rm: 0.18, f: 0.06}
  random: {rm: [0.08, 0.35, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - rr = (1 + rm)/(1 + f) - 1
  text: |
    معدل العائد الداخلي لمشروع محسوب من تدفقات بالدينار الفعلي [[rm|%]]. التضخم [[f|%]]. ما المعدل الحقيقي؟
  solution: |
    $$
    IRR_r = \frac{1 + [[rm|r]]}{1 + [[f|r]]} - 1 = [[rr|%2]]
    $$

    قارنه بحد أدنى حقيقي، أو قارن [[rm|%]] بحد أدنى سوقي.

- id: c08-c-09
  kind: problem
  part: C
  vars: {ir: 0.07, f1: 0.03, f2: 0.10}
  random: {ir: [0.02, 0.12, 0.005], f1: [0.01, 0.05, 0.005], f2: [0.06, 0.20, 0.005]}
  calc:
    - m1 = (1 + ir)*(1 + f1) - 1
    - m2 = (1 + ir)*(1 + f2) - 1
  text: |
    شركة تريد عائدا حقيقيا [[ir|%]] على استثماراتها. ما حدها الأدنى السوقي إذا كان التضخم [[f1|%]]؟ وإذا ارتفع إلى [[f2|%]]؟
  solution: |
    $$
    i_{m1} = [[m1|%2]], \qquad i_{m2} = [[m2|%2]]
    $$

    كلما ارتفع التضخم ارتفع الحد الأدنى السوقي، مع أن الشركة لا تطلب عائدا حقيقيا أكبر.

- id: c08-c-10
  kind: problem
  part: C
  vars: {ia: 0.09, ib: 0.025, f: 0.06}
  random: {ia: [0.04, 0.15, 0.005], ib: [0.01, 0.05, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - ra = (1 + ia)/(1 + f) - 1
  text: |
    بنك أ يعطي [[ia|%]] ثابتة. بنك ب يعطي حسابا مربوطا بالتضخم: يرفع الرصيد مع التضخم، ثم يضيف [[ib|%]]. التضخم المتوقع [[f|%]]. أيهما أفضل؟
  solution: |
    حساب البنك ب يعطي عائدا حقيقيا [[ib|%]] مهما كان التضخم. البنك أ يعطي عائدا حقيقيا:

    $$
    \frac{1 + [[ia|r]]}{1 + [[f|r]]} - 1 = [[ra|%2]]
    $$

    الأفضل بالتضخم المتوقع: [[pick(ra > ib, 'البنك أ', 'البنك ب')]]. لكن إذا جاء التضخم أعلى من المتوقع، يخسر البنك أ ميزته، ويبقى البنك ب محميا.

- id: c08-c-11
  kind: problem
  part: C
  vars: {X: 15000, n: 5, f: 0.05, im: 0.08}
  random: {X: [3000, 60000, 1000], n: [3, 15, 1], f: [0.01, 0.10, 0.005], im: [0.03, 0.14, 0.005]}
  calc:
    - Fn = X*FP(f, n)
    - A = Fn*AF(im, n)
  text: |
    طالب يريد أن يجمع بعد [[yrs(n)]] ثمن جهاز سعره اليوم [[X|g]] دينار، ويرتفع مع التضخم [[f|%]]. يودع مبلغا ثابتا في نهاية كل سنة بفائدة [[im|%]]. كم يودع؟
  solution: |
    سعر الجهاز الفعلي يوم الشراء:

    $$
    F = [[X|g]]\,(F/P,\ [[f|%]],\ [[n|n]]) = [[Fn|2]]
    $$

    $$
    A = [[Fn|2]]\,(A/F,\ [[im|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c08-c-12
  kind: problem
  part: C
  vars: {X: 15000, n: 5, f: 0.05, im: 0.08}
  random: {X: [3000, 60000, 1000], n: [3, 15, 1], f: [0.01, 0.10, 0.005], im: [0.06, 0.14, 0.005]}
  calc:
    - ir = (1 + im)/(1 + f) - 1
    - Ar = X*AF(ir, n)
    - A1 = Ar*(1 + f)
    - An = Ar*(1 + f)**n
  text: |
    في المسألة السابقة، يريد الطالب أن يرفع إيداعه كل سنة مع التضخم، لأن دخله يرتفع معه. كم يودع في السنة الأولى؟ وكم في السنة الأخيرة؟
  solution: |
    الإيداع ثابت بالدينار الثابت، فنعمل بالنسبة الحقيقية:

    $$
    i_r = [[ir|%2]]
    $$

    $$
    A_r = [[X|g]]\,(A/F,\ [[ir|%2]],\ [[n|n]]) = [[Ar|2]]
    $$

    بأسعار اليوم يودع [[Ar|2]] دينار كل سنة. فعليا يودع [[A1|2]] دينار في السنة الأولى، و[[An|2]] دينار في السنة [[n|n]].
