- id: c08-d-01
  kind: problem
  part: D
  vars: {C: 40000, R: 11000, n: 5, ir: 0.07}
  random: {C: [10000, 120000, 5000], R: [3000, 40000, 500], n: [3, 12, 1], ir: [0.03, 0.12, 0.005]}
  calc:
    - PW = -C + R*PA(ir, n)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا بأسعار اليوم لمدة [[yrs(n)]]. الحد الأدنى الحقيقي [[ir|%]]. احسب القيمة الحالية.
  solution: |
    التدفقات بالدينار الثابت، فنخصم بالنسبة الحقيقية:

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[PW|2]]
    $$

    لا نحتاج نسبة التضخم أصلا.

- id: c08-d-02
  kind: problem
  part: D
  vars: {C: 30000, R: 12000, ir: 0.06, f: 0.08}
  random: {C: [10000, 80000, 5000], R: [4000, 35000, 500], ir: [0.03, 0.12, 0.005], f: [0.01, 0.12, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - a1 = R*(1 + f)
    - a2 = R*(1 + f)**2
    - a3 = R*(1 + f)**3
    - PW = NPV(im, [-C, a1, a2, a3])
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا بأسعار اليوم لمدة 3 سنوات، ويرتفع مع التضخم [[f|%]]. الحد الأدنى الحقيقي [[ir|%]]. احسب القيمة الحالية بالدينار الفعلي، وتأكد بالدينار الثابت.
  solution: |
    $$
    i_m = [[im|%2]]
    $$

    | السنة | 1 | 2 | 3 |
    | --- | --- | --- | --- |
    | الدينار الفعلي | [[a1|2]] | [[a2|2]] | [[a3|2]] |
    | معامل الخصم | [[PF(im, 1)|f4]] | [[PF(im, 2)|f4]] | [[PF(im, 3)|f4]] |

    $$
    PW = [[PW|2]]
    $$

    بالدينار الثابت:

    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ [[ir|%]],\ 3) = [[-C+R*PA(ir, 3)|2]]
    $$

- id: c08-d-03
  kind: problem
  part: D
  vars: {A: 8000, n: 6, im: 0.12, f: 0.05}
  random: {A: [2000, 30000, 500], n: [3, 12, 1], im: [0.07, 0.16, 0.005], f: [0.01, 0.10, 0.005]}
  calc:
    - P = A*PA(im, n)
    - ir = (1 + im)/(1 + f) - 1
    - W = A*PA(ir, n)
  text: |
    عقد صيانة بمبلغ ثابت [[A|g]] دينار سنويا لمدة [[yrs(n)]]. الحد الأدنى السوقي [[im|%]]، والتضخم [[f|%]]. ما القيمة الحالية للعقد؟ وما الخطأ إذا خصمته بالنسبة الحقيقية؟
  solution: |
    المبلغ ثابت بالدينار الفعلي:

    $$
    PW = [[A|g]]\,(P/A,\ [[im|%]],\ [[n|n]]) = [[P|2]]
    $$

    بالنسبة الحقيقية [[ir|%2]] نحصل على [[W|2]] دينار، أي أعلى بمقدار [[W-P|2]] دينار. هذا يعامل المبلغ الثابت كأنه يرتفع مع الأسعار.

- id: c08-d-04
  kind: problem
  part: D
  vars: {A1: 6300, f: 0.05, ir: 0.06, n: 7}
  random: {A1: [1000, 20000, 100], f: [0.01, 0.10, 0.005], ir: [0.03, 0.10, 0.005], n: [3, 15, 1]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - Rr = A1/(1 + f)
    - P = Rr*PA(ir, n)
    - P2 = A1*PGEO(f, im, n)
  text: |
    تكلفة تشغيل [[A1|g]] دينار فعلي في السنة الأولى، وترتفع مع التضخم [[f|%]]، لمدة [[yrs(n)]]. الحد الأدنى الحقيقي [[ir|%]]. ما القيمة الحالية؟
  solution: |
    بالدينار الثابت كل دفعة:

    $$
    \frac{[[A1|g]]}{1 + [[f|r]]} = [[Rr|2]]
    $$

    $$
    PW = [[Rr|2]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[P|2]]
    $$

    للتأكد، بالدينار الفعلي والسلسلة المتدرجة نسبيا بالنسبة السوقية [[im|%2]]: [[P2|2]] دينار.

- id: c08-d-05
  kind: problem
  part: D
  vars: {C: 50000, R: 22000, O: 8000, f: 0.07, im: 0.12}
  random: {C: [20000, 100000, 5000], R: [10000, 50000, 1000], O: [2000, 20000, 500], f: [0.02, 0.12, 0.005], im: [0.07, 0.18, 0.005]}
  calc:
    - O = min(O, floor(R*0.5/500)*500)
    - c1 = R - O*(1 + f)
    - c2 = R - O*(1 + f)**2
    - c3 = R - O*(1 + f)**3
    - c4 = R - O*(1 + f)**4
    - PW = NPV(im, [-C, c1, c2, c3, c4])
  text: |
    شركة توقع عقدا لتوريد قطع لمدة 4 سنوات بسعر ثابت يعطي إيرادا [[R|g]] دينار سنويا. المعدات تكلف [[C|g]] دينار. تكاليف التشغيل [[O|g]] دينار بأسعار اليوم، وترتفع مع التضخم [[f|%]]. الحد الأدنى السوقي [[im|%]]. احسب القيمة الحالية.
  solution: |
    الإيراد ثابت بالدينار الفعلي، والتكاليف ترتفع. نعمل بالدينار الفعلي:

    | السنة | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- |
    | الإيراد | [[R|0]] | [[R|0]] | [[R|0]] | [[R|0]] |
    | التشغيل | [[-O*(1+f)|0]] | [[-O*(1+f)**2|0]] | [[-O*(1+f)**3|0]] | [[-O*(1+f)**4|0]] |
    | التدفق | [[c1|0]] | [[c2|0]] | [[c3|0]] | [[c4|0]] |

    $$
    PW = [[PW|2]]
    $$

    العقد بسعر ثابت ينقل خطر التضخم إلى المورد.

- id: c08-d-06
  kind: problem
  part: D
  vars: {S: 9000, f: 0.06, n: 6, ir: 0.07}
  random: {S: [1000, 30000, 500], f: [0.01, 0.12, 0.005], n: [3, 12, 1], ir: [0.03, 0.10, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - A = S*FP(f, n)
    - P = S*PF(ir, n)
  text: |
    آلة مستعملة عمرها [[yrs(n)]] تباع اليوم بمبلغ [[S|g]] دينار. يتوقع أن تباع الآلة الجديدة بعد [[yrs(n)]] بنفس هذا المبلغ بأسعار اليوم. التضخم [[f|%]]، والحد الأدنى الحقيقي [[ir|%]]. ما سعر البيع الفعلي المتوقع؟ وما قيمته الحالية؟
  solution: |
    المبلغ المقدر بأسعار اليوم دينار ثابت. سعره الفعلي:

    $$
    [[S|g]]\,(F/P,\ [[f|%]],\ [[n|n]]) = [[A|2]]
    $$

    القيمة الحالية بالنسبة الحقيقية:

    $$
    [[S|g]]\,(P/F,\ [[ir|%]],\ [[n|n]]) = [[P|2]]
    $$

    أو بالفعلي والسوقية: [[A|2]] مخصوما بنسبة [[im|%2]] يعطي [[A*PF(im, n)|2]] دينار.

- id: c08-d-07
  kind: problem
  part: D
  vars: {C: 60000, R: 15000, S: 6000, n: 6, ir: 0.06}
  random: {C: [20000, 120000, 5000], R: [5000, 40000, 500], S: [0, 15000, 500], n: [4, 12, 1], ir: [0.03, 0.10, 0.005]}
  calc:
    - AW = -C*AP(ir, n) + R + S*AF(ir, n)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا بأسعار اليوم، وقيمة بيعه [[S|g]] دينار بأسعار اليوم بعد [[yrs(n)]]. الحد الأدنى الحقيقي [[ir|%]]. ما القيمة السنوية بالدينار الثابت؟
  solution: |
    $$
    AW = -[[C|g]]\,(A/P,\ [[ir|%]],\ [[n|n]]) + [[R|g]] + [[S|g]]\,(A/F,\ [[ir|%]],\ [[n|n]]) = [[AW|2]]
    $$

    هذا مبلغ بأسعار اليوم كل سنة. المشروع [[pick(AW >= 0, 'مقبول', 'مرفوض')]].

- id: c08-d-08
  kind: problem
  part: D
  vars: {Ca: 20000, Oa: 7000, Cb: 34000, Ob: 4000, n: 8, ir: 0.06}
  random: {Ca: [10000, 30000, 1000], Oa: [4000, 12000, 500], Cb: [25000, 50000, 1000], Ob: [1500, 7000, 500], n: [5, 12, 1], ir: [0.03, 0.10, 0.005]}
  calc:
    - Pa = Ca + Oa*PA(ir, n)
    - Pb = Cb + Ob*PA(ir, n)
  text: |
    آلة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا بأسعار اليوم. آلة ب تكلف [[Cb|g]] دينار، وتشغيلها [[Ob|g]] دينار بأسعار اليوم. التشغيل يرتفع مع التضخم. العمر [[yrs(n)]] لكل منهما. الحد الأدنى الحقيقي [[ir|%]]. أيهما أرخص؟
  solution: |
    التشغيل يرتفع مع التضخم، فهو ثابت بالدينار الثابت:

    $$
    PW_a = [[Ca|g]] + [[Oa|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[Pa|2]]
    $$

    $$
    PW_b = [[Cb|g]] + [[Ob|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[Pb|2]]
    $$

    الأرخص: الآلة [[pick(Pa <= Pb, 'أ', 'ب')]]. التضخم يزيد ثقل التكاليف الجارية، فمن الخطأ خصمها بالنسبة السوقية إذا كانت بأسعار اليوم.

- id: c08-d-09
  kind: problem
  part: D
  vars: {C: 50000, R: 13000, n: 6, f: 0.06, r0: 0}
  random: {C: [20000, 120000, 5000], n: [4, 12, 1], f: [0.01, 0.12, 0.005], r0: [0.03, 0.20, 0.005]}
  calc:
    - R = pick(r0 > 0, ceil(C*AP(max(r0, 0.01), n)/100)*100, R)
    - rr = RATE(n, R, C)
    - rm = (1 + rr)*(1 + f) - 1
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا بأسعار اليوم لمدة [[yrs(n)]]، ويرتفع مع التضخم [[f|%]]. ما المعدل الحقيقي؟ وما المعدل بالدينار الفعلي؟
  solution: |
    بالدينار الثابت التدفقات متساوية:

    ```excel
    =RATE([[n|n]], [[R|r]], -[[C|r]])
    ```

    المعدل الحقيقي [[rr|%2]]. المعدل بالدينار الفعلي:

    $$
    (1 + [[rr|f4]])(1 + [[f|r]]) - 1 = [[rm|%2]]
    $$

- id: c08-d-10
  kind: problem
  part: D
  vars: {C: 40000, R: 10000, n: 6, ir: 0.06, f: 0.07}
  random: {C: [10000, 100000, 5000], R: [3000, 30000, 500], n: [3, 12, 1], ir: [0.03, 0.10, 0.005], f: [0.02, 0.12, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - Pr = -C + R*PA(ir, n)
    - Pw = -C + R*PA(im, n)
  text: |
    محلل قدر أن مشروعا يكلف [[C|g]] دينار، ويوفر [[R|g]] دينار سنويا بأسعار اليوم لمدة [[yrs(n)]]. ثم خصم الوفر بالحد الأدنى السوقي للشركة [[im|%2]]. التضخم [[f|%]]. ما الخطأ في قيمته الحالية؟
  solution: |
    حساب المحلل:

    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ [[im|%2]],\ [[n|n]]) = [[Pw|2]]
    $$

    الصحيح بالنسبة الحقيقية [[ir|%]]:

    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[Pr|2]]
    $$

    الخطأ [[Pr-Pw|2]] دينار. [[pick(Pw < 0, pick(Pr >= 0, 'المحلل رفض مشروعا مقبولا.', 'الخطأ دائما في اتجاه واحد: يقلل قيمة المشروع.'), 'الخطأ دائما في اتجاه واحد: يقلل قيمة المشروع.')]]

- id: c08-d-11
  kind: problem
  part: D
  vars: {A1: 21000, f: 0.04, ir: 0.05}
  random: {A1: [5000, 80000, 1000], f: [0.01, 0.08, 0.005], ir: [0.03, 0.08, 0.005]}
  calc:
    - im = (1 + ir)*(1 + f) - 1
    - P1 = A1/(1 + f)/ir
    - P2 = A1/(im - f)
  text: |
    بلدية تشغل محطة مياه بلا نهاية. تكلفة التشغيل [[A1|g]] دينار في السنة الأولى، وترتفع مع التضخم [[f|%]]. الحد الأدنى الحقيقي [[ir|%]]. ما القيمة الحالية لكل تكاليف التشغيل؟
  solution: |
    بالدينار الثابت كل دفعة [[A1/(1+f)|2]] دينار، فهي سلسلة دائمة:

    $$
    P = \frac{[[A1/(1+f)|2]]}{[[ir|r]]} = [[P1|2]]
    $$

    بالدينار الفعلي، السلسلة الدائمة المتدرجة نسبيا قيمتها الدفعة الأولى مقسومة على الفرق بين النسبة السوقية ونسبة النمو:

    $$
    P = \frac{[[A1|g]]}{[[im|f4]] - [[f|r]]} = [[P2|2]]
    $$

- id: c08-d-12
  kind: problem
  part: D
  vars: {S: 9000, n: 8, ir: 0.06}
  random: {S: [2000, 30000, 500], n: [4, 15, 1], ir: [0.03, 0.10, 0.005]}
  calc:
    - C = S*PA(ir, n)
  text: |
    روبوت لحام يوفر أجور عامل [[S|g]] دينار سنويا بأسعار اليوم، لمدة [[yrs(n)]]. الأجور ترتفع مع التضخم. الحد الأدنى الحقيقي [[ir|%]]. ما أعلى ثمن يستحق دفعه في الروبوت؟
  solution: |
    $$
    C = [[S|g]]\,(P/A,\ [[ir|%]],\ [[n|n]]) = [[C|2]]
    $$

    لا نحتاج نسبة التضخم، ما دامت الأجور ترتفع معه.

- id: c08-d-13
  kind: problem
  part: D
  vars: {C: 45000, A: 13000, n: 5, f: 0.06, r0: 0}
  random: {C: [10000, 100000, 5000], n: [3, 10, 1], f: [0.01, 0.12, 0.005], r0: [0.06, 0.25, 0.005]}
  calc:
    - A = pick(r0 > 0, ceil(C*AP(max(r0, 0.01), n)/100)*100, A)
    - rm = RATE(n, A, C)
    - rr = (1 + rm)/(1 + f) - 1
  text: |
    شركة تؤجر معدات اشترتها بمبلغ [[C|g]] دينار بعقد ثابت [[A|g]] دينار سنويا لمدة [[yrs(n)]]. التضخم [[f|%]]. ما المعدل السوقي والمعدل الحقيقي للاستثمار؟
  solution: |
    الإيجار ثابت بالدينار الفعلي، فالمعدل المحسوب منه سوقي:

    ```excel
    =RATE([[n|n]], [[A|r]], -[[C|r]])
    ```

    $$
    IRR_m = [[rm|%2]]
    $$

    $$
    IRR_r = \frac{1 + [[rm|f4]]}{1 + [[f|r]]} - 1 = [[rr|%2]]
    $$

- id: c08-d-14
  kind: problem
  part: D
  vars: {P: 24000, k: 0.03, n: 4, im: 0.12}
  random: {P: [5000, 60000, 1000], k: [0.0, 0.08, 0.01], n: [2, 6, 1], im: [0.07, 0.16, 0.005]}
  calc:
    - A = P*(1 + k)/n
    - W = A*PA(im, n)
  text: |
    معرض سيارات يبيع سيارة نقدا بمبلغ [[P|g]] دينار، أو بالتقسيط على [[n|n]] دفعات سنوية متساوية مجموعها أعلى من السعر النقدي بنسبة [[k|%]]. الدفعات ثابتة لا تتغير. المشتري يكسب [[im|%]] على أمواله. أيهما أفضل؟
  solution: |
    الدفعة:

    $$
    A = \frac{[[P|g]] \times (1 + [[k|r]])}{[[n|n]]} = [[A|2]]
    $$

    الدفعات ثابتة بالدينار الفعلي، فنخصمها بالنسبة السوقية:

    $$
    PW = [[A|2]]\,(P/A,\ [[im|%]],\ [[n|n]]) = [[W|2]]
    $$

    الأفضل: [[pick(W < P, 'التقسيط', 'الدفع نقدا')]].
