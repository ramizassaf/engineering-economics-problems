items:

- id: c04-d-01
  kind: problem
  part: D
  vars: {C1: 20000, R1: 6000, dC: 15000, dR: 3500, i: 0.10, r1: 0, rd: 0}
  random: {C1: [10000, 50000, 1000], r1: [0.14, 0.30, 0.01], dC: [5000, 40000, 1000], rd: [0.03, 0.25, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - R1 = pick(r1 > 0, floor(C1*AP(r1, 6)/100)*100, R1)
    - dR = pick(rd > 0, floor(dC*AP(rd, 6)/100)*100, dR)
    - C2 = C1 + dC
    - R2 = R1 + dR
    - ra = RATE(6, R1, C1)
    - rdd = RATE(6, dR, dC)
  text: |
    مشروعان متنافيان، عمر كل منهما 6 سنوات. الأول يكلف [[C1|g]] دينار ويعطي [[R1|g]] دينار سنويا. الثاني يكلف [[C2|g]] دينار ويعطي [[R2|g]] دينار سنويا. اختر بالتحليل التزايدي بنسبة [[i|%]].
  solution: |
    معدل الأول [[ra|%2]]، أعلى من [[i|%]]، فهو مقبول.

    الفرق: [[dC|g]] دينار استثمار إضافي و[[dR|g]] دينار دخل إضافي سنويا.

    $$
    [[dR|g]]\,(P/A,\ \Delta i,\ 6) = [[dC|g]] \quad\Rightarrow\quad \Delta i = [[rdd|%2]]
    $$

    القرار: المشروع [[pick(rdd >= i, 'الثاني', 'الأول')]].

- id: c04-d-02
  kind: problem
  part: D
  vars: {C1: 20000, R1: 6000, dC: 15000, dR: 3500, i: 0.10, r1: 0, rd: 0}
  random: {C1: [10000, 50000, 1000], r1: [0.14, 0.30, 0.01], dC: [5000, 40000, 1000], rd: [0.03, 0.25, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - R1 = pick(r1 > 0, floor(C1*AP(r1, 6)/100)*100, R1)
    - dR = pick(rd > 0, floor(dC*AP(rd, 6)/100)*100, dR)
    - C2 = C1 + dC
    - R2 = R1 + dR
    - P1 = -C1 + R1*PA(i, 6)
    - P2 = -C2 + R2*PA(i, 6)
  text: |
    حل المسألة السابقة بالقيمة الحالية. هل تحصل على نفس القرار؟
  solution: |
    $$
    PW_1 = [[P1|2]], \qquad PW_2 = [[P2|2]]
    $$

    الأكبر قيمة: المشروع [[pick(P2 >= P1, 'الثاني', 'الأول')]]. التحليل التزايدي والقيمة الحالية يعطيان نفس القرار دائما.

- id: c04-d-03
  kind: problem
  part: D
  vars: {Ca: 25000, Oa: 9000, dC: 12000, dO: 2800, i: 0.10, r0: 0}
  random: {Ca: [10000, 40000, 1000], Oa: [5000, 15000, 250], dC: [4000, 25000, 1000], r0: [0.02, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - dO = pick(r0 > 0, floor(dC*AP(r0, 7)/50)*50, dO)
    - Cb = Ca + dC
    - Ob = Oa - dO
    - rd = RATE(7, dO, dC)
  text: |
    مكبس هيدروليكي من النوع أ يكلف [[Ca|g]] دينار وتشغيله [[Oa|g]] دينار سنويا. النوع ب يكلف [[Cb|g]] دينار وتشغيله [[Ob|g]] دينار سنويا. عمر كل منهما 7 سنوات. أيهما تختار بنسبة [[i|%]]؟
  solution: |
    الاستثمار الإضافي [[dC|g]] دينار يوفر [[dO|g]] دينار سنويا:

    $$
    [[dO|g]]\,(P/A,\ \Delta i,\ 7) = [[dC|g]] \quad\Rightarrow\quad \Delta i = [[rd|%2]]
    $$

    نختار النوع [[pick(rd >= i, 'ب', 'أ')]].

- id: c04-d-04
  kind: problem
  part: D
  vars: {Ca: 25000, Oa: 9000, Sa: 3000, dC: 12000, dO: 2500, Sb: 6000, i: 0.10, r0: 0}
  random: {Ca: [10000, 40000, 1000], Oa: [5000, 15000, 250], Sa: [0, 5000, 500], dC: [4000, 15000, 1000], Sb: [0, 10000, 500], r0: [0.02, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Sb = max(Sb, Sa)
    - dS = Sb - Sa
    - dO = pick(r0 > 0, floor((dC - dS*PF(r0, 6))*AP(max(r0, 0.01), 6)/50)*50, dO)
    - rd = IRR([-dC, dO, dO, dO, dO, dO, dO + dS], -0.5, 1.0)
  text: |
    آلة أ تكلف [[Ca|g]] دينار، وتشغيلها [[Oa|g]] دينار سنويا، وقيمة بيعها [[Sa|g]] دينار. آلة ب تكلف [[Ca+dC|g]] دينار، وتشغيلها [[Oa-dO|g]] دينار سنويا، وقيمة بيعها [[Sb|g]] دينار. عمر كل منهما 6 سنوات. احسب المعدل التزايدي واختر بنسبة [[i|%]].
  solution: |
    تدفقات الفرق، أي الآلة ب ناقص الآلة أ: [[-dC|r]] في السنة 0، ثم [[dO|r]] توفير سنوي، وفي السنة 6 يضاف فرق قيمة البيع [[dS|r]].

    $$
    -[[dC|g]] + [[dO|g]]\,(P/A,\ \Delta i,\ 6) + [[dS|g]]\,(P/F,\ \Delta i,\ 6) = 0
    $$

    بالدالة IRR على تدفقات الفرق: [[rd|%2]]. نختار الآلة [[pick(rd >= i, 'ب', 'أ')]].

- id: c04-d-05
  kind: problem
  part: D
  calc:
    - rA = RATE(4, 3500, 10000)
    - rB = RATE(4, 8000, 25000)
    - rd = RATE(4, 4500, 15000)
    - PA_ = -10000 + 3500*PA(0.08, 4)
    - PB_ = -25000 + 8000*PA(0.08, 4)
  text: |
    مشروع أ يكلف 10,000 دينار ويعطي 3,500 دينار سنويا لمدة 4 سنوات. مشروع ب يكلف 25,000 دينار ويعطي 8,000 دينار سنويا لمدة 4 سنوات. الحد الأدنى للعائد 8%. أي المشروعين صاحب المعدل الأعلى؟ وأيهما تختار؟
  solution: |
    المعدلان:

    $$
    r_a = [[rA|%2]], \qquad r_b = [[rB|%2]]
    $$

    معدل الفرق:

    $$
    4{,}500\,(P/A,\ \Delta i,\ 4) = 15{,}000 \quad\Rightarrow\quad \Delta i = [[rd|%2]]
    $$

    القيمة الحالية بنسبة 8%: المشروع أ [[PA_|2]] دينار، والمشروع ب [[PB_|2]] دينار. نختار [[pick(rd >= 0.08, 'المشروع ب، مع أن معدله أقل', 'المشروع أ')]].

- id: c04-d-06
  kind: problem
  part: D
  calc:
    - rc = RATE(4, 4500, 15000)
  text: |
    للمشروعين في المسألة السابقة: ما النسبة التي تتساوى عندها قيمتاهما الحاليتان؟ ومتى يتغير القرار؟
  solution: |
    القيمتان الحاليتان تتساويان عند معدل الفرق: [[rc|%2]]. إذا كان الحد الأدنى للعائد أقل من هذه النسبة نختار المشروع ب، وإذا كان أعلى نختار المشروع أ.

- id: c04-d-07
  kind: problem
  part: D
  vars: {C: 10000, i: 0.10, r1: 0.25, r2: 0.18, k: 3}
  random: {C: [5000, 30000, 1000], r1: [0.18, 0.35, 0.01], r2: [0.10, 0.22, 0.01], k: [2, 4, 1], i: [0.06, 0.12, 0.01]}
  calc:
    - R1 = C*AP(r1, 5)
    - C2 = C*k
    - R2 = C2*AP(r2, 5)
    - rd = RATE(5, R2 - R1, C2 - C)
    - P1 = -C + R1*PA(i, 5)
    - P2 = -C2 + R2*PA(i, 5)
  text: |
    مشروع صغير يكلف [[C|g]] دينار ويعطي [[R1|2]] دينار سنويا لمدة 5 سنوات، ومعدله [[r1|%]]. مشروع كبير يكلف [[C2|g]] دينار ويعطي [[R2|2]] دينار سنويا لمدة 5 سنوات، ومعدله [[r2|%]]. الحد الأدنى للعائد [[i|%]]. اختر.
  solution: |
    معدل الفرق:

    $$
    [[R2-R1|2]]\,(P/A,\ \Delta i,\ 5) = [[C2-C|g]] \quad\Rightarrow\quad \Delta i = [[rd|%2]]
    $$

    القيمة الحالية: الصغير [[P1|2]] دينار، والكبير [[P2|2]] دينار. القرار: المشروع [[pick(rd >= i, 'الكبير', 'الصغير')]].

- id: c04-d-08
  kind: problem
  part: D
  vars: {Ca: 8000, Oa: 2600, dC: 5000, Ob: 1500, i: 0.10, r0: 0}
  random: {Ca: [4000, 15000, 500], Oa: [4000, 8000, 100], dC: [3000, 10000, 500], r0: [0.02, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Cb = Ca + dC
    - Ob = pick(r0 > 0, Oa - floor(dC*AP(r0, 5)/50)*50, Ob)
    - rd = RATE(5, Oa - Ob, Cb - Ca)
    - Pa = Ca + Oa*PA(i, 5)
    - Pb = Cb + Ob*PA(i, 5)
  text: |
    سخان مياه شمسي يكلف [[Cb|g]] دينار وتكلفة طاقته [[Ob|g]] دينار سنويا. سخان كهربائي يكلف [[Ca|g]] دينار وتكلفة طاقته [[Oa|g]] دينار سنويا. عمر كل منهما 5 سنوات. هل الاستثمار الإضافي في الشمسي يستحق بنسبة [[i|%]]؟
  solution: |
    $$
    [[Oa-Ob|g]]\,(P/A,\ \Delta i,\ 5) = [[Cb-Ca|g]] \quad\Rightarrow\quad \Delta i = [[rd|%2]]
    $$

    [[pick(rd >= i, 'المعدل أعلى من الحد الأدنى، فالشمسي يستحق.', 'المعدل أقل من الحد الأدنى، فالكهربائي أفضل.')]] القيمة الحالية للتكاليف: الكهربائي [[Pa|2]] دينار، والشمسي [[Pb|2]] دينار.

- id: c04-d-09
  kind: problem
  part: D
  vars: {C1: 30000, R1: 9000, dC: 20000, R2: 13000, i: 0.12, ra0: 0, rd0: 0}
  random: {C1: [15000, 40000, 1000], dC: [5000, 30000, 1000], ra0: [0.04, 0.25, 0.01], rd0: [0.02, 0.25, 0.01], i: [0.06, 0.15, 0.01]}
  calc:
    - C2 = C1 + dC
    - R1 = pick(ra0 > 0, floor(C1*AP(ra0, 6)/100)*100, R1)
    - R2 = pick(rd0 > 0, R1 + floor(dC*AP(rd0, 6)/100)*100, R2)
    - ra = RATE(6, R1, C1)
    - rd = RATE(6, R2 - R1, C2 - C1)
    - best = pick(ra < i, pick(RATE(6, R2, C2) >= i, 'المشروع الثاني', 'عدم التنفيذ'), pick(rd >= i, 'المشروع الثاني', 'المشروع الأول'))
  text: |
    مشروعان متنافيان، عمر كل منهما 6 سنوات، والحد الأدنى للعائد [[i|%]]. الأول يكلف [[C1|g]] دينار ويعطي [[R1|2]] دينار سنويا. الثاني يكلف [[C2|g]] دينار ويعطي [[R2|2]] دينار سنويا. ماذا تختار؟ انتبه للخطوة الأولى.
  solution: |
    الخطوة الأولى: هل الأرخص مقبول أصلا؟ معدله [[ra|%2]]، فهو [[pick(ra >= i, 'مقبول', 'مرفوض، فنقارن الثاني بعدم التنفيذ مباشرة')]].

    معدل الفرق بين المشروعين [[rd|%2]]، ومعدل الثاني وحده [[RATE(6, R2, C2)|%2]].

    القرار: [[best]].

- id: c04-d-10
  kind: problem
  part: D
  vars: {C1: 40000, R1: 11000, dC: 20000, dR: 4500, i: 0.10, r10: 0, rd0: 0}
  random: {C1: [20000, 60000, 1000], dC: [10000, 40000, 1000], r10: [0.08, 0.25, 0.01], rd0: [0.03, 0.25, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - R1 = pick(r10 > 0, floor(C1*AP(r10, 8)/100)*100, R1)
    - dR = pick(rd0 > 0, floor(dC*AP(rd0, 8)/100)*100, dR)
    - rd = RATE(8, dR, dC)
    - r1 = RATE(8, R1, C1)
    - r2 = RATE(8, R1 + dR, C1 + dC)
  text: |
    طالب قارن مشروعين عمرهما 8 سنوات بمعدل كل منهما: الأول يكلف [[C1|g]] دينار ويعطي [[R1|2]] دينار سنويا، والثاني يكلف [[C1+dC|g]] دينار ويعطي [[R1+dR|2]] دينار سنويا. اختار صاحب المعدل الأعلى. هل قراره صحيح بنسبة [[i|%]]؟
  solution: |
    معدلا المشروعين [[r1|%2]] و[[r2|%2]]، فاختار الطالب المشروع [[pick(r1 >= r2, 'الأول', 'الثاني')]].

    معدل الفرق [[rd|%2]]. القرار الصحيح: المشروع [[pick(rd >= i, 'الثاني', 'الأول')]]. قرار الطالب [[pick((r1 >= r2) == (rd < i), 'صحيح هنا بالصدفة، لكن طريقته خاطئة', 'خاطئ')]].

- id: c04-d-11
  kind: problem
  part: D
  vars: {Ca: 15000, Oa: 4000, dC: 9000, Ob: 2600, i: 0.10, r0: 0}
  random: {Ca: [8000, 25000, 500], Oa: [2500, 6000, 100], dC: [2000, 8000, 500], r0: [0.02, 0.25, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - Cb = Ca + dC
    - Ob = pick(r0 > 0, Oa - floor(dC*AP(r0, 10)/50)*50, Ob)
    - rd = IRR([-(Cb - Ca), Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob, Oa - Ob], -0.5, 1.0)
    - Aa = Ca*AP(i, 10) + Oa
    - Ab = Cb*AP(i, 10) + Ob
  text: |
    خطا إنتاج لعمر 10 سنوات. الأول يكلف [[Ca|g]] دينار وتشغيله [[Oa|g]] دينار سنويا. الثاني يكلف [[Cb|g]] دينار وتشغيله [[Ob|g]] دينار سنويا. احسب المعدل التزايدي، وتأكد بالقيمة السنوية بنسبة [[i|%]].
  solution: |
    $$
    [[Oa-Ob|g]]\,(P/A,\ \Delta i,\ 10) = [[Cb-Ca|g]] \quad\Rightarrow\quad \Delta i = [[rd|%2]]
    $$

    $$
    AW_1 = [[Aa|2]], \qquad AW_2 = [[Ab|2]]
    $$

    نختار الخط [[pick(rd >= i, 'الثاني', 'الأول')]].

- id: c04-d-12
  kind: problem
  part: D
  vars: {C: 9000, R: 2500, k: 2, r0: 0}
  random: {C: [5000, 20000, 500], k: [2, 3, 1], r0: [0.04, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, 5)/100)*100, R)
    - r1 = RATE(5, R, C)
    - rk = RATE(5, R*k, C*k)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة 5 سنوات. إذا ضاعفنا المشروع [[k|n]] مرات، بالتكلفة والدخل، ماذا يحدث للمعدل؟ وللقيمة الحالية؟
  solution: |
    المعدل لا يتغير: [[r1|%2]] قبل وبعد، لأن ضرب كل التدفقات في نفس الرقم لا يغير النسبة التي تجعل مجموعها صفرا. المعدل بعد المضاعفة [[rk|%2]].

    القيمة الحالية تتضاعف [[k|n]] مرات. هذا يوضح لماذا لا يكفي المعدل للمقارنة: لا يرى حجم المشروع.

- id: c04-d-13
  kind: problem
  part: D
  vars: {C: 30000, k: 0.22, i: 0.10}
  random: {C: [15000, 50000, 1000], k: [0.18, 0.28, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - L = floor(C*k/50)*50
    - S = floor(C*0.30/500)*500
    - rd = IRR([-(C - L), L, L, L, L, S])
  text: |
    شركة تحتاج سيارة لمدة 5 سنوات. تستطيع استئجارها بمبلغ [[L|g]] دينار سنويا يدفع في بداية كل سنة، أو شراءها بسعر [[C|g]] دينار وبيعها بعد 5 سنوات بقيمة [[S|g]] دينار. الصيانة على الشركة في الحالتين. ما المعدل التزايدي للشراء مقابل الاستئجار؟ وماذا تختار بنسبة [[i|%]]؟
  solution: |
    تدفقات الفرق، أي الشراء ناقص الاستئجار:

    | السنة | 0 | 1 | 2 | 3 | 4 | 5 |
    | --- | --- | --- | --- | --- | --- | --- |
    | الفرق | [[L-C|g]] | [[L|g]] | [[L|g]] | [[L|g]] | [[L|g]] | [[S|g]] |

    في السنة 0 تدفع الشركة السعر لكنها توفر الإيجار الأول. في السنوات من 1 إلى 4 توفر الإيجار. في السنة 5 لا يوجد إيجار، لكنها تبيع السيارة.

    المعدل بالدالة IRR: [[rd|%2]]. الشراء [[pick(rd >= i, 'أفضل', 'أسوأ')]] من الاستئجار، لأن المعدل [[pick(rd >= i, 'أعلى من', 'أقل من')]] [[i|%]].

- id: c04-d-14
  kind: problem
  part: D
  calc:
    - ra = IRR([-20000, 15000, 8000, 2000])
    - rb = IRR([-20000, 2000, 9000, 16000])
    - pa10 = NPV(0.10, [-20000, 15000, 8000, 2000])
    - pb10 = NPV(0.10, [-20000, 2000, 9000, 16000])
    - rdx = IRR([0, -13000, 1000, 14000], -0.5, 1.0)
  text: |
    مشروعان متنافيان يكلف كل منهما 20,000 دينار. المشروع أ يعطي 15,000 ثم 8,000 ثم 2,000 دينار. المشروع ب يعطي 2,000 ثم 9,000 ثم 16,000 دينار. الحد الأدنى للعائد 10%. احسب المعدلين والقيمتين الحاليتين. أيهما تختار؟
  solution: |
    المعدلان [[ra|%2]] للمشروع أ و[[rb|%2]] للمشروع ب. القيمتان الحاليتان بنسبة 10%: [[pa10|2]] و[[pb10|2]].

    المشروعان بنفس التكلفة، لكن المشروع أ يعيد ماله أسرع. المعدل يفضل المشروع أ. القيمة الحالية بنسبة 10% تفضل [[pick(pb10 >= pa10, 'المشروع ب', 'المشروع أ')]]، لأن الحد الأدنى منخفض، فالدخل المتأخر لا يخصم كثيرا. القرار الصحيح بالقيمة الحالية: [[pick(pb10 >= pa10, 'المشروع ب', 'المشروع أ')]]. معدل الفرق، أي المشروع ب ناقص المشروع أ، [[rdx|%2]]، وهو [[pick(rdx >= 0.10, 'أعلى', 'أقل')]] من 10%.

- id: c04-d-15
  kind: problem
  part: D
  vars: {C1: 12000, R1: 4000, dC: 8000, dR: 1800, i: 0.10, r10: 0, rd0: 0}
  random: {C1: [6000, 20000, 500], dC: [3000, 15000, 500], r10: [0.05, 0.25, 0.01], rd0: [0.02, 0.25, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - R1 = pick(r10 > 0, floor(C1*AP(r10, 5)/100)*100, R1)
    - dR = pick(rd0 > 0, floor(dC*AP(rd0, 5)/100)*100, dR)
    - C2 = C1 + dC
    - R2 = R1 + dR
    - rd = RATE(5, R2 - R1, C2 - C1)
    - P1 = -C1 + R1*PA(i, 5)
    - P2 = -C2 + R2*PA(i, 5)
  text: |
    استخدم القيمة الحالية لتدفقات الفرق، بدل المعدل، للاختيار بين مشروعين عمرهما 5 سنوات: الأول يكلف [[C1|g]] دينار ويعطي [[R1|2]] دينار سنويا، والثاني يكلف [[C2|g]] دينار ويعطي [[R2|2]] دينار سنويا. النسبة [[i|%]].
  solution: |
    $$
    PW_{2-1} = -[[C2-C1|g]] + [[R2-R1|2]]\,(P/A,\ [[i|%]],\ 5) = [[P2-P1|2]]
    $$

