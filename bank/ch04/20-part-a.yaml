items:

- id: c04-a-01
  kind: concept
  part: A
  text: |
    عرف معدل العائد الداخلي بجملة واحدة.
  solution: |
    هو النسبة التي تجعل القيمة الحالية لكل تدفقات المشروع صفرا.

- id: c04-a-02
  kind: concept
  part: A
  text: |
    مشروع معدله 15%. هل يعني هذا أن كل الاستثمار يكسب 15% طوال عمر المشروع؟
  solution: |
    لا. المعدل هو العائد على الرصيد الذي لم يسترد بعد في كل سنة. الرصيد يقل كل سنة حتى يصل إلى الصفر في نهاية العمر.

- id: c04-a-03
  kind: concept
  part: A
  text: |
    لماذا لا نختار بين بديلين متنافيين بأعلى معدل؟
  solution: |
    لأن المعدل نسبة لا تعكس حجم الاستثمار. البديل الأغلى قد يكون معدله أقل لكنه يضيف ثروة أكبر، إذا كان المال الإضافي فيه يكسب أكثر من الحد الأدنى للعائد.

- id: c04-a-04
  kind: concept
  part: A
  text: |
    ما المعدل التزايدي؟ وكيف تتخذ القرار به؟
  solution: |
    هو معدل الفرق بين تدفقات بديلين: الاستثمار الإضافي مقابل الدخل أو التوفير الإضافي. إذا كان أعلى من الحد الأدنى للعائد نختار البديل الأغلى، وإلا نبقى على الأرخص.

- id: c04-a-05
  kind: concept
  part: A
  text: |
    لماذا لا نحسب معدلا لكل بديل في بدائل التكاليف؟
  solution: |
    لأن بدائل التكاليف ليس لها دخل، فكل تدفقاتها سالبة ولا توجد نسبة تجعل قيمتها الحالية صفرا. نحسب المعدل للفرق بين بديلين فقط، حيث التوفير يقابل الاستثمار الإضافي.

- id: c04-a-06
  kind: concept
  part: A
  text: |
    متى يمكن أن يكون لمشروع أكثر من معدل؟ أعط مثالا من الواقع.
  solution: |
    عندما تتغير إشارة التدفقات أكثر من مرة. مثال: منجم أو مكب نفايات يحتاج تكلفة كبيرة لإعادة تأهيل الموقع في نهاية عمره.

- id: c04-a-07
  kind: concept
  part: A
  text: |
    ما الافتراض الضمني في معدل العائد الداخلي عن الدخل الذي يأتي خلال عمر المشروع؟ وكيف يعالجه المعدل المعدل؟
  solution: |
    المعدل يفترض أن الدخل يعاد استثماره بنفس المعدل. المعدل المعدل ينقل الدخل إلى نهاية العمر بنسبة إعادة استثمار واقعية، غالبا الحد الأدنى للعائد.

- id: c04-a-08
  kind: concept
  part: A
  text: |
    منحنى القيمة الحالية لمشروعين يتقاطع عند 14%. والحد الأدنى للعائد 10%. أي المشروعين نختار؟
  solution: |
    نختار المشروع صاحب القيمة الحالية الأكبر عند 10%. تحت نقطة التقاطع يتفوق المشروع الذي منحناه أشد انحدارا، وهو غالبا الأكبر استثمارا أو الأبعد دخلا.

- id: c04-a-09
  kind: concept
  part: A
  text: |
    لماذا تستخدم الحكومات نسبة المنفعة إلى التكلفة بدل معدل العائد على الاستثمار؟
  solution: |
    لأن المنافع تعود للمواطنين وليس للحكومة، فلا يوجد إيراد يحسب منه عائد للحكومة. النسبة تقارن ما يكسبه المجتمع بما تدفعه الحكومة.

- id: c04-a-10
  kind: concept
  part: A
  text: |
    قرض بفائدة معلنة 8% مع رسوم إدارية تخصم عند الصرف. هل التكلفة الحقيقية أكبر أم أصغر من 8%؟ لماذا؟
  solution: |
    أكبر. المقترض يدفع أقساطا محسوبة على كامل القرض، لكنه يستلم مبلغا أقل. المعدل الذي يساوي بين الأقساط والمبلغ المستلم أعلى من المعدل المعلن.
