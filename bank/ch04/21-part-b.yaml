- id: c04-b-01
  kind: problem
  part: B
  vars: {C: 25000, R: 7000, n: 5, r0: 0}
  random: {C: [5000, 60000, 1000], n: [3, 10, 1], r0: [0.05, 0.35, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
  text: |
    استثمار يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ما معدل العائد الداخلي؟
  solution: |
    $$
    [[R|g]]\,(P/A,\ i,\ [[n|n]]) = [[C|g]]
    $$

    ```excel
    =RATE([[n|n]], [[R|r]], -[[C|r]])
    ```

    المعدل [[r|%2]].

- id: c04-b-02
  kind: problem
  part: B
  vars: {P: 10000, F: 16000, n: 5, r0: 0}
  random: {P: [2000, 50000, 500], n: [2, 15, 1], r0: [0.03, 0.20, 0.005]}
  calc:
    - F = pick(r0 > 0, floor(P*FP(r0, n)/100)*100, F)
    - r = (F/P)**(1/n) - 1
  text: |
    اشترى شخص قطعة أرض بسعر [[P|g]] دينار، وباعها بعد [[yrs(n)]] بسعر [[F|g]] دينار. ما معدل العائد؟
  solution: |
    مبلغان فقط، فالحل مباشر:

    $$
    [[F|g]] = [[P|g]]\,(1+i)^{[[n|n]]} \quad\Rightarrow\quad i = \left(\frac{[[F|g]]}{[[P|g]]}\right)^{1/[[n|n]]} - 1 = [[r|%2]]
    $$

    ```excel
    =RRI([[n|n]], [[P|r]], [[F|r]])
    ```

- id: c04-b-03
  kind: problem
  part: B
  vars: {C: 40000, R: 9000, S: 8000, r0: 0, s: 0}
  random: {C: [10000, 80000, 1000], s: [0.05, 0.25, 0.05], r0: [0.05, 0.30, 0.01]}
  calc:
    - S = pick(r0 > 0, floor(C*s/500)*500, S)
    - R = pick(r0 > 0, floor((C - S*PF(r0, 5))*AP(r0, 5)/100)*100, R)
    - r = IRR([-C, R, R, R, R, R + S])
  text: |
    آلة تكلف [[C|g]] دينار، وتوفر [[R|g]] دينار سنويا لمدة 5 سنوات، وتباع بقيمة [[S|g]] دينار. ما معدل العائد الداخلي؟
  solution: |
    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ i,\ 5) + [[S|g]]\,(P/F,\ i,\ 5) = 0
    $$

    التدفقات في Excel: [[-C|r]] ثم [[R|r]] أربع مرات، ثم [[R+S|r]]. الدالة IRR تعطي [[r|%2]].

- id: c04-b-04
  kind: problem
  part: B
  vars: {C: 40000, R: 9000, S: 8000, r0: 0, s: 0}
  random: {C: [10000, 80000, 1000], s: [0.05, 0.25, 0.05], r0: [0.05, 0.30, 0.01]}
  calc:
    - S = pick(r0 > 0, floor(C*s/500)*500, S)
    - R = pick(r0 > 0, floor((C - S*PF(r0, 5))*AP(r0, 5)/100)*100, R)
    - r = IRR([-C, R, R, R, R, R + S])
    - i1 = floor(r*100)/100
    - P1 = -C + R*PA(i1, 5) + S*PF(i1, 5)
    - P2 = -C + R*PA(i1 + 0.01, 5) + S*PF(i1 + 0.01, 5)
    - ri = i1 + 0.01*P1/(P1 - P2)
  text: |
    للآلة في المسألة السابقة: احسب القيمة الحالية عند نسبتين متتاليتين يقع المعدل بينهما، ثم قدر المعدل بالاستكمال الخطي. ما الخطأ في التقدير؟
  solution: |
    $$
    PW([[i1|%]]) = [[P1|2]], \qquad PW([[i1+0.01|%]]) = [[P2|2]]
    $$

    $$
    i \approx [[i1|%]] + 1\% \times \frac{[[P1|2]]}{[[P1|2]] - [[P2|2]]} = [[ri|%2]]
    $$

    المعدل الدقيق [[r|%2]]. الخطأ صغير جدا، أقل من جزء من مئة من النقطة المئوية، لأن المنحنى قريب من الخط المستقيم على مسافة 1%.

- id: c04-b-05
  kind: problem
  part: B
  vars: {c0: 30000, c1: 5000, c2: 9000, c3: 12000, c4: 14000}
  random: {c0: [20000, 40000, 1000], c1: [2000, 10000, 500], c2: [4000, 14000, 500], c3: [6000, 16000, 500], c4: [8000, 18000, 500]}
  calc:
    - r = IRR([-c0, c1, c2, c3, c4])
  text: |
    مشروع يكلف [[c0|g]] دينار، ويعطي في السنوات من 1 إلى 4 المبالغ [[c1|g]] و[[c2|g]] و[[c3|g]] و[[c4|g]] دينار. ما معدل العائد الداخلي؟
  solution: |
    ```excel
    =IRR(B1:B5)
    ```

    ```python
    import numpy_financial as npf
    print(round(npf.irr([-[[c0|r]], [[c1|r]], [[c2|r]], [[c3|r]], [[c4|r]]]), 4))
    ```

    المعدل [[r|%2]].

- id: c04-b-06
  kind: problem
  part: B
  vars: {C: 20000, A1: 3000, G: 1500, r0: 0, g: 0}
  random: {C: [10000, 50000, 1000], r0: [0.08, 0.20, 0.01], g: [0.02, 0.06, 0.005]}
  calc:
    - G = pick(r0 > 0, floor(C*g/50)*50, G)
    - A1 = pick(r0 > 0, floor((C - G*PG(max(r0, 0.01), 6))*AP(max(r0, 0.01), 6)/50)*50, A1)
    - A1 = max(A1, 500)
    - r = IRR([-C, A1, A1 + G, A1 + 2*G, A1 + 3*G, A1 + 4*G, A1 + 5*G])
  text: |
    مشروع يكلف [[C|g]] دينار. دخله [[A1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار كل سنة لمدة 6 سنوات. ما معدل العائد الداخلي؟
  solution: |
    $$
    -[[C|g]] + [[A1|g]]\,(P/A,\ i,\ 6) + [[G|g]]\,(P/G,\ i,\ 6) = 0
    $$

    بالدالة IRR على التدفقات السنوية: [[r|%2]].

- id: c04-b-07
  kind: problem
  part: B
  vars: {C: 50000, A1: 8000, g: 0.06, r0: 0}
  random: {C: [20000, 100000, 1000], g: [0.02, 0.08, 0.005], r0: [0.06, 0.20, 0.01]}
  calc:
    - A1 = pick(r0 > 0, floor(C/PGEO(g, r0, 8)/50)*50, A1)
    - r = IRR([-C, A1, A1*(1+g), A1*(1+g)**2, A1*(1+g)**3, A1*(1+g)**4, A1*(1+g)**5, A1*(1+g)**6, A1*(1+g)**7])
  text: |
    نظام طاقة شمسية يكلف [[C|g]] دينار، ويوفر [[A1|g]] دينار في السنة الأولى. التوفير يزيد [[g|%]] سنويا لمدة 8 سنوات. ما معدل العائد الداخلي؟
  solution: |
    $$
    [[A1|g]] \times \frac{1 - \left(\frac{[[1+g|r]]}{1+i}\right)^{8}}{i - [[g|r]]} = [[C|g]]
    $$

    في Excel ضع التوفير في عمود، كل صف يزيد [[g|%]] عن الذي قبله، ثم استخدم الدالة IRR.

    وفي Python:

    ```python
    import numpy_financial as npf
    flows = [-[[C|r]]] + [ [[A1|r]] * (1 + [[g|r]]) ** k for k in range(8) ]
    print(round(npf.irr(flows), 4))
    ```

    المعدل [[r|%2]].

- id: c04-b-08
  kind: problem
  part: B
  vars: {P: 5000, A: 0, N: 24, r0: 0}
  random: {P: [1000, 15000, 100], N: [12, 48, 6], r0: [0.06, 0.30, 0.01]}
  calc:
    - A = pick(r0 > 0, ceil(P*AP(r0/12, N)), 240)
    - im = RATE(N, A, P)
    - ia = (1+im)**12 - 1
  text: |
    معرض أجهزة كهربائية يبيع ثلاجة وغسالة معا بسعر [[P|g]] دينار نقدا، أو بأقساط [[A|g]] دينار شهريا لمدة [[N|n]] شهرا. ما المعدل الشهري؟ وما المعدل الفعلي السنوي؟
  solution: |
    ```excel
    =RATE([[N|n]], [[A|r]], -[[P|r]])
    ```

    المعدل الشهري [[im|%2]]، والفعلي السنوي:

    $$
    i_a = (1 + [[im|f4]])^{12} - 1 = [[ia|%2]]
    $$

- id: c04-b-09
  kind: problem
  part: B
  vars: {P: 8000, D: 2000, A: 0, N: 24, r0: 0}
  random: {P: [3000, 20000, 500], N: [12, 36, 6], r0: [0.06, 0.30, 0.01]}
  calc:
    - D = floor(P*0.25/100)*100
    - A = pick(r0 > 0, ceil((P - D)*AP(r0/12, N)), 290)
    - im = RATE(N, A, P - D)
    - ia = (1+im)**12 - 1
  text: |
    سيارة مستعملة سعرها [[P|g]] دينار نقدا. التاجر يقبل دفعة أولى [[D|g]] دينار، ثم [[A|g]] دينار شهريا لمدة [[N|n]] شهرا. ما المعدل الفعلي السنوي؟
  solution: |
    الدفعة الأولى تدفع اليوم، فالمبلغ الممول فعلا هو [[P-D|g]] دينار:

    $$
    [[A|g]]\,(P/A,\ i_m,\ [[N|n]]) = [[P-D|g]] \quad\Rightarrow\quad i_m = [[im|%2]]
    $$

    $$
    i_a = (1 + [[im|f4]])^{12} - 1 = [[ia|%2]]
    $$

- id: c04-b-10
  kind: problem
  part: B
  vars: {A: 70, F: 1000, P: 950}
  random: {A: [40, 100, 5], P: [850, 1100, 10]}
  calc:
    - r = IRR([-P, A, A, A, A, A, A, A, A, A, A + F])
  text: |
    سند قيمته الاسمية 1,000 دينار، يدفع فائدة [[A|g]] دينار في نهاية كل سنة لمدة 10 سنوات، ثم يعيد 1,000 دينار في النهاية. اشتراه مستثمر بسعر [[P|g]] دينار. ما معدل العائد الذي يحققه؟
  solution: |
    $$
    -[[P|g]] + [[A|g]]\,(P/A,\ i,\ 10) + 1{,}000\,(P/F,\ i,\ 10) = 0
    $$

    ```excel
    =RATE(10, [[A|r]], -[[P|r]], 1000)
    ```

    المعدل [[r|%2]]. إذا كان سعر الشراء أقل من 1,000 دينار فالمعدل أعلى من نسبة الفائدة على السند، [[A/1000|%]]، والعكس.

- id: c04-b-11
  kind: problem
  part: B
  vars: {C: 15000, R: 0, n: 6, r0: 0}
  random: {C: [5000, 40000, 500], n: [3, 12, 1], r0: [0.05, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/50)*50, 3600)
    - f = C/R
    - r = RATE(n, R, C)
  text: |
    استخدم جدول P/A في الملحق لتقدير معدل استثمار يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ثم تأكد بالدالة RATE.
  solution: |
    المطلوب النسبة التي يساوي عندها المعامل:

    $$
    (P/A,\ i,\ [[n|n]]) = \frac{[[C|g]]}{[[R|g]]} = [[f|f4]]
    $$

    في عمود [[yrs(n)]] من جدول P/A، ابحث عن الصفين اللذين تقع القيمة بينهما، واستكمل. الدالة RATE تعطي [[r|%2]].

- id: c04-b-12
  kind: problem
  part: B
  vars: {C: 12000, R: 3000, r0: 0}
  random: {C: [5000, 30000, 500], r0: [0.05, 0.20, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*FP(r0, 2)*AP(r0, 6)/50)*50, R)
    - r = IRR([-C, 0, 0, R, R, R, R, R, R])
  text: |
    مشروع يكلف [[C|g]] دينار اليوم، لكن دخله يبدأ بعد سنتين من الإنشاء: [[R|g]] دينار سنويا لمدة 6 سنوات، أولها في السنة 3. ما المعدل؟
  solution: |
    $$
    [[R|g]]\,(P/A,\ i,\ 6)\,(P/F,\ i,\ 2) = [[C|g]]
    $$

    في Excel اكتب في عمود: [[-C|r]]، ثم صفرين، ثم [[R|r]] ست مرات، واستخدم الدالة IRR. المعدل [[r|%2]].
