- id: c04-c-01
  kind: problem
  part: C
  vars: {C: 70000, R: 16000, n: 7, i: 0.12, r0: 0}
  random: {C: [20000, 120000, 1000], n: [4, 12, 1], r0: [0.04, 0.25, 0.01], i: [0.08, 0.15, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
    - PW = -C + R*PA(i, n)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. الحد الأدنى للعائد [[i|%]]. احسب المعدل، وقرر، ثم تأكد بالقيمة الحالية.
  solution: |
    المعدل [[r|%2]]، فالمشروع [[pick(r >= i, 'مقبول', 'مرفوض')]].

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[PW|2]]
    $$

    القيمة الحالية [[pick(PW >= 0, 'موجبة', 'سالبة')]]، فالقرار نفسه.

- id: c04-c-02
  kind: problem
  part: C
  vars: {C: 70000, n: 7, i: 0.12}
  random: {C: [20000, 120000, 1000], n: [4, 12, 1], i: [0.06, 0.18, 0.01]}
  calc:
    - R = C*AP(i, n)
  text: |
    مشروع يكلف [[C|g]] دينار وعمره [[yrs(n)]]. ما أقل دخل سنوي يجعل معدله يساوي الحد الأدنى للعائد [[i|%]]؟
  solution: |
    عندما يساوي المعدل الحد الأدنى، تكون القيمة الحالية صفرا عند هذه النسبة:

    $$
    R = [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[R|2]]
    $$

- id: c04-c-03
  kind: problem
  part: C
  vars: {R: 12000, n: 8, i: 0.10}
  random: {R: [3000, 30000, 500], n: [4, 15, 1], i: [0.06, 0.18, 0.01]}
  calc:
    - C = R*PA(i, n)
  text: |
    آلة توفر [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ما أعلى سعر يجعل معدلها لا يقل عن [[i|%]]؟
  solution: |
    $$
    C_{max} = [[R|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[C|2]]
    $$

- id: c04-c-04
  kind: problem
  part: C
  vars: {C: 50000, R: 12000, n: 6, r0: 0}
  random: {C: [20000, 90000, 1000], n: [4, 10, 1], r0: [0.03, 0.25, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ما المعدل؟ هل تقبله شركة حدها الأدنى 8%؟ وأخرى حدها 15%؟
  solution: |
    المعدل [[r|%2]]. الشركة الأولى [[pick(r >= 0.08, 'تقبله', 'ترفضه')]]، والثانية [[pick(r >= 0.15, 'تقبله', 'ترفضه')]]. المعدل خاصية للمشروع وحده، أما القرار فيعتمد على الحد الأدنى في كل شركة.

- id: c04-c-05
  kind: problem
  part: C
  vars: {C: 30000, R: 7000, S: 5000, n: 5, d: 0}
  random: {C: [10000, 60000, 1000], n: [5, 5, 1], d: [0.05, 0.25, 0.01]}
  calc:
    - R = pick(d > 0, floor(C*AP(d, 5)/100)*100, R)
    - S = pick(d > 0, floor(C*0.15/500)*500, S)
    - r0 = IRR([-C, R, R, R, R, R + S])
    - r1 = IRR([-C, R, R, R, R, R])
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا لمدة 5 سنوات، وقيمة بيعه [[S|g]] دينار. ما المعدل؟ وكم ينقص إذا لم يبع بشيء؟
  solution: |
    مع قيمة البيع المعدل [[r0|%2]]، وبدونها [[r1|%2]]. قيمة البيع ترفع المعدل بمقدار [[r0-r1|%2]] نقطة مئوية.

- id: c04-c-06
  kind: problem
  part: C
  vars: {C: 100000, R: 22000, n: 8, i: 0.12, t: 0.25, r0: 0}
  random: {C: [40000, 150000, 5000], n: [5, 12, 1], i: [0.08, 0.15, 0.01], t: [0.10, 0.30, 0.05], r0: [0.06, 0.25, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
    - Rl = R*(1 - t)
    - rl = RATE(n, Rl, C)
  text: |
    مشروع يكلف [[C|g]] دينار، ودخله المتوقع [[R|g]] دينار سنويا لمدة [[yrs(n)]]. الحد الأدنى للعائد [[i|%]]. ماذا يحدث للمعدل وللقرار إذا جاء الدخل أقل من المتوقع بنسبة [[t|%]]؟
  solution: |
    المعدل المتوقع [[r|%2]]. إذا انخفض الدخل إلى [[Rl|2]] دينار يصبح المعدل [[rl|%2]].

    القرار المتوقع: [[pick(r >= i, 'قبول', 'رفض')]]. بعد الانخفاض: [[pick(rl >= i, 'قبول', 'رفض')]]. هذا تحليل حساسية بسيط: يبين هل القرار متين أمام خطأ في التقدير.

- id: c04-c-07
  kind: problem
  part: C
  vars: {C: 80000, R: 17000, i: 0.10}
  random: {C: [30000, 150000, 5000], R: [6000, 35000, 1000], i: [0.06, 0.14, 0.01]}
  calc:
    - R = max(R, C*i*1.2)
    - n = -ln(1 - C*i/R)/ln(1+i)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا. ما أقل عمر يجعل معدله يساوي [[i|%]]؟
  solution: |
    $$
    [[R|g]]\,(P/A,\ [[i|%]],\ n) = [[C|g]]
    $$

    ```excel
    =NPER([[i|%]], [[R|r]], -[[C|r]])
    ```

    $$
    n = [[n|2]]
    $$

    إذا عاش المشروع أقل من ذلك فمعدله أقل من [[i|%]].

- id: c04-c-08
  kind: problem
  part: C
  vars: {C: 60000, R: 15000, n: 6, i: 0.10, r0: 0}
  random: {C: [20000, 100000, 1000], n: [4, 10, 1], i: [0.06, 0.15, 0.01], r0: [0.03, 0.25, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
    - PW = -C + R*PA(i, n)
    - AW = PW*AP(i, n)
    - FW = PW*FP(i, n)
  text: |
    لمشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]، احسب القيمة الحالية والسنوية والمستقبلية بنسبة [[i|%]]، ثم المعدل. هل تتفق الطرق الأربع؟
  solution: |
    | الطريقة | النتيجة |
    | --- | --- |
    | القيمة الحالية | [[PW|2]] |
    | القيمة السنوية | [[AW|2]] |
    | القيمة المستقبلية | [[FW|2]] |
    | المعدل | [[r|%2]] |

    الطرق الأربع تتفق: القيم الثلاث [[pick(PW >= 0, 'موجبة والمعدل أعلى من', 'سالبة والمعدل أقل من')]] [[i|%]].

- id: c04-c-09
  kind: problem
  part: C
  vars: {L: 30000, r: 0.07, n: 4, f: 600}
  random: {L: [5000, 60000, 1000], r: [0.04, 0.12, 0.005], n: [2, 8, 1], f: [100, 2000, 50]}
  calc:
    - A = L*AP(r, n)
    - re = RATE(n, A, L - f)
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]] لمدة [[yrs(n)]] بأقساط سنوية. البنك يأخذ رسوما ثابتة [[f|g]] دينار عند الصرف. ما التكلفة الحقيقية للقرض؟
  solution: |
    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    $$
    [[A|2]]\,(P/A,\ i,\ [[n|n]]) = [[L-f|g]] \quad\Rightarrow\quad i = [[re|%2]]
    $$

- id: c04-c-10
  kind: problem
  part: C
  vars: {P: 40000, d: 0.04}
  random: {P: [10000, 80000, 1000], d: [0.01, 0.08, 0.005]}
  calc:
    - net = P*(1 - d)
    - r = P/net - 1
  text: |
    مورد يعطي شركة خصما [[d|%]] إذا دفعت فاتورة [[P|g]] دينار نقدا اليوم، وإلا تدفعها كاملة بعد سنة. إذا لم تدفع نقدا، فكأنها اقترضت المبلغ المخصوم لمدة سنة. ما معدل هذا الاقتراض؟
  solution: |
    الدفع النقدي [[net|2]] دينار اليوم، أو [[P|g]] دينار بعد سنة:

    $$
    i = \frac{[[P|g]]}{[[net|2]]} - 1 = [[r|%2]]
    $$

    إذا كانت الشركة تقترض من البنك بنسبة أقل من [[r|%2]]، فالأفضل أن تقترض وتدفع نقدا.
