- id: c04-j-01
  kind: case
  part: J
  calc:
    - rA = RATE(10, 28000, 120000)
    - rB = IRR([-200000, 30000, 35000, 40000, 45000, 50000, 50000, 50000, 50000, 50000, 50000])
    - rd = IRR([-80000, 2000, 7000, 12000, 17000, 22000, 22000, 22000, 22000, 22000, 22000])
    - PA_ = -120000 + 28000*PA(0.12, 10)
    - PB_ = NPV(0.12, [-200000, 30000, 35000, 40000, 45000, 50000, 50000, 50000, 50000, 50000, 50000])
    - MB = ((30000*FP(0.12, 9) + 35000*FP(0.12, 8) + 40000*FP(0.12, 7) + 45000*FP(0.12, 6) + 50000*FA(0.12, 6))/200000)**(1/10) - 1
  text: |
    **حالة 4.1: توسعة مصنع ألبان في جنين**

    مصنع ألبان يدرس خيارين متنافيين لزيادة إنتاجه، لمدة 10 سنوات، والحد الأدنى للعائد 12%:

    - الخيار أ: خط تعبئة إضافي بتكلفة 120,000 دينار، يزيد الربح 28,000 دينار سنويا.
    - الخيار ب: خط جديد للأجبان بتكلفة 200,000 دينار. الربح يبدأ بمبلغ 30,000 دينار في السنة الأولى، ويزيد 5,000 دينار سنويا حتى يصل 50,000 دينار في السنة الخامسة، ثم يبقى ثابتا.

    (أ) ما معدل كل خيار؟ (ب) ما القيمة الحالية لكل خيار؟ (ج) اختر بالتحليل التزايدي. (د) المدير المالي يقول: الخيار أ أفضل لأن معدله أعلى. بماذا ترد؟ (هـ) ما المعدل المعدل للخيار ب بنسبة إعادة استثمار 12%؟
  solution: |
    (أ) معدل الخيار أ [[rA|%2]]، ومعدل الخيار ب [[rB|%2]].

    (ب)

    $$
    PW_a = -120{,}000 + 28{,}000\,(P/A,\ 12\%,\ 10) = [[PA_|2]]
    $$

    للخيار ب نكتب التدفقات في Excel ونستخدم الدالة NPV مع السنة 0 خارجها: [[PB_|2]] دينار.

    (ج) تدفقات الفرق، أي ب ناقص أ: -80,000 في السنة 0، ثم 2,000 و7,000 و12,000 و17,000، ثم 22,000 من السنة 5 إلى السنة 10. معدل الفرق [[rd|%2]]، وهو [[pick(rd >= 0.12, 'أعلى من 12%، فنختار الخيار ب', 'أقل من 12%، فنختار الخيار أ')]].

    (د) المعدل نسبة على مبلغ مختلف في كل خيار. السؤال الصحيح: هل 80,000 دينار الإضافية في الخيار ب تكسب 12% على الأقل؟ معدل الفرق يجيب، والقيمة الحالية تؤكد.

    (هـ)

    $$
    MIRR_b = [[MB|%2]]
    $$

- id: c04-j-02
  kind: case
  part: J
  calc:
    - im1 = RATE(36, 160, 4800)
    - ia1 = (1+im1)**12 - 1
    - A2 = 5000*0.9*AP(0.085/12, 36)
    - im2 = RATE(36, A2, 5000*0.9 - 5000*0.9*0.02)
    - ia2 = (1+im2)**12 - 1
    - c1 = 160*36
    - c2 = 500 + A2*36 + 90
  text: |
    **حالة 4.2: تقسيط أم قرض شخصي**

    موظفة تريد شراء أثاث سعره النقدي 5,000 دينار. أمامها خياران:

    - الخيار الأول: المعرض يقبل دفعة أولى 200 دينار، ثم 160 دينار شهريا لمدة 36 شهرا، بدون فوائد معلنة.
    - الخيار الثاني: تدفع 500 دينار من مدخراتها، وتأخذ قرضا شخصيا بقيمة 4,500 دينار من البنك بفائدة 8.5% سنويا تحسب شهريا لمدة 36 شهرا، مع رسوم 2% تخصم من القرض، فتدفع الفرق الناتج عن الرسوم من مدخراتها أيضا.

    (أ) ما المعدل الفعلي السنوي للتقسيط؟ (ب) ما القسط الشهري للقرض؟ (ج) ما التكلفة الفعلية للقرض مع الرسوم؟ (د) ما مجموع ما تدفعه في كل خيار؟ (هـ) أيهما تختار؟
  solution: |
    (أ) بعد الدفعة الأولى المبلغ الممول 4,800 دينار:

    $$
    160\,(P/A,\ i_m,\ 36) = 4{,}800 \quad\Rightarrow\quad i_m = [[im1|%2]]
    $$

    $$
    i_a = [[ia1|%2]]
    $$

    عبارة بدون فوائد غير صحيحة: الفائدة مخفية في الفرق بين مجموع الأقساط والسعر النقدي.

    (ب)

    $$
    A = 4{,}500\,(A/P,\ 0.708\%,\ 36) = [[A2|2]]
    $$

    (ج) الرسوم 90 دينار، فالمبلغ المستلم فعلا 4,410 دينار:

    $$
    [[A2|2]]\,(P/A,\ i_m,\ 36) = 4{,}410 \quad\Rightarrow\quad i_m = [[im2|%2]], \qquad i_a = [[ia2|%2]]
    $$

    (د) التقسيط: 200 دينار ثم أقساط مجموعها [[c1|g]] دينار. القرض: 500 دينار ثم 90 دينار رسوم ثم أقساط، والمجموع [[c2|2]] دينار.

    (هـ) القرض الشخصي [[pick(ia2 < ia1, 'أرخص، لأن تكلفته الفعلية أقل', 'أغلى')]]. المقارنة الصحيحة بالمعدل الفعلي، وليس بمجموع المدفوعات، لأن توقيت الدفعات مختلف.

- id: c04-j-03
  kind: case
  part: J
  calc:
    - f = PA(0.05, 30)
    - BC1 = (900000 - 100000)*f/(6000000 + 150000*f)
    - BC2 = (1100000 - 100000)*f/(9000000 + 180000*f)
    - dBC = 200000*f/(3000000 + 30000*f)
    - ir1 = RATE(30, 900000 - 100000 - 150000, 6000000)
    - f4 = PA(0.03, 30)
    - dBC3 = 200000*f4/(3000000 + 30000*f4)
  text: |
    **حالة 4.3: محطة تحلية مياه لقطاع ساحلي**

    سلطة المياه تدرس محطتي تحلية لمدة 30 سنة، بنسبة خصم 5% للمشاريع العامة:

    | | المحطة الصغيرة | المحطة الكبيرة |
    | --- | --- | --- |
    | تكلفة البناء | 6,000,000 | 9,000,000 |
    | التشغيل والصيانة السنوية | 150,000 | 180,000 |
    | المنافع السنوية للسكان | 900,000 | 1,100,000 |

    المنافع تشمل توفير شراء المياه المنقولة وتحسين الصحة العامة. لكن كلا المحطتين تسببان ضررا بيئيا للصيد البحري يقدر بمبلغ 100,000 دينار سنويا.

    (أ) احسب نسبة المنفعة إلى التكلفة لكل محطة. (ب) أيهما تختار بالنسبة التزايدية؟ (ج) ما معدل العائد الداخلي للمجتمع للمحطة الصغيرة؟ (د) جهة مانحة تقترح نسبة خصم 3%. هل يتغير القرار؟
  solution: |
    (أ) الضرر البيئي يطرح من المنافع:

    $$
    \left(\frac{B}{C}\right)_{s} = \frac{800{,}000\,(P/A,\ 5\%,\ 30)}{6{,}000{,}000 + 150{,}000\,(P/A,\ 5\%,\ 30)} = [[BC1|f4]]
    $$

    $$
    \left(\frac{B}{C}\right)_{l} = \frac{1{,}000{,}000\,(P/A,\ 5\%,\ 30)}{9{,}000{,}000 + 180{,}000\,(P/A,\ 5\%,\ 30)} = [[BC2|f4]]
    $$

    (ب) الضرر نفسه في المحطتين، فيختفي من الفرق:

    $$
    \frac{\Delta B}{\Delta C} = \frac{200{,}000\,(P/A,\ 5\%,\ 30)}{3{,}000{,}000 + 30{,}000\,(P/A,\ 5\%,\ 30)} = [[dBC|f4]]
    $$

    القرار: المحطة [[pick(BC1 < 1, pick(BC2 >= 1, 'الكبيرة', 'لا شيء'), pick(dBC >= 1, 'الكبيرة', 'الصغيرة'))]].

    (ج) صافي المنفعة السنوية للصغيرة 650,000 دينار:

    ```excel
    =RATE(30, 650000, -6000000)
    ```

    المعدل [[ir1|%2]].

    (د) بنسبة 3% النسبة التزايدية [[dBC3|f4]]، فالقرار: [[pick(dBC3 >= 1, 'المحطة الكبيرة', 'المحطة الصغيرة')]]. نسبة الخصم المنخفضة تعطي وزنا أكبر للمنافع البعيدة، فتشجع المشاريع الأكبر.
