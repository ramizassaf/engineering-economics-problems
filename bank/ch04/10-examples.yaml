# ------------------------------------------------------------ computing the IRR
- id: c04-ex-irr-trial
  kind: example
  title: |
    حساب المعدل بالتجربة والاستكمال
  vars: {C: 60000, R: 14000, S: 10000, s: 0, r0: 0}
  random: {C: [30000, 100000, 1000], s: [0.05, 0.20, 0.05], r0: [0.06, 0.22, 0.01]}
  calc:
    - S = pick(r0 > 0, floor(C*s/500)*500, S)
    - R = pick(r0 > 0, floor((C - S*PF(r0, 6))*AP(r0, 6)/100)*100, R)
    - r = IRR([-C, R, R, R, R, R, R + S])
    - i1 = floor(r*100)/100
    - i2 = i1 + 0.01
    - P1 = -C + R*PA(i1, 6) + S*PF(i1, 6)
    - P2 = -C + R*PA(i2, 6) + S*PF(i2, 6)
    - ri = i1 + 0.01*P1/(P1 - P2)
  diagram: {n: 6, i: "", flows: [[0, "-C"], [6, "R+S", "[[R|g]] + [[S|g]]"]], series: [[1, 5, "R"]]}
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا لمدة 6 سنوات، ثم يباع بقيمة [[S|g]] دينار. ما معدل العائد الداخلي؟
  solution: |
    معدل العائد الداخلي هو النسبة i التي تجعل القيمة الحالية صفرا:

    $$
    -[[C|g]] + [[R|g]]\,(P/A,\ i,\ 6) + [[S|g]]\,(P/F,\ i,\ 6) = 0
    $$

    لا يوجد حل مباشر لهذه المعادلة، فنجرب نسبا حتى تتغير إشارة القيمة الحالية:

    $$
    PW([[i1|%]]) = [[P1|2]], \qquad PW([[i2|%]]) = [[P2|2]]
    $$

    الإشارة تتغير بين النسبتين، فالمعدل بينهما. نقدره بالاستكمال الخطي:

    $$
    i \approx [[i1|%]] + 1\% \times \frac{[[P1|2]]}{[[P1|2]] - [[P2|2]]} = [[ri|%2]]
    $$

    في Excel اكتب التدفقات من السنة 0 إلى السنة 6 في الخلايا من B1 إلى B7:

    ```excel
    =IRR(B1:B7)
    ```

    في Python:

    ```python
    import numpy_financial as npf
    flows = [-[[C|r]]] + [ [[R|r]] ] * 5 + [ [[R+S|r]] ]
    print(round(npf.irr(flows), 4))
    ```

    المعدل الدقيق [[r|%2]]. الاستكمال يعطي تقديرا قريبا جدا لأن المسافة بين النسبتين صغيرة.

- id: c04-ex-irr-annuity
  kind: example
  title: |
    المعدل لدفعات متساوية
  vars: {C: 45000, R: 11000, n: 6, r0: 0}
  random: {C: [10000, 100000, 1000], n: [4, 12, 1], r0: [0.05, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - f = C/R
    - r = RATE(n, R, C)
  text: |
    آلة تكلف [[C|g]] دينار وتوفر [[R|g]] دينار سنويا لمدة [[yrs(n)]] بدون قيمة بيع. ما معدل العائد الداخلي؟
  solution: |
    القيمة الحالية صفر عندما يساوي المعامل P/A نسبة التكلفة إلى التوفير:

    $$
    (P/A,\ i,\ [[n|n]]) = \frac{[[C|g]]}{[[R|g]]} = [[f|f4]]
    $$

    في جدول P/A ابحث في عمود [[yrs(n)]] عن القيمة الأقرب، ثم استكمل بين صفين. في Excel الدالة RATE تعطي الجواب مباشرة:

    ```excel
    =RATE([[n|n]], [[R|r]], -[[C|r]])
    ```

    المعدل [[r|%2]].

- id: c04-ex-unrecovered
  kind: example
  title: |
    معنى المعدل: الرصيد غير المسترد
  vars: {C: 10000, R: 3200, r0: 0}
  random: {C: [5000, 20000, 500], r0: [0.06, 0.20, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, 4)/10)*10, R)
    - r = RATE(4, R, C)
    - I1 = C*r
    - B1 = C + I1 - R
    - I2 = B1*r
    - B2 = B1 + I2 - R
    - I3 = B2*r
    - B3 = B2 + I3 - R
    - I4 = B3*r
    - B4 = abs(B3 + I4 - R)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة 4 سنوات. معدل العائد الداخلي [[r|%2]]. ابن جدولا يبين المبلغ غير المسترد من الاستثمار في نهاية كل سنة.
  solution: |
    نعامل المشروع كأنه قرض أعطته الشركة للمشروع بنسبة تساوي المعدل. كل سنة يضاف عائد على الرصيد، ويطرح الدخل:

    | السنة | الرصيد في البداية | العائد على الرصيد | الدخل | الرصيد في النهاية |
    | --- | --- | --- | --- | --- |
    | 1 | [[C|2]] | [[I1|2]] | [[R|2]] | [[B1|2]] |
    | 2 | [[B1|2]] | [[I2|2]] | [[R|2]] | [[B2|2]] |
    | 3 | [[B2|2]] | [[I3|2]] | [[R|2]] | [[B3|2]] |
    | 4 | [[B3|2]] | [[I4|2]] | [[R|2]] | [[B4|2]] |

    الرصيد يصل إلى الصفر بالضبط في نهاية العمر. هذا هو معنى معدل العائد الداخلي: النسبة التي يكسبها المال الذي لم يسترد بعد. المعدل لا يقول إن كل الاستثمار يكسب هذه النسبة طوال المدة.

- id: c04-ex-irr-decision
  kind: example
  title: |
    القرار بالمعدل وبالقيمة الحالية
  vars: {C: 80000, R: 15000, S: 12000, i: 0.12, k: 0, s: 0}
  random: {C: [40000, 150000, 5000], k: [0.12, 0.24, 0.01], s: [0, 0.2, 0.05], i: [0.08, 0.16, 0.01]}
  calc:
    - R = pick(k > 0, floor(C*k/100)*100, R)
    - S = pick(k > 0, floor(C*s/500)*500, S)
    - r = IRR([-C, R, R, R, R, R, R, R, R + S])
    - PW = -C + R*PA(i, 8) + S*PF(i, 8)
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[R|g]] دينار سنويا لمدة 8 سنوات، وقيمة بيعه [[S|g]] دينار. الحد الأدنى للعائد [[i|%]]. هل يقبل؟ قرر بالمعدل، ثم بالقيمة الحالية.
  solution: |
    ```excel
    =IRR(B1:B9)
    ```

    المعدل [[r|%2]]، وهو [[pick(r >= i, 'أكبر من', 'أقل من')]] الحد الأدنى [[i|%]]. القاعدة: يقبل المشروع إذا كان معدله أكبر من الحد الأدنى للعائد أو يساويه.

    $$
    PW = -[[C|g]] + [[R|g]]\,(P/A,\ [[i|%]],\ 8) + [[S|g]]\,(P/F,\ [[i|%]],\ 8) = [[PW|2]]
    $$

    الطريقتان تعطيان نفس القرار: المشروع [[pick(r >= i, 'مقبول', 'مرفوض')]]. هذا صحيح دائما لمشروع واحد بتدفقات عادية، لأن القيمة الحالية تكون موجبة عند كل نسبة أقل من المعدل.

- id: c04-ex-irr-gradient
  kind: example
  title: |
    المعدل لدخل متدرج
  vars: {C: 40000, A1: 6000, G: 2000, k: 0, g: 0}
  random: {C: [20000, 60000, 1000], k: [0.12, 0.25, 0.01], g: [0.01, 0.05, 0.005]}
  calc:
    - A1 = pick(k > 0, floor(C*k/100)*100, A1)
    - G = pick(k > 0, floor(C*g/50)*50, G)
    - r = IRR([-C, A1, A1 + G, A1 + 2*G, A1 + 3*G, A1 + 4*G])
    - Pr = -C + A1*PA(r, 5) + G*PG(r, 5)
  text: |
    متجر جديد يكلف [[C|g]] دينار. صافي دخله [[A1|g]] دينار في السنة الأولى، ويزيد [[G|g]] دينار كل سنة لمدة 5 سنوات. ما معدل العائد الداخلي؟
  solution: |
    نبحث عن i التي تحقق:

    $$
    -[[C|g]] + [[A1|g]]\,(P/A,\ i,\ 5) + [[G|g]]\,(P/G,\ i,\ 5) = 0
    $$

    التدفقات في Excel: [[-C|r]] ثم [[A1|r]] و[[A1+G|r]] و[[A1+2*G|r]] و[[A1+3*G|r]] و[[A1+4*G|r]]. الدالة IRR تعطي المعدل [[r|%2]]. للتأكد نعوض المعدل في المعادلة:

    $$
    -[[C|g]] + [[A1|g]]\,(P/A,\ [[r|%2]],\ 5) + [[G|g]]\,(P/G,\ [[r|%2]],\ 5) = [[abs(Pr)|2]]
    $$

# ------------------------------------------------------------ comparing alternatives
- id: c04-ex-ranking-trap
  kind: example
  title: |
    أعلى معدل ليس دائما الأفضل
  calc:
    - rX = RATE(5, 4000, 10000)
    - rY = RATE(5, 10000, 30000)
    - PX = -10000 + 4000*PA(0.10, 5)
    - PY = -30000 + 10000*PA(0.10, 5)
  text: |
    مشروعان متنافيان، عمر كل منهما 5 سنوات، والحد الأدنى للعائد 10%. المشروع X يكلف 10,000 دينار ويعطي 4,000 دينار سنويا. المشروع Y يكلف 30,000 دينار ويعطي 10,000 دينار سنويا. أيهما تختار؟
  solution: |
    معدل كل مشروع:

    $$
    r_X = [[rX|%2]], \qquad r_Y = [[rY|%2]]
    $$

    كلاهما أعلى من 10%، والمشروع X معدله أعلى. لكن القيمة الحالية:

    $$
    PW_X = [[PX|2]], \qquad PW_Y = [[PY|2]]
    $$

    المشروع Y يضيف ثروة أكبر. المعدل نسبة، والنسبة العالية على مبلغ صغير قد تعطي ربحا أقل من نسبة أقل على مبلغ كبير. المشروع X يترك 20,000 دينار تستثمر بنسبة 10% فقط، بينما المشروع Y يستثمرها بنسبة أعلى. لذلك لا نختار بين بدائل متنافية بأعلى معدل. الطريقة الصحيحة هي التحليل التزايدي في المثال التالي.

- id: c04-ex-incremental-two
  kind: example
  title: |
    التحليل التزايدي لمشروعين
  vars: {C1: 50000, R1: 12000, dC: 30000, dR: 6000, i: 0.10, r1: 0, rd: 0}
  random: {C1: [20000, 80000, 1000], r1: [0.14, 0.30, 0.01], dC: [10000, 60000, 1000], rd: [0.04, 0.25, 0.01], i: [0.06, 0.12, 0.01]}
  calc:
    - R1 = pick(r1 > 0, floor(C1*AP(r1, 8)/100)*100, R1)
    - dR = pick(rd > 0, floor(dC*AP(rd, 8)/100)*100, dR)
    - C2 = C1 + dC
    - R2 = R1 + dR
    - ra = RATE(8, R1, C1)
    - rb = RATE(8, R2, C2)
    - rdd = RATE(8, dR, dC)
    - PA1 = -C1 + R1*PA(i, 8)
    - PB1 = -C2 + R2*PA(i, 8)
  text: |
    مشروعان متنافيان، عمر كل منهما 8 سنوات، والحد الأدنى للعائد [[i|%]]. المشروع أ يكلف [[C1|g]] دينار ويعطي [[R1|g]] دينار سنويا. المشروع ب يكلف [[C2|g]] دينار ويعطي [[R2|g]] دينار سنويا. اختر بالتحليل التزايدي.
  solution: |
    الخطوة 1: المشروع الأرخص أولا. معدله [[ra|%2]]، وهو أعلى من [[i|%]]، فهو مقبول ويصبح البديل الحالي.

    الخطوة 2: ندرس الفرق. المشروع ب يحتاج استثمارا إضافيا [[dC|g]] دينار، ويعطي دخلا إضافيا [[dR|g]] دينار سنويا. معدل هذا الفرق:

    $$
    [[dR|g]]\,(P/A,\ \Delta i,\ 8) = [[dC|g]] \quad\Rightarrow\quad \Delta i = [[rdd|%2]]
    $$

    الخطوة 3: القرار. إذا كان معدل الفرق أعلى من الحد الأدنى، فالمال الإضافي يستحق، ونختار البديل الأغلى. هنا [[pick(rdd >= i, 'المعدل أعلى، فنختار المشروع ب', 'المعدل أقل، فنبقى على المشروع أ')]].

    لاحظ أن معدل المشروع ب وحده [[rb|%2]]، وهو لا يدخل في القرار. القيمة الحالية تؤكد القرار:

    $$
    PW_a = [[PA1|2]], \qquad PW_b = [[PB1|2]]
    $$

- id: c04-ex-incremental-cost
  kind: example
  title: |
    التحليل التزايدي لبدائل تكاليف
  vars: {Ca: 30000, Oa: 12000, dC: 15000, dO: 3500, i: 0.10, r0: 0}
  random: {Ca: [15000, 50000, 1000], Oa: [8000, 20000, 500], dC: [5000, 30000, 1000], r0: [0.02, 0.30, 0.01], i: [0.06, 0.14, 0.01]}
  calc:
    - dO = pick(r0 > 0, floor(dC*AP(r0, 6)/50)*50, dO)
    - Cb = Ca + dC
    - Ob = Oa - dO
    - rd = RATE(6, dO, dC)
    - Pa = Ca + Oa*PA(i, 6)
    - Pb = Cb + Ob*PA(i, 6)
  text: |
    آلتان لنفس العمل، عمر كل منهما 6 سنوات بدون قيمة بيع. الآلة أ تكلف [[Ca|g]] دينار وتشغيلها [[Oa|g]] دينار سنويا. الآلة ب تكلف [[Cb|g]] دينار وتشغيلها [[Ob|g]] دينار سنويا. اختر بالتحليل التزايدي بنسبة [[i|%]].
  solution: |
    في بدائل التكاليف لا يوجد دخل، فلا معنى لمعدل كل آلة وحدها. ندرس الفرق فقط: الآلة ب تكلف [[dC|g]] دينار زيادة، وتوفر [[dO|g]] دينار سنويا.

    $$
    [[dO|g]]\,(P/A,\ \Delta i,\ 6) = [[dC|g]] \quad\Rightarrow\quad \Delta i = [[rd|%2]]
    $$

    ```excel
    =RATE(6, [[dO|r]], -[[dC|r]])
    ```

    معدل الفرق [[pick(rd >= i, 'أعلى من', 'أقل من')]] [[i|%]]، فنختار الآلة [[pick(rd >= i, 'ب', 'أ')]]. القيمة الحالية للتكاليف تؤكد ذلك:

    $$
    PW_a = [[Pa|2]], \qquad PW_b = [[Pb|2]]
    $$

- id: c04-ex-incremental-three
  kind: example
  title: |
    ثلاثة بدائل بالتحليل التزايدي
  calc:
    - r1 = RATE(8, 6000, 20000)
    - r21 = RATE(8, 2500, 10000)
    - r32 = RATE(8, 3000, 15000)
    - r3 = RATE(8, 11500, 45000)
    - P1 = -20000 + 6000*PA(0.12, 8)
    - P2 = -30000 + 8500*PA(0.12, 8)
    - P3 = -45000 + 11500*PA(0.12, 8)
  text: |
    ثلاثة بدائل متنافية، عمر كل منها 8 سنوات، والحد الأدنى للعائد 12%. أيها تختار؟

    | البديل | التكلفة | الدخل السنوي |
    | --- | --- | --- |
    | 1 | 20,000 | 6,000 |
    | 2 | 30,000 | 8,500 |
    | 3 | 45,000 | 11,500 |
  solution: |
    نرتب البدائل حسب التكلفة، ونبدأ بعدم التنفيذ.

    المقارنة الأولى، البديل 1 مقابل عدم التنفيذ:

    $$
    6{,}000\,(P/A,\ i,\ 8) = 20{,}000 \quad\Rightarrow\quad i = [[r1|%2]]
    $$

    أعلى من 12%، فالبديل 1 هو الأفضل حتى الآن.

    المقارنة الثانية، البديل 2 مقابل البديل 1. الفرق استثمار 10,000 دينار ودخل 2,500 دينار سنويا:

    $$
    2{,}500\,(P/A,\ \Delta i,\ 8) = 10{,}000 \quad\Rightarrow\quad \Delta i = [[r21|%2]]
    $$

    أعلى من 12%، فالبديل 2 يصبح الأفضل.

    المقارنة الثالثة، البديل 3 مقابل البديل 2. الفرق استثمار 15,000 دينار ودخل 3,000 دينار سنويا:

    $$
    3{,}000\,(P/A,\ \Delta i,\ 8) = 15{,}000 \quad\Rightarrow\quad \Delta i = [[r32|%2]]
    $$

    أقل من 12%، فالاستثمار الإضافي لا يستحق. القرار: البديل 2.

    للتأكد بالقيمة الحالية:

    | البديل | القيمة الحالية |
    | --- | --- |
    | 1 | [[P1|2]] |
    | 2 | [[P2|2]] |
    | 3 | [[P3|2]] |

    لاحظ أن معدل البديل 3 وحده [[r3|%2]]، أعلى من 12%. لو حكمنا بمعدل كل بديل وحده لقبلناه خطأ.

- id: c04-ex-crossover
  kind: example
  title: |
    منحنى القيمة الحالية ونقطة التقاطع
  calc:
    - rc = RATE(5, 6000, 20000)
    - x5 = -10000 + 4000*PA(0.05, 5)
    - y5 = -30000 + 10000*PA(0.05, 5)
    - x10 = -10000 + 4000*PA(0.10, 5)
    - y10 = -30000 + 10000*PA(0.10, 5)
    - x15 = -10000 + 4000*PA(0.15, 5)
    - y15 = -30000 + 10000*PA(0.15, 5)
    - x20 = -10000 + 4000*PA(0.20, 5)
    - y20 = -30000 + 10000*PA(0.20, 5)
    - x25 = -10000 + 4000*PA(0.25, 5)
    - y25 = -30000 + 10000*PA(0.25, 5)
  text: |
    للمشروعين X وY في مثال سابق، احسب القيمة الحالية لكل منهما عند النسب من 5% إلى 25%. عند أي نسبة يتساويان؟ وكيف يتغير القرار مع الحد الأدنى للعائد؟
  solution: |
    | النسبة | المشروع X | المشروع Y |
    | --- | --- | --- |
    | 5% | [[x5|2]] | [[y5|2]] |
    | 10% | [[x10|2]] | [[y10|2]] |
    | 15% | [[x15|2]] | [[y15|2]] |
    | 20% | [[x20|2]] | [[y20|2]] |
    | 25% | [[x25|2]] | [[y25|2]] |

    منحنى Y أشد انحدارا، لأن دخله أكبر وأبعد في الزمن نسبيا، فيتأثر بالخصم أكثر. المنحنيان يتقاطعان عند النسبة التي تجعل قيمة الفرق صفرا، أي عند معدل الفرق:

    $$
    6{,}000\,(P/A,\ i,\ 5) = 20{,}000 \quad\Rightarrow\quad i = [[rc|%2]]
    $$

    إذا كان الحد الأدنى للعائد أقل من [[rc|%2]] نختار Y، وإذا كان أعلى نختار X. هذا يفسر لماذا قد يختلف ترتيب المعدلات عن ترتيب القيم الحالية.

# ------------------------------------------------------------ multiple roots and MIRR
- id: c04-ex-multiple-irr
  kind: example
  title: |
    مشروع له معدلان
  calc:
    - p0 = -1000 + 2300 - 1320
    - p5 = -1000 + 2300*PF(0.05, 1) - 1320*PF(0.05, 2)
    - p10 = -1000 + 2300*PF(0.10, 1) - 1320*PF(0.10, 2)
    - p15 = -1000 + 2300*PF(0.15, 1) - 1320*PF(0.15, 2)
    - p20 = -1000 + 2300*PF(0.20, 1) - 1320*PF(0.20, 2)
    - p25 = -1000 + 2300*PF(0.25, 1) - 1320*PF(0.25, 2)
  text: |
    مقاول يدفع 1,000 دينار اليوم لتجهيز موقع، ويقبض 2,300 دينار بعد سنة، ثم يدفع 1,320 دينار في السنة الثانية لإعادة الموقع إلى حالته. ما معدل العائد الداخلي؟
  solution: |
    نحسب القيمة الحالية عند عدة نسب:

    | النسبة | القيمة الحالية |
    | --- | --- |
    | 0% | [[p0|2]] |
    | 5% | [[p5|2]] |
    | 10% | [[p10|2]] |
    | 15% | [[p15|2]] |
    | 20% | [[p20|2]] |
    | 25% | [[p25|2]] |

    القيمة الحالية صفر عند 10% وعند 20%. للمشروع معدلان، وكلاهما صحيح رياضيا. السبب أن إشارة التدفقات تتغير مرتين: سالب ثم موجب ثم سالب.

    أي المعدلين نقارن بالحد الأدنى للعائد؟ لا هذا ولا ذاك. في هذه الحالة نستخدم القيمة الحالية بالحد الأدنى للعائد، أو المعدل المعدل في المثال التالي.

- id: c04-ex-sign-test
  kind: example
  title: |
    كيف تعرف عدد المعدلات قبل الحساب
  calc:
    - r = IRR([-20000, 8000, 9000, 10000, -4000], 0.0, 1.0)
  text: |
    مشروع تدفقاته من السنة 0 إلى السنة 4: -20,000 ثم 8,000 و9,000 و10,000، ثم -4,000 تكلفة إزالة. كم معدلا يمكن أن يكون له؟ احسبه.
  solution: |
    **قاعدة الإشارات:** عدد المعدلات الموجبة لا يزيد عن عدد مرات تغير الإشارة في التدفقات. هنا الإشارة تتغير مرتين، فقد يوجد معدلان.

    **اختبار المجموع التراكمي:** نجمع التدفقات تراكميا:

    | السنة | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | التدفق | -20,000 | 8,000 | 9,000 | 10,000 | -4,000 |
    | التراكمي | -20,000 | -12,000 | -3,000 | 7,000 | 3,000 |

    إذا بدأ التراكمي سالبا، وتغيرت إشارته مرة واحدة فقط، وانتهى موجبا، فللمشروع معدل موجب واحد فقط. الشرطان متحققان هنا.

    المعدل [[r|%2]]. في Excel تعطيه الدالة IRR مباشرة، لأنه الحل الوحيد الموجب.

- id: c04-ex-mirr
  kind: example
  title: |
    معدل العائد الداخلي المعدل
  vars: {c0: 50000, c1: 12000, c2: 15000, c3: 18000, c4: 15000, c5: 12000, rr: 0.10}
  random: {c0: [30000, 60000, 1000], c1: [8000, 20000, 500], c2: [8000, 20000, 500], c3: [8000, 22000, 500], c4: [8000, 20000, 500], c5: [5000, 18000, 500], rr: [0.06, 0.14, 0.01]}
  calc:
    - FV = c1*FP(rr, 4) + c2*FP(rr, 3) + c3*FP(rr, 2) + c4*FP(rr, 1) + c5
    - M = (FV/c0)**(1/5) - 1
    - r = IRR([-c0, c1, c2, c3, c4, c5])
  text: |
    مشروع يكلف [[c0|g]] دينار، ويعطي في السنوات من 1 إلى 5 المبالغ [[c1|g]] و[[c2|g]] و[[c3|g]] و[[c4|g]] و[[c5|g]] دينار. الشركة تعيد استثمار الدخل بنسبة [[rr|%]]. احسب المعدل والمعدل المعدل.
  solution: |
    معدل العائد الداخلي يفترض ضمنا أن كل دخل يعاد استثماره بنفس المعدل. هذا غير واقعي عندما يكون المعدل عاليا. المعدل المعدل يستخدم نسبة إعادة استثمار واقعية.

    الخطوة 1: ننقل كل الدخل إلى السنة 5 بنسبة إعادة الاستثمار:

    $$
    FV = [[c1|g]]\,(F/P,\ [[rr|%]],\ 4) + [[c2|g]]\,(F/P,\ [[rr|%]],\ 3) + \cdots + [[c5|g]] = [[FV|2]]
    $$

    الخطوة 2: نبحث عن النسبة التي تحول الاستثمار إلى هذا المبلغ:

    $$
    MIRR = \left(\frac{[[FV|2]]}{[[c0|g]]}\right)^{1/5} - 1 = [[M|%2]]
    $$

    ```excel
    =MIRR(B1:B6, [[rr|%]], [[rr|%]])
    ```

    المعدل العادي [[r|%2]]. المعدل المعدل أقرب إلى نسبة إعادة الاستثمار، لأن جزءا من العائد يأتي منها.

- id: c04-ex-mirr-multiple
  kind: example
  title: |
    المعدل المعدل يحل مشكلة تعدد المعدلات
  vars: {i: 0.12}
  random: {i: [0.05, 0.15, 0.01]}
  calc:
    - PN = 1000 + 1320*PF(i, 2)
    - FP1 = 2300*FP(i, 1)
    - M = (FP1/PN)**(1/2) - 1
    - PW = -1000 + 2300*PF(i, 1) - 1320*PF(i, 2)
  text: |
    للمشروع الذي له معدلان في مثال سابق، احسب المعدل المعدل بنسبة تمويل وإعادة استثمار [[i|%]]. هل يقبل المشروع إذا كان الحد الأدنى للعائد [[i|%]]؟
  solution: |
    ننقل التدفقات السالبة إلى السنة 0، والموجبة إلى السنة 2:

    $$
    PV_- = 1{,}000 + 1{,}320\,(P/F,\ [[i|%]],\ 2) = [[PN|2]]
    $$

    $$
    FV_+ = 2{,}300\,(F/P,\ [[i|%]],\ 1) = [[FP1|2]]
    $$

    $$
    MIRR = \left(\frac{[[FP1|2]]}{[[PN|2]]}\right)^{1/2} - 1 = [[M|%2]]
    $$

    المعدل المعدل له قيمة واحدة دائما. هو [[pick(M >= i, 'أعلى من', 'أقل من')]] [[i|%]]، فالمشروع [[pick(M >= i, 'مقبول', 'مرفوض')]]. القيمة الحالية [[PW|2]] تعطي نفس القرار.

# ------------------------------------------------------------ the cost of money in practice
- id: c04-ex-irr-monthly
  kind: example
  title: |
    التكلفة الحقيقية للتقسيط
  vars: {P: 1200, A: 115, N: 12, r0: 0}
  random: {P: [500, 3000, 50], N: [6, 24, 6], r0: [0.10, 0.40, 0.01]}
  calc:
    - A = pick(r0 > 0, ceil(P*AP(r0/12, N)), A)
    - im = RATE(N, A, P)
    - ia = (1+im)**12 - 1
    - T = A*N - P
  text: |
    محل يبيع هاتفا بسعر [[P|g]] دينار نقدا، أو بأقساط [[A|g]] دينار شهريا لمدة [[N|n]] شهرا، ويعلن: الزيادة [[T|g]] دينار فقط. ما المعدل الفعلي الذي يدفعه المشتري؟
  solution: |
    القسط هو الدخل للمحل، والسعر النقدي هو ما يتنازل عنه اليوم. المعدل الشهري:

    $$
    [[A|g]]\,(P/A,\ i_m,\ [[N|n]]) = [[P|g]] \quad\Rightarrow\quad i_m = [[im|%2]]
    $$

    ```excel
    =RATE([[N|n]], [[A|r]], -[[P|r]])
    ```

    المعدل الفعلي السنوي:

    $$
    i_a = (1 + [[im|f4]])^{12} - 1 = [[ia|%2]]
    $$

    الزيادة تبدو صغيرة، لكن المشتري يسدد جزءا من السعر كل شهر، فمتوسط ما يقترضه نصف السعر تقريبا. لذلك المعدل الحقيقي أعلى بكثير مما يوحي به المبلغ.

- id: c04-ex-loan-fees
  kind: example
  title: |
    أثر رسوم القرض على تكلفته
  vars: {L: 20000, r: 0.08, n: 5, f: 0.03}
  random: {L: [5000, 80000, 1000], r: [0.05, 0.12, 0.005], n: [3, 10, 1], f: [0.01, 0.05, 0.005]}
  calc:
    - A = L*AP(r, n)
    - net = L*(1 - f)
    - re = RATE(n, A, net)
  text: |
    بنك يقرض شركة [[L|g]] دينار بفائدة [[r|%]] لمدة [[yrs(n)]] بأقساط سنوية، ويخصم رسوم فتح ملف [[f|%]] من القرض عند صرفه. ما التكلفة الحقيقية للقرض؟
  solution: |
    القسط يحسب على كامل القرض:

    $$
    A = [[L|g]]\,(A/P,\ [[r|%]],\ [[n|n]]) = [[A|2]]
    $$

    لكن الشركة تستلم [[net|2]] دينار فقط. التكلفة الحقيقية هي المعدل الذي يجعل الأقساط تساوي ما استلمته:

    $$
    [[A|2]]\,(P/A,\ i,\ [[n|n]]) = [[net|2]] \quad\Rightarrow\quad i = [[re|%2]]
    $$

    ```excel
    =RATE([[n|n]], [[A|d2]], -[[net|d2]])
    ```

    الرسوم ترفع التكلفة من [[r|%]] إلى [[re|%2]]. أثرها أكبر في القروض القصيرة، لأنها تتوزع على سنوات أقل.

# ------------------------------------------------------------ benefit cost ratio
- id: c04-ex-bc
  kind: example
  title: |
    نسبة المنفعة إلى التكلفة لمشروع عام
  vars: {I: 2000000, B: 350000, M: 60000, i: 0.06}
  random: {I: [1000000, 4000000, 100000], B: [150000, 600000, 10000], M: [20000, 120000, 5000], i: [0.04, 0.08, 0.005]}
  calc:
    - f = PA(i, 25)
    - PB = B*f
    - PM = M*f
    - BC = PB/(I + PM)
    - BCm = (PB - PM)/I
  text: |
    وزارة الأشغال تدرس طريقا التفافيا يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا لمدة 25 سنة. المنافع للمواطنين، من توفير الوقت والوقود وتقليل الحوادث، تقدر بمبلغ [[B|g]] دينار سنويا. هل المشروع مجد بنسبة [[i|%]]؟
  solution: |
    في المشاريع العامة لا يوجد إيراد للحكومة. المنافع تعود للمواطنين، والتكاليف تدفعها الحكومة. نقارن بينهما بالنسبة:

    $$
    \frac{B}{C} = \frac{PW_{benefits}}{PW_{costs}}
    $$

    $$
    (P/A,\ [[i|%]],\ 25) = [[f|f4]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]] \times [[f|f4]]}{[[I|g]] + [[M|g]] \times [[f|f4]]} = \frac{[[PB|2]]}{[[I+PM|2]]} = [[BC|f4]]
    $$

    بعض الجهات تطرح الصيانة من المنافع بدل إضافتها إلى التكاليف، فتسمى النسبة المعدلة:

    $$
    \frac{B}{C} = \frac{[[PB|2]] - [[PM|2]]}{[[I|g]]} = [[BCm|f4]]
    $$

    النسبتان مختلفتان في القيمة، لكنهما تعطيان نفس القرار دائما: المشروع [[pick(BC >= 1, 'مجد، لأن النسبة أكبر من 1', 'غير مجد، لأن النسبة أقل من 1')]].

- id: c04-ex-bc-incremental
  kind: example
  title: |
    اختيار تصميم بالنسبة التزايدية
  calc:
    - f = PA(0.06, 20)
    - BC1 = 220000*f/(1500000 + 40000*f)
    - BC2 = 290000*f/(2100000 + 45000*f)
    - dB = 70000*f
    - dCc = 600000 + 5000*f
    - dBC = dB/dCc
  text: |
    بلدية تختار بين تصميمين لسوق خضار مركزي، والنسبة المستخدمة 6% لمدة 20 سنة:

    | | التصميم الأول | التصميم الثاني |
    | --- | --- | --- |
    | تكلفة البناء | 1,500,000 | 2,100,000 |
    | الصيانة السنوية | 40,000 | 45,000 |
    | المنافع السنوية | 220,000 | 290,000 |

    أيهما تختار؟
  solution: |
    $$
    (P/A,\ 6\%,\ 20) = [[f|f4]]
    $$

    نسبة كل تصميم وحده:

    $$
    \left(\frac{B}{C}\right)_1 = [[BC1|f4]], \qquad \left(\frac{B}{C}\right)_2 = [[BC2|f4]]
    $$

    التصميمان مجديان، والأول نسبته أعلى. لكن كما في المعدل، لا نختار بأعلى نسبة. ندرس الفرق: التصميم الثاني يضيف منافع ويضيف تكاليف:

    $$
    \Delta B = 70{,}000 \times [[f|f4]] = [[dB|2]]
    $$

    $$
    \Delta C = 600{,}000 + 5{,}000 \times [[f|f4]] = [[dCc|2]]
    $$

    $$
    \frac{\Delta B}{\Delta C} = [[dBC|f4]]
    $$

    النسبة التزايدية [[pick(dBC >= 1, 'أكبر من 1، فالمبلغ الإضافي يستحق، وتختار البلدية التصميم الثاني', 'أقل من 1، فتختار البلدية التصميم الأول')]].
