items:

- id: c04-g-01
  kind: problem
  part: G
  vars: {I: 1200000, B: 180000, M: 30000, i: 0.06}
  random: {I: [500000, 3000000, 50000], B: [60000, 400000, 5000], M: [10000, 80000, 2500], i: [0.04, 0.08, 0.005]}
  calc:
    - f = PA(i, 20)
    - BC = B*f/(I + M*f)
  text: |
    مشروع عام يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا، ومنافعه [[B|g]] دينار سنويا لمدة 20 سنة. احسب نسبة المنفعة إلى التكلفة بنسبة [[i|%]].
  solution: |
    $$
    \frac{B}{C} = \frac{[[B|g]]\,(P/A,\ [[i|%]],\ 20)}{[[I|g]] + [[M|g]]\,(P/A,\ [[i|%]],\ 20)} = [[BC|f4]]
    $$

    المشروع [[pick(BC >= 1, 'مجد', 'غير مجد')]].

- id: c04-g-02
  kind: problem
  part: G
  vars: {I: 1200000, B: 180000, M: 30000, i: 0.06}
  random: {I: [500000, 3000000, 50000], B: [60000, 400000, 5000], M: [10000, 80000, 2500], i: [0.04, 0.08, 0.005]}
  calc:
    - f = PA(i, 20)
    - BC = B*f/(I + M*f)
    - BCm = (B - M)*f/I
  text: |
    احسب النسبة المعدلة للمشروع في المسألة السابقة، بطرح الصيانة من المنافع. هل يتغير القرار؟
  solution: |
    $$
    \frac{B - M}{I} = \frac{[[B-M|g]]\,(P/A,\ [[i|%]],\ 20)}{[[I|g]]} = [[BCm|f4]]
    $$

    النسبة العادية [[BC|f4]]. القيمتان مختلفتان، لكن كلتيهما [[pick(BC >= 1, 'أكبر من 1', 'أقل من 1')]]، فالقرار نفسه.

- id: c04-g-03
  kind: problem
  part: G
  vars: {I: 800000, B: 95000, D: 15000, M: 20000, i: 0.06}
  random: {I: [300000, 1500000, 50000], B: [40000, 200000, 5000], D: [5000, 40000, 1000], M: [5000, 50000, 2500], i: [0.04, 0.08, 0.005]}
  calc:
    - f = PA(i, 25)
    - BC = (B - D)*f/(I + M*f)
  text: |
    سد لجمع مياه الأمطار يكلف [[I|g]] دينار، وصيانته [[M|g]] دينار سنويا لمدة 25 سنة. منافعه للمزارعين [[B|g]] دينار سنويا. لكنه يغمر أرضا كانت تعطي [[D|g]] دينار سنويا. احسب النسبة بنسبة [[i|%]].
  solution: |
    الضرر الذي يقع على المواطنين يطرح من المنافع، لأنه أثر على المجتمع وليس تكلفة على الحكومة:

    $$
    \frac{B}{C} = \frac{([[B|g]] - [[D|g]])\,(P/A,\ [[i|%]],\ 25)}{[[I|g]] + [[M|g]]\,(P/A,\ [[i|%]],\ 25)} = [[BC|f4]]
    $$

- id: c04-g-04
  kind: problem
  part: G
  vars: {I: 2500000, M: 40000, i: 0.06}
  random: {I: [1000000, 5000000, 100000], M: [10000, 100000, 5000], i: [0.04, 0.08, 0.005]}
  calc:
    - B = (I + M*PA(i, 30))/PA(i, 30)
  text: |
    مستشفى ميداني يكلف [[I|g]] دينار، وصيانة المبنى [[M|g]] دينار سنويا لمدة 30 سنة. ما أقل منافع سنوية تجعل النسبة تساوي 1 بنسبة [[i|%]]؟
  solution: |
    $$
    B = \frac{[[I|g]] + [[M|g]]\,(P/A,\ [[i|%]],\ 30)}{(P/A,\ [[i|%]],\ 30)} = [[B|2]]
    $$

- id: c04-g-05
  kind: problem
  part: G
  vars: {I: 3000000, B: 220000, M: 50000}
  random: {I: [1000000, 5000000, 100000], B: [100000, 400000, 10000], M: [10000, 80000, 5000]}
  calc:
    - b4 = B/(I*0.04 + M)
    - b6 = B/(I*0.06 + M)
    - b8 = B/(I*0.08 + M)
  text: |
    مشروع بنية تحتية يكلف [[I|g]] دينار، ويعطي منافع [[B|g]] دينار سنويا إلى الأبد، وصيانته [[M|g]] دينار سنويا. احسب النسبة عند 4% و6% و8%.
  solution: |
    للعمر بلا نهاية، القيمة الحالية لدفعة دائمة تساوي الدفعة مقسومة على النسبة. نضرب البسط والمقام في النسبة:

    $$
    \frac{B}{C} = \frac{B/i}{I + M/i} = \frac{B}{I\,i + M}
    $$

    | النسبة | B/C |
    | --- | --- |
    | 4% | [[b4|f4]] |
    | 6% | [[b6|f4]] |
    | 8% | [[b8|f4]] |

    النسبة المنخفضة تجعل المشاريع الطويلة أكثر جدوى.

- id: c04-g-06
  kind: problem
  part: G
  calc:
    - f = PA(0.05, 20)
    - BC1 = 140000*f/(900000 + 20000*f)
    - BC2 = 185000*f/(1300000 + 22000*f)
    - dBC = 45000*f/(400000 + 2000*f)
  text: |
    خياران لمشروع تصريف مياه أمطار، لعمر 20 سنة ونسبة 5%. الأول يكلف 900,000 دينار وصيانته 20,000 سنويا ومنافعه 140,000 سنويا. الثاني يكلف 1,300,000 دينار وصيانته 22,000 سنويا ومنافعه 185,000 سنويا. اختر.
  solution: |
    $$
    \left(\frac{B}{C}\right)_1 = [[BC1|f4]], \qquad \left(\frac{B}{C}\right)_2 = [[BC2|f4]]
    $$

    النسبة التزايدية:

    $$
    \frac{\Delta B}{\Delta C} = \frac{45{,}000\,(P/A,\ 5\%,\ 20)}{400{,}000 + 2{,}000\,(P/A,\ 5\%,\ 20)} = [[dBC|f4]]
    $$

    القرار: الخيار [[pick(BC1 < 1, pick(BC2 >= 1, 'الثاني', 'لا شيء'), pick(dBC >= 1, 'الثاني', 'الأول'))]].

- id: c04-g-07
  kind: problem
  part: G
  calc:
    - f = PA(0.06, 15)
    - b1 = 60000*f/400000
    - b2 = 95000*f/650000
    - b3 = 120000*f/900000
    - d21 = 35000*f/250000
    - d32 = 25000*f/250000
    - d31 = 60000*f/500000
  text: |
    ثلاثة بدائل متنافية لمشروع عام، لعمر 15 سنة ونسبة 6%، بدون صيانة:

    | البديل | التكلفة | المنافع السنوية |
    | --- | --- | --- |
    | 1 | 400,000 | 60,000 |
    | 2 | 650,000 | 95,000 |
    | 3 | 900,000 | 120,000 |

    اختر بالنسبة التزايدية.
  solution: |
    نسب البدائل: [[b1|f4]] و[[b2|f4]] و[[b3|f4]].

    البديل 1 مقابل عدم التنفيذ: النسبة [[b1|f4]].

    البديل 2 مقابل 1: [[d21|f4]].

    البديل 3 مقابل الفائز: مقابل البديل 2 [[d32|f4]]، ومقابل البديل 1 [[d31|f4]].

    في كل خطوة نقبل البديل الأغلى إذا كانت النسبة التزايدية 1 أو أكثر.

- id: c04-g-08
  kind: problem
  part: G
  vars: {I: 1500000, B: 160000, M: 25000, i: 0.06}
  random: {I: [600000, 3000000, 50000], B: [60000, 350000, 5000], M: [10000, 60000, 2500], i: [0.04, 0.08, 0.005]}
  calc:
    - f = PA(i, 20)
    - PW = -I + (B - M)*f
    - BC = B*f/(I + M*f)
  text: |
    لمشروع عام يكلف [[I|g]] دينار، ومنافعه [[B|g]] وصيانته [[M|g]] دينار سنويا لمدة 20 سنة: احسب النسبة، والقيمة الحالية الصافية للمجتمع بنسبة [[i|%]]. ما العلاقة بينهما؟
  solution: |
    $$
    \frac{B}{C} = [[BC|f4]], \qquad PW = -[[I|g]] + [[B-M|g]]\,(P/A,\ [[i|%]],\ 20) = [[PW|2]]
    $$

    النسبة أكبر من 1 عندما تكون القيمة الحالية موجبة، والعكس. الطريقتان تعطيان نفس القرار لمشروع واحد.

- id: c04-g-09
  kind: problem
  part: G
  calc:
    - f = PA(0.06, 20)
    - BCw = (300000 + 20000)*f/(2000000 + 50000*f)
    - BCr = 300000*f/(2000000 + 50000*f - 20000*f)
  text: |
    طريق جديد يكلف 2,000,000 دينار، وصيانته 50,000 سنويا، ومنافعه للمواطنين 300,000 دينار سنويا. الطريق يخفض أيضا تكلفة صيانة طريق قديم بمبلغ 20,000 دينار سنويا. حللين طالبان المشروع لعمر 20 سنة بنسبة 6%: الأول أضاف 20,000 إلى المنافع، والثاني طرحها من التكاليف. هل يختلف القرار؟
  solution: |
    $$
    \left(\frac{B}{C}\right)_{1} = [[BCw|f4]], \qquad \left(\frac{B}{C}\right)_{2} = [[BCr|f4]]
    $$

    النسبتان مختلفتان، لكنهما على نفس الجهة من الرقم 1. التوفير على الحكومة تكلفة أقل، فالأصح طرحه من التكاليف. المهم أن تلتزم بقاعدة واحدة في كل البدائل.

- id: c04-g-10
  kind: problem
  part: G
  vars: {I: 1800000, B: 200000, M: 35000, r0: 0}
  random: {I: [800000, 3000000, 50000], M: [10000, 70000, 2500], r0: [0.02, 0.12, 0.005]}
  calc:
    - B = pick(r0 > 0, M + floor(I*AP(r0, 25)/1000)*1000, B)
    - ib = RATE(25, B - M, I)
  text: |
    مشروع عام يكلف [[I|g]] دينار، ومنافعه [[B|g]] دينار سنويا، وصيانته [[M|g]] دينار سنويا لمدة 25 سنة. ما النسبة التي تجعل B/C تساوي 1؟
  solution: |
    النسبة تساوي 1 عندما تتساوى القيمة الحالية للمنافع مع القيمة الحالية للتكاليف، أي عندما تكون القيمة الحالية الصافية صفرا. هذه النسبة هي معدل العائد الداخلي للمجتمع:

    ```excel
    =RATE(25, [[B-M|r]], -[[I|r]])
    ```

    النسبة [[ib|%2]]. كل نسبة خصم أقل منها تجعل المشروع مجديا.

- id: c04-g-11
  kind: problem
  part: G
  text: |
    مشروع عام نسبته 1.4، وآخر نسبته 1.8. المشروعان متنافيان. هل نختار الثاني لأن نسبته أعلى؟
  solution: |
    لا. كما في المعدل، النسبة لا تعكس حجم المشروع. نحسب النسبة التزايدية للفرق بين المشروعين، بعد ترتيبهما حسب التكلفة. إذا كانت 1 أو أكثر نختار الأغلى.

- id: c04-g-12
  kind: problem
  part: G
  vars: {I: 600000, B: 70000, M: 10000, R: 150000}
  random: {I: [200000, 1200000, 50000], B: [25000, 150000, 5000], M: [3000, 30000, 1000], R: [50000, 300000, 10000]}
  calc:
    - f = PA(0.06, 30)
    - AR = R*AF(0.06, 10)
    - BC = B*f/(I + (M + AR)*f)
  text: |
    حديقة عامة تكلف [[I|g]] دينار، وصيانتها [[M|g]] دينار سنويا، وتحتاج تجديدا كل 10 سنوات بتكلفة [[R|g]] دينار، لمدة 30 سنة. منافعها للسكان تقدر بمبلغ [[B|g]] دينار سنويا. احسب النسبة بنسبة 6%.
  solution: |
    التجديد في السنوات 10 و20 و30. نحوله إلى مبلغ سنوي:

    $$
    A_R = [[R|g]]\,(A/F,\ 6\%,\ 10) = [[AR|2]]
    $$

    $$
    \frac{B}{C} = \frac{[[B|g]]\,(P/A,\ 6\%,\ 30)}{[[I|g]] + ([[M|g]] + [[AR|2]])\,(P/A,\ 6\%,\ 30)} = [[BC|f4]]
    $$
