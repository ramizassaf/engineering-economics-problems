- id: c04-f-01
  kind: problem
  part: F
  text: |
    كم مرة تتغير الإشارة في كل من التدفقات التالية؟ وما أكبر عدد ممكن من المعدلات الموجبة؟

    | المشروع | 0 | 1 | 2 | 3 | 4 |
    | --- | --- | --- | --- | --- | --- |
    | أ | -100 | 30 | 40 | 50 | 60 |
    | ب | -100 | 80 | -20 | 70 | 10 |
    | ج | -100 | 230 | -132 | 0 | 0 |
    | د | 100 | -40 | -40 | -40 | -40 |
  solution: |
    | المشروع | تغيرات الإشارة | أكبر عدد للمعدلات |
    | --- | --- | --- |
    | أ | 1 | 1 |
    | ب | 3 | 3 |
    | ج | 2 | 2 |
    | د | 1 | 1 |

    المشروع د اقتراض وليس استثمارا: يبدأ بدخل ثم دفعات. معدله تكلفة اقتراض، فالقرار ينعكس: يقبل إذا كان المعدل أقل من الحد الأدنى.

- id: c04-f-02
  kind: problem
  part: F
  text: |
    طبق اختبار المجموع التراكمي على المشروع ب في المسألة السابقة. هل له معدل موجب واحد فقط؟
  solution: |
    التراكمي: -100 ثم -20 ثم -40 ثم 30 ثم 40.

    يبدأ سالبا، وتتغير إشارته مرة واحدة فقط، وينتهي موجبا. فللمشروع معدل موجب واحد، مع أن الإشارة في التدفقات تتغير 3 مرات.

- id: c04-f-03
  kind: problem
  part: F
  calc:
    - r1 = IRR([-100, 230, -132], 0.15, 0.0)
    - r2 = IRR([-100, 230, -132], 0.15, 1.0)
  text: |
    احسب المعدلين للمشروع ج في المسألة الأولى من هذا الجزء، بتجربة النسب أو بالتحليل.
  solution: |
    بالتعويض بالمتغير x الذي يساوي مقلوب واحد زائد i، تصبح المعادلة من الدرجة الثانية:

    $$
    -100 + 230x - 132x^2 = 0
    $$

    $$
    x = \frac{230 \pm \sqrt{230^2 - 4 \times 132 \times 100}}{2 \times 132}
    $$

    الجذران يعطيان المعدلين [[r1|%2]] و[[r2|%2]].

- id: c04-f-04
  kind: problem
  part: F
  vars: {i: 0.12}
  random: {i: [0.06, 0.20, 0.01]}
  calc:
    - PW = -100 + 230*PF(i, 1) - 132*PF(i, 2)
    - PN = 100 + 132*PF(i, 2)
    - FPp = 230*FP(i, 1)
    - M = (FPp/PN)**(1/2) - 1
  text: |
    للمشروع ج نفسه: احسب القيمة الحالية والمعدل المعدل بنسبة [[i|%]]. هل يقبل؟
  solution: |
    $$
    PW = -100 + 230\,(P/F,\ [[i|%]],\ 1) - 132\,(P/F,\ [[i|%]],\ 2) = [[PW|2]]
    $$

    $$
    MIRR = \left(\frac{230 \times [[1+i|r]]}{100 + 132\,(P/F,\ [[i|%]],\ 2)}\right)^{1/2} - 1 = [[M|%2]]
    $$

    المشروع [[pick(PW >= 0, 'مقبول', 'مرفوض')]]، والمعدل المعدل [[pick(M >= i, 'أعلى من', 'أقل من')]] [[i|%]] فيعطي نفس القرار.

- id: c04-f-05
  kind: problem
  part: F
  vars: {c0: 40000, c1: 10000, c2: 12000, c3: 15000, c4: 14000, c5: 10000, fr: 0.08, rr: 0.10}
  random: {c0: [25000, 50000, 1000], c1: [5000, 15000, 500], c2: [5000, 16000, 500], c3: [6000, 18000, 500], c4: [5000, 16000, 500], c5: [4000, 14000, 500], fr: [0.05, 0.10, 0.01], rr: [0.06, 0.14, 0.01]}
  calc:
    - FV = c1*FP(rr, 4) + c2*FP(rr, 3) + c3*FP(rr, 2) + c4*FP(rr, 1) + c5
    - M = (FV/c0)**(1/5) - 1
    - r = IRR([-c0, c1, c2, c3, c4, c5])
  text: |
    مشروع يكلف [[c0|g]] دينار، ويعطي [[c1|g]] و[[c2|g]] و[[c3|g]] و[[c4|g]] و[[c5|g]] دينار في السنوات من 1 إلى 5. نسبة التمويل [[fr|%]]، ونسبة إعادة الاستثمار [[rr|%]]. احسب المعدل والمعدل المعدل.
  solution: |
    التدفق السالب الوحيد في السنة 0، فنسبة التمويل لا تؤثر هنا.

    $$
    FV_+ = [[FV|2]], \qquad MIRR = \left(\frac{[[FV|2]]}{[[c0|g]]}\right)^{1/5} - 1 = [[M|%2]]
    $$

    ```excel
    =MIRR(B1:B6, [[fr|%]], [[rr|%]])
    ```

    المعدل العادي [[r|%2]].

- id: c04-f-06
  kind: problem
  part: F
  vars: {fr: 0.08, rr: 0.10}
  random: {fr: [0.04, 0.12, 0.01], rr: [0.05, 0.15, 0.01]}
  calc:
    - PN = 30000 + 10000*PF(fr, 2)
    - FV = 18000*FP(rr, 3) + 20000*FP(rr, 1) + 12000
    - M = (FV/PN)**(1/4) - 1
  text: |
    مشروع تدفقاته من السنة 0 إلى السنة 4: -30,000 ثم 18,000 ثم -10,000 ثم 20,000 ثم 12,000. نسبة التمويل [[fr|%]] ونسبة إعادة الاستثمار [[rr|%]]. احسب المعدل المعدل.
  solution: |
    التدفقات السالبة إلى السنة 0 بنسبة التمويل:

    $$
    PV_- = 30{,}000 + 10{,}000\,(P/F,\ [[fr|%]],\ 2) = [[PN|2]]
    $$

    التدفقات الموجبة إلى السنة 4 بنسبة إعادة الاستثمار:

    $$
    FV_+ = 18{,}000\,(F/P,\ [[rr|%]],\ 3) + 20{,}000\,(F/P,\ [[rr|%]],\ 1) + 12{,}000 = [[FV|2]]
    $$

    $$
    MIRR = \left(\frac{[[FV|2]]}{[[PN|2]]}\right)^{1/4} - 1 = [[M|%2]]
    $$

- id: c04-f-07
  kind: problem
  part: F
  calc:
    - r = IRR([-50000, 20000, 20000, 20000, 20000, -15000], 0.0, 1.0)
    - p10 = NPV(0.10, [-50000, 20000, 20000, 20000, 20000, -15000])
  text: |
    منجم صغير يكلف 50,000 دينار، ويعطي 20,000 دينار سنويا لمدة 4 سنوات، ثم يحتاج 15,000 دينار لإعادة تأهيل الأرض في السنة 5. كم معدلا يمكن أن يكون له؟ احسبه، واحسب القيمة الحالية بنسبة 10%.
  solution: |
    الإشارة تتغير مرتين. التراكمي: -50,000 ثم -30,000 ثم -10,000 ثم 10,000 ثم 30,000 ثم 15,000. يتغير مرة واحدة وينتهي موجبا، فالمعدل الموجب واحد فقط: [[r|%2]].

    $$
    PW(10\%) = [[p10|2]]
    $$

    تكلفة إعادة التأهيل تخفض المعدل كثيرا، ويجب أن تدخل في أي دراسة لمشروع تعدين أو مكب نفايات.

- id: c04-f-08
  kind: problem
  part: F
  calc:
    - r = IRR([10000, -2600, -2600, -2600, -2600, -2600], 0.5, 0.0)
  text: |
    شركة تأخذ 10,000 دينار من عميل اليوم مقدما، وتقدم له خدمة تكلفها 2,600 دينار سنويا لمدة 5 سنوات. ما المعدل؟ وكيف تفسره؟
  solution: |
    المعدل [[r|%2]]. التدفقات تبدأ بدخل ثم دفعات، فالشركة في وضع المقترض: العميل يمولها مقدما. المعدل هنا تكلفة هذا التمويل. الصفقة جيدة للشركة إذا كان المعدل أقل من تكلفة اقتراضها من البنك، وهذا عكس قاعدة الاستثمار.

- id: c04-f-09
  kind: problem
  part: F
  calc:
    - p0 = NPV(0.0, [-1600, 10000, -10000])
    - p25 = NPV(0.25, [-1600, 10000, -10000])
    - p100 = NPV(1.0, [-1600, 10000, -10000])
    - p400 = NPV(4.0, [-1600, 10000, -10000])
  text: |
    مشروع تدفقاته -1,600 ثم 10,000 ثم -10,000. احسب القيمة الحالية عند 0% و25% و100% و400%. ما المعدلان؟ وهل لأي منهما معنى اقتصادي؟
  solution: |
    | النسبة | القيمة الحالية |
    | --- | --- |
    | 0% | [[p0|2]] |
    | 25% | [[p25|2]] |
    | 100% | [[p100|2]] |
    | 400% | [[p400|2]] |

    المعدلان 25% و400%. لا معنى عمليا لأي منهما، لأن المشروع رابح عند كل نسبة بينهما وخاسر خارجها. القرار بالقيمة الحالية عند الحد الأدنى للعائد، أو بالمعدل المعدل.

- id: c04-f-10
  kind: problem
  part: F
  vars: {i: 0.10}
  random: {i: [0.05, 0.30, 0.01]}
  calc:
    - PW = NPV(i, [-1600, 10000, -10000])
    - M = (10000*FP(i, 1)/(1600 + 10000*PF(i, 2)))**(1/2) - 1
  text: |
    للمشروع في المسألة السابقة، احسب القيمة الحالية والمعدل المعدل بنسبة [[i|%]].
  solution: |
    $$
    PW = [[PW|2]]
    $$

    $$
    MIRR = \left(\frac{10{,}000\,(F/P,\ [[i|%]],\ 1)}{1{,}600 + 10{,}000\,(P/F,\ [[i|%]],\ 2)}\right)^{1/2} - 1 = [[M|%2]]
    $$

    القرار: [[pick(PW >= 0, 'قبول', 'رفض')]]. المعدل المعدل يعطي نسبة واحدة يمكن مقارنتها بالحد الأدنى.

- id: c04-f-11
  kind: problem
  part: F
  vars: {c0: 30000, R: 9000, rr: 0.08, r0: 0}
  random: {c0: [10000, 50000, 1000], rr: [0.05, 0.12, 0.01], r0: [0.06, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(c0*AP(r0, 5)/50)*50, R)
    - r = RATE(5, R, c0)
    - FV = R*FA(rr, 5)
    - M = (FV/c0)**(1/5) - 1
  text: |
    مشروع يكلف [[c0|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة 5 سنوات. احسب المعدل، ثم المعدل المعدل بنسبة إعادة استثمار [[rr|%]]. أيهما أقرب للعائد الحقيقي؟
  solution: |
    المعدل [[r|%2]].

    $$
    FV_+ = [[R|g]]\,(F/A,\ [[rr|%]],\ 5) = [[FV|2]], \qquad MIRR = [[M|%2]]
    $$

    إذا كانت الشركة لا تستطيع إعادة استثمار الدخل إلا بنسبة [[rr|%]]، فالمعدل المعدل أقرب للعائد الحقيقي.

- id: c04-f-12
  kind: problem
  part: F
  calc:
    - r1 = IRR([-1000, 3900, -5030, 2145], 0.0, 0.2)
    - r2 = IRR([-1000, 3900, -5030, 2145], 0.4, 0.2)
    - r3 = IRR([-1000, 3900, -5030, 2145], 0.4, 0.8)
  text: |
    مشروع تدفقاته -1,000 ثم 3,900 ثم -5,030 ثم 2,145. كم معدلا له؟ استخدم رسم القيمة الحالية في Python.
  solution: |
    ```python
    import numpy as np
    flows = [-1000, 3900, -5030, 2145]
    for r in np.arange(0, 0.65, 0.05):
        pw = sum(cf / (1 + r) ** t for t, cf in enumerate(flows))
        print(f"{r:4.0%} {pw:8.3f}")
    ```

    الإشارة تتغير 3 مرات، وللمشروع 3 معدلات: [[r1|%2]] و[[r2|%2]] و[[r3|%2]]. هذه حالة نادرة، لكنها توضح لماذا لا نعتمد على الدالة IRR وحدها.
