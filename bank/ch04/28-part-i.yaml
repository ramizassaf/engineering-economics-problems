items:

- id: c04-i-01
  kind: mcq
  part: I
  vars: {C: 20000, R: 5000, n: 6, r0: 0}
  random: {C: [10000, 50000, 1000], n: [4, 10, 1], r0: [0.05, 0.25, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
    - w1 = R/C
    - w2 = (R*n - C)/C/n
    - w3 = (R*n/C)**(1/n) - 1
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ما معدل العائد الداخلي؟
  options: ["[[w1|%2]]", "[[w2|%2]]", "[[r|%2]]", "[[w3|%2]]"]
  correct: 2
  solution: |
    ```excel
    =RATE([[n|n]], [[R|r]], -[[C|r]])
    ```

    الخيار (أ) قسم الدخل على التكلفة. الخيار (ب) متوسط ربح بسيط. الخيار (د) عامل مجموع الدخل كأنه مبلغ واحد في النهاية.

- id: c04-i-02
  kind: mcq
  part: I
  text: |
    مشروعان متنافيان: أ معدله 25% وقيمته الحالية 8,000 دينار، وب معدله 18% وقيمته الحالية 12,000 دينار، بنفس الحد الأدنى للعائد. ماذا تختار؟
  options: ["أ لأن معدله أعلى", "ب لأن قيمته الحالية أعلى", "كلاهما", "لا يمكن الحكم بدون التحليل التزايدي"]
  correct: 1
  solution: |
    القيمة الحالية بالحد الأدنى للعائد تحسم الاختيار بين بدائل متنافية. التحليل التزايدي يعطي نفس النتيجة، فلا حاجة له هنا.

- id: c04-i-03
  kind: mcq
  part: I
  text: |
    معدل الفرق بين بديلين أعلى من الحد الأدنى للعائد. ماذا يعني ذلك؟
  options: ["البديل الأرخص أفضل", "البديل الأغلى أفضل", "البديلان متساويان", "كلاهما مرفوض"]
  correct: 1
  solution: |
    المال الإضافي في البديل الأغلى يكسب أكثر من الحد الأدنى، فهو يستحق، بشرط أن يكون البديل الأرخص مقبولا أو أن نقارن بعدم التنفيذ.

- id: c04-i-04
  kind: mcq
  part: I
  text: |
    تدفقات مشروع: -100 ثم 60 ثم -20 ثم 80. ما أكبر عدد ممكن للمعدلات الموجبة؟
  options: ["1", "2", "3", "4"]
  correct: 2
  solution: |
    الإشارة تتغير 3 مرات: من سالب إلى موجب، ثم إلى سالب، ثم إلى موجب. هذا حد أعلى، والعدد الفعلي قد يكون أقل.

- id: c04-i-05
  kind: mcq
  part: I
  vars: {rr: 0.10}
  random: {rr: [0.05, 0.15, 0.01]}
  calc:
    - M = (3000*FA(rr, 4)/8000)**(1/4) - 1
    - r = RATE(4, 3000, 8000)
    - w1 = rr
    - w2 = (12000/8000)**(1/4) - 1
  text: |
    استثمار 8,000 دينار يعطي 3,000 دينار سنويا لمدة 4 سنوات. نسبة إعادة الاستثمار [[rr|%]]. ما المعدل المعدل؟
  options: ["[[r|%2]]", "[[M|%2]]", "[[w1|%2]]", "[[w2|%2]]"]
  correct: 1
  solution: |
    $$
    MIRR = \left(\frac{3{,}000\,(F/A,\ [[rr|%]],\ 4)}{8{,}000}\right)^{1/4} - 1 = [[M|%2]]
    $$

    الخيار (أ) المعدل العادي. الخيار (د) جمع الدخل بدون إعادة استثمار.

- id: c04-i-06
  kind: mcq
  part: I
  text: |
    بدائل تكاليف لنفس الخدمة. ما أول مقارنة في التحليل التزايدي؟
  options: ["البديل الأرخص مقابل عدم التنفيذ", "البديل الأغلى مقابل الأرخص", "البديل الثاني في التكلفة مقابل الأرخص", "كل بديل مقابل عدم التنفيذ"]
  correct: 2
  solution: |
    في بدائل التكاليف الخدمة مطلوبة، فعدم التنفيذ غير متاح. نبدأ بالأرخص، ونقارن الذي يليه به.

- id: c04-i-07
  kind: mcq
  part: I
  vars: {L: 10000, r: 0.08, f: 0.03}
  random: {L: [5000, 40000, 1000], r: [0.05, 0.12, 0.005], f: [0.01, 0.05, 0.005]}
  calc:
    - A = L*AP(r, 3)
    - re = RATE(3, A, L*(1 - f))
    - w1 = r + f
    - w2 = r + f/3
  text: |
    قرض [[L|g]] دينار بفائدة [[r|%]] لمدة 3 سنوات بأقساط سنوية، ورسوم [[f|%]] تخصم عند الصرف. ما التكلفة الحقيقية؟
  options: ["[[r|%2]]", "[[w1|%2]]", "[[re|%2]]", "[[w2|%2]]"]
  correct: 2
  solution: |
    ```excel
    =RATE(3, PMT([[r|%]], 3, -[[L|r]]), -[[L|r]]*(1 - [[f|%]]))
    ```

    الخيار (ب) أضاف الرسوم كاملة لسنة واحدة. الخيار (د) وزعها بالتساوي، وهذا تقريب يتجاهل أن القرض يسدد تدريجيا.

- id: c04-i-08
  kind: mcq
  part: I
  text: |
    مشروع عام قيمته الحالية للمنافع 5 ملايين، وللتكاليف 4 ملايين. ماذا تعرف؟
  options: ["النسبة 1.25 والمشروع مجد", "النسبة 0.80 والمشروع غير مجد", "النسبة 1.25 لكن لا يمكن الحكم بدون المعدل", "القيمة الحالية الصافية سالبة"]
  correct: 0
  solution: |
    النسبة تساوي 5 مقسومة على 4، أي 1.25. أكبر من 1، فالمشروع مجد، والقيمة الحالية الصافية للمجتمع مليون دينار.

- id: c04-i-09
  kind: mcq
  part: I
  text: |
    ضاعفت شركة حجم مشروع، فضاعفت التكلفة وكل الدخل. ماذا يحدث؟
  options: ["المعدل يتضاعف", "المعدل لا يتغير والقيمة الحالية تتضاعف", "المعدل والقيمة الحالية لا يتغيران", "القيمة الحالية لا تتغير"]
  correct: 1
  solution: |
    ضرب كل التدفقات في 2 لا يغير النسبة التي تجعل مجموعها صفرا، لكنه يضاعف القيمة الحالية عند أي نسبة.

- id: c04-i-10
  kind: mcq
  part: I
  text: |
    منحنيا القيمة الحالية لمشروعين يتقاطعان عند 12%. الحد الأدنى للعائد 15%. أي المشروعين نختار؟
  options: ["صاحب المنحنى الأشد انحدارا", "صاحب المنحنى الأقل انحدارا", "أي منهما", "لا يمكن الحكم"]
  correct: 1
  solution: |
    فوق نقطة التقاطع يكون المنحنى الأقل انحدارا أعلى، لأن الخصم يضعف المشروع الذي دخله أبعد أو استثماره أكبر أكثر من الآخر. نختار المشروع صاحب القيمة الحالية الأكبر عند 15%، وهو صاحب المنحنى الأقل انحدارا، بشرط أن تكون قيمته موجبة.
