- id: c04-h-01
  kind: problem
  part: H
  vars: {c0: 50000, c1: 8000, c2: 12000, c3: 16000, c4: 18000, c5: 20000}
  random: {c0: [30000, 60000, 1000], c1: [4000, 14000, 500], c2: [6000, 16000, 500], c3: [8000, 20000, 500], c4: [8000, 22000, 500], c5: [8000, 24000, 500]}
  calc:
    - r = IRR([-c0, c1, c2, c3, c4, c5])
    - p = NPV(r, [-c0, c1, c2, c3, c4, c5])
  text: |
    اكتب التدفقات [[-c0|r]] و[[c1|r]] و[[c2|r]] و[[c3|r]] و[[c4|r]] و[[c5|r]] في Excel، واحسب المعدل. ثم تحقق بحساب القيمة الحالية عند المعدل نفسه.
  solution: |
    ```excel
    =IRR(B1:B6)
    =B1 + NPV(B8, B2:B6)
    ```

    حيث B8 الخلية التي فيها المعدل. المعدل [[r|%2]]، والقيمة الحالية عنده [[abs(p)|2]]، أي صفر تقريبا.

- id: c04-h-02
  kind: problem
  part: H
  vars: {C: 40000, R: 9000, n: 7, r0: 0}
  random: {C: [20000, 80000, 1000], n: [5, 10, 1], r0: [0.03, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
  text: |
    اكتب في Python دالة بطريقة التنصيف تحسب معدل استثمار يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. قارن بالدالة irr.
  solution: |
    ```python
    import numpy_financial as npf

    def npv(i, flows):
        return sum(cf / (1 + i) ** t for t, cf in enumerate(flows))

    def irr_bisect(flows, lo=0.0, hi=1.0):
        for _ in range(100):
            mid = (lo + hi) / 2
            if npv(mid, flows) > 0:
                lo = mid
            else:
                hi = mid
        return mid

    flows = [-[[C|r]]] + [ [[R|r]] ] * [[n|n]]
    print(round(irr_bisect(flows), 6), round(npf.irr(flows), 6))
    ```

    الطريقتان تعطيان [[r|%2]].

- id: c04-h-03
  kind: problem
  part: H
  calc:
    - p0 = NPV(0.00, [-30000, 18000, -10000, 20000, 12000])
    - p10 = NPV(0.10, [-30000, 18000, -10000, 20000, 12000])
    - p20 = NPV(0.20, [-30000, 18000, -10000, 20000, 12000])
    - p30 = NPV(0.30, [-30000, 18000, -10000, 20000, 12000])
    - r = IRR([-30000, 18000, -10000, 20000, 12000], 0.0, 1.0)
  text: |
    ارسم في Excel منحنى القيمة الحالية لتدفقات -30,000 ثم 18,000 ثم -10,000 ثم 20,000 ثم 12,000، للنسب من 0% إلى 40%. كم مرة يقطع المنحنى المحور الأفقي؟
  solution: |
    اكتب النسب في عمود، وفي العمود المجاور القيمة الحالية بالصيغة التالية، ثم ارسم Scatter:

    ```excel
    =$B$1 + NPV(A3, $C$1:$F$1)
    ```

    | النسبة | القيمة الحالية |
    | --- | --- |
    | 0% | [[p0|2]] |
    | 10% | [[p10|2]] |
    | 20% | [[p20|2]] |
    | 30% | [[p30|2]] |

    المنحنى يقطع المحور مرة واحدة عند [[r|%2]]. الإشارة تتغير 3 مرات في التدفقات، لكن التراكمي يتغير مرة واحدة فقط، فالمعدل واحد.

- id: c04-h-04
  kind: problem
  part: H
  calc:
    - r1 = RATE(8, 6000, 20000)
    - r21 = RATE(8, 2500, 10000)
    - r32 = RATE(8, 3000, 15000)
  text: |
    اكتب برنامج Python يأخذ قائمة بدائل متنافية، لكل منها تكلفة ودخل سنوي ونفس العمر، ويطبق التحليل التزايدي تلقائيا. جربه على البدائل الثلاثة في مثال التحليل التزايدي بنسبة 12%.
  solution: |
    ```python
    import numpy_financial as npf

    def incremental(alts, n, marr):
        alts = sorted(alts, key=lambda a: a[1])
        best = ("none", 0, 0)
        for alt in alts:
            dc, dr = alt[1] - best[1], alt[2] - best[2]
            r = npf.irr([-dc] + [dr] * n)
            print(alt[0], "vs", best[0], round(r, 4))
            if r >= marr:
                best = alt
        return best[0]

    alts = [("1", 20000, 6000), ("2", 30000, 8500), ("3", 45000, 11500)]
    print(incremental(alts, 8, 0.12))
    ```

    المعدلات: [[r1|%2]] ثم [[r21|%2]] ثم [[r32|%2]]. البرنامج يختار البديل 2.

- id: c04-h-05
  kind: problem
  part: H
  vars: {P: 900, A: 85, N: 12}
  random: {P: [300, 2000, 50], N: [6, 24, 6]}
  calc:
    - A = ceil(P*1.15/N)
    - im = RATE(N, A, P)
    - ia = (1+im)**12 - 1
  text: |
    محل يعرض جهازا بسعر [[P|g]] دينار نقدا، أو بأقساط [[A|g]] دينار شهريا لمدة [[N|n]] شهرا. احسب في Excel المعدل الشهري والفعلي السنوي بصيغة واحدة لكل منهما.
  solution: |
    ```excel
    =RATE([[N|n]], [[A|r]], -[[P|r]])
    =(1 + RATE([[N|n]], [[A|r]], -[[P|r]]))^12 - 1
    ```

    المعدل الشهري [[im|%2]]، والفعلي السنوي [[ia|%2]].

- id: c04-h-06
  kind: problem
  part: H
  calc:
    - r = 0.3748585976875559
  text: |
    مستثمر دفع 10,000 دينار في 1 كانون الثاني 2026، وقبض 2,750 في 1 آذار 2026، و4,250 في 30 تشرين الأول 2026، و3,250 في 15 شباط 2027، و2,750 في 1 نيسان 2027. احسب المعدل بالدالة XIRR. لماذا لا تصلح الدالة IRR هنا؟
  solution: |
    ```excel
    =XIRR(B2:B6, A2:A6)
    ```

    المعدل [[r|%2]] سنويا. الدالة IRR تفترض فترات متساوية بين التدفقات، وهنا المسافات بين التواريخ مختلفة.

- id: c04-h-07
  kind: problem
  part: H
  vars: {C: 50000, R: 12000, n: 6, r0: 0}
  random: {C: [20000, 80000, 1000], n: [4, 10, 1], r0: [0.06, 0.30, 0.01]}
  calc:
    - R = pick(r0 > 0, floor(C*AP(r0, n)/100)*100, R)
    - r = RATE(n, R, C)
    - Rm = R*0.9
    - rm = RATE(n, Rm, C)
    - Cp = C*1.1
    - rc = RATE(n, R, Cp)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[R|g]] دينار سنويا لمدة [[yrs(n)]]. ابن في Excel جدول حساسية يبين المعدل إذا نقص الدخل 10%، أو زادت التكلفة 10%.
  solution: |
    | الحالة | المعدل |
    | --- | --- |
    | الأساس | [[r|%2]] |
    | الدخل أقل 10% | [[rm|%2]] |
    | التكلفة أعلى 10% | [[rc|%2]] |

    ```excel
    =RATE([[n|n]], [[R|r]]*0.9, -[[C|r]])
    =RATE([[n|n]], [[R|r]], -[[C|r]]*1.1)
    ```

    انخفاض الدخل يؤثر أكثر من ارتفاع التكلفة بنفس النسبة، لأن الدخل يتكرر كل سنة.

- id: c04-h-08
  kind: problem
  part: H
  vars: {c0: 50000, c1: 12000, c2: 15000, c3: 18000, c4: 15000, c5: 12000}
  random: {c0: [30000, 60000, 1000], c1: [8000, 20000, 500], c2: [8000, 20000, 500], c3: [8000, 22000, 500], c4: [8000, 20000, 500], c5: [5000, 18000, 500]}
  calc:
    - m6 = (c1*FP(0.06, 4) + c2*FP(0.06, 3) + c3*FP(0.06, 2) + c4*FP(0.06, 1) + c5)/c0
    - M6 = m6**(1/5) - 1
    - m12 = (c1*FP(0.12, 4) + c2*FP(0.12, 3) + c3*FP(0.12, 2) + c4*FP(0.12, 1) + c5)/c0
    - M12 = m12**(1/5) - 1
    - r = IRR([-c0, c1, c2, c3, c4, c5])
  text: |
    احسب في Excel المعدل المعدل لتدفقات [[-c0|r]] ثم [[c1|r]] و[[c2|r]] و[[c3|r]] و[[c4|r]] و[[c5|r]]، بنسبة إعادة استثمار 6% ثم 12%. قارن بالمعدل العادي.
  solution: |
    ```excel
    =MIRR(B1:B6, 8%, 6%)
    =MIRR(B1:B6, 8%, 12%)
    ```

    المعدل المعدل [[M6|%2]] بنسبة 6%، و[[M12|%2]] بنسبة 12%. المعدل العادي [[r|%2]]. كلما اقتربت نسبة إعادة الاستثمار من المعدل العادي، اقترب المعدل المعدل منه.

- id: c04-h-09
  kind: problem
  part: H
  vars: {I: 2000000, B: 300000, M: 50000}
  random: {I: [800000, 4000000, 100000], B: [100000, 500000, 10000], M: [10000, 100000, 5000]}
  calc:
    - b4 = B*PA(0.04, 25)/(I + M*PA(0.04, 25))
    - b6 = B*PA(0.06, 25)/(I + M*PA(0.06, 25))
    - b8 = B*PA(0.08, 25)/(I + M*PA(0.08, 25))
    - b10 = B*PA(0.10, 25)/(I + M*PA(0.10, 25))
  text: |
    اكتب في Python دالة تحسب نسبة المنفعة إلى التكلفة لمشروع يكلف [[I|g]] دينار، ومنافعه [[B|g]] وصيانته [[M|g]] دينار سنويا لمدة 25 سنة، واطبعها للنسب 4% و6% و8% و10%.
  solution: |
    ```python
    def bc(I, B, M, i, n):
        pa = (1 - (1 + i) ** -n) / i
        return B * pa / (I + M * pa)

    for i in [0.04, 0.06, 0.08, 0.10]:
        print(i, round(bc([[I|r]], [[B|r]], [[M|r]], i, 25), 4))
    ```

    | النسبة | B/C |
    | --- | --- |
    | 4% | [[b4|f4]] |
    | 6% | [[b6|f4]] |
    | 8% | [[b8|f4]] |
    | 10% | [[b10|f4]] |

- id: c04-h-10
  kind: problem
  part: H
  vars: {L: 25000, r: 0.08, n: 5, f: 0.02}
  random: {L: [5000, 60000, 1000], r: [0.05, 0.12, 0.005], n: [2, 10, 1], f: [0.01, 0.05, 0.005]}
  calc:
    - A = L*AP(r, n)
    - re = RATE(n, A, L*(1 - f))
  text: |
    ابن في Excel جدولا يبين التكلفة الحقيقية لقرض [[L|g]] دينار بفائدة [[r|%]] ورسوم [[f|%]]، لمدد من سنة إلى 10 سنوات. ما التكلفة عند [[yrs(n)]]؟
  solution: |
    ضع المدد في العمود A من A2، واكتب في B2 واسحب:

    ```excel
    =RATE(A2, PMT([[r|%]], A2, -[[L|r]]), -[[L|r]]*(1 - [[f|%]]))
    ```

    عند [[yrs(n)]] التكلفة الحقيقية [[re|%2]]. الجدول يبين أن أثر الرسوم يقل كلما طالت المدة.
