meta:
  number: 4
  title: |
    معدل العائد الداخلي
  parts:
    - key: A
      title: "الجزء أ: أسئلة مفاهيم"
      intro: أجب بجملة أو جملتين، بدون حساب.
    - key: B
      title: "الجزء ب: حساب معدل العائد الداخلي"
    - key: C
      title: "الجزء ج: القبول والرفض"
      intro: قارن المعدل بالحد الأدنى للعائد، وتأكد أن القيمة الحالية تعطي نفس القرار.
    - key: D
      title: "الجزء د: التحليل التزايدي لبديلين"
      intro: لا تختر البديل صاحب أعلى معدل. احسب معدل الفرق بين البديلين.
    - key: E
      title: "الجزء هـ: أكثر من بديلين"
      intro: رتب البدائل حسب التكلفة، ثم قارن كل بديل بالأفضل قبله.
    - key: F
      title: "الجزء و: تعدد الحلول والمعدل المعدل"
    - key: G
      title: "الجزء ز: نسبة المنفعة إلى التكلفة"
    - key: H
      title: "الجزء ح: مسائل Excel وPython"
      intro: حل هذه المسائل بجدول في Excel أو ببرنامج Python، وليس باليد.
    - key: I
      title: "الجزء ط: اختيار من متعدد"
      intro: كل خيار خاطئ في هذا الجزء مبني على خطأ يقع فيه الطلاب فعلا.
    - key: J
      title: "الجزء ي: حالات مصغرة"
      intro: كل حالة تجمع أكثر من فكرة من الفصل، وبعضها يضيف فكرة جديدة.
