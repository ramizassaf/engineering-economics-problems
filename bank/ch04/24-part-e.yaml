items:

- id: c04-e-01
  kind: problem
  part: E
  vars: {i: 0.12}
  random: {i: [0.08, 0.16, 0.01]}
  calc:
    - r1 = RATE(6, 5000, 15000)
    - r21 = RATE(6, 2800, 10000)
    - r32 = RATE(6, 3000, 15000)
    - P1 = -15000 + 5000*PA(i, 6)
    - P2 = -25000 + 7800*PA(i, 6)
    - P3 = -40000 + 10800*PA(i, 6)
    - best = max(P1, P2, P3)
    - name = pick(best < 0, 'عدم التنفيذ', pick(best == P1, 'البديل 1', pick(best == P2, 'البديل 2', 'البديل 3')))
  text: |
    ثلاثة بدائل متنافية عمرها 6 سنوات. البديل 1 يكلف 15,000 ويعطي 5,000 سنويا. البديل 2 يكلف 25,000 ويعطي 7,800 سنويا. البديل 3 يكلف 40,000 ويعطي 10,800 سنويا. اختر بالتحليل التزايدي بنسبة [[i|%]].
  solution: |
    | المقارنة | الاستثمار الإضافي | الدخل الإضافي | المعدل |
    | --- | --- | --- | --- |
    | 1 مقابل عدم التنفيذ | 15,000 | 5,000 | [[r1|%2]] |
    | 2 مقابل 1 | 10,000 | 2,800 | [[r21|%2]] |
    | 3 مقابل 2 | 15,000 | 3,000 | [[r32|%2]] |

    كل مقارنة تقبل البديل الأغلى إذا كان معدلها أعلى من [[i|%]]. هذا الجدول صحيح عندما يفوز البديل الأغلى في كل خطوة. إذا خسر أحد البدائل فالمقارنة التالية تكون مع آخر بديل فائز.

    القيم الحالية للتأكد: [[P1|2]] و[[P2|2]] و[[P3|2]]. القرار: [[name]].

- id: c04-e-02
  kind: problem
  part: E
  calc:
    - r1 = RATE(5, 3000, 10000)
    - r2 = RATE(5, 4600, 16000)
    - r3 = RATE(5, 6800, 25000)
    - r21 = RATE(5, 1600, 6000)
    - r31 = RATE(5, 3800, 15000)
    - P1 = -10000 + 3000*PA(0.10, 5)
    - P2 = -16000 + 4600*PA(0.10, 5)
    - P3 = -25000 + 6800*PA(0.10, 5)
  text: |
    ثلاثة بدائل عمرها 5 سنوات، والحد الأدنى 10%:

    | البديل | التكلفة | الدخل السنوي |
    | --- | --- | --- |
    | 1 | 10,000 | 3,000 |
    | 2 | 16,000 | 4,600 |
    | 3 | 25,000 | 6,800 |

    اختر بالتحليل التزايدي، وانتبه لأي بديل تقارن به البديل 3.
  solution: |
    البديل 1 مقابل عدم التنفيذ: المعدل [[r1|%2]]، فيقبل.

    البديل 2 مقابل البديل 1: الفرق 6,000 دينار و1,600 دينار سنويا، والمعدل [[r21|%2]]. [[pick(r21 >= 0.10, 'يقبل البديل 2.', 'يبقى البديل 1.')]]

    البديل 3 مقابل [[pick(r21 >= 0.10, 'البديل 2: الفرق 9,000 دينار و2,200 دينار سنويا، والمعدل ' , 'البديل 1: الفرق 15,000 دينار و3,800 دينار سنويا، والمعدل ')]][[pick(r21 >= 0.10, RATE(5, 2200, 9000), r31)|%2]].

    القيم الحالية: [[P1|2]] و[[P2|2]] و[[P3|2]]. البديل الأفضل صاحب أكبر قيمة: البديل [[pick(P1 >= max(P2, P3), '1', pick(P2 >= P3, '2', '3'))]].

- id: c04-e-03
  kind: problem
  part: E
  calc:
    - r21 = RATE(8, 900, 4000)
    - r32 = RATE(8, 1500, 6000)
    - r43 = RATE(8, 1200, 7000)
    - P1 = 12000 + 5000*PA(0.10, 8)
    - P2 = 16000 + 4100*PA(0.10, 8)
    - P3 = 22000 + 2600*PA(0.10, 8)
    - P4 = 29000 + 1400*PA(0.10, 8)
  text: |
    أربعة أنظمة تكييف لمبنى، لعمر 8 سنوات، والحد الأدنى 10%:

    | النظام | التكلفة | الكهرباء السنوية |
    | --- | --- | --- |
    | 1 | 12,000 | 5,000 |
    | 2 | 16,000 | 4,100 |
    | 3 | 22,000 | 2,600 |
    | 4 | 29,000 | 1,400 |

    اختر بالتحليل التزايدي.
  solution: |
    بدائل تكاليف، فنبدأ بالأرخص، النظام 1، بدون مقارنة بعدم التنفيذ.

    | المقارنة | الاستثمار الإضافي | التوفير السنوي | المعدل |
    | --- | --- | --- | --- |
    | 2 مقابل 1 | 4,000 | 900 | [[r21|%2]] |
    | 3 مقابل 2 | 6,000 | 1,500 | [[r32|%2]] |
    | 4 مقابل 3 | 7,000 | 1,200 | [[r43|%2]] |

    القيم الحالية للتكاليف: [[P1|2]] و[[P2|2]] و[[P3|2]] و[[P4|2]]. الأقل: النظام [[pick(P1 <= min(P2, P3, P4), '1', pick(P2 <= min(P3, P4), '2', pick(P3 <= P4, '3', '4')))]].

    لاحظ: إذا خسر النظام 2 أمام النظام 1، فالنظام 3 يقارن بالنظام 1، وليس بالنظام 2. احسب هذه المقارنة إذا احتجتها.

- id: c04-e-04
  kind: problem
  part: E
  calc:
    - r1 = RATE(10, 3200, 20000)
    - r2 = RATE(10, 5100, 30000)
    - r3 = RATE(10, 6900, 40000)
  text: |
    طالب رتب ثلاثة مشاريع عمرها 10 سنوات حسب معدل كل منها: الأول يكلف 20,000 ويعطي 3,200 سنويا، والثاني يكلف 30,000 ويعطي 5,100 سنويا، والثالث يكلف 40,000 ويعطي 6,900 سنويا. ما المعدلات؟ لماذا لا يكفي هذا الترتيب لاختيار مشروع واحد بنسبة 9%؟
  solution: |
    المعدلات: [[r1|%2]] و[[r2|%2]] و[[r3|%2]].

    الترتيب يقول أي مشروع يعطي أعلى نسبة، لكن السؤال الصحيح: هل كل مبلغ إضافي يعطي 9% على الأقل؟ هذا يحتاج معدل الفرق بين كل مشروعين متتاليين، أو القيمة الحالية لكل مشروع.

- id: c04-e-05
  kind: problem
  part: E
  calc:
    - P1 = -20000 + 3200*PA(0.09, 10)
    - P2 = -30000 + 5100*PA(0.09, 10)
    - P3 = -40000 + 6900*PA(0.09, 10)
    - r21 = RATE(10, 1900, 10000)
    - r32 = RATE(10, 1800, 10000)
  text: |
    أكمل المسألة السابقة بالتحليل التزايدي والقيمة الحالية بنسبة 9%.
  solution: |
    معدل الفرق بين الثاني والأول [[r21|%2]]، وبين الثالث والثاني [[r32|%2]].

    القيم الحالية: [[P1|2]] و[[P2|2]] و[[P3|2]]. الأفضل المشروع [[pick(P1 >= max(P2, P3), 'الأول', pick(P2 >= P3, 'الثاني', 'الثالث'))]].

- id: c04-e-06
  kind: problem
  part: E
  vars: {i: 0.10}
  random: {i: [0.05, 0.15, 0.01]}
  calc:
    - Pa = -50000 + 14000*PA(i, 6)
    - Pb = -80000 + 20500*PA(i, 6)
    - Pc = -65000 + 17500*PA(i, 6)
    - best = max(Pa, Pb, Pc)
    - name = pick(best < 0, 'عدم التنفيذ', pick(best == Pa, 'أ', pick(best == Pc, 'ج', 'ب')))
  text: |
    ثلاثة بدائل عمرها 6 سنوات: أ يكلف 50,000 ويعطي 14,000 سنويا، وب يكلف 80,000 ويعطي 20,500 سنويا، وج يكلف 65,000 ويعطي 17,500 سنويا. بأي ترتيب تجري المقارنات؟ ثم اختر بالقيمة الحالية بنسبة [[i|%]].
  solution: |
    نرتب حسب التكلفة: أ ثم ج ثم ب. المقارنات: أ مقابل عدم التنفيذ، ثم ج مقابل الفائز، ثم ب مقابل الفائز.

    القيم الحالية: أ [[Pa|2]]، وج [[Pc|2]]، وب [[Pb|2]]. القرار: [[name]].

- id: c04-e-07
  kind: problem
  part: E
  calc:
    - ra = RATE(5, 2000, 5000)
    - rd = RATE(5, 2300, 10000)
    - rdc = RATE(5, 1100, 5000)
  text: |
    مستثمر لديه 15,000 دينار. أمامه ثلاثة خيارات متنافية لمدة 5 سنوات: أ يكلف 5,000 ويعطي 2,000 سنويا، وب يكلف 15,000 ويعطي 4,300 سنويا، وج يكلف 10,000 ويعطي 3,200 سنويا. المال الذي لا يستثمره يبقى في البنك بنسبة 8%. ماذا يختار؟
  solution: |
    نرتب: أ ثم ج ثم ب.

    أ مقابل عدم التنفيذ: المعدل [[ra|%2]]، أعلى من 8%.

    ج مقابل أ: الفرق 5,000 دينار و1,200 دينار سنويا. المعدل [[RATE(5, 1200, 5000)|%2]].

    ب مقابل الفائز: إذا كان الفائز ج فالفرق 5,000 و1,100 سنويا بمعدل [[rdc|%2]]. إذا كان أ فالفرق 10,000 و2,300 سنويا بمعدل [[rd|%2]].

    قارن كل معدل بنسبة 8%، واختر آخر فائز.

- id: c04-e-08
  kind: problem
  part: E
  calc:
    - B1 = 1500*PA(0.10, 4)
    - r10 = RATE(4, 1500, 4000)
    - r20 = RATE(4, 1200, 3000)
    - r30 = RATE(4, 1000, 3000)
  text: |
    مصنع يدرس ثلاث درجات من الأتمتة لخط تعبئة، لعمر 4 سنوات، والحد الأدنى 10%. الدرجة الأولى تكلف 4,000 وتوفر 1,500 سنويا. الدرجة الثانية تضيف 3,000 على الأولى، وتضيف 1,200 توفير سنوي. الدرجة الثالثة تضيف 3,000 أخرى، وتضيف 1,000 توفير سنوي. إلى أي درجة يذهب المصنع؟
  solution: |
    هنا المعطيات أصلا تزايدية:

    | الخطوة | المعدل |
    | --- | --- |
    | الدرجة الأولى | [[r10|%2]] |
    | الدرجة الثانية فوق الأولى | [[r20|%2]] |
    | الدرجة الثالثة فوق الثانية | [[r30|%2]] |

    المصنع يتقدم خطوة ما دام معدلها أعلى من 10%، ويتوقف عند أول خطوة معدلها أقل. القرار: [[pick(r10 < 0.10, 'لا أتمتة', pick(r20 < 0.10, 'الدرجة الأولى', pick(r30 < 0.10, 'الدرجة الثانية', 'الدرجة الثالثة')))]].

- id: c04-e-09
  kind: problem
  part: E
  calc:
    - ra = RATE(4, 1500, 4000)
    - rb = RATE(4, 2700, 7000)
    - rc = RATE(4, 3700, 10000)
  text: |
    للمصنع في المسألة السابقة: ما معدل كل درجة وحدها، أي التكلفة الكلية مقابل التوفير الكلي؟ لماذا يختلف عن تحليل الخطوات؟
  solution: |
    | الدرجة | التكلفة الكلية | التوفير الكلي | المعدل |
    | --- | --- | --- | --- |
    | الأولى | 4,000 | 1,500 | [[ra|%2]] |
    | الثانية | 7,000 | 2,700 | [[rb|%2]] |
    | الثالثة | 10,000 | 3,700 | [[rc|%2]] |

    معدل الدرجة كاملة متوسط يخلط خطوات مربحة بخطوات أقل ربحا. الخطوة الأخيرة قد تكون غير مجدية مع أن معدل الدرجة كاملة مقبول.

- id: c04-e-10
  kind: problem
  part: E
  vars: {i: 0.10}
  random: {i: [0.05, 0.20, 0.01]}
  calc:
    - P1 = -20000 + 6000*PA(i, 8)
    - P2 = -30000 + 8500*PA(i, 8)
    - P3 = -45000 + 11500*PA(i, 8)
    - best = max(P1, P2, P3)
    - name = pick(best < 0, 'عدم التنفيذ', pick(best == P1, 'البديل 1', pick(best == P2, 'البديل 2', 'البديل 3')))
  text: |
    للبدائل الثلاثة في مثال التحليل التزايدي لثلاثة بدائل في هذا الفصل: ماذا تختار إذا كان الحد الأدنى للعائد [[i|%]]؟
  solution: |
    القيم الحالية بنسبة [[i|%]]: [[P1|2]] و[[P2|2]] و[[P3|2]]. القرار: [[name]].

    تذكر المعدلات التزايدية من المثال: البديل 2 مقابل 1 حوالي 18.6%، والبديل 3 مقابل 2 حوالي 11.8%. الحد الأدنى يحدد أين نتوقف في سلسلة المقارنات.
