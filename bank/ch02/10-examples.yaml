# ------------------------------------------------------------ A/P and P/A
- id: c02-ex-ap-loan
  kind: example
  title: |
    قسط قرض سنوي
  vars: {P: 125000, i: 0.05, n: 7}
  random: {P: [20000, 200000, 5000], i: [0.03, 0.12, 0.005], n: [3, 15, 1]}
  calc:
    - f = AP(i, n)
    - A = P*f
    - At = P*r4(f)
    - T = A*n
    - I = T - P
  diagram: {n: n, i: "i = [[i|%]]", flows: [[0, P]], series: [[1, n, "-P/n", "A"]]}
  text: |
    اقترضت شركة [[P|g]] دينار بفائدة [[i|%]] سنويا، وتسدد القرض بدفعات سنوية متساوية لمدة [[yrs(n)]]. ما القسط السنوي؟ وما مجموع الفوائد التي تدفعها؟
  solution: |
    القرض في السنة 0، والأقساط من السنة 1 إلى السنة [[n|n]]. نطبق معامل استرداد رأس المال:

    $$
    A = P\,\frac{i(1+i)^n}{(1+i)^n - 1} = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[P|g]] \times [[f|f4]] = [[A|2]]
    $$

    بالجداول نحسب المعامل من جدول P/A في الملحق، لأن المعاملين مقلوبان لبعضهما. المعامل المقرب يعطي [[At|2]] دينار.

    في Excel:

    ```excel
    =PMT([[i|%]], [[n|n]], -[[P|r]])
    ```

    في Python:

    ```python
    import numpy_financial as npf
    print(round(npf.pmt([[i|r]], [[n|n]], -[[P|r]]), 2))   # [[A|d2]]
    ```

    مجموع الأقساط [[T|2]] دينار، منها [[I|2]] دينار فوائد.

- id: c02-ex-amort
  kind: example
  title: |
    جدول إطفاء القرض
  vars: {P: 30000, i: 0.08}
  random: {P: [10000, 60000, 1000], i: [0.04, 0.12, 0.005]}
  calc:
    - A = P*AP(i, 5)
    - I1 = P*i
    - Q1 = A - I1
    - B1 = P - Q1
    - I2 = B1*i
    - Q2 = A - I2
    - B2 = B1 - Q2
    - I3 = B2*i
    - Q3 = A - I3
    - B3 = B2 - Q3
    - I4 = B3*i
    - Q4 = A - I4
    - B4 = B3 - Q4
    - I5 = B4*i
    - Q5 = A - I5
    - B5 = abs(B4 - Q5)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] يسدد بخمسة أقساط سنوية متساوية. اكتب جدول إطفاء القرض: الفائدة وسداد الأصل والرصيد في كل سنة.
  solution: |
    القسط السنوي:

    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ 5) = [[A|2]]
    $$

    فائدة كل سنة تساوي النسبة مضروبة في الرصيد في بداية السنة، والباقي من القسط يسدد من أصل القرض:

    | السنة | القسط | الفائدة | سداد الأصل | الرصيد في نهاية السنة |
    | --- | --- | --- | --- | --- |
    | 0 |  |  |  | [[P|2]] |
    | 1 | [[A|2]] | [[I1|2]] | [[Q1|2]] | [[B1|2]] |
    | 2 | [[A|2]] | [[I2|2]] | [[Q2|2]] | [[B2|2]] |
    | 3 | [[A|2]] | [[I3|2]] | [[Q3|2]] | [[B3|2]] |
    | 4 | [[A|2]] | [[I4|2]] | [[Q4|2]] | [[B4|2]] |
    | 5 | [[A|2]] | [[I5|2]] | [[Q5|2]] | [[B5|2]] |

    الفائدة تقل كل سنة لأن الرصيد يقل، وسداد الأصل يزيد بنفس المقدار. في Excel الدالة IPMT تعطي فائدة السنة k، والدالة PPMT تعطي سداد الأصل فيها:

    ```excel
    =IPMT([[i|%]], k, 5, -[[P|r]])
    =PPMT([[i|%]], k, 5, -[[P|r]])
    ```

- id: c02-ex-pa-car
  kind: example
  title: |
    سعر سيارة بالأقساط
  vars: {A: 1203, i: 0.12, n: 9}
  random: {A: [500, 4000, 50], i: [0.06, 0.15, 0.01], n: [3, 10, 1]}
  calc:
    - f = PA(i, n)
    - P = A*f
    - Pt = A*r4(f)
    - T = A*n
  diagram: {n: n, i: "i = [[i|%]]", flows: [[0, "A*n/2", "P = ?"]], series: [[1, n, "-A", "A"]]}
  text: |
    عرض على شخص شراء سيارة بأقساط [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما سعر السيارة نقدا اليوم إذا كانت الفائدة على تمويل السيارات [[i|%]] سنويا؟
  solution: |
    المجهول هو القيمة الحالية لسلسلة الأقساط:

    $$
    P = A\,\frac{(1+i)^n - 1}{i(1+i)^n} = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[A|g]] \times [[f|f4]] = [[P|2]]
    $$

    بالمعامل المقرب لأربع خانات يكون الجواب [[Pt|2]] دينار.

    في Excel:

    ```excel
    =PV([[i|%]], [[n|n]], -[[A|r]])
    ```

    سعر السيارة نقدا [[P|2]] دينار. مجموع الأقساط [[T|2]] دينار، والفرق ثمن التأجيل.

- id: c02-ex-down-payment
  kind: example
  title: |
    دفعة أولى وأقساط
  vars: {D: 12000, A: 5000, n: 5, i: 0.12}
  random: {D: [3000, 20000, 500], A: [1000, 9000, 250], n: [3, 8, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - f = PA(i, n)
    - PA_ = A*f
    - P = D + PA_
  text: |
    عرض لشراء سيارة: دفعة أولى [[D|g]] دينار اليوم، ثم [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما سعر السيارة نقدا إذا كانت الفائدة [[i|%]]؟
  solution: |
    الدفعة الأولى في السنة 0 لا تحتاج نقلا. الأقساط تنقل بالمعامل P/A:

    $$
    P = [[D|g]] + [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[D|g]] + [[A|g]] \times [[f|f4]] = [[P|2]]
    $$

    في Excel:

    ```excel
    =[[D|r]] + PV([[i|%]], [[n|n]], -[[A|r]])
    ```

    السعر النقدي [[P|2]] دينار.

- id: c02-ex-max-price
  kind: example
  title: |
    أعلى سعر لآلة توفر تكاليف
  vars: {S: 8000, n: 6, i: 0.12}
  random: {S: [2000, 15000, 500], n: [3, 10, 1], i: [0.06, 0.18, 0.01]}
  calc:
    - P = S*PA(i, n)
  text: |
    آلة جديدة توفر على مصنع [[S|g]] دينار سنويا لمدة [[yrs(n)]]. ما أعلى سعر يدفعه المصنع للآلة اليوم إذا كان الحد الأدنى للعائد [[i|%]]؟
  solution: |
    الآلة تستحق سعرها إذا كانت القيمة الحالية للتوفير لا تقل عنه:

    $$
    P = [[S|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    أعلى سعر [[P|2]] دينار. إذا كان السعر أعلى، فالمصنع يحقق عائدا أقل من [[i|%]].

# ------------------------------------------------------------ F/A and A/F
- id: c02-ex-fa-saving
  kind: example
  title: |
    حساب توفير للدراسة الجامعية
  vars: {A: 600, i: 0.05, n: 18}
  random: {A: [200, 2000, 50], i: [0.03, 0.09, 0.005], n: [8, 20, 1]}
  calc:
    - f = FA(i, n)
    - F = A*f
    - T = A*n
    - G = F - T
  diagram: {n: n, i: "i = [[i|%]]", flows: [[n, "A*n/2", "F = ?"]], series: [[1, n, "-A"]]}
  text: |
    فتح أب حساب توفير لابنته يوم ولادتها، ويودع [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]]. الحساب يعطي [[i|%]] سنويا. كم يصبح في الحساب بعد الإيداع الأخير؟
  solution: |
    $$
    F = A\,\frac{(1+i)^n - 1}{i} = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[A|g]] \times [[f|f4]] = [[F|2]]
    $$

    في Excel:

    ```excel
    =FV([[i|%]], [[n|n]], -[[A|r]])
    ```

    مجموع ما أودعه الأب [[T|2]] دينار، والباقي [[G|2]] دينار فوائد.

- id: c02-ex-af-debt
  kind: example
  title: |
    ادخار لسداد دين مستقبلي
  vars: {F: 10000, i: 0.08, n: 3}
  random: {F: [3000, 30000, 500], i: [0.04, 0.12, 0.005], n: [2, 8, 1]}
  calc:
    - f = AF(i, n)
    - A = F*f
  diagram: {n: n, i: "i = [[i|%]]", flows: [[n, F]], series: [[1, n, "-F/n", "A = ?"]]}
  text: |
    على شخص دين [[F|g]] دينار يستحق بعد [[yrs(n)]]. يريد أن يودع مبلغا متساويا في نهاية كل سنة في حساب يعطي [[i|%]]، حتى يجمع مبلغ الدين. كم يودع سنويا؟
  solution: |
    $$
    A = F\,\frac{i}{(1+i)^n - 1} = [[F|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[F|g]] \times [[f|f4]] = [[A|2]]
    $$

    في Excel يكتب المبلغ في المدخل الرابع لأنه قيمة مستقبلية:

    ```excel
    =PMT([[i|%]], [[n|n]], 0, -[[F|r]])
    ```

    يودع [[A|2]] دينار سنويا.

- id: c02-ex-af-retire
  kind: example
  title: |
    ادخار للتقاعد
  vars: {F: 800000, i: 0.03, n: 20}
  random: {F: [200000, 900000, 50000], i: [0.02, 0.08, 0.005], n: [15, 35, 1]}
  calc:
    - f = AF(i, n)
    - A = F*f
    - At = F*r4(f)
    - D = abs(A - At)
  text: |
    يريد موظف أن يجمع [[F|g]] دينار عند تقاعده بعد [[yrs(n)]]. كم يجب أن يدخر سنويا إذا كان العائد [[i|%]]؟
  solution: |
    $$
    A = [[F|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[F|g]] \times [[f|f4]] = [[A|2]]
    $$

    ```excel
    =PMT([[i|%]], [[n|n]], 0, -[[F|r]])
    ```

    يدخر [[A|2]] دينار سنويا. لو استخدمنا المعامل مقربا لأربع خانات لحصلنا على [[At|2]] دينار، بفرق [[D|2]] دينار. عندما يكون المعامل صغيرا والمبلغ كبيرا يكبر أثر التقريب، فاستخدم القانون أو Excel.

# ------------------------------------------------------------ deferred and combined
- id: c02-ex-deferred-pv
  kind: example
  title: |
    سلسلة تبدأ متأخرة
  vars: {A: 2000, s: 4, e: 10, i: 0.08}
  random: {A: [500, 6000, 100], s: [3, 6, 1], e: [8, 14, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - m = e - s + 1
    - f1 = PA(i, m)
    - f2 = PF(i, s - 1)
    - P1 = A*f1
    - P0 = P1*f2
  diagram: {n: e, i: "i = [[i|%]]", flows: [[0, "A*2", "P = ?"]], series: [[s, e, "-A"]]}
  text: |
    يستلم شخص [[A|g]] دينار سنويا من نهاية السنة [[s|n]] حتى نهاية السنة [[e|n]]. ما القيمة الحالية لهذه الدفعات إذا كانت الفائدة [[i|%]]؟
  solution: |
    عدد الدفعات [[m|n]]، من السنة [[s|n]] إلى السنة [[e|n]]. المعامل P/A يضع القيمة قبل الدفعة الأولى بسنة، أي في السنة [[s-1|n]]:

    $$
    P_{[[s-1|n]]} = [[A|g]]\,(P/A,\ [[i|%]],\ [[m|n]]) = [[A|g]] \times [[f1|f4]] = [[P1|2]]
    $$

    ثم ننقلها إلى السنة 0:

    $$
    P_0 = [[P1|2]]\,(P/F,\ [[i|%]],\ [[s-1|n]]) = [[P1|2]] \times [[f2|f4]] = [[P0|2]]
    $$

    في Excel:

    ```excel
    =PV([[i|%]], [[s-1|n]], 0, -PV([[i|%]], [[m|n]], -[[A|r]]))
    ```

    أكثر خطأ يقع فيه الطلاب هنا: نقل القيمة [[yrs(s)]] بدل [[yrs(s-1)]].

- id: c02-ex-deferred-fv
  kind: example
  title: |
    ادخار ثم انتظار
  vars: {A: 3000, n: 6, w: 4, i: 0.06}
  random: {A: [500, 8000, 250], n: [3, 10, 1], w: [2, 8, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - f1 = FA(i, n)
    - F1 = A*f1
    - f2 = FP(i, w)
    - F = F1*f2
  text: |
    أودعت مهندسة [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]]، ثم توقفت عن الإيداع وتركت الرصيد [[yrs(w)]] أخرى. كم يصبح الرصيد في النهاية بفائدة [[i|%]]؟
  solution: |
    المعامل F/A يعطي الرصيد في السنة [[n|n]]، مع الإيداع الأخير:

    $$
    F_{[[n|n]]} = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[F1|2]]
    $$

    ثم ينمو الرصيد وحده [[yrs(w)]]:

    $$
    F = [[F1|2]]\,(F/P,\ [[i|%]],\ [[w|n]]) = [[F|2]]
    $$

    ```excel
    =FV([[i|%]], [[w|n]], 0, -FV([[i|%]], [[n|n]], -[[A|r]]))
    ```

- id: c02-ex-machine-salvage
  kind: example
  title: |
    توفير سنوي وقيمة بيع في النهاية
  vars: {C: 45000, S: 11000, R: 6000, n: 6, i: 0.10}
  random: {C: [20000, 80000, 1000], S: [4000, 20000, 500], R: [1000, 15000, 500], n: [4, 10, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - p1 = S*PA(i, n)
    - p2 = R*PF(i, n)
    - N = -C + p1 + p2
    - dec = pick(N >= 0, 'تستحق الشراء', 'لا تستحق الشراء')
  diagram: {n: n, i: "i = [[i|%]]", flows: [[0, -C], [n, "S+R", "[[S|g]] + [[R|g]]"]], series: [[1, "n-1", S]]}
  text: |
    آلة سعرها [[C|g]] دينار، توفر [[S|g]] دينار سنويا لمدة [[yrs(n)]]، وتباع في النهاية بمبلغ [[R|g]] دينار. هل تستحق الشراء بحد أدنى للعائد [[i|%]]؟
  solution: |
    نجمع القيمة الحالية للتوفير وقيمة البيع، ونطرح السعر:

    $$
    P = -[[C|g]] + [[S|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[R|g]]\,(P/F,\ [[i|%]],\ [[n|n]])
    $$

    $$
    P = -[[C|g]] + [[p1|2]] + [[p2|2]] = [[N|2]]
    $$

    في Excel تضع الدالة PV الدفعة السنوية وقيمة البيع معا:

    ```excel
    =-[[C|r]] + PV([[i|%]], [[n|n]], -[[S|r]], -[[R|r]])
    ```

    الآلة [[dec]].

- id: c02-ex-annuity-due
  kind: example
  title: |
    إيجار يدفع في بداية كل سنة
  vars: {A: 9000, n: 5, i: 0.07}
  random: {A: [2000, 20000, 500], n: [3, 10, 1], i: [0.04, 0.12, 0.005]}
  calc:
    - f = PA(i, n - 1)
    - P = A + A*f
    - Pe = A*PA(i, n)
  text: |
    يستأجر مكتب هندسي مقرا بمبلغ [[A|g]] دينار سنويا لمدة [[yrs(n)]]، والإيجار يدفع في بداية كل سنة. ما القيمة الحالية للإيجار بفائدة [[i|%]]؟
  solution: |
    الدفعة الأولى في السنة 0، والباقي [[n-1|n]] دفعات من السنة 1 إلى السنة [[n-1|n]]:

    $$
    P = [[A|g]] + [[A|g]]\,(P/A,\ [[i|%]],\ [[n-1|n]]) = [[P|2]]
    $$

    في Excel المدخل الخامس للدالة PV يحدد موعد الدفعة: 1 يعني بداية السنة.

    ```excel
    =PV([[i|%]], [[n|n]], -[[A|r]], 0, 1)
    ```

    لو كان الإيجار في نهاية كل سنة، لكانت القيمة الحالية [[Pe|2]] دينار. الدفع المبكر يرفع القيمة الحالية.

- id: c02-ex-find-n
  kind: example
  title: |
    كم سنة حتى يسدد القرض؟
  vars: {P: 20000, A: 3000, i: 0.08}
  random: {P: [5000, 40000, 1000], A: [1000, 9000, 250], i: [0.04, 0.12, 0.01]}
  calc:
    - A = max(A, P*i*1.25)
    - n = -ln(1 - P*i/A)/ln(1+i)
    - k = ceil(n)
  text: |
    اقترض شخص [[P|g]] دينار بفائدة [[i|%]]، ويستطيع أن يدفع [[A|g]] دينار سنويا. كم سنة يحتاج ليسدد القرض؟
  solution: |
    نحل معادلة القيمة الحالية لإيجاد n:

    $$
    [[P|g]] = [[A|g]]\,(P/A,\ [[i|%]],\ n) \quad\Rightarrow\quad n = \frac{-\ln\left(1 - \frac{P\,i}{A}\right)}{\ln(1+i)} = [[n|2]]
    $$

    في Excel:

    ```excel
    =NPER([[i|%]], -[[A|r]], [[P|r]])
    ```

    يحتاج [[yrs(k-1)]] كاملة ودفعة أخيرة أصغر في السنة [[k|n]].

    ملاحظة: إذا كانت الدفعة السنوية أقل من فائدة السنة الأولى، أي أقل من [[P*i|2]] دينار، فلن يسدد القرض أبدا.

- id: c02-ex-find-i
  kind: example
  title: |
    عائد استثمار بإيرادات متساوية
  vars: {C: 25000, A: 7000, n: 5, r0: 0}
  random: {C: [10000, 50000, 1000], r0: [0.04, 0.18, 0.01], n: [3, 10, 1]}
  calc:
    - A = pick(r0 > 0, floor(C*AP(r0, n)/50)*50, A)
    - f = C/A
  text: |
    يستثمر شخص [[C|g]] دينار ويستلم [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما نسبة العائد؟
  solution: |
    نبحث عن النسبة التي تجعل القيمة الحالية للإيرادات تساوي الاستثمار:

    $$
    [[C|g]] = [[A|g]]\,(P/A,\ i,\ [[n|n]]) \quad\Rightarrow\quad (P/A,\ i,\ [[n|n]]) = [[f|f4]]
    $$

    لا يوجد حل جبري لهذه المعادلة. باليد تبحث في جدول P/A في عمود [[n|n]] عن نسبتين حول [[f|f4]] ثم تستكمل خطيا، وهذا موضوع الفصل الرابع. في Excel:

    ```excel
    =RATE([[n|n]], [[A|r]], -[[C|r]])
    ```

    وفي Python:

    ```python
    import numpy_financial as npf
    print(round(npf.rate([[n|n]], [[A|r]], -[[C|r]], 0), 4))
    ```

# ------------------------------------------------------------ gradients
- id: c02-ex-gradient
  kind: example
  title: |
    تكاليف صيانة تزيد كل سنة
  vars: {A1: 1500, G: 300, n: 8, i: 0.10}
  random: {A1: [500, 4000, 100], G: [50, 600, 25], n: [4, 10, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - f1 = PA(i, n)
    - f2 = PG(i, n)
    - f3 = AG(i, n)
    - P = A1*f1 + G*f2
    - A = A1 + G*f3
    - L = A1 + (n - 1)*G
  diagram: {n: n, i: "i = [[i|%]]", series: [[1, n, "-(A1 + (t-1)*G)"]]}
  text: |
    تكلفة صيانة آلة في مصنع [[A1|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. نسبة الفائدة [[i|%]]. (أ) ما القيمة الحالية لتكاليف الصيانة؟ (ب) ما التكلفة السنوية المتساوية المكافئة؟
  solution: |
    نقسم السلسلة إلى جزأين: سلسلة ثابتة [[A1|g]] دينار، وسلسلة متدرجة تبدأ بصفر في السنة 1 ثم [[G|g]] في السنة 2 وهكذا.

    (أ)

    $$
    P = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]])
    $$

    $$
    P = [[A1|g]] \times [[f1|f4]] + [[G|g]] \times [[f2|f4]] = [[P|2]]
    $$

    (ب)

    $$
    A = [[A1|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ [[n|n]])
    $$

    $$
    A = [[A1|g]] + [[G|g]] \times [[f3|f4]] = [[A|2]]
    $$

    التكلفة تبدأ بـ [[A1|g]] دينار وتنتهي بـ [[L|g]] دينار. توزيعها بالتساوي يكافئ [[A|2]] دينار سنويا.

    لا توجد في Excel دالة جاهزة للتدرج. اكتب التكاليف في عمود من B2 إلى B[[n+1|n]]، ثم:

    ```excel
    =NPV([[i|%]], B2:B[[n+1|n]])
    ```

- id: c02-ex-gradient-down
  kind: example
  title: |
    إيرادات تقل كل سنة
  vars: {A1: 20000, G: 1500, n: 6, i: 0.09}
  random: {A1: [8000, 30000, 1000], G: [200, 2000, 100], n: [4, 8, 1], i: [0.05, 0.14, 0.01]}
  calc:
    - P = A1*PA(i, n) - G*PG(i, n)
    - L = A1 - (n - 1)*G
  diagram: {n: n, i: "i = [[i|%]]", series: [[1, n, "A1 - (t-1)*G"]]}
  text: |
    إيرادات منتج [[A1|g]] دينار في السنة الأولى، وتقل [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. ما القيمة الحالية للإيرادات بنسبة [[i|%]]؟
  solution: |
    التدرج هنا سالب، فنطرح الجزء المتدرج:

    $$
    P = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    الإيراد في السنة الأخيرة [[L|g]] دينار.

- id: c02-ex-gradient-shift
  kind: example
  title: |
    تدرج يبدأ بعد سنوات
  vars: {A1: 1000, G: 200, s: 3, n: 6, i: 0.08}
  random: {A1: [500, 3000, 100], G: [50, 500, 25], s: [2, 4, 1], n: [4, 8, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - e = s + n - 1
    - Ps = A1*PA(i, n) + G*PG(i, n)
    - P0 = Ps*PF(i, s - 1)
  diagram: {n: e, i: "i = [[i|%]]", series: [[s, e, "-(A1 + (t-s)*G)"]]}
  text: |
    تكاليف تشغيل خط جديد تبدأ في نهاية السنة [[s|n]] بمبلغ [[A1|g]] دينار، وتزيد [[G|g]] دينار كل سنة، وتستمر [[yrs(n)]]. ما قيمتها الحالية بنسبة [[i|%]]؟
  solution: |
    معاملا P/A وP/G يضعان القيمة قبل الدفعة الأولى بسنة، أي في السنة [[s-1|n]]:

    $$
    P_{[[s-1|n]]} = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[Ps|2]]
    $$

    $$
    P_0 = [[Ps|2]]\,(P/F,\ [[i|%]],\ [[s-1|n]]) = [[P0|2]]
    $$

- id: c02-ex-geometric
  kind: example
  title: |
    تكلفة كهرباء ترتفع بنسبة ثابتة
  vars: {A1: 4000, g: 0.06, n: 10, i: 0.10}
  random: {A1: [1000, 9000, 250], g: [0.02, 0.08, 0.005], n: [5, 15, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - r = ((1+g)/(1+i))**n
    - f = PGEO(g, i, n)
    - P = A1*f
    - L = A1*(1+g)**(n-1)
  diagram: {n: n, i: "i = [[i|%]]", series: [[1, n, "-A1*(1+g)**(t-1)"]]}
  text: |
    تكلفة الكهرباء في ورشة [[A1|g]] دينار في السنة الأولى، ويتوقع أن ترتفع [[g|%]] سنويا لمدة [[yrs(n)]]. ما القيمة الحالية لتكاليف الكهرباء بنسبة [[i|%]]؟
  solution: |
    $$
    P = A_1\,\frac{1 - \left(\frac{1+g}{1+i}\right)^n}{i - g}
    $$

    $$
    \left(\frac{1 + [[g|r]]}{1 + [[i|r]]}\right)^{[[n|n]]} = [[r|f4]]
    $$

    $$
    P = [[A1|g]] \times \frac{1 - [[r|f4]]}{[[i|r]] - [[g|r]]} = [[A1|g]] \times [[f|f4]] = [[P|2]]
    $$

    التكلفة في السنة الأخيرة [[L|2]] دينار. لا توجد جداول لهذا المعامل لأن فيه متغيرا ثالثا. في Excel اكتب الصيغة التالية في الخلية B2 واسحبها حتى السنة [[n|n]]، ثم استخدم NPV:

    ```excel
    =[[A1|r]]*(1+[[g|%]])^(A2-1)
    ```

- id: c02-ex-geometric-equal
  kind: example
  title: |
    عندما تتساوى نسبة النمو ونسبة الفائدة
  vars: {A1: 5000, g: 0.08, n: 6}
  random: {A1: [1000, 10000, 250], g: [0.03, 0.12, 0.01], n: [3, 10, 1]}
  calc:
    - P = A1*n/(1+g)
  text: |
    دفعة سنوية تبدأ بـ [[A1|g]] دينار وتزيد [[g|%]] سنويا لمدة [[yrs(n)]]. ما قيمتها الحالية إذا كانت الفائدة أيضا [[g|%]]؟
  solution: |
    القانون العام يقسم على صفر عندما تتساوى النسبتان. في هذه الحالة كل دفعة تكافئ في السنة 0 نفس المبلغ:

    $$
    \frac{A_1(1+g)^{t-1}}{(1+i)^t} = \frac{A_1}{1+i}
    $$

    فالقيمة الحالية:

    $$
    P = \frac{n\,A_1}{1+i} = \frac{[[n|n]] \times [[A1|g]]}{[[1+g|r]]} = [[P|2]]
    $$

- id: c02-ex-irregular
  kind: example
  title: |
    تدفقات غير منتظمة بالدالة NPV
  vars: {c0: -50000, c1: 12000, c2: 15000, c3: 15000, c4: 15000, c5: 20000, i: 0.10}
  random: {c0: [-80000, -30000, 1000], c1: [5000, 20000, 500], c2: [5000, 25000, 500], c5: [5000, 30000, 500], i: [0.05, 0.15, 0.01]}
  calc:
    - c3 = c2
    - c4 = c2
    - p1 = c1*PF(i, 1)
    - p234 = c2*PA(i, 3)*PF(i, 1)
    - p5 = c5*PF(i, 5)
    - P = c0 + p1 + p234 + p5
  diagram: {n: 5, i: "i = [[i|%]]", flows: [[0, c0], [1, c1], [2, c2], [3, c3], [4, c4], [5, c5]]}
  text: |
    مشروع يكلف [[-c0|g]] دينار، وإيراداته [[c1|g]] دينار في السنة 1، و[[c2|g]] دينار في كل من السنوات 2 و3 و4، و[[c5|g]] دينار في السنة 5. ما صافي القيمة الحالية بنسبة [[i|%]]؟
  solution: |
    نستطيع الحل بالمعاملات: السنوات 2 إلى 4 سلسلة متساوية، المعامل P/A يضع قيمتها في السنة 1:

    $$
    P = [[c0|g]] + [[c1|g]](P/F,[[i|%]],1) + [[c2|g]](P/A,[[i|%]],3)(P/F,[[i|%]],1) + [[c5|g]](P/F,[[i|%]],5)
    $$

    $$
    P = [[c0|g]] + [[p1|2]] + [[p234|2]] + [[p5|2]] = [[P|2]]
    $$

    الطريقة الأسهل في Excel: اكتب التدفقات في الخلايا من B1 إلى B6. الدالة NPV تبدأ من السنة 1، فتدفق السنة 0 يجمع خارجها:

    ```excel
    =B1 + NPV([[i|%]], B2:B6)
    ```

    وفي Python الدالة npv تبدأ من السنة 0:

    ```python
    import numpy_financial as npf
    flows = [ [[c0|r]], [[c1|r]], [[c2|r]], [[c3|r]], [[c4|r]], [[c5|r]] ]
    print(round(npf.npv([[i|r]], flows), 2))
    ```

    صافي القيمة الحالية [[P|2]] دينار.
