- id: c02-f-01
  kind: problem
  part: F
  vars: {A1: 30000, g: 0.05, n: 10, i: 0.09}
  random: {A1: [10000, 50000, 1000], g: [0.02, 0.08, 0.005], n: [5, 15, 1], i: [0.05, 0.14, 0.01]}
  calc:
    - r = ((1+g)/(1+i))**n
    - f = PGEO(g, i, n)
    - P = A1*f
  text: |
    راتب مهندس في السنة الأولى [[A1|g]] دينار، ويزيد [[g|%]] سنويا. ما القيمة الحالية لرواتب أول [[yrs(n)]] بنسبة [[i|%]]؟
  solution: |
    $$
    P = [[A1|g]] \times \frac{1 - [[r|f4]]}{[[i|r]] - [[g|r]]} = [[A1|g]] \times [[f|f4]] = [[P|2]]
    $$

- id: c02-f-02
  kind: problem
  part: F
  vars: {A1: 5000, g: 0.08, n: 6}
  random: {A1: [1000, 10000, 250], g: [0.03, 0.12, 0.01], n: [3, 10, 1]}
  calc:
    - P = A1*n/(1+g)
  text: |
    دفعة سنوية تبدأ بـ [[A1|g]] دينار وتزيد [[g|%]] سنويا لمدة [[yrs(n)]]. ما قيمتها الحالية إذا كانت الفائدة أيضا [[g|%]]؟
  solution: |
    $$
    P = \frac{n\,A_1}{1+i} = \frac{[[n|n]] \times [[A1|g]]}{[[1+g|r]]} = [[P|2]]
    $$

- id: c02-f-03
  kind: problem
  part: F
  vars: {A1: 2000, g: 0.06, n: 8}
  random: {A1: [500, 6000, 100], g: [0.02, 0.10, 0.005], n: [4, 12, 1]}
  calc:
    - L = A1*(1+g)**(n-1)
    - T = A1*((1+g)**n - 1)/g
  text: |
    دفعات تبدأ بـ [[A1|g]] دينار وتزيد [[g|%]] كل سنة لمدة [[yrs(n)]]. ما الدفعة الأخيرة؟ وما مجموعها بدون فائدة؟
  solution: |
    $$
    A_{[[n|n]]} = [[A1|g]]\,(1 + [[g|r]])^{[[n-1|n]]} = [[L|2]]
    $$

    مجموع متتالية هندسية:

    $$
    \sum = A_1\,\frac{(1+g)^n - 1}{g} = [[T|2]]
    $$

- id: c02-f-04
  kind: problem
  part: F
  vars: {A1: 12000, g: 0.04, n: 15, i: 0.08}
  random: {A1: [3000, 25000, 500], g: [0.02, 0.07, 0.005], n: [8, 20, 1], i: [0.05, 0.12, 0.01]}
  calc:
    - P = A1*PGEO(g, i, n)
    - A = P*AP(i, n)
  text: |
    تكلفة تشغيل محطة ضخ [[A1|g]] دينار في السنة الأولى، وترتفع [[g|%]] سنويا لمدة [[yrs(n)]]. ما القيمة الحالية، وما التكلفة السنوية المتساوية المكافئة بنسبة [[i|%]]؟
  solution: |
    $$
    P = [[A1|g]] \times [[PGEO(g, i, n)|f4]] = [[P|2]]
    $$

    $$
    A = [[P|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c02-f-05
  kind: problem
  part: F
  vars: {A1: 10000, g: 0.10, n: 5, i: 0.06}
  random: {A1: [3000, 20000, 500], g: [0.08, 0.15, 0.01], n: [3, 10, 1], i: [0.03, 0.07, 0.005]}
  calc:
    - P = A1*PGEO(g, i, n)
  text: |
    إيرادات متجر إلكتروني [[A1|g]] دينار في السنة الأولى، وتنمو [[g|%]] سنويا لمدة [[yrs(n)]]. ما قيمتها الحالية بنسبة [[i|%]]؟ لاحظ أن نسبة النمو أكبر من نسبة الفائدة.
  solution: |
    القانون نفسه يعمل عندما تكون g أكبر من i، لأن البسط والمقام يصبحان سالبين:

    $$
    P = [[A1|g]] \times \frac{1 - \left(\frac{[[1+g|r]]}{[[1+i|r]]}\right)^{[[n|n]]}}{[[i|r]] - [[g|r]]} = [[P|2]]
    $$

- id: c02-f-06
  kind: problem
  part: F
  vars: {A1: 4000, g: 0.05, n: 8, i: 0.10}
  random: {A1: [1000, 9000, 250], g: [0.02, 0.08, 0.005], n: [4, 12, 1], i: [0.06, 0.15, 0.01]}
  calc:
    - Pg = A1*PGEO(g, i, n)
    - Pc = A1*PA(i, n)
    - D = Pg - Pc
  text: |
    كم تزيد القيمة الحالية لتكلفة [[A1|g]] دينار سنويا لمدة [[yrs(n)]] إذا ارتفعت [[g|%]] كل سنة بدل أن تبقى ثابتة؟ الفائدة [[i|%]].
  solution: |
    $$
    P_{geo} = [[A1|g]] \times [[PGEO(g, i, n)|f4]] = [[Pg|2]]
    $$

    $$
    P_{const} = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[Pc|2]]
    $$

    الزيادة [[D|2]] دينار.

- id: c02-f-07
  kind: problem
  part: F
  vars: {A1: 4000, g: 0.06, n: 10, i: 0.10}
  random: {A1: [1000, 8000, 250], g: [0.02, 0.08, 0.005], n: [5, 12, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - P = A1*PGEO(g, i, n)
    - F = P*FP(i, n)
  text: |
    إيداعات تبدأ بـ [[A1|g]] دينار وتزيد [[g|%]] سنويا لمدة [[yrs(n)]]. كم يصبح الرصيد بعد الإيداع الأخير بفائدة [[i|%]]؟
  solution: |
    $$
    P = [[A1|g]] \times [[PGEO(g, i, n)|f4]] = [[P|2]]
    $$

    $$
    F = [[P|2]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

- id: c02-f-08
  kind: problem
  part: F
  vars: {P: 100000, g: 0.04, n: 10, i: 0.08}
  random: {P: [20000, 200000, 5000], g: [0.02, 0.07, 0.005], n: [5, 15, 1], i: [0.05, 0.12, 0.01]}
  calc:
    - A1 = P/PGEO(g, i, n)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] يسدد بدفعات تزيد [[g|%]] كل سنة لمدة [[yrs(n)]]، لأن دخل المقترض يزيد بنفس النسبة. ما الدفعة الأولى؟
  solution: |
    $$
    A_1 = \frac{[[P|g]]}{[[PGEO(g, i, n)|f4]]} = [[A1|2]]
    $$

    الدفعة الأخيرة:

    $$
    [[A1|2]]\,(1 + [[g|r]])^{[[n-1|n]]} = [[A1*(1+g)**(n-1)|2]]
    $$

- id: c02-f-09
  kind: problem
  part: F
  vars: {A1: 8000, g: 0.03, n: 6, i: 0.08}
  random: {A1: [2000, 15000, 500], g: [0.01, 0.06, 0.005], n: [3, 8, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - a1 = A1*PF(i, 1)
    - a2 = A1*(1+g)*PF(i, 2)
    - P = A1*PGEO(g, i, n)
  text: |
    احسب القيمة الحالية لسلسلة تبدأ بـ [[A1|g]] وتزيد [[g|%]] لمدة [[yrs(n)]] بنسبة [[i|%]]، بالقانون ثم بجدول Excel. ما مساهمة أول دفعتين؟
  solution: |
    $$
    P = [[A1|g]] \times [[PGEO(g, i, n)|f4]] = [[P|2]]
    $$

    أول دفعتين تساهمان بـ [[a1|2]] و[[a2|2]] دينار. في Excel اكتب في العمود A السنوات، وفي العمود B:

    ```excel
    =[[A1|r]]*(1+[[g|%]])^(A2-1)
    ```

    ثم:

    ```excel
    =NPV([[i|%]], B2:B[[n+1|n]])
    ```

- id: c02-f-10
  kind: problem
  part: F
  vars: {A1: 4000, A: 5000, n: 10, i: 0.08, k: 0}
  random: {A1: [2000, 6000, 250], k: [1.05, 1.35, 0.05], n: [5, 15, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - A = pick(k > 0, floor(A1*k/50)*50, A)
    - g = GROWTH(A1, A*PA(i, n), i, n)
  text: |
    عرض عمل براتب ثابت [[A|g]] دينار سنويا لمدة [[yrs(n)]]، وعرض آخر يبدأ بـ [[A1|g]] دينار ويزيد بنسبة ثابتة. ما نسبة الزيادة التي تجعل العرضين متساويين بفائدة [[i|%]]؟ استخدم Goal Seek في Excel.
  solution: |
    نبحث عن g التي تحقق المعادلة التالية:

    $$
    [[A1|g]] \times \frac{1 - \left(\frac{1+g}{[[1+i|r]]}\right)^{[[n|n]]}}{[[i|r]] - g} = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[A*PA(i, n)|2]]
    $$

    في Excel ضع قيمة تجريبية للنسبة في الخلية B1، واكتب في B2 القيمة الحالية للعرض الثاني:

    ```excel
    =[[A1|r]]*(1-((1+B1)/(1+[[i|%]]))^[[n|n]])/([[i|%]]-B1)
    ```

    ثم Goal Seek: اجعل B2 تساوي [[A*PA(i, n)|d2]] بتغيير B1.

    الجواب: نسبة الزيادة [[g|%2]] سنويا. إذا زاد الراتب بأكثر منها، فالعرض الثاني أفضل.
