- id: c02-i-01
  kind: case
  part: I
  vars: {P: 30000, B: 10000, i: 0.08, n: 5}
  calc:
    - A0 = P*AP(i, n)
    - A1 = (P - B*PF(i, n))*AP(i, n)
    - I0 = A0*n - P
    - I1 = A1*n + B - P
    - R3 = A1*PA(i, 2) + B*PF(i, 2)
    - R3n = A0*PA(i, 2)
    - Ab = B*AP(0.10, 3)
  text: |
    **حالة 2.1: قرض سيارة بدفعة أخيرة كبيرة**

    يريد مهندس شراء سيارة بقرض 30,000 دينار بفائدة 8% لمدة 5 سنوات. عرض عليه البنك خطتين:

    - الخطة العادية: أقساط سنوية متساوية.
    - خطة الدفعة الأخيرة الكبيرة (balloon): أقساط سنوية متساوية أصغر، ثم دفعة إضافية 10,000 دينار مع القسط الأخير.

    (أ) ما القسط في كل خطة؟ (ب) ما مجموع الفوائد في كل خطة؟ لماذا تختلف؟ (ج) ما رصيد القرض بعد القسط الثالث في كل خطة؟ (د) في نهاية السنة 5 لم يجد المهندس 10,000 دينار، فأعاد البنك تمويلها بقرض جديد بفائدة 10% لمدة 3 سنوات. ما القسط الجديد؟ (هـ) هل الخطة الثانية أرخص فعلا بنسبة 8%؟
  solution: |
    (أ) الخطة العادية:

    $$
    A = 30{,}000\,(A/P,\ 8\%,\ 5) = [[A0|2]]
    $$

    في الخطة الثانية القيمة الحالية للأقساط والدفعة الكبيرة تساوي القرض:

    $$
    30{,}000 = A\,(P/A,\ 8\%,\ 5) + 10{,}000\,(P/F,\ 8\%,\ 5)
    $$

    $$
    A = [[A1|2]]
    $$

    في Excel تأخذ الدالة PMT الدفعة الكبيرة في المدخل الرابع:

    ```excel
    =PMT(8%, 5, -30000, 10000)
    ```

    (ب) مجموع الفوائد [[I0|2]] دينار في الخطة العادية، و[[I1|2]] دينار في الخطة الثانية. الفوائد أكبر في الثانية لأن الرصيد يبقى أعلى طوال المدة، فالمقترض يستخدم مال البنك مدة أطول.

    (ج) الرصيد بعد القسط الثالث يساوي القيمة الحالية لما بقي:

    $$
    B_{normal} = [[A0|2]]\,(P/A,\ 8\%,\ 2) = [[R3n|2]]
    $$

    $$
    B_{balloon} = [[A1|2]]\,(P/A,\ 8\%,\ 2) + 10{,}000\,(P/F,\ 8\%,\ 2) = [[R3|2]]
    $$

    (د)

    $$
    A' = 10{,}000\,(A/P,\ 10\%,\ 3) = [[Ab|2]]
    $$

    (هـ) لا. بنسبة 8% الخطتان متكافئتان، لأن القيمة الحالية لكل منهما 30,000 دينار. الفوائد الأكبر في الخطة الثانية ثمن عادل لتأجيل الدفع. الخطر الحقيقي فيها هو الجزء (د): إعادة تمويل الدفعة الكبيرة بنسبة أعلى.

- id: c02-i-02
  kind: case
  part: I
  vars: {C: 95000, S1: 14000, p: 0.05, d: 0.007, m1: 1500, Gm: 100, n: 20, i: 0.09}
  calc:
    - g = (1+p)*(1-d) - 1
    - PS = S1*PGEO(g, i, n)
    - PM = m1*PA(i, n) + Gm*PG(i, n)
    - N = -C + PS - PM
    - Cmax = PS - PM
    - S20 = S1*(1+g)**(n-1)
  text: |
    **حالة 2.2: ألواح شمسية لمصنع في الخليل**

    يدرس مصنع تركيب ألواح شمسية بتكلفة 95,000 دينار. التوفير في فاتورة الكهرباء في السنة الأولى 14,000 دينار. سعر الكهرباء يرتفع 5% سنويا، وإنتاج الألواح يقل 0.7% سنويا بسبب التقادم. الصيانة 1500 دينار في السنة الأولى وتزيد 100 دينار كل سنة. عمر النظام 20 سنة، والحد الأدنى للعائد 9%.

    (أ) التوفير يتأثر بنسبتين: ارتفاع السعر وانخفاض الإنتاج. ما نسبة النمو الواحدة التي تجمعهما؟ (ب) ما القيمة الحالية للتوفير؟ (ج) ما القيمة الحالية للصيانة؟ (د) هل المشروع مقبول؟ (هـ) ما أعلى سعر يدفعه المصنع للنظام؟ (و) ما التوفير المتوقع في السنة العشرين؟
  solution: |
    (أ) التوفير في كل سنة يساوي سعر الكهرباء مضروبا في الإنتاج. كل منهما يتغير بنسبة، فالنسبة المجمعة:

    $$
    1 + g = (1 + 0.05)(1 - 0.007) \quad\Rightarrow\quad g = [[g|%2]]
    $$

    لاحظ أنها ليست 5% − 0.7% بالضبط، لأن النسبتين تضربان.

    (ب)

    $$
    P_S = 14{,}000 \times \frac{1 - \left(\frac{1 + g}{1.09}\right)^{20}}{0.09 - g} = [[PS|2]]
    $$

    (ج)

    $$
    P_M = 1500\,(P/A,\ 9\%,\ 20) + 100\,(P/G,\ 9\%,\ 20) = [[PM|2]]
    $$

    (د)

    $$
    P = -95{,}000 + [[PS|2]] - [[PM|2]] = [[N|2]]
    $$

    المشروع [[pick(N >= 0, 'مقبول', 'مرفوض')]].

    (هـ) أعلى سعر يجعل القيمة الحالية صفرا: [[Cmax|2]] دينار.

    (و)

    $$
    S_{20} = 14{,}000\,(1 + g)^{19} = [[S20|2]]
    $$

- id: c02-i-03
  kind: case
  part: I
  vars: {S1: 12000, s: 0.10, g: 0.03, nA: 25, nB: 20, i: 0.06}
  calc:
    - A1 = S1*s
    - F = A1*PGEO(g, i, nA)*FP(i, nA)
    - W = F*AP(i, nB)
    - Wb = F*AP(i, nB)/(1+i)
    - Fc = A1*FA(i, nA)
    - Wc = Fc*AP(i, nB)
  text: |
    **حالة 2.3: خطة تقاعد بمرحلتين**

    موظفة عمرها 30 سنة، راتبها السنوي 12,000 دينار ويزيد 3% سنويا. تدخر 10% من راتبها في نهاية كل سنة لمدة 25 سنة، بعائد 6%. بعد التقاعد تريد سحب مبلغ ثابت كل سنة لمدة 20 سنة.

    (أ) كم تدخر في السنة الأولى؟ (ب) كم يصبح رصيدها عند التقاعد؟ (ج) كم تسحب سنويا إذا كان السحب في نهاية كل سنة؟ (د) كم تسحب إذا كان في بداية كل سنة؟ (هـ) لو بقي الادخار ثابتا عند مبلغ السنة الأولى، كم ينقص السحب السنوي؟
  solution: |
    (أ) 10% من 12,000 دينار، أي [[A1|2]] دينار.

    (ب) الادخار سلسلة متدرجة نسبيا بنسبة 3%. نحسب قيمتها الحالية ثم ننقلها إلى السنة 25:

    $$
    F = 1200 \times \frac{1 - \left(\frac{1.03}{1.06}\right)^{25}}{0.06 - 0.03} \times (1.06)^{25} = [[F|2]]
    $$

    (ج) الرصيد عند التقاعد قيمة حالية لسلسلة السحب:

    $$
    W = [[F|2]]\,(A/P,\ 6\%,\ 20) = [[W|2]]
    $$

    (د) إذا كان السحب في بداية السنة، فالسحب الأول فوري، وكل سحب أبكر بسنة:

    $$
    W' = \frac{[[W|2]]}{1.06} = [[Wb|2]]
    $$

    (هـ) بادخار ثابت 1200 دينار:

    $$
    F' = 1200\,(F/A,\ 6\%,\ 25) = [[Fc|2]], \qquad W'' = [[Fc|2]]\,(A/P,\ 6\%,\ 20) = [[Wc|2]]
    $$

    السحب السنوي ينقص [[W-Wc|2]] دينار. زيادة الادخار مع الراتب، ولو بنسبة صغيرة، تفرق كثيرا على مدى 25 سنة.
