items:

- id: c02-a-01
  kind: concept
  part: A
  text: |
    في السلسلة المتساوية الأساسية، في أي سنة تقع القيمة الحالية P؟ وفي أي سنة تقع القيمة المستقبلية F؟
  solution: |
    القيمة الحالية في السنة 0، أي قبل الدفعة الأولى بسنة. القيمة المستقبلية في السنة n، مع الدفعة الأخيرة.

- id: c02-a-02
  kind: concept
  part: A
  text: |
    ما العلاقة بين المعاملين A/P وP/A؟ وما فائدتها عند استخدام الجداول؟
  solution: |
    المعاملان مقلوبان لبعضهما. لذلك يكفي جدول P/A: تقرأ القيمة ثم تقسم 1 عليها لتحصل على A/P.

- id: c02-a-03
  kind: concept
  part: A
  text: |
    لماذا تقل الفائدة في كل قسط من أقساط القرض كلما تقدمت السنوات، مع أن القسط ثابت؟
  solution: |
    الفائدة تحسب على الرصيد المتبقي في بداية السنة، والرصيد يقل كل سنة لأن جزءا من القسط يسدد من أصل القرض. فتقل الفائدة ويزيد سداد الأصل بنفس المقدار.

- id: c02-a-04
  kind: concept
  part: A
  text: |
    سلسلة دفعات تبدأ في نهاية السنة 5 وتنتهي في نهاية السنة 12. في أي سنة يضع المعامل P/A قيمتها؟ وفي أي سنة يضع المعامل F/A قيمتها؟
  solution: |
    المعامل P/A يضع القيمة في السنة 4، قبل الدفعة الأولى بسنة. المعامل F/A يضعها في السنة 12، مع الدفعة الأخيرة. عدد الدفعات 8.

- id: c02-a-05
  kind: concept
  part: A
  text: |
    ما الفرق بين سلسلة دفعات في نهاية السنة وسلسلة في بدايتها؟ أيهما قيمتها الحالية أكبر؟
  solution: |
    في سلسلة بداية السنة كل دفعة تقع قبل نظيرتها في سلسلة نهاية السنة بسنة. قيمتها الحالية أكبر، لأن كل دفعة أقرب إلى اليوم.

- id: c02-a-06
  kind: concept
  part: A
  text: |
    في السلسلة المتدرجة خطيا، كم تساوي الدفعة التي يغطيها المعامل P/G في السنة الأولى؟
  solution: |
    صفر. المعامل P/G يغطي الجزء المتدرج فقط، وهو صفر في السنة 1 ثم G في السنة 2 ثم 2G في السنة 3. الدفعة الأولى كلها يغطيها المعامل P/A.

- id: c02-a-07
  kind: concept
  part: A
  text: |
    متى تستخدم الدالة NPV بدل المعاملات؟
  solution: |
    عندما لا تتبع التدفقات نمطا متساويا أو متدرجا، أو عندما يكون الحل بالمعاملات طويلا. الدالة تعمل مع أي تدفقات، ما دامت كل قيمة في سنتها.

- id: c02-a-08
  kind: concept
  part: A
  text: |
    موظف يدخر مبلغا ثابتا كل سنة. لماذا يكون رصيده في النهاية أكبر من مجموع ما أودعه؟
  solution: |
    لأن كل إيداع يكسب فائدة من سنة إيداعه حتى النهاية، والفوائد نفسها تكسب فائدة. الإيداع الأول يكسب أكثر من غيره لأنه يبقى أطول مدة.

- id: c02-a-09
  kind: concept
  part: A
  text: |
    في السلسلة المتدرجة نسبيا، لماذا لا يوجد جدول معاملات في الملحق؟
  solution: |
    لأن المعامل يعتمد على ثلاثة متغيرات، نسبة الفائدة ونسبة النمو وعدد السنوات. جدول بثلاثة متغيرات يحتاج صفحات كثيرة، فنستخدم القانون أو Excel.

- id: c02-a-10
  kind: concept
  part: A
  text: |
    قرض بدفعات سنوية متساوية. المقترض لا يستطيع أن يدفع أكثر من فائدة السنة الأولى. ماذا يحدث للقرض؟
  solution: |
    لا يسدد أبدا. إذا كانت الدفعة تساوي الفائدة فقط، يبقى الرصيد كما هو. وإذا كانت أقل من الفائدة، يكبر الرصيد كل سنة.
