  title: |
    الدفعات المتكررة
  parts:
    - key: A
      title: "الجزء أ: أسئلة مفاهيم"
      intro: أجب بجملة أو جملتين، بدون حساب.
    - key: B
      title: "الجزء ب: الأقساط والقيمة الحالية لسلسلة دفعات"
      intro: هذه المسائل تستخدم المعاملين A/P وP/A.
    - key: C
      title: "الجزء ج: الادخار والقيمة المستقبلية لسلسلة دفعات"
      intro: هذه المسائل تستخدم المعاملين F/A وA/F.
    - key: D
      title: "الجزء د: السلاسل المؤجلة والمركبة"
      intro: ارسم مخطط التدفق النقدي، وحدد أين يضع كل معامل قيمته قبل أن تبدأ.
    - key: E
      title: "الجزء هـ: الدفعات المتدرجة خطيا"
    - key: F
      title: "الجزء و: الدفعات المتدرجة نسبيا"
    - key: G
      title: "الجزء ز: مسائل Excel وPython"
      intro: حل هذه المسائل بجدول في Excel أو ببرنامج Python، وليس باليد.
    - key: H
      title: "الجزء ح: اختيار من متعدد"
      intro: كل خيار خاطئ في هذا الجزء مبني على خطأ يقع فيه الطلاب فعلا.
    - key: I
      title: "الجزء ط: حالات مصغرة"
      intro: كل حالة تجمع أكثر من فكرة من الفصل، وبعضها يضيف فكرة جديدة.
