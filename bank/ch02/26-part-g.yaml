- id: c02-g-01
  kind: problem
  part: G
  vars: {P: 30000, i: 0.08, n: 5}
  random: {P: [10000, 60000, 1000], i: [0.04, 0.12, 0.005]}
  calc:
    - A = P*AP(i, n)
    - B1 = P*FP(i, 1) - A
    - B2 = B1*(1+i) - A
    - B3 = B2*(1+i) - A
    - B4 = B3*(1+i) - A
  text: |
    ابن جدول إطفاء في Excel لقرض [[P|g]] دينار بفائدة [[i|%]] لمدة 5 سنوات، بأعمدة السنة والرصيد في البداية والفائدة والقسط وسداد الأصل والرصيد في النهاية. ما الرصيد بعد كل سنة؟
  solution: |
    القسط في خلية ثابتة:

    ```excel
    =PMT([[i|%]], 5, -[[P|r]])
    ```

    في الصف الأول للفائدة اكتب الرصيد في البداية مضروبا في النسبة، ثم سداد الأصل يساوي القسط ناقص الفائدة، ثم الرصيد في النهاية يساوي الرصيد في البداية ناقص سداد الأصل. اسحب الصيغ لخمسة صفوف.

    | السنة | الرصيد في نهاية السنة |
    | --- | --- |
    | 1 | [[B1|2]] |
    | 2 | [[B2|2]] |
    | 3 | [[B3|2]] |
    | 4 | [[B4|2]] |
    | 5 | 0.00 |

    القسط [[A|2]] دينار.

- id: c02-g-02
  kind: problem
  part: G
  vars: {P: 30000, i: 0.08}
  random: {P: [10000, 60000, 1000], i: [0.04, 0.12, 0.005]}
  calc:
    - A = P*AP(i, 5)
    - I3 = (P*FP(i, 2) - A*FA(i, 2))*i
    - Q3 = A - I3
  text: |
    للقرض في المسألة السابقة، احسب فائدة السنة الثالثة وسداد الأصل فيها بالدالتين IPMT وPPMT، ثم بمكتبة numpy_financial.
  solution: |
    ```excel
    =IPMT([[i|%]], 3, 5, -[[P|r]])
    =PPMT([[i|%]], 3, 5, -[[P|r]])
    ```

    ```python
    import numpy_financial as npf
    print(round(npf.ipmt([[i|r]], 3, 5, -[[P|r]]), 2))
    print(round(npf.ppmt([[i|r]], 3, 5, -[[P|r]]), 2))
    ```

    فائدة السنة الثالثة [[I3|2]] دينار، وسداد الأصل [[Q3|2]] دينار.

- id: c02-g-03
  kind: problem
  part: G
  vars: {P: 50000}
  random: {P: [10000, 90000, 5000]}
  calc:
    - a = P*AP(0.06, 5)
    - b = P*AP(0.06, 10)
    - c = P*AP(0.10, 5)
    - d = P*AP(0.10, 10)
  text: |
    ابن جدول بيانات يبين قسط قرض [[P|g]] دينار عند النسبتين 6% و10% والمدتين 5 و10 سنوات، بصيغة واحدة تسحب في الاتجاهين.
  solution: |
    ضع النسبتين في A2 وA3، والمدتين في B1 وC1:

    ```excel
    =PMT($A2, B$1, -[[P|r]])
    ```

    | النسبة | 5 سنوات | 10 سنوات |
    | --- | --- | --- |
    | 6% | [[a|2]] | [[b|2]] |
    | 10% | [[c|2]] | [[d|2]] |

- id: c02-g-04
  kind: problem
  part: G
  vars: {A: 500, i: 0.07}
  random: {A: [100, 2000, 50], i: [0.03, 0.12, 0.005]}
  calc:
    - F = A*FA(i, 20)
  text: |
    اكتب برنامج Python يطبع رصيد حساب توفير سنة بسنة لإيداع [[A|g]] دينار في نهاية كل سنة لمدة 20 سنة بفائدة [[i|%]]. تحقق من الرصيد الأخير بالدالة fv.
  solution: |
    ```python
    import numpy_financial as npf
    A, i = [[A|r]], [[i|r]]
    balance = 0
    for year in range(1, 21):
        balance = balance * (1 + i) + A
        print(year, round(balance, 2))
    print(round(npf.fv(i, 20, -A, 0), 2))
    ```

    الرصيد بعد 20 سنة [[F|2]] دينار.

- id: c02-g-05
  kind: problem
  part: G
  vars: {A1: 1500, G: 300, n: 8, i: 0.10}
  random: {A1: [500, 4000, 100], G: [50, 600, 25], n: [5, 12, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - P = A1*PA(i, n) + G*PG(i, n)
  text: |
    اكتب دالة Python اسمها pw_gradient تأخذ A1 وG وi وn وتعيد القيمة الحالية لسلسلة متدرجة خطيا، مرة بالقانون ومرة بالجمع دفعة دفعة. اختبرها بالقيم [[A1|g]] و[[G|g]] و[[i|%]] و[[yrs(n)]].
  solution: |
    ```python
    def pw_gradient(A1, G, i, n):
        pa = ((1 + i) ** n - 1) / (i * (1 + i) ** n)
        pg = ((1 + i) ** n - i * n - 1) / (i ** 2 * (1 + i) ** n)
        return A1 * pa + G * pg

    def pw_by_sum(A1, G, i, n):
        return sum((A1 + G * (t - 1)) / (1 + i) ** t for t in range(1, n + 1))

    print(round(pw_gradient([[A1|r]], [[G|r]], [[i|r]], [[n|n]]), 2))
    print(round(pw_by_sum([[A1|r]], [[G|r]], [[i|r]], [[n|n]]), 2))
    ```

    الطريقتان تعطيان [[P|2]] دينار.

- id: c02-g-06
  kind: problem
  part: G
  vars: {P: 20000, A: 3000, i: 0.08}
  random: {P: [5000, 40000, 1000], A: [1500, 8000, 250], i: [0.04, 0.12, 0.005]}
  calc:
    - A = max(A, P*i*1.3)
    - n = -ln(1 - P*i/A)/ln(1+i)
  text: |
    اكتب برنامج Python يحاكي سداد قرض [[P|g]] دينار بفائدة [[i|%]] بدفعة [[A|g]] دينار سنويا، ويطبع عدد السنوات وقيمة الدفعة الأخيرة. قارن بالدالة nper.
  solution: |
    ```python
    import numpy_financial as npf
    P, A, i = [[P|r]], [[A|r]], [[i|r]]
    balance, year = P, 0
    while balance > 0:
        year += 1
        balance = balance * (1 + i)
        pay = min(A, balance)
        balance -= pay
    print(year, round(pay, 2))
    print(round(npf.nper(i, -A, P), 2))
    ```

    الدالة nper تعطي [[n|2]] سنة: [[yrs(ceil(n)-1)]] بدفعة كاملة ودفعة أخيرة أصغر.

- id: c02-g-07
  kind: problem
  part: G
  vars: {C: 40000, A: 9000, n: 6, r0: 0}
  random: {C: [10000, 80000, 1000], r0: [0.04, 0.20, 0.01], n: [4, 10, 1]}
  calc:
    - A = pick(r0 > 0, floor(C*AP(r0, n)/50)*50, A)
    - r = RATE(n, A, C)
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. احسب نسبة العائد بالدالة RATE، ثم بالدالة IRR على عمود التدفقات.
  solution: |
    ```excel
    =RATE([[n|n]], [[A|r]], -[[C|r]])
    ```

    أو اكتب التدفقات في عمود من B1 إلى B[[n+1|n]]، تبدأ بـ [[-C|r]] ثم [[A|r]] في كل سنة:

    ```excel
    =IRR(B1:B[[n+1|n]])
    ```

    الجواب [[r|%2]] في الحالتين.

- id: c02-g-08
  kind: problem
  part: G
  vars: {A1: 4000, g: 0.06, n: 10, i: 0.10}
  random: {A1: [1000, 9000, 250], g: [0.02, 0.08, 0.005], n: [5, 15, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - P = A1*PGEO(g, i, n)
  text: |
    احسب في Python القيمة الحالية لسلسلة تبدأ بـ [[A1|g]] وتزيد [[g|%]] لمدة [[yrs(n)]] بنسبة [[i|%]]، بالقانون ثم بقائمة دفعات والدالة npv.
  solution: |
    ```python
    import numpy_financial as npf
    A1, g, n, i = [[A1|r]], [[g|r]], [[n|n]], [[i|r]]
    formula = A1 * (1 - ((1 + g) / (1 + i)) ** n) / (i - g)
    flows = [0] + [A1 * (1 + g) ** (t - 1) for t in range(1, n + 1)]
    print(round(formula, 2), round(npf.npv(i, flows), 2))
    ```

    الجواب [[P|2]] دينار.

- id: c02-g-09
  kind: problem
  part: G
  vars: {P: 100000, i: 0.07}
  random: {P: [30000, 200000, 5000], i: [0.04, 0.10, 0.005]}
  calc:
    - a = P*AP(i, 10)*10 - P
    - b = P*AP(i, 15)*15 - P
    - c = P*AP(i, 20)*20 - P
    - d = P*AP(i, 25)*25 - P
  text: |
    ارسم في Python أو Excel مجموع الفوائد على قرض [[P|g]] دينار بفائدة [[i|%]] مقابل مدة القرض من 5 إلى 30 سنة. ما مجموع الفوائد عند 10 و15 و20 و25 سنة؟
  solution: |
    ```python
    import numpy_financial as npf
    import matplotlib.pyplot as plt
    P, i = [[P|r]], [[i|r]]
    years = range(5, 31)
    interest = [npf.pmt(i, n, -P) * n - P for n in years]
    plt.plot(years, interest)
    plt.show()
    ```

    | المدة | مجموع الفوائد |
    | --- | --- |
    | 10 | [[a|2]] |
    | 15 | [[b|2]] |
    | 20 | [[c|2]] |
    | 25 | [[d|2]] |

- id: c02-g-10
  kind: problem
  part: G
  vars: {L: 80000, i: 0.09, n: 8}
  random: {L: [20000, 150000, 5000], i: [0.05, 0.14, 0.005], n: [5, 12, 1]}
  calc:
    - A = L*AP(i, n)
    - H = A*0.5
    - Aext = (L - H*PA(i, 2))*AP(i, n)
  text: |
    قرض [[L|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]]. البنك يعرض أن يدفع المقترض نصف القسط العادي في أول سنتين، ثم قسطا ثابتا في السنوات من 3 إلى [[n|n]]. ابن الحل في Excel بالدالة Goal Seek، وتحقق بالقانون.
  solution: |
    القسط العادي [[A|2]] دينار، فالدفعة في أول سنتين [[H|2]] دينار. القسط الجديد X يحقق:

    $$
    [[L|g]] = [[H|2]]\,(P/A,\ [[i|%]],\ 2) + X\,(P/A,\ [[i|%]],\ [[n-2|n]])\,(P/F,\ [[i|%]],\ 2)
    $$

    $$
    X = [[(L - H*PA(i, 2))/(PA(i, n-2)*PF(i, 2))|2]]
    $$

    في Excel ضع X تجريبيا في B1، واكتب القيمة الحالية للخطة في B2، ثم Goal Seek: اجعل B2 تساوي [[L|r]] بتغيير B1.

    ```excel
    =PV([[i|%]], 2, -[[H|d2]]) + PV([[i|%]], 2, 0, -PV([[i|%]], [[n-2|n]], -B1))
    ```
