items:

- id: c02-d-01
  kind: problem
  part: D
  vars: {A: 5000, s: 10, m: 4, i: 0.06}
  random: {A: [1000, 9000, 250], s: [6, 14, 1], m: [3, 6, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - P1 = A*PA(i, m)
    - P0 = P1*PF(i, s - 1)
  diagram: {n: "s+m-1", i: "i = [[i|%]]", series: [[s, "s+m-1", "-A"]]}
  text: |
    يريد أب أن يدفع رسوم جامعة ابنه، [[A|g]] دينار سنويا لمدة [[yrs(m)]]، أول دفعة في نهاية السنة [[s|n]] من اليوم. كم يستثمر اليوم بعائد [[i|%]] ليغطي الرسوم؟
  solution: |
    المعامل P/A يضع القيمة في السنة [[s-1|n]]:

    $$
    P_{[[s-1|n]]} = [[A|g]]\,(P/A,\ [[i|%]],\ [[m|n]]) = [[P1|2]]
    $$

    $$
    P_0 = [[P1|2]]\,(P/F,\ [[i|%]],\ [[s-1|n]]) = [[P0|2]]
    $$

- id: c02-d-02
  kind: problem
  part: D
  vars: {A: 3000, s: 3, e: 8, i: 0.09}
  random: {A: [500, 8000, 250], s: [2, 5, 1], e: [6, 12, 1], i: [0.04, 0.14, 0.01]}
  calc:
    - m = e - s + 1
    - F = A*FA(i, m)
  text: |
    إيرادات مشروع [[A|g]] دينار سنويا من نهاية السنة [[s|n]] حتى نهاية السنة [[e|n]]. ما قيمتها في نهاية السنة [[e|n]] بنسبة [[i|%]]؟
  solution: |
    عدد الدفعات [[m|n]]. المعامل F/A يضع القيمة مع الدفعة الأخيرة، في السنة [[e|n]] مباشرة:

    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[m|n]]) = [[F|2]]
    $$

- id: c02-d-03
  kind: problem
  part: D
  vars: {A: 3000, s: 3, e: 8, i: 0.09}
  random: {A: [500, 8000, 250], s: [2, 5, 1], e: [6, 12, 1], i: [0.04, 0.14, 0.01]}
  calc:
    - m = e - s + 1
    - P = A*PA(i, m)*PF(i, s - 1)
    - F = A*FA(i, m)
    - Pc = F*PF(i, e)
  text: |
    احسب القيمة الحالية للسلسلة في المسألة السابقة بطريقتين: بالمعامل P/A ثم P/F، وبالمعامل F/A ثم P/F. تأكد أن الطريقتين تعطيان نفس الجواب.
  solution: |
    الطريقة الأولى:

    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[m|n]])\,(P/F,\ [[i|%]],\ [[s-1|n]]) = [[P|2]]
    $$

    الطريقة الثانية:

    $$
    P = [[A|g]]\,(F/A,\ [[i|%]],\ [[m|n]])\,(P/F,\ [[i|%]],\ [[e|n]]) = [[Pc|2]]
    $$

- id: c02-d-04
  kind: problem
  part: D
  vars: {C: 70000, A: 15000, n: 8, R: 10000, i: 0.12}
  random: {C: [30000, 120000, 5000], A: [5000, 30000, 1000], n: [4, 12, 1], R: [0, 25000, 1000], i: [0.06, 0.18, 0.01]}
  calc:
    - N = -C + A*PA(i, n) + R*PF(i, n)
    - dec = pick(N >= 0, 'مقبول', 'مرفوض')
  text: |
    مشروع يكلف [[C|g]] دينار، ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]، وقيمة بيع في النهاية [[R|g]] دينار. ما صافي القيمة الحالية بنسبة [[i|%]]؟
  solution: |
    $$
    P = -[[C|g]] + [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[R|g]]\,(P/F,\ [[i|%]],\ [[n|n]]) = [[N|2]]
    $$

    ```excel
    =-[[C|r]] + PV([[i|%]], [[n|n]], -[[A|r]], -[[R|r]])
    ```

    المشروع [[dec]].

- id: c02-d-05
  kind: problem
  part: D
  vars: {A: 2000, B: 5000, k: 4, n: 10, i: 0.08}
  random: {A: [500, 5000, 250], B: [1000, 9000, 250], k: [2, 6, 1], n: [8, 14, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - P = A*PA(i, k) + B*PA(i, n - k)*PF(i, k)
  text: |
    عقد صيانة يدفع [[A|g]] دينار سنويا في أول [[yrs(k)]]، ثم [[B|g]] دينار سنويا حتى نهاية السنة [[n|n]]. ما القيمة الحالية للعقد بنسبة [[i|%]]؟
  diagram: {n: n, i: "i = [[i|%]]", series: [[1, k, "-A"], ["k+1", n, "-B"]]}
  solution: |
    السلسلة الأولى من السنة 1 إلى [[k|n]]، والثانية من السنة [[k+1|n]] إلى [[n|n]]، وقيمتها بالمعامل P/A في السنة [[k|n]]:

    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[k|n]]) + [[B|g]]\,(P/A,\ [[i|%]],\ [[n-k|n]])\,(P/F,\ [[i|%]],\ [[k|n]]) = [[P|2]]
    $$

- id: c02-d-06
  kind: problem
  part: D
  vars: {A: 2000, B: 5000, k: 4, n: 10, i: 0.08}
  random: {A: [500, 5000, 250], B: [1000, 9000, 250], k: [2, 6, 1], n: [8, 14, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - P = B*PA(i, n) - (B - A)*PA(i, k)
  text: |
    حل المسألة السابقة بطريقة أخرى: اعتبر أن [[B|g]] دينار تدفع كل السنوات من 1 إلى [[n|n]]، ثم اطرح الفرق في السنوات الأولى.
  solution: |
    $$
    P = [[B|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - ([[B|g]] - [[A|g]])\,(P/A,\ [[i|%]],\ [[k|n]]) = [[P|2]]
    $$

    نفس الجواب. هذه الطريقة أقصر لأنها لا تحتاج نقلا إضافيا.

- id: c02-d-07
  kind: problem
  part: D
  vars: {P: 80000, g: 2, n: 6, i: 0.10}
  random: {P: [20000, 150000, 5000], g: [1, 3, 1], n: [4, 10, 1], i: [0.05, 0.14, 0.005]}
  calc:
    - B = P*FP(i, g)
    - A = B*AP(i, n)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] فيه فترة سماح [[yrs(g)]]، لا يدفع فيها شيء وتتراكم الفائدة. بعدها يسدد بأقساط متساوية لمدة [[yrs(n)]]. ما القسط؟
  diagram: {n: "g+n", i: "i = [[i|%]]", flows: [[0, P]], series: [["g+1", "g+n", "-P/n", "A"]]}
  solution: |
    الرصيد في نهاية فترة السماح:

    $$
    B = [[P|g]]\,(F/P,\ [[i|%]],\ [[g|n]]) = [[B|2]]
    $$

    الأقساط تبدأ بعدها بسنة، فالرصيد قيمة حالية للسلسلة:

    $$
    A = [[B|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c02-d-08
  kind: problem
  part: D
  vars: {A: 1500, n: 10, k: 4, i: 0.07}
  random: {A: [500, 5000, 100], n: [6, 15, 1], k: [2, 5, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - F = A*FA(i, n) - A*FA(i, k)*FP(i, n - 2*k)
    - m = n - k
  text: |
    يودع موظف [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]]، لكنه توقف عن الإيداع في السنوات من [[n-2*k+1|n]] إلى [[n-k|n]]. ما رصيده في نهاية السنة [[n|n]] بفائدة [[i|%]]؟
  solution: |
    نحسب الرصيد كأنه أودع كل السنوات، ثم نطرح الإيداعات التي لم تحدث. الإيداعات الناقصة سلسلة من [[yrs(k)]] تنتهي في السنة [[n-k|n]]:

    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) - [[A|g]]\,(F/A,\ [[i|%]],\ [[k|n]])\,(F/P,\ [[i|%]],\ [[k|n]])
    $$

    $$
    F = [[A*FA(i, n)|2]] - [[A*FA(i, k)*FP(i, k)|2]] = [[A*FA(i, n) - A*FA(i, k)*FP(i, k)|2]]
    $$

- id: c02-d-09
  kind: problem
  part: D
  vars: {P: 100000, i: 0.07, n: 10, X: 30000, t: 5}
  random: {P: [40000, 200000, 5000], i: [0.04, 0.10, 0.005], n: [8, 15, 1], X: [5000, 40000, 1000], t: [3, 6, 1]}
  calc:
    - A = (P - X*PF(i, t))*AP(i, n)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] يسدد بأقساط سنوية متساوية لمدة [[yrs(n)]]، إضافة إلى دفعة خاصة [[X|g]] دينار في نهاية السنة [[t|n]]. ما القسط السنوي؟
  solution: |
    القيمة الحالية للأقساط والدفعة الخاصة تساوي القرض:

    $$
    [[P|g]] = A\,(P/A,\ [[i|%]],\ [[n|n]]) + [[X|g]]\,(P/F,\ [[i|%]],\ [[t|n]])
    $$

    $$
    A = ([[P|g]] - [[X*PF(i, t)|2]])\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c02-d-10
  kind: problem
  part: D
  vars: {A: 6000, n: 5, i: 0.08}
  random: {A: [1000, 15000, 500], n: [3, 10, 1], i: [0.04, 0.12, 0.005]}
  calc:
    - Pb = A*PA(i, n)*(1+i)
    - Pe = A*PA(i, n)
  text: |
    رسوم برنامج تدريب [[A|g]] دينار سنويا لمدة [[yrs(n)]] تدفع في بداية كل سنة. ما قيمتها الحالية بنسبة [[i|%]]؟
  solution: |
    كل دفعة أبكر بسنة من السلسلة العادية، فنضرب القيمة الحالية العادية في واحد زائد نسبة الفائدة:

    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]])\,(1 + [[i|r]]) = [[Pb|2]]
    $$

    ```excel
    =PV([[i|%]], [[n|n]], -[[A|r]], 0, 1)
    ```

- id: c02-d-11
  kind: problem
  part: D
  vars: {P: 50000, A: 9000, n: 8, i: 0.10}
  random: {P: [20000, 90000, 1000], A: [3000, 20000, 500], n: [4, 12, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - D = P - A*PA(i, n)
  text: |
    سعر شاحنة [[P|g]] دينار. البائع يقبل دفعة أولى، ثم [[A|g]] دينار سنويا لمدة [[yrs(n)]] بفائدة [[i|%]]. ما الدفعة الأولى؟
  solution: |
    $$
    D = [[P|g]] - [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[D|2]]
    $$

    إذا ظهر الجواب سالبا، فالأقساط وحدها تكفي، والبائع يجب أن يخفضها.

- id: c02-d-12
  kind: problem
  part: D
  vars: {A1: 4000, A2: 6000, n: 6, i: 0.09}
  random: {A1: [1000, 9000, 250], A2: [1000, 9000, 250], n: [3, 10, 1], i: [0.04, 0.14, 0.01]}
  calc:
    - P1 = A1*PA(i, n)
    - P2 = A2*PA(i, n)*PF(i, n)
  text: |
    خطتا دفع لنفس الخدمة: [[A1|g]] دينار سنويا في السنوات من 1 إلى [[n|n]]، أو [[A2|g]] دينار سنويا في السنوات من [[n+1|n]] إلى [[2*n|n]]. أيهما أقل تكلفة بنسبة [[i|%]]؟
  solution: |
    $$
    P_1 = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P1|2]]
    $$

    $$
    P_2 = [[A2|g]]\,(P/A,\ [[i|%]],\ [[n|n]])\,(P/F,\ [[i|%]],\ [[n|n]]) = [[P2|2]]
    $$

    الخطة الأقل قيمة حالية هي الأقل تكلفة: [[pick(P1 < P2, 'الخطة الأولى', 'الخطة الثانية')]].

- id: c02-d-13
  kind: problem
  part: D
  vars: {F: 40000, A: 2500, n: 10, i: 0.06}
  random: {F: [20000, 80000, 1000], A: [500, 5000, 250], n: [5, 15, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - P = (F - A*FA(i, n))*PF(i, n)
  text: |
    يريد شخص أن يجمع [[F|g]] دينار بعد [[yrs(n)]]. سيودع [[A|g]] دينار سنويا، ويريد أن يودع مبلغا إضافيا اليوم ليصل إلى الهدف. كم المبلغ الإضافي بفائدة [[i|%]]؟
  solution: |
    الإيداعات السنوية تجمع [[A*FA(i, n)|2]] دينار. الباقي يغطيه المبلغ الحالي:

    $$
    P = ([[F|g]] - [[A*FA(i, n)|2]])\,(P/F,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    ```excel
    =PV([[i|%]], [[n|n]], -[[A|r]], [[F|r]])
    ```

- id: c02-d-14
  kind: problem
  part: D
  vars: {A: 10000, n: 4, k: 3, i: 0.08}
  random: {A: [2000, 20000, 500], n: [3, 8, 1], k: [2, 6, 1], i: [0.04, 0.12, 0.005]}
  calc:
    - B = A*FA(i, n)
    - W = B*FP(i, k)*AP(i, n)
  text: |
    يدخر شخص [[A|g]] دينار سنويا لمدة [[yrs(n)]]، ثم يترك الرصيد [[yrs(k)]]، ثم يسحبه بدفعات سنوية متساوية لمدة [[yrs(n)]]. كم يسحب سنويا بفائدة [[i|%]]؟
  solution: |
    الرصيد بعد الإيداع الأخير:

    $$
    B = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[B|2]]
    $$

    الرصيد عند بداية السحب، أي قبل السحب الأول بسنة:

    $$
    B' = [[B|2]]\,(F/P,\ [[i|%]],\ [[k|n]]) = [[B*FP(i, k)|2]]
    $$

    $$
    W = [[B*FP(i, k)|2]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[W|2]]
    $$

- id: c02-d-15
  kind: problem
  part: D
  vars: {A: 800, n: 12, i: 0.05}
  random: {A: [200, 3000, 50], n: [6, 20, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - P = A*PA(i, n)
    - F = A*FA(i, n)
    - v = P*FP(i, 5)
  text: |
    سلسلة [[A|g]] دينار سنويا من السنة 1 إلى السنة [[n|n]] بفائدة [[i|%]]. ما قيمتها المكافئة في السنة 0؟ في السنة [[n|n]]؟ في السنة 5؟
  solution: |
    $$
    P_0 = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    $$
    F_{[[n|n]]} = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

    $$
    V_5 = [[P|2]]\,(F/P,\ [[i|%]],\ 5) = [[v|2]]
    $$

    القيم الثلاث متكافئة بنسبة [[i|%]].

- id: c02-d-16
  kind: problem
  part: D
  vars: {P: 25000, A: 4000, i: 0.07}
  random: {P: [10000, 60000, 1000], A: [2000, 10000, 250], i: [0.03, 0.10, 0.005]}
  calc:
    - A = max(A, P*i*1.3)
    - n = -ln(1 - P*i/A)/ln(1+i)
    - k = ceil(n)
    - Bk = (P*FP(i, k-1) - A*FA(i, k-1))*(1+i)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]]، يسدد بدفعة [[A|g]] دينار سنويا حتى ينتهي. كم دفعة كاملة؟ وما قيمة الدفعة الأخيرة؟
  solution: |
    $$
    n = \frac{-\ln\left(1 - \frac{P\,i}{A}\right)}{\ln(1+i)} = [[n|2]]
    $$

    [[yrs(k-1)]] بدفعة كاملة. الرصيد بعد الدفعة رقم [[k-1|n]] ينمو سنة واحدة، والدفعة الأخيرة تساويه:

    $$
    X = \left[ [[P|g]]\,(F/P,\ [[i|%]],\ [[k-1|n]]) - [[A|g]]\,(F/A,\ [[i|%]],\ [[k-1|n]])\right](1 + [[i|r]]) = [[Bk|2]]
    $$

- id: c02-d-17
  kind: problem
  part: D
  vars: {A: 12000, n: 5, s: 2, i: 0.10}
  random: {A: [3000, 25000, 500], n: [3, 8, 1], s: [1, 4, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - P = A*PA(i, n)*PF(i, s)
    - W = P*FP(i, s)
  text: |
    يتوقع مصنع تكاليف إضافية [[A|g]] دينار سنويا لمدة [[yrs(n)]] تبدأ في نهاية السنة [[s+1|n]]. يريد أن يجمع اليوم مبلغا في حساب بفائدة [[i|%]] يغطيها. كم المبلغ؟
  solution: |
    السلسلة تبدأ في السنة [[s+1|n]]، فالمعامل P/A يضع قيمتها في السنة [[s|n]]:

    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]])\,(P/F,\ [[i|%]],\ [[s|n]]) = [[P|2]]
    $$

- id: c02-d-18
  kind: problem
  part: D
  vars: {C: 300000, A: 45000, n: 15, R: 0, i: 0.10}
  random: {C: [100000, 500000, 10000], A: [15000, 80000, 1000], n: [8, 20, 1], i: [0.06, 0.14, 0.01]}
  calc:
    - AW = A - C*AP(i, n)
    - dec = pick(AW >= 0, 'مقبول', 'مرفوض')
  text: |
    محطة طاقة شمسية لمصنع تكلف [[C|g]] دينار، وتوفر [[A|g]] دينار سنويا لمدة [[yrs(n)]]. حول التكلفة إلى مبلغ سنوي مكافئ بنسبة [[i|%]]، وقارنه بالتوفير.
  solution: |
    $$
    [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[C*AP(i, n)|2]]
    $$

    صافي القيمة السنوية [[AW|2]] دينار، فالمشروع [[dec]]. هذه الطريقة، القيمة السنوية، موضوع الفصل الثالث.
