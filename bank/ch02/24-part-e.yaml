items:

- id: c02-e-01
  kind: problem
  part: E
  vars: {A1: 2000, G: 250, n: 10, i: 0.08}
  random: {A1: [500, 5000, 100], G: [50, 800, 25], n: [5, 15, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - P = A1*PA(i, n) + G*PG(i, n)
    - A = A1 + G*AG(i, n)
  text: |
    تكلفة تشغيل شاحنة [[A1|g]] دينار في السنة الأولى، وتزيد [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. نسبة الفائدة [[i|%]]. أوجد القيمة الحالية والتكلفة السنوية المكافئة.
  solution: |
    $$
    P = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    $$
    A = [[A1|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c02-e-02
  kind: problem
  part: E
  vars: {A1: 20000, G: 1000, n: 6, i: 0.10}
  random: {A1: [8000, 30000, 1000], G: [200, 2000, 100], n: [4, 10, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - P = A1*PA(i, n) - G*PG(i, n)
  text: |
    إيراد منتج [[A1|g]] دينار في السنة الأولى، ويقل [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. ما القيمة الحالية للإيرادات بنسبة [[i|%]]؟
  solution: |
    $$
    P = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c02-e-03
  kind: problem
  part: E
  vars: {G: 500, n: 5, i: 0.10}
  random: {G: [100, 2000, 50], n: [3, 6, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - P = G*PG(i, n)
    - Pd = G*(PF(i, 2) + 2*PF(i, 3) + 3*PF(i, 4) + 4*PF(i, 5))
  text: |
    سلسلة متدرجة فقط: صفر في السنة 1، و[[G|g]] في السنة 2، وتزيد [[G|g]] كل سنة حتى السنة 5. احسب قيمتها الحالية بالمعامل P/G، ثم بنقل كل دفعة وحدها. الفائدة [[i|%]].
  solution: |
    $$
    P = [[G|g]]\,(P/G,\ [[i|%]],\ 5) = [[G*PG(i, 5)|2]]
    $$

    دفعة دفعة:

    $$
    P = [[G|g]](P/F,[[i|%]],2) + [[2*G|g]](P/F,[[i|%]],3) + [[3*G|g]](P/F,[[i|%]],4) + [[4*G|g]](P/F,[[i|%]],5) = [[Pd|2]]
    $$

    الجوابان متساويان.

- id: c02-e-04
  kind: problem
  part: E
  vars: {A1: 1000, G: 200, n: 8}
  random: {A1: [500, 4000, 100], G: [50, 500, 25], n: [5, 12, 1]}
  calc:
    - L = A1 + (n-1)*G
    - T = n*(A1 + L)/2
  text: |
    سلسلة تبدأ بـ [[A1|g]] دينار وتزيد [[G|g]] كل سنة لمدة [[yrs(n)]]. ما الدفعة في السنة الأخيرة؟ وما مجموع الدفعات بدون فائدة؟
  solution: |
    $$
    A_{[[n|n]]} = [[A1|g]] + ([[n|n]] - 1) \times [[G|g]] = [[L|g]]
    $$

    مجموع الدفعات يساوي عددها ضرب متوسط الأولى والأخيرة:

    $$
    \sum = \frac{[[n|n]] \times ([[A1|g]] + [[L|g]])}{2} = [[T|2]]
    $$

- id: c02-e-05
  kind: problem
  part: E
  vars: {A1: 3000, G: 400, n: 7, i: 0.09}
  random: {A1: [1000, 8000, 250], G: [100, 1000, 50], n: [4, 10, 1], i: [0.04, 0.14, 0.01]}
  calc:
    - P = A1*PA(i, n) + G*PG(i, n)
    - F = P*FP(i, n)
  text: |
    إيداعات سنوية تبدأ بـ [[A1|g]] دينار وتزيد [[G|g]] كل سنة لمدة [[yrs(n)]]. كم يصبح الرصيد بعد الإيداع الأخير بفائدة [[i|%]]؟
  solution: |
    $$
    P = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    $$
    F = [[P|2]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

- id: c02-e-06
  kind: problem
  part: E
  vars: {A1: 5000, G: 500, n: 6, i: 0.08, M: 8000}
  random: {A1: [2000, 9000, 250], G: [100, 1200, 50], n: [4, 10, 1], i: [0.04, 0.12, 0.01], M: [3000, 15000, 250]}
  calc:
    - A = A1 + G*AG(i, n)
    - dec = pick(A < M, 'العقد الثابت أغلى', 'العقد الثابت أرخص')
  text: |
    خياران لصيانة مبنى: عقد بقيمة ثابتة [[M|g]] دينار سنويا، أو دفع التكلفة الفعلية التي تبدأ بـ [[A1|g]] دينار وتزيد [[G|g]] كل سنة. المدة [[yrs(n)]] والفائدة [[i|%]]. أي الخيارين أرخص؟
  solution: |
    نحول التكلفة الفعلية إلى مبلغ سنوي مكافئ:

    $$
    A = [[A1|g]] + [[G|g]]\,(A/G,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    [[dec]] من التكلفة الفعلية المكافئة.

- id: c02-e-07
  kind: problem
  part: E
  vars: {P: 30000, A1: 4000, n: 6, i: 0.10}
  random: {P: [10000, 60000, 1000], A1: [1000, 8000, 250], n: [4, 10, 1], i: [0.05, 0.14, 0.01]}
  calc:
    - G = (P - A1*PA(i, n))/PG(i, n)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] يسدد بدفعات تبدأ بـ [[A1|g]] دينار وتزيد بمقدار ثابت كل سنة لمدة [[yrs(n)]]. ما مقدار الزيادة السنوية؟
  solution: |
    $$
    [[P|g]] = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + G\,(P/G,\ [[i|%]],\ [[n|n]])
    $$

    $$
    G = \frac{[[P|g]] - [[A1*PA(i, n)|2]]}{[[PG(i, n)|f4]]} = [[G|2]]
    $$

    إذا ظهرت الزيادة سالبة، فالدفعة الأولى أكبر من اللازم، والدفعات يجب أن تقل.

- id: c02-e-08
  kind: problem
  part: E
  vars: {P: 40000, G: 600, n: 8, i: 0.09}
  random: {P: [10000, 80000, 1000], G: [100, 1500, 50], n: [4, 12, 1], i: [0.05, 0.14, 0.01]}
  calc:
    - A1 = (P - G*PG(i, n))/PA(i, n)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] يسدد بدفعات تزيد [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. ما الدفعة الأولى؟
  solution: |
    $$
    A_1 = \frac{[[P|g]] - [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]])}{(P/A,\ [[i|%]],\ [[n|n]])} = [[A1|2]]
    $$

- id: c02-e-09
  kind: problem
  part: E
  vars: {A1: 1200, G: 150, s: 3, n: 5, i: 0.07}
  random: {A1: [500, 4000, 100], G: [50, 500, 25], s: [2, 5, 1], n: [3, 8, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - Ps = A1*PA(i, n) + G*PG(i, n)
    - P0 = Ps*PF(i, s - 1)
  text: |
    تكاليف إصلاح تبدأ في نهاية السنة [[s|n]] بمبلغ [[A1|g]] دينار وتزيد [[G|g]] كل سنة لمدة [[yrs(n)]]. ما قيمتها الحالية بنسبة [[i|%]]؟
  solution: |
    المعاملان يضعان القيمة في السنة [[s-1|n]]:

    $$
    P_{[[s-1|n]]} = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[Ps|2]]
    $$

    $$
    P_0 = [[Ps|2]]\,(P/F,\ [[i|%]],\ [[s-1|n]]) = [[P0|2]]
    $$

- id: c02-e-10
  kind: problem
  part: E
  vars: {A1: 8000, G: 800, n: 5, i: 0.10}
  random: {A1: [3000, 15000, 500], G: [200, 1500, 100], n: [3, 8, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - Pu = A1*PA(i, n) + G*PG(i, n)
    - Pd = A1*PA(i, n) - G*PG(i, n)
  text: |
    قارن القيمة الحالية لسلسلة تبدأ بـ [[A1|g]] دينار وتزيد [[G|g]] كل سنة، بسلسلة تبدأ بنفس المبلغ وتقل [[G|g]] كل سنة. المدة [[yrs(n)]] والفائدة [[i|%]].
  solution: |
    $$
    P_{up} = [[A1|g]]\,(P/A) + [[G|g]]\,(P/G) = [[Pu|2]]
    $$

    $$
    P_{down} = [[A1|g]]\,(P/A) - [[G|g]]\,(P/G) = [[Pd|2]]
    $$

    الفرق بينهما ضعف القيمة الحالية للجزء المتدرج، [[Pu-Pd|2]] دينار.

- id: c02-e-11
  kind: problem
  part: E
  vars: {i: 0.10, n: 10}
  random: {i: [0.04, 0.15, 0.01], n: [5, 20, 1]}
  calc:
    - a = PG(i, n)
    - b = AG(i, n)
    - c = a/PA(i, n)
  text: |
    احسب المعاملين P/G وA/G عند [[i|%]] و[[yrs(n)]]، وتحقق أن A/G يساوي P/G مقسوما على P/A.
  solution: |
    $$
    (P/G,\ [[i|%]],\ [[n|n]]) = [[a|f4]], \qquad (A/G,\ [[i|%]],\ [[n|n]]) = [[b|f4]]
    $$

    $$
    \frac{(P/G)}{(P/A)} = \frac{[[a|f4]]}{[[PA(i, n)|f4]]} = [[c|f4]]
    $$

- id: c02-e-12
  kind: problem
  part: E
  vars: {A1: 600, G: 100, n: 6, i: 0.06}
  random: {A1: [200, 2000, 50], G: [25, 300, 25], n: [4, 10, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - P = A1*PA(i, n) + G*PG(i, n)
    - F = P*FP(i, n)
    - A = A1 + G*AG(i, n)
  text: |
    طالب يدخر [[A1|g]] دينار في السنة الأولى، ويزيد ادخاره [[G|g]] دينار كل سنة لمدة [[yrs(n)]]. احسب القيمة الحالية والمستقبلية والسنوية المكافئة بنسبة [[i|%]].
  solution: |
    $$
    P = [[P|2]], \qquad F = P\,(F/P,\ [[i|%]],\ [[n|n]]) = [[F|2]], \qquad A = [[A|2]]
    $$

    تحقق: القيمة السنوية مضروبة في المعامل F/A يجب أن تعطي القيمة المستقبلية:

    $$
    [[A|2]] \times [[FA(i, n)|f4]] = [[A*FA(i, n)|2]]
    $$

- id: c02-e-13
  kind: problem
  part: E
  vars: {C: 50000, A1: 15000, G: 1500, n: 8, i: 0.12}
  random: {C: [20000, 90000, 1000], A1: [5000, 25000, 500], G: [200, 3000, 100], n: [4, 10, 1], i: [0.06, 0.16, 0.01]}
  calc:
    - P = -C + A1*PA(i, n) - G*PG(i, n)
    - dec = pick(P >= 0, 'مقبولة', 'مرفوضة')
  text: |
    آلة تكلف [[C|g]] دينار. توفيرها [[A1|g]] دينار في السنة الأولى، ويقل [[G|g]] كل سنة بسبب تقادمها، لمدة [[yrs(n)]]. هل الآلة مقبولة بحد أدنى [[i|%]]؟
  solution: |
    $$
    P = -[[C|g]] + [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) - [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    الآلة [[dec]].

- id: c02-e-14
  kind: problem
  part: E
  vars: {A1: 1000, G: 200, n: 6, i: 0.08}
  random: {A1: [300, 3000, 100], G: [50, 500, 25], n: [4, 8, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - P = A1*PA(i, n) + G*PG(i, n)
  text: |
    ابن جدولا في Excel للسلسلة التي تبدأ بـ [[A1|g]] وتزيد [[G|g]] لمدة [[yrs(n)]]، واحسب قيمتها الحالية بالدالة NPV بنسبة [[i|%]]. قارن بالمعاملات.
  solution: |
    اكتب [[A1|r]] في الخلية B2، والصيغة التالية في B3 ثم اسحبها:

    ```excel
    =B2+[[G|r]]
    ```

    ```excel
    =NPV([[i|%]], B2:B[[n+1|n]])
    ```

    والجواب بالمعاملات:

    $$
    P = [[A1|g]]\,(P/A) + [[G|g]]\,(P/G) = [[P|2]]
    $$

- id: c02-e-15
  kind: problem
  part: E
  vars: {A: 5000, A1: 3000, n: 8, i: 0.10}
  random: {A: [2000, 10000, 250], A1: [500, 4000, 250], n: [4, 12, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - A1 = min(A1, A*0.9)
    - G = (A - A1)/AG(i, n)
  text: |
    يريد صاحب مشروع أن يبدأ رواتب موظف بـ [[A1|g]] دينار في السنة الأولى، ويزيدها مبلغا ثابتا كل سنة لمدة [[yrs(n)]]، بحيث تكافئ راتبا ثابتا [[A|g]] دينار بنسبة [[i|%]]. ما الزيادة السنوية؟
  solution: |
    $$
    [[A|g]] = [[A1|g]] + G\,(A/G,\ [[i|%]],\ [[n|n]]) \quad\Rightarrow\quad G = \frac{[[A|g]] - [[A1|g]]}{[[AG(i, n)|f4]]} = [[G|2]]
    $$
