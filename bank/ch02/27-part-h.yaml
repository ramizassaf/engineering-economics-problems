items:

- id: c02-h-01
  kind: mcq
  part: H
  vars: {P: 20000, i: 0.08, n: 5}
  random: {P: [5000, 50000, 1000], i: [0.04, 0.12, 0.01], n: [3, 10, 1]}
  calc:
    - A = P*AP(i, n)
    - w1 = P/n
    - w2 = P*(1+i)/n
    - w3 = P*AF(i, n)
  text: |
    ما القسط السنوي لقرض [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]]؟
  options: ["[[w1|2]] دينار", "[[w3|2]] دينار", "[[A|2]] دينار", "[[w2|2]] دينار"]
  correct: 2
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    الخيار (أ) يتجاهل الفائدة. الخيار (ب) استخدم المعامل A/F بدل A/P. الخيار (د) أضاف فائدة سنة واحدة فقط.

- id: c02-h-02
  kind: mcq
  part: H
  vars: {A: 1000, i: 0.10, n: 6}
  random: {A: [200, 5000, 100], i: [0.05, 0.15, 0.01], n: [3, 10, 1]}
  calc:
    - P = A*PA(i, n)
    - w1 = A*n
    - w2 = A*FA(i, n)
    - w3 = A*PA(i, n)*(1+i)
  text: |
    ما القيمة الحالية لدفعة [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]] بفائدة [[i|%]]؟
  options: ["[[w1|2]] دينار", "[[P|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار"]
  correct: 1
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    الخيار (أ) يتجاهل الفائدة. الخيار (ج) قيمة مستقبلية. الخيار (د) يفترض دفعات في بداية السنة.

- id: c02-h-03
  kind: mcq
  part: H
  text: |
    سلسلة دفعات من نهاية السنة 4 إلى نهاية السنة 9. المعامل P/A يعطي قيمتها في السنة:
  options: ["0", "3", "4", "9"]
  correct: 1
  solution: |
    المعامل P/A يضع القيمة قبل الدفعة الأولى بسنة. الدفعة الأولى في السنة 4، فالقيمة في السنة 3.

- id: c02-h-04
  kind: mcq
  part: H
  vars: {A: 2000, s: 4, e: 9, i: 0.08}
  random: {A: [500, 6000, 100], s: [3, 6, 1], e: [8, 12, 1], i: [0.04, 0.12, 0.01]}
  calc:
    - m = e - s + 1
    - P = A*PA(i, m)*PF(i, s - 1)
    - w1 = A*PA(i, m)*PF(i, s)
    - w2 = A*PA(i, e)
    - w3 = A*PA(i, m)
  text: |
    ما القيمة الحالية لدفعة [[A|g]] دينار سنويا من نهاية السنة [[s|n]] إلى نهاية السنة [[e|n]] بفائدة [[i|%]]؟
  options: ["[[w1|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار", "[[P|2]] دينار"]
  correct: 3
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[m|n]])\,(P/F,\ [[i|%]],\ [[s-1|n]]) = [[P|2]]
    $$

    الخيار (أ) نقل القيمة [[yrs(s)]] بدل [[yrs(s-1)]]. الخيار (ب) حسب السلسلة من السنة 1. الخيار (ج) نسي النقل إلى السنة 0.

- id: c02-h-05
  kind: mcq
  part: H
  vars: {F: 20000, i: 0.06, n: 8}
  random: {F: [5000, 50000, 1000], i: [0.03, 0.10, 0.005], n: [4, 12, 1]}
  calc:
    - A = F*AF(i, n)
    - w1 = F*AP(i, n)
    - w2 = F/n
    - w3 = F*PF(i, n)/n
  text: |
    كم يودع شخص سنويا ليجمع [[F|g]] دينار بعد [[yrs(n)]] بفائدة [[i|%]]؟
  options: ["[[w1|2]] دينار", "[[A|2]] دينار", "[[w2|2]] دينار", "[[w3|2]] دينار"]
  correct: 1
  solution: |
    $$
    A = [[F|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    الخيار (أ) استخدم المعامل A/P، فعامل المبلغ كأنه في السنة 0.

- id: c02-h-06
  kind: mcq
  part: H
  text: |
    أي الصيغ التالية تعطي الإيداع السنوي اللازم لجمع 50,000 دينار بعد 10 سنوات بفائدة 6%؟

    ```excel
    1:  =PMT(6%, 10, -50000)
    2:  =PMT(6%, 10, 0, -50000)
    3:  =FV(6%, 10, -50000)
    4:  =PV(6%, 10, 0, -50000)
    ```
  options: ["الصيغة 1", "الصيغة 2", "الصيغة 3", "الصيغة 4"]
  correct: 1
  solution: |
    المبلغ المستقبلي يوضع في المدخل الرابع للدالة PMT. الصيغة 1 تعامله كقرض اليوم، فتعطي قسط قرض. الصيغتان 3 و4 لا تحسبان دفعة سنوية.

- id: c02-h-07
  kind: mcq
  part: H
  vars: {A1: 1000, G: 200, n: 5, i: 0.10}
  random: {A1: [500, 3000, 100], G: [50, 500, 25], n: [4, 8, 1], i: [0.05, 0.15, 0.01]}
  calc:
    - P = A1*PA(i, n) + G*PG(i, n)
    - w1 = (A1 + G)*PA(i, n) + G*PG(i, n)
    - w2 = A1*PA(i, n) + G*PG(i, n - 1)
    - w3 = G*PG(i, n)
  text: |
    تكاليف تبدأ بـ [[A1|g]] دينار وتزيد [[G|g]] كل سنة لمدة [[yrs(n)]]. ما قيمتها الحالية بنسبة [[i|%]]؟
  options: ["[[w1|2]] دينار", "[[w3|2]] دينار", "[[P|2]] دينار", "[[w2|2]] دينار"]
  correct: 2
  solution: |
    $$
    P = [[A1|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) + [[G|g]]\,(P/G,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    الخيار (أ) جعل الجزء الثابت يبدأ من دفعة السنة الثانية. الخيار (ب) نسي الجزء الثابت. الخيار (د) نقص سنة من عدد السنوات في المعامل P/G.

- id: c02-h-08
  kind: mcq
  part: H
  text: |
    سلسلة تبدأ بـ 5000 دينار وتزيد 5% سنويا، والفائدة 5%. أي العبارات صحيحة؟
  options: ["القانون العام يعطي الجواب مباشرة", "القيمة الحالية تساوي n مضروبة في 5000 مقسومة على 1.05", "القيمة الحالية تساوي n مضروبة في 5000", "لا يمكن حساب القيمة الحالية"]
  correct: 1
  solution: |
    عندما تتساوى نسبة النمو ونسبة الفائدة، يصبح المقام في القانون العام صفرا. كل دفعة تكافئ في السنة 0 نفس المبلغ، وهو الدفعة الأولى مقسومة على 1.05.

- id: c02-h-09
  kind: mcq
  part: H
  vars: {P: 30000, i: 0.09, n: 6}
  random: {P: [10000, 60000, 1000], i: [0.05, 0.14, 0.01], n: [4, 10, 1]}
  calc:
    - A = P*AP(i, n)
    - I1 = P*i
    - w1 = A
    - w2 = P/n
    - w3 = A - P/n
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]] بأقساط متساوية. كم فائدة السنة الأولى؟
  options: ["[[I1|2]] دينار", "[[w3|2]] دينار", "[[w1|2]] دينار", "[[w2|2]] دينار"]
  correct: 0
  solution: |
    فائدة السنة الأولى تحسب على كامل مبلغ القرض:

    $$
    I_1 = [[P|g]] \times [[i|r]] = [[I1|2]]
    $$

    الخيار (ب) يفترض أن سداد الأصل متساو كل سنة، وهذا غير صحيح في الأقساط المتساوية.

- id: c02-h-10
  kind: mcq
  part: H
  text: |
    ما الفرق بين المعاملين A/P وA/F عند نفس النسبة ونفس عدد السنوات؟
  options: ["يساوي 1", "يساوي نسبة الفائدة", "يساوي عدد السنوات", "لا توجد علاقة ثابتة"]
  correct: 1
  solution: |
    المعامل A/P يساوي المعامل A/F زائد نسبة الفائدة، دائما.

- id: c02-h-11
  kind: mcq
  part: H
  text: |
    في Excel كتب طالب الصيغة التالية لحساب القيمة الحالية لتدفقات في السنوات من 0 إلى 5 مكتوبة في الخلايا من B1 إلى B6. ما الخطأ؟

    ```excel
    =NPV(10%, B1:B6)
    ```
  options: ["لا يوجد خطأ", "الدالة تعامل تدفق السنة 0 كأنه في السنة 1، فتخصم كل التدفقات سنة زائدة", "يجب كتابة النسبة 0.1 بدل 10%", "الدالة NPV لا تقبل قيما سالبة"]
  correct: 1
  solution: |
    الدالة NPV في Excel تفترض أن أول قيمة في النطاق تقع في السنة 1. الصيغة الصحيحة:

    ```excel
    =B1 + NPV(10%, B2:B6)
    ```

- id: c02-h-12
  kind: mcq
  part: H
  vars: {A: 3000, i: 0.07, n: 10}
  random: {A: [500, 8000, 100], i: [0.03, 0.12, 0.005], n: [5, 20, 1]}
  calc:
    - Fb = A*FA(i, n)*(1+i)
    - Fe = A*FA(i, n)
    - w1 = A*FA(i, n + 1)
    - w2 = A*n*(1+i)
  text: |
    يودع شخص [[A|g]] دينار في بداية كل سنة لمدة [[yrs(n)]] بفائدة [[i|%]]. ما رصيده في نهاية السنة [[n|n]]؟
  options: ["[[Fe|2]] دينار", "[[Fb|2]] دينار", "[[w1|2]] دينار", "[[w2|2]] دينار"]
  correct: 1
  solution: |
    كل إيداع يبقى سنة إضافية مقارنة بالإيداع في نهاية السنة:

    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]])\,(1 + [[i|r]]) = [[Fb|2]]
    $$

    الخيار (أ) يفترض الإيداع في نهاية السنة. الخيار (ج) أضاف إيداعا زائدا في السنة [[n|n]].
