items:

- id: c02-c-01
  kind: problem
  part: C
  vars: {A: 300, i: 0.06, n: 15}
  random: {A: [100, 2000, 50], i: [0.03, 0.10, 0.005], n: [5, 25, 1]}
  calc:
    - f = FA(i, n)
    - F = A*f
  text: |
    يدخر طالب [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]] في حساب يعطي [[i|%]] سنويا. كم يصبح في الحساب بعد الإيداع الأخير؟
  solution: |
    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[A|g]] \times [[f|f4]] = [[F|2]]
    $$

    ```excel
    =FV([[i|%]], [[n|n]], -[[A|r]])
    ```

- id: c02-c-02
  kind: problem
  part: C
  vars: {F: 60000, i: 0.07, n: 8}
  random: {F: [10000, 120000, 5000], i: [0.03, 0.12, 0.005], n: [3, 15, 1]}
  calc:
    - f = AF(i, n)
    - A = F*f
  text: |
    تحتاج شركة [[F|g]] دينار بعد [[yrs(n)]] لاستبدال آلة. كم تودع سنويا في حساب يعطي [[i|%]]؟
  solution: |
    $$
    A = [[F|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[F|g]] \times [[f|f4]] = [[A|2]]
    $$

    ```excel
    =PMT([[i|%]], [[n|n]], 0, -[[F|r]])
    ```

- id: c02-c-03
  kind: problem
  part: C
  vars: {A: 5000, i: 0.05, n: 10}
  random: {A: [1000, 12000, 500], i: [0.03, 0.10, 0.005], n: [5, 20, 1]}
  calc:
    - F = A*FA(i, n)
    - T = A*n
    - I = F - T
    - r = I/F
  text: |
    تودع نقابة [[A|g]] دينار سنويا في صندوق طوارئ يعطي [[i|%]] لمدة [[yrs(n)]]. كم يصبح الصندوق؟ وكم في المئة منه فوائد؟
  solution: |
    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

    مجموع الإيداعات [[T|2]] دينار، والفوائد [[I|2]] دينار، أي [[r|%2]] من الرصيد.

- id: c02-c-04
  kind: problem
  part: C
  vars: {A: 2000, i: 0.08}
  random: {A: [500, 5000, 100], i: [0.04, 0.12, 0.01]}
  calc:
    - F10 = A*FA(i, 10)
    - F20 = A*FA(i, 20)
    - F30 = A*FA(i, 30)
  text: |
    كم يجمع شخص يدخر [[A|g]] دينار سنويا بعائد [[i|%]] خلال 10 و20 و30 سنة؟ لماذا لا يتضاعف الرصيد بمضاعفة المدة فقط؟
  solution: |
    | السنوات | الرصيد |
    | --- | --- |
    | 10 | [[F10|2]] |
    | 20 | [[F20|2]] |
    | 30 | [[F30|2]] |

    الرصيد بعد 20 سنة [[F20/F10|2]] ضعف رصيد 10 سنوات، لأن الإيداعات الأولى تكسب فوائد مدة أطول. المدة أهم من حجم الإيداع.

- id: c02-c-05
  kind: problem
  part: C
  vars: {F: 30000, n: 6, i: 0.06}
  random: {F: [5000, 60000, 1000], n: [3, 12, 1], i: [0.03, 0.10, 0.005]}
  calc:
    - A = F*AF(i, n)
    - A0 = F/n
    - S = A0 - A
  text: |
    تريد عائلة أن تجمع [[F|g]] دينار لترميم بيتها بعد [[yrs(n)]]. كم تودع سنويا بفائدة [[i|%]]؟ وكم توفر مقارنة بالادخار بدون فائدة؟
  solution: |
    $$
    A = [[F|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    بدون فائدة تحتاج [[A0|2]] دينار سنويا. الفائدة توفر [[S|2]] دينار سنويا.

- id: c02-c-06
  kind: problem
  part: C
  vars: {A: 1200, F: 20000, i: 0.07}
  random: {A: [500, 5000, 100], F: [5000, 60000, 1000], i: [0.03, 0.12, 0.005]}
  calc:
    - F = max(F, A*3)
    - n = ln(F*i/A + 1)/ln(1+i)
    - k = ceil(n)
  text: |
    كم سنة يحتاج شخص يدخر [[A|g]] دينار سنويا ليجمع [[F|g]] دينار بعائد [[i|%]]؟
  solution: |
    نحل معادلة القيمة المستقبلية لإيجاد n:

    $$
    [[F|g]] = [[A|g]]\,\frac{(1+i)^n - 1}{i} \quad\Rightarrow\quad n = \frac{\ln\left(\frac{F\,i}{A} + 1\right)}{\ln(1+i)} = [[n|2]]
    $$

    ```excel
    =NPER([[i|%]], -[[A|r]], 0, [[F|r]])
    ```

    يصل إلى الهدف في نهاية السنة [[k|n]].

- id: c02-c-07
  kind: problem
  part: C
  vars: {A: 4000, i: 0.09, n: 12}
  random: {A: [1000, 9000, 250], i: [0.04, 0.14, 0.01], n: [5, 20, 1]}
  calc:
    - a = FA(i, n)
    - b = PA(i, n)*FP(i, n)
  text: |
    تحقق بالأرقام أن المعامل F/A يساوي حاصل ضرب المعاملين P/A وF/P، عند [[i|%]] و[[yrs(n)]]. ثم احسب القيمة المستقبلية لدفعة [[A|g]] دينار.
  solution: |
    $$
    (F/A,\ [[i|%]],\ [[n|n]]) = [[a|f4]]
    $$

    $$
    (P/A) \times (F/P) = [[PA(i, n)|f4]] \times [[FP(i, n)|f4]] = [[b|f4]]
    $$

    $$
    F = [[A|g]] \times [[a|f4]] = [[A*a|2]]
    $$

- id: c02-c-08
  kind: problem
  part: C
  vars: {F: 1000000, i: 0.06, n: 30}
  random: {F: [300000, 1500000, 50000], i: [0.03, 0.10, 0.005], n: [20, 40, 1]}
  calc:
    - A = F*AF(i, n)
  text: |
    يريد شاب أن يجمع [[F|g]] دينار قبل تقاعده بعد [[yrs(n)]]. كم يدخر سنويا بعائد [[i|%]]؟
  solution: |
    $$
    A = [[F|g]]\,(A/F,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c02-c-09
  kind: problem
  part: C
  vars: {A: 2500, n1: 10, n2: 20, i: 0.07}
  random: {A: [500, 6000, 100], n1: [5, 12, 1], i: [0.04, 0.10, 0.005]}
  calc:
    - n2 = 2*n1
    - Fa = A*FA(i, n1)*FP(i, n1)
    - Fb = A*FA(i, n1)
  text: |
    أخوان يدخر كل منهما [[A|g]] دينار سنويا بعائد [[i|%]]. الأول يدخر في أول [[yrs(n1)]] ثم يتوقف ويترك رصيده، والثاني يبدأ بعد [[yrs(n1)]] ويدخر [[yrs(n1)]]. من رصيده أكبر في نهاية السنة [[n2|n]]؟
  solution: |
    الأول:

    $$
    F_1 = [[A|g]]\,(F/A,\ [[i|%]],\ [[n1|n]])\,(F/P,\ [[i|%]],\ [[n1|n]]) = [[Fa|2]]
    $$

    الثاني:

    $$
    F_2 = [[A|g]]\,(F/A,\ [[i|%]],\ [[n1|n]]) = [[Fb|2]]
    $$

    الاثنان أودعا نفس المبلغ، لكن رصيد الأول أكبر بـ [[Fa-Fb|2]] دينار لأنه بدأ مبكرا.

- id: c02-c-10
  kind: problem
  part: C
  vars: {F: 15000, A: 2000, n: 6}
  random: {F: [5000, 40000, 1000], A: [500, 6000, 250], n: [3, 10, 1]}
  calc:
    - A = max(A, F/n*0.6)
    - A = min(A, F/n*0.97)
    - r = RATEF(n, A, F)
  text: |
    يريد شخص أن يجمع [[F|g]] دينار بإيداع [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما نسبة العائد التي يحتاجها؟ اكتب صيغة Excel.
  solution: |
    ```excel
    =RATE([[n|n]], -[[A|r]], 0, [[F|r]])
    ```

    الجواب [[r|%2]] سنويا. بدون فائدة يجمع [[A*n|2]] دينار فقط، فالعائد يعوض الفرق [[F-A*n|2]] دينار.

- id: c02-c-11
  kind: problem
  part: C
  vars: {A: 750, i: 0.05, n: 8, P: 3000}
  random: {A: [200, 2000, 50], i: [0.03, 0.09, 0.005], n: [4, 12, 1], P: [1000, 10000, 500]}
  calc:
    - F = P*FP(i, n) + A*FA(i, n)
  text: |
    في حساب توفير [[P|g]] دينار اليوم. صاحبه سيودع [[A|g]] دينار في نهاية كل سنة لمدة [[yrs(n)]]. كم يصبح الرصيد بفائدة [[i|%]]؟
  solution: |
    $$
    F = [[P|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) + [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

    في Excel تأخذ الدالة FV المبلغين معا:

    ```excel
    =FV([[i|%]], [[n|n]], -[[A|r]], -[[P|r]])
    ```

- id: c02-c-12
  kind: problem
  part: C
  vars: {F: 50000, P: 10000, i: 0.06, n: 10}
  random: {F: [20000, 90000, 1000], P: [1000, 15000, 500], i: [0.03, 0.10, 0.005], n: [5, 15, 1]}
  calc:
    - R = F - P*FP(i, n)
    - A = R*AF(i, n)
  text: |
    لدى صندوق [[P|g]] دينار، والهدف [[F|g]] دينار بعد [[yrs(n)]]. كم يودع سنويا بفائدة [[i|%]]؟
  solution: |
    المبلغ الحالي يصبح وحده [[P*FP(i, n)|2]] دينار، والباقي تغطيه الإيداعات:

    $$
    A = ([[F|g]] - [[P*FP(i, n)|2]])\,(A/F,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    ```excel
    =PMT([[i|%]], [[n|n]], [[P|r]], -[[F|r]])
    ```

    إذا ظهر الجواب سالبا، فالمبلغ الحالي يكفي وحده.

- id: c02-c-13
  kind: problem
  part: C
  vars: {A: 1000, i: 0.10, n: 5}
  random: {A: [200, 5000, 100], i: [0.05, 0.15, 0.01], n: [3, 6, 1]}
  calc:
    - F = A*FA(i, n)
    - v1 = A*FP(i, n-1)
  text: |
    احسب القيمة المستقبلية لإيداع [[A|g]] دينار سنويا لمدة [[yrs(n)]] بنسبة [[i|%]]، مرة بالمعامل F/A ومرة بنقل كل إيداع وحده. كم يساهم الإيداع الأول؟
  solution: |
    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

    الإيداع الأول يبقى [[yrs(n-1)]] في الحساب:

    $$
    [[A|g]]\,(1 + [[i|r]])^{[[n-1|n]]} = [[v1|2]]
    $$

    والإيداع الأخير يبقى كما هو، [[A|g]] دينار، لأنه يودع في نفس سنة الحساب.

- id: c02-c-14
  kind: problem
  part: C
  vars: {A: 3000, i: 0.07, n: 10}
  random: {A: [500, 8000, 250], i: [0.03, 0.12, 0.005], n: [5, 20, 1]}
  calc:
    - Fe = A*FA(i, n)
    - Fb = A*FA(i, n)*(1+i)
  text: |
    قارن رصيد من يودع [[A|g]] دينار في بداية كل سنة لمدة [[yrs(n)]] برصيد من يودع في نهايتها، بفائدة [[i|%]]، في نهاية السنة [[n|n]].
  solution: |
    إيداع نهاية السنة:

    $$
    F = [[A|g]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[Fe|2]]
    $$

    إيداع بداية السنة: كل إيداع يبقى سنة إضافية، فنضرب في واحد زائد نسبة الفائدة:

    $$
    F = [[Fe|2]] \times (1 + [[i|r]]) = [[Fb|2]]
    $$

    ```excel
    =FV([[i|%]], [[n|n]], -[[A|r]], 0, 1)
    ```

- id: c02-c-15
  kind: problem
  part: C
  vars: {F: 25000, i1: 0.04, i2: 0.08, n: 10}
  random: {F: [5000, 60000, 1000], i1: [0.02, 0.05, 0.005], i2: [0.06, 0.12, 0.005], n: [5, 20, 1]}
  calc:
    - A1 = F*AF(i1, n)
    - A2 = F*AF(i2, n)
  text: |
    يريد شخص أن يجمع [[F|g]] دينار بعد [[yrs(n)]]. كم يودع سنويا بعائد [[i1|%]]؟ وكم بعائد [[i2|%]]؟
  solution: |
    $$
    A_1 = [[F|g]]\,(A/F,\ [[i1|%]],\ [[n|n]]) = [[A1|2]]
    $$

    $$
    A_2 = [[F|g]]\,(A/F,\ [[i2|%]],\ [[n|n]]) = [[A2|2]]
    $$

    العائد الأعلى يخفض الإيداع السنوي بـ [[A1-A2|2]] دينار.
