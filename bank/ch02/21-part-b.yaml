- id: c02-b-01
  kind: problem
  part: B
  vars: {P: 45000, i: 0.09, n: 5}
  random: {P: [10000, 90000, 1000], i: [0.04, 0.14, 0.005], n: [3, 10, 1]}
  calc:
    - f = AP(i, n)
    - A = P*f
  text: |
    اقترض مهندس [[P|g]] دينار لشراء معدات، بفائدة [[i|%]] سنويا لمدة [[yrs(n)]]. ما القسط السنوي؟
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[P|g]] \times [[f|f4]] = [[A|2]]
    $$

    ```excel
    =PMT([[i|%]], [[n|n]], -[[P|r]])
    ```

- id: c02-b-02
  kind: problem
  part: B
  vars: {P: 60000, D: 15000, i: 0.10, n: 4}
  random: {P: [20000, 90000, 1000], D: [2000, 20000, 1000], i: [0.05, 0.14, 0.005], n: [2, 8, 1]}
  calc:
    - L = P - D
    - A = L*AP(i, n)
  text: |
    سعر سيارة [[P|g]] دينار. دفع المشتري [[D|g]] دينار نقدا، وقسط الباقي على [[yrs(n)]] بفائدة [[i|%]]. ما القسط السنوي؟
  solution: |
    المبلغ المقسط [[L|g]] دينار:

    $$
    A = [[L|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

- id: c02-b-03
  kind: problem
  part: B
  vars: {A: 8000, i: 0.12, n: 6}
  random: {A: [2000, 15000, 500], i: [0.06, 0.18, 0.01], n: [3, 12, 1]}
  calc:
    - P = A*PA(i, n)
  text: |
    آلة توفر على مصنع [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما أعلى سعر يدفعه المصنع اليوم إذا كان الحد الأدنى للعائد [[i|%]]؟
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

- id: c02-b-04
  kind: problem
  part: B
  vars: {P: 45000, i: 0.09, n: 5}
  random: {P: [10000, 90000, 1000], i: [0.04, 0.14, 0.005], n: [3, 8, 1]}
  calc:
    - A = P*AP(i, n)
    - I1 = P*i
    - Q1 = A - I1
    - B1 = P - Q1
    - I2 = B1*i
    - Q2 = A - I2
  text: |
    في المسألة الأولى من هذا الجزء، احسب الفائدة وسداد الأصل في السنتين الأولى والثانية لقرض [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]].
  solution: |
    القسط [[A|2]] دينار.

    | السنة | الفائدة | سداد الأصل | الرصيد في نهاية السنة |
    | --- | --- | --- | --- |
    | 1 | [[I1|2]] | [[Q1|2]] | [[B1|2]] |
    | 2 | [[I2|2]] | [[Q2|2]] | [[B1-Q2|2]] |

    ```excel
    =IPMT([[i|%]], 2, [[n|n]], -[[P|r]])
    ```

- id: c02-b-05
  kind: problem
  part: B
  vars: {A: 1500, i: 0.08, n: 4}
  random: {A: [500, 4000, 100], i: [0.04, 0.12, 0.005], n: [2, 8, 1]}
  calc:
    - P = A*PA(i, n)
    - T = A*n
  text: |
    يعرض محل جهازا بأقساط [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما السعر النقدي العادل إذا كانت الفائدة [[i|%]]؟ وكم يدفع المشتري زيادة إذا اختار الأقساط؟
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    مجموع الأقساط [[T|2]] دينار، فالزيادة [[T-P|2]] دينار.

- id: c02-b-06
  kind: problem
  part: B
  vars: {P: 200000, i: 0.07, n: 15}
  random: {P: [50000, 300000, 10000], i: [0.04, 0.10, 0.005], n: [10, 25, 1]}
  calc:
    - A = P*AP(i, n)
    - T = A*n
    - I = T - P
  text: |
    قرض لشراء مستودع [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]]. ما القسط السنوي؟ وما مجموع الفوائد؟
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    مجموع الأقساط [[T|2]] دينار، منها [[I|2]] دينار فوائد.

- id: c02-b-07
  kind: problem
  part: B
  vars: {P: 50000, i: 0.08, a: 5, b: 10}
  random: {P: [10000, 90000, 5000], i: [0.04, 0.12, 0.01], a: [3, 6, 1], b: [8, 15, 1]}
  calc:
    - A1 = P*AP(i, a)
    - A2 = P*AP(i, b)
    - I1 = A1*a - P
    - I2 = A2*b - P
  text: |
    قارن قرضا بمبلغ [[P|g]] دينار بفائدة [[i|%]] يسدد على [[yrs(a)]] وقرضا بنفس المبلغ يسدد على [[yrs(b)]]. ما القسط ومجموع الفوائد في كل حالة؟
  solution: |
    | المدة | القسط السنوي | مجموع الفوائد |
    | --- | --- | --- |
    | [[a|n]] | [[A1|2]] | [[I1|2]] |
    | [[b|n]] | [[A2|2]] | [[I2|2]] |

    المدة الأطول تخفض القسط وترفع مجموع الفوائد.

- id: c02-b-08
  kind: problem
  part: B
  vars: {A: 12000, i: 0.10, n: 8}
  random: {A: [3000, 25000, 500], i: [0.05, 0.15, 0.01], n: [4, 12, 1]}
  calc:
    - P = A*PA(i, n)
  text: |
    تستطيع بلدية أن تخصص [[A|g]] دينار سنويا لمدة [[yrs(n)]] لسداد قرض لمشروع تعبيد. ما أكبر قرض تستطيع أخذه بفائدة [[i|%]]؟
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    ```excel
    =PV([[i|%]], [[n|n]], -[[A|r]])
    ```

- id: c02-b-09
  kind: problem
  part: B
  vars: {P: 80000, i: 0.09, n: 10}
  random: {P: [20000, 150000, 5000], i: [0.05, 0.14, 0.01], n: [5, 15, 1]}
  calc:
    - a = AP(i, n)
    - b = AF(i, n)
  text: |
    احسب المعاملين A/P وA/F عند [[i|%]] و[[yrs(n)]]، وتحقق من العلاقة بينهما.
  solution: |
    $$
    (A/P,\ [[i|%]],\ [[n|n]]) = [[a|f4]], \qquad (A/F,\ [[i|%]],\ [[n|n]]) = [[b|f4]]
    $$

    الفرق بينهما يساوي نسبة الفائدة:

    $$
    [[a|f4]] - [[b|f4]] = [[a-b|f4]]
    $$

- id: c02-b-10
  kind: problem
  part: B
  vars: {A: 3500, i: 0.06, n: 20}
  random: {A: [1000, 8000, 250], i: [0.03, 0.10, 0.005], n: [10, 30, 1]}
  calc:
    - P = A*PA(i, n)
  text: |
    ربح شخص جائزة تدفع [[A|g]] دينار سنويا لمدة [[yrs(n)]]، أو مبلغا واحدا اليوم. ما أقل مبلغ واحد يقبله إذا كان يستطيع استثمار المال بعائد [[i|%]]؟
  solution: |
    $$
    P = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P|2]]
    $$

    يقبل أي مبلغ لا يقل عن [[P|2]] دينار.

- id: c02-b-11
  kind: problem
  part: B
  vars: {P: 120000, i: 0.065, n: 12}
  random: {P: [40000, 200000, 5000], i: [0.04, 0.10, 0.005], n: [8, 20, 1]}
  calc:
    - A = P*AP(i, n)
    - I1 = P*i
    - Q1 = A - I1
    - r = Q1/A
  text: |
    قرض سكن [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]]. ما القسط السنوي؟ وكم في المئة من القسط الأول يذهب إلى سداد الأصل؟
  solution: |
    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    فائدة السنة الأولى [[I1|2]] دينار، وسداد الأصل [[Q1|2]] دينار، أي [[r|%2]] من القسط.

- id: c02-b-12
  kind: problem
  part: B
  vars: {A: 6000, i: 0.11, n: 7, C: 26000}
  random: {A: [2000, 12000, 500], i: [0.06, 0.16, 0.01], n: [4, 10, 1], C: [10000, 60000, 1000]}
  calc:
    - P = A*PA(i, n)
    - N = P - C
    - dec = pick(N >= 0, 'يستحق', 'لا يستحق')
  text: |
    نظام تبريد يكلف [[C|g]] دينار، ويوفر [[A|g]] دينار سنويا لمدة [[yrs(n)]]. هل يستحق الاستثمار بحد أدنى [[i|%]]؟
  solution: |
    $$
    P = -[[C|g]] + [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[N|2]]
    $$

    الاستثمار [[dec]].

- id: c02-b-13
  kind: problem
  part: B
  vars: {P: 30000, i: 0.08, n: 5, k: 2}
  random: {P: [10000, 60000, 1000], i: [0.04, 0.12, 0.005], n: [4, 10, 1], k: [1, 3, 1]}
  calc:
    - A = P*AP(i, n)
    - B = A*PA(i, n - k)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]]. بعد دفع القسط رقم [[k|n]]، أراد المقترض سداد الباقي دفعة واحدة. كم يدفع؟
  solution: |
    القسط [[A|2]] دينار. الرصيد المتبقي يساوي القيمة الحالية للأقساط الباقية:

    $$
    B = [[A|2]]\,(P/A,\ [[i|%]],\ [[n-k|n]]) = [[B|2]]
    $$

    ```excel
    =PV([[i|%]], [[n-k|n]], -PMT([[i|%]], [[n|n]], -[[P|r]]))
    ```

- id: c02-b-14
  kind: problem
  part: B
  vars: {P: 15000, A: 4000, n: 5, r0: 0}
  random: {P: [5000, 30000, 1000], r0: [0.04, 0.18, 0.01], n: [3, 8, 1]}
  calc:
    - A = pick(r0 > 0, floor(P*AP(r0, n)/50)*50, A)
    - f = P/A
  text: |
    معرض يعرض سيارة بمبلغ [[P|g]] دينار نقدا، أو [[A|g]] دينار سنويا لمدة [[yrs(n)]]. ما المعامل P/A الذي يجعل العرضين متساويين؟ وما الدالة التي تعطي نسبة الفائدة؟
  solution: |
    $$
    (P/A,\ i,\ [[n|n]]) = \frac{[[P|g]]}{[[A|g]]} = [[f|f4]]
    $$

    ابحث في جدول P/A في عمود [[n|n]] عن نسبتين حول هذه القيمة. في Excel:

    ```excel
    =RATE([[n|n]], -[[A|r]], [[P|r]])
    ```

- id: c02-b-15
  kind: problem
  part: B
  vars: {A: 2500, i: 0.07}
  random: {A: [500, 6000, 100], i: [0.04, 0.12, 0.01]}
  calc:
    - p5 = A*PA(i, 5)
    - p10 = A*PA(i, 10)
    - p20 = A*PA(i, 20)
    - p40 = A*PA(i, 40)
    - pinf = A/i
  text: |
    احسب القيمة الحالية لدفعة [[A|g]] دينار سنويا بنسبة [[i|%]] لمدة 5 و10 و20 و40 سنة. ماذا تلاحظ؟ إلى أي رقم تقترب القيم؟
  solution: |
    | السنوات | القيمة الحالية |
    | --- | --- |
    | 5 | [[p5|2]] |
    | 10 | [[p10|2]] |
    | 20 | [[p20|2]] |
    | 40 | [[p40|2]] |

    القيمة تزيد ببطء أكثر كلما طالت المدة، لأن الدفعات البعيدة قيمتها الحالية صغيرة. القيم تقترب من:

    $$
    \frac{A}{i} = \frac{[[A|g]]}{[[i|r]]} = [[pinf|2]]
    $$

    هذه قيمة سلسلة لا تنتهي، وهي موضوع الفصل الثالث.

- id: c02-b-16
  kind: problem
  part: B
  vars: {P: 25000, i: 0.10, n: 4}
  random: {P: [8000, 50000, 1000], i: [0.05, 0.15, 0.01], n: [3, 8, 1]}
  calc:
    - A = P*AP(i, n)
    - At = P/r4(PA(i, n))
  text: |
    احسب قسط قرض [[P|g]] دينار بفائدة [[i|%]] لمدة [[yrs(n)]] من جدول P/A في الملحق، ثم بالقانون. ما الفرق؟
  solution: |
    من الجدول المعامل P/A يساوي [[r4(PA(i, n))|f4]]، فالقسط:

    $$
    A = \frac{[[P|g]]}{[[r4(PA(i, n))|f4]]} = [[At|2]]
    $$

    بالقانون [[A|2]] دينار. الفرق [[abs(A-At)|2]] دينار سببه التقريب.

- id: c02-b-17
  kind: problem
  part: B
  vars: {A: 900, i: 0.09, n: 3, m: 6}
  random: {A: [300, 2000, 50], i: [0.05, 0.14, 0.01], n: [2, 4, 1], m: [5, 8, 1]}
  calc:
    - P1 = A*PA(i, n)
    - P2 = A*PA(i, m)
    - r = P2/P1
  text: |
    أيهما أكبر، القيمة الحالية لدفعة [[A|g]] دينار لمدة [[yrs(n)]] أم لمدة [[yrs(m)]]؟ هل تضاعف القيمة بمضاعفة عدد السنوات؟ الفائدة [[i|%]].
  solution: |
    $$
    P_1 = [[A|g]]\,(P/A,\ [[i|%]],\ [[n|n]]) = [[P1|2]]
    $$

    $$
    P_2 = [[A|g]]\,(P/A,\ [[i|%]],\ [[m|n]]) = [[P2|2]]
    $$

    النسبة بينهما [[r|2]]، أقل من نسبة السنوات، لأن الدفعات المضافة أبعد في الزمن.

- id: c02-b-18
  kind: problem
  part: B
  vars: {P: 40000, A1: 11000, n: 5, r0: 0}
  random: {P: [10000, 60000, 1000], r0: [0.04, 0.18, 0.01], n: [3, 8, 1]}
  calc:
    - A1 = pick(r0 > 0, floor(P*AP(r0, n)/50)*50, A1)
    - RATEX = RATE(n, A1, P)
  text: |
    بنك يقرض [[P|g]] دينار على [[yrs(n)]] بقسط [[A1|g]] دينار سنويا. اكتب صيغة Excel وسطر Python يحسبان نسبة الفائدة التي يأخذها البنك.
  solution: |
    ```excel
    =RATE([[n|n]], -[[A1|r]], [[P|r]])
    ```

    ```python
    import numpy_financial as npf
    print(npf.rate([[n|n]], -[[A1|r]], [[P|r]], 0))
    ```

    الجواب في الحالتين [[RATEX|%2]].

- id: c02-b-19
  kind: problem
  part: B
  vars: {A: 7000, i: 0.10, n: 10, C: 40000}
  random: {A: [2000, 15000, 500], i: [0.05, 0.15, 0.01], n: [5, 15, 1], C: [10000, 90000, 1000]}
  calc:
    - P = A*PA(i, n)
    - Ae = C*AP(i, n)
    - dec = pick(A >= Ae, 'مقبول', 'مرفوض')
  text: |
    مشروع يكلف [[C|g]] دينار ويعطي [[A|g]] دينار سنويا لمدة [[yrs(n)]]. قارن الإيراد السنوي بالتكلفة السنوية المكافئة للاستثمار بنسبة [[i|%]]. هل المشروع مقبول؟
  solution: |
    التكلفة السنوية المكافئة للاستثمار:

    $$
    [[C|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[Ae|2]]
    $$

    الإيراد السنوي [[A|g]] دينار، فالمشروع [[dec]]. نفس القرار بالقيمة الحالية: [[P-C|2]] دينار.

- id: c02-b-20
  kind: problem
  part: B
  vars: {P: 18000, i: 0.12, n: 3}
  random: {P: [5000, 40000, 1000], i: [0.06, 0.18, 0.01], n: [2, 6, 1]}
  calc:
    - A = P*AP(i, n)
    - F = P*FP(i, n)
    - Fa = A*FA(i, n)
  text: |
    قرض [[P|g]] دينار بفائدة [[i|%]]. قارن طريقتين للسداد، أقساطا متساوية لمدة [[yrs(n)]] أو دفعة واحدة في نهاية المدة. بين أن الطريقتين متكافئتان.
  solution: |
    القسط المتساوي:

    $$
    A = [[P|g]]\,(A/P,\ [[i|%]],\ [[n|n]]) = [[A|2]]
    $$

    الدفعة الواحدة:

    $$
    F = [[P|g]]\,(F/P,\ [[i|%]],\ [[n|n]]) = [[F|2]]
    $$

    القيمة المستقبلية للأقساط في السنة [[n|n]]:

    $$
    [[A|2]]\,(F/A,\ [[i|%]],\ [[n|n]]) = [[Fa|2]]
    $$

    الرقمان متساويان، فالطريقتان متكافئتان بنسبة [[i|%]].
