<script>
/* Load the random-numbers scripts with a path that works on every page and on GitHub Pages. */
(function () {
  var m = document.querySelector('meta[name="quarto:offset"]');
  var base = (m ? m.getAttribute('content') : './') + 'assets/';
  var files = ['katex/katex.min.js', 'marked.umd.js', 'ee-engine.js', 'ee-random.js'];
  (function next(k) {
    if (k >= files.length) { document.dispatchEvent(new Event('ee-ready')); return; }
    var s = document.createElement('script');
    s.src = base + files[k];
    s.onload = function () { next(k + 1); };
    document.body.appendChild(s);
  })(0);
})();
</script>
