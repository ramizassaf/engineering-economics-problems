  ch02: {park: [3], blank: [2, 3], sullivan: [4]}
  ch03: {park: [4, 5, 6], blank: [4, 5, 6, 13], sullivan: [4, 5, 6]}
  ch04: {park: [7], blank: [7, 8, 9], sullivan: [5, 6, 10]}
  ch05: {park: [9], blank: [16, 17], sullivan: [7]}
