project:
  type: book
  output-dir: _book
  pre-render:
    - python3 tools/lint_rtl.py
    - python3 tools/glossary.py
    - python3 tools/build.py
    - python3 tools/tables.py
  resources:
    - assets/**

book:
  title: "مسائل في الاقتصاد الهندسي"
  subtitle: "أمثلة محلولة ومسائل بحلول كاملة، بالمعادلة وExcel وPython"
  author: "رامز عساف"
  date: last-modified
  downloads: [pdf]
  chapters:
    - index.qmd
    - chapters/ch01.qmd
    - chapters/ch02.qmd
    - chapters/ch03.qmd
    - chapters/ch04.qmd
    - chapters/ch05.qmd
    - chapters/ch06.qmd
    - chapters/ch07.qmd
    - chapters/ch08.qmd
    - chapters/ch09.qmd
    - chapters/ch10.qmd
    - chapters/ch11.qmd
  appendices:
    - appendices/tables.qmd
    - appendices/derivations.qmd
    - appendices/capital-budgeting.qmd
    - appendices/cost-estimation.qmd
    - appendices/accounting.qmd
    - appendices/excel-functions.qmd
    - appendices/tax-countries.qmd
    - appendices/glossary.qmd
    - appendices/references.qmd
    - appendices/solutions-ch01.qmd
    - appendices/solutions-ch02.qmd
    - appendices/solutions-ch03.qmd
    - appendices/solutions-ch04.qmd
    - appendices/solutions-ch05.qmd
    - appendices/solutions-ch06.qmd
    - appendices/solutions-ch07.qmd
    - appendices/solutions-ch08.qmd
    - appendices/solutions-ch09.qmd
    - appendices/solutions-ch10.qmd
    - appendices/solutions-ch11.qmd

lang: ar
dir: rtl
toc-title: "المحتويات"
language:
  toc-title-document: "المحتويات"
  section-title-appendices: "الملاحق"
  search-text-placeholder: "بحث"
  crossref-ch-prefix: "الفصل"
  crossref-apx-prefix: "الملحق"
  crossref-sec-prefix: "القسم"

execute:
  echo: true
  freeze: auto

format:
  html:
    theme: cosmo
    html-math-method: mathml
    css: styles.css
    default-image-extension: svg
    number-depth: 2
    include-after-body: tex/load-scripts.html
    filters: [tex/minus-ltr.lua]
  pdf:
    documentclass: scrbook
    classoption: [oneside]
    papersize: a4
    geometry: [margin=2.2cm]
    pdf-engine: lualatex
    babeloptions: ["provide=*", "layout=tabular.lists"]
    mainfont: "Amiri"
    mainfontoptions: ["Script=Arabic", "Renderer=HarfBuzz"]
    sansfont: "Noto Naskh Arabic"
    sansfontoptions: ["Script=Arabic", "Renderer=HarfBuzz"]
    monofont: "DejaVu Sans Mono"
    default-image-extension: pdf
    number-depth: 2
    include-in-header: tex/preamble.tex
    filters: [tex/percent-ltr.lua, tex/en-ltr.lua]
